故意杀人罪与故意伤害罪并罚","爆炸罪定罪处罚","故意杀人罪与故意伤害罪、爆炸罪并罚"],"a":"A","e":"在本案中,甲只实施了一个犯罪行为——\"投掷自制炸药\",导致丙死亡和丁、戊受重伤两个罪名,\n构成想象竞合,按照从一重罪处断的原则,应认定为故意杀人罪。甲的行为构成爆炸罪,因为甲的行为没有危害公\n共安全。","k":"分则·危害公共安全罪"},{"id":"2012-45","y":2012,"t":"多","s":"下列选项中,应以投放危险物质罪定罪处罚 的有( )。","o":["甲在其竞争对手销售的面粉中掺入毒鼠强","乙为吸引顾客,在火锅底料中掺入罄粟壳","丙工厂违反规定,向河流中排放有毒废物,造 成下游大片农作物绝收","丁意图报复本单位领导,在单位的公用饮水 机中投放无色无味的剧毒农药"],"a":"AD","e":"根据《刑法》第114条的规定,放火、决\n水爆炸以及投放毒害性、放射性、传染病病原体等物\n质或者以其他危险方法危害公共安全,尚未造成严重\n后果的,处3 年以上10年以下有期徒刑。由此可知,\n投放危险物质应当以足以危害公共安全可能造成严\n重后果为前提,而B项在火锅底料中投放罄粟壳不可\n能造成致人死伤的严重后果。C项中丙向河流排放\n有毒废物,造成农作物绝收,构成污染环境罪,而不是\n投放危险物质罪。污染环境罪,是指违反国家规定,\n排放、倾倒或者处置有放射性的废物、含传染病病原\n体的废物、有毒物质或者其他有害物质,严重污染环\n境的行为。故AD正确。","k":"分则·危害公共安全罪"},{"id":"2012-7","y":2012,"t":"单","s":"甲在乡村公路上高速驾驶拖拉机,因视线不好 将拴在路边的耕牛撞死。对甲的行为( )。","o":["不应认定为犯罪","以危险驾驶罪定罪处罚","可以免予刑事处罚","以交通肇事罪定罪处罚"],"a":"A","e":"根据《刑法》第133条的相关规定,违\n反交通运输管理法规,因而发生重大事故,致人重伤、\n死亡或者使公私财产遭受重大损失的,是交通肇事\n\n罪。第133条之一规定了危险驾驶罪,在道路上驾驶\n机动车追逐竞驶,情节恶劣的,或者在道路上醉酒驾\n驶机动车的,从事校车业务或者旅客运输,严重超过\n额定乘员载客的,或者严重超过规定时速行驶的,或\n者危险化学品安全管理规定运输危险化学品,危及公\n共安全的,成立危险驾驶罪。根据该条可知,本题中\n甲的行为既没有造成严重后果,也不符合危险驾驶的\n构成。而且甲撞死耕牛这一损害他人财产的行为同\n样也不能构成故意毁坏财产罪,因为并非由千其故意\n造成。所以本题中行为人的行为不构成犯罪。故选\nA。考试中需注意某些看似犯罪的行为,是否具有犯\n罪的故意,是否达到构成犯罪的量刑标准或满足意外\n事件、不可抗力的条件,不可一概而论。","k":"分则·危害公共安全罪"},{"id":"2013-9","y":2013,"t":"单","s":"甲驾驶货车途经某村庄时,刮倒了路边的赵某。 甲从后视镜中看见赵某被拖挂在车后,但为逃避责任 继续行驶,致赵某被拖死。甲的行为构成()。","o":["交通肇事罪","交通肇事罪和故意杀人罪","故意杀人罪","以危险方法危害公共安全罪"],"a":"C","e":"本题考查的是考生对\n\" 交通肇事罪的\n罪数问题\n\"的理解与掌握情况。由于甲刮倒了路边的\n赵某,但并没有造成人重伤或者死亡,尚不构成交通\n肇事罪。但是看到赵某被挂在车后依然不顾赵某的\n生命安全继续行驶,放任赵某死亡的结果发生,构成\n了间接故意的故意杀人罪,应当以故意杀人罪定罪\n处罚。","k":"分则·危害公共安全罪"},{"id":"2014-20","y":2014,"t":"单","s":"下列选项中,属于渎职罪的是()。","o":["贪污罪","强令违章冒险作业罪","医疗事故罪","执行判决、裁定滥用职权罪"],"a":"D","e":"本题考查的是犯罪的分类,我国刑法分\n则采取大类制方式,将犯罪划分为十大类。其中,贪\n污罪属千贪污贿赂罪,强令违章冒险作业罪属于危害\n公共安全罪,医疗事故罪属于妨害社会管理秩序罪。\n只有D选项的执行判决、裁定滥用职权罪,侵害了法\n院正常的执行活动,属于渎职罪。","k":"分则·危害公共安全罪"},{"id":"2014-44","y":2014,"t":"多","s":"甲在长途汽车站窃得他人挎包一个,事后发 现包内有现金2000元、海洛因200克、手枪一把,遂 将海洛因和手枪藏在家中。甲的行为构成()。","o":["盗窃罪","盗窃枪支罪","非法持有枪支罪","非法持有毒品罪"],"a":"ACD","e":"由于甲以非法占有为目的,秘密窃取了\n他人的持包,内有数额较大的现金,因此已经构成了\n盗窃罪。由千甲在偷窃时并不知道包内装有枪支与\n毒品,而盗窃枪支罪要求明知是枪支而进行盗窃,故\n而不构成盗窃枪支罪。但在盗窃之后甲将海洛因和\n手枪藏于家中,该行为便构成了非法持有毒品罪和非\n法持有枪支罪。","k":"分则·危害公共安全罪"},{"id":"2015-10","y":2015,"t":"单","s":"甲公司将3000公斤生产废料直接倒人河中, 该废料遇水反应生成毒气,毒气随风飘至附近数个村 庄,致上百村民呼吸系统受损,并造成直接经济损失 100多万元。甲公司的行为构成()。","o":["污染环境罪","重大责任事故罪","投放危险物质罪","以危险方法危害公共安全罪"],"a":"A","e":"所谓污染环境罪是指违反防治环境污\n染的法律规定,排放、倾倒或者处置有放射性的废物、\n含传染病病原体的废物、有毒物质或者其他有害物\n质,严重污染环境的行为。甲公司明知将生产废料直\n接倒入河中会因此产生毒气,污染环境,而放任该结\n果的发生,显然属于违反国家规定,排放和倾倒有毒\n物质行为。该行为产生的毒气造成上百村民呼吸系\n统受损,并造成直接经济损失100多万元。显然,甲\n公司的行为严重污染了环境,构成污染环境罪,A选\n项正确。重大责任事故罪,是在生产、作业中违反有\n关安全管理的规定,因而发生重大伤亡事故或者造成\n其他严重后果。甲公司并不是在生产中违反安全管\n理的规定,造成严重后果,而是违反防止环境污染的\n规定,向河中倾倒生产废料,严重污染环境,B选项错\n误。投放危险物质罪的行为是\n\"投放\n\",甲公司不是投\n放,而是倾倒、排放,所以不成立投放危险物质罪,C\n选项错误。甲公司的行为严重污染环境,而不是危害\n公共安全,不成立以危险方法危害公共安全罪,D选\n项错误。\n[特别说明)\n关千A选项的\n\"污染环境罪\n\" ,《刑\n法修正案(十一)》提高了法定刑,考生需要注意此罪\n的新规定。《刑法修正案(十一)》将刑法第338条第\n1款修改为:\"违反国家规定,排放、倾倒或者处置有\n放射性的废物、含传染病病原体的废物、有毒物质或\n者其他有害物质,严重污染环境的,处三年以下有期\n徒刑或者拘役,并处或者单处罚金;情节严重的,处三\n年以上七年以下有期徒刑,并处罚金;有下列情形之\n一的,处七年以上有期徒刑,并处罚金:(一)在饮用\n水水源保护区、自然保护地核心保护区等依法确定的\n重点保护区域排放倾倒、处置有放射性的废物、含传\n染病病原体的废物、有毒物质,情节特别严重的;\n(二)向国家确定的重要江河、湖泊水域排放、倾倒、\n处置有放射性的废物、含传染病病原体的废物、有毒\n物质,情节特别严重的;(三)致使大量永久基本农田\n基本功能丧失或者遭受永久性破坏的;(四)致使多\n人重伤、严重疾病,或者致人严重残疾、死亡的。\n\" 对千\n这四种情形考生要加强记忆。","k":"分则·危害公共安全罪"},{"id":"2015-14","y":2015,"t":"单","s":"下列犯罪中,属于结果犯的是()。","o":["放火罪","故意毁坏财物罪","私放在押人员罪","参加黑社会性质组织罪"],"a":"B","e":"本题考查的是对犯罪既遂形态和故意\n毁坏财物罪构成要件的理解。结果犯是指行为必须\n己造成法定的实害后果,才是该罪的既遂。危险犯的\n特征是,发生侵害法益的现实危险是既遂的要件,只\n要行为足以造成某种严重后果发生的危险,就是该罪\n的既遂。行为犯的特征是只要该罪的实行行为实施\n完毕即成立犯罪既遂,不要求有危害结果的实际发生\n或发生的危险。举动犯是指行为人一着手实施犯罪\n行为即成立犯罪既遂,举动犯不存在犯罪未遂。所谓\n故意毁坏财物罪是指故意毁灭或者损坏公私财物,数\n额较大或者情节严重的行为。成立故意毁坏财物罪\n要求有财物的毁灭或者损坏的结果,因此,B选项的\n故意毁坏财物罪属于结果犯。A选项是危险犯,C选\n项是行为犯,D选项是举动犯。","k":"分则·危害公共安全罪"},{"id":"2015-16","y":2015,"t":"单","s":"甲遇红灯停车时,与路人孙某发生口角,甲下 车将孙某打倒在地,驾车离去。孙某坐在马路上,不 听他人劝导,拒绝离开。十分钟后,乙超速驾车经过 此处,来不及刹车,将孙某撞死。下列选项中,正确的 是()。","o":["甲构成故意伤害罪(致人死亡)","甲构成寻滋事罪","甲和乙共同构成交通肇事罪","乙构成交通肇事罪"],"a":"D","e":"本题考查的是刑法中的因果关系和交\n通肇事罪的构成要件。刑法中的因果关系是指危害\n行为与危害结果之间一种客观的引起与被引起的联\n\n系。刑法中的因果关系的特点:客观性、相对性、必然\n性复杂性。在本案中,甲将孙某打倒在地的行为与\n之后发生的交通肇事行为不存在因果关系上的必然\n性,因此甲不应对孙某的死亡负责,A选项错误。所\n谓交通肇事罪是指违反交通运输法规,在公共交通管\n理范围内发生重大事故,致人重伤、死亡或者使公私\n财产遭受重大损失的行为。乙超速驾车,违反了交通\n运输法规,将孙某撞死,构成了交通肇事罪,D选项正\n确。构成寻衅滋事罪的行为方式有:(1)随意殴打他\n人,情节恶劣的;(2)追逐、拦截、辱骂、恐吓他人,情\n节恶劣的;(3)强拿硬要或者任意损毁、占用公私财\n物,情节严重的;(4)在公共场所起哄闹事,造成公共\n场所秩序严重混乱的。甲并不是随意殴打他人,情节\n恶劣,不构成寻衅滋事罪,B选项错误。","k":"分则·危害公共安全罪"},{"id":"2015-8","y":2015,"t":"单","s":"甲在某机场到达大厅出口外引爆自制爆炸装 置,造成一人轻伤。甲的行为应认定为()。","o":["爆炸罪","寻畔滋事罪","故意伤害罪","以危险方法危害公共安全罪"],"a":"A","e":"l\n爆炸罪是指故意针对不特定的多数人\n或者重大公私财产实施爆炸行为,危害公共安全的行\n为。它属于危险犯,如果爆炸行为已经使公共安全处\n千危险状态或者已经造成危害公共安全的实际损害\n后果,则成立爆炸罪既遂。在本案中,甲的行为虽然\n仅造成了一人轻伤,但已经危害了大多数人的生命健\n康、财产安全,成立爆炸罪既遂,不成立故意伤害罪,A\n正确,C错误。寻衅滋事罪,是指肆意挑衅,随意殴\n打、骚扰他人或任意损毁、占用公私财物,或者在公共\n场所起哄闹事,严重破坏社会秩序的行为。甲是引爆\n爆炸装置,并非寻衅滋事,B错误。以危险方法危害\n公共安全罪是指使用与放火、爆炸、决水、投放危险物\n质方法的危险性相当的其他方法,危害公共安全的行\n为。本题采用的是爆炸的方法,不是其他方法,不成\n立以危险方法危害公共安全罪,D错误。","k":"分则·危害公共安全罪"},{"id":"2016-15","y":2016,"t":"单","s":"某组织采用暴力、威胁手段长期控制某地长 途汽车客运业务。甲参加该组织后,按照组织的指 令,将一名“不听话”的司机打成重伤。甲的行为应认 定为()。","o":["故意伤害罪","参加恐怖组织罪","参加黑社会性质组织罪","参加黑社会性质组织罪和故意伤害罪"],"a":"D","e":"根据刑法294条的规定,参加黑社会性\n质组织,又有其他犯罪行为的,数罪并罚。甲参加黑\n社会性质组织,构成参加黑社会性质组织罪,又故意\n伤害他人,构成故意伤害罪,二罪并罚,D选项正确,\nA、C选项错误。甲参加的是黑社会性质组织,没有参\n加恐怖组织,不成立参加恐怖组织罪,B 选项错误。","k":"分则·危害公共安全罪"},{"id":"2018-44","y":2018,"t":"多","s":"下列聚众斗殴的情形中,属于“持械\"的有","o":["牵引恶犬参与斗殴","携带非法持有的枪支参与斗殴","在斗殴现场抢夺对方棍棒并使用 D?斗殴时使用事先藏匿在斗殴地点的砍刀 4$.生产、销售伪劣产品罪的客观方面表现为,在 生产销售的产品中( )。 A.以次充好 B. 以假充真 C. 掺杂","掺假 46. 甲、乙、丙设立一合伙企业。 2014 年8 月,该 合伙企业欠星月公司贷款36 万元,同年10 月,丙经 甲、乙同意退伙,依约承担了 15 万元的合伙债务。 2015 年2 月,丁经甲、乙同意人伙,并约定:丁对入伙 前该合伙企业所欠债务不承担责任。对该合伙企业 欠星月公司的债务应承担无限连带责任的有( )。 A. 甲 B. 乙 C. 丙 D. 丁 47.下列选项中,无需登记即可发生物权变动的 有()。 A. 甲公司将其股权出质给银行 B. 乙公司将其轮船的所有权转让给高某 C.丙公司通过拍卖取得建设用地使用权 D. 丁衣户将土地承包经营权转让给钱某 48. 志愿者甲经常照顾孤寡老人乙。 2015 年3 月 20 日,乙病故,遗嘱执行人丙告诉甲,乙遗赠给甲3 万 元和一套古籍。 5 月 15 日,甲明确表示拒绝接受古籍。 5 月 18 日,甲联系丙,表示撤销此前拒绝接受古籍的行 为。 5 月28 日,甲请求丙执行遗嘱,丙( )。 A.应将3 万元交付给甲 B. 应将古籍交付给甲"],"a":"BD","e":"聚众斗殴中的\n\"械\n\" 是在斗殴中使用会\n严重威胁人身安全的物品,只要使用会对人身安全造\n成严重威胁的物品,就是聚众斗殴之\n\" 械\n\",不限于管\n制刀具、枪支等。但\n\" 械\n\" 不包括动物,A项错误。","k":"分则·危害公共安全罪"},{"id":"2020-10","y":2020,"t":"单","s":"甲被公司处分后心怀不满,毁坏公司正在铺 设的在建地铁专用电缆,造成重大财产损失。甲的行 为构成()。","o":["破坏交通设施罪","破坏生产经营罪","破坏电力设备罪","以危险方法危害公共安全罪"],"a":"B","e":"破坏生产经营罪是指以泄愤报复或者\n其他个人目的,破坏机器设备、残害耕畜或者以其他\n方法破坏生产经营的行为,甲被公司处分后心怀不\n满,毁坏公司正在铺设的在建地铁专用电缆,造成重\n大财产损失,构成破坏生产经营罪,B选项正确。破\n坏交通设施罪是指故意破坏轨道、桥梁、隧道、公路、\n机场、航道、灯塔、标志或者进行其他破坏活动,足以\n使火车、汽车、电车、船只、航空器发生倾覆、毁坏危险\n或者造成严重后果的行为,地铁电缆不属于交通设\n施,A选项错误。破坏电力设备罪的行为对象是正在\n使用中的电力设备,本题中的电缆是正在铺设,而非\n正在使用,C选项错误。本题甲的行为未威胁到公共\n安全,不能构成以危险方法危害公共安全罪,D选项\n错误。","k":"分则·危害公共安全罪"},{"id":"2021-13","y":2021,"t":"单","s":"甲驾车闯红灯,当场撞死行人王某。甲的朋 友乙闻讯后让甲离开,并在交警调查时谎称是自已开 车肇事。乙的行为应认定为()","o":["窝藏罪","伪证罪","交通肇事罪","包庇罪"],"a":"D","e":"包庇罪是指明知是犯罪的人而作假证\n明包庇的行为。本题中,乙明知甲是犯罪的人(交通\n肇事罪),在交警调查时作假证明包庇甲,乙的行为成\n立包庇罪,D项正确。","k":"分则·危害公共安全罪"},{"id":"2021-4","y":2021,"t":"单","s":"甲喝醉后在家耍酒疯,随手将笔记本电脑从 15楼扔出窗外,砸中在小区散步的居民王某,致其重 伤。甲的行为应认定为(","o":["过失致人重伤罪","不构成犯罪","以危险方法危害公共安全罪","故意伤害罪"],"a":"C","e":"《刑法》第291条之二规定:\n\" 从建筑物\n或者其他高空抛掷物品,情节严重的,处一年以下有\n期徒刑、拘役或者管制,并处或者单处罚金。有前款\n行为,同时构成其他犯罪的,依照处罚较重的规定定\n罪处罚。\n\" 甲从建筑物中抛掷物品,且将王某砸成重\n伤,同时构成高空抛物罪和以危险方法危害公共安全\n罪,依照处罚较重的罪名即以危险方法危害公共安全\n罪定罪处罚,C项正确。","k":"分则·危害公共安全罪"},{"id":"2022-3","y":2022,"t":"单","s":"文某为卖废铁,深夜盗窃了公路机动车道上的电力检修井盖,致一辆正常行驶的小 汽车陷入检修井并毁坏。文某的行为应认定为","o":["破坏交通工具罪","破坏交通设施罪","破坏电力设备罪","以危险方法危害公共安全罪"],"a":"B","e":"破坏交通工具罪是指破坏火车、汽车、\n电车、船只、航空器,足以使火车、汽车、电车、船只、航\n空器发生倾覆、毁坏危险,尚未造成严重后果或者已\n2022年全国法律硕士(非法学)真题答案详解\n专业基础课\n经造成严重后果的行为。破坏交通设施罪是指破坏\n轨道、桥梁、隧道、公路、机场、航道、灯塔、标志或者进\n行其他破坏活动,足以使火车、汽车、电车、船只、航空\n器发生倾覆、毁坏危险的行为。破坏电力设备罪是指\n破坏电力设备,危害公共安全的行为。文某在深夜破\n坏公路机动车道上的电力检修井盖,导致一辆正常行\n驶的汽车陷人检修井并毁坏的严重后果。文某的行\n为对象属于交通设施而非交通工具或电力设备,因此\n构成破坏交通设施罪。B选项正确,AC选项错误。\n以危险方法危害公共安全罪是指使用与放火、爆炸、\n决水、投放危险物质方法的危险性相当的其他危险方\n法,危害公共安全的行为。文某的犯罪行为尚不属于\n与放火、爆炸、决水、投放危险物质方法的危险性相当\n的其他危险方法,不构成以危险方法危害公共安全\n罪。D选项错误。","k":"分则·危害公共安全罪"},{"id":"2024-19","y":2024,"t":"单","s":"如在救护车到达之前,肖某因呕吐物堵塞呼吸道,室息死亡,甲的行为应认定为 ()","o":["强奸罪","故意杀人罪","过失致人死亡罪","投放危险物质罪"],"a":"A","e":"","k":"分则·危害公共安全罪"},{"id":"2025-16","y":2025,"t":"单","s":"甲在办公室值班时违规使用电炉取暖,接续值班的乙见状没有制止,并继续使用该电 炉,半夜电炉自燃引发火灾。对此,下列选项正确的是( )","o":["甲、乙均构成犯罪","甲不构成犯罪,乙构成犯罪","甲、乙均不构成犯罪","甲构成犯罪,乙不构成犯罪"],"a":"A","e":"甲在办公室值班时违规使用电炉,埋下火灾隐患。乙作为接续值班人员,不仅未\n制止该危险行为,还继续使用电炉。甲乙两人均对火灾的发生负有过失责任。电炉自燃引发火\n灾,与两人的行为有直接因果关系,且造成严重后果,因此甲乙均构成失火罪,A 项正确,BCD\n项错误。本题选A。","k":"分则·危害公共安全罪"},{"id":"2026-9","y":2026,"t":"单","s":"甲将汽车低价卖给陈某,心有不甘。某日,甲通过手机软件发现该车辆正处于 高速行驶状态,于是远程发送强制熄火指令,致使陈某在高速公路上无法正常操 控车辆,险些造成连续事故。甲的行为应认定为","o":["故意伤害罪","危险驾驶罪","非法利用信息网络罪","以危险方法危害公共安全罪"],"a":"D","e":"高速公路远程强制熄火,危害不特定多数车辆、行人公共安全,符合以危\n险方法危害公共安全罪;\nA 无故意伤害结果;B 危险驾驶仅针对驾驶机动车自身超速、追逐竞驶等;C 不适\n用。","k":"分则·危害公共安全罪"}]},{"sub":"刑法","name":"罪数","w":1.1,"L":24,"qs":[{"id":"2005-10","y":2005,"t":"单","s":"甲伪造国家机关公文用于实施诈骗活动,分别构成伪造国家机关公文罪和诈骗罪,这种情形属于罪数论中的(  )","o":["牵连犯","想象竞合犯","继续犯","连续犯"],"a":"A","e":"首先排除选项B、C,二者都要求仅存在一个违法行为,而本案中存在两个相对独立的犯罪行为,\n即伪造国家机关公文罪和诈骗罪。连续犯,要求数个行为触犯同一罪名,而本题数行为触犯了不同罪名,因此排除\n选项D。甲实施的伪造国家机关公文罪和诈骗罪之间存在手段与目的的关系,因此属于牵连犯。","k":"罪数"},{"id":"2005-15","y":2005,"t":"单","s":"甲开办一间小汽修店,因修理一进口轿车缺零配件,便于晚间在一停车场将一同型号小轿车备用轮胎一个(价 值1200 元)和发动机(价值 50000 元)拆下盗走,甲的行为(   )","o":["构成盗窃罪和破坏交通工具罪,数罪并罚","构成盗窃罪和破坏交通工具罪,属想象竞合犯,从一重罪即破坏交通工具罪定罪处罚","只构成破坏交通工具罪","只构成盗窃罪"],"a":"D","e":"甲盗用备用轮胎和发动机的行为,构成盗窃罪,这是毋庸置疑的。该行为不构成破坏交通工具罪,\n因为甲盗窃发动机致使该车无法使用,当然也谈不上危害公共安全。据此,选项D 应选。","k":"罪数"},{"id":"2006-14","y":2006,"t":"单","s":"保险受益人甲故意杀害被保险人乙,造成乙死亡,骗取了 20 万元保险金。对甲应当(   )","o":["以故意杀人罪定罪处罚","以保险诈骗罪定罪处罚","以保险诈骗罪和故意杀人罪的牵连犯择一重罪处罚","以故意杀人罪和保险诈骗罪数罪并罚"],"a":"D","e":"见《刑法》第198 条,保险诈骗罪数罪并罚的规定。","k":"罪数"},{"id":"2007-9","y":2007,"t":"单","s":"下列情形中,应当数罪并罚的是 (   ) 。","o":["甲除走私 1000 克 冰毒外,还曾与他人共同运输 3000 克 海洛因","乙非法购买一支手枪,并长期私藏在家中","丙谋杀仇人张某后,发现张某携有现金 1 万多元,遂取走该现金","丁见李某带有大量现金,将李某毒杀,劫取其所带全部财物,并将李某尸体剁成碎块后掩埋"],"a":"C","e":"数罪并罚 \n- 8 -\n\n \n \n更多考研精品资料,关注淘宝店铺:光速考研工作室 \n] 走私、运输毒品罪是刑法分则中的一个罪名,多次走私、运输毒品,未经处理的, \n毒品数量累计计算,故对甲不实行数罪并罚。乙非法购买枪支,并长期私藏在家,构成吸收 \n \n犯,私藏枪支的行为被购买枪支的行为吸收,仅成立非法买卖枪支罪,不实行数罪并罚。谋 \n杀张某的行为构成故意杀人罪,后取走张某现金,构成盗窃罪,应当数罪并罚。丁为劫取李 \n某财物,采取将其毒死的手段,应当以抢劫罪定罪处罚,不实行数罪并罚。","k":"罪数"},{"id":"2011-14","y":2011,"t":"单","s":"检察员甲在承办一起组织、领导传销活动案件 的审查起诉工作时,接受一名本应被提起公诉的犯罪嫌 疑人的家属5万元贿赂后弄虚作假,致使检察机关对该 犯罪嫌疑人作出了不起诉决定。甲的行为()。","o":["只构成受贿罪","构成徇私枉法罪与受贿罪,应择一重罪定罪 处罚","构成滥用职权罪与受贿罪,应择一重罪定罪 处罚","构成受贿罪与私枉法罪,应实行数罪并罚"],"a":"B","e":"本题只需知道两个知识点,便可迎刃而\n解。第一,滥用职权罪和徇私枉法罪是普通罪和特别\n罪的关系。故应成立\n\" 特别的\n\"徇私枉法罪,而不成立\n\"普通的\n\"滥用职权罪。第二,在渎职罪一章中,有四\n种犯罪,若同时构成受贿罪的应当择一重罪处罚,它\n们包括:徇私枉法罪,民事、行政枉法裁判罪,执行判\n决裁定失职罪,执行判决、裁定滥用职权罪。甲构成\n徇私枉法罪和受贿罪,择一重罪定罪处罚。所以答案\n选B。","k":"罪数"},{"id":"2011-9","y":2011,"t":"单","s":"甲因犯盗窃罪被判处有期徒刑5年,在刑罚执 行3年后,又发现他在判决宣告前还犯有放火罪,应 判处有期徒刑7年。经数罪并罚决定执行10年有期 徒刑。对甲还需要继续执行的刑期是(·)。","o":["12年","10年","9年","7年"],"a":"D","e":"数罪并罚的基本适用规则有三条:\n(l)若判决宣告的主刑中存在死刑或者无期徒刑,则\n适用吸收原则,仅执行一个死刑或无期徒刑。(2)数\n罪中有判处有期徒刑和拘役的,执行有期徒刑。数罪\n中有判处有期徒刑和管制,或者拘役和管制的,有期\n徒刑、拘役执行完毕后,管制仍须执行。(3) 数罪中\n有判处附加刑的,则适用并科原则,其中附加刑种类\n相同的,合并执行,种类不同的,分别执行。\n适用数罪并罚规则有三种情况:(1)判决宣告以\n前一人犯数罪的,此为典型情况,适用上述规则即可。\n(2)刑罚执行期间发现漏罪的。(3)刑罚执行期间\n又犯新罪的。本题的情形属于第二种,对此应先将两\n个罪判处的刑罚根据上述规则确定实际执行的刑罚,\n也就是题干中所说的\n\" 经数罪并罚决定执行10年有\n期徒刑\n\"。然后再减去已经执行的刑期,即数罪并罚\n执行的10年刑期减去已经执行的3年刑期,千是甲\n还需要继续执行的刑期为7年,故答案为D。这种计\n算方法可以简单归纳为\n\" 先并后减\n\"。而至于刑罚执\n行期间又犯新罪的情况,则运用\n\" 先减后并\n\"的规则来\n计算继续执行的刑期。至于是适用\n\" 先并后减\n\"还是\n\" 先减后并\n\",主要在于\n\" 先并后减\n\"之后刑罚相对轻,\n适用于非犯罪人的过错一一如漏罪;\n\" 先减后并\n\"之后\n刑罚相对更重,适用千犯罪人的新犯。","k":"罪数"},{"id":"2012-16","y":2012,"t":"单","s":"下列情形中,应当数罪并罚的是( )。","o":["甲为迫使不满18 周岁的未成年女子卖淫而对 其实施强奸","乙非法拘禁债务人张某10天,其间多次毒打 张某,致张某伤残","丙无证驾车,在被交警查处时使用暴力抗拒执 法,失手将交警打死","丁开地下卷烟厂,制售劣质卷烟数量巨大,在 县联合执法队前来查处时,组织数十村民围 攻执法人员,迫使执法队暂时撤离"],"a":"D","e":"《刑法修正案(九)》对强迫卖淫罪进行\n了修改,强迫卖淫并有杀害、伤害、强奸、绑架等犯罪\n行为的,依照数罪并罚的规定处罚,A选项正确。非\n法拘禁中的暴力行为造成他人伤残或者死亡的,以故\n意伤害罪或者故意杀人罪论处;妨碍公务的行为如果\n造成他人伤残死亡应当以故意伤害罪、故意杀人罪论\n处;开设烟厂制售劣质卷烟的行为构成了制造销售伪\n劣产品罪,而围攻执法人员则构成了妨碍公务罪。故\n需要数罪并罚。故本题答案为AD。","k":"罪数"},{"id":"2013-11","y":2013,"t":"单","s":"甲伪造人民币100万元,后运输至外地出售, 获赃款10万元。对甲的行为()。","o":["应以伪造货币罪定罪处罚","应以出售、运输假币罪定罪处罚","应以伪造货币罪和出售、运输假币罪数罪并罚","应以伪造货币罪和出售、运输假币罪的想象 竞合择一重罪定罪处罚"],"a":"A","e":"本题考查的是伪造货币罪的数罪形态。\n行为人若伪造货币又运输、出售、持有、使用的,不构\n成数罪,只以一个伪造货币罪定罪处罚即可。另外,\n如果行为人明知是伪造的货币而持有、使用,而又没\n有伪造、运输、出售行为的,以持有、使用假币罪定罪\n处罚。","k":"罪数"},{"id":"2013-14","y":2013,"t":"单","s":"甲为自己的厂房投保后,指使他人放火烧毁 厂房,结果殃及附近民房,之后骗取了保险金。对甲 的行为()。","o":["应以放火罪论处","应以放火罪和保险诈骗罪数罪并罚","应以保险诈骗罪论处","应按牵连犯理论以放火罪从重处罚"],"a":"B","e":"本题考查的是特殊的牵连犯处罚形态。\n甲为了骗取保金而故意纵火,并造成了附近民居被烧\n毁的严重后果,其行为已经同时触犯了放火罪和保险\n诈骗罪。其手段行为和结果行为相互牵连,构成牵连\n犯,本应该择一重罪处罚,但是刑法分则明确规定,行\n为人为了达到骗取保险金的目的,故意以放火、杀人、\n伤害、传播传染病、虐待、遗弃等方式造成财产损失、\n被保险人死亡、伤残、疾病等结果,骗取保险金的,应\n当以保险诈骗罪和行为构成的其他犯罪数罪并罚。\n因此答案应该选B。\n注意牵连犯的处理原则是一般按择一重罪处罚,\n刑法有特别规定的除外。这种情况即此类。以下总\n结有关并罚的知识点:\n包容犯:是指行为人在实施某一犯罪行为过程\n中,又实施了另一不同性质的罪行,但后者被前者包\n容,刑法明文规定不并罚,仅将后一个犯罪行为作为\n前一个犯罪加重处罚情节的情况,其典型如《刑法》第\n240条。包括:\n(1)绑架并杀害人质(定绑架罪,第239条)。\n(2) 拐卖妇女又奸淫被拐卖妇女的(定拐卖妇女\n罪,第240条)。\n(3) 拐卖妇女又强迫、引诱、容留被拐卖妇女卖\n淫的(定拐卖妇女罪,第240条)。\n(4)组织他人偷越国边境,又非法拘禁被组织者\n的、以暴力、威胁方法抗拒检查的(定组织他人偷越国\n(边)境罪,第318条)。\n(5)运送他人偷越国边境,使用暴力、威胁方法\n抗拒检查的(定运送他人偷越国(边)境罪,第\n321条)。\n(6) 走私、制造、贩卖、运输毒品时,武装掩护的,\n或者以暴力抗拒检查、拘留、逮捕,情节严重的(定走\n私、制造、贩卖、运输毒品罪,第347条)。\n以法定的一罪处罚(法律已经规定以哪个罪处\n罚),即法律明文规定对某些牵连犯罪以某罪处理,其\n典型如《刑法》第196条第3 款。包括:\n(1)行为人购买假币后使用,构成犯罪的,以购\n买假币罪定罪,从重处罚(《最高人民法院关千审理伪\n造货币等案件具体应用法律若干问题的解释》第\n2条)。\n(2)伪造货币又出售、运输伪造货币的,定伪造\n货币罪,从重处罚(第171条第3款)。\n\n(3) 盗窃信用卡并冒用他人信用卡的,定盗窃罪\n(第196条第3款)。\n(4)邮政工作人员私拆、隐匿、毁弃邮件从中窃\n取财物的,定盗窃罪,从重处罚(第253条第2款)。\n法定择一重罪处罚:法律仅规定择一重罪处罚:\n其典型如《刑法》第399条第4 款、第329条第1款。\n包括:\n(1) 抢夺、窃取国有档案,又构成其他犯罪的,依\n照处罚较重的规定定罪处罚(第329条第1款)。\n(2)擅自出卖、转让国有档案,又构成其他犯罪\n的,依照处罚较重的规定定罪处罚(第329条第2款)。\n(3) 因受贿而徇私枉法或枉法裁判的,犯受贿罪\n和徇私枉法罪或民事、行政枉法裁判罪,依照处罚较\n重的规定定罪处罚(第399条第3款)。\n(4)实施生产销售伪劣商品犯罪,同时构成侵\n犯知识产权、非法经营等其他犯罪的,","k":"罪数"},{"id":"2013-17","y":2013,"t":"单","s":"甲收买被拐卖的张某后,为让其心甘情愿地 做自己的妻子,强行与张某发生了性关系。对甲的行 为()。","o":["应以强奸罪定罪处罚","应以收买被拐卖的妇女罪定罪处罚","应以收买被拐卖的妇女罪与强奸罪数罪并罚","应以收买被拐卖的妇女罪与强奸罪择一重罪 定罪处罚"],"a":"C","e":"本题考查的是收买被拐卖的妇女、儿童\n而同时又触犯其他犯罪的罪数问题。刑法分则对此\n做了明确规定:收买被拐卖的妇女,强行与其发生性\n关系的,依照强奸罪与收买被拐卖的妇女儿童罪数罪\n并罚;收买被拐卖的妇女、儿童,非法剥夺、限制其人\n身自由或者有伤害、侮辱行为的,分别依照有关非法\n拘禁罪、故意伤害罪、侮辱罪等规定处罚,并与收买被\n拐卖的妇女、儿童罪数罪并罚。本题中,张某在收买\n了被拐卖妇女后强行与其发生性关系,应以收买被拐\n卖的妇女罪与强奸罪数罪并罚。","k":"罪数"},{"id":"2013-7","y":2013,"t":"单","s":"按照我国刑法理论,绑架罪属于()。","o":["继续犯","结合犯","状态犯 2013年全国法律硕士(非法学)联考真题","连续犯"],"a":"A","e":"所谓继续犯,又称持续犯,是指作用于\n一个对象的一个犯罪行为从着手实行到实行终了,犯\n罪行为与不法状态在一定时间内同时处于继续状态\n的犯罪。继续犯有四个特征:(1)一个犯罪故意。\n(2)侵犯同一客体。(3)犯罪行为能够对客体产生\n持续、不间断的伤害。(4)犯罪完成、造成不法状态\n后,行为仍能继续影响不法状态,使得客体遭受持续\n侵害。而绑架行为对客体产生了持续、不间断的伤害\n(限制他人自由),在绑架完成后绑架行为仍持续影响\n不法状态,所以绑架罪是一种继续犯。","k":"罪数"},{"id":"2014-10","y":2014,"t":"单","s":"甲盗割高压电线,既构成破坏电力设备罪,又 构成盗窃罪。这种犯罪形态属于( )。","o":["想象竞合犯","继续犯","连续犯","吸收犯"],"a":"A","e":"本题考查的是对想象竞合犯的理解。\n所谓想象竞合犯是指行为人实施一个犯罪行为同时\n触犯数个罪名的情况。其具有两个主要特征:(1)行\n为人只实施了一个犯罪行为。(2)行为人同时触犯\n了数个罪名。本案中甲盗割高压电线,虽然只有一个\n行为,却同时触犯了盗窃罪和破坏电力设备罪,属于\n一行为触犯数罪,是想象竞合犯。行为人在实施一个\n盗窃行为的同时触犯了其他罪名是想象竞合犯的常\n见类型。","k":"罪数"},{"id":"2016-16","y":2016,"t":"单","s":"下列选项中,应以一罪定罪处罚的是(","o":["运送他人偷越国境,并杀害检查人员的","生产伪劣产品,并以威胁方法抗拒查处的","收买被拐卖妇女,并非法限制其人身自由的","走私毒品,并以暴力方法抗拒检查,情节严 重的"],"a":"D","e":"根据刑法第321条规定,运送他人偷越\n国(边)境,对运送人有杀害、伤害、强奸、拐卖等犯罪\n行为,或者对检查人员有杀害、伤害等犯罪行为的,依\n照数罪并罚的规定处罚,A 选项错误。\n《最高人民法院、最高人民检察院关于办理生\n产销售伪劣商品刑事案件具体应用法律若干问题\n的解释》第11条规定:实施刑法第140条至第148\n条规定的犯罪,又以暴力、威胁方法抗拒查处,构成\n其他犯罪的,依照数罪并罚的规定处罚,B 选项\n错误。\n根据刑法第241条的规定,收买被拐卖的妇女,\n并有强奸非法剥夺、限制其人身自由或者伤害、侮辱\n等犯罪行为的,依照数罪并罚的规定处罚,C 选项\n错误。\n根据刑法第347条的规定,以暴力抗拒检查、拘\n留、逮捕,情节严重,是走私、贩卖、运输、制造毒品罪\n的情节加重犯,以走私贩卖运输、制造毒品罪一罪\n论处,D选项正确。","k":"罪数"},{"id":"2016-20","y":2016,"t":"单","s":"甲在死刑缓期执行期间,因过失造成另一罪 犯重伤。二年期满后,对甲应()。","o":["减为无期徒刑","减为二十年有期徒刑","执行死刑","减为二十五年有期徒刑"],"a":"A","e":"根据刑法第50条第一款的规定,在死\n刑缓期执行期间,如果没有故意犯罪,二年期满以后,\n减为无期徒刑。如果确有重大立功表现,二年期满以\n后,减为二十五年有期徒刑;如果故意犯罪,情节恶劣\n的,报请最高人民法院核准后执行死刑;对千故意犯\n罪未执行死刑的,死刑缓期执行的期间重新计算,并\n报最高人民法院备案。\n甲在死刑缓期执行期间,因过失造成另一罪犯重\n伤,是过失犯罪,而不是故意犯罪,应减为无期徒刑。\n选A。死缓没有减为二十年有期徒刑的情况,B选项\n错误。重大立功的,减为二十五年有期徒刑,甲没有\n重大立功,不选D。在死刑缓刑期间,故意犯罪,情节\n恶劣的,执行死刑。甲是过失犯罪,不选C。","k":"罪数"},{"id":"2017-14","y":2017,"t":"单","s":"下列选项中,应以强奸罪一罪追究刑事责任 的是( )。","o":["甲利用业务关系,在女推销员半推半就的情 况下与之发生性行为","乙在拐卖过程中,违背被拐卖妇女的意志与之 发生性行为","丙宣传迷信,以“行为治疗法”蒙骗求医女性 与之发生性行为","丁将男性同事灌醉,趁其熟睡与之发生同性 性行为"],"a":"C","e":"强奸罪是指违背妇女意志,以暴力、胁\n迫或者其他手段,强行与其发生性交或者奸淫不满14\n周岁的幼女的行为。强奸罪的被害人只能是妇女或\n幼女,不能是男人,因此D项中丁不成立强奸罪。成\n立强奸罪必须违背妇女意志,A项中女推销员半推半\n就,甲与其发生关系并没有违背女推销员的意志,甲\n不成立强奸罪。根据《刑法》第240条的规定,奸淫被\n拐卖的妇女,是拐卖妇女罪升格法定刑处罚的行为,\n只以拐卖妇女罪-罪定罪处罚。乙在拐卖过程中奸\n淫被拐卖的妇女,只定拐卖妇女罪,不另外成立强奸\n罪,B项错误。C项中丙采用迷信欺骗的手段,以\n\"行\n为治疗法\n\"的名义违背妇女意志与其发生性行为,成\n立强奸罪,C项正确。","k":"罪数"},{"id":"2017-20","y":2017,"t":"单","s":"甲的行为应认定为( )。","o":["合同诈骗罪一罪","保险诈骗罪和故意杀人罪","故意杀人罪一罪","保险诈骗罪一罪"],"a":"B","e":"《刑法》第198 条规定,投保人、受益人\n故意造成被保险人死亡、伤残或者疾病,骗取保险金,\n同时构成其他犯罪的,依照数罪并罚的规定处罚。本\n题中甲是投保人、受益人,故意造成被保险人妻子死\n亡,成立故意杀人罪,然后以妻子意外死亡为由骗取\n保险金,成立保险诈骗罪,应当数罪并罚,B项正确。\n这是牵连犯处理原则的例外情况,考生一定要清晰地\n加以记忆。","k":"罪数"},{"id":"2018-10","y":2018,"t":"单","s":"下列关千走私罪的表述正确的是( )。","o":["走私的废物中混有普通货物的,构成走私废 物罪","基于走私目的向海关人员行贿数额巨大的,应 数罪并罚","走私普通货物偷逃关税数额特别巨大的,可以 判处死刑","具有走私故意但对走私具体对象不明确而走 私的,应认定无罪"],"a":"A","e":"走私的废物中混有普通货物的,以走私\n废物罪定罪,A 正确;《刑法修正案(八)》废除了走私\n普通货物罪的死刑,C项错误;具有走私故意但对走\n私具体对象不明确而走私,不影响走私犯罪构成,应\n当根据实际的犯罪对象定罪处罚,而不是无罪,D项\n错误;基千走私目的向海关人员行贿数额巨大的,构\n成行贿罪,B项错误。","k":"罪数"},{"id":"2019-14","y":2019,"t":"单","s":"下列选项中,不属于继续犯的是()。","o":["诈骗罪","遗弃罪","非法拘禁罪","非法持有毒品罪"],"a":"A","e":"继续犯是作用于同一对象的一个犯罪\n行为从着手实行到行为终了,犯罪行为与不法状态在\n一定时间内同时处于继续状态的犯罪。继续犯主要\n包括三类:(l)持有型犯罪,D 项属于此类。(2)不\n作为犯罪往往具有继续犯的特点,B项属于此类。\n(3)侵犯人身自由的犯罪,C项属于此类。因此BCD\n项均属于继续犯,A 项诈骗罪在实行后即结束,不存\n在一段时间内的继续状态,不是继续犯,本题选A。","k":"罪数"},{"id":"2019-5","y":2019,"t":"单","s":"下列选项中,与盗窃罪存在法条竞合关系的是 )。","o":["侵占罪","贪污罪","诈骗罪","抢夺罪"],"a":"B","e":"法条竞合,指刑法中有一些条文之间在\n内容上存在重复或交叉的情况。贪污罪是指国家工\n作人员利用职务上的便利,侵吞、窃取、骗取或者以其\n他手段非法占有公共财物的行为。本题中,贪污罪的\n行为中包括\n\"窃取\n\" 行为,该窃取行为符合盗窃罪的犯\n\n罪构成,因此,贪污罪与盗窃罪存在法条竟合关系,选\n项B为正确答案。侵占罪是指以非法占有为目的,将\n代为保管的他人财物、遗忘物或者埋藏物非法占为己\n有,数额较大,拒不交还的行为,其不包含\n\"窃取\n\"的行\n为方式,故A不选。诈骗罪是指以非法占有为目的,\n用虚构事实或者隐瞒真相的方法,骗取数额较大的公\n私财物的行为,该罪重点在于\n\"骗取\n\" 而不是\n\"窃取\n\" ,\n故C不选。抢夺罪,是指以非法占有为目的,乘人不\n备,公开夺取数额较大的公私财物的行为,本罪重点\n在于\n\"夺取\n\" ,故D不选。","k":"罪数"},{"id":"2019-9","y":2019,"t":"单","s":"食品安全监管人员甲收受张某的巨额财物后, 对其销售不符合安全标准食品的行为不履行监管职 责,导致了重大食品安全事故,后果特别严重。甲的 行为应当()。","o":["直接以受贿罪一罪定罪处罚","以食品监管渎职罪与受贿罪并罚","直接以食品监管渎职罪一罪定罪处罚","以食品监管渎职罪与受贿罪从一重罪处断"],"a":"B","e":"负有食品安全监督管理职责的国家机\n关工作人员,滥用职权或者玩忽职守,导致发生重大\n食品安全事故或者造成其他严重后果的,应当认定为\n食品监管渎职罪。在渎职过程中受贿的,应当以食品\n监管渎职罪和受贿罪实行数罪并罚。受贿后徇私枉\n法、民事、行政枉法裁判、拒不执行判决、裁定、执行判\n决裁定失职执行判决裁定滥用职权的,择一重罪\n处罚,因此,D选项错误。本题中,甲对张某销售不符\n合安全标准食品的行为不履行监管职责,导致重大食\n品安全事故的发生,甲的行为构成食品监管渎职罪,\n且甲有受贿行为,因此,应当以食品监管渎职罪与受\n贿罪并罚,B项正确。\n[特别说明]\n《刑法修正案(十一)》修改了食品\n监管渎职犯罪,增加药品监管渎职犯罪,进一步细化\n食品和药品的渎职犯罪情形,加重了药品监管人员的\n责任。修改后该条文的罪名是食品、药品监管渎职\n罪。该修改对本题没有影响。","k":"罪数"},{"id":"2020-14","y":2020,"t":"单","s":"下列选项中,应按故意杀人罪一罪定罪处罚 的是()。","o":["甲为索取债务将孙某关在宾馆房间,其间多 次毒打孙某致其死亡","乙为勒索财物绑架钱某,从钱某家人处获得赎 金后将钱某杀害","丙为牟取暴利组织多人偷越国境,其间将被组 织者吴某殴打致死","丁为劫取财物杀死曹某,并按照计划将曹某 驾驶的车辆变卖获利"],"a":"A","e":"甲为索取债务将孙某关在宾馆房间属\n于非法拘禁,在此过程中使用暴力致人死亡的,转化\n为故意杀人罪,A选项正确。以勒索财物为目的绑架\n他人的构成绑架罪,绑架并杀害被绑架人的,只定绑\n架罪一罪,B选项错误。在组织他人偷越国(边)境的\n过程中对被组织者有杀害、伤害、强奸、拐卖等犯罪行\n为的,依照数罪并罚的规定处罚,C选项错误。行为\n人为劫取财物而故意杀人,以抢劫罪定罪处罚,D选\n项错误。","k":"罪数"},{"id":"2020-41","y":2020,"t":"多","s":"下列选项中,属于我国刑法理论中处断的一 罪的有()。","o":["集合犯","连续犯","牵连犯","吸收犯"],"a":"BCD","e":"处断的一罪包括连续犯、牵连犯和吸收\n犯,BCD选项正确,集合犯属于法定的一罪,A选项\n错误。","k":"罪数"},{"id":"2022-4","y":2022,"t":"单","s":"甲集资诈骗并将所骗得的巨额赃款转移至境外,以掩饰其性质。甲的行为应认定为","o":["集资诈骗罪和洗钱罪(数罪并罚)","集资诈骗罪或洗钱罪(择一重处断)","集资诈骗罪和掩饰、隐瞒犯罪所得罪(数罪并罚)","集资诈骗罪或掩饰、隐瞒犯罪所得罪(择一重处断)"],"a":"A","e":"洗钱罪是指为掩饰、隐瞒毒品犯罪、黑\n社会性质的组织犯罪、恐怖活动犯罪、走私犯罪、贪污\n贿赂犯罪、破坏金融管理秩序犯罪、金融诈骗犯罪的\n所得及其产生的收益的来源和性质,采用各种法定的\n方法,从而使其\"合法化\"的行为。集资诈骗罪是金融\n诈骗罪中的一种,属于洗钱罪的上游犯罪。甲先实施\n集资诈骗行为,构成集资诈骗罪,后又将其所骗得的\n巨额赃款转移至境外,属于以掩饰其性质的\"自洗钱\"\n行为,《刑法修正案(十一)》将\"自洗钱\"行为也规定\n为犯罪。甲先后实施了两个行为,并且这两个行为分\n别构成两种犯罪,因此对申应当以集资诈骗罪和洗钱\n罪数罪并罚。A选项正确。","k":"罪数"},{"id":"2025-8","y":2025,"t":"单","s":"下列情形中,应当数罪并罚的是( )","o":["甲奸淫被自己拐卖的妇女","乙投毒欲杀妻却致其子死亡","丙非法拘禁致被拘禁人死亡","丁在食品监管渎职过程中受贿"],"a":"D","e":"根据《刑法》的规定,奸淫被拐卖的妇女属于拐卖妇女罪的加重情节,不数罪并\n罚,A 项错误。乙的行为构成故意杀人罪,致其子死亡属于同一犯罪构成内的对象错误,不数\n罪并罚,B 项错误。根据《刑法》的规定,非法拘禁致人死亡属于结果加重犯,只定非法拘禁\n罪一罪,不数罪并罚,C 项错误。丁的行为构成食品监管渎职罪和受贿罪,数罪并罚,D 项正\n确。本题选D。","k":"罪数"}]},{"sub":"刑法","name":"量刑制度","w":1.5,"L":24,"qs":[{"id":"2006-11","y":2006,"t":"单","s":"按照刑法的规定,下列犯罪人中,不可能被减刑的对象是(   )","o":["被判处管制的犯罪分子","被单处罚金的犯罪分子","作为累犯被判处有期徒刑的犯罪分子","被宣告缓刑的犯罪分子"],"a":"B","e":"判处罚金后由于不能抗拒的灾祸交纳确实有困难的,可以酌情减少或者免除,这是罚金交纳方式事中\n的变通措施,他们不属于《刑法》第78 条规定的减刑。死缓执行的减刑,随主刑刑种的性质改变而引起的附加刑的\n相应改变,以及罚金刑的酌情减少或者免除,均不属于《刑法》第78 条规定的减刑。","k":"量刑制度"},{"id":"2006-12","y":2006,"t":"单","s":"下列表述中,正确的说法是(   )","o":["村民委员会主任甲利用职务之便侵吞救济款物,构成贪污罪","普通公民乙利用受聘担任国有公司经理职务的便利条件,侵吞国有财务,不构成贪污罪","国家工作人员利用职务上的便利向他人索取财物,但未为他人谋取利益,不构成受贿罪","丁采用暴力方法阻碍国家机关工作人员执行公务,并致使该工作人员重伤,以妨害公务罪从重处罚"],"a":"A","e":"村民委员会等村基层组织人员协助人民政府从事下列行政管理工作,属于刑法第93 条第二款规定的\"其\n他依照法律从事公务的人员\": 救灾抢险、防汛、优抚、扶贫、移民、救济款物的管理;社会捐助公益事业款物的\n管理;国有土地的经营和管理;土地征用补偿费用的管理;代征、代缴税款;有关计划生育、户籍、征兵工作;协\n助人民政府从事的其他行政管理工作。 受国家机关、国有公司、企业、事业单位、人民团体委托管理、经营\n国有财产的人员,利用职务上的便利,侵吞、窃取、骗取或者以其他手段非法占有国有财物的,以贪污论。","k":"量刑制度"},{"id":"2006-17","y":2006,"t":"单","s":"下列情形中,不属于刑法第 236 条强奸罪加重法定情节的是(   )","o":["强奸妇女多人的","利用妇女处于昏醉状态而强奸的","在公共场所当众强奸妇女的","二人以上轮奸的"],"a":"B","e":"见《刑法》第236 条,强奸罪加重法定情节的是;有下列情况之一的,处十年以上有期徒刑、无期徒\n刑或者死刑:(一)强奸妇女、奸淫幼女情节恶劣的;(二)强奸妇女、奸淫幼女多人的 ;(三)在公共场所当众\n强奸妇女的;(四)二人以上轮奸的;(五)致使被害人重伤、死亡或者造成其他严重后果的。","k":"量刑制度"},{"id":"2006-9","y":2006,"t":"单","s":"某欠赌债不还,钱某邀朋友林某,涂某一起将刘某骗到一空房内捆绑起来吊在房梁上,用竹板抽打,逼其还钱。 2 天后,刘某被闻讯赶来的公安人员解救。经法医鉴定,刘某为轻微伤。对钱某等三人的行为应当(   )","o":["以非法拘禁罪从重处罚","以故意伤害罪从重处罚","以非法拘禁罪和故意伤害罪并罚","以绑架罪定罪处罚"],"a":"A","e":"为索取债务而非法扣押、拘禁他人的,按非法拘禁罪定罪处罚。其中债务包括非法债务,如赌债(阮\n齐林说);另非法拘禁罪有可能转化成故意伤害罪、故意杀人罪,但应具备两个条件:(1)行为人必须是以暴力方\n法犯非法拘禁罪。(2)客观上必须造成被害人重伤、死亡结果的发生。所以钱某以非法拘禁罪处罚,若是国家机关\n工作人员利用职权犯本罪的,从重处罚。","k":"量刑制度"},{"id":"2007-4","y":2007,"t":"单","s":"根据我国刑法规定,已满 14 周岁不满 18 周岁的人犯罪 (   ) 。","o":["可以从轻或者减轻处罚","应当从轻或者减轻处罚","可以减轻或者免除处罚","应当减轻或者免除处罚"],"a":"B","e":"量刑情节 \n] 我国刑法明确规定,已满 14 周岁不满 18 周岁的人犯罪,应当从轻或者减轻处罚。 \n故答案为 B。","k":"量刑制度"},{"id":"2011-15","y":2011,"t":"单","s":"民警甲为报私仇,趁乙与他人发生纠纷之机, 将乙非法拘押,并使用警棍殴打乙,致使乙残疾。对 甲的行为()。","o":["应定为故意伤害罪,并从重处罚","应定为非法拘禁罪,并从重处罚","应定为刑讯逼供罪,并从重处罚","应定为报复陷害罪,并从重处罚"],"a":"A","e":"非法拘禁罪既存在结果加重犯又存在\n着转化犯的形式。对非法拘禁罪结果加重犯的规定,\n一般是指行为人没有使用超出拘禁行为所必需的范\n围的暴力,过失致使被害人重伤、死亡的情形。行为\n人在非法拘禁的过程中使用暴力致人伤残、死亡的,\n转化为故意伤害罪、故意杀人罪,这是转化犯的规定。\n所以区别是结果加重犯还是转化犯,关键是看行为人\n使用的暴力是否超出拘禁行为所必需的范围,而转化\n为故意伤害罪。而且,《刑法》明文规定国家工作人员\n利用职权犯非法拘禁罪的,从重处罚。所以B错误,\n答案选A,认定甲构成故意伤害罪,并从重处罚。(非\n法拘禁罪是一个重点罪名,可考的形式很多,望考生\n加以理解记忆。)","k":"量刑制度"},{"id":"2011-42","y":2011,"t":"多","s":"被判处管制的罪犯、被判处缓刑的罪犯和被 假释的罪犯应共同遵守的规定有()。","o":["遵守法律、法规,服从监督","遵守有关机关关于会客的规定","按有关机关的规定报告自己的活动情况","离开所居住的市、县或者迁居,应当报经有关 机关批准"],"a":"ABCD","e":"《刑法》第39条规定,被判处管制的犯\n罪分子,在执行期间,应当遵守下列规定:(l)遵守法\n律,行政法规,服从监督;(2)未经执行机关批准,不\n得行使言论、出版、集会、结社、游行、示威自由的权\n利;(3)按照执行机关规定报告自己的活动情况;\n(4)遵守执行机关关于会客的规定;(5)离开所居住\n的市、县或者迁居,应当报经执行机关批准。其中的\n第1,3~5项也是被宣告缓刑的犯罪分子和被宣告假\n释的犯罪分子所共同遵守的规定,故答案选ABCD。\n考生应特别关注,对于管制、缓刑、假释的相关制度,\n《刑法修正案(八)》做了大量修改,对管制犯、假释\n犯缓刑犯都新规定了社区矫正的制度,而对管制犯、\n缓刑犯规定了禁止令制度,即根据犯罪情况,法院可\n以禁止犯罪分子在管制或者缓刑期间不得从事特定\n活动、不得进人特定区域场所,不得接触特定的人。","k":"量刑制度"},{"id":"2011-7","y":2011,"t":"单","s":"下列情形中,属于自首的是()。","o":["甲杀人后,其父主动报案并将甲送到派出所, 甲如实交代了杀人事实","甲在与乙共同贪污之后,主动到检察机关交代 自己的贪污事实,但未提及乙","甲在和乙共同盗窃之后,主动到公安机关反映 乙曾经诈骗数千元,经查证属实","甲给派出所打电话,主动交代了自己杀害妻 子的事实,然后出走,不知去向"],"a":"A","e":"一般自首的成立条件包括两条:一是自\n动投案,二是如实供述自己的罪行。教材在解析这两\n个条件时,细致地分析了一些具体的情况。其中,亲\n友主动报案后,将犯罪嫌疑人送去投案的,也应当视\n为自动投案,因此A的情形属于自首。至千B和C 这\n两个选项,都属于共同犯罪自首的认定。共同犯罪成\n立自首,都必须供述自己的罪行以及同案犯的共同犯\n罪事实,两者缺一不可。在B选项中,甲未供述同案\n犯的罪行,在C 选项中,甲供述的是乙的另一罪行,未\n供述自己与乙的共同犯罪罪行,故都不成立自首。至\n于D选项,甲通过电话交代罪行之后,便出走且不知\n去向,这不符合自动投案的条件,故不成立自首。(考\n生对千自首的认定一定要熟知熟记)","k":"量刑制度"},{"id":"2012-11","y":2012,"t":"单","s":"甲、乙分别为某国有公司总经理和副总经理, 二人挪用公司1000万元公款给张三从事期货交易, 收受并平分了张三的30万元回扣。司法机关在查处 甲、乙挪用公款案件时,甲主动交代自己收受了张三 15万元回扣,并揭发乙也收受了15万元回扣。本案 中( )。","o":["甲在受贿罪行上成立自首","甲在受贿罪行上成立自首和立功","甲在挪用公款和受贿罪行上均成立立功","甲在挪用公款罪行上成立立功,在受贿罪行 上成立自首"],"a":"A","e":"甲与乙共同犯罪,在这种情况下,甲必\n须供述与乙共同实施犯罪行为才构成自首。甲主动\n交代自己收受了张三15万元回扣,并揭发乙也收受\n了15万元回扣,构成自首。故选A。根据《刑法》第\n68条第1款的规定,犯罪分子到案后有检举、揭发他\n人犯罪行为,包括共同犯罪案件中的犯罪分子揭发同\n案犯共同犯罪以外的其他犯罪,经查证属实;提供侦\n破其他案件的重要线索,经查证属实;阻止他人犯罪\n活动;协助司法机关抓捕其他犯罪嫌疑人(包括同案\n犯);具有其他有利于国家和社会的突出表现的,应当\n认定为有立功表现。此处犯罪嫌疑人并没有检举同\n案犯除了共同犯罪以外的行为,所以并不构成立功。","k":"量刑制度"},{"id":"2012-42","y":2012,"t":"多","s":"下列选项中,属于缓刑适用实质条件的有","o":["有悔罪表现","犯罪情节较轻","没有再犯罪的危险","宣告缓刑对所居住社区没有重大不良影响"],"a":"ABCD","e":"根据《刑法修正案(八)》的规定,缓刑\n适用的实质条件包括有悔罪表现、犯罪情节较轻和没\n有再犯罪危险、宣告缓刑对所居住社区没有重大不良\n影响。故ABCD正确。\n《刑法修正案(八)》对刑法进行了很多修改,每\n一处修改都可能成为考点,考生应给予高度重视。","k":"量刑制度"},{"id":"2014-42","y":2014,"t":"多","s":"犯罪嫌疑人协助司法机关抓获其他犯罪嫌疑 人的下列情形中,可认定为立功的有()。","o":["带领侦查人员抓获其他犯罪嫌疑人的","按照司法机关的安排,当场指认其他犯罪嫌疑 人的","提供司法机关尚未掌握的其他案件犯罪嫌疑 人的藏匿地点的","按照司法机关的安排,打电话将其他犯罪嫌 疑人约至指定地点的"],"a":"ABCD","e":"根据我国《刑法》和相关司法解释,立\n功包括协助抓捕其他犯罪嫌疑人,而协助抓捕其他犯\n罪嫌疑人具体包括以下几种行为:(1)带领侦查人员\n抓获其他犯罪嫌疑人的;(2)按照司法机关的安排,\n当场指认其他犯罪嫌疑人的;(3) 提供司法机关尚未\n掌握的其他案件犯罪嫌疑人的藏匿地点的;(4) 按照\n司法机关的安排,打电话将其他犯罪嫌疑人约至指定\n地点的。因此四个选项均属正确。","k":"量刑制度"},{"id":"2015-15","y":2015,"t":"单","s":"甲因侵占科研经费被捕。在侦查期间,甲主 动供述自己曾和同事一起套取另一科研项目经费19 万元用于自己房屋装修。甲供述与他人套取科研经 )。 费的行为属于(","o":["坦白","立功","自首","准自首"],"a":"A","e":"本题考查的是刑法中的量刑制度以及\n自首与坦白的界限。所谓坦白,是指犯罪分子被动归\n案之后,如实供述自己的罪行,并接受国家司法机关\n审查和裁判的行为。自首是犯罪人自动投案之后,主\n动如实供述自己犯罪事实的行为,或者被动归案以\n后,如实供述司法机关还未掌握的本人其他罪行的行\n为。甲供述与他人套取科研经费的行为是在甲因侵\n占科研经费被捕之后作出的,属千如实交代自已被指\n控的犯罪事实的行为,因此甲的供述行为属于坦白,\n而非自首,A选项正确,C选项错误。甲供述的是司\n法机关已经掌握的罪名,不成立准自首,D选项错误。\n甲与自己的同事是共同犯罪,自首时要求供述同案犯\n的罪行,甲的行为不成立立功,B选项错误。考生应\n注意自首与坦白的具体区别,并且注意《刑法》已经将\n坦白规定为法定情节。","k":"量刑制度"},{"id":"2015-45","y":2015,"t":"多","s":"甲在某学校附近利用“地沟油”生产“食用 油”,被刘某举报。甲因此被判处有期徒刑1年,缓刑 2年,同时宣告禁止令。关于该禁止令的适用,正确的 有()。","o":["禁止甲接触刘某","禁止甲进人学校","禁止甲从事食用油生产经营行业","禁止令的执行期限从缓刑考验期满之日起 计算"],"a":"AC","e":"禁止令是人民法院对犯罪分子宣判管\n制、宣告缓刑的同时,判令禁止其从事特定活动,进入\n特定区域、场所,接触特定的人的命令。适用禁止令,\n应当根据犯罪分子的犯罪原因、犯罪性质、犯罪手段、\n犯罪后的悔罪表现、个人一贯表现等情况,充分考虑\n与犯罪分子所犯罪行的关联程度,有针对性地进行。\n判处管制、宣告缓刑的犯罪分子在管制执行期间、缓\n刑考验期内未经对方同意,禁止接触控告人、批评人、\n举报人及其法定代理人、近亲属。本题中,刘某是举\n报人,因此,A选项正确。禁止判处管制、宣告缓刑的\n犯罪分子在管制执行期间、缓刑考验期内从事的活动\n中包括:利用从事特定生产经营活动实施犯罪的,禁\n止从事相关生产经营活动。甲利用\n\" 地沟油\n\" 生产\n\"食用油\n\",因此禁止甲从事食用油生产经营行业,C\n选项正确。禁止判处管制、宣告缓刑的犯罪分子在管\n制执行期间、缓刑考验期内进入的区域场所中包括:\n禁止进入中小学校区、幼儿园园区及周边地区,确因\n本人就学、居住等原因,经执行机关批准的除外。题\n中甲从事的犯罪活动与学校无关,甲在别的地方也可\n以利用\n\"地沟油\n\" 生产\n\"食用油\n\",所以无须禁止甲进\n入学校,B选项错误。禁止令的执行期限,从管制、缓\n\n刑执行之日起计算,D选项错误。\n侵害时,可以向人民法院起诉请求精神损害赔偿。据","k":"量刑制度"},{"id":"2015-7","y":2015,"t":"单","s":"甲17周岁时因运输毒品被判处3年有期徒 刑,刑满释放后不久,又因参加黑社会性质组织贩卖 毒品被逮捕。甲属于( )。","o":["再犯","初犯","一般累犯","特别累犯"],"a":"A","e":"本题考查的是再犯与累犯之间的区别,\n一般意义上的再犯,是指再次犯罪的人,即两次或者\n两次以上实施犯罪的人。依据《刑法》第65条的\n\" 除\n外\n\"规定,即\n\" 但是过失犯罪和不满18周岁的人犯罪\n的除外\n\",构成累犯者应当是前罪和后罪发生时犯罪\n人均已满18周岁,如果犯罪人前罪发生时不满18周\n岁,后罪发生时已满18周岁的,也不宜认定为累犯。\n甲犯前罪时是17周岁,不满18周岁,所以甲犯后罪\n时不构成累犯,而是一般意义上的再犯,A正确,C错\n误。特别累犯是指危害国家安全犯罪、恐怖活动犯\n罪黑社会性质的组织犯罪的犯罪分子,在刑罚执行\n完毕或者赦免以后,在任何时候再犯上述任一类罪\n的,都以累犯论处。甲并没有犯危害国家安全犯罪、\n恐怖活动犯罪、黑社会性质的组织犯罪,不成立特别\n累犯,D错误。甲刑满释放后又再次犯罪,是第二次\n犯罪,不是初犯,B错误。","k":"量刑制度"},{"id":"2016-8","y":2016,"t":"单","s":"甲因涉嫌受贿被逮捕,在受讯问时如实供述了 受贿罪行,并举报同监室的一名犯罪嫌疑人企图脱 逃,经查证属实。下列选项中,正确的是( )。","o":["甲具有自首情节,对其可以从轻处罚","甲具有立功情节,对其可以免除处罚","甲具有坦白情节,对其可以从轻处罚","甲具有重大立功情节,对其应当免除处罚"],"a":"C","e":"甲在被逮捕后如实供述,具有坦白情\n节按照刑法第67条第三款的规定,可以从轻处罚,C\n选项正确。甲举报同监室的嫌疑人企图脱逃,具有立\n功情节,根据刑法第68 条的规定,可以从轻或者减轻\n处罚,B选项错误。\n甲并不是主动归案,不成立自首,A选项错误。\n甲举报的罪犯成立脱逃罪,脱逃罪的最高法定刑为五\n年以上有期徒刑。成立重大立功的罪犯,需要被告人\n可能被判处无期徒刑以上刑罚。所以甲成立立功,但\n不成立重大立功,D选项错误。","k":"量刑制度"},{"id":"2017-10","y":2017,"t":"单","s":"甲因涉嫌抢劫被公安机关逮捕后,主动供述 自己曾入户盗窃。甲供述盗窃的行为属于(","o":["坦白","一般自首","立功","特别自首"],"a":"D","e":"自首分为一般自首和特别自首,一般自\n首是指犯罪分子犯罪以后自动投案,如实供述自己罪\n行的行为。特别自首是指被采取强制措施的犯罪嫌\n疑人被告人和正在服刑的罪犯,如实供述司法机关\n还未掌握的本人其他罪行的行为。本题中,甲不是抢\n劫后自动投案的,不成立一般自首,B项错误。甲因\n抢劫被公安机关逮捕后,如实供述公安机关未掌握的\n入户盗窃的行为,成立特别自首,D项正确。坦白是\n指犯罪分子被动归案后,如实供述自己罪行,并接受\n国家司法机关审查和裁判的行为。坦白供述的是司\n法机关已经掌握的罪行,如果甲供述的是抢劫罪行,\n就成立坦白。但是甲供述的是公安机关未掌握的盗\n窃罪行,所以甲成立特别自首,不成立坦白,A项错\n误。立功是指犯罪分子揭发他人犯罪行为,查证属\n实,或者提供重要线索,从而得以侦破其他案件的行\n\n为。甲没有揭发他人犯罪行为也没有提供他人犯罪\n的重要线索,不成立立功,C项错误。","k":"量刑制度"},{"id":"2017-42","y":2017,"t":"多","s":"下列选项中,属于量刑制度的有(","o":["累犯","缓刑","自首","假释"],"a":"ABC","e":"量刑是指人民法院依据刑事法律,在认\n定行为人构成犯罪的基础上,确定对犯罪人是否判处\n刑罚判处何种刑罚以及判处多重的刑罚,并决定所\n判刑罚是否立即执行的刑事司法活动。我国的量刑\n制度包括累犯、自首、立功、数罪并罚、缓刑,ABC项正\n确。D项假释是刑罚执行制度,而不是量刑制度,D\n项错误。","k":"量刑制度"},{"id":"2018-42","y":2018,"t":"多","s":"下列选项中,应认定为自首中“自动投案”的 有()。","o":["在接受强制戒毒期间,主动向警方交代了自 已抢劫他人的事实","因形迹可疑被父母捆绑到派出所后,如实交代 了自己杀人的事实","匿名报案后在事故现场接受询问时,向警方交 代了自己交通肇事的事实","在涉嫌诈骗被取保候审期间潜逃,途中找警 方交代了自己绑架他人的事实"],"a":"ACD","e":"\"自动投案\n\" 要体现出\n\" 自动性\n\",即行\n为人主动、自愿向公安机关交代犯罪事实,被捆绑到\n派出所不算自动投案,B项不选。根据相关司法解释\n规定,强制戒毒期间,主动向警方交代了自己犯罪事\n实的,属于自动投案,A项正确,而CD也符合自动投\n案的特征。","k":"量刑制度"},{"id":"2019-45","y":2019,"t":"多","s":"下列关于减刑适用的理解,正确的有()。","o":["对于被判处2年有期徒刑并宣告缓刑的甲,一 般不适用减刑","对于被判处管制2年并在执行期间确有立功 表现的乙,可以减刑","丙被判处无期徒刑,有重大立功表现,应当减 刑,但实际执行的刑期不能少于10年","丁被判处死刑缓期2年执行,无论经过几次减 刑,其实际执行的刑期都不得少于15年,且死 刑缓期执行期间不包括在内"],"a":"ABD","e":"《最高人民法院关千办理减刑、假释案\n件具体应用法律的规定》第18条规定:被判处拘役或\n者三年以下有期徒刑,并宣告缓刑的罪犯,一般不适\n用减刑选项A 正确。所谓减刑,是被判处管制、拘\n役、有期徒刑、无期徒刑的犯罪分子,根据其在刑罚执\n行期间的诲改表现或者立功表现的,而适当减轻其原\n判刑罚的制度。选项B 被判处管制并且有立功表现\n的乙满足减刑的对象条件、实质条件和限度条件,选\n项B正确;根据减刑的限度条件:(1)管制、拘役、有\n期徒刑:不能少于原判刑期的1/2。(2)无期徒刑:不\n能少于13年(该13年计算时间从无期徒刑判决确定\n之日起计算),选项C错误,实际执行的刑期应当不少\n于13年。(3)普通死缓犯减为无期徒刑或有期徒刑\n后,经过一次或几次减刑后,其实际的刑期不能少于\n1 5年,死缓考验期不包括在内。选项D正确;本题\n选ABD。\n'","k":"量刑制度"},{"id":"2019-6","y":2019,"t":"单","s":"甲目睹了朋友乙抢劫王某的全过程后实施的 下列行为,可以构成窝藏罪的是()。","o":["劝说乙不要自首","转账5000元给乙供其外出躲避","经法院通知无正当理由拒不出庭作证","对侦查人员表示:乙只是捡拾了王某掉落的 财物 2019年全国法律硕士(非法学)联考真题"],"a":"B","e":"窝藏罪是指明知是犯罪的人而为其提\n供隐蔽住所、财物,帮助其逃匿的行为。本题中,甲目\n睹了乙抢劫的全过程,也就是甲明知乙是犯罪的人。\n甲转账5000元给乙,供其外出躲避,是为乙提供财\n物,帮助乙逃匿,所以,B项的行为可以构成窝藏罪,B\n项正确。AC选项不满足窝藏罪的行为方式。D项甲\n的行为是明知是犯罪分子而向司法机关作虚假证明,\n为其掩盖罪行的行为,属于包庇罪。","k":"量刑制度"},{"id":"2020-44","y":2020,"t":"多","s":"自动投案的罪犯的下列行为中,应认定为属 于自首中“如实供述自己的罪行”的有()。","o":["供述时对所知的同案犯未作供述的","如实供述行为事实但对行为性质加以辩解的","在司法机关掌握其主要犯罪事实之前主动交 代的","供述的身份与真实情况有差别但未影响定罪 量刑的"],"a":"BCD","e":"自首中的\n\"如实供述自己的罪行\n\"的含\n义是供述自己实施并应由本人承担刑事责任的罪行。\n投案人供述罪行时除了要供述自己的罪行,还应当供\n述自己所知的同案犯的犯罪行为,A选项错误。如实\n供述行为事实但对行为性质加以辩解,供述的身份与\n真实情况有差别但未影响定罪量刑的,不影响自首的\n认定,BD选项正确。如实供述要在司法机关掌握犯\n罪事实之前进行,而由于主客观方面的原因,投案人\n很难将自己的罪行完全无遗漏地供述,因此只要如实\n供述主要或基本罪行即可,C选项正确。","k":"量刑制度"},{"id":"2025-20","y":2025,"t":"单","s":"若甲因重大立功减刑后,又犯应判处有期徒刑的新罪,对甲应按照( )","o":["吸收原则决定执行的刑罚","“先并后减”的方法决定执行的刑罚","并科原则决定执行的刑罚","“先减后并”的方法决定执行的刑罚"],"a":"D","e":"《刑法》第71 条规定:\"判决宣告以后,刑罚执行完毕以前,被判刑的犯罪分子\n又犯罪的,应当对新犯的罪作出判决,把前罪没有执行的刑罚和后罪所判处的刑罚,依照本法\n第69 条的规定,决定执行的刑罚。\"本题中,甲因重大立功减刑后,又犯应判处有期徒刑的新\n罪,属于刑罚执行期间又犯新罪,因此应按照\"先减后并\"的方法决定执行的刑罚,D 项正确,\n\nABC 项错误。本题选D。","k":"量刑制度"},{"id":"2025-43","y":2025,"t":"多","s":"与境外机构、组织、个人相勾结实施下列犯罪,依照我国刑法应当从重处罚的有( )","o":["间谍罪","叛逃罪","分裂国家罪","颠覆国家政权罪"],"a":"CD","e":"《刑法》第106 条规定:\"与境外机构、组织、个人相勾结,实施本章第一百零三\n条、第一百零四条、第一百零五条规定之罪的,依照各该条的规定从重处罚。\"第103 条是分\n裂国家罪、煽动分裂国家罪,第104 条是武装叛乱、暴乱罪,第105 条是颠覆国家政权罪、煽\n动颠覆国家政权罪,因此CD 项正确,AB 项错误。本题选CD。","k":"量刑制度"},{"id":"2026-3","y":2026,"t":"单","s":"为积极贯彻坦白从宽的立法规定,下列做法正确的是","o":["对如实供述司法机关尚未掌握的同种罪行的被告人认定坦白","对如实供述司法机关尚未掌握的不同种罪行的服刑人员认定坦白","对因坦白避免特别严重后果的犯罪嫌疑人可以免除处罚","对如实供述司法机关尚未掌握的同种罪行的犯罪嫌疑人认定坦白"],"a":"D","e":"坦白是如实供述司法机关已经掌握的罪行,或如实供述同种余罪;如实供\n述不同种罪行属于自首。\nA 主体是被告人、表述场景不符;B 属于特别自首;C 法条规定坦白避免特别严重\n后果是可以减轻,不是免除;D 犯罪嫌疑人交代同种未掌握罪行,成立坦白。","k":"量刑制度"}]},{"sub":"刑法","name":"共同犯罪","w":1.2,"L":22,"qs":[{"id":"2006-13","y":2006,"t":"单","s":"楚某 1997 年 3 月 5 日犯甲罪,追溯期限应为 10 年,2002 年 3 月 5 日又犯乙罪,乙罪的追溯期限也是 10 年。这是 甲罪的追诉期限应(   )","o":["从犯乙罪之日起计算,共计 20 年,即以甲罪的追诉期限 10 年加乙罪的追诉期限 10 年","从犯乙罪之日起计算,共计 15 年,即以甲罪追诉期限剩余的 5 年加乙罪的追诉期限 10 年","从犯乙罪之日起计算,还有 5 年","从犯乙罪之日起计算,还有 10 年"],"a":"D","e":"本题考察的是怪与诉讼时效的中断,见《刑法》第88 条。","k":"共同犯罪"},{"id":"2006-23","y":2006,"t":"多","s":"甲教唆乙杀丁,丙知情后,给乙提供一把匕首,乙将丁杀害。关于本案,下列说法中正确的是(       )","o":["本案的共同犯罪是复杂共同犯罪","本案的共同犯罪是必要共同犯罪","甲,乙一般可以认定为主犯","丙一般可以认定为从犯"],"a":"ACD","e":"本题考查的是共同犯罪的形式和分类。根据共同犯罪之间有无分工可分为简单共犯和复杂共犯,复\n杂的共同犯罪是指各共同犯罪人之间存在分工的共同犯罪。根据共同犯罪能否任意形成,可分为任意共犯和必要共\n- 7 -\n\n \n \n更多考研精品资料,关注淘宝店铺:光速考研工作室 \n犯本题中甲与乙二人是有分工的可以任意性形成的共同犯罪。所以正确答案ACD 。24.ABD《刑法》第191\n条 洗钱罪是明知是毒品犯罪、黑社会性质的组织犯罪、走私犯罪的违法所得及其产生的收益,为掩饰、隐瞒其来源\n和性质,所以不选C。","k":"共同犯罪"},{"id":"2006-6","y":2006,"t":"单","s":"甲因遭丈夫乙的虐待而被迫离家独居。某日其女儿丙(13 岁)来看望甲,甲叫丙把家中的老鼠药放到乙喝的酒 中。 丙按甲的吩咐行事,致乙死亡。对此案,下列说法中正确的是(   )","o":["甲,丙构成共同犯罪","甲构成投放危险物质罪","甲是故意杀人罪的教唆犯","甲单独构成故意杀人罪"],"a":"D","e":"丙是未满14 岁,是完全 \n无责任能力人,所关于教唆不负刑事责任未成年人犯罪的单独构成间接正犯。以上可以派出A、C 选项,而B 项中加\n针对特定的人所以可排除,所以选D.","k":"共同犯罪"},{"id":"2007-8","y":2007,"t":"单","s":"甲教唆 15 周岁的乙实施盗窃,乙按照甲的教唆盗窃了一辆价值 1 万元的摩托车。对此案的正确处理是 (   ) 。","o":["甲与乙共同构成盗窃罪,甲是主犯,乙是从犯","甲与乙共同构成盗窃罪,甲是教唆犯,乙是实行犯","甲构成教唆罪,乙构成盗窃罪","甲单独构成盗窃罪"],"a":"D","e":"教唆犯 \n]构成教唆犯的条件之一是教唆犯所教唆的对象必须是达到刑事责任年龄、具有刑事责 \n任能力的人,否则不构成教唆犯,而成立间接正犯。由于乙为 15 周岁,没有达到盗窃罪所 \n要求的刑事责任年龄,故甲单独构成盗窃罪。","k":"共同犯罪"},{"id":"2008-11","y":2008,"t":"单","s":"甲与乙共谋后,分别从前、后门进入李家追杀李某,李某被甲追至后门处被乙一刀捅死。甲、乙的共同犯罪形式是(  )","o":["必要共同犯罪","简单共同犯罪","复杂共同犯罪","特殊共同犯罪"],"a":"B","e":"必要共同犯罪,是指构成法律规定的犯罪主体是二人以上,必须采取共同犯罪形式的犯罪;任意共同\n犯罪,是指二人以上共同构成法律没有限制主体数量的犯罪。在任意共同犯罪中,犯罪主体是单个还是二人以上,\n或者说是否采取共同犯罪的形式,是\"任意\"的。本题中的故意杀人罪的犯罪主体并非必须是二人以上,应属于任\n意共同犯罪。","k":"共同犯罪"},{"id":"2009-14","y":2009,"t":"单","s":"甲、乙二人不约而同在同一商场内行窃,各自盗窃财物数额较大。下列对甲、乙二人行为的认定,正确的是(   )。","o":["甲、乙二人是共同实行犯","甲、乙二人互为片面共犯","甲、乙二人互为间接正犯","甲、乙二人不构成盗窃罪共犯"],"a":"D","e":"本题考查共同犯罪的成立条件。共同犯罪是两个人以上共同故意犯罪。共同犯罪需要有共同犯罪的\n故意,所以缺乏共同意思联络的同时犯以及故意内容不同,都不成立共同犯罪。","k":"共同犯罪"},{"id":"2009-16","y":2009,"t":"单","s":"甲教唆乙杀文某,并指使丙为乙提供枪支,乙、丙按甲的要求实施了相应的行为。甲、乙、丙的犯罪属于(  )。","o":["必要共同犯罪","特殊共同犯罪","简单共同犯罪","复杂共同犯罪"],"a":"D","e":"本题考查共同犯罪的形式。根据共同犯罪是否能够依据法律的规定任意形成,将共同犯罪分分为\n任意共同犯罪和必要共同犯罪。根据我国刑法规定,故意杀人罪不是必要共同犯罪形式,甲、乙、丙不是必要共犯。\nA 选项错误。根据共同犯罪人之间是否有分工,将共同犯罪分为简单共同犯罪和复杂共同犯罪。本题中甲是教唆犯,\n乙是实行犯,丙是帮助犯,甲乙丙之间存在分工,属于复杂共犯。C 选项错误,D 选项正确。根据共同犯罪有无组织\n形式,将共同犯罪分为一般和特殊共同犯罪。一般共同犯罪是指没有特殊组织形式的共同犯罪。特殊共同犯罪,是\n有组织的共同犯罪。本题中,甲、乙、丙三人共同犯罪实施杀人行为,分工进行,属于一般共同犯罪。因此本题答\n案为D","k":"共同犯罪"},{"id":"2009-25","y":2009,"t":"多","s":"下列情形中,应以共犯论处的有(      )。","o":["与走私罪犯通谋,为其提供运输方便的","直接向走私人非法收购国家禁止进口物品的","非国家工作人员与国家工作人员勾结,伙同贪污的","知道或者应当知道他人实施生产、销售伪劣商品犯罪而为其提供生产、经营场所的 三、简答题(26_27 小题。每小题 6 分"],"a":"ACD","e":"本题考查共同犯罪。《刑法》第156 条规定,与走私犯罪通谋,为其提供贷款、资金、帐号、发票、\n证明,或者为其提供方便的,以走私罪的共犯论处。A 选项正确。《刑法》第155 条规定,直接向走、走私人非法\n收购国家禁止进口物品的,以走私罪论处。B 选项错误。《刑法》第382 条规定非国家工作人员与国家工作人员勾\n结,伙同贪污的,以共犯论处。C 选项正确知道或者应到知道他人实施生产、销售伪劣商品犯罪而为其提供生产、\n经营场地的,以生产、销售伪劣商品犯罪的共犯论处。D 选项正确。因此本题答案A、C、D \n三、简答题","k":"共同犯罪"},{"id":"2011-12","y":2011,"t":"单","s":"甲指使15周岁的乙盗窃轿车,乙将盗得的轿 车交给甲,甲销赃得款10万元。在本案中()。","o":["甲、乙构成共同犯罪","甲是教唆犯,且属于主犯","乙是实行犯,是从犯","甲是实行犯"],"a":"D","e":"成立共同犯罪的主体条件要求作为共\n\n同犯罪人之一,必须具备责任能力、达到责任年龄的\n一般主体资格。二人共同实施犯罪行为,其中一人未\n达到刑事责任年龄的,不认为是共同犯罪。在本题\n中,15周岁的乙未达到构成盗窃罪的责任年龄,故甲\n乙不成立共同犯罪。既然不存在共同犯罪,也就没有\n主犯、从犯一说,所以选项ABC 错误。","k":"共同犯罪"},{"id":"2011-2","y":2011,"t":"单","s":"甲是某运输公司的经理,为了抢运煤炭,甲亲 自跟车督促驾驶。在驾驶员乙已经连续驾驶10多个 小时的情况下,甲仍强令乙继续加速。乙因过度疲 劳,操作不当,在驾驶中撞死路边一摆摊商贩。关于 本案,下列说法正确的是(:·)。","o":["甲构成重大责任事故罪","甲、乙成立交通肇事罪共犯","甲构成交通肇事罪","甲构成强令违章冒险作业罪"],"a":"C","e":"关千交通肇事罪,有两条重要的司法解\n释需要注意,一是《最高人民法院关于审理交通肇事\n刑事案件具体应用法律若干问题的解释》第5条第2\n款规定:\"交通肇事后,单位主管人员、机动车辆所有\n人、承包人或者乘车人指使肇事人逃逸,致使被害人\n因得不到救助而死亡的,以交通肇事罪的共犯论处。\"\n另一是第7条规定:\"单位主管人员、机动车辆所有人\n或者机动车辆承包人指使、强令他人违章驾驶造成重\n大交通事故,具有本解释第2条情形之一的,以交通\n肇事罪定罪处罚。\"注意前一条成立交通肇事罪的共\n犯,后一条相关的单位主管人员、机动车辆所有人或\n者机动车辆承包人单独成立交通肇事罪,不发生共\n犯。本题中所描述的情形属于后一法条所规定的情\n形,故甲成立交通肇事罪,并不与乙成立交通肇事罪\n的共犯,所以选C 而不选B。(此两条司法解释十分\n重要,需加强记忆。)","k":"共同犯罪"},{"id":"2013-6","y":2013,"t":"单","s":"我国刑法划分共同犯罪人种类的依据是 )。","o":["作用","作用为主,兼顾分工","分工","分工为主,兼顾作用"],"a":"B","e":"我国刑法以共同犯罪人在共同犯罪中\n所起的作用为主要标准,同时兼顾分工,将共同犯罪\n人分为\n\" 主犯、从犯、胁从犯、教峻犯\n\"四种。","k":"共同犯罪"},{"id":"2014-9","y":2014,"t":"单","s":"甲受乙教唆,雇佣童工从事危重劳动,情节严 重。甲、乙的犯罪属于( )。","o":["必要的共同犯罪","简单的共同犯罪","特殊的共同犯罪","任意的共同犯罪"],"a":"D","e":"本题考查的是共同犯罪的形式分类。\n首先,根据共同犯罪是否能够以任意形成为标准,可\n以将其分为任意共同犯罪和必要共同犯罪。任意共\n同犯罪是指二人以上共同构成法律没有限制主体数\n量的犯罪,而必要共同犯罪是指二人以上共同构成法\n律规定其犯罪主体是二人以上,必须采取共同犯罪形\n式的犯罪。本题中,乙教咬甲雇佣童工从事危重劳动\n已构成共同犯罪,但由于本罪并非法律规定的必须由\n二人以上共同构成的必要共同犯罪,因此属于任意共\n同犯罪,答案选D。","k":"共同犯罪"},{"id":"2017-6","y":2017,"t":"单","s":"甲约乙去偷笔记本电脑,乙不敢去偷,但答应 负责找销路。甲得手后将盗得的10台电脑交给乙, 乙找到经营电子产品的丙,丙觉得电脑的来路不明, 就以10000元的价格收购了价值45000元的电脑。对 2017年全国法律硕士(非法学)联考真题 此,下列说法正确的是()。","o":["甲、乙的行为构成盗窃罪的共同犯罪","甲、乙、丙的行为构成盗窃罪的共同犯罪","乙的行为构成盗窃罪和掩饰、隐瞒犯罪所得罪","乙、丙的行为构成掩饰、隐瞒犯罪所得罪的共 同犯罪"],"a":"A","e":"二人以上共同故意犯罪,成立共同犯\n罪。学术界通常以主观上有无共同犯罪故意作为标\n准认定共犯。事前无通谋、事后提供帮助的行为不构\n成共同犯罪。甲和乙商量共同盗窃,虽然乙没有实施\n具体的盗窃行为,但是乙和甲事前有通谋,乙事后负\n责销售,甲乙有共同的犯罪故意,成立盗窃罪的共同\n犯罪。A项正确。乙销售赃物的行为是盗窃罪的事\n后不可罚行为,不再成立掩饰、隐瞒犯罪所得罪。CD\n项错误。丙与甲乙事前无通谋,只是在事后以低价收\n购了甲乙盗窃而来的电脑,属千事后提供帮助行为,\n丙与甲乙不构成盗窃罪的共同犯罪,丙成立掩饰、隐\n瞒犯罪所得罪。B项错误。","k":"共同犯罪"},{"id":"2020-43","y":2020,"t":"多","s":"下列选项中,应认定为共同犯罪中的教唆犯 的有()。","o":["甲引诱17岁的王某盗窃了巨额财物","乙唆使已有自杀决意的高某赶快自杀","丙在演讲中煽动听众实施分裂国家的活动","丁说服丈夫刘某利用职权向他人索取巨额 财物"],"a":"AD","e":"教竣犯,指教竣他人实行犯罪的人。具\n体而言,就是指故意引起他人产生犯罪决意的人。甲\n引诱王某实施盗窃行为,甲构成教暧犯,且甲教咬不\n满18周岁的人犯罪,应从重处罚,A选项正确。高某\n具有完全的意志自由,乙教竣其自杀不构成犯罪,且\n高某已经有自杀决意,乙竣使其自杀不符合引起犯罪\n决意的条件,因此乙不能构成教竣犯,B选项错误。\n丙煽动分裂国家,该行为被刑法分则单独规定为煽动\n分裂国家罪,C选项错误。丁教竣丈夫向他人索取贿\n赂,构成教暧犯。","k":"共同犯罪"},{"id":"2020-5","y":2020,"t":"单","s":"监狱司法工作人员甲接受在押人员乙的妻子 请托,在押送乙外出就医途中,违规打开乙的戒具,并 暗示乙逃跑。乙成功逃跑后,甲收受了乙妻所送的50 万元。对此,下列说法中正确的是()。","o":["对甲按私放在押人员罪和受贿罪并罚","对甲按脱逃罪(共犯)和受贿罪并罚","对甲按私放在押人员罪和受贿罪从一重处断","对甲按脱逃罪(共犯)和受贿罪从一重处断"],"a":"A","e":"甲作为司法工作人员,利用职务便利私\n自将在押人员乙放走,致使其逃离监管,构成私放在\n押人员罪;接受乙的妻子的请托并收受50万元贿赂,\n构成受贿罪。2016年《最高人民法院、最高人民检察\n院关于办理贪污贿赂刑事案件适用法律若干问题的\n解释》第17条规定:\n\"国家工作人员利用职务上的便\n利,收受他人财物,为他人谋取利益,同时构成受贿罪\n和刑法分则第三章第三节、第九章规定的渎职犯罪\n的,除刑法另有规定外,以受贿罪和渎职犯罪数罪并\n罚。\"在渎职罪中,收受贿赂又犯徇私枉法罪,民事、行\n政枉法裁判罪,执行判决、裁定失职罪,执行判决、裁\n定滥用职权罪,择一重罪定罪处罚,其他的都是数罪\n并罚,A选项正确,BCD选项错误。","k":"共同犯罪"},{"id":"2020-6","y":2020,"t":"单","s":"下列关于继续犯的理解中,正确的是(","o":["继续犯属于法定的一罪","非法拘禁罪是典型的继续犯","继续犯的追诉时效从犯罪之日起计算","继续犯的不法状态发生于不法行为结束之后"],"a":"B","e":"继续犯属千实质的一罪,A选项错误。\n继续犯是指作用于同一对象的一个犯罪行为从着手\n实行到实行终了,犯罪行为与不法状态在一定时间内\n处千继续状态的犯罪。非法拘禁罪是非法将他人拘\n禁,在释放之前,非法拘禁行为和他人身体遭受非法\n拘禁的状态处于继续状态之中,因此非法拘禁罪是典\n型的继续犯,B选项正确,D选项错误。继续犯追诉\n时效的起算时间从犯罪行为终了之日起计算,C选项\n错误。","k":"共同犯罪"},{"id":"2021-11","y":2021,"t":"单","s":"下列对于首要分子的理解中,正确的是 )","o":["首要分子只存在于共同犯罪之中","主犯不一定是首要分子,首要分子不一定是 主犯","主犯一定是首要分子","首要分子一定是主犯"],"a":"B","e":"首要分子不是只存在于共同犯罪中,因\n为有些聚众犯罪只处罚首要分子,A项错误。主犯与\n首要分子是交叉关系,主犯不一定是首要分子,首要\n分子不一定是主犯,B项正确,CD项错误。本题选B。","k":"共同犯罪"},{"id":"2021-19","y":2021,"t":"单","s":"某国有资本参股公司财务总监甲(非国家工 作人员)勾结该公司董事乙(国家工作人员),分别利 用各自的职务便利,共同将公司财物占为己有,数额 特别巨大。对甲、乙行为性质的认定,正确的是","o":["按照主犯的犯罪性质定罪","按照甲、乙的犯罪性质分别定罪","按照甲的身份性质定罪","按照乙的身份性质定罪"],"a":"A","e":"根据司法解释规定,公司、企业或者其\n他单位中,不具有国家工作人员身份的人与国家工作\n人员勾结,分别利用各自的职务便利,共同将本单位\n财物非法占为已有的,按照主犯的犯罪性质定罪。本\n题中,甲是不具有国家工作人员身份的人,与国家工\n作人员乙勾结,分别利用各自的职务便利,共同将公\n司财物占为已有,应按照主犯的犯罪性质定罪,A项\n正确。","k":"共同犯罪"},{"id":"2022-16","y":2022,"t":"单","s":"下列行为人中,应认定为走私毒品罪共犯的是","o":["包庇走私毒品的犯罪分子的缉毒人员甲","被胁迫帮助贩毒分子运送毒品人境的乙","为走私毒品的犯罪分子隐瞒犯罪所得的丙","非法携带大量用于制造毒品的原料出境的丁"],"a":"B","e":"走私、贩卖、运输、制造毒品罪是指明知\n是毒品而故意实施走私、贩卖、运输、制造的行为。甲\n作为缉毒人员而包庇走私毒品的犯罪分子,应当以包\n庇毒品犯罪分子罪从重处罚。A选项错误。乙受胁\n迫而帮助贩毒分子运送毒品入境,属于走私毒品罪的\n胁从犯。胁从犯属于共犯的一种。B选项正确。毒\n品犯罪属于洗钱罪的上游犯罪中的一种,丙为走私毒\n品的犯罪分子隐瞒犯罪所得,构成洗钱罪。C选项错\n误。丁非法携带大量用于制造毒品的原料出境的行","k":"共同犯罪"},{"id":"2022-41","y":2022,"t":"多","s":"下列行为人中,应认定为主犯的有","o":["诈骗集团的骨干成员","教咬13岁少年杀人后抛尸的成年人","遭暴力胁迫实施抢劫行为的犯罪分子","聚众扰乱公共场所秩序罪的首要分子"],"a":"AB","e":"主犯,指组织、领导犯罪集团进行犯罪适度放宽。故本题选择ABCD。\n活动的或者在共同犯罪中起主要作用的犯罪分子。\n具体包括:(1)组织、领导犯罪集团进行犯罪活动的\n首要分子;(2)在犯罪集团或者一般共同犯罪中起主\n要作用的犯罪分子。诈骗集团的骨干成员属于在犯\n罪集团中起主要作用的犯罪分子,为主犯。A选项正\n确。对教唆犯按照其在共同犯罪中所起的作用处罚,\n起主要作用的,按主犯处罚;仅起到次要作用的,按从\n犯处罚。教唆13岁少年杀人后抛户的成年人显然起\n到了主要作用,为主犯。B选项正确。遭暴力胁迫实\n施抢劫行为的犯罪分子属于胁从犯。C选项错误。\n聚众犯罪中的首要分子未必都是主犯,聚众扰乱公共\n场所秩序罪只有聚众者才构成犯罪,如果聚众者只有\n一人,则此罪不是严格意义上的共同犯罪,无所谓主\n犯。D选项错误。故本题选择AB。","k":"共同犯罪"},{"id":"2024-14","y":2024,"t":"单","s":"下列选项中可以认定为主犯的是()","o":["主动提出开车送朋友到他人家中盗窃的甲","受他人蛊惑,积极实施扰乱公共场所秩序行为的乙","在组织领导传销活动犯罪中承担宣传职责的丙","为黑社会性质组织经营的公司提供租车服务的丁"],"a":"C","e":"","k":"共同犯罪"},{"id":"2025-6","y":2025,"t":"单","s":"下列选项中,成立共同犯罪的是( )","o":["商人甲低价收购徐某盗窃的贵重珠宝","毒贩乙在练歌房向过生日的顾客胡某出售冰毒","经理丙指使下属黄某打牌时故意输钱实施行贿","主播丁向“粉丝”郑某高价出售撬锁的方法"],"a":"C","e":"丙指使黄某行贿,二人有共同犯罪故意,成立共同犯罪,C 项正确。A 项是事后\n销赃,事前没有通谋,与徐某不构成共同犯罪,A 项错误。毒贩乙成立贩卖毒品罪,与顾客胡\n某不构成共同犯罪,B 项错误。丁单独构成传授犯罪方法罪,不与郑某构成共同犯罪,D 项错\n误。本题选C。","k":"共同犯罪"}]},{"sub":"刑法","name":"分则·妨害社会管理秩序罪","w":0.9,"L":16,"qs":[{"id":"2005-19","y":2005,"t":"单","s":"下列行为,不属于妨害公务罪的行为是(   )","o":["甲以暴力、威胁方法阻碍工商行政管理机关工作人员依法查处伪劣商品的行为","乙以暴力、威胁方法阻碍国有公司经理依法履行组织生产经营职责的行为","丙以暴力、威胁方法阻碍市人大代表依法执行代表职务的行为","在发生重大洪灾中,丁以暴力、威胁方法阻碍红十字会工作人员依法履行防疫职责的行为"],"a":"B","e":"根据刑法第277 条规定,下列任一行为均构成妨害公务罪:1以暴力、威胁方法阻碍国家机关工作\n人员依法执行职务;2以暴力、威胁方法阻碍各级人大代表依法执行代表职务;3在自然灾害和突发事件中,以暴\n力、威胁方法阻碍红十字会工作人员依法履行职责;4故意阻碍国家安全机关、公安机关依法执行国家安全工作任\n务,未使用暴力、威胁方法,造成严重后果。据此,选项ACD 构成妨害公务罪。选项B,国有公司经理不属于国家\n机关工作人员,因此不属于妨害公务罪。","k":"分则·妨害社会管理秩序罪"},{"id":"2017-17","y":2017,"t":"单","s":"下列选项中,在情节严重的情况下,应认定为 妨害公务罪的是()。","o":["甲多次煽动他人在镇政府门前广场非法聚集","乙为了解决医疗纠纷,带领多人封堵公立医院 大门","丙纠集多人打砸警车,阻止警察带走涉嫌诈骗 的丈夫","丁纠集多名亲友,在村口阻碍警察带走被收 买的儿童"],"a":"C","e":"妨害公务罪是指以暴力、威胁方法阻碍\n国家机关工作人员依法执行职务,阻碍人民代表大会\n代表依法执行代表职务,阻碍红十字会工作人员依法\n履行职责的行为,或者故意阻碍国家安全机关、公安\n机关依法执行国家安全工作任务,造成严重后果的行\n为。A项中甲煽动他人非法聚集,但没有以暴力、威\n胁方法阻碍国家机关工作人员依法执行职务,不成立\n妨害公务罪,而是成立组织、资助非法聚集罪。B项\n中乙带领多人封堵公立医院大门,聚众扰乱社会秩\n序,情节严重,致使医疗无法进行,成立聚众扰乱社会\n秩序罪。医疗机构不是国家机关,乙不成立妨害公务\n罪,B项错误。C项中丙采用暴力手段阻止警察带走\n涉嫌诈骗的丈夫,是故意阻碍公安机关依法执行公\n务,成立妨害公务罪,C项正确。D项丁阻碍警察带\n走被收买的儿童,成立聚众阻碍解救被收买的儿童\n罪,不成立妨害公务罪,D项错误。\n[特别说明l\nCD项涉及暴力干扰警察执法的\n问题。为进一步加强对袭警行为的预防、惩治,《刑\n法修正案(十一)》将刑法第277 条第5 款修改为:\n\"暴力袭击正在依法执行职务的人民警察的,处三年\n以下有期徒刑、拘役或者管制;使用枪支、管制刀具,\n或者以驾驶机动车撞击等手段,严重危及其人身安\n全的,处三年以上七年以下有期徒刑。\"《刑法修正案\n(十一)》对暴力袭击正在依法执行公务的人民警察\n的行为规定为袭警罪;同时,针对使用枪支、管制刀\n具或者驾驶机动车撞击等严重暴力袭警行为,规定\n更重的处罚。","k":"分则·妨害社会管理秩序罪"},{"id":"2018-20","y":2018,"t":"单","s":"下列选项中,应认定为寻衅滋事罪的是( )。","o":["因宅基地纠纷将邻居家电视机砸毁","因感清纠纷随意殴打路人情节恶劣","因债务纠纷率众人拿走债务人财物","因医患纠纷将主治医师困在办公室"],"a":"B","e":"寻衅滋事罪是指行为人为寻求刺激、发\n泄情绪逞强耍横等,无事生非,进行扰乱破坏,情节\n恶劣的行为。本题中,ACD项都是有具体针对目标,\n且有原因的行为,而不是为寻求刺激无事生非的行\n为,因此都不成立寻衅滋事罪。B项为了发泄情绪,\n随意殴打路人,情节恶劣,成立寻衅滋事罪。B项\n正确。","k":"分则·妨害社会管理秩序罪"},{"id":"2019-10","y":2019,"t":"单","s":"下列选项中,属于成立组织卖淫罪必须具备 的条件的是()。","o":["卖淫人员在三人以上","组织者在三人以上","非法获利数额巨大","设置固定的卖淫场所"],"a":"A","e":"组织卖淫罪是指以招募、雇佣、纠集等\n手段,管理或者控制他人卖淫,卖淫人员在三人以上\n的行为3 本题选A。组织卖淫罪对被组织的卖淫人\n员有人数要求,但对组织者人数并没有要求,为此B\n项错误。组织卖淫罪不要求非法获利巨大,C 项错\n误。组织卖淫罪没有设置固定卖淫场所的要求,可以\n设置固定卖淫场所,也可以没有固定的卖淫场所,比\n如在酒店门缝里面散发小卡片或者通过网络通信软\n件招嫖后到约定地点进行卖淫活动,为此D项错误。","k":"分则·妨害社会管理秩序罪"},{"id":"2020-15","y":2020,"t":"单","s":"甲因经营不善欠下巨额债务,为转移财产,与 朋友乙伪造甲向乙借款200万元的借款合同,让乙向 法院提起诉讼,第三人丙得知后申请参加诉讼。法院 经开庭审理查明,该借款合同属于甲、乙恶意伪造的 合同。甲的行为应认定为()。","o":["伪证罪","妨害作证罪","虚假诉讼罪","扰乱法庭秩序罪"],"a":"C","e":"虚假诉讼罪是指以捏造的事实提起民\n事诉讼,妨害司法秩序或者严重侵害他人合法权益的\n行为。甲为逃避债务,与朋友乙捏造借款合同提起虚\n假的诉讼,符合虚假诉讼罪的构成要件,C选项正确。\n伪证罪是指在刑事诉讼中,证人、鉴定人、记录人、翻\n译人对与案件有重要关系的情节,故意作虚假证明、\n鉴定、记录、翻译,意图陷害他人或者隐匿罪证的行\n为,A选项错误。妨害作证罪,是指采用暴力、威胁、\n贿买等方法阻止证人作证或者指使他人作伪证的行\n为,B选项错误。扰乱法庭秩序罪,是指以法定方式\n实施扰乱法庭秩序的行为,D选项错误。","k":"分则·妨害社会管理秩序罪"},{"id":"2020-20","y":2020,"t":"单","s":"甲毒瘾发作,委托乙到住在同一小区的毒贩 (另案处理)处代购毒品,并向乙支付了“劳务费”。 乙购买了2小包海洛因交给甲吸食。对此,下列说法 中正确的是()。","o":["甲构成贩卖毒品罪","乙构成贩卖毒品罪","乙构成非法持有毒品罪","甲、乙均不构成犯罪"],"a":"B","e":"甲买毒品是为了吸毒,不是为了贩卖毒\n品,不构成贩卖毒品罪,A选项错误。乙收取\n\" 劳务\n费\n\"帮吸毒的甲代购毒品,从中牟利,构成贩卖毒品\n罪,B选项正确,D选项错误。贩卖毒品必然持有毒\n品,不再定非法持有毒品罪,C选项错误。","k":"分则·妨害社会管理秩序罪"},{"id":"2021-18","y":2021,"t":"单","s":"甲从竞争对手的网络店铺大量虚假购买商 品,电商平台因此认定该店铺恶意刷单,并予以搜索 降权处理,导致该店铺的产品难以被消费者检索到, 造成经济损失35万余元。甲的行为应认定为()","o":["非法侵人计算机信息系统罪","损害商业信誉罪","不构成犯罪","破坏生产经营罪"],"a":"D","e":"破坏生产经营罪是指以泄愤、报复或者\n其他个人目的,破坏机器设备,残害牲畜或者以其他\n方法破坏生产经营的行为。本题中,甲大量虚假购买\n商品,营造虚假诚信的表象,目的是迷惑、误导消费\n者。甲主观上以报复和获利为目的,客观上导致搜索\n降权,削减电商生产经营的规模,致使其尤法正常生\n产经营。因此甲的行为构成破坏生产经营罪,D项\n正确。","k":"分则·妨害社会管理秩序罪"},{"id":"2022-44","y":2022,"t":"多","s":"司法机关在认定高空抛物行为人是否具有犯罪故意时,应结合行为人的生活阅历 及生活常识综合考量","o":["行为人对抛物场所的认识","行为人对抛物高度的认识","行为人对抛物时间的认识","行为人对所抛具体物品的认识"],"a":"ABCD","e":"高空抛物罪,是指从建筑物或者其他高\n空抛掷物品,情节严重的行为。根据《最高人民法院\n关于依法妥善审理高空抛物、坠物案件的意见》的规\n定,对于高空抛物行为,应当根据行为人的动机、抛物\n场所、抛掷物的情况以及造成的后果等因素,全面考\n量行为的社会危害程度,准确判断行为性质,正确适\n用罪名,准确裁量刑罚。成立此罪,要求对题中所述\n四项内容皆有一定认识:高度太低不成立,场所太偏\n不成立,特殊时间内(如凌晨等)不成立,特殊物品\n(如沙子、矿泉水等)不成立。故本题选择ABCD。","k":"分则·妨害社会管理秩序罪"},{"id":"2024-42","y":2024,"t":"多","s":"下列致使判决、裁定无法执行的情形中,属于拒不执行判决、裁定罪中有能力执行 而拒不执行,情节严重的有()","o":["被执行人隐藏财产","被执行人转移财产","担保人转让已向人民法院提供担保的财产","担保人故意毁坏已向人民法院提供担保的财产"],"a":"ABCD","e":"","k":"分则·妨害社会管理秩序罪"},{"id":"2024-45","y":2024,"t":"多","s":"位于河道上游的甲企业违规向河流中排放含有酸性有害物质的工业废水,严重污染 环境,位于下游的乙企业违规将含有碱性有害物质的废水排入河流,严重污染环境,两种废 水混合发生反应产生某种有毒物质致使多人重伤。对此,下列选项正确的有()","o":["甲企业的行为认定为污染环境罪(基本犯)","甲企业的行为认定为污染环境罪(结果加重犯)","乙企业的行为认定为污染环境罪 (基本犯)","乙企业的行为认定为污染环境罪(结果加重犯)"],"a":"BD","e":"","k":"分则·妨害社会管理秩序罪"},{"id":"2025-15","y":2025,"t":"单","s":"甲冒用购物网站买家身份进入网站内部评价系统,删改购物评价,后果严重。甲的行 为应认定为( )","o":["不构成犯罪","破坏计算机信息系统罪","非法利用信息网络罪","非法侵入计算机信息系统罪"],"a":"B","e":"破坏计算机信息系统罪是指违反国家规定,对计算机信息系统功能进行删除、修\n改、增加、干扰,造成计算机信息系统不能正常运行,后果严重的行为。本题中甲冒用身份进\n入网站内部评价系统,删改购物评价,属于对计算机信息系统数据的修改行为,且后果严重,\n\n构成破坏计算机信息系统罪,B 项正确。甲的具有严重的社会危害性,构成犯罪,A 项错误。\n非法利用信息网络罪主要针对利用信息网络设立用于违法犯罪活动的网站、通讯群组,或发布\n违法犯罪信息等行为,而甲的行为是直接侵入并修改数据,不构成非法利用信息网络罪,C 项\n错误。非法侵入计算机信息系统罪适用于侵入国家事务、国防建设、尖端科学技术领域的计算\n机信息系统,购物网站不属于这些特定领域,D 项错误。本题选B。","k":"分则·妨害社会管理秩序罪"},{"id":"2025-9","y":2025,"t":"单","s":"警察甲依法押解涉嫌招摇撞骗罪的王某,途中发现王某系自己的恩人,遂偷偷将其手铐 打开,放任王某借上厕所之机脱逃。甲的行为应认定为( )","o":["徇私枉法罪","私放在押人员罪","滥用职权罪","失职致使在押人员脱逃罪"],"a":"B","e":"私放在押人员罪是指司法工作人员利用职务上的便利,私放在押的犯罪嫌疑人、\n被告人或者罪犯的行为。甲作为警察,属于司法工作人员,在押解王某途中,故意打开手铐并\n放任王某脱逃,构成私放在押人员罪,B 项正确。甲是私放在押人员,不是枉法裁判,A 项错\n误。滥用职权罪是一般犯罪,私放在押人员罪是特别规定,特别法优于一般法,C 项错误。失\n职致使在押人员脱逃罪的主观方面是过失,甲是故意,不构成此罪,D 项错误。本题选B。","k":"分则·妨害社会管理秩序罪"},{"id":"2026-10","y":2026,"t":"单","s":"下列选项中,属于袭警罪规定的“暴力袭击”的是","o":["打砸警车危及警察人身安全","与警察有轻微肢体冲突","为摆脱警察抓捕实施挣脱行为","对警察实施辱骂、讽刺行为"],"a":"A","e":"袭警罪暴力袭击要求直接针对警察人身或警用装备、危及人身安全。打砸\n警车危及民警人身安全属于暴力袭击;\nB 轻微肢体冲突、C 单纯挣脱抓捕、D 辱骂均不属于刑法意义暴力袭击。","k":"分则·妨害社会管理秩序罪"},{"id":"2026-19","y":2026,"t":"单","s":"如甲在诉讼过程中出示当事人提供的不实证据,该行为应认定为","o":["不构成犯罪","伪证罪","辩护人伪造证据罪","帮助伪造证据罪"],"a":"C","e":"甲冒充辩护人,在诉讼中出示虚假证据,符合辩护人伪造证据罪主体要件\n(诉讼辩护人身份)。\nB 伪证罪主体是证人、鉴定人、记录人、翻译;D 帮助伪造证据主体不包含辩护\n人。","k":"分则·妨害社会管理秩序罪"},{"id":"2026-20","y":2026,"t":"单","s":"如甲将上述违法所得和其他合法财产共同用于投资,获利巨大。获利所得","o":["不应予以追缴","应全部追缴","应按份额追缴","应责令退赔"],"a":"B","e":"违法所得与合法财产混同投资产生的全部收益,均属于犯罪孳息,应当全\n\n部追缴。","k":"分则·妨害社会管理秩序罪"},{"id":"2026-43","y":2026,"t":"多","s":"2023 年,甲伪造某市人力资源和社会保障局劳动力管理专用章以及该市多家 建筑公司印章。2025 年,甲在该市多个公开招标工程项目中冒用上述建筑公司资 质,并使用伪造的劳动管理专用章制作若干虚假的社保缴费单,帮助乙围标并最 终中标,中标项目总金额1000 万元。对此,下列说法正确的有","o":["甲构成串通投标罪","甲的行为构成伪造公司印章罪","甲的行为构成伪造国家机关印章罪","对甲应从一重罪处断"],"a":"ABC","e":"伪造人社局印章=伪造国家机关印章;伪造建筑公司印章=伪造公司印章;\n帮助围标=串通投标罪;三行为触犯数罪,不属于牵连从一重,应数罪并罚,D\n错误。","k":"分则·妨害社会管理秩序罪"}]},{"sub":"刑法","name":"正当行为","w":0.8,"L":14,"qs":[{"id":"2006-21","y":2006,"t":"多","s":"关于正当防卫,下列表述中,正确的是(       )","o":["正当防卫的起因条件是有不法侵害行为发生","正当防卫的时间条件是不法侵害行为即将发生或者正在进行。特殊情况下,对已经结束的侵害也可以正当防卫","防卫的目的是为了保护合法权利免受不法侵害","正当防卫与防卫过当区别的关键在于是否明显超过必要限度造成重大损害"],"a":"ACD","e":"见正当防卫的成立条件,只有B 项说的是事后防卫不符合题意可排除。","k":"正当行为"},{"id":"2008-5","y":2008,"t":"单","s":"消防队员甲在执行灭火任务中,担心被大火毁容,逃离火灾现场。甲的行为(  )。","o":["属于紧急避险","属于紧急避险过当","不成立紧急避险","属于假想避险"],"a":"C","e":"根据《刑法》第21 条第3 款,关于避免本人危险的规定,不适用于职务上、业务上负有特定责任的人。\n消防队员是\"职务上、业务上负有特定责任的人\"故其行为不能成立紧急避险。本题选C。","k":"正当行为"},{"id":"2011-5","y":2011,"t":"单","s":"甲酒后到一洗浴中心进行足浴,发现为其洗脚 的女服务员乙很漂亮,于是提出要与乙发生性行为, 遭乙拒绝。甲便采取暴力欲强奸乙。乙在反抗中用 修脚刀刺死了甲。乙的行为属于()。","o":["正当防卫","紧急避险","故意杀人","故意伤害致人死亡"],"a":"A","e":"《刑法》第20条规定:\"对正在进行行\n凶、杀人、抢劫、强奸、绑架以及其他严重危及人身安\n全的暴力犯罪,采取防卫行为,造成不法侵害人伤亡\n的,不属于防卫过当,不负刑事责任。\n\" 这就是特别防\n卫的规定。在本题中,虽然乙造成了甲的死亡,但是\n乙的防卫行为所针对的是甲正在实施的严重危及人\n身安全的强奸这一暴力行为,在这种情况下,即使造\n成不法侵害人甲的死亡,也不认为乙是防卫过当,仍\n应成立正当防卫。故选A。关于特别防卫需要说明\n的是,立法规定特别防卫,更多的是出于服务司法实\n践的考虑,其实仔细分析,特别防卫就是一般的正当\n防卫,它不仅符合正当防卫的起因条件、时间条件、对\n象条件、主观条件,其实它也符合正当防卫的限度条\n件。特别防卫的对象是正在进行的严重危及人身安\n全的暴力犯罪,所以在这种情况下,哪怕造成了不法\n侵害人的伤亡,也同样符合限度条件,并没有明显超\n过必要限度。立法上这样规定,更多的是便于司法机\n关在实践中区分正当防卫和防卫过当,以防把题干中\n所描述的行为定性为防卫过当,起到一个强调和提示\n的作用。我们可以说,即使法律没有这样规定,与题\n干中相类似的行为也应该被认定为正当防卫。希望\n通过这一解释,考生能对特别防卫有更深层次的\n理解。","k":"正当行为"},{"id":"2015-19","y":2015,"t":"单","s":"甲在医院缴费单上加盖自己私刻的收费章, 逃避支付妻子透析治疗费用17万余元。甲的行为 )。","o":["按诈骗罪定罪处罚.","按伪造事业单位印章罪定罪处罚","按合同诈骗罪定罪处罚","成立紧急避险"],"a":"A","e":"诈骗罪是指以非法占有为目的,用虚构\n事实或者隐瞒真相的方法,骗取数额较大的公私财物\n的行为。甲在医院缴费单上加盖自己私刻的收费章,\n逃避支付妻子透析治疗费用17万余元的行为属于以\n非法占有为目的,采用欺骗方法骗取医院财物,客观\n上构成诈骗罪。伪造公司、企业、事业单位、人民团体\n印章罪是指,伪造公司、企业、事业单位、人民团体印\n章的行为。甲私自刻制医院收费章,在客观上构成伪\n造事业单位印章罪。但是,此罪和诈骗罪之间是牵连\n关系,伪造事业单位印章是手段,诈骗行为是目的,只\n需要以诈骗罪一罪定罪处罚即可,A正确,B错误。\n合同诈骗罪要求行为必须发生在签订、履行合同过程\n中,而且必须是经济类合同,所以,甲不成立合同诈骗\n罪,C错误。紧急避险要求有正在发生的危险,题中\n无危险存在,也与紧急避险无关,D错误。","k":"正当行为"},{"id":"2016-10","y":2016,"t":"单","s":"张某深夜撬门进人甲家,被甲安装在保险柜上 的防盗装置击中头部受轻伤。甲的行为属于(","o":["事先防卫","正当防卫","假想防卫","防卫过当"],"a":"B","e":"正当防卫的起因条件是有不法侵害行\n为发生,时间条件是对正在进行的不法侵害进行防\n卫,对象条件是防卫行为必须针对不法侵害者本人施\n行,主观条件是防卫必须基于保护合法权利免受不法\n侵害的目的,限度条件是正当防卫不能明显超过必要\n限度造成重大损害。张某深夜撬门进入甲家,这时不\n法侵害行为已经发生,甲安装在保险柜上的防盗装置\n击中甲头部,是对正在进行的不法侵害进行防卫,而\n且是针对张某本人,目的是为了保护甲的合法财产,\n该防盗装置使张某头部受轻伤,防卫没有明显超过必\n要限度,所以甲的行为是正当防卫,被安装在保险柜\n上的防盗装置是防卫工具,B选项正确。\n事先防卫是指不法侵害尚未开始而对其进行防\n卫,本题中,张某已经非法进入甲家,不法侵害已经开\n始,不是事先防卫,A选项错误。假想防卫是指不存\n\n在不法侵害,行为人误认为存在而对误认的\n\"不法侵\n害人\n\"实行防卫。本题中,张某深夜撬门进入甲家,不\n法侵害确实存在,而不是误认为存在,所以不是假想\n防卫,C选项错误。甲安装的防盗装置击中张某的头\n部,使其受轻伤,没有明显超过限度造成重大伤害,所\n以不是防卫过当,D选项错误。","k":"正当行为"},{"id":"2017-8","y":2017,"t":"单","s":"甲下夜班回家,目睹一男将一女强行拉进小 巷,女子大叫:“放开我!”甲以为该男子欲行不轨,遂 冲上去,用砖头将男子打成轻伤。事后查明,该男女 系夫妻关系,事发时男子阻止女子回娘家。甲的行为 成立()。","o":["事前防卫","假想防卫","正当防卫","防卫过当"],"a":"B","e":"正当防卫是指为了使公共利益、本人或\n者他人的人身和其他权利免受正在进行的不法侵害,\n而对实施侵害的人所采取的防卫行为。正当防卫要\n求不法侵害正在发生。本题中,男子与女子是夫妻关\n系,男子正在阻止女子回娘家,不是不法侵害,事前防\n卫、正当防卫、防卫过当都要求不法侵害真实存在,因\n此ACD项错误。假想防卫是指不存在不法侵害,但\n行为人误认为存在而对误认的\n\" 不法侵害人\n\" 实施了\n\"防卫\n\"行为。本题中,男子没有不法侵害女子,但是\n甲误认为男子欲行不轨,所以对男子采取\n\"防卫\n\" 行\n为,用砖头将男子打伤,甲的行为是假想防卫,B项\n正确。","k":"正当行为"},{"id":"2019-15","y":2019,"t":"单","s":"债权人王某伙同他人将债务人甲关在办公室 中长达十几个小时并持续辱骂,甲求救未果后持水果 )。 刀将王某刺成重伤。甲的行为应认定为(","o":["防卫过当","假想防卫","偶然防卫","正当防卫"],"a":"A","e":"正当防卫,指为了使公共利益、本人或\n者他人的人身和其他权利免受正在进行的不法侵害,\n而对实施侵害的人所采取的合理的防卫行为。防卫\n过当,指正当防卫明显超过了必要限度造成重大损害\n的行为。本题中,王某等人将甲非法拘禁并持续辱\n骂,存在正在进行的不法侵害,因此,甲的行为不属于\n假想防卫,B项错误。甲为了维护自己的合法权利采\n取防卫行为,具有防卫意图,不属于偶然防卫,C项错\n误。王某等人只是将甲关在办公室并持续辱骂,并没\n有严重危及甲人身安全的行为,甲持水果刀将王某刺\n成重伤的行为,明显超过了必要限度,造成了重大损\n害,因此,甲的行为应认定为防卫过当,A 项正确。非\n法拘禁侵犯人身,但尚未达到严重危及人身安全的程\n度,不属千暴力犯罪,所以不成立特别防卫,D选项错\n误。本题是结合\n\"于欢案\n\" 考查防卫过当知识点。","k":"正当行为"},{"id":"2019-20","y":2019,"t":"单","s":"甲饥饿难耐,夜入位于高层住宅一楼的小超 市行窃,尚未得手便惊醒了一直住在超市里的店主夫 妇。甲用超市内销售的菜刀砍死前来查看的店主,砍 伤店主妻子并点燃现场易燃物后逃离。火势在蔓延 之前被邻居扑灭,但浓烟导致店主妻子室息死亡。下 列对于甲行为性质的认定,正确的是()。","o":["甲进入超市实施盗窃,应属于紧急避险","甲进入超市实施盗窃,不属于人户盗窃","甲用刀砍死店主,应认定为故意杀人罪","甲放火致人死亡,应认定为放火罪一罪"],"a":"D","e":"紧急避险,指为了使本人利益、本人或\n者他人的人身和其他权利免受正在发生的危险,不得\n己而采取的损害另一较小合法利益的行为。紧急避\n险的限制条件是在迫不得己的情况下实施,如果有其\n他合法方法可以避险,则不可以实施紧急避险损害他\n人的合法权益。本案中甲虽饥饿难耐,但完全有其他\n合法方法能解决,其实施的盗窃行为显然不属千迫不\n得己的情况,不成立紧急避险。A项错误。\n根据《关于审理抢劫案件具体应用法律若干问题\n的解释》第1条的规定,\n\"户\n\" 是指他人生活的与外界\n相对隔离的住所,包括封闭的院落、牧民的帐篷、渔民\n作为家庭生活场所的渔船、为生活租用的房屋;根据\n《关千审理抢劫、抢夺刑事案件适用法律若干问题的\n意见》第1条的规定,\"户\n\"是指住所,其特征表现为供\n他人家庭生活和与外界相对隔离两个方面,前者为功\n能特征,后者为场所特征。实践中,对于商住两用的\n房屋性质,应根据行为人实施盗窃时该房屋所处的状\n态确定其是否属千\n\"户\n\" 。\n一般来说,当处于营业状态\n时,该场所是对外开放的,不具备\n\"户\n\" 的功能特征,不\n应视为入户盗窃。当夜间已处于关门歇业、休息的状\n态时,该场所不对外开放,系作为生活起居之用,具备\n\"户\n\" 的场所特征和功能特征,此时属千入户盗窃。本\n案中,甲夜入高层住宅楼一楼超市行窃时已经不属千\n营业状态,而是作为生活起居之用,故应属于入户盗\n窃。B项说法错误。\n《中华人民共和国刑法》第269条规定:\"犯盗窃、\n诈骗抢夺罪,为窝藏赃物、抗拒抓捕或者毁灭罪证而\n当场使用暴力或者以暴力相威胁的,按照刑法第二百\n六十三条(即抢劫罪)的规定定罪处罚。\n\" 甲行窃尚未\n得手惊醒了店主夫妇,并用超市内销售的菜刀砍死\n前来查看的店主的行为完全符合转化型抢劫的构成\n特征。对甲应转化为抢劫罪,不再认定为故意杀人\n罪,C项说法错误。\nD项正确,放火罪是指故意放火焚烧公私财物,\n危害公共安全的行为。放火罪是危险犯,指行为人着\n手实施了放火的行为,并已将放火的对象物点燃,并\n具有造成严重后果的危险性。甲点燃现场易燃物后\n逃离,即使火势在蔓延之前被邻居扑灭,但客观上具\n有造成严重后果的危险性,且浓烟导致店主妻子窒息\n死亡。因此,对于甲放火致人死亡的,成立放火罪一\n罪,浓烟使女主人窒息而死属于放火罪的结果加重\n情节。\n本题中,考生在判断每个选项的时候,应该就选\n项给出的条件而进行分析,有的考生可能认为本题中\n的甲应该以抢劫罪和放火罪并罚,这个考虑是没错\n的,但选项D仅仅是就\n\" 甲放火致人死亡\n\" 要求考生\n判断应认定为放火罪一罪是否正确,而不要让考生判\n断甲在本题中的所有行为构成何种或者儿种犯罪。","k":"正当行为"},{"id":"2020-2","y":2020,"t":"单","s":"假想防卫不属于正当防卫,主要是因为欠缺正 当防卫成立的()。","o":["主观条件","起因条件","限度条件","时间条件"],"a":"B","e":"假想防卫是指不存在不法侵害,行为人\n误以为存在不法侵害而实行防卫,其欠缺正当防卫成\n立的起因条件,B选项正确,ACD选项错误。","k":"正当行为"},{"id":"2022-20","y":2022,"t":"单","s":"假设三∶甲为防止罪行败露,用双手紧扼店主颈部,店主随手抓起身旁健身用的 哑铃,将甲砸死。对此,下列选项中正确的是","o":["店主需要承担刑事责任及民事赔偿责任","店主不需要承担刑事责任及民事赔偿责任","店主需要承担刑事责任但不需要承担民事赔偿责任","店主不需要承担刑事责任但需要承担民事赔偿责任"],"a":"B","e":"者他人的人身和其他权利免受正在进行的不法侵害,\n而对实施侵害的人所采取的合理的防卫行为。此外,\n《刑法》第20条规定:\"对正在进行行凶、杀人、抢劫、\n强奸、绑架以及其他严重危及人身安全的暴力犯罪,\n采取防卫行为,造成不法侵害人伤亡的,不属于防卫\n过当,不负刑事责任。\"甲用双手紧扼店主颈部,店主\n的人身权利正在遭受不法侵害,而且属于严重危及人\n身安全的暴力犯罪,店主采取防卫行为,造成不法侵\n害人甲死亡,不属于防卫过当,不负刑事责任。《民法\n典》第181条规定:\"因正当防卫造成损害的,不承担\n民事责任。正当防卫超过必要的限度,造成不应有的\n损害的,正当防卫人应当承担适当的民事责任。\"店主\n的行为属于正当防卫且未超过必要的限度,因此,无\n须承担民事责任。B选项正确。","k":"正当行为"},{"id":"2025-41","y":2025,"t":"多","s":"下列关于紧急避险的理解,正确的有( )","o":["对于儿童实施的侵害行为进行反击,成立紧急避险","紧急避险行为与刑法总则规定的胁从犯存在本质区别","对于动物的侵袭不能实施正当防卫,只能实施紧急避险","业务上负有特定责任的人不能为避免本人的危险进行紧急避险"],"a":"BD","e":"对于无责任能力人(如儿童)实施的侵害行为,可以正当防卫,因为正当防卫针\n对的是客观不法侵害,不要求侵害人具有责任能力,A 项错误。紧急避险是合法行为,不构成\n犯罪;而胁从犯是被胁迫参加犯罪的人,属于犯罪形态,两者具有本质区别,B 项正确。对于\n动物的侵袭,既可以实施紧急避险,也可以实施正当防卫,因为动物可能受人的控制而实施侵\n袭,C 项错误。根据刑法的规定,紧急避险中关于避免本人危险的规定,不适用于职务上、业\n务上负有特定责任的人,D 项正确。本题选BD。","k":"正当行为"},{"id":"2025-44","y":2025,"t":"多","s":"下列选项中,应当认定为自首的有( )","o":["甲交通肇事逃逸后自动投案,如实供述自己的罪行","乙醉驾被现场查获,经允许离开,后主动到案并如实供述自己的罪行","丙致人死亡后自动投案,如实供述自己的罪行但辩称自己的行为属于正当防卫","丁涉嫌窝藏罪被拘传到案后查无实据,主动如实供述组织出卖人体器官的罪行"],"a":"ACD","e":"根据司法解释的规定,交通肇事逃逸后自动投案,如实供述罪行的,应认定为自\n\n首,A 项正确。乙醉驾被现场查获,不能算是自动投案,不能认定为自首,B 项错误。犯罪人\n对行为性质的辩解不影响自首的认定,丙自动投案,如实供述自己的罪行,应认定为自首,C\n项正确。被采取强制措施的犯罪嫌疑人,如实供述司法机关还未掌握的本人其他罪行的,以自\n首论。丁供述的组织出卖人体器官罪与窝藏罪(窝藏罪亦查无实据)不同,司法机关尚未掌握,\n因此应认定为自首,D 项正确。本题选ACD。","k":"正当行为"},{"id":"2025-5","y":2025,"t":"单","s":"甲与霸占自己座位拒不离开的乘客刘某当众发生争吵,刘某挥拳猛击甲,甲用随身携带 的背包还击,致刘某轻伤。甲的行为应认定为( )","o":["正当防卫","自救行为","故意伤害罪","寻衅滋事罪"],"a":"A","e":"正当防卫是针对正在进行的不法侵害进行的反击。本题中刘某挥拳猛击甲,是不\n法侵害,甲用随身携带的背包还击,属于正当防卫,防卫没有超过必要限度,不构成故意伤害\n罪,A 项正确,C 项错误。甲的行为是对不法侵害的反击,B 项错误。甲没有随意殴打他人,\n不构成寻衅滋事罪,D 项错误。本题选A。","k":"正当行为"},{"id":"2026-8","y":2026,"t":"单","s":"对于下列行为,不可以实行特别防卫的是","o":["以投毒方式杀人的甲","以绑架手段拐卖妇女的乙","以暴力手段抢劫爆炸物的丙","在人流密集的公共区域驾车冲撞的丁"],"a":"A","e":"特别防卫仅适用于行凶、杀人、抢劫、强奸、绑架等严重危及人身安全的\n暴力犯罪。投毒杀人属于非暴力手段,不能适用无过当防卫;\nB 暴力绑架拐卖、C 暴力抢劫爆炸物、D 驾车冲撞属于严重暴力危害人身安全,可\n特别防卫。","k":"正当行为"}]},{"sub":"刑法","name":"分则·危害国家安全罪","w":0.3,"L":7,"qs":[{"id":"2007-14","y":2007,"t":"单","s":"甲是国家机关工作人员,为其子开办公司筹措资金,应外国人乙的要求,潜入单位保密室,将一件国家机密级 文件复印后出卖给乙。甲的行为构成 (   ) 。","o":["买卖国家机关公文罪","故意泄露国家秘密罪","为境外窃取国家秘密罪","买卖国家机关公文罪和为境外窃取国家秘密罪"],"a":"C","e":"为境外窃取国家秘密罪 \n] 由于甲出卖给乙的是国家机密级文件,并非一般公文,因此排除 A、D。为境外窃 \n取国家秘密罪是指为境外的机构、组织、人员窃取、刺探、收买、非法提供国家秘密或者情 \n报的行为,而故意泄露国家秘密罪是指国家机关工作人员或者非国家机关工作人员违反保守 \n- 9 -\n\n \n \n更多考研精品资料,关注淘宝店铺:光速考研工作室 \n国家秘密法的规定,故意泄露国家秘密,情节严重的行为。、两个罪名的区别之一是前者 \n要求泄露的对象必须为境外机构或者人员,且无有关情节的具体要求:由于乙为外国人,故 \n答案为 C。","k":"分则·危害国家安全罪"},{"id":"2008-16","y":2008,"t":"单","s":"中国公民甲在境外被一外国间谍组织收买,接受该间谍组织指派,回国搜集某沿海军事基地情报。甲的行为构成(  )。","o":["间谍罪","为境外窃取、刺探国家秘密罪","非法提供国家秘密、情报罪","故意泄露国家秘密罪"],"a":"A","e":"根据《刑法》第110 条,所谓间谍罪,是指参加间谍组织、接受间谍组织及其代理人的任务,或者为\n敌人指示轰击目标 ,危害国家安全的行为。在本题中,甲的行为构成间谍罪。","k":"分则·危害国家安全罪"},{"id":"2012-18","y":2012,"t":"单","s":"国家机关工作人员甲通过电子邮件,将因工 作便利获悉的国家经济秘密发送给某境外机构。甲 的行为构成( )。","o":["间谍罪","非法获取国家秘密罪","故意泄露国家秘密罪","为境外非法提供国家秘密罪"],"a":"D","e":"间谍罪的客观表现为:(1)参加间谍组\n织或者接受间谍组织及其代理人的任务的。(2)为\n敌人指示轰击目标。本题中的行为不符合该罪的构\n成。《刑法》第282条规定,以窃取、刺探、收买方法,\n非法获取国家秘密的,构成非法获取国家秘密罪。\n《刑法》第398条规定,国家机关工作人员违反保守国\n家秘密法的规定,故意泄露国家秘密,情节严重的,构\n成故意泄露国家秘密罪。为境外的机构、组织、人员\n窃取、刺探、收买、非法提供国家秘密或者情报的,构\n成为境外窃取、刺探、收买非法提供国家秘密情报罪。\n故意泄漏国家秘密罪与为境外非法提供国家秘密罪\n最关键的区别在于:(1)侵犯的客体不同。前者侵犯\n的客体是国家的保密制度,而后者侵犯的客体是国家\n安全。(2)犯罪对象不完全相同。前者的对象是涉\n及国家安全和利益的国家秘密;而后者的对象除了国\n家秘密外,还包括除国家秘密以外的影响国家安全的\n情报。(3)犯罪的行为表现不同。前者在客观方面\n表现为,违反国家保密法规,将自己了解和掌握的国\n家秘密泄露给他人的行为,其行为的主要特征是泄露\n国家秘密;而后者在客观方面表现为,为境外的机构、\n组织、人员窃取、刺探、收买、非法提供国家秘密的行\n为,其法定行为方式是窃取、刺探、收买、非法提供。\n(4)构成犯罪的情节要求不同。前者要求泄露国家\n秘密的情节严重才能构成犯罪;而后者则在构成犯罪\n上没有情节的要求。(5)犯罪主体不同。前者的主\n体主要是国家机关工作人员;而后者的主体则为一般\n主体。综上可知,本题中的行为构成是为境外非法提\n供国家秘密情报罪。故选D。","k":"分则·危害国家安全罪"},{"id":"2017-9","y":2017,"t":"单","s":"下列选项中,不属于“应当”附加剥夺政治权 利的是())。","o":["危害公共安全的犯罪分子","被判处无期徒刑的犯罪分子","危害国家安全的犯罪分子","被判处死刑的犯罪分子"],"a":"A","e":"《刑法》第56条第1款规定:对于危害\n国家安全的犯罪分子应当附加剥夺政治权利;对于故\n意杀人、强奸、放火、爆炸、投毒、抢劫等严重破坏社会\n秩序的犯罪分子,可以附加剥夺政治权利。第57条\n第1款规定:对于被判处死刑、无期徒刑的犯罪分子,\n应当剥夺政治权利终身。《刑法》对危害公共安全的\n犯罪分子没有规定应当附加剥夺政治权利,本题\n选A。","k":"分则·危害国家安全罪"},{"id":"2019-7","y":2019,"t":"单","s":"甲为境外赌球网站担任代理,开设个人微信公 众号接受投注,情节严重。甲的行为应认定为()。","o":["帮助信息网络犯罪活动罪","赌博罪","非法经营罪","开设赌场罪"],"a":"D","e":"根据司法解释的规定,以营利为目的,\n在计算机网络上建立赌博网站,或者为赌博网站担任\n代理,接受投注的,构成开设赌场罪。本题中,甲为赌\n博网站担任代理,接受投注,成立开设赌场罪,D项正\n确。《刑法修正案(九)》增设帮助信息网络犯罪活动\n罪,针对明知他人利用信息网络实施犯罪,为其犯罪\n提供互联网接入、服务器托管、网络存储、通讯传输等\n技术支待,或者提供广告推广、支付结算等帮助的行\n为独立入罪,本题重点是甲接受赌球投注,而非仅仅\n提供网络帮助,故A不选。赌博罪是指以营利为目\n的,聚众赌博或者以赌博为业的行为,赌博罪行为人\n参与赌博,而题干信息没有提及甲是否赌博,为此不\n选B。开设赌场罪的人自己如参与赌博,并以赌博为\n业的,可以开设赌场罪和赌博罪并罚,就题干本身而\n言,甲不构成赌博罪而仅仅构成开设赌场罪。非法经\n营罪是指违反国家规定,非法经营,扰乱市场秩序,情\n节严重的行为。本题的情形不属于法律和司法解释\n规定的非法经营行为,为此C不选。","k":"分则·危害国家安全罪"},{"id":"2024-10","y":2024,"t":"单","s":"属于危险犯的是()","o":["逃脱罪","破坏交通工具罪","交通肇事罪","煽动分裂国家罪"],"a":"B","e":"","k":"分则·危害国家安全罪"},{"id":"2024-13","y":2024,"t":"单","s":"甲定期使用专业照相器材拍摄军港停泊的军舰,并将拍摄的照片发送到某“军迷群”进行炫耀,事后查明,涉事照片中大量绝密级国家秘密被隐藏于“军迷群”中的境外人员获得,甲的行为应认定为()","o":["间谍罪","故意泄漏国家秘密罪","非法获取国家秘密罪","为境外刺探、非法提供国家秘密罪"],"a":"C","e":"","k":"分则·危害国家安全罪"}]},{"sub":"刑法","name":"分则·贪污贿赂罪","w":0.5,"L":7,"qs":[{"id":"2008-25","y":2008,"t":"多","s":"下列行为中,构成挪用公款罪的有(     )。","o":["某国有公司经理将本单位公款 10 万元借给亲友使用半年","某国有公司经理以个人名义将本单位公款 10 万元供另一公司使用半年","某高校校长为方便学生实习,个人决定以单位名义将本校公款 100 万元借给某设计研究院使用半年","某村异委员会主任个人决定,将社会捐助的用于该村灾民房屋重建的水泥 50 吨借给其表弟经营建材业务半年 三、简答题(26、27 小题,每小题 6 分"],"a":"ABD","e":"根据全国人大常委会的立法解释,有下列情形之一的,属于挪用公款\"归个人使用\";(1)将公\n款供本人、亲友或者其他自然人使用的;(2)以个人名义将公款供其他单位使用的;(3)个人决定以单位名义将\n公款供其他单位使用,谋取个人利益的。选项C,高校校长尽管个人决定以单位名义将本校公款100 万元借给某设\n计研究院使用半年,但并非谋取个人利益,而是\"为方便学生实习\",故不属于\"挪用公款归个人使用\",不构成\n挪用公款罪。而选项A、B、D 构成\"挪用公款归个人使用\"。一般地,挪用公款归个人使用,数额较大、超过3 个\n月未还的,属于构成挪用公款罪的情形之一。故选项A、B 构成挪用公款罪。根据《刑法》第384 条第2 款,挪用用\n于救灾的款物归个人使用的,也可构成挪用公款罪,并从重处罚,选项D 尽管挪有的是水泥,但属于救灾财物,故\n仍可构成挪用公款罪。 \n三、简答题","k":"分则·贪污贿赂罪"},{"id":"2013-45","y":2013,"t":"多","s":"下列选项中,属于挪用公款“归个人使用”的 有()。","o":["甲个人决定以单位名义将公款供一有限责任 公司使用,自己未从中获利","乙以单位名义将公款供某街道办企业使用,自 己从中收取利息","丙以个人名义将公款供某国有企业使用,自己 未从中获利","丁将公款借给朋友,供该朋友的孩子出国 留学"],"a":"BCD","e":"根据相关司法解释,所谓挪用公款归个\n人使用是指:(1)将公款供本人、亲友或者其他自然\n人使用的。(2) 以个人名义将公款供其他单位使用\n的。(3) 个人决定以单位名义将公款供其他单位使\n用,谋取个人利益的。A选项是个人决定以单位名义\n将公款供其他单位使用,但是没有谋求个人利益。故\n不成立挪用公款归个人使用。B选项符合个人决定\n以单位名义将公款供其他单位使用,谋取个人利益。\nC选项中丙虽然没有谋求个人利益,但是以个人名义\n\n将公款供其他单位使用的,也属于挪用公款归个人使\n用;D选项中丁属千将公款供本人、亲友或者其他自\n然人使用。关于挪用公款归个人使用的含义,在近几\n年的真题中反复出现,不排除接下来在答题中再次考\n查的可能性,应重点掌握。","k":"分则·贪污贿赂罪"},{"id":"2016-14","y":2016,"t":"单","s":"法官甲违背事实和法律,判决赵某的儿子无 罪。事后,赵某按照和甲事前的约定,将5万元现金 送给甲的妻子乙,乙打电话向甲问明情况后收下现 金。关于甲、乙的行为,判断正确的是()。","o":["甲只构成徇私枉法罪,乙构成受贿罪","甲只构成徇私枉法罪,乙构成利用影响力受 贿罪","甲构成徇私枉法罪和受贿罪,乙构成受贿罪","甲构成受贿罪,乙不构成犯罪"],"a":"C","e":"根据刑法第399条第\n一款的规定,司法\n工作人员徇私枉法,在刑事审判活动中故意违背事实\n和法律作枉法裁判的,构成徇私枉法罪。法官甲违背\n事实和法律,判决赵某的儿子无罪,其行为构成徇私\n枉法罪。事后,甲通过妻子乙收受赵某的贿赂,成立\n\n受贿罪。乙在打电话向甲问明情况后收受赵某所送\n现金,是受贿罪的共犯。故甲构成徇私枉法罪和受贿\n罪,乙构成受贿罪,选C,ABD选项错误。\n[点评l\n根据刑法第399条第四款的规定,司法\n工作人员收受贿赂,徇私枉法的,依照处罚较重的规\n定定罪处罚。本题中,甲构成徇私枉法罪和受贿罪,\n但是在法院判决时,只依照处罚较重的规定定罪处\n罚。要仔细审题,分清\n\"认定\n\" 和\n\" 构成\n\"的区别。","k":"分则·贪污贿赂罪"},{"id":"2017-18","y":2017,"t":"单","s":"甲(建委主任)与妻子乙商议后,由乙出面收 受请托人现金300万元,甲为请托人办理建筑审批手 续。乙的行为()。","o":["构成受贿罪","构成利用影响力受贿罪","不构成犯罪","构成受贿罪和利用影响力受贿罪"],"a":"A","e":"l\n受贿罪是指国家工作人员利用职务上\n的便利,索取他人财物,或者非法收受他人财物,为他\n人谋取利益的行为。与国家工作人员共谋,共同受贿\n的,以受贿罪的共犯论处。本题中,甲是国家机关工\n作人员,其妻子乙与其共谋非法收受他人财物,甲为\n请托人谋取利益,甲乙成立受贿罪的共犯,A项正确,\nC项错误。利用影响力受贿罪是指国家工作人员的\n近亲属或者其他与该国家工作人员关系密切的人,通\n过该国家工作人员职务上的行为,或者利用该国家工\n作人员职权或者地位形成的便利条件,通过其他国家\n工作人员职务上的行为,为请托人谋取不正当利益,\n索取请托人或者收受请托人财物,数额较大或者有其\n他较重情节的行为,或者离职的国家工作人员或者其\n近亲属以及与其关系密切的人,利用该离职的国家工\n作人员原职权或者地位形成的便利条件,通过其他工\n作人员职务上的行为,为请托人谋取不正当利益,索\n取或者收受请托人财物,数额较大或者有其他较重情\n节的行为。利用影响力受贿罪中,行为人与国家工作\n人员没有受贿的共谋,但是本题中乙与甲共谋,由甲\n利用自己职务上的便利为请托人谋取利益,所以乙不\n成立利用影响力受贿罪,BD项错误。","k":"分则·贪污贿赂罪"},{"id":"2019-18","y":2019,"t":"单","s":"国有公司负责人甲的下列行为,应当认定为 挪用公款归个人使用的是()。","o":["经单位集体决定后将公款供其他私人公司 使用","经单位集体决定后将公款供个人承包企业 使用","以个人名义将公款供其他国有资本控股企业 使用","个人决定以单位名义将公款供其他单位使用 但没有谋取个人利益"],"a":"C","e":"根据立法解释的规定,有下列情形之一\n的属于挪用公款\n\" 归个人使用\n\" :(一)将公款供本\n人亲友或者其他自然人使用的;(二)以个人名义将\n公款供其他单位使用的;(三)个人决定以单位名义\n将公款供其他单位使用,谋取个人利益的。C项以个\n人名义将公款供其他单位使用,符合立法解释第(二)\n项的规定,应认定为挪用公款归个人使用。本题选\nC。AB项是经单位决定的,且使用对象不是自然人,\n不符合立法解释的规定,不选。D项个人决定以单位\n名义将公款供其他单位使用,但是没有谋取个人利\n益,不符合立法解释第(三)项的规定,不选。","k":"分则·贪污贿赂罪"},{"id":"2019-43","y":2019,"t":"多","s":"下列人员中,利用职务上的便利,非法收受他 人财物为他人谋取利益,数额较大,可以构成非国家 工作人员受贿罪的有()。","o":["公立医院的医生","村民委员会主任","工程承包队队长","文艺演出筹委会主任"],"a":"ABCD","e":"非国家工作人员受贿罪是公司、企业或\n者其他单位的工作人员利用职务上的便利,索取他人\n财物或者非法收受他人财物,为他人谋取利益,数额\n较大的行为。本题主要看选项是否构成非国家工作\n人员受贿罪的主体。\n选项A 公立医院的医生一般属于非国家工作人\n员,公立医院的主要领导比如院长等具有一定公权力\n时才属于国家工作人员,因此,公立医院的医生可能\n构成非国家工作人员受贿罪,选项A当选;选项B 村\n民委员会属千自治组织,因此,村党支部书记、村民委\n员会主任都不属于国家工作人员,但是根据全国人民\n代表大会常务委员会关于《中华人民共和国刑法》第\n93条第2款的解释释义:村民委员会等村基层组织人\n员协助人民政府从事下列行政管理工作,属于刑法第\n\n九十三条第二款规定的\n\"其他依照法律从事公务的人\n员\n\" :(一)救灾抢险、防汛、优抚扶贫移民救济款\n物的管理;(二)社会捐助公益事业款物的管理;\n(三)国有土地的经营和管理;(四)土地征用补偿费\n用的管理;(五)代征、代缴税款;(六)有关计划生\n育、户籍、征兵工作;(七)协助人民政府从事的其他\n行政管理工作。如果村委会组织人员从事以上工作\n的时候,是以国家工作人员论的。因此,选项B 可构\n成非国家工作人员受贿罪,选项B 当选;\n\"公司、企业\n或者其他单位\n\"中的其他单位,既包括事业单位、社会\n团体,村民委员会、居民委员会、村民小组等常设性组\n织,又包括为组织体育赛事、文艺演出或者其他正当活\n动而成立的组委会、筹委会、工程承包队等非常设性组\n织。选项C文艺演出委员会与工程承包队都属于其他\n单位中的非常设性组织,因此,工程承包队队长和文艺\n演出委员会主任可能构成非国家工作人员受贿罪。故\n选ABCD。注意本题间的是\n\" 非国家工作人员\n\",虽然\n上述主体在某些情况下可能属于国家工作人员,但他\n们在一般情况下都属千\n\" 非国家工作人员\n\" 。","k":"分则·贪污贿赂罪"},{"id":"2021-14","y":2021,"t":"单","s":"甲(市政府工作人员)接受请托人乙的30万 元,通过妹夫刘某(市公安局干警)违规撤销了对乙的 网上追逃信息。甲的行为应认定为()","o":["介绍贿赂罪","利用影响力受贿罪","滥用职权罪","受贿罪"],"a":"B","e":"利用影响力受贿罪是指国家工作人员\n的近亲属或者其他与该国家工作人员关系密切的人,\n通过该国家工作人员职务上的行为,或者利用该国家\n工作人员职权或者地位形成的便利条件,通过其他国\n家工作人员职务上的行为,为请托人谋取不正当利\n益,索取请托人财物或者收受请托人财物,数额较大\n或者有其他较重情节。本题中,甲是与刘某关系密切\n的人,通过刘某职务上的行为,为请托人乙谋取不正\n当利益,甲的行为成立利用影响力受贿罪,B项正确。","k":"分则·贪污贿赂罪"}]},{"sub":"刑法","name":"刑罚执行与消灭","w":0.5,"L":7,"qs":[{"id":"2008-14","y":2008,"t":"单","s":"甲于 2004 年 11 月 1 日实施了引诱不满 14 周岁幼女卖淫的行为。根据刑法规定,引诱不满 14 周岁的幼女 卖淫的,处 5 年以上有期徒刑,并处罚金。在不具备追诉时效中断或延长的情况下,对甲的行为的追诉时效是(  )。","o":["5 年","10 年","15 年","20 年"],"a":"C","e":"根据《刑法》第87 条,法定最高刑为不满5 年以上不满10 年有期徒刑的,经过10 年;法定最高刑\n为10 年以上有期徒刑的,经过15 年。本题中,\"五年以上有期徒刑\"的最高刑是15 年,故对甲的行为的追诉时效,\n应适用\"法定最高刑为十年以上有期徒刑的,经过十五年\"的规定,为15 年,故应选C。","k":"刑罚执行与消灭"},{"id":"2011-6","y":2011,"t":"单","s":"甲因绑架罪被判处有期徒刑12年。人狱后, 甲认真遵守监规,接受教育改造,确有悔改表现。根 据《刑法》的规定,对甲()。","o":["既可以减刑也可以假释","可以减刑但不能假释","可以假释但不能减刑 2011年全国法律硕士(非法学)联考真题","既不能减刑也不能假释"],"a":"B","e":"本题将减刑和假释的适用条件结合起\n来考查。减刑的对象包括被判处管制、拘役、有期徒\n刑、无期徒刑的犯罪分子。根据《刑法》规定,上述犯\n罪分子,在执行期间,如果认真遵守监规,接受劳动改\n造,确有悔改表现的,或有立功表现的,可以减刑。本\n题中甲被判处有期徒刑,其行为符合减刑的条件,故\n甲可以适用减刑。而假释有两条禁止性条件:一是累\n犯不能假释;二是因故意杀人、强奸、抢劫、绑架、放\n火、爆炸、投放危险物质或者有组织的暴力性犯罪被\n判处1 0年以上有期徒刑、无期徒刑的犯罪分子,不得\n假释。在本题中,甲因绑架罪被判处有期徒刑12年,\n符合上述禁止性条件,故不能适用假释。所以答案选\nB。(考生在备考时,应细致掌握像缓刑、减刑、假释的\n成立条件及联系和区别。)","k":"刑罚执行与消灭"},{"id":"2013-19","y":2013,"t":"单","s":"下列情形中,符合假释的罪刑条件的是()。","o":["甲因抢劫罪被判处有期徒刑10年","乙因故意伤害罪被判处有期徒刑15年","丙因危险驾驶罪被判处拘役6个月","丁因参加有组织的暴力性犯罪被判处无期 徒刑"],"a":"B","e":"所谓假释,在我国是指对千被判处有期\n徒刑、无期徒刑的犯罪分子,在执行一定刑期之后,因\n其认真遵守监规,接受教育改造,确有悔改表现,没有\n再犯罪的危险,而附条件地将其予以提前释放的制\n度。由于C选项中的刑罚是拘役,因此不能适用假释\n制度。根据《刑法》第81条第2款和第3款的规定,\n适用假释的限制条件还包括:(I)对累犯以及因故意\n杀人、强奸抢劫、绑架、放火、爆炸、投放危险物质罪\n或者有组织的暴力性犯罪被判处IO年以上有期徒\n刑无期徒刑的犯罪分子,不得假释;(2)对犯罪分子\n决定假释的,应当考虑其假释后对居住社区的影响。\nA选项,罪犯犯抢劫罪,且判刑IO年,不得假释;B选\n项,罪犯犯故意伤害罪,虽然判处了15年有期徒刑,\n但是因为并不是累犯,也不是限制假释的暴力性犯\n罪,故可以适用假释,B 正确;D选项,罪犯是因为暴\n力性犯罪被判处无期徒刑,不得假释。","k":"刑罚执行与消灭"},{"id":"2015-13","y":2015,"t":"单","s":"下列情形中,不得适用假释的是( )。","o":["因诈骗罪被判处12年有期徒刑","因叛逃罪被判处15年有期徒刑","因放火罪被判处13年有期徒刑","因故意杀人罪被判处5年有期徒刑"],"a":"C","e":"我国刑法规定的假释,是指对被判处有\n期徒刑、无期徒刑的犯罪分子,在执行一定刑期之后,\n因其认真遵守监规,接受教育改造,确有悔改表现,没\n有再犯罪的危险,而附条件地将其予以提前释放的制\n度。但是对累犯以及因故意杀人、强奸、抢劫、绑架、\n放火、爆炸、投放危险物质或者有组织的暴力性犯罪\n被判处IO年以上有期徒刑、无期徒刑的犯罪分子,不\n得假释。因此,答案为C选项,因放火罪被判处13年\n有期徒刑的犯罪分子,不得假释。AB选项错误,诈骗\n罪叛逃罪可以假释。D选项错误,被判处IO年以上\n有期徒刑的犯罪分子才不能假释。","k":"刑罚执行与消灭"},{"id":"2020-42","y":2020,"t":"多","s":"下列选项中,减刑的适用对象有( )。","o":["被判处管制的犯罪分子","被判处拘役的犯罪分子","被判处有期徒刑的犯罪分子","被判处无期徒刑的犯罪分子"],"a":"ABCD","e":"减刑是指对被判处管制、拘役、有期徒\n刑或者无期徒刑的犯罪分子,因其在刑罚执行期间认\n真遵守监规,接受教育改造,确有悔改或者立功表现,\n而适当减轻其原判刑罚的制度。减刑只适用于被判\n处管制、拘役、有期徒刑、无期徒刑的犯罪分子,ABCD\n选项均正确。","k":"刑罚执行与消灭"},{"id":"2021-41","y":2021,"t":"多","s":"刑罚消灭的法定事由包括( )","o":["犯罪人死亡","被害人谅解","经特赦免除刑罚","超过追诉时效"],"a":"ACD","e":"刑罚消灭,必须以一定的法定事由为前\n提。就各国刑事立法例而言,导致刑罚消灭的法定原\n因大致有以下几种情况:刑罚执行完毕,缓刑考验期\n满,假释考验期满,犯罪人死亡,超过时效期限,赦免。\nACD项正确。","k":"刑罚执行与消灭"},{"id":"2026-41","y":2026,"t":"多","s":"以下情形,可以视为刑事责任终结的有","o":["犯罪人自杀身亡","法院裁决认定有罪但免除刑罚","对犯罪人判处的刑罚宣告缓刑","检察机关对犯罪人依法作出不起诉决定"],"a":"ABD","e":"刑事责任终结:犯罪人死亡、定罪免罚、不起诉,均不再追究刑责;\nC 缓刑只是附条件不执行刑罚,刑事责任并未消灭。","k":"刑罚执行与消灭"}]},{"sub":"刑法","name":"分则·渎职罪","w":0.1,"L":3,"qs":[{"id":"2007-20","y":2007,"t":"单","s":"下列情形中,可以构成玩忽职守罪的是 (   ) 。","o":["某国有企业的总经理在经营活动中严重不负责任,造成该公司严重亏损","某高校校长对财务管理严重不负责任,造成巨额资金无法收回","某法院执行庭庭长在执行民事判决中严重不负责任,不履行法定执行职责,致使当事人利益遭受重大损失","某外汇管理部门工作人员在外汇管理工作中严重不负责任,造成大量逃汇,致使国家利益遭受重大损失"],"a":"D","e":"玩忽职守罪 \n]玩忽职守罪是指国家机关工作人员玩忽职守,致使公共财产、国家和人民利益遭受重 \n大损失的行为。D 项符合,构成玩忽职守罪。A、B 项分别构成公司企业人员玩忽职守罪和 \n事业单位人员玩忽职守罪。 C 项执行庭庭长的行为仅使当事人的利益而非国家和人民利益遭 \n受重大损失,不构成玩忽职守罪。 \n二、多项选择题","k":"分则·渎职罪"},{"id":"2022-10","y":2022,"t":"单","s":"国家机关工作人员甲,发现好友王某生产、销售不符合食品安全标准的食品后,滥 用食品安全监管职权,未依法将王某移交司法机关追究刑事责任,情节严重。甲的行 为应认定为","o":["滥用职权罪","徇私枉法罪","食品监管渎职罪","徇私舞弊不移交刑事案件罪"],"a":"C","e":"滥用职权罪是指国家机关工作人员滥\n用职权,致使公共财产、国家和人民利益遭受重大损\n失的行为。徇私枉法罪是指司法工作人员徇私枉法,\n徇情枉法,在刑事诉讼中,使明知是无罪的人受到追\n诉,对明知是有罪的人而故意包庇使其不受追诉,或\n者在刑事审判活动中故意违背事实和法律作柱法裁\n判的行为。食品监管渎职罪,是指负有食品安全监督\n管理职责的国家机关工作人员,滥用职权或者玩忽职\n守,导致发生重大食品安全事故或者造成其他严重后\n果的行为。该罪的行为方式之一为\"依法应当移交司\n法机关追究刑事责任不移交的\"。徇私舞弊不移交刑\n事案件罪是指行政执法人员徇私舞弊,对依法应当移\n交司法机关追究刑事责任的不移交,情节严重的行\n为。国家机关工作人员申滥用食品安全监管职权,依\n法应当将王某移交司法机关追究刑事责任而不移交,\n情节严重,构成食品监管渎职罪。C选项正确。食品\n监管渎职罪与滥用职权罪属于特别法条与一般法条\n的关系,应当按照特别法条规定的犯罪论处。A选项\n错误。甲的行为不属于刑事诉讼中的活动,不构成徇\n私枉法罪。B选项错误。徇私舞不移交刑事案件\n罪的犯罪主体为行政执法人员,食品监管渎职罪的犯\n罪主体为仅限于负有食品安全监督管理职责的国家\n机关工作人员,甲的身份属于后者,因此,不构成徇私\n舞弊不移交刑事案件罪。D选项错误。","k":"分则·渎职罪"},{"id":"2026-15","y":2026,"t":"单","s":"公路稽查人员甲在执法过程中发现逃避检查的逃逸车辆,进行追查。逃逸车 辆驾驶人员小张慌不择路,坠桥身亡。甲的行为应认定为","o":["正当业务行为","滥用职权罪","玩忽职守罪","过失致人死亡罪"],"a":"B","e":"公路稽查人员违规追缉逃逸车辆,未尽合理限度执法,造成当事人死亡,\n属于滥用职权;\nA 正当业务行为要求手段合法适度;C 玩忽职守是不作为过失;本案是不当主动\n追缉,属于滥用职权。","k":"分则·渎职罪"}]},{"sub":"民法","name":"合同通则","w":3.3,"L":57,"qs":[{"id":"2005-44","y":2005,"t":"单","s":"下列选项中,乙的哪种行为构成我国《合同法》规定的承诺(   )","o":["甲向丙发出要约,乙得知后向甲表示接受甲在要约中规定的条件","甲向乙发出要约,要求乙在接到要约后七日内给予答复,逾期未答复则视为承诺。乙未按期答复","甲在报纸上刊登广告:本公司有圣诞礼物出售,欲购者请速与本公司联系。乙打电话给甲订购若干","甲在报纸上刊登附有价目表的广告称:本书店新到图书若干,欲购者可在一个月内汇款,款到寄书。乙汇款给甲"],"a":"D","e":"在选项A,甲针对的受要约人是丙,并非乙,因此乙向甲表示接受并非承诺,而是向甲发出的要约。\n单纯的缄默或不作为一般不能作为承诺的意思表示方式,除非法律强制规定、交易习惯表明或者当事人双方事先明\n确同意。在选项B,不作为作为承诺方式是甲的要约规定,乙没有义务遵守此规定。在选项C,甲刊登的广告的内容\n不符合要约规定,属于要约邀请,乙的行为属于要约。在选项D,甲的广告的内容符合要约规定,属于要约。乙汇\n款行为构成承诺。","k":"合同通则"},{"id":"2006-32","y":2006,"t":"单","s":"甲公司欠乙公司 500 万元,后甲公司被乙公司兼并,二者之间的债务关系因此消灭。导致这一债的关系消灭的 法律 事实是(   )","o":["混同","免除","抵销","解除"],"a":"A","e":"债的混同是指债权和债务同归一人的事实,当债权和债务同归一人时就没有自己对自己履行的必要而\n债的关系归于消灭。依题意选A 可排除B、C、D。","k":"合同通则"},{"id":"2006-37","y":2006,"t":"单","s":"根据合同法规定,标的物提存后,毁损、灭失的风险(   )","o":["由债权人承担","由债务人承担","由债权人和债务人共同承担","由提存机关承担"],"a":"A","e":"合同的提存视为和同以旅行,以合同法标的物所有权转移,应由债权人承担。 \n- 9 -\n\n \n \n更多考研精品资料,关注淘宝店铺:光速考研工作室 \n- 10 -","k":"合同通则"},{"id":"2006-41","y":2006,"t":"单","s":"当事人就履行地点约定不明确,如果是给付货币,履行地点应当是(   )","o":["给付一方所在地","接受给付一方所在地","合同签订地","合同标的物所在地"],"a":"B","e":"《合同法》第61 条,第62 条第三项。","k":"合同通则"},{"id":"2006-51","y":2006,"t":"多","s":"关于合同履行的下列说法中,正确的是(       )","o":["履行期限不明确的,债务人可以随时履行,但应当给对方必要的准要时间","履行方式不明确的,按照有利于实现合同目的的方式履行","履行费用的负担不明确的,由接受履行一方负担","价款不明确的,按照卖方确定的价款履行"],"a":"AB","e":"本题考查的是合同履行规则。合同履行是指当事人应当按照合同全面履行自己的义务,同时还要遵循\n诚实信用原则履行各项附随义务。如果合同内容约定不清楚或没有约定的,可协议补充或以《合同法》第62 条规定:\n当事人就有关合同内容约定不明确,依照本法第六十一条的规定仍不能确定的,适用下列规定:(一)质量要求不\n明确的,按照国家标准、行业标准履行;没有国家标准、行业标准的,按照通常标准或者符合合同目的的特定标准\n履行。(二)价款或者报酬不明确的,按照订立合同时履行地的市场价格履行;依法应当执行政府定价或者政府指\n导价的,按照规定履行。(三)履行地点不明确,给付货币的,在接受货币一方所在地履行;交付不动产的,在不\n动产所在地履行;其他标的,在履行义务一方所在地履行。(四)履行期限不明确的,债务人可以随时履行,债权\n人也可以随时要求履行,但应当给对方必要的准备时间。(五)履行方式不明确的,按照有利于实现合同目的的方\n式履行。(六)履行费用的负担不明确的,由履行义务一方负担。所以应选AB。","k":"合同通则"},{"id":"2007-41","y":2007,"t":"单","s":"甲与乙签订一份货款为人民币 50 万元的买卖合同,并依约定交付给乙定金人民币 15 万元。后乙违约没有履 行该 合同。乙应返还给甲人民币 (   ) 。","o":["20 万元","25 万元","30 万元","35 万元"],"a":"B","e":"定金 \n] 担保法规定,当事人可以约定一方向对方给付定金作为债权的担保。债务人履行债 \n务后,,定金应当抵作价款或者收回。给付定金。的一方不履行约定的债务的,无权要求返 \n还定金;收受定金的一方不履行约定的债务的,应当双倍返还定金。定金的数额由当事人约 \n定,但不得超过主合同标的额的 20010。超过的部分,人民法院不予支持。根据这一规定, \n乙本应返还 30 万元,但是甲交付 15 万元定金,超过了.50 万元的 20%,这超出的 5 万元不 \n予支持,故乙应返还给甲 25 万元人民币。答案为 B。、","k":"合同通则"},{"id":"2008-43","y":2008,"t":"单","s":"下列行为中属于要约的是(  )。","o":["投标","发布拍卖公告","寄送价目表","刊登招股说明书"],"a":"A","e":"根据《合同法》第14 条,要约是希望和他人订立合同的意思表示,该意思表示应当符合下列规定:\n(1)内容具体确定;(2)表明经受要约人承诺,要约人即受该意思表示约束。投标,是投标人希望与招标人订立\n合同的意思表示,且该意思表示的内容具体确定,只要招标人确定其中即成立合同,故属于要约。根据《合同法》\n第15 条,要约邀请是希望他人向自己发出要约的意思表示。寄送的价目表、拍卖公告、招标公告、招股说明书、商\n业广告等为要约邀请,而非要约。本题选A。","k":"合同通则"},{"id":"2008-44","y":2008,"t":"单","s":"根据合同法规定,居间人为委托人提供了媒介服务,但未促成合同成立的,居间人有权要求委托人支付(  )。","o":["约定的报酬","必要费用","约定报酬的一部分","报酬和费用"],"a":"B","e":"根据《合同法》第427 条,居间人未促成合同成立的,不得要求支付报酬,但可以要求委托人支付从\n事居间活动支出的必要费用,故本题应选B。","k":"合同通则"},{"id":"2008-50","y":2008,"t":"单","s":"甲公司与乙农场签订一份购销合同,由乙农场供应甲公司一批奶牛。乙农场将部分患有传染病的奶牛交付给甲公 司,致 使甲公司饲养的其他奶牛大量染病。根据合同法规定,甲公司(  )。","o":["只能要求乙农场承担违约责任","只能要求乙农场承担侵权责任","有权要求乙农场同时承担违约责任与侵权责任","有权在违约责任与侵权责任中选择其一要求乙农场承担"],"a":"D","e":"根据《合同法》第122 条,因当事人一方的违约行为,侵害对方人身、财产权益的,受损害方有权选\n择依照合同要求其承担违约责任或者其他法律要求其承担侵权责任。在本案中,乙农场的行为既构成违约行为,也\n构成侵权行为,故根据该条应选D。 \n八、多项选择题","k":"合同通则"},{"id":"2009-39","y":2009,"t":"单","s":"2006 年 9 月,董某到某银行取款时,意外发现自己的银行卡里多了 50 万元存款。经查,是银行误将一个与 董某同 名同姓人的存款存入董某的卡里。此种情形可构成(    )。","o":["意外事件","不当得利","赠与行为","侵权行为"],"a":"B","e":"本题考查不当得利。不当得利,是指无法律上或合同上的根据,使他人财产受到损失而自己获得\n利益。不当得利的额构成要件包括:一方获得利益;他方收到损失;一方手里和他方受损之间的因果关系;没有合\n法根据。本题中,银行误将一个与董某同名同姓人的存款存入董某的卡里,董某获得利益,他人受到损失,二者具\n有因果关系,且没有合法根据,故构成不当得利。因此本题答案为B","k":"合同通则"},{"id":"2009-42","y":2009,"t":"单","s":"甲、乙签订了一份货款为 l 千万元的钢材供应合同。甲为供方,乙为需方。合同约定,乙预付 200 万元定金, 违 约金为合同总额的 5%。事后,乙交付了定金。后甲违约,对此(   )。","o":["乙只能要求适用定金条款","乙只能要求适用违约金条款","乙可以选择适用违约金条款或者定金条款","乙可以要求违约金条款和定金条款同时适用"],"a":"C","e":"本题考查定金和违约金的适用。《合同法》第116 条规定,当事人既约定违约金,又约定定金的,\n一方违约时,对方可以选择适用违约金或者定金条款。本题中,甲、乙双方及约定了定金,也约定了违约金,后甲\n违约,乙可以选择适用违约金或定金条款。因此本题的答案为C","k":"合同通则"},{"id":"2009-43","y":2009,"t":"单","s":"根据合同法规定,因赠与人故意或重大过失致使赠与的财产毁损、灭失的,赠与人应当承担损害赔偿责任。此 种 责任的归责原则是(    )。","o":["过错责任原则","无过错责任原则","推定过错责任原则","公平责任原则"],"a":"A","e":"本题考查归责原则。所谓过错责任原则,是指一个人只有其行为在其有过错的前提下,才承担责任,\n无过错不承担责任。无过错责任原则,是指在某些领域或行业内,对造成损害的行为不再强调行为人主观上的过错,\n而仅以损害后果是由行为人造成的作为确定民事责任归属的法律原则。推定过错责任原则不是一种独立的归责原则,\n而是过错责任原则的一种适用方式。公平责任原则,是指依法不适用无过错责任原则,同时以过错责任原则有显失\n公平的情况下,由当事人分担民事责任。本题中的规则原则应属于过错责任原则。因此本题的答案为A \n- 12 -\n\n \n \n更多考研精品资料,关注淘宝店铺:光速考研工作室","k":"合同通则"},{"id":"2009-46","y":2009,"t":"单","s":"根据婚姻法规定,夫妻对婚姻关系存续期间所得的财产约定归各自所有的,对夫或妻一方对外所负的债务(   )。","o":["债权人知道该约定的,以夫或妻一方所有的财产清偿","债权人知道该约定的,以夫和妻所有的财产清偿","债权人不知道该约定的,以夫或妻一方所有的财产清偿","无论债权人是否知道该约定,都以夫和妻所有的财产清偿"],"a":"A","e":"本题考查夫妻财产制。根据《婚姻法》第19 条规定,夫妻对婚姻关系继续期间所得的财产约定各\n自所有的,夫或妻一方对外所负的债务,第三人知道约定的,以夫或妻一方所得的财产清偿。因此本题的答案为A","k":"合同通则"},{"id":"2009-53","y":2009,"t":"多","s":"甲商场与乙公司签汀了购买 800 辆自行车的书面合同,合同约定:乙可分三次发货,甲商场见货付款。第一批 200 辆自行行车到货后.甲商场见销路不好,便以书面形式向乙公司提出取消后两批货物订购,乙公司以书面形式 表示同意,本 案中涉及的民事法律事实有(      )","o":["订立合同的行为","履行合同的行为","变更合同的行为","解除合吲的行为"],"a":"ABD","e":"本题考查民事法律事实。民事法律事实,是指法律所规定的、能够引起民事法律关系产生、变更\n和消灭的客观现象。本题中,涉及的民事法律事实包括甲商场与乙公司签订合同的行为;乙公司履行合同的行为;\n协议解除合同的行为。本题中没有变更合同的行为。因此本题答案为A、B、D","k":"合同通则"},{"id":"2011-48","y":2011,"t":"多","s":"根据法律规定,定金的种类包括(","o":["立约定金","解约定金","违约定金","守约定金"],"a":"ABC","e":"定金可以分为立约定金、成约定金、证\n约定金、解约定金和违约定金。我国现行法律承认上\n述所有类型的定金。故答案选ABC。","k":"合同通则"},{"id":"2012-30","y":2012,"t":"单","s":"2009年8月5日,甲公司向乙公司发出订购 图书的订单,订单中详细列明了订购数量、交货日期 等,并要求乙公司在接到该订单之日起3日内向甲公 司发出确认函。乙公司8 月6日接到订单,于8 月10 日向甲公司发出确认函,同时寄出该批图书。甲公司 收到图书后,拒绝接受。关千本案的以下表述,正确 的是( )。","o":["甲公司向乙公司发出订单的行为属于要约 邀请","乙公司向甲公司发出确认函的行为属于承诺","乙公司向甲公司发出确认函的行为属于要约","乙公司向甲公司寄出图书的行为属千履行 合同"],"a":"C","e":"要约是当事人一方向对方发出的希望\n与对方订立合同的意思表示。要约内容应具体确定。\n承诺是受要约人向要约人作出的同意要约的意思表\n示。承诺必须在要约确定的期限内到达要约人。本\n题中,甲公司向乙公司发出订购图书的订单,属于要\n约,要约同时约定了期限,即3日内乙公司必须发出\n确认函。但乙公司发出确认函时已经是8月10日,\n超过了要约确定的期限,甲公司的要约失效。乙公司\n发出的确认函为新一轮要约。故选C。","k":"合同通则"},{"id":"2012-49","y":2012,"t":"多","s":"甲、乙互负债务,根据《合同法》的规定,双方 债务法定抵销的条件包括( )。","o":["双方协商一致","双方所负债务数额相等","双方的给付为同种类、同品质","双方的债务均届清偿期"],"a":"CD","e":"《合同法》第99条规定,当事人互负到\n期债务,该债务的标的物种类、品质相同的,任何一方\n可以将自己的债务与对方的债务抵销,但依照法律规\n定或者按照合同性质不得抵销的除外。故选CD。当\n事人主张抵销的,应当通知对方。通知自到达对方时\n生效。抵销不得附条件或者附期限。\n[特别说明]\n《民法典》对法定抵销的条件进行\n了修改,《民法典》第568条第1款规定:\"当事人互负\n债务,该债务的标的物种类、品质相同的,任何一方可\n以将自己的债务与对方的到期债务抵销;但是,根据\n债务性质按照当事人约定或者依照法律规定不得抵\n销的除外。\"即不再要求双方互负到期债务,而只要求\n被抵销的债务到期,因此按照《民法典》的规定,D项\n不选。但本题题干明确要求\n\"根据《合同法》的规\n定\n\",故本书不对答案进行修改。但考生要清楚《民法\n典》的最新规定。","k":"合同通则"},{"id":"2013-32","y":2013,"t":"单","s":"下列关于债的提存的说法中,符合我国合同 法规定的是()。","o":["债权人无正当理由拒绝受领标的物是提存的 条件之一","提存物在提存期间产生的擎息归提存人所有","债权人超过法定期限不领取提存物,提存物归 债务人所有","提存期间,提存物毁损灭失的风险由提存机 关承担"],"a":"A","e":"本题考查的是提存制度。所谓提存,是\n指由千债权人的原因无法向其交付履行标的物时,债\n务人将该标的物交付给提存机关以消灭债务的行为。\n提存的条件包括:(1)因债权人方面的原因使债务人\n难以履行债务的客观情况发生-—升责权人无正当理\n由拒绝受领,债权人下落不明,债权人死亡未确定继\n承人遗产管理人或者丧失行为能力未确定监护人\n等;(2)须提存的标的物适宜提存;(3)须经过法定\n程序进行。提存的效力在于:(1)自提存之日起,债\n务人与债权人之间的权利义务终止;(2)标的物提存\n后,其所有权原则上转移给债权人,草息归债权人所\n有,提存费用由债权人负担,提存期间提存物损毁灭\n失的风险亦由债权人承担;(3)标的物提存后,债务\n人应当及时通知债权人或者债权人的继承人、监护\n人,若债权人无法通知,应由提存机关履行此义务;\n(4)债权人领取提存物的权利,自提存之日起5年内\n不行使而消灭,提存物扣除提存费用后归国家所有。\n据此,答案应该选择A。","k":"合同通则"},{"id":"2013-33","y":2013,"t":"单","s":"根据我国《合同法》的规定,以书面形式作出 承诺的,承诺的生效时间是()。","o":["承诺人作出承诺时","承诺通知发出时","承诺通知到达要约人时","要约人了解承诺时"],"a":"C","e":"所谓承诺,是指受要约人向要约人作出\n的同意要约的意思表示。而承诺的生效意味着合同\n的成立,双方当事人由此承担合同产生的权利与义\n务。关于承诺生效的时间,我国采用的是\n\"到达主\n义\n\" ,规定承诺在承诺通知到达要约人时生效。承诺\n不需要通知的,根据交易习惯或者要约的要求做出承\n诺的行为时生效。因此答案选C。","k":"合同通则"},{"id":"2013-40","y":2013,"t":"单","s":"根据我国《侵权责任法》的规定,下列情形可 以适用精神损害赔偿的是()。","o":["某公司连续一年未发工资,致职工甲忧心 仲","某学校违反合同提前解聘教师乙,致其痛苦 不堪","某行政机关公布对工作人员丙的处分决定,致 其精神萎靡不振","某医院因失误致产妇丁抱错孩子,其抚养15 年后发现真相痛苦万分"],"a":"D","e":"所谓精神损害赔偿,是指自然人在人身\n权或者某些财产权受到不法侵害,致使其人身权益或\n者财产权利受到损害并遭受精神痛苦时,受害人本\n人本人死亡后其近亲属有权要求侵权人给予损害赔\n偿的民事法律制度。根据司法解释的规定,侵权行为\n的精神损害赔偿主要包括以下情况:(1)自然人因人\n格权或者人身自由权遭受到非法侵害时,或者是违反\n社会公共利益、社会公德侵害他人隐私或者其他人格\n利益,受害人也可以侵权为由向人民法院起诉请求精\n神损害赔偿。(2) 非法使被监护人脱离监护,导致亲\n子关系或者近亲属间的亲属关系遭受严重损害,监护\n人向人民法院起诉请求赔偿精神损害的,人民法院应\n当依法予以受理。(3) 自然人死亡后,其近亲属因下\n列侵权行为遭受精神痛苦,也可以向人民法院请求起\n诉精神损害赔偿:心以侮辱、诽谤、贬损、丑化或者违\n反社会公共利益、社会公德的其他方式,侵害死者的\n姓名、肖像、荣誉、名誉;@非法披露、利用死者隐私,\n或者以违反社会公共利益、社会公德的方式侵害死者\n隐私;@非法利用、损害遗骨,或者以违反社会公共\n利益、社会公德的其他方式侵害遗体、遗骨;@具有\n人格象征意义的特定纪念物品,因侵权行为永久性灭\n失或者损毁的,物品所有人可以侵权为由,向人民法\n院起诉请求精神损害赔偿。D选项中因为医院的失\n误使得被监护人非法脱离监护,造成亲属关系的严重\n破坏,属于精神损害赔偿的范围,因此该选项正确。\n二、多项选择题","k":"合同通则"},{"id":"2013-46","y":2013,"t":"多","s":"甲出国前将古琴、油画及电脑交乙保管。后 乙将古琴出借给丙,将油画赠送给丁,将电脑出质给 戊。甲回国后发现以上事实。甲有权()。","o":["要求丙返还古琴","要求丁返还油画","要求戊返还电脑","要求乙承担违约责任"],"a":"ABD","e":"l\n乙是无权处分人,根据善意取得制度,\n出借和赠送都不能使丙和丁善意取得,但质权可以善\n意取得,戌巳经善意取得电脑的质权。乙违反了与甲\n的保管合同自然要承担违约责任,故本题选项\n为ABD。","k":"合同通则"},{"id":"2014-29","y":2014,"t":"单","s":"下列选项中,不属于债权特征的是()。","o":["平等性","相容性","任意性","永久性"],"a":"D","e":"本题考查的是债权的特征。债权是指\n债权人所享有的请求债务人为特定行为的权利。债\n权的特征表现为:(1)债权为请求权。(2)债权为相\n对权。(3)债权具有任意性。(4)债权具有非排他\n性。(5)债权具有平等性。债权只在一定期限内存\n在,期限届满,债权即归于消灭。因此永久性不属于\n债权的特征。","k":"合同通则"},{"id":"2014-36","y":2014,"t":"单","s":"赵某死亡后,甲依遗嘱继承了一套房屋(价值 180万元),乙依遗赠分得一幅字画(价值40万元), 丙依法定继承分得现金60万元。遗产分割完毕后, 赵某的债权人找到甲、乙、丙,要求偿还欠款40万元。 该欠款应()。","o":["全部由甲偿还","全部由丙偿还","由甲偿还30万元,丙偿还10万元","由甲、乙、丙按照各自分得的遗产价值比例 偿还"],"a":"B","e":"本题考查的是被继承人债务的清偿办\n法。《民法典》第1163条规定:\"既有法定继承又有遗\n嘱继承遗赠的,由法定继承人清偿被继承人依法应\n当缴纳的税款和债务;超过法定继承遗产实际价值部\n分,由遗嘱继承人和受遗赠人按比例以所得遗产清\n偿。\"本题中,丙依法定继承分得现金60万元,对赵某\n的40万元债务应由其全部偿还。","k":"合同通则"},{"id":"2014-49","y":2014,"t":"多","s":"甲对乙享有债权,乙对丙享有债权。因乙未 清偿到期债务,甲欲行使代位权。甲提起代位权诉讼 应具备的条件包括()。","o":["乙对丙的债权合法","乙对丙的债权已经到期","乙对丙的债权不属于专属性债权","乙对丙未提起诉讼或者申请仲裁"],"a":"ABCD","e":"所谓债权人代位权,是指当债务人怠于\n行使其对第三人的权利而危害债权实现时,债权人享\n有的以自己的名义代为行使债务人权利的权利。债\n权人代位权的成立条件包括:(l) 债权人对债务人的\n债权合法且已到期。(2)债务人对第三人享有债权\n且该债权已到期。(3)债务人怠于行使到期债权对\n债权人造成损害。(4)债务人对第三人的债权为非\n专属性权利和可以强制执行的权利。因此,ABCD四\n个选项均正确。","k":"合同通则"},{"id":"2014-50","y":2014,"t":"多","s":"顾某欲与闫某离婚。下列情形中,顾某既可 以之作为起诉离婚的理由,同时可请求损害赔偿的有 )。","o":["闫某变卖夫妻共同财产","闫某殴打顾某致其残疾","闫某与婚外异性同居","闫某经常赌博且屡教不改 三、简答题:第51~54小题,每小题6分"],"a":"BC","e":"根据《民法典》规定,有下列情形之一,\n经调解无效的,应当准予离婚:(l)重婚或者与他人\n同居;(2)实施家庭暴力或者虐待、遗弃家庭成员;\n(3)有赌博、吸毒等恶习屡教不改;(4)因感情不和\n分居满二年;(5)其他导致夫妻感情破裂的情形。另\n外根据《民法典》规定,有下列情形之一,导致离婚的,\n尤过错方有权请求损害赔偿:(l)重婚;(2)与他人同\n居;(3) 实施家庭暴力;(4) 虐待、遗弃家庭成员;\n(5) 有其他重大过错c 因此,只有BC选项同时符合\n这两条规定中的情形。\n三、简答题","k":"合同通则"},{"id":"2015-32","y":2015,"t":"单","s":"甲向某电脑公司购买一批电脑送给母校。甲 指示电脑公司将电脑交给学校,并将订货情况通知了学 校。后电脑公司委托某快递公司将电脑运至学校,运输 过程中两台电脑毁坏。下列选项中,正确的是()。","o":["甲有权要求电脑公司承担违约责任","甲有权要求快递公司承担违约责任","学校有权要求电脑公司承担侵权责任","学校有权要求快递公司承担侵权责任"],"a":"A","e":"甲购买电脑,电脑公司交付的电脑有两\n台毁坏,电脑公司构成违约,甲有要求其承担违约责\n任的权利。因此本题A选项正确。甲与快递公司之\n间没有合同,根据合同的相对性,甲无权要求快递公\n司承担违约责任,B选项错误。电脑的所有权属千\n甲,而不属于学校,学校无权要求电脑公司、快递公司\n承担侵权责任,CD选项错误。","k":"合同通则"},{"id":"2016-49","y":2016,"t":"多","s":"甲、乙系夫妻。在不损害债权人利益的情况 下,甲请求分割夫妻共同财产能得到法院支持的理由 有()。","o":["乙伪造夫妻共同债务","乙挥霍夫妻共同财产","乙隐藏夫妻共同财产","乙变卖夫妻共同财产"],"a":"ABCD","e":"《民法典》第1066条规定:\"婚姻关系\n存续期间,有下列情形之一的,夫妻一方可以向人民\n法院请求分割共同财产:(一)一方有隐藏、转移、变\n卖毁损、挥霍夫妻共同财产或者伪造夫妻共同债务\n等严重损害夫妻共同财产利益的行为;(二)一方负\n有法定扶养义务的人患重大疾病需要医治,另一方不\n同意支付相关医疗费用。\"\nA、B、C,D四个选项都属于上述规定第(一)项的\n行为,甲可以请求分割夫妻财产。","k":"合同通则"},{"id":"2017-32","y":2017,"t":"单","s":"甲公司于4月24日通知乙公司急需货物10 吨,乙公司遂于4月25日按双方之间的交易惯例发 货。4月26日甲公司又通知乙公司不需要该批货物。 对此,下列说法正确的是()。","o":["乙公司的发货行为构成要约","甲公司4月24日的通知构成要约邀请","申公司4月26日的通知构成要约的撤销","甲公司、乙公司之间的合同于4月25日成立"],"a":"D","e":"要约是当事人一方向对方发出的希望\n与对方订立合同的意思表示。要约必须是特定人向\n相对人发出的意思表示,以缔结合同为目的,且要约\n的内容具体确定,要约表明经受要约人承诺,要约人\n即受该意思表示约束。本题中,甲公司与乙公司长期\n交易,对于交易的内容都很了解。因此当甲公司4月\n24日表示需要乙公司提供货物10吨时,明确了货物\n的数量,交易的内容具体确定,是甲公司向乙公司发\n出的要约。乙公司于4月25日按照双方之间的交易\n惯例发货,是以行为表示承诺,因此甲乙之间的合同\n于4月25日成立。甲4月26日通知不需要该批货物\n的行为是违约行为。D项正确。A 项错误,乙公司的\n发货行为是承诺。B项错误,甲公司4月24日的通知\n是要约。C项错误,乙公司已经承诺,甲公司不能再\n撤销要约。","k":"合同通则"},{"id":"2018-26","y":2018,"t":"单","s":"甲公司欠乙公司货款50 万元,乙公司欠甲公 司租金50 万元,后甲公司被乙公司兼并,甲公司与乙 公司之间的债的消灭的原因是( )。","o":["混同","免除","抵销","清偿"],"a":"A","e":"混同是指债权人和债务人合为一人的\n事实。混同包括概括承受和特定承受。概括承受既\n有企业法人和其他组织的概括承受,也有个人的概括\n承受。前者如相互有债权债务关系的企业合并为一\n个企业,债权债务即同归于一个企业而消灭。本题中\n甲公司与乙公司互负债务,之后双方合并为同一公\n司,属于债的混同的情形。A项正确。","k":"合同通则"},{"id":"2018-49","y":2018,"t":"多","s":"甲公司与乙幼儿园签订空气净化器买卖合 同,约定:净化器的PM2.5 去除率应达到95% ,验收 合格后付款。后乙幼儿园经甲公司同意将合同转让 给丙幼儿园,丙幼儿园验收时,发现PM2. 5 去除率远 未达到合同约定的标准。对此,下列说法正确的是 ()。","o":["丙幼儿园有权解除买卖合同","丙幼儿园可以对甲公司行使先履行抗辩权","丙幼儿园可以请求乙幼儿园承担违约责任","乙幼儿园与丙幼儿园之间的转让合同有效"],"a":"ABD","e":"《民法典》第563条第1款规定:\"有下\n列情形之一的,当事人可以解除合同:(一)因不可抗\n力致使不能实现合同目的;(二)在履行期限届满前,\n当事人一方明确表示或者以自己的行为表明不履行\n主要债务;(三)当事人一方迟延履行主要侦务,经催\n告后在合理期限内仍未履行;(四)当事人一方迟延\n履行债务或者有其他违约行为致使不能实现合同目\n的;(五)法律规定的其他情形。\"本题中,丙幼儿园购\n买净化器的目的是去除PM2.5,但是甲公司提供的净\n化器PM2.5 去除率远未达到合同约定的标准,导致\n合同目的不能实现,因此丙幼儿园有权解除合同,A\n项正确。第526条规定:\"当事人互负债务,有先后履\n行顺序,应当先履行一方未履行的,后履行一方有权\n拒绝其履行请求。先履行一方履行债务不符合约定\n的,后履行一方有权拒绝其相应的履行请求。\"本题\n中,甲公司是先履行债务的一方,其履行债务不符合\n约定,因此丙幼儿园可以行使先履行抗辩权,B项正\n确。第551条第1款规定:\n\"债务人将债务的全部或\n者部分转移给第三人的,应当经债权人同意。\"本题\n中,乙幼儿园与丙幼儿园的合同转移已经经过甲公司\n同意,因此有效。D项正确。乙幼儿园已经将债务完\n全转移,脱离了该债权债务,丙幼儿园不能要求其承\n担违约责任,C项错误。本题选ABD。","k":"合同通则"},{"id":"2019-25","y":2019,"t":"单","s":"甲外出务工多年未与家中联系,经其配偶乙 申请,法院宣告甲死亡。甲的好友丙替甲偿还了欠丁 的1万元。后乙与丙组成家庭。一日,甲返乡。对 此,下列说法正确的是()。","o":["甲和乙之间的婚姻关系自动恢复","乙和丙之间的婚姻关系自动解除","乙、丙婚后,丙可向乙主张1万元债权","无论甲、乙是否恢复婚姻关系,丙均有权要求 甲偿还1万元债务"],"a":"D","e":"《民法典》第51条规定:\"被宣告死亡\n的人的婚姻关系,自死亡宣告之日起消除。死亡宣告\n被撤销的,婚姻关系自撤销死亡宣告之日起自行恢\n复。但是,其配偶再婚或者向婚姻登记机关书面声明\n不愿意恢复的除外。\n\"本题中,甲的配偶乙已经再婚,\n甲乙之间的婚姻关系不能自动恢复,乙丙之间的婚姻\n关系也不会自动解除,AB项错误。丙替甲偿还了1\n万元欠款,丙有权要求甲偿还该l万元,D项正确,C\n项错误。","k":"合同通则"},{"id":"2019-28","y":2019,"t":"单","s":"甲听说乙有一祖传玉石,遂前往询价,甲问: 你多少钱卖?乙说:你出多少钱?甲问:15万元卖不 卖?乙说:20万元可以马上拿走。甲未置可否。三天 后,甲携款20万元前来购买,乙说:25万元才能卖。 对此,下列选项正确的是()。","o":["乙说“你出多少钱”属于要约","乙说“20万元可以马上拿走”属于要约邀请","甲携款20万元前来购买时合同成立","乙说“25万元才能卖”属于要约"],"a":"D","e":"要约是当事人一方向对方发出的希望\n与对方订立合同的意思表示。承诺是受要约人向要\n约人做出的同意要约的意思表示。乙说\n\" 你出多少\n钱\n\" 属于要约邀请,因为这句话是乙向甲作出的希望\n甲向自己发出要约的意思表示,内容不是具体确定\n的,A项错误。乙说\n\"20万元可以马上拿走\n\" 属于要\n约,因为内容具体确定,包括了拟订立合同的必备条\n款,且表明经甲承诺,乙即受该意思表示约束,B项错\n误。乙的要约是\n\"20万元可以马上拿走\n\",履行期限\n是\n\" 马上\n\" ,根据法律规定,要约以对话方式作出的,应\n当即时作出承诺。但是甲未置可否,三天后前来购\n买,相当于对履行期限进行了变更,是对要约的实质\n性更改,因此,甲的行为不是承诺,而是新的要约,不\n能导致合同成立,C项错误。甲携款支付20万元前\n来购买是新的要约,表明甲愿意支付20万元购买该\n玉石。但是乙说\n\"25万元才能卖\n\",即对甲的要约进\n行了实质性更改,不是承诺,是新的要约,D项正确。","k":"合同通则"},{"id":"2019-39","y":2019,"t":"单","s":"甲、乙签订买卖合同,约定:甲于9月30日交 货,乙于10月5日付款。9月30日甲得知乙经营状况 严重恶化,遂通知乙暂不交货。甲行使的是()。","o":["先诉抗辩权","不安抗辩权","先履行抗辩权","同时履行抗辩权"],"a":"B","e":"不安抗辩权是指先履行一方在有确切\n证据证明后履行一方有丧失或者可能丧失履行债务\n能力的情况下,可暂时中止履行的权利。本题中,甲\n是先履行一方,在得知乙经营状况恶化后暂时停止履\n行义务,行使的是不安抗辩权,B项正确。双务合同\n履行中的抗辩权有三个-ʻ同时履行抗辩权、先履行\n抗辩权、不安抗辩权,本题中明确给出了\n\"9月30日\n甲得知乙经营状况严重恶化\n\" 信息,考生可以比较顺\n利地做出判断。","k":"合同通则"},{"id":"2020-34","y":2020,"t":"单","s":"甲委托乙公司将一批货物运往A地。后甲将 运输途中的货物卖给丙,双方对风险的承担没有约 定。甲、丙签订买卖合同后,该批货物毁损、灭失的风 险()。","o":["自买卖合同成立时起由丙承担","自货物交付给乙公司时起由丙承担","自货物运抵A地时起由丙承担","自货款付清时起由丙承担"],"a":"A","e":"根据《民法典》的规定,出卖人出卖交\n由承运人运输的在途标的物,除当事人另有约定外,\n毁损、灭失的风险自合同成立时起由买受人承担,A\n选项正确。","k":"合同通则"},{"id":"2021-25","y":2021,"t":"单","s":"甲与某影视公司签订合同,约定甲两年内完 成一部电视剧剧本,影视公司支付稿酬50万元。后 甲将请求支付稿酬的权利转让给乙。甲请求支付稿 酬的权利()","o":["经影视公司同意才可以转让","依合同性质不得转让","在转让通知到达影视公司时发生转让","在转让合同生效时发生转让"],"a":"D","e":"《民法典》第545条规定:\"债权人可以\n将债权的全部或者部分转让给第三人,但是有下列情\n形之一的除外:(一)根据债权性质不得转让;\n(二)按照当事人约定不得转让;(三)依照法律规定\n不得转让。当事人约定非金钱债权不得转让的,不得\n对抗善意第三人。当事人约定金钱债权不得转让的,\n不得对抗第三人。\"本题中,甲请求影视公司支付稿酬\n的权利属千债权,不是根据性质不能转让的权利,当\n事人也未约定不得转让,法律亦未规定不得转让,因\n此甲可以转让该债权,债权在转让合同生效时发生转\n让,D 项正确,B项错误。《民法典》第546条规定:\n\"债权人转让债权,未通知债务人的,该转让对债务人\n不发生效力。债权转让的通知不得撤销,但是经受让\n人同意的除外。\"本题中,甲的债权转让,无须债务人\n同意,只需通知债务人即可,未通知债务人的,转让对\n债务人不发生效力,但不意味着债权转让在通知债务\n人时才发生。债权转让在转让合同生效时发生,是否\n通知债务人,只决定是否对债务人发生效力,而不决\n定债权转让本身的效力,AC项错误。本题选D。","k":"合同通则"},{"id":"2021-35","y":2021,"t":"单","s":"甲在某餐厅用餐,根据菜单点了一道标价为 98元的菜。结账时,餐厅要求甲支付298元,甲则坚 持以菜单为准付款,这时餐厅才发现菜单被调包。经 查,菜单调包系刚刚来此就餐的某顾客所为。甲与餐 厅之间债的发生原因是(","o":["侵权行为","不当得利","合同","缔约过失"],"a":"B","e":"不当得利,是指一方没有法律根据取得\n不当得利而使另一方财产受损的事实。本题中,甲吃\n了价值298元的菜品,但只愿支付98元,餐厅财产受\n损,甲受有利益,甲与餐厅之债的发生原因是不当得\n利,B项正确。","k":"合同通则"},{"id":"2021-47","y":2021,"t":"多","s":"甲与乙签订预订书,约定一年内订立房屋买 卖合同。后乙拒绝订立买卖合同。对于乙违反预订 书的行为,甲可以( )","o":["请求乙赔偿精神损害","请求乙承担侵权责任","请求乙承担违约责任","解除预订书"],"a":"CD","e":"《民法典》第495条规定:\"当事人约定\n在将来一定期限内订立合同的认购书、订购书、预订\n书等,构成预约合同。当事人一方不履行预约合同约\n定的订立合同义务的,对方可以请求其承担预约合同\n的违约责任。\"C项正确。乙拒绝订立买卖合同,预订\n书的合同目的不能实现,甲可以解除预订书,D项正\n确。本题不涉及侵权,甲不承担侵权责任,B项错误。\n乙的行为不涉及侵犯甲人格权的情形,甲不能请求乙\n赔偿精神损害,A项错误。本题选CD。","k":"合同通则"},{"id":"2022-29","y":2022,"t":"单","s":"A、B、C、D四家公司对E公司负有400万元的连带债务,内部约定每家公司负担四 分之一,现债务到期。对此,下列说法中正确的是","o":["如A的债务被E免除,B、C、D仍需履行400万元债务","如B与E因合并成为同一主体,A、C、D的债务消灭","如C将自己对E的债权与400万元债务抵销,C有权就300万元债务向A、B、D追偿 D.如D履行了400万元债务,其有权请求A、B、C对400万元债务承担连带责任","四家公司对E公司负有400万元的连带债务,内部约定每家公司负担四 分之一,现债务到期。对此,下列说法中正确的是"],"a":"C","e":"根据《民法典》第520条的规定,部分\n连带债务人履行、抵销债务或者提存标的物的,其他\n债务人对债权人的债务在相应范围内消灭;该债务人\n可以依据前条规定向其他债务人追偿。C选项正确。\n如D履行了400万元债务,其有权就300万元债务向\nA、B、C追偿。D选项错误。如A的债务被E免除,\nB、C、D仅需履行剩下的300万元债务。A选项错误。\n部分连带债务人的债务与债权人的债权同归于一人\n的,在扣除该债务人应当承担的份额后,债权人对其\n他债务人的债权继续存在。如B与E因合并成为同\n一主体,A、C、D的债务继续存在。B选项错误。","k":"合同通则"},{"id":"2022-31","y":2022,"t":"单","s":"甲和乙签订了一份合同,未约定履行顺序。甲请求乙先履行,乙以甲未履行为由 拒绝。乙拒绝履行系行使","o":["请求权","抗辩权","形成权","相对权"],"a"
