<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>法硕（非法学）专业基础课 真题刷题</title>
<style>
:root{--bg:#f5f5f2;--card:#fff;--ink:#1d1d1f;--sub:#6b6b70;--line:#e3e3e0;--acc:#2f6fdb;--ok:#1f9d55;--okbg:#e7f6ec;--bad:#d64545;--badbg:#fdeaea;--warn:#b7791f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}
.wrap{max-width:780px;margin:0 auto;padding:12px 14px 80px}
header{display:flex;align-items:center;gap:10px;margin:4px 0 12px}
header h1{font-size:19px;margin:0;flex:1}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.tab{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:15px;white-space:nowrap;cursor:pointer}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.stats b{display:block;font-size:20px}
.stats span{font-size:12.5px;color:var(--sub)}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px;font-size:17px;font-weight:600;cursor:pointer;margin-top:10px}
.btn.pri{background:var(--acc);color:#fff}
.btn.sec{background:#eef1f6;color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.addwb{display:block;margin:6px 2px 0 auto;background:none;border:0;padding:4px 2px;font-size:13px;color:var(--sub);cursor:pointer}
.addwb:disabled{cursor:default;opacity:.7}
.hint{font-size:13px;color:var(--sub);margin-top:6px}
.unit{display:flex;align-items:center;gap:10px;padding:10px 2px;border-top:1px solid var(--line);cursor:pointer}
.unit:first-child{border-top:0}
.unit .rk{width:26px;color:var(--sub);font-size:13px;text-align:right;flex:none}
.unit .nm{flex:1;min-width:0}
.unit .nm div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unit .meta{font-size:12.5px;color:var(--sub)}
.unit .nm div.meta{white-space:normal}
.bar{height:5px;background:#ececea;border-radius:3px;margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.unit.drop{opacity:.6}
.unit .rs{flex:none;border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:8px;padding:3px 9px;font-size:12.5px;cursor:pointer}
.sw{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--sub);margin:4px 0 8px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.back{border:0;background:none;font-size:15px;color:var(--acc);cursor:pointer;padding:6px 0}
.top .where{flex:1;font-size:13px;color:var(--sub);text-align:right;line-height:1.35}
.tag{display:inline-block;font-size:12.5px;color:var(--sub);background:#f0f0ee;border-radius:6px;padding:1px 8px;margin-right:6px}
.tag.rev{background:#fff4e0;color:var(--warn)}
.stem{font-size:18px;margin:10px 0 14px;line-height:1.7}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:11px 13px;margin-bottom:9px;font-size:16.5px;cursor:pointer;color:var(--ink)}
.opt .L{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid #c9c9c6;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600}
.opt.sel{border-color:var(--acc)}
.opt>span:nth-child(2){flex:1;min-width:0}
.oe{display:block;margin-top:5px;font-size:14.5px;line-height:1.6;color:#55555a}
.oe b{color:var(--ink)}
@media (max-width:899px){.oe{font-size:13.5px}}
.opt.sel .L{background:var(--acc);border-color:var(--acc);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ok .L{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt.bad .L{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.miss{border-color:var(--ok);background:var(--okbg)}
.opt.miss .L{border-color:var(--ok);color:var(--ok)}
.judge{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.judge .opt{justify-content:center;font-size:18px;font-weight:600}
.res{border-radius:12px;padding:10px 14px;margin:6px 0 10px;font-weight:600}
.res.ok{background:var(--okbg);color:var(--ok)}
.res.bad{background:var(--badbg);color:var(--bad)}
.res small{font-weight:400;color:var(--sub);display:block}
.box{border-left:3px solid var(--line);padding:2px 0 2px 12px;margin:10px 0;font-size:15px;white-space:pre-wrap;word-break:break-word}
.box b{font-weight:700;color:var(--ink)}
.xp{margin:3px 0}
.xo{display:flex;align-items:flex-start;gap:9px;margin:8px 0}
.xk{flex:none;width:22px;height:22px;margin-top:2px;border-radius:50%;font-size:12.5px;font-weight:700;line-height:22px;text-align:center;color:#fff;background:var(--bad)}
.xo.ok .xk{background:var(--ok)}
.xt{flex:1;min-width:0}
.xo.hit{background:var(--badbg);border:1.5px solid var(--bad);border-radius:8px;padding:4px 7px;margin-left:-8px;margin-right:-8px}
.xo.hit.miss{background:none;border-style:dashed}
.xg{flex:none;align-self:center;font-size:12.5px;font-weight:700;color:var(--bad);background:var(--badbg);border-radius:6px;padding:0 7px}
.xm{margin:4px 0 8px;padding:7px 11px;background:#f4f5f7;border-radius:8px}
.xl{font-weight:700;color:var(--warn);margin-right:8px}
.box h4{margin:0 0 2px;font-size:13px;color:var(--sub);font-weight:600}
.box.book{border-color:#9db8e8}
.box.note{border-color:#e8c48a}
.empty{text-align:center;color:var(--sub);padding:30px 0}
.warnbar{background:#fff4e0;color:#7a5410;border-radius:10px;padding:8px 12px;font-size:13.5px;margin-bottom:10px}
textarea{width:100%;height:90px;font-size:12px;border:1px solid var(--line);border-radius:8px;padding:8px}
.foot{display:flex;gap:8px;flex-wrap:wrap}
.foot button{flex:1;min-width:120px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px;font-size:14px;cursor:pointer}
.wb{padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.wb:first-child{border-top:0}
.wb .a{color:var(--ok);font-weight:600}

.kbd{font-size:12px;color:var(--sub);text-align:center;margin-top:8px}
@media (max-width:520px){.kbd{display:none}.stem{font-size:17px}}
@media (max-width:899px){.quizpg{padding-top:3vh}body{font-size:15px}header h1{font-size:18px}.stem{font-size:16px}.opt{font-size:15.5px}.opt .L{font-size:13px}.judge .opt{font-size:17px}.btn{font-size:16px}.box{font-size:14px}.wb{font-size:14px}.tab{font-size:14px}.back{font-size:14px}.stats b{font-size:19px}}
@media (min-width:900px){
.wrap{max-width:960px;padding-top:20px}
body{font-size:17px}
header h1{font-size:22px}
.quizpg{padding-top:12vh}
.quizpg .card{padding:24px 30px}
.stem{font-size:22px;margin:12px 0 20px}
.opt{font-size:19px;padding:14px 18px;margin-bottom:12px;gap:14px}
.opt .L{width:30px;height:30px;font-size:15px}
.judge .opt{font-size:21px}
.btn{font-size:18px;padding:15px}
.res{font-size:18px}
.box{font-size:16.5px}
.tag{font-size:13.5px}
.top .where{font-size:14px}
.back{font-size:16px}
.unit .meta{font-size:13.5px}
.stats b{font-size:24px}.stats span{font-size:14px}
}
</style>
</head>

[{"sub":"刑法","name":"犯罪构成与客观方面","w":3.0,"L":56,"qs":[{"id":"2005-11","y":2005,"t":"单","s":"下列哪一种犯罪在既遂之后犯罪行为也随之而结束,但由犯罪行为造成的不法状态仍可能继续存在(   )","o":["诈骗罪","故意杀人罪","非法拘禁罪","非法持有枪支罪"],"a":"A","e":"诈骗罪,一般财产到手,诈骗行为即告结束,因此选项A 应选。故意杀人罪,受害人死亡,行为人\n的犯罪行为不一定随之结束,因为行为可能认为受害人没有死亡而继续加害。因此,选项B 也应排除。选项C、D 属\n于继续犯,应当排除。比如,非法拘禁罪,受害人人身自由一旦被非法限制或者剥夺,即可构成既遂,但既遂以后,\n非法限制或者剥夺人身自由的行为仍在继续,人身自由受限的不法状态也继续存在。","k":"犯罪构成与客观方面"},{"id":"2005-2","y":2005,"t":"单","s":"我国刑法分则对犯罪分类的主要根据是(   )","o":["犯罪的一般客体","犯罪的同类客体","犯罪的直接客体","犯罪的对象"],"a":"B","e":"一般客体是指一切犯罪所共同侵犯的我国社会主义社会关系的整体,根据一般客体无法进行犯罪分\n类。而直接客体就是某一具体犯罪直接侵犯的社会关系,仅仅是阐明该具体犯罪,不能说明其他犯罪。犯罪对象相\n同的犯罪并不一定就是犯罪性质相同的犯罪。因此都不是犯罪分类的依据。同类客体是指某一类犯罪所共同侵犯的\n某一类社会关系。我国刑法分则就是按照犯罪侵犯的同类客体,将犯罪分为十大类型,从而形成了完整的刑法分则\n的科学体系。","k":"犯罪构成与客观方面"},{"id":"2005-23","y":2005,"t":"多","s":"下列情形中,应当数罪并罚的有(       )","o":["判决宣告前,查明甲分别实施了三次受贿行为,数额分别为 2 万、3 万、5 万元","乙因受贿被判处有期徒刑二年,缓刑三年,在缓刑考验期内,又查明其另外一起受贿 2 万元的罪行","丙因故意伤害罪被判处有期徒刑三年,在服刑期间又犯故意伤害罪","丁因盗窃罪被判处有期徒刑二年,执行完毕后,发现其在该次盗窃以前还有一起重大盗窃犯罪行为"],"a":"BC","e":"宣告前数罪,罪名相同的,不实行数罪并罚;宣告前的数罪的罪名不同的,才实行数罪并罚。选\n项A 的情形,犯罪数额累计计算,按一罪处理。选项D 的情形,因为前罪刑罚已经执行完毕,当然也没有并罚的问\n题。","k":"犯罪构成与客观方面"},{"id":"2005-3","y":2005,"t":"单","s":"甲因为重男轻女,将妻子刚生下才 3 天的女婴包裹好放在医院门口,躲在一边观察。见有群众围观、议论,便 放心 离开。第二天一早,甲又到医院门口查看,见女婴还在,但女婴却因晚间气温过低被冻死。法官据此判决甲构 成遗弃罪。甲 的行为属于(   )","o":["纯正的作为犯","不纯正的作为犯","纯正的不作为犯","不纯正的不作为犯"],"a":"C","e":"遗弃罪(第261 条),是指对于年老、年幼、患病或者其他没有独立生活能力的人,负有扶养义务\n而拒绝扶养,情节恶劣的行为。据此,遗弃罪只能以不作为方式构成,因此甲的行为属于纯正的不作为犯。","k":"犯罪构成与客观方面"},{"id":"2005-7","y":2005,"t":"单","s":"下列那一种情形,尚不能认为是犯罪行为(   )","o":["甲打电话邀约其朋友李某一起去实施抢劫","乙向其朋友赵某表示要杀掉仇人陈某","丙为了盗窃张某家财产,毒死了张某家的看家犬","丁为方便对刘某实施抢劫,对刘某的活动规律进行跟踪调查"],"a":"B","e":"选项A 属于为了抢劫制造条件的行为,构成犯罪预备;选项B 只是犯意表示,不构成犯罪;选项C\n属于为了盗窃制造条件的行为,构成犯罪预备;选项D 属于为了抢劫制造条件的行为,也构成犯罪预备。","k":"犯罪构成与客观方面"},{"id":"2006-25","y":2006,"t":"多","s":"下列表述中,正确的是(       )","o":["犯罪预备与犯罪未遂相区别的关键在于是否着手实施刑法分则所规定的犯罪实行行为","犯罪预备与犯罪中止相区别的关键在于是否处于犯罪过程中","犯罪行为实行终了,就不能成立犯罪中止","过失犯罪不存在犯罪未遂形态 三.简答题:26、27 小题,每小题 6 分"],"a":"AD","e":"犯罪预备是意志外因素;犯罪中止是否在犯罪过程中自动放弃二者放弃原因不同,犯罪中止包括犯\n罪行为人实施完毕犯罪行为后,犯罪结果出现前,自动采取措施有效的防止犯罪结果的发生,所以说犯罪行为实行\n终了,就不能成立是错误的;应排除BC 两项。 \n三、简答题","k":"犯罪构成与客观方面"},{"id":"2006-3","y":2006,"t":"单","s":"甲唆使乙在某学校食堂的面粉中投放“毒鼠强”一包,造成数十人中毒死亡的结果。法院认定甲构成投放危险物 质罪。甲的行为具备(   )","o":["标准的犯罪构成","复杂的犯罪构成","基本的犯罪构成","修正的犯罪构成"],"a":"D","e":"《刑法》第29 条第1 款规定对于教唆他人犯罪的应当按照他在共同犯罪中所起的作用处罚。依据刑法\n总则犯罪构成分类关于修正的犯罪之构成结合,本题应选D.","k":"犯罪构成与客观方面"},{"id":"2007-2","y":2007,"t":"单","s":"犯罪同类客体最显著的作用是 (   ) 。","o":["区分此罪与彼罪的根据","构建刑法分则体系的根据","确立具体犯罪构成的依据","区分故意犯罪与过失犯罪的根据"],"a":"B","e":"同类客体 \n] 同类客体是指某一类犯罪所共同侵犯的客体,它说明的是某一类犯罪所侵犯的社会 \n利益的某种共同特点,研究同类客体的重要意义在于同类客体原理是建立刑法分则体系的重 \n要理论依据。故答 \n案为 B。 \n- 7 -\n\n \n \n更多考研精品资料,关注淘宝店铺:光速考研工作室","k":"犯罪构成与客观方面"},{"id":"2007-24","y":2007,"t":"多","s":"下列情形中,可以认定为自首的有 (       ) 。","o":["犯罪嫌疑人甲主动向司法机关揭发他人重大犯罪行为","乙故意重伤他人,被家人扭送到司法机关后,如实供述自己的罪行","丙因盗窃行为被公安机关抓获,在审讯中又主动供述其他盗窃罪行","丁贪污公款,在贪污行为被发觉前,主动向司法机关投案,如实供述自己的罪行"],"a":"BD","e":"自首 \n]犯罪以后自动投案,如实供述自己的罪行的,是自首。自动投案,是指犯罪事实或者 \n犯罪嫌疑人未被司法机关发觉,或者虽被发觉,但犯罪嫌疑人尚未受到讯问、未被采取强制 \n \n措施时,主动、直接向公安机关、人民检察院或者人民法院投案。亲友主动报案后,将犯罪 \n嫌疑人送去投案的,也应当视为自动投案。故 B、D 项可以认定为自首。A 项中甲揭发的是 \n他人的犯罪行为,可能成为立功,但不是自首。被采取强制措施的犯罪嫌疑人、被告人和正 \n- 11 -\n\n \n \n更多考研精品资料,关注淘宝店铺:光速考研工作室 \n在服刑的罪犯,如实供述司法机关还未掌握的本人其他罪行的,以自首论,但是如实供述的 \n应当是与司法机关已掌握的罪行属不同种罪行,故 B 项中丙的行为不成 \n立自首。","k":"犯罪构成与客观方面"},{"id":"2007-3","y":2007,"t":"单","s":"甲对某危害结果没有阻止其发生的义务,如果该危害结果发生,甲的不作为行为 (   ) 。","o":["不可能构成犯罪","可能构成纯正的不作为犯罪","可能构成不纯正的不作为犯","可能构成手段不能犯"],"a":"A","e":"不作为犯罪 \n不作为是指行为人有实施某种行为的特定义务且有可能履行这种义务,而行为人 \n消极地不去履行这种义务,因而造成严重的危害后果的行为。在认定不作为时,关键是判明 \n行为人有无实施某种行为的特定义务。本题中甲没有阻止危害结果发生的义务,那么甲的不 \n作为不可能构成犯罪。","k":"犯罪构成与客观方面"},{"id":"2008-12","y":2008,"t":"单","s":"区别拐卖妇女罪与绑架罪的关键是(  )","o":["犯罪对象是否为妇女","是否实施了绑架妇女的行为","是否通过出卖妇女获取钱财","是否非法剥夺了妇女的人身自由"],"a":"C","e":"绑架罪的对象也可以是妇女,故选项A 不应选。根据《刑法》第240 条第2 款,拐卖妇女,儿童是指\n以出卖为目的,有拐骗、绑架、收买、贩卖、接送、中转妇女、儿童的行为之一的。故选项B 不应选。拐卖妇女罪\n与绑架罪都可能限制甚至剥夺受害人的人身自由,故选项D 不应选。拐卖妇女罪的目的是出卖;而绑架罪不以出卖\n为目的,而是以勒索财物或者获取其他不法利益为目的,故本题应选C。","k":"犯罪构成与客观方面"},{"id":"2008-2","y":2008,"t":"单","s":"故意杀人罪(未遂)的犯罪构成属于(  )","o":["基本的犯罪构成","修正的犯罪构成","派生的犯罪构成","减轻的犯罪构成"],"a":"B","e":"基本的犯罪构成,是指刑法条文就某一犯罪的基本形态所规定的犯罪构成。《刑法》第232 条\"故意\n杀人的,处死刑、无期徒刑或者十年以上有期徒刑;情节较轻的,处三年以上十年以下有期徒刑\"就是关于故意杀\n人罪基本构成的规定。修正的犯罪构成,是指以基本的犯罪构成为基础并对之进行补充、扩展而形成的犯罪构成。\n修正的犯罪构成通常包括帮助、教唆、预备、未遂、中止等形态。故本题应选B。 \n标准的犯罪构成,又称普通的犯罪构成,指刑法条文对具有通常法益侵害程度的行为所规定的犯罪构成,比如《刑\n法》第232 条\"故意杀人的、处死刑、无期徒刑或者十年以上有期徒刑\"属于故意杀人罪的标准的犯罪构成。0 派\n生的犯罪构成,是指以标准的犯罪构成为基础,因为具有较轻或者较重的法益侵害程度而从标准的犯罪构成中派生\n出来的犯罪构成,比如《刑法》第232 条\"情节较轻的,处三年以上十年以下有期徒刑\"属于派生的犯罪构成,且\n属于减轻的犯罪构成。","k":"犯罪构成与客观方面"},{"id":"2008-3","y":2008,"t":"单","s":"下列犯罪行为中,属于不作为行为方式的是(  )","o":["甲因高兴将 3 岁儿子抛接但因失手致其死亡","乙分娩婴儿后为掩盖未婚先孕真相将婴儿扔出窗外致婴儿死亡","丙分娩女婴后不愿抚养,遂以 2 万元价格将其卖给他人","丁分娩婴儿后将婴儿弃置于火车站致其冻成重伤"],"a":"D","e":"不作为的危害行为,是指消极的行为即行为人消极地不属行法律义务而危害社会的行为。从表现形式\n看,不作为是消极的行动;从违反法律规范的性质来看,不作为直接违反了某种命令性规范。这项A 属于作为的过\n失致人死亡行为,选项B 属于作为的故意杀人行为,选项C 的出卖行为也是作为行为。选项D 中丁的行为属于拒绝\n履行抚养义务,构成遗弃罪,属于不作为。","k":"犯罪构成与客观方面"},{"id":"2008-7","y":2008,"t":"单","s":"成立犯罪不可缺少的要素是(  )。","o":["犯罪行为","犯罪结果","犯罪目的","犯罪动机"],"a":"A","e":"任何犯罪都必须具备的构成条件包括犯罪客体、犯罪客观方面、犯罪主体和犯罪主观方面。犯罪客观\n方面一般包括危害行为、行为对象、行为的危害结果以及犯罪的时间、地点和方法等要素。其中,危害行为是一切\n犯罪构成客观方面的必要要素,其余的则是选择性要素。故本题应选A","k":"犯罪构成与客观方面"},{"id":"2009-13","y":2009,"t":"单","s":"下列关于犯罪中止的说法中,正确的是(   )。","o":["犯罪中止可以发生在预备犯罪过程中","犯罪中止只能发生在着手实行犯罪以后","犯罪中止只能发生在犯罪行为实行终了以前","出现了损害结果就不能成立犯罪中止"],"a":"A","e":"本题考查犯罪中止。犯罪中止是指犯罪过程中,自动放弃犯罪或者自动有效的防止犯罪结果发\n生的犯停止状态。根据犯罪的不同阶段,犯罪中止可认为预备阶段的中止和实施阶段的 中止。A 选项正确,B 选项\n和C 选项错误。行为人若在实施完毕犯罪行为后、犯罪结果出现之前,自动采取措施有效的避免房子结果发生的,\n同样构成犯罪中止。即使出现了损害结果,但没有出现犯罪构成范围内的犯罪结果的,仍有可能构成犯罪中止。D\n选项错误。因此本题答案为A","k":"犯罪构成与客观方面"},{"id":"2009-17","y":2009,"t":"单","s":"下列犯罪行为中,属于继续犯的是(    )。","o":["甲以非法占有为目的骗取对方当事人 5 万元后逃匿","乙非法剥夺武某人身自由 10 天","丙一夜之间盗窃同一住宅楼 3 户人家财物共 5 万元","丁在实施抢劫过程中致受害人重伤且久治不愈"],"a":"B","e":"本题考查继续犯。继续犯,是指犯罪行为子着手实行之时至其构成既遂、且通常在既遂之后至犯\n罪行为终了的一定时间内,该犯罪行为及其引起的不法状态同时处于持续过程的发展状态。本题中,只有B 选项非\n法拘禁罪符合继续犯的特征。A 选项构成一个简单的诈骗罪,C 选项构成连续犯,D 选项构成结果加重犯。因此本题\n的答案为B","k":"犯罪构成与客观方面"},{"id":"2009-18","y":2009,"t":"单","s":"甲盗割正在使用中的通讯电缆致通讯中断,既符合盗窃罪的犯罪构成,也符合破坏公用电信设施罪的犯罪构成。 甲的犯罪属于(   )。","o":["吸收犯","连续犯","牵连犯","想象竞合犯"],"a":"B","e":"北体考查想象竞合犯。吸收犯是指行为人实施数个犯罪行为,因其所符合的犯罪构成之间有特定\n的依附和被依附关系,从而导致一个不具有独立性的犯罪,被另一个具有独立性的犯罪所吸收,对行为人仅以吸收\n之罪论处,而对被吸收之罪置之于不论的犯罪状态。连续犯,是指行为人基于数个统一的犯罪故意,连续多次实施\n数个性质相同的犯罪行为,触犯同一罪名的发展状态。牵连犯,是行为人实施某种犯罪,方法或结果行为又触犯其\n- 8 -\n\n \n \n更多考研精品资料,关注淘宝店铺:光速考研工作室 \n他罪名的发展状态。想象竞合犯,是指行为人基于一个犯罪意图所支配的数个不同的罪过,实施一个危害行为,而\n触犯两个以上异种罪名的发展状态。本题中,甲的雄伟符合想象竞合犯的行为特征。因此本题的答案为D","k":"犯罪构成与客观方面"},{"id":"2009-21","y":2009,"t":"多","s":"对犯罪客体按照其范围大小可划分为(      )。","o":["一般客体","同类客体","直接客体","复杂客体"],"a":"ABC","e":"本题考查的犯罪的客体的分类。按照范围大小,可将客体分为一般客体、同类客体和直接客体。一\n般客体是指一切犯罪所共同侵犯的我国社会主义社会关系的整体。同类客体是指某一类犯罪所共同侵犯的某一类社\n会关系。直接客体是指某一具体负责直接侵犯的社会关系。因此本题的答案是A、B、C","k":"犯罪构成与客观方面"},{"id":"2009-22","y":2009,"t":"多","s":"下列关于危害结果在犯罪构成中的地位的表述,正确的有(      )。","o":["危害结果是某些犯罪成立的必备要件","危害结果是某些犯罪既遂的必备要件","行为犯的既遂不要求危害结果的实际发生","危险犯的既遂不要求实际危害结果的发生"],"a":"ABCD","e":"本题考查危害结果。危害结果,是指危害社会的行为对我国刑法保护的社会关系所造成的损害。\n在过失犯罪中,将实际造成一定程度的物质性危害结果作为构成犯罪的必要条件。A 选项正确。绝大多数故意犯罪\n中要求一定的物质性危害性结果,如果该种危害结果没有完全发生,那么,犯罪就没有既遂。B 选项正确。行为犯\n只要实施某种行为及构成既遂,不要求危害结果的实际发生。C 选项正确。危险犯已发生严重危害结果的可能性,\n作为构成犯罪的必要条件。D 选项正确。因此本题答案为A、B、C、D。","k":"犯罪构成与客观方面"},{"id":"2009-23","y":2009,"t":"多","s":"下列犯罪行为中,应以盗窃罪追究刑事责任的是(      )。","o":["盗窃信用后冒名使用的","盗窃毒品后自己食用的","盗窃商业秘密再出卖的","盗窃增值税专用发票后出卖的"],"a":"ABD","e":"本题考查盗窃罪。盗窃罪,是指以非法占有为目的,秘密地多次盗窃或窃取数额较大的公私财物\n的行为。《刑法》第196 条规定,盗窃信用卡并使用的依照盗窃罪定罪处罚。A 选项正确。盗窃罪的对象为公私财\n物,盗窃毒品而直接食用的,法律为规定为专门的毒品犯罪,应以盗窃罪论处。B 选项正确。《刑法》第219 条规\n定,盗窃商业秘密后出卖的,以侵犯商业秘密最论处。C 选项错误。《刑法》第210 条规定,盗窃增值税专用发票\n或者可以用于骗取出口退税、抵扣税款的其他发票的,依照盗窃罪定罪处罚。D 选项正确。因此本题答案为A、B、D","k":"犯罪构成与客观方面"},{"id":"2009-3","y":2009,"t":"单","s":"下列关于犯罪客体的表述,错误的是 (   )。","o":["犯罪同类客体是建立刑法分则体系的主要依据","犯罪直接客体就是犯罪行为直接指向的人或物","犯罪直接客体是刑法所保护而被犯罪侵犯的具体社会关系","一个犯罪可以同时侵犯数个直接客体"],"a":"B","e":"本题考查犯罪的客体。犯罪同类客体是指某一类犯罪所共同侵犯的某一类社会关系。我国刑法分则就\n是按照犯罪侵犯的同类客体,将犯罪分为十大类型,从而形成了完整的刑法分则体系。A 选项正确。直接客体就是\n某一具体犯罪直接侵犯的社会关系。B 选项错误,C 选项正确。直接客体可分为简单客体和复杂客体,复杂客体是指\n一种犯罪侵犯了两种以上的具体社会关系。D 选项正确。因此本题的答案为B","k":"犯罪构成与客观方面"},{"id":"2009-4","y":2009,"t":"单","s":"下列犯罪行为中,属于纯正不作为犯的是(   ):","o":["甲过失致陈某重伤后拒不送医,致其死亡","乙对严重残疾的儿子拒绝抚养,致其冻饿身亡","丙对自己负责维修的锅炉不维修,致锅炉爆炸","丁过失引起火险后,不予扑灭,酿成火灾"],"a":"B","e":"本题考查纯正不作为犯。纯正不作为犯,是指根据刑法明文规定只能有行为人以不作为形式实施的\n犯罪。不纯正不作为犯,是指根据刑法规定行为人以不作为形式实施的通常由作为形式实施的犯罪。故意杀人罪、\n爆炸罪、放火罪、的行为一般表现为作为。有时也表现为不作为。因此A\\C\\D 选项构成不纯正的不作为犯罪。根据\n我国刑法第261 条规定,遗弃罪,是指对于老人、年幼、患病或者其他没有独立生活能力的恶人,负有抚养义务而\n- 6 -\n\n \n \n更多考研精品资料,关注淘宝店铺:光速考研工作室 \n拒绝抚养的,情节恶劣的行为。及据此,遗弃罪只能以不作为形式实施,乙的行为属于纯正的不作为犯。因此本题\n的答案为B","k":"犯罪构成与客观方面"},{"id":"2009-5","y":2009,"t":"单","s":"在抢劫犯罪中,犯罪时间(   )。","o":["是抢劫罪的必要要件","是抢劫罪的选择要件","是抢劫罪的加重情节","与抢劫罪的犯罪构成要件无关"],"a":"D","e":"本题考查的是犯罪时间。我国刑法分则固定的大部分犯罪都不以一定的时间、地点和方法为要件。\n在法律明文规定的条件下,是否具有法律要求的时间、地点和方法,是划分犯罪与非罪的重要标准。根据《刑法》\n第263 条规定,以暴力、胁迫或者其他方法抢劫财物的构成抢劫罪。可见在抢劫罪中,犯罪的时间不是犯罪构成的\n要件,也不是量刑的情节。因此本题的答案为D","k":"犯罪构成与客观方面"},{"id":"2009-7","y":2009,"t":"单","s":"间接故意与过于自信的过失区别的关键在于行为人(  )。","o":["对危害结果发生的心理态度不同","对危害结果发生的认识因素不同","对危害结果发生是否积极追求","对危害结果发生是否知情"],"a":"A","e":"本题考查间接故意与过于自信的过失的区别。间接故意,是指行为人明知自己的行为可能发生危害\n社会的结果,并且放任这种结果发生的心理态度。应当预见自己的行为可能发生危害社会的结果,已经预见而轻信\n能够避免,以致发生这种结果的,是过于自信的过失。间接故意对危害结果发生的心理态度是放任。过于自信的过\n失对危害结果发生的心理态度是否定。 A 选项正确。C 选项和D 选项错误。间接故意与过于自信的过失对危害结果\n发生的认识因素多是认识到自己的行为可能发生危害社会的结果。B 选项错误。因此本题答案为A","k":"犯罪构成与客观方面"},{"id":"2011-13","y":2011,"t":"单","s":"下列关于过失犯罪的说法中,正确的是()。","o":["过失犯罪是指行为人对于危害结果的发生没 有预见的犯罪","过失犯罪既可以由不作为方式构成,也可以由 作为方式构成","过失犯罪未造成严重结果的,可以按照犯罪未 遂从轻或者减轻处罚","对具有高度危险的过失行为,即使未造成法 律规定的实害结果,也应当定罪处罚"],"a":"B","e":"过失犯罪包括疏忽大意的过失和过于\n自信的过失。其中,过于自信的过失是指行为人已经\n预见到自己的行为可能发生危害社会的结果,但轻信\n能够避免,以致发生危害结果的心理态度。所以,在\n这种情况下行为人对危害结果的发生是有预见的,所\n以A 选项错误。对过失行为,只有造成严重危害后果\n的才负刑事责任,即过失行为必须造成法律规定的实\n害结果才负刑事责任,因此过失犯罪只有完成形态并\n且只处罚完成形态,过失犯罪不处罚也不存在预备、\n未遂和中止的形态,因此CD选项都错误。过失犯罪\n可以以作为也可以不作为方式构成,故答案选B。","k":"犯罪构成与客观方面"},{"id":"2012-3","y":2012,"t":"单","s":"下列关于犯罪直接客体的说法,正确的是 )。","o":["一个犯罪只侵犯一个直接客体","直接客体是对犯罪进行分类的标准","在犯罪未遂的情况下不存在直接客体","直接客体是指某一犯罪行为直接侵害的特定 社会关系"],"a":"D","e":"犯罪客体是犯罪活动侵害的、为刑法所\n保护的社会利益。犯罪具有社会危害性,必定侵犯某\n种社会利益。直接客体是指某一犯罪所直接侵害的\n某种特定的社会利益。所以应该选D。一个犯罪可\n能不只侵犯一个直接客体,比如抢劫罪,可能既侵犯\n人身权利,也侵犯财产权利。同类客体是对犯罪进行\n分类的标准。犯罪未遂的情况下也存在直接客体,只\n是没有对客体产生实际的损害或者没有产生犯罪人\n心理所预期要造成的损害。","k":"犯罪构成与客观方面"},{"id":"2012-4","y":2012,"t":"单","s":"下列犯罪属千纯正不作为犯的是( )。","o":["重婚罪","遗弃罪","绑架罪","掩饰、隐瞒犯罪所得罪"],"a":"B","e":"不作为犯罪是指消极地不履行法律义\n务而危害社会的行为。不作为行为构成犯罪需要具\n备以下三个条件:(1)行为人负有某种特定的义务。\n(2)行为人具有履行这种义务的能力。(3)行为人\n不履行特定义务,造成或者可能造成危害社会的结\n果。不作为犯罪可以根据是否只能由不作为行为构\n成而分为:(I)纯正的不作为犯,行为和法律规定相\n吻合的不作为犯罪行为,即该行为构成的犯罪本身就\n是不作为犯罪。典型的纯正不作为犯如遗弃罪,拒不\n执行判决裁定罪。(2)不纯正的不作为犯,行为和法\n律规定不相吻合的不作为犯罪行为,即该行为本身应\n当是由作为行为构成的,包括很多种犯罪,比如不作\n为的故意杀人罪等。本题中只有遗弃罪是只能由不\n作为行为完成的犯罪行为,故答案为B。","k":"犯罪构成与客观方面"},{"id":"2013-41","y":2013,"t":"多","s":"下列选项中,属于犯罪不作为成立条件的有 )。","o":["行为人负有特定义务","行为人没有实施任何行为","行为人未履行特定义务","行为人能够履行特定义务"],"a":"ACD","e":"刑法中的不作为,是指消极的身体动\n作,即不为某种行为,这种情况一般是不至于危害社\n会的。因此,不作为要构成犯罪相对于作为构成犯\n罪,需要具备以下条件:(1) 行为人负有某种特定的\n义务。(2) 行为人能够履行义务。(3) 行为人不履\n行特定义务,造成或者有可能造成危害结果。故答案\n为ACD。","k":"犯罪构成与客观方面"},{"id":"2014-5","y":2014,"t":"单","s":"下列关于犯罪对象的说法中,正确的是(","o":["犯罪对象是犯罪客体的载体","犯罪对象的功能是区分此罪与彼罪","犯罪对象是一切犯罪都必须具备的构成要件","犯罪对象是刑法所保护的、为犯罪行为所侵 犯的社会关系"],"a":"A","e":"本题考查的是对犯罪对象概念的理解\n以及犯罪对象和犯罪客体的区别。首先,犯罪对象是\n指刑法规定的犯罪行为所侵犯或直接指向的具体人、\n物或信息。而犯罪客体是法律所保护的为犯罪所侵\n害的社会利益,二者是现象和本质的关系,犯罪客体\n寓于犯罪对象中,揭示犯罪的本质,而犯罪对象是犯\n罪客体的载体。故A选项正确,BCD选项则都是犯罪\n客体的特征。","k":"犯罪构成与客观方面"},{"id":"2014-7","y":2014,"t":"单","s":"人民法院认定,甲公司于2011年12月偷逃税 款,构成犯罪,但该公司已于2012年7月宣告破产。 对于甲公司的逃税犯罪行为( )。","o":["不再予以追究","仍应追究其刑事责任","按照单位犯罪仅追究直接责任人员的刑事 责任","按照自然人犯罪追究直接责任人员的刑事 责任 )"],"a":"C","e":"本题考查的是对单位犯罪的处罚,我国\n《刑法》第31条规定,单位犯罪的,对单位判处罚金,\n并对直接负责的主管人员和其他直接责任人员判处\n刑罚,即对单位犯罪一般实行\n\" 两罚\n\" 原则。但特殊情\n况下也存在单罚,在单罚的场合一般只处罚直接负责\n的主管人员和其他直接责任人员。根据2002年最高\n人民检察院的批复,涉嫌犯罪的单位被撤销、注销、吊\n销营业执照或者宣告破产的,对实施犯罪行为的该单\n位直接负责的主管人员和其他直接责任人员追究刑\n事责任,对该单位不再追诉。本题中由千犯罪单位已\n经破产,故而由其直接责任人员承担单位之罪。因此\n选择C。","k":"犯罪构成与客观方面"},{"id":"2015-2","y":2015,"t":"单","s":"下列选项中,属于犯罪对象的是()。","o":["赌博的筹码","抢夺的财物","行贿的财物","运输毒品的车辆"],"a":"B","e":"本题考查的是对犯罪对象的理解,所谓\n犯罪对象,是指刑法规定的犯罪行为所侵犯或直接指\n向的具体人、物或信息。赌博的筹码和行贿的财物,\n是组成贿赂罪和赌博罪之物,不是贿赂罪和赌博罪的\n犯罪对象,AC错误。运输毒品的车辆属于犯罪工具,\n不是犯罪对象,D错误。财物是抢夺行为所直接指向\n的具体的物,是犯罪对象,B正确。","k":"犯罪构成与客观方面"},{"id":"2015-20","y":2015,"t":"单","s":"甲秘密窃取他人持有的枪支,该行为同时符 合盗窃罪和盗窃枪支罪的犯罪构成。按照我国刑法 理论,这种情形属于( )。","o":["牵连犯","法条竞合","想象竞合犯","结果加重犯"],"a":"B","e":"法条竞合,指刑法中有一些条文之间在\n内容上存在重复或交叉的情况。法条竞合是立法技\n术上的原因造成的,法条竞合犯与犯罪形态无关,纯\n属千法律适用问题。之所以一行为触犯盗窃罪和盗\n窃枪支罪两个法条,是因为盗窃罪与盗窃枪支罪在内\n容上存在重复,盗窃罪的规定为一般条款,盗窃枪支\n罪为特别条款,适用特别法优千一般法原则,B 正确。\n想象竞合犯是指一行为触犯数罪,数罪之间没有内容\n上的重复或交叉现象。牵连犯是实施数个犯罪行为,\n作为该犯罪的手段行为或者目的行为又触犯其他犯\n罪。牵连犯要求行为人实施数个行为,并且行为之间\n具有牵连性。结果加重犯要求实施基本犯罪构成的\n行为,同时又构成一个基本犯罪构成以外的结果,刑\n法对其规定较重法定刑的情况,结果加重犯触犯的是\n一个法条,而非数个法条。ACD均不正确。","k":"犯罪构成与客观方面"},{"id":"2016-18","y":2016,"t":"单","s":"质监局局长甲明知某食品加工厂违法使用食 品添加剂,但未依法采取措施,致食用该厂食品的多 名消费者食物中毒,社会影响恶劣。甲的行为应认定 为()。","o":["食品监管渎职罪","玩忽职守罪","放纵制售伪劣商品犯罪行为罪","滥用职权罪"],"a":"A","e":"食品监管渎职罪,是指负有食品安全监\n督管理职责的国家机关工作人员,滥用职权或者玩忽\n职守,导致发生重大食品安全事故或者造成其他严重\n后果的行为。放纵制售伪劣商品犯罪行为罪,是指对\n生产销售伪劣商品犯罪行为负有追究责任的国家机\n关工作人员,徇私舞弊,不履行法律规定的追究职责,\n情节严重的行为。滥用职权罪、玩忽职守罪是指国家\n机关工作人员滥用职权或玩忽职守,致使公共财产、\n国家和人民利益遭受重大损失的行为。\n本题中,甲负有食品安全监督管理职责,但是甲\n玩忽职守,不采取有效措施制止食品加工厂的违法行\n为,导致多名消费者食物中毒,造成严重后果,甲成立\n食品监管渎职罪,A 选项正确。甲不是对生产、销售\n伪劣产品犯罪行为负有追究责任的国家机关工作人\n员,而是负有食品安全监督管理职责的国家工作人\n员,所以甲不构成放纵制售伪劣商品犯罪行为罪,C\n选项错误。滥用职权罪、玩忽职守罪是一般罪名,食\n品监管渎职罪是特殊罪名,按照特殊法优于一般法的\n原则,甲成立食品监管渎职罪,不成立滥用职权罪、玩\n忽职守罪,B、D选项错误。\n[特别说明]\n《刑法修正案(十一)》中修改了食\n品监管渎职犯罪,增加药品监管渎职犯罪,进一步细\n化食品和药品的渎职犯罪情形,加重了药品监管人员\n的责任。修改后该条文的罪名是食品、药品监管渎\n职罪。","k":"犯罪构成与客观方面"},{"id":"2016-41","y":2016,"t":"多","s":"下列关于刑法中法条竞合的说法,正确的有 )。","o":["法条竞合是指一个犯罪行为同时触犯数个罪 名的犯罪形态","处理法条竞合时一般适用特别法优于普通法 的规则","我国刑法中的法条竞合主要存在于刑法分则 之中","在竞合的数个法条中,仅应择一适用"],"a":"BCD","e":"法条竞合是指刑法中有一些条文之间\n在内容上存在重复或交叉的情况。法条竞合主要存\n在千刑法分则之中,比如诈骗罪与金融诈骗罪、合同\n\n诈骗罪是法条竞合,过失致人死亡罪与交通肇事罪是\n法条竞合,C选项正确。法条竞合是由千法律规定的\n内容有重复、交叉而产生的,一个犯罪行为之所以触\n犯数个法条是由立法技术上的原因造成的,法律竞合\n与犯罪形态无关,纯属法律适用问题。在竞合的数个\n法条中,应择一适用,而不是同时适用,D选项正确。\n处理法条竞合的基本原则:(1)特别法优于一般法,\n适用特别法条排斥一般法条;(2)在法有特别规定的\n情形下,依照法律规定。B选项正确。\n想象竞合是指一个犯罪行为同时触犯数个罪名\n的犯罪形态,A选项不是法条竞合,是想象竞合。","k":"犯罪构成与客观方面"},{"id":"2017-19","y":2017,"t":"单","s":"甲骗取保险金和杀害妻子的犯罪行为属于 )。","o":["想象竞合犯","连续犯","吸收犯","牵连犯"],"a":"D","e":"牵连犯是指实施某个犯罪,作为该犯罪\n的手段行为或结果行为又触犯其他罪的情况。牵连\n犯有两个以上的犯罪行为,触犯了两个以上不同的罪\n名,但只有一个最终的目的。本题中,甲有故意杀人\n和骗取保险金两个行为,触犯了故意杀人罪和保险诈\n骗罪两个罪名,但只有一个最终的目的一骗取保险\n金,所以甲的犯罪行为是牵连犯,D项正确。想象竞\n合犯是指行为人实施一个犯罪行为同时触犯数个罪\n名的情况。本题中甲有两个犯罪行为,不是想象竞合\n犯,A项错误。连续犯指行为人基千同一或者概括的\n犯罪故意,连续多次实施犯罪行为,触犯相同罪名的\n犯罪。本题中,甲不是基于同一的犯罪故意,触犯的\n是不同罪名,不是连续犯,B项错误。吸收犯是指一\n个犯罪行为因为是另一个犯罪行为的必经阶段、组成\n部分、当然结果,而被另一个犯罪行为吸收的情况。\n杀人不是骗取保险金的必经阶段,所以甲的行为不是\n吸收犯,C项错误。","k":"犯罪构成与客观方面"},{"id":"2017-3","y":2017,"t":"单","s":"下列选项中,构成纯正不作为犯罪的是()。","o":["甲将生活不能自理的母亲锁在家中,外出数 天致母亲饿死","乙(纳税人)作假账,少缴纳税款数额巨大且 占应纳税额的20%","丙(司机)驾驶时,离开公交车驾驶岗位与乘 客斗殴,造成交通事故","丁(医生)在飞机上目睹乘客心脏病突发未予 施救,该乘客不治身亡"],"a":"B","e":"纯正不作为犯是指行为人行为构成了\n法定的犯罪行为本身就是不作为的犯罪,也就是说行\n为人的行为形式与法定的犯罪行为形式是一致的,都\n是不作为。不纯正不作为犯是指行为人因不作为而\n构成了法定犯罪行为是作为的犯罪,也就是说行为人\n的行为形式(不作为)与法定的犯罪行为形式(作为)\n不一致。A项中甲有赡养母亲的义务,但是他没有履\n行义务,在外出数天时将生活不能自理的母亲锁在家\n中,造成母亲死亡,甲以不作为的方式构成故意杀人\n罪,是不纯正不作为犯,A项错误。B项中乙采用做\n假账的方式,少缴纳税款,数额巨大且占应纳税额的\n20%,成立逃税罪。逃税罪是纯正不作为犯,纳税人\n有纳税的义务,且能够履行该义务,但是行为人不履\n行义务,逃避缴纳税款数额较大且占应纳税额10%以\n上。逃税罪规定的犯罪行为形式就是不作为,乙的行\n为方式也是不作为,所以乙是纯正不作为犯,B项正\n确。C项中丙有安全驾驶的义务,但是丙没有履行该\n义务,擅离驾驶岗位与乘客斗殴,造成交通事故,以不\n作为的方式成立以危险方法危害公共安全罪,是不纯\n正不作为犯,C项错误。D项中丁的行为属于\n\" 见危\n不救\n\",《刑法》目前未将\n\" 见危不救\n\" 规定为犯罪,丁\n不构成犯罪,D项错误。\n[特别说明]\nC选项涉及司机与乘客斗殴的问\n题。《刑法修正案(十一)》在危险驾驶罪条文后面增\n设了一个新的罪名:妨害安全驾驶罪。即对行驶中的\n公共交通工具的驾驶人员使用暴力或者抢控驾驶操\n纵装置,干扰公共交通工具正常行驶,危及公共安全\n的,处一年以下有期徒刑、拘役或者管制,并处或者单\n处罚金。值得关注的是,该罪与以危险方法危害公共\n安全罪是低位阶与高位阶的关系,如果抢夺方向盘的\n暴力程度达不到以危险方法危害公共安全罪所要求\n的暴力程度时就可以定该罪。上述驾驶人员在行驶\n的公共交通工具上擅离职守,与他人互殴或者殴打他\n人,危及公共安全的,依照妨害安全驾驶罪的规定处\n罚。即对司机也要视情节严重程度来确定是构成妨\n害安全驾驶罪还是构成以危险方法危害公共安全罪。\n该修改不影响本题答案。","k":"犯罪构成与客观方面"},{"id":"2017-4","y":2017,"t":"单","s":"甲基于杀人故意实施的下列行为,与乙的死亡 之间具有刑法上因果关系的是()。","o":["甲劝乙乘坐长途汽车去山区旅行,乙旅行时 因汽车坠崖死亡","甲在家中“作法”诅咒与其有矛盾的乙,后乙 突发急病死亡","甲殴打乙致其轻伤,乙在去医院途中被高楼上 坠落的花盆砸中死亡","甲持木棍对乙穷追不舍,乙迫不得已跳人冰 冷的河中因痉挛而溺水死亡"],"a":"D","e":"刑法因果关系是危害行为与危害结果\n之间的一种客观的引起与被引起的关系。因果关系\n具有客观性相对性、必然性和复杂性。A项中甲劝\n乙去山区旅行,乙因汽车坠崖而死亡,乙的死亡与汽\n车坠崖有因果关系,与甲的劝说行为没有必然的联\n系,因此也就没有刑法上的因果关系,A项错误。B\n项中甲是迷信犯,\"作法\n\" 诅咒本身不会导致他人死\n亡,甲的行为与乙的死亡之间没有因果关系,B项错\n误。C 项中乙的死亡是由于被高楼坠落的花盆砸中,\n甲只是致乙轻伤,花盆砸中乙是介入因素,中断了甲\n\n的行为与乙的死亡之间的因果关系,因此甲的行为与\n乙的死亡之间没有因果关系,C项错误。D项因为甲\n的追赶导致乙不得已跳入水中溺水而亡,甲的行为与\n乙的死亡之间介人了乙的跳水行为,但该行为是迫不\n得已的,是甲的追赶行为导致的高概率事件,因此甲\n的行为与乙的死亡之间具有刑法上的因果关系,D项\n正确。","k":"犯罪构成与客观方面"},{"id":"2017-5","y":2017,"t":"单","s":"甲想用水果刀伤害张三,却失手将张三旁的李 四捅伤。这种情形在我国刑法中属于()。","o":["因果关系错误","打击错误","行为性质错误","意外事件"],"a":"B","e":"事实认识错误是指行为人对与自己行\n为有关的事实情况有不正确的理解,包括客体错误、\n对象错误、手段错误、行为偏差和因果关系错误。因\n果关系错误是指行为人对自己的行为和所造成的结\n果之间因果关系的实际情况发生误认。行为偏差又\n叫打击错误,是指行为人预想打击的目标与实际打击\n的目标不一致。行为性质错误就是客体错误,是指行\n为人预想侵犯的对象与实际侵犯的对象在法律性质\n上不同(分属不同的犯罪构成)。意外事件是指行为\n在客观上造成了损害结果,但是行为人对该结果的发\n生既无故意也无过失,损害结果的发生是由于不能预\n见的原因引起的。本题中,甲预想伤害的目标是张\n三,但是失手将李四捅伤,属于预想打击的目标与实\n际打击的目标不一致,是打击错误,B项正确。张三\n和李四都是人,在法律性质上相同,按照\n\" 法定符合\n说\n\",甲不管捅伤谁都成立故意伤害罪,甲的情形不属\n于行为性质错误,C项错误。甲对自己的行为与乙的\n受伤结果之间的因果关系没有发生误认,不是因果关\n系错误,A项错误。甲有伤害他人的故意,对他人受\n伤的结果不是既无过意也无过失,李四受伤不是意外\n事件,D项错误。","k":"犯罪构成与客观方面"},{"id":"2018-16","y":2018,"t":"单","s":"甲误把张某当作李某推入水井,意图将其 淹死,但事实上井中无水,结果张某摔死,这属于 ()。","o":["客体错误","工具错误","打击错误","因果关系错误"],"a":"D","e":"对象错误,指行为人预想侵犯的对象与\n行为人实际侵犯的对象在法律性质上是相同的(属于\n同一构成要件)。因果关系错误,指行为人对自己的\n行为和所造成的结果之间因果关系的实际情况发生\n误认。本题中甲误将张某当作李某,是对象错误。张\n某没有淹死而是摔死,是因果关系错误,既有对象错\n误也有因果关系错误,但是选项中并没有对象错误,\n因此选因果关系错误,本题的情形属千狭义的因果关\n系错误,D项正确。","k":"犯罪构成与客观方面"},{"id":"2018-2","y":2018,"t":"单","s":"犯罪分子为日后向甲勒索财物,用枪威逼甲杀 死一名路人并录像。 甲的杀人行为属于( )。","o":["正当防卫","紧急避险","自救行为","犯罪行为"],"a":"D","e":"正当防卫的防卫对象只能是不法侵害\n人,本题中,甲侵害的是路人,故A错误;紧急避险要\n求不得超过必要限度,保护的利益必须大于侵害的合\n法利益,且在我国法律界一般认为他人的生命不能当\n作避险对象,B错误;自救行为是自己采取措施而不\n是被胁迫采取措施,C错误;此处甲被用枪威逼杀人\n的情形较为特殊,具体如何认定有一定争议,一般认\n为该情形属于胁从犯,生命面前人人平等,不能以命\n换命,仍需承担故意杀人的刑事责任,但被胁迫杀人\n可在量刑时作为减刑参考,因此甲的行为依然是犯罪\n行为,本题选D。","k":"犯罪构成与客观方面"},{"id":"2018-5","y":2018,"t":"单","s":"我国刑法规定,故意杀人,情节较轻的,处三年 以上十年以下有期徒刑,本条规定属于故意杀人的","o":["修正的犯罪构成","标准的犯罪构成","加重的犯罪构成","减轻的犯罪构成"],"a":"D","e":"基本的犯罪构成,指刑法条文就某一犯\n罪的基本形态所规定的犯罪构成。修正的犯罪构成,\n指以基本的犯罪构成为基础并对之进行补充、扩展所\n形成的犯罪构成。修正的犯罪构成通常包括故意犯\n罪的未完成形态以及共同犯罪形态。本题题干的规\n定不是对未完成罪或共同犯罪的规定,不属于修正的\n犯罪构成,A项错误。标准的犯罪构成,指刑法条文\n对具有通常社会危害程度的行为所规定的犯罪构成。\n派生的犯罪构成,指以标准的犯罪构成为基础,因为\n具有较轻或较重的法益侵害程度而从标准的犯罪构\n成中派生出来的犯罪构成,包括减轻的犯罪构成和加\n重的犯罪构成。本题题干的规定,比一般故意杀人的\n情节要轻,处罚也轻,因此是减轻的犯罪构成,D项\n正确。","k":"犯罪构成与客观方面"},{"id":"2019-1","y":2019,"t":"单","s":"追诉期限的长短应与犯罪的社会危害性程度、 刑罚的轻重相适应。下列对于追诉时效的表述,正确 的是()。","o":["法定最高刑为死刑的犯罪,经过20年,则一律 不再追诉","被害人在追诉期限内提出控告,公安机关应当 立案而不予立案的,超过20年即不再追诉","挪用公款归个人使用进行非法活动的,追诉期 限从挪用行为实施完毕之日起计算","玩忽职守行为造成的重大损失当时没有发 生,而是在玩忽职守行为后一定时间发生的, 应从玩忽职守行为时起计算追诉期限"],"a":"C","e":"C项正确。最高人民法院《关于挪用公\n款犯罪如何计算追诉期限间题的批复》规定,挪用公\n款归个人使用,进行非法活动,或者挪用公款数额较\n大进行营利活动的,犯罪的追诉期限从挪用行为实\n施完毕之日起计算;挪用公款数额较大、超过三个月\n未还的,犯罪的追诉期限从挪用公款罪成立之日起计\n算。挪用公款行为有连续状态的,犯罪的追诉期限应\n当从最后一次挪用行为实施完毕之日或者犯罪成立\n之日起计算。《刑法》第87条规定,犯罪经过下列期\n限不再追诉:(一)法定最高刑为不满五年有期徒刑\n的,经过五年;(二)法定最高刑为五年以上不满十年\n有期徒刑的,经过十年;(三)法定最高刑为十年以上\n有期徒刑的,经过十五年;(四)法定最高刑为无期徒\n刑、死刑的,经过二十年。如果二十年以后认为必须\n追诉的,须报请最高人民检察院核准。故A项错误,\n表述得太过绝对。法定最高刑为死刑的犯罪,经最高\n人民检察院核准,即使追诉时效经过二十年,也可以\n追诉。第88条规定:在人民检察院、公安机关、国家\n安全机关立案侦查或者在人民法院受理案件以后,逃\n避侦查或者审判的,不受追诉期限的限制。被害人在\n追诉期限内提出控告,人民法院、人民检察院、公安机\n关应当立案而不予立案的,不受追诉期限的限制。故\nB项错误。《全国法院审理经济犯罪案件工作座谈会\n纪要》规定,玩忽职守行为造成的重大损失当时没有\n发生,而是玩忽职守行为之后一定时间发生的,玩忽\n职守罪的追诉期限应当从危害结果发生之日起计算。\n故D项错误。","k":"犯罪构成与客观方面"},{"id":"2019-13","y":2019,"t":"单","s":"下列情形中,成立不作为犯罪的是(","o":["某县法院院长甲目睹身为县财政局局长的妻 子收受其下属的巨额贿赂,不予阻止","乙见室友在门口遭遇持刀抢劫,因害怕将房门 反锁导致室友无处躲藏被刺成重伤","收养人丙发现所收养的两岁小孩患有先天性 心脏病,将孩子独自留在家中致其饿死","丁在妻子难产时拒绝在剖腹产手术同意书上 签字,妻子难忍疼痛从病房楼跳下身亡"],"a":"C","e":"l\n不作为构成犯罪,需要具备以下前提条\n件:(l)行为人负有某种特定的义务。即:法律上的\n明文规定;行为人职务上、业务上的要求;行为人的法\n律地位或法律行为所产生的义务;行为人自己先前行\n为具有发生一定危害结果的危险的,负有防止其发生\n的义务。(2) 行为人能够履行义务。(3) 行为人不\n履行特定义务,造成或者可能造成危害结果。本题\n中,C项丙在收养两岁小孩后,在丙与小孩之间形成\n父母子女关系,丙具有法定的抚养照顾小孩的义务,\n但是丙没有履行义务,造成小孩饿死,其行为构成不\n作为犯罪,C项正确。A选项甲作为丈夫,不负有法\n律上明文规定的阻止妻子收受贿赂的义务。选项B\n乙也不负有特定救室友的义务,室友的死亡也不是行\n为人先前行为所造成的。选项D妻子跳楼身亡与丁\n拒绝签字之间不具有刑法上的因果关系。","k":"犯罪构成与客观方面"},{"id":"2019-41","y":2019,"t":"多","s":"下列对于我国刑法第13条中“...但是情节 显著轻微危害不大的,不认为是犯罪”的理解,正确的 有()。","o":["避免给轻微的违法行为打上“犯罪”的标记","表明认定犯罪需要正确“定性”及合理“定量”","是区分“违法行为”与“犯罪行为”的宏观标准 ·","合理配置司法资源以集中力量惩罚“严重违 法行为”"],"a":"ABCD","e":"《刑法》第13条规定\n\"但是情节显著轻\n微危害不大的,不认为是犯罪。\n\"这一条中的犯罪定义\n既包含定性要求又含定量要求,对于合理认定犯罪及\n处罚犯罪具有重要的意义。\"但书\n\" 表明认定犯罪不\n仅仅需要正确\n\"定性\n\",还需要合理确定危害的\n\"程\n度\n\"或\n\"量\n\"。\"但书\n\" 是区分\"违法行为\n\" 与\n\"犯罪行\n为\n\"的宏观标准,可以缩小犯罪或刑事处罚的范围,避\n免给一些轻微的危害行为(或违法行为)打上犯罪的\n标记,有利于行为人改过自新,还可以合理配置司法\n资源,集中力量惩罚严重的违法行为——犯罪。因\n此,ABCD项均正确。","k":"犯罪构成与客观方面"},{"id":"2020-11","y":2020,"t":"单","s":"下列关于刑法因果关系的说法中,正确的是 )。","o":["因果关系的认定必须考虑行为人的主观认识","因果关系的存在是行为人承担刑事责任的充 分条件","危害行为与危害结果之间存在条件关系即可 认定因果关系存在","不作为犯罪中不作为与危害结果之间的因果 关系是客观存在的"],"a":"D","e":"刑法中的因果关系是不以人的主观意\n志为转移的客观存在,不受行为人主观认识的影响,D\n选项正确,A选项错误。有因果关系是行为人对危害\n结果承担刑事责任的客观条件,不是充分条件,B选\n项错误。如果危害行为与危害结果之间介入了其他\n因素,则有可能使得危害行为与危害结果之间的因果\n关系被阻断,C选项错误。","k":"犯罪构成与客观方面"},{"id":"2020-18","y":2020,"t":"单","s":"下列关于强奸罪的说法中,正确的是 )。","o":["强奸罪的犯罪对象可以是男性","强奸罪的犯罪主体不可以是女性","只要与幼女发生性关系就应以强奸罪论处","强奸引起被害人自杀的,不属于强奸“致使被 害人死亡”"],"a":"D","e":"强奸罪是指违背妇女意志,以暴力、胁\n迫或者其他手段,强行与其发生性交或者奸淫不满14\n周岁的幼女的行为。该罪的犯罪对象只能是女性,A\n选项错误。妇女不能单独成为强奸罪的直接实行犯,\n\n但可以成为强奸罪的共犯或者间接实行犯,B选项错\n误。与幼女发生性关系构成强奸罪,要求行为人明知\n对方是幼女或可能是幼女。12~ 14周岁的幼女,如果\n发育成熟,身材高大,谎称自己已成年,主动与行为人\n发生性关系,行为人不知道对方是幼女的,不能认定\n为强奸罪,C选项错误。强奸\n\" 致使被害人重伤、死\n亡\n\"是指因强奸行为本身导致被害人性器官严重损伤\n或者造成其他严重伤害,甚至当场死亡或者经治疗无\n效死亡的,不包括被害人事后自杀身亡,D选项正确。","k":"犯罪构成与客观方面"},{"id":"2020-4","y":2020,"t":"单","s":"不作为犯罪的主观方面( )。","o":["只能是过失","只能是故意","不要求故意及过失","可以是故意也可以是过失"],"a":"D","e":"不作为犯罪是指行为人负有某种义务,\n能够履行而不履行造成或可能造成危害结果所构成\n的犯罪,不作为是不为某种行为,属于犯罪客观方面\n的范畴,与故意、过失之间不存在对应关系。行为人\n可以是故意,如不作为故意杀人罪,也可以是过失,如\n不作为的重大责任事故罪。故D选项正确,ABC选项\n错误。","k":"犯罪构成与客观方面"},{"id":"2021-42","y":2021,"t":"多","s":"下列关千犯罪客体的理解中,正确的有","o":["犯罪客体与犯罪对象之间是本质与现象的 关系","我国刑法分则体系主要以同类客体为基础加 以构建","一般客体是指社会主义社会关系的整体","重婚犯罪侵害的直接客体是婚姻自由权利"],"a":"ABC","e":"犯罪客体与犯罪对象之间是本质与现\n象的关系,犯罪客体寓于犯罪对象之中,揭示犯罪的\n本质,而犯罪对象是它的载体,A项正确。我国刑法\n分则主要按照同类客体把所有的犯罪分为十类,并以\n此为基础构筑刑法分则体系,B项正确。一般客体是\n指一切犯罪所共同侵犯的社会利益,即社会主义社会\n利益的总体,C项正确。重婚罪侵犯的客体是一夫一\n妻制的婚姻关系,D项错误。本题选ABC。","k":"犯罪构成与客观方面"},{"id":"2022-1","y":2022,"t":"单","s":"下列对于我国刑法中犯罪构成要件的理解,正确的是","o":["刑法总则规定了犯罪构成的一般要件","刑法分则中的犯罪主观方面仅包括故意和过失","法条竞合的数罪具备完全相同的犯罪构成要件","因果关系是所有犯罪都必须具备的犯罪构成要件"],"a":"A","e":"刑法总则规定的是犯罪和刑罚的一般\n原理、原则,包括刑法的任务、基本原则、适用范围、构\n成犯罪的一般要件、刑事责任、共同犯罪、刑罚的种类\n及刑罚的具体运用制度等内容,是对定罪与量刑过程\n中的一些共性问题的规定。A选项正确。犯罪主观\n方面包括犯罪故意、犯罪过失、犯罪目的、犯罪动机等\n心理因素。其中故意或者过失是犯罪构成主观方面\n的必要要素,犯罪目的是某些犯罪成立所必须具备的\n要素,犯罪动机一般不是犯罪的要件,但它对量刑起\n着重要的作用。B选项错误。法条竞合是指刑法中\n有一些条文之间在内容上存在重复或交叉的情况,法\n条竞合的数罪并非具备完全相同的犯罪构成要件。C\n选项错误。所有犯罪都必须具备的犯罪构成要件包\n括:(1)犯罪客体;(2)犯罪客观方面;(3)犯罪主\n体;(4)犯罪主观方面。因果关系是危害行为与危害\n结果之间的一种客观的引起与被引起的联系,不属于\n犯罪构成的一般要件。D选项错误。","k":"犯罪构成与客观方面"},{"id":"2024-2","y":2024,"t":"单","s":"犯罪预备行为与犯罪实行行为的实质区别在于()","o":["是否违反行政法等前置法","是否直接侵害犯罪客体","是否基于实施犯罪的故意","是否可以对其进行防卫"],"a":"B","e":"","k":"犯罪构成与客观方面"},{"id":"2024-41","y":2024,"t":"多","s":"关于社会危害性的说法,正确的是()","o":["行为没有社会危害性,就不应该规定为犯罪","犯罪的社会危害性是各种主观因素和客观因素的统一","社会危害性是否达到严重程度,是犯罪与其他违法行为的根本性区别","社会危害性是指行为对刑法所保护的社会关系造成或可能造成损害的特性"],"a":"ABCD","e":"","k":"犯罪构成与客观方面"},{"id":"2025-1","y":2025,"t":"单","s":"犯罪行为与违法行为的根本区别在于( )","o":["行为自身是否具有违法性","行为人是否需要承担法律后果","行为主体是否具有有责性","社会危害性是否达到相当严重的程度"],"a":"D","e":"严重的社会危害性是犯罪的实质特征。国家之所以要禁止、惩罚犯罪行为,就是\n因为它违反了社会基本伦理规范,侵犯了国家、社会和个人的法益,破坏了公共秩序。犯罪行\n为与违法行为的根本区别就在于犯罪行为具有严重的社会危害性,而违法行为没有达到严重危\n害的程度,D 项正确。A 项错误,违法行为与犯罪行为均具有违法性。B 项错误,违法行为与\n犯罪行为均需要承担法律后果。C 项错误,实施违法行为和犯罪行为的主体均具有有责性。本\n题选D。","k":"犯罪构成与客观方面"},{"id":"2025-7","y":2025,"t":"单","s":"下列选项中,构成不纯正不作为犯的是( )","o":["甲持有假币,数额较大","乙虚列支出逃避缴纳税款,数额巨大","丙酒后驾车致车辆侧翻,造成乘车人死亡","丁沉迷赌博数日不归,致瘫痪在床的父亲饿死"],"a":"D","e":"不纯正不作为犯是指行为人以不作为的方式实施了通常由作为构成的犯罪。D 项\n丁有抚养义务而不抚养,致瘫痪在床的父亲饿死,构成不作为的故意杀人罪,属于不纯正不作\n为犯,D 项正确。甲构成持有假币罪,是作为犯罪,A 项错误。B 项构成逃税罪,是纯正不作\n为犯,B 项错误。交通肇事罪,是作为犯罪,C 项错误。本题选D。","k":"犯罪构成与客观方面"},{"id":"2026-1","y":2026,"t":"单","s":"下列表述中,体现马克思主义的犯罪实质概念观点的是","o":["犯罪是对他人权利的一种侵犯行为","犯罪的本质在于对社会共同法益的侵害","犯罪是藐视社会秩序的最明显、最极端的表现","犯罪是出于不道德的动机而实施的行为"],"a":"C","e":"马克思主义犯罪实质概念认为,犯罪是孤立个人反抗统治关系最极端、最\n明显的表现,是对现存社会秩序的蔑视。\nA 是权利侵害说、B 是法益侵害说(大陆法系)、D 是道德过错说,均非马克思主\n义观点。","k":"犯罪构成与客观方面"},{"id":"2026-11","y":2026,"t":"单","s":"下列有关犯罪构成理论的理解,正确的是","o":["犯罪构成理论仅关注具体犯罪的构成","可以通过犯罪构成理论直接认定犯罪","不同犯罪构成理论模式的优劣显而易见","犯罪构成理论为追究犯罪人的刑事责任提供基础"],"a":"D","e":"犯罪构成是认定刑事责任的基础,为追责提供标准。\nA 犯罪构成兼具一般理论+分则各罪构成;B 不能仅靠理论直接定罪,需结合案件\n事实;C 不同理论各有优劣,无显而易见优劣。","k":"犯罪构成与客观方面"},{"id":"2026-4","y":2026,"t":"单","s":"下列对于作为义务的理解,正确的是","o":["医生对拒不支付医疗费的病人不负有救助义务","休假中的警察对危险情形的公民负有救助义务","受雇看护儿童的保姆在紧急情况下对儿童不负有保护义务","行为人故意伤害他人后,对生命垂危的被害人负有救助义务"],"a":"D","e":"先行行为产生救助义务。甲故意伤害致被害人重伤,先行不法行为使甲负\n\n有救助义务。\nA 医生基于医疗合同有救助义务,与是否缴费无关;B 休假警察无职务救助义务;\nC 保姆基于雇佣监护关系负有保护义务。","k":"犯罪构成与客观方面"}]},{"sub":"刑法","name":"刑法基础与效力","w":2.7,"L":53,"qs":[{"id":"2005-1","y":2005,"t":"单","s":"甲于 1997 年 8 月实施了故意杀人行为,于 2004 年 7 月被抓获归案。在 1979 年刑法和 1997 年刑法中故意 杀人罪定罪 处刑标准、法定刑完全相同。对本案(   )","o":["应适用 1997 年刑法","应适用 1979 年刑法","由审理本案的法院审判委员会决定适用 1979 年刑法还是 1997 年刑法","报请最高人民法院裁定适用 1979 年刑法还是 1997 年刑法"],"a":"B","e":"根据刑法第12 条,刑法不溯及既往,除非新刑法对犯罪人有利,即不认为是犯罪或者处刑较轻。本\n案中,1979 年刑法与1997 年刑法就故意杀人罪定罪处刑标准、法定刑完全相同,因此仍应当适用犯罪行为当时的\n1979 年刑法。","k":"刑法基础与效力"},{"id":"2005-18","y":2005,"t":"单","s":"甲男(15 岁)与乙女(13 岁)在同一所中学上学,二人在参加校文体活动时相识并成为好友,关系日渐密切。 某 日二人在公园发生性关系时被发现。据甲交待,二人还曾在家中发生过一次性关系。甲、乙均表示是双方自愿。 乙的家长要 求追究甲的刑事责任。经调查二人确属自愿且未造成其他严重后果。甲的行为(   )","o":["构成奸淫幼女罪","构成强奸罪","情节显著轻微、危害不大,不认为是犯罪","构成儿童罪"],"a":"C","e":"奸淫幼女罪的罪名,已经取消,排除选项A。猥亵儿童罪的对象是不满14 周岁的儿童,猥亵行为\n既可以是强制性的,也可以是非强制性的;猥亵故意是刺激或满足性欲,如儿童是幼女,则男性行为人不具有奸淫\n的意图,否则构成强奸罪。因此,选项D 排除。《最高人民法院关于审理强奸案件有关问题的解释》中规定:对于\n已满14 周岁不满16 周岁的人与幼女发生性关系,情节轻微、尚未造成严重后果的,不认为是犯罪。在本案,甲男\n尽管已满十四周岁,但其与乙女发生性关系,确属自愿且未造成其他严重后果,因此不构成强奸罪,选项C 应选。","k":"刑法基础与效力"},{"id":"2005-21","y":2005,"t":"多","s":"根据我国刑法规定,对下列哪些情形适用属地管辖原则(       )","o":["外国人甲在中国境外打猎,因疏忽大意击中中国境内的外国公民斯某,致其重伤","外国人乙乘坐外国航空器,当该航空器进入中国领空时在该航空器上实施犯罪","中国人丙乘坐中国民用航空器,当该航空器进入外国领空时在该航空器上实施犯罪","中国人丁在中国境内打猎,因过于自信的过失造成中国境外外国公民布某重伤"],"a":"ABCD","e":"对属地管辖的把握,首先注意把握\"地\"的含义。属地管辖的\"地\"包括中国领域,即领土、\n领水、领空;中国船舶或者航空器内也视为中国领域(第6 条第2 款)。其次,对于属地管辖意义上的\"犯罪地\"\n既包括犯罪行为地,也包括犯罪结果地(第6 条第3 款)。选项A,犯罪结果地在中国领域内;选项B 犯罪行为地,\n同时也在中国领空内;选项C,犯罪行为地在中国航空器内;选项D,犯罪行为地在中国领域内。因此,选项ABCD\n都应选。","k":"刑法基础与效力"},{"id":"2005-8","y":2005,"t":"单","s":"甲前往乙住所杀乙,到达乙居住地附近,发现周围停有多辆警车,并有警察在活动,感到无法下手,遂返回。甲 的行为属于(   )","o":["犯罪预备","犯罪中止","犯罪未遂","没有犯罪行为"],"a":"A","e":"甲前往乙住所,并到达乙居住地附近,这只是构成开始预备犯罪,尚未着手实行犯罪,由于甲意志\n以外的因素致使犯罪无法实行,因此构成犯罪预备。","k":"刑法基础与效力"},{"id":"2006-1","y":2006,"t":"单","s":"如果某犯罪案件不是发生在中国领域,且该案犯罪人不是中国公民,被害人也不是中国国家或者中国公民,但中 国对此案仍能行使刑事管辖权的,是基于(   )","o":["属地管辖原则","普遍管辖原则","保护管辖原则","属人管辖原则"],"a":"B","e":"见刑法的空间效力中普遍管辖原则的规定。","k":"刑法基础与效力"},{"id":"2006-2","y":2006,"t":"单","s":"下列做法中不违背罪刑法定原则要求的是(   )","o":["重法效力溯及既往","法律规定不确定的刑罚","适用行为后的轻法","适用类推解释"],"a":"C","e":"本题考查的是罪刑法定原则的使用。选项ABD 都不服题意,而C 项中的刑法的溯及力中关于刑法生效\n前时间效力明确 \"从旧兼从轻原则\"的规定,也属罪刑法定所以应选C 项。","k":"刑法基础与效力"},{"id":"2007-1","y":2007,"t":"单","s":"我国刑法规定:凡在中国船舶或者航空器内犯罪的,适用中国刑法。其确定刑法效力范围的根据是 (   ) 。","o":["属地原则","属人原则","保护原则","普遍管辖原则"],"a":"A","e":"刑法的空间效力 \n \n] 根据国际条约和国际惯例,中国的船舶和航空器视为中国领土的延伸,属于中国的 \n领域范围。该规定的意思是在中国领域内犯罪的适用中国刑法,那么其确定财法效力范围的 \n根据是属地原则, \n答案为 A。","k":"刑法基础与效力"},{"id":"2007-21","y":2007,"t":"多","s":"下列选项中,符合罪刑法定原则的有 (       ) 。","o":["犯罪与刑罚必须由立法明确规定","禁止重法效力溯及既往","禁止采用习惯法","禁止对犯罪人判处不定期刑"],"a":"ABCD","e":"罪刑法定原则 \n]罪刑法定原则要求\"法律明文规定为犯罪行为的,依照法律定罪处刑;法律没有明文 \n规定为犯罪行为的,不得定罪处刑\"。除此之外,罪刑法定原则的派生原则包括:排斥习惯 \n法、排斥绝对不定期刑、禁止有罪类推、禁止重法溯及既往。","k":"刑法基础与效力"},{"id":"2008-13","y":2008,"t":"单","s":"下列情形中,属于牵连犯特征的是(  )","o":["实施某个犯罪,其手段行为又触犯其他罪名","实施一个犯罪行为触犯数个罪名","数个犯罪行为触犯同一罪名","犯罪即遂状态与犯罪造成的不法状态同时存在"],"a":"A","e":"牵连犯,是指实施某个犯罪,该犯罪的手段行为或者结果行为又触犯其也罪的情况。在牵连犯中,有\n两个以上犯罪行为,且触犯两个以上不同的罪名,故选项B 认为仅\"实施一个犯罪行为\",选项C 认为\"触犯同一\n罪名\"都是错误的。选项D 所述情形与牵连犯无关。本题应选A。","k":"刑法基础与效力"},{"id":"2008-15","y":2008,"t":"单","s":"《刑法》第 307 条第 1 款规定:“以暴力威胁、贿买等方法阻止证人作证或者指使他人作伪证的,处......”。 这种罪状 形式属于(  )。","o":["简单罪状","叙明罪状","空白罪状","引证罪状"],"a":"B","e":"叙明罪状,是刑法分则条文详尽描述具体犯罪的基本特征,题干中的条文详尽描述了妨害作证罪的基\n本特征,故应属于叙明罪状","k":"刑法基础与效力"},{"id":"2008-21","y":2008,"t":"多","s":"全国人大常委会有关解释规定:“刑法第 228 条、第 342 条、第 410 条规定的‘违反土地管理法规’,是指 违反土地管 理法、森林法、草原法等法律以及有关行政法规中关于土地管理的规定。”这一解释属于(     )","o":["立法解释","有权解释","学理解释","类推解释"],"a":"AB","e":"有权解释(也称正式解释、法定解释)与无权解释(也称非正式解释)相对,是指有解释权的国家\n机关对法律所作的具有法律约束力的解释。有权解释,根据解释的机关不同,可以分为立法解释、司法解释和行政\n解释。一般地在我国,所谓立法解释、是指全国人大常委会对法律所作的解释。故本题应选A、B 项。所谓类推解释\n是指使用类推方法对法律条文含义所进行的扩大性解释,本题并无此种解释。","k":"刑法基础与效力"},{"id":"2009-1","y":2009,"t":"单","s":"下列犯罪中,应当认为在中国领域内犯罪的是(   )。","o":["甲乘坐外国轮船从中国港口出发,当行至公海时实施犯罪","乙乘坐外国轮船前往中国,在公海上失手致中国公民落水而亡","丙乘坐外国轮船前往中国,在公海上与同行的旅客斗殴,致其重伤,该旅客被送人中国医院后经抢救无效死亡","丁在其本国境内打猎,致正在该国旅游的中国公民死亡"],"a":"C","e":"本题考查我国刑法的属地管辖权。《刑法》第6 条规定,凡在中华人民共和国领域内犯罪的,除法\n律有特别规定的意外,适用本法。凡在中华人民共和国船舶或航空器内犯罪的,也使用本法。犯罪的行为或者结果\n哟普一项发生在中华人民共和国内的,就认为是在中华人民共和国领域内犯罪。A 选项和B 选项行为均发生在公海\n上,不在我国领域内。C 选项符合题意。D 选项行为发生在丁所在的国境内,不以为实在我国境内犯罪。因此本题答\n案为C","k":"刑法基础与效力"},{"id":"2009-10","y":2009,"t":"单","s":"下列关于犯罪既遂的说法中,错误的是(   )。","o":["对犯罪既遂,按照刑法分则条文规定的法定刑处罚","犯罪既遂的法律标准是行为人的行为具备刑法分则所规定的基本犯罪构成的全部要件","行为人没有实现犯罪的预期目的.也可以成立犯罪既遂","只要出现犯罪结果就构成犯罪既遂"],"a":"D","e":"本题考查犯罪既遂。犯罪既遂是指故意犯罪的完成形态。对故意犯罪的既遂,应当直接按照刑法分\n则具体条文所规定的法定刑处罚。A 选项正确。根据构成要件说 ,是否成立犯罪既遂,取决于犯罪实行行为是否具\n备刑法分则规定的特定犯罪的全部犯罪构成要件,而不完全取决于是否发生了实际的犯罪结果或者是否达到了行为\n人预期的发展目的。B 选项和C 选项正确,D 选项错误。。因此本题答案为D","k":"刑法基础与效力"},{"id":"2009-2","y":2009,"t":"单","s":"《刑法》第 13 条 规 定 :“......但是情节显著轻微危害不大的,不认为是犯罪。”该“但书”规定的目的主 要在于(   )。","o":["对已经构成犯罪的行为免予刑罚处罚","对已经构成犯罪的行为予以非刑罚处罚","给予司法机关确定行为是否构成犯罪的自由裁量权","避免轻微的违法行为犯罪化"],"a":"D","e":"本题考查犯罪的定义。《刑法》第13 条规定,从立法上即对犯罪的性质进行描述,又对犯罪的处\n延进行定量限制,有利于准确把握犯罪的本质,适当的界定犯罪的房屋iecong 而划清罪与非罪的界限。根据这一定\n义,只有具有一定严重程度的社会危害性的严重违反刑法的行为才能被认定为犯罪,否则只能以一般违法的行为论\n处。因此本题答案为D","k":"刑法基础与效力"},{"id":"2009-8","y":2009,"t":"单","s":"甲在教育自己的小孩时,因方法粗暴致其重伤。甲认为自己的行为不构成犯罪。甲的这种认识属于(   )。","o":["对象认识错误","法律认识错误","因果关系认识错误","手段认识错误"],"a":"B","e":"本题考查刑法上的认识错误,刑法上的认识错误可以分为法律上的认识错误和实际上的认识错误。\n法律上的认识错误是指行为人对自己的法律性质有不正确的理解。甲在教育自己的小孩时,因方法粗暴致其重伤。\n甲认为自己的哦行为不构成犯罪,属于法律上的认识错误。B 选项正确。所谓事实上的认识错误,是指行为人对自\n己行为时的事实情况有不正确的理解。事实上的认识错误包括对目标的错误认识、对犯罪手段的错误认识、对因果\n关系的错误认识及行为偏差的问题。ACD 选项错误。因此本题答案为B","k":"刑法基础与效力"},{"id":"2011-1","y":2011,"t":"单","s":"A国驻华金融机构工作人员甲策划、参与了由 中国向A国走私文物的犯罪活动。对甲应当()。","o":["直接驱逐出境","通过外交途径解决其刑事责任","适用我国法律追究其刑事责任","适用A国法律追究其刑事责任"],"a":"C","e":"本题的考点是刑法的空间效力、对外国\n人犯罪的处理方式。对于本类型的题目,首先应该按\n照先后顺序(属地一属人一保护一普遍)判断应当适\n用何种空间原则。由于本题中的行为发生在中国,符\n合属地管辖原则。故选C。另根据我国《刑法》第11\n条的规定,只有享有外交特权和豁免权的人的犯罪行\n为才通过外交途径解决,本题中的甲显然不符合这一\n条件。故B 选项错误。","k":"刑法基础与效力"},{"id":"2011-4","y":2011,"t":"单","s":"我国1997年《刑法》关于溯及力的规定采取的 是()。","o":["从旧原则","从新原则","从新兼从轻原则","从旧兼从轻原则"],"a":"D","e":"本题属于送分题,我国1997年《刑法》\n的溯及力为从旧兼从轻原则,不再分析。","k":"刑法基础与效力"},{"id":"2011-8","y":2011,"t":"单","s":"下列关于牵连犯说法中,正确的是()。","o":["出于一个犯罪目的,实施两个以上犯罪行为 的都是牵连犯","牵连犯是行为人实施一个犯罪行为触犯数个 罪名的犯罪形态","牵连犯的处断原则是除法律有特别规定的以 外,择一重罪处罚","牵连犯的成立不仅要求行为人主观上具有牵 连意图,还要求行为触犯的数个法条之间存 在竞合关系"],"a":"C","e":"牵连犯的特征:(1) 有一个最终的犯罪\n目的。(2)有两个以上的犯罪行为。(3)触犯了两\n个以上不同的罪名。(4)所触犯的两个以上犯罪之\n间有牵连关系,即一罪或数罪是他罪的手段行为或结\n果行为。牵连犯的处断原则为择一重罪处罚,法律有\n特别规定的除外。AB错误,C项正确。而D选项涉\n及牵连关系的认定,在学术界中有人认为牵连关系的\n成立主要在于行为人是否具有牵连意图,即主观说。\n有人认为牵连关系的认定在千两个行为之间的客观\n联系,即客观说,也有人采用主客观结合说,这在学术\n上尚存在争议,故考生不必过于纠结于此问题。但是\n无论如何,牵连犯中两个以上行为所触犯的法条并不\n要求存在竞合关系,所以在这一点上D选项明显\n错误。\n罪数这一章是难度比较大的一章,学术上也存在\n着许多争议,考生在复习这一章时,不必太苛求。主\n要有两点复习建议:一是将教材上所列举的各个罪数\n情况的典型案例熟记在心。二是将各个罪数情况所\n涉及的行为、触犯的罪名、处断原则,以及存在数个行\n为的情况下,各个行为之间又是怎样的关系,整理出\n来并熟记","k":"刑法基础与效力"},{"id":"2012-1","y":2012,"t":"单","s":"根据相关统计,自《刑法修正案(八)》实施7 个月来,公安机关查获的醉酒驾驶机动车案件数量较 上一年同期下降43.7%。这一数据变化反映了刑法 的( )。","o":["保障机能","规制机能","保护机能","预防机能"],"a":"B","e":"l\n刑法的机能为2012年法硕大纲新增添\n的考点,是刑法能产生的积极作用。一般来说,刑法\n具有三种机能:(l)规制机能,即对人的行为进行规\n制或者约束的机能;(2)保护机能,即保护国家、社\n会、个人法益的机能;(3)保障机能,即保障公民不受\n国家刑罚权的非法侵害并保障犯罪人不受刑法规定\n之外的刑罚处罚的功能。答案中D 选项并不在刑法\n的机能之内,排除。醉酒驾驶率下降是因为刑法将醉\n驾规定为犯罪(危险驾驶罪),使国民知道该行为为法\n律所不允许,体现的是规制机能,并没有体现\n\" 保\n\" 字\n的内涵。故答案为B。","k":"刑法基础与效力"},{"id":"2012-2","y":2012,"t":"单","s":"我国公民甲在德国旅游时,盗窃了我国公民乙 一部价值1万元的相机。对甲的行为适用我国刑法 的依据是( )。","o":["属地原则","保护原则","属人原则","普遍管辖原则"],"a":"C","e":"l\n甲是我国公民,对甲的行为适用我国刑\n法的依据是属人原则。由于甲的盗窃行为发生在德\n国,德国对甲的行为适用德国刑法的依据是属地管\n辖。判断选用何种原则时,应牢记其先后顺序,即属\n地---->属人一保护一普遍管辖,逐一判断。","k":"刑法基础与效力"},{"id":"2012-44","y":2012,"t":"多","s":"甲利用职务便利,侵占本单位财物数额巨大。 根据我国《刑法》的规定,其罪行的法定刑幅度为5年 以上有期徒刑。关于本案,下列选项中正确的有","o":["该案的追诉期限为10年","该案的追诉期限为15年","如果甲在公安机关侦查期间逃跑,则不受追诉 期限的限制","该案如果超过追诉期限,经最高人民检察院 核准,仍可追诉"],"a":"BC","e":"根据《刑法》第87条的规定,犯罪经过\n下列期限不再追诉:\n(1) 法定最高刑为不满5年有期徒刑的,经过\n5 年;\n(2)法定最高刑为5年以上不满10年有期徒刑\n的,经过10年;\n(3)法定最高刑为10年以上有期徒刑的,经过\n15年;\n(4)法定最高刑为无期徒刑、死刑的,经过20\n年。如果20年以后认为必须追诉的,须报请最高人\n民检察院核准。应当注意的是,只有无期徒刑和死刑\n的,在20年之后报请最高检批准才可以继续追诉。C\n正确,本题法定刑为5年以上,因此追诉期为15年。\nB正确。因此选BC。","k":"刑法基础与效力"},{"id":"2013-1","y":2013,"t":"单","s":"甲使用暴力劫取国有档案,人民法院根据我国 《刑法》第329条“抢夺、窃取国家所有的档案的, 处·.....”的规定,判决甲犯抢夺国有档案罪。本案中, 法院的解释属于()。","o":["司法解释","文理解释","目的解释","扩大解释"],"a":"D","e":"根据解释的方法,刑法解释可以分为文\n理解释和论理解释。文理解释是根据条文的字面含\n义进行的说明。本题中将\n\" 暴力劫取\n\"解释为\n\"抢夺\"\n超过了字面含义,不属于文理解释。而论理解释是根\n据立法的精神和目的对条文进行说明,包括目的解\n释、扩大解释、缩小解释、当然解释、比较解释和历史\n解释。本题中为了将不包含在法条中的含义纳人而\n对法条含义进行扩充,将\n\" 暴力劫取\n\"解释为\n\"抢夺\n\"\n则属于扩大解释。因此答案选D。","k":"刑法基础与效力"},{"id":"2013-16","y":2013,"t":"单","s":"我国《刑法》第295条规定:“传授犯罪方法 的,处·......”,本条的罪状形式是()。","o":["空白罪状","简单罪状","引证罪状","叙明罪状"],"a":"B","e":"本题考查的是罪状的概念。根据刑法\n分则条文对罪状描述方式的不同,可以把罪状分为简\n单罪状、叙明罪状、空白罪状、混合罪状、引证罪状。\n其中,简单罪状是指在刑法分则条文中简单描述具体\n犯罪的基本特征而不做更多的解释。这是因为这类\n罪状都为人们所熟悉,无须耗费笔墨多加解释。本题\n\n中只简单提及了传授犯罪方法而无详细的阐述,故答\n案为B,简单罪状。","k":"刑法基础与效力"},{"id":"2013-2","y":2013,"t":"单","s":"2012年5月,缅甸籍毒贩糯康在泰国境内制造 “湄公河惨案”,杀害了十余名我国船员,后被老挝移 送到我国受审。我国司法机关对于糯康进行刑事审 判的依据是()。","o":["属地管辖权","保护管辖权","普遍管辖权","属人管辖权"],"a":"B","e":"本题考查考生对\n\" 刑法的空间适用原\n则\n\"的掌握情况。刑法的空间效力是指刑法对地和对\n人的效力,包括了属地原则、属人原则、保护原则和普\n遍管辖原则。B选项中的保护原则体现了刑法对外\n国人在中国领域外犯罪的效力,即外国人在中国领域\n外对中国国家或者公民犯罪,按照我国刑法规定的最\n低刑为3年以上有期徒刑的,可以适用我国刑法。对\n千涓公河故意杀人案件,我国刑法的最低刑显然在3\n年以上,因此应该选择B。","k":"刑法基础与效力"},{"id":"2014-1","y":2014,"t":"单","s":"下列选项中,体现罪责刑相适应原则的是哪项 )。","o":["刑法关于空间效力范围的规定","刑法关于怀孕的妇女不适用死刑的规定","刑法关于享有外交特权的外国人刑事责任的 规定","刑法关于放火罪与失火罪构成要件及法定刑 的不同规定"],"a":"D","e":"此题考查对刑法基本原则的理解,所谓\n罪责刑相适应原则,是指\n\"刑罚的轻重,应当与犯罪分\n子所犯罪行和承担的刑事责任相适应\n\"。即刑罚的轻\n重不仅与客观的犯罪行为及其危害结果相适应,也必\n须同犯罪人主观恶性的深浅,再犯可能性的大小相适\n应。D选项中\n\"刑法关于放火罪与失火罪构成要件及\n法定刑的不同规定\n\" 体现了刑法中对过失犯的处罚明\n显宽大于故意犯的原则,最能够体现罪责刑相适应的\n原则。","k":"刑法基础与效力"},{"id":"2014-12","y":2014,"t":"单","s":"下列罪状中,属于叙明罪状的是(","o":["过失犯前款罪的","收买被拐卖的妇女、儿童的","以暴力、胁迫手段组织残疾人或者不满14周 岁的未成年人乞讨的","违反国家规定,侵人国家事务、国防建设、尖 端科学技术领域的计算机信息系统的"],"a":"C","e":"本题考查的是罪状的种类。所谓罪状\n是指刑法分则条文对某种具体犯罪特征的描述,根据\n刑法分则条文对罪状描述方式的不同,可以把罪状分\n为简单罪状、叙明罪状、空白罪状、引证罪状、混合罪\n状等。其中,叙明罪状是指在刑法分则条文中详尽描\n述具体犯罪的基本特征。四个选项中仅有C选项对\n犯罪的构成要件进行了详细的说明,属于叙明罪状。\nA 项是引证罪状,B 项是简单罪状,D项是空白罪状。","k":"刑法基础与效力"},{"id":"2014-2","y":2014,"t":"单","s":"根据解释的效力,可以把刑法解释分为(","o":["立法解释、司法解释和学理解释","当然解释、文理解释和论理解释","当然解释、扩大解释和缩小解释","文理解释、论理解释和学理解释"],"a":"A","e":"本题考查的是刑法解释的分类,属于基\n础识记考点之一。刑法解释是指对刑法条文含义的\n阐明,而根据解释的效力,可分为由立法机关对刑法\n进行的立法解释,由最高司法机关对刑法进行的司法\n解释,以及除有权对刑法进行解释的立法、司法机关\n之外的其他机关、团体、个人对刑法条文含义的阐释,\n即学理阐释,亦称无权解释。","k":"刑法基础与效力"},{"id":"2014-3","y":2014,"t":"单","s":"依照我国《刑法》第13条的“但书”规定,“不 认为是犯罪”的条件是( )。","o":["情节轻微的","危害不大的","情节轻微危害不大的","情节显著轻微危害不大的"],"a":"D","e":"本题考查的是对《刑法》第13条\n\" 但\n书\n\"的理解,该条规定对犯罪的定义既包含定性要求,\n也包含了定量要求,不仅从性质上规定犯罪具有危害\n性和违法性,而且还设置了定量的要求,即\n\" 情节显著\n轻微危害不大的,不认为是犯罪\n\"。因此答案选D。","k":"刑法基础与效力"},{"id":"2014-41","y":2014,"t":"多","s":"对于下列毒品犯罪,我国可按照普遍管辖原 则行使刑事管辖权的有()。","o":["无国籍人在外国生产毒品,后来到我国旅游, 被我国司法机关抓获","他国公民从第三国购买毒品回本国贩卖,被本 国通缉,后被我国司法机关抓获","我国公民在外国乘坐外国客机将毒品带往第 三国贩卖,被他国司法机关抓获","他国公民携带贩卖的毒品乘坐他国飞机在我 国机场换乘时,被我国司法机关抓获"],"a":"AB","e":"根据我国刑法的规定,毒品犯罪,可依\n照普遍管辖原则进行管辖。所谓普遍管辖原则,是指\n对千中国缔结或者参加的国际条约所规定的罪行,中\n国在承担条约义务的范围内行使刑事管辖权。即使\n该罪行不是发生在中国领域,未侵犯中国国家和公\n民,犯罪人不具有中国国籍,我国司法机关也有权管\n辖该案件。因此,AB 选项中的无国籍人和他国公民\n虽然不具备我国国籍,但被我国司法机关抓获后我国\n司法机关便具有管辖权。CD选项应该分别以属人主\n义和属地主义进行管辖。","k":"刑法基础与效力"},{"id":"2015-1","y":2015,"t":"单","s":"原铁道部部长刘某因受贿罪、滥用职权罪被追 究刑事责任。有人认为,在对刘某量刑时“应考虑他 对中国高铁建设的贡献”。这种说法违背了我国刑法 中的()。.","o":["罪刑法定原则","刑法适用平等原则","罪责刑相适应原则","主客观相统一原则"],"a":"C","e":"本题考查的是对刑法基本原则的理解,\n所谓罪责刑相适应原则,是指\n\" 刑罚的轻重,应当与犯\n罪分子所犯罪行和承担的刑事责任相适应\n\",即刑罚\n的轻重不仅应与客观的犯罪行为及其危害结果相适\n应,也必须同犯罪人主观恶性的深浅,再犯可能性的\n大小相适应。除此之外,不再考虑其他因素。刘某的\n量刑与其所犯之罪以及应当承担的责任相适应,其\n\"对中国高铁建设的贡献\n\" 不是罪与责的影响因素,根\n据罪责刑相适应原则,量刑时不应考虑,C 正确。\nABD选项错误。","k":"刑法基础与效力"},{"id":"2015-5","y":2015,"t":"单","s":"针对吸毒后在道路上驾驶汽车的现象,有人认 为,虽然刑法未规定吸毒驾驶构成犯罪,但是吸毒驾 驶和醉酒驾驶具有相同的社会危害性,故而应以危险 驾驶罪论处。这种观点属于()。","o":["扩大解释","文理解释","类推解释","当然解释"],"a":"C","e":"本题考查的是对刑法的解释中学理解\n释的理解,所谓学理解释,是指有权对刑法进行立法\n解释和司法解释的机构之外的机关、团体和个人对刑\n法条文含义的阐释。学理解释包括文理解释和论理\n解释,而其中论理解释包括目的解释、扩大解释、缩小\n解释、当然解释、比较解释、历史解释和类推解释。扩\n大解释,是指刑法规定的含义较其真实含义为窄时,\n扩张其字面含义,使其符合规定的真实含义。文理解\n释,是指从刑法条款用语的语义及通常使用方式出发\n来说明刑法规定含义的解释方法。当然解释,是指在\n所面临的案件缺乏可以适用的法条时,通过参照各种\n事项,从既有的法条获得指针,对案件适用既有法条\n的一种解释。类推解释是指,需要判断的具体事实与\n法律规定的构成要件基本相似时,将后者的法律效果\n适用千前者。类推解释通常在于认识到某行为不是\n刑法处罚的对象,而以该行为与刑法规定的相似行为\n具有同等的恶害性为由,将其作为处罚对象。本题\n中,危险驾驶罪只规定了醉酒驾驶,认为吸毒驾驶和\n醉酒驾驶具有相同的社会危害性,而将吸毒驾驶以危\n险驾驶罪论处的做法,属于类推解释。故C选项正\n确,ABD选项错误。","k":"刑法基础与效力"},{"id":"2016-1","y":2016,"t":"单","s":"从刑法的形式渊源来看,全国人大常委会《关 于惩治骗购外汇、逃汇和非法买卖外汇犯罪的决定》 是()。","o":["狭义刑法","单行刑法","附属刑法","立法解释"],"a":"B","e":"单行刑法是规定某一类犯罪及其后果\n或者刑法某一事项的法律。我国在1997年刑法典之\n后,曾颁布过一部单行刑法,即全国人大常委会《关于\n惩治骗购外汇、逃汇和非法买卖外汇犯罪的决定》,B\n选项正确。\n狭义的刑法是指刑法典,即1997年刑法。附属\n刑法是指在经济、行政等非专门刑事法中附带规定的\n一些关于犯罪与刑罚或追究刑事责任的条款。如在\n环境保护法中规定的犯罪与刑罚的条款。立法解释,\n是指刑法的立法机关对刑法条文的解释。《关于惩治\n骗购外汇、逃汇和非法买卖外汇犯罪的决定》是全国\n人大常委会制定的单行刑法,不是对刑法典的解释,\n既不是立法解释,也不是狭义刑法、附属刑法,ACD选\n项错误。","k":"刑法基础与效力"},{"id":"2016-11","y":2016,"t":"单","s":"依据刑法规定,在道路上驾驶机动车追逐竞 驶,情节恶劣的,“处拘役,并处罚金。”此处的法定刑 )。 属于(","o":["援引法定刑","绝对确定法定刑","相对确定法定刑","绝对不确定法定刑"],"a":"C","e":"绝对确定的法定刑是指在刑法分则条\n文中对某种犯罪规定单一的刑种与固定的刑罚幅度\n的法定刑。相对确定的法定刑是指在刑法分则条文\n中对某种犯罪规定一定的刑种和刑罚幅度的法定\n刑。我国刑法只有极少数犯罪规定绝对确定的法定\n刑,如第121条劫持航空器罪规定\n\" 致人重伤、死亡\n或者使航空器遭受严重破坏的,处死刑\n\",此规定为\n绝对确定的法定刑。本题中对法定刑的规定是\n\"处\n拘役,并处罚金\n\" ,拘役的期限是有幅度的,即一个月\n以上六个月以下,所以本题的法定刑是相对确定法\n定刑,而不是绝对确定法定刑,C选项正确,B选项错\n误。绝对不确定法定刑是在法律条文中只笼统地规\n定对某种犯罪应予惩处,却不规定具体的刑种和刑\n罚幅度。需注意某种犯罪的法定刑只存在单一主刑\n刑种情况下,不一定就是绝对确定的法定刑,若该单\n一刑种为无期徒刑或死刑则属千绝对确定法定刑。\n但若该单一刑种为拘役或管制,因为拘役或管制的\n期限存在幅度,所以属千相对确定的法定刑。本题\n规定了刑种和幅度,不是绝对不确定法定刑,D选项\n错误。本题也没有援引其他条款,不是援引法定刑,\nA选项错误。","k":"刑法基础与效力"},{"id":"2016-2","y":2016,"t":"单","s":"“过失犯罪,,法律有规定的才负刑事责任。”刑 法的这一规定体现的原则是()。","o":["罪刑法定","主客观相统一","罪责刑相适应","刑法适用平等"],"a":"A","e":"罪刑法定原则是指\n\" 法无明文规定不\n为罪,法无明文规定不处罚\n\",其基本内容是法定化,\n即犯罪和刑罚必须事先由法律明文规定,其基本内容\n还包括明确化和合理化。罪责刑相适应原则,是指刑\n罚的轻重,应当与犯罪分子所犯罪行和承担的刑事责\n任相适应,比如对中止犯处罚宽大于未遂犯,体现了\n罪责刑相适应原则,因为中止犯的主观恶性小。刑法\n适用平等原则,是指任何人犯罪,在适用法律上一律\n平等。主客观相统一原则是对犯罪嫌疑人、被告人追\n究刑事责任,必须同时具备主客观两方面的条件。\n\"过失犯罪法律有规定的才负刑事责任\n\",说明对\n过失犯罪的处罚以法律有明确规定为前提,体现了罪\n刑法定原则,A选项正确,BCD选项错误。","k":"刑法基础与效力"},{"id":"2016-3","y":2016,"t":"单","s":"甲挪用公款炒股亏损无力归还,被检察机关以 贪污罪起诉,人民法院依法认定甲的行为构成挪用公款 罪。人民法院对本案罪名的变更实现了刑法的(","o":["规制机能","保护机能","保障机能","威慑机能"],"a":"C","e":"刑法的机能,是指刑法能产生的积极作\n用。一般来说,刑法具有三种机能:(1) 规制机能,是\n对人的行为进行规制或者约束的机能;(2) 保护机\n能,即保护国家、社会和个人法益的机能;(3) 保障机\n能,即保障公民不受国家刑罚权的非法侵害并保障犯\n罪人不受刑法规定之外的刑罚处罚的机能。\n本题中,人民法院对罪名的变更保障了甲不受错\n误罪名的侵害,体现了刑法的保障机能,C 选项正确。\n人民法院对罪名的变更不是为了维待社会秩序,也不\n是为了保护国家法益,而是为了保障甲不受国家刑罚\n权的非法侵害,所以是保障机能,而不是规制机能、保\n护机能,A、B 选项错误。教材中对于刑法的机能只列\n举了三种,没有威摄机能,D选项错误。","k":"刑法基础与效力"},{"id":"2017-1","y":2017,"t":"单","s":"近年,我国司法机关展开“猎狐行动”,追捕潜 逃海外的犯罪嫌疑人回国接受刑事审判,此举是为了 实现刑法的()。","o":["规制机能","保障机能","保护机能","补偿机能"],"a":"C","e":"l\n刑法的机能,是指刑法能产生的积极作\n用。通说认为刑法具有三种机能:规制机能、保障机\n能保护机能,没有补偿机能,D项错误。规制机能是\n指对人的行为进行规制或者约束的机能。其作用的\n方式是对犯罪规定刑罚,通过这种方式向国民显示该\n行为不为法律所容许,要求国民不要实施类似行为,\n从而避免犯罪。保护机能是保护国家、社会和个人法\n益。保障机能是保障公民不受国家刑罚权的非法侵\n害并保障犯罪人不受刑法规定之外的刑罚处罚。本\n题中,我国司法机关将潜逃海外的犯罪嫌疑人追捕回\n国接受刑事审判,是为了保护国家、社会和个人法益,\n是对被害人的保护,也是对法律尊严的保护,体现了\n刑法的保护机能,C项正确。","k":"刑法基础与效力"},{"id":"2017-12","y":2017,"t":"单","s":"我国《刑法》第266条中规定“诈骗公私财物, 数额较大的”,这种罪状是()。","o":["叙明罪状","空白罪状","简单罪状","引证罪状"],"a":"C","e":"罪状是指刑法分则性条文对某种具体\n犯罪特征的描述。根据刑法分则性条文对罪状描述\n方式的不同,可以把罪状分为简单罪状、叙明罪状、空\n白罪状、混合罪状、引证罪状。叙明罪状是指在刑法\n分则条文中详尽描述具体犯罪的基本特征。简单罪\n状是指在刑法分则条文中只简单描述具体犯罪的基\n本特征而不作更多的解释。空白罪状是指刑法分则\n条文不直接叙明犯罪的特征,而只是指出该犯罪行为\n所违反的其他法律、法规。引证罪状是指引用刑法分\n则的其他条款来说明某种犯罪的特征。本题中对诈\n骗罪的规定,只简单描述了犯罪行为\n\"诈骗公私财\n物\n\",没有作更多的解释,也没有引用其他条款或者指\n出其他法律、法规,所以是简单罪状,C项正确,ABD\n项错误。","k":"刑法基础与效力"},{"id":"2017-2","y":2017,"t":"单","s":"甲国公民乘坐乙国飞机飞越丙国领空时,殴打 中国籍乘客刘某致其重伤。甲国公民对刘某的犯罪, )。 适用我国刑法的依据是(","o":["属地管辖原则","保护管辖原则","属人管辖原则","普遍管辖原则"],"a":"B","e":"属地管辖原则是指一个国家只管发生\n在本国领域内的犯罪。我国《刑法》规定,凡在中国领\n域内犯罪的,除法律有特别规定的以外,都适用中国\n刑法。犯罪行为或者结果有一项发生在中国领域内,\n就认为是在中国领域内犯罪。属人管辖原则是指一\n个国家的刑法只管本国公民实施的犯罪。保护管辖\n原则是指一个国家的刑法只管侵害本国利益的犯罪。\n普遍管辖原则是指一个国家的刑法对侵犯人类共同\n利益的国际犯罪都要行使管辖权。本题中,犯罪人是\n甲国人,不是中国人,所以不能根据属人管辖原则适\n用我国刑法,C项错误。犯罪行为发生是在乙国飞机\n飞越丙国领空时,发生地不在我国领域内,不能根据\n属地管辖原则适用我国刑法,A项错误。受害人刘某\n是中国人,甲国公民的行为侵害了我国公民的利益,\n我国可以根据保护管辖原则适用我国刑法,B项正\n确。故意伤害罪不是侵害人类共同利益的国际犯罪,\n不能根据普遍管辖原则适用我国刑法,D项错误。","k":"刑法基础与效力"},{"id":"2018-1","y":2018,"t":"单","s":"关千我国刑法溯及力的适用,下列表述中正确 的是( )。","o":["司法解释应适用从新兼从轻原则","处刑较轻是指法院判处的宣告刑较轻","应以“审判时”作为新旧法选择适用的判断 基础","按照审判监督程序重新审判的案件适用行为 时的法律"],"a":"D","e":"刑法的司法解释与刑法典的溯及力一\n样,适用的是从旧兼从轻原则,A错误;\n\"处刑较轻\n\" 是\n指法定刑较轻,而不是法院判处的宣告刑较轻,B错\n误;一般来说,以\n\" 行为时\n\" 作为新旧法选择适用的判\n断基础,C错误;审判监督程序是指人民法院、人民检\n察院对已经发生法律效力的判决和裁定,发现在认定\n事实或适用法律上确有错误,依法提起对案件进行重\n新审判的程序,其应当适用行为时的法律,D正确。","k":"刑法基础与效力"},{"id":"2018-11","y":2018,"t":"单","s":"最高人民法院发布的《关千审理抢劫案件具 体应用法律若干问题的解释》中规定,抢劫正在使用 中的银行或其他金融机构的运钞车的,视为\"抢劫银 行或者其他金融机构\"。该规定使用的解释方法是 () 。","o":["扩大解释","类推解释","限制解释","文理解释"],"a":"A","e":"根据解释的方法,刑法解释可分为文理\n解释和论理解释。文理解释是根据条文的字面含义\n进行说明。论理解释是根据立法的精神与目的对条\n文进行说明。一般认为,论理解释包括目的解释、扩\n大解释、缩小解释、当然解释、比较解释和历史解释\n等。扩大解释是指当刑法的条文中所使用的文字、词\n语的含义过于狭窄,不足以涵盖立法者所欲调整的范\n围时,为符合立法本意,对文义进行扩张,将排除在适\n用范围之外的案件纳入调整范围的解释方法。本题\n中最高人民法院将运钞车解释入\n\" 银行或其他金融\n机构\n\"中,扩大了\n\" 银行或其他金融机构\n\" 的范围,是\n扩大解释,A项正确。","k":"刑法基础与效力"},{"id":"2018-41","y":2018,"t":"多","s":"甲在街头摆气球射击摊,因向顾客提供的六 支枪形物被鉴定为枪支,被法院以非法持有枪支罪判 处有期徒刑同时宜告缓刑。法院的做法符合( )。","o":["罪刑法定原则","罪责刑相适应原则","从旧兼从轻原则","主客观相统一原则"],"a":"ABD","e":"关于本题,从旧兼从轻是新旧法的时间\n效力问题,题目中没有涉及;C项不选。法院以非法\n持有枪支罪定罪,体现了罪刑法定原则,因为法律规\n定了该罪,而甲提供的枪形物被鉴定为枪支,因此以\n非法持有枪支罪定罪是没有问题的。A项正确。但\n是甲非法待有枪支行为的社会危害性很小,主观恶性\n也很小,或者几乎没有,所以为了体现罪责刑相适应\n原则,法院对甲宣告缓刑。B项正确。本题中甲主观\n上没有非法持有枪支恶性,只是用千娱乐性经营,不\n知道自己的行为触犯法律,没有主观恶性或者主观恶\n性较小,所以判处缓刑,从轻处罚体现了主客观相统\n一,D正确。","k":"刑法基础与效力"},{"id":"2018-8","y":2018,"t":"单","s":"甲的行为应认定为( )。","o":["诈骗罪","贪污罪","行贿罪","侵占罪"],"a":"A","e":"根据《刑法》第266条规定,诈骗罪是\n指以非法占有为目的,用虚构的事实或者隐瞒真相的\n方法,骗取数额较大的公私财物的行为。本案中甲骗\n取征收补偿款200万,构成诈骗罪。甲的行贿行为与\n诈骗行为具有牵连性,择一重罪处罚,应认定为诈\n骗罪。","k":"刑法基础与效力"},{"id":"2019-11","y":2019,"t":"单","s":"下列关于我国刑法中罪刑法定原则的理解, 正确的是()。","o":["简单罪状因缺乏明确性不符合罪刑法定原则","将习惯法视为刑法的渊源不违反罪刑法定 原则","罪刑法定原则不允许有利于被告人的新法溯 及既往","罪刑法定原则中的“法”不包括行政法规"],"a":"D","e":"简单罪状虽然简单,但也是明确的,不\n违反罪刑法定原则,A项错误。根据法定化和明确化\n的要求,禁止采用习惯法,因此,将习惯法视为刑法的\n\n渊源违反罪刑法定原则,B项错误。罪刑法定原则中\n的\n\"法\n\",是指全国人民代表大会及其常委会制定的法\n律、法令,通常是行为当时有效的法律;对千已废止的\n法律,根据\n\"从旧兼从轻\n\" 原则,犯罪行为发生之日起\n生效的法律,对其生效前发生的犯罪行为,只有在其\n处罚轻于犯罪行为发生时生效的法律的场合才能适\n用于该行为。因此,D项所述\n\" 不包括行政法规\n\"的说\n法正确,而C项表述显然违反了\n\" 从旧兼从轻\n\" 原则\n而错误。本题选D。","k":"刑法基础与效力"},{"id":"2019-12","y":2019,"t":"单","s":"我国公民甲在某国杀害Z(无国籍人),被该 国法院判处有期徒刑12年。如甲在该国服刑完毕回 到我国,我国司法机关依照刑法对甲行使刑事管辖权 的根据是()。","o":["属地原则","属人原则","保护原则","普遍管辖原则"],"a":"B","e":"刑法第7条规定:\"中华人民共和国公\n民在中华人民共和国领域外犯本法规定之罪的,适用\n本法,但是按本法规定的最高刑为三年以下有期徒刑\n的,可以不予追究。中华人民共和国国家工作人员和\n军人在中华人民共和国领域外犯本法规定之罪的,适\n用本法。\"该条是对我国刑法属人管辖权的规定。根\n据上述规定,我国公民在我国领域外犯我国刑法规定\n之罪的,不论按照当地法律是否认为是犯罪,也不论\n其所犯罪行侵犯的是何国或者何国公民的利益,原则\n上都适用我国刑法。只是按照我国刑法的规定,该公\n民所犯之罪法定最高刑为3年以下有期徒刑的,可以\n不予追究。本题中,甲是我国公民,犯罪地是他国,被\n害人是Z(无国籍人),我国依据属人原则对甲的杀人\n行为进行管辖,B项正确。","k":"刑法基础与效力"},{"id":"2020-1","y":2020,"t":"单","s":"无国籍人甲在美国通过网络对正在中国旅游 的英国人乙实施诈骗,骗得巨额钱款。对甲的行为, 我国司法机关()。","o":["没有刑事管辖权","依属地原则享有刑事管辖权","依保护原则享有刑事管辖权","依普遍原则享有刑事管辖权"],"a":"B","e":"根据我国《刑法》第6条第3款的规定,\n犯罪的行为或者结果有一项发生在我国领域内的,就\n认为是在我国领域内犯罪。凡在中国领域内犯罪的,\n除法律有特别规定的以外,都是适用中国刑法,这体\n现了属地原则。该题中乙在中国被骗,结果地在中\n国,因此甲在我国领域内犯罪,我国可依属地原则享\n有刑事管辖权,B选项正确,A选项错误。保护原则\n是指一个国家的刑法对侵害本国利益的犯罪有管辖\n权,即对千外国人在中国领域外对中国国家或公民犯\n罪进行管辖才体现保护原则,C选项错误。普遍原则\n是一个国家的刑法对侵犯人类共同利益的国际犯罪\n行使管辖权,普遍原则是对属地、属人、保护原则的补\n充,能按照属地、属人、保护原则确定管辖权就不需要\n适用普遍原则,D选项错误。","k":"刑法基础与效力"},{"id":"2020-13","y":2020,"t":"单","s":"公司经理甲利用职务上的便利,侵吞本单位 财物数额巨大。对此犯罪,我国刑法规定的法定刑是 “处五年以上有期徒刑,可以并处没收财产。”根据本 条对甲量刑()。","o":["最高可判处15年有期徒刑,并处没收财产","最高可判处20年有期徒刑,并处没收财产","最高可判处25年有期徒刑,不并处没收财产","如果判处5年有期徒刑,则不能并处没收财产"],"a":"A","e":"有期徒刑的期限为6个月以上15年以\n下,\"处五年以上有期徒刑\n\"表明最高量刑是15年,同\n时,结合\n\"可以并处没收财产\n\" 的规定可知,A选项正\n确,BCD选项错误。","k":"刑法基础与效力"},{"id":"2021-1","y":2021,"t":"单","s":"下列选项中,符合我国刑法关于空间效力规定 的是( )","o":["外国人在我国领域外对我国公民犯罪,而按 我国刑法规定的最低刑为3年以上有期徒刑 的,应适用我国刑法","凡在我国领域外犯罪,依照我国刑法应当负刑 事责任的,虽然经过外国审判,仍然应依照我 国刑法追究","我国国家工作人员在我国领域外犯我国刑法 规定之罪的,应适用我国刑法","犯罪行为没有发生在我国领域内的,不应认 为是在我国领域内犯罪"],"a":"C","e":"《刑法》第6条第3款规定:\"犯罪的行\n为或者结果有一项发生在中华人民共和国领域内的,\n就认为是在中华人民共和国领域内犯罪。\"D项错误。\n第7条第2款规定:\"中华人民共和国国家工作人员\n和军人在中华人民共和国领域外犯本法规定之罪的,\n适用本法。\"C项正确。第8条规定:\n\" 外国人在中华\n人民共和国领域外对中华人民共和国国家或者公民\n犯罪,而按本法规定的最低刑为三年以上有期徒刑\n的,可以适用本法,但是按照犯罪地的法律不受处罚\n的除外。\"A项说法错误,缺少了\n\"按照犯罪地的法律\n应受处罚\n\",且是\n\" 可以\n\" 适用我国刑法,不是\n\" 应\n\"。\n第10条规定:\n\" 凡在中华人民共和国领域外犯罪,依\n照本法应当负刑事责任的,虽然经过外国审判,仍然\n可以依照本法追究,但是在外国已经受过刑罚处罚\n的,可以免除或者减轻处罚。\"B项错误,是\n\" 可以\n\" 依\n照我国刑法追究,而不是\n\" 应\n\"。本题选C。","k":"刑法基础与效力"},{"id":"2021-44","y":2021,"t":"多","s":"某刑法教科书提出 “ 盗窃行为并不限于秘密 窃取 “,这种解释属于( ) ,","o":["类推解释","论理解释","无权解释","文理解释"],"a":"BC","e":"$ 立法解释、司法解释有法律上的约束\n力,属千有权解释。但本题中,是学者的解释,而不是\n立法机关、司法机关的解释,因此是学理解释、无权解\n释,C项正确。根据解释的方法,刑法解释可分为文\n理解释和论理解释。文理解释是根据条文的字面含\n义进行的说明。论理解释是根据立法的精神与目的\n对条文进行解释。一般认为,论理解释包括目的解\n释、扩大解释、缩小解释、当然解释、比较解释和历史\n解释等。本题中,\n\"盗窃\n\"的字面含义是\n\" 秘密窃取\n\" ,\n题干中的教科书进行解释时,认为\n\"盗窃行为并不限\n于秘密窃取\n\",超过了\n\"盗窃\n\"的字面含义,不是文理\n解释,而是扩大解释,即论理解释,B项正确,AD项错\n误。本题选BC。","k":"刑法基础与效力"},{"id":"2022-2","y":2022,"t":"单","s":"下列选项中,属千类推解释的是","o":["将\"盗窃燃气\"的行为解释为\"盗窃财物\"","将\"侮辱无名英烈名誉\"的行为解释为\"侵害英雄烈士名誉\"","将\"使用电子干扰手段劫持小型无人机\"的行为解释为\"劫持航空器\"","将\"以个人名义将公款供其他单位使用\"解释为挪用公款\"归个人使用\""],"a":"C","e":"类推解释是指在一个具体事实与刑法\n规定情况相似,但根本不可能为该法条的字面含义所\n包容的前提下,以其相似性作为援引某一刑法规定为\n依据的解释方法。\"燃气\"可以为\"财物\"的字面含义\n所包含,\"侮辱\"可以为\"侵害\"的字面含义所包含,都\n不属于类推解释。AB选项错误。\"小型无人机\"根本\n不可能为\"航空器\"的字面含义所包容,但具有可以飞\n行的相似性,属于类推解释。C选项正确。\"以个人\n名义将公款供其他单位使用\"与\"归个人使用\"不具\n有相似性,不属于类推解释。《全国人民代表大会常\n务委员会关于《中华人民共和国刑法>第三百八十四\n条第一款的解释》中规定,有下列情形之一的,属于挪\n用公款\"归个人使用\":(1)将公款供本人、亲友或者\n其他自然人使用的;(2)以个人名义将公款供其他单\n位使用的;(3)个人决定以单位名义将公款供其他单\n位使用,谋取个人利益的。该解释为立法解释,不属\n于类推解释。D选项错误。","k":"刑法基础与效力"},{"id":"2024-1","y":2024,"t":"单","s":"2023年最高人民检察院工作报告列举了下列数据变化,其中彰显刑法保障机能的是","o":["起诉破坏市场经济秩序犯罪人数比前五年上升32.3%","2022年受理审查起诉杀人、放火等犯罪为近二十年来最低","认定正当防卫不捕不诉人数是前五年的5.8倍","起诉利用网络实施诈骗、赌博等犯罪人数年均上升43.3%"],"a":"C","e":"","k":"刑法基础与效力"},{"id":"2025-12","y":2025,"t":"单","s":"某人民法院在判决书中认为,作为虐待罪犯罪对象的“家庭成员”包括与行为人具有 共同生活事实,处于较为稳定的同居状态,形成事实上的家庭关系的人。该解释属于( )","o":["当然解释","文理解释","司法解释","扩大解释"],"a":"D","e":"扩大解释是指在法律条文的字面含义显然比立法原意窄时,作出比字面含义广的\n解释。本题中,法院在判决书中将\"与行为人具有共同生活事实,处于较为稳定的同居状态\"\n的人解释入\"家庭成员\"的范围,扩大了\"家庭成员\"的含义,属于扩大解释,D 项正确,AB\n项错误。只有最高法和最高检才有权力作出司法解释,本题的判决书不属于司法解释,C 项错\n误。本题选D。","k":"刑法基础与效力"},{"id":"2025-2","y":2025,"t":"单","s":"下列关于属地管辖的理解,正确的是( )","o":["我国承认使领馆是派遣国领土的延伸部分","我国刑法对犯罪地的确定采取行为地说","私人所有的船舶不属于我国的拟制领土","网络犯罪的刑事管辖权应采用属地原则确定"],"a":"C","e":"凡在中国领域内犯罪的,除法律有特别规定的以外,都适用中国刑法。我国不承\n认使领馆是派遣国领土的延伸,A 项错误。犯罪行为或者结果有一项发生在中国领域内的,就\n认为是在中国领域内犯罪,我国就可以根据属地原则进行管辖,B 项错误。凡在中国船舶或者\n航空器内犯罪的,适用中国刑法。该规定是属地原则的补充性原则,也称旗国主义。根据权威\n书籍的说法,具有公用性质的船舶,才适用旗国主义,私人所有的船舶不适用,C 项正确。网\n络犯罪的管辖不一定必然适用属地原则,还可能适用其他原则,D 项错误。本题选C。","k":"刑法基础与效力"},{"id":"2026-12","y":2026,"t":"单","s":"下列选项中,符合罪刑法定原则是","o":["将伪造比特币的行为解释为“伪造货币”","将携带枪支抢夺的行为解释为“持枪抢劫”","将进入牧民帐篷盗窃的行为解释为“入户盗窃”","将为了增重对毒品掺杂掺假的行为解释为“制造毒品”"],"a":"A","e":"罪刑法定禁止类推解释。将比特币解释为法定货币、伪造比特币=伪造货\n币属于类推解释,违反罪刑法定;\nBCD 均为扩大解释,不违反罪刑法定。","k":"刑法基础与效力"}]},{"sub":"刑法","name":"分则·破坏市场经济秩序罪","w":3.0,"L":51,"qs":[{"id":"2005-16","y":2005,"t":"单","s":"境外走私人阿某向中国境内走私石油,偷逃关税 50 万元,王某得知后,向阿某收购了这批走私进境的石油。 王某的行为构成(   )","o":["非法经营罪","走私普通货物罪","收购赃物罪","偷税罪"],"a":"B","e":"走私普通货物罪,包括以下五种方式:瞒关(隐瞒不报)、绕关(从非海关关口进出)、闯关、变\n相走私(即后续走私,刑法第154 条)和间接走私(刑法第155 条)。直接向走私人非法收购走私进口的货物,数\n额较大的行为,属于间接走私,按走私普通货物罪定罪处罚。非法经营罪与走私普通货物罪,在犯罪客体上是不同,\n前者是市场秩序,后者是国家海关管理秩序。王某的行为同时侵犯这两个客体,同时构成非法经营罪与走私普通货\n物罪,成立想象竞合犯,根据\"从一重罪处断\"原则,由于走私普通货物罪(偷逃关税50 万元)的量刑重于非法经\n营罪,因此按走私普通货物罪定罪处罚。王某收购这批走私进境的石油,也构成收购赃物罪,成立收购赃物罪与走\n私普通货物罪的法条竞合犯,根据\"特别法优于一般法\"的原则,应当按走私普通货物罪定罪处罚。王某不存在偷\n逃关税的直接行为,因此不构成偷税罪。","k":"分则·破坏市场经济秩序罪"},{"id":"2005-17","y":2005,"t":"单","s":"集资诈骗罪与吸收公众存款罪区别的关键是(   )","o":["是否涉及巨额资金","是否涉及众多被害人","是否具有非法占有目的","是否由单位组织实施"],"a":"C","e":"集资诈骗罪(第192 条),是指以非法占有为目的,使用诈骗方法非法集资,数额较大的行为;非\n法吸收公众存款罪(第176 条),是指非法吸收公众存款或者变相吸收公众存款,扰乱金融秩序的行为。据此,选\n项C 应选。对于集资诈骗罪与非法吸收公众存款罪,都可能涉及巨额资金,也都可能涉及众多被害人,而且单位都\n可构成该二罪。据此,排除选项A、B、D。","k":"分则·破坏市场经济秩序罪"},{"id":"2006-24","y":2006,"t":"多","s":"些犯罪的违法所得及其产生的收益,为掩饰,隐瞒其来源和性质而提供资金账户的,构成洗钱罪(       )","o":["恐怖活动犯罪","毒品犯罪","受贿犯罪","走私犯罪"],"a":"ABD","e":"","k":"分则·破坏市场经济秩序罪"},{"id":"2006-7","y":2006,"t":"单","s":"关于刑法中法条竟合关系的表述,错误的是(   )","o":["法条竟合关系的表现形式之一是一些条文之间在内容上存在交叉关系","对法条竟合关系的处理原则是,在一般情况下依照特别法条优于普通法条的原则,适用特别法条","诈骗罪与信用卡诈骗罪之间存在法条竟合关系","行贿罪与受贿罪之间存在法条竟合关系"],"a":"D","e":"本题是选错项,所以直接可以选错误的D 项。","k":"分则·破坏市场经济秩序罪"},{"id":"2007-16","y":2007,"t":"单","s":"甲弄虚作假,采用将高关税税率货物伪报为低关税税率货物的方法进口货物,偷逃关税 20 万元。甲的行为构 成 (   )","o":["偷税罪","走私罪","诈骗罪","走私普通货物、物品罪"],"a":"D","e":"走私普通货物、物品罪 \n] 走私普通货物、物品罪是指违反海关祛律、法规,逃避海关监管,非法运输、携带、 \n邮寄国家限制进出口,以及其他应缴纳税款的货物、物品进出国(边)境,偷逃关税税额超 \n过 5 万元的行为。故答 \n案为 D。","k":"分则·破坏市场经济秩序罪"},{"id":"2007-17","y":2007,"t":"单","s":"甲的私营企业在 2004 年生产的产品全部内销,并缴纳了各种税收 50 万元。甲在年底向税务机关谎称其中部 分产品出口,并出具了虚假的出口外销合同及相关证明,获得国家 20 万元的出口退税。甲的行为构成 (   ) 。","o":["合同诈骗罪","诈骗罪","偷税罪","合同诈骗罪和偷税罪"],"a":"C","e":"逃税罪(偷税罪名已取消) \n]刑法第 204 条规定,纳税人缴纳税款后,采取假报出口或者其他欺骗手段,骗取所缴 \n纳的税款的,依照逃税罪的规定定罪处罚。故答案为 C。","k":"分则·破坏市场经济秩序罪"},{"id":"2011-10","y":2011,"t":"单","s":"甲在香港购买一批香烟,隐藏于免税货物中 从海关人境。该批香烟偷逃关税8万元。甲的行为 构成()。","o":["逃税罪","非法经营罪","走私普通货物罪","掩饰、隐瞒犯罪所得罪"],"a":"C","e":"\"走私\n\"一词的含义有两种。第一种是\n指国家禁止进出口相关物品,而违法将其进出口。这\n种主要是指一些特定对象的走私犯罪,如走私武器、\n弹药罪。\n\"走私\n\"的另一种含义是指对于国家允许进\n出口的货物、物品,行为人在进出口活动中,偷逃关税\n达到一定数额,这种情况就是指走私普通货物、物品\n罪。在本题中,甲将国家允许进出口的香烟携带入\n境,却未缴纳相应的关税,行为性质属于走私普通货\n物、物品。本题原答案为C,因为根据当时的司法解\n释,自然人构成走私普通货物、物品罪的数额是5 万\n元以上,本题题干中提到\n\" 偷逃8万元关税\n\",达到了\n定罪数额。但最新的司法解释将自然人构成走私普\n通货物、物品罪的数额修改为10万元以上,故8万元\n不够定罪标准,现本题无答案。为避免由于司法解释\n关于定罪数额变化对考试答案的影响,后期的真题很\n少再出现明确的数额,而是代之以\n\" 数额较大\n\"\" 情节\n严重\n\"等表述。如何区分逃税与走私,关键在是否发\n生在\n\" 海关\n\"这一地点。","k":"分则·破坏市场经济秩序罪"},{"id":"2011-16","y":2011,"t":"单","s":"甲为牟利,未经著作权人许可,私自复制影视 作品的DVD出售,销售金额4万元,获纯利润3万余 元。这批DVD因质量太差导致他人在播放时经常死 机。对甲的行为应定为()。","o":["销售侵权复制品罪","侵犯著作权罪","非法经营罪","生产、销售伪劣产品罪"],"a":"B","e":"在认定行为人是否构成侵犯著作权罪\n时,需要从三个方面考查:(1)行为人侵犯他人著作\n权的非法所得是否达到数额较大,或者是否具有《刑\n法》所规定的严重情节;(2)行为人主观上是否具有\n营利的目的;(3)行为人是否实施了侵犯著作权的行\n为。根据《刑法》的规定,侵犯著作权包括以下几种行\n为:(1)未经著作权人许可,复制发行、通过信息网络\n向公众传播其文字作品、音乐、美术、视听作品、计算\n机软件及法律、行政法规规定的其他作品的;(2)出\n版他人享有专有出版权的图书的;(3)未经录音录像\n制作者许可,复制发行、通过信息网络向公众传播其\n制作的录音录像的;(4)未经表演者许可,复制发行\n录有其表演的录音录像制品,或者通过信息网络向公\n众传播其表演的;(5)制作、出售假冒他人署名的美\n术作品的;(6)未经著作权人或者与著作权有关的权\n利人许可,故意避开或者破坏权利人为其作品、录音\n录像制品等采取的保护著作权或者与著作权有关的\n权利的技术措施的。这里需要考生明确侵犯著作权\n罪和销售侵权复制品罪的关系:先制作侵权复制品,\n然后销售,如果针对同一物品,就只定侵犯著作权罪;\n如果针对不同物品,就定侵犯著作权罪和销售侵权复\n制品罪,数罪并罚。在本题中,甲为牟利,未经著作权\n人许可,私自复制影视作品的DVD出售,甲复制和销\n售的侵权复制品属于同一物品,故成立侵犯著作权\n罪。非法经营罪,是指自然人或者单位,违反国家规\n定,故意从事非法经营活动,扰乱市场秩序,情节严重\n的行为。侵犯著作权罪与非法经营罪的区别在千侵\n犯著作权罪的侵犯对象是有著作权的作品,而非法经\n营罪从字面上很难理解其具体犯罪行为是哪些,这有\n赖于刑法和相关司法解释具体规定哪些行为构成非\n法经营罪。所以非法经营罪有点像一个\n\"兜底罪名\n\" ,\n一些刑法学家认为该罪与罪刑法定原则存在紧张关\n系。认定生产销售伪劣产品罪要注意区分罪与非罪\n的界限,区分的关键在于伪劣产品的销售数额是否达\n到《刑法》所规定的5万元,凡是已经达到5万元的,\n即构成生产、销售伪劣产品罪,未达到这一数额结果\n的,属于一般的违法行为。故答案选B。\n(特别说明]\n关于B选项,《刑法修正案(十\n一)》对侵犯著作权罪进行了修改:完善了侵犯著作权\n罪中的作品种类(美术、视听作品);著作权的保护范\n围扩大到与著作权有关的权利。此罪变化较大,考生\n应予注意。","k":"分则·破坏市场经济秩序罪"},{"id":"2011-19","y":2011,"t":"单","s":"下列行为中,构成逃税罪的是()。","o":["甲采用暴力方法拒不缴纳税款2万元","乙以逃避海关监管的方式偷逃海关关税5 万元","丙虚开增值税专用发票,造成国家税款流失 25万元","丁缴纳某批次货物税款10万元后,假报该批 次货物出口,骗取出口退税8万元"],"a":"D","e":"本题涉及逃税罪和骗取出口退税罪的\n区分。《刑法》第20 4 条第2款规定纳税人缴纳税款\n后,采取假报出口的欺骗方法,骗取所缴纳的税款的,\n依照逃税罪定罪处罚。骗取税款超过所缴纳的税款\n部分则按照骗取出口退税罪定罪处罚。例如,行为人\n缴纳税款10 万元,后假报出口,骗取出口退税8万\n元,则行为人成立逃税罪。若行为人在缴纳税款10\n万元后,通过假报出口骗取出口退税18 万元,则10\n万元的部分按照逃税罪定罪处罚,8万元的部分按照\n骗取出口退税罪定罪处罚。所以本题答案为D。A\n构成抗税罪,B 的行为性质是走私普通货物、物品,但\n由于数额未达到10 万元,不构成走私普通货物、物品\n罪,C 构成虚开增值税专用发票、用千骗取出口退税、\n抵扣税款发票罪。","k":"分则·破坏市场经济秩序罪"},{"id":"2011-45","y":2011,"t":"多","s":"甲伪造食盐专营许可证,从盐业公司购进30 吨食盐进行销售。同时,还从一非法生产者处购进明 知系假冒注册商标的非碘盐,冒充碘盐进行销售,销 售金额达30万元。关于本案,下列说法中正确的有 ()。","o":["甲的行为构成非法经营罪","甲的行为构成假冒注册商标罪","甲的行为构成销售伪劣产品罪","甲伪造国家机关证件的行为与非法经营的行 为具有牵连关系"],"a":"ACD","e":"甲未经许可经营法律、行政法规规定的\n专营、专卖物品或者其他限制买卖的物品的,构成非\n法经营罪;甲将非瑛盐冒充碳盐销售,在产品中以假\n充真,违法所得数额较大,构成销售伪劣产品罪;甲伪\n造国家机关证件的行为与非法经营的行为是手段与\n目的的关系,具有牵连关系,从一重处断,ACD正确。\n假冒注册商标罪是指违反国家商标管理法规,未经注\n册商标所有人许可,在同一种商品上使用与其注册商\n标相同的商标,情节严重的行为。可见假冒注册商标\n罪是一种使用注册商标的行为,在本题中甲仅仅是从\n生产者处购进的假冒注册商标的商品,并没有使用与\n注册商标相同的商标这一行为,故不构成假冒注册商\n标罪。","k":"分则·破坏市场经济秩序罪"},{"id":"2012-20","y":2012,"t":"单","s":"下列情形中,应当以非法经营罪定罪处罚的 是( )。","o":["甲销售盗版图书,违法所得20万元","乙开办公司专门为他人虚开增值税专用发票, 违法所得20万元","丙公司未经证监会批准,非法从事证券业务, 违法所得100万元","丁开办废品站专门从盗窃犯罪分子手中收购 赃物,倒卖牟利,违法所得20万元"],"a":"C","e":"《刑法》第225条规定,违反国家规定,\n有下列非法经营行为之一,扰乱市场秩序,情节严重\n的,处5 年以下有期徒刑或者拘役,并处或者单处违\n法所得一倍以上五倍以下罚金;情节特别严重的,处5\n年以上有期徒刑,并处违法所得一倍以上五倍以下罚\n金或者没收财产:(1)未经许可经营法律、行政法规\n规定的专营、专卖物品或者其他限制买卖的物品的;\n(2)买卖进出口许可证、进出口原产地证明以及其他\n法律、行政法规规定的经营许可证或者批准文件的;\n(3)未经国家有关主管部门批准非法经营证券、期\n货、保险业务的,或者非法从事资金支付结算业务的;\n(4)其他严重扰乱市场秩序的非法经营行为。故选\nC。AB两项分别构成了销售侵权复制品罪和虚开增\n值税专用发票罪。D项则构成了掩饰、隐瞒犯罪所\n得犯罪所得收益罪,这三项都不符合非法经营罪的\n构成。","k":"分则·破坏市场经济秩序罪"},{"id":"2012-43","y":2012,"t":"多","s":"组织领导传销活动罪中 “ 传销活动 ” 的特征 包括( )。","o":["目的是骗取他人财物","参加者按照一定顺序组成层级开展活动","计酬或者返利以参加者发展的人员数量为 依据","要求参加者以缴纳费用或者购买商品、服务 等方式获得加入资格"],"a":"ABCD","e":"根据《刑法》第224 条的规定,组织、领\n导以推销商品、提供服务等经营活动为名,要求参加\n者以缴纳费用或者购买商品、服务等方式获得加入资\n格,并按照一定顺序组成层级,直接或者间接以发展\n人员的数量作为计酬或者返利依据,引诱、胁迫参加\n者继续发展他人参加,骗取财物,扰乱经济社会秩序\n的传销活动的,是组织、领导传销活动罪。故ABCD\n正确。传销是现在社会上热点罪名,考生应该注意把\n握该罪名。","k":"分则·破坏市场经济秩序罪"},{"id":"2013-10","y":2013,"t":"单","s":"2010年7月,甲成立了一公司,宣称只要购买 该公司999元的产品,便可成为“商务代表”,获取发 展人员资格,并以发展人员的数量支付报酬。甲共引 诱2987人参加并形成了五级“销售”网络,骗取财物 总值200余万元。对甲的行为()。","o":["应以诈骗罪定罪处罚","应以非法经营罪定罪处罚","应以集资诈骗罪定罪处罚","应以组织、领导传销活动罪定罪处罚"],"a":"D","e":"本题考查的是组织、领导传销活动罪跟\n非法经营罪的区别。组织、领导传销活动罪,是指组\n织领导以推销商品、提供服务等经营活动为名,要求\n参加者以缴纳费用或者购买商品、服务等方式获得加\n入资格,并按照一定的顺序组成层级,直接或者间接\n以发展人员的数量作为计酬或者返利依据,引诱、胁\n迫参加者继续发展他人参加,骗取财物,扰乱社会经\n济秩序的传销活动的行为。本题中甲所声称的\n\"购\n买......产品......获取发展人员资格,并以发展人员的\n数量支付报酬\n\",符合组织、领导传销活动罪的构成要\n件。而该罪与非法经营罪的主要区别就在于,组织、\n领导传销活动罪并没有真实存在的服务或者产品。\n甲是\n\" 声称\n\"购买产品,而没有拿出产品的实体,可见\n并没有真实存在的商品。故答案为D。","k":"分则·破坏市场经济秩序罪"},{"id":"2013-15","y":2013,"t":"单","s":"甲收受乙公司50万元现金后,请求在某市交 通局当处长的堂兄丙“帮助”乙公司承包某工程。丙 遂利用职权,违规操作,帮助乙公司承包了该工程。 甲的行为()。","o":["不构成犯罪","构成受贿罪","构成利用影响力受贿罪","构成非国家工作人员受贿罪"],"a":"C","e":"所谓利用影响力受贿罪,是指国家工作\n人员的近亲属或者其他与该国家工作人员关系密切\n的人,通过该国家工作人员职务上的行为,或者利用\n该国家工作人员职权或者地位形成的便利条件,通过\n其他国家工作人员职务上的行为,为请托人谋取不\n正当利益,索取请托人或者受托人的财物,数额较大\n或者具有其他严重情节的行为;抑或离职的国家工\n作人员或者其近亲属以及关系密切的人,利用该离\n职的国家工作人员原职权或者地位形成的便利条\n件,通过其他国家工作人员职务上的行为,为请托人\n谋取不正当利益,索取或者收受请托人财物,数额较\n大或者有其他较严重情节的行为。本题中,甲收受\n了乙公司的贿赂,利用其堂兄的职权,为乙公司谋取\n了利益,完全符合利用影响力受贿罪的构成要件,因\n此应该选C。","k":"分则·破坏市场经济秩序罪"},{"id":"2014-14","y":2014,"t":"单","s":"下列行为中,应以非国家工作人员受贿罪定 罪处罚的是()。","o":["税务局局长甲,要求辖区内的公司为该局建 设办公楼提供财物支持","国有资产管理公司负责人乙,在处置国有资产 的过程中,收受他人财物","已离职的工商局局长丙,收受刘某的钱财,要 求被自己提拔起来的工商局副局长停止对刘 某销售伪劣产品案件的查处","已退休的卫生局局长丁,与朋友共同出资设 立有限责任公司,并担任副总经理,利用这一 职务在采购物资时收受回扣归自己所有"],"a":"D","e":"本题考查的是非国家工作人员受贿罪\n和受贿罪的区别。所谓非国家工作人员受贿罪,是指\n公司、企业或其他单位的工作人员利用职务上的便\n利,索取他人财物或非法收受他人财物,为他人谋取\n利益,数额较大的行为。本罪与受贿罪的主要区别在\n于主体的不同。受贿罪的主体包括:国家工作人员,\n以国家工作人员论的国有公司企业事业单位中从事\n公务的人员和国有公司企业单位委派到非国有公司\n企业单位中从事公务的人员。因此,甲、乙属于受贿\n罪。而丙属于在退休后利用影响力受贿。只有丁,虽\n然在职时是国家工作人员,但退休之后担任与其之前\n职位无关的私人公司的经理,并利用其在公司中的职\n权受贿,属于非国家工作人员受贿罪。","k":"分则·破坏市场经济秩序罪"},{"id":"2014-43","y":2014,"t":"多","s":"下列行为中,应以合同诈骗罪定罪处罚的有 )。","o":["甲以虚构的单位与某公司签订合同,骗取数 额较大的财物后潜逃","乙与电脑公司签订代销合同,在收到对方送来 的代销电脑后携带电脑潜逃","丙谎称手中有优质投资项目,吸引公众投资, 收取巨额投资款后挥霍一空","丁以假房产证作担保,与银行签订借款合同, 骗取巨款后购买豪车"],"a":"AB","e":"根据《刑法》的规定,合同诈骗罪是指\n以非法占有为目的,在签订履行合同的过程中骗取对\n方财物数额较大的行为。选项A 中甲以虚构的单位\n与某公司签订合同,骗取数额较大的财物后潜逃,属\n于以虚构单位的形式进行合同诈骗的情形。选项B\n中乙与电脑公司签订代销合同,在收到对方送来的代\n销电脑后携带电脑潜逃属于收受对方给付的货物后\n逃匿的情形,亦属合同诈骗。选项C 属千以非法占有\n为目的的集资诈骗罪。选项D则是贷款诈骗罪。","k":"分则·破坏市场经济秩序罪"},{"id":"2014-45","y":2014,"t":"多","s":"下列行为中,应以侵犯著作权罪定罪处罚的 有()。","o":["甲复制外国的淫秽影片出售,获利数额较大","乙未经录像制作者许可,复制其制作的录像, 获利数额较大","丙未经权利人许可,复制发行他人计算机软件 并出售牟利,获利数额较大","丁未经拍摄者许可,将其拍摄的大量视频文 件上传到网络免费供他人下载"],"a":"BC","e":"根据修正后《刑法》的规定,侵犯著作\n权包括以下几种行为:(l) 未经著作权人许可,复制\n发行通过信息网络向公众传播其文字作品音乐、美\n术、视听作品、计算机软件及法律、行政法规规定的其\n他作品的;(2)出版他人享有专有出版权的图书的;\n(3) 未经录音录像制作者许可,复制发行、通过信息\n网络向公众传播其制作的录音录像的;(4) 未经表演\n者许可,复制发行录有其表演的录音录像制品,或者\n通过信息网络向公众传播其表演的;(5) 制作、出售\n假冒他人署名的美术作品的;(6)未经著作权人或者\n与著作权有关的权利人许可,故意避开或者破坏权利\n人为其作品、录音录像制品等采取的保护著作权或者\n与著作权有关的权利的技术措施的。因此BC选项中\n的行为构成了侵犯著作权罪。本题选BC。\n[特别说明]\n考生应当注意《刑法修正案(十\n-W修改了侵犯著作权罪:完善了侵犯著作权罪中的\n作品种类(美术、视听作品);著作权的保护范围扩大\n到与著作权有关的权利。","k":"分则·破坏市场经济秩序罪"},{"id":"2015-11","y":2015,"t":"单","s":"空姐甲长期在国外购买化妆品,经无申报通 道携带人境,交由其表妹在网店销售,偷逃高额海关 关税,获利数额巨大。甲的行为应认定为( )。","o":["逃税罪","走私普通货物、物品罪","非法经营罪","为亲友非法牟利罪"],"a":"B","e":"所谓走私普通货物、物品罪是指违反海\n关法规,逃避海关监管,非法运输、携带、邮寄国家禁\n止进出口的武器、弹药、核材料、假币、珍贵动物及其\n制品、珍稀植物及其制品、淫秽物品以及国家禁止出\n口的文物金银和其他贵重金属以外的其他货物、物\n\n品进出境,偷逃应缴纳关税数额较大或者一年内曾因\n走私被给予两次行政处罚后又走私的行为。甲在国\n外购买物品,经无申报通道携带入境,逃避海关监管\n属于违反海关法规,偷逃海关关税数额巨大的行为,\n所以甲的行为应认定为走私普通货物、物品罪,B选\n项正确。逃税罪是指纳税人采取欺骗、隐瞒手段进行\n虚假纳税申报或者不申报,逃避缴纳税款数额较大,\n并且占应纳税额10%以上,扣缴义务人采取欺骗、隐\n瞒等手段,不缴或者少缴已扣已收税款,数额较大或\n者因逃税受到两次行政处罚又逃税的行为。走私普\n通货物、物品罪偷逃的是应缴纳的关税,逃税罪偷逃\n的是其他税,所以甲不成立逃税罪,A选项错误。非\n法经营罪,是指未经许可经营专营、专卖物品或其他\n限制买卖的物品,买卖进出口许可证、进出口原产地\n证明以及其他法律、行政法规规定的经营许可证或者\n批准文件,以及从事其他非法经营活动,扰乱市场秩\n序,情节严重的行为。甲的行为并不是法律或者司法\n解释规定的非法经营行为,不成立非法经营罪,C选\n项错误。为亲友非法牟利罪是指国有公司、企业、事\n业单位的工作人员,利用职务便利,从事以下行为:\n(1)将本单位的盈利业务交由自己的亲友进行经营\n的;(2)以明显高于市场的价格向自己的亲友经营管\n理的单位采购商品或者以明显低于市场的价格向自\n己的亲友经营管理的单位销售商品的;(3)向自己的\n亲友经营管理的单位采购不合格商品的,使国家利益\n遭受重大损失。本题中甲的行为不符合为亲友非法\n牟利罪的犯罪构成,D选项错误。","k":"分则·破坏市场经济秩序罪"},{"id":"2015-17","y":2015,"t":"单","s":"下列行为中,可以认定为妨害信用卡管理罪 的是( )。","o":["拾得他人信用卡并使用","窃得他人信用卡并使用","使用虚假的居民身份证骗领信用卡","使用以虚假居民身份证骗领的信用卡"],"a":"C","e":"所谓妨害信用卡管理罪是指违反信用\n卡管理法律、法规的规定,妨害信用卡管理的行为。\n妨害信用卡管理的行为包括:(1)明知是伪造的信用\n卡而持有、运输的,或者明知是伪造的空白信用卡而\n持有、运输,数量较大的;(2)非法持有他人信用卡,\n数量较大的;(3)使用虚假的身份证明骗领信用卡\n的;(4)出售、购买、为他人提供伪造的信用卡或者以\n虚假的身份证明骗领的信用卡的行为。本题中C选\n项\n\"使用虚假的居民身份证骗领信用卡\n\",属千使用虚\n假的身份证明骗领信用卡的行为,可以认定为妨害信\n用卡管理罪,C选项正确。根据司法解释的规定,A、D\n选项的行为是信用卡诈骗罪,不选。B选项的行为构\n成盗窃罪,不选。","k":"分则·破坏市场经济秩序罪"},{"id":"2015-44","y":2015,"t":"多","s":"下列行为中,应以非法经营罪(不考虑数额或 者情节)定罪处罚的有()。","o":["甲在生产的饲料中添加“瘦肉精”","乙私设转接设备,擅自经营国际电信业务","丙组织多人出卖人体器官,并从中获取介绍费","丁用POS机为他人刷信用卡套取现金,赚取 手续费"],"a":"ABD","e":"本题考查的是非法经营罪,所谓非法经\n营罪,是指违反国家规定,非法经营,扰乱市场秩序,\n情节严重的行为。根据司法解释的规定,违反国家规\n定,使用销售点终端机具(POS机)等方法,以虚构交\n易虚开价格现金退货等方式向信用卡持卡人直接\n支付现金,情节严重的,应当依据《刑法》第225条的\n规定,以非法经营罪定罪处罚。D选项正确。违反国\n家规定,采取租用国际专线、私设转接设备或者其他\n方法,擅自经营国际电信业务或者涉港澳台电信业务\n进行营利活动,扰乱电信市场管理秩序,情节严重的,\n依照《刑法》第225条第4项的规定,以非法经营罪定\n罪处罚。B选项正确。在生产、销售的饲料中添加盐\n酸克仑特罗等禁止在饲料和动物饮用水中使用的药\n品,或者销售明知是添加有该类药品的饲料,情节严\n重的,依照《刑法》第225条第4项的规定,以非法经\n营罪追究刑事责任。盐酸克仑特罗的通俗名称就是\n\"瘦肉精\n\" ,A选项正确。C选项组织出卖人体器官的\n行为属于组织出卖人体器官罪,不以非法经营罪处\n罚。非法经营罪是具有\n\"兜底\n\"性质的一项犯罪,如果\n《刑法》对于有关行为规定有独立的罪名,则以相应的\n罪名定罪处罚,而不认定为非法经营罪。","k":"分则·破坏市场经济秩序罪"},{"id":"2016-13","y":2016,"t":"单","s":"甲将面粉制作的小丸冒充消炎药卖给某药 店,获利巨大。对甲的行为( )。","o":["应以诈骗罪定罪处罚","只能以生产、销售假药罪定罪处罚","只能以生产、销售伪劣产品罪定罪处罚","应以生产、销售假药罪与生产、销售伪劣产品 罪择一重罪处断"],"a":"D","e":"刑法第149条的规定:生产、销售本节\n第141条至第148条所列产品,构成该条规定的犯\n罪,同时又构成本节第140条规定之罪的,依照处罚\n较重的规定定罪处罚。\n甲将面粉制作的小丸冒充消炎药卖给药店,以假\n充真,既是生产销售假药,构成生产销售假药罪,也\n是生产、销售伪劣产品,构成生产、销售伪劣产品罪,\n按照刑法第149条的规定,择一重罪处断,D选项正\n确,B、C选项错误。\n诈骗罪,是指以非法占有为目的,用虚构事实或\n者隐瞒真相的方法,骗取数额较大的公私财物的行\n为。诈骗罪与生产、销售伪劣产品罪区分的关键在千\n行为人主观上有无真实交易的意图。诈骗罪的行为\n人根本没有真实的交易意图,诈骗罪的根本目的是为\n了骗取财物,交易只不过是其诈骗的手段。而生产、\n销售伪劣产品罪的行为人有真实的交易意图,进行真\n实的交易活动,只不过是产品质量有问题。生产、销\n售伪劣产品罪的犯罪目的是赚取非法的经济利益。\n本题中甲具有真实交易的目的,甲并没有以交付真的\n消炎药为幌子,骗取药店的财物,甲的行为不成立诈\n骗罪,A选项错误。\n[特别说明]\n《刑法修正案(十一)》对假药和劣\n药的相关问题作了修改:提高了药品使用单位人员\n(比如医生)用药的审慎义务。将药品使用单位人员\n明知是假药、劣药而提供给他人使用的行为纳入刑法\n规制范围,突出对医院、诊所等药品使用单位人员药\n品使用的注意义务。尤其值得注意的是,条文中用的\n词语是提供,即包括有偿提供和无偿提供两种情形。","k":"分则·破坏市场经济秩序罪"},{"id":"2016-4","y":2016,"t":"单","s":"下列行为可以构成犯罪的是()。","o":["参加传销组织","多次敲诈勒索他人财物","雇用童工清理客房","拐卖15周岁的男孩"],"a":"B","e":"刑法第274条规定:敲诈勒索公私财\n物,数额较大或者多次敲诈勒索的,处三年以下有期\n徒刑拘役或者管制,并处或者单处罚金。根据本条\n的规定,多次敲诈勒索他人财物的,成立敲诈勒索罪。\n所以选B。\n刑法第224条之一规定:组织、领导以推销商品、\n提供服务等经营活动为名,要求参加者以缴纳费用或\n者购买商品、服务等方式获得加入资格,并按照一定\n顺序组成层级,直接或者间接以发展人员的数量作为\n计酬或者返利依据,引诱、胁迫参加者继续发展他人\n参加,骗取财物,扰乱经济社会秩序的传销活动的,处\n五年以下有期徒刑或者拘役,并处罚金;情节严重的,\n处五年以上有期徒刑,并处罚金。根据本条的规定,\n组织领导传销的,才构成犯罪,参加传销组织的,不\n构成犯罪,A不选。\n刑法第244条之一规定:违反劳动管理法规,雇\n用未满十六周岁的未成年人从事超强度体力劳动的,\n或者从事高空、井下作业的,或者在爆炸性、易燃性、\n放射性毒害性等危险环境下从事劳动,情节严重的,\n对直接责任人员,处三年以下有期徒刑或者拘役,并\n处罚金;情节特别严重的,处三年以上七年以下有期\n徒刑,并处罚金。根据本条规定,雇佣童工从事超强\n度体力劳动的,才构成犯罪。清理客房不是超强度体\n力劳动,所以不构成犯罪,C 不选。\n刑法第240条规定:拐卖妇女、儿童的,处五年以\n上十年以下有期徒刑,并处罚金。儿童是指不满14\n周岁幼儿。D选项,已满15周岁,不是儿童。15周岁\n的男孩,也不是妇女,所以D不成立拐卖妇女、儿童\n罪。这道题的D选项有些不严谨,拐卖15岁的男孩\n儿虽然不能构成拐卖妇女、儿童罪,但是可能视具体\n情况以非法拘禁罪论处,所以也有可能是构成犯罪\n的,题干是问\n\"可以构成犯罪的\n\",但官方答案是B,我\n们只能依据官方的答案来解析,但文运法硕做该提\n示,希望考生了解。","k":"分则·破坏市场经济秩序罪"},{"id":"2016-42","y":2016,"t":"多","s":"下列行为中,可以构成侵犯著作权罪的有 )。","o":["出售假冒某画家署名的油画","出版某出版社享有专有出版权的考试辅导书","未经某作家许可,复制发行其创作的历史小说","未经某音像公司许可,复制发行其制作的音 乐唱片"],"a":"ABCD","e":"根据《刑法》的规定,侵犯著作权包括\n以下儿种行为:(1)未经著作权人许可,复制发行、通\n过信息网络向公众传播其文字作品、音乐、美术、视听\n作品、计算机软件及法律、行政法规规定的其他作品\n的;(2)出版他人享有专有出版权的图书的;(3)未\n经录音录像制作者许可,复制发行、通过信息网络向\n公众传播其制作的录音录像的;(4)未经表演者许\n可,复制发行录有其表演的录音录像制品,或者通过\n信息网络向公众传播其表演的;(5)制作、出售假冒\n他人署名的美术作品的;(6)未经著作权人或者与著\n作权有关的权利人许可,故意避开或者破坏权利人为\n其作品、录音录像制品等采取的保护著作权或者与著\n作权有关的权利的技术措施的。\"因此本题选ABCD。\n[特别说明]\n《刑法修正案(十一门修改了侵犯\n著作权罪:完善了侵犯著作权罪中的作品种类(美术、\n视听作品);著作权的保护范围扩大到与著作权有关\n的权利。","k":"分则·破坏市场经济秩序罪"},{"id":"2017-13","y":2017,"t":"单","s":"下列选项中,属于信用卡诈骗罪中冒用他人 信用卡情形的是()。","o":["盗窃他人信用卡并使用","使用作废的信用卡","使用伪造的信用卡","拾得他人信用卡并使用"],"a":"D","e":"根据《刑法》第1 96条的规定,信用卡\n诈骗罪的犯罪方式有以下几种:(一)使用伪造的信\n用卡,或者使用以虚假的身份证明骗领的信用卡的;\n(二)使用作废的信用卡的;(三)冒用他人信用卡\n的;(四)恶意透支的。盗窃信用卡并使用的,按照盗\n窃罪定罪处罚。A项成立盗窃罪,不成立信用卡诈骗\n罪,A项错误。BC项使用作废的信用卡、使用伪造的\n信用卡是与冒用他人信用卡并列的成立信用卡诈骗\n罪的犯罪行为,而不是冒用他人信用卡的行为,BC项\n错误。根据司法解释的规定,拾得他人信用卡并在自\n动柜员机上使用的行为,属于冒用他人信用卡的情\n形,以信用卡诈骗罪定罪处罚,D项正确。","k":"分则·破坏市场经济秩序罪"},{"id":"2017-41","y":2017,"t":"多","s":"下列选项中,属于刑法立法解释的有()。","o":["全国人大常委会《关于惩治骗购外汇、逃汇和 非法买卖外汇犯罪的决定》","全国人大常委会《关于<中华人民共和国刑 法>有关信用卡规定的解释》","全国人大常委会法制工作委员会刑法室《关 于挪用资金罪有关问题的答复》","全国人大常委会《关于(中华人民共和国刑 法>第二百六十六条的解释》"],"a":"BD","e":"立法解释是指刑法的立法机关对刑法\n条文的解释。在我国,全国人大及其常委会对刑法条\n文的解释属于立法解释。全国人大常委会法制工作\n委员会不是立法解释的机关,没有立法解释权,C项\n错误。《关于惩治骗购外汇、逃汇和非法买卖外汇犯\n罪的决定》是全国人大常委会1998年12月颁布的单\n行刑法,不是立法解释,A项错误。BD项是全国人大\n常委会对刑法条文的解释,是立法解释,本题应\n选BD。","k":"分则·破坏市场经济秩序罪"},{"id":"2018-14","y":2018,"t":"单","s":"甲破解了张某的股票账户密码,偷偷登录账 户买卖股票练手,案发时造成张某股票账户资金实亏 15 万元,甲的行为应认定为( )。","o":["盗窃罪","非法经营罪","故意毁坏财物罪","非法侵入计算机信息系统罪"],"a":"C","e":"本题中,甲非法破解张某的账号,主\n观上没有窃取财物的故意,虽然造成赵某资金损\n失,也不成立盗窃罪,A项错误。该情形不属于法\n律和司法解释规定的非法经营的行为类型,B项错\n误;甲破解张某的账号,明知自己没有操作能力而\n进行操作,造成赵某资金损失,构成故意毁坏财物\n罪,C项正确;非法侵入计算机信息系统罪,是指违\n反国家规定,侵入国家事务、国防建设、尖端科学技\n术领域的计算机信息系统的行为,甲的行为不属千\n该行为,不成立非法侵入计算机信息系统罪,D项\n错误。","k":"分则·破坏市场经济秩序罪"},{"id":"2018-15","y":2018,"t":"单","s":"下列选项中,既可以作为实行,也可以由不作 为实行的是( )。","o":["洗钱罪","遗弃罪","玩忽职守罪","拒不履行信息网络安全管理义务罪"],"a":"C","e":"玩忽职守罪是指国家工作人员玩忽职\n守,致使公共财产、国家和人民利益遭受重大损失的\n行为。玩忽职守的行为可以作为也可以不作为,C项\n正确;洗钱罪是作为犯罪,A项错误;BD 是纯正的不\n作为犯罪。","k":"分则·破坏市场经济秩序罪"},{"id":"2018-43","y":2018,"t":"多","s":"在情节严重的情况下,下列行为应认定为非 法经营罪的有( )。","o":["使用伪造的药品经营许可证,非法经营药品","长期以暴力手段强迫他人向自己借款,赚取 利息","以营利为目的,长期通过网络有偿提供删除信 息服务","非法生产具备赌博功能的电子游戏机,供他 人开设赌场"],"a":"ACD","e":"以暴力手段强迫他人向自己借款,赚取\n利息,构成强迫交易罪,B项不选。根据司法解释的\n规定,违反国家药品管理法规,未取得或者使用伪造、\n变造的药品经营许可证,非法经营药品,情节严重的,\n依照刑法第255条的规定以非法经营罪定罪处罚,A\n项当选。违反国家规定,以营利为目的,通过信息网\n络有偿提供删除信息服务,或者明知是虚假信息,通\n过信息网络有偿提供发布信息等服务,扰乱市场秩\n序,属千非法经营行为,情节严重的,以非法经营罪定\n罪处罚。C项正确。司法解释规定,以供他人开设赌\n场为目的,非法生产具备赌博功能的电子游戏机的,\n情节严重的以非法经营罪论处。D项正确,因此\n选ACD。","k":"分则·破坏市场经济秩序罪"},{"id":"2018-45","y":2018,"t":"多","s":"生产、销售伪劣产品罪的客观方面表现为,在 生产销售的产品中( )。","o":["以次充好","以假充真","掺杂","掺假"],"a":"ABCD","e":"生产、销售伪劣产品罪是指生产者、销\n售者在产品中掺杂、掺假、以假充真、以次充好或者以\n不合格产品冒充合格产品,销售金额达5万元以上的\n行为。因此本题ABCD项全选。","k":"分则·破坏市场经济秩序罪"},{"id":"2019-4","y":2019,"t":"单","s":"下列选项中,不属于洗钱罪的上游犯罪的是 )。","o":["毒品犯罪","贪污犯罪","走私犯罪","组织传销活动犯罪"],"a":"D","e":"根据《刑法》第191条的规定,洗钱罪\n的上游犯罪是毒品犯罪、黑社会性质的组织犯罪、恐\n怖活动犯罪、走私犯罪、贪污贿赂犯罪、破坏金融管理\n秩序犯罪、金融诈骗犯罪,一共七类。从法律规定可\n以得出D项不属于洗钱罪的上游犯罪,本题选D。\nABC 三个选项均属于洗钱罪的上游犯罪,但本题要求\n选择的是不属于洗钱罪的上游犯罪。文运法硕建议\n各位考生在做题的时候一定要注意审题,有考生看到\n\"洗钱罪的上游犯罪\n\" ,再看到选项A 的\n\" 毒品犯罪\n\" ,\n立刻就将A作为答案了,而根本不看\n\"不属于\n\" 中的\n\"不\n\" 字,也不再看BCD三个选项了。","k":"分则·破坏市场经济秩序罪"},{"id":"2020-16","y":2020,"t":"单","s":"甲在其制作的玉米馒头中违规超量添加色 素,销售金额累计达22万元。此种色素为合法食品 添加剂,超量使用不足以造成严重食物中毒事故或者 其他严重食源性疾病。甲的行为应认定为()。","o":["不构成犯罪","生产、销售伪劣产品罪","生产、销售有毒、有害食品罪","生产、销售不符合安全标准的食品罪"],"a":"B","e":"生产、销售伪劣产品罪是指生产者、销\n售者在产品中掺杂、掺假,以假充真,以次充好或者以\n不合格产品冒充合格产品,销售金额达5万元以上的\n行为。甲生产的慢头违规超量添加色素,属于不合格\n产品,其销售金额达22万,符合生产、销售伪劣产品\n罪的构成要件,B选项正确,A选项错误。生产、销售\n有毒有害食品罪,是指违反国家卫生管理法规,在生\n产销售的食品中掺入有毒、有害的非食品原料的,或\n者销售明知掺有有毒、有害的非食品原料的食品的行\n为。本题中甲添加的色素为合法食品添加剂,不是有\n毒有害的非食品原料,C选项错误。生产、销售不符\n合安全标准的食品罪是危险犯,足以造成严重食物中\n毒事故或者其他严重食源性疾病,才构成本罪。本题\n明确\n\" 超量使用不足以造成严重食物中毒事故或者其\n他严重食源性疾病\n\" ,因此不构成生产销售不符合安\n全标准的食品罪,D选项错误。","k":"分则·破坏市场经济秩序罪"},{"id":"2021-12","y":2021,"t":"单","s":"甲在互联网上有偿提供制毒工艺视频。乙从 甲处购买了该视频,并根据视频中的工艺试制少量毒 () 品,后被抓获。甲的行为应认定为(","o":["非法利用信息网络罪","传授犯罪方法罪","非法经营罪","制造毒品罪(帮助犯)"],"a":"B","e":"传授犯罪方法罪是指用各种方式把犯\n罪方法故意传授给他人的行为。本题中,甲在互联网\n上有偿提供制毒工艺视频,即用网络传播的方式把犯\n罪方法故意传授给他人,成立传授犯罪方法罪,B项\n正确。","k":"分则·破坏市场经济秩序罪"},{"id":"2021-15","y":2021,"t":"单","s":"甲到某银行办理业务,发现李某使用ATM机 后忘记拔卡,遂用李某的银行卡连续取现共计1.2万 元。李某收到取款提示短信后返回,要求正在取款的 甲交还钱款,甲转身逃跑,并将尾随追赶的李某打成 轻微伤。甲的行为应认定为()","o":["盗窃罪","信用卡诈骗罪","抢劫罪","侵占罪"],"a":"C","e":"甲冒用李某的银行卡在ATM机上取\n钱,成立信用卡诈骗罪。信用卡诈骗罪与诈骗罪是法\n条竞合关系。甲在取款后想逃跑时为窝藏赃物、抗拒\n抓捕而将李某打伤,构成转化型抢劫罪,C项正确。","k":"分则·破坏市场经济秩序罪"},{"id":"2021-17","y":2021,"t":"单","s":"甲开设网站,以体育彩票开奖号码作为参考 号码,接受该网站注册会员投注并开奖,从中抽头渔 利6万元。甲的行为应认定为()","o":["开设赌场罪","诈骗罪","非法经营罪","赌博罪"],"a":"A","e":"开设赌场罪是指为赌博提供场所,设定\n赌博方式,提供赌具、筹码、资金等组织赌博的行为。\n根据司法解释的规定,建立赌博网站并接受投注的,\n属于\n\" 开设赌场\n\" 。本题中,甲建立赌博网站,接受该\n网站注册会员投注,构成开设赌场罪,A项正确。","k":"分则·破坏市场经济秩序罪"},{"id":"2021-20","y":2021,"t":"单","s":"下列行为如满足数额条件,应认定为伪造货 币罪的是()","o":["将英榜揭层一分为二","用黄金铸造流通的纪念金币","临摹欧元收藏","铸造珍稀古钱币"],"a":"B","e":"伪造货币罪是指违反国家货币管理法\n规,仿照货币的形状色彩、图案等特征,使用各种方\n法非法制造出外观上足以乱真的假货币,破坏货币的\n公共信用,破坏金融管理秩序的行为。\"货币\n\" 是指可\n在国内市场流通或者兑换的人民币和境外货币。本\n题中,C项临摹欧元收藏,不足以以假乱真,且没有进\n入流通领域,不成立伪造货币罪,C项错误。D项珍\n稀古钱币不是在国内市场流通或者兑换的人民币,不\n成立伪造货币罪,D项错误。变造货币罪,是指对真\n币采用挖补、剪贴、揭层、拼凑、涂改等方法进行加工\n处理,改变货币的真实形状、图案、面值或张数,改变\n票面面额或者增加票张数量,数额较大的行为。A 项\n成立变造货币罪,而不是伪造货币罪,A项错误。用\n黄金铸造流通的纪念金币,构成伪造货币罪,B项正\n确。本题选B。","k":"分则·破坏市场经济秩序罪"},{"id":"2021-45","y":2021,"t":"多","s":"下列选项中,应认定为生产、销售有毒、有害 食品罪的有( )","o":["丙在屠宰过程中给牛肉注水并出售","丁在勾兑白酒时加入工业酒精并出售","甲使用洗衣粉加工油条并出售","乙使用工业盐腌制鸭蛋并出售"],"a":"BCD","e":"构成生产、销售有毒、有害食品罪要求\n在食品中添加的是有毒、有害物质。A项在牛肉中注\n水,水并不是有毒、有害物质,因此丙不构成生产、销\n售有毒、有害食品罪,A项错误。工业酒精、洗衣粉、\n工业盐都属于不能食用的有毒、有害物质,BCD项构\n成生产销售有毒、有害食品罪,BCD项正确。","k":"分则·破坏市场经济秩序罪"},{"id":"2021-9","y":2021,"t":"单","s":"甲伪造身份证骗领了5张信用卡,用其在网上 银行套取IO万元用于个人消费,后将卡销毁C 甲的 行为应认定为( )","o":["伪造身份证件罪","妨害信用卡管理罪","盗窃罪","信用卡诈骗罪"],"a":"D","e":"甲用伪造的身份证骗领了5张信用卡,\n成立伪造身份证件罪和妨害信用卡管理罪,后将在网\n上银行套取的10万元用千个人消费,成立信用卡诈\n骗罪。三罪是牵连犯,最终的目的是信用卡诈骗,以\n重罪信用卡诈骗罪定罪处罚,D项正确。","k":"分则·破坏市场经济秩序罪"},{"id":"2022-7","y":2022,"t":"单","s":"甲从拾到的手机中看到了失主的身份证信息和银行卡信息,遂将失主的微信与该银 行卡绑定,并将卡上资金转到自己的微信钱包,且数额较大。甲的行为应认定为","o":["盗窃罪","侵占罪","信用卡诈骗罪","侵犯公民个人信息罪"],"a":"C","e":"信用卡诈骗罪是指以非法占有为目的,\n使用法定方法进行信用卡诈骗活动,数额较大的行\n为。该罪的行为方式有:(1)使用伪造的信用卡,或\n者使用以虚假的身份证明骗领的信用卡的;(2)使用\n作废的信用卡的;(3)冒用他人信用卡的;(4)恶意\n透支的。其中冒用他人信用卡包括以下情形:(1)拾\n得他人信用卡并使用的;(2)骗取他人信用卡并使用\n的;(3)窃取、收买、骗取或者以其他非法方法获取他\n人信用卡信息资料,并通过互联网、通讯终端等使用\n的;(4)其他冒用他人信用卡的情形。甲的行为属于\n以其他非法方法获取他人信用卡信息资料,并通过互\n联网、通讯终端等使用信用卡的\"冒用\"行为,构成信\n用卡诈骗罪。C选项正确。盗窃罪的客体为公私财\n产所有权,但本案中申的行为不仅侵犯了信用卡失主\n的财产所有权,还侵犯了国家的金融管理秩序。A选\n项错误。侵占罪是指将代为保管的他人财物非法占\n为己有,数额较大,拒不退还;或者将他人的遗忘物或\n者理藏物非法占为己有,数额较大,拒不交出的行为。\n甲拾到的手机属于遗失物,不构成侵占罪。B选项错\n误。侵犯公民个人信息罪是指违反国家有关规定,向\n他人出售或者提供公民个人信息,情节严重的行为;\n窃取或者以其他方法非法获取公民个人信息的,也属\n于侵犯公民个人信息的行为。申在拾到的手机中看\n到失主的身份信息和银行卡信息,并非非法获取公民\n个人信息的行为,不构成侵犯公民个人信息罪,D选\n项错误。","k":"分则·破坏市场经济秩序罪"},{"id":"2024-17","y":2024,"t":"单","s":"甲通过即时通信软件销售某品牌保健品,为吸引客户浏览在客户群组发送淫秽视频链接,并因此提高了销量,情节严重,获利巨大,甲的行为如何认定()","o":["非法经营罪","虚假广告罪","传播淫秽物品牟利罪","传播淫秽物品罪"],"a":"D","e":"","k":"分则·破坏市场经济秩序罪"},{"id":"2024-3","y":2024,"t":"单","s":"甲长期在线直播手绘百元人民币,接受观众打赏,获利巨大,甲的行为应认定为 ()","o":["不构成犯罪","非法经营罪","伪造货币罪","非法利用信息网络罪"],"a":"A","e":"","k":"分则·破坏市场经济秩序罪"},{"id":"2024-4","y":2024,"t":"单","s":"甲指使多人利用医保骗保购买药品予以收购,转售牟利,数额特别巨大。甲的行为应 认定为()","o":["诈骗罪","保险诈骗罪","合同诈骗罪","掩饰、隐瞒犯罪所得罪"],"a":"A","e":"","k":"分则·破坏市场经济秩序罪"},{"id":"2024-43","y":2024,"t":"多","s":"使用诈骗方法非法集资,可以认定为以非法占有为目的的情形有()","o":["携带集资款逃匿的","将集资款用于违法犯罪的","因为破产无法返还资金的","拒不交代资金去向逃避返还资金的"],"a":"ABD","e":"","k":"分则·破坏市场经济秩序罪"},{"id":"2025-10","y":2025,"t":"单","s":"甲购得某公司开发的热门应用软件,破解了其内置的防复制程序,大量复制并以自己 注册的品牌销售,获利巨大。甲的行为应认定为( )","o":["非法经营罪","假冒注册商标罪","侵犯著作权罪","侵犯商业秘密罪"],"a":"C","e":"甲破解软件防复制程序并大量复制销售,属于未经许可复制发行计算机软件,侵\n犯了著作权人的复制权,构成侵犯著作权罪,C 项正确。甲使用自己的注册商标进行销售,未\n假冒他人注册商标,不构成假冒注册商标罪,B 项错误。软件是公开销售的产品,不涉及商业\n秘密,甲未通过非法手段获取商业秘密,不构成侵犯商业秘密罪,D 项错误。非法经营罪是指\n\n违反国家规定,非法经营,扰乱市场秩序,情节严重的行为。甲的行为不构成非法经营罪,A\n项错误。本题选C。","k":"分则·破坏市场经济秩序罪"},{"id":"2025-13","y":2025,"t":"单","s":"甲将含有西药成分的药品冒充纯中药制剂销售牟利,对患者健康造成严重危害。甲的 行为应认定为( )","o":["销售劣药罪","销售假药罪","妨害药品管理罪","销售伪劣产品罪"],"a":"B","e":"销售假药罪中的假药包括\"以他种药品冒充此种药品\"的情形。甲将含有西药成\n分的药品冒充纯中药制剂销售,属于以他种药品(西药)冒充此种药品(中药),且对患者健\n康造成严重危害,构成销售假药罪,B 项正确。劣药主要指药品成分含量不符合国家标准、超\n过有效期等,而甲的行为是冒充药品种类,并非成分含量问题,不构成销售劣药罪,A 项错误。\n妨害药品管理罪,是指违反药品管理法规,实施足以严重危害人体健康的法定行为,甲的行为\n不属于妨害药品管理的法定行为,C 项错误。销售伪劣产品罪是一般罪名,销售假药罪是特殊\n罪名,本题销售假药给患者造成严重危害,销售假药罪的处罚比销售伪劣产品重,因此甲应定\n销售假药罪,而不是销售伪劣产品罪,D 项错误。本题选B。","k":"分则·破坏市场经济秩序罪"},{"id":"2025-18","y":2025,"t":"单","s":"甲的行为应认定为( )","o":["保险诈骗罪","故意杀人罪","故意杀人罪和保险诈骗罪","故意杀人罪和故意毁坏尸体罪"],"a":"B","e":"根据《刑法》的规定,投保人、受益人故意造成被保险人死亡、伤残或者疾病,\n骗取保险金,同时构成其他犯罪的,依照数罪并罚的规定处罚。本题中,甲为了骗取保险金,\n谋杀了孙某并焚尸,构成故意杀人罪。但其还未开始申领保险金即被抓获,即尚未着手实施骗\n取保险金的行为,故甲只构成故意杀人罪,不构成保险诈骗罪,B 项正确,AC 项错误。故意杀\n人后焚尸的行为,不另外处罚,不另外成立故意毁坏尸体罪,D 项错误。本题选B。","k":"分则·破坏市场经济秩序罪"},{"id":"2025-45","y":2025,"t":"多","s":"在内幕信息敏感期内,下列人员从事与该内幕信息有关的期货交易,获利巨大,应当 认定为内幕交易罪的有( )","o":["利用骗取手段获取内幕信息的甲","利用窃听手段获取内幕信息的乙","利用刺探手段获取内幕信息的丙","利用私下交易手段获取内幕信息的丁"],"a":"ABCD","e":"根据司法解释的规定,具有下列行为的人员应当认定为刑法第180 条第1 款规定\n的\"非法获取证券、期货交易内幕信息的人员\":(一)利用窃取、骗取、套取、窃听、利诱、\n刺探或者私下交易等手段获取内幕信息的;(二)内幕信息知情人员的近亲属或者其他与内幕\n信息知情人员关系密切的人员,在内幕信息敏感期内,从事或者明示、暗示他人从事,或者泄\n露内幕信息导致他人从事与该内幕信息有关的证券、期货交易,相关交易行为明显异常,且无\n正当理由或者正当信息来源的;(三)在内幕信息敏感期内,与内幕信息知情人员联络、接触,\n从事或者明示、暗示他人从事,或者泄露内幕信息导致他人从事与该内幕信息有关的证券、期\n货交易,相关交易行为明显异常,且无正当理由或者正当信息来源的。因此ABCD 项全部正确,\n本题选ABCD。","k":"分则·破坏市场经济秩序罪"},{"id":"2026-13","y":2026,"t":"单","s":"某上市公司部门经理甲在商务谈判中提高公司商品售价,与他人签订买卖合 同,甲未向公司如实报告,而是利用差价套取多余公司商品后私自售卖,获利巨 大。甲的行为应认定为","o":["合同诈骗罪","职务侵占罪","非法经营同类营业罪","背信损害上市公司利益罪"],"a":"D","e":"上市公司高管利用关联交易、抬高价格套取公司利益,损害上市公司利益,\n成立背信损害上市公司利益罪;\nA 无虚构事实骗取对方财物;B 职务侵占是直接侵占本单位财物;C 非法经营同类\n营业仅限国有公司董事经理。","k":"分则·破坏市场经济秩序罪"},{"id":"2026-17","y":2026,"t":"单","s":"某工程项目工作人员甲,利用为商户办理装修手续的便利,以延迟审批为威 胁手段,要求多家商户从其处购买高于市场价格的装修材料,数额共计数十万元。 甲的行为应认定为","o":["不构成犯罪","强迫交易罪","敲诈勒索罪","非国家工作人员受贿罪"],"a":"B","e":"以不办理审批相要挟,强迫商户高价购买自己装修材料,违背对方交易意\n愿,数额较大,构成强迫交易罪;\nC 敲诈勒索是单纯索取财物,无交易行为;D 非国家工作人员受贿是收受他人财\n物,本案是强行售卖。","k":"分则·破坏市场经济秩序罪"},{"id":"2026-42","y":2026,"t":"多","s":"下列犯罪中,属于我国刑法明文规定的目的犯的有","o":["盗窃罪","高利转贷罪","侵犯著作权罪","破坏经营罪"],"a":"BCD","e":"目的犯:高利转贷(牟利)、侵犯著作权(营利)、破坏生产经营(泄愤\n报复/其他个人目的);盗窃罪无明文规定特定目的。","k":"分则·破坏市场经济秩序罪"},{"id":"2026-44","y":2026,"t":"多","s":"甲搭建“小韭菜”网贷平台,以直播推广等方式向不特定社会公众宣传理财 产品,并承诺给付10%年化收益的高额回报,后因经营失败而案发。经查,该案 涉案资金5 亿余元,造成损失1 亿余元。甲在被监视居住期间,将违法所得1000 万元转给其他人保管。甲的行为应认定为","o":["洗钱罪","集资诈骗罪","非法吸收公众存款罪","掩饰、隐瞒犯罪所得罪"],"a":"AC","e":"承诺固定高息向不特定公众吸储,构成非法吸收公众存款;监视居住转移\n赃款隐匿,构成掩饰、隐瞒犯罪所得;无非法占有目的排除集资诈骗;未跨境清\n洗资金排除洗钱罪。","k":"分则·破坏市场经济秩序罪"},{"id":"2026-6","y":2026,"t":"单","s":"行为人实施下列行为,情节严重,应认定为非法经营罪的是","o":["甲非法出售无线电干扰器","乙非法出售他人盗窃的文物","丙非法出售他人的行踪轨迹","丁非法出售盗版的音像制品"],"a":"A","e":"非法出售无线电干扰器,属于非法经营罪中非法生产、销售专用间谍器材、\n无线电干扰器材;\nB 出售盗窃文物定掩饰隐瞒犯罪所得;C 出售行踪轨迹定侵犯公民个人信息;D\n盗版音像定侵犯著作权罪。","k":"分则·破坏市场经济秩序罪"}]},{"sub":"刑法","name":"分则·侵犯人身权利罪","w":2.1,"L":37,"qs":[{"id":"2006-16","y":2006,"t":"单","s":"按照刑法规定,以下情形中,应当以故意杀人罪定罪处罚的是(   )","o":["拐卖妇女造成被害人死亡的","暴力干涉婚姻自由致使被害人死亡的","抢劫致被害人死亡的","刑讯逼供致被害人死亡的"],"a":"D","e":"第257 条 以暴力干涉他人婚姻自由的,处二年以下有期徒刑或者拘役。 犯前款罪,致使被害人\n死亡的,处二年以上七年以下有期徒刑。拐卖妇女,造成其重伤或死亡的,从重处罚;若故意伤害、杀人,则数罪\n并罚。","k":"分则·侵犯人身权利罪"},{"id":"2007-22","y":2007,"t":"多","s":"下列情形中,应以强奸罪定罪处罚的有 (       )。","o":["利用迷信手段欺骗妇女与其发生性关系的","在拐卖妇女过程中,奸淫被拐卖妇女的","利用妇女极度疲劳昏睡之机,冒充其丈夫与其发生性关系的","谎称自己有能力为妇女办理出国手续,要求与妇女发生性关系,妇女为达到出国目的,与其发生性关系的"],"a":"AC","e":"强奸罪 \n]强奸罪是指违背妇女意志,使用暴力 j 胁迫或者其他手段,强行与妇女发生性交的行 \n为。A、C 项两种手段在本质上都是违背妇女意志的,构成强奸罪。D 项中,男女双方互相 \n利用,不以强奸罪论处。奸淫被拐卖妇女属于拐卖妇女罪的加重情节,不再以强奸罪论处, \n故 B 项错误。","k":"分则·侵犯人身权利罪"},{"id":"2007-5","y":2007,"t":"单","s":"下列情形中,属于故意杀人罪实行行为的是 (   ) 。","o":["甲为谋杀刘某而持刀潜入刘某家中隐藏、守候","乙为谋杀孙某购买一支手枪,以便杀孙某时使用","丙为谋杀赵某而在赵某饮用的茶水中投放毒药","丁为谋杀李某而花 10 万元雇佣杀手"],"a":"C","e":"实行行为 \n] 实行行为是指实施刑法分则规定的某种具体犯罪构成要件客观方面的行为,向饮用 \n的茶水中投放毒药属于故意杀人罪的实行行为,故答案为 C。而潜入刘某家中守候、购买手 \n枪等属于为实行犯罪制造条件、准备工具的行为,是预备行为。","k":"分则·侵犯人身权利罪"},{"id":"2009-20","y":2009,"t":"单","s":"下列有关寻衅滋事罪的表述中,正确的是(   )。","o":["寻衅滋事罪是指肆意挑衅,无事生非,起哄闹事的行为","因寻衅滋事而致人轻伤的,以寻衅滋事罪定罪处罚","因寻衅滋事而致人重伤的,以寻衅滋事罪与故意伤害罪并罚","因寻衅滋事而致人死亡的,以寻衅滋事罪与故意杀人罪并罚"],"a":"B","e":"本题考查寻衅滋事罪。寻衅滋事是指肆意挑衅,无事生非,起哄闹事,进行扰乱破坏,情节恶劣、\n严重的行为。A 选项错误。因寻衅滋事而致人轻伤的,仍按寻衅滋事最定罪论处;因寻衅滋事最而致人重伤、死亡\n的,则应按故意伤害罪或故意杀人罪论处。B 选项正确C 选项和D 选项错误。因此本题答案为B \n二、多项选择题","k":"分则·侵犯人身权利罪"},{"id":"2011-11","y":2011,"t":"单","s":"甲因自己不能生育,花1万元从人贩子手中 收买一男婴。3个月后,甲嫌抚养孩子太辛苦,遂以2 万元转卖给乙,并声称是自己的亲生儿子。甲的行为 构成()。","o":["遗弃罪","拐骗儿童罪","诈骗罪","拐卖儿童罪"],"a":"D","e":"在理解收买被拐卖的妇女、儿市罪时.\n考生应特别注意把握儿个知识点:(1)转化犯情形,\n也就是本题所涉及的问题。行为人不以出卖为目的\n收买了被拐卖的妇女、儿童之后,又将其出卖的,应认\n定为拐卖妇女、儿童罪。所以本题答案为D。(2)数\n罪并罚的情形。收买被拐卖的妇女、儿童后,有强奸、\n非法剥夺、限制人身自由或者有伤害、侮辱等犯罪行\n为的,应以收买被拐卖的妇女、儿童罪与相应的犯罪\n数罪并罚。","k":"分则·侵犯人身权利罪"},{"id":"2012-14","y":2012,"t":"单","s":"下列情形中,属于结果加重犯的是( )。","o":["聚众斗殴致他人死亡","非法行医造成就诊人死亡","强制狠亵妇女致其因羞愤自杀死亡","遗弃没有独立生活能力的人致其死亡"],"a":"B","e":"此题考查结果加重犯和情节加重犯的\n区别。两者切勿混淆。强制狠亵、侮辱罪并没有结果\n加重犯,只有情节加重犯,即聚众或者公共场所强制\n狠亵他人或者侮辱妇女,或者有其他恶劣情节。遗弃\n罪需要达到一定后果,遗弃致人死亡的,仅仅构成遗\n弃罪。是否构成结果加重犯,首先要看是否只有一个\n法定幅度,如果只有一个法定幅度,则不可能是结果\n加重犯,如遗弃罪;其次要看是结果加重还是情节加\n重。所以,A选项为转化犯,C选项为情节加重,D选\n项仅仅构成遗弃罪,故选择B。\n常见的故意犯罪结果加重犯:\n(1)抢劫致人重伤、死亡的;\n( 2)强奸致人重伤的、死亡的;\n(3)非法行医致人重伤、死亡的;\n( 4 )非法拘禁致人重伤、死亡,虐待致人重伤、死\n亡的;\n(5)暴力干涉婚姻自由致人死亡的;\n(6)绑架致人死亡的;\n(7)拐卖妇女、儿童造成被拐卖的妇女、儿童或\n者其亲属重伤、死亡或者其他严重后果的;\n(8)放火、爆炸、投毒、破坏交通工具、破坏交通\n设施破坏电力设备等造成人身伤亡或者重大财产损\n失的;\n(9)牛产销售假药严重危害人体健康的;\n(10)生产销售劣药后果特别严重的;\n(I 1)生产销售不符合卫生标准的食品对人体\n健康造成严重危害的;\n(12)生产销售有毒有害食品造成严重食物中\n毒事故或者其他严重食源性疾患的;\n(13)劫持航空器致人重伤、死亡或者使航空器\n遭受严重破
