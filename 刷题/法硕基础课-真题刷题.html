坏的;\n(14 )劫持船只、汽车造成严重后果的;\n(15)暴力危及飞行安全造成严重后果的;\n(16)煽动群众暴力抗拒国家法律、法规实施造\n成严重后果的;\n(17)组织运送他人偷越国(边)境造成被组织\n人重伤、死亡的;\n(18)挪用公款数额巨大客观上不能退还的;\n(19)徇私舞弊不征、少征税款造成特别重大损\n失的。\n故意犯罪的行为人对加重的结果可能是故意的\n也可能是过失的。\n《刑法》第261条规定,对于年老、年幼、患病或者\n其他没有独立生活能力的人,负有扶养义务而拒绝扶\n养,情节恶劣的,处5年以下有期徒刑、拘役或者管\n制。该条文未规定加重情节,致人死亡也不属于结果\n加重犯。故D选项错误。","k":"分则·侵犯人身权利罪"},{"id":"2012-19","y":2012,"t":"单","s":"甲、乙、丙与周某打麻将赌钱,结果三人共输 给周某30万元。事后,三人怀疑周某打麻将时做了 手脚,遂将周某劫持到一空房内,逼其退还赌资。周 某让妻子将30万元退还给了三人。甲、乙、丙三人的 行为构成( )。","o":["抢劫罪","敲诈勒索罪","绑架罪","非法拘禁罪"],"a":"D","e":"根据司法解释规定,因为讨债而对他人\n实施非法拘禁的行为以非法拘禁罪论处,此处的债务\n包括合法债务和非法债务,自然包括赌债。故选D。","k":"分则·侵犯人身权利罪"},{"id":"2012-5","y":2012,"t":"单","s":"甲(15周岁)盗窃他人钱包被陈某发现后,为 窝藏赃物而当场使用暴力,失手将陈某打死。甲的行 为构成( )。","o":["抢劫罪","盗窃罪","故意伤害罪","过失致人死亡罪"],"a":"C","e":"《刑法》第269条规定:\"犯盗窃、诈骗、\n抢夺罪,为窝藏赃物、抗拒抓捕或者毁灭罪证而当场\n使用暴力或者以暴力相威胁的,依照本法第263条的\n规定定罪处罚。\"本条规定的是转化型的抢劫罪。根\n据本条规定,盗窃、诈骗、抢夺罪转化为抢劫罪需要以\n下三个条件:(1)行为人犯有上述三种行为之一。\n(2)行为人实行后续行为的目的是为了窝藏赃物、抗\n拒抓捕或者毁灭罪证。(3)行为人当场实行暴力或\n者以暴力相威胁的行为。本题行为人甲当时未满16\n周岁,其行为并不能构成盗窃罪,因此也不会构成其\n转化犯。根据《刑法》第17条规定,已满14周岁未满\n16周岁的人需要对故意杀人、故意伤害致人重伤或者\n死亡、强奸、抢劫、贩卖毒品、放火、爆炸、投放危险物\n质罪的,应当负刑事责任。此题甲虽然不构成盗窃罪,\n但其符合故意伤害致人死亡,应当按照故意伤害罪论\n处。故本题答案为C。另外,对于转化型抢劫,不适用\n14~ 16周岁的主体,应当按照其具体行为处理。","k":"分则·侵犯人身权利罪"},{"id":"2012-9","y":2012,"t":"单","s":"警察甲因公民吴某举报自己受贿而怀恨在心, 遂用他人手机向某军官发了一条短信,捏造吴某与其 妻子同居。该军官信任自己的妻子,未予理睬。甲的 行为( )。","o":["构成诽谤罪","构成诬告陷害罪","构成报复陷害罪","不构成犯罪"],"a":"D","e":"l\n关于诽谤罪,根据《刑法》第246条的\n规定,捏造事实诽谤他人,情节严重的,是诽谤罪。所\n以诽谤罪的构成需要捏造事实并加以传播。本题不\n符合要求。对于诬告陷害罪,根据《刑法》第243条的\n规定,捏造事实诬告陷害他人,意图使他人受刑事追\n究,情节严重的,构成诬告陷害罪。据此,诬告陷害罪\n需要向相关的机关举报或者采取足以引起其注意的\n行为才构成该罪。本题中甲并没有向相关机关告发,\n也没有引起其注意。《刑法》第254条规定国家机关\n工作人员滥用职权、假公济私,对控告人、申诉人、批\n评人、举报人实行报复陷害的,是报复陷害罪。本罪\n要求国家机关工作人员利用职权便利完成,本案中甲\n并未利用这一身份的便利和职权对对方进行报复陷\n害行为。故甲不构成犯罪,选D。","k":"分则·侵犯人身权利罪"},{"id":"2013-4","y":2013,"t":"单","s":"甲(15周岁)拐骗一名男孩,准备将其出卖,后 因小孩哭闹不止,甲对其进行殴打,造成重伤。甲的 行为构成( )。","o":["绑架罪","拐卖儿童罪","故意伤害罪","非法拘禁罪"],"a":"C","e":"根据《刑法》的规定,对千已满14周岁\n不满16周岁的人,犯故意杀人、故意伤害致人重伤或\n者死亡、强奸、抢劫、贩卖毒品、放火、爆炸或者投放危\n险物质罪的,应当负刑事责任。而本题中的拐卖儿童\n行为并不属于此8类行为,因此不构成拐卖儿童罪。\n甲的殴打行为致男孩重伤,符合前述故意伤害致人重\n伤的要件,因此构成故意伤害罪。","k":"分则·侵犯人身权利罪"},{"id":"2013-44","y":2013,"t":"多","s":"下列行为中,应以故意杀人罪定罪处罚的有 )。","o":["在聚众斗殴过程中致人死亡","在脱逃过程中使用暴力致人死亡","在刑讯逼供时致犯罪嫌疑人死亡","在行政管理活动中滥用职权致他人死亡"],"a":"ABC","e":"聚众斗殴致人重伤、死亡的,应分别定\n为故意伤害罪、故意杀人罪;脱逃过程中,行为人使用\n暴力致人重伤、死亡的,是牵连犯,应当以较重的故意\n伤害罪、故意杀人罪定罪处罚;行为人在实施刑讯逼\n供行为时造成被害人伤残、死亡的,其行为性质发生\n转化,不再定刑讯逼供罪,而是以故意伤害罪、故意杀\n人罪定罪处罚。而滥用职权致他人死亡本身就是滥\n用职权罪的构成要件之一,并不发生转化,仍以滥用\n职权罪定罪处罚。故答案为ABC。","k":"分则·侵犯人身权利罪"},{"id":"2014-15","y":2014,"t":"单","s":"下列行为中,应以绑架罪定罪处罚的是()。","o":["以出卖为目的偷盗他人幼儿","以索取赌债为目的偷盗他人婴儿","以索取工程款为目的偷盗他人幼儿","以索取虚构的欠款为目的偷盗他人婴儿"],"a":"D","e":"所谓绑架罪,是指以勒索财物为目的绑\n架他人或者偷盗婴幼儿,或绑架他人作为人质的行\n为,因此绑架犯不仅是行为犯,还是目的犯。A选项\n中以出卖为目的偷盗他人婴儿的行为属于拐卖儿童\n罪,非绑架罪。BC选项中为索取赌债或索取工程款\n而偷盗婴幼儿,由于不具有勒索财物和将他人作为人\n质的目的,不构成绑架,属千拐骗儿童罪。只有D选\n项中由于其所要索取的债务是虚构的,因此具有勒索\n的主观故意,应定为绑架罪。","k":"分则·侵犯人身权利罪"},{"id":"2014-6","y":2014,"t":"单","s":"国家机关工作人员甲,因不满父亲再婚,与之 断绝往来。其父晚年孤身一人、身患重病时,甲拒绝 照顾,情节恶劣,构成遗弃罪。在本案中,甲违反了 )。","o":["法律行为引起的义务 2014年全国法律硕士(非法学)联考真题","职务要求的义务","先前行为引起的义务","法律明文规定的义务"],"a":"D","e":"本题考查的是不作为犯罪中所违反的\n义务的种类。不作为犯罪是消极的身体动作,即不为\n某种行为,这种情况一般是不会危害社会的。因此,\n要求不作为的行为人必须负有某种特定的义务,包括\n法律上明文规定的义务,行为人职务上、业务上规定\n的义务,行为人法律地位或法律行为所产生的义务,\n行为人先前行为所产生的义务。本题中甲拒绝照料\n病重的父亲,违反了法律规定的直系亲属之间在特定\n情况下的抚养和赡养义务,因此属于法律上明文规定\n的义务,选D。","k":"分则·侵犯人身权利罪"},{"id":"2015-41","y":2015,"t":"多","s":"下列犯罪中,属于我国《刑法》所规定的告诉 )。 才处理的有(","o":["重婚罪","侮辱罪","暴力干涉婚姻自由罪","遗弃罪"],"a":"BC","e":"根据《刑法》第246条、第257条的规\n定,侮辱罪和暴力干涉婚姻自由罪属千我国《刑法》所\n规定的告诉才处理的犯罪,BC选项正确。AD 是公诉\n犯罪,不是自诉犯罪。本题属识记知识点,请考生熟\n知。注意总结告诉才处理的犯罪,《刑法》规定有侮辱\n罪诽谤罪暴力干涉婚姻自由罪、虐待罪、侵占罪。\n同时注意掌握打破告诉才处理界限的条件,侮辱罪与\n诽谤罪告诉的才处理,但是严重危害社会秩序和国家\n利益的除外;暴力干涉婚姻自由罪告诉的才处理,但\n致使被害人死亡的除外;虐待罪告诉的才处理,但是\n以下两种情况除外:(1)致使被害人重伤、死亡的,\n(2)被害人没有能力告诉,或受到强制、威吓无法告\n诉的;侵占罪是绝对的告诉才处理。","k":"分则·侵犯人身权利罪"},{"id":"2016-7","y":2016,"t":"单","s":"甲、乙二人驾驶摩托车夺取吴某挎包,因车速 过快将吴某带倒,致其重伤。甲、乙的行为应认定为 )。","o":["抢夺罪","故意伤害罪 2016年全国法律硕士(非法学)联考真题","抢劫罪","抢夺罪和过失致人重伤罪"],"a":"C","e":"《最高人民法院关于审理抢劫、抢夺刑\n事案件适用法律若干问题的意见》中规定:行为人明\n知其驾驶车辆强行夺取他人财物的手段会造成他人\n伤亡的后果,仍然强行夺取并放任造成财物待有人轻\n伤以上后果的,以抢劫罪定罪处罚。\n本题中,甲乙二人驾驶摩托车高速行驶,明知其\n强行夺取吴某捞包的行为会造成吴某伤亡的结果,仍\n然强行夺取,并且造成吴某重伤,因此应该以抢劫罪\n定罪处罚,C选项正确。","k":"分则·侵犯人身权利罪"},{"id":"2017-15","y":2017,"t":"单","s":"甲为了报复素有矛盾的刘某,捏造刘某贪污 的材料向检察机关举报,导致刘某被逮捕。甲的行为 构成()。","o":["诬告陷害罪","诽谤罪","报复陷害罪","伪证罪"],"a":"A","e":"诬告陷害罪是指捏造事实诬告他人,意\n图使他人受刑事追究,情节严重的行为。本题中甲捏\n造刘某贪污的材料,向检察机关举报,意图使刘某受\n刑事追究,结果也导致刘某被逮捕,甲的行为成立诬\n告陷害罪,A项正确。诽谤罪是指捏造并公开散布某\n种虚构的事实,损害他人人格与名誉,情节严重的行\n为。诽谤罪捏造的是损害他人人格和名誉的事实,诬\n告陷害罪捏造的是他人的犯罪事实。本题中甲捏造\n的是刘某犯贪污罪的事实,而不是损害刘某人格和名\n誉的事实,所以甲不成立诽谤罪,B项错误。报复陷\n害罪是指国家机关工作人员滥用职权、假公济私,对\n控告人、申诉人、批评人、举报人实行报复陷害的行\n为。本题中甲不是国家机关工作人员,刘某也不是控\n告人、申诉人、举报人,甲不成立报复陷害罪,C项错\n误。伪证罪是指刑事诉讼中,证人、鉴定人、记录人、\n翻译人对与案件有重要关系的情节,故意作虚假证\n明鉴定记录翻译,意图陷害他人或者隐瞒罪证的\n行为。甲不是证人、鉴定人、记录人、翻译人,不成立\n伪证罪,D项错误。","k":"分则·侵犯人身权利罪"},{"id":"2017-16","y":2017,"t":"单","s":"下列选项中,应认定为故意伤害罪的是(","o":["抢劫未果却造成被害人轻伤的","强奸过程中造成被害人重伤的","刑讯逼供时造成犯罪嫌疑人伤残的","拐卖儿童过程中造成被拐卖儿童重伤的"],"a":"C","e":"抢劫罪是指以非法占有为目的,当场使\n用暴力、胁迫或者其他方法,强行劫取公私财物的行\n为。暴力是抢劫的手段,造成被害人轻伤是抢劫既遂\n的标准之一,A项只成立抢劫罪,不成立故意伤害罪,\nA项错误。根据《刑法》第236条的规定,在强奸过程\n中致使被害人重伤的,升格法定刑处罚,但只定强奸\n罪一罪,而不成立故意伤害罪,B项错误。根据《刑\n法》第247条的规定,司法工作人员对犯罪嫌疑人、被\n告人实行刑讯逼供致人伤残的,按照故意伤害罪从重\n\n处罚,C项正确。根据《刑法》第240 条的规定,拐卖\n过程中造成被拐卖的儿童重伤的,升格法定刑处罚,\n但只定拐卖儿童罪,而不是拐卖儿童罪与故意伤害罪\n数罪并罚,D项错误。","k":"分则·侵犯人身权利罪"},{"id":"2017-44","y":2017,"t":"多","s":"下列选项中,构成非法拘禁罪的有()。","o":["甲(警察)因私怨与刘某发生口角,用手将 刘某在警车内","乙为索取合法债务,非法扣押债务人涂某的 妻子","丙为了索要劳务报酬,偷走龙某出生不久的 儿子","丁为了追索高利贷,扣留债务人钱某"],"a":"ABD","e":"l\n非法拘禁罪是指非法拘禁他人或者以\n其他方法非法剥夺他人人身自由的行为。根据《关于\n渎职侵权犯罪案件立案标准的规定》,国家机关工作\n人员利用职权非法剥夺他人人身自由,并使用械具或\n者捆绑等恶劣手段的,成立非法拘禁罪。A项中,刘\n某并不是犯罪嫌疑人,只是因为与甲口角,就被甲用\n手铸铸在警车内,甲是非法剥夺他人人身自由,成立\n非法拘禁罪,A项正确。根据《刑法》第238条的规\n定,为索取债务非法扣押、拘禁他人的,成立非法拘禁\n罪,B项中的乙是为了索取合法债务,D项中的丁是\n为了索取非法债务,都是为了索取债务非法扣押、拘\n禁他人,均成立非法拘禁罪,BD项正确。C项中丙没\n有勒索龙某财物的目的,丙想索要的是正当的劳务报\n酬,所以其盗走龙某儿子的行为不成立绑架罪。甲采\n取偷盗的方式使不满14周岁的未成年人脱离自己的\n家庭,成立拐骗儿童罪。因龙某儿子刚出生不久,而\n出生不久的婴儿并非具有身体活动自由的自然人,不\n能成为非法拘禁罪的对象,不成立非法拘禁罪。C项\n错误。","k":"分则·侵犯人身权利罪"},{"id":"2019-17","y":2019,"t":"单","s":"幼儿园教师甲在幼儿园卫生间多次用针刺戳 肖某等10余名幼儿的臀部,虽未造成伤害后果,但情 节十分恶劣。甲的行为应认定为()。","o":["侮辱罪","猥亵儿童罪","虐待被监护、看护人罪","故意伤害罪"],"a":"C","e":"虐待被监护、看护人罪是指对未成年\n人老年人患病的人、残疾人等负有监护、看护职责\n的人虐待被监护、看护的人,情节恶劣的行为。刑法\n修正案(九)新增设的虐待被监护、看护人罪的主体主\n要是对未成年人、老年人、患病的人、残疾人等负有监\n护、看护职责的人,本题中,甲是对幼儿具有看护职责\n的人,其虐待被看护人,情节恶劣,因此,成立虐待被\n监护看护人罪,C项正确。用针刺戳肖某等1 0余名\n幼儿的臀部,未造成伤害后果,不构成故意伤害罪,因\n此选项D错误。狠亵儿童罪,是指以刺激或满足性欲\n为目的,用性交以外的方法对儿童实施的淫秽行为,\n本题显然不符合狠亵儿童罪的构成要件,B不选。侮\n辱罪,是指使用暴力或者以其他方法,公然贬损他人\n人格,破坏他人名誉,情节严重的行为,本题中甲没有\n破坏幼儿名誉的犯罪故意,且甲是在卫生间这个相对\n\n隐蔽的场所虐待幼儿,为此A不选。","k":"分则·侵犯人身权利罪"},{"id":"2019-42","y":2019,"t":"多","s":"甲指使乙重伤江某,乙同意后持钢管将江某 打成轻伤,并在离开现场时,为防止江某报警,勒令江 某交出手机。对此,下列选项中正确的有()。","o":["甲的行为构成故意伤害罪","甲的行为构成抢劫罪","乙的行为构成故意伤害罪","乙的行为构成抢劫罪"],"a":"ACD","e":"本题甲教竣乙实行犯罪,甲属于教竣\n犯,乙是实行犯。首先,甲教竣乙重伤江某,乙将江某\n打成轻伤,未超出甲教竣的范围,因此,甲和乙都构成\n故意伤害罪。其次,乙又在故意伤害的基础上强迫江\n某交出手机,属于实施了抢劫行为,所以,乙又构成抢\n劫罪,故应选CD;乙的抢劫行为超出了甲的意愿,甲\n只对其指示的故意伤害罪负责,不对抢劫罪负责,选\n项B错误,应选A。","k":"分则·侵犯人身权利罪"},{"id":"2020-3","y":2020,"t":"单","s":"甲向乙表示自己愿意出高价“买”妻,乙与其 妻丙商量,让丙假扮为被拐卖妇女,并将丙“出卖”给 甲。三天后,乙协助丙逃离甲家。对此,下列选项中 正确的是()。","o":["甲构成拐卖妇女罪","乙构成拐卖妇女罪","乙构成诈骗罪","丙不构成犯罪"],"a":"C","e":"乙让丙假扮为被拐卖的妇女对甲行骗,\n属于虚构事实骗取财物,乙与丙构成诈骗罪的共同犯\n罪,C选项正确,D选项错误。甲是要\n\" 买妻\n\",并没有\n出卖的目的,A选项错误。丙并非被拐卖的妇女,因\n此乙不构成拐卖妇女罪,B选项错误。","k":"分则·侵犯人身权利罪"},{"id":"2020-45","y":2020,"t":"多","s":"我国刑法保护的公民个人信息包括(","o":["财产状况","行踪轨迹","身份证件号码","通讯联系方式"],"a":"ABCD","e":"侵犯公民个人信息罪中的\n\" 公民个人\n信息\n\"是指以电子或者其他方式记录的能够单独或者\n与其他信息结合识别特定自然人身份或者反映特定\n自然人活动情况的各种信息,包括姓名、身份证件号\n码通信通讯联系方式、住址、账号密码、财产状况、行\n踪轨迹等,ABCD选项均正确。","k":"分则·侵犯人身权利罪"},{"id":"2020-8","y":2020,"t":"单","s":"李某遭甲强奸后,逃离时滑落河中。甲看到李 某在水中挣扎,仍离开现场,李某溺水身亡。甲的行 为应认定为()。","o":["强奸罪","故意杀人罪","强奸罪和故意杀人罪","强奸罪和过失致人死亡罪"],"a":"A","e":"甲强奸李某,构成强奸罪。犯罪行为尤\n其是故意犯罪行为能否成为具有作为义务的前行为,\n目前学界尚有争议。本题中,甲的强奸行为是故意犯\n罪,不是具有作为义务的前行为,且李某滑落河中与\n甲的强奸行为是否能认定存在因果关系,亦有疑问。\n因此甲不构成不作为的故意杀人罪。A选项正确,\nBCD选项错误。","k":"分则·侵犯人身权利罪"},{"id":"2021-10","y":2021,"t":"单","s":"甲为索取赌债,扣押 \"赌友 “ 李某数天。甲的 行为应认定为( )","o":["抢劫罪","敲诈勒索罪","绑架罪","非法拘禁罪"],"a":"D","e":"根据《刑法》的规定,为索取债务非法\n扣押拘禁他人的,构成非法拘禁罪。\"债务\n\" 包括合\n法债务和非法债务。本题中,甲为索取赌债,扣押李\n某,是为了索取债务非法扣押他人,成立非法拘禁罪,\nD项正确。","k":"分则·侵犯人身权利罪"},{"id":"2021-3","y":2021,"t":"单","s":"甲(15周岁)实施的下列行为中,构成犯罪的 是( )","o":["积极参加其堂兄领导的黑社会性质组织","打破汽车玻璃,拿走车内贵重物品","为勒索财物绑架同学,并将其打成重伤","燃放爆竹时不慎引燃邻居住宅,造成重大财 产损失"],"a":"C","e":"《刑法》第17条第2款规定:\"已满十\n四周岁不满十六周岁的人,犯故意杀人、故意伤害致\n人重伤或者死亡、强奸、抢劫、贩卖毒品、放火、爆炸、\n投放危险物质罪的,应当负刑事责任。\"A项是参加黑\n社会性质组织罪,B项是盗窃罪,C项是故意伤害致人\n重伤罪,D项是失火罪。甲15周岁,只有C项构成犯\n罪。本题选C。","k":"分则·侵犯人身权利罪"},{"id":"2021-43","y":2021,"t":"多","s":"2012年至2018年,甲与其两名兄弟纠集数十 名社会闲散人员,在某豌豆主产区要求农民低价出售 豌豆给他们。多年来,数名不服从要求的农民被打成 重伤,其他农民不得不将豌豆低价出售。甲的行为应 认定为( )","o":["故意伤害罪","寻衅滋事罪","组织领导黑社会性质组织罪","强迫交易罪"],"a":"ACD","e":"甲与其两名兄弟纠集数十名社会闲散\n人员,实施违法犯罪活动,在本地形成非法控制,严重\n破坏经济、社会生活秩序,成立组织、领导黑社会性质\n组织罪,C项正确。甲等人强迫农民低价出售豌豆给\n他们,构成强迫交易罪,D项正确。甲等人将数名不\n服从的农民打成重伤,构成故意伤害罪,A项正确。\n寻衅滋事罪是指行为人为寻求刺激、发泄情绪、逞强\n耍横等,无事生非,进行扰乱破坏,情节恶劣的行为。\n甲的行为不是寻衅滋事,B项错误。本题选ACD。","k":"分则·侵犯人身权利罪"},{"id":"2022-11","y":2022,"t":"单","s":"A国人甲拐卖B国妇女到我国境内被查获。对此,下列说法中正确的是","o":["我国没有刑事管辖权,应当交由A国处理","我国没有刑事管辖权,应当交由B国处理","我国有刑事管辖权,应依照我国刑法规定处理","我国有刑事管辖权,应依照相关国际惯例处理"],"a":"C","e":"《刑法》第6条第1款、第3款规定:\n\"凡在中华人民共和国领域内犯罪的,除法律有特别\n规定的以外,都适用本法。\"\"犯罪的行为或者结果有\n一项发生在中华人民共和国领域内的,就认为是在中\n华人民共和国领域内犯罪。\"A国人甲拐卖B国妇女\n到我国境内被查获,属于在我国领域内犯罪,我国对\n此有刑事属地管辖权,适用我国刑法处理。C选项\n正确。","k":"分则·侵犯人身权利罪"},{"id":"2022-17","y":2022,"t":"单","s":"文某在疫情防控期间,为发泄不满情绪,将发热门诊值班医生打成轻微伤,并损 坏其防护用具,致使该医生被隔离观察无法正常从事诊疗工作,情节恶劣。文某的行 为应认定为","o":["寻衅滋事罪","故意伤害罪","妨害传染病防治罪","故意毁坏财物罪"],"a":"A","e":"寻滋事罪是指行为人为寻求刺激、发\n没收财产是指没收犯罪分子个人所有泄情绪、逞强耍横等,无事生非,进行扰乱破坏,情节\n财产的一部或者全部。被告人持有的股票属于其个恶劣的行为。根据《关于依法惩治妨害新型冠状病毒\n感染肺炎疫情防控违法犯罪的意见》的规定,在疫情\n防控期间,故意伤害医务人员造成轻伤以上的严重后\n果,或者对医务人员实施撕扯防护装备、吐口水等行\n为,致使医务人员感染新型冠状病毒的,以故意伤害\n罪定罪处罚;随意殴打医务人员,情节恶劣的,以寻\n滋事罪定罪处罚。文某将值班医生打成轻微伤,未达\n到轻伤以上的严重后果,不构成故意伤害罪,应以寻\n畔滋事罪定罪处罚。A选项正确,B选项错误。妨害\n传染病防治罪是指违反传染病防治法的规定,存在法\n定情形之一,引起甲类传染病以及依法确定采取甲类\n传染病预防、控制措施的传染病传播或者有传播严重\n危险的行为。C选项错误。根据题干中的信息,难以\n认定文某是否构成故意毁坏财物罪。D选项错误。","k":"分则·侵犯人身权利罪"},{"id":"2022-18","y":2022,"t":"单","s":"假设一∶甲见势不妙拔腿就跑,店主随后追赶但因天黑路滑不慎摔成重伤。甲的 行为","o":["不构成犯罪","构成盗窃罪","构成抢劫罪","构成非法侵入住宅罪"],"a":"A","e":"甲年龄为15周岁,不能构成盗窃罪、非\n法侵人住宅罪。B、D选项错误。另外,非法侵入住宅\n罪是指未经允许非法进入他人住宅或者经要求退出\n无故拒不退出的行为。此处的\"住宅\"指的是用于日\n常生活起居的场所。本案中甲在深夜闯入临街店铺\n意图行窃,临街店铺为经营场所,而非用于日常生活\n起居的场所,不能认定为\"非法侵入住宅\",因此,不构\n成非法侵入住宅罪。抢劫罪是指以非法占有为目的,\n当场使用暴力、胁迫或者其他方法,强行劫取公私财\n物的行为,本案中甲并未实施暴力、胁迫或者其他足\n以压制反抗的行为,不构成抢劫罪。转化型抢劫是指\n犯盗窃、诈骗、抢夺罪,为窝藏赃物、抗拒抓捕或者毁\n灭罪证而当场使用暴力或者以暴力相威胁的,甲被发\n现之后便逃跑了,并没有实施任何暴力或者以暴力相\n威胁的行为,也不成立转化型抢劫。C选项错误。甲\n未窃得财物,且店主的摔伤与甲不具有刑法上的因果\n关系,甲对此不用负责,因此,甲不构成犯罪。A选项\n正确。","k":"分则·侵犯人身权利罪"},{"id":"2022-45","y":2022,"t":"多","s":"非法植入基因编辑、克隆胚胎罪的客观方面表现为","o":["将基因编辑、克隆的人类胚胎植人人体内,情节严重的","将基因编辑、克隆的动物胚胎植入人体内,情节严重的","将基因编辑、克隆的人类胚胎植入动物体内,情节严重的","将基因编辑、克隆的动物胚胎植人动物体内,情节严重的"],"a":"ABC","e":"非法植人基因编辑、克隆胚胎罪是指将\n基因编辑、克隆的人类胚胎植入人体或者动物体内,\n或者将基因编辑、克隆的动物胚胎植入人体内,情节\n严重的行为。此罪的客观方面表现为:(1)将基因编\n辑、克隆的人类胚胎植入人体内,情节严重的;(2)将\n基因编辑、克隆的人类胚胎植入动物体内,情节严重\n的;将基因编辑、克隆的动物胚胎植人人体内,情节严\n重的。故本题选择ABC。","k":"分则·侵犯人身权利罪"},{"id":"2022-8","y":2022,"t":"单","s":"甲为报复仇人高某,利用AI技术,将一段色情视频的表演者\"换脸\"为高某,并通过 互联网发布,导致高某不堪受辱精神失常。甲的行为应认定为","o":["侮辱罪","诽谤罪","报复陷害罪","传播淫移物品罪"],"a":"B","e":"侮辱罪是指使用暴力或者其他方法,公\n然贬低他人人格,败坏他人名誉,情节严重的行为。\n诽谤罪是指捏造并公开散布某种虚构的事实,损害他\n人人格与名誉,情节严重的行为。报复陷害罪是指国\n家机关工作人员滥用职权,假公济私,对控告人、申诉\n人、批评人、举报人实行报复陷害的行为。传播淫秽\n物品罪是指不以牟利为目的,传播淫移的书刊、影片、\n音像、图片或者其他淫秽物品,情节严重的行为。甲\n利用AI技术,捏造并公开散布虚构的事实,损害高某\n的人格与名誉,导致高某不堪受辱精神失常,构成诽\n谤罪。同时,甲利用互联网传播色情视频,构成传播\n淫秽物品罪,一行为同时触犯两罪,属于想象竞合,择\n一重罪处罚。诽谤罪处三年以下有期徒刑、拘役、管\n制或者剥夺政治权利,传播淫罗物品罪处二年以下有\n期徒刑、拘役或者管制。择一重处罚应当定诽谤罪,\n故本题选择B。","k":"分则·侵犯人身权利罪"},{"id":"2022-9","y":2022,"t":"单","s":"被执行人甲屡次殴打人民法院执行干警,阻拦其进入执行现场,致使生效判决文书 无法执行。甲的行为应认定为","o":["故意伤害罪","妨害公务罪","寻衅滋事罪","拒不执行判决、裁定罪"],"a":"D","e":"拒不执行判决、裁定罪是指对人民法院\n的判决、裁定有能力执行而拒不执行,情节严重的行\n为。妨害公务罪是指以暴力、威胁方法阻碍国家机关\n工作人员依法执行职务,阻碍人民代表大会代表依法\n执行代表职务,阻碍红十字会工作人员依法履行职责\n的行为,或者故意阻碍国家安全机关、公安机关依法\n执行国家安全工作任务,未使用暴力、威胁方法,造成\n严重后果的行为。本罪与拒不执行判决、裁定罪是法\n条竞合关系,妨害公务罪是一般法条,拒不执行判决、\n裁定罪是特殊法条。被执行人甲屡次殴打人民法院\n执行干警,阻拦其进人执行现场,致使生效判决文书\n无法执行,构成拒不执行判决、裁定罪。特殊法条优\n先于一般法条。B选项错误,D选项正确。因使用暴\n力方法拒不执行判决、裁定造成执行人员重伤或者死\n亡的,应当以故意伤害罪或者故意杀人罪定罪处罚。\n甲的行为未造成执行人员重伤,不成立故意伤害罪。\nA选项错误。寻滋事罪是指行为人为寻求刺激、发\n泄情绪、逞强耍横等,无事生非,进行扰乱破坏,情节\n恶劣的行为。被执行人并非为寻求刺激、发泄情绪、\n遥强耍横,其殴打人民法院执行干警的目的是为了阻\n碍裁判文书的执行。C选项错误。","k":"分则·侵犯人身权利罪"},{"id":"2024-9","y":2024,"t":"单","s":"关于追诉期限计算的表述,正确的是()","o":["甲连续盗窃同一仓库,应从第一次盗窃行为完成之日起计算","乙故意伤害李某,李某重伤住院一个月后死亡,从住院之日起计算","丙挪用公款,数额较大、进行盈利活动,从挪用行为实施完毕之日起计算","丁未履行监管职责,致工程存在严重质量问题而垮塌,造成严重伤亡后果,从工程验 收之日起计算"],"a":"C","e":"","k":"分则·侵犯人身权利罪"},{"id":"2025-14","y":2025,"t":"单","s":"甲偷拍了陈某的隐私视频,要求陈某出20 万元购买,否则就在网上公布该视频。陈某 无奈接受,给甲写下欠条。后甲持欠条向陈某索要,陈某表示无力支付。甲多次闯入陈某的宿 舍吵闹,陈某被迫支付了这笔钱。甲的行为应认定为( )","o":["敲诈勒索罪","非法侵入住宅罪","强迫交易罪","催收非法债务罪"],"a":"A","e":"甲以非法占有为目的,使用威胁(公布隐私视频)方法,强行索要财物,符合敲\n诈勒索罪的构成,A 项正确。甲闯入宿舍是敲诈勒索的手段,被敲诈勒索行为吸收,不单独定\n罪,B 项错误。本题中没有交易行为,甲不是强买强卖,C 项错误。催收非法债务罪催收的是\n高利贷、赌债等非法债务,本题是甲强行索要财物,不构成催收非法债务罪,D 项错误。本题\n选A。","k":"分则·侵犯人身权利罪"},{"id":"2026-16","y":2026,"t":"单","s":"甲、乙在餐厅吃饭,甲和隔壁桌温某因琐事产生纠纷,发生打斗。甲在击打 温某面部过程中,将劝架的李某打成重伤。甲的行为应认定为","o":["不构成犯罪","寻衅滋事罪","过失致人重伤罪","故意伤害罪"],"a":"D","e":"打击错误,甲故意伤害温某,误伤劝架人李某,法定符合说,仍定故意伤\n害罪(重伤)。","k":"分则·侵犯人身权利罪"},{"id":"2026-45","y":2026,"t":"多","s":"甲离婚后结识乙,二人同居。乙长期虐待甲的未成年女儿王某,情节严重, 多次致使王某轻伤。甲对乙的上述行为,视而不见。对于本案,下列说法正确的 有","o":["甲的行为构成虐待罪","甲的行为构成故意伤害罪","乙的行为构成虐待罪","乙的行为构成故意伤害罪"],"a":"ACD","e":"乙长期同居虐待未成年继女,成立虐待罪,多次轻伤同时构成故意伤害罪;\n甲具有监护义务明知虐待不作为,成立虐待罪共犯。","k":"分则·侵犯人身权利罪"},{"id":"2026-5","y":2026,"t":"单","s":"甲通过技术手段非法获取上百户家庭的摄像头控制权限,远程观看他人隐私画 面,并截图保存部分画面。甲的行为应认定为","o":["传播淫秽物品罪","非法利用信息网络罪","侵犯公民个人信息罪","非法控制计算机信息系统罪"],"a":"D","e":"非法控制计算机信息系统罪,指非法获取、控制他人计算机、摄像头等设\n备系统。甲远程控制上百户摄像头,属于非法控制计算机信息系统;\nC 侵犯公民个人信息是非法获取、出售信息,本案核心是控制设备,不选;无淫\n秽内容排除A;未利用网络实施其他犯罪排除B。","k":"分则·侵犯人身权利罪"}]},{"sub":"刑法","name":"犯罪停止形态","w":1.8,"L":34,"qs":[{"id":"2007-10","y":2007,"t":"单","s":"甲与乙因生活琐事互相斗殴,乙感到不是甲的对手而逃跑。甲紧追不舍,乙逃出 500 米 后被甲追上。甲用木 棒朝 乙劈头盖脸打来。情急之下,乙抽出随身携带的水果刀朝甲刺去,致甲重伤。乙的行为 (   ) 。","o":["构成故意杀人罪 ( 未遂 )","构成故意伤害罪","构成寻衅滋事罪","不构成犯罪"],"a":"D","e":"本人或他人的人身、财产和其他合法权利免受正在进行的不法侵害,采取对不法侵害人造成 \n损害的方法,制止不法侵害的行为。甲用木棒朝乙劈头盖脸打来,情势危急,在此情况下为 \n保护自己,乙用刀刺甲,属于正当防卫,不构成犯罪。","k":"犯罪停止形态"},{"id":"2007-15","y":2007,"t":"单","s":"甲见固定在河道中放置航标灯的小船适宜做猪食槽,就砍断锚链,将小船拖回家。所幸航标灯灭失的情况被及 时 发现,才避免了船毁人亡的结果。甲的行为构成 (   ) 。","o":["破坏交通工具罪","破坏交通设施罪的既遂","破坏交通设施罪的未遂","盗窃罪"],"a":"B","e":"破坏交通设施罪 \n航标灯为交通设施,不是交通工具,因而排除 A。刑法第 117 条规定,破坏轨道、 \n桥梁、隧坏危险,尚未造成严重后果的,处 3 年以上 10 年以下有期徒刑。该罪是危险犯, \n只要破坏行为足以发生交通工具倾覆、毁坏危险,即为犯罪既遂。故答案为 B。","k":"犯罪停止形态"},{"id":"2007-19","y":2007,"t":"单","s":"关于挪用公款罪的认定,下列说法中正确的是 (   ) 。","o":["以个人名义将公款供其他单位使用的,属于挪用公款归个人使用","行为人挪走公款后未使用该公款的,构成挪用公款罪的未遂","挪用公款以后,携带挪用的公款潜逃的,以挪用公款罪从重处罚","挪用救灾、救济物资数量较大,归个人使用的,不构成挪用公款罪"],"a":"A","e":"挪用公款罪 \n] 根据全国人大作出的解释,以个人名义将公款供其他单位使用的,属于挪用公款\"归 \n个人使用\",故 A 项正确。挪用公款罪并不要求挪走公款后必须使用,只要挪用的行为完成, \n即构成既遂,B 项错误。携带挪用的公款潜逃的,犯罪性质已经转化,要以贪污罪论处,故 \nC 项错误。挪用用于救灾、抢险、防汛、优抚、扶贫、移民、救济款物归个人使用的,也构 \n成挪用公款罪,且要从重处罚.,D 项错误。 \n- 10 -\n\n \n \n更多考研精品资料,关注淘宝店铺:光速考研工作室","k":"犯罪停止形态"},{"id":"2007-25","y":2007,"t":"多","s":"甲用枪射杀乙,乙中弹倒地。甲以为乙已死亡,遂弃 “ 尸 ” 于荒野。实际上,乙只是中弹受伤,并没有死 亡。 甲的行为属于 (       ) 。","o":["实行终了的未遂","未实行终了的未遂","能犯未遂","不能犯未遂 三、简答题 (26 、 27 小题,每小题 6 分"],"a":"AC","e":"未遂 \n] 实行终了的未遂和未实行终了的未遂是根据实行行为是否完成所做的分类,题目中 \n甲实施杀人的行为已经完成,应为实行终了的未遂。能犯未遂是指根据犯罪时的主客观情况, \n犯罪行为本来有可能得逞,但由于行为人意志以外因素的介入使犯罪没有得逞。不能犯未遂 \n是指由于行为人主观认识上的原因或者行为手段、行为对象等原因,犯罪不具备得逞的客观 \n现实性。从题目看,甲杀人的目的是能够达到的,应为能犯未遂。 \n三、筒答题","k":"犯罪停止形态"},{"id":"2007-6","y":2007,"t":"单","s":"甲意图杀害张三,在实行犯罪时误把李四认作张三而杀死,张三未遇害。对甲的行为应当 (   ) 。","o":["以故意杀人罪 ( 未遂 ) 和过失致人死亡罪数罪并罚","以过失致人死亡罪定罪处罚","以故意杀人罪 ( 未遂 ) 定罪处罚","以故意杀人罪 ( 既遂 ) 定罪处罚"],"a":"D","e":"对象错误 \n]误把李四当作张三而杀死,属于刑法理论中的具体的事实错误中的对象错误,这种对 \n象错误并不影响故意犯罪既遂的成立。题目中甲主观上有杀人的意图,客观上又实施了杀人 \n的行为,符合故意杀人罪的构成要件,并构成故意杀人罪的既遂。","k":"犯罪停止形态"},{"id":"2007-7","y":2007,"t":"单","s":"甲对一公共住宅放火,起火后即离开,但火情立即被他人发现并迅速扑灭。甲的行为属于 (   ) 。","o":["放火罪的未遂","放火罪的既遂","放火罪的预备","故意毁坏财物罪的未遂"],"a":"B","e":"放火罪的既遂 \n]放火罪在我国被认为是危险犯,危险犯是以法定的危害结果发生的危险状态的出现为 \n区分犯罪既遂和犯罪未遂的基本标准。犯罪行为造成了危害结果发生的现实危险的,即使没 \n有实际发生危害结果,也构成犯罪既遂。故答案为 B。","k":"犯罪停止形态"},{"id":"2008-10","y":2008,"t":"单","s":"下列情形中,属于犯罪未遂的是(  )","o":["甲持匕首在张三每天下夜班经过的路口守候,准备杀死张三,但张三当夜没有出现在这一地点","乙携带匕首乘坐出租车,准备对出租车司机进行抢劫,因形迹可疑,出租车司机将车开进了派出所将其抓获","丙非法购进两支手枪还未来得及出卖即被抓获","丁为抢劫李四钱财,假装劝酒将李四灌醉,没来得及取走李四财物,因被李四的妻子发现而慌忙逃走"],"a":"D","e":"犯罪未遂的特征有三:一是已着手实行犯罪;二是未得逞,即犯罪行为没有完整地满足刑法分则规定\n的某一犯罪的全部构成要件;三是未得逞是由于犯罪分子意志以外的原因。选项A,甲候行为属于犯罪预备行为,\n尚未实行犯罪行为;选项B,乙尚未实施抢劫的行为,故都不属于犯罪未遂。选项C,丙乙经实施非法购进枪支的行\n为,构成非法买卖枪支罪的既遂。选项D,丁已经实施抢劫罪的方法行为,但因丁意志以外原因而未得逞,故构成\n犯罪未遂。","k":"犯罪停止形态"},{"id":"2008-6","y":2008,"t":"单","s":"下列情形中,属于犯意表示的是(  )。","o":["甲为非法制造枪支而购买钢管","乙对朋友发誓说要杀死仇人张某","丙发电子邮件邀约朋友参与盗窃","丁向他人发送敲诈财物的短信息"],"a":"B","e":"犯意表示,是指在实施犯罪活动以前,把自己的犯罪意图通过口头或者书面的形式流露出来。犯意表\n示虽然在客观上也表现为一定的行为,但这一行为仅仅是其犯罪意图的表露,还不属于为犯罪制造条件的行为,因\n此,它和犯罪预备具有本质的区别。犯意表示不可能对社会造成实际危害。也不具有对社会的现实危害性,因此刑\n法对犯意表示不予处罚;犯罪预备是为着手实行犯罪而制造条件,对社会存在着实际威胁,具有社会危害性,因此\n刑法明文规定预备犯应负刑事责任。选项A、C 属于犯罪预备行为、选项D 属于犯罪实行行为,只有选项B 才属于犯\n- 6 -\n\n \n \n更多考研精品资料,关注淘宝店铺:光速考研工作室 \n意表示。","k":"犯罪停止形态"},{"id":"2009-11","y":2009,"t":"单","s":"下列行为中,已经着手实行犯罪的是(   )。","o":["甲为劫财而将受害人骗到预定地点","乙为劫财而埋伏在阴暗处等候被害人出现","丙为劫财而在被害人饮料中投放麻醉药","丁为劫财而购买了一把匕首"],"a":"C","e":"所谓已经着手实施犯罪,是指行为人已经开始实施刑法分则规定的某种具体负责构成要件客观方\n- 7 -\n\n \n \n更多考研精品资料,关注淘宝店铺:光速考研工作室 \n面的行为。对抢劫罪,只要行为人开始对被害人的人身实施强制或打击,即认为抢劫罪已经着手。A、B、D 选项中\n甲、乙、丁的行为都未对被害人的人身实行强制或打击,不认为已经着手实行犯罪。C 选项中,丙为劫财而在被害\n人的饮料中投放麻醉药,已经对被害人人身实施强制,应认为抢劫罪已经着手。。因此本题答案为C","k":"犯罪停止形态"},{"id":"2011-41","y":2011,"t":"多","s":"下列行为中,属于犯罪未遂的有()。","o":["甲在发表分裂国家的演讲时,被群众扭送到 公安机关","乙为制造列车倾覆事故,在轨道上安装了脱轨 装置,该装置被巡道工及时拆除","丙欲杀害张某,用猎枪射击骑马的张某后即逃 走,结果将马打死,造成张某轻伤","丁正在撬保险柜时,某同伙打来电话,告知该 保险柜中没有值钱的东西,丁便离去"],"a":"CD","e":"犯罪未遂是指,已经着手实行犯罪,由\n\n于犯罪分子意志以外的原因而未得逞的。犯罪未遂\n有三个特征:(l)行为人已经着手实行犯罪。(2)犯\n罪没有得逞。(3)犯罪没有得逞是由于行为人意志\n以外的原因。本题主要侧重于对第二个特征的考查,\n即区分犯罪既遂和犯罪未遂。在判断犯罪是否得逞\n时,必须清楚犯罪既遂的形态。既遂类型包括:(l)实\n害犯,行为必须造成法定的实害后果,才构成犯罪的既\n遂;(2)危险犯,即只要行为足以造成某种严重后果的\n危险,则成立既遂;(3)行为犯,指实行完毕了实行行\n为,则成立既遂。A 项煽动分裂国家罪是行为犯,只\n要有煽动分裂国家的行为就构成犯罪既遂。B 项破\n坏交通设施罪是危险犯,只要造成了危险状态即构成\n犯罪既遂。C选项故意杀人罪是实害犯,必须造成他\n人死亡的危害结果,才成立既遂,于是C项之情形属\n于犯罪未遂。D选项属于盗窃有形财物的情形,刑法\n上采取失控加控制说,即以财物的所有人、管理人、保\n护人持有人失去对财物的控制并为盗窃犯罪人所控\n制的状态为既遂,所以D选项中的情形未达到既遂状\n态,属于犯罪未遂。答案选CD。","k":"犯罪停止形态"},{"id":"2012-10","y":2012,"t":"单","s":"甲雇佣乙杀胡某,并且带乙辨认了胡某。乙 在某夜将王某误当作胡某而杀害。甲因此拒付 \"佣 金 ”,在本案中( )。","o":["甲构成故意杀人罪既遂","甲构成故意杀人罪未遂","乙构成故意杀人罪未遂","乙构成过失致人死亡罪"],"a":"A","e":"甲雇佣乙杀人的行为是故意杀人的共\n同犯罪,甲是教竣犯。根据共同犯罪的构成可知,在\n共同犯罪中,一人既遂全案既遂,乙既然杀死了人,根\n据法定符合说,虽然死者并非胡某,但是他已经在甲\n的教咬下完成了杀人行为,故构成了故意杀人罪既\n遂。故选A。杀人对象的错误,不影响既遂的成立。\n而且按照法定符合说,行为人预想的事实与实际发生\n的事实法律性质相同,不能阻却行为人对因错误而发\n生的危害结果承担故意的责任。此处犯罪人所侵害\n的都是相同的法律客体,即人的生命,所以依然构成\n犯罪既遂。","k":"犯罪停止形态"},{"id":"2012-13","y":2012,"t":"单","s":"甲得知某单位财务室的保险柜中有10万元 工资款将于次日发放,遂携工具深夜潜人财务室撬保 险柜。因保险柜十分坚固,甲用了3个小时都没有撬 开,便离开。甲的行为属于( )。","o":["未实行终了的中止","实行终了的中止","能犯未遂","不能犯未遂"],"a":"C","e":"根据《刑法》第23条的规定,已经着手\n实行犯罪,由于犯罪分子意志以外的原因而未得逞\n的,是犯罪未遂。犯罪未遂按是否实行完毕分类可以\n分为:(I)实行终了的未遂,行为人把实现犯罪意图\n必要的行为实施完毕的未遂;(2)未实行终了的未\n遂,行为人没有把实现犯罪意图必要的行为实施完毕\n的未遂。按是否发生损害结果分为:(1)能犯未遂,\n犯罪实际有可能达到既遂,但由于意志以外的原因未\n能达到既遂而停止下来的情况;(2)不能犯未遂,犯\n\n罪没有可能达到既遂,行为人由于意志以外的原因未\n能达到既遂而停止下来的情况。不能犯未遂又分为\n两种:(1)对象不能犯未遂,如将男人误认为女人欲\n行强奸;(2)手段不能犯未遂。本题中,甲由于意志\n以外的原因放弃犯罪行为,是犯罪未遂。由于保险柜\n坚固导致甲没有达到既遂,但是并不是说保险柜不能\n打开,如果使用适当的工具,保险柜是可以打开的,因\n此甲属于能犯未遂。故选C。犯罪中止是犯罪人自\n动放弃犯罪,所以甲显然不属于犯罪中止,选项AB\n错误。","k":"犯罪停止形态"},{"id":"2012-15","y":2012,"t":"单","s":"甲为某市交通局副局长,负责公路建设工程 招标工作。乙为承揽工程,送给甲30万元。不料甲 在数日后被调离,不再负责工程招标。乙闻讯后要甲 退回30万元,遭拒绝。乙到检察机关投案,交代了给 甲30万元欲请甲帮助承揽工程的事实。检察机关遂 对甲、乙立案查处,并立即将30万元追缴。下列选项 中,正确的是( )。","o":["甲构成受贿罪未遂","乙构成行贿罪中止","乙成立立功","对乙可以减轻或者免除处罚"],"a":"D","e":"本题中甲已经接受了乙的30万元现\n金,已经成立了受贿罪的既遂而不是未遂,乙成立行\n贿罪的既遂而不是中止。立功是指犯罪分子揭发他\n人的犯罪行为,查证属实,或者提供重要线索得以侦\n破其他案件的行为。本题显然不符合这个条件。《刑\n法修正案(九)》之前,《刑法》规定,行贿人在被追诉\n前主动交代行贿行为的,可以减轻处罚或者免除处\n罚。因此当时的答案是D。但是《刑法修正案(九)》\n对受贿罪进行了修改,根据最新的规定,行贿人在被\n追诉前主动交代行贿行为的,可以从轻或者减轻处\n罚。其中,犯罪较轻的,对侦破重大案件起关键作用\n的,或者有重大立功表现的,可以减轻或者免除处罚。\nD选项错误,应该是\n\"可以从轻或者减轻处罚\n\"。因此\n本题现在无答案。","k":"犯罪停止形态"},{"id":"2013-43","y":2013,"t":"多","s":"甲于深夜到某办公大楼行窃时,被保安王某 发现,王某拦住甲,甲将王某打昏,致其轻伤,随后逃 跑。甲的行为应认定为()。","o":["人户盗窃","犯罪既遂","故意伤害罪","抢劫罪"],"a":"BD","e":"甲在偷窃的过程中,为了窝藏赃物、抗\n拒抓捕毁灭罪证,当场使用暴力将保安王某打成轻\n伤,符合抢劫罪的转化要件,转化为了抢劫罪。虽然\n甲在打伤王某之后并没有获得任何财物,但抢劫罪不\n以是否抢到了钱财为犯罪既遂的要件,只要主观上有\n非法占有财物的目的,客观上实施了暴力劫取的行为\n就是犯罪既遂。因此,答案BD正确。","k":"犯罪停止形态"},{"id":"2013-5","y":2013,"t":"单","s":"甲为泄愤,教唆乙炸毁某公司办公楼,乙因害 怕没有实施爆炸。对甲的行为()。","o":["应以教唆罪定罪处罚","应认定为爆炸罪的犯意表示","应以爆炸罪定罪,但应当免除处罚","应以爆炸罪定罪,但可以从轻或者减轻处罚"],"a":"D","e":"本题考查的是考生对\n\" 教竣犯\n\" 这一概\n念的理解能力。教咬犯是指教竣他人实行犯罪而自\n已不参加犯罪的实施,是使他人产生犯罪意图的人。\n对于教峻犯,应当按照所教咬的罪名进行论处,不存\n在独立的\n\" 教峻罪\n\" 罪名,所以A 项错误。本题中甲\n实施完成了教竣行为,但乙并没有实施爆炸行为,因\n此属于教竣未遂。在这种情况下,依据我国刑法教咬\n犯独自构成犯罪,但可以从轻或者减轻处罚。","k":"犯罪停止形态"},{"id":"2014-13","y":2014,"t":"单","s":"下列行为中,应以间谋罪(既遂)定罪处罚的 是()。","o":["甲非法获取国家秘密后,出售给外国间谍 组织","乙在境外参加外国间谋组织,回国后没来得及 从事收集情报工作即被抓获","丙为境外的公司刺探国内公司的相关商业秘 密,尚未送出该秘密即被抓获","丁将通过职务行为获得的国家秘密上传到互 联网上,该秘密被外国间谋组织获取"],"a":"B","e":"本题考查间谍罪的构成要件。所谓间\n谍罪,是指参加间谍组织,或接受间谍组织及其代理\n人的任务,或者为敌人指示轰击目标,危害国家安全\n的行为。成立间谍罪,要求明知对方为间谍组织,A\n项并没有说甲是接受间谍组织的任务而非法获取国\n家秘密,也没有表明甲知晓对方是间谍组织,鉴千本\n题是单选题,应选出最优答案,因此认为甲不成立间\n谍罪,而成立为境外非法提供国家秘密罪,C选项中\n的行为成立侵犯商业秘密罪(未遂)。D选项中丁的\n行为属千故意泄露国家秘密罪。B选项中乙在境外\n参加间谍组织便已经构成了间谍罪的既遂,是否着手\n实施间谍行为并不影响其既遂。","k":"犯罪停止形态"},{"id":"2014-18","y":2014,"t":"单","s":"甲乘杨某不备,用木棍将其打昏后,搜遍杨某 全身,未得分文。经鉴定,杨某为轻伤。对甲的行为 应认定为()。","o":["抢劫罪(未遂)","抢劫罪(既遂)","故意伤害罪","抢劫罪(未遂)和故意伤害罪"],"a":"B","e":"本题考查的是抢劫罪的既遂要件。所\n谓抢劫罪,是指以非法占有为目的,当场使用暴力、威\n胁或其他方法强行劫取财物的行为,该罪属于结果\n犯,其构成既遂的情形有两种:(1)抢劫到了财物,不\n论抢劫到的财物数额多少均为既遂;(2)致被抢劫人\n轻伤以上伤害。本题中虽然行为人将被害人全身搜\n遍未得分文,但由于致使被害人轻伤,已构成抢劫罪\n既遂。","k":"犯罪停止形态"},{"id":"2014-8","y":2014,"t":"单","s":"甲和乙意图置常某于死地,甲持匕首向常某刺 去,常某急忙躲闪,匕首刺中了乙,乙流血过多死亡。 甲的行为应认定为()。","o":["故意杀人罪(既遂)","过失致人死亡罪","故意杀人罪(未遂)","故意杀人罪(未遂)与过失致人死亡罪"],"a":"A","e":"本题考查的内容是刑法中事实认识错\n误当中的行为偏差。行为偏差,是指行为人预想打击\n的目标与实际打击的目标不一致。从表面上看,这也\n是对象错误,但它不是因为辨认错误,而是因为行为\n本身的误差。对行为误差一般也采取法定符合说,假\n如预想打击的目标与(因行为偏差)实际打击的目标\n在法律规定的范围内一致,不妨害行为人对误击的目\n标承担故意罪责;假如在法律规定的范围内不一致,\n则阻却对误击的目标承担故意罪责。本题中甲欲杀\n常某而误将乙杀死,由千常某和乙都是人,同属于《刑\n法》第232条规定的故意杀人罪的对象,甲无论杀了\n谁都是剥夺了他人的生命,都没有超出故意杀人罪的\n犯罪构成之对象范围,也没有使犯罪客体的性质发生\n变化。因此,甲构成故意杀人罪(既遂)。","k":"犯罪停止形态"},{"id":"2015-12","y":2015,"t":"单","s":"甲男将女同事汪某骗至宾馆,要求与之发生 性关系,否则在网上散布汪某的不雅照。汪某对甲破 口大骂,甲觉得无趣,遂打消奸淫念头离去。甲的行 为属于()。","o":["犯罪预备","犯罪未遂","犯罪中止","犯罪既遂"],"a":"C","e":"本题的考查的是故意犯罪的停止形态。\n所谓故意犯罪的停止形态,是指在故意犯罪过程中因\n为某种原因而停止所呈现的状态。简言之,就是犯罪\n进展的结局状态。所谓犯罪中止,是指在犯罪过程\n中,自动放弃犯罪或者自动有效地防止犯罪结果发生\n的形态。犯罪中止的三个特征:时间性、自动性和客\n观有效性。题中,甲意欲强奸汪某,虽然汪某破口大\n骂,但是不足以造成强奸行为停止,甲出于自动的心\n理,放弃侵害,所以属于犯罪中止,C选项正确。甲巳\n经着手强奸行为,不是犯罪预备,A选项错误。甲是\n自己主动打消奸淫念头的,而不是由于甲意志以外的\n原因导致强奸行为的停止,不是犯罪未遂,B选项错\n误。根据刑法理论,强奸罪的既遂标准是\n\"插入说\n\" ,\n甲男没有达到强奸罪的既遂标准,不是犯罪既遂,D\n选项错误。","k":"犯罪停止形态"},{"id":"2015-3","y":2015,"t":"单","s":"甲欲杀死赵某,掐赵某脖子致其休克后,甲以 为赵某死亡,将其投人河中,赵某溺水而亡。甲的行 为构成()。","o":["故意伤害罪(致人死亡)","过失致人死亡罪","故意杀人罪(未遂)","故意杀人罪(既遂)"],"a":"D","e":"本题考查的是对故意杀人罪的既遂要\n件以及因果关系认识错误的理解。所谓故意杀人罪,\n是指故意非法剥夺他人生命的行为,该罪属千实害\n犯。所谓因果关系错误,指行为人对自己的行为和所\n造成的结果之间因果关系的实际情况发生误认。本\n案中,甲在犯罪过程中,错认为自己抬死了赵某,而实\n际上是自已将赵某投入河中的行为造成赵某的死亡,\n即甲对造成行为结果的原因有误解。这种情形的错\n误对罪责的认定不发生影响,即甲的行为构成故意杀\n人罪(既遂),D正确。因果关系错误不影响犯罪的认\n定,不成立未遂,C错误。甲的主观意图是杀死赵某,\n而不是伤害赵某,不成立故意伤害罪,A错误。甲是\n故意杀死赵某的,不是过失,不成立过失致人死亡罪,\nB 错误。","k":"犯罪停止形态"},{"id":"2016-19","y":2016,"t":"单","s":"甲误将黄色染料当硫黄,制造了“炸弹”,并投 掷到邻居刘某家,意图杀死刘某,但“炸弹”未能爆炸, 刘家五口人安然无恙。甲的行为应认定为()。","o":["投放虚假危险物质罪(既遂)","故意杀人罪(未遂)","爆炸罪(未遂)","投放危险物质罪(未遂)"],"a":"C","e":"爆炸罪是故意针对不特定的多数人或\n者重大公私财产实施爆炸行为,危害公共安全的行\n为。区分爆炸罪与故意杀人罪的关键是看行为一经\n实施,是否在客观上造成或有可能造成不特定多数人\n的生命、健康、财产遭受损害。需要注意的是,即使行\n为人实施爆炸行为在主观上有明显的针对性,如目的\n在千杀死一个或某几个特定的人,但只要其行为在客\n观上造成或有可能造成公共危险,就应认定为爆炸\n罪。本题中,甲的目的虽然是杀死刘某,但是其制造\n\n\"炸弹\n\" 并投掷的行为,可能造成不特定多数人的生\n命、健康、财产遭受损害,因此成立爆炸罪。但是因为\n甲误将黄色染料当作硫黄,导致\n\"炸弹\n\" 没有爆炸,属\n于爆炸罪的未遂,不能犯未遂,C选项正确,B选项\n错误。\n投放危险物质罪是投放毒害性、放射性、传染病\n病原体等物质,危害公共安全的行为,甲投掷的是\n\"炸\n弹\n\",不是毒害性、放射性传染病病原体等物质,不成\n立投放危险物质罪,D选项错误。投放虚假的危险物\n质罪指投放虚假的爆炸性、毒害性、放射性、传染病病\n原体等物质,严重扰乱社会秩序的行为。甲投掷的是\n真实的\n\"炸弹\n\",只是由于其错将黄色染料当作硫黄,\n\"炸弹\n\" 才没有爆炸,甲主观上也认为是真实的炸弹,\n而不是虚假的爆炸性物质,所以甲不成立投放虚假危\n险物质罪,A选项错误。","k":"犯罪停止形态"},{"id":"2016-5","y":2016,"t":"单","s":"甲在丈夫的水杯中投毒,意图杀害丈夫,丈夫 中毒后呕吐不止,甲见状不忍,将丈夫送到医院,使之 )。 得救。甲的行为属于(","o":["犯罪预备","犯罪未遂","犯罪中止","犯罪既遂"],"a":"C","e":"l\n犯罪中止是指在犯罪过程中,自动放弃\n犯罪或者自动有效地防止犯罪结果发生的形态。本\n\n题中,甲在丈夫的水杯中投毒,已经着手实施杀人行\n为,但是甲在丈夫中毒后,主动将其送到医院使其得\n救,有效防止了犯罪结果的发生,成立犯罪中止,C选\n项正确。\n犯罪预备是指为了犯罪,准备工具、制造条件的\n行为。犯罪预备是在着手实施犯罪行为之前,即还未\n着手实施犯罪行为。甲已经投毒,已经着手了,所以\n不是犯罪预备,A选项错误。犯罪未遂指已经着手实\n行犯罪,由于犯罪分子意志以外的原因而未得逞的形\n态。甲已经着手,但是甲主动将丈夫送到医院,防止\n了死亡结果的发生,而不是由于甲意志以外的原因导\n致其丈夫没有死亡,所以甲不是犯罪未遂,B选项错\n误。甲有杀人的故意,实施了杀人的行为,但是甲的\n丈夫并没有死,即死亡结果没有发生,故意杀人罪是\n实害犯,甲的丈夫未死,故意杀人罪既遂的要件没有\n满足,不成立故意杀人罪既遂,D选项错误。只有造\n成被害人死亡的实害结果,才有可能成立犯罪既遂。","k":"犯罪停止形态"},{"id":"2019-16","y":2019,"t":"单","s":"甲意图杀死范某,持刀潜伏在范某家门口树 林里,久等未见范某归来,因惧怕受到法律惩罚,弃刀 回家。甲的行为应认定为()。","o":["犯罪预备","犯罪中止","犯罪未遂","不构成犯罪"],"a":"B","e":"犯罪中止,指在犯罪过程中,自动放弃\n犯罪或者自动有效地防止犯罪结果发生的形态。犯\n罪中止可分为预备阶段的中止和实行阶段的中止。\n本题中,甲持刀埋伏在范某家门口的树林中,是为了\n犯罪制造条件的行为,没有对范某的法益构成危险,\n因此,不构成犯罪未遂,选项C错误。但甲后来弃刀\n回家,是在犯罪预备阶段因自身原因自动放弃犯罪,\n属于犯罪中止,不构成犯罪预备,A项错误,B项正确。","k":"犯罪停止形态"},{"id":"2021-5","y":2021,"t":"单","s":"甲欲杀乙,将毒药掺入乙饭后服用的药物中, 乙服药后呕吐不止,甲于心不忍,将乙送到医院抢救, 乙脱离危险。经查,乙呕吐的原因为食物中毒。甲的 行为成立( )","o":["犯罪未遂","犯罪既遂","犯罪预备","犯罪中止"],"a":"D","e":"甲在犯罪过程中,出于对被害人的怜\n悯,主动采取措施防止犯罪结果的发生,成立犯罪中\n止,D项正确。甲自认为能达到犯罪既遂,但是主动\n采取措施,将乙送到医院抢救,因此成立犯罪中止而\n不是犯罪未遂。","k":"犯罪停止形态"},{"id":"2022-19","y":2022,"t":"单","s":"假设二∶甲抽下腰带将店主捆住,在店内翻找现金未果,悻悖离开","o":["实质数罪","犯罪未遂","入户实施犯罪","携带凶器实施犯罪"],"a":"B","e":"甲用腰带将店主捆住是为了便于抢劫,\n该非法拘禁行为属于抢劫罪的手段行为,属于处断的\n一罪而非实质数罪。A选项错误。甲在店内翻找现\n金未果,属于因犯罪分子意志以外的原因而未得逞的\n形态,即犯罪未遂。B选项正确。人户实施犯罪的\n\"户\"为用于日常生活起居的场所。本案中甲虽然在\n深夜闯入临街店铺意图行窃,临街店铺为经营场所,\n而非用于日常生活起居的场所,不能认定为\"户\"。C\n选项错误。腰带不属于\"凶器\",甲的行为不属于携带\n凶器实施犯罪。D选项错误。","k":"犯罪停止形态"},{"id":"2022-42","y":2022,"t":"多","s":"下列对于犯罪既遂的认定,不正确的有","o":["只有导致被害人死亡才能认定遗弃罪既遂","只有导致被害人死亡才能认定绑架罪既遂","只有造成财物被烧毁才能认定放火罪既遂","只有窃得公私财物数额较大才能认定盗窃罪既遂"],"a":"ABCD","e":"犯罪既遂是指犯罪人的行为完整地实\n现了刑法分则条文所规定的全部犯罪构成的事实。\n遗弃罪是指对于年老、年幼、患病或者其他没有独立\n生活能力的人,负有扶养义务而拒绝扶养,情节恶劣\n的行为。遗弃行为达到情节恶劣的程度就构成既遂,\n导致被害人死亡的构成遗弃罪与过失致人死亡罪的\n想象竞合犯。A选项错误。绑架罪属于行为犯,只要\n完成了绑架被害人的行为就构成既遂,不要求犯罪人\n获得赎金或实现其他非法目的。B选项错误。放火\n罪属于危险犯,只要行为人着手实施放火行为,已将\n对象物点燃,且具有造成严重后果的危险性即构成既\n遂。C选项错误。盗窃罪是指以非法占有为目的,盗\n窃公私财物数额较大的,或者多次盗窃、入户盗窃、携\n带凶器盗窃、扒窃的行为。行为人多次盗窃、人户盗\n窃、携带凶器盗窃、扒窃的,没有\"数额较大\"的要求,\n只要行为人控制了财物,就构成既遂。D选项错误。\n本题为选非题,故选择ABCD。","k":"犯罪停止形态"},{"id":"2022-5","y":2022,"t":"单","s":"甲以出卖为目的中转被拐卖的儿童张某,其间,张某摆脱甲的控制逃跑,甲因腿伤 未加追赶。甲的行为应认定为","o":["犯罪既遂","犯罪未遂","犯罪预备","犯罪中止"],"a":"A","e":"拐卖妇女、儿童罪是指以出卖为目的,\n拐骗、绑架、收买、贩卖、接送、中转妇女、儿童的行为。\n本罪的既遂标准为实际控制,只要犯罪行为达到了对\n被害人的实际控制程度就成立既遂。甲以出卖为目\n的中转被拐卖的儿童张某,已经成立既遂,其间张某\n摆脱甲的控制逃跑的行为不影响该犯罪行为既遂的\n认定。A选项正确。","k":"犯罪停止形态"},{"id":"2024-16","y":2024,"t":"单","s":"某县财政局科长甲被辞退后,通过该局局长乙职务行为,为丙谋取不正当利益,丙 因此免除了甲欠自己的五万元债务,甲的行为如何认定()","o":["不构成犯罪","受贿罪","利用影响力受贿罪","非国家工作人员受贿罪 链接,并因此提高了销量,情节严重,获利巨大,甲的行为如何认定() A.非法经营罪 B.虚假广告罪 C.传播淫秽物品牟利罪 D.传播淫秽物品罪 18.甲乘坐飞机抵达我国某机场时,因携带毒品被海关查获,经鉴定,甲携带毒品净重 超过2公斤,甲的行为如何认定() A.贩卖毒品罪(预备) B.运输毒品罪(未遂) C.非法持有毒品罪(中止) D.走私毒品罪(既遂)"],"a":"C","e":"","k":"犯罪停止形态"},{"id":"2024-18","y":2024,"t":"单","s":"甲乘坐飞机抵达我国某机场时,因携带毒品被海关查获,经鉴定,甲携带毒品净重 超过2公斤,甲的行为如何认定()","o":["贩卖毒品罪(预备)","运输毒品罪(未遂)","非法持有毒品罪(中止)","走私毒品罪(既遂)"],"a":"D","e":"","k":"犯罪停止形态"},{"id":"2024-20","y":2024,"t":"单","s":"如果肖某经抢救转危为安,甲的行为应认定为()","o":["犯罪预备","犯罪未遂","犯罪中止","犯罪既遂"],"a":"D","e":"","k":"犯罪停止形态"},{"id":"2024-8","y":2024,"t":"单","s":"甲持刀抢劫出租车,司机跳车求救被高速公路上的其他车辆撞死,甲应认定为()","o":["抢劫罪(基本犯)","以危险方法危害公共安全罪(未遂)","抢劫罪(结果加重犯)","故意伤害罪(既遂)"],"a":"C","e":"","k":"犯罪停止形态"},{"id":"2025-42","y":2025,"t":"多","s":"下列关于犯罪着手的理解,正确的有( )","o":["未能着手实行犯罪是犯罪预备的成立条件","不法侵害的开始与犯罪的着手未必相一致","原因行为的着手即是原因自由行为的着手","教唆犯的着手应以被教唆人的着手为前提"],"a":"AB","e":"犯罪预备是指为了犯罪,准备工具、制造条件,但由于行为人意志以外的原因未\n能着手实行犯罪。所以未能着手是犯罪预备的成立条件,A 项正确。不法侵害的开始与犯罪的\n着手未必相一致,如邮寄毒药,着手是邮寄时,但不法侵害(结果)发生在收到时。B 项正确。\n原因自由行为是指行为人故意或过失使自己陷入无责任能力状态,然后在此状态下实施犯罪。\n原因行为的着手不等于原因自由行为的着手,C 项错误。教唆犯只要实施教唆行为即已着手,\n不以被教唆人的着手为前提,D 项错误。本题选AB。","k":"犯罪停止形态"},{"id":"2026-2","y":2026,"t":"单","s":"对于参与犯罪谋划而未参与犯罪实行者,下列表述正确的是","o":["不成立共同犯罪","可以成立犯罪中止","无法成立犯罪未遂","无法成立犯罪既遂"],"a":"B","e":"共谋未实行属于共谋共同正犯,成立共犯。仅参与谋划、未实行者,若自\n动放弃犯罪、阻止他人实行或防止结果发生,可成立犯罪中止;若他人既遂,共\n谋者同样既遂;他人未遂,共谋者同样可构成未遂。因此ACD 错误,B 正确。","k":"犯罪停止形态"},{"id":"2026-7","y":2026,"t":"单","s":"甲受境外势力胁迫加入间谍组织,入境后心生悔意,拒绝执行该组织的任务。 甲的行为应认定为","o":["不构成犯罪","间谍罪(既遂)","间谍罪(中止)","间谍罪(预备)"],"a":"B","e":"间谍罪既遂标准:参加间谍组织/接受任务/为敌人指示轰击目标,实施其\n一即既遂。甲已加入间谍组织,既遂后反悔拒绝执行任务,不成立中止、预备,\n已构成间谍罪既遂。","k":"犯罪停止形态"}]},{"sub":"刑法","name":"分则·侵犯财产罪","w":1.6,"L":33,"qs":[{"id":"2005-13","y":2005,"t":"单","s":"甲于 2003 年 6 月与乙合谋共同诈骗李某 30000 元,甲乙平分各得 15000 元。在审查本案期间,甲主动交待 曾在 1997 年 3 月间诈骗张某 4000 元的犯罪事实。在处罚甲诈骗罪时其犯罪金额应为(   )","o":["34000 元","30000 元","19000 元","15000 元"],"a":"B","e":"根据刑法第87 条第1 项,犯罪法定最高刑为不满5 年有期徒刑的,经过5 年不再追诉。甲在1997\n年3 月间诈骗张某4000 元的犯罪,法定最高刑为3 年,因此对此行为的追诉时效为5 年。该行为到2003 年6 月时,\n已经超过5 年,应此对该4000 元的诈骗金额不予追究刑事责任。对共同诈骗犯罪,应当以行为人参与共同诈骗的数\n额认定其犯罪数额,并结合行为人在共同犯罪中的地位、作用和非法所得数额等情节依法处罚。甲与乙构成诈骗共\n- 7 -\n\n \n \n更多考研精品资料,关注淘宝店铺:光速考研工作室 \n犯,应当根据共同诈骗的财产数额认定犯罪金额,而非根据分赃数额认定犯罪金额。据此,选项B 应选。","k":"分则·侵犯财产罪"},{"id":"2006-15","y":2006,"t":"单","s":"甲,乙二人合谋抢夺财物。一日,甲向一坐在汽车内的妇女假装问路,乙乘该妇女不备,拉开车门,从其手中抢 过 提包就跑,甲也随即与乙一同逃跑,当场被群众抓获。群众从甲,乙二人身上各搜出一把匕首。甲,乙二人的行 为构成(   )","o":["盗窃罪","抢夺罪","抢劫罪","诈骗罪"],"a":"C","e":"见《刑法》第267 条,抢夺最转化为抢劫罪。","k":"分则·侵犯财产罪"},{"id":"2006-20","y":2006,"t":"单","s":"下列情形中,构成徇私枉法紫的是(   )","o":["某看守所警察甲利用值班之机,徇私情故意放跑因受贿罪被关押的犯罪嫌疑人刘某","某法院法官乙在行政案件审判中故意曲解法律,偏袒原告,作出违背事实与法律的判决,情节严重","警察丙在对陈某的抢夺行为进行侦察过程中,因接受陈某家属的吃请而隐匿陈某犯罪的证据","警察丁为使其仇人王某刑事追究,捏造王某犯罪的事实,向人民检察院举报,致使王某被无辜羁押 100 天"],"a":"C","e":"D 是诬告陷害罪;徇私枉法罪发生在刑诉或审判过程中。 \n二、多项选择题","k":"分则·侵犯财产罪"},{"id":"2007-18","y":2007,"t":"单","s":"甲被某国有资本控股的有限责任公司聘用,负责查验出场单、验货放行。甲与无业人员乙串通,趁甲一人值班 时, 由乙开车从货场拉出价值 10 万元的货物,并销赃平分。在本案中 (   ) 。","o":["甲构成贪污罪,乙构成盗窃罪","甲构成职务侵占罪,乙构成盗窃罪","甲、乙共同构成职务侵占罪","甲、乙共同构成贪污罪"],"a":"C","e":"职务侵占罪 \n]职务侵占罪是指公司、企 lk 或者其他单位的人员,利用职务上的便利,将本单位财 \n物非法占为已有,数额较大的行为。如果是国有公司中从事公务的人员实施侵占行为的,以 \n贪污罪论处。在本题中,甲为国有公司的聘用人员,并非公务人员,因此不能构成贪污罪。 \n甲和乙为共同犯罪,故答案为 C。","k":"分则·侵犯财产罪"},{"id":"2007-23","y":2007,"t":"多","s":"下列情形中,应以抢劫罪定罪处罚的有 (       ) 。","o":["甲为劫取财物,打死仓库的值班员孙某后,取走价值 10 万元的财物","乙在赵某的茶水中偷偷放入大量安眠药,趁赵某饮后熟睡,拿走赵某 3 万元现金","丙看见刘某因交通事故受伤,趁其昏迷之机,将其携带的现金 2 万元取走","丁乘张某不备,夺取其随身携带的笔记本电脑"],"a":"AB","e":"抢劫罪 \n]抢劫罪是指以非法占有为目的,对公私财产的所有人或管理人,当场使用暴力、胁迫 \n或者其他手段,迫使被害人交出财物或者将财物抢走的行为。打死值班员和放入安眠药都属 \n于抢劫罪所要求的强制性行为,故 A、B 项正确。而 C 项中丙属于秘密窃取,构成的是盗 \n窃罪,D 项中丁构成的是抢夺罪。","k":"分则·侵犯财产罪"},{"id":"2008-19","y":2008,"t":"单","s":"甲见候车室的椅子上坐着一女子和一男子,他们面前放着一手提箱,男子在睡觉,女子在看报。甲以为手提箱是 该男子 的,遂提一只相同的手提箱走上前去,将手提箱互换,被女子发现。手提箱实际上是该女子的,她一直在紧 盯着这只箱子。 箱内财物计人民币 4000 元。甲的行为构成(  )","o":["盗窃罪","诈骗罪","抢夺罪","侵占罪"],"a":"A","e":"解释]一般地,盗窃罪是指以秘密窃取的方法,将公私财物转移到自己或者第三人的控制之下而非法占有的\n行为。秘密窃取中的\"秘密\"具有相对性和主观性,即行为人采用自认为不被他人发觉的方法占有他人财物,即使\n客观上已被他人发觉或者注视,也不影响盗窃的性质。故题中甲的行为仍应当认定为盗窃罪。","k":"分则·侵犯财产罪"},{"id":"2008-20","y":2008,"t":"单","s":"甲为某市副市长,在代表该市到其他省、市进行招商引资活动中多次接受对方省、市赠送的礼品,价值 50 万元, 应当交 公而没有交公。甲的行为构成(  )。","o":["侵占罪","受贿罪","贪污罪","职务侵占罪"],"a":"C","e":"根据《刑法》第394 条,国家工作人员在国内公务活动或者对外交往中接受礼物,依照国家规定应当\n交公而不交公,数额较大的,依照贪污罪的规定定罪处罚。故本题应选C。 \n二、多项选择题","k":"分则·侵犯财产罪"},{"id":"2009-15","y":2009,"t":"单","s":"甲、乙二人共同盗窃一辆价值 20 万元的汽车销赃得款 6 万元,甲分得 5 万元,乙分得 l 万元。关于此案, 下列说 法中正确的是(   )。","o":["对甲、乙均应按照盗窃 20 万元处罚","对甲、乙均应按照盗窃 6 万元处罚","对甲按照盗窃 6 万元、乙按照盗窃 l 万元处罚","对甲按照盗窃 5 万元、乙按照盗窃 l 万元处罚"],"a":"A","e":"对盗窃最的量刑,应以盗窃财物的价值计算盗窃的数额,而不是以销赃所得额计算。因此本题的\n答案为A","k":"分则·侵犯财产罪"},{"id":"2011-18","y":2011,"t":"单","s":"甲因抢劫被公安机关追捕,逃至朋友乙家,对 乙说:“公安要抓我,想在你这里躲几天。”乙遂收留甲 在家。乙的行为构成( )。","o":["窝藏、包庇罪","包庇罪","窝藏罪","妨害公务罪"],"a":"C","e":"窝藏、包庇罪是一个选择性罪名。窝藏\n罪,是指为犯罪的人提供隐藏处所、财物,帮助其逃匿\n的行为。包庇罪,是指向司法机关提供虚假证明掩护\n犯罪人,强调向司法机关提供假证明。本题中,乙的\n行为是为甲提供隐蔽处所,并没有涉及向司法机关提\n供虚假证明的行为,所以乙构成窝藏罪,答案选C。","k":"分则·侵犯财产罪"},{"id":"2011-20","y":2011,"t":"单","s":"甲在商场看中一块价值2万元的手表,便以 选购手表为名,要售货员将手表拿来看看。甲在接到 售货员递过来的手表后立即逃走。甲的行为构成 ()","o":["抢夺罪","诈骗罪","侵占罪","盗窃罪"],"a":"A","e":"本题涉及侵犯财产犯罪中一些具体犯\n罪的区分。抢夺罪的行为强调公然夺取,即行为人明\n知被害人知情还当着被害人的面强行夺走财物。诈\n骗罪的情形是指行为人实施了欺骗行为而使对方陷\n入认识错误后,对方基于错误认识而自愿处分财产的\n行为。强调被害人基于认识错误而处分财产。侵占\n罪的行为包括三种情形:(1)基千委托关系由行为人\n占有财物,行为人后将该财物非法占为已有。(2) 非\n基于委托关系,而是偶然由行为人占有财物,行为人\n将其非法占为已有。(3) 行为人非法占有埋藏物的。\n侵占罪的行为包含一个从合法占有到非法占有的过\n程。盗窃罪强调秘密窃取,即行为人主观上自认为采\n用的是不使被害人发觉的方法取得并且占有公私财\n物的行为。本题中,甲在接到售货员递过来的手表\n后,便立即逃走,将其非法占有,明显符合公然夺取的\n特征,而与诈骗罪、侵占罪和盗窃罪的行为不符,成立\n抢夺罪,故答案为A。","k":"分则·侵犯财产罪"},{"id":"2012-17","y":2012,"t":"单","s":"甲以迷信方式恐吓刘某有灾祸,刘某一时慌 乱,请甲帮助自己。甲让刘某带10万元现金作 “ 镇邪 物 ”,找法师 ” 消灾 \"。途中,甲趁帮刘某拿包之机,用 书本调换了10万元现金。甲的行为构成( )。","o":["盗窃罪","诈骗罪","侵占罪","敲诈勒索罪"],"a":"A","e":"l\n本题中的行为是典型的调包行为,调包\n行为完全符合盗窃罪的犯罪构成,应当以盗窃罪论\n处。故选A。调包行为的知识点在千犯罪嫌疑人得\n到财物的方法主要是以不为他人知道的手段暗中窃\n取,而非他人自愿交出。这也是区分诈骗与盗窃的方\n法之一。","k":"分则·侵犯财产罪"},{"id":"2012-8","y":2012,"t":"单","s":"某村委会主任甲利用职务便利,将国家下拨的 扶贫款20万元用于炒股,后因亏损而无法归还。甲 的行为构成( )。","o":["贪污罪","挪用公款罪","挪用资金罪","职务侵占罪"],"a":"B","e":"根据司法解释的规定,村委会主任在管\n理经手国家的扶贫款项时,其身份以国家工作人员论\n处。再根据《刑法》第384条的规定,国家工作人员利\n用职务上的便利,挪用公款归个人使用,进行非法活\n动的,或者挪用公款数额较大、进行营利活动的,或者\n挪用公款数额较大、超过3个月未还的,是挪用公款\n罪。本题中甲将国家的扶贫款归其个人使用,并且长\n期不归还且在客观上无法归还,构成了挪用公款罪。\n故选B。(挪用公款罪是非常重要的罪名,在真题中\n已经多次考查。考生需注意挪用公款罪与挪用资金\n罪的区别,以及与贪污罪的区别。)","k":"分则·侵犯财产罪"},{"id":"2013-8","y":2013,"t":"单","s":"2000年3月1日,甲因犯盗窃罪被公安机关立 案侦查后逃往外地。甲又因在2009年9月7日犯抢 劫罪,于2010年6月7日被抓获。甲所犯盗窃罪的追 诉期限()。","o":["不受限制","应从2000年3月1日起计算","应从2009年9月7日起计算","应从2010年6月7日起计算"],"a":"A","e":"我国《刑法》第89条规定,\"追诉期限\n从犯罪之日起计算;犯罪行为有连续或者继续状态\n的,从犯罪行为终了之日起计算。\n\" 而《刑法》第88条\n又同时规定:\n\" 在人民检察院、公安机关、国家安全机\n关立案侦查或者在人民法院受理案件以后,逃避侦查\n或者审判的,不受追诉期限的限制。\n\" 本题中,甲犯盗\n窃罪,在公安机关立案侦查后潜逃,依据《刑法》第88\n条的规定,不受追诉期限的限制。故答案选A。","k":"分则·侵犯财产罪"},{"id":"2014-16","y":2014,"t":"单","s":"甲路过某饭馆时见万某酪配大醉,便冒充万 某的朋友上前将其扶走,到一偏僻的地方后,将万某 随身携带的价值5000元的财物全部取走。甲的行为 构成()。","o":["盗窃罪","诈骗罪","侵占罪","抢劫罪"],"a":"A","e":"本题考查的是盗窃罪和抢劫罪、诈骗\n罪侵占罪的区别。所谓盗窃,是指以非法占有为目\n的,秘密盗窃公私财物数额较大,或者多次盗窃、入户\n盗窃携带凶器盗窃、扒窃的行为;抢劫罪是指以非法\n占有为目的,当场使用暴力威胁或其他方法强行劫取\n财物的行为;诈骗罪是指以非法占有为目的,用虚构\n事实或隐藏真相的手段骗取数额较大的公私财物的\n行为;侵占罪是指以非法占有为目的,将代为保管的\n他人财物或者遗忘物、埋藏物非法占为已有,数额较\n大的行为。本题中,甲趁万某酪酐大醉之时将其随身\n携带的财物秘密窃取,并无使用暴力或进行欺诈,因\n此其行为构成盗窃罪。","k":"分则·侵犯财产罪"},{"id":"2015-18","y":2015,"t":"单","s":"甲冒充公安干警,将正在赌博的张某等四人 用手住,拿走其赌资及随身携带的财物2万余 )。 元。甲的行为应认定为(","o":["诈骗罪","抢劫罪","招摇撞骗罪","敲诈勒索罪"],"a":"B","e":"根据司法解释的规定,行为人冒充正在\n执行公务的人民警察\n\"抓赌\n\"\"抓嫖\n\",没收赌资或者\n罚款的行为,构成犯罪的,以招摇撞骗罪从重处罚;在\n实施上述行为中使用暴力或者暴力威胁的,以抢劫罪\n定罪处罚。行为人冒充治安联防队员\n\" 抓赌\n\" \" 抓\n嫖\n\"、没收赌资或者罚款的行为,构成犯罪的,以敲诈\n勒索罪定罪处罚;在实施上述行为中使用暴力或者暴\n力威胁的,以抢劫罪定罪处罚。本题中,甲为了劫取\n张某等四人的财产,冒充公安千警,当场将正在赌博\n的张某等四人用手铸铸住,使用暴力,强行劫取四人\n财产,因此甲的行为构成抢劫罪,B选项正确,ACD选\n项错误。","k":"分则·侵犯财产罪"},{"id":"2015-4","y":2015,"t":"单","s":"甲涉嫌犯聚众斗殴罪,在2010年8月9日被 抓捕时逃跑。2014年6月5日,甲抢夺他人财物,数 额特别巨大。下列选项中,正确的是()。","o":["甲所犯抢夺罪的追诉期限为5年","甲所犯聚众斗殴罪因其逃跑而不受追诉期限 的限制","甲所犯聚众斗殴罪的追诉期限从2010年8月 9日起计算","甲所犯聚众斗殴罪的追诉期限从2014年6月 5日起计算"],"a":"B","e":"本题考查的是对犯罪时效延长的理解,\n所谓时效延长,是指在追诉期限内,因发生法定事由\n而使追究犯罪人的刑事责任不受追诉期限制的制度。\n《刑法》第88条第1款规定:\"在人民检察院、公安机\n关、国家安全机关立案侦查或者在人民法院受理案件\n以后,逃避侦查或者审判的,不受追诉期限的限制。\"\n也就是说,在司法机关立案侦查或者受理案件以后,\n犯罪分子逃避侦查或者审判的,不受追诉期限的限\n制。甲涉嫌犯聚众斗殴罪,在被抓捕时逃跑,即甲在\n司法机关立案侦查以后逃避侦查或者审判,所以甲所\n犯聚众斗殴罪不受追诉期限的限制,B 正确,ACD\n错误。","k":"分则·侵犯财产罪"},{"id":"2015-6","y":2015,"t":"单","s":"关于故意的认识内容,下列选项中正确的是 )。","o":["成立受贿罪,要求行为人认识到自已是国家 ·工作人员","成立聚众淫乱罪,要求行为人认识到自已行为 的违法性 2015年全国法律硕士(非法学)联考真题","成立故意毁坏财物罪,要求行为人认识到毁坏 财物的数额较大","成立传播淫秽物品罪,要求行为人认识到传 播的是淫秽物品"],"a":"D","e":"本题考查的是对故意的认识的理解,所\n谓认识因素,就是行为人明知自己的行为会发生危害\n社会的结果。\"明知\n\"的范围包括:(1)对犯罪构成事\n实所属情况的认识;(2)对行为及其结果具有社会危\n害性的认识。认识到自己是国家工作人员、自己行为\n的违法性和毁坏财物的数额等都不属于\n\" 明知\n\" 的范\n围,ABC选项错误。D选项中行为人认识到传播的是\n淫秽物品是行为人对犯罪构成事实所属情况的认识,\n属于\n\" 明知\n\",是成立传播淫秽物品罪的构成要件之\n-,D选项正确。","k":"分则·侵犯财产罪"},{"id":"2015-9","y":2015,"t":"单","s":"某私营健身机构经理安排会计甲将收取的50 万元会员费存人甲的存折,供单位日常开支。三个月后, 甲取走存折中全部资金潜逃。甲的行为构成( ()。","o":["盗窃罪","职务侵占罪","侵占罪","挪用资金罪"],"a":"B","e":"本题考查的是职务侵占罪的构成要件。\n所谓职务侵占罪,是指公司、企业或者其他单位的工\n作人员,利用职务上的便利,将本单位财物非法占有,\n数额较大的行为。本案中,甲作为私营健身机构的会\n计,利用可以随意支取自己存折中用于单位日常开支\n资金的便利条件,将存折里公司的资金取走并潜逃,\n成立职务侵占罪,B选项正确。盗窃罪不要求利用职\n务便利,A选项错误。侵占罪的犯罪对象是代为保管\n的他人财物、遗忘物、埋藏物,本题的犯罪对象是单位\n的资金,不符合侵占罪的犯罪构成,C选项错误。挪\n用资金罪只是挪用一段时间,最终是会归还的,不具\n有非法占有的目的,但是本题中甲携款潜逃,具有非\n法占有的目的,故不成立挪用资金罪,D选项错误。","k":"分则·侵犯财产罪"},{"id":"2016-17","y":2016,"t":"单","s":"下列表述中,符合我国刑法关于盗窃罪规定 的是()。","o":["在长途汽车上显露匕首后窃取财物的,属于 携带凶器盗窃","在公共场所窃取他人所穿衣服口袋内财物的, 属于扒窃","一年之内在公共场所扒窃两次的,属于多次 盗窃","进人宾馆客房窃取财物的,属于人户盗窃"],"a":"B","e":"根据《最高人民法院、最高人民检察院\n关千办理盗窃刑事案件适用法律若干问题的解释》的\n规定,二年内盗窃三次以上的,应当认定为\n\" 多次盗\n窃\n\"。非法进入供他人家庭生活,与外界相对隔离的\n住所盗窃的,应当认定为\n\" 入户盗窃\n\"。携带枪支、爆\n炸物、管制刀具等国家禁止个人携带的器械盗窃,或\n者为了实施违法犯罪携带其他足以危害他人人身安\n全的器械盗窃的,应当认定为\n\"携带凶器盗窃\n\"。在公\n共场所或者公共交通工具上盗窃他人随身携带的财\n物的,应当认定为\n\"扒窃\"。\n\"携带凶器盗窃\n\",必须是不显露凶器。行为人将\n随身携带凶器有意加以显示、能为被害人察觉到的,\n直接适用刑法第263条的规定以抢劫罪定罪处罚,所\n以不选A。在公共场所窃取他人所穿衣服口袋内财\n物,是盗窃他人随身携带的财物,属于\n\"扒窃\n\",所以\n选B。多次盗窃是二年内盗窃三次以上,所以不选\nC。宾馆客房不是供他人家庭生活的,不属于\n\" 户\n\" ,\n进入宾馆客房盗窃的,不是\n\" 入户盗窃\n\",所以不\n选D。","k":"分则·侵犯财产罪"},{"id":"2016-43","y":2016,"t":"多","s":"下列选项中,应以故意毁坏财物罪定罪处罚 的有()。","o":["甲发现所盗手表是仿制品,将其丢弃","乙偷开朋友的摩托车,导致车辆丢失","丙为泄愤,将多辆大货车中的柴油偷偷放掉","丁到某办公室盗窃时未发现现金,遂砸毁办 公室内多台电脑"],"a":"CD","e":"故意毁坏财物罪是指故意毁灭或者损\n坏公私财物,数额较大或者情节严重的行为。\nA选项中,甲对所盗手表的处分,是盗窃罪的事\n后不可罚行为,甲将其出售也好,毁灭也好,丢弃也\n好,都不再另外成立他罪。对甲的行为,应当以盗窃\n罪定罪处罚。B选项中,乙只有偷开摩托车的故意,\n没有毁坏财物的故意,乙因为过失导致车辆丢失,不\n成立故意毁坏财物罪。C选项中,丙故意将柴油偷偷\n放掉,对于柴油所有人来说,丙的行为造成其所有物\n的毁灭,故丙成立故意毁坏财物罪。D选项中,丁砸\n毁办公室多台电脑,故意毁坏办公室财物,成立故意\n毁坏财物罪。","k":"分则·侵犯财产罪"},{"id":"2016-6","y":2016,"t":"单","s":"2014年6月20日,甲持枪抢劫后逃至外地。 同年11月8日,甲因琐事将他人殴打成重伤。对甲 的抢劫犯罪()。","o":["经过20年一般不再追诉","从2014年6月20日起计算追诉期限","因为甲逃避侦查,其追诉期限不受限制","如果20年后认为必须追诉的,报请公安部 核准"],"a":"A","e":"根据刑法第263 条的规定,持枪抢劫的\n最高法定刑为死刑。根据刑法第87 条的规定,法定\n最高刑为死刑的,经过20 年,不再追诉。甲2014 年6\n月20 日,持枪抢劫,法定最高刑为死刑,经过20 年\n后,一般不再追诉,选A。\n甲持枪抢劫后,又在追诉期内犯故意伤害罪,即\n在追诉期内又犯新罪,根据刑法第89条的规定,抢劫\n罪的追诉期限从犯后罪之日起计算,即从2014 年11\n月8日开始计算,B选项错误。\n刑法第88 条规定:在人民检察院、公安机关、国\n家安全机关立案侦查或者在人民法院受理案件以后,\n逃避侦查或者审判的,不受追诉期限的限制。甲持枪\n抢劫后即逃到外地,题干并没有表明甲是在公安机关\n立案侦查之后逃走的,所以不选C。\n根据刑法第87 条的规定,最高法定刑为无期徒\n刑、死刑,如果二十年以后认为必须追诉的,须报请最\n高人民检察院核准。不是报公安部核准。所以不\n选D。","k":"分则·侵犯财产罪"},{"id":"2017-45","y":2017,"t":"多","s":"下列选项中,应认定为诈骗罪的有( )。","o":["甲伪造名画,冒充真迹卖给他人","乙设立赌博网站,招揽小学生参与赌博","丙用冰糖冒充冰毒卖给他人,获利4000元 )","丁用短信将邻居从家中骗出,趁机进人邻居 家拿走1万元现金"],"a":"AC","e":"诈骗罪是指以非法占有为目的,用虚构\n事实或者隐瞒真相的方法,骗取数额较大的公私财物\n的行为。A项中甲伪造名画,虚构膺品为真品的事\n实,将假画卖给他人,骗取他人数额较大的公私财物,\n成立诈骗罪,A项正确。C项中丙将冰糖冒充冰毒卖\n给他人,是虚构冰糖为冰毒的事实,骗取他人数额较\n大的公私财物,成立诈骗罪,C项正确。根据司法解\n释的规定,以营利为目的,在计算机网络上建立赌博\n网站,或者为赌博网站担任代理,接受投注的,构成开\n设赌场罪,B项中设立赌博网站的行为成立开设赌场\n罪,不成立诈骗罪,B项错误。D项中甲将邻居从家\n中骗出,然后进入邻居家拿走现金的行为成立盗窃\n罪,因为丁以非法占有为目的,入户盗窃。盗窃罪与\n诈骗罪的关键区别在于被害人是否基于错误认识而\n\n处分财产,邻居并没有处分财产的行为。丁不成立诈\n骗罪,D项错误。","k":"分则·侵犯财产罪"},{"id":"2018-17","y":2018,"t":"单","s":"得高档手机,边打电话边向候车室外移动,出门后拔 腿就跑,已经有所警觉的赵某猛追未果。甲的行为认 定为( )。","o":["抢夺罪","盗窃罪","侵占罪","抢劫罪"],"a":"B","e":"抢夺罪需要有趁人不备,公开夺取数额\n较大的公私财物的行为,本案中,甲不符合公开夺取,\n\nA错误;侵占罪的犯罪对象是代为保管的他人财物、\n遗忘物埋藏物,本题的犯罪对象不属于侵占罪的犯\n罪对象,C项错误;抢劫罪,当场使用暴力、胁迫或其\n他方法,本题不是使用暴力压制被害人的反抗取得手\n机,因此不是抢劫罪,D项错误。甲在物主在场的情\n况下,将他人财物转移到自己控制之下,数额较大,构\n成盗窃罪。","k":"分则·侵犯财产罪"},{"id":"2018-3","y":2018,"t":"单","s":"下列情形,应当认定为是入户抢劫的是( )。","o":["甲冒充煤气抄表员进人受害人家中实施抢劫","客户服务员乙进入客人入住的酒店房间实施 抢劫","丙入户盗窃后将追赶的失主在公寓楼道内打 成重伤","丁在房屋中介人员带领其进入他人居住的出 租房内查看时发现贵重财物,实施抢劫"],"a":"A","e":"人户抢劫是指为实施抢劫行为而进人\n他人生活的与外界相对隔离的住所,进行抢劫的行\n为。根据相关司法解释,人户抢劫包括典型的入户抢\n劫和转化型入户抢劫两种情形,前者是先形成抢劫的\n犯罪故意,然后进入\n\" 户\n\"内进行抢劫,而后者是先形\n成入户盗窃的犯罪故意,然后在户内盗窃过程中为窝\n藏赃物、抗拒抓捕或者毁灭罪证而当场使用暴力或以\n暴力相威胁,需要注意转化型入户抢劫的暴力或者威\n胁行为应当发生在\n\" 户\n\"内。户是与外界相对隔绝的\n用于生活居住的地方,酒店房间不属千户,B错误;C\n属于转化型抢劫,盗窃之后,为抗拒抓捕而当场实施\n暴力将人打成重伤,但是丙将失主打成重伤的行为发\n生在楼道内,而不是公寓内,因此不是人户抢劫,C错\n误;D 属于通过正当渠道进入户后,才产生犯罪意图,\n不属于人户抢劫。因此,综上所述A符合题目条件。","k":"分则·侵犯财产罪"},{"id":"2018-6","y":2018,"t":"单","s":"下列选项中,应认定为敲诈勒索罪的是( )。","o":["冒充人民警察敲诈他人巨额财物","敲诈勒索亲属财物但获得对方谅解","以在网上发帖相要挟获得职务晋升","以公开不雅视频相要挟向他人借巨款后无力 偿还"],"a":"A","e":"敲诈勒索亲属财物但获得对方谅解一\n般不认为是犯罪;敲诈勒索罪要求非法占有他人财物\n为目的,获得职务晋升不满足法定目的要求;借巨款\n也不满足非法占有他人财物的法定目的要求,因为是\n借而不是非法占有,借钱需要还,其最终无力偿还是\n客观不能,而不是主观不想;冒充人民警察敲诈他人\n巨额财物,满足敲诈勒索罪的构成要件,因此选A。","k":"分则·侵犯财产罪"},{"id":"2018-9","y":2018,"t":"单","s":"乙的行为应认定为( )。","o":["诈骗罪","贪污罪","受贿罪","职务侵占罪"],"a":"C","e":"国家工作人员乙利用职务便利收受贿\n赂,为他人谋取了不正当利益,符合受贿罪的构成\n特征。\n[特别说明]\n关于职务侵占罪,《刑法修正案\n(十一)》将职务侵占罪的最高刑从15年有期徒刑提\n高到了无期徒刑。司法考试中某年的案例分析题与\n本题相似,该题的答案认为甲乙合谋,骗取了国家的\n征收补偿款,是共谋贪污的行为,是国家工作人员与\n非国家工作人员合伙贪污,因此甲乙均成立贪污罪。\n本题的官方权威答案为C,受贿罪。","k":"分则·侵犯财产罪"},{"id":"2019-8","y":2019,"t":"单","s":"交通协管员甲以真实身份从多名请托人处收 受巨额财物,后向与之关系密切的某交警“打招呼”, 让其对请托人的违章行为减免处罚。甲的行为应认 定为()。","o":["诈骗罪","受贿罪","职务侵占罪","利用影响力受贿罪"],"a":"D","e":"利用影响力受贿罪是指国家机关工作\n人员的近亲属或者其他与该国家工作人员关系密切\n的人,通过该国家工作人员职务上的行为,或者利用\n该国家工作人员职权或者地位形成的便利条件,通过\n其他国家工作人员职务上的行为,为请托人谋取不正\n当利益,索取请托人或者收受请托人财物,数额较大\n或者有其他较重情节的行为,或者离职的国家工作人\n员或者其近亲属以及与其关系密切的人,利用该离职\n的国家工作人员原职权或者地位形成的便利条件,通\n过其他国家工作人员职务上的行为,为请托人谋取不\n正当利益,索取或者收受请托人财物,数额较大或者\n有其他较重情节的行为。本题中,甲是与某交警关系\n密切的人,通过某交警处理违章的职务行为,为请托\n人谋取不正当利益,收受请托人财物,数额巨大,符合\n利用影响力受贿罪的构成要件。D项正确。本题必\n须注意,甲仅仅是交通协管员,并非国家机关工作人\n员,C不选。本题中甲也没有虚构事实或隐瞒真相,\n骗取钱财的行为,故A不选。受贿罪的主体一般是国\n家工作人员,而甲并不满足该身份要件,故不选择B。","k":"分则·侵犯财产罪"},{"id":"2020-17","y":2020,"t":"单","s":"甲从王某处借得一辆价值10万元的竞赛用 自行车,因急需用钱,甲将该车质押给典当行,得款6 万元。在王某索要时,甲无力赎回该车,又向李某借 得一辆价值15万元的竞赛用自行车,将该车质押给 同一典当行,得款10万元后赎回王某的自行车。甲 将自行车交还给王某后潜逃,导致李某的自行车质押 期满未赎。甲诈骗的金额为()。","o":["6万元","10万元","15万元","25万元"],"a":"C","e":"诈骗罪是指以非法占有为目的,用虚构\n事实或者隐瞒真相的方法,骗取数额较大的公私财物\n的行为。甲从王某处借自行车,因急需用钱将车质\n押,此时甲没有非法占有的目的,不属于诈骗行为。\n在王某索要自行车时,甲已经无力赎回,却又向李某\n借车质押给典当行,甲此时具有非法占用的目的,属\n千诈骗行为。诈骗的金额是以诈骗财物的市场价值\n来计算,所以本题中甲的诈骗金额为15万元。","k":"分则·侵犯财产罪"},{"id":"2021-16","y":2021,"t":"单","s":"甲偷割使用中的高速公路紧急信息警示屏的 电源线,价值5000元。甲的行为应认定为()","o":["故意毁坏财物罪","破坏交通设施罪","盗窃罪","破坏交通工具罪"],"a":"B","e":"高速公路紧急信息警示屏属于交通设\n施,甲的行为构成破坏交通设施罪。电源线价值\n5 000元,甲的行为同时构成盗窃罪。甲一个犯罪行\n为同时触犯两个罪名,是想象竞合犯,择一重罪处罚,\n应认定为破坏交通设施罪,B项正确。","k":"分则·侵犯财产罪"},{"id":"2024-6","y":2024,"t":"单","s":"甲潜入某制衣公司,盗得笔记本电脑一台,以3800元出售。事后查明该电脑价值 3000元,内装价值3万元的服装制图软件系统,甲的盗窃数额应认定为()","o":["3000元","3800元","33000元","33800元 2024年全国法律硕士(非法学)联考真题试卷丨专业基础课"],"a":"C","e":"","k":"分则·侵犯财产罪"},{"id":"2025-17","y":2025,"t":"单","s":"国有公司负责人甲利用职务之便,与某律师事务所合谋虚增公司的律师服务费,收受 该律师事务所给予的服务费差价100 万元。甲的行为应认定为( )","o":["诈骗罪","贪污罪","受贿罪","职务侵占罪"],"a":"B","e":"贪污罪是指国家工作人员利用职务上的便利,侵吞、窃取、骗取或者以其他手段\n非法占有公共财物的行为。甲是国有公司负责人,是国家工作人员,其与非国家工作人员勾结,\n虚增律师服务费,通过骗取的手段非法占有公共财物,甲构成贪污罪,B 项正确,AC 项错误。\n职务侵占罪的犯罪主体是非国家工作人员,D 项错误。本题选B。","k":"分则·侵犯财产罪"},{"id":"2025-3","y":2025,"t":"单","s":"甲组织、聚集多人“打砸抢”,导致公共财物大量毁损。甲的行为应认定为( )","o":["抢劫罪","寻衅滋事罪","故意毁坏财物罪","聚众扰乱社会秩序罪"],"a":"A","e":"《刑法》第289 条规定:\"聚众打砸抢,致人伤残、死亡的,依照本法第二百三十\n四条、第二百三十二条的规定定罪处罚。毁坏或者抢走公私财物的,除判令退赔外,对首要分\n子,依照本法第二百六十三条的规定定罪处罚。\"本题中,甲是首要分子,聚众打砸抢,毁坏\n公私财物,因此应按照刑法的规定认定为抢劫罪。因此本题选A,BCD 项错误。","k":"分则·侵犯财产罪"},{"id":"2026-18","y":2026,"t":"单","s":"甲的行为应认定为","o":["侵占罪","诈骗罪","招摇撞骗罪","虚假诉讼罪"],"a":"B","e":"甲伪造律师身份、谎称认识法官,虚构事实骗取律师费,成立诈骗罪;\nA 侵占是合法占有后拒不返还;C 招摇撞骗需冒充国家机关工作人员;D 无虚假诉\n讼行为。","k":"分则·侵犯财产罪"}]},{"sub":"刑法","name":"犯罪主体","w":1.8,"L":31,"qs":[{"id":"2005-20","y":2005,"t":"单","s":"下列哪一选项最恰当地指明了伪证罪的主体范围(   )","o":["证人","证人、鉴定人","证人、鉴定人、记录人","证人、鉴定人、记录人、翻译人"],"a":"D","e":"伪证罪,是指在刑事诉讼中,证人、鉴定人、记录人、翻译人对与案件有重要关系的情节,故意作\n- 8 -\n\n \n \n更多考研精品资料,关注淘宝店铺:光速考研工作室 \n虚假证明、鉴定、记录、翻译,意图陷害他人或者隐匿罪证的行为。伪证罪的主体包括刑事诉讼中的证人、鉴定人、\n记录人、翻译人。 \n二、多项选择题","k":"犯罪主体"},{"id":"2005-5","y":2005,"t":"单","s":"尚未完全丧失辨认或者控制能力的精神病人,实施严重危害社会行为的(   )","o":["不负刑事责任","应当负刑事责任,但应当减轻或者免除处罚","应当负完全的刑事责任","应当负刑事责任,但可以从轻或者减轻处罚"],"a":"D","e":"刑法第18 条第3 款规定,尚未完全丧失辨认或者控制自己行为能力的精神病人犯罪的,应当负刑事\n责任,但是可以从轻或者减轻处罚。据此,选项D 应选。","k":"犯罪主体"},{"id":"2006-22","y":2006,"t":"多","s":"列表述中,正确的是(       )","o":["甲盗走铁路上钢轨 10 米,因铁路巡道员发现钢轨被盗,采取紧急措施,才避免了火车颠覆事故的发生。对甲 按照破 坏交通设施罪的既遂适用法律","乙为一 15 周岁的未成年人,绑架他人作为人质后,因勒索财物未成而杀害被绑架人,应当追究乙的刑事责任","丙是某国有仓库保管员,利用职务之便,盗窃其保管的物资价值 2 万元。后听说单位要来盘点物资,担心事发, 遂将所盗物资送回仓库,丙的行为成立犯罪中止","丁设立一家公司,专门用于虚开增殖税专用发票,谋取非法利益。对此虚开增殖税专用发票的行为,应当按照 自然人犯罪处理"],"a":"ABD","e":"破坏交通设施罪是危险犯;盗窃罪是结果犯,构成既遂后就不能再构成犯罪中止,至于其返还赃物\n可做为量刑情节。","k":"犯罪主体"},{"id":"2008-24","y":2008,"t":"多","s":"下列选项中,应当以单位犯罪处罚的有(     )","o":["某有公司明知他人进行走私,为其提供贷款的","某有限责任公司领导层为了单位利益,集体决定走私假币的","自然人投资设立有限责任公司后,该公司以实施走私为主要活动的","自然人以走私石油为目的注册有限责任公司后,该公司大量走私石油的"],"a":"AB","e":"以单位犯罪处罚的犯罪,往往是以单位名义,为单位利益,由单位决策机构集体决定实施,并且必\n须是刑法分则规定作为单位犯罪处理的犯罪。根据《刑法》第156 条,与走私犯罪通谋,为其提供贷款、资金、账\n号、发票、证明,或者为其提供运输、保管、邮寄或者其他方便的,以走私罪的共犯论处。而走私罪的犯罪主体依\n法?(《刑法》第151 条第5 款、第152 条第3 霗、第153 条第2 款)可以是单位,故选项A 应选。选项B 该有限\n责任公司构成走私假币罪,《刑法》第151 条第4 款规定,单位可以作为走私假币罪的主体,故选项B 应选。根据\n《最高人民法院关于审理单位犯罪案件具体应用法律有关问题的解释》第2 条,个人为进行违法犯罪活动而设立后,\n以实施犯罪为主要活动的,不以单位犯罪论处。因此,选项C、D 不以单位犯罪处罚。","k":"犯罪主体"},{"id":"2008-4","y":2008,"t":"单","s":"间歇性精神病人在不能辨认或者不能控制自己行为时,实施严重危害社会行为的(  )","o":["应当负刑事责任","不负刑事责任","应当负刑事责任,但可以减轻或者免除处罚","待治疗痊愈后再追究刑事责任"],"a":"B","e":"根据《宪法》第18 条第1 款,精神病人在不能辨认或者不能控制自己行为的时候造成危害结果,经法\n定程序鉴定确认的,不负刑事责任。据此本题应选B。","k":"犯罪主体"},{"id":"2009-24","y":2009,"t":"多","s":"下列犯罪中.属于特殊主体犯罪的有(      )。","o":["贪污罪","非法行医罪","私放在押人员罪","滥用职权罪"],"a":"ACD","e":"本题考查特殊犯罪主体。根据《刑法》第382 条,国家工作人员利用职务上的便利,侵吞、盗\n窃、骗取或者以其他手段非法占有公共财物的,是贪污罪。可见,贪污罪的额主体特殊主体。A 选项正确。依第336\n条规定,未取得医生职业资格的 人非法行医,情节严重的,构成非法行医罪。可见非法行医最的主体温为一般主体。\nB 选项错误。依第400 条,司法工作人呢元司私放在也的发展嫌疑人、被告人或者罪犯的,构成私放在押人员最。\n私放在押人员罪的主体是司法工作人员,C 选项正确。依第397 条,国家机关工作人员滥用职权,致使公共财产、\n国家和人民利益遭受重大损失的,构成滥用职权罪。滥用职权罪的主体为国家机关工作人员,D 选项正确。因此本\n题答案为A、C、D。 \n- 9 -\n\n \n \n更多考研精品资料,关注淘宝店铺:光速考研工作室","k":"犯罪主体"},{"id":"2009-6","y":2009,"t":"单","s":"下列关于单位犯罪的表述中,错误的是(   )。","o":["法律明文规定单位可以成为犯罪主体的犯罪才能成为单位犯罪","单位犯罪中的单位不包括几个自然人投资设立的有限责任公司","高等院校也可以成为单位犯罪的主体","对单位犯罪的两罚制是既处罚单位又处罚直接负责的主管人员和其他直接负责人员"],"a":"D","e":"本题考查单位犯罪,《刑法》第30 条规定,公司、企业、事业单位、机关、团体实施的危害社会\n的行为,法律规定为单位犯罪的,应当负刑事责任。A 选项正确。只要是公司就可以作为单位犯罪的主体,B 选项错\n误,高等院校属于事业单位,可以成为单位犯罪的主体。C 选项正确。第31 条规定,单位犯罪的,对单位判处罚金, 并\n对其直接负责的主管人员和其他直接负责的责任人员 判处处罚。D 选项正确。因此本题答案为B","k":"犯罪主体"},{"id":"2009-9","y":2009,"t":"单","s":"下列关于紧急避险的表述中,正确的是(   )。","o":["紧急避险的前提条件是出现了不法侵害以外的危险","紧急避险必须在迫不得已的情况下才能实施","紧急避险所造成的损害可以小于或者等于所保护的利益","紧急避险与正当防卫的主体范围一致"],"a":"B","e":"本题考查紧急避险。紧急避险是指为了使国家、公共利益、本人或者他人的人身、财产和其他权利免\n受正在发生的危害,不得已而采取的损伤另一较小合法权益的行为。紧急避险必须是合法利益正在受到侵害时才能\n实施,A 选项错误。紧急避险的限制条件是出于迫不得已,B 选项正确。紧急避险的本质在于,当两个合法利益相冲\n突,又不能两全的紧急状态下,法律允许为了保全较大的权益而牺牲较小的权益。C 选项错误。正当防卫,是指为\n了使国家、公共利益、本人或者他人的人身、财产和其他权利免受正在进行的不法侵害,而采取的旨在制止不法侵\n害而对不法侵害人造成未明显超过必要限度损害的行为。可见,紧急避险和正当防卫的正对对象不同。D 选项错误。\n因此本题答案为B","k":"犯罪主体"},{"id":"2011-17","y":2011,"t":"单","s":"关于处理未成年人犯罪案件,下列表述中正 确的是()。","o":["对未成年人罪犯不得判处罚金","对罪行极其严重的未成年人罪犯,可以适用无 期徒刑","对犯罪时不满18周岁的罪犯,应当减轻或者 免除处罚","对罪行极其严重的未成年人罪犯,可以判处 死刑缓期二年执行"],"a":"B","e":"罚金是附加刑的一种,司法解释规定对\n未成年人犯罪判处罚金时,应当依法从轻或者减轻处\n罚,并根据犯罪情节,综合考虑其缴纳罚金的能力,确\n定罚金数额,但罚金数额最低不得少于500元。《刑\n\n法》规定,已满14 周岁不满18 周岁的人犯罪的,应当\n从轻或减轻处罚,故C 选项错误。《刑法》对死刑适\n用对象进行了限制,规定犯罪时不满18 周岁的人和\n审判时怀孕的妇女,不适用死刑。另外,《刑法修正案\n(八)》规定审判的时候已满75 周岁的人,不适用死\n刑,但以特别残忍手段致人死亡的除外。死缓只是死\n刑的一种执行方式,对千不能适用死刑的人,自然包\n含了其不能适用死缓的意思。于是D 选项错误。对\n未成年人,司法解释明确规定了未成年人犯罪只有罪\n行极其严重的,才可以适用无期徒刑,故答案为B。","k":"犯罪主体"},{"id":"2011-43","y":2011,"t":"多","s":"下列人员中,可以成为逃脱罪主体的有","o":["依法被判处管制的罪犯","依法被关押的罪犯","依法被关押的被告人","依法被关押的犯罪嫌疑人"],"a":"BCD","e":"脱逃罪是指依法被关押的罪犯、被告\n人犯罪嫌疑人逃脱司法机关羁押和监管的行为。这\n里主要强调脱逃罪的主体必须是被\n\" 依法关押的\n\",判\n处管制的犯罪分子并没有被司法机关予以关押,故不\n能成为脱逃罪的主体,答案选BCD。同时还应注意对\n确属错拘、错捕、错判而逃离羁押场所的,不能将其认\n定为脱逃罪。","k":"犯罪主体"},{"id":"2012-6","y":2012,"t":"单","s":"下列关于处理未成年人犯罪的表述,正确的是","o":["对不满18周岁的犯罪人不得适用没收财产刑","对犯罪时不满18周岁的人,应当减轻或者免 除处罚","对罪行极其严重的未成年人罪犯,可以适用无 期徒刑","对未成年人因犯抢劫、绑架等暴力犯罪被判 处有期徒刑的,均可假释"],"a":"C","e":"《刑法》第17条第3款规定,未满18周\n岁的人犯罪的应当从轻或者减轻处罚。《刑法》第49\n条第1款规定,犯罪的时候不满18周岁的人和审判\n的时候怀孕的妇女,不适用死刑。《刑法》第65条规\n定,被判处有期徒刑以上刑罚的犯罪分子,刑罚执行\n完毕或者赦免以后,在5年以内再犯应当判处有期徒\n刑以上刑罚之罪的,是累犯,应当从重处罚,但是过失\n犯罪和不满18周岁的人犯罪的除外。由此可见,刑\n法对于未成年人的死刑适用,量刑幅度的适用和累犯\n的规定方面均有明确规定,但在假释上并没有特殊规\n定。暴力犯罪被判处10年以上有期徒刑和更重刑罚\n的未成年人一样不可假释。D错误。对不满18周岁\n的犯罪人也可以适用没收财产刑。A错误。而且对\n于未成年人犯罪,尤期徒刑是可以适用的,故本题答\n案为C。","k":"犯罪主体"},{"id":"2013-18","y":2013,"t":"单","s":"甲公司的董事长乙,指使公司经理丙欺骗银 行,使公司获得贷款800万元用于经营。但因经营不 善,造成银行500万元贷款无法收回。关于本案,下 列选项中正确的是()。","o":["甲公司、乙、丙构成共同犯罪,乙是主犯","甲公司构成单位犯罪,乙与丙构成共同犯罪","甲公司不构成犯罪,乙与丙构成共同犯罪","甲公司构成单位犯罪,乙与丙是单位犯罪中 的直接责任人员"],"a":"D","e":"本题主要考查的是骗取贷款罪和贷款\n诈骗罪的区别。甲公司的董事长乙指使丙骗取银行\n贷款的行为属千贷款诈骗罪还是骗取贷款罪?因为\n贷款诈骗罪的主体只能是自然人,若成立贷款诈骗\n罪,则单位不构成犯罪,直接负责的自然人构成犯罪;\n若成立骗取贷款罪,则单位可以成为犯罪主体。由题\n目又可以得知,骗得的贷款用于公司经营,只是因为\n经营不善而无法归还,并不是以非法占有为目的,所\n以缺乏成立贷款诈骗罪的犯罪故意,故排除贷款诈骗\n罪,成立骗取贷款罪,甲公司成立单位犯罪。因此答\n案为D。","k":"犯罪主体"},{"id":"2013-42","y":2013,"t":"多","s":"下列选项中,符合刑法关于未成年人刑事责 任规定的有()。","o":["未成年人犯罪不构成累犯","未成年人犯罪符合缓刑条件的应当宣告缓刑","未成年人犯罪都应当从轻或者减轻处罚","未成年人犯罪的可适用死刑缓期二年执行"],"a":"ABC","e":"根据我国《刑法》和相关司法解释,对\n未成年人犯罪有诸多特殊的宽待原则:在我国死刑的\n适用中明确规定,犯罪时未满18 周岁的,不适用死\n刑。所以未成年人并不能适用死刑。除了《刑法》规\n定\n\" 应当\n\"附加剥夺政治权利外,对未成年罪犯一般不\n判处附加剥夺政治权利。如果对未成年罪犯判处附\n加剥夺政治权利的,应当依法从轻判处。未成年人犯\n罪,只有罪行极其严重的,才适用无期徒刑。对未成\n年罪犯实施刑法规定的\n\"并处\n\" 没收财产或者罚金的\n犯罪,应当依法判处相应的财产刑;对于未成年罪犯\n实施刑法规定的\n\" 可以并处\n\" 没收财产或者罚金的犯\n罪,一般不判处财产刑。对千未成年罪犯判处罚金\n时,应当依法从轻或者减轻处罚。对千符合管制、缓\n刑、单处罚金或者免予刑事处罚适用条件的未成年罪\n犯,应当依法适用管制、缓刑、单处罚金或者免予刑事\n处罚。对千未成年人犯罪,应当从轻或者减轻处罚。\n选项D中死刑缓期2年执行,也属千死刑,不适用于\n未成年人犯罪,故排除D选项。答案为ABC。","k":"犯罪主体"},{"id":"2014-4","y":2014,"t":"单","s":"甲醉酒驾驶,撞死一行人后逃逸,在被追赶时 精神病复发。对甲()。","o":["不追究刑事责任","应当追究刑事责任","应当追究刑事责任,但是可以从轻或者减轻 处罚","应当追究刑事责任,但是可以减轻或者免除 处罚"],"a":"B","e":"此题考查的犯罪人的刑事责任能力。\n根据《刑法》第18条第4款的规定,醉酒的人犯罪,应\n当负刑事责任。甲醉酒驾驶,撞死一行人后逃逸已构\n成交通肇事罪。而在被追赶时精神病复发,说明其精\n神病是间歇性的,其实行醉酒驾驶的行为时是具有对\n自己行为的辨认能力和控制能力的。故而,间歇性精\n神病人在精神正常的时候犯罪,应当追究其刑事责\n任。因此答案选B。","k":"犯罪主体"},{"id":"2015-43","y":2015,"t":"多","s":"下列选项中,依法不得适用死刑的有()。","o":["审判时怀孕的妇女","审判时已满75周岁的人","犯罪时不满18周岁的人","犯罪时又聋又哑的人"],"a":"AC","e":"根据我国刑法的规定,犯罪时不满18\n周岁的人和审判时怀孕的妇女,不适用死刑。另外,\n审判时已满75周岁的人,除非以特别残忍手段致人\n死亡的,一般不适用死刑。据此,AC 为正确选项,BD\n错误。","k":"犯罪主体"},{"id":"2016-12","y":2016,"t":"单","s":"甲在封闭的居民小区内醉酒驾驶,拐弯时因 采取措施不当,将人行道上的2人撞成重伤。甲的行 为应认定为( ()。","o":["危险驾驶罪","交通肇事罪","故意伤害罪","过失致人重伤罪"],"a":"D","e":"交通肇事罪是指违反交通运输管理法\n规,在公共交通管理范围内发生重大事故,致人重伤、\n死亡或者使公私财产遭受重大损失的行为。甲在封\n闭的小区内驾驶,不是在公共道路上驾驶。根据司法\n解释的规定,重伤3人以上且负完全责任或主要责任\n的,成立交通肇事罪,甲将2人撞成重伤,不成立交通\n肇事罪,B选项错误。\n根据刑法规定,在道路上醉酒驾驶机动车的,构\n成危险驾驶罪,处拘役,并处罚金。同时构成其他犯\n罪的,依照处罚较重的规定定罪处罚。封闭的小区内\n属千\n\"道路\n\"的范畴,甲构成危险驾驶罪。甲的醉酒驾\n驶行为是故意的,但对造成他人重伤的后果是过失,\n其没有伤人的故意,不成立故意伤害罪,而成立过失\n致人重伤罪,C选项错误。甲的行为同时构成危险驾\n驶罪和过失致人重伤罪,依照处罚较重的规定定罪处\n罚,认定为过失致人重伤罪,D项正确。\n[特别说明]\n考生需注意,《刑法修正案(十\n一)》在危险驾驶罪条文后面增设了一个新的罪名:妨\n害安全驾驶罪。即对行驶中的公共交通工具的驾驶\n人员使用暴力或者抢控驾驶操纵装置,干扰公共交通\n工具正常行驶,危及公共安全的,处一年以下有期徒\n刑、拘役或者管制,并处或者单处罚金。值得关注的\n是,该罪与以危险方法危害公共安全罪是低位阶与高\n位阶的关系,如果抢夺方向盘的暴力程度达不到以危\n险方法危害公共安全罪所要求的暴力程度时,就可以\n定该罪。","k":"犯罪主体"},{"id":"2017-43","y":2017,"t":"多","s":"下列情形中,可以成立单位犯罪的有(","o":["甲设立公司,主要从事为他人虚开增值税专 用发票活动以牟利","乙与公司股东商议后,以公司名义走私香烟, 所得收益归公司所有","丙为使其公司承建工程,向国有投资公司主管 人员支付巨额回扣","丁以公司名义吸收公众存款,并将违法所得 用来购买豪华别墅"],"a":"BC","e":"单位犯罪是指公司、企业、事业单位、机\n关、团体实施的依法应当承担刑事责任的危害社会的\n行为。根据司法解释的规定,以下情况不成立单位犯\n罪:(1)个人为进行违法犯罪活动而设立的公司、企\n业、事业单位实施犯罪的,或者公司、企业、事业单位\n设立后,以实施犯罪为主要活动的,不以单位犯罪论\n处。A项中甲设立公司后,主要从事为他人虚开发票\n的犯罪活动,不以单位犯罪论处,A项错误。(2)盗\n用单位名义实施犯罪,违法所得由实施犯罪的个人私\n分的,依照刑法有关自然人犯罪的规定定罪处罚。D\n项中丁以公司名义非法吸收公众存款,但是将违法所\n得用千购买豪华别墅,也就是私自处分了违法所得,\n对丁的行为应以自然人犯罪定罪处罚,而不成立单位\n犯罪,D项错误。B项中乙以公司的名义走私香烟,\n得到股东的一致认可,体现了公司的共同意志,所得\n收益也归公司所有,成立单位犯罪,B项正确。C项中\n丙向国有投资公司主管人员行贿,是为了使其公司承\n建工程,是为了公司的利益,且以公司的名义实施犯\n罪行为,成立单位犯罪,C项正确。","k":"犯罪主体"},{"id":"2017-7","y":2017,"t":"单","s":"下列关于罚金的表述,符合我国刑法规定的是 )。","o":["对未成年人判处的罚金,不得由其监护人 垫付","是否判处罚金,不应考虑犯罪人的经济条件","应根据犯罪情节,决定判处罚金的数额","对累犯应当并处罚金"],"a":"C","e":"最高人民法院《关于审理未成年人刑\n事案件应用法律若干问题的解释》第15条第3款规\n定:对被判处罚金刑的未成年罪犯,其监护人或者其\n他人自愿代为垫付罚金的,人民法院应当允许。因此\nA项错误。罚金数额应当根据犯罪情节决定,一般来\n说,非法获利的数额大、情节严重的,罚金数额应当多\n些,反之则应当少些。但是也要考虑犯罪分子的实际\n经济负担能力。B项错误,C项正确。《刑法》对千累\n犯的规定中,没有规定必须并处罚金,D项错误。","k":"犯罪主体"},{"id":"2018-12","y":2018,"t":"单","s":"下列关千单位犯罪的表述,正确的是( )。","o":["没有可执行财产的单位分支机构不会构成单 位犯罪","我国刑法中有关单位犯罪的规定不适用千外 国公司、企业","两个以上单位以共同故意实施犯罪的可不区 分主犯、从犯","对单位犯罪直接负责的主管人员和其他直接 责任人员可不区分主犯从犯"],"a":"D","e":"单位分支机构可以构成单位犯罪,不能\n因为其没有可供执行的财产而认定不构成单位犯罪,\nA项错误;外国公司企业也属于单位,适用单位犯罪\n的规定,B项错误;两个以上单位共同犯罪的需要进\n行主从犯的区分,C项错误;有的案件,主管人员与直\n接责任人员在实施犯罪行为时的主从关系不明显的,\n可以不分主犯从犯,因此D 选项正确。","k":"犯罪主体"},{"id":"2018-18","y":2018,"t":"单","s":"下列关千罚金的表述,正确的是( )。","o":["对千未成年人不得适用罚金刑","罚金的最低数额由法官酌情确定","一人犯数罪分别判处罚金刑的应该合并执行","一人犯数罪同时判处没收财产和罚金刑的应 合并执行"],"a":"C","e":"未成年人可以适用罚金,A项错误;刑\n法没有明确规定罚金数额标准的,罚金的最低数额不\n能少千1 000元。对未成年人犯罪应当从轻或者减轻\n判处罚金,但罚金的最低数额不能少于500元。所以\n罚金的最低数额是法定的,而非由法官酌情确定,B\n项错误;《刑法》第69 条规定:数罪中有判处附加刑\n的,附加刑仍须执行,其中附加刑种类相同的,合并执\n行,种类不同的,分别执行。因此罚金和没收财产需\n要分别执行,不能合并执行。D项错误;多个罚金刑\n应该合并执行,C 正确。","k":"犯罪主体"},{"id":"2018-4","y":2018,"t":"单","s":"下列关于包庇罪的表述,正确的是( )。","o":["行为方式必须是作为","行为主体必须是特殊主体","行为时间必须发生在审查起诉之后","行为对象必须是判决确定的犯罪分子"],"a":"A","e":"包庇罪主体是一般主体;行为时间是犯\n罪以后而非审查起诉以后;行为对象是犯罪嫌疑人,\n不要求是判决确定的犯罪分子;包庇罪的客观行为表\n现为明知他人犯罪,而为其以非证人的身份作伪证的\n行为,需要以作为的方式构成,因此A正确。","k":"犯罪主体"},{"id":"2019-2","y":2019,"t":"单","s":"下列对于破坏选举罪构成要件的理解,正确的 是()。","o":["主体包括自然人和单位","主观方面包括故意和过失","客体包括选民的选举权和被选举权","客观方面限于暴力、威胁、欺骗或贿赂行为"],"a":"C","e":"破坏选举罪的客体包括选举权与被选\n举权以及国家的选举制度,C项正确。破坏选举罪的\n犯罪主体只有自然人,不包括单位,A项错误。该罪\n的主观方面是故意,不包括过失,B项错误。客观方\n面是在选举各级人民代表大会代表和国家机关领导\n人员时,以暴力、威胁、欺骗、贿赂、伪造选举文件、虚\n报选举票数等手段破坏选举或者妨害选民和代表自\n由行使选举权和被选举权,情节严重的行为。犯罪行\n为除了暴力、威胁、欺骗或贿赂,还包括伪造选举文\n件、虚报选举票数等其他行为,D项错误。","k":"犯罪主体"},{"id":"2020-9","y":2020,"t":"单","s":"下列关于危害国家安全罪的说法中,正确的是 )。","o":["危害国家安全罪的主体是一般主体","危害国家安全罪的主观方面可以是过失","对于危害国家安全的犯罪分子都可以判处 死刑","对于危害国家安全的犯罪分子应当附加剥夺 政治权利"],"a":"D","e":"危害国家安全罪的犯罪主体是自然人,\n且多数犯罪为一般主体,少数为特殊主体,A选项错\n误。主观方面表现为故意,B选项错误。不是所有实\n施危害国家安全的犯罪分子都可以判处死刑,C选项\n错误。对于危害国家安全的犯罪分子,应当附加剥夺\n政治权利,D选项正确。","k":"犯罪主体"},{"id":"2021-6","y":2021,"t":"单","s":"下列对于单位犯罪的理解中,正确的是 )","o":["个人为进行违法犯罪活动而设立的企业实施 犯罪的,不以单位犯罪论处","符合我国法人资格条件的外国企业犯罪的,不 应依照单位犯罪的规定追究刑事责任","依法成立的一人公司,不能成为单位犯罪的 主体","以单位内设机构名义实施犯罪的,不应认定 为单位犯罪"],"a":"A","e":"根据司法解释的规定,个人为进行违法\n犯罪活动而设立企业实施犯罪的,不以单位犯罪论\n处,A项正确。符合我国法人资格条件的外国企业犯\n罪的,应依照单位犯罪的规定追究刑事责任,B项错\n误。依法成立的一人公司,是法人,可以成为单位犯\n罪的主体,C项错误。以单位内设机构名义实施犯\n罪,违法所得归内设机构所有的,应认定为单位犯罪,\nD项错误。本题选A。","k":"犯罪主体"},{"id":"2022-12","y":2022,"t":"单","s":"下列选项中,不应认定为存在犯罪故意的是","o":["精神病人犯罪的","醉酒的人犯罪的","防卫过当造成重大损害的","不可抗力造成损害结果的"],"a":"D","e":"罪过,即指犯罪行为人对自己的行为所\n造成的危害后果所持的故意或者过失的心理态度。\n犯罪故意,指明知自己的行为会发生危害社会的结\n果,并且希望或者放任这种结果发生的心理态度。无\n罪过事件是指行为在客观上虽然造成了损害结果,但\n是不是出于行为人的故意或者过失,而是由于不能抗\n拒或者不能预见的原因所引起的,不是犯罪。无罪过\n事件可以分为意外事件和不可抗力两种情况,不可抗\n力造成损害结果的,不应认定为存在犯罪故意。故本\n题选D。","k":"犯罪主体"},{"id":"2022-13","y":2022,"t":"单","s":"对于行贿罪的司法认定,下列选项中正确的是","o":["行贿的方式包括通过赌博向国家工作人员提供巨额现金","行贿的对象包括国家工作人员以及国家机关、国有企事业单位","行贿的内容包括为国家工作人员提供子女就读重点中学的机会","行贿的主体包括被勒索给予国家工作人员以财物但未获得不正当利益的人"],"a":"A","e":"行贿罪是指为谋取不正当利益,给予国\n家工作人员以财物的行为。通过赌博向国家工作人\n员提供巨额现金的行为属于变相地给予国家工作人\n员以财物的行为。A选项正确。行贿的对象仅为国\n家工作人员,不包括国家机关、国有企事业单位等,为\n获取不正当利益,给予国家机关、国有公司、企业、事\n业单位、人民团体以财物的,或者在经济往来中,违反\n国家规定,给予各种名义的回扣、手续费的,构成对单\n位行贿罪。B选项错误。行贿的内容为经济利益,不\n包括为国家工作人员提供子女就读重点中学的机会。\nC选项错误。《刑法》规定,因被勒索给予国家工作人\n员以财物,没有获得不正当利益的,不是行贿。D选为构成走私制毒物品罪。D选项错误。\n项错误。","k":"犯罪主体"},{"id":"2022-43","y":2022,"t":"多","s":"正确审理未成年人刑事案件应贯彻\"教育为主,惩罚为辅\"的原则。对此,下列选 项中正确的有","o":["对已满14周岁不满16周岁的人犯罪一般不判处无期徒刑","对未成年罪犯判处附加剥夺政治权利的,应当依法从轻判处","对未成年罪犯适用刑罚,应当充分考虑是利千未成年罪犯的教育和矫正","对未成年罪犯的减刑、假释,在掌握标准上可以比照成年罪犯依法适度放宽"],"a":"ABCD","e":"自2006年1月起施行的《最高人民法院\n关于审理未成年人刑事案件具体应用法律若干问题的\n解释》对未成年人有诸多特殊宽大的规定:(1)对未成\n年罪犯适用刑罚,应当充分考虑是否有利于未成年罪\n犯的教育和矫正。(2)未成年人犯罪只有罪行极其严\n重的,才可以适用无期徒刑。对已满14周岁不满16\n周岁的人犯罪一般不判处无期徒刑。(3)除刑法规定\n\"应当\"附加剥夺政治权利外,对未成年罪犯一般不判\n处附加剥夺政治权利。如果对未成年罪犯判处附加剥\n夺政治权利的,应当依法从轻判处。(4)对未成年罪\n犯的减刑、假释,在掌握标准上可以比照成年罪犯依法","k":"犯罪主体"},{"id":"2024-12","y":2024,"t":"单","s":"下列不可以作为玩忽职守罪主体的是()","o":["乡人民代表大会主席","合同制民警","工人编制的镇工商所所长","火车站售票员 进行炫耀,事后查明,涉事照片中大量绝密级国家秘密被隐藏于“军迷群”中的境外人员获 得,甲的行为应认定为() A.间谍罪 B.故意泄漏国家秘密罪 C.非法获取国家秘密罪 D.为境外刺探、非法提供国家秘密罪 14.下列选项中可以认定为主犯的是() A.主动提出开车送朋友到他人家中盗窃的甲 B.受他人蛊惑,积极实施扰乱公共场所秩序行为的乙 C.在组织领导传销活动犯罪中承担宣传职责的丙 D.为黑社会性质组织经营的公司提供租车服务的丁 15.防卫过当与事后防卫的共同之处在于() A.均属于量刑情节 B.均阻却犯罪成立 C.均构成故意犯罪 D.均超过防卫限度 16.某县财政局科长甲被辞退后,通过该局局长乙职务行为,为丙谋取不正当利益,丙 因此免除了甲欠自己的五万元债务,甲的行为如何认定() A.不构成犯罪 B.受贿罪 C.利用影响力受贿罪 D.非国家工作人员受贿罪 链接,并因此提高了销量,情节严重,获利巨大,甲的行为如何认定() A.非法经营罪 B.虚假广告罪 C.传播淫秽物品牟利罪 D.传播淫秽物品罪 18.甲乘坐飞机抵达我国某机场时,因携带毒品被海关查获,经鉴定,甲携带毒品净重 超过2公斤,甲的行为如何认定() A.贩卖毒品罪(预备) B.运输毒品罪(未遂) C"],"a":"D","e":"","k":"犯罪主体"},{"id":"2024-44","y":2024,"t":"多","s":"为保护未成年人的合法权益,在办理强奸、猥亵未成年人案件时,下列做法正确的 有()","o":["对强奸未成年人的成年被告人判处刑罚时不得适用缓刑","对于奸淫幼女,致使其感染艾滋病毒的,应认定为强奸致使被害人重伤","对于利用职业便利实施猥亵未成年人犯罪的,人民法院应当依法适用从业禁止","对已满14周岁的未成年女性负有特殊职责的人员,利用优势地位迫使被害人与其发 生性关系的以强奸罪定罪"],"a":"BCD","e":"","k":"犯罪主体"},{"id":"2025-4","y":2025,"t":"单","s":"下列选项中,成立单位犯罪的是( )","o":["甲设立的A 公司专门从事电信网络诈骗活动","B 公司提供虚假担保骗取巨额贷款,后因经营不善无力偿还","C 公司设立后以为他人虚开增值税专用发票为主要活动","乙以D 公司名义实施合同诈骗,并让受害人将资金打入乙妻子的银行账户"],"a":"B","e":"个人为进行违法犯罪活动而设立的公司、企业、事业单位实施犯罪的,或者公司、\n企业、事业单位设立后,以实施犯罪为主要活动的,不以单位犯罪论处。A 项为进行违法犯罪\n活动而设立公司,C 项公司成立后以实施犯罪为主要活动,AC 项均不成立单位犯罪。盗用单位\n名义实施犯罪,违法所得由实施犯罪的个人私分的,依照刑法有关自然人犯罪的规定定罪处罚,\n乙以D 公司名义实施犯罪活动,违法所得归个人所有,不成立单位犯罪。B 公司以虚假担保骗\n取巨额贷款,后因经营不善无力偿还,B 公司没有非法占有的目的,构成骗取贷款罪,成立单\n位犯罪。本题选B。","k":"犯罪主体"},{"id":"2026-14","y":2026,"t":"单","s":"下列对于犯罪主体特殊身份的判定,正确的是","o":["首要分子属于特殊身份","教唆犯不受特殊身份限制","特殊身份与刑事责任无关","叛逃罪的主体应具备特殊身份"],"a":"D","e":"叛逃罪主体是国家机关工作人员,属于特殊身份;\nA 首要分子是犯罪中形成的地位,不是定罪身份;B 具有特殊身份的身份犯,无\n身份者不能单独实行;C 特殊身份直接影响定罪、刑事责任。","k":"犯罪主体"}]},{"sub":"刑法","name":"犯罪主观方面","w":1.6,"L":30,"qs":[{"id":"2005-24","y":2005,"t":"多","s":"甲误认为遭到乙的紧急的不法侵害,而对乙实行防卫行为,致乙死亡。事后证实乙的行为不具有不法侵害的性 质。 甲的行为(       )","o":["可能构成故意杀人罪","可能构成过失致人死亡罪","可能属于意外事件","可能属于防卫过当"],"a":"BC","e":"甲的行为不具防卫的起因条件,即不存在现实的不法侵害,构成假想防卫,不是防卫过当。防卫\n过当,是指符合防卫的起因条件、时间条件、主观条件和对象条件的情形下,但不符合限度条件的防卫,即对不法\n侵害人造成明显超过必要限度的损害。对于不符合起因条件的假想防卫,行为人有过失的且刑法有规定的,为过失\n犯罪;行为人没有过失的,属于意外事件。因此,选项B、C 应选。对于不符合起因条件的假想防卫,不存在故意犯\n罪的问题。因此,排除选项A。如果甲明知不存在乙的紧急的不法侵害,而致使乙死亡的,才构成故意杀人罪。但\n题干\"甲误认为\"表明不是\"明知\"。","k":"犯罪主观方面"},{"id":"2005-25","y":2005,"t":"多","s":"甲未获烟草专卖许可,擅自购进明知是假冒的“中华”牌香烟 100 箱进行批发和零售,在被查获时已销售出 80 箱, 受款 120 万元。经检验该批香烟属于不合格产品。甲的行为(       )","o":["触犯非法经营罪","触犯销售假冒注册商标的商品罪","触犯销售伪劣产品罪","属于想象竞合犯,从一重罪定罪处罚 三、简答题:26、27 小题,每小题 6 分"],"a":"ABCD","e":"根据刑法第225 条第1 项,未经许可经营法律、行政法规规定的专营、专卖物品或者其他限制\n买卖的物品,扰乱市场秩序,情节严重的行为构成非法经营罪。根据刑法第214 条,销售明知是假冒注册商标的商\n品,销售金额数额较大的行为构成销售假冒注册商标的商品罪。根据刑法第140 条,销售者以不合格产品冒充合格\n产品,销售金额五万元以上的行为构成销售伪劣产品罪。据此,选项A、B、C 均正确。甲的行为由于侵犯不同客体\n而构成不同罪名,构成想象竞合犯。据此选项D 应选。 \n三、简答题","k":"犯罪主观方面"},{"id":"2005-6","y":2005,"t":"单","s":"根据我国的刑法学说和司法实践,最有可能排除某种犯罪故意的认识错误是(   )","o":["法律上的认识错误","对象认识错误","手段认识错误","客体认识错误"],"a":"D","e":"法律上的认识错误,是指行为人对自己行为的法律性质有不正确的理解。处理法律上的认识错误的\n总原则是:行为人的刑事责任依法判定,不因主观上的认识错误而发生变化。因此排除选项A。如果行为人对犯罪\n对象认识的错误,但是对犯罪客体认识没有错误,则对刑事责任不发生任何影响;据此,排除选项B。手段的认识\n错误,不影响罪过成立,但是如果危害结果没有发生,行为人只负犯罪未遂的刑事责任。据此,排除选项C。客体\n认识错误的,则依行为人主观认识的客体种类定罪。比如,甲认为乙包中藏有钱财实施抢劫,而乙包中实际藏有手\n枪,据此应当排除甲抢劫枪支罪的故意,即应当认定甲构成抢劫罪,而非抢劫枪支罪。因此,选项D 应选。","k":"犯罪主观方面"},{"id":"2006-18","y":2006,"t":"单","s":"下列情形中,构成非法经营罪的是(   )","o":["甲医药公司擅自从事假药生产,销售,违法所得数额巨大","乙国有图书公司明知是盗版图书仍然进行销售,违法所得数额巨大","丙公司倒卖窃取的商业秘密,违法所得数额巨大","丁公司未经许可擅自倒卖烟草,违法所得数额巨大"],"a":"D","e":"第225 条 违反国家规定,有下列非法经营行为之一,扰乱市场秩序,情节严重的,处五年以下有\n期徒刑或者拘役,并处或者单处违法所得一倍以上五倍以下罚金;情节特别严重的,处五年以上有期徒刑,并处违\n法所得一倍以上五倍以下罚金或者没收财产: \n(一)未经许可经营法律、行政法规规定的专营、专卖物品或者其他限制买卖的物品的;(二)买卖进出口许可证、\n进出口原产地证明以及其他法律、行政法规规定的经营许可证或者批准文件的;(三)其他严重扰乱市场秩序的非\n法经营行为。A 构成生产、销售假药罪,B 构成侵犯著作权罪;C 构成侵犯商业秘密罪。","k":"犯罪主观方面"},{"id":"2006-19","y":2006,"t":"单","s":"在走私普通货物犯罪过程中,以暴力,威胁方法抗拒缉私的,应当(   )","o":["以妨害公务罪定罪处罚","以武装掩护走私罪定罪处罚","以走私普通货物罪定罪处罚","以走私普通货物罪与妨害公务罪数罪并罚"],"a":"D","e":"《刑法》第157 条,以暴力、威胁方法抗拒缉私的,以走私罪和本法第二百七十七条规定的阻碍国家\n机关工作人员依法执行职务罪,依照数罪并罚的规定处罚。选D。","k":"犯罪主观方面"},{"id":"2006-4","y":2006,"t":"单","s":"甲于夜晚在一条封闭的高速公路上驾车正常行驶时,乙突然翻越护栏横穿公路,甲刹车不及将乙撞死。交警认定 甲的行为不构成交通肇事罪。下列说法中,不应当作为交警认定依据的是(   )","o":["甲的行为与乙的死亡结果之间没有刑法上的因果","甲的行为不违反交通法律法规,缺乏构成交通肇事罪的客观条件","本案属于意外事件","甲对乙的死亡结果没有罪过"],"a":"A","e":"从刑法是否构成交通肇事罪应考虑B、C、D 而本题是让选不应当认定依据的,所以选A。","k":"犯罪主观方面"},{"id":"2006-5","y":2006,"t":"单","s":"甲明知自己的枪法很差,但为了杀乙,也顾不了那么多了,遂从 100 米外向乙开枪,没想到居然打中了乙,致 乙死 亡。此案中甲杀害乙的罪过形式是(   )","o":["直接故意","间接故意","疏忽大意","过于自信的过失"],"a":"A","e":"从本案中可看出甲有犯罪目的,而罪过形式中具有犯罪目的只有直接故意。","k":"犯罪主观方面"},{"id":"2008-22","y":2008,"t":"多","s":"下列关于共同犯罪的表述,正确的有(     )。","o":["二人以上共同过失犯罪的,不以共同犯罪论处","对组织、领导犯罪集团的首要分子,按照犯罪集团的全部罪行处罚","事前与盗窃犯罪人通谋、事后为其销赃的行为,构成盗窃罪的共同犯罪","实行犯的实行行为超过了共同犯罪故意范围的,其他共同犯罪人对超出共同故意范围的行为不承担刑事责任"],"a":"ABCD","e":"《刑法》第25 条第2 款规定,二人以上共同过失犯罪,不以共同犯罪论处;应当负刑事责任的,\n- 7 -\n\n \n \n更多考研精品资料,关注淘宝店铺:光速考研工作室 \n按照他们所犯的罪分别处罚,故选项A 正确。《刑法》第26 条第3 款规定,对组织、领导犯罪集团的首要分子,按\n照集团所犯的全部罪行处罚,故选项B 正确。一般地,若事前通谋,事后按照约定对犯罪分子犯罪所得赃物予以窝\n藏、转移、收购、代为销售或者以其他方法掩饰、隐瞒的,应按犯罪分子所实施的特定犯罪的共同犯罪处理,故选\n项C 正确。在共同犯罪中,实行过限行为,由实行该种行为的人独自承担刑事责任,其他共同犯罪人对此不负刑事\n责任,故选项D 正确。本题应A、B、C、D。","k":"犯罪主观方面"},{"id":"2008-8","y":2008,"t":"单","s":"甲明知自己的枪法很差,但为杀乙,置乙身边丙的生命安全于不顾,向乙射击。结果没有击中乙,却打死了丙。 对于丙的 死亡,甲的罪过形式是(  )","o":["直接故意","间接故意","疏忽大意的过失","过于自信的过失"],"a":"B","e":"甲明知自己的行为可能造成丙死亡的结果,但放任这种结果发生,故属于间接故意,应选B 项。","k":"犯罪主观方面"},{"id":"2008-9","y":2008,"t":"单","s":"区别犯罪预备与犯罪未遂的关键于行为人是否着手实施了(  )","o":["有助于犯罪既遂的行为","有助于实现犯罪目的的行为","有助于犯罪结果发生的行为","刑法分则规定的犯罪实行行为"],"a":"D","e":"一般地,是否已经\"着手\"实行犯罪,是犯罪预备与犯罪未遂区别的根本标准。而所谓实行犯罪的行\n为,是指行为人实施的行为符合刑法分则各条规定的某一犯罪行为。故选项D 应选。","k":"犯罪主观方面"},{"id":"2011-3","y":2011,"t":"单","s":"甲喜新厌旧,欲杀害妻子乙后与情妇结婚,虽 然明知其儿子丙有与乙在同一饭碗里吃饭的习惯,由 于杀乙心切而不顾丙的死活,仍在乙的饭碗里投放毒 药。结果乙、丙均中毒身亡。本案中甲对丙死亡的心 理态度是()。","o":["直接故意","间接故意","过于自信的过失","疏忽大意的过失"],"a":"B","e":"本题涉及直接故意、间接故意、疏忽大\n意的过失和过于自信的过失的比较。过失犯罪的特\n点是对危害结果的发生持否定的态度,即危害结果的\n发生是违背行为人意愿的,是行为人不愿看到的。而\n、\n直接故意与间接故意的区别在于直接故意是积极地\n希望危害结果的发生,而间接故意对危害结果持一种\n放任的态度。在本题中,根据题干的描述甲\n\" 杀乙心\n切而不顾丙的死活\n\" 可以看出,甲对于丙的死亡是持\n一种放任的心态,是间接故意,故选B。(考生应注\n意,对于题中四个选项的比较一定要完全记忆并\n理解!)","k":"犯罪主观方面"},{"id":"2011-44","y":2011,"t":"多","s":"下列犯罪中,应按数罪并罚原则处理的有 )。","o":["参加黑社会性质组织又杀人的","拐卖妇女过程中奸淫被拐卖的妇女的","民事案件的审判人员因受贿而枉法裁判的","在走私犯罪过程中采用暴力方法抗拒缉私人 员缉私的"],"a":"AD","e":"根据《刑法》规定,构成组织、领导参加\n黑社会性质组织罪又有其他犯罪行为的,依照数罪并\n罚的规定处罚,A正确。拐卖妇女过程中奸淫被拐卖\n妇女的,仍按照拐卖妇女罪处罚,B错误。司法工作\n人员收受贿赂,又构成徇私枉法罪,民事、行政枉法裁\n判罪,执行判决、裁定失职罪,执行判决、裁定滥用职\n权罪的,依照处罚较重的规定定罪处罚,C错误。以\n暴力、威胁方法抗拒缉私的,以走私罪和阻碍国家机\n关工作人员依法执行职务罪数罪并罚,D正确。此处\n建议考生将一些从一重罪论处或数罪并罚的情形予\n以归类记忆。在法律和司法解释中,存在着一些貌似\n牵连犯,却实行数罪并罚的情形,现为方便考生应考,\n特别予以归类:(1)组织、领导、参加恐怖组织,并利\n用组织实施杀人、爆炸等犯罪的;(2)组织、领导、参\n加黑社会组织,并利用组织实施杀人、爆炸等犯罪的;\n(3) 实施《刑法》第140条至第148 条的生产、销售伪\n劣产品的犯罪行为,同时又以暴力、威胁方法抗拒查\n处的;(4)走私犯罪并以暴力、威胁方法抗拒缉私的;\n(5)实施保险诈骗行为又实施了故意造成财产损毁、\n被保险人死亡等保险事故的行为;(6)收买被拐卖的\n妇女儿童之后又非法剥夺人身自由、伤害、强奸、侮辱\n行为的。","k":"犯罪主观方面"},{"id":"2012-12","y":2012,"t":"单","s":"甲明知卖淫女赵某未满14周岁,而与之发生 性交易。甲的行为( )。","o":["不构成犯罪","构成强奸罪","构成狠亵儿童罪","构成嫖宿幼女罪"],"a":"B","e":"原答案为D)\n《刑法修正案(九)》删除了嫖宿幼女\n罪,与未满14周岁幼女发生性关系的,成立强奸罪,B\n选项正确。此前根据《刑法》第360条第2款的规定,\n答案是嫖宿幼女罪。\n(特别说明]\n考生应当注意,《刑法修正案(十\n一)》中为加大对未成年人的保护力度,修改了奸淫幼\n女型的强奸罪:对\n\"公共场所当众奸淫幼女\n\"\" 奸淫不\n满十周岁的幼女或者造成幼女伤害\n\" 等严重情形明确\n适用更重刑罚,可处10年以上有期徒刑、尤期徒刑或\n者死刑;同时新增一个罪名\n\" 负有照护职责人员性侵\n罪\n\" ,即对巳满14周岁不满16 周岁的未成年女性负\n有监护、收养、看护、教育、医疗等特殊职责的人员,与\n该未成年女性发生性关系的,不论未成年人是否同\n意,都应追究刑事责任。","k":"犯罪主观方面"},{"id":"2013-12","y":2013,"t":"单","s":"甲明知男友乙实施了抢劫商店的行为,但为 了掩盖乙的犯罪事实,在法庭审理时,作证说案发时 乙在家中。对甲的行为应认定为()。","o":["窝藏罪","包庇罪","伪证罪","徇私枉法罪"],"a":"C","e":"本题考查的是如何认定伪证罪与包庇\n罪。所谓伪证罪,是指在刑事诉讼中,证人、鉴定人、\n记录人翻译人对与案件有重要关系的情节,故意做\n虚假的证明、鉴定、记录、翻译,意图陷害他人或者隐\n匿罪证的行为。而包庇罪是指明知是犯罪的人而作\n虚假证明包庇的行为。两罪的最主要区别在于二者\n发生的场合不同,包庇罪可以在犯罪分子被逮捕、关\n押前实施,也可以在被逮捕、判刑后实施,而伪证罪只\n发生在侦查、审判阶段中。本题中甲是在法庭审理中\n做了假证,因此属千伪证罪。","k":"犯罪主观方面"},{"id":"2013-13","y":2013,"t":"单","s":"甲意图杀死李某,某夜来到李某家院门外,从 门缝窥见院内有一黑影在移动,以为是李某,忙举弩 射击。甲次日得知射死的是李某家的驴。对甲的行 为应认定为()。","o":["意外事件","打击错误","故意毁坏财物罪","故意杀人罪"],"a":"D","e":"本题考查的是刑法中的认识错误。刑\n法中的认识错误分为法律认识错误和事实认识错误。\n所谓事实认识错误,是指行为人对自己行为有关的事\n实情况有不正确的理解,包括客体错误、对象错误、手\n段错误、行为偏差和因果关系错误。本题中,甲意图\n射杀李某,深夜来到院子外面,看到移动的黑影,误以\n为是李某而射击,这便已经构成了犯罪的实施行为。\n完成射击后,甲的犯罪在客观上已经完全实行完毕,\n主观上实现犯罪意图的行为也已经进行到底。但是\n甲击中的是一头驴而非人类,甲在故意犯罪中发生认\n识错误,但既没有造成预期的犯罪结果,也未能造成\n预期之外的犯罪结果,属于不能犯的问题,不必要适\n用认识错误的理论来认定,因此成立故意杀人的\n未遂。","k":"犯罪主观方面"},{"id":"2013-20","y":2013,"t":"单","s":"甲公司明知乙受贿,仍提供银行账户帮助乙 将受贿所得兑换成美元,汇往境外,并收取乙支付的 高额“手续费”。对甲公司的行为应认定为()。","o":["受贿罪","洗钱罪","非法经营罪","掩饰、隐瞒犯罪所得罪 )"],"a":"B","e":"本题考查的是洗钱罪。所谓洗钱罪,是\n指为掩饰、隐瞒毒品犯罪、黑社会性质的组织犯罪、恐\n怖活动犯罪走私犯罪、贪污贿赂犯罪、破坏金融管理\n秩序犯罪、金融诈骗犯罪的所得及其产生的收益的来\n源和性质,而采用掩饰、隐瞒其来源和性质的方法,从\n而使其合法化的行为。本题中,乙的资金来源是受\n贿,甲为掩饰、隐瞒乙的资金来源,为其提供资金账\n户,将其受贿所得汇往境外,构成洗钱罪,B项正确。\n[特别说明]\n关于洗钱罪,考生应当注意《刑法\n修正案(十一)》将洗钱罪定义中\n\"明知是毒品犯罪\n\"\n改为\n\" 为掩饰、隐瞒毒品犯罪\n\"。即将\n\" 自洗钱\n\" 行为\n由原来的事后不可罚行为规定为犯罪。当行为人实\n施上游犯罪并且有\n\" 自洗钱\n\" 行为的,应以洗钱罪和上\n游犯罪数罪并罚。此外《刑法修正案(十一)》还完善\n了洗钱罪的行为方式,增加地下钱庄通过转账或者其\n他支付结算方式转移资金、跨境转移资产的方式洗钱\n等行为方式,为有关部门有效预防、惩治洗钱违法犯\n罪以及境外追逃、追赃提供了充足的法律保障。","k":"犯罪主观方面"},{"id":"2014-17","y":2014,"t":"单","s":"药剂师甲明知不含毒品成分的药品已经过期 失效,仍冒充为毒品卖给乙,乙将“毒品”卖给吸毒人 员。本案中()。","o":["甲和乙均构成诈骗罪","甲和乙均构成贩卖毒品罪","甲构成诈骗罪,乙构成贩卖毒品罪","甲构成销售假药罪,乙构成诈骗罪"],"a":"C","e":"构成贩卖毒品罪,必须是明知是毒品而\n故意实施贩卖行为,药剂师甲明知该药品不含毒品成\n\n分而将其卖给乙骗取财物,其行为构成诈骗,而非贩\n卖毒品。而乙由千其并不知道该药品并非毒品,而以\n贩卖毒品的故意将其卖给吸毒人员,构成贩卖毒品\n罪,但由于该药品并不含毒品成分,故而属于对象不\n能犯未遂。","k":"犯罪主观方面"},{"id":"2014-19","y":2014,"t":"单","s":"下列行为中,应以窝藏罪定罪处罚的是()。","o":["甲利用担任司法警察的职务便利,将正在服 刑的李某放走","乙明知赵某的现金为贩毒所得,仍将其兑换成 外币汇往境外","丙明知刘某的3辆摩托车是盗窃所得,仍将其 藏匿在自家车库中","丁明知蔡某刚从监狱脱逃出来,仍向他提供1 万元现金助其逃跑"],"a":"D","e":"所谓窝藏罪,是指明知是犯人而为其提\n供隐藏处所、财物或帮助其逃匿的行为。A选项中司\n法警察甲行为属于私放在押人员罪,而非包庇罪;B\n选项中乙将贩毒所得赃款兑换成外币汇往境外,属于\n洗钱罪;C选项中丙明知三辆摩托是盗赃而予以藏\n匿,属千掩饰、隐瞒犯罪所得罪。只有D选项中的丁,\n为刚从监狱中脱逃出来的蔡某提供资金助其逃匿,构\n成了窝藏罪。","k":"犯罪主观方面"},{"id":"2015-42","y":2015,"t":"多","s":"下列选项中,属于法律认识错误的有()。","o":["甲以为在网上窃取“Q币”不犯罪而为之","乙以为杀死他人可以驱除恶灵而杀死他人","丙以为夜间在道路上追逐竞驶不犯罪而为之","丁把他人灌醉后拿走其随身财物,辩称自己 犯的是盗窃罪"],"a":"ACD","e":"本题考查的是对刑法中的认识错误的\n理解。刑法中的认识错误,是指行为人对自己行为的\n法律性质、后果和有关的事实情况发生了误解。事实\n认识错误分为:客体错误、对象错误、手段错误、行为\n偏差和因果关系错误。法律认识错误包括:假想非\n罪假想犯罪、行为人对自己犯罪行为的罪名和罪行\n轻重发生误解。AC选项是假想非罪·,即将犯罪行为\n误认为非犯罪行为,是法律认识错误。B选项不是法\n律认识错误,而是犯罪动机问题。犯罪动机不影响犯\n罪的成立。D选项中丁是抢劫罪,但丁认为自己犯的\n是盗窃罪,是对自己犯罪行为的罪名发生误解,是法\n律认识错误。因此本题正确选项是ACD。","k":"犯罪主观方面"},{"id":"2016-44","y":2016,"t":"多","s":"下列情形中,属于事实认识错误的有()。","o":["甲殴打张某时,失手打中了路人李某,致其 重伤","乙认为家长教训孩子天经地义,经常在家殴打 孩子","丙误以为前来抓捕自己的警察赵某是仇家,挥 棍将其打成重伤","丁开车欲撞死钱某,钱某被撞后倒地昏迷,丁 误认为其已死亡于是离去"],"a":"ACD","e":"事实认识错误包括客体错误、对象错\n误手段错误、行为偏差、因果关系错误。行为偏差是\n指行为人预想打击的目标与实际打击的目标不一致。\n对象错误,是指行为人预想侵犯的对象与行为人实际\n侵犯的对象在法律性质上是相同的(属千同一构成要\n件)。因果关系错误,是指行为人对自己的行为和所\n造成的结果之间因果关系的实际情况发生误认。因\n果关系错误分为三种情况:(1)行为造成了预定的结\n果,但误以为没有造成该结果;(2)行为没有实际造\n成预定的结果,但误以为造成了该结果;(3)知道行\n为已经造成预定的结果,但对造成结果的原因有\n误解。\nA选项中,甲想殴打张某,失手打中李某,甲预\n想打击的目标与实际打击的目标不一致,是行为偏\n差,属于事实认识错误。C选项中,丙挥棍想打仇\n家,实际上打的是便衣警察赵某,是对象错误,属于\n事实上的认识错误。D选项中,丁开车想撞死钱\n某,但是钱某并没有死亡,而是倒地昏迷,丁的行\n为没有造成预定的结果,但丁误以为造成了钱某\n死亡的结果,是因果关系错误,属千事实认识\n错误。\nB选项是法律认识错误,不是事实认识错误。乙\n认为家长殴打孩子不违法,是将有罪行为误认为无罪\n行为,即假想非罪。","k":"犯罪主观方面"},{"id":"2016-9","y":2016,"t":"单","s":"甲明知王某是逃犯,在公安人员前来抓捕王某 时,给其3000元帮他逃跑。甲的行为构成( )。","o":["窝藏罪","妨害公务罪","包庇罪","私放在押人员罪"],"a":"A","e":"窝藏罪,是指明知是犯罪的人而为其提\n供隐藏处所、财物,帮助其逃匿。甲明知王某是逃犯,\n还给其3000 元钱帮助其逃跑,成立窝藏罪,A 选项\n正确。\n妨害公务罪是指以暴力、威胁方法阻碍国家机关\n工作人员依法执行职务,或者故意阻碍国家安全机\n关、公安机关依法执行国家安全工作任务,未使用暴\n力、威胁方法,造成严重后果。甲没有使用暴力或者\n威胁,也不是阻碍公安机关执行国家安全工作任务,\n不成立妨害公务罪,B选项错误。\n包庇罪,是作假证明包庇,甲没有作假证明,而是\n给予财物,不成立包庇罪,C选项错误。\n私放在押人员罪是司法工作人员私放在押的犯\n罪嫌疑人被告人或者罪犯,甲不是司法工作人员,王\n某也不是在押的犯罪嫌疑人、被告人或者罪犯,所以\n甲不成立私放在押人员罪,D选项错误。","k":"犯罪主观方面"},{"id":"2018-13","y":2018,"t":"单","s":"下列选项中,主观方面可以表现为过失的是 ()。","o":["放火罪","虐待罪","危险驾驶罪","食品监管渎职罪"],"a":"D","e":"放火罪、虐待罪、危险驾驶罪的主观方\n面都是故意,只有食品监管渎职罪的主观方面包括故\n意和过失。食品监管渎职罪是指负有食品安全监督\n管理职责的国家机关工作人员,滥用职权或者玩忽职\n守,导致发生重大食品安全事故或者造成其他严重后\n果。本题选D。\n[特别说明]\n《刑法修正案(十一门修改了食品\n监管渎职犯罪,增加药品监管渎职犯罪,进一步细化\n食品和药品的渎职犯罪情形,加重了药品监管人员的\n责任。修改后该条文的罪名是食品、药品监管渎\n职罪。","k":"犯罪主观方面"},{"id":"2018-19","y":2018,"t":"单","s":"乘客甲明知擅自打开飞机应急舱门会危及飞 行安全,在飞机被牵引车推出阶段故意将应急舱门打 开,地勤人员发现应急充气滑梯弹出后将飞机迫离。 甲的行为应认定为( )。","o":["破坏交通工具罪","暴力危及飞行安全罪","重大飞行事故罪","以危险方法危害公共安全罪"],"a":"D","e":"甲在飞机推出阶段打开应急舱门,不属\n于破坏飞机,因此不构成破坏交通工具罪。甲也没有\n使用暴力,因此不构成暴力危及飞行安全罪。重大飞\n行事故罪主体主要是航空人员,本题中甲是乘客,且\n未造成重大飞行事故,因此不构成重大飞行事故罪。\n甲明知擅自打开飞机应急舱门会危及飞行安全,在飞\n机被牵引车推出阶段故意将应急舱门打开,导致地勤\n人员将飞机迫停,构成以危险方法危害公共安全罪。\n本题选D。","k":"犯罪主观方面"},{"id":"2019-3","y":2019,"t":"单","s":"甲看见猎物旁边有猎人赵某潜伏,虽明知自己 枪法不好,仍向猎物开枪,结果将赵某打死。甲对赵 )。 某死亡的心理态度属于(","o":["直接故意","疏忽大意的过失","间接故意","过于自信的过失"],"a":"C","e":"直接故意是指行为人明知自己的行为\n会发生危害社会的结果,并且希望这种结果发生的心\n理状态,题干中甲并不希望杀死赵某,不属于直接故\n意,故选项A错误。疏忽大意的过失,是指行为人应\n当预见自己的行为可能发生危害社会的结果,因为疏\n忽大意而没有预见,以致发生危害结果的主观心理态\n度,本题中甲已经认识到自己枪法不好可能误伤赵\n某,为此不属于疏忽大意,选项B错误。过于自信的\n过失,是指行为人已经预见到自己的行为可能发生危\n害社会的结果,但是轻信能够避免,以致发生这种结\n果的主观心理态度,本题中,甲明知自己的枪法不好,\n他没有对自己能精准射击猎物而不误伤赵某有足够\n的自信,为此D错误。间接故意,指明知自己的行为\n会发生危害社会的结果,并且放任这种结果发生的心\n理态度。所谓放任危害结果的发生,就是听其自然,\n纵容危害结果的发生,对危害结果的发生虽然不积极\n追求但也不设法避免。本题中,甲明知自己的枪法不\n好,也就是明知自己有可能射中猎物旁边的赵某,依\n然放任这种结果的发生,对危害结果的发生没有采取\n任何措施,所以,甲对赵某死亡的心理态度属千间接\n故意,C项正确。","k":"犯罪主观方面"},{"id":"2020-19","y":2020,"t":"单","s":"工休期间,建筑工人甲在工地上将与自己相 互嬉闹的工友乙推倒,致乙跌落摔死。甲的行为应认 定为()。","o":["意外事件","重大责任事故罪","故意伤害罪","过失致人死亡罪"],"a":"D","e":"甲与工友相互嬉闹致其死亡,甲的主观\n方面是过失,AC选项错误。重大责任事故罪要求发\n生在生产作业过程中,本题是在工休期间,B选项错\n误。因此只能按照过失致人死亡罪对甲定罪处罚,D\n选项正确。","k":"犯罪主观方面"},{"id":"2020-7","y":2020,"t":"单","s":"医生甲明知夏某不满18周岁,仍应夏某要求, 摘取其左肾移植给自己的病人。卖肾所得5万元全 部交给夏某。甲的行为应认定为()。 2020年全国法律硕士(非法学)联考真题","o":["不构成犯罪","非法行医罪","非法经营罪","故意伤害罪"],"a":"D","e":"根据《刑法》第234条之一的规定,摘\n取不满十八周岁的人的器官的,依照故意杀人罪或故\n意伤害罪定罪处罚。本题中,甲明知夏某不满18周\n岁,仍摘取其器官,构成故意伤害罪,D选项正确,\nABC选项错误。","k":"犯罪主观方面"},{"id":"2021-2","y":2021,"t":"单","s":"下列对于犯罪形态的理解中,正确的是","o":["自动放弃重复侵害行为的,应认定为犯罪 既遂","准备用于预备行为的工具的,应认定为犯罪 预备","间接故意犯罪可以存在未遂形态","在犯罪预备阶段可以成立犯罪中止"],"a":"D","e":"自动放弃重复侵害行为的,是犯罪中\n止,A项错误。准备用于犯罪行为的工具,是犯罪预\n备,B项错误。间接故意和过失犯罪不存在犯罪的未\n完成形态,C项错误。在犯罪预备阶段和实行阶段都\n可以成立犯罪中止,D项正确。本题选D。","k":"犯罪主观方面"},{"id":"2022-6","y":2022,"t":"单","s":"甲驾驶车辆在封闭的高速公路上正常行驶,突然发现有人横穿公路,躲避不及,将 该人撞死。甲对该死亡结果","o":["无罪过","具有蔬忽大意的过失","具有间接故意","具有过于自信的过失"],"a":"A","e":"无罪过事件,是指《刑法》第16条规定\n的情况:\"行为在客观上虽然造成了损害结果,但是不\n是出于故意或者过失,而是由于不能抗拒或者不能预\n见的原因所引起的,不是犯罪。\"所谓不能预见的原\n因,是指行为人没有预见,而且根据当时的客观情况\n和行为人的主观认识能力,也不可能预见的原因。甲\n驾驶车辆在封闭的高速公路上正常行驶,在客观上虽\n然造成了将人撞死的损害结果,但是不是出于甲的故\n意或者过失,而是由\"有人突然横穿高速公路\"这一不\n能预见的原因所引起,属于无罪过事件。故A选项\n正确。","k":"犯罪主观方面"},{"id":"2024-15","y":2024,"t":"单","s":"防卫过当与事后防卫的共同之处在于()","o":["均属于量刑情节","均阻却犯罪成立","均构成故意犯罪","均超过防卫限度"],"a":"A","e":"","k":"犯罪主观方面"},{"id":"2024-7","y":2024,"t":"单","s":"甲系某快递企业(一人有限责任公司)的法定代表人,为赚取显著高于市场价格的运 费,违规将寄件人更换包装箱、能使人形成瘾癖国家规定管制的精神药品运往全国各地,本 案中,司法机关()","o":["可以通过推定的方式认定甲主观明知","需要证明甲获利的金额达到特定数额","只能针对自然人甲追究相关刑事责任","可以根据纯度折算甲运输的药品数量"],"a":"A","e":"","k":"犯罪主观方面"}]},{"sub":"刑法","name":"刑罚种类","w":1.5,"L":27,"qs":[{"id":"2005-12","y":2005,"t":"单","s":"赵某犯 A 罪,依法应当附加剥夺政治权利。合仪庭提出以下四种量刑意见,其中必定错误的意见(   )","o":["判处有期徒刑 2 年,附加剥夺政治权利 1 年","判处有期徒刑 2 年,缓刑 3 年,附加剥夺政治权利 1 年","判处管制 2 年,附加剥夺政治权利 1 年","判处拘役 6 个月,附加剥夺政治权利 1 年"],"a":"C","e":"刑法第55 条第2 款规定:判处管制附加剥夺政治权利的,剥夺政治权利的期限与管制的期限相等,\n同时执行。据此,选项C 错误。","k":"刑罚种类"},{"id":"2005-22","y":2005,"t":"多","s":"甲武装掩护走私毒品,法院判决其构成走私毒品罪,判处无期徒刑,并处没收财产。甲的下列哪些财产可纳入 适用 没收财产刑予以没收的范围(       )","o":["甲在走私毒品中使用的枪支","甲被查获的毒品和贩毒资金","甲在银行帐户上的 500 万元存款","甲所有的 2 辆豪华轿车"],"a":"CD","e":"根据刑法第59 条,没收财产的范围仅限于犯罪分子个人所有的合法财产。选项A、B 属于非法\n财物,但并非没收财产刑的对象,而应当根据刑法第64 条的规定予以没收或者追缴。","k":"刑罚种类"},{"id":"2005-4","y":2005,"t":"单","s":"使罪犯在有关人士帮助、监督、辅导下能更好地适应社会自由生活,减少该犯罪再次犯罪的机率。下列选项中较 能 体现这一观念的制度是(   )","o":["缓刑","管制","假释","减刑"],"a":"C","e":"缓刑,是指人民法院对于被判处拘役、3 年以下有期徒刑的犯罪分子,根据其犯罪情节和悔罪表现,\n认为暂缓执行原判刑罚,确实不致再危害社会的,规定一定的考验期,暂缓其刑罚的执行,若犯罪分子在考验期内\n没有发生法定撤销缓刑的情形,原判刑罚就不再执行的制度。管制,是指对犯罪分子不予关押,但限制其一定自由,\n由公安机关予以执行的刑罚方法。假释,是指被判处有期徒刑、无期徒刑的犯罪分子,在执行一定刑期之后,因其\n认真遵守监规,接受教育改造,确有悔改表现,不致再危害社会,而附条件地将其予以提前释放的制度。减刑是指\n对判处管制、拘役、有期徒刑或者无期徒刑的犯罪分子,因其在刑罚执行期间认真遵守监规,接受教育改造,确有\n- 6 -\n\n \n \n更多考研精品资料,关注淘宝店铺:光速考研工作室 \n悔改或者立功表现,而适当减轻其原判刑罚的制度。题干中要求\"更好地适应社会自由生活\",即意味着该犯罪分\n子已经被剥夺人身自由,因此,应当排除选项A、B。","k":"刑罚种类"},{"id":"2006-8","y":2006,"t":"单","s":"元期徒刑减为有期徒刑时,附加剥夺政治权利的期限应当改为(   )","o":["5 年以上 10 年以下","3 年以上 10 年以下","3 年以上 8 年以下","1 年以上 5 年以下"],"a":"B","e":"见《刑法》的57 条剥夺政治权利的规定。","k":"刑罚种类"},{"id":"2007-11","y":2007,"t":"单","s":"甲因抢劫罪被判处有期徒刑 10 年,附加剥夺政治权利 3 年。甲 (   ) 。","o":["在监狱服刑期间被剥夺政治权利 3 年, 3 年期满后享有政治权利","在监狱服刑期间被剥夺政治权利,出狱后还需剥夺政治权利 3 年","在监狱服刑期间不被剥夺政治权利,出狱后开始执行剥夺政治权利 3 年","在监狱服刑期间的最后 3 年被剥夺政治权利"],"a":"B","e":"?! \n剥夺政治权利 \n]刑法规定,附加剥夺政治权利的刑期,从徒刑、拘役执行完毕之日或者从假释之日起 \n计算;剥夺政治权利的效力当然适用于主刑执行期间。因此,甲被附加剥夺政治权利 3 年, \n在监狱服刑期间当然没有政治权利,出狱后还须被剥夺政治权利 3 年。 \n答案为 B。 ’","k":"刑罚种类"},{"id":"2007-12","y":2007,"t":"单","s":"甲因交通肇事罪被判处有期徒刑 2 年,缓刑 3 年。在缓刑考验期经过 1 年时,甲又因失火罪被判处有期徒刑 4 年 。 对甲应 (   ) 。","o":["撤销缓刑,在 6 年以下、 4 年以上决定执行的刑期","撤销缓刑,在 6 年以下、 4 年以上决定执行的刑期,经过的 1 年考验期计入应执行的刑期","撤销缓刑,减去经过的 1 年考验期,在 5 年以下、 4 年以上决定执行的刑期","不撤销缓刑,先执行有期徒刑 4 年,然后继续进行缓刑考验"],"a":"A","e":"缓刑的撤销 \n]刑法第 77 条规定,被宣告缓刑的犯罪分子,在缓刑考验期限内犯新罪或者发现判决 \n宣告以前还有其他罪没有判决的,应当撤销缓刑,对新犯的罪或者新发现的罪作出判决,把 \n前罪和后罪所判处的刑罚,依照本法第 69 条的规定,决定执行的刑罚。也就是说,在总和 \n刑期以下、数刑中最高刑期以上;酌情决定执行的刑期。故答案为 A。","k":"刑罚种类"},{"id":"2007-13","y":2007,"t":"单","s":"甲于 2001 年 1 月 20 日 对一处国家保护的名胜古迹进行破坏,情节严重。 2006 年 1 月 21 日甲因嫖娼行 为 被公安人员抓获,交代了上述破坏名胜古迹行为。我国刑法规定,故意毁损国家保护的名胜古迹,情节严重的, 处 5 年以 下有期徒刑或者拘役,并处或者单处罚金。甲的破坏名胜古迹行为 (   ) 。","o":["已超过追诉时效期限,不应追究刑事责任","仍在追诉时效期限内,应当追究刑事责任","应认为是对名胜古迹的持续破坏,不受追诉时效期限的限制","虽已超过追诉时效期限,但可报最高人民检察院核准,追究其刑事责任"],"a":"B","e":"追诉时效 。 \n]根据刑法的规定,法定最高刑为不满 5 年有期徒刑的,追诉时效为 5 年,但是在人民 \n检察院、公安机关、国家安全机关立案侦查或者在人民法院受理案件以后,逃避侦查或者审 \n判的,不受追诉期限的限制。故答案为 B。","k":"刑罚种类"},{"id":"2008-23","y":2008,"t":"多","s":"下列关于缓刑的表述,正确的有(     )。","o":["对累犯不适用缓刑","由公安机关对被宣告缓刑的犯罪分子进行考察","有期徒刑的缓刑考验为原判刑期以上 5 年以下","缓刑的对象是被判处 3 年以下有期徒刑、拘役或者管制的犯罪分子"],"a":"AB","e":"解释]根据《刑法》第74 条,对于累犯,不适用缓刑,故选项A 正确。根据《刑法》第76 条,被宣告缓\n刑的犯罪分子,在缓刑考验期限内,由公安机关考察,所在单位或者基层组织予以配合,因此选项B 正确。根据《刑\n法》第73 条第2 款。有期徒刑的缓刑考验期限为原判刑期以上5 年以下,但是不能少于1 年,故选项C 不严密。根\n据《刑法》第72 条第1 款。缓刑的对象是被判处拘役、3 年以下有期徒刑的犯罪分子,不包括被判处管制的犯罪分\n子,故选项D 错误。本题应选A、B。","k":"刑罚种类"},{"id":"2009-12","y":2009,"t":"单","s":"下列关于无期徒刑的表述中,正确的是(   )。","o":["对不满 16 周岁的人不得适用无期徒刑","被判处无期徒刑的犯罪人在判决执行以前的羁押不得折抵刑期","对被判处无期徒刑的犯罪人不得适用假释","对被判处无期徒刑的犯罪人可以附加剥夺政治权利 10 年以上"],"a":"B","e":"本题考查无期徒刑。对不满16 周岁的人没有不得使用无期徒刑的规定。A 选项错误。由于无期\n徒刑没有刑期,犯罪终身被剥夺自由,在判决执行前的羁押时间不存在折抵刑期的问题。B 选项正确。《刑法》第\n18 条规定,对累犯以及因杀人、爆炸、抢劫、强奸、绑架等暴力性犯罪被判处10 年以上有期徒刑、无期徒刑的犯\n罪分子,不得假释。C 选项错误。《刑法》第57 条规定,对于被判处死刑、无期徒刑的犯罪分子,应当剥夺政治权\n利终身。D 选项错误。因此保额本题答案为B","k":"刑罚种类"},{"id":"2009-19","y":2009,"t":"单","s":"下列关于没收财产刑的说法,正确的是(   )。","o":["没收财产前犯罪分子所负的任何债务都不能以没收的财产偿还","对犯罪分子非法取得的财产应当适用没收财产刑","在判处没收财产刑时不得没收犯罪分子家属应有的财产","对犯罪分子在犯罪中使用的本人财物应当适用没收财产刑"],"a":"C","e":"本题考查没收财产刑。《刑法》第60 条规定,没收财产以前犯罪法分子所负的正当债务,需要以\n没收财产偿还的,经债权人请求,应当偿还。A 选项错误。对犯罪分子非法取得的财产应当收缴,而不是使用没收\n财产刑。B 选项错误。《刑法》第59 条规定,没收财产是没收犯罪分子的个人所得财产的一部或全部。没收全部财\n产的,应对犯罪分子个人及其抚养的家属保留必要的生活费用。在判处没收财产的时候,不得没收属于犯罪分子家\n属所有或者应有的财产。C 选项正确。法律并未规定对犯罪分子在犯罪中是使用的本人财物应当使用没收财产刑。D\n选项错误。因此本题答案为C","k":"刑罚种类"},{"id":"2012-41","y":2012,"t":"多","s":"甲因犯泄露内幕信息罪被判处3年有期徒 刑,缓刑5年。在缓刑考验期限内,甲又犯间谍罪,依 法被判处5年有期徒刑。关于本案,下列说法中正确 的有( )。","o":["甲构成累犯,应当从重处罚","对甲应当附加剥夺政治权利","对甲应在5年以上8年以下酌情决定执行的 刑期","对甲应在5年以上10 年以下酌情决定执行的 刑期"],"a":"BC","e":"本题考查的是缓刑考验期内犯罪的相\n关规定。首先法律并没有规定缓刑期内犯罪的需要\n从重处罚,所以A项没有根据。第二,对于危害国家\n安全的犯罪应当剥夺政治权利,所以B项正确。第\n三,对于缓刑期内犯罪的要实行数罪并罚,数罪并罚\n的刑期是总和刑期之下,最高刑期之上量刑,所以C\n正确,D错误。","k":"刑罚种类"},{"id":"2013-3","y":2013,"t":"单","s":"下列选项中,符合我国刑法关于罚金规定的是 )。","o":["罚金在判决指定的期限内一次或者分期缴纳","不允许未成年罪犯的监护人代为垫付罚金","在判决指定的期限内不缴纳罚金的,应改判为 有期徒刑","由于不能抗拒的灾祸,确实不能缴纳罚金的, 应免除罚金"],"a":"A","e":"罚金是财产刑的一种,指的是人民法院\n判处犯罪分子或者犯罪的单位向国家缴纳一定金钱\n的刑罚方法。所以A选项表述正确。其执行方式包\n括一次缴纳、分期缴纳、强制缴纳、随时缴纳、减免缴\n纳延期缴纳。B选项未成年罪犯一般不判处罚金,\n但是必要的时候可以判处罚金,如果未成年罪犯并无\n个人财产,可以由监护人代为缴纳。C选项在判决指\n定期间不缴纳罚金的,可以由法院判处强制缴纳或者\n随时追缴,而并不能改判刑种。D选项因不可抗力的\n灾难确实不能缴纳罚金的,是可以酌情减免缴纳,而\n非应当减免缴纳。","k":"刑罚种类"},{"id":"2014-11","y":2014,"t":"单","s":"甲(17周岁,无业)收受犯罪人窃得的笔记本 电脑后,为其窝藏赃物,构成犯罪,依法应处3年以上 7年以下有期徒刑,并处罚金。对甲适用罚金的正确 做法是( )。 )。","o":["应对甲免除罚金","应判令甲的监护人缴纳罚金","应对甲处以不少于500元的罚金","应将甲收受的电脑拍卖充抵罚金"],"a":"C","e":"本题考查的是对罚金刑的执行。根据\n最高人民法院《关于适用财产刑的若干问题的规定》\n第2条第2款的规定,\"对未成年人犯罪应当从轻或\n者减轻判处罚金。但罚金的最低数额不能少于五百\n元\n\"。本题中甲为未成年人,被判处并处罚金,应当支\n付不少于500元的罚金。","k":"刑罚种类"},{"id":"2016-45","y":2016,"t":"多","s":"甲(76周岁)因生活琐事与妻子发生争执,盛 怒之下用水果刀将妻子一刀捅死。对于甲的刑事责 任,下列选项中正确的有()。","o":["对甲可以适用死刑","对甲不能适用死刑","对甲可以从轻或者减轻处罚","对甲可以判处死刑缓期执行,同时决定对其 限制减刑"],"a":"BC","e":"《刑法》第49条第二款规定:\"审判的\n时候已满七十五周岁的人,不适用死刑,但以特别残\n忍手段致人死亡的除外。\"\n第17 条规定:\"已满七十五周岁的人故意犯罪\n的,可以从轻或者减轻处罚;过失犯罪的,应当从轻或\n者减轻处罚。\"\n本题中,甲盛怒之下用水果刀将妻子一刀捅死,\n不是以特别残忍的手段致人死亡,甲已满七十五周\n岁,不适用死刑,所以B选项正确,A选项错误。不适\n用死刑的意思是既不能适用死刑立即执行,也不能适\n用死刑缓期执行,所以D选项错误。甲是故意犯罪,\n已满七十五周岁,可以从轻或者减轻处罚,C选项\n正确。","k":"刑罚种类"},{"id":"2017-11","y":2017,"t":"单","s":"判决宣告前,一人犯数罪,分别被判处有期徒 刑的,对于数个有期徒刑的并罚,应采用()。","o":["吸收原则","简单相加原则","并科原则","限制加重原则"],"a":"D","e":"吸收原则是指对一人所犯数罪采用重\n罪吸收轻罪或者重罪刑吸收轻罪刑的合并处罚规则。\n并科原则也称相加原则,是指将一人所犯数罪分别宣\n告的各罪刑罚绝对相加、合并执行的合并处罚规则。\n限制加重原则是指以一人所犯数罪中法定(应当判\n处)或已判处的最重刑罚为基础,再在一定限度之内\n对其予以加重作为执行刑罚的合并处罚规则。《刑\n法》第69条第1 款规定:判决宣告以前一人犯数罪\n的,除判处死刑和无期徒刑的以外,应当在总和刑期\n以下、数刑中最高刑期以上,酌情决定执行的刑期,但\n是管制最高不能超过3年,拘役最高不能超过1年,\n有期徒刑总和刑期不满35年的,最高不能超过20\n年,总和刑期在35年以上的,最高不能超过25年。\n因此死刑、无期徒刑采取的是吸收原则,有期徒刑的\n并罚采取的是限制加重原则,D项正确。","k":"刑罚种类"},{"id":"2018-7","y":2018,"t":"单","s":"下列关于管制的描述,不正确的是( )。","o":["在劳动中同工同酬","依法实行社区矫正","可同时适用禁止令","刑期从判决宣告之日起计算 根据下列案情,回答8 、9 小题。 甲加盖违章建筑,并串通负责房屋征收的国家机 关工作人员乙,乙利用职务上的便利帮甲违法所得了 200 万元征收补偿款,事后,甲将其中的 5 万元送 给乙"],"a":"D","e":"《刑法》第38条规定:管制的期限,为\n三个月以上二年以下。判处管制,可以根据犯罪情\n况,同时禁止犯罪分子在执行期间从事特定活动,进\n人特定区域、场所,接触特定的人。对判处管制的犯\n罪分子,依法实行社区矫正。违反第二款规定的禁止\n令的,由公安机关依照《中华人民共和国治安管理处\n罚法》的规定处罚。因此BC项正确。《刑法》第39\n条第2款规定:对于被判处管制的犯罪分子,在劳动\n中应当同工同酬。因此A项正确。《刑法》第41条规\n定:管制的刑期,从判决执行之日起计算;判决执行以\n前先行羁押的,羁押一日折抵刑期二日。因此D项错\n误。本题选D。","k":"刑罚种类"},{"id":"2019-19","y":2019,"t":"单","s":"下列对于我国刑法中“终身监禁”的理解,正 确的是()。","o":["终身监禁属于一种新的刑罚种类而非刑罚执 行方式","终身监禁作出后不得根据服刑表现进行减刑 或假释","终身监禁应适用于国家工作人员实施的各种 职务犯罪","判处死刑缓期执行的罪犯减为无期徒刑时应 适用终身监禁"],"a":"B","e":"终身监禁,是指对贪污、受贿行为,罪行\n极其严重,判处死刑缓期执行二年期满,依法减为无\n期徒刑后,不得减刑、假释的刑罚执行措施。《刑法》\n第383条第4款的规定:犯第一款罪,有第三项规定\n情形被判处死刑缓期执行的,人民法院根据犯罪情节\n等情况可以同时决定在其死刑缓期执行二年期满依\n法减为无期徒刑后,终身监禁,不得减刑、假释。B项\n正确。终身监禁是一种刑罚执行措施,不是新设立的\n刑种,所以A项说法错误。目前我国刑法规定的终身\n监禁只适用千严重贪污、受贿犯罪被判处死刑缓期执\n行的罪犯,法院根据犯罪情节等情况衡星应当适用终\n身监禁的,并不是适用于国家工作人员实施的各种职\n务犯罪,C项说法错误。我国刑法不是对判处死刑缓\n期执行的罪犯减为无期徒刑时都应适用终身监禁,而\n仅仅限定千贪污、受贿目罪行极其严重,D项说法\n错误。","k":"刑罚种类"},{"id":"2019-44","y":2019,"t":"多","s":"按照我国刑法规定,应当适用社区矫正的对 象包括()。","o":["被裁定假释的犯罪分子","被宣告缓刑的犯罪分子","被判处管制的犯罪分子","被单处剥夺政治权利的犯罪分子"],"a":"ABC","e":"所谓社区矫正是指与监禁刑罚执行对\n应的一种非监禁刑罚执行方式,即将符合法定条件\n的罪犯置于社区内,由专门的国家机关在有关部门、\n社会组织和志愿者的协助下,在判决、裁定或决定确\n定的期限内,不脱离社会,矫正其犯罪心理和行为恶\n习的非监禁刑罚执行活动。目前,我国社区矫正的对\n象包括被判处管制、宣告缓刑、裁定假释、暂予监外执\n行以及被剥夺政治权利在社会服刑的5种罪犯。所\n以,选ABC。选项D说法不完整,因为只有被剥夺政\n治权利且在社会服刑的人员才可以适用社区矫正,如\n果被剥夺了政治权利而在监狱服刑的人员是无法适\n用社区矫正的。","k":"刑罚种类"},{"id":"2020-12","y":2020,"t":"单","s":"下列关于剥夺政治权利的最高期限的说法 ()。 中,正确的是()。","o":["单处剥夺政治权利的期限不得超过10年","判处管制,附加剥夺政治权利的期限不得超过 5年","判处有期徒刑,附加剥夺政治权利的期限不得 超过5年","从无期徒刑减为有期徒刑时,附加剥夺政治 权利的期限不得超过15年"],"a":"C","e":"剥夺政治权利的期限有以下四种情况:\n(1)独立适用剥夺政治权利或者主刑是有期徒刑、拘\n役附加剥夺政治权利的,期限为1年以上5年以下;\n(2)判处管制附加剥夺政治权利的,期限与管制的期\n限相等;(3)判处死刑、无期徒刑的,应当剥夺政治权\n利终身;(4)死刑缓期执行减为有期徒刑或者无期徒\n刑减为有期徒刑的,应当把附加剥夺政治权利的期限\n相应地改为3年以上10年以下。C选项正确,ABD\n选项错误。","k":"刑罚种类"},{"id":"2021-7","y":2021,"t":"单","s":"下列对千禁止令的理解中,正确的是( )","o":["禁止令的期限应与缓刑、管制执行的期限 相同","禁止令的执行期限从缓刑、管制执行之日起 计算","禁止令由公安机关负责执行","禁止令属于附加刑的具体种类"],"a":"B","e":"《最高人民法院、最高人民检察院、公\n安部司法部关千对判处管制、宣告缓刑的犯罪分子\n适用禁止令有关问题的规定(试行)》第6条规定:\n\" 禁止令的期限,既可以与管制执行、缓刑考验的期限\n相同,也可以短于管制执行、缓刑考验的期限,但判处\n管制的,禁止令的期限不得少千三个月,宣告缓刑的,\n禁止令的期限不得少于二个月。判处管制的犯罪分\n子在判决执行以前先行羁押以致管制执行的期限少\n于三个月的,禁止令的期限不受前款规定的最短期限\n的限制。禁止令的执行期限,从管制、缓刑执行之日\n起计算。\"A项错误,B项正确。第9条规定:\"禁止令\n由司法行政机关指导管理的社区矫正机构负责执\n行。\"C项错误。禁止令不属于附加刑,D项错误。本\n题选B。","k":"刑罚种类"},{"id":"2021-8","y":2021,"t":"单","s":"“数罪中有判处有期徒刑和管制,或者拘役和 管制的,有期徒刑、拘役执行完毕后,管制仍须执行。” 这一规定体现的并罚原则是( )","o":["并科原则","限制加重原则","加重原则","吸收原则"],"a":"A","e":"并科原则是指将一人所犯数罪分别宣\n告的各罪刑罚绝对相加、合并执行的合并处罚规则。\n题干中\n\" 有期徒刑、拘役执行完毕后,管制仍须执行\n\"\n体现了并科原则,A项正确。","k":"刑罚种类"},{"id":"2022-14","y":2022,"t":"单","s":"适用没收财产刑时,可以没收","o":["被告人收受的贿赂款","被告人持有的股票","被告人的土地承包经营权","被告人作案使用的电脑"],"a":"B","e":"人所有财产,可以没收。B选项正确。被告人收受的\n贿赂款属于赃款赃物,被告人作案使用的电脑属于犯\n罪工具,应先行查封、扣押、冻结,待法院作出的判决\n生效后上缴国库。A、D选项错误。土地承包经营权\n是以户为单位的,且属于使用权而非所有权,不属于\n其个人所有财产,不适用没收财产刑。C选项错误。","k":"刑罚种类"},{"id":"2022-15","y":2022,"t":"单","s":"如果我国刑法规定,犯甲罪的,处10年以上有期徒刑、无期徒刑或者死刑,对犯甲 罪的被告人适用减刑时","o":["可以判处拘役","可以判处无期徒刑","可以判处8年有期徒刑","可以判处死刑缓期2年执行"],"a":"C","e":"法定刑即刑法分则条文对具体犯罪所\n规定的量刑标准,包括刑罚种类和刑罚幅度。甲罪的\n法定刑为10年以上有期徒刑、无期徒刑或者死刑,对\n犯甲罪的被告人适用减刑时不可能判处拘役刑。A\n选项错误。减刑是指对被判处管制、拘役、有期徒刑\n或者无期徒刑的犯罪分子,因其在刑罚执行期间认真\n遵守监规,接受教育改造,确有悔改或者立功表现,而\n适当减轻其原判刑罚的制度。减刑只适用于被判处\n管制、拘役、有期徒刑或者无期徒刑的犯罪分子,对犯\n甲罪的被告人适用减刑时不可能判处死刑缓期2年\n执行。D选项错误。宣告刑是指国家审判机关对具\n体犯罪人依法判处并宣告应当实际执行的刑罚。若\n甲被宣告判处无期徒刑,根据《最高人民法院关于办理\n减刑、假释案件具体应用法律的补充规定》第3条规\n定,被判处无期徒刑,符合减刑条件的,执行4年以上\n方可减刑。确有悔改表现或者有立功表现的,可以减\n为23年有期徒刑;确有悔改表现并有立功表现的,可\n以减为22年以上23年以下有期徒刑;有重大立功表\n现的,可以减为21年以上22年以下有期徒刑。因此,\n若犯甲罪的被告人被宣告判处无期徒刑,对其适用减\n刑时不可能仍判处无期徒刑。B选项错误。若犯甲罪\n的被告人被宣告判处16年及以下刑期的有期徒刑,对\n其适用减刑时,可以判处8年有期徒刑。C选项正确。","k":"刑罚种类"},{"id":"2024-11","y":2024,"t":"单","s":"持A国临时边境通行证的人员可从指定口岸出人我国国境,并在规定的边境区活动,","o":["对甲可以独立适用驱逐出境","甲没有偷越我国国(边)境","我国对甲的行为没有刑事管辖权","甲的行为属于组织他人偷越我国国(边)境"],"a":"A","e":"","k":"刑罚种类"},{"id":"2024-5","y":2024,"t":"单","s":"我国刑法规定,非法吸收公众存款,扰乱金融秩序的,处三年以下有期徒刑或拘役, 并处罚金。此处规定的罚金属于()","o":["限额罚金","无限额罚金","比例罚金","倍比罚金"],"a":"B","e":"","k":"刑罚种类"},{"id":"2025-11","y":2025,"t":"单","s":"下列选项中,体现我国刑罚特殊预防目的的是( )","o":["开展宣传教育,提高公民的刑事法治观念","通过对犯罪分子的处罚,安抚被害人及其亲属","通过对犯罪分子的处罚,威慑意图实施犯罪的其他人","对判处管制的犯罪分子实行社区矫正,预防其重新犯罪"],"a":"D","e":"特殊预防,就是通过刑罚适用,预防犯罪人重新犯罪。一般预防,就是通过对犯\n罪人适用刑罚,预防尚未犯罪的人实施犯罪。A 项开展普法教育,是一般预防,A 项错误。B\n项安抚被害人及亲属,体现安抚功能,不是特殊预防,B 项错误。C 项体现一般预防,C 项错\n误。D 项预防犯罪人重新犯罪,体现特殊预防。本题选D。","k":"刑罚种类"},{"id":"2025-19","y":2025,"t":"单","s":"若甲被判处死刑缓期执行,期间有重大立功表现,二年期满后应减为( )","o":["无期徒刑","20 年有期徒刑","25 年有期徒刑","35 年有期徒刑"],"a":"C","e":"《刑法》规定\"判处死刑缓期执行的,在死刑缓期执行期间,如果没有故意犯罪,\n二年期满以后,减为无期徒刑;如果确有重大立功表现,二年期满以后,减为二十五年有期徒\n刑;如果故意犯罪,情节恶劣的,报请最高人民法院核准后执行死刑;对于故意犯罪未执行死\n刑的,死刑缓期执行的期间重新计算,并报最高人民法院备案。\"C 项正确,ABD 项错误。本题\n选C。","k":"刑罚种类"}]},{"sub":"刑法","name":"分则·危害公共安全罪","w":1.2,"L":24,"qs":[{"id":"2005-14","y":2005,"t":"单","s":"交通肇事并具有下列哪种情形的,应追究刑事责任(   )","o":["致 3 人死亡,负事故次要责任的","致 2 人死亡,负事故同等责任的","致 1 人死亡,负事故主要责任的","造成财产损失无能力赔偿数额 20 万元以上不满 30 万元,负事故全部责任的"],"a":"C","e":"交通事故责任分为全部责任、主要责任、同等责任、次要责任。根据《最高人民法院关于审理交通\n肇事刑事案件具体应用法律若干问题的解释》第2 条第1 款,交通肇事并具有以下情形之一的,依法追究刑事责任:\n1死亡一人或者重伤三人以上,负事故全部或者主要责任的;2死亡三人以上,负事故同等责任的;3造成公共财\n产或者他人财产直接损失,负事故全部或者主要责任,无能力赔偿数额在三十万元以上的。选项A,负事故同等责\n任以上的,才依法追究刑事责任;选项B,负事故主要责任以上的,才依法追究刑事责任;选项D,数额达到30 万\n元以上的,才依法追究刑事责任。","k":"分则·危害公共安全罪"},{"id":"2005-9","y":2005,"t":"单","s":"下列行为中,应以故意杀人罪定罪处罚的是(   )","o":["甲在与钱某争吵中,突然抽出随身携带的匕首向钱某刺一刀后扬长而去,致其重伤","乙在非发拘禁孙某过程中,使用暴力致孙某死亡","丙在绑架李某、向李某家属勒索财物过程中,杀害李某","丁对公共建筑物放火,大火烧毁该建筑物,并且烧死二人"],"a":"B","e":"选项A 中,甲的罪过形式明显是间接故意(放任)。在间接故意的情形下,按照实际造成的危害结\n果定性,因此选项A 应该定为故意伤害罪。根据刑法第238 条第2 款,非法拘禁他人或者以其他方法非法剥夺他人\n人身自由,并使用暴力致人死亡的,依照故意杀人罪定罪处罚。因此,选项B 应选。根据刑法第239 条第1 款,以\n勒索财物为目的绑架他人的,或者绑架他人作为人质,致使被绑架人死亡或者杀害被绑架人的,仍按照绑架罪定罪\n处罚。选项D 的行为客观上危害公共安全,构成放火罪。","k":"分则·危害公共安全罪"},{"id":"2006-10","y":2006,"t":"单","s":"甲在生产作业期间,违反操作规程造成供电线路短路,引起火灾,烧毁厂房,致 3 名工人死亡,造成直接经济 损失1 千万元。甲的行为构成(   )","o":["失火罪","过失致人死亡罪","重大责任事故罪","失火罪和过失致人死亡罪"],"a":"C","e":"过失致人死亡罪、失火罪、重大责任事故罪,三罪法条竞合,根据特别法优于一般法原则选C \n- 6 -\n\n \n \n更多考研精品资料,关注淘宝店铺:光速考研工作室","k":"分则·危害公共安全罪"},{"id":"2008-1","y":2008,"t":"单","s":"下列行为中,已满 14 周不满 16 周岁的人应当负刑事责任的是(  )。","o":["故意伤害致人重伤或者死亡、强奸、抢劫、拐卖儿童","强奸、抢劫、抢夺、放火、爆炸","强奸、抢劫、贩卖毒品、放火、爆炸","抢劫、绑架、放火、爆炸"],"a":"C","e":"根据《刑法》第17 条第2 款,已满14 周岁不满16 周岁的人,犯故意杀人、故意伤害致人重伤或者死\n亡、强奸、抢劫、贩卖毒品、放火为、爆炸、投放危险物质罪的,应当负刑事责任。已满14 周岁不满16 周岁的人\n对选项A 的\"拐卖儿童\"、选项B 的\"抢夺\"和选项D 的\"绑架\",不负刑事责任。本题应选C。","k":"分则·危害公共安全罪"},{"id":"2008-17","y":2008,"t":"单","s":"甲驾驶车辆在城市主干道不慎将乙撞成重伤,负事故主要责任。由于抢救乙的医疗费用不断增加,甲感到很紧张, 遂到 寺庙中祈祷乙快点死去。在其祈祷后的第二天,乙死亡。甲的行为构成(  )。","o":["过失致人死亡罪","交通肇事罪和故意杀人罪","过失致人重伤罪和故意杀人罪","交通肇事罪"],"a":"D","e":"乙死亡的结果仅与甲的交通肇事行为存在因果关系,与甲在寺庙中祈祷乙快点死去的行为不存在因果\n关系。甲的行为仅构成交通肇事罪。","k":"分则·危害公共安全罪"},{"id":"2008-18","y":2008,"t":"单","s":"甲欲杀乙,乘乙与朋友在餐馆聚会,向其投掷自制炸药,炸药爆炸后没有伤着乙,却致与乙一起聚餐的丙当场死 亡,丁、 戊受重伤。甲的行为应以(  )。","o":["故意杀人罪定罪处罚","
