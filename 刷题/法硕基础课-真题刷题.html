:"B","e":"民事权利根据权利的作用的不同可分\n为支配权、请求权、抗辩权、形成权。支配权是指可以\n对标的物直接支配并排除他人干涉的权利。请求权\n是指可以请求他人为一定行为或者不为一定行为的\n权利。形成权是指当事人一方可以以自己的行为使\n法律关系变动的权利。抗辩权是指对抗请求权或否\n认对方权利的权利。同时履行抗辩权,是指双务合同\n的当事人在没有约定履行顺序或约定应同时履行的\n情况下,一方当事人在对方未为对待给付之前,得拒\n绝履行自己债务的权利。申和乙签订了一份合同,未\n约定履行顺序。甲请求乙先履行,乙以甲未履行为由\n拒绝,乙拒绝履行系行使抗辩权。B选项正确。","k":"合同通则"},{"id":"2022-33","y":2022,"t":"单","s":"某网店打折促销某型号扫地机器人,甲见后立即提交订单购买10台并付款。后该 网店以库存不足为由拒绝发货。对此,该网店","o":["不承担民事责任","应当承担违约责任","应当承担缔约过失责任","应当承担违反预约合同的责任"],"a":"B","e":"缔约过失责任,是指在订立合同过程\n中,当事人一方因违反其依据诚实信用原则产生的先\n合同义务,而致另一方信赖利益损失时所应承担的赔\n偿责任。预约合同是指要约人与受要约人约定将来\n订立一定合同的合同。根据《民法典》第491条第2\n款的规定,当事人一方通过互联网等信息网络发布的\n商品或者服务信息符合要约条件的,对方选择该商品\n或者服务并提交订单成功时合同成立,但是当事人另\n有约定的除外。本题中,网店与甲并未另有约定,因\n此在甲提交订单成功后,双方合同便已经成立。同\n时,本合同并未附有生效条件或者期限,因此合同成\n立时便生效。可见,网店的行为并非发生在订立合同\n责任是指当事人不履行或不适当履行合同义务而应\n承担的民事责任。违约责任的构成要件主要包括:\n(1)当事人之间存在有效合同;(2)客观上有违约行\n为;(3)不存在免责事由。某网店打折促销某型号扫\n地机器人,甲见后立即提交订单购买10台并付款。\n此时网店与甲之间的合同已经成立并生效,网店拒绝\n发货且\"库存不足\"不属于免责事由,因此网店构成违\n约,应当承担违约责任。B选项正确,A选项错误。\n网店与甲之间的合同属于本约合同而非预约合同。D\n选项错误。","k":"合同通则"},{"id":"2022-50","y":2022,"t":"多","s":"Y公司常年为Z公司供货,货款按月计算,每年6月底支付。2021年1月10日,Y公司 与某银行订立有追索权的保理合同,将其对乙公司2021年第一季度的100万元货款债权 转让给银行,向银行融资80万元,保理期限6个月。Y公司到期未能向银行偿还保理融 资款,银行有权","o":["请求Y公司返还80万元融资款本息","请求Y公司回购100万元货款债权","请求Z公司偿还100万元货款侦务","保留Z公司偿还的100万元货款扣除80万元本息和相关费用后的剩余部分 三、简答题∶第51~54小题,每小题10分"],"a":"ABC","e":"根据《民法典》规定,保理合同是应收\n账款债权人将现有的或者将有的应收账款转让给保\n理人,保理人提供资金融通、应收账款管理或者催收、\n应收账款债务人付款担保等服务的合同。当事人约\n定有追索权保理的,保理人可以向应收账款债权人主\n张返还保理融资款本息或者回购应收账款债权,也可\n以向应收账款债务人主张应收账款债权。Y公司与\n某银行订立有追索权的保理合同,保理人某银行可以\n向应收账款债权人Y公司主张返还80万元保理融资\n款本息或者回购100万元应收账款债权,也可以向应\n收账款债务人Z公司主张100万元应收账款债权。\n故本题选择ABC。\n三、简答题","k":"合同通则"},{"id":"2024-22","y":2024,"t":"单","s":"甲向乙借10万元,乙称暂无现款,不过丙欠自己的10万元货款已到期,可将债权 转让给甲。甲同意,乙将此事通知丙,丙不同意,并向乙支付了10万元货款。3日后,丙发 现货物有瑕疵,要求乙按照合同约定支付2万元违约金。同日,甲请求丙支付10万元,丙拒 绝,并提出以下理由。其中能得到法院支持的是()","o":["自己已经向乙支付了货款","乙转让10万元债权未经自己同意","甲乙之间的合同为实践合同,尚未成立","自己应付的款项可与乙应支付的违约金部分抵销"],"a":"D","e":"","k":"合同通则"},{"id":"2024-24","y":2024,"t":"单","s":"司机甲在某货运平台上接单,货主乙委托其运输一批水果,订单未载明履行时间与 顺序,甲请求乙先支付报酬。乙主张按照之前与他人交易习惯,需要甲先送货,自己由收货 方结清货款后,再向甲支付报酬。对此下面说法正确的是()","o":["甲应当先送货","甲享有先履行抗辩权","甲在送货后可以随时请求乙支付报酬","乙的付款期限应当按照其与他人的交易习惯确定"],"a":"C","e":"","k":"合同通则"},{"id":"2024-31","y":2024,"t":"单","s":"A公司向B工厂订购一批零配件,并约定任意一方履行迟延15日以上,对方可以解 除合同。后B工厂因产能不足迟延20日仍无法发货。C公司可以()","o":["解除该订购合同","撤销该订购合同","变更该订购合同","请求B工厂赔偿损失"],"a":"A","e":"","k":"合同通则"},{"id":"2024-33","y":2024,"t":"单","s":"甲公司与乙公司约定,乙公司于11月30日前向甲公司提供价值50万元的柴油或燃 煤,后甲公司为了减少煤渣处理成本,要求乙公司交付柴油,乙公司拒绝并表示燃煤已备货, 于11月25日将燃煤运到甲公司所在地。下列说法正确的()","o":["乙公司应交付柴油","甲公司和乙公司订立的合同产生的是简单之债","甲公司可以请求乙公司承担违约责任","乙公司的合同债务已经履行"],"a":"D","e":"","k":"合同通则"},{"id":"2024-35","y":2024,"t":"单","s":"甲向乙发函:“我急需10吨X材料,愿以每吨5万元的价格购买,贵方如有货源请 直接发货。”乙立即回函:“最近成本上涨,仅能以每吨6万元的价格出售。”次日,乙向甲 发出10吨X材料,同时电话通知甲已按甲要求的数量发货。后甲收到乙的函件,以乙的报价 过高为由拒收运抵的材料。对此,下列说法正确是()","o":["甲、乙之间的买卖合同未成立","乙有权请求甲承担违约责任 2024年全国法律硕士(非法学)联考真题试卷丨专业基础课","乙有权请求甲承担缔约过失责任","甲有权请求乙承担缔约过失责任"],"a":"A","e":"","k":"合同通则"},{"id":"2024-39","y":2024,"t":"单","s":"A公司将厂房出租给B公司进行生产活动,某天,B公司工作人员操作不当引燃生产 原料,因A公司装修时使用法律禁止用于装修的易燃材料,火势蔓延,B公司损失达20万 元。对此B公司()","o":["只能请求A公司承担违约责任","只能请求A公司承担侵权责任","无权请求A公司承担赔偿责任","有权选择A公司承担违约责任或侵权责任"],"a":"D","e":"","k":"合同通则"},{"id":"2024-50","y":2024,"t":"多","s":"顾客与健身房签订了健身锻炼合同,在教练的指导下,顾客不仅未达到想要的健身 目的,并且身体还被拉伤,去医院治疗,其间耽误了工作。顾客有权()","o":["要求健身房支付医药费、误工费、护理费","解除和健身房的服务合同","要求健身房退还未上完课程费用","请求健身房赔礼道 三、简答题(第51~54小题,每小题10分"],"a":"ABC","e":"","k":"合同通则"},{"id":"2025-25","y":2025,"t":"单","s":"甲收到的手机短信通知显示,甲的借记卡在外地ATM 机取现1 万元。甲当即用该借记 卡在ATM 机存入100 元并报警。经查,该卡密码未泄露,但长时间未修改。甲的借记卡被盗刷 的损失应由( )","o":["甲自行承担","发卡行全部赔偿","甲与发卡行平均分担","盗刷者赔偿,发卡行承担补充责任"],"a":"B","e":"甲未泄露密码,且在发现盗刷后立即存入100 元并报警,已尽到合理注意义务和\n止损义务,无过错,不应自行承担损失,AC 项错误。发卡行未尽到安全保障义务,导致甲的\n借记卡被盗刷,应承担全部赔偿责任,而不是补充责任,B 项正确,D 项错误。本题选B。","k":"合同通则"},{"id":"2025-29","y":2025,"t":"单","s":"甲欠乙90 万元借款,到期未偿还。双方约定甲以一套房屋抵偿该债务,但未实际履行。 半年后,甲通知乙办理抵债房屋过户手续,乙以房价下跌为由要求甲偿还90 万元。对此,下 列说法正确的是( )","o":["甲与乙之间的以物抵债协议未成立","甲与乙达成以物抵债协议后,原债务消灭","甲有权请求履行以物抵债协议","乙有权请求甲偿还90 万元"],"a":"C","e":"以物抵债协议属于诺成合同,即双方达成合意时协议即成立。本题中,甲与乙已\n约定\"以房屋抵偿债务\",协议已成立,A 项错误。仅当以物抵债协议履行完毕后原债务才消\n灭。本题中以物抵债协议未履行,原债务仍存在,B 项错误。债务人或者第三人未按照约定履\n行以物抵债协议,经催告后在合理期限内仍不履行,债权人有权选择请求履行原债务或者以物\n抵债协议。但本题中债务人甲通知乙办理抵债房屋过户手续,即债务人按照约定履行以物抵债\n行为,此时债权人乙无权选择履行原债务或以物抵债协议,而是应当应甲的请求履行以物抵债\n协议,C 项正确,D 项错误。本题选C。","k":"合同通则"},{"id":"2025-46","y":2025,"t":"多","s":"A 公司与B 公司签订研制机器人的合作意向书,A 公司向B 公司交付了定金,约定待B 公司形成可行性研究报告后,双方订立合作开发合同。B 公司完成研究报告后,拒绝与A 公司 签订合作开发合同。A 公司有权请求B 公司( )","o":["双倍返还定金","承担违反合作意向书的违约责任","承担违反合作开发合同的违约责任","承担合作意向书未生效的缔约过失责任"],"a":"AB","e":"合作意向书属于预约合同,具有法律约束力。A 公司向B 公司交付定金,约定在\nB 公司完成可行性研究报告后订立合作开发合同,但B 公司完成研究报告后拒绝订立合同,构\n成违约。A 公司有权请求B 公司承担违反预约合同的违约责任,并双倍返还定金,AB 项正确。\n合作开发合同尚未订立,不存在违反该合同的违约责任,C 项错误。合作意向书已经生效,B\n公司的行为是违约而非缔约过失,D 项错误。本题选AB。","k":"合同通则"},{"id":"2026-30","y":2026,"t":"单","s":"2024 年5 月2 日,A 公司因经营困难向甲发函声明解除与甲的合同。甲收到 后未予理睬。因A 公司长期不履行,甲于11 月3 日起诉请求解除合同,后撤诉。 12 月5 日,甲向A 公司发出合同解除通知函,通知函于次日送达。该合同的解除 时间为","o":["2024 年5 月2 日","2024 年11 月3 日","2024 年12 月5 日","2024 年12 月6 日"],"a":"D","e":"单方解除通知到达对方时合同解除,通知12 月6 日送达,解除时间为12\n月6 日。前期单方发解除函、起诉撤诉均不发生解除效力。","k":"合同通则"},{"id":"2026-36","y":2026,"t":"单","s":"甲在A 网店网购一件衣服,约定送货上门。B 公司的快递员乙未经甲同意,自 行将快递交给甲所居住社区的门卫丙,导致衣服丢失。对此,甲有权请求","o":["A 网店赔偿损失","B 公司赔偿损失","乙赔偿损失","丙赔偿损失"],"a":"A","e":"网购买卖合同,卖方负有送货上门义务,未经买受人同意放门卫属于卖方\n\n履约瑕疵,买受人直接请求网店赔偿,网店可向快递追责。","k":"合同通则"},{"id":"2026-38","y":2026,"t":"单","s":"甲到某书店购书,背包内装有价值3 万元的首饰,寄放在书店的储物柜,并 支付了保管费,但没有告知书店包里面有贵重物品,书店保管不善毁损了首饰。 对于甲的损失","o":["书店不承担赔偿责任","书店承担一般物品赔偿责任","书店承担贵重物品赔偿责任","书店承担缔约过失责任"],"a":"B","e":"寄存贵重物品未事先声明,保管人毁损,仅按一般物品标准赔偿。","k":"合同通则"},{"id":"2026-39","y":2026,"t":"单","s":"甲、乙约定,甲借10 万元给乙,借款期限为一年,年利率为3%,每月按期付 利息,期满归还本金。如乙迟延还款,每日按欠款的0.01%支付延期利息。半年 后乙未按期还款付息,经甲催告后仍未支付,甲遂解除合同,并要求乙提前还款。 合同解除后乙应支付的迟延还款利息按照","o":["年利率3%","日利息的0.01%","解除合同时一年定期存款基准利率","解除合同时一年期贷款市场报价利率"],"a":"B","e":"合同解除不影响违约金条款效力,迟延利息约定有效,仍按日0.01%计算。","k":"合同通则"},{"id":"2026-48","y":2026,"t":"多","s":"A 公司为修建宿舍楼公开招标,B 公司以800 万元中标,2024 年12 月1 日B 公司收到中标通知书,12 月10 日A 公司与B 公司签订书面合同,约定工程价款 为1000 万元,B 公司经A 公司同意将宿舍楼的装修工程以100 万元分包给中小企 业C,并约定待A 公司支付工程价款后,B 公司向C 公司支付装修款项。A 公司逾 期半年未支付工程价款,B 公司未催要且无力向C 公司支付装修款。下列说法正 确的有","o":["A 公司与B 公司的建设工程合同于2024 年12 月1 日成立","A 公司与B 公司的建设工程合同价款为1000 万元","B 公司与C 公司关于装修价款支付的约定无效","C 公司可以代位行使B 公司对A 公司的建设工程价款优先受偿权"],"a":"ABCD","e":"中标通知书到达合同成立;书面合同变更价款以1000 万为准;分包约定\n待总包回款再付款属于不公平格式约定无效;次承包人可代位行使总包工程价款\n优先受偿权。","k":"合同通则"},{"id":"2026-50","y":2026,"t":"多","s":"刘某在家附近的商场逛街时,某游泳培训机构人员向其推销游泳课程,每节 课程原价100 元,购买20 节可打八折。刘某购买课程支付1600 元,在刘某完成 5 次课程后,该机构与商场A 租赁合同到期,搬迁至离刘某家较远的地方,刘某 遂要求解除合同。对此,说法正确的有","o":["刘某有权解除合同","刘某有权请求商场A 赔偿损失","若合同解除,培训机构应返还刘某预付本金1100 元","若合同解除,刘某有权请求培训机构返还预付款利息 三、简答题(第51~54 小题,每小题10 分"],"a":"AD","e":"培训机构搬迁导致合同目的难以实现,刘某有权解除;预付款利息法定孳\n息可一并主张;商场并非合同相对方,不担责;课程已消费部分应当扣除,返还\n本金不足1100 元,C 错误。\n三、简答题","k":"合同通则"}]},{"sub":"民法","name":"民事法律行为","w":2.9,"L":56,"qs":[{"id":"2005-33","y":2005,"t":"单","s":"在所附条件不成就时,附解除条件的民事法律行为(   )","o":["自动解除","自始无效","继续有效","不生效"],"a":"C","e":"《合同法》第45 条第1 款规定:\"当事人对合同的效力可以约定附条件。附生效条件的合同,\n自条件成就时生效。附解除条件的合同,自条件成就时失效。\"解除条件成就时失效,则解除条件不成就的,继续\n有效。因此,选项C 应选。","k":"民事法律行为"},{"id":"2005-45","y":2005,"t":"单","s":"依据我国《婚姻法》的有关规定,可撤销婚姻的撤销事由是(   )","o":["重婚","未到法定婚龄","因欺诈而结婚","因胁迫而结婚"],"a":"D","e":"选项AB,根据婚姻法第10 条,属于婚姻无效事由。选项D 根据第11 条属于可撤销婚姻的撤销事\n由。至于选项C,不影响婚姻效力。特别注意,对选项C 不能适用《合同法》第54 条第2 款的规定而认为属于撤销\n事由,因为合同法不适用于婚姻关系(合同法第2 条第2 款)。因欺诈而结婚,根据民法通则第58 条第1 款第3 项,\n婚姻无效;但是婚姻法第10 条并未将此规定为无效事由。根据特别法优于普通法的法律适用原则,因欺诈而结婚的,\n不影响婚姻效力。","k":"民事法律行为"},{"id":"2005-46","y":2005,"t":"单","s":"依据我国《继承法》的相关规定,口头遗嘱属于(   )","o":["要式民事法律行为","不要式民事法律行为","要物民事法律行为","附条件民事法律行为"],"a":"A","e":"要式民事法律行为,是指必须采用某种特定的形式才能成立的民事法律行为;不要式民事法律行为,\n是指法律没有规定特定形式而允许当事人选择约定形式的民事法律行为。《继承法》第17 条第5 款规定:\"遗嘱人\n在危急情况下,可以立口头遗嘱。口头遗嘱应当有两个以上见证人在场见证。危急情况解除后,遗嘱人能够用书面\n或者录音形式立遗嘱的,所立的口头遗嘱无效。\"据此,选项A 应选。要物民事法律行为,是指不仅要求双方当事\n人意思表示一致,而且要交付实物才能成立的法律行为。遗嘱属于单方行为,其成立也谈不上交付遗产,据此排除\n选项C。口头遗嘱的生效以立遗嘱人死亡为前提,属于附期限民事法律行为,并非附条件民事法律行为。据此排除\n选项D。 \n- 12 -\n\n \n \n更多考研精品资料,关注淘宝店铺:光速考研工作室","k":"民事法律行为"},{"id":"2005-51","y":2005,"t":"多","s":"下列事实不能引起不当得利之债的有(       )","o":["养子女给付生父母赡养费用","明知不欠他人钱款而为给付","提前偿还所欠他人债务","为履行合同而支付对方金钱,后该合同被确认无效"],"a":"ABC","e":"选项A 属于履行道德上的义务;选项B 属于明知无给付义务;选项C 属于给付未到期债务,都\n不产生不当得利之债。选项D 属于\"非债清偿\",支付金钱没有合法根据,构成不当得利之债。","k":"民事法律行为"},{"id":"2005-52","y":2005,"t":"多","s":"某甲与某乙签订了一份租房协议,协议约定:如果甲之子在一年内出国,则甲将房租给乙居住。这一民事法律 行为(       )","o":["既未成立,也未生效","已成立但未生效","是附条件的民事法律行为","是附期限的民事法律行为"],"a":"BCD","e":"一般地,双方当事人意思达成一致,合同成立。某甲与某乙签订了一份租房协议,因此该民事法\n律行为成立。排除选项A。但该民事法律行为附生效条件(甲之子出国),并附生效期限(一年内)。在生效条件\n成就和生效期限到达前,该行为自然不生效。据此,选项BCD 应选。","k":"民事法律行为"},{"id":"2005-53","y":2005,"t":"多","s":"依据我国《婚姻法》的规定,有下列情形,调解无效,应判决准予离婚的是(       )","o":["因感情不和分居满一年的","重婚或有配偶者与他人同居的","实施家庭暴力或虐待、遗弃家庭成员的","有赌博、吸毒等恶习屡教不改的"],"a":"BCD","e":"根据婚姻法第32 条,有下列情形之一,调解无效的,应准予离婚:1重婚或有配偶者与他人同\n居的;2实施家庭暴力或虐待、遗弃家庭成员的;3有**、吸毒等恶习屡教不改的;4因感情不和分居满二年的;\n5其他导致夫妻感情破裂的情形。据此,选项BCD 应选。至于选项A,错在\"一年\",应为两年。","k":"民事法律行为"},{"id":"2006-33","y":2006,"t":"单","s":"根据我国有关法律规定,属于效力未定合同的是(   )","o":["因重大误解而订","无权处分人与第三人订立的处分他人财务的合同","因受胁迫而订立的合同","法定代表超越代表权限订立的合同"],"a":"B","e":"《合同法》第51 条规定:无处分权人与处分第他人财产,经权利人追认或者无处分权人三人订立合\n同后取得处分权的,该合同有效。所以为效力未定合同,A 属可撤销合同,合同被撤销的合同自始无效,C 属无效合\n同,D 属于法定代表人签订的有效合同。所以应选B。","k":"民事法律行为"},{"id":"2006-40","y":2006,"t":"单","s":"除当事人另有约定外,保管合同的成立时间为(   )","o":["当事人意思表示一致时","保管物交付时","保管人签字时","保管费交付时"],"a":"B","e":"《合同法》第367 条,保管合同","k":"民事法律行为"},{"id":"2007-54","y":2007,"t":"多","s":"根据合同法规定,导致合同无效的情形包括 (       )。","o":["权利义务显失公平","以合法形式掩盖非法目的","损害社会公共利益","违反行政规章的强制性规定"],"a":"BC","e":"’ \n—合同无效的情形; \n]根据合同法第 52 条的规定,合同无效的情形有:(1)一方以欺诈、胁迫的手段订立合 \n同,损害国家利益;(2)恶意串通,损害国家、集体或者第三人利益;(3)以合法形式掩盖非 \n法目的;(4)损害社会公共利益;(5)违反法律、行政法规的强制性规定。权利义务显失公平 \n的合同为可变更、可撤销的合同。违反行政规章的强制性规定不属于无效合同的情形,只有 \n违反法律、行政法规的强制性规定才无效。故答案为 B、C。","k":"民事法律行为"},{"id":"2008-35","y":2008,"t":"单","s":"民法通则所称的重大误解不包括(  )。","o":["对民事行为性质的误解","对民事行为相对人的误解","对民事行为内容的误解","对民事行为动机的误解"],"a":"D","e":"根据《民通意见》第71 条,行为人因对行为的性质、对方当事人、标的物的品种、质量、规格和数\n量等的错误认识,使行为的后果与自己的意思相悖,并造成较大损失的,可以认定为重大误解。据上,选项A、B、\nC 都可以认定为重大误解,故选项D 应选。","k":"民事法律行为"},{"id":"2008-36","y":2008,"t":"单","s":"根据民法通则规定,可撤销行为在当事人申请撤销之前为(  )。","o":["有效行为","效力未定行为","无效行为","部分无效行为"],"a":"A","e":"可撤销民事行为,是指当事人依照法律规定针对欠缺有效条件而请人民法院或者仲裁机构予以变更或\n者撤销的民事行为。该种行为在依法撤销前为有效行为,故本题应选A。","k":"民事法律行为"},{"id":"2008-46","y":2008,"t":"单","s":"根据婚姻法规定,下列情形属于无效婚姻的是(  )","o":["与丙同居多年的甲与乙缔结的婚姻","甲因受胁迫与乙缔结的婚姻","甲因受欺诈与乙缔结的婚姻","甲与其祖父的外孙女缔结的婚姻"],"a":"D","e":"答案]根据《婚姻法》第10 条,有下列情形之一的,婚姻无效:(1)重婚的;(2)有禁止结婚的亲属关\n系的;(3)婚前患有医学上认为不应当结婚的疾病,婚后尚未治愈的;(4)未到法定婚龄的。在选项D,甲与其\n祖父的外孙女存在三代以内旁系血亲关系,属于禁止结婚的亲属关系,故该选项应选。根据《婚姻法》第11 条,因\n胁迫结婚的,受胁迫的一方可以向婚姻登记机关或人民法院请求撤销该婚姻。故选项B 属于可撤销婚姻,而非无效\n婚姻。选项A、C 的婚姻属于有效婚姻。","k":"民事法律行为"},{"id":"2008-47","y":2008,"t":"单","s":"甲在遗嘱中指定所留房屋归其子乙,存款归侄女丙。甲死之后乙、丙两人被告知 3 个月后参加甲的遗产分割。 但直至遗 产分割时,乙和丙均未做出是否接受遗产的意思表示。根据继承法规定,下列说法中正确的是(  )。","o":["将乙、丙的行为均视为接受遗产","将乙、丙的行为均视为放弃接受遗产","将乙的行为视为接受遗产,将丙的行为视为放弃接受遗产","将乙的行为视为放弃接受遗产,将丙的行为视为接受遗产"],"a":"C","e":"答案]《继承法》第25 条规定:继承开始后,继承人放弃继承的,应当在遗产处理前,作出放弃继承的表\n示。没有表示的,视为接受继承。受遗赠人应当在知道受遗赠后两个月内,作出接受或者放弃受遗赠的表示。到期\n没有表示的,视为放弃受遗赠,必须明确表示。乙属于遗嘱指定的继承人,而丙是遗嘱指定的受遗赠人,故本题应\n选C。","k":"民事法律行为"},{"id":"2009-34","y":2009,"t":"单","s":"某医院与危重病人家属签订医疗协议。协议对双方的权利义务进行了约定,其中有一免责条款:“在治疗过程 中, 患者发生任何伤亡情况,医院概不负责。”根据合同法规定,该协议的效力为(   ):","o":["无效","有效","效力待定","部分有效.部分无效"],"a":"D","e":"本题考查免责条款的效力。《合同法》第53 条规定,合同中的下列免责条款无效:造成对方人身\n伤害的;因故意或者重大过失造成对方财产损失的;《合同法》第56 条规定,无效的合同或者被撤销的合同自始没\n有法律约束力。合同部分无效,不影响其他部分仍然有效。本题中,某医院与病人家属签订的医疗协议中的免责条\n款无效,但不影响其他条款的效力,故协议部分有效,部分无效。因此本题的答案为D","k":"民事法律行为"},{"id":"2009-35","y":2009,"t":"单","s":"下列行为中,可以构成附条件民事法律行为的是(   )。","o":["小张在与保险公司签订的合同中约定“发生保险事故时,保险公司赔偿保险金”","小王与小李在房屋买卖合同中约定“双方到房产部门办理登记过户手续后,房屋所有权转移”","甲公司与乙公司在租赁合同中约定“待甲所建大楼落成时租给乙工作室两间”","小明的爷爷与小明约定“小明获得游泳冠军后,给小明买 1 台电脑”"],"a":"D","e":"本题考查附条件民事法律行为。附条件民事法律行为是指双方当事人在民事法律行为中设立一定的\n事由作为条件,以条件的成就与否作为该民事法律行为效力产生或解除根据的民事法律行为。条件应当是当事人以\n其意志所选择的事实,具有意定性。如果是法律规定的条件则不属于民事法律行为的所附条件。A 选项和B 选项中\n的条件属于法定条件,不构成附条件民事法律行为。条件具有或然性,即当事人在约定时不知道其将来是否发生。C\n选项中所附条件是必然发生的,不构成附条件民事法律行为。D 选项中的条件符合民事法律行为的所附条件特征,\n构成附条件民事法律行为。因此本题的答案为D","k":"民事法律行为"},{"id":"2011-31","y":2011,"t":"单","s":"根据《合同法》的规定,双务合同履行中的抗 。辩权包括()。","o":["同时履行抗辩权、先履行抗辩权和不安抗 辩权","同时履行抗辩权、先履行抗辩权和先诉抗辩权","后履行抗辩权、合同无效抗辩权和不安抗辩权","后履行抗辩权、合同消灭抗辩权和先诉抗 辩权"],"a":"A","e":"双务合同履行中的抗辩权包括同时履\n行抗辩权、先履行抗辩权和不安抗辩权。先诉抗辩权\n是在保证中一般保证人享有的权利,不是双务合同履\n行中的抗辩权。答案选A。(此处须熟记这4 种抗辩\n权的内容及区别。)","k":"民事法律行为"},{"id":"2011-36","y":2011,"t":"单","s":"在我国,有权宣告婚姻无效的机关是( )。","o":["公安机关","人民法院","婚姻登记机关","基层组织"],"a":"B","e":"对于无效婚姻,我国采用宣告无效的制\n度,即无效婚姻须经判决宣告,才能认定无效。根据\n最高人民法院相关司法解释,有权宣告婚姻无效的只\n能是人民法院,其他任何单位都无权宣告无效,故答\n案选B。","k":"民事法律行为"},{"id":"2015-21","y":2015,"t":"单","s":"下列民事权利中,属于支配权的是( )。","o":["甲对无权代理的追认权","乙对自身肖像的使用权","丙因受欺诈享有的撤销合同的权利","丁被他人打伤享有的请求赔偿的权利 )"],"a":"B","e":"所谓支配权是指可以对标的物直接支\n配并排除他人干涉的权利,如所有权。请求权是指请\n求他人为一定行为或不为一定行为的权利,如债权。\n抗辩权是指对抗请求权或否认对方权利的权利,如不\n安抗辩权。形成权是指当事人一方可以以自己的行\n为使法律关系发生变动的权利。肖像权的专有性体\n现在形象再现的专有权上,即只有肖像权人才有权决\n定是否允许他人再现自己的形象。肖像的使用权属\n于肖像权人,只有肖像权人方有权利转让。本题中的\nB选项,乙对自身肖像的使用权属于支配权。A 是形\n成权,C 是形成权,D是请求权。","k":"民事法律行为"},{"id":"2015-28","y":2015,"t":"单","s":"甲16周岁,无业,依靠父母生活。某日,甲向 朋友乙借款2万元,用其中的1万元买了名牌包送给 男友丙,用200元为自己的手机充值,用余款购买了一 )。 张美发店的消费卡。下列选项中,正确的是(","o":["甲与乙之间的借款合同有效","甲与丙之间的赠与合同无效","甲为手机充值的行为可撤销","甲购买消费卡的行为效力待定"],"a":"D","e":"本题考查的是对限制行为能力的理解。\n根据《民法典》的规定,限制民事行为能力人依法不能\n独立实施而又未经其法定代理人事先同意或者事后\n追认的合同,其行为效力待定。此种合同是否生效取\n决千法定代理人是否追认。据此,本题中,甲购买大\n额消费卡的行为效力待定,D选项正确。AB 选项是\n效力待定的合同,C选项是有效合同,因为200元是\n小额消费,与16岁的智力水平相适应。","k":"民事法律行为"},{"id":"2015-33","y":2015,"t":"单","s":"甲将住房出租给乙。签订合同前乙来看房,发 现室内有很浓的装修气味。甲告诉乙,开开窗,过几天 味道就没了。乙住了两个月后,气味依然很浓。经检 测,该房屋有害气体严重超标。对此,乙()。","o":["无权主张任何权利","有权解除合同","有权请求确认合同无效","有权要求甲承担侵权责任"],"a":"B","e":"在租赁合同中,出租人的义务包括保证\n租赁物上不存在权利瑕疵与质量瑕疵。合同解除是\n指在合同有效成立之后尚未开始履行或者尚未全部\n履行之前,因当事人一方或双方的意思表示,提前终\n止合同效力的行为。在发生根本违约,即当事人一方\n迟延履行债务或者有其他违约行为致使不能实现合\n同目的的情形下,当事人可以解除合同。本题中,该\n出租房屋有害气体严重超标,致使房屋无法居住,无\n法实现合同目的,出租人根本违约,所以乙有权解除\n合同,B选项正确,A选项错误。甲乙之间签订的租\n赁合同主体、内容、形式等均符合法律要求,是有效合\n同,C选项错误。题干中只说有害气体超标,没有说\n因此给乙造成了身体损害,所以乙无权要求甲承担侵\n权责任,D选项错误。","k":"民事法律行为"},{"id":"2016-26","y":2016,"t":"单","s":"下列选项中,属于民事法律行为的是(","o":["甲到烈士陵园缅怀先烈","乙开车不慎将行人撞倒","丙邀请朋友到自家聚餐","丁向同事转让一架钢琴"],"a":"D","e":"民事法律行为是指民事主体以意思表\n示的方式设立、变更或者终止民事法律关系的行为。\n本题中A C的行为不具有设立、变更或者终止民事法\n律关系的目的,不是民事法律行为。B是侵权行为,\n由千法律的规定产生侵权损害赔偿的法律关系,但是\n这种法律关系的产生不是以乙的意思表示设立的,所\n以不是民事法律行为,而是事实行为中的不合法行\n为,不选B。D是依据丁的意思表示,在丁与同事之间\n产生债权债务关系,是民事法律行为,正确答案为D。\n关于行为的相关概念总结如下,希望考生准确加\n二律事实{\n自然事\n:\n二\n::钉\n为\n行为{\n{ \n事实行为\n不合法行为{i三定义","k":"民事法律行为"},{"id":"2016-39","y":2016,"t":"单","s":"关于两份房屋买卖合同的效力,下列选项正 确的是()。","o":["甲、乙之间的合同和甲、丙之间的合同均有效","甲、乙之间的合同有效,甲、丙之间的合同无效","甲、乙之间的合同无效,甲、丙之间的合同有效","甲、乙之间的合同有效,甲、丙之间的合同效 力待定"],"a":"A","e":"《民法典》第215条规定:\"当事人之间\n订立有关设立、变更、转让和消灭不动产物权的合同,\n除法律另有规定或者当事人另有约定外,自合同成立\n时生效;未办理物权登记的,不影响合同效力。\"第209\n条第一款规定:\"不动产物权的设立、变更、转让和消\n灭,经依法登记,发生效力;未经登记,不发生效力,但\n是法律另有规定的除外。\"第214条规定:\"不动产物\n权的设立、变更、转让和消灭,依照法律规定应当登记\n的,自记载于不动产登记簿时发生效力。\"\n本题中甲乙签订了买卖合同,虽然未办理物权登\n记,但是不影响合同效力,甲乙之间的合同是有效的。\n但是因为未办理房屋产权过户登记,物权不发生转\n移,房屋的所有权依然属于甲,甲有权进行处分。所\n以甲丙之间的买卖合同也是有效的。A选项正确,\nBCD 选项错误。","k":"民事法律行为"},{"id":"2017-22","y":2017,"t":"单","s":"公司职员甲办理了某银行的信用卡,在商场 持卡消费2万余元。在向银行还款前,甲突患精神 病。对此,下列说法正确的是()。","o":["甲与银行之间的合同、甲与商场之间的合同 均有效 )","甲与银行之间的合同、甲与商场之间的合同均 无效","甲与银行之间的合同有效,甲与商场之间的合 同无效","甲与银行之间的合同无效,甲与商场之间的 合同有效"],"a":"A","e":"合同生效的一般要件包括当事人缔约\n时有相应的缔约能力、当事人意思表示真实、不违反\n强制性法律规范及公序良俗。判断当事人是否有缔\n约能力的时间点是缔约时,缔约前或缔约后的行为能\n力都不影响缔约时行为能力的判断。本题中甲在办\n理银行的信用卡以及在商场持卡消费时都是完全民\n事行为能力人,其与银行之间的合同、与商场之间的\n合同均为真实的意思表示,也不违反强制性法律和公\n序良俗,因此两份合同均有效,A项正确。甲在办理\n信用卡及持卡消费后才患精神病,即缔约后行为能力\n缺失,不影响缔约时行为能力的判断。","k":"民事法律行为"},{"id":"2017-33","y":2017,"t":"单","s":"甲将房屋出租给乙,租期5年。半年后,甲通 知乙欲出售该房屋,20天内乙未表态,甲遂将该房屋 卖给丙,并办理了过户登记。乙有权()。","o":["主张甲、丙之间的买卖合同无效","要求甲承担违约责任","主张租赁合同对丙继续有效","主张优先购买权"],"a":"C","e":"《民法典》第725 条规定:\n\"租赁物在承\n租人按照租赁合同占有期间发生所有权变动的,不影\n响租赁合同的效力。\"本题中甲将房屋卖给丙,且办理\n了过户登记,房屋的所有权由甲转移给丙,所有权发\n生变动,但是不影响甲乙之间租赁合同的效力,即\n\"买\n卖不破租赁\n\",乙作为承租人可以主张租赁合同对丙\n继续有效,C项正确。《民法典》第726 条规定:\"出租\n人出卖租赁房屋的,应当在出卖之前的合理期限内通\n知承租人,承租人享有以同等条件优先购买的权利;\n但是,房屋按份共有人行使优先购买权或者出租人将\n房屋出卖给近亲属的除外。出租人履行通知义务后,\n承租人在十五日内未明确表示购买的,视为承租人放\n\n弃优先购买权。\"本题中,甲在出卖房屋前已经通知\n乙,但乙2O H未表态,因此乙不能再主张优先购买\n权,D项错误。甲是房屋的所有权人,有权对房屋进\n行处分,其与丙之间的买卖合同有效,乙不能主张该\n买卖合同无效,A项错误。根据《民法典》第725条的\n规定,尽管房屋的所有权发生变更,但是租赁合同的\n效力并没有受影响,甲没有违约,乙不能要求甲承担\n违约责任。B项错误。","k":"民事法律行为"},{"id":"2018-33","y":2018,"t":"单","s":"甲声称具有某海外名校学历,与乙登记结婚。 半年后,乙发现甲的毕业证书系伪造。甲、乙之间的 婚姻( )。","o":["无效","有效","因欺诈可撤销","因重大误解可撤销"],"a":"B","e":"根据《民法典》的规定,因胁迫结婚的,\n受胁迫的一方可以向人民法院请求撤销婚姻。一方\n患有重大疾病的,应当在结婚登记前如实告知另一\n方;不如实告知的,另一方可以向人民法院请求撤销\n婚姻。本题中,甲对乙的行为不属于申请撤销婚姻的\n事由,CD项错误。婚姻无效的情形有:(l)重婚;\n(2) 有禁止结婚的亲属关系;(3) 未到法定婚龄。甲\n乙之间的婚姻也没有婚姻无效的情况,因此是有效婚\n姻。B项正确。","k":"民事法律行为"},{"id":"2018-35","y":2018,"t":"单","s":"甲(13 周岁)因考试成绩不理想将自己的书 包扔掉。甲将书包扔掉的事实属于( )。","o":["事件","事实行为","民事法律行为","不具有法律意义的事实"],"a":"C","e":"《民法典》第19条规定:\"八周岁以上\n\n的未成年人为限制民事行为能力人,实施民事法律行\n为由其法定代理人代理或者经其法定代理人同意、追\n认;但是,可以独立实施纯获利益的民事法律行为或\n者与其年龄、智力相适应的民事法律行为。\"本题中甲\n13岁,属千限制民事行为能力人,其丢掉书包的行为\n属千与其年龄智力相符的行为,因此可以独立实施,\n甲的行为是对书包所有权的处分,是民事法律行为。","k":"民事法律行为"},{"id":"2018-40","y":2018,"t":"单","s":"甲与创富公司之间签订的房产抵押合同 ()。","o":["有效","可撤销","效力待定","无效"],"a":"A","e":"甲与创富公司在签订抵押合同时是出\n于真实的意思表示,且合同签订的主体、程序符合法\n律的规定,所以甲与创富公司签订的抵押合同有效。\n未办理抵押登记手续,抵押权未设立,但是并不影响\n抵押合同的效力。A项正确。\n二、多项选择题","k":"民事法律行为"},{"id":"2019-34","y":2019,"t":"单","s":"甲欠乙5万元逾期不还,乙要求甲马上偿还, 否则就起诉。甲遂将自己仅有的财产即市价5万元 的汽车以4万元卖给知情的丙,后被乙得知。对于甲 和丙之间的买卖合同,下列说法正确的是()。","o":["乙有权以书面通知方式撤销","乙得知一年后不再享有撤销权","乙有权请求确认无效","乙无权撤销"],"a":"D","e":"《民法典》第539条规定:\"债务人以明\n显不合理的低价转让财产、以明显不合理的高价受让\n他人财产或者为他人的债务提供担保,影响债权人的\n债权实现,债务人的相对人知道或者应当知道该情形\n的,债权人可以请求人民法院撤销债务人的行为。\"转\n让价格达不到交易时交易地的指导价或者市场交易\n价70%的,一般可以视为明显不合理的低价。本题\n中,汽车市价5万元,转让价格4万元,相当于市场价\n的80%,不是明显不合理的低价,不满足债权人撤销\n权的条件,因此,乙无权撤销,本题选D。","k":"民事法律行为"},{"id":"2019-35","y":2019,"t":"单","s":"甲在2005年与乙登记结婚,2010年又与丙登 记结婚,并生有一子。2015年甲与乙协议离婚。现甲 与丙的婚姻()。","o":["有效","无效","可撤销","不成立"],"a":"B","e":"《民法典》第1051条规定:\"有下列情\n形之一的,婚姻无效:(一)重婚;(二)有禁止结婚的\n亲属关系;(三)未到法定婚龄。\"甲与丙结婚时,属千\n重婚,因此,当时甲与丙的婚姻是无效婚姻。尤效或\n被撤销的婚姻,自始无效。为此,本题答案为选项B。\n《民法典》规定的婚姻无效事由中,一般认为未到法定\n婚龄属于相对尤效,近亲婚姻和重婚属于绝对无效。\n也就是说,有些无效婚姻在经过一定时间后,因婚姻\n无效情形已经消除等情况,可以认可当事人及利害关\n系人在申请宣告婚姻尤效时存在阻却事由,即申请\n时,法定的尤效婚姻情形已经消失,如未达法定婚龄\n者已达法定婚龄,这时对提出的申请宣告婚姻尤效的\n请求,法院不予支持。而近亲婚姻的血缘关系无法改\n变,重婚可能构成刑事犯罪,所以,被认为属于绝对无\n效。现实当中确实有一些构成重婚的司法判例,在重\n婚情形消失后,当事人及利害关系人申请宣告涉嫌重\n婚的婚姻无效的,法院并没有支持,但也有很多司法\n判例宣告构成重婚的婚姻无效。就重婚而言,能否因\n前一婚姻关系的终止而合法化呢?我们认为不能,因\n为重婚行为违反一夫一妻制,更是严重有悖于社会的\n公序良俗,且我国刑法直接对重婚行为进行了规制,\n\n重婚行为从性质上不应当存在阻却事由,产生从违法\n到合法转化的问题。故此,当申请确认婚姻无效时,\n无论重婚者是存在两个婚姻关系,还是只存在一个婚\n姻关系,都应确认构成重婚的婚姻无效。本案中,即\n使甲与乙的合法婚姻已依法终止,甲与丙的重婚的婚\n姻关系仍为无效。最终答案为B,出题人应该采取了\n和文运法硕上述一样的思路去命制本题。C项错误,\n本题不属于可撤销婚姻的事由。D项也错误,成立和\n是否有效是两个概念,办理了结婚登记,婚姻关系当\n然成立。","k":"民事法律行为"},{"id":"2019-48","y":2019,"t":"多","s":"下列关于意思表示生效的表述,正确的有 )。","o":["以对话方式作出的意思表示,相对人知道其 内容时生效","以非对话方式作出的意思表示,到达相对人时 生效","无相对人的意思表示,法律无特别规定的,表 示完成时生效","以公告方式作出的意思表示,公告发布时 生效"],"a":"ABCD","e":"根据《民法典》的规定,以对话方式作\n出的意思表示,相对人知道其内容时生效。故A正\n确。以非对话方式作出的意思表示,到达相对人时生\n效。故B正确。无相对人的意思表示,表示完成时生\n效。法律另有规定的,依照其规定。故C正确。以公\n告方式作出的意思表示,公告发布时生效,故D正确。","k":"民事法律行为"},{"id":"2020-26","y":2020,"t":"单","s":"甲收到乙通讯公司短信,内容为:本公司为您 提供实时天气预报服务,每月收费5元,如不接受此 服务,请回复“N”。甲看后未予理睬。后甲发现乙公 司向自己收取了该费用,遂要求返还。甲与乙公司之 间的天气预报服务合同( ()。","o":["不成立","无效","可撤销","有效"],"a":"A","e":"合同的成立要件包括有双方或多方当\n事人当事人就合同必要条款达成合意、合同内容明\n确、经过要约和承诺阶段等。承诺原则上应以明示方\n式作出,沉默只有在有法律规定、当事人约定或者符\n合当事人之间的交易习惯时,才可以视为意思表示。\n本题中甲的沉默不能视为承诺,故甲与乙公司的合同\n不成立,A选项正确。","k":"民事法律行为"},{"id":"2020-28","y":2020,"t":"单","s":"甲以5万元购得一块手表,甲的朋友乙发现 该表系高仿品,但未告知甲。丙看见该手表有意购 买,乙为让丙买下该表,对丙声称该表是绝版正品,丙 信以为真,遂以5.5万元买下该表。甲与丙之间买卖 合同的效力为()。","o":["无效","可撤销.","效力待定","有效"],"a":"D","e":"第三人欺诈是指民事法律行为当事人\n以外的第三人故意实施的,以引起、强化或维持他人\n的错误认识并使其基于此错误认识而做出意思表示\n为目的的欺骗行为。民事法律行为的对方知道或应\n当知道第三人欺诈行为的,该民事法律行为才是可撤\n销的。本题中,甲对于手表系高仿品并不知情,甲不\n知道乙实施了欺诈行为,因此丙不享有撤销权,合同\n有效,D选项正确。","k":"民事法律行为"},{"id":"2021-24","y":2021,"t":"单","s":"某幼儿园教师组织幼儿做游戏时,小莉被小 明撞倒,前额磕伤。小莉的父母向幼儿园索赔,幼儿 园以人园登记表中有“若非教师人为原因导致幼儿磕 碰、摔伤等伤害,幼儿园不承担责任”的内容为由拒 赔。该免责条款()","o":["可撤销","效力待定","有效","无效"],"a":"D","e":"《民法典》第497条规定:\n\"有下列情形\n之一的,该格式条款无效:(一)具有本法第一编第六\n章第三节和本法第五百零六条规定的无效情形;\n(二)提供格式条款一方不合理地免除或者减轻其责\n任、加重对方责任、限制对方主要权利;(三)提供格\n式条款一方排除对方主要权利。\"本题中,幼儿园的入\n园登记表不合理地免除其责任,是无效条款,D项\n正确。","k":"民事法律行为"},{"id":"2021-37","y":2021,"t":"单","s":"某建筑队借用A建筑公司的资质,以A 建筑 公司的名义与B公司签订了建设工程施工合同。该 施工合同的效力为( )","o":["有效","可撤销","无效","效力待定"],"a":"C","e":"《最高人民法院关千审理建设工程施\n工合同纠纷案件适用法律问题的解释(一)》第1条\n规定:\"建设工程施工合同具有下列情形之一的,应当\n依据民法典第一百五十三条第一款的规定,认定无\n效:(一)承包人未取得建筑业企业资质或者超越资\n质等级的;(二)没有资质的实际施工人借用有资质\n的建筑施工企业名义的;(三)建设工程必须进行招\n标而未招标或者中标无效的。承包人因转包、违法分\n包建设工程与他人签订的建设工程施工合同,应当依\n据民法典第一百五十三条第一款及第七百九十一条\n第二款第三款的规定,认定无效。\"因此C项正确。","k":"民事法律行为"},{"id":"2021-39","y":2021,"t":"单","s":"张某在丈夫去世后,与其保姆李某签订了遗 赠扶养协议,张某的子女得知后不认可该遗赠扶养协 议的效力。该遗赠扶养协议的效力为(","o":["可撤销","效力待定","有效","无效"],"a":"C","e":"遗赠扶养协议,是指由遗赠人与扶养人\n签订的,由扶养人对遗赠人负生养死葬的义务,遗赠`\n人将自己财产的一部或全部在其死后转移给扶养人\n\n所有的协议。本题中,张某是完全民事行为能力人,\n与李某意思表示一致,遗赠扶养协议有效,不需要张\n某子女的认可,C项正确。","k":"民事法律行为"},{"id":"2021-49","y":2021,"t":"多","s":"下列关于诉讼时效的约定,无效的有(","o":["关于诉讼时效中止事由的约定","关于诉讼时效中断事由的约定","关于诉讼时效期间的约定","关于诉讼时效计算方法的约定"],"a":"ABCD","e":"《民法典》第197条规定:\"诉讼时效的\n期间、计算方法以及中止、中断的事由由法律规定,当\n事人约定无效。当事人对诉讼时效利益的预先放弃\n无效。\"ABCD项正确。","k":"民事法律行为"},{"id":"2022-21","y":2022,"t":"单","s":"文某有祖传名画一幅。2020年1月1日,文某的朋友乙看到后提出以市价购买并成 交。2021年1月1日,乙经鉴定得知该画为赝品,但碍于情面未告知文某。2021年5月1 日,文某得知该画为赝品,随即向乙提出退还价款并索要该画。此时,对该合同","o":["文某有权解除","文某有权撤销","乙有权解除","乙有权撤销"],"a":"B","e":"合同解除的方式包括单方解除和协议\n解除,解除事由可由当事人在合同中约定,也可以是\n法律直接规定的。本题中并不存在《民法典》第563\n条规定的法定解除情形,也不存在双方当事人协议解\n除合同或者约定一方享有解除权的情形,故A、C选项\n错误。重大误解的民事法律行为,指行为人对于民事\n行为产生错误的理解,并基于这种错误理解而为的民\n事法律行为。所谓误解,又称错误,具体包括:(1)对\n行为性质的误解;(2)对标的物的误解;(3)对价金\n的误解;(4)对当事人的误解。本题中文某与乙双方\n对名画性质发生误解,属于对标的物的误解。《民法\n典》第147条规定:\"基于重大误解实施的民事法律行\n为,行为人有权请求人民法院或者仲裁机构予以撤\n销。\"《民法典》第152条规定:\"有下列情形之一的,\n撤销权消灭:(一)当事人自知道或者应当知道撤销\n事由之日起一年内、重大误解的当事人自知道或者应\n当知道撤销事由之日起九十日内没有行使撤销\n权;......\"乙于2021年1月1日知道撤销事由,但是\n碍于情面未告知文某,到2021年5月1日,时间已经\n超过90日,乙的撤销权消灭,此时只有文某对该合同\n有权撤销。B选项正确,D选项错误。","k":"民事法律行为"},{"id":"2022-22","y":2022,"t":"单","s":"2020年2月27日,某网店以100元的优惠价格寄给老客户甲一盒新到的面膜,并附说 明∶若不同意购买,请在10天内寄回,邮费到付。3月1日,甲收到面膜并放在桌子上, 3天后将面膜扔进垃圾桶。3月12日,该网店要求甲付款,甲表示拒绝。该网店和甲之 间的买卖合同","o":["未成立","有效","无效","被撤销"],"a":"A","e":"合同的一般成立要件包括\"经过要约\n与承诺阶段\",要约是当事人一方向对方发出的希望\n与对方订立合同的意思表示。承诺是受要约人向要\n约人作出的同意要约的意思表示。承诺原则上应以\n明示方式作出,特殊情况下依交易习惯或者要约的规\n定也可以以行为方式作出。但除法律有特别规定或\n当事人事先有明确约定外,沉默不能视为承诺的形\n正当防卫是指为了使公共利益、本人或式。网店将面膜和说明寄给甲的行为属于要约,要约\n仅说明以行为方式退回,而非以行为方式作出承诺,\n且此处法律没有特别规定,当事人事先也没有明确约\n定,因此,甲的沉默不能视为承诺的形式,该网店和甲\n之间的买卖合同未成立。A选项正确。合同的效力\n以合同成立为前提,本题中该网店和甲之间的买卖合\n同尚未成立,自然不涉及合同效力评价的问题。故\nB、C、D选项错误。","k":"民事法律行为"},{"id":"2022-25","y":2022,"t":"单","s":"甲开车不慎剧踏了乙停在路边的汽车。甲因着急上班,在被削车辆上留下一张写 有自己联系方式的字条后离开。乙见后联系甲,两人在电适中商定甲赔偿800元。乙将 车送去修理,支付费用1000元。甲和乙之间关于赔偿的约定","o":["成立并有效","因重大误解而效力待定","因显失公平而可撤销","因系口头约定而无效"],"a":"A","e":"民事法律行为的成立,是指符合民事法\n律行为的构成要素的客观情况,其一般成立要件包\n括:(1)当事人;(2)意思表示;(3)标的。民事法律\n行为的有效,是指已经成立的民事法律行为因符合法\n定有效要件而取得认可的效力。民事法律行为的实\n质有效要件包括:(1)行为人合格;(2)行为人意思\n表示真实;(3)不违反法律、行政法规的强制性规定,\n不违背公序良俗。甲乙二人通过口头形式为意思表\n示,意思表示真实且不存在重大误解或显失公平的情\n形,因此甲和乙之间关于赔偿的约定成立并有效。A\n选项正确。","k":"民事法律行为"},{"id":"2022-30","y":2022,"t":"单","s":"甲倒车时操作失误撞倒围墙,压死了站在墙后的甲母。甲向保险公司索赔,保险 公司拒赔,理由是保险合同约定∶\"保险车辆造成被保险人或其允许的驾驶员及他们的 家庭成员人身伤亡,保险人均不赔偿。\"经查,在签订保险合同时保险公司并未提示甲 注意该格式条款。甲可以主张该条款","o":["无效","可撤销","效力待定","不成为保险合同的内容"],"a":"D","e":"格式条款,是指当事人为了重复使用而\n预先拟订,并在订立合同时未与对方协商的条款。我\n国《民法典》合同编对格式条款的特殊要求体现在:\n(1)提供格式条款的一方应当遵循公平原则确定当\n事人之间的权利和义务,并采取合理的方式提示对方\n注意免除或者减轻提供格式条款一方责任等与对方\n有重大利害关系的条款,按照对方的要求,对该条款\n予以说明。(2)提供格式条款的一方未履行提示或\n者说明义务,致使对方没有注意或者理解与其有重大\n利害关系的条款的,对方可以主张该条款不成为合同\n的内容。本题中,在签订保险合同时保险公司并未提\n示甲注意该格式条款,因此甲可以主张该条款不成为\n保险合同的内容。D选项正确。","k":"民事法律行为"},{"id":"2022-35","y":2022,"t":"单","s":"甲(12周岁)将自己的自行车卖给乙(19周岁),甲的父母得知后予以追认。该追 认行为属于","o":["从行为","负担行为","单方行为","要式行为"],"a":"C","e":"从行为对应于主行为,是指需要以其他\n法律行为存在为前提的法律行为。本题中的追认行\n为是行使形成权的行为,不以其他法律行为的存在为\n前提。A选项错误。负担行为对应于处分行为,主要\n产生请求权,是指以发生债权债务为内容的民事法律\n行为,也称债权行为。本题中追认的法律后果是使得\n民事法律行为发生效力,而非产生请求权。B选项错\n误。单方行为是指仅由一方当事人的意思表示就能\n成立的民事法律行为。12周岁的甲属于限制民事行\n为能力人,其将自己的自行车卖给19周岁的乙的行\n为不属于与其年龄、智力相适应的民事活动,属于效\n力未定的民事法律行为,该行为效力有待其法定代理\n人确认。申的父母得知后予以追认,追认是一种单方\n意思表示,无需相对人的同意即可发生法律效力,因\n此追认行为属于单方行为。C选项正确。要式行为\n对应于不要式行为,是指必须履行某种特定的形式才\n能成立的民事法律行为。追认可以以口头的方式作\n出,也可以以书面的方式作出,是不要式行为。D选\n项错误。","k":"民事法律行为"},{"id":"2022-39","y":2022,"t":"单","s":"对于11860元的消费金额,酒吧有权请求","o":["甲支付","甲的父母和甲共同支付","甲、乙、丙、丁按份支付","甲、乙、丙、丁连带支付"],"a":"A","e":"甲已年满18周岁,属于完全民事行为\n能力人,可以独立参加民事法律关系,取得民事权利\n和承担民事义务。甲以个人名义向酒吧预订消费,即\n以个人名义与酒吧就3月14日的消费签订了合同。\n事发当日乙、丙、丁受甲之邀来到该酒吧,甲的这一行\n为属于情谊行为,乙、丙、丁无须承担付款的义务。因\n此对于11860元的消费金额,酒吧根据合同的相对性\n仅有权请求甲支付。A选项正确。","k":"民事法律行为"},{"id":"2022-46","y":2022,"t":"多","s":"甲与A公司约定∶甲将自己的汽车卖给A公司并转移所有权,A公司支付价款60万 元;该车由甲占有使用,甲每月支付租金15000元;合同有效期为5年,期满后汽车无 偿归甲所有。对此,下列选项中正确的有","o":["甲与A公司之间的合同属于有名合同","甲与A公司之间的合同名为买卖合同,实为借款合同","甲与A公司之间关于合同期满后汽车归属的约定无效","A公司对汽车的所有权未经登记不得对抗善意第三人"],"a":"AD","e":"融资租赁合同,是指出租人根据承租人\n对出卖物、租赁物的选择,向出卖人购买租赁物,提供\n给承租人使用,承租人支付租金的合同。根据《最高\n人民法院关于审理融资租赁合同纠纷案件适用法律\n问题的解释》的规定,承租人将其自有物出卖给出租\n人,再通过融资租赁合同将租赁物从出租人处租回\n的,人民法院不应仅以承租人和出卖人系同一人为由\n认定不构成融资租赁法律关系。申将其汽车出卖给\nA公司,再通过融资租赁合同将汽车从A公司处租\n回,构成融资租赁法律关系。甲与A公司之间的合同\n属于融资租赁合同。A选项正确,B选项错误。融资\n租赁合同中出租人和承租人可以约定租赁期限届满\n时租赁物的归属,因此甲与A公司之间关于合同期满\n后汽车归属的约定有效。C选项错误。根据《民法\n典》第745条的规定,出租人对租赁物享有的所有权,\n未经登记,不得对抗善意第三人。D选项正确。故本\n题选择AD。","k":"民事法律行为"},{"id":"2022-49","y":2022,"t":"多","s":"预告登记的失效原因包括","o":["预告登记的权利人死亡或者终止","买卖不动产物权的协议被撤销","买卖不动产物权的协议被认定无效","自能够进行不动产登记之日起90日内权利人未申请登记"],"a":"BCD","e":"《民法典》第221条第2款规定:\"预告\n登记后,债权消灭或者自能够进行不动产登记之日起\n九十日内未申请登记的,预告登记失效。\"此处的债权\n消灭包括买卖不动产的协议被认定无效、被撤销、被\n解除,或者预告登记的权利人放弃债权等。故本题选\n择BCD。","k":"民事法律行为"},{"id":"2024-25","y":2024,"t":"单","s":"甲(11周岁),使用母亲的名字和身份证号在一家游戏公司网站完成实名认证。其 后两个月内自行用手机在该网站充值3万余元,甲充值的法律行为()","o":["有效","无效","可撤销","效力待定"],"a":"D","e":"","k":"民事法律行为"},{"id":"2024-26","y":2024,"t":"单","s":"甲和乙签订赠与合同,约定合同在乙取得某职业资格证书之日起生效。该合同属于 ()","o":["有偿行为","附延缓条件的民事法律行为","身份行为","附始期的民事法律行为"],"a":"B","e":"","k":"民事法律行为"},{"id":"2024-27","y":2024,"t":"单","s":"甲在A网站团购B餐厅的100元代金券,券上显著标明“周末不得使用”。甲周五中 午去就餐,结账的B餐厅表示周五属于周末不能用券。对此下列选项正确的是()","o":["代金券上的“周末不得使用”为“霸王条款”,甲有权主张该条款无效","A网站存在欺诈,甲有权撤销与A网站的买卖合同","甲与B餐厅未就餐饮价格达成合意,餐饮服务合同未成立","代金券上的使用时间应当按照通常理解予以解释,甲有权使用代金券"],"a":"D","e":"","k":"民事法律行为"},{"id":"2024-37","y":2024,"t":"单","s":"甲在乙的胁迫下低价将首饰卖给了丙,丙对甲被胁迫之事不知情,该买卖合同()","o":["有效","无效","可撤销","效力待定"],"a":"C","e":"","k":"民事法律行为"},{"id":"2025-23","y":2025,"t":"单","s":"甲与A 公司签订合作协议,约定:甲为A 公司平台的独家主播,期限三年;甲违约需 支付违约金80 万元,且不得调整。经A 公司包装,甲成为网红主播。A 公司每月从甲的直播 活动中获利约8 万元。签约一年后甲毁约。A 公司起诉请求甲支付80 万元违约金,甲要求酌 减。对此,下列说法正确的是( )","o":["人民法院应当对违约金予以酌减","关于违约金数额的约定因有违公平无效","甲应当支付80 万元违约金","关于违约金不得调整的约定对双方当事人具有约束力"],"a":"C","e":"A 公司每月从甲的直播活动中获利约8 万元,一年获利约96 万元,3 年获利约\n288 万元。但签约一年后甲毁约,A 公司的损失为包装甲投入的成本,还包括预期利益损失,\n80 万的违约金未过分高于A 公司的损失,该违约金的约定有效,甲应当支付A 公司80 万的违\n约金,C 项正确,ABD 项错误。","k":"民事法律行为"},{"id":"2025-26","y":2025,"t":"单","s":"甲、乙在离婚协议中约定:共有房屋归甲所有;共同债务50 万元由乙偿还。但乙未按 约定与甲办理离婚登记。后甲起诉请求离婚并执行离婚协议,乙不同意甲的诉讼请求。人民法 院判决准予离婚。甲与乙之间关于财产和债务处理的约定( )","o":["不成立","没有生效","无效","效力待定"],"a":"B","e":"司法解释规定:\"当事人达成的以协议离婚或者到人民法院调解离婚为条件的财\n产以及债务处理协议,如果双方离婚未成,一方在离婚诉讼中反悔的,人民法院应当认定该财\n产以及债务处理协议没有生效,并根据实际情况依照民法典第一千零八十七条和第一千零八十\n九条的规定判决。\"B 项正确,ACD 项错误。本题选B。","k":"民事法律行为"},{"id":"2025-28","y":2025,"t":"单","s":"某住宅楼业主就加装电梯事项依法形成决议,相关建设规划申请获得行政主管部门批 准。施工期间,该楼一层业主甲因加装电梯影响房屋采光而坚决反对。对此,下列说法正确的 是( )","o":["因甲反对,故加装电梯的决议无效","因甲的房屋采光受影响,故加装电梯的决议无效","加装电梯的决议有效,但应补偿甲的房屋采光受影响的损失","加装电梯已获行政主管部门批准,甲的房屋采光即使受影响也无需补偿"],"a":"C","e":"根据法律规定,业主的决议一旦依法形成,即对全体业主具有约束力,包括反对\n的业主。甲作为一层业主,其反对不影响决议效力。AB 项错误。《民法典》规定:\"建造建筑\n物,不得违反国家有关工程建设标准,不得妨碍相邻建筑物的通风、采光和日照。\"若加装电\n梯导致业主采光受影响,应给予补偿。C 项正确。行政批准不免除民事补偿责任,D 项错误。\n本题选C。","k":"民事法律行为"},{"id":"2025-31","y":2025,"t":"单","s":"甲欲将自己的房屋转让给乙,双方为少缴税款签订了两份合同,一份是私下使用的高 成交价合同,另一份是房屋过户时使用的低成交价合同。低成交价合同( )","o":["不成立","无效","有效","可撤销"],"a":"B","e":"《民法典》第146 条规定:\"行为人与相对人以虚假的意思表示实施的民事法律行\n为无效。以虚假的意思表示隐藏的民事法律行为的效力,依照有关法律规定处理。\"本题中,\n甲乙为少缴纳税款签订了过户时使用的低成交价合同,该合同是以虚假的意思表示实施的民事\n法律行为,无效,B 项正确。本题选B。","k":"民事法律行为"},{"id":"2025-34","y":2025,"t":"单","s":"A 公司向B 公司订货,双方在合同中约定了如下担保条款:A 公司董事长张某以全部个 人资产作抵押,担保B 公司的债权。张某在合同书上以担保人身份签字,但事后未办理抵押登 记。B 公司交货后,A 公司未依约支付货款。对此,下列说法正确的是( )","o":["担保条款有效,但抵押权未设立","担保条款因违反物权客体特定原则而无效","B 公司有权基于保证请求张某承担连带责任","B 公司有权就张某的全部个人资产优先受偿"],"a":"A","e":"抵押权的客体是债务人或第三人提供的特定财产,本题中张某以\"全部个人资产\"\n作抵押,范围模糊、不特定,违反物权客体特定原则,因此抵押权未设立。但不影响抵押条款\n的效力。合同效力与物权效力需区分,担保条款作为合同条款,只要双方意思表示真实且不违\n法,即有效,A 项正确,B 项错误。抵押权未设立,因为张某无需承担担保责任,B 公司也无权\n优先受偿,CD 项错误。本题选A。","k":"民事法律行为"},{"id":"2025-39","y":2025,"t":"单","s":"甲与A 公司签订书面合同,约定甲购买501 室房屋。在装订合同书时,A 公司工作人 员因疏忽错装了501 室和601 室房屋买卖合同中的材料。后登记机构根据申请材料,将601 室 房屋登记在甲名下。甲与A 公司之间的房屋买卖合同( )","o":["不成立","无效","有效","可撤销"],"a":"C","e":"本题中甲与A 公司签订书面合同,约定购买501 室房屋。甲与A 公司均是适格的\n合同主体,买卖合同是双方真实意思的表示,是有效的合同。工作人员错装了买卖合同中的材\n料,导致登记错误,不影响买卖合同的效力,C 项正确,ABD 项错误。本题选C。","k":"民事法律行为"},{"id":"2026-27","y":2026,"t":"单","s":"甲、乙用夫妻共同财产购买房屋,登记在未成年儿子丙名下。后甲、乙向银 行借款,以法定代理人身份将该房屋抵押,并办理抵押登记。获得贷款后,甲、 乙主张抵押因损害丙的利益而无效。该抵押行为","o":["有效","无效","可撤销","不成立"],"a":"A","e":"父母作为未成年子女法定代理人,为家庭共同债务抵押登记子女名下房产,\n未超出监护权限,抵押有效。","k":"民事法律行为"},{"id":"2026-31","y":2026,"t":"单","s":"某村农户钱家的承包地因自然灾害严重损毁。村集体经济组织决定将该村5 亩机动地调整给钱家承包经营,但村民委员会决定该村机动地不予调整,以保持 土地承包关系的稳定。对此,下列说法正确的是","o":["村集体经济组织和村民委员会应当就是否调整承包土地进行协商","村集体经济组织的决定和村民委员会的决定相互冲突,均无效","钱家有权取得5 亩机动地的土地承包经营权","钱家无权取得5 亩机动地的土地承包经营权"],"a":"A","e":"村集体经济组织与村委会就机动地调整意见冲突,应当先行协商;二者无\n当然无效规定,钱家不能直接取得。","k":"民事法律行为"}]},{"sub":"民法","name":"民事主体","w":3.0,"L":54,"qs":[{"id":"2006-36","y":2006,"t":"单","s":"关于社团法人的下列表述,正确的是(   )","o":["社团法人是社会团体法人的简称","社团法人以人的集合为成立基础","社团法人均人社会公益为目的","社团法人的设立行为属于单方民事法律行为"],"a":"B","e":"社团法人是指以人为基础而集合成立的法人,社团法人和社会团体法人是完全不同的概念,社会团体\n法人中有的是社团法人如工会,有的属财团法人如基金会、公司等。所以B 项最适合","k":"民事主体"},{"id":"2006-49","y":2006,"t":"单","s":"某甲的外祖父与某乙的父亲是亲兄弟,某丙的外祖母与某丁的祖母是亲姐妹。则(   )","o":["某甲与某乙、某丙与某丁的婚姻均有效","某甲与某乙、某丙与某丁的婚姻均无效","某甲与某乙的婚姻均无效,某丙与某丁的婚姻均有效","某甲与某乙的婚姻均有效,某丙与某丁的婚姻均无效"],"a":"A","e":"《婚姻法》规定,直系血亲或三代以内旁系血亲禁止结婚。亲等计算,以本人为第一亲等,一直追算\n到双方共有的亲等。以此计算,甲、乙是四等血亲;丙、丁是四等血亲。","k":"民事主体"},{"id":"2007-34","y":2007,"t":"单","s":"公民甲户籍地在新疆,去南京培训 1 年后,到深圳工作 3 年。后因病到广州治疗,目前已在广州一家医院住 院 16 个月。依我国民法规定,某甲的住所地在 (   ) 。","o":["南京","新疆","广州","深圳"],"a":"D","e":"住所地 \n] 根据民法通则及相关司法解释的规定,公民以他的户籍所在地的居住地为住所,经 \n常居住地与住所不一致的,经常居住地视为住所。公民离开住所地最后连续居住 1 年以上的 \n地方,为经常居住地。但住医院治病的除外。故答案为 D。","k":"民事主体"},{"id":"2007-36","y":2007,"t":"单","s":"下列有关法人民事行为能力的判断,正确的是 (   ) 。","o":["法人民事行为能力范围与其民事权利能力范围不同","法人一旦被申请宣告破产,民事行为能力即终止","不同类型的法人,民事行为能力范围不同","法人民事行为能力起止时间与其民事权利能力起止时间不同"],"a":"C","e":"法人的民事行为能力 \n] 法人的民事行为能力和权利能力在发生和消灭的时间上具有一致性,但并非一申请 \n宣告破产即终止,而是在依法被宣告破产时才终止,B、D 项错误。法人的民事行为能力与 \n民事权利能力的范围具有一致性,法人的民事行为能力受民事权利能力的限制,由于不同法 \n人的民事权利能力范围不一致,那么其民事行为能力范围也不一致,故 A 项错误,C 项 \n正确。","k":"民事主体"},{"id":"2007-37","y":2007,"t":"单","s":"下列情形中,导致委托代理关系终止的是 (   ) 。","o":["代理人经委托人同意,转托他人代理","代理人丧失民事行为能力","作为代理人的法人法定代表人更换","被代理人死亡"],"a":"B","e":"委托代理的终止 \n]根据民法通则的规定,委托代理终止的情形包括:代理期间届满或者代理事务完成; \n \n被代理人取消委托或者代理人辞去委托;代理人死亡;代理人丧失民事行为能力;作为被代 \n理人或者代理人的法人终止。故答案为 B。","k":"民事主体"},{"id":"2007-40","y":2007,"t":"单","s":"甲因购房向乙借款 10 万元,由合伙企业丙担任保证人,并约定由甲以小提琴质押给乙,但甲并未将小提琴交 给乙 。则 (   ) 。","o":["保证与质押均成立","保证与质押均不成立","保证不成立,质押成立","保证成立,质押不成立"],"a":"D","e":"保证和质押的成立一 \n] 合伙企业可以担任保证人,故保证成立。但是动产质押的成立必须以标的物占有移 \n转于质权人,才能产生效力,小提琴并没有交给乙,质押不成立。因此答案为 D。","k":"民事主体"},{"id":"2007-51","y":2007,"t":"多","s":"甲因海难下落不明,被法院宣告死亡。两年后,甲重新出现。法院依甲的申请撤销了对甲的死亡宣告。甲与原 配偶 的婚姻关系不能自行恢复的情形包括 (       )。","o":["原配偶虽未再婚,但拒绝与甲恢复婚姻关系","原配偶再婚,但愿意与甲恢复婚姻关系","原配偶再婚后其配偶病故","原配偶再婚后又离婚"],"a":"BCD","e":"宣告死亡 \n] 根据《民法通则意见》’的规定,被宣告死亡的人与配偶的婚姻关系,自死亡宣告 \n之日起消灭。死亡宣告被人民法院撤销,如果其配偶尚未再婚的,夫妻关系从撤销死亡宣告 \n之日起自行恢复;如果其配偶再婚后又离婚或者再婚后配偶又死亡的, \n则不得认定夫妻关系自行恢复。故答案为 B、C、D。","k":"民事主体"},{"id":"2008-34","y":2008,"t":"单","s":"根据民法通则规定,高等院校属于(  )。","o":["机关法人","企业法人","事业单位法人","社会团体法人"],"a":"C","e":"事业单位,是指国家为了社会公益目的,由国家机关举办或者其他组织利用国有资产举办的,从事教\n育、科技、文化、卫生等活动的社会服务组织。高等院校属于事业单位法人。机关,是指各级国家机关以及人民团\n体的县级以上机关;企业,是指以营业为目的,独立从事商品生产和经营活动的社会组织;社会团体,是指公民自\n愿组成,为实现会员共同意愿,按照其章程开展活动的非营利性社会组织。","k":"民事主体"},{"id":"2008-38","y":2008,"t":"单","s":"下列事由中,能够引起诉讼时效中断的是(  )","o":["权利人早请仲裁","权利人丧失民事行为能力","义务人被宣告死","当事人所在地发生不可抗力"],"a":"A","e":"根据民事通则第140 条,诉讼时效因提起诉讼、当事人一方提出要求或者同意履行义务而中断。选项\nA,权利人申请仲裁属于\"当事人一方提出要求\",故能够引起诉讼时效中断。","k":"民事主体"},{"id":"2008-45","y":2008,"t":"单","s":"根据民法通则规定,可以由法人享有的人格权是(  )。","o":["姓名权","肖像权","名誉权","隐私权"],"a":"C","e":"根据法通则的规定,法人享有的人格权,包括名称权(《民法通则》第99 条第2 款)、名誉权(《民\n法通则》第101 条)、荣誉权(《民法通则》第102 条),故本题应选C。选项A、B、D 属于自然人享有的人格权\n益。","k":"民事主体"},{"id":"2008-51","y":2008,"t":"多","s":"影响自然人民事行为能力的因素包括(     )","o":["财产","智力","年龄","性别"],"a":"BC","e":"影响自然人民事行为能力的因素包括智力和年龄。一般地,只有精神健康的年满18 周岁的自然人才\n享有民事行为能力。财产、性别对民事行为能力没有影响力。本题选B、C。","k":"民事主体"},{"id":"2009-32","y":2009,"t":"单","s":"根据民法通则规定,监护人可以处分被监护人财产的条件是(   )","o":["征得被监护人同意","为了被监护人的利益","征得其他监护人同意","征得被监护人所在地的居(村)委会同意"],"a":"B","e":"本题考查监护人的职责。《民法通则》第18 条规定,监护人应当履行监护职责,保护被监护人的\n人身、财产及其他合法权益,除违背监护人的利益外,不得处理被监护人的财产。因此本题的答案为B","k":"民事主体"},{"id":"2009-33","y":2009,"t":"单","s":"甲、乙、丙三人平均出资,自愿合伙成立了一个采石组,约定三人共同劳动、按劳取酬,并推举甲为采石组负 责人 , 主要负责劳动安全。在一次爆破作业中,乙违章操作致左眼受伤,花去治疗费 5 千余元。此损害应当(   )。","o":["由甲、丙共同承担","由甲、乙、丙共同承担","由甲全部承担","由乙自行承担"],"a":"B","e":"见《最高人民法院关于审理人身损害赔偿案使用法律若干问题的解析》及《民法通则》第34 条。","k":"民事主体"},{"id":"2012-22","y":2012,"t":"单","s":"某童星l5 周岁,其演出收入能够满足自己的 生活需要。该童星未经监护人同意独立实施的下列 行为中,有效的是( )。","o":["向户籍管理部门申请变更姓名","向工商管理部门申请注册公司","购买价格为2万元的摄像机","接受10万元现金的赠与"],"a":"D","e":"根据《民法典》的规定,8周岁以上的\n未成年人为限制民事行为能力人,实施民事法律行为\n由其法定代理人代理或者经其法定代理人同意、追\n认;但是,可以独立实施纯获利益的民事法律行为或\n者与其年龄智力相适应的民事法律行为。本题中,\n某童星15周岁,未满16周岁,因此是限制行为能力\n人,除了纯获收益的行为外或者与其年龄、智力相适\n应的民事法律行为外,其他民事活动需由他的法定代\n理人代理或者征得他的法定代理人的同意。D项是\n纯获利益的行为,是有效行为,本题选D。","k":"民事主体"},{"id":"2012-23","y":2012,"t":"单","s":"监护人有权处理被监护人财产的法定情形是 )。","o":["发生紧急情况","为被监护人的利益","经被监护人同意","经被监护人所在地的基层组织同意"],"a":"B","e":"《民法典》第35条第1款规定,监护人\n应当按照最有利于被监护人的原则履行监护职责。\n监护人除为维护被监护人利益外,不得处分被监护人\n的财产。故选B。","k":"民事主体"},{"id":"2012-29","y":2012,"t":"单","s":"下列权利中,可以转让的是( )。","o":["劳动报酬请求权","人身损害赔偿请求权","支付租金请求权","近亲属间的扶养请求权"],"a":"C","e":"具有人身依附性的请求权不允许转让。\n故选C。ABD项的请求权均具有人身依附性。","k":"民事主体"},{"id":"2013-24","y":2013,"t":"单","s":"甲、乙结婚多年。某日,甲外出后失踪,乙四 处寻找仍无结果。五年后,乙欲与丙登记结婚。根据 我国民法相关规定,下列选项中正确的是()。","o":["乙、丙二人可以直接登记结婚","乙只能申请宣告甲死亡,待法院宣告甲死亡后 再与丙登记结婚","丙可以申请宣告甲死亡,待法院宣告甲死亡后 再与乙登记结婚","乙可以起诉请求与甲解除婚姻关系,待法院 作出离婚判决后再与丙登记结婚"],"a":"D","e":"《民法典》第1079 条规定:\n\"一方被宣\n告失踪,另一方提出离婚诉讼的,应当准予离婚。\"所\n以应选择D。自然人只有在宣告死亡之后才能消灭\n其民事主体资格,终止民事权利能力,自动解除婚姻\n关系。所以乙在甲宣告死亡之前,并不能与丙结婚,\n排除A。B选项中,乙并不是只能宣告甲死亡,也可以\n宣告甲失踪,或者直接申请解除婚姻关系,所以B的\n说法过于绝对。C选项中,丙并不能申请宣告甲死\n亡,因为丙并不是甲的利害关系人,因此丙不能申请\n宣告甲的死亡。","k":"民事主体"},{"id":"2013-25","y":2013,"t":"单","s":"甲、乙、丙三人共同出资设立一合伙企业,甲 被推举为合伙事务执行人。根据我国合伙企业法规 定,甲在任职期间有权单独实施的行为是()。","o":["与A公司签订货物买卖合同","转让合伙企业拥有的一间商铺","以合伙企业名义为B公司提供担保","聘任丁担任合伙企业的经营管理人员"],"a":"A","e":"根据《合伙企业法》,合伙企业的下列\n事务应该经由全体合伙人一致同意:(1) 改变合伙企\n业的名称。(2)改变合伙企业的经营范围、主要经营\n场所地点。(3) 处分合伙企业的不动产。(4) 转让\n或者处分合伙企业的知识产权和其他财产权利。\n(5) 以合伙企业名义为他人提供担保。(6) 聘任合\n伙人以外的人担任合伙企业的经营管理人员。因此\n只有A 选项中的行为可以由甲单独实施。","k":"民事主体"},{"id":"2014-22","y":2014,"t":"单","s":"16周岁的中学生史某在一次抽奖活动中获 得10万元大奖。史某用该笔款项不仅交纳了自己的 学费,还帮助父亲偿还了5万元欠款。史某()。","o":["是完全民事行为能力人","是限制民事行为能力人","视为限制民事行为能力人","视为完全民事行为能力人"],"a":"B","e":"《民法典》第18 条第2 款规定,16 周岁\n以上的未成年人,以自己的劳动收入为主要生活来源\n的,视为完全民事行为能力人。这里的劳动收入应当\n是稳定的劳动收入,例如外出务工等,而非中奖、获赠\n等偶然行为,所以本题中的史某虽然有一笔可观的财\n产,但是不属于\n\" 以自己的劳动收入为主要生活来\n源\n\" ,因此不能视为完全民事行为能力人,而是限制民\n事行为能力人,选B项。","k":"民事主体"},{"id":"2014-24","y":2014,"t":"单","s":"法人必须依据特别立法或国家元首的许可才 )。 得以设立的原则称为(","o":["准则主义","特许主义","行政许可主义","自由设立主义"],"a":"B","e":"所谓法人设立的原则,是指法人设立的\n基本依据及基本方式。因法人类型及时代的不同,其\n设立原则亦不同,主要有:自由设立主义,特许主义,\n许可设立主义,准则主义,强制设立主义等。其中,特\n许主义,即法人的设立需有专门的法令或国家特别许\n可。因此需要有特别立法或者国家元首许可才能设\n立的原则属于特许主义。","k":"民事主体"},{"id":"2014-27","y":2014,"t":"单","s":"章某为曙光中学初一学生。某日,在放学回家 路过育才幼儿园时,章某用弹弓射树上小鸟,不料误伤 在园内玩要的幼儿吕某。吕某的损害应由()。","o":["曙光中学承担全部赔偿责任","育才幼儿园承担全部赔偿责任","章某的监护人承担全部赔偿责任","育才幼儿园和章某的监护人承担连带赔偿 责任"],"a":"C","e":"根据《民法典》规定,被监护人造成他\n\n人损害的,由监护人承担侵权责任。监护人尽到监护\n责任的,可以减轻其侵权责任。因此,监护人承担的\n是无过错责任,即只要被监护人的行为构成侵权,监\n护人就应当承担侵权责任。初中生章某对吕某造成\n的损害赔偿责任必须由章某的监护人承担。而第三\n人造成在校或幼儿园中尤民事行为能力人损害的,由\n第三人承担侵权责任。幼儿园、学校或其他教育机构\n仅在未尽到管理职责的范围内承担相应的补充责任。\n故而吕某所在幼儿园不承担责任。","k":"民事主体"},{"id":"2014-32","y":2014,"t":"单","s":"下列选项中,属于人格权且只能由自然人享 有的是()","o":["荣誉权","名誉权","隐私权","亲属权"],"a":"C","e":"人格权是指民事主体依法享有的为维\n护独立法律人格所必备的基本民事权利,具有自然权\n利和法定权利双重属性。其中,名誉权、荣誉权,自然\n人和法人都能够享有。而隐私权则是自然人专有的\n对自己的个人隐私进行支配并排除他人非法干涉的\n人格权。选项D中的亲属权则属千身份权中的一种。","k":"民事主体"},{"id":"2014-46","y":2014,"t":"多","s":"根据《合伙企业法》的规定,有限合伙人 )。","o":["不执行合伙事务","有权对外代表合伙企业","可以用实物和知识产权出资","对合伙企业的债务承担有限责任"],"a":"ACD","e":"根据《合伙企业法》的规定,有限合伙\n企业是由普通合伙人和有限合伙人组成,普通合伙人\n对合伙企业债务承担无限连带责任,有限合伙人以其\n认缴的出资额为限对合伙企业债务承担责任。因此\n选项D正确。有限合伙企业由普通合伙人执行合伙\n事务,有限合伙人不得对外代表合伙企业,因此选项\nA 正确,选项B 为错误。此外,有限合伙人仅限不能\n以劳务出资,可以用实物和知识产权出资,故而选项\nC正确。","k":"民事主体"},{"id":"2014-47","y":2014,"t":"多","s":"下列权利中,受侵权责任法保护的有( )。","o":["股权","监护权","发现权","继承权"],"a":"ABCD","e":"民事权益,包括生命权、健康权、姓名\n权名誉权、荣誉权、肖像权、隐私权、婚姻自主权、监\n护权、所有权、用益物权、担保物权、著作权、专利权、\n商标专用权、发现权、股权、继承权等人身、财产权益。\n因此四个选项均正确。","k":"民事主体"},{"id":"2015-22","y":2015,"t":"单","s":"下列选项中,具备法人资格的是(","o":["合伙企业","个体工商户","个人独资企业","一人有限责任公司"],"a":"D","e":"法人是具有民事权利能力和民事行为\n能力,依法独立享有民事权利和独立承担民事义务的\n组织。法人的基本特征包括:法人是依法成立的一种\n社会组织,法人拥有独立的财产或者经费,法人独立\n\n承担民事责任,法人能够以自己的名义参加民事活\n动。根据相关法律规定,选项中只有D选项的一人有\n限责任公司具备法人的基本特征,具备法人资格。合\n伙人对合伙企业的债务承担无限清偿责任,自然人对\n个体工商户、个人独资企业的债务承担无限清偿责\n任,ABC选项均不能独立承担民事责任,不具备法人\n资格。","k":"民事主体"},{"id":"2015-24","y":2015,"t":"单","s":"甲系精神病人,有亲属如下:母亲,75周岁, 瘫痪在床;弟弟,48周岁,工人;儿子,20周岁,在校大 学生;女儿,17周岁,无业。甲的监护人应为()。","o":["甲母","甲弟","甲子","甲女"],"a":"C","e":"《民法典》第28条规定,无民事行为能\n力或者限制民事行为能力的成年人,由下列有监护能\n力的人按顺序担任监护人:(1)配偶;(2 )父母、子\n女;(3 )其他近亲属;(4 )其他愿意担任监护人的个\n人或者组织,但是须经被监护人住所地的居民委员\n会、村民委员会或者民政部门同意。甲女为未成年\n人,不在监护人范围内,D选项错误;甲母和甲子在监\n护人范围内,但甲母没有监护能力,A 选项错误。所\n以,甲的监护人应为甲子,C选项正确。甲子作为监\n护人的顺序在甲弟之前,所以甲弟不是监护人,B 选\n项错误。","k":"民事主体"},{"id":"2015-46","y":2015,"t":"多","s":"甲离家出走,下落不明已满5年。下列人员 中,可向人民法院申请甲为失踪人的有()。","o":["甲的妻子","甲的姐姐","甲的债权人","甲的外祖父"],"a":"ABCD","e":"根据《民法典》和司法解释的规定,可\n以提出宣告失踪申请的利害关系人主要包括被申请\n宣告失踪人的配偶、父母、子女、兄弟姐妹、祖父母、外\n祖父母、孙子女、外孙子女以及其他与被申请人有民\n事权利义务关系的人,如自然人的债权人或债务人\n等。据此,本题正确选项是ABCD。","k":"民事主体"},{"id":"2015-50","y":2015,"t":"多","s":"甲与妻子乙协议离婚,约定8周岁儿子由乙 抚养,甲支付抚养费。后甲与有一女儿的丙再婚,并 在婚后继续给付儿子抚养费。十年后,丙因病去世。 丙去世时,其近亲属还有姐姐丁。有权继承丙遗产的 人有()。","o":["甲","甲的儿子","丙的女儿 三、简答题:第51~54小题,每小题6分","丁"],"a":"AC","e":"本题考查的是继承制度。根据《民法\n典》规定,遗产按照下列顺序继承:第一顺序包括:配\n偶子女、父母对公婆、岳父母尽了主要赡养义务的\n丧偶儿媳、丧偶女婿,也作为第一顺序继承人;第二顺\n序包括:兄弟姐妹、祖父母、外祖父母。关千第二顺位\n继承人,司法解释明确规定:(1)养子女与生子女之\n间养子女与养子女之间,系养兄弟姐妹,可以互为第\n二顺序继承人,被收养人与其亲兄弟姐妹之间的权利\n义务关系因收养关系的成立而消除,不能互为第二顺\n序继承人。(2) 继兄弟姐妹之间的继承权,因继兄弟\n姐妹之间的抚养关系而发生,没有抚养关系的,不能\n互为第二顺序继承人。继承开始后,由第一顺序继承\n人继承,第二顺序继承人不继承。没有第一顺序继承\n人的,才由第二顺序继承人继承。本题中,丙的第一\n顺序继承人是丈夫甲和女儿,第二顺序继承人是姐姐\n丁,因此,有权继承丙遗产的人是甲和丙的女儿,本题\n正确选项是A C,D 选项错误。甲的儿子与乙生活,与\n丙没有抚养关系,甲的儿子无权继承丙的遗产,B 选\n项错误。\n三、简答题\n5l.[答案]\n缓刑的适用条件包括:(1)犯罪分\n子被判处拘役或者3年以下有期徒刑的刑罚;(2)犯\n罪分子的犯罪情节较轻,有悔罪表现,没有再犯罪的\n危险,且宣告缓刑对所居住社区没有重大不良影响;\n(3)犯罪分子不是累犯或者犯罪集团的首要分子。\n(每个要点2分,共6分)\n[点评]\n我国刑法规定的缓刑,属千刑罚暂缓执\n行,即对原判刑罚附条件不执行的一种刑罚制度。缓\n刑分为一般缓刑和战时缓刑,其中,一般缓刑是指人\n民法院对于被判处拘役或3年以下有期徒刑的犯罪\n分子,根据其犯罪情节和悔罪表现,认为暂缓执行原\n判刑罚,没有再犯罪的危险,且宣告缓刑不会对所居\n住社区产生重大的不良影响的,规定一定的考验期,\n暂缓其刑罚的执行,若犯罪分子在考验期内没有发\n生法定撤销缓刑的情形,原判刑罚就不再执行的\n制度。\n根据我国刑法的规定,适用缓刑必须具备下列\n条件:\n(l)犯罪分子被判处拘役或者3年以下有期徒\n刑的刑罚。缓刑的附条件不执行原判刑罚的特点,决\n定了缓刑的适用对象只能是罪行较轻的犯罪分子。\n(2)犯罪分子的犯罪情节较轻,有悔罪表现,没\n\n有再犯罪的危险,且宣告缓刑不会对所居住社区产生\n重大的不良影响。这是适用缓刑的实质条件,它们必\n须同时具备。\n(3) 犯罪分子不是累犯或者犯罪集团的首要分\n子。累犯屡教不改、主观恶性较深,有再犯之虞,适用\n缓刑难以防止其再犯新罪,犯罪集团的首要分子社会\n危害性较大。累犯和犯罪集团的首要分子即使被判\n处拘役或3年以下有期徒刑,也不能适用缓刑。\n(4) 犯罪人具有上述条件,可以宣告缓刑。犯罪\n主体具有上述条件,且是不满18 周岁的人、怀孕的妇\n女或者已满75 周岁的人,就应当宣告缓刑。\n缓刑属千刑法量刑制度中的一种,刑法的量刑制\n度包括:累犯、自首、立功、坦白、数罪并罚","k":"民事主体"},{"id":"2016-23","y":2016,"t":"单","s":"甲为精神病人乙的监护人。甲的下列行为 中,属于依法履行监护职责的是( )。","o":["免除丙欠乙的1万元债务","撤销乙患病前低价卖表给丁的合同","用乙的存款为乙支付医疗费","为防止乙出门用铁链将其锁在家里 )"],"a":"C","e":"《民法典》第35条第1款规定:\"监护\n人应当按照最有利于被监护人的原则履行监护职责。\n监护人除为维护被监护人利益外,不得处分被监护人\n的财产。\n\"\n甲作为监护人,应当为被监护人乙的利益处理财\n产。免除丙的债务的行为会导致乙财产的减少,不是\n为了被监护人的利益,不属千依法履行监护人职责,\n不选A。\n乙患病前是完全民事行为能力人,其签订的合同\n有效,甲无权撤销,不选B。\n用铁链将乙锁在家中,侵犯了乙的人身自由,没\n有保护乙的人身利益,反而侵犯了乙的人身利益,不\n属于依法履行监护职责,不选D。\n用乙的存款支付乙的医疗费,是为了被监护人的\n利益,处理被监护人的财产,属千依法履行职责的行\n为,正确选项为C。","k":"民事主体"},{"id":"2016-28","y":2016,"t":"单","s":"甲、乙、丙三人共同设立一会计师事务所,该 事务所为特殊的普通合伙企业。甲、乙在办理一笔业 务时,因重大过失造成客户损失10万元。该损失应 由()。","o":["甲、乙、丙承担按份责任","甲、乙、丙承担无限连带责任","甲、乙承担按份责任,丙承担补充责任","甲、乙承担无限连带责任,丙承担有限责任"],"a":"D","e":"《合伙企业法》第57条第1款规定:\n\"一个合伙人或者数个合伙人在执业活动中因故意或\n者重大过失造成合伙企业债务的,应当承担无限责任\n或者无限连带责任,其他合伙人以其在合伙企业中的\n财产份额为限承担责任。\"\n本题中,甲乙丙三人设立的会计师事务所是特殊\n的普通合伙企业,甲、乙因重大过失给客户造成损失,\n根据上述法律规定,甲乙承担尤限连带责任,丙以在\n会计师事务所的财产份额为限承担有限责任,D选项\n正确,A、B、C选项错误。","k":"民事主体"},{"id":"2016-35","y":2016,"t":"单","s":"甲公司章程规定:公司的法定代表人为张某; 公司签订金额100.万元以上的合同须经董事会决议。 后张某擅自以甲公司名义与不知情的乙公司签订了一 份金额为150万元的合同。张某的代表行为()。","o":["有效","可撤销","无效","效力待定"],"a":"A","e":"《民法典》第61条第3款规定:\"法人\n章程或者法人权力机构对法定代表人代表权的限制,\n不得对抗善意相对人。\"\n本题中,张某为甲公司的法定代表人,张某签订\n合同的金额权限为100万元以下。张某擅自以甲公\n司名义与乙公司签订了金额为150万元的合同,超越\n了100万元的权限。但是乙公司不知情,所以按照上\n述规定,张某的代表行为有效,A选项正确,BCD选项\n错误。","k":"民事主体"},{"id":"2017-38","y":2017,"t":"单","s":"甲(18周岁)伪造身份信息与乙(23周岁)登 记结婚。有权以甲未达到法定婚龄为由申请宣告婚 姻无效的利害关系人是( ()。","o":["甲的近亲属","乙的近亲属","甲住所地的基层组织","乙住所地的基层组织"],"a":"A","e":"根据司法解释的规定,以未到法定婚龄\n为由申请宣告婚姻无效的,为未达法定婚龄者的近亲\n属。因此本题选A。","k":"民事主体"},{"id":"2017-46","y":2017,"t":"多","s":"甲被依法宣告失踪,乙为甲的财产代管人。 下列选项中,由乙从甲的财产中支付的有( )。","o":["甲所欠税款","甲所欠债务","甲应支付的赡养费","乙代管财产的管理费"],"a":"ABCD","e":"《民法典》第42 条规定:\n\"失踪人的财\n产由其配偶、成年子女、父母或者其他愿意担任财产\n代管人的人代管。代管有争议,没有前款规定的人,\n或者前款规定的人无代管能力的,由人民法院指定的\n人代管。\"\"其他费用\n\",包括赡养费、扶养费、抚育费\n和因代管财产所需的管理费等必要的费用。因此\nABCD项均正确。","k":"民事主体"},{"id":"2017-47","y":2017,"t":"多","s":"某服装公司员工实施的下列行为中,该公司 不予认可但仍应承担民事法律后果的有( ()。","o":["超越代表权限与不知情的L公司订立买卖 合同","超越公司经营范围与不知情的M公司订立买 卖合同","伪造公司印章与不知情的P公司订立买卖 合同","以自己的名义将公司的电脑转让给不知情的 Q公司"],"a":"AB","e":"《民法典》第61条第3款规定:\n\" 法人\n章程或者法人权力机构对法定代表人代表权的限制,\n不得对抗善意相对人。\"因此A项中买卖合同有效,该\n公司应承担民事法律后果。《民法典》第505 条规定:\n\"当事人超越经营范围订立的合同的效力,应当依照\n本法第一编第六章第三节和本编的有关规定确定,不\n得仅以超越经营范围确认合同无效。\"B项买卖合同\n有效,公司需承担民事法律后果。《民法典》第171 条\n第1 款规定:\n\" 行为人没有代理权、超越代理权或者代\n理权终止后,仍然实施代理行为,未经被代理人追认\n的,对被代理人不发生效力。\"CD项均为没有代理权\n的行为,只有经过被代理人的追认,被代理人才承担\n民事责任。该公司不予认可,也就是不予追认,该民\n事责任由行为人承担,公司不承担法律后果。","k":"民事主体"},{"id":"2018-21","y":2018,"t":"单","s":"李某于2012 年7 月将户籍由甲市迁往乙市, 因遗失户籍迁移证而未能落户,后李某因工作需要, 自2013 年8 月起租住在丙市,并在2014 年9 月至 2015 年 12 月期间因重病在丁市某医院住院治疗。 2015 年10 月时李某的住所是( )。","o":["甲市","乙市","丙市","丁市"],"a":"C","e":"《民法典》第25 条规定:\"自然人以户\n籍登记或者其他有效身份登记记载的居所为住所;经\n常居所与住所不一致的,经常居所视为住所。\"经常居\n住地是公民离开住所地最后连续居住一年以上的地\n方,但医院治病的除外。甲的原籍是甲市,但是其自\n2013年8月开始即在丙市租住,至2014年9月,连续\n居住一年以上,丙市是甲的经常居住地。虽然甲后来\n在丁市的医院住了一年以上,但是医院不能作为经常\n居住地,所以2015年10月时,李某的经常居住地是\n丙市,住所地是经常居住地,即丙市。C项正确。","k":"民事主体"},{"id":"2018-31","y":2018,"t":"单","s":"甲(10 周岁)、乙(l1 周岁)、丙(12 周岁)翻 越高速公路天桥旁水泥护栏后,趴在防护网上往高速 公路抛掷石块击打过往车辆,其中一石块击中司机丁 致其重伤,但无法确认该石块是谁投掷。丁的损害应 由()。","o":["甲、乙丙连带赔偿","高速公路管理机构赔偿","甲、乙、丙的监护人连带赔偿","甲、乙、丙的监护人和高速公路管理机构连带 赔偿"],"a":"C","e":"本题考查共同危险行为及监护人责任。\n共同危险行为,指二人以上实施危及他人人身或者财\n产安全的行为并造成损害后果,不能确定实际侵害行\n为人的情况。本题中,甲乙丙向高速公路上的过往车\n辆投掷石块,三人实施危及他人人身以及财产安全的\n行为,并且造成了司机丁的损伤,但是无法确定实际\n侵害人,所以甲乙丙三人的行为是共同危险行为。根\n据《民法典》的规定,二人以上实施危及他人人身、财\n产安全的行为,其中一人或者数人的行为造成他人损\n害,能够确定具体侵权人的,由侵权人承担责任;不能\n确定具体侵权人的,行为人承担连带责任。无民事行\n为能力人限制民事行为能力人造成他人损害的,由\n监护人承担侵权责任。监护人尽到监护责任的,可以\n减轻其侵权责任。本题中,甲乙丙均为限制民事行为\n能力人,甲乙丙造成丁损害,应当由监护人承担连带\n侵权责任。C项正确。","k":"民事主体"},{"id":"2018-32","y":2018,"t":"单","s":"下列情形中,不属于法人解散原因的是 ()。","o":["被吊销营业执照","被吊销登记证书","章程规定的存续期间届满","变更名称"],"a":"D","e":"《民法典》第69条规定:\"有下列情形\n之一的,法人解散:(一)法人章程规定的存续期间届\n满或者法人章程规定的其他解散事由出现;(二)法\n人的权力机构决议解散;(三)因法人合并或者分立\n需要解散;(四)法人依法被吊销营业执照、登记证\n书,被责令关闭或者被撤销;(五)法律规定的其他情\n形。\"因此本题ABC项均属于法人解散的原因。D项\n不会导致法人解散,法人变更名称后,依然存在。本\n题选D。","k":"民事主体"},{"id":"2018-46","y":2018,"t":"多","s":"甲、乙、丙设立一合伙企业。 2014 年8 月,该 合伙企业欠星月公司贷款36 万元,同年10 月,丙经 甲、乙同意退伙,依约承担了 15 万元的合伙债务。 2015 年2 月,丁经甲、乙同意人伙,并约定:丁对入伙 前该合伙企业所欠债务不承担责任。对该合伙企业 欠星月公司的债务应承担无限连带责任的有( )。","o":["甲","乙","丙","丁"],"a":"ABCD","e":"《合伙企业法》第44条第2 款规定:新\n合伙人对入伙前合伙企业的债务承担无限连带责任。\n第53条规定:退伙人对基于其退伙前的原因发生的\n合伙企业债务,承担无限连带责任。法律没有规定合\n伙人之间的内部约定可以改变连带责任的承担。因\n此本题中,丙虽然退伙了,丁虽然是新入伙,且二人都\n与甲、乙约定了债务承担的条款,但是不能对抗合伙\n企业的债权人。甲乙丙丁对合伙企业的债务须承担\n无限连带责任。ABCD项全选。","k":"民事主体"},{"id":"2019-23","y":2019,"t":"单","s":"甲为设立蓝天公司,以自己的名义承租乙公 司的房屋作为蓝天公司筹备处的办公场所,约定租金 2万元。蓝天公司成立后,乙公司对到期未付的租金 )。","o":["只能请求甲支付","只能请求蓝天公司支付","有权选择请求甲或蓝天公司支付","有权请求甲和蓝天公司承担按份责任"],"a":"C","e":"《民法典》第75条规定:\"设立人为设\n立法人从事的民事活动,其法律后果由法人承受;法\n人未成立的,其法律后果由设立人承受,设立人为二\n人以上的,享有连带债权,承担连带债务。设立人为\n设立法人以自己的名义从事民事活动产生的民事责\n任,第三人有权选择请求法人或者设立人承担。\"因\n此,乙公司有权选择甲或者蓝天公司支付到期未付的\n租金,本题选C。","k":"民事主体"},{"id":"2019-24","y":2019,"t":"单","s":"甲、乙系夫妻,1998年5月儿子丙出生。2017 年10月甲与侄子丁签订书面协议,约定在甲丧失民事 行为能力时,丁担任甲的监护人。一年后甲丧失民事 行为能力,其好友戊表示愿意担任甲的监护人,并得到 甲住所地居委会的同意。此时甲的监护人是()。","o":["乙","丙","丁","戊"],"a":"C","e":"意定监护是指具有完全民事行为能力\n的成年人可以与其近亲属、其他愿意担任监护人的个\n人或者组织事先协商,以书面形式确定自己的监护\n人,在自己丧失或者部分丧失民事行为能力时,由该\n监护人履行监护职责的监护。本题中,甲与丁事先协\n商,以书面形式确定丁为甲的监护人。因此,甲在丧\n失民事行为能力后,其监护人为丁,C项正确。","k":"民事主体"},{"id":"2019-31","y":2019,"t":"单","s":"下列选项中,可以作为保证人的是(.)。","o":["个体工商户","教育部直属高校","企业法人的职能部门","街道办事处"],"a":"A","e":"《民法典》第683条规定:\n\" 机关法人不\n得为保证人,但是经国务院批准为使用外国政府或者\n国际经济组织贷款进行转贷的除外。以公益为目的\n的非营利法人、非法人组织不得为保证人。\"因此BD\n项不能作为保证人。本题原答案为A,因为根据《担\n保法》第10条第1款的规定,企业法人的分支机构、\n职能部门不得为保证人。但是《民法典》没有规定企\n业法人的职能部门不得为保证人,因此根据最新的规\n定,C项也正确。","k":"民事主体"},{"id":"2019-46","y":2019,"t":"多","s":"我国《民法总则》依据法人存在的目的,将法 人分为营利法人、非营利法人和特别法人。下列选项 中,属于特别法人的有()。","o":["机关法人","事业单位法人","捐助法人","农村集体经济组织法人"],"a":"AD","e":"《民法典》第96条规定:\n\"本节规定的\n机关法人、农村集体经济组织法人、城镇农村的合作\n经济组织法人、基层群众性自治组织法人,为特别法\n人。\n\" 结合法条,可以判断AD选项符合题目要求。事\n业单位法人,捐助法人属于非营利法人,所以BC选项\n不选。本题属千典型的法条记忆类题目,教材对法人\n的分类也有明确清晰的表述。","k":"民事主体"},{"id":"2020-38","y":2020,"t":"单","s":"营利法人依法解散进行清算期间,营利法人 ( )。","o":["主体资格消灭,不能进行任何民事活动","主体资格消灭,但可以从事与清算有关的活动","主体资格不消灭,可以进行各种民事活动","主体资格不消灭,但不得从事与清算无关的 活动"],"a":"D","e":"《民法典》第72条规定:\n\" 清算期间法\n人存续,但是不得从事与清算无关的活动。法人清算\n后的剩余财产,按照法人章程的规定或者法人权力机\n构的决议处理。法律另有规定的,依照其规定。清算\n结束并完成法人注销登记时,法人终止;依法不需要\n办理法人登记的,清算结束时,法人终止。\" D选项\n正确。","k":"民事主体"},{"id":"2020-47","y":2020,"t":"多","s":"下列选项中,属于非营利法人的有()。","o":["基层群众性自治组织法人","社会团体法人","事业单位法人","农村合作经济组织法人"],"a":"BC","e":"非营利法人包括事业单位法人、社会团\n体法人和捐助法人,BC选项正确,基层群众性自治组\n织法人和农村合作经济组织法人属于特别法人,AD\n选项错误。","k":"民事主体"},{"id":"2021-21","y":2021,"t":"单","s":".下列关于捐助法人的表述,正确的是(","o":["捐助法人终止时应将剩余财产返还给捐助人","捐助法人无须设立决策机构","捐助人是捐助法人的法定代表人","捐助法人是为公益目的设立的非营利法人"],"a":"D","e":"捐助法人,是指具备法人条件,为公益\n目的以捐助财产设立的基金会、社会服务机构等,经\n依法登记成立,取得捐助法人资格,D项正确。捐助\n法人应当设理事会、民主管理组织等决策机构,并设\n执行机构,B项错误。理事长等负责入按照法人章程\n的规定担任法定代表人,C项错误。为公益目的成立\n\n的非营利法人终止时,不得向出资人、设立人或者会\n员分配剩余财产。剩余财产应当按照法人章程的规\n定或者权力机构的决议用于公益目的;无法按照法人\n章程的规定或者权力机构的决议处理的,由主管机关\n主持转给宗旨相同或者相近的法人,并向社会公告。\nA项错误。本题选D。","k":"民事主体"},{"id":"2021-23","y":2021,"t":"单","s":"在受赠人请求履行时,赠与人可以不再履行 赠与义务的情形是()","o":["受赠人严重侵害赠与人近亲属的合法权益","赠与人的经济状况显著恶化,严重影响其生产 经营","赠与某贫困山区小学电脑,但尚未交付","受赠人不履行赠与合同约定的义务"],"a":"B","e":"《民法典》第666条规定:\n\"赠与人的经\n济状况显著恶化,严重影响其生产经营或者家庭生活\n的,可以不再履行赠与义务。\"因此B项正确。《民法\n典》第663条规定:\n\"受赠人有下列情形之一的,赠与\n人可以撤销赠与:(一)严重侵害赠与人或者赠与人\n近亲属的合法权益;(二)对赠与人有扶养义务而不\n履行;(三)不履行赠与合同约定的义务。赠与人的\n撤销权,自知道或者应当知道撤销事由之日起一年内\n行使。\"AD项属于赠与入撤销赠与的情形,而不是不\n再履行赠与义务。C项属于依法不得撤销的具有救\n灾、扶贫、助残等公益、道德义务性质的赠与合同,赠\n与人不交付赠与财产的,受赠人可以请求交付,C项\n错误。本题选B。","k":"民事主体"},{"id":"2021-27","y":2021,"t":"单","s":"甲的外祖父与乙的父亲是亲兄弟。甲与乙属 千( )","o":["四代旁系血亲","五代旁系血亲","二代旁系血亲","三代旁系血亲"],"a":"A","e":"旁系血亲的计算方法为:首先找出同源\n直系血亲,然后按直系血亲的计算法,从己身往上数\n至同源直系血亲,计下世代数;再从要计算的旁系血\n亲上数至同源直系血亲,记下世代数。如果两边的世\n代数相同,则用任一边的世代数定代数;如果两边的\n世代数不同,则取世代数大的一边定代数。根据此方\n法计算,甲与乙属千四代旁系血亲,A项正确。","k":"民事主体"},{"id":"2021-28","y":2021,"t":"单","s":"甲、乙结婚后,乙与丙、丁、戊设立一合伙企 业,四人的出资比例是1: 2:3:4。五年后,甲与乙协议 离婚,双方约定将乙在合伙企业中的财产份额全部转 让给甲。甲取得合伙人地位的条件是( )","o":["丁、戊同意即可","经丙、丁戊一致同意","丙、丁同意即可","丙、戊同意即可"],"a":"B","e":"《最高人民法院关于适用(中华人民共\n和国民法典〉婚姻家庭编的解释(一)》第74条规定:\n\"人民法院审理离婚案件,涉及分割夫妻共同财产中\n以一方名义在合伙企业中的出资,另一方不是该企业\n合伙人的,当夫妻双方协商一致,将其合伙企业中的\n\n财产份额全部或者部分转让给对方时,按以下情形分\n别处理:(一)其他合伙人一致同意的,该配偶依法取\n得合伙人地位;(二)其他合伙人不同意转让,在同等\n条件下行使优先购买权的,可以对转让所得的财产进\n行分割;(三)其他合伙人不同意转让,也不行使优先\n购买权,但同意该合伙人退伙或者削减部分财产份额\n的,可以对结算后的财产进行分割;(四)其他合伙人\n既不同意转让,也不行使优先购买权,又不同意该合\n伙人退伙或者削减部分财产份额的,视为全体合伙人\n同意转让,该配偶依法取得合伙人地位。\"因此B项\n正确。","k":"民事主体"},{"id":"2021-46","y":2021,"t":"多","s":"监护人因发生突发事件等紧急情况暂时无法 履行监护职责,被监护人的生活处于无人照料状态 的,应当为被监护人安排必要的临时生活照料措施的 组织有(","o":["被监护人住所地的民政部门","监护人的所在单位","被监护人住所地的居民委员会","被监护人住所地的村民委员会"],"a":"ACD","e":"《民法典》第34条第4款规定:\"因发\n生突发事件等紧急情况,监护人暂时无法履行监护职\n责,被监护人的生活处于无人照料状态的,被监护人\n住所地的居民委员会、村民委员会或者民政部门应当\n为被监护人安排必要的临时生活照料措施。\"ACD项\n正确。","k":"民事主体"},{"id":"2022-34","y":2022,"t":"单","s":"甲丧偶,无子女,唯一的亲属乙(甲的侄子)远在外地,邻居丙主动照顾甲长达 30年,并在甲去世后为其操办后事。甲的遗产","o":["应当由乙、丙各继承50%","应当全部由丙继承","应当首先用于支付丙照顾甲的报酬","可以适当分给丙"],"a":"D","e":"根据《民法典》规定,法定继承人包括:\n配偶、子女、父母、兄弟姐妹、祖父母、外祖父母,以及\n对公婆、岳父母尽了主要赡养义务的丧偶儿媳和丧偶\n女婿。甲丧偶,无子女,唯一的亲属侄子乙不属于法\n定继承人。《民法典》第1131条规定:\"对继承人以外\n的依靠被继承人扶养的人,或者继承人以外的对被继\n承人扶养较多的人,可以分给适当的遗产。\"邻居丙主\n动照顾甲长达30年,并在甲去世后为其操办后事,属\n于\"继承人以外的对被继承人扶养较多的人\",因此甲\n的遗产可以适当分给丙。D选项正确。","k":"民事主体"},{"id":"2024-21","y":2024,"t":"单","s":"甲与乙参加某景区的户外体验项目期间,乘坐的直升机落人水中,江中救援队经过 紧急打捞找到了乙,甲则下落不明,对此,下列说法正确的是()","o":["甲下落不明后,利害关系人可以随时申请宣告甲死亡","自甲下落不明满两年,利害关系人可以申请宣告甲死亡","需自甲下落不明满四年,利害关系人才可以申请宣告甲死亡","需宣告即认定甲死亡 2024年全国法律硕士(非法学)联考真题试卷丨专业基础课"],"a":"B","e":"","k":"民事主体"},{"id":"2025-33","y":2025,"t":"单","s":"下列选项中,属于非法人组织的是( )","o":["居民委员会","个人独资企业","个体工商户","农村集体经济组织"],"a":"B","e":"非法人组织是指不具有法人资格,但是能够依法以自己的名义从事民事活动的组\n织。非法人组织包括个人独资企业、合伙企业、不具有法人资格的专业服务机构等。B 项正确。\nAD 项是特别法人,AD 项错误。个体工商户是指在法律允许的范围内,依法经过核准登记,从\n事工商业经营的自然人,C 项错误。本题选B。","k":"民事主体"},{"id":"2025-40","y":2025,"t":"单","s":"甲以12 万元的价格将网络游戏道具转让给乙,约定先付款后交货。甲收到货款后过于 激动,突发脑溢血去世。甲的近亲属只有父亲丙,丙无法登录甲的游戏账号。对此,下列说法 正确的是( )","o":["网络游戏平台对游戏道具转让不承担协助义务","游戏道具属于网络虚拟财产,丙有权继承","因甲死亡,故甲与乙之间的转让合同无效","丙不承担交付游戏道具的义务"],"a":"B","e":"网络虚拟财产受法律保护。游戏道具作为虚拟财产,属于甲的遗产的一部分,丙\n作为甲的父亲,有权继承该游戏道具,B 项正确。甲与乙之间的转让合同合法有效,甲死亡后,\n其合同权利义务由继承人丙承受,合同继续有效,丙有义务继续履行合同,即交付游戏道具,\nCD 项错误。网络游戏平台在合理范围内有义务协助继承人处理虚拟财产,A 项错误。本题选B。\n二、多项选择题","k":"民事主体"},{"id":"2026-37","y":2026,"t":"单","s":"下列合同中,因违反法律、行政法规的强制性规定而无效的是","o":["违规占道的水果摊贩与顾客签订的买卖合同","出卖人与买受人签订的低于实际成交价格的房屋买卖合同","旅行社法定代表人超出权限范围与旅游者签订的旅游合同","发包人与不具有对应资质的承包人签订的建设工程施工合同"],"a":"D","e":"建设工程施工合同承包人无相应资质,违反法律强制性效力规定,合同无\n效;\nA 摊贩占道是行政违法,买卖合同有效;B 阴阳合同价款条款无效,合同整体有\n效;C 越权代表合同效力待定。","k":"民事主体"}]},{"sub":"民法","name":"侵权责任","w":2.5,"L":50,"qs":[{"id":"2005-47","y":2005,"t":"单","s":"合伙经营期间发生亏损,退伙人已分但合伙债务的,对其参加合伙期间的全部债务(   )","o":["负连带责任","负部分责任","负补充责任","不负责任"],"a":"A","e":"《民通意见》第53 条规定:\"合伙经营期间发生亏损,合伙人退出合伙时未按约定分担或者未合\n理分担合伙债务的,退伙人对原合伙的债务,应当承担清偿责任;退伙人已分担合伙债务的,对其参加合伙期间的\n全部债务仍负连带责任。\"据此,选项A 应选。","k":"侵权责任"},{"id":"2006-47","y":2006,"t":"单","s":"根据我国法律规定,高度危险作业致人损害民事责任适用的归责原则是(   )","o":["过错责任原则","无过错责任原则","推定过错责任原则","公平责任原则"],"a":"B","e":"无过错责任有以下几种:1因产品质量、2从事高度危险作业致人损害的3建筑物、地面施工致人损\n害的4饲养的动物造成他人损害的","k":"侵权责任"},{"id":"2007-35","y":2007,"t":"单","s":"甲、乙、丙三人合伙开饭店,甲以门面房折价 10 万元出资,担任店长;乙出现金 5 万元,负责经营管理;丙 以 技术出资,作价 3 万元。三人约定盈余均分,亏损由乙承担。该饭店经营两年后,欠丁 6 万元。对此债务 (   ) 。","o":["甲、乙、丙各承担 2 万元","按约定由乙全部承担","甲、乙、丙承担连带责任","由店长甲全部承担"],"a":"C","e":"合伙债务的承担 \n] 根据民法通则及相关司法解释的规定,全体合伙人对合伙经营的亏损额,对外应当 \n负连带责任,对内则应按照协议约定的债务承担比例或者出资比例分担,故对此债务,应当 \n由甲、乙、丙承担连带责任,答案为 C。","k":"侵权责任"},{"id":"2007-50","y":2007,"t":"单","s":"高度危险作业致人损害民事责任的免责事由是 (   ) 。","o":["受害人因过错造成损害","受害人故意造成损害","受害人因重大过失造成损害","受害人故意或因重大过失造成损害"],"a":"B","e":"高度危险作业致人损害民事责任的免责事由 \n- 16 -\n\n \n \n更多考研精品资料,关注淘宝店铺:光速考研工作室 \n] 民法通则规定,从事高空、高压、易燃、易爆、剧毒、放射性、高速运输工具等对 \n周围环境有高度危险的作业造成他人损害的,应当承担民事责任;如果能够证明损害是由受 \n害人故意造成的,不承担民事责任。故答案为 B。 \n八、多项选择题","k":"侵权责任"},{"id":"2008-33","y":2008,"t":"单","s":"甲、乙、丙三人合伙经营一电器商场,效益不佳,已欠债 2 万元。三人经协商一致邀请有经营能力的丁加入到 合伙之中, 丁在被告知合伙经营状况后出资加入其中,并以合伙人的身份参与经营。两年后,该电器商场因故停业。 对丁入伙前电器商 场对外所欠的 2 万元债务,依法应当(  )","o":["由甲、乙、丙、丁四人承担按份责任","由甲、乙、丙、丁四人承担连带责任","由甲、乙、丙三人承担按份责任","由甲、乙、丙三人承担连带责任"],"a":"B","e":"根据《合伙企业法》第44 条第2 款,新合伙人对入伙前合伙企业的债务承担无限连带责任。故本题\n应选B。","k":"侵权责任"},{"id":"2008-48","y":2008,"t":"单","s":"根据民法通则规定,下列侵权行为中适用过错推定的归责原则的是(  )。","o":["产品致人损害","环境污染致人损害","动物致人损害","建筑物致人损害"],"a":"D","e":"根据《民法通则》第126 条,建筑物或者其他设施以及建筑物上的搁置物、悬挂物发生倒塌、脱落、\n坠落造成他人损害的,它的所有人或者管理人应当承担民事责任,但能够证明自己没有过错的除外。也就是说,建\n筑物致人损害适用过错推定的归责原则。选项A、B、C 均实行无过错责任。","k":"侵权责任"},{"id":"2009-48","y":2009,"t":"单","s":"2006 年 7 月 27 日,某农用航空服务站为某村进行飞行防治病虫害作业,多次超低空飞经个体养鸡户张某的 鸡 舍上空。飞机飞行的噪音使张某的鸡群受到惊吓,鸡陆续死亡,累计 2 千余只。此种侵权行为属于(   )。","o":["一般侵权","高度危险作业侵权","环境污染侵权","产品缺陷侵权"],"a":"C","e":"本题考查侵权行为。根据《民法通则》第123 条规定,从事高空、高压、易燃、易爆、剧毒、放射\n性、高速运输工具等对周围环境有高度危险的作业造成他人损害的,应当承担民事责任;如果能够证明损害是由于\n受害人故意造成的,不承担民事责任。可见,本题不符合高度危险作业侵权行为特征,B 选项错误。第124 条规定,\n违反国家保护环境防治污染的规定,污染环境造成他人损害的。应当依法承担民事责任。本题中,某农用航空服务\n站造成噪音污染,致张某损害,构成环境污染侵权。C 选项正确,A 选项的错误。第122 条规定,因产品质量不合格\n造成他人财产、人身损害的,产品制造者、销售者应当依法承担民事责任。运输者、仓储者对此负有责任的产品制\n造者,销售者有权要求赔偿损失。本题也不符合产品缺陷侵权行为的特征。因此本题答案为C","k":"侵权责任"},{"id":"2009-49","y":2009,"t":"单","s":"甲被恶狗追咬,为避免被咬伤,夺过从其旁边经过的乙的名贵手提包,向狗打去。狗被打伤,乙的手提包也被 损 坏。甲的行为构成(   )。","o":["正当防卫","自助行为","侵权行为","紧急避险"],"a":"D","e":"本题考查紧急避险。正当防卫是指当公共利益、他人或本人的人身或其他利益受到不法侵害时,\n行为人采取的必要方位措施。自动行为是民事主体为保护自己的利益,对他人的人身自由予以约束或对他人的财产、\n人身或者其他合法利益面授正在发生的危险,二奶不得已采取的致他人较小损害的行为,本题中,甲为避免被狗咬\n伤,夺乙的提包打狗属于紧急避险行为,不构成侵权。因此本题答案为D","k":"侵权责任"},{"id":"2009-50","y":2009,"t":"单","s":"村民方某将自己饲养的马拴在树上。同村村民何某来遛狗,狗见到马嗷嗷乱叫,并向马咬去一马受惊挣断缰绳, 疯狂往公路上跑,将正在公路上练习骑摩托车的赵某撞倒,花去医疗费共 2 万余元。根据民法规定,此责任应由(  )。","o":["方某承担","何某承担","方某和何某共同承担","方某、何某和赵某共同承担"],"a":"B","e":"本题考查饲养动物致人损害的责任承担。《民法通则》第127 条规规定,饲养的动物造成他人损\n害的,动物饲养人或者管理人应当承担民事责任;由于受害人的过错造成损害的,动物饲养人或者管理人不承担民\n事责任;由于第三人的过错造成损害的,第三人应当承担民事责任。本题中,何某的狗使方某的马受惊致赵某损害,\n损害是由狗引起的,应有狗的饲养人何某承担侵权责任。因此本题答案为B \n八、多项选择题","k":"侵权责任"},{"id":"2011-29","y":2011,"t":"单","s":"甲为撰写毕业论文,复印了某杂志上的一篇 文章作为参考。甲的这一行为属于()。","o":["法定许可使用行为","侵权行为","合理使用行为","强制许可使用行为"],"a":"C","e":"]\n合理使用是对著作权的一种限制,《著\n作权法》规定了12 种合理使用的方式。其中,为个人\n学习、研究或者欣赏,使用他人已经发表的作品,构成\n合理使用,可以不经著作权人许可,不向其支付报酬。\n本题中,甲为撰写毕业论文,复印了某杂志上的一篇\n文章作为参考,该行为符合法律规定的合理使用的形\n式,答案选C。考生要注意,合理使用和法定许可使\n用在使用作品时,都不需要取得著作权人的许可,两\n者的区别在于是否要向著作权人支付报酬。","k":"侵权责任"},{"id":"2011-50","y":2011,"t":"多","s":"一般侵权行为民事责任的抗辩事由包括 )。","o":["不可抗力","受害人的故意","意外事件","受害人同意 三、简答题:51~54小题,每小题6分"],"a":"ABCD","e":"侵权责任的抗辩事由,是指免除或者减\n轻侵权责任的条件。抗辩事由的成立必须具备三个\n条件:(1) 对抗性;(2) 客观性;(3) 法定性。侵权责\n任的抗辩事由可以分为两大类:正当理由和外来原\n因。作为抗辩事由的正当理由包括:(1)依法执行公\n务;(2) 正当防卫;(3) 紧急避险;(4) 受害人同意;\n(5)自助行为。作为抗辩事由的外部原因包括:\n(1)不可抗力;(2)意外事件;(3)受害人过错;(4)第\n三人过错。故答案选ABCD。《民法典》新增自甘风险\n作为侵权责任的抗辩事由。\n三、简答题","k":"侵权责任"},{"id":"2012-24","y":2012,"t":"单","s":"2008年5月,甲、乙、丙合开了一间酒吧,甲以 现金10万元出资,乙以其所有的房屋出资,丙以担任 调酒师工作的劳务出资。2008年12月,酒吧欠某酒 厂5万元货款。后甲因与其他合伙人发生矛盾,于 2009年2月退伙。上述债务应当( )。","o":["由乙独立承担责任","由乙和丙承担连带责任","由甲和乙承担连带责任","由甲、乙和丙承担连带责任"],"a":"D","e":"《合伙企业法》第53条规定,退伙人对\n基千其退伙前的原因发生的合伙企业债务,承担无限\n连带责任。故选D。","k":"侵权责任"},{"id":"2013-23","y":2013,"t":"单","s":"不满10周岁的小学生所为的下列行为中,无 效的是()。","o":["在自动售货机上买零食","接受学校对三好生的物质奖励","将自己的200元压岁钱送给同学","写了一篇文章并发表在校报上"],"a":"C","e":"《民法典》第19条规定:\"八周岁以上\n的未成年人为限制民事行为能力人,实施民事法律行\n为由其法定代理人代理或者经其法定代理人同意、追\n认;但是,可以独立实施纯获利益的民事法律行为或\n者与其年龄、智力相适应的民事法律行为。\"第20条\n规定:\"不满八周岁的未成年人为无民事行为能力人,\n由其法定代理人代理实施民事法律行为。\"B选项是\n纯获利益的行为,有效。D选项发表文章是著作权的\n获得,属于事实行为,不以年龄为限制条件,所以同样\n\n有效,排除D。A 选项中在自动贩卖机上购买零食,\n因为金额数昼较小,属于与年龄、智力相适应的行为,\n有效,因此排除A。C选项中由于所处分的数额对于\n行为人来说超过与其年龄、智力相适应的水平,因此\n应认定为无效。需要说明的是,现在虽然也能够用排\n除法选择出答案,但是该年份的题目出自《民法典》生\n效之前,所以以10 周岁为界限设计的题目,目前考生\n注意《民法典》对于限制民事行为能力人的年龄已经\n修改为8岁即可,对于往年的题目不必过于纠结。","k":"侵权责任"},{"id":"2013-39","y":2013,"t":"单","s":"市政公司在挖掘的坑道两侧设置了障碍物和 夜间警示灯。某夜,甲酒后驾车,撞毁障碍物和夜间 警示灯后逃逸。次日凌晨,乙骑自行车经过时摔人坑 道受伤。乙的损失应当()。","o":["由市政公司承担赔偿责任","由甲承担赔偿责任","由市政公司和甲承担连带责任","由乙自己承担"],"a":"A","e":"根据《民法典》第1258 条第1款的规\n定,在公共场所或者道路上挖掘、修缮安装地下设施\n等造成他人损害,施工人不能证明已经设置明显标志\n和采取安全措施的,应当承担侵权责任。在公共场所\n或者道路上施工,应当设置明显标志和采取安全措\n施,包括以下几个方面的内容:一是,设置的警示标志\n\n必须具有明显性。二是,施工人要保证警示标志的稳\n固并负责对其进行维护,使警示标志持续地存在千施\n工期间。三是,仅设置明显的标志不足以保障他人的\n安全的,施工人还应当采取其他有效的安全措施。因\n此,虽然市政公司在挖掘的坑道两侧设置了障碍物和\n夜间警示灯,但因为被甲撞毁后没有及时进行修复和\n维修而致使他人发生伤亡,该损害赔偿责任应由市政\n公司承担。","k":"侵权责任"},{"id":"2013-50","y":2013,"t":"多","s":"甲乘坐公交公司司机乙驾驶的公交车时,公 交车与一私家车相撞,甲受伤致残。经认定,该起交 通事故应由乙负全部责任。对此,下列选项中,不正 确的有()。","o":["甲的损失应由乙承担责任","甲的损失应由公交公司承担责任","甲的损失应由乙与公交公司承担按份责任","甲的损失应由乙与公交公司承担连带责任 三、简答题:第51~54小题,每小题6分"],"a":"ACD","e":"本题考查侵权责任中的用人单位责任。\n根据《民法典》第1191条第1款的规定,用人单位的\n工作人员因执行工作任务造成他人损害的,由用人单\n位承担侵权责任。本题中,甲的受伤是因为司机乙执\n行工作任务引起的。而乙对该交通事故又负全责,那\n么根据侵权责任的构成要件,客观上司机乙有造成他\n人权益损伤的加害行为,主观上具有过错,甲也出现\n了受伤的损害事实,甲的受伤与乙的交通肇事有直接\n的因果关系,因此甲的损害赔偿应由作为乙的用人单\n位的公交公司承担。\n三、简答题","k":"侵权责任"},{"id":"2014-25","y":2014,"t":"单","s":"根据《侵权责任法》的规定,污染环境造成损 害的,污染者承担侵权责任的归责原则是()。","o":["公平责任原则","过错责任原则","无过错责任原则","过错推定责任原则"],"a":"C","e":"环境污染责任的构成要件包括:(I)污\n染环境的行为。(2) 损害。(3)污染环境行为与损\n害之间存在因果关系。不要求污染人具有过错,即不\n论行为人主观是否有过错,只要行为和损害后果之间\n具有因果关系,就应该承担民事责任的归责原则。因\n此污染者承担侵权责任的归责原则是无过错责任\n原则。","k":"侵权责任"},{"id":"2014-26","y":2014,"t":"单","s":"某医院医生张某在为患者李某做手术时将一 块纱布遗留在李某腹腔,李某因此所受的损害应由 ()。","o":["医院承担全部赔偿责任","张某承担全部赔偿责任","医院和张某承担连带赔偿责任","张某承担赔偿责任,医院承担补充责任"],"a":"A","e":"医疗损害责任是指因医疗机构或者医\n疗人员的过错,致使患者在诊疗活动中受到损害,由\n医疗机构承担的赔偿责任。该责任的构成要件有:\n(I)医疗机构或者医疗人员实施了医疗行为。\n(2)患者遭受到非正常的损失。(3)医疗机构存在\n过错。(4)医疗过失行为与患者遭受的非正常损失\n之间具有因果联系。本题中李某因医疗人员张某的\n过错而遭受非正常损失,因此,该责任应由张某所在\n的医疗机构即某医院承担赔偿责任。","k":"侵权责任"},{"id":"2014-28","y":2014,"t":"单","s":"根据《侵权责任法》的规定,民用航空器造成 他人损害的,民用航空器经营者的免责事由是()。","o":["战争","不可抗力","受害人故意","受害人重大过失"],"a":"C","e":"民用航空器致害责任,是指民用航空器\n造成他人损害,其经营者承担的危险责任。民用航空\n器造成他人损害的,民用航空器的经营者应当承担侵\n权责任,但能够证明损害是因受害人故意造成的,不\n承担责任。因此,民用航空器经营者的免责事由仅有\n受害人故意一种。","k":"侵权责任"},{"id":"2015-25","y":2015,"t":"单","s":"甲出差,委托同事乙照看其9周岁儿子丙。 某日,乙将丙单独留在家中,自己出去打麻将。丙在 玩要时将邻居小孩丁打伤。丁的损害应由()。","o":["甲单独承担责任","乙单独承担责任","甲、乙承担连带责任","甲承担责任,乙承担相应的补充责任"],"a":"C","e":"《民法典》第1189条规定:\n\" 无民事行\n为能力人限制民事行为能力人造成他人损害,监护\n人将监护职责委托给他人的,由监护人承担侵权责\n任;受托人有过错的,承担相应的责任。\"监护人承担\n的是无过错责任,即只要被监护人的行为构成侵权行\n为,监护人就应当承担侵权责任。据此,对于丁的损\n害,甲应当承担责任。又由千乙受甲的委托照看丙,\n所以应承担过错责任。乙将丙留在家中,自己外出打\n麻将,具有过错。因此,对于丁的损害,乙应当承担相\n应的责任。\n本题原答案为C,因为《最高人民法院关千贯彻\n执行(中华人民共和国民法通则〉若干问题的意见\n(试行)》规定:\"监护人可以将监护职责部分或者全\n部委托给他人。因被监护人的侵权行为需要承担民\n事责任的,应当由监护人承担,但另有约定的除外;被\n委托人确有过错的,负连带责任。\"但《民法典》修改\n了上述规定,受托人有过错的,不再承担连带责任,而\n是承担相应的责任。因此本题无答案。","k":"侵权责任"},{"id":"2015-36","y":2015,"t":"单","s":"甲在某饭店醉酒闹事,饭店员工和就餐顾客 纷纷躲闪,顾客乙躲闪不及被甲打伤。乙的损害应由 ()","o":["甲单独承担责任","甲和饭店承担连带责任","饭店承担责任,甲承担相应的补充责任","甲承担责任,饭店承担相应的补充责任"],"a":"D","e":"本题考查的是对违反安全保障义务的\n侵权责任的理解。根据《民法典》第1198条的规定,\n未尽到安全保障义务的责任包括因第三人的行为造\n成他人损害的,由第三人承担侵权责任;经营者、管理\n者或者组织者未尽到安全保障义务的,承担相应的补\n充责任。经营者、管理者或者组织者承担补充责任\n后,可以向第三人追偿。本题中,顾客乙被甲打伤,该\n饭店未尽到安全保障义务,因此乙的损害应由甲承担\n责任,饭店承担相应的补充责任。D选项正确,ABC\n选项错误。","k":"侵权责任"},{"id":"2015-37","y":2015,"t":"单","s":"甲超速驾驶汽车,乙逆行骑摩托车。两车相 撞,摩托车飞至人行道,将行人丙砸伤。丙的损害应 由()。","o":["甲单独承担责任","乙单独承担责任","甲、乙承担连带责任","甲、乙承担按份责任"],"a":"C","e":"本题考查的是共同侵权。共同侵权,是\n指二人以上共同故意或者共同过失侵害他人,依法承\n担连带责任的行为。共同侵权行为的行为人为二人\n以上,行为具有关联性,行为人具有共同的过错(但不\n要求有意思联络),造成单一的结果。根据《民法典》\n第1168条的规定,二人以上共同实施侵权行为,造成\n他人损害的,应当承担连带责任。本题中,甲超速驾\n车,乙逆行骑摩托车,两个人的侵权行为相结合,形成\n一个有机整体,共同造成了丙的损害,是共同侵权行\n为,甲、乙承担连带责任。","k":"侵权责任"},{"id":"2015-38","y":2015,"t":"单","s":"甲承租乙的房屋。某日,甲在阳台上修剪花 草,顺手将剪刀放在阳台边上,不料剪刀被大风吹落, 扎伤行人丙。丙的损害应由()。","o":["甲单独承担责任","乙单独承担责任","丙自行承担","甲、乙共同承担责任"],"a":"A","e":"《民法典》第1253条规定:\"建筑物、构\n筑物或者其他设施及其搁置物、悬挂物发生脱落、坠\n落造成他人损害,所有人、管理人或者使用人不能证\n明自己没有过错的,应当承担侵权责任。所有人、管\n理人或者使用人赔偿后,有其他责任人的,有权向其\n他责任人追偿。\"本题中,剪刀从阳台上坠落,所有人\n是甲,不能证明自己没有过错,应由甲单独承担侵权\n责任。A项正确。","k":"侵权责任"},{"id":"2015-49","y":2015,"t":"多","s":"甲医院误将患者乙的左肾切除。甲医院有义 务赔偿乙的()。","o":["精神损害","后续治疗费用","护理费和交通费","因误工减少的收人"],"a":"ABCD","e":"医疗损害责任,是指因医疗机构或者其\n医疗人员的过错,致使患者在诊疗活动中受到损害,\n由医疗机构承担的赔偿责任。侵害他人造成人身损\n害的,应当赔偿医疗费、护理费、交通费、营养费、住院\n伙食补助费等为治疗和康复支出的合理费用,以及因\n误工减少的收入。造成残疾的,还应当赔偿残疾生活\n辅助器具费和残疾赔偿金;造成死亡的,还应当赔偿\n丧葬费和死亡赔偿金。自然人因人身权益遭受非法\n此,本题正确选项是ABCD。","k":"侵权责任"},{"id":"2016-31","y":2016,"t":"单","s":"某高校学生甲、乙在学校操场上打篮球时,乙 投篮,球反弹将甲的头部砸伤。甲的损害应由()。","o":["甲自己承担","乙承担全部责任","该高校承担全部责任","该高校与乙共同承担责任"],"a":"A","e":"《民法典》第1176条第1款规定:\" 自\n愿参加具有一定风险的文体活动,因其他参加者的行\n为受到损害的,受害人不得请求其他参加者承担侵权\n责任;但是,其他参加者对损害的发生有故意或者重\n\n大过失的除外。\"\n本题中,甲乙在操场上打篮球,对打篮球这项体\n育运动的风险及可能带来的后果,甲乙都是明知的,\n其自愿参与这项运动中,即表示自愿承担风险及相应\n后果。因此甲不能要求乙承担损害赔偿责任,而是应\n由甲自己承担损害,A选项正确,BCD选项错误。","k":"侵权责任"},{"id":"2016-33","y":2016,"t":"单","s":"甲、乙分别在山上伐木,为图方便各自将伐下 的原木从山上滚下,不料其中一根木头砸伤了山下的 行人丙,且无法确定是谁推下的这根木头。丙的损害 应由()。","o":["甲、乙承担按份责任","甲、乙承担连带责任","甲、乙、丙分担","丙自己承担"],"a":"B","e":"共同危险行为,是指二人以上实施危及\nr 他人人身或者财产安全的行为并造成损害后果,不能\n确定实际侵害行为人的情况。共同危险行为需要具\n备以下构成要件:(l)主体必须是二人以上;(2)每\n个人都单独实施并完成了危险行为,行为彼此之间无\n关联或者结合关系;(3)每个人都具有独立的过错,\n彼此之间无意思联络;(4)不能确定是谁的行为造成\n了损害后果根据《民法典》第1170条的规定,二人\n以上实施危及他人人身、财产安全的行为,不能确定\n具体侵权人的,行为人承担连带责任。\n本题中,甲乙分别在山上伐木,各自将伐下的原\n木从山上滚下,甲乙单独实施了可能造成损害后果的\n危险行为,甲乙的行为之间无关联也无结合关系,甲\n乙都有过错,且无意思联络。其中一根木头砸伤了\n丙,无法确定是谁推下的这根木头,即无法确定谁的\n行为造成了损害后果。甲乙是共同危险行为人,承担\n连带责任,B 选项正确。\n本题中,丙被砸伤,没有任何过错,也不是丙故意\n造成了损害,不应由丙自己承担损害,也不应由甲、\n乙、丙分担损害,丙不承担任何损害责任。CD错误。\n甲乙不是无意思联络的多数人侵权,不应承担按\n份责任,A选项错误。","k":"侵权责任"},{"id":"2016-34","y":2016,"t":"单","s":"根据我国《侵权责任法》,侵害他人财产的, 如果财产损失按照市场价格计算,则市场价格的确定 时间为()。","o":["损失发生时","被侵权人提起诉讼时","侵权行为实施时","被侵权人知道损失发生时"],"a":"A","e":"根据《民法典》第1184条的规定,侵害\n他人财产的,财产损失按照损失发生时的市场价格或\n者其他合理方式计算。故A选项正确,BCD 选项\n错误。","k":"侵权责任"},{"id":"2017-35","y":2017,"t":"单","s":"甲驾车正常行驶,乙酒后驾车闯红灯,两车相 撞,致甲的车撞伤正在执勤的交警丙。丙的损害应由 ()","o":["甲承担全部责任","乙承担全部责任","甲、乙承担连带责任","甲承担次要责任,乙承担主要责任"],"a":"B","e":"《民法典》第1175条规定:\n\"损害是因\n第三人造成的,第三人应当承担侵权责任。\"本题中,\n虽然是甲的车撞伤了丙,但是甲是正常驾驶,并没有\n过错。损害的发生是由于乙闯红灯导致两车相撞才\n撞伤了丙,损害是因为乙的行为造成的,应当由乙承\n担全部的赔偿责任,B 项正确。甲乙不是共同侵权行\n为,不承担连带责任,因为共同侵权行为要求有共同\n故意或者共同过失,但是甲既无故意也无过失。","k":"侵权责任"},{"id":"2017-36","y":2017,"t":"单","s":"甲工厂、乙工厂分别位于某河流的上游和中 游,两工厂单独排放的废水均不会造成损害,但废水 汇集后导致下游丙的鱼塘的鱼大量死亡。对于丙的 损失()。","o":["甲、乙均不承担责任","甲、乙承担按份责任","甲、乙承担连带责任","甲、乙、丙三方分担"],"a":"B","e":"《民法典》第1174条规定:\n\"损害是因\n受害人故意造成的,行为人不承担责任。\"甲乙排放的\n废水汇集后造成丙的损害,甲乙是无意思联络的数人\n侵权,损害并不是由丙故意造成的,因此甲乙需要承\n担赔偿责任,A项错误。第1171 条规定:\n\" 二人以上\n分别实施侵权行为造成同一损害,每个人的侵权行为\n都足以造成全部损害的,行为人承担连带责任。\"甲乙\n分别实施侵权行为造成同一损害,但是甲乙每个人的\n侵权行为不足以造成全部损害,因此不承担连带责\n任,C项错误。第1173条规定:\"被侵权人对同一损\n害的发生或者扩大有过错的,可以减轻侵权人的责\n任。\n\"丙是受害人,并没有过错,不应当与甲乙分担责\n任,D项错误。第1172条规定:\n\"二人以上分别实施\n侵权行为造成同一损害,能够确定责任大小的,各自\n承担相应的责任;难以确定责任大小的,平均承担责\n任。\"甲乙分别实施了排放污水的侵权行为造成了同\n一损害一一丙鱼塘的鱼死亡,甲乙应承担按份赔偿的\n责任,B 项正确。","k":"侵权责任"},{"id":"2017-49","y":2017,"t":"多","s":"小明在父母离异后跟随母亲生活。某日午休 )。 时,小明在幼儿园与小朋友小刚打闹,幼儿园老师余 某因外出接电话而未能发现和制止,小明将小刚的头 打伤。对于小刚的损害,不应承担责任的有()。","o":["小明的母亲","幼儿园","小明的父亲","余某"],"a":"ACD","e":"《民法典》第1199条规定:\"无民事行\n为能力人在幼儿园、学校或者其他教育机构学习、生\n活期间受到人身损害的,幼儿园、学校或者其他教育\n机构应当承担侵权责任;但是,能够证明尽到教育、管\n理职责的,不承担侵权责任。\"本题中,小刚是无民事\n行为能力人,其在幼儿园学习期间受到人身损害,应\n由幼儿园承担责任。幼儿园不能证明尽到了教育、管\n理职责,因为幼儿园教师因外出接电话才未能发现和\n制止小明的行为,幼儿园存在明显过错。小明的父母\n不需要承担责任,AC项当选。第1191条第1款规\n定:\"用人单位的工作人员因执行工作任务造成他人\n损害的,由用人单位承担侵权责任。用人单位承担侵\n权责任后,可以向有故意或者重大过失的工作人员追\n偿。\"本题中,余某是幼儿园的员工,其因执行工作任\n务造成他人损害,应由幼儿园承担侵权责任,余某不\n承担责任,D项当选。","k":"侵权责任"},{"id":"2018-23","y":2018,"t":"单","s":"甲在报纸上发表了一篇时事性文章,未声明 不允许其他媒体刊登,乙杂志社未经甲同意予以转载 且未支付报酬。乙杂志社的行为不构成侵权的法律 依据是( )。","o":["许可使用","法定许可","强制许可","合理使用"],"a":"D","e":"著作权的合理使用是指自然人、法人或\n者其他组织为了个人欣赏、评论、新闻报道、教学与艺\n术研究以及公益事业等目的,根据《著作权法》的规\n定,可以不经作者同意而使用其已经发表的作品,并\n且不向其支付报酬的行为。《著作权法》规定了12 种\n著作权的合理使用的行为,其中第4种行为是:报纸、\n期刊、广播电台、电视台等媒体刊登或者播放其他报\n纸期刊、广播电台、电视台等媒体已经发表的关千政\n治、经济、宗教问题的时事性文章,但作者声明不许刊\n登、播放的除外。本题中乙杂志社转载甲发表的时事\n性文章,且甲未声明不允许刊登,所以乙杂志社的行\n为属于著作权的合理使用。D项正确。","k":"侵权责任"},{"id":"2018-24","y":2018,"t":"单","s":"甲在某酒店公用洗手间滑倒,摔碎了眼镜。 经查:甲滑倒系因酒店清洁工乙清洁不彻底,地面湿 滑所致。甲的损失应由( )。","o":["甲自己承担","酒店承担全部责任","酒店和乙承担按份责任","酒店和乙承担连带责任"],"a":"B","e":"本题属于对用人单位责任的考查。用\n人单位责任是指用人单位的工作人员因执行工作任\n务造成他人损害的,由用人单位承担的侵权责任。本\n题中,乙是酒店的工作人员,对于甲在酒店受到的损\n害,酒店应该承担全部的侵权责任。B项正确。","k":"侵权责任"},{"id":"2018-27","y":2018,"t":"单","s":"甲将自己的汽车借给乙使用。某日,乙酒后 驾驶该车撞伤丙,丙的损失应该由( )。","o":["甲全部赔偿","乙全部赔偿 13. 下列选项中,主观方面可以表现为过失的是 A. 放火罪 B. 虐待罪","危险驾驶罪","食品监管渎职罪 14. 甲破解了张某的股票账户密码,偷偷登录账 户买卖股票练手,案发时造成张某股票账户资金实亏 15 万元,甲的行为应认定为( ) 。 A. 盗窃罪 B. 非法经营罪 C. 故意毁坏财物罪 D.非法侵人计算机信息系统罪 15. 下列选项中,既可以作为实行,也可以由不作 为实行的是( )。 A. 洗钱罪 B . 遗弃罪 C. 玩忽职守罪 D. 拒不履行信息网络安全管理义务罪 16. 甲误把张某当作李某推人水井,意图将其 淹死,但事实上井中无水,结果张某摔死,这属于 ()。 A. 客体错误 B. 工具错误 C. 打击错误 D. 因果关系错误 17. 甲在候车室以需要紧急联络为由,向赵某借 得高档手机,边打电话边向候车室外移动,出门后拔 腿就跑,已经有所警觉的赵某猛追未果。甲的行为认 定为( )。 A . 抢夺罪 B . 盗窃罪 C . 侵占罪 D. 抢劫罪 18. 下列关于罚金的表述,正确的是( )。 A.对于未成年人不得适用罚金刑 B.罚金的最低数额由法官酌情确定 c.一人犯数罪分别判处罚金刑的应该合并执行 D. 一人犯数罪同时判处没收财产和罚金刑的"],"a":"B","e":"本题属千租赁、借用机动车发生交通事\n故的责任承担。《民法典》第1209条规定:\"因租赁、\n借用等情形机动车所有人、管理人与使用人不是同一\n人时,发生交通事故造成损害,属于该机动车一方责\n任的,由机动车使用人承担赔偿责任;机动车所有人、\n管理人对损害的发生有过错的,承担相应的赔偿责\n任。\"本题中,机动车所有人甲对于损害的发生没有过\n错,所以由机动车使用人乙来承担。","k":"侵权责任"},{"id":"2019-22","y":2019,"t":"单","s":"甲骑乙公司运营的共享单车上班。途中,单 车刹车失灵,甲躲闪不及,撞伤丙。丙的损害应当 ()","o":["由甲承担全部赔偿责任","由乙公司承担全部赔偿责任","由甲和乙公司承担按份责任","由甲和乙公司承担连带责任"],"a":"B","e":"本题中,甲撞伤丙是因单车刹车失灵,\n甲没有过错,乙公司有过错。因为共享单车是由乙公\n司运营的,乙公司对共享单车负有维持正常使用状态\n的义务。但是乙公司对共享单车没尽到该义务,存在\n过失,即行为人应当预见自己的行为可能发生侵害他\n人权益的结果,但却因疏忽大意而没有预见,或者已\n经预见但轻信能够避免。乙公司是侵权人,应当对丙\n的损害承担全部赔偿责任,B项正确。","k":"侵权责任"},{"id":"2019-33","y":2019,"t":"单","s":"甲网购了一条乙销售的裙子,收到后发现面 料不是乙宣称的真丝,便在网站上给了差评。乙认为 甲的差评影响到网店声誉和商品销量,遂联系甲要求 其删除差评,并表示愿退还双倍货款,甲拒绝。乙后 来了解到,甲系一服装店店主。甲的行为()。","o":["不构成侵权","构成商业诽谤","侵犯了乙的经营权","构成不正当竞争"],"a":"A","e":"经营者向消费者提供有关商品或者服\n务的质量、性能、用途、有效期限等信息,应当真实、全\n面,不得做虚假或引人误解的宣传。本题中,不管甲\n的身份是什么,甲给予差评的行为是正当行为,并没\n有编造事实。乙销售的裙子确实不是真丝,而宣传的\n是真丝,货物与宣传不符,甲给予差评是正当行使自\n己的权利,不构成侵权,A 项正确。注意,本题中\n\" 甲\n系一服装店店主\n\" 为干扰项,甲为乙的同业竞争人员\n的身份并不影响甲享有的客观评价商品的权利。","k":"侵权责任"},{"id":"2019-37","y":2019,"t":"单","s":"甲雇乙粉刷楼房外墙。乙工作时,丙驾驶的 摩托车失控撞向脚手架,致乙从脚手架上跌落,摔成 重伤。乙对自己的损害()。","o":["只能要求甲承担赔偿责任","只能要求丙承担赔偿责任","可以要求甲、丙承担按份责任","可以要求甲、丙承担连带责任"],"a":"D","e":"本题中,乙的重伤是由千丙驾驶的摩托\n车撞击导致,乙有权就损害要求丙承担赔偿责任,同\n时,由于甲雇佣乙从事劳务,乙也可以要求甲承担赔\n偿责任。丙和甲向乙所负的债务,其内容是完全相同\n的,只要其中一人向受害人履行了赔偿义务,受害人\n就不能再向另--人求偿。从请求权角度讲,这是连带\n责任。为此,本题符合要求的答案是D。","k":"侵权责任"},{"id":"2020-21","y":2020,"t":"单","s":"某地多日暴雪,甲在公交站等车时,站台顶棚 因积雪过多塌落,将甲砸伤。该公交站站台系乙公司 设计、丙公交公司管理。甲的损害应由()。","o":["本人承担","乙公司赔偿","丙公司赔偿","乙公司和丙公司共同赔偿"],"a":"C","e":"根据《民法典》的规定,建筑物、构筑物\n或者其他设施及其搁置物、悬挂物发生脱落、坠落造\n成他人损害,所有人、管理人或者使用人不能证明自\n己没有过错的,应当承担侵权责任。所有人、管理人\n或者使用人赔偿后,有其他责任人的,有权向其他责\n任人追偿。本题中丙公司是公交站站台顶棚的管理\n人,站台顶棚积雪过多,丙公司没有及时清理,造成甲\n被压伤,应当承担侵权责任,C选项正确。","k":"侵权责任"},{"id":"2020-22","y":2020,"t":"单","s":"两个以上污染者污染环境造成他人损害的, 污染者承担()。","o":["按份责任","连带责任","过错责任","公平责任"],"a":"A","e":"根据《民法典》的规定,因污染环境、破\n坏生态造成他人损害的,侵权人应当承担侵权责任。\n两个以上侵权人污染环境、破坏生态的,承担责任的\n大小,根据污染物的种类、浓度、排放量,破坏生态的\n方式范围程度,以及行为对损害后果所起的作用等\n因素确定。故在数人实施污染环境的侵权行为时,侵\n权人承担按份责任而不是连带责任,A选项正确。","k":"侵权责任"},{"id":"2020-36","y":2020,"t":"单","s":"王某在甲汽车销售店购买了乙公司制造的汽 车。某日,王某驾驶该车在高速公路上正常行驶,安 全气囊突然弹开,导致车辆失控,王某受伤。王某 ()。","o":["只能向甲请求赔偿","只能向乙请求赔偿","只能要求甲和乙按份赔偿","可向甲请求赔偿,也可向乙请求赔偿"],"a":"D","e":"根据《民法典》的规定,因产品存在缺\n陷造成他人损害的,被侵权人可以向产品的生产者请\n求赔偿,也可以向产品的销售者请求赔偿,D选项\n正确。","k":"侵权责任"},{"id":"2020-40","y":2020,"t":"单","s":"丙的损害应由( )。","o":["甲承担责任","乙承担责任","甲和乙承担按份责任","丙自己承担"],"a":"D","e":"甲许诺丙\n\"搭便车\n\" 的行为是情谊行\n为,虽然违反了《道路交通安全法》的相关规定,但该\n违法行为与丙骨折之间没有直接的联系,且甲没有主\n观上的过错。因此甲不承担责任,AC选项错误。乙\n打开棺盖透气的行为不具有违法性,乙也不是故意要\n\n吓丙,乙根本不知道丙也在车上,也无法预见到丙在\n车上。乙不具有侵权责任构成要件中的危害行为和\n主观过错,因此乙不需要承担责任,B选项错误。丙\n的损害是由于其跳车行为导致的,而其跳车行为主要\n是由于其迷信鬼神存在的思想,故丙应该对其行为自\n担责任,D选项正确。\n本题源自真实案例,在该案例中,法院判决甲乙\n丙按份承担责任。本书认为该判决受司法实践中各\n方面的因素制约,与法理并不完全一致。而法硕考试\n的答案更为纯粹,从法律规定以及民法理论看,本题\n应选D。\n二、多项选择题","k":"侵权责任"},{"id":"2021-34","y":2021,"t":"单","s":"动物园的动物造成他人损害,动物园不承担 责任的情形是( )","o":["动物园能够证明该致损动物并非危险动物","动物园能够证明损害系第三人的过错造成","动物园能够证明尽到管理职责","动物园能够证明损害系被侵权人重大过失 造成"],"a":"C","e":"《民法典》第1248条规定:\"动物园的\n动物造成他人损害的,动物园应当承担侵权责任;但\n是,能够证明尽到管理职责的,不承担侵权责任。\"C\n项正确。","k":"侵权责任"},{"id":"2022-26","y":2022,"t":"单","s":"甲之子小甲、乙之子小乙在同一所小学上学。乙平时工作较忙,经常请甲帮忙接 小乙放学。某日,乙又请甲接小乙。在甲骑车载小乙回家途中。小乙擅自解开安全带 从车后座掉下受伤。甲立即将小乙送到医院,支付医疗费若干。该医疗费应当","o":["全部由甲承担","全部由乙承担","由甲和乙平均分担","由甲承担大部分"],"a":"B","e":"根据《民法典》规定,监护人承担的是\n无过错责任。无偿的委托合同中,因受托人的故意或\n者重大过失造成委托人损失的,委托人可以请求赔偿\n损失,在甲骑车载小乙回家途中,小乙擅自解开安全\n带从车后座掉下受伤,甲立即将小乙送医,甲既无故\n意,也无重大过失。因此对于甲垫付的医药费应当全\n部由乙承担。B选项正确。","k":"侵权责任"},{"id":"2022-37","y":2022,"t":"单","s":"2021 年1月1日,甲、乙、丙、丁聚餐,席间虽无人劝酒,四人仍喝到深夜,后 各自打车回家。次日凌晨乙因酒精中毒死亡。该损害应当由","o":["甲、乙、丙、丁分担","乙自行承担","甲、丙、丁承担连带赔偿责任","甲、丙、丁承担按份赔偿责任"],"a":"B","e":"乙作为完全民事行为能力人,对自己的\n行为应当能够正确认识并作出判断,而且对自己的身\n体状况更应该有充分的了解,聚餐席间无人劝酒,但\n是其仍饮酒至深夜,甲、丙、丁对乙的中毒身亡没有过\n错,因此该损害应当由乙自行承担。B选项正确。","k":"侵权责任"},{"id":"2024-23","y":2024,"t":"单","s":"某公司利用人工智能技术,生成虚拟歌手X。并将X演唱甲的成名歌曲的音频上传 到互联网。该歌曲系由乙作词作曲。该公司的行为()","o":["侵害甲的著作权","侵害乙的著作权","系合理使用,不构成侵权","系法定许可,不构成侵权"],"a":"B","e":"","k":"侵权责任"},{"id":"2024-32","y":2024,"t":"单","s":"小学生甲十周岁,在教室门口玩耍。来校访友的乙将车开到教室前禁行路段时,不 慎将甲撞伤。经调查,学校存在未尽到管理职责的情形,甲的损失应当()","o":["全部由乙赔偿","全部由学校赔偿","由乙赔偿,学校承担相应补充责任","由学校和乙承担连带赔偿责任"],"a":"C","e":"","k":"侵权责任"},{"id":"2025-30","y":2025,"t":"单","s":"甲在禁止游泳的河道里游泳,见河对岸有一只小船,于是游到对岸试图爬上小船。小 船失去平衡侧翻将甲砸伤。该损害应由( )","o":["甲自行承担","小船所有人全部赔偿","河道管理单位全部赔偿","河道管理单位和小船所有人连带赔偿"],"a":"A","e":"甲作为完全民事行为能力人,应当预见在禁止游泳区域游泳及攀爬小船可能导致\n的危险(如小船侧翻),其损害后果应由自身承担。小船所有人无过错,小船侧翻系甲主动攀\n爬导致,所有人不承担赔偿责任。河道管理单位已履行警示义务,甲违反规定游泳,管理单位\n无过错,不承担责任。A 项正确,BCD 项错误。本题选A。","k":"侵权责任"},{"id":"2025-49","y":2025,"t":"多","s":"A 公司研制了一种治疗白血病的新药,需要进行临床试验。为保障受试者的合法权益,","o":["依法经相关主管部门批准","依法经伦理委员会审查同意","向受试者告知可能产生的风险,并经其书面同意","将向受试者收取的试验费用全部用于受试者的诊疗"],"a":"ABC","e":"《民法典》第1008 条规定:\"为研制新药、医疗器械或者发展新的预防和治疗方\n法,需要进行临床试验的,应当依法经相关主管部门批准并经伦理委员会审查同意,向受试者\n或者受试者的监护人告知试验目的、用途和可能产生的风险等详细情况,并经其书面同意。\"\nABC 项正确,D 项错误。","k":"侵权责任"},{"id":"2026-23","y":2026,"t":"单","s":"甲驾驶机动车搭载同事乙上班,途中因走神发生了追尾事故,导致乙受伤。 乙的损失应由","o":["甲全部承担","甲适当承担","乙自行承担","甲赔偿,但可减轻赔偿责任"],"a":"D","e":"好意搭乘,驾驶人侵权,可酌情减轻赔偿,但仍需承担主要赔偿。","k":"侵权责任"},{"id":"2026-25","y":2026,"t":"单","s":"甲带5 岁的女儿乙在小区公园玩耍,邻居丙给了乙一根香蕉,乙把香蕉分享 给小伙伴丁。丁在吃香蕉时不慎吸入气管窒息而死,丁的死亡","o":["应由甲承担侵权责任","应由丙承担侵权责任","应由甲、丙承担连带责任","是意外事件,各方均无责任"],"a":"D","e":"香蕉喂食、儿童误食窒息,各方无预见可能性,属于意外事件,均无侵权\n\n责任。","k":"侵权责任"},{"id":"2026-28","y":2026,"t":"单","s":"A 公司组织低空飞行爱好者开展滑翔伞飞行活动,甲报名参加。在飞行过程中, 因突遇上升气流,未及时得到救援受伤。甲的损害应由","o":["A 公司全部赔偿","甲自行承担","甲和A 公司平均分担","A 公司承担主要责任,甲承担次要责任"],"a":"A","e":"滑翔伞属于高风险文体活动,经营者负有安全保障、应急救援义务,突遇\n气流未及时救援,A 公司全部赔偿。","k":"侵权责任"},{"id":"2026-47","y":2026,"t":"多","s":"下列有权请求行为人承担惩罚性赔偿责任的有","o":["甲故意侵害肖某知识产权,情节严重","乙明知产品存在严重缺陷而销售,造成肖某健康严重损害","丙违反法律故意污染环境,造成肖某重大财产损害","丁不适当履行合同导致肖某婚戒毁损,造成肖某严重精神损害"],"a":"ABC","e":"知识产权恶意侵权、产品缺陷致人身损害、故意污染环境,民法典均规定\n惩罚性赔偿;D 单纯合同违约无惩罚性赔偿。","k":"侵权责任"}]},{"sub":"民法","name":"物权通则与物权变动","w":2.7,"L":43,"qs":[{"id":"2005-42","y":2005,"t":"单","s":"在我国,典权属于(   )","o":["担保物权","用益物权","动产物权","完全物权"],"a":"B","e":"典权,是指典权人支付典价,对他人的不动产进行占有、使用和收益的权利。典权的内容是占有、\n使用和收益,因此属于用益物权,而非担保物权。典权的客体是不动产,因此排除选项C。典物的所有权仍为出典\n人享有,因此典权仅仅是定限物权。","k":"物权通则与物权变动"},{"id":"2005-50","y":2005,"t":"单","s":"对主物与从物的关系,下列说法中正确的是(   )","o":["从物属于主物的构成部分","从物所有权只在当事人有特别约定时,才随主物所有权的转移而转移","从物必须依附于主物而存在","从物与主物的所有权人是同一人"],"a":"D","e":"主物与从物是根据两个独立存在的物在法律效力中的主从关系进行的划分。只有属于同一个所有人\n的两个独立存在的、要互相结合才能发生效用的物,才构成主物与从物的关系。如果是不同所有人的物,不产生主\n物和从物的关系。区分主物和从物的法律意义在于,如果法律或者合同没有相反规定时,从物的所有权随主物的所\n有权一并转移。据此,选项D 应选。 \n八、多项选择题","k":"物权通则与物权变动"},{"id":"2005-55","y":2005,"t":"多","s":"物权法的基本原则包括(       )","o":["物权法定","一物一权","物权行为独立性和无因性","物权公示、公信 九、简答题:56、57 小题,每小题 6 分"],"a":"ABD","e":"选项C 并非物权法的基本原则。 \n九、简答题","k":"物权通则与物权变动"},{"id":"2006-31","y":2006,"t":"单","s":"担保物权人在其全部债权受清偿前,可以就担保物的全部行使权利,这体现的是担保物权法律属性中的(   )","o":["变价受偿性","物上代位性","不可分性","从属性"],"a":"C","e":"担保物权不可分性是指债权人在全部债权受偿前,可就担保物的全部行使其权利。而题中的变价受偿\n性与物上代位性和题意明显不符;而从属性主要强调与债权的关系,担保物权与债权转移而转移,所以选C。","k":"物权通则与物权变动"},{"id":"2006-44","y":2006,"t":"单","s":"根据我国担保法规定,担保物权包括(   )","o":["抵押权、质权和典权","抵押权、质权和留置权","抵押权、质权、典权和留置权","抵押权、典权和留置权"],"a":"B","e":"典权属用益物权","k":"物权通则与物权变动"},{"id":"2007-53","y":2007,"t":"多","s":"下列权利中,属于用益物权的有 (       ) 。","o":["地上权","地役权","典权","土地承包经营权"],"a":"ABCD","e":"用益物权 \n]用益物权是指以物的使用收益为目的的物权,包括地上权、地役权、土地使用权等。 \n因此,答案为 A、B、C、D。","k":"物权通则与物权变动"},{"id":"2008-39","y":2008,"t":"单","s":"下列对所有权关系的判断,错误的是(  )","o":["所有权关系属于物权关系","所有权关系属于绝对法律关系","所有权关系的客体包括物与行为","所有权关系的权利主体是待定的,义务主体是不特定的"],"a":"C","e":"所有权法律关系的客体是物,不包括行为,故选项C 错误。","k":"物权通则与物权变动"},{"id":"2008-40","y":2008,"t":"单","s":"下列情形中,属于所有权继受取得方式的是(  )","o":["以所有的意思占有无主财产","拾得他人遗失物","获取自有财产的孳息","依照遗嘱取得遗产"],"a":"D","e":"所有权的取得方式包括原始取得和继受取得。在继受取得中,原所有人的所有权基于一定的法律事实\n转归于新的所有人,即所有权发生转移;在原如取得中,新所有人的所有权并非从旧所有人处获得。选项A、B、C\n- 9 -\n\n \n \n更多考研精品资料,关注淘宝店铺:光速考研工作室 \n属于原始取得,而选项D 属于继受取得。","k":"物权通则与物权变动"},{"id":"2008-52","y":2008,"t":"多","s":"下列有关于益物权的判断,正确的有(     )。","o":["用益物权属于定限物权","用益物权属于他物权","用益物权具有物上代位性","用益物权以支配物的使用价值为内容"],"a":"ABD","e":"用益物权是对他人所有的物,在一定范围内进行使用、收益的他物权;用益物权是一种定限物权,\n只具有在一定方面支配标的物的权利,没有对标的物的完全的支配权,故选项A、B、D 正确。物上代位性,是担保\n物权的属性,而非用益物权的属性,故选项C 不应选。","k":"物权通则与物权变动"},{"id":"2009-37","y":2009,"t":"单","s":"根据物权客体的种类,物权可分为(    )。","o":["完全物权与限定物权","主物权与从物权","动产物权与不动产物权","用益物权与担保物权"],"a":"C","e":"本题考查物权的分类。根据物权支配力的范围,物权可分为完全物权与限定物权。A 选项错误。\n根据物权是否能够独立存在,物权可分为主物权和从物权。B 选项错误。根据物权的标的物性质,物权可分为动产\n权和不动产权。C 选项正确。根据设立目的,物权可分为用益物权和担保物权。D 选项错误。因此本题答案为C","k":"物权通则与物权变动"},{"id":"2009-40","y":2009,"t":"单","s":"2007 年 5 月 10 日,甲用自己的一台汽车作抵押,向朋友乙借款 7 万元,并进行了抵押登记。6 月 1 日, 甲又将该 汽车抵押给银行,从银行借款 8 万元,也进行了抵押登记。现两笔债务均过履行期,甲均未清偿。乙和 银行对甲的汽车都主 张优先受偿权。经拍卖,该汽车卖得 13 万元。根据物权法规定,对此款项的受偿应该是(   )。","o":["乙优先受偿","银行优先受偿","乙与银行按比例受偿","乙与银行平均受偿"],"a":"A","e":"本题考查抵押权的清偿顺序。根据《物权法》第199 条规定,同一财产向两个以上债权人抵押的,\n拍卖、变卖抵押财产所得的价款依照下列规定清偿:抵押权已登记的,按照等级的先后顺序清偿;抵押权已登记的\n先于未登记的受偿;抵押权未登记的按照债权比例清偿。本题中,乙和银行的抵押权都进行了登记,且以的登记先\n于银行,乙优先受偿。因此本题的答案为A","k":"物权通则与物权变动"},{"id":"2011-21","y":2011,"t":"单","s":"下列选项中,不属于民法上的物的是( )。","o":["金银制品","空气","货币","枪支"],"a":"B","e":"作为民事法律关系的客体之一的物,必\n须具有四个特征:(1)应得到法律上的认可。(2) 应\n为人类所认识和控制。(3)能够给人们带来某种物\n质利益,具有经济价值。(4)须具有独立性。空气属\n于人类不能控制之物,故不属于民法上的物,答案\n选B。","k":"物权通则与物权变动"},{"id":"2011-47","y":2011,"t":"多","s":"下列选项中,物权变动的情形包括()。","o":["政府征收了甲村的土地","乙将自己的彩电赠与了好友","丙在其宅基地上建造了房屋","法院判决所有权有争议的汽车属于丁 )"],"a":"ABCD","e":"物权变动,指物权的设立、变更和终止\n的运动状态。物权变动的原因主要包括法律行为、法\n律行为之外的法律事实和公法上的原因。本题中,A\n选项属于基于公法上的原因,即政府征收行为,使得\n甲村丧失了村土地的所有权。B选项属于基于法律\n行为,即赠与,使乙对彩电的所有权消灭,而其好友取\n得了彩电的所有权。C选项中,丙基于法律行为以外\n的法律事实,即建造房屋的行为,取得了房屋的所有\n权。D选项中,丁基于公法行为,即法院对所有权争\n议财产的判决获得了汽车的所有权。故答案选\nABCD。","k":"物权通则与物权变动"},{"id":"2012-21","y":2012,"t":"单","s":"下列各组财产中,构成主物与从物关系的是 )。","o":["赵某的房屋和房门","李某的手表和孙某的表带","钱某的电视机和遥控器","周某的汽车和车轮"],"a":"C","e":"主物是能单独存在的物,不以其他物的\n存在为前提条件。从物依附于主物。但是主物与从\n物必须在物理上是可分的,而且必须属于同一个所有\n人。A 中房屋和房门不可分,B 中手表和表带不属于\n同一个所有人。D 中车轮可以单独存在。故选C。","k":"物权通则与物权变动"},{"id":"2012-27","y":2012,"t":"单","s":"根据物权法的规定,土地承包经营权的设立 时间是( )。","o":["土地承包经营权合同成立时","土地承包经营权合同生效时","土地承包经营权登记时","取得土地承包经营权证时"],"a":"B","e":"土地承包经营权自土地承包经营权合\n同生效时设立。故选B。","k":"物权通则与物权变动"},{"id":"2012-28","y":2012,"t":"单","s":"冯某将其所有的大卡车送至通达汽车修理厂 修理。因冯某未依约定支付修理费,修理厂遂依法将 该车留置,但未与冯某约定留置汽车后支付修理费的 期间。根据物权法的规定,修理厂在实现其留置权前 应当给冯某支付修理费的期间为( )。","o":["1个月以上","2个月以上","3个月以上","6个月以上"],"a":"B","e":"根据《物权法》的规定,留置权人与债\n务人应当约定留置财产后的债务履行期间;没有约定\n或者约定不明确的,留置权人应当给债务人两个月以\n上履行债务的期间,但鲜活易腐等不易保管的动产除\n外。故选B。债务人逾期未履行的,留置权人可以与\n债务人协议以留置财产折价,也可以就拍卖、变卖留\n置财产所得的价款优先受偿。\n[特别说明]\n《民法典》对本条进行了修改,《民\n法典》第453条规定:\"留置权人与债务人应当约定留\n置财产后的债务履行期限;没有约定或者约定不明确\n的,留置权人应当给债务人六十日以上履行债务的期\n限,但是鲜活易腐等不易保管的动产除外。债务人逾\n期未履行的,留置权人可以与债务人协议以留置财产\n折价,也可以就拍卖、变卖留置财产所得的价款优先\n受偿。\n\"由于本题明确要求\n\"根据《物权法》的规定\n\" ,\n因此本书不对答案进行修改。但是考生要清楚《民法\n典》的最新规定,根据《民法典》的规定,应当给债务\n人六十日以上履行债务的期限。","k":"物权通则与物权变动"},{"id":"2012-48","y":2012,"t":"多","s":"我国《物权法》规定的动产交付方式包括","o":["指示交付","现实交付","简易交付","占有改定"],"a":"ABCD","e":"根据《民法典》规定,动产物权的设立\n和转让,自交付时发生效力,但法律另有规定的除外。\n我国动产物权的交付方式包括现实交付、简易交付、\n指示交付、占有改定。因此ABCD都正确,全选。","k":"物权通则与物权变动"},{"id":"2013-29","y":2013,"t":"单","s":"甲以房屋作抵押向乙借款,并办理了抵押登 记。后甲未按期归还借款,且未与乙就如何实现抵押 权达成协议。根据我国物权法规定()。","o":["乙有权直接取得房屋的所有权","乙有权直接变卖房屋以实现抵押权","乙只能委托拍卖公司拍卖房屋以实现抵押权","乙可以请求人民法院拍卖、变卖房屋以实现 抵押权"],"a":"D","e":"本题考查的是抵押权的实现。抵押权\n的实现,是抵押权人在债务人不履行到期债务或者发\n生当事人约定的实现抵押权的情形时,得以处分抵押\n财产,并就其价值优先受偿。实现抵押权应该具有以\n下条件:(1) 与抵押人协议以抵押物折价,取得抵押\n物的所有权,但此协议不能损害其他债权人的利益。\n(2) 抵押权人与抵押人未就抵押权实现方式达成协\n议的,抵押权人可以请求人民法院拍卖、变卖抵押财\n产。因此,答案应选择D。","k":"物权通则与物权变动"},{"id":"2013-30","y":2013,"t":"单","s":"甲将自行车交乙保管,不久乙去世。乙之子 丙误将该自行车当成遗产继承,后在使用过程中致自 行车损坏。根据有关规定()。","o":["丙系恶意占有人","丙应当返还自行车给甲","丙应当向甲承担违约责任","丙应当赔偿甲的损失"],"a":"B","e":"本题中丙虽将自行车予以继承,但因为\n乙并不享有自行车的所有权,所以自行车不能作为乙\n的遗产,丙的继承是无效的,甲可以行使返还原物请\n求权,要求丙返还自行车。但由于丙不知道自行车非\n乙所有而继承,不构成恶意占有,因此排除A。丙取\n得自行车是不当得利,甲可以要求丙返还现存利益,\n但不能要求丙承担违约责任。丙是善意占有,也不应\n当赔偿甲的损失。因此B项正确,CD项错误。","k":"物权通则与物权变动"},{"id":"2014-39","y":2014,"t":"单","s":"下列选项中,属于法定物权的是()。","o":["留置权","地役权","权利质权","宅基地使用权"],"a":"A","e":"本题考查的是留置权的特征。根据我\n国《民法典》的规定,留置权属于法定担保物权。因此\n应该选择A。","k":"物权通则与物权变动"},{"id":"2014-40","y":2014,"t":"单","s":"甲将自己的摄像机交给乙保管,丙从乙处盗 走该摄像机并卖给了不知情的丁。下列主体中,对该 摄像机的占有属于他主占有的是()。","o":["甲","乙","丙","丁"],"a":"B","e":"所谓占有,是指对物具有事实上管领力\n的一种状态。依据占有人是否具有所有的意思,可分\n为自主占有和他主占有。本题中,甲作为所有权人,\n对相机的占有是自主占有;丙偷盗了相机也是以自己\n所有的目的对其进行占有;丁在不知情的情况下购得\n相机,亦是自主占有。只有乙,因为是为甲保管相机,\n所以并非以自己所有的意思而进行占有,故而是他主\n占有,应该选择B 选项。\n二、多项选择题","k":"物权通则与物权变动"},{"id":"2014-48","y":2014,"t":"多","s":"在当事人没有约定时,能够取得原物的天然 孳息所有权的有()。","o":["所有权人","留置权人","土地承包经营权人","动产抵押权人"],"a":"AC","e":"l\n根据法律规定,担保物权实现时,权利\n人并非直接取得孽息所有权。因此BD选项错误e 而\n\n所有权人和用益物权人自然取得孽息。《民法典》第\n321 条规定:\"天然孽息,由所有权人取得;既有所有\n权人又有用益物权人的,由用益物权人取得。当事人\n另有约定的,按照其约定。法定孽息,当事人有约定\n的,按照约定取得;没有约定或者约定不明确的,按照\n交易习惯取得。\"","k":"物权通则与物权变动"},{"id":"2015-30","y":2015,"t":"单","s":"甲下班时误将同事的同款电脑当成自己的电 脑带回家。甲对该电脑的占有属于()。","o":["有权占有","间接占有","善意占有","他主占有"],"a":"C","e":"本题考查的是对占有的理解。占有分\n为无权占有和有权占有。根据占有人的主观心理状\n态,无权占有又可分为善意占有与恶意占有。善意占\n有是指占有人不知道且不应当知道自己的占有没有\n合法根据而占有;恶意占有是指占有人知道或者应当\n知道自己没有合法根据而占有。甲不知道且不应当\n知道自己的占有没有合法根据而占有,因此,甲对该\n电脑的占有属于善意占有,C选项正确。甲占有同事\n\n的电脑没有法律或者合同的依据,不是有权占有,A\n选项错误。甲是直接占有同事的电脑,不是间接占\n有,B选项错误。甲以为电脑是自己的,以自己所有\n的心理占有,是自主占有,不是他主占有,D选项\n错误。","k":"物权通则与物权变动"},{"id":"2015-47","y":2015,"t":"多","s":"甲、乙系对门邻居,同时装修房屋。某日,在甲 家装修的丙公司工人丁误将乙堆放在公共过道上的瓷砖 当成甲所有,贴到甲家厨房墙壁。乙可以要求()。","o":["甲返还原物","甲返还不当得利","丙公司赔偿损失","丙公司与丁承担连带责任."],"a":"BC","e":"所谓不当得利,是指没有合法根据取得\n利益而使他人财产受损的事实。不当得利一经成立,\n当事人之间形成债的关系,受有损失的一方享有请求\n返还其利益的权利,取得利益的一方负有返还利益的\n义务。用人单位责任是指用人单位的工作人员因执\n行工作任务造成他人损害的,由用人单位承担的侵权\n责任。本题中,工人丁误将乙堆放在公共过道上的瓷\n砖当成甲所有,贴到甲家厨房墙壁。因此甲构成不当\n得利,丙公司工人丁构成侵权,据此乙可以要求甲返\n还不当得利,也可以要求丙公司赔偿损失,BC选项正\n确。原物已经贴到墙壁上,不能原物返还,A 选项错\n误。丁是执行工作任务时造成他人损失,由用人单位\n丙公司承担责任,丁不承担责任,D 选项错误。","k":"物权通则与物权变动"},{"id":"2016-32","y":2016,"t":"单","s":"甲向乙借款5万元,以自己的汽车作抵押并 办理了抵押登记。抵押期间,丙向甲表示愿意购买该 车。根据我国《物权法》,下列选项正确的是()。","o":["甲通知乙后即有权转让该车","甲告知丙后即有权转让该车","甲征得乙同意后有权转让该车","甲在任何情况下均无权转让该车"],"a":"C","e":"《物权法》第191条第1款规定:\"抵押\n期间,抵押人经抵押权人同意转让抵押财产的,应当\n将转让所得的价款向抵押权人提前清偿债务或者提\n存。转让的价款超过债权数额的部分归抵押人所有,\n不足部分由债务人清偿。抵押期间,抵押人未经抵押\n权人同意,不得转让抵押财产,但受让人代为清偿债\n务消灭抵押权的除外。\"\n本题中,甲已将汽车抵押给乙,在征得抵押权人\n同意后,抵押人可以转让抵押物。C正确。\n甲是抵押人,要转让抵押物必须经过乙同意,而\n不是通知乙,A不正确。甲必须将汽车已经抵押的事\n实告知丙,但不是告知丙之后即可以转移,还必须征\n得乙的同意,或者丙代为清偿债务消灭抵押权,B 不\n正确。甲在征得乙同意的情况下,可以转让汽车,而\n不是在任何情况下均无权转让,D不正确。\n[特别说明)\n《民法典》第406条规定:\"抵押期\n间,抵押人可以转让抵押财产。当事人另有约定的,\n按照其约定。抵押财产转让的,抵押权不受影响。抵\n押人转让抵押财产的,应当及时通知抵押权人。抵押\n权人能够证明抵押财产转让可能损害抵押权的,可以\n请求抵押人将转让所得的价款向抵押权人提前清偿\n债务或者提存。转让的价款超过债权数额的部分归\n抵押人所有,不足部分由债务人清偿。',《民法典》对\n抵押期间财产转让的规则进行修改,不再要求征得抵\n押权人同意,而是通知抵押权人即可。但由千本题题\n干明确要求\n\"根据我国《物权法》\n\",故本书不对答案\n进行修改。但考生要清楚,根据《民法典》的规定,c\n项不再正确。但A项亦不完全准确,甲不是通知乙后\n才有权转让该车,而是甲有权转让该车,转让后及时\n通知乙即可。","k":"物权通则与物权变动"},{"id":"2016-40","y":2016,"t":"单","s":"2014年8月1日,乙将甲诉至法院。此时()。","o":["预告登记有效,但丙取得房屋所有权","预告登记有效,丙不能取得房屋所有权","预告登记失效,丙取得房屋所有权","预告登记失效,但丙不能取得房屋所有权"],"a":"C","e":"《民法典》第221条规定:\"当事人签订\n买卖房屋的协议或者签订其他不动产物权的协议,为\n保障将来实现物权,按照约定可以向登记机构申请预\n告登记。预告登记后,未经预告登记的权利人同意,\n处分该不动产的,不发生物权效力。预告登记后,债\n权消灭或者自能够进行不动产登记之日起九十日内\n未申请登记的,预告登记失效。\"\n本题中,乙于3月12 日办理了预告登记,3月15\n日支付了全款,但是乙并没有在能够进行不动产登记\n之日起九十日内办理不动产登记,预告登记失效。房\n屋的所有权属于甲,甲将房屋卖给丙,并且办理了过\n户手续,丙依法取得房屋的所有权。C选项正确,A、\nB 、D选项错误。\n[特别说明]\n关于预告登记,所有与不动产有关\n的协议,都可以办理预告登记。预告登记意在阻止物\n权变动,而非否认协议效力。此外,司法解释进一步\n明确,未经预告登记的权利人同意转让不动产所有权\n等物权,或者设立建设用地使用权、居住权、地役权、\n抵押权等其他物权的,不发生物权效力(即未经预告\n登记权利人同意,任何与不动产有关的物权变动,都\n不发生效力)。预告登记的买卖不动产物权的协议被\n认定无效、被撤销或者预告登记的权利人放弃债权\n的,应当认定为债权消灭。\n二、多项选择题","k":"物权通则与物权变动"},{"id":"2016-48","y":2016,"t":"多","s":"下列选项中,可以认定为建筑物区分所有权 的业主的有()。","o":["基于租赁合同使用房屋的承租人","依法登记取得建筑物专有部分所有权的人","根据人民法院的生效判决取得建筑物专有部 分所有权的人","基于与建设单位之间的商品房买卖合同已合 法占有建筑物专有部分的人"],"a":"BCD","e":"根据司法解释的规定,依法登记取得或\n者根据公法原因、事实行为等取得建筑物专用部分所\n有权的人,应当认定为业主。基千与建设单位之间的\n商品房买卖民事法律行为,已经合法占有建筑物专有\n部分,但尚未依法办理所有权登记的人,可以认定为\n业主。\nB选项是依法登记取得建筑物专有部分所有权\n的人,是业主。C选项是根据法院判决取得建筑物专\n有部分所有权的人,是业主。D选项是基于与建设单\n位的商品房买卖合同且已合法占有建筑物专有部分\n的人,是业主。\nA选项是承租人,对千房屋只有使用权,没有所\n有权,不是业主。","k":"物权通则与物权变动"},{"id":"2017-30","y":2017,"t":"单","s":"甲经政府主管部门批准,在其宅基地上盖了 一栋楼房,未办理房屋登记手续。3年后甲死亡,其唯 一的继承人乙将房屋卖给同村的丙,并交付丙占有使 用。现该房屋的所有权人是()。","o":["国家","甲所在村集体","乙","丙"],"a":"C","e":"根据《民法典》的规定,因合法建造、拆\n除房屋等事实行为设立或者消灭物权的,自事实行为\n成就时发生效力。因继承取得物权的,自继承开始时\n发生效力。依照上述规定享有不动产物权的,处分该\n物权时,依照法律规定需要办理登记的,未经登记,不\n发生物权效力。","k":"物权通则与物权变动"},{"id":"2017-50","y":2017,"t":"多","s":"下列民事权益中,受我国侵权责任法保护的 有()。","o":["婚姻自主权","担保物权","股权","商业秘密 三、简答题:第51~54小题,每小题6分"],"a":"ABCD","e":"民事权益,包括生命权、健康权、姓名\n权名誉权、荣誉权、肖像权、隐私权、婚姻自主权、监\n护权、所有权、用益物权、担保物权、著作权、专利权、\n商标专用权、发现权、股权、继承权等人身、财产权益。\n商业秘密属千广义的知识产权范畴,侵犯商业秘密的\n行为,也需要承担损害赔偿的责任。因此本题ABCD\n全选。\n三、简答题","k":"物权通则与物权变动"},{"id":"2018-22","y":2018,"t":"单","s":"甲将一部相机借给乙,乙擅自将相机卖给不 知情的丙,丙又将相机卖给不知情的丁井交付。对 此,下列说法正确的是( )。","o":["丁根据善意取得取得相机的所有权","丁基于丙的交付取得相机的所有权","丁在甲追认后方可取得相机的所有权","丁在付清全部款项后方可取得相机的所有权"],"a":"B","e":"善意取得是指无权处分人在不法将其\n占有的他人动产或者错误登记在其名下的他人不动\n产让与第三人或者为第三人设定他物权时,如果受让\n人在取得该动产或者不动产的物权时系出于善意且\n符合其他条件,即取得该动产或者不动产的所有权或\n者他物权的制度。本题中,乙是无权处分人,其擅自\n将相机卖给不知情的丙,且已完成交付,丙是善意第\n三人,基于善意取得能够取得相机的所有权,之后丙\n把相机卖给丁,属千有权处分,不存在善意取得的问\n题。丁是基于丙的交付取得了相机的所有权。B项\n正确。","k":"物权通则与物权变动"},{"id":"2018-34","y":2018,"t":"单","s":"甲将汽车以15 万元的价格卖给乙并交付,后 甲从乙处借回该车,并以 16 万元的价格卖给不知情 的丙,同时办理了登记手续,但车仍由甲占有。乙得 知后,要求甲、丙返还汽车、赔偿损失。对此,下列选 项正确的是( )。","o":["汽车归丙所有,乙的损失由甲赔偿","汽车归丙所有,乙的损失由甲、丙连带赔偿","汽车归乙所有,乙有权要求甲返还汽车、赔偿 损失","汽车归乙所有,乙有权要求丙返还汽车、赔偿 损失"],"a":"C","e":"本题中,甲将汽车卖给乙,且完成交付,\n乙取得汽车的所有权。后甲再将汽车卖给丙,是无权\n处分行为。虽然丙是善意的,但是甲没有将汽车交付\n给丙,丙无法通过善意取得取得汽车的所有权。所以\n汽车的所有权依然属于乙。乙有权要求甲返还汽车、\n赔偿损失。C项正确。","k":"物权通则与物权变动"},{"id":"2018-47","y":2018,"t":"多","s":"下列选项中,无需登记即可发生物权变动的 有()。","o":["甲公司将其股权出质给银行","乙公司将其轮船的所有权转让给高某","丙公司通过拍卖取得建设用地使用权","丁衣户将土地承包经营权转让给钱某"],"a":"BD","e":"《民法典》第443条第1款规定:\"以基\n金份额、股权出质的,质权自办理出质登记时设立。\"\n因此股权出质须办理登记才能设立,A项错误。《民\n法典》第225条规定:\"船舶、航空器和机动车等的物\n权的设立、变更、转让和消灭,未经登记,不得对抗善\n意第三人。\"因此轮船的所有权转让,无须登记即可发\n生物权变动的效果,但是不能对抗善意第三人。B项\n正确。《民法典》第349条规定:\"设立建设用地使用\n权的,应当向登记机构申请建设用地使用权登记。建\n设用地使用权自登记时设立。登记机构应当向建设\n用地使用权人发放权属证书。\"因此C项需要经过登\n记才能取得建设用地使用权,C项错误。《民法典》第\n335条规定:\n\"土地承包经营权互换、转让的,当事人\n可以向登记机构申请登记;未经登记,不得对抗善意\n第三人。\"因此土地承包经营权转让的,不需要登记即\n发生物权变动的效果,但是不能对抗第三人。D项\n正确。","k":"物权通则与物权变动"},{"id":"2018-50","y":2018,"t":"多","s":"甲将拾得的手表赠与不知情的乙,乙对该手 表的占有属于( )。","o":["有权占有","善意占有","直接占有","自主占有 三、简答题:第51 ~ 54 小题,每小题10 分"],"a":"BCD","e":"依占有人是否直接占有物,可以将占有\n分为直接占有与间接占有。直接占有即直接对物加\n以管领之占有,本题中,乙对手表的占有是直接加以\n管领,是直接占有,C项正确。依占有人的占有是否\n具有本权为标准,占有可以分为有权占有和无权占\n有。本题中,手表是甲拾得的,甲应当将手表归还失\n主,无权对手表进行处分,甲是将手表赠与乙,而不是\n以合理的价格转让给乙,所以乙不能基于善意取得制\n度取得手表的所有权,因此乙对手表的占有不是有权\n占有,A项错误。但是乙不知道手表是拾得的,所以\n是善意占有,B项正确。乙以为手表是甲合法赠与自\n己的,乙的占有具有所有的意思,因此是自主占有,D\n项正确。本题应选BCD。\n三、简答题","k":"物权通则与物权变动"},{"id":"2020-29","y":2020,"t":"单","s":"甲将自己的房屋赠与好友乙,已交付但未办 理过户登记。一年后,甲因急需资金,将该房卖给丙 并办理了过户登记,同时约定在丙付清全款前,甲保 留房屋所有权。对此,下列选项正确的是()。","o":["甲仍享有房屋所有权","乙继受取得房屋所有权","丙善意取得房屋所
