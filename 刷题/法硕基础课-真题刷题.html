有独占的使用权,任何人不得干涉和非法\n使用。本题中,甲未经授权,擅自以乙公司的名义对\n外签订合同,侵犯了乙公司的名称权,D项正确。姓\n名权是自然人专属的权利,法人不享有姓名权,因此\n乙公司不享有姓名权,甲的行为不侵犯乙公司的姓名\n权,A项错误。甲并没有侵犯乙公司的名誉权,名誉\n权的本质在于权利人要求他人对其进行客观公正的\n评价,有权排除他人对其名誉权的侵害。甲没有恶意\n贬损乙公司或以其他方式损害乙公司名誉,甲并没有\n侵犯乙公司的名誉权,C项错误。甲没有擅自使用或\n冒充乙公司的商标,没有侵犯乙公司的商标权,B 项\n错误。","k":"代理"},{"id":"2021-22","y":2021,"t":"单","s":"甲借用乙的平房居住。后平房漏雨,甲联系 不到乙,遂委托丙维修并依承诺向丙支付维修费。甲 请求乙偿还维修费的依据是()","o":["代理行为","委托合同","无因管理","单方允诺"],"a":"C","e":"无因管理是指没有法定的或者约定的\n义务,为避免他人利益受损失而进行管理或者服务的\n行为。本题中,甲没有为乙修补房屋的义务,甲为避\n免乙利益受损而委托丙进行维修,甲的行为是无因管\n理。无因管理一经成立,当事人之间形成债的关系,\n管理人可以请求受益人偿还因管理事务而支出的必\n要费用。因此,甲有权请求乙偿还维修费用,C项\n正确。","k":"代理"},{"id":"2024-29","y":2024,"t":"单","s":"甲伪造A公司公章,以A公司名义与不知情的B公司签订产品推广合同。关于该合 同,下列说法正确的是()","o":["A公司追认前,B公司有权通知A公司撤销合同","A公司追认后,B公司有权通知A公司解除合同","无论A公司是否追认,B公司均有权请求甲履行合同","无论A公司是否追认,B公司均有权请求法院撤销合同"],"a":"A","e":"","k":"代理"}]},{"sub":"民法","name":"继承","w":0.7,"L":12,"qs":[{"id":"2005-37","y":2005,"t":"单","s":"根据我国《继承法》的规定,放弃继承与放弃受遗赠可采取的行为方式是(   )","o":["放弃继承既可采明示方式,也可采默示方式,放弃受遗赠亦如此","放弃继承只能采明示方式,放弃受遗赠亦如此","放弃继承只能采明示方式,放弃受遗赠则既可采明示方式,也可采默示方式","放弃继承只能采明示方式,也可采默示方式,放弃受遗赠则既可采明示方式"],"a":"C","e":"《继承法》第25 条规定:\"继承开始后,继承人放弃继承的,应当在遗产处理前,作出放弃继\n承的表示。没有表示的,视为接受继承。\"\"受遗赠人应当在知道受遗赠后两个月内,作出接受或者放弃受遗赠的\n表示。到期没有表示的,视为放弃受遗赠。\"据此,放弃继承,必须采用明示方式;不可以采默示方式,如果没有\n表示的,视为接受继承。放弃受遗赠,既可采明示方式,也可采默示方式。因此,选项C 应选。","k":"继承"},{"id":"2006-50","y":2006,"t":"单","s":"依据我国继承法规定,不必有两个以上见证人在场见证的遗嘱是(   )","o":["自书遗嘱","口头遗嘱","代书遗嘱","录音遗嘱"],"a":"A","e":"《继承法》规定,口头遗嘱、代书遗嘱、录音遗嘱成立的形式条件是有两个以上见证人在场见证,而\n自书遗嘱无此要求。故选A。 \n八、多项选择题","k":"继承"},{"id":"2008-37","y":2008,"t":"单","s":"下列行为中,属于事实行为的是(  )","o":["签订合同","承认债务","创作作品","设立遗嘱"],"a":"C","e":"民事事实行为与民事法律行为相对,是指行为主观上不一定具有发生、变更或者消灭正常民事法律关\n系的意思,但客观上能够引起这种后果的行为,比如因创作而发生的著作权关系,故本题应选C。选项A、D 属于民\n事法律行为,而选项B 属于准民事法律行为。","k":"继承"},{"id":"2008-55","y":2008,"t":"多","s":"根据继承法规定,继承人所为的下列行为中,可导致其丧失继承权的有(     )。","o":["故意杀害被继承人","伪造遗嘱情节严重","遗弃被继承人","虐待被继承人情节严重 九、简答题(56、57 小题,每小题 6 分"],"a":"ABCD","e":"根据《继承法》第7 条,继承人有下列行为之一的,丧失继承权:(1)故意杀害被继承人的;(2)\n为争夺遗产而杀害其他继承人的;(3)遗弃被继承人的,或者虐待被继承人情节严重的;(4)伪造、篡改或者销\n毁遗嘱,情节严重的。故选项A、B、C、D 都应选。 \n九、简答题","k":"继承"},{"id":"2009-47","y":2009,"t":"单","s":"甲立有遗嘱,其内容为自己死后遗产全部由独生子乙继承。在一次车祸中甲乙同时遇难,甲当场死亡,乙在送 往 医院的途中死亡。乙的儿子丙依甲的遗嘱继承了甲的全部遗产。丙继承甲遗产的方式是(   )。","o":["代位继承","转继承","第一顺序法定继承","第二顺序法定继承"],"a":"B","e":"本题考查转继承。代位继承是指在被继承人的子女先于被继承人死亡的情况下。由被继承人的晚辈\n直系血亲代替该先死亡的子女继承被继承人遗产的法律制度。转继承是指被继承人死亡后,遗产分割前,未放弃继\n承的继承人也死亡的,其应得的遗产份额转由他的继承人继承人继承的法律制度。本题中,被继承人甲先死亡,在\n遗产分割前,继承人以也死亡,乙应得的份额有其丙继承,符合转继承的法律特征。因此本题答案为B","k":"继承"},{"id":"2013-27","y":2013,"t":"单","s":"在婚姻关系存续期间所得的下列财产,归夫 或妻一方所有的是()。","o":["参加体育比赛所获奖金","因身体受到伤害获得的医疗费","通过法定继承分得的遗产","以婚前个人存款炒股所得的收益"],"a":"B","e":"根据《民法典》第1062 条的规定,夫妻\n在婚姻关系存续期间所得的下列财产,为夫妻的共同\n财产,归夫妻共同所有:(1) 工资、奖金、劳务报酬;\n(2) 生产、经营、投资的收益;(3) 知识产权的收益;\n(4) 继承或者受赠的财产,但是本法第一千零六十三\n条第三项规定的除外;(5) 其他应当归共同所有的财\n产。而在实行夫妻共同财产制的情况下,夫妻依法各\n自保留一定范围内的财产为个人所有,包括:(l )\n方的婚前财产;(2)一方因受到人身损害获得的赔偿\n或者补偿;(3) 遗嘱或者赠与合同中确定只归一方的\n财产;(4) 一方专用的生活用品;(5)其他应当归一\n方的财产。因此答案应选B。\n考生应当注意:(1) 关于夫妻共同债务。夫妻一\n方与第三人串通,虚构债务,第三人主张该债务为夫\n妻共同侦务的,人民法院不予支持。夫妻一方在从事\n赌博、吸毒等违法犯罪活动中所负债务,第三人主张\n该债务为夫妻共同债务的,人民法院不予支持。\n(2)另外,司法解释明确规定,知识产权的收益是指\n婚姻关系存续期间,实际取得或者已经明确可以取得\n的财产性收益。(3)按照司法解释规定,由夫妻一方\n婚前承租、婚后用共同财产购买的房屋,即使登记在\n一方名下,也应当认定为夫妻共同财产。","k":"继承"},{"id":"2014-37","y":2014,"t":"单","s":"2013年3月28日,毕某病逝。3月31日,子 女将其安葬。4月2日,毕某的子女一起清理毕某的 遗产并确定继承份额。4月5日,遗产分割完毕。遗 产继承开始的时间是( ()。","o":["3月28日","3月31日","4月2日","4月5日"],"a":"A","e":"本题考查的是继承的开始。根据《民\n法典》规定,继承从被继承人死亡时开始。死亡包括\n生理死亡和宣告死亡。司法解释进一步明确,如果被\n继承人是被宣告死亡,由人民法院宣告死亡的判决作\n出之日视为继承开始的时间,因意外事件下落不明被\n宣告死亡的,意外事件发生之日为继承开始的时间。\n因此3月28日毕某病逝时,继承开始。应该选A。","k":"继承"},{"id":"2016-37","y":2016,"t":"单","s":"甲立有遗嘱,将其两幅字画留给好友乙。甲 死后次日,乙表示接受遗赠。后乙在遗产分割前死 亡。对此,下列表述正确的是()。","o":["该遗赠失效","两幅字画由乙的继承人继承","该遗赠不生效","两幅字画由乙的晚辈直系血亲继承"],"a":"B","e":"遗赠是指自然人以遗嘱的方式将其个\n人财产赠与国家、集体或者法定继承人以外的组织、\n个人,并于其死后生效的民事法律行为。按照《民法\n典》第1124条第2款的规定,受遗赠人应当在知道受\n遗赠后六十日内,作出接受或者放弃受遗赠的表示。\n到期没有表示的,视为放弃受遗赠。继承开始后,受\n遗赠人表示接受遗赠并于遗产分割前死亡的,其接受\n遗赠的权利转移给他的继承人。本题中,乙在甲死后\n次日,表示接受遗赠,此时乙通过遗赠取得两幅字画\n的所有权。虽然遗产还未分割,但是不影响字画所有\n权的转移,两幅字画的所有权已经转移给乙。后乙死\n亡,两幅字画由乙的继承人继承,B选项正确。\n遗赠在立遗嘱人死亡后即生效,只是如果遗赠人\n不接受遗赠,对遗产的分割不适用遗赠,但是遗赠本\n身并不失效,也不会不生效,AC选项错误。代位继承\n只发生在法定继承中,乙不是甲的法定继承人,也没\n有先于甲死亡,不发生代位继承,对千两幅字画,应由\n乙的继承人继承,而不是由其晚辈直系血亲继承,D\n选项错误。","k":"继承"},{"id":"2018-48","y":2018,"t":"多","s":"志愿者甲经常照顾孤寡老人乙。 2015 年3 月 20 日,乙病故,遗嘱执行人丙告诉甲,乙遗赠给甲3 万 元和一套古籍。 5 月 15 日,甲明确表示拒绝接受古籍。 5 月 18 日,甲联系丙,表示撤销此前拒绝接受古籍的行 为。 5 月28 日,甲请求丙执行遗嘱,丙( )。","o":["应将3 万元交付给甲","应将古籍交付给甲","无需向甲交付3 万元","无需向甲交付古籍"],"a":"CD","e":"《民法典》第1124条第2 款规定:\"受\n遗赠人应当在知道受遗赠后六士日内,作出接受或者\n放弃受遗赠的表示。到期没有表示的,视为放弃受遗\n赠。\"甲作为受遗赠人,应当在5月20日前作出接受\n或者放弃受遗赠的表示。甲在5月15日表示拒绝接\n受古籍,也就是放弃了遗赠中的古籍。其没有表示接\n受3万元,视为放弃接受遗赠中的3万元。因此,丙\n无需向甲交付3万元,也无须交付古籍。CD项正确。","k":"继承"},{"id":"2021-29","y":2021,"t":"单","s":"20 10年甲立自书遗嘱一份,表示自己的房屋 由儿子乙继承,屋内的紫檀家具由孙子丙继承。2018 年甲将该房屋卖给任某,得款120万元,并办理了过 户登记手续。后甲病故。对此,下列表述正确的是 ( )","o":["乙有权基于遗嘱继承取得卖房款1 20万元","丙有权基千遗赠取得紫檀家具","甲所立自书遗嘱的内容全部被撤回","甲立遗嘱后不得出卖遗嘱处分的财产"],"a":"B","e":"《民法典》第1142条规定:\"遗嘱人可\n以撤回、变更自己所立的遗嘱。立遗嘱后,遗嘱人实\n施与遗嘱内容相反的民事法律行为的,视为对遗嘱相\n关内容的撤回。立有数份遗嘱,内容相抵触的,以最\n后的遗嘱为准。\"D项错误。\n本题中,甲订立遗嘱后,\n又将房屋出卖,视为对遗嘱相关内容的撤回,但不是\n对所有遗嘱的撤回,丙有权基于遗赠取得紫檀家具,B\n项正确,C项错误。有关房屋的遗嘱已经被撤回,乙\n不能根据遗嘱继承取得房款,A项错误。本题选B。","k":"继承"},{"id":"2021-36","y":2021,"t":"单","s":"甲、乙系夫妻,育有一子丙。甲的父亲去世 后,甲的母亲李某与甲的弟弟丁一起生活。1990年起 李某为照看丙,开始与甲一家共同生活。2010年甲因 病去世,李某伤心过度而中风,乙一直照顾李某。 2018年李某去世,留下存款6万元。该6万元( )","o":["只能由丙、丁继承","应当由乙、丙、丁继承","全部由丁继承","只能由乙、丙继承"],"a":"B","e":"丁是李某的儿子,是第一顺序继承人。\n甲先于李某去世,甲的儿子丙代替甲继承李某的遗\n产。甲去世后,乙一直照顾李某。根据法律规定,丧\n偶儿媳对公婆,丧偶女婿对岳父母,尽了主要赡养义\n务的,作为第一顺序继承人。因此本题选B。","k":"继承"},{"id":"2025-47","y":2025,"t":"多","s":"颜某去世时留下一套价值40 万元的房屋和20 万元存款。颜某遗产的第一顺序法定继 承人为甲、乙、丙、丁。颜某生前立有遗嘱,指定存款由甲、乙、丙平分,但未对房屋作出处 分。后乙表示放弃对房屋的继承。颜某生前欠李某9 万元借款。下列人员中,应当在自己继承 的遗产价值内偿还该笔债务的有( )","o":["甲","乙","丙","丁"],"a":"ACD","e":"根据法律规定,继承人以所得遗产实际价值为限清偿被继承人依法应当缴纳的税\n款和债务。颜某的遗产包括价值40 万元的房屋和20 万元存款。颜某遗嘱指定存款由甲、乙、\n丙平分。遗嘱中未处分的房屋依照法定继承由第一顺序法定继承人甲、乙、丙、丁继承,但乙\n表示放弃对房屋的继承,即乙未继承房屋。根据法律规定,既有法定继承又有遗嘱继承、遗赠\n的,由法定继承人清偿被继承人依法应当缴纳的税款和债务。法定继承的房屋价值40 万元,\n已经足够偿还李某9 万元的债务,因为依据法定继承继承房屋的甲、丙、丁应当在自己继承的\n遗产范围内偿还该笔债务。本题选ACD。","k":"继承"}]},{"sub":"民法","name":"用益物权","w":0.7,"L":11,"qs":[{"id":"2005-54","y":2005,"t":"多","s":"依据我国《继承法》的规定,遗产的范围包括(       )","o":["林木","文物","著作权","宅基地使用权"],"a":"AB","e":"《继承法》第3 条规定:\"遗产是公民死亡时遗留的个人合法财产,包括:......(三)公民的林\n木、牲畜和家禽;(四)公民的文物、图书资料;......(六)公民的著作权、专利权中的财产权利;......\"据此,\n选项A、B 正确。著作权中的人身权不属于遗产的范围,选项C 不应选。 \n宅基地使用权,是指公民因私有房屋而使用国家或集体所有的土地的权利。据此,宅基地使用权依附于私有房屋所\n有权。因此,宅基地使用权不能单独成为遗产的范围。私有房屋所有权因继承发生转移的,其占用的宅基地使用权\n也随之转移。","k":"用益物权"},{"id":"2009-52","y":2009,"t":"多","s":"建设用地使用权的取得方式有(      )","o":["出让","转让","划拨","先占"],"a":"ABC","e":"本题考查建筑用地使用权的取得方式。根据《物权法》第137 条规定,设立建设用地使用权,可\n以采取出让或者划拨等方式。第143 条建设用地使用权人有权将建设用地使用权转让、互换、出资、赠与或者抵押,\n当法律另有规定的除外。可见,将设用的使用权的取得方式包括出让、转让、划拨等,先占不是建设用地使用权的\n取得方式。因此本题的答案为ABC","k":"用益物权"},{"id":"2013-31","y":2013,"t":"单","s":"下列协议中,应由我国合同法调整的是(","o":["甲与乙签订的收养协议","甲与乙离婚时签订的子女抚养协议","甲行政机关与公务员签订的廉政协议","甲村委会与本村村民签订的土地承包经营权 协议"],"a":"D","e":"A选项的收养协议、B选项的离婚扶养\n协议是由我国的《民法典》进行调整,而C选项行政\n机构签订的廉政协议,则应该由相关的行政法规进行\n调整。故答案为D。","k":"用益物权"},{"id":"2013-34","y":2013,"t":"单","s":"根据我国《物权法》的规定,土地承包经营权 的取得时间是()。","o":["承包合同生效时","承包合同登记时","承包合同公证时","主管机关批准时"],"a":"A","e":"土地承包经营权的取得方式包括原始\n取得和继受取得两种。无论采取何种取得方式,发包\n方都应当与承包方签订书面承包合同。承包合同通\n常自成立之日起生效,承包方自承包合同生效时取得\n土地承包经营权。故答案选A。","k":"用益物权"},{"id":"2013-47","y":2013,"t":"多","s":"甲为自己房屋使用的便利与乙签订地役权合 同,约定五年内乙不得加盖楼房,甲支付5万元。合 同签订后,双方办理了登记手续。三年后甲去世,房 屋由丙继承。同年,乙将楼房卖给丁,随后丁加盖楼 房,遭丙阻止。在本案中()。","o":["丙无权制止丁加盖楼房","地役权由丙享有","地役权不因甲死亡而消灭","丁有权要求乙承担违约责任"],"a":"BC","e":"所谓地役权,是指不动产的权利人如所\n有权人或使用权人,为自己使用不动产的便利或者提\n高自己不动产的效益而使用他人不动产的权利。土\n地承包经营权、建设用地使用权转让的,除了合同有\n约定的,地役权一并转让。建设用地使用权发生继承\n的,由该继承使用人继续享有或者负担已经设立的地\n役权。本题中,丙继承了房屋也就继承了甲设立的地\n役权,已经设立的地役权不因为设立者的死亡而消\n灭,故BC项正确。既然丙继承了地役权,丙有权阻止\n丁加盖房屋。地役权经过登记的,可以对抗善意第三\n人,因此丁也无权要求乙承担违约责任,因为供役地\n负担地役权已办理登记,丁应知晓供役地已设立地役\n权。乙没有刻意隐瞒和欺骗设立好的地役权,乙和丁\n的合同真实有效。","k":"用益物权"},{"id":"2014-21","y":2014,"t":"单","s":"下列选项中,属于民事法律事实的是( )。","o":["王某报考公务员","孙某在宅基地上建造房屋","崔某请李某吃饭","林某代李生妹妹举行结婚仪式"],"a":"B","e":"本题的考查点是民事法律事实的概念。\n所谓民事法律事实,是指依法能够引起民事法律关系\n产生、变更和消灭的客观现象。而客观现象是否能够\n成为民事法律事实,取决于法律的规定。根据事实是\n否与主体意志有关,法律事实可以分为事件和行为两\n类。本题中,仅有选项B中孙某建造房屋的行为,使\n法律关系得以产生,因此是民事法律事实。","k":"用益物权"},{"id":"2015-39","y":2015,"t":"单","s":"甲向乙银行贷款,以其别墅设定抵押。之后, 甲在别墅院内建造了独立车库。贷款到期,甲无力偿 还。乙银行享有优先受偿权的财产()。","o":["仅限于别墅","包括别墅、车库","包括别墅、建设用地使用权","包括别墅、车库及建设用地使用权"],"a":"C","e":"《民法典》第397条规定:\"以建筑物抵\n押的,该建筑物占用范围内的建设用地使用权一并抵\n押。以建设用地使用权抵押的,该土地上的建筑物一\n并抵押。抵押人未依据前款规定一并抵押的,未抵押\n的财产视为一并抵押。\"所以C选项正确,A选项错\n\n误。《民法典》第417 条规定:\"建设用地使用权抵押\n后,该土地上新增的建筑物不属千抵押财产。该建设\n用地使用权实现抵押权时,应当将该土地上新增的建\n筑物与建设用地使用权一并处分。但是,新增建筑物\n所得的价款,抵押权人无权优先受偿。\"车库属于新增\n的建筑物,不属千抵押财产,所以BD选项错误。","k":"用益物权"},{"id":"2017-40","y":2017,"t":"单","s":"在丙将部分承包地转包给丁后,关于取水的 权利表述正确的是()。","o":["只有丙有权取水","只有丁有权取水","丙、丁均有权取水","丙、丁均无权取水"],"a":"C","e":"根据《民法典》的规定,土地所有权人\n享有地役权或者负担地役权的,设立土地承包经营\n权、宅基地使用权时,该土地承包经营权人、宅基地使\n用权人继续享有或者负担已经设立的地役权。地役\n权不得单独转让。土地承包经营权、建设用地使用权\n等转让的,地役权一并转让,但合同另有约定的除外。\n本题中,甲村是土地所有权人,享有对乙村水库的地\n役权,甲村在设立土地承包经营权时,该土地承包经\n营权人丙继续享有甲村设立的取水权。后丙又将部\n分土地转包给丁,部分土地承包经营权转让,地役权\n一并转让,丁也有权取水。因此C项正确。\n二、多项选择题","k":"用益物权"},{"id":"2022-23","y":2022,"t":"单","s":"根据《民法典》规定,土地承包经营权的设立时间为","o":["土地承包经营权合同成立时","土地承包经营权合同生效时","土地承包经营权登记时","土地承包经营权证发放时"],"a":"B","e":"《民法典》第333条规定:\"土地承包经\n营权自土地承包经营权合同生效时设立。登记机构\n应当向土地承包经营权人发放土地承包经营权证、林\n权证等证书,并登记造册,确认土地承包经营权。\"故\nB 选项正确。","k":"用益物权"},{"id":"2024-47","y":2024,"t":"多","s":"下列关于居住权表述正确的有()","o":["居住权以无偿为原则,有偿为例外","居住权既可以用于满足自然人生活居住需要,也可以用于满足其生产经营需要","居住权人在居住权期限内死亡,居住权消灭","居住权的设立只能是自然人(此回忆选项有不同版本)"],"a":"AC","e":"","k":"用益物权"},{"id":"2025-36","y":2025,"t":"单","s":"甲在病重期间立下遗嘱,以自己的房屋为朋友乙设立居住权。甲于2023 年1 月15 日 病故。乙于1 月25 日收到遗产管理人的通知,3 月1 日表示接受为自己设立的居住权,3 月 10 日办理居住权登记。乙取得居住权的时间为( )","o":["2023 年1 月15 日","2023 年1 月25 日","2023 年3 月1 日","2023 年3 月10 日"],"a":"D","e":"《民法典》第368 条规定:\"居住权无偿设立,但是当事人另有约定的除外。设立\n居住权的,应当向登记机构申请居住权登记。居住权自登记时设立。\"本题中居住权的登记时\n间是2023 年3 月10 日,居住权自此时设立,乙于此时取得居住权,D 项正确。","k":"用益物权"}]},{"sub":"民法","name":"无因管理与不当得利","w":0.5,"L":9,"qs":[{"id":"2007-42","y":2007,"t":"单","s":"甲 5 岁之子与乙 6 岁之子同在丙家中玩耍,乙之子不慎毁坏丙价值 l 万元的电脑。甲误认为是其子所为,遂 赔 偿丙一部同等价值的电脑。丙不知事实真相而受领,后将该电脑以 1.1 万元出售给丁。现甲得知事实真相,欲 主张权利, 则其 (   ) 。","o":["只能要求丙返还 l 万元","有权要求丙返还 1.1 万元","有权要求丙返还电脑","有权要求丁返还电脑"],"a":"A","e":"不当得利返还请求权的标的范围 \n]不当得利返还请求权的标的范围因受益人是否善意而不同。丙不知事实真相而受领, \n其为善意。受益人为善意时,受益人受有的利益大于受损人的损失时,受益人返还的范围以 \n受损人受到的损失为准。因此,虽然丙所受有的利益大于乙的损失.,但是返还应以乙的损 \n失为准,返还 1 万元。故答案为 A。","k":"无因管理与不当得利"},{"id":"2007-43","y":2007,"t":"单","s":"下列行为中,构成无因管理的是 (   ) 。","o":["将他人耕牛误认为是自家所有而喂养","主动修缮两家共用的围墙","未受委托而招待朋友的客人","商店保安抓住小偷使某顾客免遭损害"],"a":"B","e":"无因管理 \n] 无因管理是指没有法定或约定的义务,为避免他人利益受损失而进行管理或者服务 \n的法律事实。其构成要件包括:管理他人事务;为避免他人利益损失而管理;无法律上的义 \n务。 A 项中由于把他人耕牛当作自家所有,在主观上没有为他人利益管理的意思,故不符合。 \nC 项中招待朋友的客人属于不发生民事法律后果的一般性生活事务,也不符合。 D 项中保安 \n有抓小偷的义务,也不符合无因管理的构成要件。故答案为 B。","k":"无因管理与不当得利"},{"id":"2007-49","y":2007,"t":"单","s":"甲见乙挥拳打丙,遂上前制止,结果被乙误伤。对甲因此所受的损害 (   ) 。","o":["由乙、丙承担按份赔偿责任","由乙、丙承担连带赔偿责任","由丙承担全部赔偿责任","由乙承担赔偿责任。如果乙无力承担,可责令丙给予适当补偿"],"a":"D","e":"民事责任的承担 \n] 乙是致害人,适用侵权责任,由其承担赔偿责任。丙是受益人,根据我国民法通则 \n第 109 条的规定,因防止、制止国家的、集体的财产或者他人的财产、人身遭受侵害而使自 \n己受到损害的,由侵害人承担赔偿责任,受益人也可以给予适当的补偿。因 \n此,首先应当乙承担赔偿责任,在乙无力承担时,可责令丙给予适当补偿。故答案为 D。","k":"无因管理与不当得利"},{"id":"2011-27","y":2011,"t":"单","s":"下列行为中,构成无因管理的是()。","o":["未受委托替朋友招待客人","未成年人抢救落水儿童","主动代同事值夜班","代替配偶放弃继承权"],"a":"B","e":"无因管理的构成要件包括:(I) 管理他\n人的事务;(2) 有为他人谋利的意思;(3) 无法律上\n的义务5在认定何为\n\" 管理他人的事务\n\"时,通说认为\n管理下列事项,一般不发生无因管理:违法或者违背\n社会公德的行为;纯粹道义上、宗教上或一般生活事\n务,如招待客人;依法须由本人亲自实施或须经本人\n授权才能实施的行为。本题中,AC 项的行为都属于\n道义上的行为,D 的行为属于依法须由本人亲自实施\n或须经本人授权才能实施的行为,故都不发生无因管\n理,答案选B。","k":"无因管理与不当得利"},{"id":"2013-49","y":2013,"t":"多","s":"下列选项中,属于不当得利构成要件的有 ()。","o":["一方获得利益,他方受有损失","受损方不存在过错","获益与受损之间有因果关系","获益方获得利益没有合法根据"],"a":"ACD","e":"本题考查不当得利的基本概念。不当\n得利,是指没有合法根据取得利益而使得他人财产受\n损的事实。不当得利的构成要件包括:(1)一方获得\n利益;(2)他方受有损失;(3)一方获益和他方受损\n之间具有因果关系;(4)获益没有合法根据,即一方\n获益既无法律上的根据,亦无合同上的根据。故答案\n为ACD。","k":"无因管理与不当得利"},{"id":"2018-25","y":2018,"t":"单","s":"下列选项中,甲的行为构成无因管理的是 ()。","o":["甲主动将摔倒在人行道上的老人扶起","甲儿时被收养,成年后赡养亲生父母","甲为了出行便利,出钱修复邻居家被台风刮倒 的院墙","甲的狗将他人咬伤,甲误以为是好友乙的狗 咬伤人而赔偿伤者"],"a":"C","e":"无因管理是指没有法定的或约定的义\n务,为避免他人利益受损失而进行管理或者服务的行\n为。无因管理要求有为他人谋利益的意思,该意思无\n须表示,只要管理行为在客观上避免了他人利益受损\n且管理人不纯粹是出千为自己谋利的目的,就构成无\n因管理。即使管理人主观上有为自己的动机且在客\n观上使自己同时受益,仍不影响无因管理的成立。纯\n粹道义上或者一般生活事务不构成无因管理,AB两\n项不选。本题中,C项的甲虽然有为自已出行便利的\n目的,但也有为邻居谋利益的动机,其没有出钱修复\n邻居院墙的义务,为了避免邻居利益受损而进行管\n\n理,甲的行为成立无因管理。本题选C。D项中,甲的\n狗将他人咬伤,本身就具有法定的赔偿义务,所以不\n构成无因管理,D项不选。","k":"无因管理与不当得利"},{"id":"2019-40","y":2019,"t":"单","s":"甲闻到邻居乙的房间有刺鼻煤气味,便破门 而人关闭煤气管道阀门,此时煤气爆炸,甲、乙均被炸 伤。对此,下列选项正确的是()。","o":["乙应当对甲给予适当补偿","乙应当赔偿甲的全部损失","甲、乙各自承担自己的损失","甲应当赔偿乙的房门损失"],"a":"A","e":"《民法典》第183条规定:\n\" 因保护他人\n民事权益使自己受到损害的,由侵权人承担民事责\n任,受益人可以给予适当补偿。没有侵权人、侵权人\n逃逸或者无力承担民事责任,受害人请求补偿的,受\n益人应当给予适当补偿。\"本题中,甲是为了保护乙的\n民事权益而使自己受到损害,没有侵权人,则受益人\n乙应当给予适当补偿,而不是赔偿甲的全部损失,A\n项正确。\n二、多项选择题","k":"无因管理与不当得利"},{"id":"2020-39","y":2020,"t":"单","s":"甲让乙搭车的行为属于()。","o":["事实行为","无因管理","情谊行为","合同行为"],"a":"C","e":"l\n情谊行为是以建立、维持或者增进与他\n人情谊为目的,后果直接利他的行为。情谊行为的基\n本特征是无偿性、无私性和没有受法律约束的意思。\n无偿性是指一方为给付,而并无自该给付取得对待利\n益之目的;相对人享有该行为带来的利益,也不必向\n对方偿付对待利益。无私性是指行为人没有自私自\n利的意图。没有受法律约束的意思是指当事人之间\n旨在通过此项活动来建立、维持或者增进情谊,并无\n建立法律关系的意思。本题中的\n\"搭便车\n\"的行为属\n千典型的情谊行为,C选项正确。","k":"无因管理与不当得利"},{"id":"2022-32","y":2022,"t":"单","s":"早高峰地铁上,乘客甲、乙因琐事发生肢体冲突,乘客丙奋力将二人分开。事后, 丙发现胳膊被抓伤。丙的行为构成","o":["无因管理","情谊行为","紧急避险","正当防卫"],"a":"A","e":"无因管理是指没有法定的或者约定的\n义务,为避免他人利益受损失而进行管理或者服务的\n行为。丙在没有法定的和约定的义务的情况下,为他\n人谋利益而管理他人事务,构成无因管理。A选项正\n确。情谊行为又称好意施惠行为,与法律行为相比,\n情谊行为欠缺受法律约束的意思,但是丙在进行劝架\n的时候,是有防止他人利益受损的管理的意思的。B\n选项错误。紧急避险是指为了使公共利益、本人或他\n人的人身、财产或者其他合法权益免受正在发生的危\n险,而不得已采取的损害另-一较小合法利益从而保全\n更大利益的行为。丙主动实施劝架行为,并非是在不\n得已的情况下采取的,丙在劝架的时候也并没有牺牲\n其他的更小的合法利益。C选项错误。正当防卫是\n指为了使公共利益、本人或他人的人身、财产或者其\n他合法权益免受正在进行的不法侵害,而对不法侵害\n人所采取的合理的防卫行为。内主动实施劝架行为,\n其合法权益并未遭到不法侵害。D选项错误。","k":"无因管理与不当得利"}]}]

<script>
const D=JSON.parse(document.getElementById('data').textContent);
function fmtBook(q){return esc(q.k||'');}
const SUBS=['全部','刑法','民法'];
const SUBNAME={'全部':'全部','刑法':'刑法','民法':'民法'};
const TN={'判':'判断','单':'单选','多':'多选'};
// index
const Q={};D.forEach((u,ui)=>{u.ui=ui;u.qs.forEach((q,qi)=>{q.u=ui;q.qi=qi;Q[q.id]=q;})});
// storage
const KEY='fsjc_v1';let canSave=true;let S;
try{S=JSON.parse(localStorage.getItem(KEY)||'null');localStorage.setItem(KEY+'_t','1');}catch(e){canSave=false;}
if(!S||!S.q)S={q:{},sub:'全部',drop:false};
if(!S.v2){const now=Date.now();for(const id in S.q){if(S.q[id].length<5)S.q[id][4]=now;}S.v2=1;}
function save(){if(!canSave)return;try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
// 进度只存在本机浏览器（localStorage），不做任何联网上传。
const today=()=>Math.floor((Date.now()+8*36e5)/864e5);  // 北京时间的日期序号，错题本按天计数用
// st: [status, streak, due, wrongCount]  status 1=一次做对 2=错题本 3=错题已掌握
const st=id=>{const s=S.q[id];return s&&s[0]?s:undefined};  // status 0 = 这一节被重置过，当作没做
function inScope(u){return S.sub==='全部'||u.sub===S.sub}
function qInScope(q){return inScope(D[q.u])}
function rint(n){try{const c=window.crypto;if(c&&c.getRandomValues){const b=new Uint32Array(1),lim=4294967296-4294967296%n;let x;do{c.getRandomValues(b);x=b[0];}while(x>=lim);return x%n;}}catch(e){}return Math.floor(Math.random()*n);}
function dueList(){const d=today();return wrongList().filter(id=>S.q[id][2]!==d);}  // 今天还没在错题本里做过的
function wrongList(){return Object.keys(S.q).filter(id=>Q[id]&&S.q[id][0]===2&&qInScope(Q[id])).sort((a,b)=>Q[a].u-Q[b].u||Q[a].qi-Q[b].qi);}
function nextNew(unitOnly){
  const us=unitOnly!=null?[D[unitOnly]]:D.filter(inScope);
  for(const u of us){const l=u.qs.filter(q=>!st(q.id)&&q.id!==(sess&&sess.cur));if(l.length)return l[rint(l.length)].id;}
  for(const u of us){for(const q of u.qs){if(!st(q.id))return q.id;}}
  return null;
}
let view={name:'home'};let sess=null;
const $=h=>{const d=document.createElement('div');d.innerHTML=h;return d.firstElementChild};
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function fmtExp(s,mk,skipOpt){mk=mk||{};const t=esc(s).replace(/┄+/g,'\n').replace(/\s+·/g,'\n·').replace(/\s*\[答题技巧\]/g,'\n【记忆】').replace(/\x01/g,'<b>').replace(/\x02/g,'</b>');
  let h0=t.split(/\n+/).map(x=>x.trim()).filter(Boolean).map(x=>{let m=x.match(/^([A-E])([✓✗])\s*([\s\S]*)$/);
    if(m&&skipOpt)return '';
    if(m)return `<div class="xo ${m[2]=='✓'?'ok':'no'}${mk[m[1]]?(mk[m[1]]=='漏选'?' hit miss':' hit'):''}"><span class="xk">${m[1]}</span><span class="xt">${m[3]}</span>${mk[m[1]]=='漏选'?`<span class="xg">漏选</span>`:''}</div>`;
    m=x.match(/^记法[:：]\s*([\s\S]*)$/);if(m)return `<div class="xm"><span class="xl">记法</span>${m[1]}</div>`;
    return `<div class="xp">${x}</div>`;});h0=[...h0.filter(x=>x.startsWith('<div class="xm"')),...h0.filter(x=>!x.startsWith('<div class="xm"'))].join('');const XM=/(<div class="xm"><span class="xl">记法<\/span>(?:(?!<\/div>)[\s\S])*)<\/div>(?=<div class="xm"><span class="xl">记法<\/span>)<div class="xm"><span class="xl">记法<\/span>/g;let pv;do{pv=h0;h0=h0.replace(XM,'$1<br>');}while(h0!==pv);return h0;}
function home(keepScroll){
  view={name:'home'};const app=document.getElementById('app');
  const us=D.filter(inScope);
  let tot=0,done=0,right=0,ans=0;
  us.forEach(u=>u.qs.forEach(q=>{tot++;const s=st(q.id);if(s){done++;ans++;if(s[0]!==2)right++;}}));
  const wr=wrongList().length;
  let h=`<div><header><h1>法硕基础课 · 真题刷题</h1></header>`;
  if(!canSave)h+=`<div class="warnbar">当前是预览窗口，做题记录存不下来。请下载这个文件，用手机或电脑的浏览器打开后再做题。</div>`;
  h+=`<div class="tabs">${SUBS.map(s=>`<div class="tab ${S.sub===s?'on':''}" data-sub="${s}">${SUBNAME[s]}</div>`).join('')}</div>`;
  h+=`<div class="card"><div class="stats"><div><b>${done}/${tot}</b><span>已做</span></div><div><b>${ans?Math.round(right/ans*100):0}%</b><span>正确率</span></div><div><b>${wr}</b><span>错题本</span></div></div>
  <button class="btn pri" id="go">${done?'继续刷题':'开始刷题'}</button>
  <button class="btn sec" id="wb" ${wr?'':'disabled'}>错题本（${wr} 题）</button></div>`;
  h+=`<div class="card"><div id="ul"></div></div>`;
  h+=`<div class="card"><div style="font-weight:600;margin-bottom:6px">规则</div><div class="hint" style="margin:0">做错的题进错题本。错题本里的题要连续做对两次才移出，中间做错一次就从 0 重新数。每刷一轮，每道错题只出一次，顺序和刷新题一样按重要性排。第一次就做对的题不再出现。<br>进度只保存在这台设备、这个浏览器里，不联网、不上传、也不会和其他设备关联。换浏览器或清理浏览器数据，进度就没了。</div><div style="margin-top:6px">当前收录 999 题（2005–2026）。未收录：2010 年、2023 年（解析未到齐）。</div>
  <div class="foot" style="margin-top:10px"><button id="rst">清空全部进度</button></div></div></div>`;
  app.innerHTML=h;
  const ul=document.getElementById('ul');let rk=0;
  if(!us.length)ul.innerHTML='<div class="empty">没有题</div>';
  us.forEach(u=>{
    const qs=u.qs;if(!qs.length)return;
    let d=0,r=0;qs.forEach(q=>{const s=st(q.id);if(s){d++;if(s[0]!==2)r++;}});
    rk++;
    const el=$(`<div class="unit"><div class="rk">${rk}</div><div class="nm"><div>${S.sub==='全部'?`<span class="tag">${SUBNAME[u.sub]||u.sub}</span>`:''}${esc(u.name)}</div><div class="meta">${(+u.w).toFixed(1)}分/年 · ${d}/${qs.length}题${d?` · 正确率${Math.round(r/d*100)}%`:''}</div><div class="bar"><i style="width:${qs.length?d/qs.length*100:0}%"></i></div></div>${u.qs.some(q=>st(q.id))?'<button class="rs">重置</button>':''}</div>`);
    el.onclick=()=>startSess('unit',u.ui);ul.appendChild(el);
    const rb=el.querySelector('.rs');if(rb)rb.onclick=e=>{e.stopPropagation();resetUnit(u);};
  });
  app.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{S.sub=t.dataset.sub;save();home();});
  document.getElementById('go').onclick=()=>startSess('main');
  document.getElementById('wb').onclick=wrongBook;
  document.getElementById('rst').onclick=()=>{if(confirm('确定清空全部做题记录？只会清空这台设备上的记录，无法恢复。')){S.q={};save();home();}};
  if(keepScroll!==true)window.scrollTo(0,0);
}
function resetUnit(u){
  const ids=u.qs.map(q=>q.id).filter(id=>st(id));if(!ids.length)return;
  if(!confirm(`重置「${u.name}」？\n这一节已做的 ${ids.length} 题会全部变回没做过（也会移出错题本）。`))return;
  const now=Date.now();ids.forEach(id=>{S.q[id]=[0,0,0,0,now];});
  save();home(true);
}

function startSess(mode,unit){view={name:'quiz'};sess={mode,unit,queue:mode==='wrong'?(a=>{for(let i=a.length-1;i>0;i--){const j=rint(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;})(dueList()):[],total:0,n:0,right:0,cur:null,answered:false,sel:[],hist:[],view:null};sess.total=sess.queue.length;nextQ();}
function nextQ(){
  let id=null,isRev=false;
  if(sess.mode==='wrong'){
    while(sess.queue.length){const c=sess.queue.shift();const s=st(c);if(s&&s[0]===2&&s[2]!==today()){id=c;isRev=true;break;}}
  }else id=nextNew(sess.mode==='unit'?sess.unit:null);
  if(!id){finish();return;}
  if(sess.ord)delete sess.ord[id];sess.cur=id;sess.isRev=isRev;sess.answered=false;sess.sel=[];sess.view=null;render();
}
function finish(){
  const app=document.getElementById('app');const left=wrongList().length,due=dueList().length;
  const msg=sess.mode==='wrong'?(!left?'错题本清空了！':due?`这一轮错题刷完了，今天还有 ${due} 题没做。`:`今天的错题都刷完了，明天再来。错题本里还有 ${left} 题。`):sess.mode==='unit'?'这一节的新题都做完了。':'这个范围里的新题都做完了。';
  app.innerHTML=`<div><div class="top"><button class="back" id="bk">‹ 返回</button></div><div class="card empty"><div style="font-size:18px;color:var(--ink);margin-bottom:6px">${msg}</div>本次做了 ${sess.n} 题，对 ${sess.right} 题。</div>${sess.mode==='wrong'&&due?'<button class="btn pri" id="again">继续刷</button>':''}<button class="btn sec" id="bk2">回首页</button></div>`;
  document.getElementById('bk').onclick=document.getElementById('bk2').onclick=home;
  const ag=document.getElementById('again');if(ag)ag.onclick=()=>startWrong(ag);
  window.scrollTo(0,0);
}
// 选项乱序：每次出题随机排列，显示字母按位置重新编号；内部仍用原字母判分
const REFL=/(^|[^A-Za-z0-9])[A-E]([、，,和与及 ]|项|的|对|错|$)/;
function noShuf(q){return (q.e||'').split('\n').some(x=>!/^\s*[A-E][✓✗]/.test(x)&&REFL.test(x.replace(/[\x01\x02]/g,'')));}
function getOrd(q){if(!sess.ord)sess.ord={};let o=sess.ord[q.id];
  if(!o||o.length!==q.o.length){o=q.o.map((_,i)=>i);if(!noShuf(q))for(let i=o.length-1;i>0;i--){const j=rint(i+1);[o[i],o[j]]=[o[j],o[i]];}sess.ord[q.id]=o;}
  return o;}
function dispAns(q,x){const o=getOrd(q);return (x==null?q.a.split(''):[...x]).map(v=>String.fromCharCode(65+o.indexOf(v.charCodeAt(0)-65))).sort().join('');}
function render(id){
  const q=Q[id||sess.cur],u=D[q.u];const app=document.getElementById('app');
  const s=st(q.id);
  let h=`<div class="quizpg"><div class="top"><button class="back" id="bk">‹ 返回</button><div class="where">${esc(SUBNAME[u.sub]||u.sub)} · ${esc(u.name)}</div></div><div class="card">`;
  h+=`<span class="tag">${q.y}年 ${TN[q.t]}</span>`;
  h+=`<div class="stem">${esc(q.s)}</div>`;
  if(q.t==='判'){
    h+=`<div class="judge">${['对','错'].map((v,i)=>`<button class="opt" data-v="${v}">${v==='对'?'✓ 对':'✗ 错'}</button>`).join('')}</div>`;
  }else{
    h+=getOrd(q).map((oi,pos)=>{const V=String.fromCharCode(65+oi),L=String.fromCharCode(65+pos);return `<button class="opt" data-v="${V}"><span class="L">${L}</span><span>${esc(q.o[oi])}</span></button>`}).join('');
    if(q.t==='多')h+=`<button class="btn pri" id="sub" disabled>提交</button>`;
  }
  h+=`<div id="after"></div></div></div>`;
  app.innerHTML=h;
  document.getElementById('bk').onclick=home;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(b.dataset.v));
  const sb=document.getElementById('sub');if(sb)sb.onclick=submit;
  window.scrollTo(0,0);
}
function pick(v){
  if(sess.answered||sess.view!=null)return;const q=Q[sess.cur];
  if(q.t==='多'){const i=sess.sel.indexOf(v);i<0?sess.sel.push(v):sess.sel.splice(i,1);
    document.querySelectorAll('.opt').forEach(b=>b.classList.toggle('sel',sess.sel.includes(b.dataset.v)));
    document.getElementById('sub').disabled=!sess.sel.length;return;}
  sess.sel=[v];submit();
}
function submit(){
  if(sess.answered||sess.view!=null||!sess.sel.length)return;const q=Q[sess.cur];
  const mine=sess.sel.slice().sort().join('');const ok=mine===q.a;
  sess.answered=true;sess.n++;if(ok)sess.right++;
  const now=Date.now();let s=S.q[q.id];
  const d=today();
  if(!s||!s[0]){S.q[q.id]=ok?[1,0,0,0,now]:[2,0,d,1,now];}
  else if(s[0]===2){if(ok){if(s[2]!==d){s[1]++;if(s[1]>=2)s[0]=3;}}else{s[1]=0;s[3]++;}s[2]=d;s[4]=now;}  // 错题本：每天最多算一次，连续两天做对才移出
  else{if(!ok){S.q[q.id]=[2,0,d,(s[3]||0)+1,now];}}

  save();
  sess.hist.push({id:q.id,sel:sess.sel.slice()});
  showAfter(q,sess.sel,ok);
}
// 选项说明开头若只是重复选项（如“爬到树上：…”），显示时去掉；带括号补充或数字单位不同的保留
function stripPre(o,t){const i=t.indexOf('：');if(i<1||!o)return t;const raw=t.slice(0,i),pre=raw.replace(/[\x01\x02]/g,'');let rest=t.slice(i+1);
  if(!rest.replace(/[\x01\x02\s。]/g,''))return t;if(/[（(]/.test(pre))return t;
  const core=[...pre.replace(/[《》“”"\s]/g,'')];if(!core.length)return t;const miss=core.filter(c=>!o.includes(c));
  if((core.length-miss.length)/core.length<0.6)return t;if(/\d/.test(o)&&miss.length)return t;
  const op=(raw.match(/\x01/g)||[]).length-(raw.match(/\x02/g)||[]).length;if(op>0)rest='\x01'+rest;return rest;}
function showAfter(q,sel,ok){
  const OE={};if(q.t!=='判'&&q.e)for(const x of q.e.split('\n')){const m=x.trim().match(/^([A-E])([✓✗])\s*([\s\S]*)$/);if(m)OE[m[1]]=m[3];}
  const hasOE=Object.keys(OE).length>0;
  document.querySelectorAll('.opt').forEach(b=>{const v=b.dataset.v;const inA=q.t==='判'?v===q.a:q.a.includes(v);const inM=sel.includes(v);
    b.querySelectorAll('.oe').forEach(e=>e.remove());
    if(OE[v]&&b.children[1]){let t=OE[v];const o=q.o[v.charCodeAt(0)-65]||'';if(o&&t.startsWith(o+'：'))t=t.slice(o.length+1);else t=stripPre(o,t);if(/^\s*(不对|不是|原文|按题目记|不在里面|错误|正确|对|错|不符|无关)[。．.]?\s*$/.test(t.replace(/[\x01\x02]/g,'')))t=inA?'':'干扰项';if(t)
      b.children[1].insertAdjacentHTML('beforeend',`<span class="oe">${esc(t).replace(/\x01/g,'<b>').replace(/\x02/g,'</b>')}</span>`);}
    b.classList.remove('sel');if(inA&&inM)b.classList.add('ok');else if(inM)b.classList.add('bad');else if(inA)b.classList.add(q.t==='多'?'miss':'ok');b.disabled=true;});
  const sb=document.getElementById('sub');if(sb)sb.remove();
  let h=`<div class="res ${ok?'ok':'bad'}">${ok?'正确':(q.t==='判'?'错误，正确答案'+(q.a==='对'?'✓':'✗'):'错误，你的答案'+dispAns(q,sel)+'，正确答案'+dispAns(q))}</div><button class="btn pri" id="nx">下一题</button>`;
  if(ok){const s0=S.q[q.id];const inWb=s0&&s0[0]===2&&!s0[1];h+=`<button class="addwb" id="awb"${inWb?' disabled':''}>${inWb?'已加入错题本':(s0&&(s0[0]===3||(s0[0]===2&&s0[1]>0))?'留在错题本':'加入错题本')}</button>`;}
  const mk={};if(q.t!=='判'&&!ok)for(const v of 'ABCDE'){const a=q.a.includes(v),m=sel.includes(v);if(m&&!a)mk[v]='选错';}
  if(q.e)h+=`<div class="box"><h4>解析</h4>${fmtExp(q.e,mk,hasOE)}</div>`;
  if(q.k)h+=`<div class="box book"><h4>考点</h4>${fmtBook(q)}</div>`;
  document.getElementById('after').innerHTML=h;
  document.getElementById('nx').onclick=goNext;
  const aw=document.getElementById('awb');if(aw)aw.onclick=()=>{const s1=S.q[q.id];const now=Date.now();S.q[q.id]=[2,0,today(),((s1&&s1[3])||0)+1,now];save();aw.textContent='已加入错题本';aw.disabled=true;};
}
// 上一题/下一题：上一题只能回看本次已做的题（显示当时的作答和解析，不能改答案）
function goPrev(){
  if(!sess||view.name!=='quiz'||!document.querySelector('.stem'))return;
  const H=sess.hist;let i;
  if(sess.view==null)i=sess.answered?H.length-2:H.length-1;else i=sess.view-1;
  if(i<0)return;showHist(i);
}
function goNext(){
  if(!sess||view.name!=='quiz'||!document.querySelector('.stem'))return;
  const H=sess.hist;
  if(sess.view!=null){
    const last=sess.answered?H.length-2:H.length-1;
    if(sess.view<last){showHist(sess.view+1);return;}
    sess.view=null;render();
    if(sess.answered){const h=H[H.length-1];showAfter(Q[h.id],h.sel,h.sel.slice().sort().join('')===Q[h.id].a);}
    else if(sess.sel.length){document.querySelectorAll('.opt').forEach(b=>b.classList.toggle('sel',sess.sel.includes(b.dataset.v)));const sb=document.getElementById('sub');if(sb)sb.disabled=false;}
    return;
  }
  if(sess.answered)nextQ();
}
function showHist(i){
  sess.view=i;const h=sess.hist[i];const q=Q[h.id];render(h.id);
  const sb=document.getElementById('sub');if(sb)sb.remove();
  showAfter(q,h.sel,h.sel.slice().sort().join('')===q.a);
}
(()=>{let x0=null,y0=0,t0=0;
  document.addEventListener('touchstart',e=>{if(e.touches.length!==1){x0=null;return;}x0=e.touches[0].clientX;y0=e.touches[0].clientY;t0=Date.now();},{passive:true});
  document.addEventListener('touchend',e=>{if(x0==null)return;const t=e.changedTouches[0];const dx=t.clientX-x0,dy=t.clientY-y0;x0=null;
    if(Date.now()-t0>800||Math.abs(dx)<60||Math.abs(dx)<1.5*Math.abs(dy))return;
    if(dx<0)goNext();else goPrev();},{passive:true});
})();
function wrongBook(){
  view={name:'wb'};const app=document.getElementById('app');const ids=wrongList();
  let h=`<div><div class="top"><button class="back" id="bk">‹ 返回</button><div class="where">错题本 ${ids.length} 题${S.sub==='全部'?'':' · '+SUBNAME[S.sub]}</div></div>`;
  const dn=dueList().length;
  h+=`<button class="btn pri" id="redo" ${dn?'':'disabled'} style="margin:0 0 12px">${dn?`重刷错题（今天 ${dn} 题）`:ids.length?'今天的错题都刷完了，明天再来':'重刷错题'}</button>`;
  h+=`<div class="card"><div class="hint" style="margin:0 0 6px">错题列表，按重要性排序。</div>`;
  h+=ids.map(id=>{const q=Q[id];
    return `<div class="wb"><span class="tag">${q.y} ${TN[q.t]}</span><div>${esc(q.s)}</div></div>`}).join('')||'<div class="empty">错题本是空的</div>';
  h+='</div></div>';app.innerHTML=h;document.getElementById('bk').onclick=home;
  document.getElementById('redo').onclick=e=>startWrong(e.currentTarget);window.scrollTo(0,0);
}
// 键盘不参与做题：没有快捷键，回车/空格也不会触发按钮（防误触），只能点
document.addEventListener('keydown',e=>{
  const tg=e.target.tagName;if(tg==='TEXTAREA'||(tg==='INPUT'&&e.target.type==='text'))return;
  if(e.key==='Enter'||e.key===' '||e.key==='Spacebar'){e.preventDefault();e.stopPropagation();}
},true);
document.addEventListener('keyup',e=>{const tg=e.target.tagName;if(tg==='TEXTAREA'||(tg==='INPUT'&&e.target.type==='text'))return;if(e.key===' '||e.key==='Spacebar'){e.preventDefault();}},true);

home();
</script>
</body>
