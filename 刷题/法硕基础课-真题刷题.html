有权","丙继受取得房屋所有权"],"a":"D","e":"甲将房屋赠与乙,但房屋因未办理过户\n登记,所有权未发生移转,此时房屋所有权人仍然是\n甲,甲将房屋卖给丙并办理了过户登记,此时房屋所\n有权人变为丙。甲丙之间\n\" 保留房屋所有权\n\" 的约定\n\n与法律规定冲突,不发生物权效力,因此本题中丙继\n受取得了房屋的所有权,D选项正确,ABC选项错误。","k":"物权通则与物权变动"},{"id":"2020-31","y":2020,"t":"单","s":"甲将借给乙的笔记本电脑卖给丙,甲、丙约定 由丙直接向乙请求返还电脑。该电脑的交付方式属 于()。","o":["现实交付","占有改定","简易交付","指示交付"],"a":"D","e":"指示交付是指出让人的出让动产被第\n三人占有的,出让人将返还请求权让与受让人,并告\n知占有人向受让人交付该动产。甲将借给乙的电脑\n卖给丙,并与丙约定由丙直接向乙请求返还电脑,实\n际上就是将返还请求权让与了丙,该交付方式属于指\n示交付,D选项正确。","k":"物权通则与物权变动"},{"id":"2020-35","y":2020,"t":"单","s":"甲向乙借款,将自己的汽车抵押给乙,办理了 抵押登记。后甲又向丙借款,将该车质押给丙。丙在 占有该车期间,发现汽车有故障,送到丁厂修理。丁 厂因未收到修理费将该车留置。本案的担保物权受 偿顺序是()。","o":["抵押权;质权;留置权","质权;留置权;抵押权","留置权;抵押权;质权","留置权;质权;抵押权"],"a":"C","e":"根据《民法典》的规定,同一动产上已\n经设立抵押权或者质权,该动产又被留置的,留置权\n人优先受偿。同一财产既设立抵押权又设立质权的,\n拍卖变卖该财产所得的价款按照登记、交付的时间\n先后确定清偿顺序。C选项正确。","k":"物权通则与物权变动"},{"id":"2020-46","y":2020,"t":"多","s":"甲拾得乙丢失的手机,向乙索要2000元报 酬,乙表示面谈。见面后乙称只给500元,甲因此拒 绝返还手机。乙要求甲返还手机的请求权有()。","o":["侵权请求权","物权请求权","不当得利请求权","无因管理请求权"],"a":"ABC","e":"根据《民法典》的规定,遗失物的拾得\n人负有下列义务:(1)将拾得物返还权利人的义务。\n拾得遗失物,应当返还权利人。拾得人应当及时通知\n权利人领取,或者送交公安等有关部门。(2)妥善保\n管的义务。拾得人在遗失物送交有关部门前,有关部\n门在遗失物被领取前,应当妥善保管遗失物。因故意\n或者重大过失致使遗失物毁损、灭失的,应当承担民\n事责任。甲拾得手机拒不返还,属于侵犯乙的财产权\n的行为,乙可以侵权请求权要求甲返还手机,A选项\n正确。甲拾得乙的手机后以拾得遗失物为法律依据\n对手机进行占有,乙请求甲返还手机,甲拒不返还,此\n时的占有属于无权占有,乙作为物权人可以占有返还\n请求权或返还原物请求权等物权请求权要求甲返还\n手机,B选项正确。甲拾得手机不返还给乙,甲没有\n合法根据取得利益而使乙的财产受损,乙可以不当得\n利请求权要求甲返还手机,C选项正确。无因管理是\n指没有法定的或者约定的义务,为避免他人利益受损\n失而进行管理或者服务的行为,甲侵占遗失物,没有\n为乙谋利益的意思,不属于无因管理,D选项错误。","k":"物权通则与物权变动"},{"id":"2020-50","y":2020,"t":"多","s":"甲将祖父的遗像交给乙装裱,乙粗心大意,弄 丢了该遗像,甲非常痛苦。甲有权要求乙()。","o":["返还原物","恢复原状","赔偿财产损失 三、简答题:第51~54小题,每小题10 分","赔偿精神损害"],"a":"CD","e":"返还原物的前提条件是原物存在,遗像\n已经丢失,乙无法返还,因此甲无法要求乙返还原物,\nA选项错误。当物权的标的物因他人的侵权行为而\n损坏时,如果能够修复,物权人可以请求侵权行为人\n修理以恢复物之原状,遗像丢失,无法恢复,B选项错\n误。乙丢失遗像,甲遭受财产损失,可要求乙赔偿财\n产损失,C 选项正确。具有人格象征意义的特定纪念\n物品,因侵权行为而永久性灭失或者毁损,物品所有\n人可以侵权为由,向人民法院起诉请求精神损害赔\n偿,D选项正确。\n三、简答题","k":"物权通则与物权变动"},{"id":"2021-30","y":2021,"t":"单","s":"甲将房屋出租给乙。租赁期间甲将房屋卖给 了丙,办理了过户登记手续,双方约定剩余租期的租 金由丙收取。其后甲将上述事实告知乙。租期届满 后,乙继续占有该房屋。对此,下列表述正确的是 ( )","o":["丙只能请求乙向甲返还房屋","丙既可以请求甲交付房屋,也可以请求乙返还 房屋","丙只能请求甲交付房屋","丙只能请求乙返还房屋"],"a":"D","e":"l\n甲将房屋出售给丙,且办理了过户登记\n手续,房屋所有权人发生变化,新的房屋所有权人是\n丙。租赁合同到期后,丙可以根据所有权请求乙返还\n房屋,但丙不能请求甲交付房屋,因为甲已经将租赁\n的情况告知丙,且甲不占有房屋。因此本题选D。","k":"物权通则与物权变动"},{"id":"2021-40","y":2021,"t":"单","s":"下列选项中,构成原物与孽息关系的是","o":["名画原件与其复制品","母牛与其产下的牛犊","水库与水库里的鱼","果树与果树上的果实"],"a":"B","e":"根据两物之间的派生关系,物可以分为\n原物与孽息。原物是指能够产生收益的物,孽息为原\n物产生的收益。B项母牛属于原物,是能够产生收益\n的物,牛犊是母牛产生的收益,母牛与其产生的牛犊\n是原物与草息的关系,B项正确。\n二、多项选择题","k":"物权通则与物权变动"},{"id":"2024-46","y":2024,"t":"多","s":"甲向银行贷款,银行要求甲提供担保,甲现在对土地拥有土地承包经营权,对A公 司拥有货物债权,甲还出版了一批畅销书籍,对一套房屋拥有所有权(现已被查封),甲可 以设立担保物权的有()","o":["土地经营权","债权","房屋","著作权中的财产性权利"],"a":"ABD","e":"","k":"物权通则与物权变动"},{"id":"2024-48","y":2024,"t":"多","s":"甲坐高铁时不小心误拿了邻座乙的背包,通过背包里面的名片打电话给乙要归还背 包,甲在返还的途中,因为车厢拥挤,背包被偷。下列说法正确的有() 2024年全国法律硕士(非法学)联考真题试卷丨专业基础课","o":["甲对背包属于直接占有","甲拿乙的背包不属于侵权行为","甲的行为属于无因管理","甲对背包被偷没有重大过失,不需要承担责任"],"a":"ABD","e":"","k":"物权通则与物权变动"},{"id":"2025-50","y":2025,"t":"多","s":"A 公司获得某地块的建设用地使用权,已建造一栋楼房。后该地块被当地政府提前收 回用于建设高铁站。对此,下列说法正确的有( )","o":["提前收回该地块后应当对A 公司建造的楼房给予补偿","A 公司丧失建设用地使用权系非基于法律行为的物权变动","提前收回该地块后应当对A 公司可预见的利益损失给予赔偿","提前收回该地块后应当退还A 公司建设用地使用权剩余期限的出让金 三、简答题:第51~54 小题,每小题10 分"],"a":"ABD","e":"《民法典》第358 条规定:\"建设用地使用权期限届满前,因公共利益需要提前收\n回该土地的,应当依据本法第二百四十三条的规定对该土地上的房屋以及其他不动产给予补偿,\n并退还相应的出让金。\"AD 项正确。政府征收行为属于非基于法律行为的物权变动,B 项正确。\n政府提前收回土地是基于公共利益的合法行为,应给予补偿而非赔偿。补偿范围通常包括直接\n损失,不包括可预见的利益损失,C 项错误。本题选ABD。\n三、简答题","k":"物权通则与物权变动"}]},{"sub":"民法","name":"所有权与共有","w":2.2,"L":41,"qs":[{"id":"2005-35","y":2005,"t":"单","s":"在当事人没有约定,法律亦无特别规定的情况下,买卖合同中财产所有权的转移时间是(   )","o":["标的物交付时","买方付清全部货款时","合同生效时","合同成立时"],"a":"A","e":"《合同法》第133 条规定:\"标的物的所有权自标的物交付时起转移,但法律另有规定或者当事人\n另有约定的除外。\"《民法通则》第72 条第2 款也明确规定:\"按照合同或者其他合法方式取得财产的,财产所有\n权从财产交付时起转移,法律另有规定或者当事人另有约定的除外。\"据此,选项A 应选。","k":"所有权与共有"},{"id":"2005-36","y":2005,"t":"单","s":"甲、乙二人同在山坡上放羊,乙的羊混入甲的羊群,甲不知,赶羊回家入圈。甲的行为属于(   )","o":["拾得遗失物","获取不当得利","无因管理","侵权行为"],"a":"B","e":"甲不知乙的羊混入自己的羊群,甲的行为不构成有意识的\"拾得\"或\"无因管理\"。授权行为,在\n民法上一般指授予代理权,由代理人为本人为民事法律行为。本案中,很明显也不存在这种问题。据上,排除选项\nACD。 \n《民法通则》第92 条规定:\"没有合法根据,取得不当利益,造成他人损失的,应当将取得的不当利益返还受损失\n的人。\"据此,不当得利,是指没有合法根据而获得利益并使他人利益遭受损失的事实。甲没有合法根据获取乙的\n羊的所有权,并使得乙受到损失,因此甲的行为构成不当得利。","k":"所有权与共有"},{"id":"2006-43","y":2006,"t":"单","s":"所有权取得方式中,属于原始取得的是(   )","o":["继承遗产","受赠图书","收获庄稼","购得汽车"],"a":"C","e":"遗产继承、受赠图书和购得汽车都是对原所有权的变更。既继收取的。只有收获庄稼是对所有权的第\n一次去得基原始取的。","k":"所有权与共有"},{"id":"2006-52","y":2006,"t":"多","s":"根据法律规定,下列民事主体中享有优先购买权的是(       )","o":["抵押权人","合伙人","房屋承租人","按份共有人"],"a":"BCD","e":"担保法明确禁止流质契约,此是为保护其他债权人利益,所以抵押权人无优先购买权。","k":"所有权与共有"},{"id":"2006-55","y":2006,"t":"多","s":"下列权利中,其客体可以是动产的是(       )","o":["所有权","抵押权","质权","留置权 九、简答题 56、57 小题,每小题 6 分"],"a":"ABCD","e":"所有权、抵押权是动产、不动产都可行使;质权和留置权只有动产才能行使所以应全选ABCD。 \n九、简答题","k":"所有权与共有"},{"id":"2007-32","y":2007,"t":"单","s":"某年元旦前,张某给田某寄去一张有奖明信片,并戏称:“ 得奖了别忘请客 ” 。田某将此明信片转送给金某, 并与其约定一旦得奖则奖金两人平分。开奖时,该张明信片中了大奖,奖金 2000 元。为此笔奖金的分配,张某、 田某与金 某发生争执。依据民法原理,此笔奖金应 (   ) 。","o":["归张某所有","由张某、田某共有","归金某所有","由田某、金某共有"],"a":"D","e":"附条件民事法律行为 \n] 根据民法通则的规定,民事法律行为可以附条件,附条件的民事法律行为在符合所 \n附条件时生效。田某和金某约定得奖时二人平分奖金,即为一个附条件的民事法律行为,故 \n得奖后奖金由二人共有。答案为 D。","k":"所有权与共有"},{"id":"2007-33","y":2007,"t":"单","s":"下列权利中,其客体既可以是动产,也可以是不动产的是 (   ) 。","o":["地上权","抵押权","相邻权","典权"],"a":"B","e":"抵押权的客体 \n) 地上权的客体是土地,为不动产,A 项不符合要求。而抵押物既可以是动产,也 \n可以是不动产,故 B 项正确。相邻权是相互毗邻的不动产的所有人或使用权人所享有的权 \n- 13 -\n\n \n \n更多考研精品资料,关注淘宝店铺:光速考研工作室 \n利,典权属于不动产物权中的用益物权,因此 C、D 项不符合要求。","k":"所有权与共有"},{"id":"2007-45","y":2007,"t":"单","s":"画家甲将其创作的一幅中国画卖给乙公司,乙公司因此取得 (   ) 。","o":["该作品的修改权","该作品的复制权","该作品原件的所有权和展览权","该作品原件的所有权和著作权"],"a":"C","e":"著作权的归属 \n] 根据著作权法的规定,美术等作品原件所有权的转移,不视为作品著作权的转移, \n其著作权仍由作者享有,但美术作品原件的展览权由原件所有人享有。修改权和复制权属于 \n著作权人的权利。因此 A、B、D 项不符合要求,答案为-C。","k":"所有权与共有"},{"id":"2007-52","y":2007,"t":"多","s":"甲、乙系邻居。下列情形中,属于甲侵害乙相邻权的有 (       )。","o":["甲家院中树木的根枝越界到乙家院中生长","甲将自家房屋改建为歌厅,喧嚣声使乙彻夜难眠","甲把大狼狗拴在自家院中,乙路过时被吓得心惊胆颤","甲把垃圾堆放在自家门口,散发的恶臭使乙夏天不敢开窗"],"a":"ABD","e":"{考点]相邻权 \n]不动产的相邻各方,应当按照有利生产、方便生活、团结互助、公平合理的精神,正 \n确处理截水、排水、通行、通风、采光等方面的相邻关系。相邻一方种植的竹木根枝伸延, \n危及另一方建筑物的安全和正常使用的,应当分别情况,责令其消除危险,恢复原状,赔偿 \n \n损失。相邻一方堆放腐朽物、有毒物、恶臭物、垃圾的时候,应当与邻人生活居住的建筑物 \n保持一定的距离,或者采取相应的防范措施,防止空气污染。相邻各方不得制造噪音、喧嚣 \n等妨碍邻人的生产和生活。故答案为 A、B、Dd","k":"所有权与共有"},{"id":"2008-32","y":2008,"t":"单","s":"下列权利中,其客体既可以是动产也可以是权利的是(  )","o":["所有权","抵押权","地役权","留置权"],"a":"B","e":"所有权的客体可以是动产,也可以是不动产,但不可以是权利;抵押权的客体可以是动产,也可以是\n权利(比如土地使用权);地役权的客体是不动产,不能是动产;留置权的客体必须是动产。故本题应选B。","k":"所有权与共有"},{"id":"2008-41","y":2008,"t":"单","s":"甲到乙处修理汽车,由于所携带的钱款不足,将自己的名贵手表留于乙处,双方商定甲次日付款取表。则乙对甲 的手表 享有(  )。","o":["留置权","质权","抵押权","所有权"],"a":"B","e":"首先,乙对甲的手表,不享有所有权,只是甲付款的担保而已民,若甲付款则取表。其次,不属于抵\n押权,因为抵押权人依法无权占有抵押物。不属于留置权,因为根据《物权法》第231 条,债权人留置的动产,应\n当与债权属于同一法律关系,但企业之间留置的除外。而甲的手表是甲主动提供给乙占有的,与其担保的修理汽车\n费用不属于同一法律关系,动产质权,是指为担保债务的履行,债务人或者第三人将其动产出质给债权人占有,债\n务人就该动产优先受偿的权利。本题应选B。","k":"所有权与共有"},{"id":"2009-38","y":2009,"t":"单","s":"甲将从上游水源流下的水截留在自己的土地,土地位于下游的乙要求甲停止截留。根据民法规定,乙所行使的 权利 为(    )。","o":["使用权","地上权","地役权","相邻权"],"a":"D","e":"本题考查相邻权。民法上的相邻关系,是指相互毗邻的不动产的所有人或者使用人因对不动产行\n使所有权或者使用权而发生的权利义务关系。在相邻关系中,相邻人享有的要求他方给予方便的权利又称相邻权。\n本题中,甲乙之间的关系属于截水方面的相邻关系,乙所行使的权利为地役权。《物权法》第156 条规定,地役权\n人有权按照合同规定,利用他人的不动产,以提高自己不动产的效益。乙行使的权利不符合地役权的特征。因此本\n题的答案为D","k":"所有权与共有"},{"id":"2009-51","y":2009,"t":"多","s":"下列共有关系中,属于共同共有关系的有(      )。","o":["居住在同一幢楼的居民对共同乘坐的电梯形成的共有关系","甲乙对各出资 800 元购买的洗衣机形成的共有关系","婚姻关系存续期间,双方无特别约定,夫妻对一方所得的稿酬形成的共有关系","被继承人死亡后,继承人对被继承人遗留的没有分割的遗产形成的共有关系"],"a":"CD","e":"本题考查共同共有。共同共有是指两个或两个以上的共有人对哦某项共有财产不分份额地共同享有\n权利,共同承担义务的一种共有关系。共同共有关系一般由法律规定,如夫妻关系、家庭关系,或合同约定,如何\n活合同。A 选项中居住在同一栋楼的居民对共同乘坐的电梯享有的是建筑物区分所有权。B 选项中 ,甲乙对各自出\n- 13 -\n\n \n \n更多考研精品资料,关注淘宝店铺:光速考研工作室 \n资800 元功买的洗衣机形成的是安份共有关系。C 选项基于夫妻关系、D 选项基于继承关系,构成共同共有。因此本\n题答案为C、D","k":"所有权与共有"},{"id":"2011-24","y":2011,"t":"单","s":"根据法律规定,按份共有人转让其应有份额 时,其他共有人享有()。","o":["禁止其转让的权利","解除共有关系的权利","同等条件下的优先购买权","对转让份额的追及权"],"a":"C","e":"按份共有人享有的权利有:(1)以份额\n享有共有权;(2) 分割请求权;(3) 优先购买权;\n(4)在共有份额上设定担保物权;(5)物上请求权;\n(6) 共有物处分权。所以本题答案选C。关于按份\n共有人的优先购买权有四点需要明确:(1) 只有在共\n有人将自己的份额转让给共有人以外的人时,其他共\n有人才享有优先购买权,也就是说若是在共有人之间\n转让,则无所谓优先购买权。(2) 其他共有人享有优\n先购买权的前提是同等条件,如果第三人给出的条件\n优于共有人,则共有人丧失优先购买权。(3) 当共有\n人的优先购买权与承租人的优先购买权发生冲突时,\n共有人的优先购买权优先。(4) 共有份额的权利主\n体因继承、遗赠等原因发生变化时,其他按份共有人\n主张优先购买的,不予支待。但按份共有人之间另有\n约定的除外。","k":"所有权与共有"},{"id":"2011-25","y":2011,"t":"单","s":"村民甲在自家院子里挖水沟,致邻居乙家房 屋地基下沉。依据物法权,甲侵害了乙的( ()。","o":["所有权","地上权","地役权","建设用地使用权"],"a":"A","e":"本题考查了所有权和用益物权的区别。\n所有权属于自物权,是权利人对自己的不动产或者动\n产,依法享有的占有、使用、收益和处分的权利。所有\n权设立在权利人自己所有的物之上。用益物权属于\n他物权,是权利人对他人的不动产或者动产,依法享\n有的占有、使用、收益的权利。用益物权设立在他人\n所有的物之上。本题中,乙家房屋地基下沉是自己所\n有的不动产遭到侵害,故甲侵害的是乙的所有权,B\n选项中的地上权、C选项中的地役权和D选项中建设\n用地使用权都属于用益物权,是建立在他人所有的物\n上的权利,故都不选,答案选A。也可以说,甲侵犯的\n是相邻权,相邻权属于所有权的延伸。","k":"所有权与共有"},{"id":"2011-26","y":2011,"t":"单","s":"根据《物权法》的规定,下列财产中,可以抵 押的是()。","o":["正在建造的船舶","宅基地使用权","被查封的财产","集体土地所有权"],"a":"A","e":"法律规定不可以设定抵押权的财产包\n括:(1)土地所有权;(2) 宅基地、自留地、自留山等\n集体所有的土地使用权,但法律规定可以抵押的除\n外;(3)学校、幼儿园、医疗机构等为公益目的成立的\n非营利法人的教育设施、医疗卫生设施和其他公益设\n施;(4) 所有权、使用权不明或者有争议的财产;(5)\n依法被查封、扣押、监管的财产;(6) 法律、行政法规\n规定不得设定抵押权的其他财产。答案选A。\n[特别说明]\n《最高人民法院关于适用(中华人\n民共和国民法典〉有关担保制度的解释》第6 条规定:\n\"以公益为目的的非营利性学校、幼儿园、医疗机构、\n养老机构等提供担保的,人民法院应当认定担保合同\n无效,但是有下列情形之一的除外:(一)在购入或者\n以融资租赁方式承租教育设施、医疗卫生设施、养老\n服务设施和其他公益设施时,出卖人、出租人为担保\n价款或者租金实现而在该公益设施上保留所有权;\n(二)以教育设施、医疗卫生设施、养老服务设施和其\n他公益设施以外的不动产、动产或者财产权利设立担\n保物权。\"","k":"所有权与共有"},{"id":"2013-26","y":2013,"t":"单","s":"学校委托教务人员王某购买一批教学器材。 王某到百货公司购买时,恰逢该公司举行有奖销售, 王某抽中数码相机一台。该相机应当()。","o":["归学校所有","归王某所有","归学校与王某共有","归学校所有,但学校应给王某适当奖励"],"a":"A","e":"本题考查的是代理的法律后果。本题\n中王某接受学校的委托,以学校的名义在代理权限内\n与销售方产生法律行为,其产生的法律后果由被代理\n人承担。因为代理的目的是为被代理人进行民事活\n动,代理人的行为效力当然归属于被代理人,包括设\n定的权利归被代理人享受,义务归被代理人承担,代\n理人的行为给他人造成的损害由被代理人赔偿等。\n因此答案选A。","k":"所有权与共有"},{"id":"2014-30","y":2014,"t":"单","s":"甲公司与乙公司签订一设备买卖合同,约定 甲公司保留设备所有权直至乙公司付清货款为止。 乙公司未付清货款便将该设备转卖给丙公司,但未交 货。后乙公司又将该设备以市价转让并交付给不知 情的丁公司。本案中的设备所有权应属于()。","o":["甲公司","乙公司","丙公司","丁公司"],"a":"D","e":"本题考查的是无权处分与善意取得制\n度。所谓善意取得,是指无权处分人在不法将其占有\n的他人财产让与第三人后,如果受让人在取得该财产\n时是出于善意,即取得该财产的所有权,原所有人不\n得要求受让人返还的制度。本题中,甲保留所有权,\n虽然乙并未取得货物的所有权,并将货物转卖给丙和\n丁,但由于乙仅对丁完成了交付,因此丁善意取得货\n物所有权。该批设备所有权应该属于丁。","k":"所有权与共有"},{"id":"2015-29","y":2015,"t":"单","s":"下列选项中,属于所有权继受取得方式的是 )。","o":["添附","先占","生产","遗赠"],"a":"D","e":"本题考查的是所有权取得的继受取得。\n所谓所有权的继受取得,是指通过某种法律行为或基\n于法律行为以外的事实从原所有人处取得所有权。\n这种取得方式意味着原所有人的所有权基千一定的\n法律事实转归于新的所有人,亦即所有权的转移。所\n有权继受取得的方式包括:(1 )买卖。(2 )互易。\n(3)赠与。(4)继承与遗赠。因此D选项是正确选\n项。ABC选项均为所有权原始取得的方式。","k":"所有权与共有"},{"id":"2015-31","y":2015,"t":"单","s":"甲上晚自习时拾得一个单反相机,后相机被 乙借走。乙看到悬赏200元的寻物启事,未经甲同意 将相机还给了失主。下列选项中,正确的是()。","o":["甲、乙均有权要求失主支付报酬","仅甲有权要求失主支付报酬","仅乙有权要求失主支付报酬","甲、乙均无权要求失主支付报酬"],"a":"B","e":"根据《民法典》规定,悬赏人以公开方\n式声明对完成特定行为的人支付报酬的,完成该行为\n的人可以请求其支付。乙并非该悬赏广告当事人,根\n据债的相对性原理,失主是对甲负有给付义务,而非\n对乙。所以仅甲有权要求失主支付报酬。","k":"所有权与共有"},{"id":"2015-48","y":2015,"t":"多","s":"甲乙约定,甲租住乙的别墅15年。租赁期 间,甲将房屋加高,使邻居丙的房屋采光受到严重影 响。对此,丙()。","o":["可以侵害相邻权为由要求甲排除妨碍","可以侵害相邻权为由要求乙排除妨碍","无权要求乙排除妨碍,因为将房屋加高系甲所为","可以侵害建筑物区分所有权为由要求乙排除 妨碍"],"a":"AB","e":"相邻关系,是指相互毗邻的不动产的所\n有人或使用人因对不动产行使所有权或使用权而发\n生的权利义务关系。相邻关系实质上是对财产所有\n人或占有人、使用人行使所有权或占有、使用权的合\n理延伸和必要的限制。相邻关系是在不动产毗邻或\n相近的特定条件下因对财产的使用而发生的。包括\n截水、排水、通风、采光、眺望等所发生的不利影响或\n有害侵扰。甲是房屋使用权人,乙是房屋所有权人,\n因此,丙既可以侵害相邻权为由要求甲排除妨碍,也\n可以侵害相邻权为由要求乙排除妨碍,AB选项正确,\nC选项错误。甲将房屋加高的行为没有侵犯丙的建\n筑物区分所有权,丙不能已此理由要求乙排除妨碍,D\n选项错误。","k":"所有权与共有"},{"id":"2016-27","y":2016,"t":"单","s":"甲将母亲的骨灰葬于乙村坟地时,将自己的 一对手镯随葬。该手镯的所有权属于( )。","o":["甲母","甲","乙村","国家"],"a":"B","e":"手铜在随葬之前,所有权属千甲。甲决\n定将手锡随母亲的骨灰葬于乙村,是对手燭行使处分\n权,其处分意思是将手铜埋藏千母亲身边,但是所有\n权没有发生变更,手锡的所有权依然属千甲,B选项\n正确。\n甲并没有在母亲生前将手锡赠与母亲,所以手锡\n的所有权不属千甲母,A选项错误。本题中,手锡的\ne \n所有权人是明确的,手锡属于甲,不属于国家,也不属\n于乙村,CD选项错误。","k":"所有权与共有"},{"id":"2017-27","y":2017,"t":"单","s":"甲遗失一条项链,被乙拾得。丙从乙处偷走 项链,以1万元价格卖给不知情的丁并交付。现该项 链的所有权人是()。","o":["甲","乙","丙","丁"],"a":"A","e":"《民法典》第312条规定:\"所有权人或\n者其他权利人有权追回遗失物。该遗失物通过转让\n\n被他人占有的,权利人有权向无处分权人请求损害赔\n偿,或者自知道或者应当知道受让人之日起二年内向\n受让人请求返还原物;但是,受让人通过拍卖或者向\n具有经营资格的经营者购得该遗失物的,权利人请求\n返还原物时应当支付受让人所付的费用。权利人向\n受让人支付所付费用后,有权向无处分权人追偿。\"因\n此遗失物不适用善意取得制度。本题中项链是遗失\n物,甲是所有权人,丁不能根据善意取得获得项链的\n所有权。而且丁不是通过拍卖或者向具有经营资格\n的经营者购得该遗失物,甲无须支付丁购买项链的费\n用。A项正确。","k":"所有权与共有"},{"id":"2017-29","y":2017,"t":"单","s":"甲、乙、丙、丁共同出资购买一辆挖掘机,出资 比例分别为55%30%、10%5%。对该挖掘机的转让 ()。","o":["甲一人即可决定","甲、乙二人同意即可","经任意三人同意即可","必须经四人一致同意"],"a":"B","e":"《民法典》第301 条规定:\n\"处分共有的\n不动产或者动产以及对共有的不动产或者动产作重\n大修缮、变更性质或者用途的,应当经占份额三分之\n二以上的按份共有人或者全体共同共有人同意,但是\n共有人之间另有约定的除外。\"本题中,甲、乙、丙、丁\n共同出资购买挖掘机,甲、乙、丙、丁是按份共有人。\n对于处分该挖掘机的行为,应当经占份额三分之二以\n上的人同意。甲、乙二人的份额之和是85%,已经超\n过三分之二,因此甲、乙二人同意即可,B项正确。","k":"所有权与共有"},{"id":"2017-39","y":2017,"t":"单","s":"甲村与乙村设定的有关取水的权利属于(","o":["地役权","相邻权","租赁权","土地承包经营权"],"a":"A","e":"地役权是指不动产的权利人如所有权\n或使用权人,为自己使用不动产的便利或提高自己不\n动产的效益而利用他人不动产的权利,如通行权、取\n水权采光权、眺望权。地役权与相邻关系不同,地役\n权基于当事人之间的合同产生,相邻关系基千法律规\n定产生,地役权不以不动产相邻为条件,而相邻关系\n\n则以此为条件。本题中,甲村为了提高自己不动产的\n效益而利用乙村的水库,甲乙之间通过合同确立了地\n役权,A项正确。甲乙不是相邻权,乙村没有必须让\n甲村从水库取水的义务。","k":"所有权与共有"},{"id":"2018-37","y":2018,"t":"单","s":"甲、乙、丙三人按35% 、55% 、10%的份额共有 一艘渔船。乙、丙二人均有意卖掉渔船,甲坚决反对, 关千出卖渔船,下列选项正确的是( )。","o":["乙有权单独决定出卖渔船","乙、丙未经甲同意无权出卖渔船","乙、丙有权基千多数份额出卖渔船","乙、丙可以根据多数共有人同意出卖渔船"],"a":"B","e":"《民法典》第301条规定:\n\"处分共有的\n不动产或者动产以及对共有的不动产或者动产作重\n大修缮、变更性质或者用途的,应当经占份额三分之\n二以上的按份共有人或者全体共同共有人同意,但是\n共有人之间另有约定的除外。\"本题中,乙丙的份额共\n占共有份额的65%,没有达到三分之二,所以,乙丙未\n经甲同意无权出卖渔船。B项正确。","k":"所有权与共有"},{"id":"2019-29","y":2019,"t":"单","s":"甲、乙、丙三人以3:2:1的比例按份共有一 头骆驼,用于旅游服务。现甲欲将自己的份额转让给 丁,乙、丙均要求以同等条件购买。甲的份额应当 )。","o":["由丁购买","由乙、丙等额购买","由甲在乙和丙中指定一人购买","由乙、丙按所持份额比例购买"],"a":"D","e":"根据《民法典》的规定,当按份共有人\n转让自己的份额时,在同等条件下,其他共有人享有\n\n优先购买权。《民法典》所称的\n\" 同等条件\n\" ,应当综\n合共有份额的转让价格、价款履行方式及期限等因素\n确定。按份共有人转让其享有的共有的不动产或者\n动产份额的,应当将转让条件及时通知其他共有人。\n其他共有人应当在合理期限内行使优先购买权。两\n个以上其他共有人主张行使优先购买权的,协商确定\n各自的购买比例;协商不成的,按照转让时各自的共\n有份额比例行使优先购买权。因此,本题选D。","k":"所有权与共有"},{"id":"2019-36","y":2019,"t":"单","s":"作家甲的私人书信被乙收藏。对此,下列选 项正确的是(.)。","o":["书信著作权和书信原件所有权均归甲","书信著作权和书信原件所有权均归乙","书信著作权归甲,书信原件所有权归乙","书信著作权归乙,书信原件所有权归甲"],"a":"C","e":"根据我国《著作权法》的规定,著作权\n属于作者,本法另有规定的除外。本题中的书信著作\n权属于甲。甲的私人书信被乙收藏,书信原件所有权\n属于乙,但书信的著作权不随原件所有权转移而转\n移。因此本题选C。","k":"所有权与共有"},{"id":"2019-47","y":2019,"t":"多","s":"宋某和赵某分别住在同一栋住宅楼的一层和 二层。宋某在小区围墙与该楼之间自建平房,给住宅 楼造成严重的安全隐患。不久,宋某在平房内开办门 窗加工厂,加工生产的噪音严重干扰了赵某的正常生 活。对此,赵某有权要求宋某()。","o":["赔礼道歉","消除危险","恢复原状","停止侵害"],"a":"BCD","e":"相邻关系是指相互毗邻的不动产的所\n有人或者使用人因对不动产行使所有权或使用权而\n发生的权利义务关系。相邻关系本质上是对财产所\n有人或者占有人、使用人行使所有权或对占有、使用\n权的合理延伸和必要的限制。本题中,宋某和赵某的\n不动产相邻,宋某自建平房给住宅楼造成了安全隐\n患,同时由于开办加工厂产生的噪音也影响了赵某的\n生活,宋某侵犯了赵某的权利,赵某有权要求消除危\n险、恢复原状和停止侵害。选项A中的赔礼道歉是侵\n权人以口头或书面的形式向被侵权人承认错误、表示\n歉意,它主要适用于侵害自然人姓名权、名誉权、肖像\n权荣誉权以及法人的名称权、名誉权、荣誉权等。所\n以,本题选BCD。","k":"所有权与共有"},{"id":"2019-49","y":2019,"t":"多","s":"甲公司分期支付乙公司货款,可用于甲公司 向乙公司提供担保的财产有()。","o":["甲公司的职工班车","甲公司持有的丙公司股权","甲公司效益最好的分公司的厂房","甲公司与相邻丁公司存在争议的货场使用权"],"a":"ABC","e":"《民法典》第395条规定:\"债务人或者\n第三人有权处分的下列财产可以抵押:(一)建筑物\n和其他土地附着物;(二)建设用地使用权;(三)海\n域使用权;(四)生产设备、原材料、半成品、产品;\n(五)正在建造的建筑物、船舶、航空器;(六)交通运\n输工具;(七)法律、行政法规未禁止抵押的其他财\n产。抵押人可以将前款所列财产一并抵押。',《民法\n典》第399条规定:\"下列财产不得抵押:(一)土地所\n有权;(二)宅基地、自留地、自留山等集体所有的土\n地使用权,但法律规定可以抵押的除外;(三)学校、\n幼儿园、医疗机构等为公益目的成立的非营利法人的\n\n教育设施、医疗卫生设施和其他公益设施;(四)所有\n权使用权不明或者有争议的财产;(五)依法被查\n封、扣押、监管的财产;(六)法律、行政法规规定不得\n抵押的其他财产。\"因此,AC项可以抵押,D项财产有\n争议不可以抵押。《民法典》第440条规定:\"债务人\n或者第三人有权处分的下列权利可以出质:(一)汇\n票、本票、支票;(二)债券、存款单;(三)仓单、提单;\n(四)可以转让的基金份额、股权;(五)可以转让的\n注册商标专用权、专利权、著作权等知识产权中的财\n产权;(六)现有的以及将有的应收账款;(七)法律、\n行政法规规定可以出质的其他财产权利。\"因此B项\n可以设立质权的担保。本题选ABC。\n[特别说明]\nA项中,以公益为目的的非营利性\n学校、幼儿园、医疗机构、养老机构等提供担保的,人\n民法院应当认定担保合同无效。但以教育设施、医疗\n卫生设施养老服务设施和其他公益设施以外的不动\n产动产或者财产权利设立担保物权的情形除外。即\n以公益为目的的非营利性法人原则上不可以提供拒\n保,但如果是用公益设施以外的财产、权利去设立担\n保物权是允许的。(司法解释最新修改)","k":"所有权与共有"},{"id":"2020-23","y":2020,"t":"单","s":"甲物业公司委托乙清洁公司清洁其管理的某 住宅楼外墙,乙公司指派的员工丙因操作不当,致清 洁工具从高处掉落,砸中业主丁的汽车。丁的损害应 由()。","o":["甲公司承担责任","乙公司承担责任","甲公司和乙公司承担连带责任","乙公司和丙承担连带责任"],"a":"B","e":"}\n用人单位的工作人员因执行工作任务\n造成他人损害的,由用人单位承担侵权责任。丙作为\n乙公司的员工,其侵权行为应当由乙公司承担责任,B\n选项正确。","k":"所有权与共有"},{"id":"2020-32","y":2020,"t":"单","s":"下列选项中,专属于国家所有的是( )。","o":["土地","文物","野生动植物","无线电频谱资源"],"a":"D","e":"根据《民法典》的规定,城市的土地属\n于国家所有,城市郊区的土地和农村的土地,除由法\n律规定属于国家所有的以外,属于集体所有,A选项\n错误。法律规定属于国家所有的文物,属于国家所\n有,没有规定属于国家所有的文物,不属于国家所有,\nB选项错误。法律规定属于国家所有的野生动植物\n资源,属于国家所有,没有规定的,不属于国家所有,C\n选项错误。无线电频谱资源专属千国家所有,D选项\n正确。","k":"所有权与共有"},{"id":"2021-26","y":2021,"t":"单","s":"根据我国《民法典》规定,下列由业主共同决 定的事项中,应当经参与表决专有部分面积3/4以上 的业主且参与表决人数3/4以上的业主同意的是 ( )","o":["解聘物业服务企业","制定和修改管理规约","选举业主委员会","筹集建筑物的维修资金"],"a":"D","e":"《民法典》第278条规定:\n\" 下列事项由\n业主共同决定:(一)制定和修改业主大会议事规则;\n(二)制定和修改管理规约;(三)选举业主委员会或\n者更换业主委员会成员;(四)选聘和解聘物业服务\n企业或者其他管理人;(五)使用建筑物及其附属设\n施的维修资金;(六)筹集建筑物及其附属设施的维\n修资金;(七)改建、重建建筑物及其附属设施;\n(八)改变共有部分的用途或者利用共有部分从事经\n营活动;(九)有关共有和共同管理权利的其他重大\n事项。业主共同决定事项,应当由专有部分面积占比\n三分之二以上的业主且人数占比三分之二以上的业\n主参与表决。决定前款第六项至第八项规定的事项,\n应当经参与表决专有部分面积四分之三以上的业主\n且参与表决人数四分之三以上的业主同意。决定前\n款其他事项,应当经参与表决专有部分面积过半数的\n业主且参与表决人数过半数的业主同意。\"因此D项\n正确。","k":"所有权与共有"},{"id":"2021-38","y":2021,"t":"单","s":"A公司急需机床,因资金不足与B公司签订 合同,约定:B公司按照A公司的要求向C厂购买10 台机床出租给A公司,由C厂向A公司交付机床;租 金800万元,每年年末A公司向B公司支付80万元; 租赁期届满时,机床的所有权归A公司。该合同为 ( )","o":["融资租赁合同","借款合同","租赁合同","所有权保留的买卖合同"],"a":"A","e":"融资租赁合同,是指出租人根据承租人\n对出卖人、租赁物的选择,向出卖人购买出租物,提供\n给承租人使用,承租人支付租金的合同。\n本题中,B\n公司是出租人,根据承租人A公司的要求向出卖人C\n厂购买10台机床,提供给承租人A公司使用,A 公司\n支付租金。因此该合同属于融资租赁合同,A 项\n正确。","k":"所有权与共有"},{"id":"2025-21","y":2025,"t":"单","s":"甲到A 厂更换轮胎,双方约定更换4 个单价为800 元的轮胎。A 厂因疏忽为甲更换了4 个单价为1500 元的轮胎。后双方就增加的费用发生争议。A 厂更换轮胎的行为构成( )","o":["添附","无因管理","合同变更","违约行为"],"a":"D","e":"本题中A 厂因疏忽为甲更换错了轮胎,属于违约行为,D 项正确。双方没有就变\n更轮胎事宜达成一致意见,C 项错误。A 厂基于合同为甲更换轮胎,不属于无因管理,B 项错误。\n添附是指不同所有人的财产结合在一起形成一个新的财产,或者对他人财产进行加工从而产生\n一个新的财产的事实。本题是换错了轮胎,不是添附,A 项错误。本题选D。","k":"所有权与共有"},{"id":"2025-32","y":2025,"t":"单","s":"2020 年甲、乙结婚。2021 年乔迁新居时,乙将旧相框卖给丙。丙收到后发现相框内有 一个装有价值数千元纪念钞的信封,信封封面写有“甲收藏,2010 年”。该纪念钞应当属于( )","o":["甲所有","丙所有","甲与乙共有","甲与丙共有"],"a":"A","e":"纪念钞系甲婚前个人收藏,是甲的婚前财产,属于甲所有,A 项正确,C 项错误。\n乙无权处分该纪念钞,乙卖的是相框,未发现该纪念钞,该纪念钞属于隐藏物。隐藏物不能通\n\n过善意取得取得所有权,因此丙不能通过善意取得获得所有权,BD 项错误。本题选A。","k":"所有权与共有"},{"id":"2026-26","y":2026,"t":"单","s":"甲、乙系同一单元的上下楼邻居,该楼设有从一层到顶层的公共烟道。甲装 修房屋时,擅自改动公共烟道,导致乙做饭时无法正常排烟。甲的行为侵害了乙 的","o":["专有权,乙有权请求甲消除影响","共有权,乙有权请求甲恢复原状","居住权,乙有权请求甲赔偿损失","共同管理权,乙有权请求甲排除妨碍"],"a":"B","e":"楼道公共烟道属于业主建筑物区分共有部分,甲擅自改动侵害共有权,乙\n可请求恢复原状、排除妨碍。","k":"所有权与共有"},{"id":"2026-32","y":2026,"t":"单","s":"甲拾得一块手表,等待片刻未见失主即离开。后甲看到A 商店发布的“收购 二手手表”广告,将手表以1000 元的价格卖给A 商店。一年后失主乙偶然在A 商店发现了该手表。对此,下列说法正确的是","o":["乙只能请求甲返还手表","乙无权请求商店返还手表","乙有权请求商店无偿返还手表","乙有权请求商店返还手表,但应支付1000 元"],"a":"C","e":"拾得遗失物,拾得人无权处分卖给商店,商店不构成善意取得,失主有权\n无偿追回原物,无需支付价款。","k":"所有权与共有"},{"id":"2026-33","y":2026,"t":"单","s":"甲邀请乙聚餐,甲在丙商贩处购买海鲜,乙将海鲜交给饭店烹饪,饭店烹饪 时发现其中有一颗珍珠,该珍珠的所有权归属于","o":["甲","乙","丙","饭店"],"a":"A","e":"买卖海鲜,标的物交付后孳息归买受人甲,珍珠属于天然孳息,归甲所有。","k":"所有权与共有"},{"id":"2026-34","y":2026,"t":"单","s":"下列情形中,办理登记才能完成所有权转移的是","o":["甲的父亲在生前所立遗嘱中载明房屋由甲继承","乙起诉与配偶离婚,法院判决夫妻共同房屋归乙所有","丙的伯父因丙考上大学奖励其一套房屋","丁依法取得宅基地使用权后,在土地上自行建造一套房屋"],"a":"C","e":"赠与房屋属于基于法律行为物权变动,必须办理登记才发生所有权转移;\nA 遗嘱继承、B 法院判决、D 合法建造均为非基于法律行为,无需登记即取得所有\n权。","k":"所有权与共有"},{"id":"2026-35","y":2026,"t":"单","s":"甲、乙、丙共同出资100 万元购买一块巨型矿石,约定每个人享有权利的份 额为1/3。为了增加矿石的价值,甲主张对该矿石进行深加工,乙表示赞成,丙 表示反对。下列说法正确的是","o":["甲、乙有权加工矿石,因甲、乙所占份额为2/3","甲、乙仅在购买丙的份额后,才有权加工矿石","甲、乙无权加工矿石,因甲、乙、丙未达成一致","甲、乙仅在分割矿石后,才有权加工矿石"],"a":"A","e":"按份共有人改良重大修缮,经占份额2/3 以上同意即可,甲乙合计2/3,\n有权加工矿石。","k":"所有权与共有"}]},{"sub":"民法","name":"知识产权","w":2.0,"L":36,"qs":[{"id":"2005-38","y":2005,"t":"单","s":"根据我国《专利法》的规定,以下发明创造中不能授予专利权的是(   )","o":["饮料的配方","转基因大豆的生产方法","疾病治疗仪的制造方法","疾病的预防和治疗方法"],"a":"D","e":"根据专利法第25 条第1 款第3 项的规定,对疾病的诊断和治疗方法不授予专利权。因此,选项D\n应选。","k":"知识产权"},{"id":"2005-39","y":2005,"t":"单","s":"甲创作一小说已发表;乙经甲同意,将该小说改编成戏剧剧本,也已发表;丙表演该戏剧并由丁音像公司制作 成录 像制品出售,丁应(   )","o":["只向甲付酬","只向乙付酬","只向丙付酬","向甲、乙、丙付酬"],"a":"D","e":"在本案,甲是原作品著作权人,乙是改编作品著作权人,丙是表演者,丁是录音制作者。根据《著\n作权法》第39 条第2 款,由于丁使用乙编成的戏剧剧本,因此必须向乙和甲支付报酬;根据第40 条规定,丙表演,\n因此丁也应对其支付报酬。因此,选项D 应选。","k":"知识产权"},{"id":"2006-45","y":2006,"t":"单","s":"根据我国专利法规定,实用新型专利权的保护期限为(   )","o":["十年","十年","二十五年","五十年"],"a":"A","e":"发明的保护其为二十年,实用新型和外观设计为十年。","k":"知识产权"},{"id":"2006-46","y":2006,"t":"单","s":"根据我国著作权法规定,文字作品著作权产生的时间为(   )","o":["作品创作时","作品完成时","作品发表时","作品出版时"],"a":"B","e":"著作权自作品完成创作之日起产生并受法律保护。","k":"知识产权"},{"id":"2007-44","y":2007,"t":"单","s":"根据商标法规定,商标权的保护期限为 (   ) 。","o":["10 年","20 年","30 年","50 年"],"a":"A","e":"商标权的保护期限 \n- 15 -\n\n \n \n更多考研精品资料,关注淘宝店铺:光速考研工作室 \n]商标法规定,注册商标的有效期为 10 年,自核准注册之日起计算。故答案为 A。","k":"知识产权"},{"id":"2007-46","y":2007,"t":"单","s":"张三受甲厂委托为其开发一种新型节能灯,双方未约定专利申请权归属。其后,张三找来朋友李四帮助自己收 集和 整理资料。发明完成后,专利申请权属于 (   ) 。","o":["张三","甲厂","张三和甲厂","张三和李四"],"a":"A","e":"专利申请权 \n]专利法第 8 条规定,鼹个以上单位或者个人合作完成的发明创造、一个单位或者个人 \n接受其他单位或者个人委托所完成的发明创造,除另有协议的以外,申请专利的权利属于完 \n成或者共同完成的单位或者个人。由于甲厂和张三未约定专利申请权归属,而李四只是帮助 \n收集和整理材料,因此发明完成后,专利申请权属于张三。","k":"知识产权"},{"id":"2008-31","y":2008,"t":"单","s":"下列社会关系中,属于民事关系的是(  )","o":["用人单位与劳动者之间的关系","税务机关与纳税人之间的关系","发包人与设计单位之间的关系","专利授权机关与专利申请人之间的关系"],"a":"C","e":"选项A 属于劳动关系,由劳动法加以调整。选项B、D 的关系属于行政机关与行政相对人之间的行政\n法律关系。选项C 属于平等主体之间的财产关系,属于民事法律关系的范畴。","k":"知识产权"},{"id":"2008-54","y":2008,"t":"多","s":"根据专利法规定,发明和实用新型取得专利权必须具备的条件有(     )。","o":["新颖性","创造性","实用性","先进性"],"a":"ABC","e":"答案]根据《专利法》第22 条第1 款,授予专利权的发明和实用新型,应当具备新颖性、创造性和实用\n性,故选项A、B、C 应选。另外,根据《专利法》第23 条,授予专利权的外观设计,应当同申请日以前在国内外出\n版物上公开发表过或者国内公开使用过的外观设计不相同和不相近似,并不得与他人在先取得的合法权利相冲突。","k":"知识产权"},{"id":"2009-45","y":2009,"t":"单","s":"根据商标法规定,商标权的主体是(    )。","o":["商标注册人","商标设计人","商标制作人","商标使用人"],"a":"A","e":"本题考查商标权的主体。根据《商标法》第3 条规定,经商标局核准注册的商标为注册商标,包\n括商用商标、服务商标和集体商标、证明商标;商标注册人享有商标专用权,受法律保护。因此本题答案为A","k":"知识产权"},{"id":"2009-54","y":2009,"t":"多","s":"根据著作权法规定,邻接权的具体类型包括(      )","o":["出版者的权利","表演者的权利","录音制作者的权利","播放者的权利"],"a":"ABCD","e":"本题考查领接权,领接权是指作品传播者所享有的权利。在我国《著作权法》中,领接权包括出\n版者权、表演者权、录制权和广播电视组织权。因此本题答案为ABCD","k":"知识产权"},{"id":"2011-28","y":2011,"t":"单","s":"工程师甲在本职工作范围内,利用单位的物 质技术条件,创作完成了一项由单位承担责任的产品 设计图。根据法律规定,下列表述正确的是()。","o":["该设计图的著作权由甲与其所在的单位共同 享有","该设计图的著作权归属由甲与其所在单位协 商决定","该设计图的著作权由甲享有,甲的单位在业务 范围内有两年优先使用权","该设计图由甲享有署名权,由甲的单位享有 著作权的其他权利"],"a":"D","e":"本题考查的是职务作品的著作权归属。\n《著作权法》第16 条第2 款规定,主要是利用法人或\n者其他组织的物质技术条件创作,并由法人或者其他\n组织承担责任的工程设计图、产品设计图、地图、计算\n机软件等职务作品,作者享有署名权,著作权的其他\n权利由法人或者其他组织享有,法人或者其他组织可\n以给予作者奖励。本题中的产品设计图属于职务作\n品,故甲享有署名权,甲的单位享有著作权的其他权\n利,答案选D。考生应将此与职务发明相区别,职务\n发明的对象是发明创造,职务发明创造申请专利的权\n利属于单位,申请被批准后,该单位为专利权人。但\n若单位与发明人或设计人订有合同,对申请专利的权\n利和专利权的归属作出约定的,从其约定。","k":"知识产权"},{"id":"2011-30","y":2011,"t":"单","s":"下列行为中,构成侵犯专利权的是( )。","o":["专为科学研究和实验而使用有关专利","购买合法销售的专利产品后再转卖给他人","临时过境的运输工具依互惠原则为自身需要 在其设备中使用有关专利","为生产经营目的使用不知道是未经专利人许 可而制造并售出的专利产品"],"a":"D","e":"法律规定下列行为不视为侵犯专利权:\n(1) 专利权用尽后的使用、许诺销售、销售和进口。\n专利产品或者依照专利方法直接获得的产品,由专利\n权人或者经其许可的单位、个人售出后,使用、许诺销\n售销售和进口该产品的行为不视为侵犯专利权。\n(2) 在先使用。(3) 临时过境的外国运输工具的使\n用。(4) 科学研究为目的的使用。(5) 医药与医疗\n器械的行政审批为目的的使用。.A选项的情形属于\n第4 种情况,B选项的情形属于第1 种情况,C选项的\n情形属于第3 种情况,故答案选D,构成侵犯专利权。","k":"知识产权"},{"id":"2011-32","y":2011,"t":"单","s":"下列选项中,可以作为商标注册的是()。","o":["“锐利”牌剪刀","“耐穿”牌皮鞋","“蝴蝶”牌缝纫机","“精粉”牌馒头"],"a":"C","e":"根据《商标法》的规定,下列标志不得\n作为商标注册:(1) 仅有商品的通用名称、图形、型号\n的。(2)仅直接表示商品的质量、主要材料、功能、用\n途、重量、数量及其他特点的。(3) 缺乏显著特征的。\n\n本题中,\"锐利\n\" 牌剪刀、\"耐穿\n\" 牌皮鞋、\"精粉\n\" 牌慢\n头都直接地表示了商品的质量或者是材料,不可以作\n为商标注册,故答案选C。","k":"知识产权"},{"id":"2012-33","y":2012,"t":"单","s":"甲创作的话剧剧本《秋日的私语》千2009年 发表,乙话剧团经甲许可获得该剧本的表演权。2010 年丙话剧团也欲使用该剧本演出,丙话剧团( )。","o":["应经甲许可并支付报酬","应经乙话剧团许可并支付报酬","无须经甲或乙话剧团许可,但须向甲支付报酬","应经甲与乙话剧团共同许可,并向甲、乙话剧 团支付报酬"],"a":"A","e":"本题中,甲拥有话剧剧本《秋日的私\n语》的著作权,如果丙剧团要使用该剧本,需要经甲许\n可,并支付报酬。故选A。假如丙是一家录像公司,\n需要利用乙的表演录制光盘,则需要经过甲乙的同意\n并支付报酬。","k":"知识产权"},{"id":"2012-34","y":2012,"t":"单","s":"下列选项中,属于邻接权客体的是( )。","o":["计算机软件","即兴演讲","具有独特造型的建筑物","瑜伽录像制品"],"a":"D","e":"邻接权又称作品传播者权,是指作品传\n播者对在传播作品过程中产生的成果依法享有的专有\n权利。邻接权包括:出版者的权利、表演者的权利、录\n音制作者的权利、播放者的权利。本题中,只有瑜伽录\n像制品享有邻接权。故选D。邻接权客体通常并非著\n作权客体本身。注意邻接权与著作权的区别。","k":"知识产权"},{"id":"2012-35","y":2012,"t":"单","s":"在发明专利申请文件中,确定专利权保护范 围的主要依据是( )。","o":["说明书","说明书摘要","请求书","权利要求书"],"a":"D","e":"《专利法》规定,发明或者实用新型专\n利权的保护范围以其权利要求的内容为准,说明书及\n附图可以用于解释权利要求的内容。因此权利要求\n书是确定专利保护范围的主要依据。故选D。","k":"知识产权"},{"id":"2012-36","y":2012,"t":"单","s":"甲与乙均为丙研究所的工作人员,二人受丁 公司委托利用业余时间合作研发了一种新型电池,各 方未就专利申请权的归属作出约定。该发明的专利 申请权应属于( )。","o":["甲与乙","丙研究所","甲、乙和丙研究所","丁公司"],"a":"A","e":"《专利法》规定,两个以上单位或者个\n人合作完成的发明创造、一个单位或者个人接受其他\n\n单位或者个人委托完成的发明创造,除另有协议的以\n外,申请专利的权利属于完成或者共同完成的单位或\n者个人,故选A。申请被批准后,申请的单位或者个\n人为专利权人。","k":"知识产权"},{"id":"2012-37","y":2012,"t":"单","s":"根据我国商标法的规定,注册商标的有效期 为10年,其起算点为( )。","o":["商标公告之日","商标核准注册之日","申请人提出商标注册申请之日","商标局收到商标注册申请之日"],"a":"B","e":"《商标法》规定,注册商标的有效期为\n10年,自核准注册之日起计算。(这里要注意专利权\n的期限,在我国,发明专利权的期限是20年,实用新\n型和外观设计的专利权的期限是10年,均自申请日\n起计算。)","k":"知识产权"},{"id":"2013-37","y":2013,"t":"单","s":"下列申请注册的商标,不符合我国商标法规 定的是()。","o":["“仙山”牌药品商标","“奔月”牌电脑商标","“耐用”牌家具商标 )","“暖阳”牌毛巾商标"],"a":"C","e":"根据我国《商标法》,下列标志不得作\n为商标注册:(1)有本商品的通用名称、图形、型号\n的;(2)仅仅直接表示商品的质量、主要原料、功能、\n用途重量数量及其他特点;(3)缺乏显著特征的。\n上述标志经过使用取得显著特征,并便于识别的,可\n以作为商标注册。C选项中的\n\"耐用\n\" 二字突出了家\n具的质量,不符合商标注册的要求,故答案应该选C。","k":"知识产权"},{"id":"2013-38","y":2013,"t":"单","s":"甲创作了一首歌曲,乙经甲授权后演唱并将 该首歌曲收录在由丙公司为其录制的唱片中。丁网 站未经任何人许可,擅自将该唱片中的所有歌曲上传 供网民免费下载。根据我国著作权法规定,丁网站 ( )。","o":["侵犯了甲、乙的发表权","侵犯了乙、丙的播放权","侵犯了甲、乙、丙的复制权","侵犯了甲、乙、丙的信息网络传播权"],"a":"D","e":"由于著作权具有权利自动产生的特点,\n因此在歌曲创作完成时,甲无须任何手续,自动获得\n了歌曲的著作权;乙在经过甲授权后演唱该歌曲,是\n歌曲的演绎、表演者,乙作为作品的传播者享有邻接\n权\n表演者权;丙作为歌曲的录制者获得了传播作\n品过程中产生的另一个邻接权——录音制作者权利。\n尽管享有的权利不一样,但是甲、乙、丙都享有许可他\n人复制、发行、出租、通过信息网络向公众传播并获得\n报酬的权利。丁网站私自上传歌曲供他人下载的行\n为则侵犯了他们的信息网络传播权。所以答案应该\n选择D。","k":"知识产权"},{"id":"2015-34","y":2015,"t":"单","s":"甲在《雾都》杂志发表了一部小说,未作版权 声明。某读者阅读后十分喜欢,遂推荐给《传奇文摘》 杂志社。《传奇文摘》杂志社若转载该小说,则()。","o":["不必经甲同意,但应向甲支付稿酬","必须经甲同意,但不必向甲支付稿酬","不必经《雾都》杂志社同意,但应向其支付 稿酬","必须经《雾都》杂志社同意,但不必向其支付 稿酬"],"a":"A","e":"本题考查的是著作权的法定许可。著\n作权的法定许可包括作品刊登后,除著作权人声明不\n得转载摘编的外,其他报刊可以转载或者作为文摘、\n资料刊登,但应当按照规定向著作权人支付报酬。本\n题中,甲在《雾都》杂志发表的小说,未作版权声明,因\n此《传奇文摘》杂志社若转载该小说,则不必经甲同\n意,但应向甲支付报酬,A选项正确,BCD选项错误。","k":"知识产权"},{"id":"2016-30","y":2016,"t":"单","s":"甲购得某画家创作的一幅油画。根据我国著 作权法,甲获得该作品的()。","o":["著作权","复制权","修改权","原件展览权"],"a":"D","e":"《著作权法》第18条规定:\"美术等作\n品原件所有权的转移,不视为作品著作权的转移,但\n美术作品原件的展览权由原件所有人享有。\"\n本题中,甲购买某画家创作的一幅油画,该油画\n原件所有权发生转移,但是著作权不发生转移,著作\n权中的修改权、复制权不发生转移,只有原件展览权\n发生转移,由原件所有人即甲享有,D选项正确,ABC\n选项错误。","k":"知识产权"},{"id":"2016-47","y":2016,"t":"多","s":"下列行为中,构成侵犯商标权的有()。","o":["甲销售伪造的注册商标标识","乙擅自制造他人注册商标标识","丙未经商标注册人同意,更换其注册商标并将 该更换商标的商品又投人市场","丁在类似商品上,将与他人注册商标近似的 标志作为商品装潢使用,误导公众"],"a":"ABCD","e":"《商标法》第57 条规定:\"有下列行为\n\n之一的,均属侵犯注册商标专用权:(一)未经商标注\n册人的许可,在同一种商品上使用与其注册商标相同\n的商标的;(二)未经商标注册人的许可,在同一种商\n品上使用与其注册商标近似的商标,或者在类似商品\n上使用与其注册商标相同或者近似的商标,容易导致\n混淆的;(三)销售侵犯注册商标专用权的商品的;\n(四)伪造、擅自制造他人注册商标标识或者销售伪\n造、擅自制造的注册商标标识的;(五)未经商标注册\n人同意,更换其注册商标并将该更换商标的商品又\n投入市场的;(六)故意为侵犯他人商标专用权行为\n提供便利条件,帮助他人实施侵犯商标专用权行为\n的;(七)给他人的注册商标专用权造成其他损\n害的。\"\nA、B选项的行为是第57条的第(四)项,C选\n项的行为是第57条的第(五)项,D选项的行为是\n第57条的第(二)项,均属于侵犯注册商标专\n用权。","k":"知识产权"},{"id":"2019-38","y":2019,"t":"单","s":"甲汽车公司委托乙建筑设计公司设计4S店, 合同未约定著作权条款。后丙汽车公司请人仿照甲 公司的这家4S店建造了一家汽车美容店,并办理了 著作权登记。丙公司侵犯了()。","o":["甲公司的复制权","乙公司的复制权 又","甲公司的商誉权","乙公司的版式设计权"],"a":"B","e":"《著作权法》第17条规定:\"受委托创\n作的作品,著作权的归属由委托人和受托人通过合同\n约定。合同未作明确约定或者没有订立合同的,著作\n权属于受托人。\"本题中,甲公司是委托人,乙公司是\n受托人,由于甲和乙没有约定著作权的归属,因此,著\n作权属于乙,为此排除A和C。版式设计权是出版者\n的权利,属于邻接权的范畴,排除D。丙汽车公司仿\n照乙公司的建筑设计建造了汽车美容店,侵犯了乙公\n司的复制权。本题选B。","k":"知识产权"},{"id":"2019-50","y":2019,"t":"多","s":"下列知识产权中,对其法律保护没有时间限 制的有()。","o":["甲公司的保密除虫剂配方","乙制作的电影《问道昆仑》","丙企业的驰名商标“云南白药及图”","丁行业协会的“阳澄湖大闸蟹”地理标志 三、简答题:第51~54小题,每小题10 分"],"a":"AD","e":"A项的保密除虫剂配方是商业秘密,商\n业秘密的保护期限,没有时间限制,A项当选。B项\n中的发表权、财产权法律保护有时间限制,不选。商\n标是有保护期限的,驰名商标也属于商标的一种,保\n护期限也不例外,C项不选。D项只是地理标志,不\n是商标,对其法律保护没有时间限制,D项当选。本\n题选AD。\n三、简答题","k":"知识产权"},{"id":"2020-37","y":2020,"t":"单","s":"我国专利法对发明和实用新型采用的新颖性 标准是()。","o":["绝对新颖性标准","绝对新颖性为主,相对新颖性为补充","相对新颖性标准","相对新颖性为主,绝对新颖性为补充"],"a":"A","e":"我国在新颖性标准上采用的是绝对新\n颖性标准,具体要求是:该发明或者实用新型不属于\n现有技术;也没有任何单位或者个人就同样的发明或\n者实用新型在申请日以前向国务院专利行政部门提\n出过申请,并记载在申请H以后公布的专利申请文件\n或者公告的专利文件中。A选项正确。","k":"知识产权"},{"id":"2021-32","y":2021,"t":"单","s":"根据我国《专利法》规定,外观设计专利权的 保护范围(","o":["以申请文件的内容为准","以表示在图片或者照片中的该产品的外观设 计为准","以权利要求的内容为准","以说明书记载的内容为准"],"a":"B","e":"《专利法》第64条第2款规定:\"外观\n设计专利权的保护范围以表示在图片或者照片中的\n该产品的外观设计为准,简要说明可以用于解释图片\n或者照片所表示的该产品的外观设计。\"B项正确。","k":"知识产权"},{"id":"2021-33","y":2021,"t":"单","s":"甲受所在单位委托,创作了雕塑《峰》。乙在 拍卖会上购得该雕塑后,捐赠给某高校。雕塑《峰》的 著作权人是( )","o":["甲的所在单位","某高校","甲","乙"],"a":"C","e":"《著作权法》第19条规定:\"受委托创\n作的作品,著作权的归属由委托人和受托人通过合同\n约定。合同未作明确约定或者没有订立合同的,著作\n权属于受托人。\"本题中,甲受所在单位委托,创作了\n雕塑,合同中未约定著作权,因此著作权属于受托人\n甲,C项正确。","k":"知识产权"},{"id":"2021-50","y":2021,"t":"多","s":"下列选项中,可以作为台灯注册商标的有","o":["“照明 ”牌","“轻风” 牌","“ 金榜” 牌","\"护眼” 牌 三、简答题:第51~ 54小题,每小题10 分"],"a":"BC","e":"《商标法》第9条规定:\n\"申请注册的商\n标,应当有显著特征,便千识别,并不得与他人在先取\n得的合法权利相冲突。商标注册人有权标明\n'注册商\n标\n'或者注册标记。\n\" 本题中,AD项不具有显著特征,\n\n不能成为台灯的注册商标。BC项具有显著特征,便\n于识别,可以作为台灯注册商标。本题选BC。\n三、简答题","k":"知识产权"},{"id":"2022-27","y":2022,"t":"单","s":"W公司(国有独资公司)和X设计院签订了技术咨询合同。受托方X设计院在履行 合同过程中,利用W公司提供的技术资料和工作条件完成了一项新的技术成果。双方 对此类新技术成果归属未作约定,该成果依法属于","o":["X设计院","W公司","X设计院和W公司","国家"],"a":"A","e":"《民法典》第885条规定:\"技术咨询合\n同、技术服务合同履行过程中,受托人利用委托人提\n供的技术资料和工作条件完成的新的技术成果,属于\n受托人。委托人利用受托人的工作成果完成的新的\n技术成果,属于委托人。当事人另有约定的,按照其\n约定。\"受托人X设计院在履行合同过程中,利用委托\n人W公司提供的技术资料和工作条件完成了一项新\n的技术成果。双方对此类新技术成果归属未作约定,\n该成果依法属于受托人X设计院。A选项正确。","k":"知识产权"},{"id":"2022-38","y":2022,"t":"单","s":"著作权人以有线或者无线方式向公众提供作品,使公众可以在其选定的时间和地 点获得作品的权利是","o":["展览权","发行权","广播权","信息网络传播权"],"a":"D","e":"展览权是指公开陈列美术作品、摄影作\n品的原件或者复制件的权利。发行权是指以出售或\n者赠与方式向公众提供作品的原件或者复制件的权\n利。广播权是指以无线方式公开广播或者传播作品,\n以有线传播或者转播的方式向公众传播广播的作品,\n以及通过扩音器或者其他传送符号、声音、图像的类\n似工具向公众传播广播的作品的权利,但不包括信息\n网络传播权。上述三种方式具有局限性,均无法使公\n众在其自行选定的时间和地点获得作品。ABC选项\n错误。信息网络传播权是指以有线或者无线方式向\n公众提供作品,使公众可以在其个人选定的时间和地\n点获得作品的权利。D选项正确。","k":"知识产权"},{"id":"2022-47","y":2022,"t":"多","s":"下列选项中,属于知识产权客体的有","o":["地理标志","植物新品种","商业秘密","集成电路布图设计"],"a":"ABCD","e":"知识产权是指民事主体对创造性智力\n成果依法享有的权利的总称。知识产权有广义和狭\n义之分。广义的知识产权是权利人依法就下列客体\n享有的专有的权利:(1)作品;(2)发明、实用新型、\n规定的其他客体。狭义的知识产权,即传统意义上的\n知识产权,包括著作权、专利权、商标权三个组成部\n分,其中的专利权与商标权合称工业产权。故本题选\n择ABCD。","k":"知识产权"},{"id":"2025-35","y":2025,"t":"单","s":"A 公司是B 公司的全资子公司,注册地在M 国,主要营业机构位于我国某市。现A 公 司对C 公司负债700 万元。该债务应当( )","o":["以A 公司的全部财产清偿","由A 公司与B 公司承担连带清偿责任","仅以A 公司主要营业机构的全部财产清偿","先由A 公司清偿,再由B 公司对A 公司不能清偿的部分承担补充责任"],"a":"A","e":"《民法典》第60 条规定:\"法人以其全部财产独立承担民事责任。\"本题中,A 公\n司是B 公司的全资子公司,是法人,应以其全部财产独立承担民事责任,其债务应以自己的全\n部财产清偿,A 项正确,C 项错误。B 公司作为母公司,既不承担连带责任,也不承担补充责\n任,BD 项错误。本题选A。","k":"知识产权"},{"id":"2025-38","y":2025,"t":"单","s":"甲向乙借款2 万元,制作了一部网络微电影,同时利用拍摄过程中收集的素材,剪辑 制作了一部纪录片。对此,下列说法正确的是( )","o":["网络微电影属于视听作品,甲享有著作权","网络微电影属于摄影作品,甲和乙共同享有著作权","纪录片属于摄影作品,甲享有著作权","纪录片属于视听作品,甲和乙共同享有著作权"],"a":"A","e":"网络微电影属于《著作权法》规定的视听作品,其著作权由制作者享有。甲是网\n络微电影的制作者,因此甲享有著作权,A 项正确。纪录片同样属于视听作品,而非摄影作品。\n甲利用拍摄素材剪辑制作纪录片,甲是制作者,享有著作权。乙不参与创作,不享有著作权。\n\nBCD 项错误。本题选A。","k":"知识产权"},{"id":"2026-29","y":2026,"t":"单","s":"A 服装公司与B 公司签订商标普通使用许可合同,许可B 公司使用A 公司的注 册商标。C 公司大量购入B 公司生产的服装,将商标更换为自己的商标后对外销 售。对此,下列说法正确的是","o":["A 公司有权请求C 公司采取召回措施","B 公司有权请求C 公司赔偿损失","C 公司的行为侵害A 公司的注册商标专用权","C 公司的行为构成对A 公司商业标识的仿冒"],"a":"C","e":"C 公司购入他人商品更换商标出售,属于反向假冒,侵犯注册商标专用权;\n普通被许可人B 无权单独起诉;A 公司可主张赔偿而非召回。","k":"知识产权"},{"id":"2026-46","y":2026,"t":"多","s":"甲系某科研机构研究员,为完成单位规定的科研任务,2024 年撰写5 篇学术 论文,已发表3 篇。对此,说法正确的有","o":["5 篇论文均为职务作品","对于已发表的3 篇,甲享有修改权","对于未发表的2 篇,甲不享有著作权","对于已发表的3 篇,甲所在单位有权在其业务范围内优先使用"],"a":"ABD","e":"为完成单位工作任务创作均为职务作品;作者永久享有署名、修改等人身\n权;单位享有业务范围内优先使用权;未发表作品著作权仍归作者,C 错误。","k":"知识产权"}]},{"sub":"民法","name":"婚姻家庭","w":1.4,"L":26,"qs":[{"id":"2006-34","y":2006,"t":"单","s":"某甲出生后不久,父母协议离婚。引起某甲与其父母之间抚养关系发生及甲之父母婚姻关系解除的法律事实分 别是(   )","o":["事件、事件","行为、行为","事件、行为","行为、事件"],"a":"C","e":"甲的出生为不以人的意志为转移的事件,而甲的父母离婚时以人的意志为转移的民事行为。应选C。","k":"婚姻家庭"},{"id":"2006-48","y":2006,"t":"单","s":"在夫妻双方没有约定时,婚姻关系存续期间所得的下列财产中属于夫妻共同财产的是(   )","o":["一方专用的生活用品","一方的婚前财产","一方身体受到伤害获得的医疗费","一方的知识产权收益"],"a":"D","e":"《婚姻法》规定夫妻在婚姻关系存续期间所得的下列财产,归夫妻共同所有: 1工资、奖金2生产、\n经营的收益3知识产权的收益4继承或赠与所得的财产,但本法第18 条第3 项规定的除外5其他应当归共同所有的\n财产。夫妻对共同所有的财产,有平等的处理权。","k":"婚姻家庭"},{"id":"2006-53","y":2006,"t":"多","s":"某甲 5 岁,父母离异后由其母抚养。某日,某甲在幼儿园午餐时与小朋友某乙发生打斗,在场的带班教师某丙 未及时制止。某甲将某乙推到在地,造成某乙骨折,花去医药费 3000 余元。对某乙的损失(       )","o":["之母应承担赔偿责任","如果某甲之母独立承担责任确有困难,某甲之父应承担赔偿责任","幼儿园应给予适当赔偿","某丙应承担连带赔偿责任"],"a":"ABC","e":"《民法通则》特殊侵权责任关于被监护人致人损害的民事责任由监护人承担;幼儿园、学校或精神\n\n \n \n更多考研精品资料,关注淘宝店铺:光速考研工作室 \n病医院和医院治疗的被监护人为监护人时上述机构有过错的应承担与其过错相应的责任。甲母和甲夫作为监护人承\n担责任,丙作为幼儿园工作人员有过错由其单位承担责任。","k":"婚姻家庭"},{"id":"2007-47","y":2007,"t":"单","s":"在我国,结婚的必备条件之一是 (   ) 。","o":["双方不得有血亲关系","双方完全自愿","双方签订婚约","男方在 25 周以上,女方在 23 周岁以上"],"a":"B","e":"结婚的必备条件 \n]根据婚姻法的规定,结婚的必备条件有三项: (1)男女双方当事人完全自愿; (2)结婚当 \n事人必须达到法定婚龄,即男不得早于 22 周岁,女不得早于 20 周岁;(3)必须符合一夫一 \n妻制的规定。故答案为 B。有血亲关系属于禁止条件,非必备条件,因此 A 项不符合要求。","k":"婚姻家庭"},{"id":"2007-48","y":2007,"t":"单","s":"甲 ( 女, 8 周岁 ) 之父病故后,甲母一人抚养甲及其弟、妹,备感艰辛,遂决定将甲送与他人收养。依我国 收 养法规定,下列人员中可以作为收养人的的是 (   ) 。","o":["乙,女, 29 周岁,夫婚,无子女,有抚养能力","丙,男, 45 周岁,离婚,无子女,有抚养能力","丁,女, 38 周岁,丧偶,无子女,有抚养能力","戊,女, 42 周岁,已婚,一子已上大学,有抚养能力"],"a":"C","e":"收养人的条件 \n]根据收养法的规定,收养人应当同时具备下列条件: (1)无子女; (2)有抚养教育被收养 \n人的能力;(3)未患有在医学上认为不应当收养子女的疾病;(4)年满 30 周岁。另外,无配偶 \n的男性收养女性的,收养人与被收养人的年龄应当相差 40 周岁以上。根据上述条件,C 项 \n的丁符合要求。","k":"婚姻家庭"},{"id":"2011-34","y":2011,"t":"单","s":"根据《婚姻法》的规定,法院审理离婚案件,准 予离婚的情形是()。","o":["夫妻感情确已破裂","婚姻关系确已破裂","一方有过错","双方已就子女抚养和财产分割协商一致"],"a":"A","e":"根据《民法典》规定,人民法院审理离\n婚案件,应当进行调解;如感情确已破裂,调解无效\n的,应当准予离婚。据此,人民法院判决离婚需要有\n两个前提条件,即\n\" 感情确已破裂\n\" 和\n\"调解无效\n\"。\n其中,调解无效是程序性条件,感情确已破裂是实质\n性条件,是法院判决离婚的唯一法定理由,所以答案\n选A。","k":"婚姻家庭"},{"id":"2011-35","y":2011,"t":"单","s":"根据《婚姻法》的规定,离婚时,原为夫妻共同 生活所负的债务,应当共同偿还;共同财产不足清偿 的,其处理办法是(.)。","o":["双方不再负清偿责任","由双方协议清偿;协议不成时,由人民法院 判决","由双方协议清偿;协议不成时,依法由双方各 清偿一半","由双方协议清偿;协议不成时,依法由经济条 件较好的一方清偿"],"a":"B","e":"根据法律规定,离婚时,夫妻共同债务,\n应当共同偿还。共同财产不足清偿或者财产归各自\n所有的,由双方协议清偿;协议不成的,由人民法院判\n决。故答案选B。离婚的法律后果是考试的一个重\n要考点考生应细致掌握,它包括离婚在当事人身份\n方面的后果、离婚在当事人财产方面的后果、离婚在\n父母子女关系方面的后果以及离婚时的救济方式。","k":"婚姻家庭"},{"id":"2011-37","y":2011,"t":"单","s":"下列情形中,收养关系有效的是( )。","o":["29周岁的某单身女子收养1周岁的孤儿","44周岁的某单身男子收养5周岁的女孩","46.周岁的某单身女子收养12周岁的男孩","48周岁的某男与妻子生育一女后共同收养父 母尚健在的2周岁男孩"],"a":"D","e":"原答案为C)\n收养关系一般会涉及三方当事人,即被\n收养人、收养人、送养人。《民法典》对这三方当事人\n应具备的条件分别作出了规定。其中,收养人应当同\n时具备下列条件:(1)无子女或者只有一名子女;\n(2)有抚养教育和保护被收养人的能力;(3)未患\n有在保学上认为小应当收养子女的疾病;(4)尤不利\n于被收养人健康成长的违法犯罪记录;(5)年满30\n周岁.,故据此排除A\"《民法典》第1102条规定:\"尤\n配偶者收养异性子女的,收养人与被收养人的年龄应\n当相差四十周岁以l...。\"故BC坝排除。\n本题原答案为C,因为根据《收养法》的规定,一\n般情况下只有无子女的收养人才可以收养。但《民法\n典》对收养人的条件进行了修改,只有一名子女的收\n养人也可以再收养一名子女,无子女的收养人可以收\n养两名子女。因此根据《民法典》的规定,D 项也是正\n确的。因此本题答案为D。\n考生需注意,根据《民法典》的规定,下列未成年\n人,可以被收养:(I) 丧失父母的孤儿;(2) 查找不到\n生父母的未成年人;(3)生父母有特殊困难无力抚养\n的子女。D 选项中,虽然父母健在,但若父母有特殊\n困难无力抚养子女,仍符合收养的条件。","k":"婚姻家庭"},{"id":"2011-38","y":2011,"t":"单","s":"养子女与生父母之间的权利义务关系因收养 关系的成立而( )。","o":["中止","中断","延缓","解除"],"a":"D","e":"收养的效力包括:(I) 自收养关系成立\n之日起,养父母与养子女间的权利义务关系,适用《民\n法典》关于父母子女关系的规定。(2)养子女与养父\n母的近亲属间的权利义务关系,适用《民法典》关千子\n女与父母的近亲属关系的规定。(3)养子女与生父\n母以及其他近亲属间的权利义务关系,因收养关系的\n成立而消除。答案选D。","k":"婚姻家庭"},{"id":"2011-49","y":2011,"t":"多","s":"甲与妻子乙育有一子一女,儿子与其妻丁生 有一子戊,儿子于2005年遇车祸死亡。儿子去世后, 甲、乙老无生活来源,女儿丙拒不赡养,甲、乙主要由 再婚的丁供养。甲于2010年3月死亡,留下房屋3 间。依照继承法的规定,可以参加第一顺序继承的人 有()。","o":["乙","丙","丁","戊"],"a":"ABCD","e":"根据《民法典》规定,第一顺序继承人\n包括配偶、子女、父母。乙是甲的配偶,故当然是第一\n顺序继承人。根据《民法典》规定,被继承人的子女先\n于被继承人死亡的,由被继承人的子女的晚辈直系血\n亲代位继承。甲的儿子早于其去世,故甲之孙戊应代\n位继承,成为第一顺序继承人。根据《民法典》规定,\n丧偶儿媳对公婆,丧偶女婿对岳父母,尽了主要赡养\n义务的,作为第一顺序继承人。因此丁也是第一顺序\n继承人。对于丙,尽管根据《民法典》规定,有抚养能\n力和有抚养条件的继承人,不尽抚养义务的,分配遗\n产时,应当不分或者少分,但该规定没有完全、确定地\n剥削丙的继承资格,因此丙依然是第一顺序继承人。","k":"婚姻家庭"},{"id":"2012-38","y":2012,"t":"单","s":"没有配偶且符合其他结婚条件的男女同居生 活的,如果当事人向法院起诉请求解除同居关系,人 民法院( )。","o":["按离婚处理","不予受理","按解除同居关系处理","对有子女的按离婚处理"],"a":"B","e":"根据司法解释的规定,当事人起诉请求\n解除同居关系的,人民法院不予受理。但当事人请求\n解除的同居关系,属于\n\" 有配偶者与他人同居\n\"的,人\n民法院应当受理并依法予以解除。当事人因同居期\n间财产分割或者子女抚养纠纷提起诉讼的,人民法院\n应当受理。本题中的情况,不属于\n\" 有配偶者与他人\n同居\n\",所以当事人向法院起诉请求解除同居关系的,\n人民法院不予受理。故选B。","k":"婚姻家庭"},{"id":"2012-39","y":2012,"t":"单","s":"无配偶的男性收养女性的,收养人与被收养 人之间的年龄差应当为( )。","o":["30周岁以上","35周岁以上","40周岁以上","45周岁以上"],"a":"C","e":"《民法典》第1102条规定:\"尤配偶者\n收养异性子女的,收养人与被收养人的年龄应当相差\n四十周岁以上。\"故选C。","k":"婚姻家庭"},{"id":"2012-40","y":2012,"t":"单","s":"未成年养子女与养父母解除收养关系的,其 与生父母之间的权利义务关系( )。","o":["自行恢复","经人民法院判决后恢复","经生父母同意后恢复","经生父母与养父母协商同意后恢复"],"a":"A","e":"根据《民法典》第1117条的规定,收养\n关系解除后,养子女与养父母以及其他近亲属间的权\n利义务关系即行消除,与生父母以及其他近亲属间的\n权利义务关系自行恢复。但是,成年养子女与生父母\n以及其他近亲属间的权利义务关系是否恢复,可以协\n商确定。\n二、多项选择题","k":"婚姻家庭"},{"id":"2014-35","y":2014,"t":"单","s":"甲婚后通过网聊结识乙,并与之发生婚外情, 被甲妻发现。甲妻诉至法院,以甲违反忠实义务为由 请求赔偿精神损害10万元,但未请求离婚。对于本 案,人民法院()。","o":["应当受理","不予受理","根据精神损害程度,决定是否受理","根据违反忠实义务程度,决定是否受理"],"a":"B","e":"司法解释规定,在婚姻关系期间,当事\n人不起诉离婚而单独提起损害赔偿请求的,人民法院\n不予受理。","k":"婚姻家庭"},{"id":"2016-36","y":2016,"t":"单","s":"甲、乙婚后开了一家便利店,由乙经营。2013 年6月起二人分居,同年9月乙向丙借款用于便利店 的经营,2014年12月甲、乙离婚。不久,丙请求乙偿 还到期欠款,乙拒绝。该债务应由()。","o":["甲、乙承担按份责任","甲、乙承担连带责任","乙承担全部责任","乙承担责任,甲承担补充责任"],"a":"B","e":"夫妻共同债务,是指在婚姻关系存续期\n间,夫妻一方或双方为共同生活或共同生产、经营活\n动需要所负的债务。夫妻共同债务,由夫妻双方对债\n权人承担连带责任。\n便利店为甲乙婚后所开,是夫妻共同财产。乙向\n丙借款用千便利店经营,即用于共同经营活动需要。\n借款时甲乙虽已分居,但是并未离婚,借款形成千甲\n乙婚姻存续期间。该借款属千夫妻共同债务,甲、乙\n均有偿还义务。对千该借款,甲乙承担连带责任,B\n选项正确。\n夫妻共同债务,承担连带责任,不是按份责任,也\n不是补充责任,AD选项不正确。借款虽然是由乙向\n丙借的,但是用于便利店经营,属于夫妻共同债务,不\n应由乙承担全部责任,C选项不正确。","k":"婚姻家庭"},{"id":"2017-37","y":2017,"t":"单","s":"根据我国收养法,下列情形中,收养关系可以 成立的是()。","o":["甲(男,28周岁,未婚)收养2周岁的孤儿","乙(女,50周岁,离异)收养自己15周岁的亲 侄子","丙(女,60周岁,丧偶)收养自己19周岁的 继女","丁(女,45周岁,有配偶)单独收养自己5周岁 的外甥"],"a":"B","e":"《收养法》第6条规定:\n\"收养人应当同\n时具备下列条件:(一)无子女;(二)有抚养教育被\n收养人的能力;(三)未患有在医学上认为不应当收\n养子女的疾病;(四)年满三十周岁。\"A项错误。第\n10条第2款规定:有配偶者收养子女,须夫妻共同收\n养。D项错误。第4条规定:\n\" 下列不满十四周岁的\n未成年人可以被收养:(一)丧失父母的孤儿;\n(二)查找不到生父母的弃婴和儿童;(三)生父母有\n特殊困难无力抚养的子女。\n\" 第7条第1款规定:\"收\n养三代以内旁系同辈血亲的子女,可以不受本法第4\n条第三项第5条第三项、第9条和被收养人不满十\n四周岁的限制。\"B项中乙收养亲侄子,是收养三代以\n内旁系同辈血亲的子女,不受不满十四周岁的限制,B\n项正确。收养的对象必须是未成年人,收养应当有利\n于被收养未成年人的抚养、成长,C项中继女已经19\n周岁,是成年人,不能再被收养,C项错误。\n[特别说明]\n《民法典》对收养条件进行了修\n改,未成年人均可以被收养,不再要求必须\n\" 不满14\n周岁\n\"。收养人须符合下列条件:(1)无子女或者只\n有一名子女;(2)有抚养、教育和保护被收养人的能\n力;(3)未患有在医学上认为不应当收养子女的疾\n病;(4)无不利于被收养人健康成长的违法犯罪记\n录;(5)年满三十周岁。但上述修改对本题答案无影\n响。由于本题题干明确要求\n\" 根据我国收养法\n\" ,因此\n本题不对解析进行修改。但考生要清楚《民法典》的\n最新规定。","k":"婚姻家庭"},{"id":"2017-48","y":2017,"t":"多","s":"甲、乙系夫妻,有一子丙。丙与丁结婚,生有 一女戊。2008年丙去世,丁与庚再婚,二人一起照顾 甲、乙的生活起居。2015年5月甲去世。对甲遗产的 继承,第一顺序继承人有()。","o":["乙","丁","戊","庚"],"a":"ABC","e":"根据《民法典》第1127条的规定,遗产\n按照下列顺序继承:第一顺序是配偶、子女、父母。乙\n是甲的配偶,是第一顺序继承人,A项正确。《民法\n典》第1128条规定:\"继承人的子女先于被继承人死\n亡的,由被继承人的子女的直系晚辈血亲代位继承。\n被继承人的兄弟姐妹先于被继承人死亡的,由被继承\n人的兄弟姐妹的子女代位继承。代位继承人一般只\n能继承被代位继承人有权继承的遗产份额。\"司法解\n释进一步明确,丧偶儿媳对公婆、丧偶女婿对岳父母,\n无论其是否再婚,仍作为第一顺序继承人,其子女仍\n然可以代位继承。丙是甲的子女,先于甲死亡,由丙\n的女儿戊代位继承。因为丙是第一顺序继承人,所以\n戊也是第一顺序继承人。C项正确。《民法典》第\n1129条规定:\n\"丧偶儿媳对公婆,丧偶女婿对岳父母,\n尽了主要赡养义务的,作为第一顺序继承人。\"丁是甲\n的儿媳,丧偶后对公婆尽了主要赡养义务,是第一顺\n序继承人,B项正确。庚不是甲的法定继承人,D项\n错误。","k":"婚姻家庭"},{"id":"2018-36","y":2018,"t":"单","s":"2005 年,甲立公证遗嘱,将自己的一套房屋留 给儿子乙,后甲与丙结婚,生有一子丁。 2008 年,甲立 自书遗嘱,指定前述房屋由丙、丁二人共同继承。 2017 年,甲去世,该房屋( )。 •","o":["应按照公证遗嘱由乙继承","应按照自书遗嘱由丙、丁共同继承","应由乙、丙、丁依照法定继承共同继承","属于甲和丙的共同财产,应当先析产后继承"],"a":"B","e":"原答案为A)\n《民法典》第1142条规定:\"遗嘱人可\n以撤回、变更自己所立的遗嘱。立遗嘱后,遗嘱人实\n施与遗嘱内容相反的民事法律行为的,视为对遗嘱相\n关内容的撤回。立有数份遗嘱,内容相抵触的,以最\n后的遗嘱为准。\"本题中,甲最后的遗嘱是自书遗嘱,\n因此应当按照自书遗嘱执行,B项正确。\n本题原答案为A,因为根据《继承法》的规定,自\n书、代书、录音、口头遗嘱,不得撤销、变更公证遗嘱。\n本题中,甲2006年立的是公证遗嘱,其2008年的自\n书遗嘱不能变更公证遗嘱,因此应当按照公证遗嘱,\n由乙继承房屋。但是《民法典》删除了\n\" 自书、代书、\n录音、口头遗嘱,不得撤销、变更公证遗嘱\n\"的规定,也\n就是说不管采用何种遗嘱形式,都以最后的遗嘱为\n准。因此本题答案为B。\n[特别说明]\n关千遗嘱,《民法典》新增了打印、\n录像等遗嘱形式。并且根据相关司法解释规定,自然\n人在遗书中涉及死后个人财产处分的内容,确为死者\n的真实意思表示,有本人签名并注明了年月、日,又\n无相反证据的,可以按自书遗嘱对待。","k":"婚姻家庭"},{"id":"2019-32","y":2019,"t":"单","s":"下列关于收养关系解除的说法中,正确的是 )。","o":["养父母遗弃未成年养子女的,养子女有权要 求解除收养关系","养父母虐待未成年养子女的,送养人有权要求 解除收养关系","在被收养人成年以前,收养人经民政部门同意 可以解除收养关系","养父母与未成年养子女关系恶化,无法共同 生活的,可以协议解除收养关系"],"a":"B","e":"根据《民法典》的规定,收养人不履行\n抚养义务,有虐待遗弃等侵害未成年养子女合法权\n益行为的,送养人有权要求解除养父母与养子女间的\n收养关系。送养人、收养人不能达成解除收养关系协\n议的,可以向人民法院提起诉讼。因此选项A错误,\n选项B正确。收养人在被收养人成年以前,不得解除\n收养关系,但是收养人、送养人双方协议解除的除外。\n养子女八周岁以上的,应当征得本人同意。养父母与\n成年养子女关系恶化、无法共同生活的,可以协议解\n除收养关系。不能达成协议的,可以向人民法院提起\n诉讼。因此选项CD错误。","k":"婚姻家庭"},{"id":"2020-27","y":2020,"t":"单","s":"下列选项中,属于继父或继母收养继子女的 条件是()c","o":["继子女不满14周岁","继父母无子女","经生父母同意","生父母有特殊困难无力抚养子女"],"a":"C","e":"根据《民法典》的规定,继父或者继母\n经继子女的生父母同意,可以收养继子女,并可以不\n受下列条件的限制:被收养人应为生父母有特殊困难\n无力抚养的子女;送养人应为有特殊困难无力抚养子\n女的生父母;收养人须无子女或者只有一名子女,年\n满30周岁,有抚养、教育和保护被收养人的能力,未\n患有在医学上认为不应当收养子女的疾病,无不利于\n被收养人健康成长的违法犯罪记录;无子女的收养人\n可以收养两名子女;有子女的收养人只能收养一名子\n女。C选项正确。未成年人均可以被收养,不要求必\n须\n\"不满14周岁\n\" 。","k":"婚姻家庭"},{"id":"2020-49","y":2020,"t":"多","s":"我国婚姻法规定,“父母不履行抚养义务时, 未成年的或不能独立生活的子女,有要求父母付给抚 养费的权利。”其中,“不能独立生活的子女”包括 ()。","o":["在校接受高中学历教育的成年子女","在校接受大学本科学历教育的成年子女","丧失劳动能力无法维持正常生活的成年子女","未完全丧失劳动能力无法维持正常生活的成 年子女"],"a":"ACD","e":"\"不能独立生活的子女\n\" ,是指尚在校\n接受高中及以下学历教育,或者丧失或未完全丧失劳\n动能力等非因主观原因而无法维待正常生活的成年\n子女。ACD选项正确。司法解释进一步明确了抚养\n费(包括子女生活费、教育费、医疗费等费用)的相关\n\n问题。抚养费的给付期限一般至子女满18周岁为\n止。已满16周岁不满18周岁,并能够以自己的劳动\n收入作为主要的生活来源并能维持当地一般生活水\n平的,父母可以停止给付抚养费。","k":"婚姻家庭"},{"id":"2022-36","y":2022,"t":"单","s":"甲丧偶后不久罹患重病,无力抚养2岁的儿子小明,依法将其送养。小明成年后找 到甲,见甲生活窘困,按月给甲500元生活费。小明给付生活费的行为系","o":["履行道德义务","履行法定赡养义务","公益捐赠","紧急救助"],"a":"A","e":"根据《民法典》的规定,收养关系一经\n成立,养子女与生父母以及其他近亲属间的权利义务\n的过程中,而是在合同生效之后。C选项错误。违约关系,因收养关系的成立而消除。甲依法送养小明,\n收养关系成立,甲与小明之间的权利义务关系因收养\n关系的成立而消除。成年后的小明对甲不具有法定\n的赡养义务,其给付给甲生活费的行为属于履行道德\n义务。A选项正确。","k":"婚姻家庭"},{"id":"2024-30","y":2024,"t":"单","s":"2018年甲、乙结婚。2019年甲以个人名义向弟弟丙借款100万元购买商品房,登记 在乙名下。2021年甲、乙离婚。甲向丙所借的钱应当()","o":["全部由甲偿还","全部由乙偿还","由甲和乙连带偿还","由甲和乙按份偿还"],"a":"C","e":"","k":"婚姻家庭"},{"id":"2026-24","y":2026,"t":"单","s":"甲与乙是恋人关系,甲在乙生日时送了乙一台相机,乙在甲生日时转账1314 元,2024 年甲乙订婚时,甲的父母根据当地习俗送给乙一套黄金首饰,后来甲、 乙取消婚约。下列说法正确的是","o":["甲有权请求乙归还相机","甲的父母有权请求乙归还黄金首饰","甲无权请求乙归还黄金首饰","乙有权请求甲归还1314 元"],"a":"B","e":"订婚彩礼(黄金首饰)以缔结婚约为条件,婚约解除,给付方父母有权请\n求返还;\nA 相机属于日常无偿赠与,不可撤销;C 父母有权要回首饰;D1314 情侣转账属于\n情谊赠与,不能返还。","k":"婚姻家庭"},{"id":"2026-40","y":2026,"t":"单","s":"甲、乙婚后以甲的名义注册了某网络平台账号,甲负责直播,乙负责运营。 账号粉丝50 万,直播收益80 万元。后甲乙离婚,下列说法正确的是","o":["账号和直播收益都归属于甲","账号和直播收益归甲、乙共同所有","账号归甲,直播收益归甲、乙共同所有","账号归甲、乙共同所有,直播收益归甲"],"a":"B","e":"婚后共同运营、投入劳动取得的网络账号及直播收益,均属于夫妻共同财\n产。\n二、多项选择题(41-50)","k":"婚姻家庭"},{"id":"2026-49","y":2026,"t":"多","s":"甲乙协议离婚,约定二人共有房屋给予儿子丙,丙可就房屋直接向父母主张 权利。一年后甲再婚,拒绝将房屋过户给丙。下列说法正确的有","o":["甲、乙赠予丙房屋的约定无效","甲在房屋所有权转移前,有权单方撤销赠与","乙有权请求甲将房屋过户给丙","丙有权请求甲将房屋过户给自己"],"a":"CD","e":"离婚协议赠与子女房屋合法有效;夫妻双方共同赠与,单方无任意撤销权;\n乙可起诉要求过户,子女基于赠与合同享有履行请求权。","k":"婚姻家庭"}]},{"sub":"民法","name":"人格权","w":1.2,"L":23,"qs":[{"id":"2005-32","y":2005,"t":"单","s":"某报社在一篇报道中披露某女影星甲曾做过不光彩的事情,致使甲备受歧视。甲因无法忍受巨大的精神压力, 跳楼 自杀未遂,但造成终身残疾。该报社的行为(   )","o":["是如实报道,不构成侵权","侵害了甲的隐私权","侵害了甲的生命权","侵害了甲的健康权"],"a":"B","e":"报社的行为并没有直接针对甲的身体,因此谈不上侵害其生命权或健康权。隐私权,是公民以其\n个人秘密利益为内容的人格权。未经他人同意,擅自公布他人的隐私材料或者以书面、口头形式宣扬他人隐私,致\n他人受到损害的,构成侵害隐私权。据此,选项B 应选。","k":"人格权"},{"id":"2005-34","y":2005,"t":"单","s":"下列权利中,只能由自然人享有的是(   )","o":["所有权","名誉权","肖像权","用益物权"],"a":"C","e":"所有权、用益物权,属于财产权,自然人、法人或者其他组织都可以享有。《民法通则》第101\n条规定:\"公民、法人享有名誉权,公民的人格尊严受法律保护,禁止用侮辱、诽谤等方式损害公民、法人的名誉。\"\n据此,名誉权为自然人、法人,甚至其他组织都可以享有。《民法通则》第100 条规定:\"公民享有肖像权,未经\n本人同意,不得以营利为目的使用公民的肖像。\"据此,肖像权为自然人所独有。","k":"人格权"},{"id":"2006-35","y":2006,"t":"单","s":"下列权利中,属于请求权的是(   )","o":["物权","人格权","债权","继承权"],"a":"C","e":"物权、人格权属支配权;继承权属形成权,只有债券树典型的请求权。","k":"人格权"},{"id":"2007-55","y":2007,"t":"多","s":"歌迷甲在一酒吧意外地遇见自己的偶像歌星乙,惊喜之余向乙打探其私生活。乙被激怒,在众目睽睽之下将手 中的 饮料泼向甲,弄脏了甲的衣服。乙的行为侵害了甲的 (       ) 。","o":["身体权","尊严权","健康权","财产权 九、简答题 (56 、 57 小题,每小题 6 分"],"a":"BD","e":"人格权 \n- 17 -\n\n \n \n更多考研精品资料,关注淘宝店铺:光速考研工作室 \n]人格权是指公民和法人作为民事权利主体所享有的人格尊严不受侵犯的一种民事权 \n利,包括身体权、健康权等。身体权是指自然人保持其身体组织完整并支+配其肢体、器官 \n和其他身体组织的权利。健康权是指自然人保持身体机能正常和维护健康利益的权利。乙把 \n饮料泼向甲,只是弄脏了甲的衣服,侵害了其财产权,并没有损害其身体和健康,故没有侵 \n害其身体权和健康权。A、C 项错误,D 项正确。乙在众目睽睽之下,将饮料泼向甲,侵害 \n了甲的人格尊严,故 B 项正确。 \n九、简答题","k":"人格权"},{"id":"2008-49","y":2008,"t":"单","s":"根据我国民法的有关规定,以下情形中权利人可以请求精神损害赔偿的是(  )。","o":["生命权受到非法侵害","名称权受到非法侵害","合同债权受到非法侵","承包经营权受到非法侵害"],"a":"A","e":"根据《最高人民法院关于确定民事侵权精神损害赔偿责任若干问题的解释》第1 条,选项A 正确。","k":"人格权"},{"id":"2009-44","y":2009,"t":"单","s":"2003 年 7 月,洪某在高考中以两分之差未能进入重点大学录取范围。洪某在高中学习阶段,曾荣获市优秀学 生 干部称号。按当年高考政策,获市级优秀学生干部的考生可以享受加 10 分的奖励。市教委在整理审核学生档案 时,将洪某 的“市优秀学牛干部”称号改为不享受此奖励的“市三好学生”称号,致洪某与重点大学失之交臂。市 教委侵犯了洪某的(    )。","o":["名誉权","荣誉权","姓名权","信用权"],"a":"B","e":"本题考查荣誉权。名誉权是公民、法人以法律所现有的,有关自己的社会评价不受他人侵犯的一\n种人身权利。荣誉权是指公民、法人依法享有的保护自己荣誉称号,非经法定程序不受剥夺的民事权利。本题中,\n洪某的\"市优秀学生干部\"称号属于荣誉称号,市教委将其改为\"市三好学生\"称号,侵犯洪某的荣誉权。B 选项\n正确。姓名权,是指公民决定其姓名、使用其姓名和变更其姓名并要他人尊重自己姓名的权利,是以姓名利益为内\n容的人格权。可见,C 选项错误。人身权不包括信用权。因此本题的答案为B","k":"人格权"},{"id":"2009-55","y":2009,"t":"多","s":"下列情形中,权利人可以请求精神损害赔偿的有(      )","o":["某医院将甲之子与乙之子抱错,10 年后再发现","某扩印部将丙丁结婚照的底片丢失","某公司使用知名企业的名称促销自己的产品","某人冒用明星庚的姓名演出获利 九、简答题(56-57 题,每小题 6 分"],"a":"ABD","e":"本题考查精神损害赔偿的范围。根据《最高人民法院关于确定民事侵权精神损害赔偿责任若干问\n题的解释》第2 条规定,非法是被监护人脱离监护,导致亲子关系或者近亲属间的亲属关系遭受严重损害,监护人\n想人民法院起诉请求赔偿精神损害的,人民法院应当依法予以受理。A 选项属于精神损害赔偿的范围。第4 条规定,\n具有人格象征意义的特定纪念品,因侵权行为而永久性灭失或损毁,物品所有人以侵权为由,想人民法院请求赔偿\n精神损害的,人民法院应当依法予以受理。B 选项属于精神损害的范围。第5 条规定,法人或者其他组织人以人格\n权利遭受侵害为由,向人民法院起诉请求赔偿精神损害的,人民法院不予受理。C 选项中知名企业戊想人民法院起\n诉请求精神损害赔偿的,人民法院不予受理。第1 条规定,自然人因姓名权遭受非法侵害,人民法院应当予以受理。\nD 选项中某人冒用明星庚的姓名演出获利,庚可以提出精神损害赔偿。因此本题答案为ABC \n九、简答题","k":"人格权"},{"id":"2011-39","y":2011,"t":"单","s":"下列人身权中,属于自然人专有的是( )。","o":["名誉权","肖像权","信用权","荣誉权"],"a":"B","e":"按照权利享有的主体分类,人格权可以\n分为三类:(I) 只能由法人和非法人组织享有的,即\n名称权;(2)自然人、法人和非法人组织都可以享有\n的,即名誉权、荣誉权;(3)自然人专有的权利,即除\n上述权利以外所有的人格权。肖像权属于第三种,即\n自然人专有的权利,答案选B。","k":"人格权"},{"id":"2012-32","y":2012,"t":"单","s":"下列有关自然人人格权与身份权异同的表 述,不正确的是( )。","o":["人格权与身份权均没有直接财产内容","人格权与身份权均属于支配权和绝对权","人格权受到侵害后权利人可以请求精神损害 赔偿身份权则不可以","人格权始于出生,身份权则以取得一定身份 为前提"],"a":"C","e":"最高人民法院《关于确定民事侵权精\n神损害赔偿责任若干问题的解释》第1条规定,自然\n人因下列人格权利遭受非法侵害,向人民法院起诉请\n求赔偿精神损害的,人民法院应当依法予以受理:\n(I)生命权、健康权、身体权。(2)姓名权、肖像权、\n名誉权、荣誉权。(3)人格尊严权、人身自由权。违\n反社会公共利益、社会公德侵害他人隐私或者其他人\n格利益,受害人以侵权为由向人民法院起诉请求赔偿\n精神损害的,人民法院应当依法予以受理。第2条规\n定,非法使被监护人脱离监护,导致亲子关系或者近\n亲属间的亲属关系遭受严重损害,监护人向人民法院\n起诉请求赔偿精神损害的,人民法院应当依法予以受\n理。第1条规定的是人格权,第2条规定的是身份\n权。可见,人格权和身份权受到侵害后,都可以要求\n精神损害赔偿。故选C。\n[特别说明]\n《民法典》及有关《民法典》的新司\n法解释沿用了《关千确定民事侵权精神损害赔偿责任\n若千问题的解释》第2条的规定,即认为身份权遭受\n侵害可以主张精神损害赔偿。故本书不对本题答案\n进行修改。","k":"人格权"},{"id":"2013-35","y":2013,"t":"单","s":"摄影师甲为刘某拍照后,私自将照片卖给乙 制作挂历销售。后来乙又将照片送给丙作橱窗广告, 被刘某发现诉至法院。在本案中,侵害刘某肖像权的 是()。","o":["甲和乙","乙和丙","甲和丙","甲、乙、丙"],"a":"D","e":"所谓肖像权,是指自然人依法制作、使\n用自己的肖像,借此享受一定利益并排除他人非法侵\n害的权利。只有肖像权人才有权决定是否允许他人\n再现自己的形象,这是肖像权专有性的体现。而甲拍\n照后,私自出售照片的行为已经侵犯了当事人的肖像\n处分权,而乙将照片转赠给丙作为橱窗广告,也侵犯\n了肖像权人的使用权。未经肖像权人的同意,任何人\n不得使用其肖像,因此答案为D。","k":"人格权"},{"id":"2015-35","y":2015,"t":"单","s":"甲公司擅自使用电视剧《华妃传》中华妃扮 演者的剧照为某化妆品做广告,甲公司的行为侵害了 ()。","o":["华妃扮演者的肖像权","华妃扮演者的名誉权","《华妃传》著作权人的著作权","《华妃传》著作权人的邻接权"],"a":"A","e":"所谓肖像权是指自然人依法制作、使用\n自己的肖像,借此享受一定利益并排除他人非法侵害\n的权利。肖像权属于支配权,其内容是肖像权人对自\n已肖像的支配,包括肖像制作权。华妃扮演者的剧照\n是权利人行使肖像制作权的结果,受法律保护,甲公\n司为谋取商业利益,擅自使用该剧照,侵犯了华妃扮\n演者的肖像权,A选项正确。甲公司并没有坻毁华妃\n扮演者的名誉,没有侵害其名誉权,B选项错误。甲\n公司使用的是华妃扮演者的剧照,不涉及《华妃传》的\n著作权和邻接权,CD选项错误。","k":"人格权"},{"id":"2015-40","y":2015,"t":"单","s":"某公安局官方微博公布了演员甲因容留他人 吸毒被抓的消息,一知名记者在其博客上转载该消 息,并上传了甲与艺人乙、丙一起赌博的照片。该记 者的行为()。","o":["侵害了甲的隐私权","侵害了乙、丙的肖像权","侵害了乙、丙的隐私权","不构成侵权"],"a":"D","e":"一般侵权责任构成要件包括四方面:加\n害行为过错损害事实、因果行为。加害行为要求具\n有违法性。本题中,该记者的行为不具有违法性,其\n他三个条件亦不具备,因此记者的行为不构成侵权,\nABC项错误,D项正确。\n二、多项选择题","k":"人格权"},{"id":"2016-25","y":2016,"t":"单","s":"下列权利中,属于身份权的是( )。","o":["名誉权","名称权","隐私权","配偶权 0"],"a":"D","e":"人格权是民事主体依法享有的为维护\n其独立法律人格所必备的基本民事权利。人格权是\n民事主体固有的权利,只要自然人出生、法人或者其\n他社会组织成立,无须任何意思表示或者实施任何行\n为,就当然取得并受到法律保护。身份权是民事主体\n因特定身份而产生、享有的民事权利,身份权并非每\n个民事主体都享有。\n本题中,ABC是人格权,是民事主体固有的权利,\nD是身份权,是在合法有效的婚姻关系存续期间,夫\n妻之间享有的权利。没有婚姻关系的人,不享有配偶\n权,所以正确答案是D。","k":"人格权"},{"id":"2016-50","y":2016,"t":"多","s":"甲公司买通乙公司员工,获得乙公司的产品 制造方法及客户名单等保密信息。其后甲公司以乙 公司的名义与乙公司客户进行交易。甲公司的行为 侵害了乙公司的()。","o":["专利权","商业秘密","名称权","隐私权 三、简答题:第51~54小题,每小题6分"],"a":"BC","e":"甲公司通过非法手段获取乙公司的保\n密信息,侵犯了乙公司的商业秘密,其后擅自以乙公\n司名义与乙公司客户进行交易,侵犯了乙公司的名称\n权。B、C选项正确。\n甲公司窃取的是商业秘密,而不是专利。商业秘\n密的特点之一就具有秘密性,而专利的特点之一是具\n有公开性,二者具有很大的区别。甲公司没有侵害乙\n公司的专利权,A选项错误。\n隐私权是人格权,是由公民享有的权利,法人和\n其他组织不享有隐私权,所以甲公司不可能侵犯乙公\n司的隐私权,D选项错误。\n三、简答题","k":"人格权"},{"id":"2018-28","y":2018,"t":"单","s":"摄影师甲以乙为模特拍摄了数百张艺术照。 甲将这些照片编辑成画册,未经乙同意交出版社出版 发行。甲的行为侵害了乙的( )。","o":["著作权","发表权","肖像权","署名权"],"a":"C","e":"肖像是通过影像、雕塑、绘画等方式在\n一定载体上所反映的特定自然人可以被识别的外部\n形象。肖像权是指自然人依法制作、使用自己的肖\n像,借此享受收益并排除他人干涉的权利。自然人有\n权决定是否允许他人使用自己的肖像,未经肖像权人\n同意,任何人不得使用其肖像。甲未经乙同意以营利\n为目的使用乙的肖像,侵犯了乙的肖像权。C项\n正确。","k":"人格权"},{"id":"2018-29","y":2018,"t":"单","s":"甲将乙的照片和联系方式发到自己的微信朋 友圈,声称乙欠钱不还,是个骗子。经查,甲所言与事 实完全不符。甲的行为侵害了乙的( )。","o":["姓名权","名誉权","肖像权","荣誉权"],"a":"B","e":"名誉是指社会对民事主体的品行、才\n能、功绩等方面的综合评价。名誉权是指自然人依法\n享有的维护其名誉,享受名誉给自己带来的利益并排\n除他人非法侵害的权利。任何人都不得侵害他人的\n名誉。本题中甲虚构乙欠债的事实,并到处散布,使\n社会主体降低了对乙品行的评价,甲的行为侵犯了乙\n的名誉权。B项正确。","k":"人格权"},{"id":"2019-26","y":2019,"t":"单","s":"甲公司将售房过程中收集到的购房者的姓 名、身份证号码、电话、家庭住址等信息打包出售。甲 公司的行为侵害了购房者的()。","o":["个人信息权益","身份权","信用权","姓名权"],"a":"A","e":"《民法典》第111条规定:\"自然人的个\n人信息受法律保护。任何组织或者个人需要获取他\n人个人信息的,应当依法取得并确保信息安全,不得\n非法收集、使用、加工、传输他人个人信息,不得非法\n买卖提供或者公开他人个人信息。\"个人信息权是指\n自然人对其个人信息所享有的支配、控制并排除他人\n侵害的权利。本题中,姓名、身份证号码、电话、家庭\n住址等信息属千个人信息,甲公司将其出售,侵害了\n购房者的个人信息权益,A项正确。","k":"人格权"},{"id":"2020-25","y":2020,"t":"单","s":"微信名为“温柔的小蜜蜂”的用户在朋友圈 中发图配文称:张某是一位糖尿病患者,服用“小蜜 蜂”牌保健品后病情得到控制。李某发现该图用的是 自己的生活照,且文字内容与自己毫不相干。该用户 侵犯了李某的()。","o":["名誉权","肖像权","个人信息权益","姓名权"],"a":"B","e":"根据《民法典》的规定,任何组织或者\n个人不得以丑化、污损,或者利用信息技术手段伪造\n等方式侵害他人的肖像权。未经肖像权人同意,不得\n制作、使用、公开肖像权人的肖像,但是法律另有规定\n的除外。本题中\n\" 温柔的小蜜蜂\n\"未经李某同意,擅自\n使用李某的肖像,侵犯了李某的肖像权,B选项正确。","k":"人格权"},{"id":"2021-31","y":2021,"t":"单","s":"甲为乙拍摄照片后将照片发到朋友圈,丙看 到后觉得很有趣,遂将该照片做成搞笑表情包出售。 丙侵犯了( )","o":["乙的肖像权","乙的荣誉权","甲的发表权","甲的隐私权"],"a":"A","e":"l\n《民法典》第1019条规定:\"任何组织\n或者个人不得以丑化、污损,或者利用信息技术手段\n伪造等方式侵害他人的肖像权。未经肖像权人同意,\n不得制作、使用、公开肖像权人的肖像,但是法律另有\n规定的除外。未经肖像权人同意,肖像作品权利人不\n得以发表、复制、发行、出租、展览等方式使用或者公\n开肖像权人的肖像。\"本题中,丙并未经乙的同意,将\n乙的照片做成搞笑表情包(即制作乙的肖像)出售,侵\n犯了乙的肖像权,A项正确。","k":"人格权"},{"id":"2022-28","y":2022,"t":"单","s":"某酒店建立了房客信息数据库,但因自身技术人员的疏忽存在系统漏洞。网民王 某利用上述漏洞获取了该酒店房客信息,并将这些信息在网上公开,导致房客孙某因 个人信息泄露遭受损失。孙某的损失应当由","o":["王某全部赔偿","酒店与王某承担不真正连带赔偿责任","酒店与王某承担连带赔偿责任","酒店与王某承担按份赔偿责任"],"a":"D","e":"无意思联络的数人侵权是指二人以上\n虽无共同故意或者共同过失,但其侵害行为直接结合\n发生同一损害后果的侵权行为。二人以上分别实施\n侵权行为造成同一损害,能够确定责任大小的,各自\n承担相应的责任;难以确定责任大小的,平均承担责\n任。酒店由于过失,王某出于故意,二者的侵害行为\n直接结合发生同一损害后果,即房客孙某的个人信息\n泄露损失。因此酒店与王某应当承担按份赔偿责任。\nD选项正确。酒店虽然建立了房客信息数据库,但是\n酒店本身并不属于网络服务提供者,因此不能适用\n《民法典》第1195条规定的\"通知删除\"规则。","k":"人格权"},{"id":"2022-40","y":2022,"t":"单","s":"酒吧经理阻止甲离开的行为","o":["侵害了甲的身体权","侵害了甲的人身自由","侵害了甲的名誉权","不构成侵权"],"a":"D","e":"身体权是指自然人享有的对其肢体、器\n官和其他人体组织进行支配并维护其安全与完整,从\n而享受一定利益的权利。名誉权是指自然人依法享\n有的维护其名誉,享受名誉给自己带来的利益并排除\n他人非法侵害的权利。民事权利的私力救济是指权\n利人自己采取各种合法手段来保护自己的权利不受\n侵害。酒吧经理阻止甲离开的行为没有侵害甲的身\n体安全与完整,没有侵害甲的名誉,属于民事权利的\n私力救济行为,不构成侵权。D选项正确。\n二、多项选择题","k":"人格权"},{"id":"2024-28","y":2024,"t":"单","s":"甲逛街时,被在该地拍摄街景的乙近距离拍摄,甲不悦,当即离开。次日,甲在某 网站看到自己的街拍照片。乙的行为()","o":["侵害甲的肖像权","侵害甲的隐私权","侵害甲的名誉权","不构成侵权"],"a":"A","e":"","k":"人格权"},{"id":"2025-22","y":2025,"t":"单","s":"甲用自己的手机号码在A 公司开发的APP 注册成为用户,后A 公司向甲发送手机短信: “甲先生,向您推荐优惠商品,退订回复TD。\"A 公司的行为( )","o":["不构成侵权","侵害了甲的隐私权","侵害了甲的姓名权","侵害了甲的个人信息权益"],"a":"A","e":"根据法律规定,个人信息处理方可在合理的范围内处理个人已经公开或者其他已\n经合法公开的个人信息,不需取得个人同意。本题中甲用自己的手机号码在A 公司开发的APP\n注册成为用户,即在A 公司的范围内已经公开个人的手机号码,A 公司处理其已经公开的信息,\n不需取得甲的同意,A 公司向其发送手机短信的行为不构成侵权,A 项正确,BCD 项错误。本\n题选A。","k":"人格权"}]},{"sub":"民法","name":"典型合同","w":1.1,"L":21,"qs":[{"id":"2005-40","y":2005,"t":"单","s":"买卖合同不属于(   )","o":["双务合同","不要式合同","有偿合同","实践性合同"],"a":"D","e":"单务合同与双务合同相对,区分标准是双方当事人是否互负义务。要式合同与不要式合同相对,区\n分标准是合同成立是否必须采取一定的形式。有偿合同与无偿合同相对,区分标准是当事人之间的权利义务关系是\n否存在对价关系。诺成合同与实践合同相对,区分标准是合同成立或生效是否以交付标的物为条件。在买卖合同,\n- 11 -\n\n \n \n更多考研精品资料,关注淘宝店铺:光速考研工作室 \n出卖人转移标的物的所有权于买受人,买受人支付价款。因此买卖合同属于双务合同,有偿合同。根据合同法,买\n卖合同不需要采用特定形式,因此属于不要式合同。买卖合同,双方当事人意思表示一致合同即成立,标的物是否\n交付不影响买卖合同本身的成立和生效。如果出卖人没有按合同交付标的物的,构成违约,承担违约责任。因此买\n卖合同属于诺成合同,而非实践性合同。","k":"典型合同"},{"id":"2006-39","y":2006,"t":"单","s":"顾客将胶卷照相馆冲印,照相馆交给顾客一份取印单,该取印单属于(   )","o":["委托合同","承揽合同","行纪合同","技术合同"],"a":"B","e":"见承揽合同。","k":"典型合同"},{"id":"2006-42","y":2006,"t":"单","s":"可以有偿也可以无偿的合同是(   )","o":["保管合同","融资租凭合同","运输合同","行纪合同"],"a":"A","e":"《合同法》第366 条,","k":"典型合同"},{"id":"2008-53","y":2008,"t":"多","s":"下列行为中,属于有偿法律行为的有(     )。","o":["承揽合同","租赁合同","赠与合同","运输合同"],"a":"ABD","e":"有偿法律行为,与无偿法律行为相对,是指一方当事人为对方承担某种民事义务时,有权要求对方\n承担相应的义务的民事法律行为,即要求对方给予报偿。承揽合同是承揽人按照定作人的要求完成工作,交付工作\n成果,定作人给付报酬的合同;租赁合同是出租人将租赁物交付承租人使用、收益,承租人支付租金的合;运输合\n同是承运人将旅客或者货物从起运地点运输到约定地点,旅客、托运人或者收货人支付票款或者运输费用的合同。\n因此,选项A、B、D 都属于有偿合同。赠与合同是赠与人将自己的财产无偿给予受赠人,受赠人表示接受赠与的合\n- 10 -\n\n \n \n更多考研精品资料,关注淘宝店铺:光速考研工作室 \n同故选项C 属于无偿合同。","k":"典型合同"},{"id":"2011-40","y":2011,"t":"单","s":"下列有关租赁合同与融资租赁合同异同的表 述,不正确的是( )。","o":["租赁合同与融资租赁合同的标的物均属于非 消耗物","租赁合同与融资租赁合同均属于双务、有偿、 诺成、要式合同","租赁合同对出租人资格没有限制,融资租赁合 同中的出租人须具备法定资格","租赁合同的租金为使用租赁物的代价,融资 租赁合同中的租金为融资的代价"],"a":"B","e":"租赁合同与融资租赁合同都包含了出\n租人将租赁物交付承租人使用、收益的行为,两类合\n同的标的物都必须是非消耗物。所以选项A 是正确\n的。融资租赁合同的特征包括:(I) 对合同当事人有\n资格限制;(2)合同中承租人向出租人支付的租金并\n非单纯使用租赁物的代价,而是融资的代价;(3)租\n赁合同的标的物是应承租人的要求购买的,而且通常\n是价值较高的固定资产;(4)是双务、有偿、诺成性的\n要式合同。故选项C、D 正确。融资租赁合同是要式\n合同,但是租赁合同并不要求是要式合同。《民法典》\n第707 条规定:\"租赁期限6个月以上的,应当采用书\n面形式。当事人未采用书面形式,无法确定租赁期限\n的、视为不定期租赁r\"要式合同是指合同的成守必须\n依照某种特定的形式为标准,而在租赁合同中,是台\n采用特定的形式并不影响租赁合同的成立,最多在租\n赁期限为6个月以上的租赁合同中,不采用书面形式\n会使其成为不定期租赁合同。所以B 选项认为租赁\n合同比安式合同丛钻误的,答栥选且最后il:总租赁\n合同和融资租赁合同的区别,主要从主体、合同结构、\n标的要式非要式诺成实践等几个方面去回答。\n二、多项选择题","k":"典型合同"},{"id":"2014-33","y":2014,"t":"单","s":"甲公司与乙公司签订一份货物买卖合同,但 未约定货物价格。在乙公司交货时,双方就货物价格 发生争议,且未能达成补充协议,也无法按照合同条 款或者交易习惯加以确定。根据《合同法》规定,货物 的价格应()。","o":["依订立合同时甲公司营业地的市场价格确定","依订立合同时履行地的市场价格确定","依履行合同时乙公司营业地的市场价格确定","依履行合同时履行地的市场价格确定"],"a":"B","e":"根据《民法典》规定,合同当事人就合\n同的价格条款约定不明确的,可以协议补充,不能达\n成补充协议的,按照合同相关条款或者交易习惯确\n定。还不能确定的,使用下面规则:按照订立合同时\n履行地的市场价格履行,依法应当执行政府定价或者\n指导价的,按照规定履行。因此货物的价格应依订立\n合同时履行地的市场价格确定。","k":"典型合同"},{"id":"2014-34","y":2014,"t":"单","s":"甲、乙签订一份设备买卖合同。甲的下列行 为中,属于履行附随义务的是()。","o":["甲应乙的请求送货上门","甲告知乙使用设备的注意事项","甲将设备维修工具附赠给乙","甲将设备检验合格证交付给乙"],"a":"B","e":"合同义务包括先合同义务、合同履行中\n的附随义务、后合同义务。其中,附随义务是指合同\n履行过程中,为协助实现主给付义务,遵循诚实信用\n原则,根据合同的性质、目的和交易习惯而履行的通\n知、协助、保密等义务。在本题中,告知买受人使用设\n备的注意事项属于通知义务。因此,选择B。","k":"典型合同"},{"id":"2014-38","y":2014,"t":"单","s":"甲、乙、丙分别购买了某住宅楼(共3层)的一 层、二层、三层,各自办理了房产证。现丙欲出售其住 宅,对丙出售的住宅()。","o":["仅甲享有优先购买权","仅乙享有优先购买权","甲、乙均享有优先购买权","甲、乙均不享有优先购买权"],"a":"D","e":"本题考查的是优先购买权的适用。在\n我国,当按份共有人转让自己的份额时,在同等条件\n下,其他共有人享有优先购买权。但在本题中,甲乙\n丙三人分别购买了某住宅的三层楼,各自办理了登记\n手续,三人分别获得一层、二层、三层住宅楼的建筑物\n区分所有权,而不是对楼房的按份共有,故而丙出售\n其住宅时甲乙均不享有优先购买权。","k":"典型合同"},{"id":"2016-46","y":2016,"t":"多","s":"明知产品存在缺陷仍然实施某些行为,造成 他人死亡或者健康严重损害的,被侵权人有权请求相 应的惩罚性赔偿。这些行为包括()。","o":["生产","销售","运输","保管"],"a":"AB","e":"根据《民法典》的规定,明知产品存\n在缺陷仍然生产、销售,或者没有依据法律规定采\n取停止销售、警示、召回等有效补救措施,造成他人\n死亡或者健康严重损害的,被侵权人有权请求相应\n的惩罚性赔偿。据此,正确选项为A、B,C、D选项\n错误。","k":"典型合同"},{"id":"2017-24","y":2017,"t":"单","s":"根据我国《合同法》,下列当事人中,有权随时 解除合同的是( )。","o":["委托人","承揽人","出租人","赠与人"],"a":"A","e":"委托合同是指委托人和受托人约定,由\n受托人处理委托人事务的合同。委托合同以当事人\n之间的相互信任为前提,任何一方失去对对方的信\n任,都可以随时解除合同。因此A项正确。BCD项均\n在符合一定条件时才可以解除合同,而不是有权随时\n解除合同,BCD项错误。","k":"典型合同"},{"id":"2017-31","y":2017,"t":"单","s":"甲、乙约定:甲赠与乙紫砂壶一把,该合同在 乙结婚时生效。该合同属于()。","o":["附确定期限的合同","附不确定期限的合同","附延缓条件的合同","附解除条件的合同"],"a":"C","e":"附条件的民事法律行为是指双方当事\n人在民事法律行为中设立一定的事由作为条件,以条\n件的成就与否(是否发生)作为决定民事法律行为效\n力产生或解除根据的民事法律行为。民事法律行为\n中所附的条件必须是可能发生也可能不发生的事实,\n具有或然性。如果是将来必然发生的,则是附期限的\n民事法律行为。本题中甲与乙是否结婚是不确定的,\n不是将来必然发生的,因此不是附期限的法律行为,\nAB项错误。附条件的民事法律行为中根据条件对法\n律行为所起作用的不同,可将条件分为延缓条件和解\n除条件。延缓条件是指民事法律行为中所确定的民\n事权利和民事义务,要在所附条件成就时发生法律效\n力的条件。解除条件是指民事法律行为中所确定的\n民事权利和民事义务,在所附条件成就时就失去法律\n效力的条件。附解除条件的民事法律行为是已经发\n生法律效力的行为。本题中甲乙还未结婚,甲乙之间\n的赠与合同也还未生效,所以不是附解除条件的合\n同,D项错误。甲乙之间的赠与合同以结婚为发生效\n力的条件,在结婚成就时,赠与合同发生效力,是附延\n缓条件的合同,C项正确。","k":"典型合同"},{"id":"2018-30","y":2018,"t":"单","s":"甲公交公司的司机乙为避让闯红灯的行人 丙而急刹车,致乘客丁摔倒受重伤。丁的损害应由 ()。","o":["甲公司赔偿","甲公司和乙连带赔偿","乙赔偿","甲公司和丙连带赔偿"],"a":"A","e":"《民法典》第1191条第1款规定:\n\"用人\n单位的工作人员因执行工作任务造成他人损害的,由\n用人单位承担侵权责任。用人单位承担侵权责任后,\n可以向有故意或者重大过失的工作人员追偿。\"乙是甲\n公交公司的员工,乙执行职务的行为产生的损害由用\n人单位承担赔偿责任。BC项错误。","k":"典型合同"},{"id":"2018-39","y":2018,"t":"单","s":"甲与金科公司之间的约定属于合同法中的 ()。","o":["委托合同","行纪合同 l","居间合同","技术咨询合同"],"a":"C","e":"居间合同是指居间人向委托人报告订\n立合同的机会或者提供订立合同的媒介服务,委托人\n向居间人支付报酬的合同。本题中,金科公司为委托\n人甲提供订立合同的媒介服务,且甲支付金科公司报\n酬,符合居间合同的特征。C项正确。\n[特别说明]\n《民法典》已将\n\" 居间合同\n\" 的名称\n修改为\n\"中介合同\n\"。","k":"典型合同"},{"id":"2019-27","y":2019,"t":"单","s":"甲请同事吃饭,结账时发现没带钱,遂请好友 乙帮忙买单,乙碍于情面付款。后乙要求甲偿还,甲 拒绝。乙的付款行为属于()。","o":["赠与","代为清偿","无因管理","情谊行为"],"a":"B","e":"清偿,是指债务人依法律规定或合同约\n定完成义务的行为。债务人为实现债权之目的所为\n的给付行为,属于债务人清偿;债务人以外的第三人\n履行债务从而使债权人的债权得以实现的,被称为第\n三人代为清偿。无因管理是指没有法定或者约定的\n义务,为避免他人利益受损失而进行管理或者服务的\n行为,本题中并没有避免他人利益受损的意思,C 不\n选。本题中,甲请同事吃饭,在甲与饭店之间形成债\n权债务关系。甲是债务人,饭店是债权人。甲无力清\n偿,因此,请求乙代替自己履行债务从而使饭店的债\n权得以实现。乙的付款行为属千代为清偿,B项正\n确。乙并未有任何赠与的意思表示,仅仅是碍于情面\n代为付款,A不选。情谊行为作为日常交往活动,一\n般不纳入民法的调整范围,但是本题中明确指出甲请\n客吃饭,仅仅因为没带钱而让乙帮忙付款,乙事后要\n求甲偿还饭款,题干信息很明确地告诉考生这不属于\n情谊行为,D 不选。","k":"典型合同"},{"id":"2019-30","y":2019,"t":"单","s":"导游甲带团赴国外旅游,朋友乙委托其代购 三块名表。回国时,甲代购的名表被海关检查发现, 甲被罚款。对此,下列选项正确的是()。","o":["乙应当承担甲支付的海关罚款","甲有权要求乙分担一半的国际机票费用","如手表存在质量问题,乙有权向甲主张退货","甲有权要求乙支付使用甲的信用卡所享受的 折扣优惠价款"],"a":"A","e":"《民法典》第930 条规定:\"受托人处理\n委托事务时,因不可归责于自己的事由受到损失的,\n可以向委托人要求赔偿损失。\"本题中,乙委托甲购买\n三块手表,因不可归责千甲的原因被海关罚款,造成\n损失,对于该损失,甲可以向乙要求赔偿。因此,本题\n选A。代理是代理人以被代理人的名义,在代理权内\n与第三人的法律行为,其法律后果直接由被代理人承\n受的民事法律制度,题干并未有关千甲超越代理权的\n信息且甲并非手表的生产者和销售者,如手表存在质\n量问题,乙无权要求甲退货,而只能找手表的生产者\n或销售者主张退货,C不选。甲乙并未就机票费用有\n任何约定,且甲身为导游带团赴国外旅游,其机票支\n出是出于带团本身的需要,故B 不选。代理人在代理\n权内与第三人的法律行为,其法律后果直接由被代理\n人承受,此处的法律后果也包括所得利益(优惠折\n扣),故D 不选。","k":"典型合同"},{"id":"2020-24","y":2020,"t":"单","s":"画家甲丧偶后,独自抚养儿子乙。某日,甲将 自己的一幅画作交给朋友丙保管,嘱托丙待自己去世 后烧毁该画作。甲去世后,丙违背甲的嘱托,将画作 交拍卖公司拍卖,得款50万元。该50万元应当 ()。","o":["归乙所有","归丙所有","由乙、丙平分","归国家所有"],"a":"A","e":"丙违背甲的嘱托,将画作交拍卖公司拍\n卖,该行为违反了甲与丙之间的保管合同的约定,甲\n可以要求丙返还拍卖价款。由于甲已经去世,乙作为\n甲的继承人,法定承受甲对丙享有的合同侦权,因此,\n该50万元应该归乙所有,A选项正确。","k":"典型合同"},{"id":"2020-33","y":2020,"t":"单","s":"银行与自然人之间的借款合同属于()。","o":["实践性合同","有偿合同","从合同","单务合同"],"a":"B","e":"金融机构借款合同,是指金融机构作为\n贷款人一方办理贷款业务,向借款人提供贷款,借款\n人到期返还借款并支付利息的合同。金融机构借款\n合同是有偿合同、要式合同、诺成合同。银行与自然\n人之间的借款合同属千金融机构借款合同,B选项正\n确,ACD选项错误。","k":"典型合同"},{"id":"2020-48","y":2020,"t":"多","s":"甲、乙、丙、丁一家四口乘坐某客运公司的客 车去旅游。甲购买了全票,乙购买了优待票,丙购买 了半票,丁免票。因司机疲劳驾驶发生交通事故,全 车旅客受伤。下列人员中,有权请求客运公司赔偿的 有()。","o":["甲","乙","丙","丁"],"a":"ABCD","e":"《民法典》第823条规定:\"承运人应当\n对运输过程中旅客的伤亡承担赔偿责任;但是,伤亡\n是旅客自身健康原因造成的或者承运人证明伤亡是\n旅客故意、重大过失造成的除外。前款规定适用于按\n照规定免票、持优待票或者经承运人许可搭乘的无票\n旅客。\"因此,ABCD选项均正确。","k":"典型合同"},{"id":"2024-36","y":2024,"t":"单","s":"甲承租乙的房屋后私自进行装修,装修公司根据甲的装修要求拆除了承重墙,致多 个楼层墙壁开裂,该楼居民被紧急疏散。该楼居民的损失应当由()","o":["甲承担全部赔偿责任","装修公司承担全部赔偿责任","甲和装修公司共同承担赔偿责任","甲乙和装修公司承担连带赔偿责任"],"a":"C","e":"","k":"典型合同"},{"id":"2025-27","y":2025,"t":"单","s":"2021 年3 月甲将房屋出租给乙,租期三年。2023 年3 月,乙因去国外访学一年,经甲 同意将房屋转租给丙,租期一年。2024 年3 月租期届满,甲继续出租该房屋。对此,下列说 法正确的是( )","o":["房屋转租后,甲与乙之间的房屋租赁合同终止","房屋转租后,甲与丙之间成立房屋租赁合同","丙承租房屋的事实属于并存的债务承担","乙享有以同等条件优先承租的权利"],"a":"D","e":"《民法典》第716 条第1 款规定:\"承租人经出租人同意,可以将租赁物转租给第\n三人。承租人转租的,承租人与出租人之间的租赁合同继续有效;第三人造成租赁物损失的,\n承租人应当赔偿损失。\"AB 项错误。并存的债务承担需第三人明确加入债务关系,而转租中丙\n仅取得房屋使用权,乙仍需向甲履行原租赁合同义务,C 项错误。《民法典》第734 条第1 款\n规定:\"租赁期限届满,房屋承租人享有以同等条件优先承租的权利。\"D 项正确。本题选D。","k":"典型合同"},{"id":"2026-22","y":2026,"t":"单","s":"甲牵着禁止饲养的烈性犬在小区散步时,该犬突然冲向骑自行车的乙致乙摔 伤。事后查明乙当时正在查看手机。乙的损害应由","o":["甲全部赔偿","乙自行承担","甲和乙分担","甲和小区物业服务企业连带赔偿"],"a":"A","e":"禁止饲养烈性犬致人损害,适用无过错责任,且无减责免责事由,受害人\n看手机不属于重大过失,由甲全部赔偿。","k":"典型合同"}]},{"sub":"民法","name":"担保物权","w":0.9,"L":17,"qs":[{"id":"2005-43","y":2005,"t":"单","s":"下列合同中,当事人不能行使留置权的是(   )","o":["借款合同","运输合同","承揽合同","行纪合同"],"a":"A","e":"担保法第84 条规定:\"因保管合同、运输合同、加工承揽合同发生的债权,债务人不履行债务的,\n债权人有留置权。\"\"法律规定可以留置的其他合同,适用前款规定。\"合同法第264 条、第315 条、第395 条、\n第380 条和第422 条分别规定承揽合同承揽人、运输合同承运人、保管合同保管人、仓储合同保管人和行纪合同行\n纪人可以依法行使留置权。","k":"担保物权"},{"id":"2005-49","y":2005,"t":"单","s":"下列选项中,可以质押的是(   )","o":["动产和智力成果","动产和权利","智力成果和权利","人身利益和权利"],"a":"B","e":"智力成果是知识产权的客体,是无形的,不能直接作为质权的客体。可以质押的是商标专用权以及\n专利权、著作权中的财产权。人身利益和权利不可转让,当然不能担保债权的实现。","k":"担保物权"},{"id":"2007-38","y":2007,"t":"单","s":"根据担保法规定,下列财产中,不得抵押的是 (   ) 。","o":["乡办企业的厂房","国有企业的机器设备","学校的教学楼","私营企业的交通运输工具"],"a":"C","e":"{考点] 不得抵押的财产 \n]根据担保法规定,不得抵押的财产有:(1)土地所有权;(2)耕地、宅基地、自留地、自 \n留山等集体所有的土地使用权,法律另有规定的除外;(3)学校、幼儿园、医院等以公益为 \n目的的事业单位、社会团体的教育设施、医疗卫生设施和其他社会公益设施;(4)所有权、 \n使用权不明或者有争议的财产;(5)依法被查封、扣押、监管的财产;(6)依法不得抵押的其 \n他财产。故答案为 C。","k":"担保物权"},{"id":"2007-39","y":2007,"t":"单","s":"画家甲为办画展向朋友乙借款 5 万元,并将自己的一幅画交给乙作担保,要求其妥善保管。双方约定 1 年内 甲还 款取画,否则该画即归乙所有。现乙对该画 (   ) 。","o":["享有权利质权","享有动产质权","不享有任何权利","享有留置权"],"a":"B","e":"- 14 -\n\n \n \n更多考研精品资料,关注淘宝店铺:光速考研工作室 \n质权 \n] 质权是指债务人或者第三人将其动产或财产权利证书移交债权人占有,将该动产作 \n为履行债务的担保,债务人不履行债务时,债权人有权将该动产或权利证书载明的财产权利 \n折价或者以拍卖、变卖该动产或者财产权利的价款优先受偿的权利。甲以期一幅画为担保, \n是动产质押,并非权利质押,那么乙所享有的是动产质权。","k":"担保物权"},{"id":"2011-22","y":2011,"t":"单","s":"下列权利中,属于相对权的是( )。","o":["配偶权","抵押权","邻接权","债权"],"a":"D","e":"l\n绝对权和相对权是以权利人可以对抗\n的义务人的范围为标准对民事权利所作的分类。绝\n对权,权利人特定,义务人不特定;相对权,权利人和\n义务人均为特定人。两者区分的关键是其义务人是\n否特定。物权、人身权属于绝对权,债权属于相对权,\n答案选D。","k":"担保物权"},{"id":"2012-31","y":2012,"t":"单","s":"根据我国担保法的规定,保证合同未约定保 证期间的,保证期间为主债务履行期届满之日起 )。","o":["6个月","1年","2年","4年"],"a":"A","e":"保证人与债权人未约定保证期间的,债\n.权人有权自主债务履行期届满之日起6个月内要求\n保证人承担保证责任。故选A。在合同约定的保证\n期间和前款规定的保证期间,债权人未要求保证人承\n担保证责任的,保证人免除保证责任。","k":"担保物权"},{"id":"2013-48","y":2013,"t":"多","s":"甲因借款与乙签订房屋抵押合同,未办理抵 押登记。其后甲又因借款将该房屋抵押给丙并办理 了抵押登记。现甲不能偿还对乙、丙的欠款。根据我 国民法相关规定()。","o":["甲、乙之间的抵押合同成立","甲、丙之间的抵押合同成立","乙享有抵押权","丙享有抵押权"],"a":"ABD","e":"l\n本题考查的是抵押合同的成立与生效。\n抵押合同若是以不动产、不动产权利、海域使用权以\n及正在建造的建筑物进行抵押的,应当办理抵押登\n记,抵押权自登记时设立。本题中甲与乙签订的是不\n动产房屋的抵押合同。抵押合同在双方意思表示真\n实一致时成立,而抵押合同只能是在进行抵押权登记\n后生效,并取得抵押权。乙没有办理抵押登记,故不\n享有抵押权。答案ABD。\n考生需要注意禁止抵押财产的范围。根据司法\n解释规定,禁止抵押的财产包括所有权、使用权不明\n或者有争议的财产,但是当事人以所有权、使用权不\n明或者有争议的财产抵押,经审查构成无权处分的,\n依照善意取得的规定处理。也即,抵押合同是有效\n的。另外,禁止抵押的财产也包括被查封、扣押、监管\n的财产,但是以依法被查封、扣押、监管的财产抵押,\n抵押合同仍然有效,并且,经审查,查封、扣押、监管措\n施已经解除的,抵押权人甚至有权行使抵押权。","k":"担保物权"},{"id":"2014-31","y":2014,"t":"单","s":"甲向乙借款10万元,由丙作保证人。在保证 期间,甲将债务移转给丁,当事人对丙是否继续承担 保证责任未作约定。根据担保法规定()。","o":["丙应无条件地继续承担保证责任","丙在任何情况下均不再承担保证责任","如果债务移转后书面通知了丙,则丙应继续承 担保证责任","如果债务移转得到了丙的书面同意,则丙应 继续承担保证责任"],"a":"D","e":"根据《民法典》规定,在保证期间,债权\n人许可债务人转移全部或者部分的,应当取得保证人\n书面同意,保证人对未经其同意转移的债务,不再担\n任保证责任。在保证期间甲把债务转移给丁时,如果\n债务转移得到了丙的书面同意,则丙应继续承担保证\n责任。","k":"担保物权"},{"id":"2015-23","y":2015,"t":"单","s":"下列行为中,属于从法律行为的是( )。","o":["行纪合同","协议离婚","履行行为","抵押合同"],"a":"D","e":"主民事法律行为是指不需要其他法律\n行为而能够独立存在的法律行为,从民事法律行为随\n着主民事法律行为的成立而成立,也随着主民事法律\n行为的无效而无效。在当事人为担保债权实现设定\n抵押权的情形下,债权合同是主民事法律行为,抵押\n合同是从民事法律行为。因此,选择D选项。AB 选\n项是主法律行为,C选项是事实行为。","k":"担保物权"},{"id":"2017-26","y":2017,"t":"单","s":"甲将一批货物存放在乙的仓库,之后丙因甲 拖欠其15万元货款,强行将该批货物拉走抵债。对 此,下列说法正确的是()。","o":["丙的行为属于自助行为","丙的行为属于行使留置权",".乙请求丙返还货物的权利存续期间为1年","甲请求丙返还货物的权利存续期间为2年"],"a":"C","e":"A项错误,丙的行为不属于自助行为。\n自助行为是指权利人为保护自己的权利,在来不及请\n求公力救济的情况下,对义务人的财产予以扣押或者\n对其人身自由予以约束等行为。本题中并不存在来\n不及请求公力救济的情况,丙完全可以通过诉讼等公\n力救济的手段维护自己的权利。B项错误,丙的行为\n不是行使留置权。留置权的成立要求债权人已合法\n占有属于债务人所有的动产,且债权人对该动产的占\n有与其债权的发生出自同一法律关系。本题中,丙没\n有合法占有甲的动产,合法占有甲的动产的是乙。C\n项正确,乙是货物的合法占有人。乙通过仓储合同合\n法占有这批货物,作为占有人,乙有权要求丙返还占\n有物。《民法典》第462条规定:\"占有的不动产或者\n动产被侵占的,占有人有权请求返还原物;对妨害占\n有的行为,占有人有权请求排除妨害或者消除危险;\n因侵占或者妨害造成损害的,占有人有权依法请求损\n害赔偿。占有人返还原物的请求权,自侵占发生之日\n起一年内未行使的,该请求权消灭。\n\" 因此C项正确。\nD项错误,《民法典》第235 条规定:\"无权占有不动产\n或者动产的,权利人可以请求返还原物。\"根据《民法\n典》第196条第2 款的规定,不动产物权和登记的动\n产物权的权利人请求返还财产,不适用诉讼时效。据\n此,未登记的动产的返还原物请求权适用诉讼时效,\n甲作为该批动产货物的所有权人,请求返还货物的权\n利适用3年的诉讼时效。占有返还请求权与返还原\n物请求权是一个重点考点,也是容易混淆的知识点,\n文运法硕建议考生将两者进行细致区分并加以记忆。","k":"担保物权"},{"id":"2017-28","y":2017,"t":"单","s":"甲为担保对乙的债务,于2015年3月1日与 乙签订质押合同,承诺将自己的越野车质押给乙。同 年4月1日甲交付越野车,但未将随车工具箱交付给 乙。对此,下列说法正确的是()。","o":["乙于3月1日取得质权","乙对随车工具箱享有质权","质押合同于3月1日生效","质押合同于4月1日成立"],"a":"C","e":"质权是指债务人或者第三人将其动产\n或财产权利交给债权人占有或控制,以此作为履行债\n务的担保,在债务人不履行债务时,债权人得以该动\n产或财产权利的价值优先受偿的权利。质押合同是\n诺成性合同,自合同订立时生效。但是合同生效不等\n于质权设立,质权于质押财产交付时设立。本题中,\n质押合同于3月1日签订,也于3月1日生效。C项\n正确,D项错误。4月1日,甲将越野汽车交付给乙,\n此时质权设立,乙取得质权。A项错误。甲未将随车\n工具箱交付给乙,对随车工具箱的质权未设立,乙对\n随车工具箱不享有质权,B项错误。","k":"担保物权"},{"id":"2020-30","y":2020,"t":"单","s":"甲向乙借款100万元。为担保乙的债权,甲 以一套价值50万元的房屋作抵押,丙以一套价值50 万元的房屋作抵押,丁提供保证。现甲不能偿还到期 债务。对此,下列说法正确的是()。","o":["乙应当先就甲的房屋实现抵押权","乙应当先就丙的房屋实现抵押权","乙应当先请求丁承担保证责任","乙可以同时请求甲、丙、丁承担按份担保责任"],"a":"A","e":"根据《民法典》规定,被担保的债权既\n有物的担保又有人的担保的,债务人不履行到期债务\n或者发生当事人约定的实现担保物权的清形,债权人\n应当按照约定实现债权;没有约定或者约定不明确,\n债务人自己提供物的担保的,债权人应当先就该物的\n担保实现债权;第三人提供物的担保的,债权人可以\n就物的担保实现债权,也可以要求保证人承担保证责\n任。本题中既有物的担保,又有人的担保,甲作为债\n务人,以自己的房屋为乙作了抵押,乙应当先就该物\n的担保实现债权,A选项正确,BCD选项错误。\n[特别说明)\n司法解释进一步明确,从物产生于\n抵押权依法设立前,抵押权及于从物,从物产生于抵\n押权依法设立之后,抵押权不及于从物,但抵押权实\n现时可以一并处分,但对从物所得价款无优先受\n偿权。","k":"担保物权"},{"id":"2022-24","y":2022,"t":"单","s":"X银行、Y公司、乙公司三方约定∶X银行贷款给Y公司,Y公司以存放在港口仓库 中的1000吨某型号钢材提供质押,X银行委托Z公司监管。合同签订后,Z公司派员工 入驻钢材仓储地控制钢材。本案中,质权的设立时间为","o":["三方协议生效之日","X银行放贷之日","Z公司实际控制钢材之日","港口仓库收到三方协议之日"],"a":"C","e":"Y公司以1000吨某型号钢材提供动\n产质押,以担保X银行向其提供的贷款。X银行为债\n权人、质权人,Y公司为债务人、出质人。X银行委托\n亿公司监管,Z公司为X银行委托的监管人。根据\n《民法典》第429条规定:\"质权自出质人交付质押财\n产时设立。\"因此,根据《民法典》及司法解释,本案中\n监管人Z公司实际控制钢材之日即X银行取得质押\n财产占有之日,也即质权设立之日。故C选项正确。","k":"担保物权"},{"id":"2024-34","y":2024,"t":"单","s":"甲借给乙10万元,约定到期偿还12万,该笔债务由丙提供担保。后甲将汽车以12 万价格卖给乙,乙未付款。现两项债务均已到期,乙将8万交给甲清偿债务。半年后,甲乙 就债务清偿发生争议,乙主张自己清偿的是借款债务。对此,下列说法正确的是()","o":["因借款债务约定有利息,故乙清偿的是借款债务","因汽车价款债务缺乏担保,故乙清偿的是汽车价款债务","因清偿任何债务可以由债务人指定,故乙清偿的是借款债务","因债具有平等性,故乙的清偿为按比例清偿两项债务"],"a":"B","e":"","k":"担保物权"},{"id":"2024-40","y":2024,"t":"单","s":"甲把一块手表给乙保管,乙擅自将手表质押给丙,向丙借款2万元,丙在乙未同意 的情况下质押给知情人债权人丁,用来担保自已的1万元货款,现上述债务均已到期,下列 正确的是()","o":["只有丙有质权","丙、丁享有质权,丙质权优先","丙、丁均不享有质权","丙丁享有质权,丁质权优先"],"a":"A","e":"","k":"担保物权"},{"id":"2024-49","y":2024,"t":"多","s":"甲将其汽车借给乙,乙在开车时将车门撞坏,在丙处进行维修,乙未支付修车费而 离去。丙将该汽车留置。下列说法正确的有()","o":["维修厂丙有权留置该汽车","甲可以代为支付维修费","甲有权要求乙归还车辆","甲有权要求丙归还车辆"],"a":"AB","e":"","k":"担保物权"},{"id":"2025-24","y":2025,"t":"单","s":"甲向银行借款,并以其出租给乙的房屋抵押。抵押期间甲将该房屋转让给丙。乙在租 赁期满后拒绝搬出。甲到期未还款。下列人员中,无权代甲还款的是( )","o":["甲的配偶","甲的父母","乙","丙"],"a":"C","e":"本题所问\"无权代甲还款\"的主体,可以理解为无法律义务或权利基础代为还款\n的人。甲的配偶、父母作为甲的近亲属,丙作为房屋的买受人均可自愿代为还款(无法律禁止),\n但无强制义务。乙作为承租人,与甲的借款完全无关,既无法律义务也无权利基础代为还款。\n乙与借款无任何关联,是最符合\"无权代还\"的选项,本题选C。","k":"担保物权"}]},{"sub":"民法","name":"民法总则与基本原则","w":1.0,"L":16,"qs":[{"id":"2005-31","y":2005,"t":"单","s":"下列有关民事法律关系的说法中错误的是(   )","o":["民事法律关系属于思想的社会关系","民事法律关系需具备主体、内容和客体三个要素","民事法律关系只能因合法行为而产生","民事法律关系只能存在于平等民事主体之间"],"a":"C","e":"本题完全可以借助法理学关于法律关系的知识点把握。民事法律关系,是民法在调整平等主体之间\n的人身关系和财产关系的过程中形成的权利义务关系。民法是民事法律关系产生的前提,而民法体现了国家意志,\n因此民事法律关系与所有的法律关系一样,都属于思想的社会关系。任何法律关系都是由主体、内容和客体组成的,\n民事法律关系也不例外。民事法律关系和所有的法律关系一样,既可以产生于合法行为,也可以产生违法行为,因\n- 10 -\n\n \n \n更多考研精品资料,关注淘宝店铺:光速考研工作室 \n此选项C 错误。选项D 是由于民法的调整对象所决定的。","k":"民法总则与基本原则"},{"id":"2005-48","y":2005,"t":"单","s":"甲、乙双方连续几年订有买卖“交流电机”的合同。有一次签定合同时,在“标的物”一栏只写了“电机”两 字 。 当时正值交流电机热销,而甲方供不应求,故甲方就以直流电机交货。就民法的基本原则而言,甲方违反了(   )","o":["自愿原则","诚实信用原则","禁止权利滥用原则","公序良俗原则"],"a":"B","e":"尽管在\"标的物\"一栏只写了\"电机\"两字,没有明确是直流电机还是交流电机;但甲、乙双方连\n续几年订有买卖\"交流电机\"的合同,根据双方达成的交易习惯,应当标的物应当是交流电机。甲方没有恪守信用,\n违反了诚实信用原则。很明显,甲方的行为谈不上违反自愿原则和公序良俗原则。甲方违反诚信履行义务,并非滥\n用权利,因此也排除选项C。","k":"民法总则与基本原则"},{"id":"2006-54","y":2006,"t":"多","s":"下列行为中,属于单方法律行为的是(       )","o":["授权行为","行使撤消权的行为","买卖行为","行使法定抵消权的行为"],"a":"ABD","e":"单方法律行为的是基于一方当事人的意思表示即可成立的民事法律行为,题中只有买卖行为是基于\n双方合意才能成立的行为,所以可排除;其他的可单方意思表示即可。所以选ABD。","k":"民法总则与基本原则"},{"id":"2007-31","y":2007,"t":"单","s":"下列民事法律关系中,属于绝对法律关系的是 (   ) 。","o":["人身权法律关系","无因管理法律关系","不当得利法律关系","合同法律关系"],"a":"A","e":"绝对法律关系 \n]绝对法律关系是指在权利人之外、一切不特定人均为义务人的民事法律关系,人身权 \n法律关系属于这一类型。无因管理法律关系、不当得利法律关系和合同法律关系都属于相对 \n法律关系,与权利人相对的义务人具体、特定。故答案为 A。","k":"民法总则与基本原则"},{"id":"2009-31","y":2009,"t":"单","s":"胡某花了 1.5 万元找刘某算命,后觉得刘某算得不准,将刘某告上法院索要算命款。对胡某与刘某之间的关系, 下 列表述中正确的是(   )。","o":["二者之间形成合同关系","二者之间形成不当得利关系","二者之间形成侵权关系","二者之间不能形成民事法律关系"],"a":"D","e":"本题考查民事法律关系的概念。民事法律关系是由民事法律规定范所确认和保护的社会关系,算\n命属于封建迷信行为,不为我国确认和保护,因此胡某和刘某之间不形成民事法律关系。本题答案为D","k":"民法总则与基本原则"},{"id":"2009-41","y":2009,"t":"单","s":"某旅游者与旅行社签订一份由旅行社提供的旅游合同。在该合同履行过程中,旅行社和旅游者对合同中“名胜 古 迹”含义的理解发生分歧。旅游者认为某建筑属于名胜古迹,旅行社应当安排游览,而旅行社持相反观点。根据 合同法规定 , 对此条款的解释应按照(    )。","o":["通常理解进行解释","公平原则进行解释","旅游习惯进行解释","对旅行社不利原则进行解释"],"a":"D","e":"本题格式条款的解释。《合同法》第39 条规定,格式条款是指当事人为了重复使用而预先拟定,并\n在订立合同时未与对方协商的条款。《合同法》第41 条规定,对格式条款的理解发生争议的,对格式条款有两种以\n上解释的,应当作出不利于提供格式条款的一方的解释。格式条款和非格式条款不一致的,应采用非格式条款。本\n题中,格式条款由履行社提供,当旅行社和旅行者对合同中\"名胜古迹\"含义的理解发生分歧时、应当作出不利于\n旅行社的解释。因此本题的答案为D","k":"民法总则与基本原则"},{"id":"2012-46","y":2012,"t":"多","s":"民事权利的私力救济方式包括( )。","o":["自卫行为","民间调解","自助行为","民事仲裁"],"a":"AC","e":"私力救济是指权利主体在法律允许的\n范围内,依靠自身的力量,通过实施自卫行为或者自\n助行为等来救济自已被侵害的民事权利。故AC正\n确。民间调解和民事仲裁都有第三方介入,不是私力\n救济方式。","k":"民法总则与基本原则"},{"id":"2012-50","y":2012,"t":"多","s":"下列选项中,属于我国继承法基本原则的有","o":["养老育幼原则","诚实信用原则","继承权男女平等原则","互谅互让、团结和睦原则 三、简答题:第51~54小题,每小题6分"],"a":"ACD","e":"基本原则有:保护公民的财产继承权原\n则,继承权平等原则,养老育幼原则,互谅互让、和睦\n团结原则,权利义务相一致原则。诚实信用原则是民\n法的基本原则。\n三、简答题","k":"民法总则与基本原则"},{"id":"2013-21","y":2013,"t":"单","s":"下列选项中,属于民事法律关系的是(","o":["甲男与乙女之间的恋人关系","甲公司与乙公司之间的技术转让关系","甲公司与其分支机构之间的业务指导关系","甲教育局与乙中学之间的管理关系"],"a":"B","e":"所谓民事法律关系,是指由民事法律规\n范所确立的以民事权利和民事义务为主要内容的法\n律关系。选项A 中甲乙之间的恋人关系并不受民法\n所调整,也未形成等价的权利义务关系,因此不是民\n事法律关系;选项C 中的甲公司与分支机构之间的关\n系,由千主体地位并不平等,没有互担权利义务,不属\n于民事法律关系;选项D 中甲教育局与乙中学的关系\n属千行政关系亦不属千民事法律关系。因此ACD均\n予以排除。而B选项的技术转让是一种合同关系,相\n互确立了对方享有的权利和承担的义务,双方主体地\n位平等,权利义务对等,故属于民事法律关系。","k":"民法总则与基本原则"},{"id":"2016-22","y":2016,"t":"单","s":"下列民事法律关系中,需要两个法律事实才 能产生的是()。","o":["抵押关系 )","遗嘱继承关系","侵权赔偿关系","婚姻关系"],"a":"B","e":"产生遗嘱继承需要两个法律事实1被继\n承人生前所立遗嘱合法有效;遗嘱指定的继承人享有\n继承权,即遗嘱指定的继承人未丧失,也未放弃继承\n权。所以选B。\n动产抵押,只需要抵押合同生效即可,不登记不\n能对抗善意第三人。即动产抵押关系的产生只需要\n一个法律事实:抵押合同生效,因此不选A。\n侵权赔偿关系的产生只需要一个法律事实:存在\n侵权行为,因此不选C。\n婚姻关系的产生只需要一个法律事实:到婚姻登\n记机关进行结婚登记,取得结婚证,因此不选D。","k":"民法总则与基本原则"},{"id":"2017-21","y":2017,"t":"单","s":"下列事实中,能引起甲、乙之间民事法律关系 发生的是()。","o":["甲向乙问路,乙因疏忽指错方向","甲赌博输给乙2万元并当场给付","甲、乙约定某日商谈“互联网+创意”合作合同","甲开车撞断乙公司的输电线,造成损失 3000元"],"a":"D","e":"民事法律关系是民法在调整平等主体\n之间的人身关系和财产关系的过程中所形成的社会\n关系,要形成民事法律关系,必须由民法调整,民法不\n调整的,无法形成民事法律关系。B项中的赌博行\n为,民法不调整,因此B 项无法形成民事法律关系,B\n项错误。民事法律关系以民事权利和民事义务为主\n要内容,民事法律关系产生意味着当事人取得权利、\n承担义务。A项中乙虽然指错了路的方向,但是在甲\n\n乙之间并不产生权利义务关系,因此A项不能引起民\n事法律关系发生。C项中甲乙只是商谈合作合同,但\n并没有正式签订合作合同,在甲乙之间没有形成权利\n义务关系,也就是没有产生民事法律关系,C项错误。\nD项中甲撞断了乙公司的输电线,给乙公司造成了财\n产损失,根据法律规定,甲需承担损害赔偿的责任。\n甲具有赔偿的义务,乙公司具有收取赔偿款的权利,\n甲乙之间产生了民事法律关系,D项正确。","k":"民法总则与基本原则"},{"id":"2017-23","y":2017,"t":"单","s":"甲、乙未婚同居。乙谎称怀孕,迫使甲承诺: 甲给付乙“结婚保证金”50万元,如半年内不与乙结 婚不得要求返还。甲、乙之间的约定( )。","o":["因甲受胁迫可撤销","因甲受欺诈可撤销","因违反公序良俗原则而无效",".因违反法律的强制性规定而无效"],"a":"C","e":"民事法律行为的实质有效要件包括:\n(I)行为人合格。(2)行为人意思表示真实。\n(3)不违反法律、行政法规的强制性规定,不违背公序\n良俗。公序良俗是社会公共秩序和善良风俗的合称,\n良俗即善良风俗,学界一般认为系指为社会、国家的存\n在和发展所必要的一般道德,是特定社会所尊重的起\n码的伦理要求。善良风俗是以道德要求为核心的。公\n序良俗是民法的基本原则之一,民事主体进行民事活\n动必须与之相符,违背公序良俗的行为无效。本题中,\n乙谎称怀孕并以怀孕为理由要求甲给付\n\" 结婚保证\n金\n\",如果不结婚就不予返还,违反了善良风俗,甲乙之\n间的约定因违反公序良俗而无效,C项正确。","k":"民法总则与基本原则"},{"id":"2019-21","y":2019,"t":"单","s":"下列行为中,由民法调整的是()。","o":["甲与网友相约一起参加电子竞技","乙大学拒绝授予郑某硕士学位","丙在相亲活动中与王某成功“牵手”","丁公安局发布公告:“提供破案线索者,奖励 3000元”"],"a":"D","e":"民法调整的是平等主体之间人身关系\n和财产关系的法律规范的总和。A项是相约游戏,在\n当事人之间不产生民事权利和民事义务,不由民法调\n整。B项大学与学生之间在学位方面是管理与被管\n理的关系,二者不是平等主体之间的关系,学校与学\n生之间由千学位而导致的纠纷属千行政诉讼,注意这\n里有限定,是学位纠纷,如果因为其他的纠纷,学校和\n学生之间也可能存在民法调整的法律关系。C项丙\n在相亲活动中\n\" 牵手\n\",丙与王某之间可能会产生恋爱\n关系,但是恋爱关系不由民法调整,民法调整的是婚\n\n姻关系和继承关系。D项丁公安局发布的公告是悬\n赏广告。悬赏广告是指以广告的方式公开表示对千\n完成一定行为的人给予报酬的意思表示。在D项中,\n公安局与提供破案线索者之间是平等主体,不是管理\n与被管理的关系,因此由民法调整。本题选D。","k":"民法总则与基本原则"},{"id":"2022-48","y":2022,"t":"多","s":"情事变更制度体现的民法基本原则包括","o":["自愿原则","公序良俗原则","平等原则","公平原则"],"a":"ACD","e":"《民法典》第533条规定了基于情事变\n更规则解除合同,即\"合同成立后,合同的基础条件发\n生了当事人在订立合同时无法预见的、不属于商业风\n险的重大变化,继续履行合同对于当事人一方明显不\n公平的,受不利影响的当事人可以与对方重新协商;\n在合理期限内协商不成的,当事人可以请求人民法院\n或者仲裁机构变更或者解除合同。人民法院或者仲\n裁机构应当结合案件的实际情况,根据公平原则变更\n或者解除合同。\"情事变更制度体现了民事主体在民\n事法律关系中平等协商,按照自已的意思表示设立、\n变更、终止民事法律关系,司法机关公平合理地处理\n民事纠纷,即平等、自愿、公平原则。故本题选择\nACD。公序良俗原则是指民事主体从事民事活动,不\n得违背公共秩序和善良风俗,情事变更制度中并没有\n体现该原则。B选项错误。","k":"民法总则与基本原则"},{"id":"2024-38","y":2024,"t":"单","s":"小刚父亲带3岁的小刚去几童乐园,小刚父亲去点餐区点餐,小刚在十几米外的儿 童游乐区,现场无工作人员维持秩序,也无安全提示标志,小刚从滑梯跳下受伤,该损伤由 ()","o":["小刚独自承担","儿童乐园和工作人员共同承担赔偿责任","儿童乐园承担赔偿责任,但可予以减轻","儿童乐园和小刚根据公平原则分担"],"a":"C","e":"","k":"民法总则与基本原则"},{"id":"2025-48","y":2025,"t":"多","s":"关于民法典施行前的法律事实引起的民事纠纷案件的法律适用,下列说法正确的有 ( )","o":["法律事实持续至民法典施行后,适用民法典的规定,但是法律、司法解释另有规定的除 外","当时的法律、司法解释有规定的,一律适用当时的法律、司法解释的规定","当时的法律、司法解释没有规定而民法典有规定的,一律适用民法典的规定","当时的法律、司法解释仅有原则性规定而民法典有具体规定的,适用当时的法律、司法 解释的规定,但是可以依据民法典具体规定进行裁判说理"],"a":"AD","e":"根据《最高人民法院关于适用〈中华人民共和国民法典〉时间效力的若干规定》\n的规定,民法典施行前的法律事实持续至民法典施行后,该法律事实引起的民事纠纷案件,适\n\n用民法典的规定,但法律、司法解释另有规定的除外。A 项正确。B 项错误,并非一律适用旧\n法,法律事实持续至民法典施行后或符合《最高人民法院关于适用〈中华人民共和国民法典〉\n时间效力的若干规定》其他情形的,可能适用民法典。C 项错误,当时的法律、司法解释没有\n规定而民法典有规定的,可以适用民法典的规定,但明显减损当事人合法权益、增加当事人法\n定义务或背离当事人合理预期的除外。当时的法律、司法解释仅有原则性规定而民法典有具体\n规定的,适用当时的法律、司法解释的规定,但可以依据民法典具体规定进行裁判说理,D 项\n正确。本题选AD。","k":"民法总则与基本原则"}]},{"sub":"民法","name":"诉讼时效与期间","w":0.7,"L":14,"qs":[{"id":"2006-38","y":2006,"t":"单","s":"根据有关法律法规规定,《民法通则》中的“二十年诉讼时效期间”(   )","o":["可以中止和中断","可以中断和延长","可以延长","可以中止和延长"],"a":"C","e":"最长诉讼时效的特点;1、适用范围广涉及各类民事法律关系2、时效期间20 年3、前提是从权利被侵\n害之日起20 年4、其时效可延长而不适用中止、中断的规定。","k":"诉讼时效与期间"},{"id":"2011-33","y":2011,"t":"单","s":"根据法律规定,因技术进出口合同争议提起 诉讼的期限为( )。","o":["1年","2年","3年","4年"],"a":"D","e":"《民法典》第594 条规定:\n\"因国际货物\n买卖合同和技术进出口合同争议提起诉讼或者申请\n仲裁的时效期间为四年。\n\" 因此本题选D。","k":"诉讼时效与期间"},{"id":"2012-26","y":2012,"t":"单","s":"下列情形中,不能引起诉讼时效中断的是 ( . )。","o":["权利人申请仲裁","权利人主张权利","义务人同意履行义务","权利人因不可抗力不能起诉"],"a":"D","e":"诉讼时效是指权利主体在法定期间内\n不行使权利,义务人便享有抗辩权,从而导致权利人\n无法胜诉的法律制度。诉讼时效的中断,是指在诉讼\n时效进行中,因一定事由的发生,阻碍时效进行,致使\n以前经过的时效期间统归无效,从中断、有关程序终\n\n结时起,其诉讼时效重新计算的制度。以下情况引起\n诉讼时效的中断:(1)权利人向义务人提出履行请\n求;(2)义务人同意履行义务;(3)权利人提起诉讼\n或者申请仲裁;(4)与提起诉讼或者申请仲裁具有同\n等效力的其他情形。权利人因不可抗力不能起诉,属\n于诉讼时效中止的情况。故选D。要注意与刑法中\n诉讼时效的中断、中止相区别。","k":"诉讼时效与期间"},{"id":"2013-28","y":2013,"t":"单","s":"下列选项中,可引起诉讼时效中止的事由是 )。","o":["义务人同意履行义务","当事人提起诉讼","权利人提出请求","发生不可抗力"],"a":"D","e":"本题考查的是诉讼时效的中止。所谓\n诉讼时效的中止,是指在诉讼时效进行中,由于出现\n了法定事由而暂时中止诉讼时效进行的法律制度。\n诉讼时效中止的事由包括:(1)不可抗力;(2)无民\n事行为能力人或者限制民事行为能力人没有法定代\n理人,或者法定代理人死亡、丧失民事行为能力、丧失\n代理权;(3) 继承开始后未确定继承人或者遗产管理\n人;(4) 权利人被义务人或者其他人控制;(5) 其他\n导致权利人不能行使请求权的障碍。权利人向义务\n人提出履行请求、义务人同意履行义务、权利人提起\n诉讼或者申请仲裁,属千诉讼时效的中断。故答案为\nD。考生应当注意区分诉讼时效中断和诉讼时效中\n止,引起两者发生的事由不同、两者发生的时间不同、\n两者的法律后果也不同,在相应的事由消除之后,中\n断的诉讼时效应当重新计算,而中止的法律效果是自\n中止时效的原因消除之日起满六个月,诉讼时效期间\n届满。","k":"诉讼时效与期间"},{"id":"2014-23","y":2014,"t":"单","s":"根据《民法通则》的规定,诉讼时效中止后,从中 止时效的原因消除之日起,诉讼时效期间( ()。","o":["届满","不再计算","重新计算","继续计算"],"a":"D","e":"本题考查的是诉讼时效中止的效力。\n根据我国《民法通则》的规定,所谓诉讼时效中止,是\n指在诉讼时效进行中,由千出现了法定事由而暂时中\n止诉讼时效进行的法律制度。中止是暂时停止计算\n已经开始的诉讼时效,待阻止时效计算的事由消除,\n诉讼时效期间继续计算,故选D。暂停的那段时间不\n计入诉讼时效期间。\n[特别说明]\n《民法典》对诉讼时效中止的法律\n后果进行了修改,诉讼时效中止的原因消除后,诉讼\n时效期间不再是\n\" 继续计算\n\",而是\n\" 自中止时效的原\n因消除之日起满六个月,诉讼时效期间届满\n\"。由于\n本题题千明确要求\n\" 根据《民法通则》的规定\n\" ,故本\n书不对答案进行修改。但考生要清楚《民法典》的最\n新规定。","k":"诉讼时效与期间"},{"id":"2015-26","y":2015,"t":"单","s":"甲将一批货物存放于乙的仓库,提货时发现 部分货物丢失。甲要求乙赔偿损失的诉讼时效期间 是()。","o":["6个月","1年","2年","4年"],"a":"B","e":"根据《民法通则》第136条的规定,寄\n存财物被丢失或者损毁的,诉讼时效期间为一年。故\n本题原答案为B。但是《民法典》已经删除一年短期\n诉讼时效的规定,因此货物丢失请求赔偿损失的诉讼\n时效也应适用三年普通诉讼时效的规定,本题无\n答案。","k":"诉讼时效与期间"},{"id":"2015-27","y":2015,"t":"单","s":"甲欠乙10万元,时效期间届满未还。乙索要 时,甲承诺2个月内偿还,但事后只给付了2万元。 乙索要余款时,甲以10万元欠款已超过诉讼时效期 间为由拒绝,并要求乙返还之前给付的2万元。下列 选项中,正确的是()。","o":["甲应偿还剩余的8万元","甲承诺偿还引起诉讼时效中断","甲给付的2万元属于不当得利,乙应返还","甲无权要求乙返还2万元,但剩余的8万元可 以不偿还"],"a":"A","e":"甲在时效期间届满之后,承诺偿还债\n务,并且实际上承担了部分债务,构成甲对债务的承\n认,甲应当继续履行其义务,即甲应偿还剩余的8万\n元。A 选项正确。10万元的诉讼时效期间已经届满,\n不再发生中断,诉讼时效中断发生在期间届满之前,B\n选项错误。诉讼时效虽然届满,但是债权债务关系本\n身并没有消灭,甲自愿偿还的,不是不当得利,C选项\n错误。甲已经承认了债务,就应当完全履行,剩余的8\n万元应当偿还,D选项错误。","k":"诉讼时效与期间"},{"id":"2016-21","y":2016,"t":"单","s":"2014年3月2日,甲、乙离婚并分割了共同财 产。2015年3月8日,甲发现乙在离婚时将属于夫妻 共有的40万元存款转移到了乙兄的银行账户中,遂 向人民法院起诉,请求分割该40万元存款。本案的 诉讼时效期间起算日为( )。","o":["2014年3月2日","2014年3月3日","2015年3月8日","2015年3月9日"],"a":"D","e":"根据《民法典》和相关法律规定,夫妻\n一方隐藏、转移、变卖、毁损、挥霍夫妻共同财产,或者\n伪造夫妻共同债务企图侵占另一方财产的,在离婚分\n割夫妻共同财产时,对该方可以少分或者不分。离婚\n后,另一方发现有上述行为的,可以向人民法院提起\n诉讼,请求再次分割夫妻共同财产。人民法院对前款\n规定的妨害民事诉讼的行为,依照民事诉讼法的规定\n予以制裁。根据司法解释的规定,当事人向人民法院\n提起诉讼,请求再次分割夫妻共同财产的诉讼时效为\n两年,从当事人发现之次日起计算。本题中甲在2015\n年3月8日发现乙转移存款的行为,甲请求分割40\n万存款的诉讼时效起算日为发现的次日,即2015年3\n月9日,D选项正确,C选项错误。2014年3月2日是\n甲乙离婚的日子,请求分割转移财产的时间不以此时\n间为准,也不是离婚的次日,所以AB都不对。","k":"诉讼时效与期间"},{"id":"2016-24","y":2016,"t":"单","s":"下列情形中,可引起诉讼时效中止的是(","o":["发生不可抗力","债权人起诉后又撤诉","债权人向公安机关报案","债权人向债务人主张权利"],"a":"A","e":"诉讼时效的中止,是指在诉讼时效进行\n中,由千出现了法定事由而暂时中止诉讼时效进行的\n法律制度。根据《民法典》第194条的规定,在诉讼时\n效期间的最后六个月内,因下列障碍,不能行使请求\n权的,诉讼时效中止:(l)不可抗力;(2)无民事行为\n能力人或者限制民事行为能力人没有法定代理人,或\n者法定代理人死亡、丧失民事行为能力、丧失代理权i\n(3) 继承开始后未确定继承人或者遗产管理人;\n(4)权利人被义务人或者其他人控制;(5)其他导致\n权利人不能行使请求权的障碍。自中止时效的原因\n消除之日起满六个月,诉讼时效期间届满。\n诉讼时效的中断是指在诉讼时效进行中,因一定\n事由的发生,阻碍时效进行,致使以前进行的时效期\n间统归无效,从中断、有关程序终结时起,其诉讼时效\n重新计算的制度。根据《民法典》第195条的规定,权\n\n利人向义务人提出履行请求、义务人同意履行义务、\n权利人提起诉讼或者申请仲裁等可引起诉讼时效中\n断。本题中BCD引起诉讼时效的中断,A引起诉讼时\n效的中止。","k":"诉讼时效与期间"},{"id":"2016-38","y":2016,"t":"单","s":"下列行为中,可引起不当得利之债的是()。","o":["甲偿还5万元赌债","乙清偿明知超过诉讼时效期间的债务","丙被他人收养,成年后给付生父母生活费","丁误将邻居的装修材料用于自己房屋的装修"],"a":"D","e":"l\n不当得利是指没有合法根据取得利益\n而使他人财产受损。不当得利的构成要件包括:\n(I)一方获得利益;(2)他方受有损失;(3)一方获\n益和他方受损之间有因果关系;(4)获益没有合法\n根据。\n本题中丁误拿邻居的装修材料,邻居有损失,丁\n获得利益,丁获得利益与邻居受损之间有因果关系,\n且丁获得利益没有合法根据,所以丁是不当得利,D\n选项正确。\n本题原答案为D,因为通说认为以下情形不成立\n不当得利:履行道德义务而为的给付、履行未到期债\n务而为的清偿、明知无债务而为的清偿、因不法原因\n而为的给付。A选项是由于不法原因,即偿还5万赌\n债而给付,不是不当得利。B选项,乙的债务虽然超\n过诉讼时效,但是债权债务关系本身并没有消灭,乙\n自愿清偿的,不是不当得利。C选项给付生父母生活\n费的行为,是履行道德义务的给付,不是不当得利。\n但《民法典》对不当得利的规定是这样的:\"得利人没\n有法律根据取得不当利益的,受损失的人可以请求得\n利人返还取得的利益,但是有下列情形之一的除外:\n(一)为履行道德义务进行的给付;(二)债务到期之\n前的清偿;(三)明知无给付义务而进行的债务清\n偿。\"未规定因不法原因的给付不构成不当得利,因此\nA项应当构成不当得利。本题选AD。","k":"诉讼时效与期间"},{"id":"2018-38","y":2018,"t":"单","s":"除斥期间的适用对象通常是( )。","o":["形成权","请求权","支配权","抗辩权"],"a":"A","e":"除斥期间是指法律规定或者当事人约\n定的权利(主要是形成权)预定存在的期间。权利人\n在此期间不行使权利,预定期间届满,即发生该权利\n消灭的法律后果。除斥期间的适用对象通常是形成\n权,比如撤销权、解除权等。A项正确。","k":"诉讼时效与期间"},{"id":"2021-48","y":2021,"t":"多","s":"连带责任保证人享有的抗辩权包括(","o":["主债务人的同时履行抗辩权","主债务人的不安抗辩权","先诉抗辩权","主债务诉讼时效期间届满的抗辩权"],"a":"ABD","e":"连带责任保证人不享有先诉抗辩权,一\n般保证的保证人才享有先诉抗辩权,C项错误。根据\n法律规定,保证人可以主张债务人对债权人的抗辩。\n因此连带责任保证人可以行使债务人的同时履行抗\n辩权、不安抗辩权和诉讼时效期间届满的抗辩权,\nABD项正确。","k":"诉讼时效与期间"},{"id":"2025-37","y":2025,"t":"单","s":"A 公司欠B 公司100 万元货款,到期未偿还。C 公司欠A 公司120 万元货款,A 公司曾 发函催要,但C 公司一直未清偿。现B 公司诉至人民法院,要求C 公司还款。对此,下列说法 正确的是( )","o":["B 公司无权提起代位权诉讼","B 公司行使代位权以120 万元为限","即使B 公司胜诉,C 公司也只应向A 公司履行","B 公司起诉导致A 公司对C 公司债权的诉讼时效中断"],"a":"D","e":"债权人的代位权,是指当债务人怠于行使其债权或者与该债权有关的从权利而影\n响债权人的到期债权实现时,债权人享有的以自己名义代位行使债务人对相对人的权利之权利。\n本题中,B 公司是A 公司的债权人,A 公司没有以诉讼或仲裁的方式向C 公司索要货款,怠于\n行使自己的债权,B 公司有权提起代位权诉讼,A 项错误。A 公司欠B 公司100 万,B 公司行使\n代位权以100 万元为限,B 项错误。如果B 公司胜诉,C 公司直接向A 公司履行,C 项错误。B\n公司的起诉,中断A 公司对C 公司债权的诉讼时效,D 项正确。本题选D。","k":"诉讼时效与期间"},{"id":"2026-21","y":2026,"t":"单","s":"甲借钱给乙,乙到期未偿还。诉讼时效期间届满后,甲到乙家索要借款,乙 不在,乙的母亲丙承诺乙会在一周内还款,一周后甲仍未收到借款,遂起诉。对 此,下列说法正确的是","o":["甲的起诉导致诉讼时效中断","丙的承诺导致诉讼时效中断","法院可以主动适用诉讼时效的规定","乙有权提出诉讼时效抗辩"],"a":"D","e":"诉讼时效届满后,债务人享有时效抗辩权。\nA 起诉不中断,时效已届满;B 丙非债务人、连带义务人,单方承诺不发生中断;\nC 法院不得主动释明、主动适用时效。","k":"诉讼时效与期间"}]},{"sub":"民法","name":"代理","w":0.7,"L":13,"qs":[{"id":"2005-41","y":2005,"t":"单","s":"根据代理权产生依据的不同,可将代理分为(   )","o":["法定代理、指定代理与委托代理","自己代理与双方代理","直接代理与间接代理","显明代理与隐名代理"],"a":"A","e":"法定代理、指定代理与委托代理,是根据代理权产生的原因进行划分。直接代理与间接代理,以是\n否以被代理人名义为标准区分;显名代理与隐名代理,是根据第三人是否知道代理人与本人之间的代理关系进行划\n分。自己代理,是指代理人与自己订立合同;双方代理,是指代理人既代理本人,又代理第三人为同一民事法律行\n为的代理。自己代理和双方代理都是滥用代理权的情形。","k":"代理"},{"id":"2008-42","y":2008,"t":"单","s":"甲将邻居乙未上锁的自行车推进车棚,并以自己的名义缴纳了保管费。甲的此种行为属于(  )","o":["合同行为","无权代理","无因管理","侵权行为"],"a":"C","e":"根据《民法通则》第93 条,无因管理,是指没有法定的或者约定的义务,为避免他人利益受损失进\n行管理或者服务的行为。甲的行为属于管理乙的事务,且有为乙谋利益的意思,但甲无此法定或约定的义务,故构\n成无因管理。","k":"代理"},{"id":"2009-36","y":2009,"t":"单","s":"下列行为中,属于代理行为的是(    )。","o":["代人书写起诉状","代人办理企业登记","代人整理资料","代人看管小孩"],"a":"B","e":"本题考查代理的法律特征。代理是指代理人以被代理人的名义,在代理权限内与第三人为法律行\n为,在其法律后果直接有被代理人承受的民事法律制度。代位书写起诉状,代书人没有独立的意思表示,也非和第\n- 11 -\n\n \n \n更多考研精品资料,关注淘宝店铺:光速考研工作室 \n三人进行民事活动,不具备民事代理的特征。A 选项错误。代人办理企业登记是代理人接受委托和第三人进行民事\n活动,符合民事代理的特征。B 选项正确。带人着呢管理材料、带人看管小孩属于事务性的委托承办,不属于民法\n上的代理行为。C 选项和D 选项错误。因此本题的答案为B","k":"代理"},{"id":"2011-23","y":2011,"t":"单","s":"甲欲出售一辆汽车,乙向甲声称受丙委托购 买该车,甲托人向丙核实,丙未予否认。甲遂将该车 交给乙,乙将车开走后不知去向,甲向丙要求付款遭 拒绝。此案的正确处理方法是()。","o":["由甲自行承担损失","由乙支付车款","由丙支付车款","由乙、丙承担连带付款责任"],"a":"C","e":"无权代理是指没有代理权而以他人名\n义进行代理活动的民事行为。无权代理效力待定,如\n果被代理人对无权代理行为予以追认,则该代理行为\n有效,否则为无效行为。如果被代理人知道他人以本\n人名义实施民事行为而不作否认的,视为同意他人的\n代理,则代理行为有效。在本题中,丙明知乙以自己\n的名义为民事行为,而未予否认,则是同意乙的代理\n行为,则该代理行为有效,其法律后果由丙承担,车款\n由丙支付。故答案选C。","k":"代理"},{"id":"2011-46","y":2011,"t":"多","s":"下列行为中,可以代理的有()。","o":["立遗瞩","申请商标注册","订立合同","参加行政诉讼"],"a":"BCD","e":"申请商标注册、订立合同、参加行政诉\n讼都可由他人代理,《商标法》第18 条还特别规定,外\n国人或者外国企业在中国申请商标注册和办理其他\n商标事宜的,应当委托国家认可的具有商标代理资格\n的组织代理。自然人、法人可以通过代理人进行民事\n法律行为,但是依据法律规定或者双方当事人约定,\n应当由本人实施的民事法律行为,不得通过代理人进\n行。这些行为包括:(1)具有人身性质的行为,如立\n遗嘱、婚姻登记、收养子女等;(2)法律规定或者当事\n\n人约定应当由特定的人亲自为之的行为,如演出、讲\n课等。故答案选BCD。","k":"代理"},{"id":"2012-25","y":2012,"t":"单","s":"甲、乙双方同意协议离婚。甲因出差,故委托 丙去婚姻登记机关代为办理离婚登记手续。根据我 国法律,丙( )。","o":["不得代理","可以代理","在取得甲书面授权后可以代理","在取得乙同意后可以代理"],"a":"A","e":"l\n自然人、法人可以通过代理人进行民事\n法律行为。但是,依照法律规定或者双方当事人约\n定,应当由本人实施的民事法律行为,不得通过代理\n人进行。这些行为包括:(1)具有人身性质的行为,\n如立遗嘱、婚姻登记、收养子女等;(2)法律规定或当\n事人约定应当由特定的人亲自为之的行为,如演出、\n讲课等。故选A。","k":"代理"},{"id":"2012-47","y":2012,"t":"多","s":"下列行为中,属于滥用代理权的有( )。","o":["自己代理","双方代理","越权代理","无权代理"],"a":"AB","e":"代理是代理人以被代理人(又称本人)\n的名义,在代理权内与第三人(又称相对人)发生的法\n律行为,其法律后果直接由被代理人承受的民事法律\n制度。代理人不得滥用代理权。滥用代理权主要有\n三种情况:(1)自己代理。(2)双方代理。(3)代理\n人与相对人恶意串通。故选AB。此题告诫考生,切\n不可望文生义,应该严格按照教材的内容作答。","k":"代理"},{"id":"2013-36","y":2013,"t":"单","s":"甲、乙系父子关系。乙在注册公司时,将其父 甲登记为股东之一,后被甲发现。因甲不同意,双方 发生争执并诉至法院。乙的行为()。","o":["合法,属于法定代理","合法,属于无因管理","非法,侵犯了甲的姓名权","非法,侵犯了甲的隐私权"],"a":"C","e":"所谓姓名权,是指公民依法享有的决\n定使用变更、许可他人使用自己姓名(不得违背公\n序良俗)并排除他人非法侵害如干涉、盗用、假冒的权\n利。乙擅自使用他父亲的名字作为股东进行登记,是\n一种侵犯他人姓名使用权的行为,因此答案选择C。\n同时,姓名并不属于个人隐私,擅自使用他人姓名并\n不侵犯他人的隐私权。","k":"代理"},{"id":"2016-29","y":2016,"t":"单","s":"甲委托乙购买某品牌新款手机并预付了购机 款,乙又委托丙办理此事,但未将购机款交给丙,也未 征求甲的意见。丙购得手机后交给甲,甲拒绝接受。; 对此,下列选项正确的是()。","o":["丙系甲的指定代理人","乙的转委托行为有效","甲有权要求乙返还购机款","丙有权要求甲支付购机款"],"a":"C","e":"《民法典》第923条规定:\"受托人应当\n亲自处理委托事务。经委托人同意,受托人可以转委\n托。转委托经同意或者追认的,委托人可以就委托事\n务直接指示转委托的第三人,受托人仅就第三人的选\n任及其对第三人的指示承担责任。转委托未经同意\n或者追认的,受托人应当对转委托的第三人的行为承\n担责任;但是,在紧急情况下受托人为维护委托人的\n利益需要转委托的除外。\"\n本题中,甲委托乙购买手机,乙转委托丙办理此\n事,乙转委托的行为应征得甲的同意。但是乙并没有\n征得甲的同意,乙应当对转委托的丙的行为承担责\n任,即乙应对丙购买手机的行为承担责任,而不是由\n甲承担责任,丙无权要求甲支付购机款,D选项错误。\n乙转委托的行为没有经过甲同意,所以丙不是甲的指\n定代理人,乙的转委托行为无效,AB选项错误。甲己\n经预付了购机款,但是乙并没有履行委托合同购买手\n机,所以甲可以要求乙返还购机款,C选项正确。","k":"代理"},{"id":"2017-25","y":2017,"t":"单","s":"甲委托乙以乙的名义为甲购买一辆汽车。乙 与丙签订购车合同后,由于甲的原因不能依约向丙支 付购车款,乙遂向丙披露了委托人甲。对此,下列说 法正确的是()。","o":["丙只能请求甲支付购车款","丙只能请求乙支付购车款","丙可以在甲、乙中择一请求支付购车款","丙请求甲支付购车款遭拒后,可请求乙支付"],"a":"C","e":"根据《民法典》的规定,受托人以自己\n的名义与第三人订立合同时,第三人不知道受托人与\n委托人之间的代理关系的,受托人因第三人的原因对\n委托人不履行义务,受托人应当向委托人披露第三\n人委托人因此可以行使受托人对第三人的权利,但\n第三人与受托人订立合同时如果知道该委托人就不\n会订立合同的除外。受托人因委托人的原因对第三\n人不履行义务,受托人应当向第三人披露委托人,第\n三人因此可以选择受托人或者委托人作为相对人主\n张其权利,但第三人不得变更选定的相对人。委托人\n行使受托人对第三人的权利的,第三人可以向委托人\n主张其对受托人的抗辩。第三人选定委托人作为其\n相对人的,委托人可以向第三人主张其对受托人的抗\n辩以及受托人对第三人的抗辩。本题中,委托人是\n甲,受托人是乙,第三人是丙,受托人由于委托人的原\n因不能履行义务,且受托人向第三人披露了委托人,\n第三人丙可以选择受托人乙或者委托人甲作为相对\n人主张权利,C项正确。","k":"代理"},{"id":"2017-34","y":2017,"t":"单","s":"甲谎称是乙公司的代理人,以乙公司的名义 与丙公司签订合同。甲侵犯了乙公司的()。","o":["姓名权","商标权","名誉权","名称权"],"a":"D","e":"名称权是指法人及非法人组织依法享\n有的决定、使用、变更、转让或者许可他人使用自己的\n名称并排除他人非法干涉的权利。法人、非法人组织\n对其名称享
