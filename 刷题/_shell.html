<style>
:root{--bg:#f5f5f2;--card:#fff;--ink:#1d1d1f;--sub:#6b6b70;--line:#e3e3e0;--acc:#2f6fdb;--ok:#1f9d55;--okbg:#e7f6ec;--bad:#d64545;--badbg:#fdeaea;--warn:#b7791f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}
.wrap{max-width:780px;margin:0 auto;padding:12px 14px 80px}
header{display:flex;align-items:center;gap:10px;margin:4px 0 12px}
header h1{font-size:19px;margin:0;flex:1}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.tab{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:15px;white-space:nowrap;cursor:pointer}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.stats b{display:block;font-size:20px}
.stats span{font-size:12.5px;color:var(--sub)}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px;font-size:17px;font-weight:600;cursor:pointer;margin-top:10px}
.btn.pri{background:var(--acc);color:#fff}
.btn.sec{background:#eef1f6;color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.addwb{display:block;margin:6px 2px 0 auto;background:none;border:0;padding:4px 2px;font-size:13px;color:var(--sub);cursor:pointer}
.addwb:disabled{cursor:default;opacity:.7}
.hint{font-size:13px;color:var(--sub);margin-top:6px}
.unit{display:flex;align-items:center;gap:10px;padding:10px 2px;border-top:1px solid var(--line);cursor:pointer}
.unit:first-child{border-top:0}
.unit .rk{width:26px;color:var(--sub);font-size:13px;text-align:right;flex:none}
.unit .nm{flex:1;min-width:0}
.unit .nm div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unit .meta{font-size:12.5px;color:var(--sub)}
.unit .nm div.meta{white-space:normal}
.bar{height:5px;background:#ececea;border-radius:3px;margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.unit.drop{opacity:.6}
.unit .rs{flex:none;border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:8px;padding:3px 9px;font-size:12.5px;cursor:pointer}
.sw{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--sub);margin:4px 0 8px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.back{border:0;background:none;font-size:15px;color:var(--acc);cursor:pointer;padding:6px 0}
.top .where{flex:1;font-size:13px;color:var(--sub);text-align:right;line-height:1.35}
.tag{display:inline-block;font-size:12.5px;color:var(--sub);background:#f0f0ee;border-radius:6px;padding:1px 8px;margin-right:6px}
.tag.rev{background:#fff4e0;color:var(--warn)}
.stem{font-size:18px;margin:10px 0 14px;line-height:1.7;white-space:pre-line}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:11px 13px;margin-bottom:9px;font-size:16.5px;cursor:pointer;color:var(--ink)}
.opt .L{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid #c9c9c6;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600}
.opt.sel{border-color:var(--acc)}
.opt>span:nth-child(2){flex:1;min-width:0}
.oe{display:block;margin-top:5px;font-size:14.5px;line-height:1.6;color:#55555a}
.oe b{color:var(--ink)}
@media (max-width:899px){.oe{font-size:13.5px}}
.opt.sel .L{background:var(--acc);border-color:var(--acc);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--okbg)}

.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt.bad .L{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.miss{border-color:var(--ok);background:var(--okbg)}
.opt.miss .L{border-color:var(--ok);color:var(--ok)}
.judge{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.judge .opt{justify-content:center;font-size:18px;font-weight:600}
.res{border-radius:12px;padding:10px 14px;margin:6px 0 10px;font-weight:600}
.res.ok{background:var(--okbg);color:var(--ok)}
.res.bad{background:var(--badbg);color:var(--bad)}
.res small{font-weight:400;color:var(--sub);display:block}
.box{border-left:3px solid var(--line);padding:2px 0 2px 12px;margin:10px 0;font-size:15px;white-space:pre-wrap;word-break:break-word}
.box b{font-weight:700;color:var(--ink)}
.xp{margin:3px 0}
.xo{display:flex;align-items:flex-start;gap:9px;margin:8px 0}
.xk{flex:none;width:22px;height:22px;margin-top:2px;border-radius:50%;font-size:12.5px;font-weight:700;line-height:22px;text-align:center;color:#fff;background:var(--bad)}
.xo.ok .xk{background:var(--ok)}
.xt{flex:1;min-width:0}
.xo.hit{background:var(--badbg);border:1.5px solid var(--bad);border-radius:8px;padding:4px 7px;margin-left:-8px;margin-right:-8px}
.xo.hit.miss{background:none;border-style:dashed}
.xg{flex:none;align-self:center;font-size:12.5px;font-weight:700;color:var(--bad);background:var(--badbg);border-radius:6px;padding:0 7px}
.xm{margin:4px 0 8px;padding:7px 11px;background:#f4f5f7;border-radius:8px}
.xl{font-weight:700;color:var(--warn);margin-right:8px}
.box h4{margin:0 0 2px;font-size:13px;color:var(--sub);font-weight:600}
.box.book{border-color:#9db8e8}
.box.note{border-color:#e8c48a}
.empty{text-align:center;color:var(--sub);padding:30px 0}
.warnbar{background:#fff4e0;color:#7a5410;border-radius:10px;padding:8px 12px;font-size:13.5px;margin-bottom:10px}
textarea{width:100%;height:90px;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:8px;font-family:monospace}
.foot{display:flex;gap:8px;flex-wrap:wrap}
.foot button,.foot label{flex:1;min-width:120px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px;font-size:14px;cursor:pointer;text-align:center;color:var(--ink)}
.syncrow{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.syncstat{font-size:13.5px;color:var(--sub);flex:1;min-width:180px}
.syncstat b{color:var(--ink)}
.syncbtns{display:flex;gap:6px;flex:none}
.syncbtns button,.smbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:5px 11px;font-size:13px;cursor:pointer}
.smbtn.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
.syncpanel{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.syncsec{margin-bottom:14px;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.syncsec:last-child{margin-bottom:0;padding-bottom:0;border-bottom:0}
.syncsec h4{margin:0 0 6px;font-size:14px;color:var(--ink)}
.syncin{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:16px;margin:4px 0 8px;background:#fafaf8;color:var(--ink)}
.syncmsg{font-size:13px;margin-top:6px;padding:6px 10px;border-radius:8px;background:#f4f5f7;color:var(--ink)}
.syncmsg.ok{background:var(--okbg);color:var(--ok)}
.syncmsg.bad{background:var(--badbg);color:var(--bad)}
.wb{padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.wb:first-child{border-top:0}
.wb .a{color:var(--ok);font-weight:600}

.kbd{font-size:12px;color:var(--sub);text-align:center;margin-top:8px}
@media (max-width:520px){.kbd{display:none}.stem{font-size:17px}}
@media (max-width:899px){.quizpg{padding-top:3vh}body{font-size:15px}header h1{font-size:18px}.stem{font-size:16px}.opt{font-size:15.5px}.opt .L{font-size:13px}.judge .opt{font-size:17px}.btn{font-size:16px}.box{font-size:14px}.wb{font-size:14px}.tab{font-size:14px}.back{font-size:14px}.stats b{font-size:19px}}
@media (min-width:900px){
.wrap{max-width:960px;padding-top:20px}
body{font-size:17px}
header h1{font-size:22px}
.quizpg{padding-top:12vh}
.quizpg .card{padding:24px 30px}
.stem{font-size:22px;margin:12px 0 20px}
.opt{font-size:19px;padding:14px 18px;margin-bottom:12px;gap:14px}
.opt .L{width:30px;height:30px;font-size:15px}
.judge .opt{font-size:21px}
.btn{font-size:18px;padding:15px}
.res{font-size:18px}
.box{font-size:16.5px}
.tag{font-size:13.5px}
.top .where{font-size:14px}
.back{font-size:16px}
.unit .meta{font-size:13.5px}
.stats b{font-size:24px}.stats span{font-size:14px}
}
</style>

<body>
<div class="wrap" id="app"></div>
<script id="data" type="application/json">
/*__QUIZ_DATA__*/
</script>
<script id="kb" type="application/json">
/*__KB_DATA__*/
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const KB=JSON.parse(document.getElementById('kb').textContent);
function fmtBook(q){if(q.kb==null)return esc(q.k||'');const t=KB[q.kb];let o='',p=0;(q.kh||[]).forEach(([a,b])=>{if(a<p)return;o+=esc(t.slice(p,a))+'<b>'+esc(t.slice(a,b))+'</b>';p=b;});return o+esc(t.slice(p));}
const SUBS=['全部','刑法','民法'];
const SUBNAME={'全部':'全部','刑法':'刑法','民法':'民法'};
const TN={'判':'判断','单':'单选','多':'多选'};
// index
const Q={};D.forEach((u,ui)=>{u.ui=ui;u.qs.forEach((q,qi)=>{q.u=ui;q.qi=qi;Q[q.id]=q;})});
// storage
const KEY='fsjc_v1';const SYNC_KEY='fsjc_sync_v1';const GIST_FILE='fsjc_progress_v1.json';
let canSave=true;let S;
try{S=JSON.parse(localStorage.getItem(KEY)||'null');localStorage.setItem(KEY+'_t','1');}catch(e){canSave=false;}
if(!S||!S.q)S={q:{},sub:'全部',drop:false,clearedAt:0};
if(!S.clearedAt)S.clearedAt=0;
if(!S.v2){const now=Date.now();for(const id in S.q){if(S.q[id].length<5)S.q[id][4]=now;}S.v2=1;}
let SYNC={token:'',gistId:'',lastSync:0,auto:true};
if(canSave){try{const sc=JSON.parse(localStorage.getItem(SYNC_KEY)||'null');if(sc&&typeof sc==='object')SYNC=Object.assign(SYNC,sc);}catch(e){}}
function saveSyncCfg(){if(!canSave)return;try{localStorage.setItem(SYNC_KEY,JSON.stringify(SYNC));}catch(e){}}
let syncOpen=false,syncBusy=false,syncTimer=null,lastAutoTry=0,syncMsg={cls:'',text:''};
function save(pushCloud){
  if(!canSave)return;
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  if(pushCloud&&SYNC.token&&SYNC.gistId&&SYNC.auto!==false){
    clearTimeout(syncTimer);
    syncTimer=setTimeout(()=>syncNow(true),1500);
  }
}
function b64e(str){const bytes=new TextEncoder().encode(str);let bin='';for(let i=0;i<bytes.length;i++)bin+=String.fromCharCode(bytes[i]);return btoa(bin);}
function b64d(b64){const bin=atob(b64.trim());const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return new TextDecoder().decode(bytes);}
function normRec(r){if(!Array.isArray(r)||r.length<4)return null;return [+r[0]||0,+r[1]||0,+r[2]||0,+r[3]||0,+r[4]||0];}
function mergeProgress(localState,rawRemote){
  if(!rawRemote||typeof rawRemote!=='object')throw new Error('数据格式无效');
  const rq=(rawRemote.q&&typeof rawRemote.q==='object')?rawRemote.q:(Object.keys(rawRemote).some(k=>Q[k])?rawRemote:null);
  if(!rq)throw new Error('未找到题目进度字段');
  const lCleared=+localState.clearedAt||0;
  const rCleared=+(rawRemote.clearedAt||rawRemote.c)||0;
  const clearedAt=Math.max(lCleared,rCleared);
  const lq=localState.q||{};
  const nq={};
  const ids=new Set([...Object.keys(lq),...Object.keys(rq)]);
  let fromRemote=0,keptLocal=0,needPush=clearedAt>rCleared;
  for(const id of ids){
    if(!Q[id])continue;
    const l=normRec(lq[id]),r=normRec(rq[id]);
    let pick=null,pickedRemote=false,localNewer=false;
    if(l&&r){
      if(r[4]>l[4]||(r[4]===l[4]&&(r[0]!==l[0]||r[1]!==l[1]||r[2]!==l[2]||r[3]!==l[3])&&(r[0]>l[0]||r[3]>l[3]))){pick=r;pickedRemote=true;}
      else{pick=l;if(l[4]>r[4])localNewer=true;}
    }else if(r){pick=r;pickedRemote=true;}
    else{pick=l;localNewer=true;}
    if(!pick||(clearedAt>0&&pick[4]<=clearedAt))continue;
    nq[id]=pick;
    if(pickedRemote)fromRemote++;else{keptLocal++;if(localNewer)needPush=true;}
  }
  return {state:{q:nq,sub:localState.sub||'全部',drop:!!localState.drop,v2:1,clearedAt},fromRemote,keptLocal,totalAfter:Object.keys(nq).length,needPush,remoteCleared:rCleared};
}
function fmtTime(ms){if(!ms)return '';const d=new Date(ms);return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;}
function setSyncMsg(cls,text){syncMsg={cls,text};const el=document.getElementById('syncmsg');if(el){el.className='syncmsg'+(cls?' '+cls:'');el.textContent=text;el.style.display=text?'block':'none';}}
function exportProgressObj(){return {v:2,c:S.clearedAt||0,updatedAt:Date.now(),q:S.q};}
function exportProgressCode(){return 'FSJC1:'+b64e(JSON.stringify(exportProgressObj()));}
function parseImportPayload(raw){
  const t=(raw||'').trim();if(!t)throw new Error('请先粘贴进度码或选择文件');
  if(t.startsWith('FSJC1:'))return JSON.parse(b64d(t.slice(6)));
  return JSON.parse(t);
}
function applyImportText(raw){
  const obj=parseImportPayload(raw);
  const res=mergeProgress(S,obj);
  S=res.state;save(true);
  setSyncMsg('ok',`合并完成：吸收对方较新 ${res.fromRemote} 题，保留本地 ${res.keptLocal} 题，当前共 ${res.totalAfter} 条记录。`);
  home(true);
}
async function syncNow(silent){
  if(!canSave||syncBusy)return;
  if(!SYNC.token){if(!silent)setSyncMsg('bad','请先填写 GitHub Token');return;}
  if(typeof fetch!=='function'){if(!silent)setSyncMsg('bad','当前环境不支持联网请求');return;}
  syncBusy=true;lastAutoTry=Date.now();
  if(!silent)setSyncMsg('','正在同步云端进度…');
  const hdr={'Authorization':'Bearer '+SYNC.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
  try{
    if(!SYNC.gistId){
      const cr=await fetch('https://api.github.com/gists',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},hdr),body:JSON.stringify({description:'法硕刷题进度同步（自动生成）',public:false,files:{[GIST_FILE]:{content:JSON.stringify(exportProgressObj())}}})});
      if(!cr.ok){throw new Error(cr.status===401||cr.status===403?'Token 无效或缺少 gist 权限':'创建云端空间失败（HTTP '+cr.status+'）');}
      const gj=await cr.json();
      SYNC.gistId=gj.id;SYNC.lastSync=Date.now();saveSyncCfg();
      setSyncMsg('ok',`已创建私人云端同步空间（Gist ID: ${SYNC.gistId}）并上传当前进度。`);
      if(view.name==='home')home(true);
      return;
    }
    const gr=await fetch('https://api.github.com/gists/'+encodeURIComponent(SYNC.gistId),{cache:'no-store',headers:hdr});
    if(!gr.ok){throw new Error(gr.status===401||gr.status===403?'Token 无效或缺少 gist 权限':gr.status===404?'找不到该 Gist ID':'拉取失败（HTTP '+gr.status+'）');}
    const gj=await gr.json();
    const fileObj=gj.files&&gj.files[GIST_FILE];
    let needPush=!fileObj||!fileObj.content,fromRemote=0,keptLocal=0;
    if(fileObj&&fileObj.content){
      const remoteObj=JSON.parse(fileObj.content);
      const res=mergeProgress(S,remoteObj);
      fromRemote=res.fromRemote;keptLocal=res.keptLocal;needPush=needPush||res.needPush;
      if(fromRemote>0||res.state.clearedAt>(S.clearedAt||0)){
        S=res.state;save(false);
      }
    }
    if(needPush){
      const pr=await fetch('https://api.github.com/gists/'+encodeURIComponent(SYNC.gistId),{method:'PATCH',headers:Object.assign({'Content-Type':'application/json'},hdr),body:JSON.stringify({files:{[GIST_FILE]:{content:JSON.stringify(exportProgressObj())}}})});
      if(!pr.ok){throw new Error('上传合并结果失败（HTTP '+pr.status+'）');}
    }
    SYNC.lastSync=Date.now();saveSyncCfg();
    const summary=fromRemote>0?`已同步：吸收云端 ${fromRemote} 题，保留本地 ${keptLocal} 题。`:needPush?'已将本地最新进度同步至云端。':'云端已是最新进度。';
    setSyncMsg('ok',summary);
    if(view.name==='home')home(true);
  }catch(err){
    setSyncMsg('bad',(err&&err.message)||'同步失败，本地进度不受影响');
    if(view.name==='home'){const stEl=document.getElementById('syncstat');if(stEl)stEl.textContent='云同步异常：'+((err&&err.message)||'网络错误');}
  }finally{syncBusy=false;}
}
function copyTextSync(txt,fbEl){
  let ok=false;
  if(fbEl){fbEl.value=txt;fbEl.style.display='block';fbEl.focus();fbEl.select();try{ok=document.execCommand('copy');}catch(e){}}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).catch(()=>{});}
  return ok;
}
const today=()=>Math.floor((Date.now()+8*36e5)/864e5);  // 北京时间的日期序号，错题本按天计数用
// st: [status, streak, due, wrongCount]  status 1=一次做对 2=错题本 3=错题已掌握
const st=id=>{const s=S.q[id];return s&&s[0]?s:undefined};  // status 0 = 这一节被重置过，当作没做
function inScope(u){return S.sub==='全部'||u.sub===S.sub}
function qInScope(q){return inScope(D[q.u])}
function rint(n){try{const c=window.crypto;if(c&&c.getRandomValues){const b=new Uint32Array(1),lim=4294967296-4294967296%n;let x;do{c.getRandomValues(b);x=b[0];}while(x>=lim);return x%n;}}catch(e){}return Math.floor(Math.random()*n);}
function dueList(){const d=today();return wrongList().filter(id=>S.q[id][2]!==d);}  // 今天还没在错题本里做过的
function wrongList(){return Object.keys(S.q).filter(id=>Q[id]&&S.q[id][0]===2&&qInScope(Q[id])).sort((a,b)=>Q[a].u-Q[b].u||Q[a].qi-Q[b].qi);}
function nextNew(unitOnly){
  const us=unitOnly!=null?[D[unitOnly]]:D.filter(inScope);
  for(const u of us){const l=u.qs.filter(q=>!st(q.id)&&q.id!==(sess&&sess.cur));if(l.length)return l[rint(l.length)].id;}
  for(const u of us){for(const q of u.qs){if(!st(q.id))return q.id;}}
  return null;
}
let view={name:'home'};let sess=null;
const $=h=>{const d=document.createElement('div');d.innerHTML=h;return d.firstElementChild};
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function fmtExp(s,mk,skipOpt){mk=mk||{};const t=esc(s).replace(/┄+/g,'\n').replace(/\s+·/g,'\n·').replace(/\s*\[答题技巧\]/g,'\n【记忆】').replace(/\x01/g,'<b>').replace(/\x02/g,'</b>');

function resetUnit(u){
  const ids=u.qs.map(q=>q.id).filter(id=>st(id));if(!ids.length)return;
  if(!confirm(`重置「${u.name}」？\n这一节已做的 ${ids.length} 题会全部变回没做过（也会移出错题本）。`))return;
  const now=Date.now();ids.forEach(id=>{S.q[id]=[0,0,0,0,now];});
  save(true);home(true);
}

  const aw=document.getElementById('awb');if(aw)aw.onclick=()=>{const s1=S.q[q.id];const now=Date.now();S.q[q.id]=[2,0,today(),((s1&&s1[3])||0)+1,now];save(true);aw.textContent='已加入错题本';aw.disabled=true;};
}
// 上一题/下一题：上一题只能回看本次已做的题（显示当时的作答和解析，不能改答案）
function goPrev(){
  if(!sess||view.name!=='quiz'||!document.querySelector('.stem'))return;
  const H=sess.hist;let i;
  if(sess.view==null)i=sess.answered?H.length-2:H.length-1;else i=sess.view-1;
  if(i<0)return;showHist(i);
}
function goNext(){
  if(!sess||view.name!=='quiz'||!document.querySelector('.stem'))return;
  const H=sess.hist;
  if(sess.view!=null){
    const last=sess.answered?H.length-2:H.length-1;
    if(sess.view<last){showHist(sess.view+1);return;}
    sess.view=null;render();
    if(sess.answered){const h=H[H.length-1];showAfter(Q[h.id],h.sel,h.sel.slice().sort().join('')===Q[h.id].a);}
    else if(sess.sel.length){document.querySelectorAll('.opt').forEach(b=>b.classList.toggle('sel',sess.sel.includes(b.dataset.v)));const sb=document.getElementById('sub');if(sb)sb.disabled=false;}
    return;
  }
  if(sess.answered)nextQ();
}
function showHist(i){
  sess.view=i;const h=sess.hist[i];const q=Q[h.id];render(h.id);
  const sb=document.getElementById('sub');if(sb)sb.remove();
  showAfter(q,h.sel,h.sel.slice().sort().join('')===q.a);
}
(()=>{let x0=null,y0=0,t0=0;
  document.addEventListener('touchstart',e=>{if(e.touches.length!==1){x0=null;return;}x0=e.touches[0].clientX;y0=e.touches[0].clientY;t0=Date.now();},{passive:true});
  document.addEventListener('touchend',e=>{if(x0==null)return;const t=e.changedTouches[0];const dx=t.clientX-x0,dy=t.clientY-y0;x0=null;
    if(Date.now()-t0>800||Math.abs(dx)<60||Math.abs(dx)<1.5*Math.abs(dy))return;
    if(dx<0)goNext();else goPrev();},{passive:true});
})();
function wrongBook(){
  view={name:'wb'};const app=document.getElementById('app');const ids=wrongList();
  let h=`<div><div class="top"><button class="back" id="bk">‹ 返回</button><div class="where">错题本 ${ids.length} 题${S.sub==='全部'?'':' · '+SUBNAME[S.sub]}</div></div>`;
  const dn=dueList().length;
  h+=`<button class="btn pri" id="redo" ${dn?'':'disabled'} style="margin:0 0 12px">${dn?`重刷错题（今天 ${dn} 题）`:ids.length?'今天的错题都刷完了，明天再来':'重刷错题'}</button>`;
  h+=`<div class="card"><div class="hint" style="margin:0 0 6px">错题列表，按重要性排序。</div>`;
  h+=ids.map(id=>{const q=Q[id];
    return `<div class="wb"><span class="tag">${q.y} ${TN[q.t]}</span><div>${esc(q.s)}</div></div>`}).join('')||'<div class="empty">错题本是空的</div>';
  h+='</div></div>';app.innerHTML=h;document.getElementById('bk').onclick=home;
  document.getElementById('redo').onclick=()=>startWrong();window.scrollTo(0,0);
}
// 键盘不参与做题：没有快捷键，回车/空格也不会触发按钮（防误触），只能点
document.addEventListener('keydown',e=>{
  const tg=e.target.tagName;if(tg==='TEXTAREA'||(tg==='INPUT'&&(e.target.type==='text'||e.target.type==='password')))return;
  if(e.key==='Enter'||e.key===' '||e.key==='Spacebar'){e.preventDefault();e.stopPropagation();}
},true);
document.addEventListener('keyup',e=>{const tg=e.target.tagName;if(tg==='TEXTAREA'||(tg==='INPUT'&&(e.target.type==='text'||e.target.type==='password')))return;if(e.key===' '||e.key==='Spacebar'){e.preventDefault();}},true);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&canSave&&SYNC.token&&SYNC.gistId&&SYNC.auto!==false&&Date.now()-lastAutoTry>15000)syncNow(true);});

home();
if(canSave&&SYNC.token&&SYNC.gistId&&SYNC.auto!==false)syncNow(true);
</script>
