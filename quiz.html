["《刑法》第106条：与境外机构、组织、个人相勾结，实施分裂国家罪（第103条）、武装叛乱暴乱罪（第104条）、颠覆国家政权罪（第105条）的，依照各该条的规定从重处罚。\n第113条第2款：犯危害国家安全罪的，可以并处没收财产。\n第56条第1款：对于危害国家安全的犯罪分子应当附加剥夺政治权利。","《刑法》第110条【间谍罪】：有下列间谍行为之一，危害国家安全的，处十年以上有期徒刑或者无期徒刑；情节较轻的，处三年以上十年以下有期徒刑：（一）参加间谍组织或者接受间谍组织及其代理人的任务的；（二）为敌人指示轰击目标的。本罪为行为犯，只要参加间谍组织或接受任务即构成既遂。","《刑法》第111条【为境外窃取、刺探、收买、非法提供国家秘密、情报罪】：为境外的机构、组织、人员窃取、刺探、收买、非法提供国家秘密或者情报的，处五年以上十年以下有期徒刑；情节特别严重的，处十年以上有期徒刑或者无期徒刑；情节较轻的，处五年以下有期徒刑、拘役、管制或者剥夺政治权利。本罪主观上须明知对方为境外机构、组织、人员。","《刑法》第282条第1款【非法获取国家秘密罪】：以窃取、刺探、收买方法，非法获取国家秘密的，处三年以下有期徒刑、拘役、管制或者剥夺政治权利；情节严重的，处三年以上七年以下有期徒刑。\n第398条【故意/过失泄露国家秘密罪】：国家机关工作人员违反保守国家秘密法的规定，故意或者过失泄露国家秘密，情节严重的，处三年以下有期徒刑或者拘役；情节特别严重的，处三年以上七年以下有期徒刑。非国家机关工作人员犯本罪的，依照前款规定酌情处罚。","《刑法》第397条【滥用职权罪；玩忽职守罪】：国家机关工作人员滥用职权或者玩忽职守，致使公共财产、国家和人民利益遭受重大损失的，处三年以下有期徒刑或者拘役；情节特别严重的，处三年以上七年以下有期徒刑。全国人大常委会立法解释明确：在依照法律、法规规定行使国家行政管理职权的组织中从事公务的人员，或者在受国家机关委托代表国家机关行使职权的组织中从事公务的人员，或者虽未列入国家机关人员编制但在国家机关中从事公务的人员，在代表国家机关行使职权时，有渎职行为的，以国家机关工作人员论。","《刑法》第399条【徇私枉法罪；民事、行政枉法裁判罪；执行判决、裁定失职罪/滥用职权罪】：司法工作人员徇私枉法、徇情枉法，对明知是无罪的人而使他受追诉、对明知是有罪的人而故意包庇不使他受追诉，或者在刑事审判活动中故意违背事实和法律作枉法裁判的，构成徇私枉法罪；在民事、行政审判活动中故意违背事实和法律作枉法裁判的，构成民事、行政枉法裁判罪；司法工作人员收受贿赂，有上述前三款行为，同时又构成本法第385条受贿罪的，依照处罚较重的规定定罪处罚（第399条第4款）。","《刑法》第400条第1款【私放在押人员罪】：司法工作人员私放在押的犯罪嫌疑人、被告人或者罪犯的，处五年以下有期徒刑或者拘役；情节严重的，处五年以上十年以下有期徒刑；情节特别严重的，处十年以上有期徒刑。\n第2款【失职致使在押人员脱逃罪】：司法工作人员由于严重不负责任，致使在押的犯罪嫌疑人、被告人或者罪犯脱逃，造成严重后果的，处三年以下有期徒刑或者拘役；造成特别严重后果的，处三年以上十年以下有期徒刑。","《刑法》第408条之一【食品、药品监管渎职罪】（《刑法修正案（十一）》修正）：负有食品药品安全监督管理职责的国家机关工作人员，滥用职权或者玩忽职守，有下列情形之一，造成严重后果或者有其他严重情节的，处五年以下有期徒刑或者拘役；造成特别严重后果或者有其他特别严重情节的，处五年以上十年以下有期徒刑：……（三）对发现的严重食品药品安全违法行为未按规定查处的；……（五）依法应当移交司法机关追究刑事责任不移交的。","《刑法》第382条【贪污罪】：国家工作人员利用职务上的便利，侵吞、窃取、骗取或者以其他手段非法占有公共财物的，是贪污罪。受国家机关、国有公司、企业、事业单位、人民团体委托管理、经营国有财产的人员，利用职务上的便利，侵吞、窃取、骗取或者以其他手段非法占有国有财物的，以贪污论。与上述人员勾结，伙同贪污的，以共犯论处。\n第394条：国家工作人员在国内公务活动或者对外交往中接受礼物，依照国家规定应当交公而不交公，数额较大的，依照贪污罪定罪处罚。","《刑法》第384条【挪用公款罪】：国家工作人员利用职务上的便利，挪用公款归个人使用，进行非法活动的，或者挪用公款数额较大、进行营利活动的，或者挪用公款数额较大、超过三个月未还的，是挪用公款罪。挪用用于救灾、抢险、防汛、优抚、扶贫、移民、救济款物归个人使用的，从重处罚。\n全国人大常委会立法解释：有下列情形之一的，属于“归个人使用”：（一）将公款供本人、亲友或者其他自然人使用的；（二）以个人名义将公款供其他单位使用的；（三）个人决定以单位名义将公款供其他单位使用，谋取个人利益的。","《刑法》第385条【受贿罪】：国家工作人员利用职务上的便利，索取他人财物的，或者非法收受他人财物，为他人谋取利益的，是受贿罪。非国家工作人员与国家工作人员勾结，共同受贿的，以受贿罪的共犯论处。\n第388条之一【利用影响力受贿罪】：国家工作人员的近亲属或者其他与该国家工作人员关系密切的人，通过该国家工作人员职务上的行为，或者利用该国家工作人员职权或者地位形成的便利条件，通过其他国家工作人员职务上的行为，为请托人谋取不正当利益，索取或收受请托人财物，数额较大或者有其他较重情节的，以及离职的国家工作人员或者其近亲属以及其他与其关系密切的人实施上述行为的，构成利用影响力受贿罪。","《刑法》第389条【行贿罪】：为谋取不正当利益，给予国家工作人员以财物的，是行贿罪。在经济往来中，违反国家规定，给予国家工作人员以财物，数额较大的，或者违反国家规定，给予国家工作人员以各种名义的回扣、手续费的，以行贿论处。因被勒索给予国家工作人员以财物，没有获得不正当利益的，不是行贿。\n第390条第2款（《刑法修正案（九）》修正）：行贿人在被追诉前主动交待行贿行为的，可以从轻或者减轻处罚。其中，犯罪较轻的，对侦破重大案件起关键作用的，或者有重大立功表现的，可以减轻或者免除处罚。","《刑法》第78条【减刑条件与限度】：被判处管制、拘役、有期徒刑、无期徒刑的犯罪分子，在执行期间，如果认真遵守监规，接受教育改造，确有悔改表现的，或者有立功表现的，可以减刑；有重大立功表现的，应当减刑。减刑以后实际执行的刑期不能少于下列期限：（一）判处管制、拘役、有期徒刑的，不能少于原判刑期的二分之一；（二）判处无期徒刑的，不能少于十三年。\n最高法司法解释：被判处拘役或者三年以下有期徒刑并宣告缓刑的罪犯，一般不适用减刑（有重大立功表现的除外）；单处罚金刑不能适用减刑，只存在酌情减少或免除。","《刑法》第50条第1款【死缓变更】：判处死刑缓期执行的，在死刑缓期执行期间，如果没有故意犯罪，二年期满以后，减为无期徒刑；如果确有重大立功表现，二年期满以后，减为二十五年有期徒刑；如果故意犯罪，情节恶劣的，报请最高人民法院核准后执行死刑；对于故意犯罪未执行死刑的，死刑缓期执行的期间重新计算，并报最高人民法院备案。\n第78条第2款第（三）项：法院依照第50条第2款限制减刑的死缓犯，缓期执行期满后依法减为无期徒刑的，不能少于二十五年；减为二十五年有期徒刑的，不能少于二十年。","《刑法》第81条【假释条件与限制】：被判处有期徒刑的犯罪分子，执行原判刑期二分之一以上，被判处无期徒刑的犯罪分子，实际执行十三年以上，如果认真遵守监规，接受教育改造，确有悔改表现，没有再犯罪的危险的，可以假释。对累犯以及因故意杀人、强奸、抢劫、绑架、放火、爆炸、投放危险物质或者有组织的暴力性犯罪被判处十年以上有期徒刑、无期徒刑的犯罪分子，不得假释。","《刑法》第87条【追诉时效期限】：犯罪经过下列期限不再追诉：（一）法定最高刑为不满五年有期徒刑的，经过五年；（二）法定最高刑为五年以上不满十年有期徒刑的，经过十年；（三）法定最高刑为十年以上有期徒刑的，经过十五年；（四）法定最高刑为无期徒刑、死刑的，经过二十年。如果二十年以后认为必须追诉的，须报请最高人民检察院核准。\n第88条【追诉时效延长】：在人民检察院、公安机关、国家安全机关立案侦查或者在人民法院受理案件以后，逃避侦查或者审判的，不受追诉期限的限制。被害人在追诉期限内提出控告，人民法院、人民检察院、公安机关应当立案而不予立案的，不受追诉期限的限制。\n第89条【追诉时效计算与中断】：追诉期限从犯罪之日起计算；犯罪行为有连续或者继续状态的，从犯罪行为终了之日起计算。在追诉期限以内又犯罪的，前罪追诉的期限从犯后罪之日起计算。","《刑法》第98条【告诉才处理】：本法所称告诉才处理，是指被害人告诉才处理。我国《刑法》明确规定的告诉才处理的犯罪共五种：侮辱罪（第246条，严重危害社会秩序和国家利益的除外）、诽谤罪（第246条，同前）、暴力干涉婚姻自由罪（第257条，致使被害人死亡的除外）、虐待罪（第260条，致使被害人重伤、死亡的除外）、侵占罪（第270条）。","刑事责任与刑罚消灭（或终结）的法定事由包括：刑罚执行完毕、缓刑考验期满未撤销缓刑、假释考验期满未撤销假释、犯罪人死亡、超过追诉时效期限、经特赦免除刑罚。此外，人民法院作出的有罪免罚（免予刑事处罚）判决、检察机关依法作出的不起诉决定，亦属刑事责任的终结事由。我国现行宪法只规定了特赦（赦免特定犯罪分子的刑罚，不赦免罪名与定罪）。","《两高关于办理贪污贿赂刑事案件适用法律若干问题的解释》第17条：国家工作人员利用职务上的便利，收受他人财物，为他人谋取利益，同时构成受贿罪和刑法分则第三章第三节（破坏社会主义市场经济秩序罪中妨害对公司、企业的管理秩序罪）、第九章规定的渎职犯罪的，除刑法另有规定外，以受贿罪和渎职犯罪数罪并罚。（注意第399条第4款是“刑法另有规定”，针对徇私枉法等4罪收受贿赂时择一重罪处罚。）","《刑法》第20条【正当防卫】：为了使国家、公共利益、本人或者他人的人身、财产和其他权利免受正在进行的不法侵害，而采取的制止不法侵害的行为，对不法侵害人造成损害的，属于正当防卫，不负刑事责任。正当防卫明显超过必要限度造成重大损害的，应当负刑事责任，但是应当减轻或者免除处罚。对正在进行行凶、杀人、抢劫、强奸、绑架以及其他严重危及人身安全的暴力犯罪，采取防卫行为，造成不法侵害人伤亡的，不属于防卫过当，不负刑事责任。","正当防卫须同时具备起因（现实的不法侵害）、时间（不法侵害正在进行）、对象（不法侵害人本人）、主观（防卫意图）与限度五条件。假想防卫欠缺起因条件（实际不存在不法侵害），不成立防卫过当；有过失且刑法有规定的定过失犯罪，无过失则属意外事件。事后防卫欠缺时间条件（不法侵害已经结束）。防卫过当具备前四条件但明显超过必要限度造成重大损害。","《刑法》第21条【紧急避险】：为了使国家、公共利益、本人或者他人的人身、财产和其他权利免受正在发生的危险，不得已采取的紧急避险行为，造成损害的，不负刑事责任。紧急避险超过必要限度造成不应有的损害的，应当负刑事责任，但是应当减轻或者免除处罚。第一款中关于避免本人危险的规定，不适用于职务上、业务上负有特定责任的人。","《刑法》第25条【共同犯罪】：共同犯罪是指二人以上共同故意犯罪。二人以上共同过失犯罪，不以共同犯罪论处；应当负刑事责任的，按照他们所犯的罪分别处罚。共同犯罪的成立要求各共同犯罪人均须达到刑事责任年龄、具有刑事责任能力，并具有共同故意（意思联络）与共同行为。同时犯、间接正犯（利用无责任能力人犯罪）、事后无通谋的窝藏销赃不成立共同犯罪。","《刑法》第26条【主犯】：组织、领导犯罪集团进行犯罪活动的或者在共同犯罪中起主要作用的，是主犯。三人以上为共同实施犯罪而组成的较为固定的犯罪组织，是犯罪集团。对组织、领导犯罪集团的首要分子，按照集团所犯的全部罪行处罚。对于第三款规定以外的主犯，应当按照其所参与的或者组织、指挥的全部犯罪处罚。\n我国《刑法》以共犯在共同犯罪中所起的作用为主、兼顾分工，将共犯分为主犯、从犯、胁从犯和教唆犯。","《刑法》第29条【教唆犯】：教唆他人犯罪的，应当按照他在共同犯罪中所起的作用处罚。教唆不满十八周岁的人犯罪的，应当从重处罚。如果被教唆的人没有犯被教唆的罪，对于教唆犯，可以从轻或者减轻处罚。（教唆未达到刑事责任年龄或无责任能力人犯罪的，构成间接正犯而非教唆犯；共同犯罪人中的教唆犯若未在他人既遂前彻底切断因果力，适用“部分实行全部责任”原则。）","《两高一部关于办理组织领导传销活动刑事案件适用法律若干问题的意见》：传销活动的组织者、领导者包括在传销活动中起发起、策划、操纵作用的人员，以及承担管理、协调、宣传、培训等职责的人员；组织、领导传销活动罪仅追究组织者、领导者的刑事责任，一般参与者不构成本罪。共犯中按各自职务便利分别利用共同侵占本单位财物的，按照主犯的犯罪性质定罪。","《刑法》第14条【故意犯罪】：明知自己的行为会发生危害社会的结果，并且希望或者放任这种结果发生，因而构成犯罪的，是故意犯罪。\n第15条【过失犯罪】：应当预见自己的行为可能发生危害社会的结果，因为疏忽大意而没有预见，或者已经预见而轻信能够避免，以致发生这种结果的，是过失犯罪。\n第16条【意外事件】：行为在客观上虽然造成了损害结果，但是不是出于故意或者过失，而是由于不能抗拒或者不能预见的原因所引起的，不是犯罪。","刑法上的认识错误分为法律认识错误（假想有罪、假想无罪、对罪名及刑罚轻重误解）与事实认识错误（客体错误、对象错误、手段错误、打击错误/行为偏差、因果关系错误）。法律认识错误原则上不阻却故意成立。事实认识错误依“法定符合说”处理：对象错误或打击错误在同一犯罪构成范围内一致的，成立故意犯罪既遂；客体错误超越同一构成要件的（如误人作兽或误兽作人），阻却对应客体的既遂故意，按实际认识内容考察未遂或过失。","犯罪目的是直接故意犯罪人希望通过犯罪行为达到的危害结果；特定犯罪目的在刑法分则条文中是某些直接故意犯罪（目的犯）成立或区分罪与非罪、此罪与彼罪的主观要件（如高利转贷罪“以转贷牟利为目的”、侵犯著作权罪“以营利为目的”、破坏生产经营罪“由于泄愤报复或者其他个人目的”等）；不具有特定犯罪目的时，部分犯罪根本不成立。","《刑法》第17条【刑事责任年龄】：已满十六周岁的人犯罪，应当负刑事责任。\n已满十四周岁不满十六周岁的人，犯故意杀人、故意伤害致人重伤或者死亡、强奸、抢劫、贩卖毒品、放火、爆炸、投放危险物质罪的，应当负刑事责任。\n已满十二周岁不满十四周岁的人，犯故意杀人、故意伤害罪，致人死亡或者以特别残忍手段致人重伤造成严重残疾，情节恶劣，经最高人民检察院核准追诉的，应当负刑事责任。\n对依照前三款规定追究刑事责任的不满十八周岁的人，应当从轻或者减轻处罚。（《刑法》第49条第1款：犯罪的时候不满十八周岁的人和审判的时候怀孕的妇女，不适用死刑；第65条第1款：不满十八周岁的人犯罪不构成累犯。）","《刑法》第18条【精神病人与醉酒人刑事责任能力】：精神病人在不能辨认或者不能控制自己行为的时候造成危害结果，经法定程序鉴定确认的，不负刑事责任。\n间歇性的精神病人在精神正常的时候犯罪，应当负刑事责任。\n尚未完全丧失辨认或者控制自己行为能力的精神病人犯罪的，应当负刑事责任，但是可以从轻或者减轻处罚。\n醉酒的人犯罪，应当负刑事责任。","《刑法》第30条【单位犯罪】：公司、企业、事业单位、机关、团体实施的危害社会的行为，法律规定为单位犯罪的，应当负刑事责任。\n第31条：单位犯罪的，对单位判处罚金，并对其直接负责的主管人员和其他直接责任人员判处刑罚。本法分则和其他法律另有规定的，依照规定（即存在单罚制例外）。\n最高法《关于审理单位犯罪案件具体应用法律有关问题的解释》：个人为进行违法犯罪活动而设立的公司、企业、事业单位实施犯罪的，或者公司、企业、事业单位设立后，以实施犯罪为主要活动的，不以单位犯罪论处。盗用单位名义实施犯罪，违法所得由实施犯罪的个人私分的，依照刑法有关自然人犯罪的规定定罪处罚。","最高人民检察院《关于涉嫌犯罪单位被撤销、注销、吊销营业执照或者宣告破产的应如何进行追诉问题的批复》：涉嫌犯罪的单位被撤销、注销、吊销营业执照或者宣告破产的，应当根据刑法关于单位犯罪的相关规定，对实施犯罪行为的该单位直接负责的主管人员和其他直接责任人员追究刑事责任，对该单位不再追诉。\n关于单位犯罪的主体范围与共犯认定：自然人投资设立的一人或多人有限责任公司、具备法人资格的外国企业、单位内设机构或分支机构（违法所得归其所有）以及高等院校均可成为单位犯罪主体；直接负责的主管人员与其他直接责任人员不明显区分主从的，可不区分主犯、从犯。","身份犯（特殊主体）是指刑法分则规定必须具备特定职务、职责或法律身份的人才能构成的犯罪，如《刑法》第382条贪污罪（国家工作人员）、第397条滥用职权罪（国家机关工作人员）、第400条私放在押人员罪（司法工作人员）、第305条伪证罪（刑事诉讼中的证人、鉴定人、记录人、翻译人）、第109条叛逃罪（国家机关工作人员）等。一般主体犯罪（如非法行医罪）任何自然人未取得行医资格皆可构成。","最高人民法院《关于审理未成年人刑事案件具体应用法律若干问题的解释》：审理未成年人刑事案件应贯彻“教育为主、惩罚为辅”原则。\n（1）未成年人犯罪只有罪行极其严重的，才可以适用无期徒刑，对已满14周岁不满16周岁的人犯罪一般不判处无期徒刑。\n（2）除刑法规定“应当”附加剥夺政治权利外，对未成年罪犯一般不判处附加剥夺政治权利；如果判处的，应当依法从轻判处。\n（3）未成年人犯罪符合缓刑条件的应当宣告缓刑；对未成年罪犯的减刑、假释在掌握标准上可以比照成年罪犯依法适度放宽。\n（4）对未成年人犯罪可以依法判处罚金刑或没收财产刑（从轻减轻并考虑缴纳能力）。","两高两部《关于办理性侵害未成年人刑事案件的意见》及《刑法》第236条、第236条之一：\n（1）对强奸未成年人的成年被告人判处刑罚时，一般不适用缓刑（并非法律绝对禁止“不得适用”）。\n（2）奸淫幼女或强奸未成年人致使被害人感染艾滋病病毒、梅毒等严重性病的，应当认定为“致使被害人重伤”。\n（3）对利用职业便利实施性侵害未成年人犯罪的，人民法院应当依法适用从业禁止（《刑法》第37条之一）。\n（4）对已满14周岁不满16周岁的未成年女性负有照护等特殊职责的人员，利用优势地位或者被害人孤立无援的境地迫使被害人与其发生性关系的，依照处罚较重的强奸罪定罪处罚。","《刑法》第22条【犯罪预备】：为了犯罪，准备工具、制造条件的，是犯罪预备。对于预备犯，可以比照既遂犯从轻、减轻处罚或者免除处罚。\n犯罪预备以“尚未着手实行犯罪”且“因行为人意志以外的原因”被迫停止为特征；单纯流露犯罪意思而未着手也未制造条件的行为属于“犯意表示”，不构成犯罪。","《刑法》第23条【犯罪未遂】：已经着手实行犯罪，由于犯罪分子意志以外的原因而未得逞的，是犯罪未遂。对于未遂犯，可以比照既遂犯从轻或者减轻处罚。\n犯罪未遂按实行行为是否实施完毕分为实行终了的未遂与未实行终了的未遂；按客观上是否存在既遂可能性分为能犯未遂与不能犯未遂。过失犯罪与间接故意犯罪不存在犯罪预备、未遂或中止形态。","《刑法》第24条【犯罪中止】：在犯罪过程中，自动放弃犯罪或者自动有效地防止犯罪结果发生的，是犯罪中止。对于中止犯，没有造成损害的，应当免除处罚；造成损害的，应当减轻处罚。\n犯罪中止既可发生在预备阶段，也可发生在实行过程中乃至实行行为终了之后结果出现之前；但一旦犯罪已经达到既遂状态（如拐卖儿童实现实际控制、强奸完成插入、放火引发独立燃烧、破坏交通设施足以危及倾覆、盗窃完成非法控制），即使事后返还赃物或抢救被害人，亦不能再成立犯罪中止（仅作为酌定量刑或阻止加重结果的因素）。","《刑法》第62条【从重处罚与从轻处罚】：犯罪分子具有本法规定的从重处罚、从轻处罚情节的，应当在法定刑的限度以内判处刑罚。\n第63条【减轻处罚】：犯罪分子具有本法规定的减轻处罚情节的，应当在法定刑以下判处刑罚；本法规定有数个量刑幅度的，应当在法定量刑幅度的下一个量刑幅度内判处刑罚。\n《刑法》第17条第4款：已满14周岁不满18周岁的人犯罪，应当从轻或者减轻处罚。","《刑法》第67条【自首与坦白】：犯罪以后自动投案，如实供述自己的罪行的，是自首。对于自首的犯罪分子，可以从轻或者减轻处罚。其中，犯罪较轻的，可以免除处罚。\n被采取强制措施的犯罪嫌疑人、被告人和正在服刑的罪犯，如实供述司法机关还未掌握的本人其他罪行的，以自首论（特别自首/余罪自首，须为不同种罪行）。\n犯罪嫌疑人虽不具有前两款规定的自首情节，但是如实供述自己罪行的（包括如实供述司法机关尚未掌握的同种较重罪行），可以从轻处罚（坦白）；因其如实供述自己罪行，避免特别严重后果发生的，可以减轻处罚。\n（司法解释：共同犯罪自首须供述自己罪行及所知同案犯共同犯罪事实；交通肇事逃逸后自动投案并如实供述的认定为自首；强制戒毒期间交代、投案途中被抓获、亲友报案扭送、如实供述主要犯罪事实但对行为性质辩解、身份有误差但未影响定罪量刑均不影响自首认定。）","《刑法》第68条【立功】：犯罪分子有揭发他人犯罪行为，查证属实的，或者提供重要线索，从而得以侦破其他案件等立功表现的，可以从轻或者减轻处罚；有重大立功表现的，可以减轻或者免除处罚。\n司法解释：协助司法机关抓捕其他犯罪嫌疑人（包括带领侦查人员抓获、按照安排当场指认、提供司法机关尚未掌握的藏匿地点、按照安排打电话约至指定地点）均可认定为立功；重大立功须被揭发或协助抓获的人可能被判处无期徒刑以上刑罚等情形。","《刑法》第69条【数罪并罚原则】：判决宣告以前一人犯数罪的，除判处死刑和无期徒刑的（吸收原则）以外，应当在总和刑期以下、数刑中最高刑期以上，酌情决定执行的刑期（限制加重原则），但是管制最高不能超过三年，拘役最高不能超过一年，有期徒刑总和刑期不满三十五年的，最高不能超过二十年，总和刑期在三十五年以上的，最高不能超过二十五年。\n数罪中有判处有期徒刑和拘役的，执行有期徒刑。数罪中有判处有期徒刑和管制，或者拘役和管制的，有期徒刑、拘役执行完毕后，管制仍须执行（并科原则）。数罪中有判处附加刑的，附加刑仍须执行，其中附加刑种类相同的，合并执行，种类不同的，分别执行。\n第71条【服刑期间又犯新罪】：“先减后并”——判决宣告以后，刑罚执行完毕以前，被判刑的犯罪分子又犯罪的，应当对新犯的罪作出判决，把前罪没有执行的刑罚和后罪所判处的刑罚，依照第69条规定决定执行的刑罚。","《刑法》第72条【缓刑条件】：对于被判处拘役、三年以下有期徒刑的犯罪分子，同时符合下列条件的，可以宣告缓刑，对其中不满十八周岁的人、怀孕的妇女和已满七十五周岁的人，应当宣告缓刑：（一）犯罪情节较轻；（二）有悔罪表现；（三）没有再犯罪的危险；（四）宣告缓刑对所居住社区没有重大不良影响。\n第73条：拘役缓刑考验期为原判刑期以上一年以下（不能少于二个月）；有期徒刑缓刑考验期为原判刑期以上五年以下（不能少于一年）。\n第74条：对于累犯和犯罪集团的首要分子，不适用缓刑。\n第76条、第77条：对宣告缓刑的罪犯依法实行社区矫正；在缓刑考验期限内犯新罪或发现漏罪的，应当撤销缓刑数罪并罚；违反法律、禁止令或监督管理规定情节严重的，应当撤销缓刑，执行原判刑罚。","《刑法》第38条【管制与禁止令】：管制的期限为三个月以上二年以下。判处管制可根据犯罪情况同时宣告禁止令（不得从事特定活动、进入特定区域场所、接触特定的人）。对判处管制的犯罪分子依法实行社区矫正。\n第39条：被判处管制的犯罪分子在执行期间应当遵守：（一）遵守法律、行政法规，服从监督；（二）未经批准不得行使言论、出版、集会、结社、游行、示威自由的权利；（三）按执行机关规定报告活动情况；（四）遵守执行机关关于会客的规定；（五）离开所居住的市、县或者迁居，应当报经执行机关批准。劳动中同工同酬。（第1、3、4、5项也是缓刑、假释罪犯应当共同遵守的规定。）\n第41条：管制的刑期，从判决执行之日起计算；判决执行以前先行羁押的，羁押一日折抵刑期二日。\n司法解释：禁止令的期限从管制、缓刑执行之日起计算，可与管制/缓刑期限相同或略短（管制下不少于3个月、缓刑下不少于2个月），由司法行政机关（社区矫正机构）负责执行，人民检察院负责监督。","《刑法》第35条【驱逐出境】：对于犯罪的外国人，可以独立适用或者附加适用驱逐出境。\n两高《关于办理妨害国（边）境管理刑事案件应用法律若干问题的解释》第5条：使用仅限在边境地区使用的出入境证件，未经批准超出规定区域进入我国非边境地区的，属于偷越国（边）境。","《刑法》第49条【死刑适用对象限制】：犯罪的时候不满十八周岁的人和审判的时候怀孕的妇女，不适用死刑。审判的时候已满七十五周岁的人，不适用死刑，但以特别残忍手段致人死亡的除外（注意：不适用死刑包括死刑立即执行和死刑缓期二年执行）。\n第383条第4款【终身监禁】：犯贪污罪、受贿罪数额特别巨大并使国家和人民利益遭受特别重大损失，被判处死刑缓期执行的，法院根据犯罪情节等情况可以同时决定在其死缓二年期满依法减为无期徒刑后，终身监禁，不得减刑、假释。（属于刑罚执行措施而非新刑种。）","《刑法》第52条、第53条【罚金刑】：判处罚金，应当根据犯罪情节决定罚金数额（并兼顾犯罪人经济负担能力）。罚金在判决指定的期限内一次或者分期缴纳。期满不缴纳的，强制缴纳。对于不能全部缴纳罚金的，随时追缴。由于遭遇不能抗拒的灾祸等原因缴纳确实有困难的，经人民法院裁定，可以延期缴纳、酌情减少或者免除。\n立法方式分为：无限额罚金（仅写“并处”或“单处罚金”）、限额罚金、比例罚金、倍比罚金。\n司法解释：未成年罪犯判处罚金最低不少于500元，监护人自愿代垫的应当允许（但不得判令监护人缴纳）。","《刑法》第55条至第58条【剥夺政治权利】：\n（1）独立适用剥夺政治权利或者附加于有期徒刑、拘役时，期限为一年以上五年以下；\n（2）判处管制附加剥夺政治权利的，期限与管制的期限相等，同时执行；\n（3）对于危害国家安全的犯罪分子应当附加剥夺政治权利；对于被判处死刑、无期徒刑的犯罪分子，应当剥夺政治权利终身；\n（4）死缓或无期徒刑减为有期徒刑时，应当把附加剥夺政治权利的期限改为三年以上十年以下；\n（5）附加剥夺政治权利的刑期，从徒刑、拘役执行完毕之日或者从假释之日起计算；剥夺政治权利的效力当然施用于主刑执行期间。","《刑法》第59条、第60条【没收财产】：没收财产是没收犯罪分子个人所有财产的一部或者全部（仅限于犯罪分子本人所有的合法财产，不得没收属于犯罪分子家属所有或者应有的财产，全部没收时应保留本人及扶养家属必要生活费）。没收财产以前犯罪分子所负的正当债务，需要以没收的财产偿还的，经债权人请求，应当偿还。\n《刑法》第64条【追缴与退赔】：犯罪分子违法所得的一切财物，应当予以追缴或者责令退赔；违禁品和供犯罪所用的本人财物，应当予以没收（违法所得与合法财产混同投资产生的全部收益属于犯罪孳息，应当全部追缴）。","《刑法》第45条【有期徒刑期限】：有期徒刑的期限，除本法第50条、第69条规定外，为六个月以上十五年以下。\n《刑法》第33条、第34条：主刑包括管制、拘役、有期徒刑、无期徒刑、死刑；附加刑包括罚金、剥夺政治权利、没收财产及驱逐出境。刑罚目的包括特殊预防（预防已犯罪人再犯）与一般预防（震慑教育尚未犯罪的社会公众）。","《刑法》第93条第2款及立法解释：村民委员会等村基层组织人员协助人民政府从事救灾、抢险、防汛、优抚、扶贫、移民、救济款物管理等行政管理工作时，属于“其他依照法律从事公务的人员”，以国家工作人员论；受国有单位委托管理、经营国有财产的人员贪污的以贪污论。\n《刑法》第385条：国家工作人员利用职务上的便利，索取他人财物的（即使未为他人谋取利益），即构成受贿罪。\n《刑法》第277条：以暴力、威胁方法阻碍国家机关工作人员依法执行职务的构成妨害公务罪（致人重伤的若成立故意伤害罪等通常从一重罪或转化处罚，非一律以妨害公务从重）。","《社区矫正法》第2条（及《刑事诉讼法》第269条）：对被判处管制、宣告缓刑、假释和暂予监外执行的罪犯，依法实行社区矫正。（《刑法》与早期立法表述亦强调“在社会上执行”的单处剥夺政治权利人员配合司法行政/公安考察管理。）\n《刑法》第65条第1款：一般累犯要求前罪和后罪均须为成年（已满18周岁）且故意犯罪；前罪犯罪时不满18周岁的人，后罪再犯只属于一般“再犯”，不构成累犯。\n《刑法》第78条：对被判处管制、拘役、有期徒刑、无期徒刑的罪犯可依法适用减刑；有期徒刑减刑后实际执行的刑期不能少于原判刑期的二分之一。","《刑法》第114条、第115条【放火、决水、爆炸、投放危险物质、以危险方法危害公共安全罪】：放火、决水、爆炸以及投放毒害性、放射性、传染病病原体等物质或者以其他危险方法危害公共安全，尚未造成严重后果的，处三年以上十年以下有期徒刑；致人重伤、死亡或者使公私财产遭受重大损失的，处十年以上有期徒刑、无期徒刑或者死刑。（危险犯，只要行为在客观上足以危害不特定多数人的生命、健康或重大公私财产安全即既遂。）\n《刑法》第117条【破坏交通设施罪】：破坏轨道、桥梁、隧道、公路、机场、航道、灯塔、标志或者进行其他破坏活动，足以使火车、汽车、电车、船只、航空器发生倾覆、毁坏危险，尚未造成严重后果的，处三年以上十年以下有期徒刑。（危险犯；高速公路信息警示屏、机动车道井盖、河道航标灯均属于交通设施；车窗玻璃非交通工具重要部件、在建地铁电缆不构成破坏交通设施罪。）","《刑法》第133条【交通肇事罪】：违反交通运输管理法规，因而发生重大事故，致人重伤、死亡或者使公私财产遭受重大损失的，处三年以下有期徒刑或者拘役。\n最高法《关于审理交通肇事刑事案件具体应用法律若干问题的解释》第2条第1款：交通肇事具有下列情形之一的，处三年以下有期徒刑或者拘役：（一）死亡一人或者重伤三人以上，负事故全部或者主要责任的；（二）死亡三人以上，负事故同等责任的；（三）造成公共财产或者他人财产直接损失，负事故全部或者主要责任，无能力赔偿数额在三十万元以上的。\n第2条第2款：交通肇事致一人以上重伤，负事故全部或者主要责任，并具有酒后、吸食毒品后驾驶机动车辆等情形之一的，以交通肇事罪定罪处罚。\n第7条：单位主管人员、机动车辆所有人或者机动车辆承包人指使、强令他人违章驾驶造成重大交通事故，具有本解释第2条规定情形之一的，以交通肇事罪定罪处罚。\n（注：交通肇事须发生在公共交通管理范围内，封闭住宅小区内部等非公共道路造成二人重伤不构交通肇事罪而构成过失致人重伤罪；刮倒被害人尚不构成交通肇事罪后故意将其拖挂致死的直接认定故意杀人罪。）","《刑法》第134条第1款【重大责任事故罪】：在生产、作业中违反有关安全管理的规定，因而发生重大伤亡事故或者造成其他严重后果的，处三年以下有期徒刑或者拘役；情节特别恶劣的，处三年以上七年以下有期徒刑。（与失火罪、过失致人死亡罪呈特别法优于一般法竞合。）\n第134条第2款【强令、组织他人违章冒险作业罪】：强令他人违章冒险作业，或者明知存在重大事故隐患而不排除，仍冒险组织作业，因而发生重大伤亡事故或者造成其他严重后果的，处五年以下有期徒刑或者拘役；情节特别恶劣的，处五年以上有期徒刑。\n《刑法》第115条第2款【失火罪】：过失引起火灾危害公共安全致严重后果的犯罪。","《刑法》第338条【污染环境罪】：违反国家规定，排放、倾倒或者处置有放射性的废物、含传染病病原体的废物、有毒物质或者其他有害物质，严重污染环境的，处三年以下有期徒刑或者拘役，并处或者单处罚金；情节严重的，处三年以上七年以下有期徒刑，并处罚金。（因生产工业排污、倾倒废料引发环境污染事故与村民中毒或农作物绝收，属于污染环境罪而非投放危险物质罪。）","《刑法》第291条之二【高空抛物罪】：从建筑物或者其他高空抛掷物品，情节严重的，处一年以下有期徒刑、拘役或者管制，并处或者单处罚金。有前款行为，同时构成其他犯罪的，依照处罚较重的规定定罪处罚。（砸中重伤直接按以危险方法危害公共安全罪或过失致人重伤等重罪处罚；仅掉落身旁惊吓致摔伤定高空抛物罪。）\n《刑法》第277条第5款【袭警罪】：暴力袭击正在依法执行职务的人民警察的，处三年以下有期徒刑、拘役或者管制；使用枪支、管制刀具，或者以驾驶机动车撞击等手段，严重危及其人身安全的，处三年以上七年以下有期徒刑。\n《刑法》第294条：组织、领导、参加黑社会性质组织又有其他犯罪行为的，依照数罪并罚的规定处罚。","《刑法》第128条【非法持有枪支罪】与第348条【非法持有毒品罪】：不知包内有枪支、毒品而偷走普通提包的，因缺少对特定违禁品“明知”故不成立盗窃枪支罪，仅成立盗窃罪；事后发现而将其继续藏匿在家中非法持有的，构成非法持有枪支罪、非法持有毒品罪，数罪并罚。","《刑法》第263条【抢劫罪】：以暴力、胁迫或者其他方法抢劫公私财物的，处三年以上十年以下有期徒刑，并处罚金；具有“入户抢劫”或“抢劫致人重伤、死亡”等法定加重情形的，处十年以上有期徒刑、无期徒刑或者死刑。\n（1）抢劫罪既遂标准：只要劫得财物或者造成被害人轻伤以上伤害结果即成立既遂（哪怕分文未得但致轻伤亦既遂）；被害人为逃避持刀抢劫暴力逼迫跳车被撞死与抢劫行为存在因果关系，成立抢劫致人死亡结果加重犯。\n（2）第269条【转化型抢劫罪】：犯盗窃、诈骗、抢夺罪，为窝藏赃物、抗拒抓捕或者毁灭罪证而当场使用暴力或者以暴力相威胁的，依照抢劫罪定罪处罚；第267条第2款：携带凶器抢夺的，依照抢劫罪定罪处罚。\n（3）第289条【聚众打砸抢】：聚众“打砸抢”毁坏或者抢走公私财物的，对首要分子依照抢劫罪定罪处罚。","最高法《关于审理抢劫、抢夺刑事案件适用法律若干问题的意见》：“入户抢劫”中的“户”指供他人家庭生活、与外界相对隔离的住所（不包括酒店客房、办公场所）；冒充煤气抄表员等欺骗进入他人住所实施抢劫的成立入户抢劫；盗窃后追出至公共楼道才打伤追赶者不属在“户”内当场施暴；随房产中介正当进入后临时起意在户内抢劫的，若非“以实施抢劫等违法犯罪为目的进入户内”一般不按入户抢劫论。","《刑法》第264条【盗窃罪】：盗窃公私财物，数额较大的，或者多次盗窃、入户盗窃、携带凶器盗窃、扒窃的。\n两高《关于办理盗窃刑事案件适用法律若干问题的解释》：\n（1）秘密窃取指行为人主观上自以为采取不被发觉的方式取得他人财物，即使物主暗中注视亦成立盗窃（如乘人不备调包、借手机佯装打电话逃跑、扶走醉酒人取财）；\n（2）二年内盗窃三次以上的为多次盗窃；在公共场所/公共交通工具盗窃他人随身携带财物为扒窃；\n（3）盗窃数额按财物实际客观市场价值计算（含电脑及其合法安装的专有商业软件价值），不以廉价销赃款额计算；共同盗窃对全部共犯按共同参与盗窃总价值而非个人分赃额处罚。\n（4）盗窃信用卡并使用的（第196条第3款）、盗窃增值税专用发票等用于骗取出口退税抵扣税款发票的（第210条）、盗窃毒品后自食的均按盗窃罪定罪处罚；盗窃商业秘密定侵犯商业秘密罪。","《刑法》第266条【诈骗罪】：以非法占有为目的，用虚构事实或者隐瞒真相的方法，骗取数额较大的公私财物。行为人欺骗使被害人产生错误认识并基于错误认识“自愿处分财产”是诈骗罪区别于盗窃罪的核心（调包取财仍是秘密窃取定盗窃；借车急用质押典当无非法占有目的，此后为还旧债明知无力偿还再向他人借车质押即属诈骗，金额按所骗财物客观价值计）；伪造假名画、以冰糖冒充冰毒售卖骗钱、加盖私刻医院印章逃避医疗费（牵连犯择一重罪）均定诈骗罪。","《刑法》第267条【抢夺罪】：乘人不备公然夺取数额较大的公私财物（如假装试戴试看接过手表拔腿逃跑）。\n《刑法》第274条【敲诈勒索罪】：以非法占有为目的，对被害人实施威胁或者要挟的方法，强行索取公私财物；\n《刑法》第275条【故意毁坏财物罪】：故意毁灭或者损坏公私财物，数额较大或者有其他严重情节的（偷放货车柴油、盗窃未遂泄愤砸毁电脑、破解密码故意瞎操作股票致他人资产实亏）。\n司法解释：冒充人民警察“抓赌”“抓嫖”并暴力（手铐铐住等）压制劫财的定抢劫罪，否则单纯冒充警察恐吓敲诈索财的定敲诈勒索罪（招摇撞骗不以取财为核心或仅定重罪）。","《刑法》第271条【职务侵占罪】与第382条【贪污罪】：国有资本控股企业中的非国家工作人员（一般聘用人员无管理经营国有资产公务职责）勾结无业人员利用值班便利窃取本单位货物的，共同构成职务侵占罪；国家工作人员（受委托管理国有财产人员）勾结普通公民共同侵占国有仓库物资的，共同构成贪污罪。\n《刑法》第388条之一【利用影响力受贿罪】：与国家工作人员关系密切的人，通过该国家工作人员职务上的行为或职权地位形成的便利条件，为请托人谋取不正当利益，索取或者收受财物数额较大或情节较重。","《刑法》第87条【追诉时效】：犯罪经过下列期限不再追诉：（一）法定最高刑为不满五年有期徒刑的，经过五年；……（前罪因已过追诉时效不再追诉时，不得计入后罪的犯罪数额。）","《刑法》第232条【故意杀人罪】与第234条【故意伤害罪】：\n下列情形依法转化或拟制以故意杀人罪/故意伤害罪定罪处罚：\n（1）《刑法》第238条第2款：非法拘禁他人并使用暴力致人伤残、死亡的，分别依照故意伤害罪、故意杀人罪定罪处罚；\n（2）《刑法》第247条：刑讯逼供、暴力取证致人伤残、死亡的，依照故意伤害罪、故意杀人罪定罪从重处罚；\n（3）《刑法》第248条：虐待被监管人致人伤残、死亡的，依照故意伤害罪、故意杀人罪定罪从重处罚；\n（4）《刑法》第292条第2款：聚众斗殴致人重伤、死亡的，依照故意伤害罪、故意杀人罪定罪处罚；\n（5）脱逃中使用暴力致人重伤、死亡的（牵连/竞合从一重），依照故意伤害罪、故意杀人罪定罪处罚；\n（6）《刑法》第234条之一第2款：未经本人同意摘取其器官，或者摘取不满十八周岁的人的器官，或者强迫、欺骗他人捐献器官的，依照故意伤害罪、故意杀人罪定罪处罚。","《刑法》第236条【强奸罪】：违背妇女意志，以暴力、胁迫或者其他手段强行与妇女发生性关系的，或者与不满十四周岁的幼女发生性关系的，均以强奸罪论处。\n法定加重情节（处十年以上有期徒刑、无期徒刑或者死刑）：（一）强奸妇女、奸淫幼女情节恶劣的；（二）强奸妇女、奸淫幼女多人的；（三）在公共场所当众强奸、奸淫的；（四）二人以上轮奸的；（五）奸淫不满十周岁的幼女或者造成幼女伤害的；（六）致使被害人重伤、死亡或者造成其他严重后果的。（注意：利用迷信欺骗、冒充其丈夫趁熟睡、诱骗性交等违背性自主权手段均成立强奸罪；为谋私利互相利用如办出国手续自愿交易不以强奸罪论处。）\n第236条之一【负有照护职责人员性侵罪】：对已满十四周岁不满十六周岁的未成年女性负有监护、收养、看护、教育、医疗等特殊职责的人员，与该未成年女性发生性关系的，处三年以下有期徒刑；情节恶劣的，处三年以上十年以下有期徒刑。","《刑法》第238条【非法拘禁罪】：非法拘禁他人或者以其他方法非法剥夺他人人身自由的。为索取债务（包括合法债务与赌债、高利贷等非法债务）非法扣押、拘禁他人的，依照非法拘禁罪定罪处罚。国家机关工作人员利用职权犯前两款罪的，从重处罚。使用暴力致人伤残、死亡的，转化为故意伤害罪、故意杀人罪（造成轻微伤或未超出拘禁必需手段过失致轻伤的仍定非法拘禁罪）。\n第239条【绑架罪】：以勒索财物为目的绑架他人的（或者以勒索财物/虚构债权为目的偷盗婴幼儿的），或者绑架他人作为人质的，处十年以上有期徒刑或者无期徒刑；杀害被绑架人的，或者故意伤害被绑架人致人重伤、死亡的，仍按绑架罪一罪处罚（法定死刑）。","《刑法》第240条【拐卖妇女、儿童罪】：以出卖为目的，有拐骗、绑架、收买、贩卖、接送、中转妇女、儿童的行为之一的。奸淫被拐卖的妇女的，或者造成被拐卖的妇女、儿童或者其亲属重伤、死亡或者其他严重后果的，属于拐卖妇女、儿童罪的加重情节（不另与强奸罪数罪并罚）。\n第241条【收买被拐卖的妇女、儿童罪】：不以出卖为目的收买被拐卖的妇女、儿童后又出卖的，直接转化为拐卖妇女、儿童罪；收买后又有强奸、非法拘禁、故意伤害、侮辱等行为的，依照数罪并罚的规定处罚。","《刑法》第243条【诬告陷害罪】：捏造犯罪事实，向国家机关或有关单位告发，意图使他人受刑事追究，情节严重的行为（只向私人发短信而不向有关机关告发的，不构成本罪）。\n第246条【侮辱罪、诽谤罪】：以暴力或者其他方法公然侮辱他人，或者捏造事实并在网络等途径公开散布诽谤他人（如利用AI将色情视频换脸发布、捏造他人卖淫并四处散布），情节严重的，分别构成侮辱罪、诽谤罪。\n第260条【虐待罪】与第260条之一【虐待被监护、看护人罪】：对家庭成员虐待（含同居长期照料生活成员，不作为监护人放任共犯），或对未成年人、老年人、患病、残疾人等负有监护、看护职责的人（如幼儿园教师用针扎幼童）虐待被监护、看护的人，情节恶劣的，分别构成虐待罪、虐待被监护、看护人罪。","《刑法》第256条【破坏选举罪】：在选举各级人民代表大会代表和国家机关领导人员时，以暴力、威胁、欺骗、贿赂、伪造选举文件、虚报选举票数等手段破坏选举或者妨害选民和代表自由行使选举权和被选举权，情节严重的行为。（主体为一般自然人，不包括单位；主观方面只能是故意。）\n《刑法》第253条之一【侵犯公民个人信息罪】：公民个人信息涵盖以电子或者其他方式记录的能够单独或与其他信息结合识别特定自然人身份或者反映其活动情况的各种信息，包括姓名、身份证件号码、通信通讯联系方式、住址、账号密码、财产状况、行踪轨迹等。\n《刑法》第336条之一【非法植入基因编辑、克隆胚胎罪】：将基因编辑、克隆的人类胚胎植入人体或者动物体内，或者将基因编辑、克隆的动物胚胎植入人体内，情节严重的行为。","《刑法》第277条【妨害公务罪与袭警罪】：以暴力、威胁方法阻碍国家机关工作人员（含工商局人员等，不含国有公司经理）、各级人大代表依法执行职务，或在突发事件中阻碍红十字会工作人员依法履行职责，或故意阻碍国安、公安执行国家安全任务未用暴力但后果严重的行为。暴力袭击正在依法执行职务的人民警察的（如打砸警车危及民警人身安全），定袭警罪。\n第279条【招摇撞骗罪】：为谋取非法利益（含财物、地位、玩弄女性等），冒充国家机关工作人员（如工商局副局长、公安干警，不含电视台记者、大学招生办主任或国企高管）进行招摇撞骗。\n第305条【伪证罪】、第306条【辩护人、诉讼代理人毁灭证据、伪造证据、妨害作证罪】与第307条之一【虚假诉讼罪】：刑事诉讼中证人作伪证定伪证罪；辩护人在刑事诉讼中出示虚假证据定辩护人伪造证据罪；以捏造事实提起民事诉讼（如恶意伪造借条提起民事起诉转移财产）定虚假诉讼罪。","《刑法》第310条【窝藏、包庇罪】：明知是犯罪的人而为其提供隐藏处所、财物（如出钱资助逃犯躲避、留宿通缉犯）帮助其逃匿的，为窝藏罪；明知是犯罪的人而在司法侦查/审理中作假证明包庇（须为积极作为方式，主体是一般主体，对象不要求已经法院判决定罪）的，为包庇罪（证人出庭作伪证归第305条伪证罪）。\n第313条【拒不执行判决、裁定罪】：对法院判决、裁定有能力执行而拒不执行，情节严重的（包括屡次殴打执行干警阻碍执行、被执行人隐藏转移财产、担保人故意毁坏或转让已提供担保的财产等）。\n第316条【脱逃罪】：依法被关押的罪犯、被告人、犯罪嫌疑人（不含未关押的管制犯）逃脱监管的行为。","《刑法》第293条【寻衅滋事罪】：行为人为寻求刺激、发泄情绪、逞强耍横等，无事生非（针对不特定或偶遇对象），随意殴打他人情节恶劣（致人轻伤的仍按寻衅滋事罪定罪处罚；致人重伤、死亡的按故意伤害罪或故意杀人罪论处；因宅基地、债务、医患等特定现实民事矛盾针对特定当事人一般不属无事生非）。\n第292条【聚众斗殴罪】：在聚众斗殴中使用严重威胁人身安全的器械（如携带枪支或使用事先藏匿的砍刀；不含动物或现场临时夺取对方木棒防卫），属于“持械”加重情形。\n第294条：组织、领导黑社会性质组织霸占产区低价强买豌豆并暴力致人重伤的，分别构成组织、领导黑社会性质组织罪、强迫交易罪和故意伤害罪并罚。","《刑法》第303条第2款【开设赌场罪】：为赌博网站担任代理接受投注、建立赌博网站参考体育彩票号码接受会员投注、或明知他人用于开设赌场仍开发并持续提供网站运维服务的，均成立开设赌场罪（共犯或正犯）。\n第347条、第357条【走私、贩卖、运输、制造毒品罪】：受吸毒者委托代购毒品并从中加价或收取“劳务费”牟利的，构成贩卖毒品罪；携带毒品乘国际航班抵达我国境内机场被海关查获的，毒品已越过国境线即成立走私毒品罪既遂；不知情卖假药当毒品的乙定贩卖毒品罪未遂、甲定诈骗罪；单位亦可构成本罪；通过显著高于市场价格运费等反常客观情形可推定主观明知；毒品数量以查证属实数量计，不以纯度折算。","《刑法》第285条第2款【非法控制计算机信息系统罪】：违反国家规定，对前款规定以外的计算机信息系统（如家庭联网摄像头设备）实施侵入或采用其他技术手段非法控制，情节严重的行为。\n第286条【破坏计算机信息系统罪】：违反国家规定，对计算机信息系统功能或者系统中存储、处理、传输的数据和应用程序进行删除、修改、增加、干扰（如冒用买家身份进系统删改网店购物评价），后果严重的行为。\n第295条【传授犯罪方法罪】：故意把犯罪方法（如制毒工艺视频）传授给他人。\n第364条【传播淫秽物品罪】：不以直接贩卖/点击传播淫秽物品本身牟利，仅为给销售保健品等合法商品引流而在群组发送淫秽视频链接且情节严重的，定传播淫秽物品罪（而非传播淫秽物品牟利罪）。\n第338条【污染环境罪】：上游企业排酸与下游企业排碱混合反应毒害多人致重伤的，按累积因果关系分别均构成污染环境罪（结果加重犯）。","《刑法》第223条【串通投标罪】、第280条【伪造国家机关印章罪、伪造公司印章罪】：伪造人社局专章（国家机关印章）、多家建筑公司公章（公司印章）并用虚假社保缴费单帮助围标并中标巨额工程项目的，分别侵害国家机关印章公信力、企业印章管理秩序及招投标市场公平竞争秩序，依法数罪并罚（不从一重处断）。","《刑法》第198条【保险诈骗罪】：投保人、受益人故意造成被保险人死亡、伤残或者疾病骗取保险金的，依照数罪并罚规定处罚；但尚未开始向保险公司提交理赔申请即被抓获的，保险诈骗罪尚未着手（或仅处预备），仅按已既遂的故意杀人罪定罪（杀后焚尸属事后不可罚行为）。\n关于合法生活行为边界：从正规商户订购“超级辣”外卖放在自己家门口以惩戒偷外卖者，因无法预见邻家幼童偷吃后因极端罕见体质严重过敏加上堵车未及时抢救死亡，属于无故意无过失的意外事件（不构成犯罪）。","《刑法》第3条【罪刑法定原则】：法律明文规定为犯罪行为的，依照法律定罪处刑；法律没有明文规定为犯罪行为的，不得定罪处刑。（基本内容：法定化、明确化、合理化；派生规则：禁止采用习惯法、禁止有罪类推解释、禁止重法溯及既往但允许有利被告人的轻法溯及、禁止绝对不定期刑；“法”仅限全国人大及其常委会制定的法律，不包括行政法规。）\n第5条【罪责刑相适应原则】：刑罚的轻重，应当与犯罪分子所犯罪行和承担的刑事责任相适应。（体现在放火罪与失火罪的不同法定刑，以及不因“曾有工作贡献”而法外脱罪或偏离罪行与刑责。）\n刑法的三大机能：规制机能（约束引导行为）、保护机能（惩治犯罪保护法益）、保障机能（保障公民不受非法刑罚追究与错案追诉，如正当防卫不捕不诉、法院纠正错误指控罪名）。","《刑法》第6条【属地管辖权】：凡在中华人民共和国领域内犯罪的，除法律有特别规定的以外，都适用本法。凡在中华人民共和国船舶或者航空器内犯罪的，也适用本法（公有/一般我国登记船舶航空器属拟制领土；使领馆及纯粹私人外籍或非我国登记船只不属于我国拟制领土）。犯罪的行为或者结果有一项发生在中华人民共和国领域内的，就认为是在中华人民共和国领域内犯罪。\n第7条【属人管辖权】：中华人民共和国公民在中华人民共和国领域外犯本法规定之罪的，适用本法，但是按本法规定的最高刑为三年以下有期徒刑的，可以不予追究。国家工作人员和军人在领域外犯本法规定之罪的，一律适用本法。\n第8条【保护管辖权】：外国人在中华人民共和国领域外对中华人民共和国国家或者公民犯罪，而按本法规定的最低刑为三年以上有期徒刑的，可以适用本法，但是按照犯罪地的法律不受处罚的除外。\n第9条【普遍管辖权】：对于中华人民共和国缔结或者参加的国际条约所规定的罪行（如毒品、劫机、海盗、反恐），中华人民共和国在所承担条约义务的范围内行使刑事管辖权的，适用本法。","《刑法》第12条【时间效力——从旧兼从轻原则】：中华人民共和国成立以后本法施行以前的行为，如果当时的法律不认为是犯罪的，适用当时的法律；如果当时的法律认为是犯罪的，依照本法总则第四章第八节的规定应当追诉的，按照当时的法律追究刑事责任，但是如果本法不认为是犯罪或者处刑较轻的，适用本法（行为时法与新法法定刑完全相同则适用行为时旧法；“处刑较轻”比较的是法定刑而非具体宣告刑；按照审判监督程序重新审判的生效旧判案件，适用行为时的法律）。\n刑法司法解释的时间效力亦适用从旧兼从轻原则。","《刑法》第13条【犯罪概念与但书】：一切危害国家主权、领土完整和安全，分裂国家、颠覆人民民主专政的政权和推翻社会主义制度……依照法律应当受刑罚处罚的，都是犯罪，但是情节显著轻微危害不大的，不认为是犯罪。（“但书”通过定量限制划清罪与非罪界限，避免轻微违法行为犯罪化。）\n最高法《关于审理强奸案件有关问题的解释》及两高两部未成年人保护意见：已满十四周岁不满十六周岁的未成年人与幼女自愿发生性关系，情节显著轻微、危害不大的，一般不作为犯罪处理。","刑法解释按效力分为立法解释（全国人大及其常委会作出的法律解释，如信用卡、266条、土地管理法规解释；不含全国人大常委会法工委刑法室答复和单行刑法）、司法解释（最高法、最高检作出，不包括地方高院或具体裁判判决书）和学理解释（无权解释，如刑法教科书观点）。\n按方法分为文理解释和论理解释（含扩大解释、缩小解释、目的解释、当然解释等）；扩大解释仍在词语可能文义射程内（如抢劫运钞车视为抢劫银行、暴力劫取国有档案视为抢夺档案、稳定同居伴侣视为虐待罪家庭成员、牧民帐篷视为户、携带枪支抢夺视为持枪抢劫）；超出文字射程的相似推衍属被禁止的类推解释（如吸毒驾驶按醉驾危险驾驶罪、无人机按航空器、比特币按国家法定货币）。\n刑法的形式渊源包括刑法典（狭义刑法，总则、分则两编及附则一条，条文统一连续编号，规范包括条、款、项）、单行刑法（1998《惩治骗购外汇决定》）及附属刑法。","刑法分则条文由罪状与法定刑构成。\n罪状分为简单罪状（仅指出罪名特征如“传授犯罪方法的”“诈骗公私财物，数额较大的”）、叙明罪状（详尽描述客观特征如“以暴力威胁、贿买等方法阻止证人作证或者指使他人作伪证的”“以暴力、胁迫手段组织残疾人或者不满14周岁的未成年人乞讨的”）、空白罪状（指明违反其他法规如“违反国家规定，侵入……”）、引证罪状（引用同法其他条文如“过失犯前款罪的”）和混合罪状。\n法定刑分为绝对确定法定刑（极少，如劫持航空器致死死刑）、相对确定法定刑（最常见，规定一定刑种与刑期幅度如“处拘役，并处罚金”）和绝对不确定法定刑（我国禁止）。","犯罪客体是刑法所保护而被犯罪行为侵害的社会关系（或法益），按范围分为一般客体（一切犯罪共同侵犯的社会主义社会关系整体）、同类客体（某类犯罪共同侵犯的社会关系，是我国刑法分则十大章体系构建的依据）和直接客体（具体犯罪直接侵犯的具体社会关系，分简单客体与复杂客体）。\n犯罪对象是犯罪行为直接指向或作用于的具体人、物或信息；犯罪客体与犯罪对象是本质与现象的关系，犯罪对象是犯罪客体的物质/载体表现，并非所有犯罪都有犯罪对象（如脱逃罪、偷越国境罪等），也不能仅凭犯罪对象区分此罪与彼罪。\n严重社会危害性是犯罪的实质特征和区分犯罪与一般违法行为的根本界限，是主客观因素的统一；《刑法》第13条但书通过定性与定量相结合划定罪与非罪界限，集中司法资源打击严重危害行为。","犯罪构成是刑法规定的决定某一行为的社会危害性及其程度而为该行为构成犯罪所必需的一切客观和主观要件的有机统一，是追究刑事责任的基础与标准（刑法总则规定犯罪构成的一般要件）。\n分类：①基本犯罪构成（刑法条文对基本既遂犯所规定的构成，其中常见一般程度为标准的犯罪构成，刑罚加重或减轻的为派生的犯罪构成——含加重与减轻的犯罪构成，如故意杀人“情节较轻处三年以上十年以下有期徒刑”为减轻的犯罪构成）；②修正的犯罪构成（以基本犯罪构成为基础对其补充修改的预备、未遂、中止及共犯中的教唆、帮助等未完成形态与共犯形态）。","危害行为是犯罪客观方面唯一不可或缺的必备要件（其余如结果、时间、地点、方法、对象皆为选择性要件），包括作为与不作为。\n不作为犯罪的成立条件：①行为人负有某种特定义务（法律明文规定、职务/业务要求、法律行为/合同如保姆护童或医生接诊、先行不法行为如故意伤害致被害人垂危；休假警察一般无职务救助义务）；②行为人具有履行该特定义务的实际能力；③行为人不履行义务并造成或可能造成危害结果，主观上既可以是故意也可以是过失。\n分类：①纯正不作为犯（刑法明确只能由不作为构成的犯罪，如遗弃罪、逃税罪、拒不履行信息网络安全管理义务罪、拒绝提供间谍犯罪证据罪等）；②不纯正不作为犯（负有作为义务之人以不作为实现通常由作为构成的犯罪，如故意不喂食饿死婴儿/瘫痪老人之不作为故意杀人罪、玩忽职守可作为亦可不作为）。","危害结果：实害犯（结果犯，如故意毁坏财物罪、交通肇事罪）以法定物质实害结果发生作为犯罪既遂或成立要件；危险犯（如放火罪、破坏交通工具罪）以法定现实危险状态出现为既遂，不要求实害发生；行为犯（如脱逃罪、私放在押人员罪）与举动犯（如参加黑社会性质组织罪、煽动分裂国家罪）实施完毕法定实行行为或一着手即既遂。\n刑法因果关系是危害行为与危害结果之间客观的、不以行为人主观认识为转移的引起与被引起联系（存在因果关系仅是承担刑事责任的客观必要基础而非充分条件；条件关系中间若介入异常独立他因会阻断因果关系；持械追打逼迫被害人跳冰河溺水具有刑法因果关系；迷信行为或普通劝人乘车遇独立车祸均无因果关系；重伤送医途遇高楼坠落花盆砸死属于介入独立异常因素阻断死亡因果关系）。","预备行为是为实行犯罪创造便利条件（如邀约同伙抢劫、毒死看家犬、踩点跟踪）；实行行为则直接指向并侵害刑法分则所保护的犯罪客体（预备行为与实行行为的实质区别在于是否直接侵害犯罪客体）。","《刑法》第236条【强奸罪】：违背妇女意志，以暴力、胁迫或者其他手段强行与妇女发生性关系（受害人仅限于女性，妇女可成立强奸罪共犯或间接正犯）；强奸“致使被害人重伤、死亡”指强奸暴力或奸淫行为本身直接造成的重伤、死亡，通常不包括被害人事后自杀身亡（作为从重考量）。\n第240条【拐卖妇女、儿童罪】：拐卖妇女罪与绑架罪的关键区分在于是否具有“出卖目的”（绑架罪以勒索财物或满足其他不法要求为目的；二者均可能实施绑架、剥夺人身自由及侵害妇女）。","一、实质的一罪：\n1. 继续犯（持续犯）：一个犯罪行为与不法状态从既遂起持续不断共同延展（如非法拘禁罪、绑架罪、遗弃罪、非法持有毒品/枪支罪），追诉时效从犯罪行为终了之日起算，属实质的一罪；状态犯（如诈骗罪、盗窃罪、故意杀人罪）既遂后行为即终了，仅不法结果状态继续存在。\n2. 想象竞合犯：实施一个行为同时触犯数个不同罪名（如盗割正在使用中的通讯电缆/高压电线，一行为同时触犯盗窃罪与破坏公用电信设施罪/破坏电力设备罪），从一重罪处罚。\n3. 结果加重犯：法律明文规定同一犯罪因发生超出基本故意之外的加重结果而配置升格法定刑（如非法行医造成就诊人死亡、长期虐待致人重伤、暴力干涉婚姻自由致人死亡；注意聚众斗殴致人死亡直接转化为故意杀人罪，强制猥亵致羞愤自杀、遗弃致死均无结果加重犯；非法拘禁使用暴力致人伤残死亡转化为故意伤害/故意杀人罪）。","二、法定的一罪与处断的一罪：\n1. 法定的一罪包括惯犯与集合犯（注意：集合犯属于法定的一罪，不属于处断的一罪）。\n2. 处断的一罪包括连续犯（基于同一概括故意连续实施数个同种独立犯罪行为，触犯同一罪名）、牵连犯（以实施某罪为目的，其手段行为或结果行为又触犯他罪，如伪造公文用于诈骗、投保人为骗保杀害被保险人——除法律明确规定数罪并罚外，原则上择一重罪处罚）和吸收犯（数个不同行为依据常规阶段或附随关系一罪吸收他罪，如非法购买枪支后私藏在家仅定非法买卖枪支罪）。\n3. 法条竞合：由于刑法分则条文规范重合或交叉（非犯罪形态问题，仅涉法律条文适用选择），对同一犯罪行为触犯数法条时仅能择一适用，一般适用特别法优于普通法原则（如诈骗罪与信用卡诈骗罪、盗窃罪与盗窃枪支罪、盗窃罪与贪污罪均属法条竞合；行贿罪与受贿罪是对向犯而非竞合关系）。","三、分则法定数罪并罚与一罪处断特例：\n1. 应当数罪并罚的典型条文与司法解释：①投保人/受益人故意杀害或伤害被保险人骗取保险金（《刑法》第198条）；②参加黑社会性质组织又实施杀人等其他犯罪（第294条）；③收买被拐卖的妇女后强行奸淫、非法拘禁、伤害、侮辱（第241条）；④在走私普通货物物品或组织、运送他人偷越国（边）境过程中以暴力抗拒缉私或杀害、伤害检查人员（第157条、第318条、第321条）；⑤渎职过程中受贿的（除第399条第4款徇私枉法、民事/行政枉法裁判、执行判决裁定失职/滥用职权这4个司法工作人员渎职罪与受贿罪择一重罪外，其余如食品监管渎职罪与受贿罪均数罪并罚）；⑥生产销售伪劣产品同时暴力抗拒查处；⑦上游金融诈骗（如集资诈骗罪）等7类犯罪人自己“自洗钱”掩饰转移赃款（《刑修十一》第191条）；⑧缓刑考验期内发现漏罪（无论同种漏罪还是异种漏罪）或在服刑期间再犯新罪，依法撤销缓刑并实行数罪并罚。\n2. 不数罪并罚的一罪处理：①判决宣告前发现同种数罪（如多次受贿/多次走私运输毒品，数额或数量累计以一罪论）；②刑罚执行完毕后才发现漏罪不再并罚；③为私自修车盗走停放轿车轮胎及发动机致不能运行，不危及公共安全仅定盗窃罪；④伪造货币后又出售、运输假币，只定伪造货币罪一罪；⑤走私毒品时以暴力抗拒检查情节严重（第347条第2款）直接作升格法定刑条件，仅定走私毒品罪一罪；⑥拐卖妇女过程中奸淫被拐卖妇女、抢劫过程中为制服抗拒或夺财当场打死被害人、或绑架后杀害被绑架人（未遂外均作绑定一罪）；⑦《刑修九》前强迫卖淫中强奸旧法作一罪，现行法改数罪并罚。","《刑法》第140条【生产、销售伪劣产品罪】：在产品中掺杂、掺假，以假充真，以次充好或者以不合格产品冒充合格产品，销售金额五万元以上的（如违规超量使用合法食品色素致馒头不合格且达22万元）。\n第141条【生产、销售假药罪】：以非药品冒充药品或以他种药品冒充此种药品（如面粉冒充消炎药、西药冒充纯中药、保健品冒充抗病药品；同时触犯第140条与诈骗罪，依第149条择一重罪处罚或依多选题竞合考察所构成罪名；明知他人销售假药仍提供广告宣传以销售假药罪共犯论处）。\n第142条之一【妨害药品管理罪】：规制未取得药品相关批准证明文件生产进口真药、使用禁止药品等情形，不含以非药品冒充假药。\n第144条【生产、销售有毒、有害食品罪】：在食品中掺入有毒、有害的非食品原料（如工业酒精、洗衣粉、工业盐；给牛肉单纯注水属伪劣产品，不属有毒有害食品）。","《刑法》第153条【走私普通货物、物品罪】：违反海关法规逃避海关监管，偷逃应缴关税（如将高税率货伪报为低税率、隐瞒夹带未申报化妆品香烟入境）。《刑修八》已废除走私普通货物物品罪死刑。\n第155条【间接走私】：直接向走私人非法收购国家禁止进口物品或走私进口的普通货物物品数额较大的，以相应走私罪论处。\n第157条【走私罪数罪并罚】：以暴力、威胁方法抗拒缉私的，以走私罪和妨害公务罪数罪并罚。\n司法解释：走私废物中混有普通货物的，以走私废物罪定罪处罚；具有走私概括故意但对具体走私对象不明的，依实际走私物品定罪；基于走私目的单纯向海关人员行贿未实施走私行为的定行贿罪。","《刑法》第163条【非国家工作人员受贿罪】：公司、企业或者其他单位的工作人员（含公立医院普通医生、村委会非从事协助政府行政管理职务的普通自治事务人员、工程承包队队长、文艺演出筹委会主任，以及已退休老局长退后另与他人合伙创办有限公司担任副总经理时）利用职务便利索取、收受他人财物为他人谋取利益。\n第169条之一【背信损害上市公司利益罪】：上市公司董事、监事、高级管理人员违背对公司的忠实义务，利用职务便利操纵公司以明显不公平价格交易（如提高公司商品售价差价套取公司商品私售获利）致使上市公司利益遭受重大损失。\n第170-171条【伪造货币罪】：仿照国内市场流通或可兑换的人民币、外币（含流通纪念金币），使用各种方法制造足以乱真假币（单纯将真英镑揭层一分为二定变造货币罪；临摹欧元收藏、铸造古代钱币或直播手绘百元钞票供打赏均不构成伪造货币罪）。伪造货币并出售或运输的，定伪造货币罪一罪从重。","《刑法》第176条【非法吸收公众存款罪】与第192条【集资诈骗罪】：两罪均可涉及巨额资金、众多被害人及单位主体，根本区分在于\u0001是否具有非法占有目的\u0002（携带集资款逃匿、将集资款用于违法犯罪、拒不交代去向逃避返还均认定具有非法占有目的；因正常经营失败破产无法返还不当然认定非法占有目的）。\n《刑法》第191条【洗钱罪】：7大上游犯罪为毒品、黑社会性质组织、恐怖活动、走私、贪污贿赂、破坏金融管理秩序（含非法吸收公众存款罪）、金融诈骗犯罪（不含组织传销活动罪；2006年《刑修六》方将贪污贿赂与金融犯罪纳入，2021年《刑修十一》正式将“自洗钱”入罪且不以跨境转移为要件）。\n第177条之一【妨害信用卡管理罪】：使用虚假身份证件骗领信用卡；若骗领后又进一步用该卡透支骗财（或窃取骗领他人信息绑定微信套现、在ATM机利用他人忘拔银行卡取款后抗拒抓捕暴力打人），分别定妨害信用卡管理罪、信用卡诈骗罪（拾得或趁人忘拔取卡均属冒用他人信用卡）及第269条转化型抢劫罪；第180条【内幕交易罪】：利用窃取、骗取、窃听、刺探、私下交易等手段非法获取内幕信息并在敏感期从事相关交易。","《刑法》第201条【逃税罪】（2009年《刑修七》将原“偷税罪”罪名改为“逃税罪”）与第204条【骗取出口退税罪】：纳税人缴纳税款后采取假报出口或其他欺骗手段骗取所缴纳的税款的，依照逃税罪定罪处罚；骗取税款超过所缴纳的税款部分，依照骗取出口退税罪定罪处罚。\n第202条【抗税罪】：纳税人以暴力、威胁方法拒不缴纳税款（如拒绝缴税并指使职工砸坏征税工作车辆；若在抗税中故意致税务人员重伤死亡的转化为故意伤害罪或故意杀人罪）。\n第205条【虚开增值税专用发票罪】：客观方面包括为他人虚开、为自己虚开、让他人为自己虚开、介绍他人虚开四种方式。","《刑法》第217条【侵犯著作权罪】：未经权利人许可，以营利为目的（《刑修十一》扩充了重大违法所得或严重情节情形）复制发行、通过信息网络向公众传播文字、视听作品、计算机软件（如破解软件防复制程序后复制销售）、录音录像及制作出售假冒他人署名的美术作品。\n第219条【侵犯商业秘密罪】：以盗窃、贿赂、欺诈、胁迫、电子侵入等不正当手段获取，或者违反保密义务披露、使用商业秘密，或明知不正当获取而收买使用。\n第224条之一【组织、领导传销活动罪】：以推销商品服务为名，要求缴纳费用或购商品获加入资格，按一定顺序组成层级，直接或间接以发展人员数量计酬返利，骗取财物（仅处罚组织、领导者，一般普通参与者不构本罪）。\n第225条【非法经营罪】：未经许可经营专营专卖物品（如未经许可倒卖烟草、无证售食盐——注意若伪造许可证件同时售假充真劣质食盐或冒牌不合格香烟，涉牵连犯或想象竞合）、非法从事证券业务、租用国际专线转接设备私营国际电信、POS机虚构交易套现、明知涉毒仍向饲料中添加“瘦肉精”、无证经营药品、营利性有偿删帖、非法制售赌博机供开设赌场及出售无线电干扰器。\n第226条【强迫交易罪】：以暴力、威胁手段强买强卖商品、强迫提供或接受服务、强迫参与或者退出投标拍卖、强迫转让收购公司股份债券（如以延迟审批威胁商户高价购买装修材料；而强迫他人从事劳动构成第244条强迫劳动罪）。","《民法典》第2条【调整对象】：民法调整平等主体的自然人、法人和非法人组织之间的人身关系和财产关系（含悬赏广告《民法典》第499条、发包人与设计单位合同、企业间技术转让、开车撞坏输电线侵权；不含恋爱、请客吃饭、相亲牵手、代人举行结婚仪式、问路指错、赌博、算命封建迷信等情谊或非法行为，不含大学颁发学位、公安交通/税务征管等行政管理关系，也不含劳动合同关系或企业与内设分支机构内部指导关系）。\n民事法律关系属于思想的社会关系，由主体、内容、客体三要素构成；既可因合法行为产生，也可因侵权、违约等非法行为或自然事实产生（事实行为如宅基地建房引起所有权取得；注意侵权行为是人的行为而非自然事实；部分民事法律关系需两个法律事实才能产生，如遗嘱继承关系需“有效遗嘱＋被继承人死亡＋继承人未丧失未放弃继承权”多法律事实；情谊行为如免费搭顺风车不具有受法律约束意思）。\n最高法《关于适用〈中华人民共和国民法典〉时间效力的若干规定》：民法典施行前的法律事实持续至民法典施行后的适用民法典（另有规定除外）；当时规定仅有原则性而民法典有具体规定的，适用当时规定但可依据民法典具体规定裁判说理。","民事权利分类：\n1. 按作用分：支配权（直接支配标的物排斥他人干涉，如物权、肖像权使用、知识产权）、请求权（请求他人为或不为一定行为，如债权、损害赔偿请求权；劳动报酬、人身损害赔偿及近亲属扶养请求权具强烈人身专属性不得转让，而租金支付请求权系普通金钱债权可自由转让）、抗辩权（对抗请求权，如同时履行抗辩、诉讼时效抗辩）和形成权（单方意思使法律关系发生变动，如追认权、撤销权、解除权）。\n2. 按义务人范围分：绝对权/绝对法律关系（义务人为不特定一切人，如物权、人身权/人格权、配偶权、邻接权）与相对权/相对法律关系（义务人为特定人，如债权、合同、无因管理、不当得利）。\n3. 权利私力救济：包括自卫行为（正当防卫、紧急避险）和自助行为（《民法典》第1177条）；民间调解与仲裁属第三方公/社会救济。","《民法典》第8条、第153条第2款【公序良俗】：违背公序良俗的民事法律行为无效（如以虚假怀孕胁迫对方承诺如半年不结婚即没收50万元“结婚保证金”严重侵害婚姻自由、违背善良风俗，应当无效）。\n《民法典》继承编基本原则：保护自然人私有财产继承权原则、继承权男女平等原则、养老育幼原则、互谅互让和睦团结原则、权利义务相一致原则（诚实信用原则为民法总则基本原则，非继承编专有基本原则）。","《民法典》第161-163条【代理】：代理人在代理权限内以被代理人名义实施民事法律行为，对被代理人发生效力。\n1. 不得代理的法律行为：依照法律规定、当事人约定或者民事法律行为性质应当由本人亲自实施的（如立遗嘱、协议离婚登记等婚姻登记、收养、演出讲课等），不得代理（而订立合同、申请商标注册、代办企业登记、参加行政诉讼均可代理）。\n2. 代理区分：代理人需作独立意思表示（不同于仅转达他人决定的“传达人”与促成交易的“居间人”，也不同于整理资料、看管小孩等纯事实事务）。\n3. 代理类型：《民法通则》曾分委托、法定、指定代理；现行《民法典》第163条简化为委托代理和法定代理两类（取消独立“指定代理”）。\n4. 委托代理终止（《民法典》第173条）：代理期间届满或事务完成、被代理人取消委托或代理人辞去委托、代理人丧失民事行为能力、代理人或者被代理人死亡（注意：依第174条被代理人死亡后有法定例外情形委托代理并不当然一律终止）、作为代理人或被代理人的法人终止。","《民法典》第164条【代理权滥用与恶意串通】：滥用代理权包括自己代理、双方代理、代理人与相对人恶意串通（如受托人隐瞒更高报价与给出好处费的买家签约，属代理人与相对人恶意串通损害被代理人合法权益，依法直接无效并承担连带责任）。（无权代理与越权代理属于无代理权，而非有代理权却滥用。）\n第171条【无权代理】：行为人没有代理权、超越代理权或代理权终止后实施的代理行为，未经被代理人追认对被代理人不发生效力（《民法通则》曾规定本人知道不否认视为同意；《民法典》第171条第2款已改为“被代理人未作表示的，视为拒绝追认”）；被代理人追认前，善意相对人有撤销权（通知方式即可作出）。\n第923、926条【委托合同与转委托、间接代理】：受托人未经同意或追认擅自转委托的，应当对转委托第三人行为承担责任（未转交货款则委托人有权要求受托人退还购机款）；受托人以自己名义与第三人订立合同因委托人原因对第三人不履行的，受托人向第三人披露委托人后，第三人可以选择请求受托人或者委托人承担责任（但不得变更选定的相对人）。","《民法典》第1012-1014条【姓名权与名称权】：自然人享有姓名权，法人、非法人组织享有名称权；任何组织或者个人不得以干涉、盗用、假冒等方式侵害他人的姓名权或者名称权（如未经同意擅自将父亲登记为公司股东构成盗用侵害姓名权；谎称某公司代理人以该公司名义对外签约构成假冒侵害名称权）。","《民法典》第188-201条【诉讼时效与除斥期间】：\n1. 期间长度：普通诉讼时效为三年（《民法通则》曾为二年，且曾设寄存物丢失/身体受伤害一年短期时效，《民法典》已全部废除一年短期时效统一改为三年）；国际货物买卖合同与技术进出口合同争议时效为四年；最长保护期间二十年（自权利受损害起算，不适用中止中断，但有特殊情况可向法院申请延长）。\n2. 适用范围：原则上适用于债权请求权；不适用诉讼时效（第196条）：①请求停止侵害、排除妨碍、消除危险；②不动产物权和登记的动产物权权利人请求返还财产；③请求支付抚养费、赡养费或者扶养费；④依法不适用诉讼时效的其他请求权（离婚请求权、分割家庭共有财产请求权、确认物权等）。除斥期间适用对象主要为形成权。\n3. 起算、中止与中断：自知道或应当知道权利受损及义务人之日起算（期间计算次日起算）；最后六个月内因不可抗力等客观障碍不能行使请求权发生中止（《民法通则》曾规定消除后继续计算，现《民法典》第194条改为自中止原因消除之日起满六个月届满）；中断由权利人提起诉讼/仲裁、提出请求或义务人同意履行引发；诉讼时效期间、计算方法、中止中断事由均属法定，当事人约定一律无效。\n4. 时效届满效力：债务人取得时效抗辩权（法院不得主动释明或主动适用）；届满后起诉或第三人单方承诺不发生中断；但债务人自己届满后书面/明确承诺还款或已部分履行，不得再反悔抗辩。","《民法典》第121、979-984条【无因管理】：没有法定或者约定义务，为避免他人利益受损失而管理他人事务的，构成无因管理（如主动修缮两家共用围墙、未受托抢救落水儿童、推放未锁自行车缴纳保管费、借房漏雨联系不到房主自垫维修、地铁乘客奋力拉开殴打乘客制止伤亡、为方便自己出行同时为邻居修补刮倒围墙——兼有为自己动机不影响成立）。管理人有权请求受益人偿还管理支出的必要费用及赔偿直接损失（如牛吃麦苗赔麦田损失＋饲料＋医药费），但无权索取报酬。\n第183条【见义勇为补偿】：因保护他人民事权益使自己受到损害的，由侵权人承担民事责任，受益人可以给予适当补偿；没有侵权人、侵权人逃逸或者无力承担民事责任，受害人请求补偿的，受益人应当给予适当补偿。\n《民法典》第122、985-988条【不当得利】：得利人没有法律根据取得不当利益，受损失的人可以请求返还；但①履行道德义务的给付（养子女给生父母赡养/生活费）、②债务到期前的清偿、③明知无给付义务的清偿（如还赌债、明知过时效还债）除外。善意得利人返还以现存利益或受损人损失为限（利益已不存在的不再返还）；恶意得利人应返还利益并赔偿损失；得利人将利益无偿转让给第三人的，受损人有权请求第三人在相应范围内返还。","《民法典》第13-25、56条【自然人权利能力、行为能力、住所与个体工商户】：\n1. 民事权利能力：自然人从出生时起到死亡时止，具有民事权利能力，依法享有民事权利，承担民事义务；涉及遗产继承、接受赠与等胎儿利益保护的，胎儿视为具有民事权利能力（娩出时为死体的自始不存在）；动物及死者均无民事权利能力。\n2. 民事行为能力（取决于年龄与智力/精神健康状况，与财产、性别无关）：不满8周岁或不能辨认自己行为的成年人为无民事行为能力人；8周岁以上未成年人或不能完全辨认自己行为的成年人为限制民事行为能力人（可独立实施纯获利益或与其年龄、智力、精神健康状况相适应的行为，超限行为需法定代理人同意或追认）；18周岁以上为完全民事行为能力人，16周岁以上未成年人以自己的劳动收入为主要生活来源的视为完全民事行为能力人（中奖、受赠等偶然收入不算）。\n3. 住所：以户籍登记或者其他有效身份登记记载的居所为住所；经常居所（离开住所地最后连续居住1年以上的地方，住院治病除外）与住所不一致的，经常居所视为住所。\n4. 个体工商户：属于自然人商事登记形态而非非法人组织；个人经营的以个人财产承担债务，家庭经营的以家庭财产承担，无法区分的以家庭财产承担。","《民法典》第26-35条、第1084条【监护制度】：\n1. 监护人确定：父母是未成年子女的法定监护人，父母离婚不消灭各自对未成年子女的监护职责（即便约定由一方直接抚养并转托亲属照看）。无或限制民事行为能力成年人的法定监护顺序为：①配偶；②父母、子女；③其他近亲属；④其他愿意担任监护人的个人或者组织（须经居委会、村委会或者民政部门同意）。上述人员均需具备监护能力。\n2. 意定监护：具有完全民事行为能力的成年人可以与其近亲属、其他愿意担任监护人的个人或者组织事先书面协商确定监护人，优先于法定监护适用。\n3. 临时照料：因突发事件等紧急情况监护人暂时无法履行职责致被监护人生活无人照料的，被监护人住所地的居委会、村委会或者民政部门应当安排必要的临时生活照料措施。\n4. 监护职责原则：监护人应当按照最有利于被监护人的原则履行监护职责；除为维护被监护人利益外，不得处分被监护人的财产（父母以夫妻共有财产购买并登记在未成年子女名下的房产，为家庭共同生活或债务抵押借款且相对人善意的，实务认定未侵害被监护人原有独立财产利益，抵押有效）。","《民法典》第40-46条【宣告失踪与宣告死亡】：\n1. 宣告失踪：自然人下落不明满2年的，利害关系人可以向人民法院申请宣告其为失踪人。利害关系人不严格限制顺位，包括配偶、父母、子女、兄弟姐妹、祖父母、外祖父母、孙子女、外孙子女以及债权人、债务人等有民事权利义务关系的人。\n2. 财产代管人职责（第43条）：失踪人所欠税款、债务和应付的其他费用（含赡养费、扶养费、抚育费及代管财产所需管理费等必要费用），由财产代管人从失踪人的财产中支付。\n3. 宣告死亡法定期间（第46条）：①普通下落不明满4年；②因意外事件下落不明的，自意外事件发生之日起满2年；③因意外事件下落不明且经有关机关证明该自然人不可能生存的，申请宣告死亡不受2年时间限制（若无不可能生存证明，仍需满2年）。","《民法典》第57-108条【法人分类、设立、代表、清算与非法人组织】：\n1. 法人分类：学理上分为社团法人（以人的集合为成立基础，含营利社团与公益社团，设立系多方/共同行为）与财团法人（以捐助财产为成立基础）。《民法典》三分法：①营利法人（有限责任公司等，含一人公司）；②非营利法人（事业单位法人如高等院校、社会团体法人、捐助法人——为公益目的设立，须设理事会等决策机构，法定代表人按章程由理事长等负责人担任，终止时剩余财产不得返还捐助人）；③特别法人（机关法人、农村集体经济组织法人、城镇农村合作经济组织法人、基层群众性自治组织法人）。\n2. 法人设立原则：特许主义（依据特别立法或国家元首许可设立）、准则主义、许可设立主义、自由设立主义、强制设立主义。\n3. 法人能力与独立责任：法人民事权利能力与民事行为能力起止时间相同（成立至完成清算注销终止，宣告破产申请本身不致能力终止）、范围一致，但不同法人因宗旨业务不同能力范围不同。法人以其全部财产独立承担民事责任（母子公司彼此独立担责）。\n4. 设立中责任（第75条）：设立人为设立法人以自己名义从事民事活动产生的民事责任，法人成立后第三人有权选择请求法人或者设立人承担。\n5. 代表权限制与越权（第61条、第505条）：章程或权力机构对法定代表人代表权的限制不得对抗善意相对人；超越经营范围订立合同不当然无效（不违反限制特许等强制规范即有效）；但伪造公章等非职务授权亦无表见代表情形或行为人以自己名义处分法人财产的，不由公司承担合同后果。\n6. 解散与清算（第69、72条）：章程期满、权力机构决议、合并分立、吊销营业执照或登记证书/责令关闭撤销可致解散（变更名称不是解散原因）；清算期间法人主体资格存续但不得从事与清算无关的活动。\n7. 非法人组织（第102条）：包括个人独资企业、合伙企业、不具有法人资格的专业服务机构等（区别于法人及自然人个体工商户）。","《合伙企业法》第3、31、44、53、57、85条【合伙企业与合伙责任】：\n1. 普通合伙债务对外连带责任：全体普通合伙人对合伙企业债务对外承担无限连带责任；合伙人之间关于亏损分担比例、退伙时已分担部分债务或新入伙人不担责等内部约定，均不得对抗善意债权人。退伙人对基于退伙前原因发生的债务仍负无限连带责任；新入伙人对入伙前普通合伙债务承担无限连带责任。\n2. 合伙事务致害分担：个人合伙中合伙人因执行合伙共同劳动/业务受伤（即便本人存在违章过失），对外或合伙体内仍由全体合伙人共同承担（先从合伙共有财产中支付，不足部分按协议或出资比例并兼顾过错内部分担）。\n3. 须全体合伙人一致同意的重大事项：除合伙协议另有约定外，改变企业名称、经营范围/主要场所、处分合伙企业不动产、转让/处分知识产权及其他财产权利、以合伙企业名义为他人提供担保、聘任合伙人以外的人担任经营管理人员，均须全体合伙人一致同意（日常货物买卖则可由事务执行人单独实施）。\n4. 特殊普通合伙企业（第57条）：一个或数个合伙人在执业活动中因故意或者重大过失造成合伙企业债务的，由其承担无限责任或者无限连带责任，其他无过失合伙人以其在合伙企业中的财产份额为限承担有限责任。\n5. 有限合伙人：不执行合伙事务、不得对外代表合伙企业、不得以劳务出资（可用货币、实物、知识产权等出资）、以其认缴出资额为限承担有限责任。国有独资公司、国有企业、上市公司以及公益性的事业单位、社会团体不得成为普通合伙人，个人独资企业可以成为普通合伙人。","《民法典》第133-135条【民事法律行为界定与分类】：\n1. 民事法律行为vs其他事实：民事法律行为以意思表示为核心要素（如买卖、转让财产、单方抛弃所有权——注意8周岁以上限制行为能力人抛弃自己旧书包属与年龄智力相适应的单方行为）；侵权（违章撞人）及创作作品属于不依意思表示而依法产生后果的“事实行为”；参加婚礼、宴请同学等不产生法律约束力的社交安排属于“情谊行为”（注意夫妻一方为共同抚养子女向照料人许诺按月给付补贴并非纯情谊行为，构成具拘束力的意思表示）；参加人大代表选举属于公法行为；法院宣告死亡严格学理上属公法裁判引起的民事法律事实。\n2. 分类：①单方行为（授权行为、行使撤销权、行使法定抵销权、父母对限制行为能力子女行为的追认、遗嘱等）vs 双方/多方行为（买卖、合伙协议）；②有偿行为（承揽、租赁、运输合同）vs 无偿行为（赠与）；③要式行为（必须具备特定法定形式方能成立，如危急情况下的口头遗嘱须2名以上见证人在场）vs 不要式行为；④主行为 vs 从行为（抵押合同、保证合同依附于主债权合同存在）。","《民法典》第137-142条、第1064条【意思表示生效与共同债务】：\n1. 意思表示生效时间（第137-139条）：①以对话方式作出的意思表示，相对人知道其内容时生效；②以非对话方式作出的意思表示，到达相对人时生效；③无相对人的意思表示，表示完成时生效（法律另有规定的除外）；④以公告方式作出的意思表示，公告发布时生效。\n2. 意思表示与家庭共同生活债务（第1064条）：夫妻一方以个人名义向照料共同未成年子女的亲属承诺给付合理补贴，属于有法律约束力的意思表示，且系为家庭共同生活需要所负债务，离婚后仍应由夫妻双方共同承担给付义务。","《民法典》第146-152条【意思表示瑕疵（虚假、重大误解、欺诈、胁迫与除斥期间）】：\n1. 虚假意思表示（第146条）：行为人与相对人以虚假的意思表示实施的民事法律行为无效（如为少缴税签订过户用的虚假低成交价阴阳合同无效）；以虚假意思表示隐藏的民事法律行为效力依照有关法律规定处理。\n2. 重大误解（第147条）：包括对行为性质、对方当事人、标的物种类质量规格和数量等产生错误认识致后果与真意相悖且造成较大损失；纯粹对民事行为动机的误解不构成重大误解。可撤销行为在依法被撤销前为有效行为，撤销后自始无效。\n3. 第三人欺诈与第三人胁迫（第149-150条）：①第三人实施欺诈行为，使一方在违背真实意思的情况下实施民事法律行为，对方知道或者应当知道该欺诈行为的，受欺诈方才享有撤销权（对方不知情则合同有效）；②第三人实施胁迫行为，即使对方不知情，受胁迫方仍享有撤销权！\n4. 撤销权除斥期间（第152条）：重大误解的当事人自知道或者应当知道撤销事由之日起90日内未行使撤销权的，撤销权消灭；自民事法律行为发生之日起5年内未行使撤销权的，撤销权消灭。双方互有错误认识时，早知情一方逾90日丧失撤销权，刚知情一方90日内仍可行使。","《民法典》第143-157条、第597条【民事法律行为效力形态】：\n1. 成立与有效（第143条）：缔约时具有相应民事行为能力（缔约后突发精神病不影响已有效成立合同的效力）、意思表示真实（口头达成事故赔偿和解协议后略超支不构成重大误解或显失公平）、不违反法律行政法规强制性规定及公序良俗。房产买卖达成合意即成立有效，工作人员错装材料致登记错房号不影响原买卖合同本身效力。\n2. 效力待定：限制民事行为能力人超越年龄智力且非纯获利益实施的民事法律行为（如16周岁依靠父母生活者购美发消费卡、11周岁小学生大额游戏充值3万余元）效力待定，需法定代理人追认。提示：原《合同法》第51条曾将无权处分合同定为效力待定，现行《民法典》第597条已改定无权处分买卖合同原则上有效。\n3. 无效情形（第153条）：违反法律、行政法规强制性效力规定（如无资质借用资质或发包与无相应资质承包人签订建设工程施工合同）无效（而占道摆摊属行政违规不影响买卖合同效力，法定代表人越权原则有效仅相对人恶意时不生效力）；违背公序良俗（原《合同法》第52条尚单列“以合法形式掩盖非法目的”和“损害社会公共利益”，《民法典》分别由第146条虚假意思表示及第153条第2款公序良俗取代）。","《民法典》第158-160条【附条件与附期限民事法律行为】：\n1. 条件与期限区分：条件必须是将来不确定发生且由当事人意定选择的事实（如乙结婚、获游泳冠军、取得职业资格证书；法定过户要件、保险法定赔付事由非意定条件）；期限则是将来必然到来的时间（如1年内）。同一行为可同时附条件和附期限（已成立但未生效）。\n2. 条件分类：①延缓条件（生效条件）：条件成就时生效（如儿子去外地工作、结婚、取证时生效），不成就则不生效；②解除条件：条件成就时失效，所附解除条件不成就时民事法律行为继续有效。③积极条件（以约定事实“发生”为内容，如儿子去外地工作）vs 消极条件（以事实“不发生”为内容）。","《民法典》第114-116、205-208、320-321条【物权客体、分类、主从物、孳息与基本原则】：\n1. 物权基本原则：我国物权法坚持物权法定原则、一物一权原则、物权公示公信原则（不采德国法上的物权行为独立性和无因性原则）。\n2. 物权关系与分类：所有权关系属于绝对法律关系（权利主体特定、义务主体不特定），客体仅限于物（不包括行为）。民法上的物须具有可支配性、独立性、经济价值且不违法（如金银、货币、管制枪支；自然大气层流动的空气非人类可支配，不属民法上的物）。物权按客体种类分为动产物权与不动产物权；按支配范围分完全物权与定限物权；按独立性分主物权与从物权；按设立目的分用益物权与担保物权。\n3. 主物与从物：须物理上可分、独立存在且属于同一所有权人（电视机与遥控器构成主从物；房屋与房门、汽车与车轮属整体与不可分组件；李某表与孙某表带不同属一人）。无相反约定时从物随主物处分一并转移。\n4. 原物与孳息：原物是指依自然属性或法律规定产生新收益的物（母牛与产下的牛犊属原物与天然孳息；果树未采摘果实、水库未捕捞活鱼属整体成分，画作复制品非派生孳息）。无约定时天然孳息由所有权人取得，既有所有权人又有用益物权人（如土地承包经营权人）的由用益物权人取得（担保物权实现前不直接取得孳息所有权）。","《民法典》第209-232条【物权变动、交付方式、预告登记与善意取得】：\n1. 基于法律行为变动：①不动产登记生效（赠与房屋未过户不转移所有权，后卖给他人并过户的买受人继受取得所有权——双方私约保留所有权不生不动产物权效力；出售已出租且已过户房屋租期届满后新所有权人只能请求承租人返还房屋）；但建设用地使用权或土地承包经营权转让、船舶/航空器/机动车所有权转移等另有特别规定（土地承包经营权互换转让及特殊动产未经登记不得对抗善意第三人，无需登记即可发生物权变动；股权质权自登记时设立）。②动产交付生效：现实交付、简易交付（买卖前买受人已基于保管等合法占有动产）、指示交付（出让动产由第三人占有时让与返还请求权）、占有改定（出卖人继续占有）。\n2. 非基于法律行为物权变动（第229-231条）：政府征收或提前收回土地、法院形成判决、继承、合法建造等事实行为（如宅基地合法建房自建造完成时取得所有权，再出卖未经登记不发生物权变动；抛弃/赠与彩电属法律行为变动；政府征收、裁判、建造、遗嘱/继承均引起物权变动，继受取得系从原权利人处移转取得）。\n3. 预告登记（第221条）：债权消灭（买卖协议无效、被撤销或解除）或自能够进行不动产登记之日起90日内未申请登记的，预告登记失效，失去阻断处分效力（原主卖给第三人过户则第三人取得所有权）。\n4. 善意取得与二次处分：善意受让人取得动产所有权后成为有权处分人，其后再转卖交付他人时，后手系基于有权处分的正常交付继受取得，不再适用善意取得。","《民法典》第312-316、458-462条【占有分类、遗失物与误拿返还】：\n1. 占有分类：①自主占有（以自己所有的意思占有，如所有权人、小偷、不知情善意买受人及受赠人）vs 他主占有（如保管人、承租人）；②直接占有（直接管领，如承租人、误拿背包者、受赠手表者）vs 间接占有；③有权占有 vs 无权占有；④善意占有（不知且不应知无占有没有合法根据，如误拿同事电脑、不知情受赠拾得手表、误把他人交父保管的自行车当遗产继承——不构成恶意占有且无合同关系不担违约责任，原所有权人可请求返还原物）vs 恶意占有。\n2. 拾得物与误拿物品返还：拾得人拒不返还遗失物索要高额报酬的，失主享有物权请求权（返还原物）、不当得利请求权及侵权损害赔偿请求权（无权反指拾得人为无因管理请求权）。误拿邻座背包并非侵权行为，误拿人因负有法定返还原物义务而通知送还，不构成无因管理；途中被盗且无故意或重大过失的，免负赔偿责任。装修工人误将邻居过道瓷砖贴到雇主墙面形成附合的，邻人可请求受益人返还不当得利并请求用人单位承担侵权赔偿责任。","《民法典》第323-375条【用益物权、地役权与居住权】：\n1. 用益物权特征与种类：用益物权是对他人所有之物以占有、使用、收益为目的的他物权、定限物权，不具有担保物权特有的物上代位性。种类包括土地承包经营权、建设用地使用权、宅基地使用权、居住权、地役权（传统民法考纲亦将典权归入用益物权；地上权为学理对应概念）。\n2. 土地承包经营权与建设用地使用权：土地承包经营权自承包合同生效时设立（非登记或发证时）；因自然灾害严重毁损机动地调整意见在村集体经济组织与村民委员会冲突时应当先行协商。建设用地使用权可通过出让、划拨（原始设立）及转让等（继受）方式取得；因公共利益提前收回土地属于非基于法律行为的物权变动，应补偿地上房屋并退还相应出让金（不另赔预期利润）。\n3. 地役权（第372-385条）：当事人通过书面合同设定的提高自己不动产效益而利用他人不动产的权利（如取水权、眺望权，不以严格相邻为条件）。地役权具有从属性，供役地或需役地发包、承包经营权流转、继承或转让时，除另有约定外地役权一并移转，原需役地人死亡亦不消灭。\n4. 居住权（第366-371条）：为满足生活居住的需要（不可用于生产经营），以无偿设立为原则（另有约定除外）；居住权人只能是自然人，但设立人可不限于自然人；居住权自登记时设立（包括以遗嘱方式设立的亦须办理居住权登记方才设立）；居住权人死亡时居住权消灭。","《民法典》第240-269、311-319、630条【所有权取得、国家专属、拾得物与随葬/隐藏物】：\n1. 所有权原始取得与继受取得：原始取得（不依前手权利移转，如收获庄稼、生产、先占、拾得无人认领物、善意取得、添附；随葬手镯未赠予死者时所有权仍归生者甲；买受人甲购买贝类海鲜并交付后发现内含珍珠归买受人甲）vs 继受取得（买卖交付时转移所有权，继承、遗赠、受赠等）。\n2. 国家专有财产（第247-252条）：矿藏、水流、海域、城市的土地、法律规定属于国家的野生动植物和文物、无线电频谱资源专属于国家所有（注意农村土地一般属集体所有，并非所有土地、文物或野生动植物均专属国家）。\n3. 遗失物、善意取得与隐藏物（第311-317条）：①善意取得须“不知情（善意）+合理价格（有偿）+完成交付（登记）”，故无偿出借或赠与不可善意取得，但有偿买卖交付或动产质权交付均可善意取得。②拾得遗失物不适用一般善意取得，拾得人卖给“收购二手商品的商店”时，商店并非自经营者购得（而是从拾得人买来），不适用第312条有偿返还但书，失主有权在2年内请求该商店无偿返还原物！③悬赏寻物广告下，未经拾得人同意擅自转交遗失物的借用人非拾得人，考纲及真题认定仅原拾得人有权请求支付报酬。④相框内遗留有他人婚前署名收藏的纪念钞属婚前个人所有之隐藏物，不得适用善意取得。","《民法典》第297-310条【按份共有、共同共有与优先购买权】：\n1. 共有类型：按份共有（如合资购买动产、合伙财产份额外之一般按份共有）vs 共同共有（夫妻婚姻存续期间无特别约定的稿酬等共同财产、继承开始后遗产分割前各继承人对未分割遗产的共有；同楼电梯属建筑物区分专有共有、各出资买洗衣机一般为按份共有）。\n2. 共有物处分与重大修缮（第301条）：处分共有的不动产或动产，以及作重大修缮、变更性质或用途（如深加工共有巨型矿石），应当经占份额三分之二以上的按份共有人或者全体共同共有人同意，另有约定除外（55%+30%=85%达2/3以上可转让；55%+10%=65%不足2/3无权出卖；1/3+1/3=2/3恰好达2/3以上可深加工）。\n3. 优先购买权（第306、726条）：按份共有人、合伙人、房屋承租人（注意《民法典》新增出租给近亲属或按份共有人行使优购权时承租人例外不享有）依法享有同等条件下优先购买权；抵押权人仅享有优先受偿权而无优先购买权；建筑物区分专有部分业主各自独立享有专有权，出售时其他楼层业主不享有优先购买权。数个按份共有人均主张优先购买权且协商不成时，按转让时各自共有份额比例行使购买权。","《民法典》第271-296条【建筑物区分所有权与相邻关系】：\n1. 业主认定：依法登记取得专有部分所有权、因法院生效判决或继承建造等取得专有部分所有权、基于与建设单位间商品房买卖合同已合法占有专有部分的人均认定为业主（纯租户承租人不属业主）。\n2. 共有部分及公共收益：电梯间广告屏收入扣除合理成本后属于全体业主共有；擅自改动楼道公共烟道侵害他方业主共有权，可请求恢复原状、排除妨碍；加装电梯依法表决生效后不因个别反对而无效，但妨碍低层采光的应当给予相应补偿（即便行政审批通过仍须补偿民事采光损失）。\n3. 业主共同决定表决门槛（第278条）：须先由专有部分面积占比2/3以上且人数占比2/3以上业主参与表决；其中筹集维修资金、改建重建、改变共有部分用途/利用共有部分经营须经参与表决双3/4以上同意（而选聘解聘物业、制定管理规约、选举业委会、使用维修资金仅须参与表决双过半数同意）。\n4. 相邻关系（第288-296条）：根枝越界、超标歌厅噪音及恶臭垃圾堆放、上游截留自然流水（适用排除妨害、恢复原状、消除危险、停止侵害，无须适用人身人格赔礼道歉；拴狗于自家院内路人受惊未越界一般不构侵害相邻权）。租客加高出租别墅遮挡邻宅采光的，相邻权人可请求承租人甲或房东乙排除妨碍。","《民法典》第386-393、524条【担保物权种类、特性、人保物保并存与第三方代偿】：\n1. 担保物权种类与属性：法定担保物权包括抵押权、质权和留置权（典权系用益物权，所有权非担保物权）。担保物权具有从属性（随主债权移转消灭）、不可分性（全部债权受清偿前可就担保物全部行使权利）、物上代位性及变价优先受偿性。\n2. 客体对比：抵押权客体既可以是动产也可以是不动产，还可以是建设用地使用权、土地经营权、海域使用权等权利；质权客体为动产或可转让财产权利（不能是智力成果本身、人身利益或不动产）；留置权与所有权客体对比中，留置权客体必须是动产，所有权客体可为动产或不动产但不可为权利。\n3. 混合担保实现顺序（第392条）：既有物保又有人保的，有约定按约定；无约定或约定不明时，债务人自己提供物的担保的，债权人应当先就该物的担保实现债权（再不足找第三人担保或保证）；第三人提供物保与保证并存的，债权人可任意选择（不要求债务人与第三人按份分担）。\n4. 第三人代为履行（第524条及合同编通则解释第30条）：对履行债务具有合法利益的第三人有权代为清偿——包括担保财产受让人、保证人、近亲属（配偶、父母等）；已租期满无权拒不搬离的承租人不具合法利益，无权代甲清偿。","《民法典》第394-424条【抵押权设立、禁止财产、浮动抵押与清偿顺位】：\n1. 可抵与禁抵财产（第395、399条）：可抵押正在建造的船舶、职工班车、厂房（含分公司厂房）、土地经营权等；不得抵押土地所有权、宅基地等集体土地使用权（法律另有规定除外）、公益目的非营利法人学校/医院教育医疗设施、所有权有争议财产、依法被查封/扣押/监管的财产（且担保物须特定化，笼统以“全部个人资产”作抵违反客体特定原则致抵押权未设立，但书面担保条款合同本身有效）。\n2. 房地一体与新增建筑物（第397、417条）：以建筑物抵押的，占用范围内的建设用地使用权视为一并抵押（反之亦然）；但土地或房产抵押后新增独立建筑物（如院内新建独立车库）不属于抵押财产，实现抵押权时应一并处分但对新增车库价款无优先受偿权。\n3. 抵押权设立与登记（第402-406、414条）：①不动产抵押合同成立生效与抵押权登记设立分离（未登记合同有效、抵押权未设立）；②动产抵押（含现有及将有原材料半成品浮动抵押）自抵押合同生效时设立，未经登记不得对抗善意第三人（债务人不按期还款时浮动抵押财产确定；不得对抗正常经营活动中已支付合理价款并取得抵押财产的买受人，但登记后承租人不抗已登记抵押权）；③禁止流押，实现时协商不成请求法院拍卖变卖；④同一动产均已登记抵押的，按登记先后顺序清偿。\n4. 抵押期间转让（第406条新规）：原《物权法》曾规定未经抵押权人同意不得转让；现行《民法典》改为抵押期间抵押人可以转让抵押财产（另有约定除外；若约定禁止转让但未登记，转让给不知情善意买受人仍发生所有权移转，抵押权人只能追究抵押人违约责任）。","《民法典》第425-446条【动产质权与权利质权】：\n1. 质权设立与合同区分：质押合同系诺成合同自成立时生效；动产质权自出质人交付质押财产时设立（未交付如小提琴未交、随车工具箱未交则质权不设立，由第三方监管人实际控制钢材之日交付成立质权；约定逾期归债权人所有的流质条款无效，不影响质权本身有效设立）。权利质权（股权、著作权中财产权、现有及将有应收账款债权等）多自登记或交付权利凭证时设立。\n2. 动产质权 vs 留置权：修车未带够钱主动留手表担保，与修车费债权非“同一法律关系”（除非企业间留置），属主动交付设立的动产质权而非法定留置权。\n3. 责任转质与善意取得（第434条）：动产质权适用善意取得（如保管人擅自出质给不知情第三人）；但质权人未经出质人同意擅自转质给知情第三人（责任转质且后手非善意），转质人不成立新质权，仅原善意质权人享有质权。","《民法典》第447-462条【留置权、受偿顺序与占有保护】：\n1. 留置权性质与适用合同：留置权属于法定担保物权，债权人合法占有债务人动产且债权与该动产属于同一法律关系（企业间留置除外），如保管、运输、承揽、仓储、行纪合同均依法可留置（借款合同不直接占有债务人特定工作成果动产，不能成立留置权；强行抢拉他人存放在第三人仓库的货物抵债既非自助行为也不成立留置权）。\n2. 留置权善意取得与代偿（第447条、担保解释第62条）：借用人将车送修未付修车费的，不知情修理厂合法占有修理可善意行使留置权；真正所有权人可代付修车费消灭留置权，在留置权存续且被占用期间不能空手直接要求借用人或修理厂无偿返还车辆。\n3. 宽限履行期（第453条）：未约定或约定不明留置后履行期间的，留置权人应当给债务人不少于2个月（60日以上）履行债务期间（鲜活易腐物除外）。\n4. 竞存受偿顺序（第415、456条）：同一动产已设抵押权或质权又被留置的，留置权人最优先受偿；抵押权与质权并存的，按登记与交付的时间先后确定清偿顺序。\n5. 占有返还期间（第462条）：占有人请求侵夺者返还占有物的请求权，自侵夺发生之日起1年内未行使的，该请求权消灭（除斥期间）。","《民法典》第469-491条【合同订立、要约、要约邀请、承诺与沉默】：\n1. 要约 vs 要约邀请：要约内容具体确定且表明经受要约人承诺即受约束（如投标、附明确货品价目和付款寄书期限的购书广告、“20万元可以马上拿走”、“25万元才能卖”、电商网店公布具体商品价格并可供提交订单下单、长期交易老客户急需10吨货按惯例次日发货即成承诺使合同成立）；发布拍卖公告、寄送一般价目表、刊登招股说明书、缺乏具体要素的商业广告及反问“你出多少钱”均属要约邀请。\n2. 承诺要件（第479-488条）：承诺须由受要约人向要约人作出（他人向丙发要约而乙表接受仅为新要约）；内容须与要约一致（单价由5万改为6万属对价款实质性变更，构成新要约，原要约失效，直接发货被拒不成立合同）；须在承诺期限内到达要约人（逾期发出的确认函原则上为新要约，到达主义下书面承诺通知到达要约人时生效）。\n3. 沉默不作为承诺（第140条）：除法律规定、双方事先约定或交易习惯外，沉默不视为承诺（如“不接受请回复N”未理睬、未经同意先寄面膜称“10天不退寄回视为购买”后顾客抛弃，合同均未成立）。","《民法典》第496-507条【格式条款订入、效力、解释与免责条款】：\n1. 提示说明义务（第496条）：提供格式条款一方未履行合理提示或者说明义务，致使对方没有注意或者理解与其有重大利害关系的免责/限责条款的，对方可以主张该条款不成为合同的内容（注意并非直接无效、可撤销或效力待定）。\n2. 格式条款无效（第497、506条）：①免除己方造成对方人身伤害的责任（如医院危重手术免伤亡条款、幼儿园入园表非教师原因磕碰概不负责格式免责条款）；②因故意或者重大过失造成对方财产损失免责；③提供方不合理地免除或减轻己方责任、加重对方责任、限制或排除对方主要权利。合同部分条款无效不影响其余合法部分效力（部分有效、部分无效）。\n3. 格式条款解释（第498条）：先按照通常理解予以解释（如团购代金券标明“周末不得使用”，通常理解指周六、周日而非周五中午）；对格式条款有两种以上解释的，应当作出不利于提供格式条款一方的解释（如旅行社提供的旅游合同“名胜古迹”理解分歧作出对旅行社不利解释）。","《民法典》第509-533条、第560条【合同履行原则、漏洞补充、双务抗辩权、选择之债、代偿与情事变更】：\n1. 履行与漏洞补充（第510-511条）：连续按“交流电机”交易习惯仅简写“电机”却交直流电机违背诚实信用原则；价款、履行地点（给付货币在接受货币一方所在地）、履行期限（不明确时债务人可随时履行、债权人也可随时请求履行，但应给对方必要准备时间，他人与他方之惯例不约束本案；制作100套家具无交货地约定时在履行义务一方即制作方所在地交付）、履行方式（有利于实现合同目的）按规定补充；约定“两种标的择一交付”的选择之债未约选择权归属时，选择权归债务人，在约定期限内择一履行即消灭债务。\n2. 双务合同履行抗辩权（第525-527条）：包括同时履行抗辩权（未约先后履行顺序）、先履行抗辩权（先履行方未履行或履行不合格，如只付部分货款或交付设备不合格）、不安抗辩权（先履行方有确切证据证明对方转移资产逃避债务或经营恶化时中止履行）；注意一般保证人的“先诉抗辩权”属担保抗辩而非双务合同抗辩权。\n3. 涉第三人合同与连带债务追偿（第518-524条）：向第三人履行（送电脑给母校，途损由买受人向卖方主张违约责任，非相对方快递或受领学校）及第三人代为履行（好友碍于情面代买单属第三人代为清偿，具有合法利益第三人有权代为履行；合同编解释明确近亲属、担保物受让人可代偿）。部分连带债务人履行、抵销全部债务后，有权就超出自己份额部分向其他连带债务人追偿（每家分担1/4共400万时抵销或全清偿400万后向其余3家共追偿300万）。\n4. 清偿抵充顺序（第560条）：同一债务人对同一债权人负有数项同种类到期的债务且给付不足以清偿全部的，无指定约定且履行期同届满时，优先抵充缺乏担保或者担保最少的债务。\n5. 情事变更与区分原则（第215、533条）：合同成立后基础条件发生不可预见的非商业风险重大变化致明显不公的，体现自愿、平等与公平原则（不属公序良俗范畴）。一房二卖中前后两份买卖合同均合法有效（区分合同效力与物权登记变动）。","《民法典》第535-556条【债权人保全（代位权/撤销权）与债权债务移转】：\n1. 债权人代位权（第535-537条）：债务人对次债务人享有合法、已到期且非专属性的债权，未以诉讼或仲裁方式主张（仅发函催要仍属“怠于行使”）危害债权实现的，债权人可以自己名义代位起诉，以债权人自身到期债权数额为限；诉讼胜诉由次债务人直接向债权人清偿；且债权人提起代位权诉讼导致债务人对次债务人债权的诉讼时效中断。\n2. 债权人撤销权（第538-539条）：债务人无偿处分或以明显不合理低价转让财产危害债权且相对人明知的，债权人可请求撤销；其中“明显不合理低价”原则上指转让价格达不到交易时交易地指导价或市场交易价的70%（如市价5万元以4万元即80%出售，未达明显不合理低价，无权撤销）。\n3. 债权转让与债务转移（第545-555条）：①金钱债权约定不得转让不能对抗第三人，债权转让合同生效时即移转债权，债权人只需“通知”债务人即可对其生效、无须征得债务人同意（通知到达后债务人再向原债权人清偿无效）；债务人接到转让通知时对让与人享有债权或基于同一合同产生违约金抵销权的（即使在通知后才发现同合同标的瑕疵违约金），均可在受让人追偿时主张法定抵销。②债务转移须取得债权人同意方生效；③合同权利义务概括转让后原一方退出，受让人应对原合同相对人行使抗辩或解约。","《民法典》第557-576条【合同解除、抵销、提存、混同与以物抵债】：\n1. 混同与以物抵债：债权人与债务人因企业合并兼并合为一人致债的关系消灭为混同；债务到期后达成的以物抵债协议系诺成合同自合意成立即有效（但履行完毕前原债务不消灭，债务人积极准备履行过户时债权人不得因房价下跌反悔要求改还现金）。\n2. 法定抵销（第568条）：当事人互负到期债务（均届清偿期）、标的物种类品质相同的，任何一方通知对方即可抵销（不要求数额相等或协商一致）。\n3. 合同解除与预付式消费解约（第562-566条）：①约定解除条件成就（迟延15日可解约而对方迟延20日）或根本违约（出租屋有毒气体严重超标、培训机构迁远致难享服务、网购不符质量、协商取消未发货物属协议解除而不属合同变更）可解除；②单方解除通知到达相对人时生效，违约方无权自行发函强行解除，起诉解除后撤诉不生解除效力；③因经营者原因解除预付式消费合同，消费者有权解除并按优惠折后单价扣减已消费金额，且有权请求返还剩余预付款本金及利息（商场非合同相对方不担责）。\n4. 提存（第570-574条）：债权人无正当理由拒绝受领时债务人可提存；提存后标的物毁损灭失风险及孳息均归债权人；债权人自提存之日起5年内不领取的，提存物扣除提存费用后归国家所有。","《民法典》第577-594条【违约责任、违约金增减与定金法则】：\n1. 违约判定与归责：维修厂疏忽错换昂贵轮胎违反原本换胎约定构成违约行为（非添附、无因管理或单方变更）。违约后可主张违约金、实际损失赔偿（如健身拉伤赔医药误工护理费并解除退还余款，但不赔人格性赔礼道歉）。\n2. 违约金增减（第585条）：①约定违约金“低于”造成损失的，可请求人民法院增加至实际损失额（约20万、实损40万时最高请求40万，不能20万+40万叠加）；②约定违约金未“过分高于”（未超实际损失30%，含预期可得利益损失，如3年预计获利288万、违约金80万）的不予酌减（注意“不得调整”条款不排斥法院依法酌减权，关键是实质未过分高于故不减）。\n3. 定金（第586-588条）：种类包括立约定金、成约定金、证约定金、解约定金、违约定金（无“守约定金”）。定金数额不得超过主合同标的额的20%，超过部分不发生定金效力、仅作预付款原额返还（如50万合同付15万定金，10万有效双倍返还20万+超额5万退还=25万）；同时约定违约金和定金的，违约时守约方只可选择适用其一（不得同时并罚）。","《民法典》第114、122、186、464、495、590条【债的特征、适用范围、预约合同与责任竞合】：\n1. 债权特征与适用范围：债权具有请求权、相对性（不可向非合同方快递或平台索赔违约责任，门卫代收丢件亦由卖方网店先对外向买方担责）、平等性、相容性与任意性，不具有物权那样的“永久性”。婚姻、收养、离婚抚养等身份协议优先适用身份编法律（廉政协议属行政协议），土地承包经营权协议等民事财产合同适用民法合同制度。\n2. 预约合同（第495条）：认购书、预订书、合作意向书（交付定金待报告后订合作开发合同）具有独立法律拘束力；一方拒绝订立本约的，构成违反预约合同的违约责任（而非缔约过失责任或本约违约），受损害方可请求解除预订书、双倍返还定金或赔偿违约损失（不赔精神损害）。\n3. 违约与侵权责任竞合（第186条）：交付病牛致买方牛群染病、出租违规易燃材料装修厂房引起火灾扩损、商家标“原装正品”实卖拼装车涉违约与欺诈撤销救济时，受损害方有权在违约责任与侵权责任（或撤销）之间“择一”主张（不得双重受偿），宣告死亡后他人代偿债务生还后仍应向真债务人追偿。","《民法典》第595-666条【买卖合同、在途风险、附随义务、借款/民间借贷与赠与】：\n1. 买卖合同特征与漏洞补充（第595、511条）：买卖合同是典型的双务、有偿、诺成、不要式合同；未约定价格且不能补充协议或依习惯确定的，按订立合同时履行地的市场价格确定；卖方告知设备使用注意事项属于履行通知附随义务；涉在途运输标的物买卖，除另有约定外，毁损灭失风险自买卖合同成立时起由买受人承担（第606条）。\n2. 赠与合同（第657-666条）：①因赠与人故意或重大过失致赠与财产毁损灭失担责适用过错责任原则；②普通任意撤销与法定撤销外，若赠与人经济状况显著恶化严重影响生产经营或者家庭生活，可以不再履行赠与义务（穷困抗辩权）；公益扶贫或经公证的赠与不得任意撤销。","《民法典》第703-760条【房屋租赁、一房数租、转租、优先承租/购买权与融资租赁】：\n1. 租赁合同特征与一房数租顺位（第703条、城镇房屋租赁司法解释第6条）：普通租赁并非绝对要式（6个月以上不定期书面仅影响视作不定期）；一房数租履行顺位依次为：①已经合法占有（入住）租赁房屋；②已经办理登记备案手续；③合同成立在先（预付租金排最末）。\n2. 买卖不破租赁、转租与双优先权（第716、725-726、734条）：房屋所有权变动不破除有效租赁合同效力；经通知出卖房屋而承租人15日内未明确表态即丧失优先购买权，只能向新房东主张租赁合同继续有效；经同意转租原合同继续有效，次承租人并非并存债务承担，期满原承租人乙享有同等条件优先承租权。\n3. 融资租赁合同（第735-760条）：出租人须具法定资质、根据承租人选择向出卖人购买租赁物租予承租人使用，租金为融资代价；承租人将自有物卖给出租人再租回的“售后回租”属于有效有名融资租赁合同，约定租期届满归承租人有效，出租人所有权未经登记不得对抗善意第三人。","《民法典》第667-702条【金融/民间借款、银行卡盗刷与保证担保】：\n1. 借款合同与银行卡盗刷（第667-680条）：银行等金融机构借款合同是诺成、双务、有偿、要式、主合同（区别于自然人之间借款系实践合同）；合同因违约解除后，约定未超上限的逾期利息（如每日0.01%）继续适用。借记卡被伪卡盗刷时，持卡人未泄密且即时存钱/挂失报警无过错的，由发卡行承担全部赔偿责任。\n2. 保证人资格、期间、债务移转与抗辩（第683-702条）：①个体工商户可作保证人，机关法人、公益目的非营利法人/非法人组织及企业法人无主体资格的职能部门不得为保证人；②未约定保证期间的，统一为主债务履行期届满之日起6个月（《民法典》第692条，与原《担保法》无约定同）；③保证期间内未经保证人书面同意移转债务的，保证人不再承担保证责任；④连带责任保证人可主张主债务人的同时履行、不安抗辩及主债务时效届满抗辩，但不享有一般保证人专属的先诉抗辩权。","《民法典》第770-808条、第761-769条【承揽、建设工程与有追索权保理】：\n1. 承揽与建设工程（第770-808条）：照相馆冲印胶卷交取印单为承揽合同；承揽人未经定作人同意将主要工作交第三人完成的，定作人有权解除合同（转包合法质量合格亦可行使解除权）。建设工程招投标中，中标通知书到达日合同成立；非依法必须招标项目（如公司自建宿舍楼）自愿招标后协商签订书面协议变更工程价款合法有效；大型企业与中小企业约定“以收到第三方付款为付款前提（背靠背）”条款依2024最高法批复无效；分包人对总包人到期债权的保护中，可依法代位行使总包人的建设工程价款优先受偿权。\n2. 保理合同（第766条）：有追索权保理中保理人既可向债权人请求返还保理融资款本息或回购应收账款债权，也可向债务人主张全额应收账款债权，但受领款项扣除融资本息和费用后的剩余部分应当返还给债权人。","《民法典》第809-966条【客运运输、保管、委托与中介合同】：\n1. 客运无过错责任（第823条）：承运人对运输过程中旅客（含全票、优待票、半票及依规定免票旅客）伤亡承担无过错赔偿责任，不得以避让违规第三方行人等内部/第三人原因推卸对乘客赔付责任，赔后可向侵权人追偿。\n2. 保管合同（第888-903条）：①除另有约定外，保管合同自保管物交付时成立（实践合同），且可为有偿也可为无偿；②寄存贵重物品未向保管人声明而毁损灭失的，保管人按一般物品赔偿；③保管人违背死者生前嘱托擅自拍卖保管画作得款，继承人合法承受合同债权与拍卖价款所有权。\n3. 委托与中介（居间）合同（第919-966条）：①委托人、受托人均享有任意随时解除权（区分定作人随时解除承揽、赠与移转前任意撤销）；②受托人处理委托事务因不可归责于自己事由受损（如代购被海关罚款）可向委托人求偿（个人固有国际差旅机票及代买所得优惠权益归委托人而无权另向委托人分摊或索要，商品瑕疵找卖方不找无过错受托人）；③提供订立合同媒介服务属于中介合同（原居间合同），未促成合同成立的不得请求报酬但可请求委托人支付必要费用。","《民法典》第990-1017条、第1183条【人格权归属、物质性人格权、荣誉权与精神损害赔偿】：\n1. 自然人专有人格权 vs 法人人格权：自然人专属享有生命权、身体权、健康权、肖像权、隐私权、婚姻自主权等；法人和非法人组织仅享有名誉权、荣誉权与名称权（并无姓名权、肖像权、隐私权）。\n2. 身体权、人体临床试验与合法滞留（第1003、1008条）：超市强行搜身直接侵扰自然人身体支配自由与尊严，侵害身体权；而在众目睽睽下将饮料泼脏衣服仅侵害人格尊严与财产权；酒店/酒吧经理为防霸王餐拒付款离开而合理阻止并报警，系合法自助留置行为不构成侵权。开展新药临床试验应当经主管部门批准、伦理委员会审查同意并向受试者告知风险且取得其书面同意，禁止向受试者收取试验费用。\n3. 荣誉权与精神损害赔偿（第1031、996、1183条）：荣誉权自实际取得荣誉称号时产生（非出生时），擅自涂改剥夺优秀学生干部荣誉称号侵害荣誉权；侵害生命权等自然人人格权、亲属身份权（医院抱错婴儿）、损毁具有人身意义的特定物（丢失结婚照底片）及自然人姓名权均得请求精神损害赔偿（含侵权人获利、经济能力、后果及受诉地平均生活水平等确定数额考量因素）；法人名称权、一般合同债权与承包经营权原则上不赔精神损害（但《民法典》第996条新增严重违约侵害人格权例外）。","《民法典》第1018-1029条【肖像权、名誉权、商业秘密与法人名称权】：\n1. 肖像权侵害认定（第1018-1019条）：现行《民法典》不要求“以营利为目的”，未经肖像权人同意制作、使用、公开肖像即侵权（如擅用剧照做化妆品广告、摄影师私卖模特照片或擅自出版影集、借朋友圈照片制售表情包、图文错配张某糖尿病故事却配李某照片、近距离街拍次日公开发布上网、橱窗展示婚纱照，以及在朋友圈擅发他人未公开结婚照）。注意甲乙丙接力传播出售均分别构成肖像侵权。\n2. 名誉权与法人名称权/商业秘密（第1024-1030条）：捏造散布虚假事实贬损他人社会评价（发朋友圈侮辱欠钱骗子、网传婚外情虚假消息）侵害名誉权；买通员工窃取工艺及客户名单侵害商业秘密，并冒用公司名义接单交易侵害法人名称权。","《民法典》第1032-1039条【隐私权、个人信息权益保护及免责/按份责任】：\n1. 隐私权 vs 个人信息权益：私生活秘密与私人生活安宁属隐私权（报社未经同意披露影星过往私密不光彩经历、网上曝光他人未公开结婚照及家庭背景属隐私侵权；注意记者转发公安官微已公开违法吸毒抓捕并依法报道公共人物参赌舆论监督不构成侵权）；收集售卖姓名/身份证号/手机号/住址或店面安装高清摄像头偷抓进店顾客人脸信息均侵害个人信息权益（已自愿注册APP且发送带“退订回复TD”商业优惠短信不构成侵权）。\n2. 信息泄露数人侵权责任（第1172条）：酒店因自身技术系统漏洞过失致房客数据库被黑客王某恶意窃取并网上公开，属于各自行为无意思联络分别结合致害，依法由酒店与黑客按照各自过错及原因力大小承担按份赔偿责任。","《民法典》第1121-1131条【继承开始、遗产范围、继承权丧失、法定顺位、代位与转继承】：\n1. 继承开始、丧失与遗产范围（第1121-1125条）：继承自被继承人死亡时开始（非安葬、清点或分割日）；遗产包括个人合法财产（林木、文物、网络游戏道具等虚拟财产；旧《继承法》因著作人身权不可继承而一般仅认著作财产权），不含与人身或成员权绑定的宅基地使用权。故意杀害被继承人、伪造遗嘱情节严重、遗弃或虐待被继承人情节严重的，均丧失继承权。\n2. 接受/放弃继承与受遗赠规则（第1124条）：继承开始后继承人放弃继承应当在遗产处理前以书面形式作出，没有表示的视为接受继承；受遗赠人应当在知道受遗赠后60日内（旧法2个月）作出接受或者放弃的表示，到期未表示的视为放弃（既已明示放弃即不得撤回，超越期限始请求亦视为放弃）。\n3. 法定顺序、代位、转继承与酌分权（第1127-1131条）：①丧偶儿媳对公婆、丧偶女婿对岳父母尽了主要赡养义务的，作为第一顺序继承人（即使之后再婚仍不丧失资格，且不排斥其子女代位继承，但再婚新配偶无继承权）；②代位继承适用于被继承人的子女（或兄弟姐妹）先于被继承人死亡（包括独子先死导致遗嘱失效后转归法定代位继承）；转继承适用于继承人或已表态接受遗赠人在遗产分割前死亡，由其自身继承人接续继承（如母死次子晚死、或好友次日接收字画后分割前死）；③对被继承人扶养较多（如邻居长期照顾并操办后事）的继承人以外的人，可以适当分给遗产。","《民法典》第1133-1163条【遗嘱效力、撤回变更、遗赠扶养协议、遗产管理人与被继承人债务清偿】：\n1. 遗嘱形式、撤回与数份遗嘱效力顺位（第1134-1142条）：自书遗嘱由遗嘱人亲笔书写签名注明年月日即可，无需两名以上见证人在场见证（代书、打印、录音录像、口头均需2名以上无利害关系见证人）。立遗嘱后实施与遗嘱内容相反民事法律行为（如出卖过户遗嘱所涉房产），仅视为对该部分内容撤回，其余有效部分（如屋内紫檀家具归孙子遗赠）仍然有效！《民法典》第1142条废除了旧法“公证遗嘱效力最优先”规定，立有数份遗嘱内容相抵触的，一律以最后的遗嘱为准。\n2. 遗赠扶养协议与遗产管理人（第1145、1158条）：自然人与组织或继承人以外个人签订合法遗赠扶养协议无需征得子女同意，自成立即有效且优先于遗嘱与法定继承；遗嘱指定的执行人拒绝担任且继承人未推选时，由全体继承人共同担任遗产管理人（无继承人或均放弃始由民政部门或村委会担任）。\n3. 遗产债务清偿顺位（第1161、1163条）：既有法定继承又有遗嘱继承、遗赠的，先由法定继承人清偿被继承人依法应缴纳的税款和债务；仅当法定继承遗产实际价值不足时，超过部分才由遗嘱继承人和受遗赠人按比例清偿。","《著作权法》第2-18条【著作权产生、归属、原件转让、特殊/职务作品与邻接权】：\n1. 产生与归属：文字、视听作品（网络微电影、纪录片）著作权自作品创作完成时自动产生；委托创作（受托建4S店设计图、单位委托创作雕塑、AI翻唱仅保护词曲作者著作权）未约定著作权归属时，归受托人（作者）所有；一般职务作品（如研究员完成科研任务撰写论文）著作权归作者，单位在业务范围内享有2年优先使用权；而利用单位物质技术条件创作且由单位承担责任的产品设计图、工程设计图等特殊职务作品，作者仅享署名权，其余著作权由单位享有。\n2. 原件所有权转移与著作权分离（第20条）：美术作品（油画、国画）原件所有权转移不视为著作权转移，仅美术作品原件的“展览权”由原件所有人享有；私人书信原件所有权归收信/收藏人，书信著作权仍归写信作者。\n3. 邻接权类型与客体（第35-48条）：邻接权包括出版者权（版式设计权）、表演者权、录音录像制作者权（如瑜伽录像制品，区别于计算机软件/即兴演讲/建筑物等著作权作品客体）、广播电台电视台播放者权。","《著作权法》第10、11、49条【著作权内容、演绎链条付酬与联合侵权】：\n1. 人身权与财产权：修剪照片破坏构图美学侵害保护作品完整权（封底标明摄影已适当尊重署名权）；以有线或无线方式向公众提供作品使公众在选定时间地点获得（如擅自将唱片歌曲传上网供下载）构成侵害信息网络传播权。\n2. 演绎与制品付酬（第13、42条）：音像公司制作录像制品出售使用了原小说、改编剧本与演员表演的，依法应同时向原著作权人、演绎作品著作权人及表演者三方支付报酬；他人取得某剧本非专有表演权演出后，另一剧团仍须经原作者许可并付酬（不得仅找前被许可剧团）；制作视频广告擅用他人已发表文案侵害署名权、摄制权、信息网络传播权（不侵害已发表过的发表权），委托制作方、改稿转交方、直接拍摄方均担责（仅受邀出演演员不担责）。","《著作权法》第24条、第35条【合理使用 vs 法定许可】：\n1. 合理使用（第24条，无须许可且无须付酬）：①为个人学习、研究或者欣赏，使用他人已经发表的作品（如为写毕业论文复印杂志文章）；②报纸、期刊、广播电台、电视台等媒体刊登或者播放其他报纸、期刊、广播电台、电视台已经发表的关于政治、经济、宗教问题的“时事性文章”（但作者声明不许刊登、播放的除外）。\n2. 法定许可（第35条，无须许可但必须支付报酬）：作品在报刊上刊登后，除著作权人声明不得转载、摘编的外，其他报刊可以转载或者作为文摘、资料刊登（如杂志社未声明禁止时文摘杂志转载文学小说），但应当按照规定向著作权人支付报酬。","《专利法》第22-25条、第42条、第69条【专利客体、新颖性、权属、保护范围与侵权例外】：\n1. 专利客体与授权条件：疾病的诊断和治疗方法不能授予专利权（饮料配方、转基因大豆生产方法、疾病治疗仪器及其制造方法均可授权）；发明与实用新型须具绝对新颖性（《专利法》采绝对新颖性标准）、创造性与实用性（无“先进性”要件）。\n2. 权利归属、期限与保护范围（第8、42、64条）：①受托研发或业余时间受外单位委托合作研发完成发明创造且未约定申请权归属的，申请权归受托完成人（找人辅助整理资料不是共同发明人，技术咨询利用资料产生的新技术成果亦归受托方）；②发明专利权20年、实用新型10年、外观设计15年（2020修法前为10年）；③发明/实用新型保护范围以权利要求书内容为准，外观设计以表示在图片或者照片中的该产品外观设计为准。\n3. 专利侵权 vs 不视为侵权（第11、75条）：为科研实验使用、合法售出后权利用尽转售、临时过境运输工具按互惠原则为自身需要在其设备中使用均不侵权；在临时过境外国捕鲸船上用专利技术“加工产品”而非运输工具自身需要仍属侵权；不知情但为生产经营目的“制造”或“使用”未经许可制造售出专利产品，均构成侵害专利权（善意使用仅免赔偿责任仍构成侵权须停止）。","《商标法》第11、39、57条【知识产权客体、无期限权利、显著性与商标侵权】：\n1. 广义知识产权与保护期限：涵盖作品、发明/实用新型/外观设计、商标、地理标志、植物新品种、商业秘密与集成电路布图设计；商业秘密（保密配方，保密即永续保护）与地理标志（如阳澄湖大闸蟹）受法律保护没有时间限制（著作权、商标每次10年需续展等均设保护期）。\n2. 商标权主体、期限与显著性：商标权归商标注册人（自核准注册之日起10年）；缺乏显著性直接叙述商品质量用途特征（“锐利”剪刀、“耐穿”皮鞋、“精粉”馒头、“耐用”家具、“照明”/“护眼”台灯）不得注册，而具固有显著性任意标志（“蝴蝶”缝纫机、“轻风”/“金榜”台灯、“奔月”电脑、“仙山”药品、“暖阳”毛巾）可准予注册。\n3. 侵犯注册商标专用权（第57条）：包括伪造擅自制造或销售伪造注册商标标识、在类似商品上将近似标志作装潢使用误导公众，以及未经同意更换他人注册商标并将该商品再次投入市场（“反向假冒”，侵害商标注册人而非普通许可人之专用权，普通被许可人无独立诉权）。","《民法典》第1041-1054条【结婚条件、亲等、无效婚姻、可撤销婚姻与同居】：\n1. 结婚必备条件与禁婚亲等：男女双方完全自愿；禁止直系血亲及三代以内旁系血亲结婚（甲外祖父与乙父亲系亲兄弟、甲外祖母与丁祖母系亲姐妹，甲与乙、丙与丁均为四代旁系血亲，不在三代禁婚之列，婚姻均有效；甲与其祖父外孙女即表兄妹属三代以内旁系血亲，婚姻无效）。\n2. 无效、可撤销与有效婚姻（第1051-1054条）：①重婚（包括事后离婚仍不自动消除重婚违法性，现行司法解释下重婚无效）、未到法定婚龄（近亲属有权申请宣告婚姻无效，配偶或基层组织等法定之外不属或优先近亲属）、禁婚亲属属无效婚姻，仅人民法院有权宣告无效（民政婚姻登记机关无权宣告无效）；②因胁迫结婚及《民法典》新增一方隐瞒重大疾病不如实告知，属可撤销婚姻（因学历欺诈结婚不属可撤销或无效，婚姻依然有效）；③没有配偶同居起诉请求解除同居关系的，法院原则上不予受理（仅涉及财产分割、子女抚养纠纷受理）；④夫妻一方失踪长期未归，配偶既可依法申请宣告死亡后再婚，也可直接起诉请求离婚判决后再婚。","《民法典》第1062-1092条【夫妻共同/个人财产、债务、离婚、离婚协议与彩礼】：\n1. 财产归属与婚内分割（第1062-1066条）：婚后取得智力成果/知识产权实际取得收益、继承或受赠未指定归一方遗产、一方专有个人存款婚后炒股投资收益及婚后共同注册运营网络账号与直播收益均属夫妻共同财产；一方专用生活用品、婚前个人财产及因受人身损害获得医疗赔偿费归一方个人所有。婚内伪造共同债务、挥霍/隐藏/变卖共同财产不损债权人时，对方均可诉请婚内分割共同财产；转让夫妻共有合伙份额给离婚配偶须经其他合伙人一致同意。\n2. 夫妻债务与离婚协议、离婚赔偿及彩礼（第1064、1079、1091条）：①约定各自财产制时债权人“知道”该约定的以一方财产清偿；分居期间为夫妻共同经营便利店所借债务及婚后借款买房登记在对方名下均属夫妻共同债务，由双方连带清偿；离婚共同财产不足偿还共同债务时由双方协议清偿、不成由法院判决；②重婚或与他人同居、家暴或虐待遗弃、赌博吸毒恶习屡教不改调解无效准予离婚（分居需满二年而非一年）；不起诉离婚单独请求违反忠实义务精神赔偿不予受理，因家暴致残或与他人同居起诉离婚时可一并请求损害赔偿；③以协议/调解离婚为条件的财产债务处理协议在离婚未成时“没有生效”；离婚协议约定共有房产赠与子女并赋予直接请求权时，单方不得任意撤销，另一方及子女均可请求过户；彩礼（订婚首饰）未结婚有权请求返还，日常生日礼物与1314转账属赠与不返还。","《民法典》第1093-1118条、第1070-1075条【收养成立、解除、血亲计算与父母子女扶养】：\n1. 收养核心要件（第1093-1102条）：①收养人须年满30周岁，无子女或只有一名子女（无子女可收养2名、有一名可收养1名；旧《收养法》曾要求必须无子女），有抚养教育能力且无不利犯罪及医学禁止疾病；②有配偶者须夫妻共同收养（一方单独收养一般无效，但继父/继母经生父母同意可单方收养继子女）；③无配偶者收养异性子女年龄应相差40周岁以上（旧《收养法》仅限制无配偶男性，现《民法典》男女一体适用）；④收养三代以内旁系血亲子女可不受生父母特殊困难及部分年龄差等限制，且《民法典》将可被收养对象从不满14周岁放宽至所有未成年人。\n2. 收养效力、解除与成年子女抚养：收养成立即解除养子女与生父母权利义务（未成年养子女成年后找到生父母生活困难按月给钱系履行道德义务而非法定赡养义务）；养父母虐待遗弃未成年养子女时送养人有权要求解除收养关系（而非未成年养子女自行诉请）；未成年养子女解除收养后与生父母权利义务自行恢复。“不能独立生活的成年子女”包括尚在接受高中及其以下学历教育者或丧失/未完全丧失劳动能力无法独立生活者（不含已上大学本科成年子女）。","《民法典》第1164-1185条【侵权归责原则、民事权益范围、财产计算、惩罚性与精神损害赔偿】：\n1. 归责原则与保护范围：一般侵权采过错责任；产品缺陷、环境污染生态破坏、高度危险作业、民用航空器及饲养动物（烈性犬禁养动物）采无过错责任；建筑物构筑物脱落坠落、动物园动物致损、教育机构对无民事行为能力人及地下设施施工采过错推定责任。受侵权编保护民事权益涵盖股权、监护权、发现权、继承权、婚姻自主权、担保物权与商业秘密等一切合法权益。\n2. 损害赔偿规则（第1179-1185条）：①医疗误切左肾需赔后续治疗费、护理交通费、误工减少收入及精神损害赔偿；丢失具有人身意义特定物（祖父遗像）可同时请求财产赔偿与精神损害赔偿（原物已灭失不可返还原物或恢复原状）；②财产损失按市场价格或者其他合理方式计算，时间点以“损失发生时”为准；③《民法典》规定的惩罚性赔偿包括：故意侵害知识产权情节严重、明知产品缺陷仍然生产或销售致人死亡或健康严重损害、故意污染环境破坏生态造成严重后果（单纯合同违约无惩罚性赔偿）；④抱错婴儿致15年后发现可赔精神损害（一般欠薪/违约解聘/处分无精神赔）。","《民法典》第179-182条、第1173-1176条【侵权免责抗辩、自甘风险、好意同乘、紧急避险与合法言论】：\n1. 一般抗辩与合法行为：一般侵权抗辩包括不可抗力、受害人故意、意外事件（无预见可能的香蕉窒息死亡，各方均无责）、受害人同意；合法购买真丝裙收货不符给出真实差评拒绝删评不构成侵权；微信群主移出辱骂他人成员及指责群主者属群秩序自治管理，被辱骂者丙有权要求辱骂者乙赔礼道歉（其他人无请求权）。夺路人名贵包击打恶狗避咬属于紧急避险。\n2. 特殊免责与减责（第1176、1217条）：①正常打篮球反弹砸伤属体育文体自甘风险，由受害人自己承担；而在禁止游泳河道擅游登岸爬翻小船致伤属受害人自身过错与自甘冒险自己担责；②碰瓷致伤、饮酒聚餐无人劝酒自行过量致酒精中毒死均由受害人自行承担；③拖拉机搭车下雨钻空棺材惊吓他人致跳车摔伤因甲乙无合理预见且属丙自己受惊跳车（意外事件/自担），由丙自己承担；④非营运机动车好意同乘（搭顺风车）发生交通事故造成无偿搭乘人损害且驾驶人非故意或重大过失的，应当减轻驾驶人赔偿责任。","《民法典》第1168-1172条【数人侵权（共同侵权、共同危险、无意思联络）】:\n1. 共同侵权连带责任（第1168-1169条）：①甲驾车超速与乙逆行骑车相撞飞至人行道砸伤丙，属无过错方丙面对两人结合且过错交织致损，甲乙承担连带责任；②承租人甲要求装修公司拆除承重墙致邻居楼层开裂，明知危险共同实施毁损承重结构，甲与装修公司承担连带/共同赔偿责任（房东乙不知情未指使不担责）；③开车禁停区违法停放与乘客开门未观察“开门杀”致正常骑行人受伤，驾驶人甲与乘客乙构成共同过失致同一损害，共同承担赔偿责任。\n2. 共同危险连带责任（第1170条）：①甲乙分别山上伐木滚落木头砸伤行人且无法确定具体致害人；②三名未成年人翻越高速天桥抛石击打车辆致司机重伤且无法确认具体投掷人，分别由甲乙连带责任及三未成年人监护人承担连带赔偿责任。\n3. 无意思联络按份责任（第1172条）：上游、中游两工厂分别排放废水，单厂废水均不足以致死鱼群，汇集后致鱼塘死鱼，属于两个以上污染者分别实施污染各自根据污染物种类浓度排放量等承担按份赔偿责任。","《民法典》第1188-1192条【监护人责任、委托监护、用人单位责任、承揽与个人劳务】：\n1. 监护人与委托监护（第1188-1189条）：未成年人校外用弹弓射伤幼儿由未成年人监护人担全责；离异由母抚养儿童在园打伤同学（2006旧《民通意见》时代曾认母赔、母无力父赔及园方适当赔）；现行《民法典》下受托照看（2015旧《民通意见》时代曾答连带责任）改定为“监护人担责、受托人有过错担相应责任”；好意无偿帮接孩子途中孩子自己解安全带摔伤无过错者不担责、仍由其监护人担全责。\n2. 用人单位、劳务与承揽（第1191-1193条）：①货车司机送货致人伤、公交司机全责撞伤乘客、医生手术遗留纱布、酒店清洁工地面湿滑致顾客摔伤及清洁公司派员工高空跌落工具砸车，均由用人单位（雇主/公交公司/医院/酒店/乙清洁公司）对外承担全部侵权责任，工作人员或发包物业不直接对外赔或连带；②个人雇工粉刷外墙被第三人失控摩托撞跌重伤，2019旧法答连带，现行《民法典》第1192条第2款改定为可向第三人索侵权赔或向接受劳务方请求补偿（非连带）。","《民法典》第1198-1201条【安全保障义务与教育机构侵权责任】：\n1. 经营场所/群众活动安保义务（第1198条）：①高风险滑翔伞活动组织方突遇上升气流未及时救援负全部安全保障与应急救援责任；②3岁幼童被父亲留置无专人维持秩序且无警示的儿童乐园滑梯摔伤，乐园未尽安保义务赔损但父亲疏于看护可减轻乐园责任；③醉酒顾客在饭店打伤他人，由直接侵权人醉酒闹事者承担主要赔偿责任，未尽安保义务的饭店承担“相应的补充责任”。\n2. 教育机构侵权责任（第1199-1201条）：①无民事行为能力人在幼儿园学习生活期间（老师接电话未制止）同学间相互打闹受伤，适用过错推定由幼儿园承担责任（幼儿园老师个人职务行为及非直接管理监护人父母均不直接对外担责）；②小学10岁学生在校门口被来访人乙开车撞伤且学校未尽管理职责的，由直接侵权第三人乙承担赔偿责任，学校承担相应的补充责任。","《民法典》第1202-1207条、第1229-1244条【产品责任、高度危险与环境污染】：\n1. 产品责任与共享单车/气囊缺陷（第1202-1207条）：共享单车刹车失灵撞伤行人由运营方担产品/运营全责；汽车安全气囊正常行驶无故弹出致伤，消费者既可向销售商4S店请求赔偿也可向制造商请求赔偿。\n2. 高度危险作业与民用航空器（第1236-1244条）：一般高度危险作业及民用航空器致人损害均适用无过错责任，唯一法定完全免责事由是“受害人故意”造成损害（注意战争并非民用航空器法定免责事由，不可抗力与重大过失亦不免责）；高压触电甩竿钓鱼致死由供电局无过错担责。\n3. 环境污染（第1229-1232条）：农用飞机低空噪音惊吓致死2千余只鸡属于环境噪声污染侵权，适用无过错责任；两个以上污染者污染环境一般承担按份责任。","《民法典》第1208-1217条、第1245-1258条【机动车交通事故、动物致害、建筑物搁置物及地下设施施工】：\n1. 机动车交通事故（第1208-1213条）：借用车辆时驾驶人（借用人乙）酒后撞人由使用人乙全部赔偿（出借人甲无过错不担责）；违章闯红灯酒驾乙撞击正常行驶甲之车辆致甲撞伤交警，实质全因乙违章所致，由乙承担全部责任。\n2. 饲养动物损害（第1245-1251条）：①禁养烈性犬伤人适用绝对无过错责任，受害人骑车看手机不构成故意亦非可减免之重大过失，由饲养人全部赔偿；②动物园动物致损适用过错推定，动物园证明尽到管理职责的不担责；③第三人逗弄引起他人马受惊致路人伤（2009旧《民法通则》仅判第三人何某担责；现行《民法典》第1250条改采不真正连带，被侵权人可找马主人也可找第三人）。\n3. 建筑物脱落、抛掷物与施工（第1252-1258条）：①租客将剪刀放阳台被风吹落砸伤行人由实际控制使用人租客甲独担（房东乙不知未过错不担责）；公交站台顶棚积雪未清理塌落砸伤由管理人公交公司过错推定担责；②公共道路挖坑道虽曾设灯但被撞毁后未及时维护恢复警示致人坠伤，由地面施工人市政公司过错推定担责（赔后向逃逸司机追偿）。"]
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const KB=JSON.parse(document.getElementById('kb').textContent);
function fmtBook(q){if(q.kb==null)return esc(q.k||'');const t=KB[q.kb];let o='',p=0;(q.kh||[]).forEach(([a,b])=>{if(a<p)return;o+=esc(t.slice(p,a))+'<b>'+esc(t.slice(a,b))+'</b>';p=b;});return o+esc(t.slice(p));}
const SUBS=['全部','刑法','民法'];
const SUBNAME={'全部':'全部','刑法':'刑法','民法':'民法'};
const TN={'判':'判断','单':'单选','多':'多选'};
// index
const Q={};D.forEach((u,ui)=>{u.ui=ui;u.qs.forEach((q,qi)=>{q.u=ui;q.qi=qi;Q[q.id]=q;})});
// storage
const KEY='fsjc_v1';let canSave=true;let S;
try{S=JSON.parse(localStorage.getItem(KEY)||'null');localStorage.setItem(KEY+'_t','1');}catch(e){canSave=false;}
if(!S||!S.q)S={q:{},sub:'全部',drop:false};
if(!S.v2){const now=Date.now();for(const id in S.q){if(S.q[id].length<5)S.q[id][4]=now;}S.v2=1;}
function save(){if(!canSave)return;try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
// 进度只存在本机浏览器（localStorage），不做任何联网上传。
const today=()=>Math.floor((Date.now()+8*36e5)/864e5);  // 北京时间的日期序号，错题本按天计数用
// st: [status, streak, due, wrongCount]  status 1=一次做对 2=错题本 3=错题已掌握
const st=id=>{const s=S.q[id];return s&&s[0]?s:undefined};  // status 0 = 这一节被重置过，当作没做
function inScope(u){return S.sub==='全部'||u.sub===S.sub}
function qInScope(q){return inScope(D[q.u])}
function rint(n){try{const c=window.crypto;if(c&&c.getRandomValues){const b=new Uint32Array(1),lim=4294967296-4294967296%n;let x;do{c.getRandomValues(b);x=b[0];}while(x>=lim);return x%n;}}catch(e){}return Math.floor(Math.random()*n);}
function dueList(){const d=today();return wrongList().filter(id=>S.q[id][2]!==d);}  // 今天还没在错题本里做过的
function wrongList(){return Object.keys(S.q).filter(id=>Q[id]&&S.q[id][0]===2&&qInScope(Q[id])).sort((a,b)=>Q[a].u-Q[b].u||Q[a].qi-Q[b].qi);}
function nextNew(unitOnly){
  const us=unitOnly!=null?[D[unitOnly]]:D.filter(inScope);
  for(const u of us){const l=u.qs.filter(q=>!st(q.id)&&q.id!==(sess&&sess.cur));if(l.length)return l[rint(l.length)].id;}
  for(const u of us){for(const q of u.qs){if(!st(q.id))return q.id;}}
  return null;
}
let view={name:'home'};let sess=null;
const $=h=>{const d=document.createElement('div');d.innerHTML=h;return d.firstElementChild};
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function fmtExp(s,mk,skipOpt){mk=mk||{};const t=esc(s).replace(/┄+/g,'\n').replace(/\s+·/g,'\n·').replace(/\s*\[答题技巧\]/g,'\n【记忆】').replace(/\x01/g,'<b>').replace(/\x02/g,'</b>');
  let h0=t.split(/\n+/).map(x=>x.trim()).filter(Boolean).map(x=>{let m=x.match(/^([A-E])([✓✗])\s*([\s\S]*)$/);
    if(m&&skipOpt)return '';
    if(m)return `<div class="xo ${m[2]=='✓'?'ok':'no'}${mk[m[1]]?(mk[m[1]]=='漏选'?' hit miss':' hit'):''}"><span class="xk">${m[1]}</span><span class="xt">${m[3]}</span>${mk[m[1]]=='漏选'?`<span class="xg">漏选</span>`:''}</div>`;
    m=x.match(/^记法[:：]\s*([\s\S]*)$/);if(m)return `<div class="xm"><span class="xl">记法</span>${m[1]}</div>`;
    return `<div class="xp">${x}</div>`;});h0=[...h0.filter(x=>x.startsWith('<div class="xm"')),...h0.filter(x=>!x.startsWith('<div class="xm"'))].join('');const XM=/(<div class="xm"><span class="xl">记法<\/span>(?:(?!<\/div>)[\s\S])*)<\/div>(?=<div class="xm"><span class="xl">记法<\/span>)<div class="xm"><span class="xl">记法<\/span>/g;let pv;do{pv=h0;h0=h0.replace(XM,'$1<br>');}while(h0!==pv);return h0;}
function home(keepScroll){
  view={name:'home'};const app=document.getElementById('app');
  const us=D.filter(inScope);
  let tot=0,done=0,right=0,ans=0;
  us.forEach(u=>u.qs.forEach(q=>{tot++;const s=st(q.id);if(s){done++;ans++;if(s[0]!==2)right++;}}));
  const wr=wrongList().length;
  let h=`<div><header><h1>法硕基础课 · 真题刷题</h1></header>`;
  if(!canSave)h+=`<div class="warnbar">当前是预览窗口，做题记录存不下来。请下载这个文件，用手机或电脑的浏览器打开后再做题。</div>`;
  h+=`<div class="tabs">${SUBS.map(s=>`<div class="tab ${S.sub===s?'on':''}" data-sub="${s}">${SUBNAME[s]}</div>`).join('')}</div>`;
  h+=`<div class="card"><div class="stats"><div><b>${done}/${tot}</b><span>已做</span></div><div><b>${ans?Math.round(right/ans*100):0}%</b><span>正确率</span></div><div><b>${wr}</b><span>错题本</span></div></div>
  <button class="btn pri" id="go">${done?'继续刷题':'开始刷题'}</button>
  <button class="btn sec" id="wb" ${wr?'':'disabled'}>错题本（${wr} 题）</button></div>`;
  h+=`<div class="card"><div id="ul"></div></div>`;
  h+=`<div class="card"><div style="font-weight:600;margin-bottom:6px">规则</div><div class="hint" style="margin:0">做错的题进错题本。错题本里的题要连续做对两次才移出，中间做错一次就从 0 重新数。每刷一轮，每道错题只出一次，顺序和刷新题一样按重要性排。第一次就做对的题不再出现。<br>当前收录 1099 道客观真题（2005–2026年，共 36 个章节单元）。 所有题目均配逐项精析与现行法条/考点依据，涉及旧法修订的题均附「新法提示」。<br>进度只保存在这台设备、这个浏览器里，不联网、不上传、也不会和其他设备关联。换浏览器或清理浏览器数据，进度就没了。</div>
  <div class="foot" style="margin-top:10px"><button id="rst">清空全部进度</button></div></div></div>`;
  app.innerHTML=h;
  const ul=document.getElementById('ul');let rk=0;
  if(!us.length)ul.innerHTML='<div class="empty">没有题</div>';
  us.forEach(u=>{
    const qs=u.qs;if(!qs.length)return;
    let d=0,r=0;qs.forEach(q=>{const s=st(q.id);if(s){d++;if(s[0]!==2)r++;}});
    rk++;
    const el=$(`<div class="unit"><div class="rk">${rk}</div><div class="nm"><div>${S.sub==='全部'?`<span class="tag">${SUBNAME[u.sub]||u.sub}</span>`:''}${esc(u.name)}</div><div class="meta">${(+u.w).toFixed(1)}分/年 · ${d}/${qs.length}题${d?` · 正确率${Math.round(r/d*100)}%`:''}</div><div class="bar"><i style="width:${qs.length?d/qs.length*100:0}%"></i></div></div>${u.qs.some(q=>st(q.id))?'<button class="rs">重置</button>':''}</div>`);
    el.onclick=()=>startSess('unit',u.ui);ul.appendChild(el);
    const rb=el.querySelector('.rs');if(rb)rb.onclick=e=>{e.stopPropagation();resetUnit(u);};
  });
  app.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{S.sub=t.dataset.sub;save();home();});
  document.getElementById('go').onclick=()=>startSess('main');
  document.getElementById('wb').onclick=wrongBook;
  document.getElementById('rst').onclick=()=>{if(confirm('确定清空全部做题记录？只会清空这台设备上的记录，无法恢复。')){S.q={};save();home();}};
  if(keepScroll!==true)window.scrollTo(0,0);
}
function resetUnit(u){
  const ids=u.qs.map(q=>q.id).filter(id=>st(id));if(!ids.length)return;
  if(!confirm(`重置「${u.name}」？\n这一节已做的 ${ids.length} 题会全部变回没做过（也会移出错题本）。`))return;
  const now=Date.now();ids.forEach(id=>{S.q[id]=[0,0,0,0,now];});
  save();home(true);
}
function startWrong(){startSess('wrong');}
function startSess(mode,unit){view={name:'quiz'};sess={mode,unit,queue:mode==='wrong'?(a=>{for(let i=a.length-1;i>0;i--){const j=rint(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;})(dueList()):[],total:0,n:0,right:0,cur:null,answered:false,sel:[],hist:[],view:null};sess.total=sess.queue.length;nextQ();}
function nextQ(){
  let id=null,isRev=false;
  if(sess.mode==='wrong'){
    while(sess.queue.length){const c=sess.queue.shift();const s=st(c);if(s&&s[0]===2&&s[2]!==today()){id=c;isRev=true;break;}}
  }else id=nextNew(sess.mode==='unit'?sess.unit:null);
  if(!id){finish();return;}
  if(sess.ord)delete sess.ord[id];sess.cur=id;sess.isRev=isRev;sess.answered=false;sess.sel=[];sess.view=null;render();
}
function finish(){
  const app=document.getElementById('app');const left=wrongList().length,due=dueList().length;
  const msg=sess.mode==='wrong'?(!left?'错题本清空了！':due?`这一轮错题刷完了，今天还有 ${due} 题没做。`:`今天的错题都刷完了，明天再来。错题本里还有 ${left} 题。`):sess.mode==='unit'?'这一节的新题都做完了。':'这个范围里的新题都做完了。';
  app.innerHTML=`<div><div class="top"><button class="back" id="bk">‹ 返回</button></div><div class="card empty"><div style="font-size:18px;color:var(--ink);margin-bottom:6px">${msg}</div>本次做了 ${sess.n} 题，对 ${sess.right} 题。</div>${sess.mode==='wrong'&&due?'<button class="btn pri" id="again">继续刷</button>':''}<button class="btn sec" id="bk2">回首页</button></div>`;
  document.getElementById('bk').onclick=document.getElementById('bk2').onclick=home;
  const ag=document.getElementById('again');if(ag)ag.onclick=()=>startWrong();
  window.scrollTo(0,0);
}
// 选项乱序：每次出题随机排列，显示字母按位置重新编号；内部仍用原字母判分
const REFL=/(^|[^A-Za-z0-9])[A-E]([、，,和与及 ]|项|的|对|错|$)/;
function noShuf(q){return (q.e||'').split('\n').some(x=>!/^\s*[A-E][✓✗]/.test(x)&&REFL.test(x.replace(/[\x01\x02]/g,'')));}
function getOrd(q){if(!sess.ord)sess.ord={};let o=sess.ord[q.id];
  if(!o||o.length!==q.o.length){o=q.o.map((_,i)=>i);if(!noShuf(q))for(let i=o.length-1;i>0;i--){const j=rint(i+1);[o[i],o[j]]=[o[j],o[i]];}sess.ord[q.id]=o;}
  return o;}
function dispAns(q,x){const o=getOrd(q);return (x==null?q.a.split(''):[...x]).map(v=>String.fromCharCode(65+o.indexOf(v.charCodeAt(0)-65))).sort().join('');}
function render(id){
  const q=Q[id||sess.cur],u=D[q.u];const app=document.getElementById('app');
  let h=`<div class="quizpg"><div class="top"><button class="back" id="bk">‹ 返回</button><div class="where">${esc(SUBNAME[u.sub]||u.sub)} · ${esc(u.name)}</div></div><div class="card">`;
  h+=`<span class="tag">${q.y}年 ${TN[q.t]}</span>`;
  h+=`<div class="stem">${esc(q.s)}</div>`;
  if(q.t==='判'){
    h+=`<div class="judge">${['对','错'].map(v=>`<button class="opt" data-v="${v}">${v==='对'?'✓ 对':'✗ 错'}</button>`).join('')}</div>`;
  }else{
    h+=getOrd(q).map((oi,pos)=>{const V=String.fromCharCode(65+oi),L=String.fromCharCode(65+pos);return `<button class="opt" data-v="${V}"><span class="L">${L}</span><span>${esc(q.o[oi])}</span></button>`}).join('');
    if(q.t==='多')h+=`<button class="btn pri" id="sub" disabled>提交</button>`;
  }
  h+=`<div id="after"></div></div></div>`;
  app.innerHTML=h;
  document.getElementById('bk').onclick=home;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(b.dataset.v));
  const sb=document.getElementById('sub');if(sb)sb.onclick=submit;
  window.scrollTo(0,0);
}
function pick(v){
  if(sess.answered||sess.view!=null)return;const q=Q[sess.cur];
  if(q.t==='多'){const i=sess.sel.indexOf(v);i<0?sess.sel.push(v):sess.sel.splice(i,1);
    document.querySelectorAll('.opt').forEach(b=>b.classList.toggle('sel',sess.sel.includes(b.dataset.v)));
    document.getElementById('sub').disabled=!sess.sel.length;return;}
  sess.sel=[v];submit();
}
function submit(){
  if(sess.answered||sess.view!=null||!sess.sel.length)return;const q=Q[sess.cur];
  const mine=sess.sel.slice().sort().join('');const ok=mine===q.a;
  sess.answered=true;sess.n++;if(ok)sess.right++;
  const now=Date.now();let s=S.q[q.id];
  const d=today();
  if(!s||!s[0]){S.q[q.id]=ok?[1,0,0,0,now]:[2,0,d,1,now];}
  else if(s[0]===2){if(ok){if(s[2]!==d){s[1]++;if(s[1]>=2)s[0]=3;}}else{s[1]=0;s[3]++;}s[2]=d;s[4]=now;}  // 错题本：每天最多算一次，连续两天做对才移出
  else{if(!ok){S.q[q.id]=[2,0,d,(s[3]||0)+1,now];}}

  save();
  sess.hist.push({id:q.id,sel:sess.sel.slice()});
  showAfter(q,sess.sel,ok);
}
// 选项说明开头若只是重复选项（如“爬到树上：…”），显示时去掉；带括号补充或数字单位不同的保留
function stripPre(o,t){const i=t.indexOf('：');if(i<1||!o)return t;const raw=t.slice(0,i),pre=raw.replace(/[\x01\x02]/g,'');let rest=t.slice(i+1);
  if(!rest.replace(/[\x01\x02\s。]/g,''))return t;if(/[（(]/.test(pre))return t;
  const core=[...pre.replace(/[《》“”"\s]/g,'')];if(!core.length)return t;const miss=core.filter(c=>!o.includes(c));
  if((core.length-miss.length)/core.length<0.6)return t;if(/\d/.test(o)&&miss.length)return t;
  const op=(raw.match(/\x01/g)||[]).length-(raw.match(/\x02/g)||[]).length;if(op>0)rest='\x01'+rest;return rest;}
function showAfter(q,sel,ok){
  const OE={};if(q.t!=='判'&&q.e)for(const x of q.e.split('\n')){const m=x.trim().match(/^([A-E])([✓✗])\s*([\s\S]*)$/);if(m)OE[m[1]]=m[3];}
  const hasOE=Object.keys(OE).length>0;
  document.querySelectorAll('.opt').forEach(b=>{const v=b.dataset.v;const inA=q.t==='判'?v===q.a:q.a.includes(v);const inM=sel.includes(v);
    b.querySelectorAll('.oe').forEach(e=>e.remove());
    if(OE[v]&&b.children[1]){let t=OE[v];const o=q.o[v.charCodeAt(0)-65]||'';if(o&&t.startsWith(o+'：'))t=t.slice(o.length+1);else t=stripPre(o,t);if(/^\s*(不对|不是|原文|按题目记|不在里面|错误|正确|对|错|不符|无关)[。．.]?\s*$/.test(t.replace(/[\x01\x02]/g,'')))t=inA?'':'干扰项';if(t)
      b.children[1].insertAdjacentHTML('beforeend',`<span class="oe">${esc(t).replace(/\x01/g,'<b>').replace(/\x02/g,'</b>')}</span>`);}
    b.classList.remove('sel');if(inA&&inM)b.classList.add('ok');else if(inM)b.classList.add('bad');else if(inA)b.classList.add(q.t==='多'?'miss':'ok');b.disabled=true;});
  const sb=document.getElementById('sub');if(sb)sb.remove();
  let h=`<div class="res ${ok?'ok':'bad'}">${ok?'正确':(q.t==='判'?'错误，正确答案'+(q.a==='对'?'✓':'✗'):'错误，你的答案'+dispAns(q,sel)+'，正确答案'+dispAns(q))}</div><button class="btn pri" id="nx">下一题</button>`;
  if(ok){const s0=S.q[q.id];const inWb=s0&&s0[0]===2&&!s0[1];h+=`<button class="addwb" id="awb"${inWb?' disabled':''}>${inWb?'已加入错题本':(s0&&(s0[0]===3||(s0[0]===2&&s0[1]>0))?'留在错题本':'加入错题本')}</button>`;}
  const mk={};if(q.t!=='判'&&!ok)for(const v of 'ABCDE'){const a=q.a.includes(v),m=sel.includes(v);if(m&&!a)mk[v]='选错';}
  const ex=q.e?fmtExp(q.e,mk,hasOE):'';
  if(ex)h+=`<div class="box"><h4>解析</h4>${ex}</div>`;
  if(q.k||q.kb!=null)h+=`<div class="box book"><h4>原文</h4>${fmtBook(q)}</div>`;
  document.getElementById('after').innerHTML=h;
  document.getElementById('nx').onclick=goNext;
  const aw=document.getElementById('awb');if(aw)aw.onclick=()=>{const s1=S.q[q.id];const now=Date.now();S.q[q.id]=[2,0,today(),((s1&&s1[3])||0)+1,now];save();aw.textContent='已加入错题本';aw.disabled=true;};
}
// 上一题/下一题：上一题只能回看本次已做的题（显示当时的作答和解析，不能改答案）
function goPrev(){
  if(!sess||view.name!=='quiz'||!document.querySelector('.stem'))return;
  const H=sess.hist;let i;
  if(sess.view==null)i=sess.answered?H.length-2:H.length-1;else i=sess.view-1;
  if(i<0)return;showHist(i);
}
function goNext(){
  if(!sess||view.name!=='quiz'||!document.querySelector('.stem'))return;
  const H=sess.hist;
  if(sess.view!=null){
    const last=sess.answered?H.length-2:H.length-1;
    if(sess.view<last){showHist(sess.view+1);return;}
    sess.view=null;render();
    if(sess.answered){const h=H[H.length-1];showAfter(Q[h.id],h.sel,h.sel.slice().sort().join('')===Q[h.id].a);}
    else if(sess.sel.length){document.querySelectorAll('.opt').forEach(b=>b.classList.toggle('sel',sess.sel.includes(b.dataset.v)));const sb=document.getElementById('sub');if(sb)sb.disabled=false;}
    return;
  }
  if(sess.answered)nextQ();
}
function showHist(i){
  sess.view=i;const h=sess.hist[i];const q=Q[h.id];render(h.id);
  const sb=document.getElementById('sub');if(sb)sb.remove();
  showAfter(q,h.sel,h.sel.slice().sort().join('')===q.a);
}
(()=>{let x0=null,y0=0,t0=0;
  document.addEventListener('touchstart',e=>{if(e.touches.length!==1){x0=null;return;}x0=e.touches[0].clientX;y0=e.touches[0].clientY;t0=Date.now();},{passive:true});
  document.addEventListener('touchend',e=>{if(x0==null)return;const t=e.changedTouches[0];const dx=t.clientX-x0,dy=t.clientY-y0;x0=null;
    if(Date.now()-t0>800||Math.abs(dx)<60||Math.abs(dx)<1.5*Math.abs(dy))return;
    if(dx<0)goNext();else goPrev();},{passive:true});
})();
function wrongBook(){
  view={name:'wb'};const app=document.getElementById('app');const ids=wrongList();
  let h=`<div><div class="top"><button class="back" id="bk">‹ 返回</button><div class="where">错题本 ${ids.length} 题${S.sub==='全部'?'':' · '+SUBNAME[S.sub]}</div></div>`;
  const dn=dueList().length;
  h+=`<button class="btn pri" id="redo" ${dn?'':'disabled'} style="margin:0 0 12px">${dn?`重刷错题（今天 ${dn} 题）`:ids.length?'今天的错题都刷完了，明天再来':'重刷错题'}</button>`;
  h+=`<div class="card"><div class="hint" style="margin:0 0 6px">错题列表，按重要性排序。</div>`;
  h+=ids.map(id=>{const q=Q[id];
    return `<div class="wb"><span class="tag">${q.y} ${TN[q.t]}</span><div>${esc(q.s)}</div></div>`}).join('')||'<div class="empty">错题本是空的</div>';
  h+='</div></div>';app.innerHTML=h;document.getElementById('bk').onclick=home;
  document.getElementById('redo').onclick=()=>startWrong();window.scrollTo(0,0);
}
// 键盘不参与做题：没有快捷键，回车/空格也不会触发按钮（防误触），只能点
document.addEventListener('keydown',e=>{
  const tg=e.target.tagName;if(tg==='TEXTAREA'||(tg==='INPUT'&&e.target.type==='text'))return;
  if(e.key==='Enter'||e.key===' '||e.key==='Spacebar'){e.preventDefault();e.stopPropagation();}
},true);
document.addEventListener('keyup',e=>{const tg=e.target.tagName;if(tg==='TEXTAREA'||(tg==='INPUT'&&e.target.type==='text'))return;if(e.key===' '||e.key==='Spacebar'){e.preventDefault();}},true);

home();
</script>
</body>
