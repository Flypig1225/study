公司在租赁合同中约定“待甲所建大楼落成时租给乙工作室两间”","小明的爷爷与小明约定“小明获得游泳冠军后,给小明买 1 台电脑”"],"a":"D","e":"\u0001法律行为所附条件必须是当事人意定选择且将来不确定发生的事实，“获得游泳冠军后买电脑”构成附条件行为。\u0002\nA✗ 保险事故发生后赔偿属于《保险法》及保险合同本身固有的给付条件（法定/本质要件），而非额外所附延缓或解除条件。\nB✗ 办理房产过户登记导致所有权转移是《民法典》不动产登记生效的法定要求，不得作为意定所附条件。\nC✗ 建筑物必然预期建造落成属于租赁标的物交付时间安排或确定化条款，非纯粹或然之附条件（实务与当年真题解析均归为非附条件或履行前提）。\nD✓ 小明能否夺得游泳冠军完全不确定且系双方刻意设定的意定事实，构成典型的附生效（延缓）条件民事法律行为。","k":"","kb":117,"kh":[[42,108]]},{"id":"2010-33","y":2010,"t":"单","s":"甲与乙约定:“甲的儿子如果去外地工作,甲、乙之间的房屋租赁合同即行生效。”这一民事法律行为所附条件为（ ）。","o":["消极的解除条件","积极的解除条件","消极的延缓条件","积极的延缓条件"],"a":"D","e":"\u0001“儿子去外地工作，租赁合同即行生效”以约定事实的发生为条件内容且决定行为生效，属于积极的延缓条件。\u0002\nA✗ 所附条件并不在于事后解除已生效合同，且条件内容不是“不去”。\nB✗ 合同并非已生效并在儿子去外地后解除，而是去外地后才开始生效，故非解除条件。\nC✗ “去外地工作”以事件发生为条件内容，属于积极条件而非消极条件。\nD✓ 以“去外地工作”这一事实发生作为条件属于积极条件，且该条件成就使合同开始生效属于延缓（生效）条件，合称积极的延缓条件。","k":"","kb":117,"kh":[[163,190],[245,272]]},{"id":"2010-47","y":2010,"t":"单","s":"下列行为中,属于可撤销民事行为的是（ ）。","o":["甲(8周岁)接受远房亲戚馈赠的现金1万元","乙(14周岁)用压岁钱购买价值2800元的金项链","丙从某公司购买一辆无牌照的走私车","丁因受对方欺诈买回一部不能使用的手机"],"a":"D","e":"\u0001因受欺诈违背真实意思实施的民事法律行为，受欺诈方有权依法请求人民法院或者仲裁机构予以撤销。\u0002\nA✗ 8周岁未成年人纯获1万元现金馈赠，依法律规定直接有效，非可撤销。\nB✗ 14周岁限制行为能力人未经同意购买2800元贵重金项链属于效力待定行为。\nC✗ 买卖无牌照走私车违反国家法律强制性规定，属于无效民事法律行为。\nD✓ 丁受对方欺诈购得无法使用的劣质手机，属于典型的因欺诈而可撤销的民事法律行为。","k":"","kb":115,"kh":[[25,29],[227,244]]},{"id":"2010-51","y":2010,"t":"多","s":"下列现象中,属于民事法律行为的有（ ）。","o":["甲被宣告死亡","乙参加朋友的婚礼","丙抛弃旧电脑","丁参加当地人大代表的选举"],"a":"AC","e":"\u0001丙抛弃旧电脑属自主处分动产所有权的单方民事法律行为；婚姻礼仪属情谊行为，参选人大代表属公法行为。\u0002\nA✓ 按当年联考官方真题标准答案予以保留（注意区分：严格民法理论上，自然人被宣告死亡系法院司法裁判作出的法律事实，而非自然人主动实施的意思表示行为）。\nB✗ 参加朋友婚礼纯属社交礼仪情谊交往，不创设或变动民事权利义务。\nC✓ 丙自愿抛弃旧电脑以消灭所有权的意思表示对外作出处分，构成典型单方民事法律行为。\nD✗ 参加人大代表选举属于公民行使宪法政治权利的公法行为，不属于民事法律行为。\n【命题辨析】2010年真题官方参考答案给分项为AC。严谨民法教义学应注意：被法院宣告死亡是引发遗产继承与婚姻消灭的“民事法律事实（程序裁判事件）”，而非民事主体基于意思表示自主实施的“民事法律行为”。","k":"","kb":113,"kh":[[71,78],[179,183],[231,272]]},{"id":"2015-23","y":2015,"t":"单","s":"下列行为中,属于从法律行为的是（ ）。","o":["行纪合同","协议离婚","履行行为","抵押合同"],"a":"D","e":"\u0001抵押合同是为了担保主债权实现而设立、随主债权成立与消灭而同命运的从民事法律行为。\u0002\nA✗ 行纪合同能独立存在，属于主法律行为。\nB✗ 协议离婚不依赖其他法律行为即可独立设变身份关系，为主法律行为。\nC✗ 一般清偿等履行行为重在实现既定债务内容，通常归为事实行为或履行处分，并非主从对应中的“从法律行为”。\nD✓ 抵押合同依法从属于主债权债务合同，主合同无效则抵押合同原则上亦无效，是最典型的从民事法律行为。","k":"","kb":113,"kh":[[434,459]]},{"id":"2015-28","y":2015,"t":"单","s":"甲16周岁，无业，依靠父母生活。某日，甲向朋友乙借款2万元，用其中的1万元买了名牌包送给男友丙，用200元为自己的手机充值，用余款购买了一张美发店的消费卡。下列选项中，正确的是（ ）。","o":["甲与乙之间的借款合同有效","甲与丙之间的赠与合同无效","甲为手机充值的行为可撤销","甲购买消费卡的行为效力待定"],"a":"D","e":"\u000116周岁依靠父母生活属于限制民事行为能力人，超越年龄智力的借款、赠与及办大额消费卡均为效力待定，充200元话费有效。\u0002\nA✗ 16周岁中学生向他人借款2万元远超其年龄智力范围且非纯获利益，未获父母追认前效力待定而非当然有效。\nB✗ 将1万元名牌包赠与男友同样属于限制民事行为能力人超限处分财物行为，属效力待定而非直接确定无效。\nC✗ 用200元给手机充值属于与16岁青年日常通信相适应的消费行为，直接有效且不可随便撤销。\nD✓ 将剩余近万元用于购买美发店高额消费卡超出未成年人日常判断与财产处分能力，须法定代理人追认方生效力，即效力待定。","k":"","kb":116,"kh":[[194,243]]},{"id":"2016-26","y":2016,"t":"单","s":"下列选项中,属于民事法律行为的是（ ）。","o":["甲到烈士陵园缅怀先烈","乙开车不慎将行人撞倒","丙邀请朋友到自家聚餐","丁向同事转让一架钢琴"],"a":"D","e":"\u0001丁向同事转让一架钢琴通过买卖或赠与意思表示设立并移转财产权利，属于民事法律行为。\u0002\nA✗ 到烈士陵园缅怀先烈属精神道德与追思活动，不设变民事法律关系。\nB✗ 开车不慎撞倒行人并非追求侵权赔钱的意思表示行为，而是依法产生侵权责任的违法事实行为。\nC✗ 邀请朋友来家聚餐属于不具有法律约束意思的情谊行为。\nD✓ 向同事转让钢琴系以意思表示移转动产所有权及设变债权的民事法律行为。","k":"","kb":113,"kh":[[63,70],[179,183]]},{"id":"2017-22","y":2017,"t":"单","s":"公司职员甲办理了某银行的信用卡,在商场持卡消费2万余元。在向银行还款前,甲突患精神病。对此,下列说法正确的是（ ）。","o":["甲与银行之间的合同、甲与商场之间的合同均有效","甲与银行之间的合同、甲与商场之间的合同均无效","甲与银行之间的合同有效,甲与商场之间的合同无效","甲与银行之间的合同无效,甲与商场之间的合同有效"],"a":"A","e":"\u0001判断当事人是否具备相应缔约行为能力，以“民事法律行为实施时（缔约时）”为准；缔约后突患精神病不影响此前已有效合同。\u0002\nA✓ 甲办卡及持卡消费2万余元时均精神正常且为完全民事行为能力人，故两个合同自成立即合法有效，事后患病不能倒推令合同无效。\nB✗ 事后丧失行为能力不影响之前依法成立并生效的合同约束力。\nC✗ 办理信用卡与刷卡消费均发生在患病之前，两者同等有效。\nD✗ 信用卡合约亦系患病前具有完全行为能力时订立，同样有效。","k":"","kb":116,"kh":[[50,86]]},{"id":"2017-31","y":2017,"t":"单","s":"甲、乙约定:甲赠与乙紫砂壶一把,该合同在乙结婚时生效。该合同属于（ ）。","o":["附确定期限的合同","附不确定期限的合同","附延缓条件的合同","附解除条件的合同"],"a":"C","e":"\u0001甲、乙约定赠与在“乙结婚时生效”，因乙将来是否结婚具有不确定性且系双方意定，属于附延缓条件的合同。\u0002\nA✗ 结婚并非必然到来之日，不属于附确定期限。\nB✗ 人生是否结婚可能发生也可能永不发生，缺乏期限的“必然到来性”，不能认定为附不确定期限。\nC✓ 结婚与否不确定，且合同约定了“结婚时生效”，因此构成附延缓（生效）条件的赠与合同。\nD✗ 条件成就时合同是“产生效力”而非“消灭效力”，并非解除条件。","k":"","kb":117,"kh":[[42,71],[163,181]]},{"id":"2018-35","y":2018,"t":"单","s":"甲(13 周岁)因考试成绩不理想将自己的书包扔掉。甲将书包扔掉的事实属于（ ）。","o":["事件","事实行为","民事法律行为","不具有法律意义的事实"],"a":"C","e":"\u000113周岁少年因成绩不理想将自己的旧书包扔掉，属于限制民事行为能力人实施与年龄智力相适应、以意思表示放弃所有权的单方民事法律行为。\u0002\nA✗ 扔掉书包系人的有意识支配举动，非不以人的意志为转移的事件。\nB✗ 物权法教义学上，物权人有放弃所有权之主观意图并扔弃动产的“抛弃”，须以意思表示为核心，属于单方法律行为而非纯粹事实行为。\nC✓ 13周岁属限制民事行为能力人，抛弃自己日常旧书包价值有限且与其年龄智力相适应，属合法有效的单方民事法律行为。\nD✗ 抛弃行为直接消灭所有权归属，产生重要物权变动法律意义。","k":"","kb":113,"kh":[[71,115]]},{"id":"2019-48","y":2019,"t":"多","s":"下列关于意思表示生效的表述,正确的有（ ）。","o":["以对话方式作出的意思表示,相对人知道其内容时生效","以非对话方式作出的意思表示,到达相对人时生效","无相对人的意思表示,法律无特别规定的,表示完成时生效","以公告方式作出的意思表示,公告发布时生效"],"a":"ABCD","e":"\u0001《民法典》第137-139条系统规定了对话、非对话、无相对人及公告方式作出意思表示的各自生效时点。\u0002\nA✓ 以对话方式作出的意思表示，相对人知道其内容时生效。\nB✓ 以非对话方式作出的意思表示，到达相对人时生效（采到达主义）。\nC✓ 无相对人的意思表示（如立遗嘱、抛弃动产），除法律另有规定外，表示完成时即生效。\nD✓ 以公告方式作出的意思表示，公告发布时生效。","k":"","kb":114,"kh":[[59,161]]},{"id":"2020-28","y":2020,"t":"单","s":"甲以5万元购得一块手表,甲的朋友乙发现该表系高仿品,但未告知甲。丙看见该手表有意购买,乙为让丙买下该表,对丙声称该表是绝版正品,丙信以为真,遂以5.5万元买下该表。甲与丙之间买卖合同的效力为（ ）。","o":["无效","可撤销","效力待定","有效"],"a":"D","e":"\u0001第三人乙欺诈丙购买甲的高仿手表，但出卖人甲对乙的欺诈不知情也不应当知道，故丙无撤销权，买卖合同有效。\u0002\nA✗ 第三人欺诈不触发绝对无效后果。\nB✗ 依《民法典》第149条，第三人欺诈须相对方甲“知道或者应当知道”时受欺诈方才可撤销；本题甲亦误认系正品并不知情，不可撤销。\nC✗ 双方均为完全民事行为能力人且无无权代理等问题，非效力待定。\nD✓ 相对方甲对第三人乙的欺诈完全不知情亦无过失，故受欺诈方丙不得向善意相对方甲主张撤销，买卖合同继续有效。","k":"","kb":115,"kh":[[281,353]]},{"id":"2021-37","y":2021,"t":"单","s":"某建筑队借用A建筑公司的资质,以A 建筑公司的名义与B公司签订了建设工程施工合同。该施工合同的效力为（ ）。","o":["有效","可撤销","无效","效力待定"],"a":"C","e":"\u0001没有资质的实际施工人借用有资质建筑施工企业名义签订的建设工程施工合同，违背《建筑法》强制性效力规范，依法无效。\u0002\nA✗ 借用资质（挂靠）严重危害建筑工程质量及公共安全，依法禁止。\nB✗ 并非基于欺诈胁迫或误解的可撤销情形。\nC✓ 依《民法典》第153条第1款及最高法建工司法解释（一）第1条，无资质借用资质签立的建设工程施工合同确定无效。\nD✗ 借用资质违法行为不能通过事后追认变得合法，非效力待定。","k":"","kb":116,"kh":[[349,399]]},{"id":"2022-21","y":2022,"t":"单","s":"文某有祖传名画一幅。2020年1月1日,文某的朋友乙看到后提出以市价购买并成交。2021年1月1日,乙经鉴定得知该画为赝品,但碍于情面未告知文某。2021年5月1 日,文某得知该画为赝品,随即向乙提出退还价款并索要该画。此时,对该合同","o":["文某有权解除","文某有权撤销","乙有权解除","乙有权撤销"],"a":"B","e":"\u0001重大误解撤销权除斥期间为知道或应当知道撤销事由之日起90日；乙已逾期丧失撤销权，文某5月1日刚得知有权撤销。\u0002\nA✗ 双方未约定解除条件且本案不构成违约根本目的不能实现的法定解除事由。\nB✓ 该名画实为赝品却按市价真迹交易，双方均属重大误解；文某2021年5月1日才得知真相并立即要求撤销退货（在90日除斥期间且自成立未满5年内），依法享有撤销权。\nC✗ 乙同样无单方解除权。\nD✗ 乙虽早于2021年1月1日经鉴定得知画作系赝品，但未行使撤销权，至同年5月1日已超过90日法定除斥期间，乙的撤销权已消灭。","k":"","kb":115,"kh":[[403,444],[474,513]]},{"id":"2022-25","y":2022,"t":"单","s":"甲开车不慎剐蹭了乙停在路边的汽车。甲因着急上班，在被剐车辆上留下一张写有自己联系方式的字条后离开。乙见后联系甲，两人在电话中商定甲赔偿800元。乙将车送去修理，支付费用1000元。甲和乙之间关于赔偿的约定（ ）。","o":["成立并有效","因重大误解而效力待定","因显失公平而可撤销","因系口头约定而无效"],"a":"A","e":"\u0001甲与乙电话口头商定交通事故赔偿800元，双方意思表示真实且不违法，虽实际修理花1000元，和解协议已成立并有效。\u0002\nA✓ 两人在电话中就800元赔偿数额达成明确合意，口头形式亦被法律认可，轻微修车差价200元属正常商业风险预估偏差，协议成立并有效。\nB✗ 修车多支出200元未达“重大误解且造成较大损失”标准，且重大误解即使成立亦为可撤销而非效力待定。\nC✗ 差价200元并未构成一方利用危困或缺乏判断能力所致的“显失公平”。\nD✗ 民法对事故赔偿和解协议不强制要求书面形式，口头约定同样有效。","k":"","kb":116,"kh":[[94,122]]},{"id":"2022-35","y":2022,"t":"单","s":"甲(12周岁)将自己的自行车卖给乙(19周岁),甲的父母得知后予以追认。该追认行为属于","o":["从行为","负担行为","单方行为","要式行为"],"a":"C","e":"\u0001法定代理人对限制民事行为能力人超越能力所订合同作出的追认，仅凭单方意思表示即决定行为效力，属于单方形成行为。\u0002\nA✗ 追认行为是法定代理人独立作出的形成权行使行为，旨在使既成待定合同生效，而非依赖另一法律行为存在的“从行为”（如担保）。\nB✗ 负担行为直接创设债权债务给付义务；追认权行使只产生使原有待定行为发生效力的处分/形成结果。\nC✓ 父母作为法定代理人仅凭自己单方作出追认意思表示（向相对人或被代理人到达即生效），无需乙同意，属单方民事法律行为。\nD✗ 追认行为法律并未规定必须书面等特定形式，属于不要式行为。","k":"","kb":113,"kh":[[280,320]]},{"id":"2022-39","y":2022,"t":"单","s":"【案情】甲（20周岁）收入不高，但经常出入某高档酒吧，父母常常被迫为其买单。2021年3月初，甲以个人名义向该酒吧预订3月14日的包厢及生日套餐。3月14日晚，乙、丙、丁受甲之邀来到该酒吧。甲结账时，账单显示消费金额为11860元，甲请求延期支付，被拒绝后欲离开。酒吧经理阻止甲离开并报警，引得众人围观议论。\n对于11860元的消费金额,酒吧有权请求","o":["甲支付","甲的父母和甲共同支付","甲、乙、丙、丁按份支付","甲、乙、丙、丁连带支付"],"a":"A","e":"\u0001完全民事行为能力人甲以个人名义订包厢宴请朋友，该11860元消费合同仅约束缔约人甲；受邀赴宴属情谊行为，朋友无需买单。\u0002\nA✓ 甲20周岁已为完全民事行为能力人，应由甲自己向酒吧清偿全部消费账款。\nB✗ 成年子女已独立承担民事责任，此前父母被迫买单系亲情代偿而非法律强制义务，酒吧无权向甲父母追索。\nC✗ 乙、丙、丁系受邀参与生日聚会，属于纯情谊社交行为，未与酒吧成立服务消费合同。\nD✗ 同上，受邀人既无缔约合意亦无共同负担约款，不负连带付款义务。","k":"","kb":113,"kh":[[153,184]]},{"id":"2023-32","y":2023,"t":"单","s":"【案情】甲、乙忙于工作，其子小明出生后便由乙的母亲丙照顾。甲向丙许诺，在丙照顾孩子期间每月给丙2000元补贴，年底一次性支付。小明5岁时，甲、乙离婚，小明由甲直接抚养，甲委托其父母照顾小明。\n对于甲向丙许诺的补贴","o":["仅甲负有给付义务","甲、乙应共同承担给付义务","丙无权请求给付,因其系履行道德义务","甲无须给付,因其许诺不构成意思表示"],"a":"B","e":"\u0001甲为夫妻共同照料子女需要而向岳母许诺每月2000元补贴，构成有法律拘束力的意思表示，属夫妻共同债务应由甲、乙共同承担。\u0002\nA✗ 尽管补贴是甲口头许诺，但实质系为甲、乙共同未成年子女生育照料等家庭共同生活需要而设定的支出，属于夫妻共同债务。\nB✓ 甲许诺按月付给丙固定金额补贴具有明确的债的拘束意思（且照料幼儿并非外祖母无偿法定抚养义务），用于家庭共同生活需要，依法由甲、乙共同承担给付义务。\nC✗ 外祖母丙在父母健在且有抚养能力时并无法定免费带孙义务，且甲明确许诺按月支付对价补贴，成立有偿劳务/照料约定。\nD✗ “每月给丙2000元补贴、年底一次性支付”时间与数额极其确定，明显属于有约束力的意思表示而非泛泛礼节寒暄。","k":"","kb":114,"kh":[[187,267]]},{"id":"2024-25","y":2024,"t":"单","s":"甲(11周岁),使用母亲的名字和身份证号在一家游戏公司网站完成实名认证。其后两个月内自行用手机在该网站充值3万余元,甲充值的法律行为（ ）。","o":["有效","无效","可撤销","效力待定"],"a":"D","e":"\u000111周岁未成年人为限制民事行为能力人，两个月内大额游戏充值3万余元明显超出其年龄智力且非纯获利益，依法效力待定。\u0002\nA✗ 3万余元大额娱乐充值严重脱离11岁小学生正常认知与经济支配水平，不能直接有效。\nB✗ 8周岁以上限制民事行为能力人超限行为并非当然确定无效，只要法定代理人追认仍可有效，故属效力待定（注意若家长明确拒绝追认才归于无效）。\nC✗ 不属于重大误解、欺诈胁迫或显失公平等可撤销事由。\nD✓ 甲11周岁属限制民事行为能力人，即便盗用母亲身份认证亦不改其主体行为能力欠缺实质，大额充值属效力待定行为，须待其监护人追认与否决定最终效力。","k":"","kb":116,"kh":[[194,224],[244,276]]},{"id":"2024-26","y":2024,"t":"单","s":"甲和乙签订赠与合同,约定合同在乙取得某职业资格证书之日起生效。该合同属于 （ ）。","o":["有偿行为","附延缓条件的民事法律行为","身份行为","附始期的民事法律行为"],"a":"B","e":"\u0001约定赠与合同在乙“取得某职业资格证书之日起生效”，取证与否属将来不确定的事实，故为附延缓条件的民事法律行为。\u0002\nA✗ 赠与本身原则上属于典型的无偿法律行为，不因附条件而变为有偿（除非附加与赠与价值相当的对价义务）。\nB✓ 乙将来能否顺利考取该职业资格证书具有不确定性，以此成就作为生效前提，属于典型的附延缓（生效）条件行为。\nC✗ 赠与财产不涉结婚、收养等亲属身份变动，属于财产行为。\nD✗ 所谓附始期须以将来“必然到来”的时间为标准，考试取证能否通过并不必然发生，故非期限。","k":"","kb":117,"kh":[[42,86]]},{"id":"2024-37","y":2024,"t":"单","s":"甲在乙的胁迫下低价将首饰卖给了丙,丙对甲被胁迫之事不知情,该买卖合同（ ）。","o":["有效","无效","可撤销","效力待定"],"a":"C","e":"\u0001第三人乙实施胁迫使甲低价卖首饰给丙，即便相对方丙对胁迫事实不知情，受胁迫人甲仍依法享有撤销权。\u0002\nA✗ 为贯彻意思自治与严厉制裁胁迫恶行，即便交易对方善意不知情，法律仍保护受胁迫方的撤销权。\nB✗ 受胁迫所订民事法律行为属于可撤销而非直接绝对无效。\nC✓ 依《民法典》第150条，一方或者第三人以胁迫手段使对方在违背真实意思下实施民事法律行为的，不论相对人是否知情，受胁迫方均有权请求撤销。\nD✗ 胁迫合同成立时即已确定生效（非待追认），仅在依法被撤销后自始消灭效力。\n记法：比较记忆：第三人欺诈→须对方知道或应当知道才可撤销；第三人胁迫→不管对方知不知情一律可撤销！","k":"","kb":115,"kh":[[355,384]]},{"id":"2025-31","y":2025,"t":"单","s":"甲欲将自己的房屋转让给乙,双方为少缴税款签订了两份合同,一份是私下使用的高成交价合同,另一份是房屋过户时使用的低成交价合同。低成交价合同（ ）。","o":["不成立","无效","有效","可撤销"],"a":"B","e":"\u0001双方为逃避税款而故意签立过户用的低成交价虚假合同，属通谋虚伪意思表示，依法确定无效。\u0002\nA✗ 双方有共同签订该低价书面合同的外在合意，形式上已经成立。\nB✓ 依《民法典》第146条，行为人与相对人以虚假的意思表示实施的民事法律行为无效；真正高成交价隐藏合同另依实质规范认定效力。\nC✗ 虚假价格合同并非双方真实交易意愿，不具有民事法律效力。\nD✗ 通谋虚伪意思表示系绝对无效，而非由一方选择行使撤销权的可撤销行为。","k":"","kb":115,"kh":[[61,112]]},{"id":"2025-39","y":2025,"t":"单","s":"甲与A 公司签订书面合同,约定甲购买501 室房屋。在装订合同书时,A 公司工作人员因疏忽错装了501 室和601 室房屋买卖合同中的材料。后登记机构根据申请材料,将601 室房屋登记在甲名下。甲与A 公司之间的房屋买卖合同（ ）。","o":["不成立","无效","有效","可撤销"],"a":"C","e":"\u0001买卖双方就购买501室达成真实合意，错装601室材料致误登记系履行及登记环节失误，不影响501室买卖合同本身的有效性。\u0002\nA✗ 双方主体适格、房屋标的501室与价款意思表示均已明确一致，合同依法成立。\nB✗ 工作人员错装文本导致登记错号属于后续履行/登记错误（可申请更正登记），不构成合同内容违法或虚假而致合同无效。\nC✓ 依据负担行为与物权变动区分原则，合同成立且真实有效；不动产错登应通过登记更正或履行救济处理，买卖合同自身保持有效。\nD✗ 双方订立501室买卖合同本身不存在重大误解（合意正是买501室），错在后期装订送登环节。","k":"","kb":116,"kh":[[144,185]]},{"id":"2026-37","y":2026,"t":"单","s":"下列合同中,因违反法律、行政法规的强制性规定而无效的是","o":["违规占道的水果摊贩与顾客签订的买卖合同","出卖人与买受人签订的低于实际成交价格的房屋买卖合同","旅行社法定代表人超出权限范围与旅游者签订的旅游合同","发包人与不具有对应资质的承包人签订的建设工程施工合同"],"a":"D","e":"\u0001发包人与不具有相应资质的承包人签订的建设工程施工合同违反法律、行政法规强制性效力规定，确定无效。\u0002\nA✗ 摊贩违规占道摆摊仅违反城市市容行政管理规定（管理性规范），其与顾客间达成的果蔬买卖合同仍然有效。\nB✗ 低于实际成交价的房屋阴阳合同，虚伪低价部分依第146条虚假意思表示无效（非因违反资质/强行法整体无效），被隐藏的真实高价合意仍可有效。\nC✗ 旅行社法定代表人越权签约原则上对善意旅游者直接有效（相对人恶意时才对法人不生效力），并非违反强制性规定而无效。\nD✓ 建设工程施工关涉公共生命安全，无对应资质承包施工直接违反法律强制性效力规范，依《民法典》第153条第1款确定无效。","k":"","kb":116,"kh":[[349,443]]}]},{"sub":"民法","name":"所有权与共有","w":1.8,"L":33,"qs":[{"id":"2005-35","y":2005,"t":"单","s":"在当事人没有约定,法律亦无特别规定的情况下,买卖合同中财产所有权的转移时间是（ ）。","o":["标的物交付时","买方付清全部货款时","合同生效时","合同成立时"],"a":"A","e":"\u0001在当事人无约定且法律无特别规定时，买卖合同标的物所有权自交付时起转移。\u0002\nA✓ 依《民法典》第598、224条（原《合同法》第133条），除法律另有规定或当事人另有约定（如所有权保留）外，动产等买卖标的物所有权自交付时转移。\nB✗ 货款是否付清原则上不延缓所有权移转，除非双方明确约定“所有权保留”条款。\nC✗ 我国民法不采纯粹契约生效即移转所有权的意思主义。\nD✗ 合同成立仅产生债法请求权，不直接引发所有权转移。","k":"","kb":122,"kh":[[157,172]]},{"id":"2006-43","y":2006,"t":"单","s":"所有权取得方式中,属于原始取得的是（ ）。","o":["继承遗产","受赠图书","收获庄稼","购得汽车"],"a":"C","e":"\u0001收获自己种植的庄稼不依赖前手权利移转，属于所有权原始取得；继承、受赠与购买均系继受取得。\u0002\nA✗ 继承遗产是从被继承人原有所有权移转而来，属于继受取得。\nB✗ 受赠图书是基于赠与合同从赠与人处继受取得所有权。\nC✓ 收获庄稼属于劳动生产/收取天然孳息，权利首次产生而非从他人处承受，属于所有权原始取得。\nD✗ 购买汽车是从出卖人处依据买卖契约继受取得。","k":"","kb":122,"kh":[[67,89]]},{"id":"2006-52","y":2006,"t":"多","s":"根据法律规定,下列民事主体中享有优先购买权的是（ ）。","o":["抵押权人","合伙人","房屋承租人","按份共有人"],"a":"BCD","e":"\u0001依法享有同等条件下优先购买权的主体包括合伙人、房屋承租人与按份共有人；抵押权人不享有优先购买权。\u0002\nA✗ 抵押权人享有的是折价拍卖变卖担保物后的“优先受偿权”，我国禁止流押，抵押权人无优先购买权。\nB✓ 《合伙企业法》第23条规定普通合伙人向合伙人以外的人转让财产份额时，在同等条件下其他合伙人享有优先购买权。\nC✓ 房屋出租人出卖租赁房屋的，承租人在同等条件下享有优先购买权（注意《民法典》第726条新增出租给近亲属及共有人优先购买时除外）。\nD✓ 《民法典》第306条规定按份共有人转让份额时，其他共有人在同等条件下享有优先购买权。\n【新法提示】现行《民法典》第726条明确：出租人将房屋出卖给近亲属，或者按份共有人依法行使优先购买权的，房屋承租人不再享有优先购买权。","k":"","kb":123,"kh":[[341,427]]},{"id":"2007-32","y":2007,"t":"单","s":"某年元旦前,张某给田某寄去一张有奖明信片,并戏称:“得奖了别忘请客”。田某将此明信片转送给金某, 并与其约定一旦得奖则奖金两人平分。开奖时,该张明信片中了大奖,奖金 2000 元。为此笔奖金的分配,张某、田某与金某发生争执。依据民法原理,此笔奖金应 （ ）。","o":["归张某所有","由张某、田某共有","归金某所有","由田某、金某共有"],"a":"D","e":"\u0001田某与金某约定有奖明信片中奖则奖金平分，双方达成附条件合伙/共有分配合意，中奖后2000元奖金归田某与金某共有。\u0002\nA✗ 张某已将明信片无偿赠寄送与田某，并戏称请客不留保留权，张某已丧失该明信片及其附属抽奖期待利益。\nB✗ 张某非现所有人亦未参与共享奖金约定。\nC✗ 田某将明信片转送金某时附有“一旦得奖则奖金平分”之合意条件，非纯无附带条件归金某独得。\nD✓ 田某与金某成立附延缓条件（中奖）的奖金分配协议，开奖中奖使条件成就，奖金由田某和金某依约共有。","k":"","kb":123,"kh":[[15,19]]},{"id":"2007-52","y":2007,"t":"多","s":"甲、乙系邻居。下列情形中,属于甲侵害乙相邻权的有 （ ）。","o":["甲家院中树木的根枝越界到乙家院中生长","甲将自家房屋改建为歌厅,喧嚣声使乙彻夜难眠","甲把大狼狗拴在自家院中,乙路过时被吓得心惊胆颤","甲把垃圾堆放在自家门口,散发的恶臭使乙夏天不敢开窗"],"a":"ABD","e":"\u0001根枝越界侵害邻宅安全、歌厅深夜噪音扰民、门口堆恶臭垃圾妨碍通风均侵害相邻权；自家院内正常拴狗一般不构成侵害相邻权。\u0002\nA✓ 院中树木根枝越界伸展入邻居院内生长，直接侵占邻人空间妨碍使用，构成侵害相邻权。\nB✓ 将房屋改建为歌厅发出超标喧嚣噪音严重影响邻人休息，构成《民法典》第294条规定的不可量物侵害。\nC✗ 把狗拴在“自家院中”未越界扑咬也非排放超标废气噪音，路人路过主观受惊一般不认定为侵害相邻不动产利用权益。\nD✓ 在家门口长期堆放垃圾散发恶臭致邻居不敢开窗，侵害相邻方通风采光与正常生活权益。","k":"","kb":124,"kh":[[412,430],[475,498]]},{"id":"2009-38","y":2009,"t":"单","s":"甲将从上游水源流下的水截留在自己的土地,土地位于下游的乙要求甲停止截留。根据民法规定,乙所行使的权利为（ ）。","o":["使用权","地上权","地役权","相邻权"],"a":"D","e":"\u0001上游甲擅自截留自然水流影响下游乙用水，乙依法行使的是基于法定毗邻关系的相邻权。\u0002\nA✗ 民法典并无独立的“自然水流使用权”单独名目概括此诉权，其法理基础为相邻关系。\nB✗ 地上权指在他人土地建造保有建筑物的用益物权，与自然流水无关。\nC✗ 地役权须双方意定签订书面合同取得；乙要求不得截留自然水流直接源自法律规定，无需另付对价签约。\nD✓ 依据《民法典》第290条，不动产权利人应当为相邻权利人用水、排水提供必要便利，自然流水的排放不得擅自堵截，乙行使的是法定相邻权。","k":"","kb":124,"kh":[[431,439]]},{"id":"2009-51","y":2009,"t":"多","s":"下列共有关系中,属于共同共有关系的有（ ）。","o":["居住在同一幢楼的居民对共同乘坐的电梯形成的共有关系","甲乙对各出资 800 元购买的洗衣机形成的共有关系","婚姻关系存续期间,双方无特别约定,夫妻对一方所得的稿酬形成的共有关系","被继承人死亡后,继承人对被继承人遗留的没有分割的遗产形成的共有关系"],"a":"CD","e":"\u0001婚姻存续期间夫妻无特别约定的稿酬，以及被继承人死亡后分割前未分配遗产，均属于典型的共同共有关系。\u0002\nA✗ 住宅楼全体业主对公用电梯享有的是建筑物区分所有权中的“共有权”（不可请求分割的共有），而非传统按份/共同共有之典型“共同共有”关系（虽同具不可分割性，真题严格限定仅CD为共同共有）。\nB✗ 甲乙各出资800元购买洗衣机，无家庭/夫妻等共同关系基础时一般认定为按份共有（各占50%份额）。\nC✓ 夫妻在婚姻关系存续期间所得稿酬（除约定分别财产制外）属于夫妻共同财产，为典型共同共有。\nD✓ 被继承人死亡后至遗产实际分割前，全体继承人对未分割遗产不分份额地共同共有。","k":"","kb":123,"kh":[[72,153]]},{"id":"2010-36","y":2010,"t":"单","s":"下列选项中,属于所有权继受取得方式的是（ ）。","o":["先占","遗赠","添附","生产"],"a":"B","e":"\u0001遗赠是从原所有人（遗赠人）处依法移转取得遗产所有权，属于继受取得；先占、添附、生产均属原始取得。\u0002\nA✗ 先占无主动产是直接依法取得原不存在现主的所有权，属原始取得。\nB✓ 受遗赠人因遗嘱人死亡及接受遗赠，从被继承人处移转取得遗赠财产所有权，属于继受取得。\nC✗ 附合、混合、加工等添附使原物消灭并产生新物归属，属于原始取得。\nD✗ 生产制造劳动直接产生新物并原始归生产者所有，属原始取得。","k":"","kb":122,"kh":[[67,92],[157,184]]},{"id":"2010-37","y":2010,"t":"单","s":"人民法院在处理相邻用水纠纷时,对有过错一方影响他方正常生产和生活的,应当责令其（ ）。","o":["赔礼道歉","消除危险","排除妨害","恢复原状"],"a":"C","e":"\u0001在相邻用水纠纷中，有过错方堵截或改变水流影响他方正常生产生活的，法院应当责令其排除妨害。\u0002\nA✗ 赔礼道歉主要适用于人格权受侵害情形，财产相邻纠纷一般不适用。\nB✗ 消除危险针对的是尚未造成现实妨害但存在倒塌等现实危险的状态；此处水流已被阻断影响现实生产生活。\nC✓ 一方过错截水、排水妨害相邻人正常用水，依法应当责令停止侵害、排除妨害（对应原《民通意见》第98条及《民法典》第290、236条）。\nD✗ 虽然某些破坏水渠行为可并处恢复原状，但法条与真题针对“影响他方正常生产和生活”的精准标准表述为责令“排除妨害”。","k":"","kb":124,"kh":[[431,474]]},{"id":"2011-24","y":2011,"t":"单","s":"根据法律规定,按份共有人转让其应有份额时,其他共有人享有（ ）。","o":["禁止其转让的权利","解除共有关系的权利","同等条件下的优先购买权","对转让份额的追及权"],"a":"C","e":"\u0001按份共有人向共有人以外的人转让其应有份额时，其他按份共有人依法享有在同等条件下的优先购买权。\u0002\nA✗ 按份共有人对自己应有份额享有独立处分权，其他共有人无权单纯禁止其转让。\nB✗ 转让个人份额不触发解除整体共有关系的单方权利。\nC✓ 依《民法典》第305、306条，按份共有人转让其享有的共有的不动产或动产份额的，其他共有人在同等条件下享有优先购买权。\nD✗ 份额转让有效完成即由买受人取得，其他共有人只享有优先购买权（及未通知时的损害赔偿或撤销/追购救济）。","k":"","kb":123,"kh":[[341,356],[393,407]]},{"id":"2011-25","y":2011,"t":"单","s":"村民甲在自家院子里挖水沟，致邻居乙家房屋地基下沉。依据物权法，甲侵害了乙的（ ）。","o":["所有权","地上权","地役权","建设用地使用权"],"a":"A","e":"\u0001乙的宅基地房屋属于乙的自有不动产，甲在自家挖水沟致乙房屋地基下沉，侵害了乙对房屋的所有权。\u0002\nA✓ 房屋本身是乙所有权客体（自物权），地基下沉直接损坏房屋物理实体安全，侵害的是乙的房屋所有权。\nB✗ 地上权是利用他人土地营造建筑物的他物权，题干焦点为房屋所有权受侵害。\nC✗ 甲、乙之间并未通过合同设定地役权（地基危险亦属相邻防免义务及所有权保护范围）。\nD✗ 乙作为村民居住自有房屋的用地通常为宅基地使用权，而非国有土地建设用地使用权，且直接受损客体首先是房屋所有权。","k":"","kb":122,"kh":[[27,30]]},{"id":"2013-46","y":2013,"t":"多","s":"甲出国前将古琴、油画及电脑交乙保管。后乙将古琴出借给丙,将油画赠送给丁,将电脑出质给戊。甲回国后发现以上事实。甲有权（ ）。","o":["要求丙返还古琴","要求丁返还油画","要求戊返还电脑","要求乙承担违约责任"],"a":"ABD","e":"\u0001出借古琴、赠与油画均不构成有偿转让故丙、丁不能善意取得；出质电脑若戊善意且交付则善意取得质权，乙均需负违约责任。\u0002\nA✓ 乙将甲之古琴无权出借给丙，丙仅为借用人而非受让所有权，且无偿不适用善意取得，甲有权要求丙返还古琴。\nB✓ 乙将甲之油画无偿赠与丁，不满足善意取得“以合理价格转让（有偿）”的法定条件，丁不能善意取得，甲有权要求丁返还油画。\nC✗ 动产质权可以参照适用善意取得制度（《民法典》第311条第3款）：电脑已交付给善意质权人戊，戊善意取得质权，甲无权无条件直接追回（须先清偿被担保债权或待质权消灭）。\nD✓ 乙违反保管合同义务擅自处分甲的财物，甲当然有权要求乙承担违约责任。","k":"","kb":122,"kh":[[353,388]]},{"id":"2014-30","y":2014,"t":"单","s":"甲公司与乙公司签订一设备买卖合同,约定甲公司保留设备所有权直至乙公司付清货款为止。乙公司未付清货款便将该设备转卖给丙公司,但未交货。后乙公司又将该设备以市价转让并交付给不知情的丁公司。本案中的设备所有权应属于（ ）。","o":["甲公司","乙公司","丙公司","丁公司"],"a":"D","e":"\u0001甲保留所有权卖给乙后，乙无权处分转卖丙未交货、再以市价卖并交付不知情的丁公司，丁公司构成动产善意取得。\u0002\nA✗ 虽然甲保留了设备所有权且未办理登记或即使抗辩，但设备已由乙实际占有并被不知情丁公司以市价受让并交付，符合动产善意取得全部要件，甲丧失所有权。\nB✗ 乙尚未付清货款按所有权保留条款本未取得所有权，再售给丁已转移控制权。\nC✗ 丙公司仅与乙订立买卖合同而未受领设备交付，既未继受取得亦不成立善意取得。\nD✓ 丁公司对乙无处分权不知情（善意）、以合理市价有偿购买且已经完成动产现实交付，依《民法典》第311条善意取得该设备所有权。","k":"","kb":122,"kh":[[319,351]]},{"id":"2014-38","y":2014,"t":"单","s":"甲、乙、丙分别购买了某住宅楼(共3层)的一层、二层、三层,各自办理了房产证。现丙欲出售其住宅,对丙出售的住宅（ ）。","o":["仅甲享有优先购买权","仅乙享有优先购买权","甲、乙均享有优先购买权","甲、乙均不享有优先购买权"],"a":"D","e":"\u0001甲、乙、丙分别购买同一楼房的一、二、三层并各自独立办理产权证，属于各自专有所有而非按份共有，出售时其他业主无优先购买权。\u0002\nA✗ 甲并非二、三层专有部分的按份共有人，无权主张优先购买权。\nB✗ 乙对三层同样不享有按份共有份额。\nC✗ 三层之间虽同在一栋楼内构成建筑物区分所有权，但各层房屋专有部分相互独立、分别领证，而非对整栋楼按份共有，互无优先购买权。\nD✓ 优先购买权以存在“按份共有关系”或承租关系等法定基础为前提，建筑物区分专有部分所有权人出售其专有住宅时，其他楼层业主均不享有优先购买权。","k":"","kb":123,"kh":[[428,467]]},{"id":"2015-29","y":2015,"t":"单","s":"下列选项中,属于所有权继受取得方式的是（ ）。","o":["添附","先占","生产","遗赠"],"a":"D","e":"\u0001遗赠是从被继承人处依法移转获得所有权，属于所有权继受取得；添附、先占、生产则属于所有权原始取得。\u0002\nA✗ 添附（附合、混合、加工）依法直接重新确定新物归属，属于原始取得。\nB✗ 先占无主动产不以原所有人意志移转为前提，属于原始取得。\nC✗ 生产制造直接创造新物并原始归属所有，属于原始取得。\nD✓ 遗赠是从原所有人（遗赠人）处基于死因单方行为继受取得财产权。","k":"","kb":122,"kh":[[67,92],[157,184]]},{"id":"2015-31","y":2015,"t":"单","s":"甲上晚自习时拾得一个单反相机,后相机被乙借走。乙看到悬赏200元的寻物启事,未经甲同意将相机还给了失主。下列选项中,正确的是（ ）。","o":["甲、乙均有权要求失主支付报酬","仅甲有权要求失主支付报酬","仅乙有权要求失主支付报酬","甲、乙均无权要求失主支付报酬"],"a":"B","e":"\u0001甲拾得相机后借给乙，乙未经甲同意看见200元悬赏广告后自行交还失主，依真题与传统规则仅原拾得人甲有权请求失主支付报酬。\u0002\nA✗ 悬赏广告的赏金仅支付给合法正当的权利履行主体，不双重向乙给付。\nB✓ 甲系拾得人，乙只是擅自处分借来之物的无权代还人（有违对甲的借用返还义务），依联考标准答案仅拾得人甲有权请求失主支付悬赏报酬。\nC✗ 乙未经原占有人甲允许私自交付非由自己拾得之物，当年真题不赋予乙报酬请求权。\nD✗ 失主既然公开发布悬赏200元广告，物归原主后依法应履行悬赏承诺给付报酬。","k":"","kb":122,"kh":[[479,531]]},{"id":"2015-48","y":2015,"t":"多","s":"甲乙约定,甲租住乙的别墅15年。租赁期间,甲将房屋加高,使邻居丙的房屋采光受到严重影响。对此,丙（ ）。","o":["可以侵害相邻权为由要求甲排除妨碍","可以侵害相邻权为由要求乙排除妨碍","无权要求乙排除妨碍,因为将房屋加高系甲所为","可以侵害建筑物区分所有权为由要求乙排除妨碍"],"a":"AB","e":"\u0001承租人甲加高出租别墅严重影响邻宅丙采光，作为直接实施妨害者甲与房屋所有权人乙均为相邻关系义务主体，丙均可要求其排除妨碍。\u0002\nA✓ 相邻关系主体不仅包括不动产所有权人，也包括合法占有人、使用人（承租人甲），甲直接施工加高致妨碍，丙可请求甲排除妨碍。\nB✓ 乙作为别墅所有权人（出租人）对自有不动产负有相邻容忍与防止危害之法律义务，丙亦可要求所有权人乙排除妨碍。\nC✗ 所有权人乙不能以“房子租出去了系承租人所为”对抗邻居的物权/相邻排除妨碍请求权（乙担责后可依租赁合同向甲追偿违约损失）。\nD✗ 独栋别墅相邻两户之间并非同一栋公寓楼共有体系，适用“相邻权”而非“建筑物区分所有权”。","k":"","kb":124,"kh":[[500,536]]},{"id":"2016-27","y":2016,"t":"单","s":"甲将母亲的骨灰葬于乙村坟地时,将自己的一对手镯随葬。该手镯的所有权属于（ ）。","o":["甲母","甲","乙村","国家"],"a":"B","e":"\u0001甲将随身手镯埋藏随母亲骨灰下葬，仅改变自己财物的存放方式，并未让渡所有权（死者已无权利能力），故手镯仍属甲所有。\u0002\nA✗ 自然人死亡后民事权利能力消灭，不再作为财产权利主体承受所有权；甲亦未生前赠与母亲。\nB✓ 甲对手镯随葬仅是依传统习俗对自有动产作物理埋藏处置，并非向社会公众抛弃所有权，更不可能由逝者取得，故所有权依然属于甲。\nC✗ 墓地所在村集体并未当然取得合法陪葬私人财物的所有权。\nD✗ 该陪葬物有明确已知所有权人甲，并非无主或归国家所有。","k":"","kb":122,"kh":[[109,127]]},{"id":"2016-48","y":2016,"t":"多","s":"下列选项中,可以认定为建筑物区分所有权的业主的有（ ）。","o":["基于租赁合同使用房屋的承租人","依法登记取得建筑物专有部分所有权的人","根据人民法院的生效判决取得建筑物专有部分所有权的人","基于与建设单位之间的商品房买卖合同已合法占有建筑物专有部分的人"],"a":"BCD","e":"\u0001建筑物区分所有权的业主包括依法登记产权人、依法院裁判取得专有权人以及依商品房买卖合同已合法占有专有部分尚未办证的买受人。\u0002\nA✗ 纯基于租赁合同占住房屋的承租人仅享有租赁债权而非专有部分所有权，不能直接认定为业主（只能经业主授权代参部分事务）。\nB✓ 依法在不动产登记簿登记取得专有部分所有权的人是典型的业主。\nC✓ 依据人民法院生效形成判决等非法律行为方式已直接取得建筑物专有部分所有权的人，依法认定为业主。\nD✓ 依据建筑物区分所有权司法解释第1条，基于与开发商签订商品房买卖合同已经合法占有专有部分房屋但尚未办证者，亦可认定为业主。","k":"","kb":124,"kh":[[39,121]]},{"id":"2017-27","y":2017,"t":"单","s":"甲遗失一条项链,被乙拾得。丙从乙处偷走项链,以1万元价格卖给不知情的丁并交付。现该项链的所有权人是（ ）。","o":["甲","乙","丙","丁"],"a":"A","e":"\u0001项链系甲遗失之物（且后又被丙偷走转卖），遗失物不适用一般善意取得制度，且未逾2年回溯期，故现所有权人仍是原失主甲。\u0002\nA✓ 拾得遗失物（以及被盗物）原则上不适用善意取得，丁虽不知情有偿购得且交付仍不能善意取得所有权（甲可自知道受让人起2年内请求返还原物），故所有权人仍为甲。\nB✗ 乙作为拾得人自始仅负保管和返还义务，从未取得项链所有权。\nC✗ 盗窃人丙属非法占有人，既无权亦不可能取得所有权。\nD✗ 虽然丁是善意买受人且付了1万元，但标的物原属遗失物（且涉盗赃转手），依《民法典》第312条丁不能通过善意取得取得所有权。","k":"","kb":122,"kh":[[389,403]]},{"id":"2017-29","y":2017,"t":"单","s":"甲、乙、丙、丁共同出资购买一辆挖掘机，出资比例分别为55%、30%、10%、5%。对该挖掘机的转让（ ）。","o":["甲一人即可决定","甲、乙二人同意即可","经任意三人同意即可","必须经四人一致同意"],"a":"B","e":"\u0001处分按份共有财产需经占份额三分之二以上共有人同意；甲（55%）与乙（30%）合计达85%，超过2/3，两人同意即可转让挖掘机。\u0002\nA✗ 甲仅占55%份额，尚未达到三分之二（约66.7%）以上多数份额门槛，不能一人单独决定。\nB✓ 甲和乙出资份额相加为85%，已达到《民法典》第301条要求的“占份额三分之二以上”，在无相反约定时经甲、乙二人同意即可转让。\nC✗ 若丙（10%）、丁（5%）与乙（30%）三人同意，合计仅占45%份额，达不到三分之二份额要求（法律看“份额比例”而非人头数）。\nD✗ 《民法典》第301条对按份共有采“份额三分之二以上多数决”，无须全体共有人一致同意。","k":"","kb":123,"kh":[[216,273]]},{"id":"2018-37","y":2018,"t":"单","s":"甲、乙、丙三人按35%、55%、10%的份额共有一艘渔船。乙、丙二人均有意卖掉渔船,甲坚决反对, 关于出卖渔船,下列选项正确的是（ ）。","o":["乙有权单独决定出卖渔船","乙、丙未经甲同意无权出卖渔船","乙、丙有权基于多数份额出卖渔船","乙、丙可以根据多数共有人同意出卖渔船"],"a":"B","e":"\u0001出卖按份共有渔船需经占份额2/3以上共有人同意；乙（55%）与丙（10%）合计仅占65%，不足2/3，未经甲同意无权出卖。\u0002\nA✗ 乙虽为最大份额持有人（55%），仍未及2/3门槛，不得单独出卖渔船。\nB✓ 乙、丙合计份额为55%+10%=65%＜66.67%（三分之二），依据《民法典》第301条，未经甲同意不得擅自处分共有渔船。\nC✗ 共有物处分适用“三分之二以上绝大份额多数决”，而非普通简单多数（＞50%）即可处分。\nD✗ 法律规定看重“份额占三分之二以上”而非共有人人头数多数。","k":"","kb":123,"kh":[[274,294]]},{"id":"2019-29","y":2019,"t":"单","s":"甲、乙、丙三人以3:2:1的比例按份共有一头骆驼,用于旅游服务。现甲欲将自己的份额转让给丁,乙、丙均要求以同等条件购买。甲的份额应当（ ）。","o":["由丁购买","由乙、丙等额购买","由甲在乙和丙中指定一人购买","由乙、丙按所持份额比例购买"],"a":"D","e":"\u0001两个以上按份共有人均主张以同等条件行使优先购买权，协商不成的，应当按照转让时各自占有的共有份额比例行使。\u0002\nA✗ 外人丁必须在其他共有人不行使优先购买权时才能受让该份额。\nB✗ 并不是按人数平分等额购买，而是按原持共有份额比例分配购买。\nC✗ 出让人甲不得任意偏袒指定，须依法按份额比例（乙2:丙1）分配购买份额。\nD✓ 依《民法典》第306条第2款，两个以上按份共有人主张行使优先购买权的，协商确定各自购买比例；协商不成的，按照转让时各自的共有份额比例（乙与丙2∶1）行使。","k":"","kb":123,"kh":[[467,507]]},{"id":"2019-47","y":2019,"t":"多","s":"宋某和赵某分别住在同一栋住宅楼的一层和二层。宋某在小区围墙与该楼之间自建平房,给住宅楼造成严重的安全隐患。不久,宋某在平房内开办门窗加工厂,加工生产的噪音严重干扰了赵某的正常生活。对此,赵某有权要求宋某（ ）。","o":["赔礼道歉","消除危险","恢复原状","停止侵害"],"a":"BCD","e":"\u0001邻居自建违章平房造成安全隐患且噪音严重扰民，赵某有权行使物权请求权与相邻关系救济，请求消除危险、恢复原状与停止侵害。\u0002\nA✗ 赔礼道歉主要适用于侵害姓名、名誉等精神性人格权的情形，一般不动产相邻侵害不判赔礼道歉。\nB✓ 违章自建平房给住宅楼造成严重安全隐患，赵某有权请求消除危险。\nC✓ 违法占用公共区域搭建威胁房屋结构安全的违建平房，可依法请求拆除违建并恢复原状。\nD✓ 加工厂持续排放高分贝噪音干扰邻居休息生活，构成正在进行的妨害侵害，有权请求停止侵害。","k":"","kb":124,"kh":[[439,474]]},{"id":"2020-32","y":2020,"t":"单","s":"下列选项中,专属于国家所有的是（ ）。","o":["土地","文物","野生动植物","无线电频谱资源"],"a":"D","e":"\u0001依据《民法典》第252条，无线电频谱资源专属于国家所有；土地、文物、野生动植物并非“一概专属”国家。\u0002\nA✗ 城市土地属国家所有，农村及城市郊区除法律规定属国家所有外属农民集体所有。\nB✗ 仅法律规定属于国家所有的文物才归国家所有，民间合法传世文物可归私人所有。\nC✗ 仅法律规定属于国家所有的珍贵野生动植物资源才属国家所有，人工合法繁育或普通野生动植物并非均专属国家。\nD✓ 《民法典》第252条明文规定：“无线电频谱资源属于国家所有。”该类资源由国家独占专有，任何私人集体不能拥有。","k":"","kb":122,"kh":[[239,290]]},{"id":"2021-26","y":2021,"t":"单","s":"根据我国《民法典》规定,下列由业主共同决定的事项中,应当经参与表决专有部分面积3/4以上的业主且参与表决人数3/4以上的业主同意的是 （ ）。","o":["解聘物业服务企业","制定和修改管理规约","选举业主委员会","筹集建筑物的维修资金"],"a":"D","e":"\u0001《民法典》第278条规定，筹集建筑物及其附属设施维修资金等三类重大事项须经参与表决双3/4以上业主同意，其余事项仅需双过半数。\u0002\nA✗ 选聘和解聘物业服务企业仅须经参与表决面积过半数且人数过半数的业主同意即可。\nB✗ 制定和修改管理规约适用参与表决双过半数同意规则。\nC✗ 选举业主委员会或者更换业委会成员适用参与表决双过半数同意规则。\nD✓ 筹集维修资金涉及业主再次大额出资，依法必须经双2/3以上参与表决，且经参与表决专有面积3/4以上与人数3/4以上同意（注意区分“使用”维修资金仅需双过半数）。\n记法：核心口诀：共有决定先“双2/3参与”；三件大事“筹（筹集维修资金）、建（改建重建）、改（改变用途经营）”须“双3/4同意”，其余全是“双过半”！","k":"","kb":124,"kh":[[305,392]]},{"id":"2023-22","y":2023,"t":"单","s":"某小区住宅楼的电梯间安装了电子广告屏,循环播放各种广告。广告费由物业服务企业收取。在扣除合理成本后,该广告收入属于","o":["业主共有","物业服务企业所有","业主委员会所有","业主与物业服务企业共有"],"a":"A","e":"\u0001利用小区住宅楼电梯间等业主共有部分产生的广告收入，扣除合理成本后依法属于全体业主共有。\u0002\nA✓ 依《民法典》第282条，建设单位、物业服务企业等利用业主共有部分产生的收入，在扣除合理成本之后，属于业主共有。\nB✗ 物业服务企业仅可依约收取必要管理成本或约定的佣金报酬，剩余净收益不得据为己有。\nC✗ 业主委员会是业主大会的执行机构，本身不拥有公共收益的所有权，只受托管理。\nD✗ 该净收益100%归属于全体业主共有，物业并不享有共享所有权。","k":"","kb":124,"kh":[[135,158]]},{"id":"2025-28","y":2025,"t":"单","s":"某住宅楼业主就加装电梯事项依法形成决议,相关建设规划申请获得行政主管部门批准。施工期间,该楼一层业主甲因加装电梯影响房屋采光而坚决反对。对此,下列说法正确的是（ ）。","o":["因甲反对,故加装电梯的决议无效","因甲的房屋采光受影响,故加装电梯的决议无效","加装电梯的决议有效,但应补偿甲的房屋采光受影响的损失","加装电梯已获行政主管部门批准,甲的房屋采光即使受影响也无需补偿"],"a":"C","e":"\u0001业主大会合法表决加装电梯对全体业主有效，且行政规划许可不豁免民事相邻采光补偿责任，应当补偿一层业主甲采光损失。\u0002\nA✗ 老旧小区加装电梯决议只要达到《民法典》第278条法定参与表决双2/3及相应同意比例即合法有效，不因个别少数业主反对无效。\nB✗ 影响一层采光并不导致合法形成的共同表决决议无效，而是由受益业主向受损业主作合理民事经济补偿。\nC✓ 加装电梯决议依法生效必须履行，同时施工加装妨碍低层业主采光的，即使通过规划审批仍应当依法给予甲采光损害补偿。\nD✗ 行政主管部门规划许可仅代表符合公法建筑标准，不能免除加装电梯一方依据《民法典》第293条承担相邻采光补偿的民事责任。","k":"","kb":124,"kh":[[192,250]]},{"id":"2025-32","y":2025,"t":"单","s":"2020 年甲、乙结婚。2021 年乔迁新居时,乙将旧相框卖给丙。丙收到后发现相框内有一个装有价值数千元纪念钞的信封,信封封面写有“甲收藏,2010 年”。该纪念钞应当属于（ ）。","o":["甲所有","丙所有","甲与乙共有","甲与丙共有"],"a":"A","e":"\u0001旧相框夹层内带有甲2010年署名信封的纪念钞属于甲婚前个人所有且未随相框卖出的隐藏物，不适用善意取得，仍归甲所有。\u0002\nA✓ 封面注明2010年甲收藏，证明系甲2020年婚前个人财产；乙不知情而仅出卖旧相框时未形成对内藏纪念钞的买卖合意，加之隐藏物不适用善意取得，纪念钞仍归甲个人所有。\nB✗ 丙购买的仅是旧相框本身，且隐藏物并非物权交易合意移转之标的，不适用善意取得。\nC✗ 婚前个人财产不因结婚而自动转化为夫妻共有财产。\nD✗ 丙未取得纪念钞任何共有份额，归甲一人所有。","k":"","kb":122,"kh":[[532,571]]},{"id":"2026-26","y":2026,"t":"单","s":"甲、乙系同一单元的上下楼邻居,该楼设有从一层到顶层的公共烟道。甲装修房屋时,擅自改动公共烟道,导致乙做饭时无法正常排烟。甲的行为侵害了乙的","o":["专有权,乙有权请求甲消除影响","共有权,乙有权请求甲恢复原状","居住权,乙有权请求甲赔偿损失","共同管理权,乙有权请求甲排除妨碍"],"a":"B","e":"\u0001上下楼共用的楼道公共烟道属于建筑物共有部分，甲擅自改动致使乙无法排烟侵害了乙的共有权，乙有权请求恢复原状。\u0002\nA✗ 公共烟道并非一户专有而是全单元业主共享共有设施，非侵害专有权（且消除影响多适用于精神人格权）。\nB✓ 共用公共烟道归相关业主共有，甲违章改动侵害他方业主对共有部分的合法共用权益，乙可依法请求甲停止侵害、恢复原状。\nC✗ 乙作为房屋业主享有完整所有权/共有权，并非基于他人房子设定的居住权人。\nD✗ 改动共用公共设施主要侵犯业主对共有部分的物权使用权能（共有权），核心直接救济是请求恢复原状、排除妨碍。","k":"","kb":124,"kh":[[159,191]]},{"id":"2026-32","y":2026,"t":"单","s":"甲拾得一块手表,等待片刻未见失主即离开。后甲看到A 商店发布的“收购二手手表”广告,将手表以1000 元的价格卖给A 商店。一年后失主乙偶然在A 商店发现了该手表。对此,下列说法正确的是","o":["乙只能请求甲返还手表","乙无权请求商店返还手表","乙有权请求商店无偿返还手表","乙有权请求商店返还手表,但应支付1000 元"],"a":"C","e":"\u0001拾得人甲将遗失手表卖给“收购二手手表”的A商店，系经营者从无权处分自然人处收购而非失主向商家购买，A商店不满足有偿返还条件，乙可无偿追回。\u0002\nA✗ 虽然无权处分人甲可被追索损害赔偿，但乙也享有直接向现占有人A商店行使返还原物请求权的权利。\nB✗ 遗失物原则上不适用善意取得，失主乙有权自知道或应当知道受让人之日起2年内追回。\nC✓ 《民法典》第312条但书仅保护通过拍卖或“向具有经营资格的经营者购得”的买受人；本案是A商店“向拾得人收购”，故不获费用返还保护，失主乙有权要求商店无偿返还手表。\nD✗ 乙无须支付1000元对价即可直接无偿请求返还（A商店可另向无权处分人甲追究违约/返还货款责任）。\n记法：方向看清！第312条要“消费者去正规店里买”才算；“二手店老板从捡东西的路人手里收赃”不算——失主可白拿回手表！","k":"","kb":122,"kh":[[404,478]]},{"id":"2026-33","y":2026,"t":"单","s":"甲邀请乙聚餐,甲在丙商贩处购买海鲜,乙将海鲜交给饭店烹饪,饭店烹饪时发现其中有一颗珍珠,该珍珠的所有权归属于","o":["甲","乙","丙","饭店"],"a":"A","e":"\u0001甲在丙处购买海鲜且已交付，所含珍珠无论视作天然孳息抑或海鲜自带成分，交付后均归买受人甲所有。\u0002\nA✓ 标的物在买卖交付之后产生的天然孳息或内含附随惊喜物归买受人所有；乙仅受甲邀请赴宴顺手交予后厨烹饪，饭店亦仅系承揽加工烹调方，均不取得珍珠所有权，故珍珠归甲。\nB✗ 乙只是代甲把买好的海鲜转交饭店厨房，并非买受人亦无所有权让与合意。\nC✗ 商贩丙将海鲜卖出并完成现实交付后，已丧失标的物及其附带内生物的所有权与孳息收取权。\nD✗ 饭店受托烹饪收取餐饮加工服务费，对食材及其内含天然珍珠并无所有权或先占取得权。","k":"","kb":122,"kh":[[128,153]]},{"id":"2026-35","y":2026,"t":"单","s":"甲、乙、丙共同出资100 万元购买一块巨型矿石,约定每个人享有权利的份额为1/3。为了增加矿石的价值,甲主张对该矿石进行深加工,乙表示赞成,丙表示反对。下列说法正确的是","o":["甲、乙有权加工矿石,因甲、乙所占份额为2/3","甲、乙仅在购买丙的份额后,才有权加工矿石","甲、乙无权加工矿石,因甲、乙、丙未达成一致","甲、乙仅在分割矿石后,才有权加工矿石"],"a":"A","e":"\u0001按份共有人甲、乙合计持有三分之二（1/3+1/3=2/3）共有份额，符合《民法典》第301条深加工改良矿石的绝对多数门槛。\u0002\nA✓ 对共有物作重大修缮或深加工改变性质用途，依《民法典》第301条经占份额三分之二以上（本案1/3+1/3正好达到三分之二）按份共有人同意即可实施，无需丙同意。\nB✗ 达三分之二共有份额门槛即可依法直接决策改良加工，无须先买下反对者丙的份额。\nC✗ 按份共有不要求“一致同意”（仅共同共有原则上才要求全体共有人一致同意）。\nD✗ 无须先行分割共有物即可依三分之二多数决规则共同加工。","k":"","kb":123,"kh":[[295,318]]}]},{"sub":"刑法","name":"分则·侵犯财产罪","w":1.7,"L":33,"qs":[{"id":"2005-13","y":2005,"t":"单","s":"甲于 2003 年 6 月与乙合谋共同诈骗李某 30000 元,甲乙平分各得 15000 元。在审查本案期间,甲主动交待曾在 1997 年 3 月间诈骗张某 4000 元的犯罪事实。在处罚甲诈骗罪时其犯罪金额应为（ ）。","o":["34000 元","30000 元","19000 元","15000 元"],"a":"B","e":"\u00011997年3月诈骗4000元（最高刑3年、追诉时效5年）至2003年6月已超5年追诉时效不再追诉；共同诈骗3万元按行为人参与共同诈骗的3万元数额处罚（非仅按分赃1.5万）。\u0002\nA✗ 1997年诈骗4000元行为（独立成罪或早年未连续追诉）至2003年已过5年追诉期限不再追诉，不得计入\nB✓ 30000元：共同盗窃或共同诈骗犯罪中，应对各共同犯罪人\u0001按照其所参与的共同诈骗总额（30000元）\u0002认定犯罪数额，而不是仅仅算各自最终分得的15000元\nC✗ 15000元个人分赃加上已过时效的4000元系双重错误\nD✗ 15000元只是个人实际分赃额（个人分赃额用于衡量在共同犯罪中的作用从宽，不代替共同犯罪总金额）","k":"","kb":65,"kh":[[15,83]]},{"id":"2006-15","y":2006,"t":"单","s":"甲,乙二人合谋抢夺财物。一日,甲向一坐在汽车内的妇女假装问路,乙乘该妇女不备,拉开车门,从其手中抢过提包就跑,甲也随即与乙一同逃跑,当场被群众抓获。群众从甲,乙二人身上各搜出一把匕首。甲,乙二人的行为构成（ ）。","o":["盗窃罪","抢夺罪","抢劫罪","诈骗罪"],"a":"C","e":"\u0001甲假装问路吸引注意力、乙拉开车门公然抢夺提包共同逃跑，抓获时在“二人身上各搜出一把匕首”，属于《刑法》第267条第2款“携带凶器抢夺”，以抢劫罪定罪处罚。\u0002\nA✗ 公然从汽车内妇女手中强行一把抢走提包，不是秘密窃取\nB✗ 普通抢夺虽无暴力胁迫，但因二人随身携带凶器（匕首）抢夺，依法直接转化为抢劫罪\nC✓ 抢劫罪：《刑法》第267条第2款明文规定\u0001“携带凶器抢夺的，依照本法第二百六十三条（抢劫罪）的规定定罪处罚”\u0002（不要求在抢夺当场掏出炫耀或实际使用该匕首）\nD✗ 假装问路只是搭话吸引注意力的配合掩护手段，并非骗取被害人自愿交付财物","k":"","kb":59,"kh":[[282,299]]},{"id":"2007-18","y":2007,"t":"单","s":"甲被某国有资本控股的有限责任公司聘用,负责查验出场单、验货放行。甲与无业人员乙串通,趁甲一人值班时, 由乙开车从货场拉出价值 10 万元的货物,并销赃平分。在本案中 （ ）。","o":["甲构成贪污罪,乙构成盗窃罪","甲构成职务侵占罪,乙构成盗窃罪","甲、乙共同构成职务侵占罪","甲、乙共同构成贪污罪"],"a":"C","e":"\u0001国有资本控股公司中的“普通聘用验货放行人员”不具有从事公务的国家工作人员身份，其勾结无业人员利用职务便利窃取货物并分赃，共同构成职务侵占罪。\u0002\nA✗ 仅当人员由国家机关/国有控股企业委派从事公务或受委托经营管理国有财产（如委派高管、国有仓库主任）才算国家工作人员；普通聘用的查验员/保安不属于国家工作人员\nB✗ 内外勾结共同犯罪一般按具有特殊身份的实行犯之罪名（职务侵占罪）统一定罪，乙虽无公司身份但与甲共谋并配合销赃，成立共犯\nC✓ 甲、乙共同构成职务侵占罪：甲非国家工作人员，利用查验放行之非公务性单位职务便利，伙同乙盗窃本单位价值10万元货物占为己有，二人成立\u0001职务侵占罪的共同犯罪\u0002\nD✗ 甲不具备国家工作人员（从事公务）主体资格，不成立贪污罪","k":"","kb":64,"kh":[[28,96]]},{"id":"2007-23","y":2007,"t":"多","s":"下列情形中,应以抢劫罪定罪处罚的有 （ ）。","o":["甲为劫取财物,打死仓库的值班员孙某后,取走价值 10 万元的财物","乙在赵某的茶水中偷偷放入大量安眠药,趁赵某饮后熟睡,拿走赵某 3 万元现金","丙看见刘某因交通事故受伤,趁其昏迷之机,将其携带的现金 2 万元取走","丁乘张某不备,夺取其随身携带的笔记本电脑"],"a":"AB","e":"\u0001为劫财打死值班员后取财（暴力抢劫）及茶水中下安眠药后取财（其他麻醉强制方法抢劫）均属抢劫罪；趁车祸昏迷盗取财物定盗窃罪；抢走手提电脑定抢夺罪。\u0002\nA✓ 打死仓库值班员后劫取10万元财物，属于以暴力手段强行劫取财物，成立\u0001抢劫罪\u0002\nB✓ 在赵某茶水中偷偷放入大量安眠药使其昏睡后拿走现金，属于抢劫罪的\u0001“其他方法”\u0002（使被害人不知/不能反抗而取财）\nC✗ 被害人因车祸自己昏迷而非行为人故意致其昏迷，行为人趁机取走其身边现金属于\u0001盗窃罪\u0002（注意：若直接取走脱离占有或遗落路旁则可能是侵占，但贴身携带的现金仍属被害人占有下定盗窃）\nD✗ 趁人不备一把夺取笔记本电脑而未使用暴力威胁人身或凶器，构成\u0001抢夺罪\u0002","k":"","kb":59,"kh":[[15,34]]},{"id":"2008-19","y":2008,"t":"单","s":"甲见候车室的椅子上坐着一女子和一男子,他们面前放着一手提箱,男子在睡觉,女子在看报。甲以为手提箱是该男子的,遂提一只相同的手提箱走上前去,将手提箱互换,被女子发现。手提箱实际上是该女子的,她一直在紧盯着这只箱子。箱内财物计人民币 4000 元。甲的行为构成（ ）。","o":["盗窃罪","诈骗罪","抢夺罪","侵占罪"],"a":"A","e":"\u0001主观以为没人看管而“自以为秘密”走上前调包手提箱，即使客观上正被箱主紧盯且当场发现，只要主客观采用的是调包而非公然抢夺或暴力，依然认定为盗窃罪。\u0002\nA✓ 盗窃罪：盗窃罪所要求的“秘密窃取”具有主观性与相对性——只要甲\u0001自认为采取了不被他人发觉的和平调包方式\u0002非法占有他人财物，即使事实上已被物主紧盯发现，依然构成盗窃罪（未遂/既遂视是否控制财物）\nB✗ 并无任何欺骗行为使女方自愿交付箱子，不是诈骗罪\nC✗ 抢夺罪须是明知物主看见而公然强行夺取；甲自以为神不知鬼不觉偷偷互换相同手提箱，不是抢夺\nD✗ 箱子一直在女子实际看管支配之下，并非代为保管物或遗忘物","k":"","kb":61,"kh":[[82,125]]},{"id":"2009-15","y":2009,"t":"单","s":"甲、乙二人共同盗窃一辆价值20万元的汽车销赃得款6万元，甲分得5万元，乙分得1万元。关于此案，下列说法中正确的是（ ）。","o":["对甲、乙均应按照盗窃 20 万元处罚","对甲、乙均应按照盗窃 6 万元处罚","对甲按照盗窃6万元、乙按照盗窃1万元处罚","对甲按照盗窃5万元、乙按照盗窃1万元处罚"],"a":"A","e":"\u0001共同盗窃价值20万元汽车而仅低价销赃6万元，两共犯均应按照所参与盗窃财物的实际客观价值（20万元）定罪处罚，而非仅以销赃获利（6万）或各自分赃（5万/1万）计。\u0002\nA✓ 对甲、乙均应按照盗窃20万元处罚：两项重要准则叠加——①盗窃罪数额按\u0001被盗财物的实际客观有效价格（20万元）\u0002计算，不以廉价销赃得款（6万元）计；②共同犯罪各共犯按\u0001共同参与盗窃总价值\u0002负责\nB✗ 销赃所得6万元远低于车辆20万元正常市场价值，不能只按销赃额计算\nC✗ 既误用销赃额6万又错误将乙仅按个人分赃1万定额\nD✗ 各按分赃5万和1万处罚严重违背共同犯罪“部分实行全部责任”原则与财物客观价值原则","k":"","kb":61,"kh":[[204,221],[253,281]]},{"id":"2009-23","y":2009,"t":"多","s":"下列犯罪行为中,应以盗窃罪追究刑事责任的是（ ）。","o":["盗窃信用卡后冒名使用的","盗窃毒品后自己食用的","盗窃商业秘密再出卖的","盗窃增值税专用发票后出卖的"],"a":"ABD","e":"\u0001盗窃信用卡并使用（第196条）、盗窃增值税专用发票等用于抵扣退税发票（第210条）、盗窃毒品自己吸食（按财物/违禁品价值盗窃论），均以盗窃罪追究；盗窃商业秘密出卖定侵犯商业秘密罪。\u0002\nA✓ 《刑法》第196条第3款明确规定：\u0001盗窃信用卡并使用的，依照本法第264条（盗窃罪）的规定定罪处罚\u0002\nB✓ 司法解释明确盗窃毒品等违禁品自己吸食而未贩卖的，依然以\u0001盗窃罪\u0002定罪处罚（以被盗毒品毒资或一般估价及数量情节衡量）\nC✗ 《刑法》第219条明确将“以盗窃、贿赂、欺诈、胁迫、电子侵入或者其他不正当手段获取权利人的商业秘密”直接规定为\u0001侵犯商业秘密罪\u0002（不再按一般盗窃罪）\nD✓ 《刑法》第210条第1款明确规定：\u0001盗窃增值税专用发票或者可以用于骗取出口退税、抵扣税款的其他发票的，依照本法第264条（盗窃罪）的规定定罪处罚\u0002","k":"","kb":61,"kh":[[286,371]]},{"id":"2010-13","y":2010,"t":"单","s":"下列行为中,应当以盗窃罪定罪处罚的是（ ）。","o":["甲窃取他人信用卡并使用,数额巨大","乙谎称张三委托其保管的名贵字画被盗,将该字画据为己有","丙多次潜入陵园窃取骨灰","丁捡到信用卡后,在柜台上试验密码取款,数额较大"],"a":"A","e":"\u0001注意《刑法》第196条第3款的法律拟制：盗窃“信用卡并使用的”，不以信用卡诈骗罪论处，一律依照第264条盗窃罪定罪处罚！\u0002\nA✓ 甲窃取他人信用卡并使用，数额巨大：尽管刷卡或ATM取款看似针对机器/商户“冒用”，但因为卡片源头系“秘密盗窃”得来，《刑法》第196条第3款特别拟制规定直接定\u0001盗窃罪\u0002\nB✗ 将原本合法代为保管的他人字画非法占为己有并谎称失窃拒不退还，构成\u0001侵占罪\u0002\nC✗ 逝者骨灰属于具有特定人格精神纪念象征的物体而非一般市场交易经济财物，私自盗取骨灰一般不成立盗窃罪（视情节可能涉及侮辱尸体罪等；若敲诈家属才另定敲诈勒索罪）\nD✗ “捡拾”（拾得）他人遗失信用卡并在柜台/ATM试验密码取款，因最初卡片并非偷窃得来，属于《刑法》第196条第1款第3项“冒用他人信用卡”，定\u0001信用卡诈骗罪\u0002\n记法：拿卡方式决定罪名：偷来刷 ＝ 盗窃罪（第196条第3款）；捡来、骗来刷 ＝ 信用卡诈骗罪（冒用他人信用卡）。","k":"","kb":61,"kh":[[286,305],[347,356]]},{"id":"2011-20","y":2011,"t":"单","s":"甲在商场看中一块价值2万元的手表,便以选购手表为名,要售货员将手表拿来看看。甲在接到售货员递过来的手表后立即逃走。甲的行为构成 （ ）。","o":["抢夺罪","诈骗罪","侵占罪","盗窃罪"],"a":"A","e":"\u0001假装选购名表接过售货员递过的手表后当场撒腿逃走，售货员目睹财物仍在店铺营业即时管控之下，属于公然趁人不备强行拿走而逃，构成抢夺罪。\u0002\nA✓ 抢夺罪：售货员将手表递交试看并未转移所有权或长期实际支配，手表仍在店员实时近距离控制监督中；甲接过手表立即拔腿飞奔逃走属于\u0001明知被害人知情且在场，公然趁人不备夺取后逃离\u0002，定抢夺罪\nB✗ 店员并没有基于错误认识自愿处分转移手表所有权，仅仅是给顾客短暂递过看一下\nC✗ 短暂当场试看试戴并未在法律上形成独立“代为保管”委托占有关系，不构成侵占罪\nD✗ 甲并非乘售货员毫无察觉偷偷装袋拿走，而是接过手后当面公然狂奔逃窜，是“抢夺”而非“盗窃”","k":"","kb":63,"kh":[[15,49]]},{"id":"2012-17","y":2012,"t":"单","s":"甲以迷信方式恐吓刘某有灾祸,刘某一时慌乱,请甲帮助自己。甲让刘某带10万元现金作“镇邪物”,找法师”消灾 \"。途中,甲趁帮刘某拿包之机,用书本调换了10万元现金。甲的行为构成（ ）。","o":["盗窃罪","诈骗罪","侵占罪","敲诈勒索罪"],"a":"A","e":"\u0001谎称迷信带现金“消灾”途中趁帮拿包之机暗中用书本“调包”窃取10万元现金，被害人自始至终并无将10万元交给甲的意思，而是秘密窃取（盗窃罪）。\u0002\nA✓ 盗窃罪：虽然甲一开始说了迷信谎话诱使刘某带现金，但刘某只是让甲“顺手帮拎包”，绝对没有自愿放弃或处分10万元现金；甲趁其不备\u0001暗中用书本调包窃取\u0002，完全符合盗窃罪特征\nB✗ 区分调包盗窃与诈骗的关键看被害人是否\u0001基于错误认识自愿处分转移财物占有\u0002：调包案中被害人以为钱还在自己包里，毫无交付之意，因此是盗窃而非诈骗\nC✗ 帮拎包走在身旁不形成独立控制支配权（钱仍在包主严密监视下），亦非合法持有后拒不返还\nD✗ 甲并未对刘某施加胁迫索财，仅是恐吓有灾祸顺势诱其带钱后暗中调包","k":"","kb":61,"kh":[[127,133]]},{"id":"2013-43","y":2013,"t":"多","s":"甲于深夜到某办公大楼行窃时,被保安王某发现,王某拦住甲,甲将王某打昏,致其轻伤,随后逃跑。甲的行为应认定为（ ）。","o":["入户盗窃","犯罪既遂","故意伤害罪","抢劫罪"],"a":"BD","e":"\u0001在办公大楼行窃（非“户”）被保安发现拦住后为抗拒抓捕将保安打昏致轻伤逃跑（一分未盗走），依第269条转化为抢劫罪，且致人轻伤以上即已成立抢劫罪既遂。\u0002\nA✗ “办公大楼”属于工作营业办公场所而非供家庭日常生活起居的“户”，不构成入户盗窃/入户抢劫\nB✓ 犯罪既遂：依据抢劫罪司法解释，抢劫行为不论是否实际取得财物，只要\u0001造成被害人轻伤以上伤害或者劫得财物二者之一\u0002，即成立抢劫罪既遂（保安被打成轻伤故已既遂）\nC✗ 将保安打成轻伤正是第269条转化型抢劫的构成暴力手段，被抢劫罪直接评价（未达重伤死亡以外普通轻伤不单定故意伤害罪）\nD✓ 抢劫罪：先犯盗窃罪，为\u0001抗拒抓捕\u0002而当场使用暴力将保安打昏致轻伤，符合《刑法》第269条转化型抢劫罪的全部法定条件","k":"","kb":59,"kh":[[114,140],[219,272]]},{"id":"2014-16","y":2014,"t":"单","s":"甲路过某饭馆时见万某酩酊大醉，便冒充万某的朋友上前将其扶走，到一偏僻的地方后，将万某随身携带的价值5000元的财物全部取走。甲的行为构成（ ）。","o":["盗窃罪","诈骗罪","侵占罪","抢劫罪"],"a":"A","e":"\u0001见万某酩酊大醉便冒充其朋友将之扶至偏僻处暗自拿走随身5000元财物，系乘醉酒被害人失去反抗能力之机秘密拿取财物（且非自己灌醉），构成盗窃罪。\u0002\nA✓ 盗窃罪：万某本身已醉酒昏睡，甲\u0001乘其不知情或丧失知觉之机取走其随身携带财物\u0002（并非甲故意灌醉），也不存在欺骗万某自愿交财或当场暴力强制，成立盗窃罪\nB✗ 路旁围观群众哪怕信了甲自称“朋友”，也不是“受骗处分财产的被害人或授权代管人”；万某更是处于昏醉状态无法作出任何基于误认的处分意思\nC✗ 扶人并非依法享有财物保管权，随身财物在醉酒者身上仍归其个人控制，乘昏取财属盗窃而非侵占\nD✗ 只有\u0001行为人自己采取下药、劝酒灌醉\u0002等手段致使被害人不知反抗而取财的，才定抢劫罪；趁他人自己早已醉倒昏睡拿取财物定盗窃罪","k":"","kb":61,"kh":[[145,152]]},{"id":"2014-18","y":2014,"t":"单","s":"甲乘杨某不备,用木棍将其打昏后,搜遍杨某全身,未得分文。经鉴定,杨某为轻伤。对甲的行为应认定为（ ）。","o":["抢劫罪(未遂)","抢劫罪(既遂)","故意伤害罪","抢劫罪(未遂)和故意伤害罪"],"a":"B","e":"\u0001用木棍打昏被害人搜身未得分文但被害人经鉴定为轻伤，抢劫罪已致被害人轻伤以上伤害结果，依法成立抢劫罪（既遂）。\u0002\nA✗ 若未抢得财物且未致任何人轻伤以上才定未遂；本案已经致被害人“轻伤”，达到法定危害后果故既遂\nB✓ 抢劫罪（既遂）：最高法司法解释明确抢劫罪既遂标准包括“劫得财物”或“\u0001造成被害人轻伤以上伤害\u0002”二者之一，只要造成轻伤即使分文未抢到也构成抢劫罪既遂\nC✗ 甲打昏搜身的目的是非法劫取财物，暴力手段被抢劫罪吸收，定抢劫罪而非单纯故意伤害罪\nD✗ 殴打行为是抢劫罪内在客观要件手段，不会拆分成抢劫未遂和故意伤害罪数罪并罚","k":"","kb":59,"kh":[[114,155]]},{"id":"2015-9","y":2015,"t":"单","s":"某私营健身机构经理安排会计甲将收取的50 万元会员费存人甲的存折,供单位日常开支。三个月后, 甲取走存折中全部资金潜逃。甲的行为构成（ ）。","o":["盗窃罪","职务侵占罪","侵占罪","挪用资金罪"],"a":"B","e":"\u0001私营健身机构会计甲利用管理经手单位会员费之便（经经理安排存入甲名下专用开支存折），三个月后取走全部50万元潜逃，构成职务侵占罪。\u0002\nA✗ 甲作为公司会计合法经手并保管单位50万元日常开支专用经费，系利用工作职务便利非法占有单位资金，非普通外部盗窃\nB✓ 职务侵占罪：私营企业工作人员利用经手保管、支取本单位公款的\u0001职务便利\u0002，将本单位巨额资金占为己有并潜逃，完全符合《刑法》第271条\u0001职务侵占罪\u0002\nC✗ 利用单位赋予的职务便利占为己有的是职务侵占罪，而非一般公民之间的普通侵占罪\nD✗ 甲卷走全部50万元直接“潜逃”，主观上明显具有永久非法占有而非“临时挪用归还”之故意，定职务侵占罪而非挪用资金罪","k":"","kb":64,"kh":[[10,15]]},{"id":"2015-18","y":2015,"t":"单","s":"甲冒充公安干警，将正在赌博的张某等四人用手铐铐住，拿走其赌资及随身携带的财物2万余元。甲的行为应认定为（ ）。","o":["诈骗罪","抢劫罪","招摇撞骗罪","敲诈勒索罪"],"a":"B","e":"\u0001冒充公安干警以手铐铐住正在赌博人员（对人身实施实际暴力强制控制）并强行拿走赌资及随身财物2万余元，符合司法解释“使用暴力”，定抢劫罪。\u0002\nA✗ 拿出手铐强行铐住被害人并取走财物依靠的是强制人身压制而非单纯骗取自愿交付\nB✓ 抢劫罪：最高法司法解释明确，行为人冒充人民警察“抓赌”“抓嫖”并\u0001使用暴力或暴力威胁\u0002（如用手铐直接铐住限制人身自由强行劫走赌资及随身财物）的，直接以\u0001抢劫罪\u0002定罪处罚\nC✗ 若仅仅冒充警察口头“罚款/没收赌资”而未使用暴力或暴力威胁，才以招摇撞骗罪从重处罚；一旦使用手铐强行押控，即升级为抢劫罪\nD✗ 敲诈勒索一般适用于冒充联防队员等非警察人员且未使用直接物理暴力强劫的场合","k":"","kb":63,"kh":[[194,227]]},{"id":"2015-19","y":2015,"t":"单","s":"甲在医院缴费单上加盖自己私刻的收费章, 逃避支付妻子透析治疗费用17万余元。甲的行为（ ）。","o":["按诈骗罪定罪处罚","按伪造事业单位印章罪定罪处罚","按合同诈骗罪定罪处罚","成立紧急避险"],"a":"A","e":"\u0001在医院缴费单上私刻并加盖伪造医院收费章以骗免17万余元医疗费，同时触犯伪造事业单位印章罪与诈骗罪，属手段与目的的牵连犯，择一重罪定诈骗罪。\u0002\nA✓ 按诈骗罪定罪处罚：通过私刻加盖虚假医院收费章欺骗医院财务结算人员，骗免（逃避支付）巨额透析治疗费用17万余元，属以欺骗方法非法占有财产性利益构成\u0001诈骗罪\u0002；其私刻印章行为是手段，与目的罪诈骗罪成立\u0001牵连犯\u0002，从一重罪按诈骗罪（17万元数额巨大，3–10年）定罪处罚\nB✗ 伪造事业单位印章罪法定最高刑仅3年有期徒刑，远远轻于诈骗17万元“数额巨大”（3年以上10年以下）的法定刑\nC✗ 医疗治疗服务消费纠纷未通过商业贸易合同形式骗取，不属于《刑法》第224条合同诈骗罪\nD✗ 法律绝不允许以伪造印章诈骗医疗机构17万元费用的犯罪方式进行所谓紧急避险","k":"","kb":62,"kh":[[182,209]]},{"id":"2016-4","y":2016,"t":"单","s":"下列行为可以构成犯罪的是（ ）。","o":["参加传销组织","多次敲诈勒索他人财物","雇用童工清理客房","拐卖15周岁的男孩"],"a":"B","e":"\u0001《刑法》第274条明确规定“敲诈勒索公私财物，数额较大或者\u0001多次敲诈勒索\u0002的”即构成犯罪！其余三项均因不达法定犯罪构成（普通传销参与者不处罚、童工已满16不属童工且普通清洁客房非危重劳动、15岁男孩已满14不属拐卖儿童对象）而不构成犯罪！\u0002\nA✗ 《刑法》第224条之一明确仅打击传销活动的“\u0001组织者、领导者\u0002”；普通一般“参加传销组织”的被骗底层参与者不构成犯罪\nB✓ 多次敲诈勒索他人财物：《刑法修八》增设了“多次敲诈勒索”（一般指二年内三次以上），即使每次索要金额不大未达数额较大，只要“多次”实施即可直接成立\u0001敲诈勒索罪\u0002\nC✗ 《刑法》第244条之一“雇用童工从事危重劳动罪”不仅要求雇用未满16周岁未成年人，而且必须从事\u0001超强度体力劳动、高空、井下作业或者在爆炸性、易燃性、放射性、毒害性等危险环境下\u0002劳动；清理普通酒店客房显然不属于“危重劳动”，不构成犯罪（由劳动部门行政处罚）\nD✗ 《刑法》第240条拐卖妇女、儿童罪中，“儿童”指不满\u000114周岁\u0002的男女（14岁以上女性归为“妇女”）；而“15周岁的男孩”既不是妇女也不是不满14周岁的儿童，且题干未说其他强迫劳动或拘禁情节，单纯依拐卖儿童罪条文不构成犯罪","k":"","kb":63,"kh":[[51,101]]},{"id":"2016-7","y":2016,"t":"单","s":"甲、乙二人驾驶摩托车夺取吴某挎包,因车速过快将吴某带倒,致其重伤。甲、乙的行为应认定为（ ）。","o":["抢夺罪","故意伤害罪","抢劫罪","抢夺罪和过失致人重伤罪"],"a":"C","e":"\u0001驾驶摩托车高速“飞车抢夺”挎包并将被害人拖倒致其重伤，驾驶高速车辆强行拽夺必然伴有致人倒地伤亡重大危险且放任重伤发生，司法解释明确直接以抢劫罪定罪处罚。\u0002\nA✗ 虽然一开始出于“夺取”心态，但驾驶摩托车在高速行驶下强拉硬拽挎包极易将被害人拉倒碾压致重伤死亡，且已经造成重伤，不再仅定抢夺罪\nB✗ 夺取挎包目的在于非法占有他人财物，不是纯粹发泄伤害身体，不应降格只定故意伤害罪\nC✓ 抢劫罪：最高法《抢劫抢夺意见》明文规定，行为人\u0001明知其驾驶车辆强行夺取他人财物的手段会造成他人伤亡的后果，仍然强行夺取并放任造成财物持有人轻伤以上后果的\u0002，以抢劫罪定罪处罚\nD✗ 直接适用上述司法解释认定抢劫罪一罪，不拆成抢夺与过失重伤数罪并罚\n“飞车抢夺”定性速记：\n只要\u0001驾驶机动车/摩托车强行抢夺并致使被害人轻伤以上后果\u0002，哪怕未动刀枪，均按\u0001抢劫罪\u0002定罪处罚！","k":"","kb":66,"kh":[[23,28]]},{"id":"2016-17","y":2016,"t":"单","s":"下列表述中,符合我国刑法关于盗窃罪规定的是（ ）。","o":["在长途汽车上显露匕首后窃取财物的,属于携带凶器盗窃","在公共场所窃取他人所穿衣服口袋内财物的, 属于扒窃","一年之内在公共场所扒窃两次的,属于多次盗窃","进入宾馆客房窃取财物的,属于入户盗窃"],"a":"B","e":"\u0001在公共场所窃取他人所穿衣服口袋内财物属于扒窃（不要求数额较大）；盗窃三次需“二年内”；宾馆客房是否入户一般不认为；“携带凶器盗窃”只须携带即可（不必显露，显露往往定抢劫）。\u0002\nA✗ 携带凶器盗窃只要求行为人随身携带凶器暗中窃取即可；如果在盗窃现场公然\u0001“显露匕首”\u0002向被害人施加心理强制威胁取财，可能直接升级为\u0001抢劫罪\u0002\nB✓ 在公共场所窃取他人所穿衣服口袋内财物的，属于扒窃：完全符合两高《盗窃解释》第3条“在公共场所或者公共交通工具上盗窃他人随身携带的财物的，应当认定为扒窃”\nC✗ 两高《盗窃解释》规定“\u0001二年内盗窃三次以上\u0002的，应当认定为多次盗窃”，并非两次\nD✗ 一般正常营业接待旅客临时住宿的\u0001宾馆客房\u0002不具有“供家庭生活”属性，不属于“入户盗窃”的“户”","k":"","kb":61,"kh":[[158,199]]},{"id":"2016-43","y":2016,"t":"多","s":"下列选项中,应以故意毁坏财物罪定罪处罚的有（ ）。","o":["甲发现所盗手表是仿制品,将其丢弃","乙偷开朋友的摩托车,导致车辆丢失","丙为泄愤,将多辆大货车中的柴油偷偷放掉","丁到某办公室盗窃时未发现现金,遂砸毁办公室内多台电脑"],"a":"CD","e":"\u0001为泄愤偷放掉多辆大货车内的柴油（财物效用灭失）、因未偷到现金怒砸办公室内多台电脑，均构成故意毁坏财物罪；丢弃已窃仿表是事后不可罚；偷开摩托不慎丢失无毁坏故意。\u0002\nA✗ 盗窃手表后发现系仿品并将其扔掉，是对自己所盗之物的后续处分，属于盗窃罪的\u0001事后不可罚行为\u0002，不另构成故意毁坏财物罪\nB✗ 乙偷开摩托车只想兜风使用（无毁坏故意），后不慎丢失属于过失丢失，而过失毁坏他人财物不构成故意毁坏财物罪\nC✓ 丙为泄愤将多辆大货车的柴油偷偷放空流光，彻底灭失了他人柴油财物使用价值，构成\u0001故意毁坏财物罪\u0002\nD✓ 丁盗窃未果恼羞成怒，故意将办公室多台电脑砸毁，具有明确破坏毁损他人财物故意及重大损害，构成\u0001故意毁坏财物罪\u0002","k":"","kb":63,"kh":[[122,167]]},{"id":"2017-45","y":2017,"t":"多","s":"下列选项中,应认定为诈骗罪的有（ ）。","o":["甲伪造名画,冒充真迹卖给他人","乙设立赌博网站,招揽小学生参与赌博","丙用冰糖冒充冰毒卖给他人，获利4000元","丁用短信将邻居从家中骗出,趁机进入邻居家拿走1万元现金"],"a":"AC","e":"\u0001伪造名画冒充真迹高价卖出、用冰糖冒充冰毒售卖获利4000元（虚构根本不是毒品的假物品骗钱），均成立诈骗罪；开设赌博网站定开设赌场罪；骗出邻居再入屋偷钱定入户盗窃罪。\u0002\nA✓ 用自己伪造的赝品名画冒充名家真迹骗取他人大额钱款，属于典型的虚构事实骗财，成立\u0001诈骗罪\u0002\nB✗ 设立赌博网站、招揽人员参赌牟利构成《刑法》第303条第2款\u0001开设赌场罪\u0002\nC✓ 用普通冰糖冒充高价毒品“冰毒”出售给他人骗取4000元（数额较大），因为购买者交付钱款完全基于误以为买的是毒品，丙无毒而骗钱构成\u0001诈骗罪\u0002（不构成贩卖毒品罪）\nD✗ 用假短信调虎离山把邻居骗出门，随后自己秘密潜入邻居家里拿走现金，被害人并非自愿把钱送给丁，丁成立\u0001盗窃罪（入户盗窃）\u0002","k":"","kb":62,"kh":[[164,181]]},{"id":"2018-3","y":2018,"t":"单","s":"下列情形,应当认定为是入户抢劫的是（ ）。","o":["甲冒充煤气抄表员进入受害人家中实施抢劫","客户服务员乙进入客人入住的酒店房间实施抢劫","丙入户盗窃后将追赶的失主在公寓楼道内打成重伤","丁在房屋中介人员带领其进入他人居住的出租房内查看时发现贵重财物,实施抢劫"],"a":"A","e":"\u0001冒充煤气抄表员以骗开门锁方式非法进入他人家庭住所实施抢劫，进户前即怀抢劫恶意且针对“户”（私人居住住宅），成立“入户抢劫”。\u0002\nA✓ 冒充煤气抄表员进入受害人家中实施抢劫：虽表面敲门让主人开门，但自始以实施抢劫等违法犯罪为目的骗开他人家庭生活住所大门进入抢劫，完全符合最高法解释的\u0001入户抢劫\u0002要件\nB✗ 酒店客房原则上属于营业性临时旅宿服务房间而非私人家庭住所，且酒店服务员一般具有进入清理权限，通常不认定为“入户抢劫”\nC✗ 转化型入户抢劫要求“当场使用暴力或者以暴力相威胁”也必须发生在\u0001户内\u0002；丙已经逃出户到了公共“公寓楼道内”才打伤追赶的失主，仅属一般转化抢劫罪而非“入户抢劫”\nD✗ 丁是随房屋中介合法看房正常获准进门，进入时并无抢劫目的（临时在户内发现财物起意），司法解释明确“因正常访问/看房合法进户后临时起意在户内抢劫的，不认定为入户抢劫”","k":"","kb":60,"kh":[[75,182]]},{"id":"2018-6","y":2018,"t":"单","s":"下列选项中,应认定为敲诈勒索罪的是（ ）。","o":["冒充人民警察敲诈他人巨额财物","敲诈勒索亲属财物但获得对方谅解","以在网上发帖相要挟获得职务晋升","以公开不雅视频相要挟向他人借巨款后无力偿还"],"a":"A","e":"\u0001冒充人民警察敲诈他人巨额财物同时涉敲诈勒索与招摇撞骗，想象竞合从一重罪定敲诈勒索罪（招摇撞骗重仅3-10年而巨额敲诈10年以上）；亲属谅解或要求晋升或借钱不还皆非敲诈。\u0002\nA✓ 冒充人民警察敲诈他人巨额财物：既有冒充警官招摇撞骗手段又有威胁恐吓索要“巨额财物”的敲诈勒索特征，在非当场抓赌暴力强劫下同时触犯招摇撞骗罪与敲诈勒索罪，巨额敲诈罪法定刑更重（十年以上），按\u0001敲诈勒索罪\u0002定罪处罚\nB✗ 司法解释明确规定，敲诈勒索近亲属财物并\u0001获得对方谅解\u0002的，一般不认为是犯罪（即使认为构成也一般不作为犯罪处理）\nC✗ 敲诈勒索罪要求非法占有“公私财物”，要挟获得“职务晋升”不属于财产性利益，不构成敲诈勒索罪\nD✗ 仅仅以不雅视频要挟向他人“借款”且写明借条、准备后续偿还，事后客观无力偿还的，缺乏永久非法占有他人财物之目的，原则上不以敲诈勒索罪论处","k":"","kb":63,"kh":[[68,101]]},{"id":"2018-14","y":2018,"t":"单","s":"甲破解了张某的股票账户密码,偷偷登录账户买卖股票练手,案发时造成张某股票账户资金实亏 15 万元,甲的行为应认定为（ ）。","o":["盗窃罪","非法经营罪","故意毁坏财物罪","非法侵入计算机信息系统罪"],"a":"C","e":"\u0001破解密码擅自登录他人股票账户盲目买卖股票“练手”（并无把股票资金转入自己账户的非法占有目的），明知乱操作必致亏空仍放任导致他人实亏15万元，定故意毁坏财物罪。\u0002\nA✗ 甲并没有将张某证券账户资金转走据为己有，而是自己在原账户内“练手”瞎买瞎卖，缺乏非法占有目的，不成立盗窃罪\nB✗ 擅自侵入个人股票交易账号买卖不属非法经营罪列明的特定特许经营活动\nC✓ 故意毁坏财物罪：明知自己毫无投资能力乱买乱卖极可能导致张某账户巨额缩水却放任不管，客观造成账面价值实际亏空15万元，在刑法上等同于毁损灭失财产价值，构成\u0001故意毁坏财物罪\u0002\nD✗ 《刑法》第285条第1款非法侵入计算机信息系统罪仅限侵入\u0001国家事务、国防建设、尖端科学技术领域\u0002的计算机信息系统，普通民用股票交易账户不在此列","k":"","kb":63,"kh":[[168,186]]},{"id":"2018-17","y":2018,"t":"单","s":"甲在候车室以需要紧急联络为由，向赵某借得高档手机，边打电话边向候车室外移动，出门后拔腿就跑，已经有所警觉的赵某猛追未果。甲的行为认定为（ ）。","o":["抢夺罪","盗窃罪","侵占罪","抢劫罪"],"a":"B","e":"\u0001以急用打借口借得被害人手机“边打电话边往候车室外走”，一出门立刻拔腿飞跑（物主就在现场紧盯并立刻发现猛追），不属秘密也非公然抢走前移出，实务经典定盗窃罪（利用瞬间物理移动控制转移）。\u0002\nA✗ 甲并非以突发暴力硬抢动作当场夺过手机，而是假借通话逐步自然走离，物主最初允许拿在手里\nB✓ 盗窃罪：甲趁赵某放松警觉之际先假意握着手机站在当场，然后悄然往门口挪动并在脱离主人控制范围瞬间逃逸，属于\u0001在物主在场情况下采取自以为隐蔽或顺手转移控制权的手段非法占有\u0002，当年最高法及真题统一认定构成盗窃罪（而非诈骗罪，因赵某仅仅允许就地打电话而毫无交付处分手机所有权的意思）\nC✗ 手机主人就在几步之外目视监督，赵某从未把手机交托甲“代为保管”\nD✗ 全程未对赵某使用暴力、胁迫或任何压制反抗手段，不是抢劫罪","k":"","kb":61,"kh":[[134,144]]},{"id":"2020-17","y":2020,"t":"单","s":"甲从王某处借得一辆价值10万元的竞赛用自行车,因急需用钱,甲将该车质押给典当行,得款6 万元。在王某索要时,甲无力赎回该车,又向李某借得一辆价值15万元的竞赛用自行车,将该车质押给同一典当行,得款10万元后赎回王某的自行车。甲将自行车交还给王某后潜逃,导致李某的自行车质押期满未赎。甲诈骗的金额为（ ）。","o":["6万元","10万元","15万元","25万元"],"a":"C","e":"\u0001初借10万车时无非法占有目的（急用典当不构诈骗），后被催讨无力赎车再借李某价值15万的自行车去典当得款10万赎回前车并潜逃，后一借车行为成立诈骗罪，金额按骗取的15万元自行车全值计算。\u0002\nA✗ 6万元只是质押第一辆车给典当行得到的抵押款，当时借车亦无诈骗犯罪故意\nB✗ 10万元是质押李某自行车套现出来的典当款，但诈骗罪是对\u0001被害人李某\u0002成立，被害人损失的是价值15万元的自行车本身而非10万典当借款\nC✓ 15万元：只有明知无力归还仍虚构事由向李某借车去典当潜逃时才成立诈骗罪（典当行若不知情虽也受损失但实务与真题聚焦借李某车所骗财物客观价值），诈骗罪犯罪数额按被骗车辆市场价值\u000115万元\u0002计算\nD✗ 向王某借价值10万自行车时甲确系临时急用周转、尚无非法占有目的，不计入诈骗数额（否则10+15=25万为错项）","k":"","kb":62,"kh":[[109,162]]},{"id":"2021-15","y":2021,"t":"单","s":"甲到某银行办理业务,发现李某使用ATM机后忘记拔卡,遂用李某的银行卡连续取现共计1.2万元。李某收到取款提示短信后返回,要求正在取款的甲交还钱款,甲转身逃跑,并将尾随追赶的李某打成轻微伤。甲的行为应认定为（ ）。","o":["盗窃罪","信用卡诈骗罪","抢劫罪","侵占罪"],"a":"C","e":"\u0001利用他人在ATM机上遗忘未拔出的银行卡连续取款1.2万元（冒用他人信用卡，构信用卡诈骗罪），随即在被发现追讨要求返还时，为窝藏赃物抗拒抓捕而当场逃跑并将追赶的卡主打伤——适用《刑法》第269条转化型抢劫罪！\u0002\nA✗ 卡片系被害人李某自己插在机器中忘记拔出，甲并未从李某口袋秘密偷卡，原本是信用卡诈骗罪而非盗窃罪\nB✗ 单纯取款1.2万元时确已成立\u0001信用卡诈骗罪\u0002，但随后在李某当场追赶交还时实施暴力将其打成轻微伤，符合抗拒抓捕转化条件，已转化为更重的抢劫罪\nC✓ 抢劫罪：先行取款行为构成信用卡诈骗罪（广义诈骗犯罪），紧接着在现场面对被害人要求返还时逃跑并将追赶的李某打伤（为窝藏赃物、抗拒抓捕当场使用暴力），依据《刑法》第269条转化为\u0001抢劫罪\u0002\nD✗ ATM机里的钱属于银行与卡主的资金占有，绝非无主或甲原本合法代管的财物，绝对不成立侵占罪","k":"","kb":59,"kh":[[219,272]]},{"id":"2024-4","y":2024,"t":"单","s":"甲指使多人利用医保骗保购买药品予以收购,转售牟利,数额特别巨大。甲的行为应认定为（ ）。","o":["诈骗罪","保险诈骗罪","合同诈骗罪","掩饰、隐瞒犯罪所得罪"],"a":"A","e":"\u0001两高两部《关于办理医保骗保刑事案件若干问题的指导意见》明确：指使参保人虚假开药、虚增药量套取医保基金报销买出药品再低价收购加价转售牟利（倒卖“医保回流药”），数额特别巨大，本质是骗取国家医保基金，以诈骗罪定罪处罚！\u0002\nA✓ 诈骗罪：甲组织指使多人虚构诊疗需要骗取医疗保障基金补贴购买药品再由甲统一收购倒卖牟利，实质上采用虚构事实、隐瞒真相方法非法套骗国家社会医保基金，依据全国人大常委会立法解释及2024年最新司法解释，一律按《刑法》第266条\u0001诈骗罪\u0002定罪处罚\nB✗ 《刑法》第198条保险诈骗罪保护的仅是商业保险公司经营的商业保险；基本医疗保险、工伤养老保险属于国家社会保障基金，套骗国家社保基金不成立保险诈骗罪\nC✗ 与医保定点药店医院签购药结算并非市场平等民商事欺诈合同交易，特别适用全国人大常委会关于骗取社保基金按诈骗罪解释\nD✗ 甲是自始主动“指使多人”系统性骗保的幕后组织正犯（共同诈骗主犯），并非纯粹事后不知情代为销赃的下游人员","k":"","kb":62,"kh":[[15,50]]},{"id":"2024-6","y":2024,"t":"单","s":"甲潜入某制衣公司,盗得笔记本电脑一台,以3800元出售。事后查明该电脑价值 3000元,内装价值3万元的服装制图软件系统,甲的盗窃数额应认定为（ ）。","o":["3000元","3800元","33000元","33800元"],"a":"C","e":"\u0001盗窃价值3000元的笔记本电脑及内装价值3万元的专业服装制图软件系统，即使仅以3800元低价销赃，盗窃罪犯罪数额仍按物品及附着专有财产系统的真实价值33000元计。\u0002\nA✗ 不能只算硬件价值3000元而遗漏盗窃时一同包含并被非法剥夺控制的内装正版专业制图软件系统价值3万元\nB✗ 3800元仅是销赃变卖的贱卖价，两高《盗窃解释》明确规定盗窃数额按照财物真实客观价格计算，不按廉价销赃数额计\nC✓ 33000元：被盗电脑硬件自身价值3000元，加上电脑内专属安装的商业价值3万元服装制图软件系统（随电脑实体一并窃走并剥夺被害企业完整占有使用价值），合计真实客观经济价值\u000133000元\u0002\nD✗ 不得把硬件+软件真实价值（33000元）与销赃得款（3800元）重复累加成33800元","k":"","kb":61,"kh":[[204,252]]},{"id":"2024-8","y":2024,"t":"单","s":"甲持刀抢劫出租车,司机跳车求救被高速公路上的其他车辆撞死,甲应认定为（ ）。","o":["抢劫罪(基本犯)","以危险方法危害公共安全罪(未遂)","抢劫罪(结果加重犯)","故意伤害罪(既遂)"],"a":"C","e":"\u0001持刀抢劫出租车致司机惊恐跳车求救被高速公路来车撞死，被害人跳车系受持刀暴力抢劫紧迫威胁的自救反应，死亡结果归责于抢劫罪，定抢劫罪（结果加重犯）。\u0002\nA✗ 被害司机已经当场因逃避持刀抢劫跳车致死，超越基本犯（3–10年）评价范围，适用“抢劫致人死亡”加重法定刑（10年以上、无期或死刑）\nB✗ 行为人是直接持刀抢劫特定出租车司机，司机在高速公路上迫不得已跳车并非甲直接驾驶车辆横冲直撞危害公众安全，且发生死亡结果也非未遂\nC✓ 抢劫罪（结果加重犯）：持刀抢劫的剧烈生命威胁迫使司机在高速行驶状态跳车求救被车撞死，暴力抢劫与被害人跳车死亡之间存在直接且相当的因果关系，构成《刑法》第263条第5项\u0001抢劫致人死亡（结果加重犯）\u0002\nD✗ 基于抢劫非法占有的暴力行为直接引起死亡结果，由抢劫罪结果加重犯全面评价，不另定故意伤害罪","k":"","kb":59,"kh":[[156,200]]},{"id":"2025-3","y":2025,"t":"单","s":"甲组织、聚集多人“打砸抢”,导致公共财物大量毁损。甲的行为应认定为（ ）。","o":["抢劫罪","寻衅滋事罪","故意毁坏财物罪","聚众扰乱社会秩序罪"],"a":"A","e":"\u0001组织、聚集多人“打砸抢”导致公共财物大量毁损，依据《刑法》第289条法律拟制规定，对首要分子直接依照抢劫罪定罪处罚。\u0002\nA✓ 抢劫罪：《刑法》第289条明文拟制规定：“聚众‘打砸抢’，致人伤残、死亡的，依照故意伤害、故意杀人罪定罪处罚。毁坏或者抢走公私财物的，除判令退赔外，\u0001对首要分子，依照本法第二百六十三条（抢劫罪）的规定定罪处罚\u0002”\nB✗ 普通聚众起哄打闹才是寻衅滋事罪；一旦达到大规模“聚众打砸抢”破坏公私财物程度，须优先适用第289条法律拟制条款\nC✗ 即使本案行为人是“毁坏”公私财物而未拿走财物，第289条依然对首要分子法律拟制为“抢劫罪”（注意这正是289条“毁坏也算抢劫”的经典拟制点）\nD✗ 聚众扰乱社会秩序罪不涉及直接公然“打砸抢”暴力损毁抢夺财物\n《刑法》第289条典型\u0001法律拟制\u0002：聚众“打砸抢”仅仅“毁坏”（哪怕一分钱没拿走）公私财物，对首要分子照样直接定\u0001抢劫罪\u0002！","k":"","kb":59,"kh":[[317,350]]},{"id":"2025-14","y":2025,"t":"单","s":"甲偷拍了陈某的隐私视频,要求陈某出20 万元购买,否则就在网上公布该视频。陈某无奈接受,给甲写下欠条。后甲持欠条向陈某索要,陈某表示无力支付。甲多次闯入陈某的宿舍吵闹,陈某被迫支付了这笔钱。甲的行为应认定为（ ）。","o":["敲诈勒索罪","非法侵入住宅罪","强迫交易罪","催收非法债务罪"],"a":"A","e":"\u0001偷拍隐私视频威胁公布勒索20万元迫使对方写下欠条，随后持假债权多次闯宿舍吵闹迫使付钱，核心勒索手段是揭发隐私相要挟，全程属敲诈勒索罪一罪。\u0002\nA✓ 敲诈勒索罪：甲偷拍隐私视频相威胁索要20万元并强迫写欠条，后续闯入宿舍催讨正是为实现此前敲诈钱款的延续执行动作，全案构成\u0001敲诈勒索罪（既遂）\u0002\nB✗ 多次闯入宿舍吵闹属于为实现敲诈勒索既遂结果的追索后续手段行为，被敲诈勒索罪吸收，不另定非法侵入住宅罪\nC✗ 不存在强买强卖商品或提供服务之交易活动，不构成强迫交易罪\nD✗ 《刑法》第293条之一催收非法债务罪专指使用暴力、胁迫等催收\u0001高利放贷等产生的非法债务\u0002；本案欠条本就是甲自己通过敲诈勒索造出来的，是直接索取敲诈赃款而非催收高利贷\n特别注意辨析《刑修（十一）》第293条之一“催收非法债务罪”：仅限催收\u0001高利放贷等产生的非法债务\u0002；如果是通过偷拍隐私视频敲诈迫使对方写的20万元“敲诈勒索欠条”，始终直接定\u0001敲诈勒索罪\u0002！","k":"","kb":68,"kh":[[10,15]]},{"id":"2026-18","y":2026,"t":"单","s":"【案情】甲谎称主审法官是自己的大学同学，骗取当事人家属信任，担任刑事案件辩护人，并收取高额律师费。辩护失败拒不返还。事后查明甲的律师身份系伪造。\n甲的行为应认定为","o":["侵占罪","诈骗罪","招摇撞骗罪","虚假诉讼罪"],"a":"B","e":"\u0001谎称自己是大律师且为主审法官同学，伪造律师身份收取高额律师费后辩护失败拒不返还，从一开始即虚构身份骗取财物，成立诈骗罪。\u0002\nA✗ 侵占罪的前提是起初“合法正当占有”（如真律师收受委托款或普通代为保管）；甲自始靠伪造律师身份骗钱，并非合法保管\nB✓ 诈骗罪：甲根本不具备律师执业资格却伪造律师身份并虚构主审法官同学关系，致使当事人家属陷入错误认识并自愿支付高额“律师费”，完全符合\u0001诈骗罪\u0002构成要件\nC✗ 《刑法》第279条招摇撞骗罪必须冒充的是“\u0001国家机关工作人员\u0002”；执业律师属于法律服务中介专业人员而非国家机关工作人员，冒充律师不构成本罪（若仅冒充律师同学吹嘘也未自称国家机关工作人员）\nD✗ 虚假诉讼罪是指以捏造的事实提起民事诉讼妨害司法秩序，本案并未在民事诉讼中捏造虚假法律关系诉讼","k":"","kb":62,"kh":[[15,50]]}]},{"sub":"民法","name":"典型合同","w":1.7,"L":33,"qs":[{"id":"2005-40","y":2005,"t":"单","s":"买卖合同不属于（ ）。","o":["双务合同","不要式合同","有偿合同","实践性合同"],"a":"D","e":"\u0001买卖合同是最典型的双务、有偿、诺成、不要式合同，自当事人意思表示一致时即成立生效，不属于必须交付标的物才成立的实践性合同。\u0002\nA✗ 买卖双方互负交付标的物转移所有权与支付价款的对价义务，属于双务合同。\nB✗ 一般动产买卖无需特定形式要件（不动产书面亦主要系管理或登记手续所需，总体原则为不要式合同）。\nC✗ 买方付价款、卖方交货物，互为对价，属于典型有偿合同。\nD✓ 买卖合同自双方意思表示一致时成立，为诺成合同而非实践合同。","k":"","kb":136,"kh":[[69,91]]},{"id":"2006-39","y":2006,"t":"单","s":"顾客将胶卷照相馆冲印,照相馆交给顾客一份取印单,该取印单属于（ ）。","o":["委托合同","承揽合同","行纪合同","技术合同"],"a":"B","e":"\u0001顾客交付胶卷由照相馆加工冲洗成照片并交付成果取印，以完成加工定作工作并交付劳动成果为标的，属于承揽合同。\u0002\nA✗ 委托合同重在受托人处理事务的过程与意思代理行为，而不要求交付特定物质加工成果。\nB✓ 照相馆运用自身技术设备和劳动按顾客要求洗印交付照片成果并收取报酬，取印单是典型的承揽合同凭证。\nC✗ 行纪合同是行纪人以自己名义为委托人从事贸易活动。\nD✗ 冲印日常胶卷不涉新技术开发、转让或技术咨询。","k":"","kb":139,"kh":[[64,80]]},{"id":"2006-40","y":2006,"t":"单","s":"除当事人另有约定外,保管合同的成立时间为（ ）。","o":["当事人意思表示一致时","保管物交付时","保管人签字时","保管费交付时"],"a":"B","e":"\u0001除当事人另有约定外，保管合同属于实践合同，自保管物实际交付给保管人时成立。\u0002\nA✗ 诺成合同方以意思表示一致为成立时点；《民法典》第890条规定保管合同除另有约定外自保管物交付时成立。\nB✓ 依据《民法典》第890条（原《合同法》第367条），保管合同原则上自保管物交付时成立，属于实践合同。\nC✗ 保管合同非书面签名要式合同，签字非一般法定成立要件。\nD✗ 保管既可以是无偿也可以是有偿，交费不是合同成立要件。","k":"","kb":140,"kh":[[156,193]]},{"id":"2006-42","y":2006,"t":"单","s":"可以有偿也可以无偿的合同是（ ）。","o":["保管合同","融资租赁合同","运输合同","行纪合同"],"a":"A","e":"\u0001保管合同既可以是有偿合同，也可以由双方约定或按无偿履行；融资租赁、运输与行纪合同在法定性质上均为有偿合同。\u0002\nA✓ 保管合同和自然人借款合同、委托合同一样，既可以有偿也可以无偿（无偿保管下保管人仅就故意或重大过失担责）。\nB✗ 融资租赁合同中承租人必须向出租人支付融资租金，属于法定有偿合同。\nC✗ 运输合同是承运人运送旅客或货物、托运人或旅客支付票款或运费的有偿合同（好意搭车非正式运输合同）。\nD✗ 行纪合同是商事代理贸易行为，委托人依法应当向行纪人支付报酬，属有偿合同。","k":"","kb":140,"kh":[[183,193]]},{"id":"2008-44","y":2008,"t":"单","s":"根据合同法规定,居间人为委托人提供了媒介服务,但未促成合同成立的,居间人有权要求委托人支付（ ）。","o":["约定的报酬","必要费用","约定报酬的一部分","报酬和费用"],"a":"B","e":"\u0001中介人（原居间人）提供了媒介订约服务但最终未能促成合同成立的，无权请求支付报酬，但依法可要求委托人支付从事中介活动支出的必要费用。\u0002\nA✗ 未促成合同成立时，中介人承担了结果风险，无权要求支付约定报酬。\nB✓ 依据《民法典》第964条（原《合同法》第427条），中介人未促成合同成立的，不得请求支付报酬；但是可以按照约定请求委托人支付从事中介活动支出的必要费用。\nC✗ 不得要求折算支付约定报酬的一部分。\nD✗ 不得同时索要报酬。\n【新法提示】《民法典》第961条起将原《合同法》“居间合同”更名为“中介合同”，但第964条未促成不得索酬、可索必要费用的实质规则保持一致（注意《民法典》补入“可以按照约定”请求必要费用）。","k":"","kb":140,"kh":[[457,485]]},{"id":"2009-43","y":2009,"t":"单","s":"根据合同法规定,因赠与人故意或重大过失致使赠与的财产毁损、灭失的,赠与人应当承担损害赔偿责任。此种责任的归责原则是（ ）。","o":["过错责任原则","无过错责任原则","推定过错责任原则","公平责任原则"],"a":"A","e":"\u0001法律规定赠与人仅因“故意或者重大过失”致使赠与财产毁损灭失才承担赔偿责任，系以行为人主观过错作为归责依据，体现过错责任原则。\u0002\nA✓ 《民法典》第662条等对无偿赠与适当降低注意义务门槛（须达故意或重大过失才负责），但仍属考量行为人主观过错的过错责任原则。\nB✗ 无过错责任不论有无过错均须担责，与“因故意或重大过失”相悖。\nC✗ 推定过错要求举证倒置由加害人自证无过错，此处显然仍由受赠方或一般规则认错归责且限重过错。\nD✗ 公平责任适用于双方均无过错分担损失。","k":"","kb":136,"kh":[[220,250]]},{"id":"2011-40","y":2011,"t":"单","s":"下列有关租赁合同与融资租赁合同异同的表述,不正确的是（ ）。","o":["租赁合同与融资租赁合同的标的物均属于非消耗物","租赁合同与融资租赁合同均属于双务、有偿、诺成、要式合同","租赁合同对出租人资格没有限制,融资租赁合同中的出租人须具备法定资格","租赁合同的租金为使用租赁物的代价,融资租赁合同中的租金为融资的代价"],"a":"B","e":"\u0001普通租赁合同中六个月以下租期为不要式合同、不必采用书面形式，并非全部租赁与融资租赁合同都属于要式合同。\u0002\nA✗ 表述正确：不论租赁还是融资租赁，返还的是原物本身，标的物均须为非消耗物。\nB✓ 表述错误（本题应选）：融资租赁合同应当采用书面形式系要式合同，但一般动产或六个月以下房屋租赁合同可以口头订立属不要式合同，并非均属要式合同。\nC✗ 表述正确：普通租赁任何民事主体均可出租，而融资租赁须由具备金融租赁或融资租赁法定经营资质的主体作出租人。\nD✗ 表述正确：普通租赁租金是使用租赁物收益对价，而融资租赁租金本质是分期偿付垫付货款及融资利息的融资代价。","k":"","kb":137,"kh":[[82,112],[340,349],[374,381]]},{"id":"2012-31","y":2012,"t":"单","s":"根据我国担保法的规定,保证合同未约定保证期间的,保证期间为主债务履行期届满之日起（ ）。","o":["6个月","1年","2年","4年"],"a":"A","e":"\u0001我国《民法典》与原《担保法》一致规定：保证合同未约定保证期间的，保证期间均为主债务履行期届满之日起6个月。\u0002\nA✓ 依《民法典》第692条（及原《担保法》第25、26条），当事人对保证期间没有约定或者约定不明确的，保证期间为主债务履行期限届满之日起6个月。\nB✗ 1年并非法定默认保证期间。\nC✗ 《民法典》已废除原《担保法解释》“约定不明按2年”规则，统一缩减为6个月；且原《担保法》对“未约定”一直就是6个月。\nD✗ 4年无依据。","k":"","kb":138,"kh":[[272,322]]},{"id":"2014-31","y":2014,"t":"单","s":"甲向乙借款10万元,由丙作保证人。在保证期间,甲将债务移转给丁,当事人对丙是否继续承担保证责任未作约定。根据担保法规定（ ）。","o":["丙应无条件地继续承担保证责任","丙在任何情况下均不再承担保证责任","如果债务移转后书面通知了丙,则丙应继续承担保证责任","如果债务移转得到了丙的书面同意,则丙应继续承担保证责任"],"a":"D","e":"\u0001债权人允许债务人将全部或部分债务转移给第三人，应当取得保证人书面同意；未获保证人书面同意的，保证人对未经同意转移的债务不再承担保证责任。\u0002\nA✗ 债务人更换直接改变偿债信用与风险，不能强迫原保证人无条件为陌生新债务人兜底。\nB✗ 只要得到保证人书面同意，保证人依然继续承担保证责任。\nC✗ 仅有“书面通知”不足以拘束保证人，必须经过保证人“书面同意”。\nD✓ 依《民法典》第697条（原《担保法》第23条），债务移转经保证人书面同意的，保证人继续承担相应保证责任。","k":"","kb":138,"kh":[[324,355]]},{"id":"2014-33","y":2014,"t":"单","s":"甲公司与乙公司签订一份货物买卖合同,但未约定货物价格。在乙公司交货时,双方就货物价格发生争议,且未能达成补充协议,也无法按照合同条款或者交易习惯加以确定。根据《合同法》规定,货物的价格应（ ）。","o":["依订立合同时甲公司营业地的市场价格确定","依订立合同时履行地的市场价格确定","依履行合同时乙公司营业地的市场价格确定","依履行合同时履行地的市场价格确定"],"a":"B","e":"\u0001货物买卖合同价款不明且无法补充协议或按条款习惯确定的，依《民法典》第511条第2项，按“订立合同时履行地”的市场价格确定。\u0002\nA✗ 营业地与合同订立地均非法定补价基准地点，应当是履行地。\nB✓ 完全符合《民法典》第511条第2项规定：价款或报酬不明确的，按照订立合同时履行地的市场价格履行（依法应当执行政府定价或者政府指导价的从其规定）。\nC✗ 时间标准应取“订立合同时”而非履行时，地点应取“履行地”。\nD✗ 时间不应取履行合同时（否则价格波动容易诱发刻意拖延违约套利）。","k":"","kb":136,"kh":[[92,128]]},{"id":"2014-34","y":2014,"t":"单","s":"甲、乙签订一份设备买卖合同。甲的下列行为中,属于履行附随义务的是（ ）。","o":["甲应乙的请求送货上门","甲告知乙使用设备的注意事项","甲将设备维修工具附赠给乙","甲将设备检验合格证交付给乙"],"a":"B","e":"\u0001卖方交付设备后告知买方使用设备的注意事项，系依据诚实信用原则协助买方安全正确实现合同利益的通知义务，属于附随义务。\u0002\nA✗ 应买家请求送货上门属于合同明确约定的交付履行方式，涉及主给付内容。\nB✓ 通知使用设备的安全及技术注意事项并非主物交付，而是依据诚信原则履行协助安全使用的通知附随义务。\nC✗ 随主物赠与维修工具属于另行附赠约定或从物给付。\nD✗ 依《民法典》第599条等交付产品检验合格证、单证资料属于法定义务性质的“从给付义务”（而非纯粹随附通知义务）。","k":"","kb":136,"kh":[[129,151]]},{"id":"2017-24","y":2017,"t":"单","s":"根据我国《合同法》,下列当事人中,有权随时解除合同的是（ ）。","o":["委托人","承揽人","出租人","赠与人"],"a":"A","e":"\u0001依据《民法典》第933条（原《合同法》第410条），委托人或者受托人可以随时解除委托合同，因解除给对方造成损失的除不可归责外赔偿。\u0002\nA✓ 委托合同以高度人身信赖为基础，委托人与受托人均享有法定随时任意解除权。\nB✗ 承揽合同中只有“定作人”在承揽人完成工作前可随时解除合同，承揽人无权随时任意解除。\nC✗ 租赁合同中只有不定期租赁双方可随时解除，定期租赁出租人不得随便违约任意毁约解除。\nD✗ 赠与人在赠与财产权利转移之前享有的是“任意撤销权”，而非“随时解除权”（且经过公证或具救灾扶贫道德义务不得任意撤销）。","k":"","kb":140,"kh":[[297,337]]},{"id":"2017-33","y":2017,"t":"单","s":"甲将房屋出租给乙,租期5年。半年后,甲通知乙欲出售该房屋,20天内乙未表态,甲遂将该房屋卖给丙,并办理了过户登记。乙有权（ ）。","o":["主张甲、丙之间的买卖合同无效","要求甲承担违约责任","主张租赁合同对丙继续有效","主张优先购买权"],"a":"C","e":"\u0001甲卖房前通知乙，乙在15日法定期间内（20天）未明确表示购买视为放弃优先购买权；甲将房屋过户给丙后，乙依法可依买卖不破租赁主张租赁合同对丙继续有效。\u0002\nA✗ 即使出租人侵害承租人优先购买权，房屋买卖合同本身仍然有效（承租人亦不得主张合同无效）；且本案乙20天不表态已依法丧失优先购买权。\nB✗ 甲已履行提前告知出售义务并等待20天远超15日合理期间，甲卖房给丙完全合法，未违约未侵权。\nC✓ 依据《民法典》第725条“买卖不破租赁”规则，租赁物在承租人按照租赁合同占有期限内发生所有权变动的，不影响租赁合同的效力，故原5年租约对新房主丙继续有效。\nD✗ 依《民法典》第726条第2款，出租人履行通知义务后，承租人在15日内未明确表示购买的，视为放弃优先购买权；现过20天已不可主张。","k":"","kb":137,"kh":[[208,272]]},{"id":"2018-30","y":2018,"t":"单","s":"甲公交公司的司机乙为避让闯红灯的行人丙而急刹车,致乘客丁摔倒受重伤。丁的损害应由 （ ）。","o":["甲公司赔偿","甲公司和乙连带赔偿","乙赔偿","甲公司和丙连带赔偿"],"a":"A","e":"\u0001运输过程中造成旅客伤亡的，客运承运人承担无过错责任，除伤亡系旅客自身健康或旅客故意、重大过失外，承运人甲公交公司均应先向乘客丁全额赔偿。\u0002\nA✓ 依《民法典》第823条，客运合同承运人对运输过程中旅客伤亡承担无过错赔偿责任，避让闯红灯行人丙急刹车导致乘客重伤不属免责事由，故甲公司应承担赔偿责任（赔后可向闯红灯侵权人丙追偿）。\nB✗ 司机乙系履行甲公交公司职务行为，职务侵权责任由用人单位甲公司对外承担，乙不与公司对外连带赔偿。\nC✗ 乙在执行职务中紧急避险避让行人，且客运合同相对方是甲公交公司而非司机个人。\nD✗ 甲公交公司系客运合同无过错赔付责任，丙系道路一般侵权人，二者并非法律规定当然对外承担连带责任的关系，丁首先直接向客运方甲索赔即可。","k":"","kb":140,"kh":[[51,62],[82,135]]},{"id":"2018-39","y":2018,"t":"单","s":"【案情】甲与金科公司约定，甲委托金科公司为自己提供出借人的相关信息，甲在与出借人订立借款合同后向金科公司支付报酬。后根据金科公司提供的信息，甲从创富公司借款36万元并以其房产设定抵押，但一直未办理抵押登记手续。\n甲与金科公司之间的约定属于合同法中的 （ ）。","o":["委托合同","行纪合同","居间合同","技术咨询合同"],"a":"C","e":"\u0001金科公司接受委托为甲报告订立借款合同的机会并提供出借人信息，仅在促成合同订立后收取报酬，属于原《合同法》中的居间合同（《民法典》改称中介合同）。\u0002\nA✗ 委托合同由受托人代为处理具体法律或事实事务且与促成交易挂钩不同。\nB✗ 行纪合同是行纪人以自己名义直接代替委托人与第三方订立买卖等贸易合同。\nC✓ 居间合同/中介合同是报告订约机会或者提供订立合同媒介服务、委托人支付报酬的合同；金科公司仅介绍出借人信息促成借贷，为典型居间合同。\nD✗ 技术咨询合同针对特定技术项目提供可行性论证或技术评价。\n【新法提示】现行《民法典》第961-966条已将原《合同法》中的“居间合同”统一更名为“中介合同”，制度实质相同。","k":"","kb":140,"kh":[[433,456]]},{"id":"2019-30","y":2019,"t":"单","s":"导游甲带团赴国外旅游,朋友乙委托其代购三块名表。回国时,甲代购的名表被海关检查发现, 甲被罚款。对此,下列选项正确的是（ ）。","o":["乙应当承担甲支付的海关罚款","甲有权要求乙分担一半的国际机票费用","如手表存在质量问题,乙有权向甲主张退货","甲有权要求乙支付使用甲的信用卡所享受的折扣优惠价款"],"a":"A","e":"\u0001受托人处理委托事务时，因不可归责于自己的事由受到损失的，可以请求委托人赔偿；甲受托代购名表被海关罚款，可向委托人乙求偿。\u0002\nA✓ 依《民法典》第930条，受托人处理委托事务因不可归责于自己事由遭受损失（被海关课处罚款）的，有权请求委托人乙承担/赔偿该损失。\nB✗ 甲本职是带团赴外旅游的导游，国际机票系其带团工作自身支出，并未就代购另行约定分摊机票。\nC✗ 甲是受托人而非手表生产商或销售商，若手表存在质量瑕疵，乙应找国外商家退换维权，无权向无过错受托人甲主张退货。\nD✗ 受托人处理委托事务取得的利益应当转交给委托人，包括使用信用卡买表节省的折扣优惠本应按实付额结算，甲无权额外多要这部分差价。","k":"","kb":140,"kh":[[339,431]]},{"id":"2019-31","y":2019,"t":"单","s":"下列选项中,可以作为保证人的是（ ）。","o":["个体工商户","教育部直属高校","企业法人的职能部门","街道办事处"],"a":"A","e":"\u0001个体工商户具有独立民事行为与财产责任能力，可以作为保证人；公立高校、街道办事处（机关法人）及无独立民事主体地位的企业职能部门均不得作保证人。\u0002\nA✓ 个体工商户是自然人经营实体，依法能以其个人或家庭全部财产独立承担保证债务，可以担任保证人。\nB✗ 教育部直属高校属于以公益为目的的事业单位/非营利法人，依《民法典》第683条第2款不得为保证人。\nC✗ 企业法人的职能部门不是独立民事主体，无独立财产亦无对外民事行为能力，绝对不能担任保证人。\nD✗ 街道办事处属于人民政府派出机构/机关法人性质，不得为保证人（经国务院批准转贷外国贷款除外）。","k":"","kb":138,"kh":[[218,270]]},{"id":"2020-24","y":2020,"t":"单","s":"画家甲丧偶后,独自抚养儿子乙。某日,甲将自己的一幅画作交给朋友丙保管,嘱托丙待自己去世后烧毁该画作。甲去世后,丙违背甲的嘱托,将画作交拍卖公司拍卖,得款50万元。该50万元应当 （ ）。","o":["归乙所有","归丙所有","由乙、丙平分","归国家所有"],"a":"A","e":"\u0001丙违背甲生前嘱托擅自将画作交拍卖得款50万元，侵害了甲的保管合同债权与画作所有权代位价款；甲去世后由唯一法定继承人儿子乙继承取得全部权益。\u0002\nA✓ 画作原归甲所有，甲去世后画作及由此产生的保管合同返还权、违约损害赔偿与不当得利/拍卖替代价值50万元均依法由儿子乙法定继承，归乙所有。\nB✗ 丙违约背信擅自出卖他人托管遗物属违约侵权得利，绝不能让背信保管人白赚50万元。\nC✗ 丙不享有画作任何所有权或分配权。\nD✗ 甲有儿子乙作为第一顺序法定继承人，遗产不发生无人继承收归国家问题。","k":"","kb":140,"kh":[[227,269]]},{"id":"2020-33","y":2020,"t":"单","s":"银行与自然人之间的借款合同属于（ ）。","o":["实践性合同","有偿合同","从合同","单务合同"],"a":"B","e":"\u0001银行等金融机构与自然人之间的借款合同属于诺成、双务、有偿、要式且为主合同（仅自然人之间借款才是实践性合同）。\u0002\nA✗ 只有“自然人之间”的借款合同自贷款人提供借款时成立（实践合同）；银行贷款合同自双方签字盖章合意成立，为诺成合同。\nB✓ 银行放贷必收取约定利息，借款人支付利息、银行发放贷款，属于典型的有偿合同。\nC✗ 借款合同往往是主合同，抵押、保证等担保合同才是从属于借款合同的从合同。\nD✗ 银行负有依约放贷义务，借款人负有还本付息义务，双方均负对待给付义务，属于双务合同。","k":"","kb":138,"kh":[[61,105]]},{"id":"2020-34","y":2020,"t":"单","s":"甲委托乙公司将一批货物运往A地。后甲将运输途中的货物卖给丙,双方对风险的承担没有约定。甲、丙签订买卖合同后,该批货物毁损、灭失的风险（ ）。","o":["自买卖合同成立时起由丙承担","自货物交付给乙公司时起由丙承担","自货物运抵A地时起由丙承担","自货款付清时起由丙承担"],"a":"A","e":"\u0001出卖人甲出卖交由承运人乙公司运输的在途货物，除当事人另有约定外，货物毁损、灭失的风险自买卖合同成立时起由买受人丙承担。\u0002\nA✓ 完全契合《民法典》第606条（原《合同法》第144条）规定：出卖人出卖交由承运人运输的在途标的物，除当事人另有约定外，毁损、灭失的风险自合同成立时起由买受人承担。\nB✗ 甲交付承运人乙时买卖合同甚至尚未存在，不可能由后来才买货的丙承担先前风险（且非代办托运初发）。\nC✗ 除非另有交付地点交付时转移约定，在途货物风险在合同成立时即已转移，无须等到货抵A地。\nD✗ 风险转移遵循交付/合同成立规则，不与价款是否付清挂钩。","k":"","kb":136,"kh":[[152,199]]},{"id":"2020-48","y":2020,"t":"多","s":"甲、乙、丙、丁一家四口乘坐某客运公司的客车去旅游。甲购买了全票,乙购买了优待票,丙购买了半票,丁免票。因司机疲劳驾驶发生交通事故,全车旅客受伤。下列人员中,有权请求客运公司赔偿的有（ ）。","o":["甲","乙","丙","丁"],"a":"ABCD","e":"\u0001在客运合同中，承运人对运输过程中旅客的伤亡依法承担无过错赔偿责任，该保护覆盖全票、优待票、半票以及按规定免票的所有合法乘客。\u0002\nA✓ 甲购买全票，是标准客运合同旅客，因司机疲劳驾驶事故受伤当然有权索赔。\nB✓ 乙购买优待票，仍成立完整有效客运合同，受全额人身赔偿保障。\nC✓ 丙购买半票（如儿童票），同样受《民法典》第823条同等保护。\nD✓ 依《民法典》第823条第1款明文规定，对按规定免票、持优待票或者经承运人许可搭乘的无票旅客伤亡，承运人同样应当承担无过错赔偿责任。","k":"","kb":140,"kh":[[51,93]]},{"id":"2021-23","y":2021,"t":"单","s":"在受赠人请求履行时,赠与人可以不再履行赠与义务的情形是（ ）。","o":["受赠人严重侵害赠与人近亲属的合法权益","赠与人的经济状况显著恶化,严重影响其生产经营","赠与某贫困山区小学电脑,但尚未交付","受赠人不履行赠与合同约定的义务"],"a":"B","e":"\u0001赠与人经济状况显著恶化并严重影响其生产经营或者家庭生活的，在受赠人请求交付前可以不再履行赠与义务（法定穷困抗辩权）。\u0002\nA✗ 受赠人严重侵害赠与人近亲属合法权益属于“法定撤销权”事由（已交付亦可撤销），而非针对请求履行的“不再履行穷困抗辩”（2021官方真题单选B精准对应第666条“不再履行”原话）。\nB✓ 完全精准对应《民法典》第666条原文规定：赠与人的经济状况显著恶化，严重影响其生产经营或者家庭生活的，可以不再履行赠与义务。\nC✗ 扶贫济困、助学公益性质的赠与合同依法不适用一般任意撤销权，必须履行。\nD✗ 受赠人不履行附义务赠与合同约定义务的，产生的是“法定撤销权”（第663条）而非第666条“不再履行”条款。","k":"","kb":136,"kh":[[265,328]]},{"id":"2021-38","y":2021,"t":"单","s":"A公司急需机床,因资金不足与B公司签订合同,约定:B公司按照A公司的要求向C厂购买10 台机床出租给A公司,由C厂向A公司交付机床;租金800万元,每年年末A公司向B公司支付80万元; 租赁期届满时,机床的所有权归A公司。该合同为 （ ）。","o":["融资租赁合同","借款合同","租赁合同","所有权保留的买卖合同"],"a":"A","e":"\u0001出租人按承租人选定的厂商和规格购入10台机床租予承租人使用、收取租金，并约定租期届满机床归承租人，这是典型的三方两合同融资租赁合同。\u0002\nA✓ 符合《民法典》第735条融资租赁合同定义：出租人根据承租人对出卖人、租赁物的选择，向出卖人购买租赁物提供给承租人使用，承租人支付租金（且期满机床归属符合融物兼融资特征）。\nB✗ 出卖人直接向承租方交货机床并取得租金收益，而非单纯货币出借关系。\nC✗ 普通租赁出租人自行提供自有设备出租而不由承租方指定购入且不常含期满无偿移转所有权安排。\nD✗ 本案是三方结构、按期支付80万“租金”并在期满移转机床所有权，并非卖方直接与买方订立的双方分期付款买卖合同。","k":"","kb":137,"kh":[[340,381]]},{"id":"2021-48","y":2021,"t":"多","s":"连带责任保证人享有的抗辩权包括（ ）。","o":["主债务人的同时履行抗辩权","主债务人的不安抗辩权","先诉抗辩权","主债务诉讼时效期间届满的抗辩权"],"a":"ABD","e":"\u0001连带责任保证人依法享有债务人的一切对债权人的抗辩（同时履行抗辩权、不安抗辩权、主债务诉讼时效抗辩权等），但唯独不享有一般保证人的先诉抗辩权。\u0002\nA✓ 依《民法典》第701条，保证人可以主张债务人对债权人的抗辩（债务人放弃的保证人仍有权主张），包括同时履行抗辩权。\nB✓ 连带责任保证人同样有权援引主债务人对债权人的不安抗辩权拒付。\nC✗ 先诉抗辩权（须先对主债务人财产强制执行无果才能找保证人）是一般保证人专属抗辩权，连带责任保证人绝对不享有该项权利。\nD✓ 主债务诉讼时效期间届满时，无论一般保证还是连带责任保证人均有权援引主债务时效抗辩权拒绝承担保证责任。","k":"","kb":138,"kh":[[357,410]]},{"id":"2022-46","y":2022,"t":"多","s":"甲与A公司约定∶甲将自己的汽车卖给A公司并转移所有权,A公司支付价款60万元;该车由甲占有使用,甲每月支付租金15000元;合同有效期为5年,期满后汽车无偿归甲所有。对此,下列选项中正确的有","o":["甲与A公司之间的合同属于有名合同","甲与A公司之间的合同名为买卖合同,实为借款合同","甲与A公司之间关于合同期满后汽车归属的约定无效","A公司对汽车的所有权未经登记不得对抗善意第三人"],"a":"AD","e":"\u0001将自有汽车卖给融资租赁公司并租回使用构成合法有效的“售后回租”融资租赁合同（有名合同），可约期满车归原主，且未经登记出租人所有权不得对抗善意第三人。\u0002\nA✓ 依最高法融资租赁合同司法解释及《民法典》第735条，甲将其汽车卖给买受人兼出租人并随即租回占有使用的“售后回租”构成真正的融资租赁合同，属《民法典》规定的有名合同。\nB✗ 存在真实汽车融物交易与租金对价安排的售后回租属合法有名融资租赁合同，而非“名为买卖实为借款”。\nC✗ 依《民法典》第759条，融资租赁双方依法可以自由约定租赁期届满后租赁物所有权的归属（归甲合法有效）。\nD✓ 完全对应《民法典》第745条原文规定：出租人对租赁物享有的所有权，未经登记，不得对抗善意第三人。","k":"","kb":137,"kh":[[382,450]]},{"id":"2022-50","y":2022,"t":"多","s":"Y公司常年为Z公司供货，货款按月计算，每年6月底支付。2021年1月10日，Y公司与某银行订立有追索权的保理合同，将其对Z公司2021年第一季度的100万元货款债权转让给银行，向银行融资80万元，保理期限6个月。Y公司到期未能向银行偿还保理融资款，银行有权（ ）。","o":["请求Y公司返还80万元融资款本息","请求Y公司回购100万元货款债权","请求Z公司偿还100万元货款债务","保留Z公司偿还的100万元货款扣除80万元本息和相关费用后的剩余部分"],"a":"ABC","e":"\u0001在有追索权的保理合同中，债务人未按期清偿时，保理人既可请求保理卖方返还融资本息或回购债权，也可向次债务人索要全部100万元应收账款，但超额部分应返还。\u0002\nA✓ 依《民法典》第766条，当事人约定有追索权保理的，保理人可以向应收账款债权人（融资方）请求返还80万元保理融资款本息。\nB✓ 依《民法典》第766条，保理人也可选择请求应收账款债权人回购该100万元应收账款债权。\nC✓ 保理人基于受让取得完整债权，有权直接向应收账款债务人主张全额100万元货款。\nD✗ 《民法典》第766条后段明确规定：保理人向应收账款债务人主张应收账款债权，在扣除保理融资款本息和相关费用后有剩余的，剩余部分“应当返还给应收账款债权人”，保理人无权私自留存赚差价。","k":"","kb":139,"kh":[[297,380]]},{"id":"2023-23","y":2023,"t":"单","s":"张某就同一套房屋先后与甲、乙、丙、丁签订租赁合同，其中，甲最早签订书面合同，乙办理了登记备案手续，丙预付了租金，丁已入住。现各方就此产生纠纷，诉至法院。法院确定承租人的顺序应为（ ）。","o":["甲乙丙丁","乙丙丁甲","丙丁乙甲","丁乙甲丙"],"a":"D","e":"\u0001一房数租承租人均主张履行合同的，确定顺位依次为：1. 已经合法占有（入住）房屋 → 2. 办理登记备案手续 → 3. 合同成立在先（未占有未备案但预付租金排在最后）。\u0002\nA✗ 合同成立在先排在已占有、已登记备案之后，不能列首位。\nB✗ 登记备案应让位于实际已入住占有，且契约先成排于预付租金前。\nC✗ 预付租金不属于优先法定顺位要件。\nD✓ 依《民法典》及《最高人民法院关于审理城镇房屋租赁合同纠纷案件具体应用法律若干问题的解释》第6条，履行顺位严格为：已合法占有房屋的（丁）＞已办理登记备案手续的（乙）＞合同成立在先的（甲）＞仅预付租金（丙），即丁乙甲丙。","k":"","kb":137,"kh":[[113,170]]},{"id":"2023-39","y":2023,"t":"单","s":"【案情】A公司与B公司签订合同，约定：A公司为B公司制作家具100套，价款100万元；B公司预付20万元，其余货款待交货验收后一次性付清；A公司提供制作家具所需木材，B公司提供设计图纸。\n如A公司未经B公司同意,委托C公司制作其中50套家具。C公司制作完毕,且家具质量符合A公司与B公司之间的合同约定,则","o":["B公司有权解除与A公司之间的合同","B公司不得拒绝接受C公司制作的家具","B公司有权请求撤销A公司与C公司之间的合同","B公司事后追认转包行为的,A公司无须就C公司制作的家具向B公司负责"],"a":"A","e":"\u0001承揽人未经定作人同意，擅自将其承揽的主要工作交由第三人完成的，不论质量是否合格，定作人均有权解除合同；即使事后追认也只免除解约权而仍由承揽人对第三人工作负责。\u0002\nA✓ 依《民法典》第772条第2款，承揽人未经定作人同意将其承揽的“主要工作”（制作50套即半数核心工作）交由第三人完成的，定作人可以解除合同。\nB✗ 定作人基于承揽合同极强的人身技能信任关系，有权拒绝违约擅自转包成果并直接解约。\nC✗ 定作人不是分转包合同的当事人且不存在欺诈胁迫，无权请求撤销承揽人与第三方之间的独立合同。\nD✗ 依《民法典》第772条第1款，即便经定作人同意或事后追认将主要工作交由第三人完成，总承揽人仍应当就该第三人完成的工作成果向定作人负责。","k":"","kb":139,"kh":[[81,131]]},{"id":"2025-25","y":2025,"t":"单","s":"甲收到的手机短信通知显示,甲的借记卡在外地ATM 机取现1 万元。甲当即用该借记卡在ATM 机存入100 元并报警。经查,该卡密码未泄露,但长时间未修改。甲的借记卡被盗刷的损失应由（ ）。","o":["甲自行承担","发卡行全部赔偿","甲与发卡行平均分担","盗刷者赔偿,发卡行承担补充责任"],"a":"B","e":"\u0001借记卡发生伪卡/异地盗刷时，持卡人未泄露密码且立即通过ATM存入100元证明真卡在手并及时报警止损，本身无过错；发卡行未能保障卡内资金交易安全，应全部赔偿。\u0002\nA✗ 持卡人密码未泄露，仅仅长期未改密不构成自身过错，不应自行吞下盗刷损失。\nB✓ 依最高法《关于审理银行卡民事纠纷案件若干问题的规定》第7条，持卡人不存在泄密等过错且及时报警固定人卡不分离证据止损的，由未尽安全保障义务与识别真伪责任的发卡银行承担全部赔偿责任。\nC✗ 双方均无分担之必要条件，银行全责。\nD✗ 在伪卡盗刷银行卡民事纠纷中，持卡人有权直接起诉合同相对方发卡银行承担全部赔偿责任，非由盗刷者先赔、发卡行只担补充责任。","k":"","kb":138,"kh":[[141,185]]},{"id":"2025-27","y":2025,"t":"单","s":"2021 年3 月甲将房屋出租给乙,租期三年。2023 年3 月,乙因去国外访学一年,经甲同意将房屋转租给丙,租期一年。2024 年3 月租期届满,甲继续出租该房屋。对此,下列说法正确的是（ ）。","o":["房屋转租后,甲与乙之间的房屋租赁合同终止","房屋转租后,甲与丙之间成立房屋租赁合同","丙承租房屋的事实属于并存的债务承担","乙享有以同等条件优先承租的权利"],"a":"D","e":"\u0001承租人经出租人同意合法转租的，原租赁合同继续有效（次承租人与出租人不成立直接租赁亦非债务承担）；原租期届满出租人继续出租的，原承租人乙依法享有优先承租权。\u0002\nA✗ 依《民法典》第716条第1款，承租人转租的，承租人与出租人之间的租赁合同继续有效，并未终止。\nB✗ 转租合同存在于原承租人（二房东）与次承租人之间，出租人与次承租人之间并不直接成立租赁合同。\nC✗ 转租系另行设立次租赁债权关系，并非次承租人加入原债务成为连带承担人的并存债务承担。\nD✓ 依《民法典》第734条第1款，租赁期限届满，房屋承租人享有以同等条件优先承租的权利。","k":"","kb":137,"kh":[[273,318]]},{"id":"2026-38","y":2026,"t":"单","s":"甲到某书店购书,背包内装有价值3 万元的首饰,寄放在书店的储物柜,并支付了保管费,但没有告知书店包里面有贵重物品,书店保管不善毁损了首饰。对于甲的损失","o":["书店不承担赔偿责任","书店承担一般物品赔偿责任","书店承担贵重物品赔偿责任","书店承担缔约过失责任"],"a":"B","e":"\u0001寄存人甲将装有3万元贵重首饰的背包寄放并付费，但未事先向保管人书店声明包内有贵重物品，发生保管不善毁损时，保管人只需按一般物品标准予以赔偿。\u0002\nA✗ 书店收了保管费形成有偿保管且存在保管不善过错，不能完全免责不赔。\nB✓ 完全契合《民法典》第898条规定：寄存人寄存货币、有价证券或者其他贵重物品的，应当向保管人声明；寄存人未声明的，该物品毁损、灭失后，保管人可以按照一般物品予以赔偿。\nC✗ 由于寄存人未事先声明贵重物品属性使保管人无法评估风险与加强防范，保管人不按3万元贵重物品标准赔付。\nD✗ 书店收钱保管合同已成立生效，属履行保管不当违约赔付（按一般物品赔偿），非缔约过失责任。","k":"","kb":140,"kh":[[195,225]]},{"id":"2026-39","y":2026,"t":"单","s":"甲、乙约定,甲借10 万元给乙,借款期限为一年,年利率为3%,每月按期付利息,期满归还本金。如乙迟延还款,每日按欠款的0.01%支付延期利息。半年后乙未按期还款付息,经甲催告后仍未支付,甲遂解除合同,并要求乙提前还款。合同解除后乙应支付的迟延还款利息按照","o":["年利率3%","日利息的0.01%","解除合同时一年定期存款基准利率","解除合同时一年期贷款市场报价利率"],"a":"B","e":"\u0001合同因乙未按期还款付息违约而解除时，不影响合同中关于逾期迟延违约金/延期利息条款的效力；双方约定每日0.01%（年化3.65%）合法未超上限，仍按每日0.01%计付。\u0002\nA✗ 年利率3%是合同正常履行期内的期内利息，而非违约解除提前还款后的迟延违约利息。\nB✓ 依《民法典》第566、567条及民间借贷司法解释，合同解除不影响违约责任及结算清理条款效力；双方已明确约定违约迟延每日0.01%（折合年化3.65%，未超4倍LPR上限），仍应从其约定按日0.01%支付。\nC✗ 已有明确合法逾期利率约定，无须适用一年期定存基准利率。\nD✗ 仅有在既无约定借期内利率也无约定逾期利率时，方才参照一年期LPR计算，本案有合法约定日0.01%。","k":"","kb":138,"kh":[[106,141]]},{"id":"2026-48","y":2026,"t":"多","s":"A 公司为修建宿舍楼公开招标,B 公司以800 万元中标,2024 年12 月1 日B 公司收到中标通知书,12 月10 日A 公司与B 公司签订书面合同,约定工程价款为1000 万元,B 公司经A 公司同意将宿舍楼的装修工程以100 万元分包给中小企业C,并约定待A 公司支付工程价款后,B 公司向C 公司支付装修款项。A 公司逾期半年未支付工程价款,B 公司未催要且无力向C 公司支付装修款。下列说法正确的有","o":["A 公司与B 公司的建设工程合同于2024 年12 月1 日成立","A 公司与B 公司的建设工程合同价款为1000 万元","B 公司与C 公司关于装修价款支付的约定无效","C 公司可以代位行使B 公司对A 公司的建设工程价款优先受偿权"],"a":"ABCD","e":"\u0001中标通知书到达日即成立建工合同；自建宿舍楼非依法必须招标项目，双方随后书面合意变更工程价款为1000万元有效；大型企业对中小企业分包背靠背付款约定无效，次承包人可代位行使优先受偿权。\u0002\nA✓ 依据《民法典》第483条及《合同编通则解释》第3条，以招标方式订立合同的，2024年12月1日中标通知书到达中标人时承诺生效、建设工程合同即告成立。\nB✓ 发包企业修建员工宿舍楼不属于依法必须进行招标的项目，自愿招标成立合同后双方于12月10日基于意思自治签订书面合同协商将价款变更约定为1000万元，不构成《招标投标法》禁止的违法黑白合同，合法有效。\nC✓ 依据2024年《最高人民法院关于大型企业与中小企业约定以第三方支付款项为付款前提条款效力问题的批复》（法释〔2024〕11号），大企业与中小企业间约定“待第三方付款后再付款”的背靠背条款违反强制性规定而无效。\nD✓ 依据《民法典》第535条，建设工程价款优先受偿权属于与主债权有关的从权利且非专属于债务人自身；发包方逾期半年未付且总包方怠于催要致分包款无法受偿的，次承包中小企业依法有权代位行使总包方的建设工程价款优先受偿权。","k":"","kb":139,"kh":[[140,281]]}]},{"sub":"民法","name":"人格权","w":1.7,"L":31,"qs":[{"id":"2005-32","y":2005,"t":"单","s":"某报社在一篇报道中披露某女影星甲曾做过不光彩的事情,致使甲备受歧视。甲因无法忍受巨大的精神压力, 跳楼自杀未遂,但造成终身残疾。该报社的行为（ ）。","o":["是如实报道,不构成侵权","侵害了甲的隐私权","侵害了甲的生命权","侵害了甲的健康权"],"a":"B","e":"\u0001未经同意向社会公众披露女影星过往不光彩隐私，无论内容是否真实，均已构成对他人私生活秘密的侵犯，即侵害甲的隐私权。\u0002\nA✗ 即便陈述事实真实，只要涉及他人不愿为外人知晓的私人生活私密信息且与公共利益无关，擅自披露即构成隐私侵权。\nB✓ 私生活不光彩往事属于自然人不愿公开的私密信息，报社擅自公之于众构成侵害隐私权。\nC✗ 报道本身未对甲实施物理暴力或直接致死侵害，甲自杀行为属主观决意，两者在法理上缺乏侵害生命权的直接相当因果关系。\nD✗ 虽然跳楼致残属于身体机能损害后果，但报社披露信息指向的是隐私权而非直接打击身体健康，伤残结果系甲自我防线崩溃自行跳楼产生。","k":"","kb":143,"kh":[[74,93]]},{"id":"2005-34","y":2005,"t":"单","s":"下列权利中,只能由自然人享有的是（ ）。","o":["所有权","名誉权","肖像权","用益物权"],"a":"C","e":"\u0001肖像权依托于自然人具体面貌形体特征，只能由自然人专属享有；法人等组织亦可享有所有权、名誉权及部分用益物权。\u0002\nA✗ 法人、非法人组织和自然人均可依法享有动产或不动产所有权。\nB✗ 法人同样具有社会信誉评价，依法享有名誉权。\nC✓ 肖像权是以自然人面部及外部形象特征为客体的人格权，仅限自然人专有，法人无肖像。\nD✗ 企业法人依法可享有建设用地使用权、海域使用权等用益物权。","k":"","kb":141,"kh":[[70,96]]},{"id":"2007-55","y":2007,"t":"多","s":"歌迷甲在一酒吧意外地遇见自己的偶像歌星乙,惊喜之余向乙打探其私生活。乙被激怒,在众目睽睽之下将手中的饮料泼向甲,弄脏了甲的衣服。乙的行为侵害了甲的 （ ）。","o":["身体权","尊严权","健康权","财产权"],"a":"BD","e":"\u0001乙在酒吧众目睽睽之下把饮料泼在甲身上，使甲颜面扫地且衣物被污损，分别侵害了甲的人格尊严（尊严权）与财产权（衣物价值损失）。\u0002\nA✗ 饮料仅淋湿弄脏了甲的衣服，并未伤害甲的肢体或器官组织完整性，未侵害身体权。\nB✓ 当众泼饮料侮辱极大贬损了甲作为平等民事主体的个人人格尊严，构成侵害人格尊严。\nC✗ 题干未交代产生生理病痛或机能障碍，未侵害健康权。\nD✓ 饮料泼湿弄脏甲的衣物造成洗护费用支出或衣物减值，直接侵害了甲的财产权。","k":"","kb":141,"kh":[[204,229]]},{"id":"2008-45","y":2008,"t":"单","s":"根据民法通则规定,可以由法人享有的人格权是（ ）。","o":["姓名权","肖像权","名誉权","隐私权"],"a":"C","e":"\u0001法人和非法人组织可享有名誉权、荣誉权和名称权；而姓名权、肖像权与隐私权均属于自然人专有人格权。\u0002\nA✗ 自然人享有姓名权，法人和非法人组织对应享有的叫“名称权”。\nB✗ 法人没有生物形态外貌，不享有肖像权。\nC✓ 依《民法典》第110条、第1024条（原《民法通则》第101条），法人依法享有名誉权。\nD✗ 法人经营秘密受商业秘密法律规制，不享有自然人私生活安宁意味上的隐私权。","k":"","kb":141,"kh":[[104,142]]},{"id":"2008-49","y":2008,"t":"单","s":"根据我国民法的有关规定,以下情形中权利人可以请求精神损害赔偿的是（ ）。","o":["生命权受到非法侵害","名称权受到非法侵害","合同债权受到非法侵","承包经营权受到非法侵害"],"a":"A","e":"\u0001自然人生命权等物质性、精神性人格权遭非法侵害时权利人及其近亲属可请求精神损害赔偿；法人名称权、普通合同债权与物权原则上不赔精神损害。\u0002\nA✓ 自然人生命权、健康权、身体权等人格权受到非法侵害造成严重精神损害的（如近亲属因受害人死亡遭受精神痛苦），依法有权请求精神损害赔偿。\nB✗ 名称权属于法人专属人格权，法人无自然人肉体痛苦情绪，原则上不得请求精神损害赔偿。\nC✗ 单纯合同债权受侵害原则上仅赔偿财产违约损失，不支持精神损害赔偿（除非符合《民法典》第996条违约严重侵害人格权特殊情况）。\nD✗ 普通物权（承包经营权）受损一般通过修复或价款财产赔偿填平，除具有人身意义特定物毁损外无精神损害赔偿。","k":"","kb":141,"kh":[[405,417],[506,533]]},{"id":"2009-44","y":2009,"t":"单","s":"2003年7月，洪某在高考中以两分之差未能进入重点大学录取范围。洪某在高中学习阶段，曾荣获市优秀学生干部称号。按当年高考政策，获市级优秀学生干部的考生可以享受加10分的奖励。市教委在整理审核学生档案时，将洪某的“市优秀学生干部”称号改为不享受此奖励的“市三好学生”称号，致洪某与重点大学失之交臂。市教委侵犯了洪某的（ ）。","o":["名誉权","荣誉权","姓名权","信用权"],"a":"B","e":"\u0001市教委擅自将洪某实际获得的“市优秀学生干部”权威荣誉称号篡改为“市三好学生”，直接剥夺破坏了该荣誉带来的利益和名分，侵害了洪某的荣誉权。\u0002\nA✗ 名誉是对民事主体品德、声望等综合社会评价，此处针对特定官方奖励称号本身篡改剥夺。\nB✓ 依《民法典》第1031条，任何组织和个人不得非法剥夺他人的荣誉称号，不得诋毁、贬损他人的荣誉；改换掉享加分政策的“市优秀学生干部”称号构成侵害荣誉权。\nC✗ 洪某姓名文字并未被他人盗用冒用。\nD✗ 与社会信用征信记录无直接关联，且我国现行民法典未设独立“信用权”。","k":"","kb":141,"kh":[[383,404]]},{"id":"2009-55","y":2009,"t":"多","s":"下列情形中,权利人可以请求精神损害赔偿的有（ ）。","o":["某医院将甲之子与乙之子抱错,10 年后再发现","某扩印部将丙丁结婚照的底片丢失","某公司使用知名企业的名称促销自己的产品","某人冒用明星庚的姓名演出获利"],"a":"ABD","e":"\u0001医院抱错婴儿侵害亲属身份权、扩印部丢失结婚照底片损毁具有人身意义的特定物、冒用明星姓名均得请求精神损害赔偿；企业名称权侵害不赔精神损害。\u0002\nA✓ 医院抱错婴儿使亲生骨肉离散10年严重破坏亲子身份关系，依精神损害赔偿司法解释，得请求精神损害赔偿。\nB✓ 结婚照底片属于具有重大人身纪念意义且不可复制恢复的特定纪念物品，因侵权永久灭失可主张精神损害赔偿（《民法典》第1183条第2款）。\nC✗ 擅用知名企业名称侵害的是法人“名称权”，法人没有精神痛苦感知，不能请求精神损害赔偿。\nD✓ 自然人姓名权属于核心精神性人格权，冒用明星姓名演艺牟利造成严重影响的，可诉请精神损害赔偿。","k":"","kb":141,"kh":[[418,470]]},{"id":"2010-44","y":2010,"t":"单","s":"自然人开始享有荣誉权的时间是（ ）。","o":["出生时","取得荣誉称号时","年满18周岁时","年满18周岁且取得荣誉称号时"],"a":"B","e":"\u0001荣誉权不是自然人与生俱来的固有权利，而是公民在生活工作中作出突出成绩并被国家、社会组织正式授予荣誉称号时方开始享有。\u0002\nA✗ 出生时即享有的仅限生命、健康、姓名、名誉等一般/固有自然人人格权，婴儿尚无荣誉称号。\nB✓ 荣誉权须以民事主体获得某种表彰奖励的荣誉称号作为取得前提，自“取得荣誉称号时”开始享有。\nC✗ 未成年人（如小学、中学阶段获“三好学生”、“十佳少年”）同样可以依法取得荣誉称号并享有荣誉权，无关成年年龄。\nD✗ 不要求年满18周岁。","k":"","kb":141,"kh":[[361,382]]},{"id":"2010-45","y":2010,"t":"单","s":"超市怀疑顾客甲盗窃超市的商品,保安将其带至办公室搜身,无果。甲因此郁郁寡欢。超市侵害了甲的（ ）。","o":["尊严权","身体权","健康权","名誉权"],"a":"B","e":"\u0001超市怀疑顾客偷窃由保安强行带入办公室搜查身体，粗暴侵犯了顾客对其身体自由支配的完整控制和自主权，依法构成侵害身体权（含人身自由）。\u0002\nA✗ 尽管违背搜身亦刺伤顾客人格尊严，但法理及《民法典》第1003条与司法实务历来直接把非法搜身明确界定为侵害自然人的“身体权”。\nB✓ 身体权包括自然人维持身体完整以及自主支配其肢体、禁止他人非法接触查搜（如强行搜身、强制剪发）的权利，超市非法搜身直接侵害甲的身体权。\nC✗ 保安强行搜身虽致顾客事后“郁郁寡欢”，但并无器质性生理损伤或临床确诊精神病症，未构成健康权侵害。\nD✗ 题干仅讲将顾客带至“办公室”内搜查，并未在大庭广众下广播辱骂张扬，故核心直接侵害是身体权（及行动自由）。","k":"","kb":141,"kh":[[175,203]]},{"id":"2010-55","y":2010,"t":"多","s":"甲乙在某影楼拍摄了一组婚纱照。影楼未经甲乙许可,将他们的一张婚纱照置于橱窗中招揽生意。1年后,甲乙发现影楼的侵权行为,起诉请求精神损害赔偿。人民法院确定其精神损害赔偿数额的根据为（ ）。","o":["侵权人的获利情况","侵权人承担责任的经济能力","侵权行为所造成的后果","受诉法院所在地的平均生活水平"],"a":"ABCD","e":"\u0001人民法院确定精神损害赔偿数额时，综合考量侵权人过错程度、侵害手段场合方式、后果影响、侵权人获利、经济承担能力及受诉法院所在地平均生活水平。\u0002\nA✓ 侵权人因擅自展示婚纱照招揽生意所获经济利益，是法定酌定考量要素。\nB✓ 影楼自身实际承担民事赔偿责任的资产经济能力属于法定考虑依据。\nC✓ 侵权行为所导致的实际社会影响及精神损害后果严重程度，是决定赔额的关键事实。\nD✓ 受诉法院所在地的社会平均生活水平决定具体地区金钱补偿尺度，属法定考量要素。","k":"","kb":141,"kh":[[470,505]]},{"id":"2011-39","y":2011,"t":"单","s":"下列人身权中,属于自然人专有的是（ ）。","o":["名誉权","肖像权","信用权","荣誉权"],"a":"B","e":"\u0001肖像权系以自然人生物面部及身体外部形象为依托的人身权，属自然人专有；名誉权、荣誉权法人亦可享有，现行立法亦无所谓法人不能用之“信用权”界分。\u0002\nA✗ 法人和非法人组织均依法享有名誉权。\nB✓ 唯有自然人才有肉体相貌与肖像，法人不享有肖像权，故肖像权为自然人专有。\nC✗ 企业商誉/信用评价通常归入名誉权保护范畴，非自然人专有。\nD✗ 先进企业、优秀单位等法人与组织亦可获授表彰，享有荣誉权。","k":"","kb":141,"kh":[[70,96]]},{"id":"2012-32","y":2012,"t":"单","s":"下列有关自然人人格权与身份权异同的表述,不正确的是（ ）。","o":["人格权与身份权均没有直接财产内容","人格权与身份权均属于支配权和绝对权","人格权受到侵害后权利人可以请求精神损害赔偿，身份权则不可以","人格权始于出生,身份权则以取得一定身份为前提"],"a":"C","e":"\u0001无论人格权还是身份权（如亲子监护权等亲属身份权），在遭受严重侵害时，自然人权利人均可以依法诉请精神损害赔偿。\u0002\nA✗ 表述正确：人格权和身份权均属于人身权，本身都不直接以物质财产利益为客体内容。\nB✗ 表述正确：两类权利均无须特定相对人配合即可直接行使并排除一切第三人干涉，均属支配权、绝对权。\nC✓ 表述错误（本题应选）：依据精神损害赔偿司法解释及《民法典》第1183条，非法使被监护人脱离监护导致亲子关系或者近亲属间身份关系遭受严重损害的，权利人同样可以主张精神损害赔偿，并非“身份权不可以”。\nD✗ 表述正确：人格权（如生命健康名誉）与生俱来，而配偶权、亲权等身份权须待结婚、收养、生育等法律事实形成特定身份后方产生。","k":"","kb":141,"kh":[[405,431]]},{"id":"2013-35","y":2013,"t":"单","s":"摄影师甲为刘某拍照后,私自将照片卖给乙制作挂历销售。后来乙又将照片送给丙作橱窗广告, 被刘某发现诉至法院。在本案中,侵害刘某肖像权的是（ ）。","o":["甲和乙","乙和丙","甲和丙","甲、乙、丙"],"a":"D","e":"\u0001摄影师甲私卖肖像照、乙印制挂历商用、丙再放橱窗广告宣传，三方均未经刘某同意擅自使用或传播他人肖像，各自构成侵害刘某肖像权。\u0002\nA✗ 遗漏了在橱窗中公开展示使用刘某照片做商业广告的丙。\nB✗ 遗漏了最初未经模特同意私自将照片卖给第三方牟利的摄影师甲。\nC✗ 遗漏了大量印制挂历对外销售营利的乙。\nD✓ 甲擅自出售肖像获利、乙擅自制作挂历卖钱、丙擅自用作橱窗招揽广告，三者均未经刘某同意实施了制作、使用、公开他人肖像行为，全部侵害了刘某肖像权。","k":"","kb":142,"kh":[[202,223]]},{"id":"2013-36","y":2013,"t":"单","s":"甲、乙系父子关系。乙在注册公司时,将其父甲登记为股东之一,后被甲发现。因甲不同意,双方发生争执并诉至法院。乙的行为（ ）。","o":["合法,属于法定代理","合法,属于无因管理","非法,侵犯了甲的姓名权","非法,侵犯了甲的隐私权"],"a":"C","e":"\u0001未经父亲甲同意擅自冒用父亲名字把父亲登记为有限公司股东（使其名义对外暴露背负潜在出资及连带股东法律风险），构成对自然人姓名权的“盗用/假冒”侵害；姓名公开登记不涉及隐私权。\u0002\nA✗ 甲是完全民事行为能力人，且未授权乙替自己当老板股东，乙根本不是甲的法定代理人\nB✗ 私自拿父亲名字去注册当公司股东完全违背父亲真实意思且带给父亲巨大商业出资担保风险，不仅不利他反而害他，绝非合法无因管理\nC✓ 非法，侵犯了甲的姓名权：任何组织和个人不得以盗用、假冒方式侵害自然人姓名权（《民法典》第1014条）；乙擅自冒用父亲姓名办理工商股东登记使父亲承担股东名义风险，侵害了甲的\u0001姓名权\u0002\nD✗ 自然人姓名是人际交往公开标识符号而非不愿他人知晓的私密隐晦信息，盗名登记侵害姓名权而非隐私权","k":"","kb":105,"kh":[[85,111]]},{"id":"2014-32","y":2014,"t":"单","s":"下列选项中,属于人格权且只能由自然人享有的是（ ）。","o":["荣誉权","名誉权","隐私权","亲属权"],"a":"C","e":"\u0001隐私权保护自然人私生活安宁及私密空间、私密活动和私密信息，既属于人格权又只能由自然人专属享有（法人不享隐私权，亲属权属身份权）。\u0002\nA✗ 荣誉权属于人格权（或身份名誉交叉），但法人与自然人皆可享有，并非自然人专属。\nB✗ 名誉权法人与非法人组织同样享有，非自然人独享。\nC✓ 隐私权既是典型人格权，又因依托自然人私密精神安宁生活空间而只能由自然人专属享有。\nD✗ 亲属权虽只能由自然人享有，但在权利体系分类上属于“身份权”而非“人格权”。","k":"","kb":141,"kh":[[70,96]]},{"id":"2015-35","y":2015,"t":"单","s":"甲公司擅自使用电视剧《华妃传》中华妃扮演者的剧照为某化妆品做广告,甲公司的行为侵害了 （ ）。","o":["华妃扮演者的肖像权","华妃扮演者的名誉权","《华妃传》著作权人的著作权","《华妃传》著作权人的邻接权"],"a":"A","e":"\u0001演员剧照呈现的是演员本人的真实形象容貌；甲公司未经演员许可擅自用《华妃传》剧照给自家化妆品打广告，侵害了“华妃扮演者”的肖像权。\u0002\nA✓ 角色剧照在视觉形象上依然可以清晰识别出扮演该角色的演员自然人肖像特征，未经扮演者同意擅自商业代言，构成侵害华妃扮演者的肖像权。\nB✗ 普通化妆品代言广告并未歪曲丑化演员品行声誉，一般不直接认定侵害名誉权（除非广告涉及恶劣虚假贬损产品）。\nC✗ 演员剧照涉及静态照片作品著作权（如果涉及照相构图复制），但甲公司主要擅用的是演员人物形象做商业代言广告，2015法硕单选核心考查剧照仍受演员本人肖像权保护，而非剧集文字整体著作权。\nD✗ 邻接权指表演者权、录音录像制作者权等，此处涉静态剧照商用代言，主要侵害肖像权而非邻接权。","k":"","kb":142,"kh":[[102,114]]},{"id":"2015-40","y":2015,"t":"单","s":"某公安局官方微博公布了演员甲因容留他人吸毒被抓的消息,一知名记者在其博客上转载该消息,并上传了甲与艺人乙、丙一起赌博的照片。该记者的行为（ ）。","o":["侵害了甲的隐私权","侵害了乙、丙的肖像权","侵害了乙、丙的隐私权","不构成侵权"],"a":"D","e":"\u0001公安局官微已经向公众公开通报甲吸毒被抓事实，知名记者转发权威警情通报并配合报道公众艺人赌博舆论监督新闻，属于合法新闻报道，不构成侵权。\u0002\nA✗ 公安官方微博早已公开发布甲容留吸毒被抓信息，已不再属于不愿为人所知的私密隐私；且涉及公众人物违法犯罪涉公共利益。\nB✗ 《民法典》第1020条第2项明确规定，为实施新闻报道，不可避免地制作、使用、公开肖像权人的肖像，可以不经肖像权人同意，属于合理使用。\nC✗ 公众艺人参与赌博违反法律和公序良俗，属于新闻媒体行使合法舆论监督关注公众利益之范畴，不属纯私生活隐私范畴。\nD✓ 知名记者基于公安官微权威披露及新闻舆论监督公共利益开展客观新闻报道，依法阻却违法性，不构成侵权。","k":"","kb":143,"kh":[[117,156]]},{"id":"2016-50","y":2016,"t":"多","s":"甲公司买通乙公司员工,获得乙公司的产品制造方法及客户名单等保密信息。其后甲公司以乙公司的名义与乙公司客户进行交易。甲公司的行为侵害了乙公司的（ ）。","o":["专利权","商业秘密","名称权","隐私权"],"a":"BC","e":"\u0001甲公司买通员工盗取产品制造方法与客户名单构成侵犯商业秘密；再冒充乙公司名义对外跟乙公司客户签约交易构成侵害乙公司名称权。\u0002\nA✗ 产品制造方法与客户名单属于非公开保密商业信息（商业秘密），题目并未提及该制造方法已申请并获授权专利。\nB✓ 不为公众所知悉、具有商业价值并采取保密措施的制造工艺与客户名单属于商业秘密，重金贿赂挖取侵害商业秘密权益。\nC✓ 未经许可冒用乙公司名义对外订立交易合同，直接侵犯了乙公司的法人名称权。\nD✗ 法人不享有自然人意义上的隐私权，企业商业经营保密信息通过“商业秘密”及反不正当竞争法保护。","k":"","kb":142,"kh":[[299,338]]},{"id":"2017-34","y":2017,"t":"单","s":"甲谎称是乙公司的代理人,以乙公司的名义与丙公司签订合同。甲侵犯了乙公司的（ ）。","o":["姓名权","商标权","名誉权","名称权"],"a":"D","e":"\u0001法人和非法人组织对其名称享有专有名称权（《民法典》第1013-1014条）；甲谎称乙公司代理人、擅自冒用“乙公司”字号与丙公司签约，直接构成对乙公司名称权的假冒侵害！\u0002\nA✗ 姓名权专属于自然人（个人）享有；法人公司依法享有的是\u0001名称权\u0002\nB✗ 商标权是贴附在特定商品或服务上用来区分产源的标志专有权；冒充公司对外签合同侵害的是商业主体身份名称而非贴牌商标\nC✗ 题干并未述及甲散布毁损乙公司商誉的虚假贬损评价，单纯冒名签合同核心是盗用假冒名称本身\nD✓ 名称权：任何组织或个人不得假冒、盗用法人及非法人组织名称；甲无中生有冒充乙公司代理人并以乙公司名义对外缔约，侵犯了乙公司的\u0001名称权\u0002","k":"","kb":105,"kh":[[112,139]]},{"id":"2018-28","y":2018,"t":"单","s":"摄影师甲以乙为模特拍摄了数百张艺术照。甲将这些照片编辑成画册,未经乙同意交出版社出版发行。甲的行为侵害了乙的（ ）。","o":["著作权","发表权","肖像权","署名权"],"a":"C","e":"\u0001摄影师甲虽然享有自己拍摄的艺术照片著作权，但未经模特乙同意擅自将含乙个人肖像的画册出版公开发行，构成对乙肖像权的侵害。\u0002\nA✗ 甲本就是该批照片的摄影拍摄作者（著作权人），不可能侵犯自己享有的著作权。\nB✗ 发表权是作者的著作人身权，模型本人不是照片作者，一般对照片无发表权（即便约定隐私例外此处核心诉由是未经同意公开使用他人肖像）。\nC✓ 肖像权与摄影作品著作权并存冲突时，著作权人行使作品出版发行权不得侵害模特的在先肖像权，擅自出画册侵害了乙的肖像权。\nD✗ 署名权是拍照摄影师甲本人的作者权利。","k":"","kb":142,"kh":[[115,131]]},{"id":"2018-29","y":2018,"t":"单","s":"甲将乙的照片和联系方式发到自己的微信朋友圈,声称乙欠钱不还,是个骗子。经查,甲所言与事实完全不符。甲的行为侵害了乙的（ ）。","o":["姓名权","名誉权","肖像权","荣誉权"],"a":"B","e":"\u0001甲在微信朋友圈公开发布乙照片及联系方式并捏造虚构乙“欠钱不还、是个骗子”之不实信息，直接败坏乙社会评价，构成侵害乙的名誉权。\u0002\nA✗ 未盗用或冒用乙的名字从事活动，不侵害姓名权。\nB✓ 以捏造虚假事实、辱骂诽谤方式贬损他人品德信用与社会评价，是最典型的侵害名誉权行为（虽同步附带发出照片，但在《民法典》之前及法硕真题单一最重法益定性中以捏造骗子诋毁名誉为核心侵害）。\nC✗ 2018年仍处原《民法通则》第100条“以营利为目的”构成侵害肖像权时期，甲发圈并非为了商用营利（且核心破坏点在于捏造欺诈不还钱毁损社会评价之名誉权），2018官方真题单选B。\nD✗ 并未篡改或非法剥夺官方荣誉称号，与荣誉权无关。","k":"","kb":142,"kh":[[255,282]]},{"id":"2019-26","y":2019,"t":"单","s":"甲公司将售房过程中收集到的购房者的姓名、身份证号码、电话、家庭住址等信息打包出售。甲公司的行为侵害了购房者的（ ）。","o":["个人信息权益","身份权","信用权","姓名权"],"a":"A","e":"\u0001房屋购买者的姓名、身份证号、电话及住址等能够单独或结合识别特定自然人身份的信息属于个人信息，打包非法出售侵害购房者个人信息权益。\u0002\nA✓ 依据《民法典》第1034条及《个人信息保护法》，自然人的姓名、出生日期、身份证件号码、生物识别信息、住址、电话号码等受法律保护，非法打包买卖侵害个人信息权益。\nB✗ 该组身份识别信息交易并不直接破坏夫妻、父母子女等亲属身份关系。\nC✗ 未编造发布不良违约征信记录。\nD✗ 未冒名顶替使用或干涉姓名更改。","k":"","kb":143,"kh":[[158,205]]},{"id":"2020-25","y":2020,"t":"单","s":"微信名为“温柔的小蜜蜂”的用户在朋友圈中发图配文称:张某是一位糖尿病患者,服用“小蜜蜂”牌保健品后病情得到控制。李某发现该图用的是自己的生活照,且文字内容与自己毫不相干。该用户侵犯了李某的（ ）。","o":["名誉权","肖像权","个人信息权益","姓名权"],"a":"B","e":"\u0001“温柔的小蜜蜂”发配文推广保健品却擅自配用无关第三人李某的生活照，在《民法典》下未经同意擅用他人肖像不论营利与否均侵害肖像权。\u0002\nA✗ 文中所称糖尿病患者写的是虚构的“张某”，一般人读文未必直接对应李某败坏李某个人名誉（且即便图文错配涉名誉，本案图文宣传“小蜜蜂”保健品疗效配李某生活照，2020真题精准考查擅自用于商业推广之肖像权，官方答案即B）。\nB✓ 未经李某同意擅自在其朋友圈商业推广保健品配图中公开使用李某清晰可见的生活照，直接侵害了李某的肖像权（《民法典》第1019条）。\nC✗ 未泄露收集或买卖李某身份证号、电话等身份识别记录信息，核心侵权法益是外在容貌形象即肖像权。\nD✗ 文中写明患者叫“张某”，并没有盗用或冒用“李某”的姓名。","k":"","kb":142,"kh":[[144,161]]},{"id":"2021-31","y":2021,"t":"单","s":"甲为乙拍摄照片后将照片发到朋友圈,丙看到后觉得很有趣,遂将该照片做成搞笑表情包出售。丙侵犯了（ ）。","o":["乙的肖像权","乙的荣誉权","甲的发表权","甲的隐私权"],"a":"A","e":"\u0001丙未经肖像权人乙同意，擅自将朋友圈获得的乙照片制作成搞笑表情包对外出售牟利，直接侵害了乙的肖像权。\u0002\nA✓ 未经肖像权人乙同意，擅自制作（加工成搞笑表情包）并使用、公开、出售乙的肖像，构成典型的侵害乙的肖像权。\nB✗ 不涉及任何荣誉称号或评奖表彰，与荣誉权无关。\nC✗ 甲早已自行把照片发到微信朋友圈公开，拍摄作品已经公开发表，未侵犯甲的发表权。\nD✗ 甲自己已将拍摄的照片公开在朋友圈且所摄肖像主体主要是乙，不侵害甲的隐私权。","k":"","kb":142,"kh":[[132,143]]},{"id":"2022-28","y":2022,"t":"单","s":"某酒店建立了房客信息数据库,但因自身技术人员的疏忽存在系统漏洞。网民王某利用上述漏洞获取了该酒店房客信息,并将这些信息在网上公开,导致房客孙某因个人信息泄露遭受损失。孙某的损失应当由","o":["王某全部赔偿","酒店与王某承担不真正连带赔偿责任","酒店与王某承担连带赔偿责任","酒店与王某承担按份赔偿责任"],"a":"D","e":"\u0001酒店存在数据库漏洞（疏忽过失）与王某利用漏洞非法窃取公开信息（故意侵权）属无意思联络数人侵权，应各自依过错与原因力承担按份赔偿责任。\u0002\nA✗ 酒店本身未尽网络安全信息保管安全保障义务存在明显疏忽漏洞过错，对损失发生具有原因力，不可完全免责由王某全赔。\nB✗ 不真正连带责任须有一方对全部损害负终局全责且各自独立原因均可单独致全损（如侵权人与安保义务人但此处酒店仅疏忽漏防且非独立致全损或依《民法典》第1172条与最高法案例认定酒店技术疏忽+黑客窃密系分别实施无意思联络共同造成同一损害结果，2022官方真题标准答案即D“按份赔偿责任”）。\nC✗ 酒店与黑客王某之间没有共同故意或共同过失（无意思联络），且酒店单独漏防不会自己主动外泄、王某无漏洞亦难获取，不符合第1168/1171条连带责任要件。\nD✓ 依据《民法典》第1172条，二人以上分别实施侵权行为造成同一损害，能够确定责任大小的，各自承担相应的按份赔偿责任。","k":"","kb":143,"kh":[[262,343]]},{"id":"2022-40","y":2022,"t":"单","s":"【案情】甲（20周岁）收入不高，但经常出入某高档酒吧，父母常常被迫为其买单。2021年3月初，甲以个人名义向该酒吧预订3月14日的包厢及生日套餐。3月14日晚，乙、丙、丁受甲之邀来到该酒吧。甲结账时，账单显示消费金额为11860元，甲请求延期支付，被拒绝后欲离开。酒吧经理阻止甲离开并报警，引得众人围观议论。\n酒吧经理阻止甲离开的行为","o":["侵害了甲的身体权","侵害了甲的人身自由","侵害了甲的名誉权","不构成侵权"],"a":"D","e":"\u000120岁成年人甲聚餐消费11860元拒不买单企图逃走，酒吧经理合理阻止其离开并随即报警维护正当债权，符合自助与维护正常交易秩序，不构成侵权。\u0002\nA✗ 经理仅阻止甲逃单离开现场待警察处理，并未殴打伤害或非法侵袭甲的肢体完整性。\nB✗ 依《民法典》第1177条自助行为规则，甲当场逃单若不即时留置等待警方到场日后债权将难以实现，经理在必要范围内合理拦阻并及时报警，不构成非法侵害人身自由。\nC✗ 众人围观议论源于甲自己吃霸王餐逃单行为本身导致报警事实，经理并未无中生有侮辱诽谤甲。\nD✓ 酒吧经理采取合法必要自助措施阻止逃单顾客离场并即时报警移交公安机关处理，行为合法正当，不构成民事侵权。","k":"","kb":141,"kh":[[233,271]]},{"id":"2023-31","y":2023,"t":"单","s":"某商店在店内安装高清摄像头,在未告知顾客的情况下,抓取进店顾客脸部信息进行识别分析,用于精准营销。对此,下列表述正确的是","o":["商店侵犯了顾客的身体权","商店侵犯了顾客的身份权","商店侵犯了顾客的个人信息权益","人脸信息是公开信息,商店不构成侵权"],"a":"C","e":"\u0001门店擅自安装高清摄像头抓取识别进店顾客人脸生物识别信息用于精准营销，未经告知且未获明确同意，违反信息处理原则，侵害顾客个人信息权益。\u0002\nA✗ 非物理接触或殴打搜身，未侵害身体权。\nB✗ 与家庭亲属婚姻身份无关。\nC✓ 人脸生物识别信息属于《民法典》第1034条及《个人信息保护法》重点保护的敏感个人信息，商店未履行告知同意程序擅自抓拍分析商用，侵害了顾客的个人信息权益。\nD✗ 虽然顾客身处商场等公共场所，但人脸生物特征及其自动化分析识别画像不属“一般可自由商用公开信息”，《民法典》第1036条规定即使处理公开信息亦不得违背个人意愿或超出合理范围，商用抓取明显侵权。","k":"","kb":143,"kh":[[176,205]]},{"id":"2023-48","y":2023,"t":"多","s":"甲与乙发生争执,甲遂将乙的绰号、未公开的结婚照和家庭背景等信息发布到网络上,并散布乙有婚外情的虚假信息,导致乙遭受非议。甲的行为侵犯了乙的","o":["姓名权","肖像权","隐私权","名誉权"],"a":"BCD","e":"\u0001网暴公布未公开结婚照侵害肖像权和隐私权，泄露家庭背景侵害隐私权，散布婚外情虚假谣言侵害名誉权；曝光日常“绰号”一般不侵害姓名权（除非具有广泛社会识别代指特定性或假冒）。\u0002\nA✗ 姓名权主要保护自然人决定、使用、变更或许可他人使用自己正式姓名的权利及制止干涉盗用假冒；仅发争执时披露他人普通“绰号”一般不认定为侵害姓名权（2023真题多选官方标准答案BCD，不含A）。\nB✓ 擅自将乙未公开的结婚照公开发布到网络上，未经同意公开使用他人清晰肖像，侵害了乙的肖像权。\nC✓ 将乙未公开的结婚照以及私人家庭背景等信息公之于众，直接刺探并公开他人不愿人知的私密生活信息，侵害了乙的隐私权。\nD✓ 凭空捏造散布乙有“婚外情”的虚假事实并致使乙遭受公众非议，严重贬损社会评价，侵害了乙的名誉权。","k":"","kb":142,"kh":[[184,200],[283,292]]},{"id":"2024-28","y":2024,"t":"单","s":"甲逛街时,被在该地拍摄街景的乙近距离拍摄,甲不悦,当即离开。次日,甲在某网站看到自己的街拍照片。乙的行为（ ）。","o":["侵害甲的肖像权","侵害甲的隐私权","侵害甲的名誉权","不构成侵权"],"a":"A","e":"\u0001乙未征得街上行人甲同意进行近距离特写街拍（甲已明显不悦走开），次日还将照片擅自发布到网站公开传播，侵害了甲的肖像权。\u0002\nA✓ 依《民法典》第1018、1019条及第1020条，“为了个人学习、艺术欣赏、课堂教学或者科学研究，在必要范围内使用肖像权人已经公开的肖像”或“为展示特定公共环境不可避免制作使用”才免责；本案乙近距离针对尚未公开的个人拍摄并公开发布上网（且甲当场已明确表示不悦），不满足合理使用豁免条件，侵害甲的肖像权。\nB✗ 在大街公开公共场所正常行走着装本身并不属于私密空间或私密活动，不成立隐私侵权。\nC✗ 仅公开街拍照片而无文字贬损侮辱或丑化，一般不侵害名誉权。\nD✗ 不适用“展示特定公共环境不可避免”之例外（近距离刻意特写拍摄个人且甲明显反感后仍上传网络公开）。","k":"","kb":142,"kh":[[162,175]]},{"id":"2025-22","y":2025,"t":"单","s":"甲用自己的手机号码在A 公司开发的APP 注册成为用户,后A 公司向甲发送手机短信: “甲先生,向您推荐优惠商品,退订回复TD。\"A 公司的行为（ ）。","o":["不构成侵权","侵害了甲的隐私权","侵害了甲的姓名权","侵害了甲的个人信息权益"],"a":"A","e":"\u0001用户在APP注册时自行提供手机号，平台发送“甲先生，向您推荐优惠商品，退订回复TD”附有显著退订指引的商业营销短信，未侵扰私人安宁或非法泄露，不构成侵权。\u0002\nA✓ 甲系主动使用自己手机号在涉案APP注册用户并留存信息，平台据此向该注册号码发送单次附有明确便捷“退订回复TD”提示的优惠商品推荐短信，不属非法侵入私人生活安宁、亦未倒卖泄露，不构成民事侵权。\nB✗ 发给注册手机号的普通合规商业推荐未刺探或侵扰私人安宁（不同于拒不退订、高频骚扰轰炸电话短信）。\nC✗ 称呼注册用户姓氏“甲先生”礼貌发送信息并非假冒、干涉他人姓名。\nD✗ 注册环节甲已向平台合法提供并同意交互联系手机号，且提供“TD”便捷拒绝退订路径，符合《个人信息保护法》及《民法典》合理利用规则。","k":"","kb":143,"kh":[[205,239]]},{"id":"2025-49","y":2025,"t":"多","s":"A公司研制了一种治疗白血病的新药，需要进行临床试验。为保障受试者的合法权益，A公司进行临床试验应当（ ）。","o":["依法经相关主管部门批准","依法经伦理委员会审查同意","向受试者告知可能产生的风险,并经其书面同意","将向受试者收取的试验费用全部用于受试者的诊疗"],"a":"ABC","e":"\u0001开展新药临床试验必须依法经相关主管部门批准和伦理委员会审查同意，并充分告知受试者可能风险且经其书面同意；严禁向受试者收取试验费用。\u0002\nA✓ 依《民法典》第1008条第1款，为研制新药等进行临床试验应当依法经相关主管部门批准。\nB✓ 开展医学临床试验必须同时依法经过伦理委员会审查同意。\nC✓ 试验前应当向受试者（或其监护人）详细说明试验目的、用途和可能产生的风险，并经其书面同意。\nD✗ 《民法典》第1008条第2款明文禁止：“进行临床试验，不得向受试者收取试验费用。”选项称收取试验费用哪怕用于诊疗亦属绝对违法。","k":"","kb":141,"kh":[[271,329]]}]},{"sub":"刑法","name":"量刑制度","w":1.7,"L":27,"qs":[{"id":"2007-4","y":2007,"t":"单","s":"根据我国刑法规定,已满 14 周岁不满 18 周岁的人犯罪 （ ）。","o":["可以从轻或者减轻处罚","应当从轻或者减轻处罚","可以减轻或者免除处罚","应当减轻或者免除处罚"],"a":"B","e":"\u0001《刑法》第17条第4款规定，已满14周岁不满18周岁的人犯罪，应当从轻或者减轻处罚（刚性应当从宽，不含免除）。\u0002\nA✗ 不是“可以”，对未成年人犯罪实行刚性法定从宽，必须用“\u0001应当\u0002”\nB✓ 应当从轻或者减轻处罚：完全符合《刑法》第17条第4款原文（不含“免除处罚”）\nC✗ 既不是“可以”也不包含“免除处罚”\nD✗ 未成年人犯罪的法定情节是“从轻或者减轻”，而非“应当减轻或者免除”（注意区别于防卫过当与避险过当的“应当减轻或者免除”）","k":"","kb":39,"kh":[[153,180]]},{"id":"2007-12","y":2007,"t":"单","s":"甲因交通肇事罪被判处有期徒刑 2 年,缓刑 3 年。在缓刑考验期经过 1 年时,甲又因失火罪被判处有期徒刑 4 年。对甲应 （ ）。","o":["撤销缓刑,在 6 年以下、 4 年以上决定执行的刑期","撤销缓刑,在 6 年以下、 4 年以上决定执行的刑期,经过的 1 年考验期计入应执行的刑期","撤销缓刑,减去经过的 1 年考验期,在 5 年以下、 4 年以上决定执行的刑期","不撤销缓刑,先执行有期徒刑 4 年,然后继续进行缓刑考验"],"a":"A","e":"\u0001缓刑考验期内再犯新罪，应当撤销缓刑，对前罪2年和后罪4年直接并罚（在4年以上6年以下决定刑期），已过的1年缓刑考验期不能折抵刑期。\u0002\nA✓ 撤销缓刑，在6年以下、4年以上决定执行的刑期：前罪原判2年与后罪新判4年按限制加重原则合并，总和刑期6年，最高刑4年，考验期不计入实刑折抵\nB✗ 缓刑考验期间并未关押服刑，已经经过的1年考验期\u0001不能计入\u0002应当执行的刑期\nC✗ 考验期不折抵原判2年实刑，因此上限仍是6年而非减去1年后的5年\nD✗ 缓刑考验期犯新罪属于法定\u0001应当撤销缓刑\u0002事由，必须撤销缓刑合并执行\n重要细节：被撤销缓刑执行原判刑罚时，之前已经经过的\u0001缓刑考验期不折抵刑期\u0002（与假释不同，且先行羁押日期才折抵刑期）；因为没有“先减后并”中的实刑执行，故前罪2年全部参与并罚！","k":"","kb":43,"kh":[[260,288]]},{"id":"2007-24","y":2007,"t":"多","s":"下列情形中,可以认定为自首的有 （ ）。","o":["犯罪嫌疑人甲主动向司法机关揭发他人重大犯罪行为","乙故意重伤他人,被家人扭送到司法机关后,如实供述自己的罪行","丙因盗窃行为被公安机关抓获,在审讯中又主动供述其他盗窃罪行","丁贪污公款,在贪污行为被发觉前,主动向司法机关投案,如实供述自己的罪行"],"a":"BD","e":"\u0001亲友扭送投案如实供述、罪行发觉前主动投案如实供述均属自首；揭发他人属立功；审讯中如实供述同种余罪属坦白。\u0002\nA✗ 犯罪嫌疑人揭发他人犯罪行为，经查证属实，属于\u0001立功\u0002，不是自首\nB✓ 乙犯罪后虽非亲自前往，但\u0001被家人扭送到司法机关\u0002并如实供述自己重伤他人罪行，司法解释明确视为“自动投案”，成立自首\nC✗ 丙被抓获后供述司法机关未掌握的“\u0001其他盗窃罪行\u0002”（与逮捕罪名属于\u0001同种罪行\u0002），成立坦白而非特别自首\nD✓ 贪污行为尚未被司法机关发觉前主动投案并如实供述罪行，属于典型的一般自首","k":"","kb":40,"kh":[[16,39],[78,148]]},{"id":"20
