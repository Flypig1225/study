务，债权人能证明该债务用于夫妻共同生活（购买婚后共有住房登记于妻子名下）的，认定为夫妻共同债务，由甲、乙承担连带清偿责任（离婚亦不免除）。\nD✗ 对外债权人而言，夫妻共同债务承担的是连带责任，而非按份各承担一半。","k":"","kb":152,"kh":[[321,369]]},{"id":"2025-26","y":2025,"t":"单","s":"甲、乙在离婚协议中约定:共有房屋归甲所有;共同债务50 万元由乙偿还。但乙未按约定与甲办理离婚登记。后甲起诉请求离婚并执行离婚协议,乙不同意甲的诉讼请求。人民法院判决准予离婚。甲与乙之间关于财产和债务处理的约定（ ）。","o":["不成立","没有生效","无效","效力待定"],"a":"B","e":"\u0001依据《民法典婚姻家庭编解释（一）》第69条第1款，当事人达成的以协议离婚为条件的财产以及债务处理协议，如果双方未能协议离婚成功而在离婚诉讼中一方反悔的，法院应认定该协议“没有生效”。\u0002\nA✗ 双方已经就财产债务条款达成真实合意签字，协议业已“成立”，只是附了登记离婚生效条件未成就。\nB✓ 完全精准对应司法解释第69条：当事人达成的以登记离婚或者到法院调解离婚为条件的财产以及债务处理协议，如果双方离婚未成、一方在离婚诉讼中反悔的，法院应当认定该协议“没有生效”，另依法判决分割财产债务。\nC✗ 协议内容本身未违反法律强制规定，不是“无效”而是“附条件尚未生效”。\nD✗ 不涉及限制行为能力或无权代理追认问题，非效力待定。","k":"","kb":152,"kh":[[500,533]]},{"id":"2026-24","y":2026,"t":"单","s":"甲与乙是恋人关系,甲在乙生日时送了乙一台相机,乙在甲生日时转账1314 元,2024 年甲乙订婚时,甲的父母根据当地习俗送给乙一套黄金首饰,后来甲、乙取消婚约。下列说法正确的是","o":["甲有权请求乙归还相机","甲的父母有权请求乙归还黄金首饰","甲无权请求乙归还黄金首饰","乙有权请求甲归还1314 元"],"a":"B","e":"\u0001恋人恋爱期间送相机与生日转账“1314元”均属一般表情意无偿赠与不可索还；订婚时男方父母依习俗所送黄金首饰属于以缔结婚约为目的给付的彩礼，婚约解除后有权请求返还。\u0002\nA✗ 乙生日时甲赠送相机属于恋人之间联络感情的日常消费性无偿赠与，交付后即完成赠与不可任意撤销索回。\nB✓ 依据《民法典婚姻家庭编解释（一）》第5条及2024《最高人民法院关于审理涉彩礼纠纷案件适用法律若干问题的规定》，男方父母按当地习俗为订婚所送价值较大的黄金首饰属于“彩礼”，现双方尚未办理结婚登记且取消婚约，实际给付人（甲的父母）依法有权请求乙返还彩礼。\nC✗ 黄金首饰系以结婚为目的之彩礼，取消婚约后应当予以返还。\nD✗ “1314元”系恋爱生日特定含义金额的表达爱意转账，属于增进感情的一般无偿情谊赠与，不得作为彩礼主张返还。","k":"","kb":152,"kh":[[580,618]]},{"id":"2026-40","y":2026,"t":"单","s":"甲、乙婚后以甲的名义注册了某网络平台账号,甲负责直播,乙负责运营。账号粉丝50 万,直播收益80 万元。后甲乙离婚,下列说法正确的是","o":["账号和直播收益都归属于甲","账号和直播收益归甲、乙共同所有","账号归甲,直播收益归甲、乙共同所有","账号归甲、乙共同所有,直播收益归甲"],"a":"B","e":"\u0001婚后以甲名义注册的网络平台账号由甲负责出镜直播、乙负责幕后运营，系夫妻婚姻存续期间共同投入劳动经营积累形成的具有财产价值的财产性权益，该网络账号及80万元收益均归夫妻共同所有。\u0002\nA✗ 不能因为账号实名注册在甲一人名下便归甲个人独吞，婚姻存续期间共同劳动经营所得无论登记在谁名下原则上均为共有。\nB✓ 夫妻婚后共同打造运营的具有显著经济价值（50万粉丝、80万收益）的自媒体网络直播账号属于可流转分割的夫妻共同财产性权益，与直播收益80万元一并归甲、乙共同所有。\nC✗ 账号凝聚了乙长期的共同运营投入及粉丝经济价值，非纯粹无法分割的人身账号，亦应作为共同财产合理折价或归属补偿。\nD✗ 直播收益属于婚后劳动经营所得，显属夫妻共同财产，绝无单归甲之理。","k":"","kb":152,"kh":[[119,145]]},{"id":"2026-49","y":2026,"t":"多","s":"甲乙协议离婚,约定二人共有房屋给予儿子丙,丙可就房屋直接向父母主张权利。一年后甲再婚,拒绝将房屋过户给丙。下列说法正确的有","o":["甲、乙赠予丙房屋的约定无效","甲在房屋所有权转移前,有权单方撤销赠与","乙有权请求甲将房屋过户给丙","丙有权请求甲将房屋过户给自己"],"a":"CD","e":"\u0001离婚协议中夫妻共同约定将共有房屋赠与儿子丙并赋予丙直接请求权，既受《婚姻家庭编解释（二）》禁止离婚后单方任意撤销保护，又使乙与受益第三人丙均享有请求甲履行过户的权利。\u0002\nA✗ 夫妻在离婚协议中自愿处分共有房产赠与子女完全合法有效，且受离婚整体一揽子协议效力拘束。\nB✗ 依《民法典婚姻家庭编解释（二）》第20条（及第658条例外），离婚协议中涉及向子女赠与房产约定与整个解除婚姻、财产分割互为整体条件，婚姻关系已经解除后一方不得行使任意撤销权单方反悔撤回。\nC✓ 乙作为离婚协议相对缔约方，有权依据双方签署生效的离婚协议要求违约拒不过户的甲履行配合办理房屋过户手续。\nD✓ 双方在协议中明确约定“丙可就房屋直接向父母主张权利”，属于《民法典》第522条第2款（真正利益第三人合同）及婚姻家庭编司法解释赋予子女的直接履行请求权，故儿子丙也有权直接请求甲将房屋过户给自己。","k":"","kb":152,"kh":[[534,579]]}]},{"sub":"刑法","name":"犯罪构成与客观方面","w":2.0,"L":39,"qs":[{"id":"2005-2","y":2005,"t":"单","s":"我国刑法分则对犯罪分类的主要根据是（ ）。","o":["犯罪的一般客体","犯罪的同类客体","犯罪的直接客体","犯罪的对象"],"a":"B","e":"\u0001我国刑法分则按犯罪所侵犯的“同类客体”（某一类犯罪共同侵犯的社会关系），将分则犯罪分为十大章从而构筑起完整刑法分则体系。\u0002\nA✗ 一般客体是所有犯罪共同侵犯的整体社会关系，无法用以在犯罪内部细分章节\nB✓ 犯罪的同类客体：刑法分则十大章（危害国家安全罪至渎职罪）正是严格按照\u0001同类客体\u0002的不同予以科学划分\nC✗ 直接客体说明单个具体罪名侵犯的特定社会关系，颗粒度太细无法作为分则十章结构纲领\nD✗ 同一犯罪对象（如人身或机动车）可被完全不同性质的多类罪名侵犯（如故意杀人罪与侮辱罪、盗窃与破坏交通工具罪），不能充当分则体系分类主线","k":"","kb":85,"kh":[[60,97]]},{"id":"2005-3","y":2005,"t":"单","s":"甲因为重男轻女,将妻子刚生下才 3 天的女婴包裹好放在医院门口,躲在一边观察。见有群众围观、议论,便放心离开。第二天一早,甲又到医院门口查看,见女婴还在,但女婴却因晚间气温过低被冻死。法官据此判决甲构成遗弃罪。甲的行为属于（ ）。","o":["纯正的作为犯","不纯正的作为犯","纯正的不作为犯","不纯正的不作为犯"],"a":"C","e":"\u0001遗弃罪按刑法条文设定只能以“拒绝履行扶养义务”这种消极不作为方式构成；甲将出生3天女婴遗弃在医院门口致冻死（按遗弃罪判决），属于纯正的不作为犯。\u0002\nA✗ 行为本质是消极拒绝履行法定义务而非积极加害动作\nB✗ 既不是作为犯也不是以作为充当不作为（刑法上常见分类为纯正/不纯正不作为犯，遗弃罪本质是不作为犯）\nC✓ 纯正的不作为犯：刑法第261条明确将遗弃罪的行为形式规定为“拒绝扶养”，法律条文自身即只能由不作为实行，行为人的不作为形式与法定罪状完全吻合，属\u0001纯正不作为犯\u0002\nD✗ 不纯正不作为犯是以不作为形式犯通常由作为实施的罪名（若法官当时判的是故意杀人罪才属于不纯正不作为犯，本题明确“法官据此判决甲构成遗弃罪”）","k":"","kb":87,"kh":[[211,238]]},{"id":"2006-3","y":2006,"t":"单","s":"甲唆使乙在某学校食堂的面粉中投放“毒鼠强”一包,造成数十人中毒死亡的结果。法院认定甲构成投放危险物质罪。甲的行为具备（ ）。","o":["标准的犯罪构成","复杂的犯罪构成","基本的犯罪构成","修正的犯罪构成"],"a":"D","e":"\u0001教唆犯是在刑法分则基本犯罪构成基础上，结合刑法总则第29条共同犯罪条文扩展形成的“修正的犯罪构成”。\u0002\nA✗ 标准的犯罪构成是指分则条文对通常社会危害程度的单人既遂犯罪规定，教唆他人放毒需通过总则第29条修正适用\nB✗ “复杂的犯罪构成”指刑法条文内部有数个客体/行为选择等，而教唆犯、帮助犯、预备/未遂/中止专门归属于“修正的犯罪构成”\nC✗ 基本的犯罪构成指分则条文单独就某罪直接实行既遂所设的常态要件（若乙自己投毒则是基本犯罪构成，唆使者甲无亲自投毒实行行为须依赖共犯总则修正）\nD✓ 修正的犯罪构成：教唆犯、帮助犯以及犯罪预备、未遂、中止形态都缺乏分则既遂实行犯完整要件，必须依据刑法总则相关条款修正补充后才能归责，故属\u0001修正的犯罪构成\u0002","k":"","kb":86,"kh":[[196,251]]},{"id":"2007-2","y":2007,"t":"单","s":"犯罪同类客体最显著的作用是 （ ）。","o":["区分此罪与彼罪的根据","构建刑法分则体系的根据","确立具体犯罪构成的依据","区分故意犯罪与过失犯罪的根据"],"a":"B","e":"\u0001同类客体最重要的理论与立法价值在于它是科学划分十章犯罪、建立我国刑法分则体系的根据。\u0002\nA✗ 区分此罪与彼罪主要依靠具体犯罪的\u0001直接客体\u0002及具体犯罪构成特征，而非大而化之的同类客体（同一章内仍有大量此罪彼罪需要区分）\nB✓ 构建刑法分则体系的根据：我国刑法分则正是依照\u0001同类客体\u0002（国家安全、公共安全、经济秩序、人身权利、财产权利等）将四百余罪分为十大章排列\nC✗ 具体犯罪构成的依据也是直接客体与具体行为罪过要件\nD✗ 故意与过失区分在于犯罪主观方面心理态度","k":"","kb":85,"kh":[[60,97]]},{"id":"2007-3","y":2007,"t":"单","s":"甲对某危害结果没有阻止其发生的义务,如果该危害结果发生,甲的不作为行为 （ ）。","o":["不可能构成犯罪","可能构成纯正的不作为犯罪","可能构成不纯正的不作为犯","可能构成手段不能犯"],"a":"A","e":"\u0001不作为犯罪的首要前提是行为人负有“阻止危害结果发生的特定义务”。毫无特定义务者袖手旁观，即使危害结果发生也绝不可能构成任何不作为犯罪。\u0002\nA✓ 不可能构成犯罪：缺乏法定的、职务业务上的、合同法律行为或先行行为所生的\u0001特定作为义务\u0002，便缺失不作为犯的客观核心前提，无论是纯正还是不纯正不作为犯都一概不成立\nB✗ 纯正不作为犯同样必须以刑法明确规定该主体负有特定作为义务为铁律（如父母对未成年子女抚养义务、纳税人缴税义务）\nC✗ 不纯正不作为犯同样要求行为人处于保证人地位、负有阻止结果的特定义务\nD✗ 手段不能犯是指行为人出于故意实施积极的加害作为但选错毫无致害可能的方法（例如拿白糖当砒霜投毒），跟无义务旁观毫不相干","k":"","kb":87,"kh":[[71,82]]},{"id":"2008-2","y":2008,"t":"单","s":"故意杀人罪(未遂)的犯罪构成属于（ ）。","o":["基本的犯罪构成","修正的犯罪构成","派生的犯罪构成","减轻的犯罪构成"],"a":"B","e":"\u0001《刑法》第232条规定的是故意杀人罪既遂的基本形态，而“故意杀人罪（未遂）”要结合总则第23条规定认定追责，属于修正的犯罪构成。\u0002\nA✗ 基本犯罪构成指分则条文单独描述的实行既遂形态\nB✓ 修正的犯罪构成：故意杀人未遂、预备、中止以及共同犯罪中的教唆犯、帮助犯，均以分则第232条基本构成要件为原型并用总则条款补充修正，属于\u0001修正的犯罪构成\u0002\nC✗ 派生的犯罪构成是指分则条文明确规定的“加重”或者“减轻”的法定刑形态（如第232条“情节较轻的，处三年以上十年以下有期徒刑”），未遂不是派生的犯罪构成\nD✗ “减轻的犯罪构成”特指分则条文对特定情节直接规定了低于基本法定刑的独立罪刑单位（如故意杀人情节较轻），犯罪未遂属于总则量刑与未完成形态范畴，属于修正的犯罪构成而非分则减轻犯罪构成","k":"","kb":86,"kh":[[196,251]]},{"id":"2008-3","y":2008,"t":"单","s":"下列犯罪行为中,属于不作为行为方式的是（ ）。","o":["甲因高兴将 3 岁儿子抛接但因失手致其死亡","乙分娩婴儿后为掩盖未婚先孕真相将婴儿扔出窗外致婴儿死亡","丙分娩女婴后不愿抚养,遂以 2 万元价格将其卖给他人","丁分娩婴儿后将婴儿弃置于火车站致其冻成重伤"],"a":"D","e":"\u0001抛接幼儿失手、将新生儿扔出窗外、将女婴出卖均是积极的身体动作（作为）；唯有“将婴儿弃置于火车站不管”是消极不履行法定抚养义务的不作为遗弃行为。\u0002\nA✗ 向上“抛接”孩子失手是积极身体动作引起的作为过失致人死亡行为\nB✗ 将婴儿“扔出窗外”显然是积极的物理作为（构成作为的故意杀人罪）\nC✗ 以2万元“出卖”亲生女婴同样是积极交易交付的作为行为（构成拐卖儿童罪）\nD✓ 丁分娩婴儿后将婴儿弃置于火车站致其冻成重伤：对负有法定抚养义务的新生婴儿消极拒绝抚养、丢弃不管（致冻成重伤或遗弃致死），本质上是违反“应当履行抚养义务”的命令性规范，构成\u0001不作为\u0002形式的犯罪","k":"","kb":87,"kh":[[169,189],[211,238]]},{"id":"2008-7","y":2008,"t":"单","s":"成立犯罪不可缺少的要素是（ ）。","o":["犯罪行为","犯罪结果","犯罪目的","犯罪动机"],"a":"A","e":"\u0001危害行为（犯罪行为）是任何犯罪成立在客观方面都绝对不可缺少的必备核心要素；犯罪结果、犯罪目的和犯罪动机在部分犯罪中则不是必备要件。\u0002\nA✓ 犯罪行为：没有危害行为就没有犯罪（哪怕行为犯、举动犯，也必须有实行行为；哪怕不作为犯，也是不作为形式的危害行为），是一切犯罪成立不可或缺的必备要素\nB✗ 危险犯、行为犯和举动犯不以实际危害结果发生为成立条件；故意犯罪预备、未遂也无既遂结果\nC✗ 犯罪目的仅仅是直接故意犯罪（尤其是部分目的犯如集资诈骗罪、拐卖妇女罪）才要求，过失犯罪和间接故意根本没有犯罪目的\nD✗ 犯罪动机仅影响量刑，并非定罪的构成要件（任何犯罪不要求特定动机才成立）","k":"","kb":87,"kh":[[0,48]]},{"id":"2009-3","y":2009,"t":"单","s":"下列关于犯罪客体的表述,错误的是 （ ）。","o":["犯罪同类客体是建立刑法分则体系的主要依据","犯罪直接客体就是犯罪行为直接指向的人或物","犯罪直接客体是刑法所保护而被犯罪侵犯的具体社会关系","一个犯罪可以同时侵犯数个直接客体"],"a":"B","e":"\u0001犯罪直接客体是“具体犯罪直接侵犯的刑法所保护的具体社会关系”；而犯罪行为直接指向的“具体的人或物”叫“犯罪对象”，切忌把客体和对象混为一谈！\u0002\nA✗ 该表述正确：刑法分则按同类客体分为十章构建分则体系\nB✓ 犯罪直接客体就是犯罪行为直接指向的人或物（当选错误项）：直接指向的具体人或物是\u0001犯罪对象\u0002（现象），而非犯罪客体（被侵害的社会关系本质）\nC✗ 该表述正确：准确揭示了直接客体的内涵\nD✗ 该表述正确：抢劫罪同时侵犯人身权利和财产权利两种直接客体，即复杂客体","k":"","kb":85,"kh":[[98,130],[132,177]]},{"id":"2009-4","y":2009,"t":"单","s":"下列犯罪行为中，属于纯正不作为犯的是（ ）。","o":["甲过失致陈某重伤后拒不送医,致其死亡","乙对严重残疾的儿子拒绝抚养,致其冻饿身亡","丙对自己负责维修的锅炉不维修,致锅炉爆炸","丁过失引起火险后,不予扑灭,酿成火灾"],"a":"B","e":"\u0001遗弃罪法条明确设定为拒绝扶养的不作为罪名，属纯正不作为犯；故意杀人、爆炸、放火通常由作为构成，以不作为违背保证人义务去实施则属于“不纯正不作为犯”。\u0002\nA✗ 撞伤他人后负有先行行为救助义务却拒不送医致死（成立不作为故意杀人罪），通常故意杀人罪是以刀砍枪击等积极作为实施，故属\u0001不纯正不作为犯\u0002\nB✓ 乙对严重残疾的儿子拒绝抚养，致其冻饿身亡：构成刑法第261条明确只能由拒绝履行抚养义务这一不作为方式实施的遗弃罪（注意看乙意图：若仅为拒不扶养且法条本罪即不作为，2009真题以此对应纯正不作为犯之遗弃罪），属\u0001纯正不作为犯\u0002\nC✗ 不履行职务检修义务致锅炉爆炸，可能成立重大责任事故或危险物品肇事，属于不纯正不作为犯（通常也包含积极违规操作或以不作为完成过失危险罪）\nD✗ 过失引火后有先行行为扑灭义务而不予扑灭酿成火灾，可能构成不作为放火罪（不纯正不作为犯，因为典型放火罪是点火作为）","k":"","kb":87,"kh":[[211,238],[274,306]]},{"id":"2009-5","y":2009,"t":"单","s":"在抢劫犯罪中,犯罪时间（ ）。","o":["是抢劫罪的必要要件","是抢劫罪的选择要件","是抢劫罪的加重情节","与抢劫罪的犯罪构成要件无关"],"a":"D","e":"\u0001《刑法》第263条抢劫罪罪状中既不要求特定作案时间也不把夜间/白天作为入罪条件，因此犯罪时间在普通抢劫罪中并非构成要件或法定加重情节。\u0002\nA✗ 抢劫罪构成要件只需以暴力、胁迫或其他方法当场劫取公私财物，不分昼夜随时可成立\nB✗ “选择要件”专指某些特定罪名依法明文择一要求具备特定时间、地点、方法（如非法狩猎罪中的禁猎期/禁猎区、战时违令罪等）；抢劫罪条文完全没提时间\nC✗ 抢劫罪的8种法定加重情节是入户抢劫、公共交通工具抢劫、抢劫银行、多次抢劫、数额巨大、致重伤死亡、冒充军警、持枪抢劫，没有任何一项关于“作案时间”\nD✓ 与抢劫罪的犯罪构成要件无关：对绝大多数普通犯罪（包括抢劫罪）而言，实施行为的时间仅仅是一般事实背景要素，既非成立要件也非升格法定刑条件","k":"","kb":87,"kh":[[23,47]]},{"id":"2009-21","y":2009,"t":"多","s":"对犯罪客体按照其范围大小可划分为（ ）。","o":["一般客体","同类客体","直接客体","复杂客体"],"a":"ABC","e":"\u0001按犯罪客体范围大小（从最宏观到最微观），依次划分为一般客体、同类客体和直接客体三层次；复杂客体则是直接客体内部的再分类。\u0002\nA✓ 一般客体：最宏观层次，指一切犯罪共同侵犯的社会主义社会关系的整体\nB✓ 同类客体：中观层次，指某一类犯罪共同侵犯的某一类社会关系（分则章分类依据）\nC✓ 直接客体：微观层次，指某一个具体犯罪直接侵犯的具体社会关系\nD✗ 简单客体与复杂客体是在“直接客体”之下依据侵犯具体社会关系数量多少（一种还是两种以上）所作的二级划分，并非客体范围大小三层次本身","k":"","kb":85,"kh":[[29,102]]},{"id":"2009-22","y":2009,"t":"多","s":"下列关于危害结果在犯罪构成中的地位的表述,正确的有（ ）。","o":["危害结果是某些犯罪成立的必备要件","危害结果是某些犯罪既遂的必备要件","行为犯的既遂不要求危害结果的实际发生","危险犯的既遂不要求实际危害结果的发生"],"a":"ABCD","e":"\u0001危害结果在刑法中的作用因犯罪类型各异：过失犯罪（实害犯）必须出现结果才成立；故意实害结果犯必须出现结果才既遂；行为犯与危险犯既遂均不要求实害结果实际出现。\u0002\nA✓ 所有过失犯罪（如交通肇事、过失致人死亡）和部分结果犯，必须实际造成法定危害结果才“成立”犯罪\nB✓ 绝大多数直接故意实害结果犯（如故意杀人罪、抢劫罪非加重等/故意伤害罪/盗窃罪），在构成犯罪前提下以法定实害结果出现作为“既遂”必备条件\nC✓ 行为犯（如脱逃罪、伪证罪、诬告陷害罪）只要将法定实行行为实施完毕即构成既遂，不以实际逃脱抓捕失败与否等进一步物质实害为既遂前提\nD✓ 危险犯（如放火罪、破坏交通工具罪）只要行为造成危及公共安全的法定具体现实危险状态即构成既遂，无需真正烧毁房屋倾覆列车","k":"","kb":88,"kh":[[5,150]]},{"id":"2010-3","y":2010,"t":"单","s":"行为人因不能抗拒的原因而引起损害结果的, 不是犯罪,这是由于行为人（ ）。","o":["对危害结果的发生没有认识","对危害结果的发生没有预见","对危害结果的发生不存在故意或者过失","不具备犯罪的主体条件"],"a":"C","e":"\u0001面对不能抗拒的外力（不可抗力），行为人既非故意追求/放任也无任何过失违背注意义务，欠缺犯罪主观方面罪过要件，因此绝对不是犯罪。\u0002\nA✗ 即便在完全“没有认识”的疏忽大意过失情形下，只要行为人“应当预见且能够预见”，仍然可以构成过失犯罪；而不可抗力甚至连行为人“清楚认识到了即将发生的危险”但实在无力抗拒也照样不认为是犯罪\nB✗ 如上，意外事件是对危害结果没有预见且不可能预见，但不可抗力完全可能已明确预见却无法抗拒（如被劫匪捆绑无法拨打报警、暴雨洪峰冲断铁道值班工无法扳道岔）\nC✓ 对危害结果的发生不存在故意或者过失：依照《刑法》第16条，行为在客观上虽然造成了损害结果，但不是出于故意或者过失，而是由于不能抗拒或不能预见的原因引起的，不是犯罪\nD✗ 行为人完全具备法定刑事责任年龄与精神辨认控制能力，不缺少犯罪主体条件","k":"","kb":26,"kh":[[167,204]]},{"id":"2010-6","y":2010,"t":"单","s":"甲想杀死乙,从远处向乙开枪射击,致乙重伤。甲的行为符合（ ）。","o":["标准的犯罪构成","修正的犯罪构成","基本的犯罪构成","派生的犯罪构成"],"a":"B","e":"\u0001本案中甲开枪致乙重伤而未死亡，构成故意杀人罪（未遂），属于以刑法分则基本构成为原型结合总则第23条加以修正的“修正的犯罪构成”。\u0002\nA✗ “标准的犯罪构成”指不加法定增减条件的基本完成犯罪形态（故意杀人既遂）；故意杀人未遂适用总则修正，不属于标准犯罪构成\nB✓ 修正的犯罪构成：故意杀人未遂以第232条故意杀人罪基本犯罪构成为基干，并用总则第23条未遂条文对结果要件予以修正补充，属\u0001修正的犯罪构成\u0002\nC✗ 基本犯罪构成仅涵盖直接符合分则条文的既遂常态犯罪\nD✗ 派生的犯罪构成（加重/减轻）仅由分则明文单列法定刑档次（如故意杀人情节较轻），未遂属于修正的犯罪构成","k":"","kb":86,"kh":[[196,251]]},{"id":"2011-13","y":2011,"t":"单","s":"下列关于过失犯罪的说法中,正确的是（ ）。","o":["过失犯罪是指行为人对于危害结果的发生没有预见的犯罪","过失犯罪既可以由不作为方式构成,也可以由作为方式构成","过失犯罪未造成严重结果的,可以按照犯罪未遂从轻或者减轻处罚","对具有高度危险的过失行为,即使未造成法律规定的实害结果,也应当定罪处罚"],"a":"B","e":"\u0001过失犯罪既可以由积极违章作为实施（如飙车撞死人），也可以由消极不履行特定义务实施（如值班医师严重失职未巡房致死）；过失犯罪没有未遂、必须造成实害后果才定罪。\u0002\nA✗ 过失犯罪不仅包括“没有预见”的疏忽大意过失，还包括“已经预见而轻信能够避免”的过于自信过失\nB✓ 过失犯罪既可以由不作为方式构成，也可以由作为方式构成：例如玩忽职守罪、重大责任事故罪、医疗事故罪均既可能表现为违章胡干（作为），也可能表现为严重怠工失职放任不管（不作为）\nC✗ 未遂、预备、中止形态只存在于直接故意犯罪中；《刑法》第15条确立过失行为未造成法律规定的实害结果的一概不构成犯罪，绝不存在“过失未遂犯”\nD✗ 过失以危害结果实际发生为成罪界限（不存在危险犯形式的过失罪，仅个别具体条文如妨害传染病防治罪因法益危机有特殊规定亦要求引起传播严重危险，传统通说不以纯高度危险一概惩罚普通过失未成实害）","k":"","kb":87,"kh":[[190,205]]},{"id":"2012-3","y":2012,"t":"单","s":"下列关于犯罪直接客体的说法,正确的是（ ）。","o":["一个犯罪只侵犯一个直接客体","直接客体是对犯罪进行分类的标准","在犯罪未遂的情况下不存在直接客体","直接客体是指某一犯罪行为直接侵害的特定社会关系"],"a":"D","e":"\u0001犯罪直接客体是某一具体犯罪直接侵害的特定具体社会关系；一罪也可同时侵犯多个直接客体（复杂客体），且犯罪未遂照样有直接客体。\u0002\nA✗ 存在同时侵犯两种以上社会关系的“复杂客体”，如抢劫罪既侵害被害人财产所有权又侵害公民人身健康安全\nB✗ 构建十章分则体系划分犯罪类型依据的是\u0001同类客体\u0002，而不是具体零碎的直接客体\nC✗ 没有哪个犯罪不存在客体！哪怕故意杀人未遂，依然在客观上现实威胁并直接侵犯了他人的生命法益（直接客体），只是实害尚未达成\nD✓ 直接客体是指某一犯罪行为直接侵害的特定社会关系：精准符合直接客体的定义","k":"","kb":85,"kh":[[98,130]]},{"id":"2012-4","y":2012,"t":"单","s":"下列犯罪属于纯正不作为犯的是（ ）。","o":["重婚罪","遗弃罪","绑架罪","掩饰、隐瞒犯罪所得罪"],"a":"B","e":"\u0001《刑法》第261条“遗弃罪”明确表述为负有扶养义务而“拒绝扶养”，法条本身只能由消极不作为形式实施，属典型纯正不作为犯。\u0002\nA✗ 重婚罪是积极与他人结婚或以夫妻名义同居的作为犯罪\nB✓ 遗弃罪：法条直接规定拒绝履行法定义务即构成，只能通过不作为实现，属典型\u0001纯正不作为犯\u0002\nC✗ 绑架罪是使用暴力、胁迫或麻醉方法控制人质索财的积极作为犯罪\nD✗ 掩饰、隐瞒犯罪所得罪是实施窝藏、转移、收购、代为销售赃物的积极作为犯罪","k":"","kb":87,"kh":[[211,238]]},{"id":"2013-41","y":2013,"t":"多","s":"下列选项中,属于犯罪不作为成立条件的有（ ）。","o":["行为人负有特定义务","行为人没有实施任何行为","行为人未履行特定义务","行为人能够履行特定义务"],"a":"ACD","e":"\u0001成立刑法上的不作为犯罪必须满足三大条件：①负有特定作为义务；②有实际履行义务的能力；③不履行该特定义务（并导致或可能引起危害结果）。注意：不作为并不意味着人完全木僵“没有实施任何行为”！\u0002\nA✓ 行为人负有某种特定义务是核心法律前提\nB✗ “不作为”仅仅是“没有实施其依法应当履行的那项特定保护/救助行为”，完全不影响其在同时干别的事（例如母亲拒绝给婴儿喂奶导致饿死，期间她自己天天照常逛街吃饭打麻将，照样构成不作为故意杀人罪！）\nC✓ 行为人未履行该特定义务\nD✓ 行为人客观上能够履行该特定义务（法律不强人所难；如果当时重病瘫痪根本动弹不得、或洪水太大确实无法救人，则因没有履行能力而不成立不作为犯罪）","k":"","kb":87,"kh":[[59,82],[149,189]]},{"id":"2014-5","y":2014,"t":"单","s":"下列关于犯罪对象的说法中,正确的是（ ）。","o":["犯罪对象是犯罪客体的载体","犯罪对象的功能是区分此罪与彼罪","犯罪对象是一切犯罪都必须具备的构成要件","犯罪对象是刑法所保护的、为犯罪行为所侵犯的社会关系"],"a":"A","e":"\u0001犯罪对象是犯罪行为直接指向的具体人、物或信息，它是抽象社会关系（犯罪客体）的具象载体，二者呈现“现象与本质”关系。\u0002\nA✓ 犯罪对象是犯罪客体的载体：社会关系（如财产所有权、人身健康权）看不见摸不着，往往寓于具体财物、人体等\u0001犯罪对象\u0002之中\nB✗ 区分此罪与彼罪依靠具体犯罪构成要件（尤其是直接客体和主观故意等），仅靠犯罪对象无法区分（同是一个人，可以是杀人罪对象也可以是绑架罪、侮辱罪对象）\nC✗ 脱逃罪、偷越国边境罪等无具体指向的特定人或物，并非所有犯罪都必具犯罪对象\nD✗ “刑法所保护的、为犯罪行为所侵犯的社会关系”是\u0001犯罪客体\u0002的定义，不是犯罪对象","k":"","kb":85,"kh":[[132,208]]},{"id":"2015-2","y":2015,"t":"单","s":"下列选项中,属于犯罪对象的是（ ）。","o":["赌博的筹码","抢夺的财物","行贿的财物","运输毒品的车辆"],"a":"B","e":"\u0001犯罪对象是危害行为“直接作用指向的具体人、物、信息”；赌博筹码、行贿财物和运毒车辆属于犯罪工具或组成犯罪之物（违禁/供犯罪所用物品），只有抢夺罪直接剥夺的财物才是犯罪对象。\u0002\nA✗ 赌博筹码是聚众赌博用以赌博计值的工具（供犯罪所用物品），而非所侵害客体承载的犯罪对象\nB✓ 抢夺的财物：抢夺罪侵害他人财产所有权，抢夺行为直接夺取的就是被害人手上的具体财物，属于典型\u0001犯罪对象\u0002\nC✗ 行贿财物是犯罪人拿去实施行贿的手段工具（组成犯罪之物），行贿罪侵犯的国家工作人员职务廉洁性，犯罪对象是被行贿收买的工作人员职务行为而非行贿人自己的钱\nD✗ 运毒车辆只是犯罪人运输途中使用的交通工具（犯罪工具），运输毒品罪的犯罪对象是所运输的\u0001毒品\u0002本身","k":"","kb":85,"kh":[[132,158]]},{"id":"2015-14","y":2015,"t":"单","s":"下列犯罪中,属于结果犯的是（ ）。","o":["放火罪","故意毁坏财物罪","私放在押人员罪","参加黑社会性质组织罪"],"a":"B","e":"\u0001故意毁坏财物罪须实际造成财物毁灭损坏结果（或数额较大毁损实害）才构成既遂，属于实害结果犯；放火罪是具体危险犯，私放在押人员罪是行为犯，参加黑社会性质组织罪是举动犯。\u0002\nA✗ 放火罪规定“危害公共安全，尚未造成严重后果的”即处三年以上十年以下有期徒刑，只要使独立火源具备危及公共安全的现实具体危险即既遂，属于\u0001具体危险犯\u0002\nB✓ 故意毁坏财物罪：财物被毁坏减损的物质性危害结果实际发生才算完成既遂，属于典型\u0001结果犯\u0002\nC✗ 私放在押人员罪只要监管人员擅自打开牢门/脱离监管将人放走行为实施完毕即告既遂（无论脱逃者随后抓不抓得回来），属于\u0001行为犯\u0002\nD✗ 参加黑社会性质组织罪一经实施参加加入行为（举动）即立刻既遂，属于\u0001举动犯\u0002","k":"","kb":88,"kh":[[5,150]]},{"id":"2017-3","y":2017,"t":"单","s":"下列选项中,构成纯正不作为犯罪的是（ ）。","o":["甲将生活不能自理的母亲锁在家中,外出数天致母亲饿死","乙(纳税人)作假账,少缴纳税款数额巨大且占应纳税额的20%","丙(司机)驾驶时,离开公交车驾驶岗位与乘客斗殴,造成交通事故","丁(医生)在飞机上目睹乘客心脏病突发未予施救,该乘客不治身亡"],"a":"B","e":"\u0001逃税罪（《刑法》第201条）表现为纳税人采取欺骗、隐瞒手段不缴或者少缴应纳税款（法条本质系负有纳税申报缴纳税款法定义务者逃避履行纳税义务），法硕通说与历年真题将其归入纯正不作为犯；锁门饿死母亲、司机离岗斗殴肇事均为不纯正不作为，医生在飞机上无接诊合同关系与法定义务不构犯罪。\u0002\nA✗ “将生活不能自理的母亲锁在家中致其饿死”成立不作为故意杀人罪，但故意杀人罪通常由作为完成，因此属于\u0001不纯正不作为犯\u0002\nB✓ 乙(纳税人)作假账，少缴纳税款数额巨大且占应纳税额的20%：逃税罪实质是不履行向国家按期足额缴纳税款的法定强制义务（条文本身只惩处逃避缴税的不作为核心），在法硕考纲通说里明确属于\u0001纯正不作为犯\u0002（注：其余选项中母子案是不纯正不作为，离岗肇事涉及交肇，休假乘机医生尚无接诊特定义务）\nC✗ 驾车过程中不履行安全驾驶职责离岗引发交通事故（交通肇事罪，虽含不作为过失因子亦主要以违章驾驶行为定交通肇事，绝非纯正不作为犯）\nD✗ 医生虽有救死扶伤职业道德，但在休假乘飞机（非执业当班、未接诊也未签订现场应急诊疗契约、无特定医疗职务管领义务）情况下对突发疾病的陌生乘客不予施救，属于道德谴责范畴，在刑法上不具有法定或合同特定义务，不构成不作为犯罪","k":"","kb":87,"kh":[[211,242],[274,281]]},{"id":"2017-4","y":2017,"t":"单","s":"甲基于杀人故意实施的下列行为,与乙的死亡之间具有刑法上因果关系的是（ ）。","o":["甲劝乙乘坐长途汽车去山区旅行,乙旅行时因汽车坠崖死亡","甲在家中“作法”诅咒与其有矛盾的乙,后乙突发急病死亡","甲殴打乙致其轻伤,乙在去医院途中被高楼上坠落的花盆砸中死亡","甲持木棍对乙穷追不舍,乙迫不得已跳人冰冷的河中因痉挛而溺水死亡"],"a":"D","e":"\u0001持木棍追打乙迫使乙走投无路跳入冰河溺水痉挛死亡，因乙跳河是甲致命紧迫追击暴力的正常、高度概率避险反映，并未介入异常阻断因素，甲行为与死亡存在刑法上因果关系。\u0002\nA✗ 单纯正常劝人外出旅游，既非制造不被容许死亡风险的危害行为，路上发生意外客车坠崖与甲劝说毫无刑法因果关系\nB✗ 封建迷信“作法诅咒”科学上毫无物理客观致死力（迷信犯），被害人自己突发急病死亡纯属自然巧合，无任何刑法因果关系\nC✗ 殴打仅造成“轻伤”（通常不危及生命），被害人完全自己行走去医院途中意外被高楼随机坠落花盆砸死——这属于概率极低的\u0001独立异常介入因素\u0002，彻底阻断了先前轻伤行为与最终死亡结果之间的因果关系\nD✓ 甲持木棍对乙穷追不舍，乙迫不得已跳入冰冷的河中因痉挛而溺水死亡：甲的暴力持械追杀直接逼迫被害人在极度恐慌无处可逃之下跳河求生，其间并未出现违背常理的异常独立介入原因，死亡结果合乎规律地由甲紧迫暴力追击引发，存在刑法\u0001因果关系\u0002","k":"","kb":88,"kh":[[224,325]]},{"id":"2018-5","y":2018,"t":"单","s":"我国刑法规定,故意杀人,情节较轻的,处三年以上十年以下有期徒刑,本条规定属于故意杀人的","o":["修正的犯罪构成","标准的犯罪构成","加重的犯罪构成","减轻的犯罪构成"],"a":"D","e":"\u0001《刑法》第232条后半段“故意杀人的，情节较轻的，处三年以上十年以下有期徒刑”是在基本法定刑（死刑、无期、10年以上）基础上明确下调法定刑幅度的独立量刑档，属于减轻的犯罪构成（派生犯罪构成）。\u0002\nA✗ 修正的犯罪构成指预备、未遂、中止与教唆犯、帮助犯，由总则补充修改\nB✗ “标准的犯罪构成”指第232条前半句常规社会危害程度的基本故意杀人罪档（死刑、无期或10年以上）\nC✗ 本条将法定刑从“10年以上/死刑”降到“3—10年”，明显不是加重而是减轻\nD✓ 减轻的犯罪构成：刑法分则条文明确基于特定从轻/减轻构罪情节（如义愤杀人、大义灭亲、受嘱托安乐死等“情节较轻”）设置更低独立法定刑，属于派生的犯罪构成中的\u0001减轻的犯罪构成\u0002","k":"","kb":86,"kh":[[149,193]]},{"id":"2018-15","y":2018,"t":"单","s":"下列选项中,既可以作为实行,也可以由不作为实行的是（ ）。","o":["洗钱罪","遗弃罪","玩忽职守罪","拒不履行信息网络安全管理义务罪"],"a":"C","e":"\u0001《刑法》第397条玩忽职守罪指国家机关工作人员严重不负责任，不履行或者不认真履行职责，既可表现为完全放手不管的消极“不作为”，也可表现为走过场草率签字审批的违规“作为”；洗钱罪只能作为，遗弃与拒不履行信息网络安全管理义务只能不作为。\u0002\nA✗ 洗钱罪需实施转账、购置汇兑等积极隐瞒洗白动作，只能由作为实行\nB✗ 遗弃罪法条限制为拒绝扶养，属于纯正不作为犯\nC✓ 玩忽职守罪：工作中严重不负责任既包含“应当查验而不作为”（不作为）也包括“胡乱未核实就瞎签字审批造成重大损失”（马虎敷衍的作为），因此属于\u0001既可作为也可不作为\u0002实行的犯罪\nD✗ “拒不履行信息网络安全管理义务罪”从罪名“拒不履行……义务”即可看出经责令改正仍消极不作为才成立，属典型纯正不作为犯","k":"","kb":87,"kh":[[211,258],[332,344]]},{"id":"2019-13","y":2019,"t":"单","s":"下列情形中,成立不作为犯罪的是（ ）。","o":["某县法院院长甲目睹身为县财政局局长的妻子收受其下属的巨额贿赂,不予阻止","乙见室友在门口遭遇持刀抢劫,因害怕将房门反锁导致室友无处躲藏被刺成重伤","收养人丙发现所收养的两岁小孩患有先天性心脏病,将孩子独自留在家中致其饿死","丁在妻子难产时拒绝在剖腹产手术同意书上签字,妻子难忍疼痛从病房楼跳下身亡"],"a":"C","e":"\u0001收养关系建立后，收养人对被收养两岁幼童负有法定抚养保护义务；故意将患病幼童独自留在家中不予喂食照料致其饿死，具备义务+履行能力+不履行致死，成立不作为故意杀人罪（或遗弃罪）。\u0002\nA✗ 我国《刑法》并不一般性科以夫妻间互相监管阻止对方贪污受贿的特定义务（法院院长对妻子的财政局职务贿赂仅负有普通公民知情监督道德责难或党员内部纪律问题，非特定刑法阻止职务犯罪义务）\nB✗ 室友无义务在持刀抢匪威胁自身生命危险下舍命开门施救（反锁自保属于紧急避险或缺乏期待可能性及特定法定救助义务，不成立不作为犯罪）\nC✓ 收养人丙发现所收养的两岁小孩患有先天性心脏病，将孩子独自留在家中致其饿死：合法收养产生与亲生父母完全相同的\u0001法定抚养与监护保护义务\u0002，丙完全有能力抚养或送福利医院救治却故意将其饿死，成立\u0001不作为犯罪\u0002（不作为故意杀人罪）\nD✗ 医院手术签字主要是患者自身或法医授权确认；妻子难产痛苦意外“跳楼”属于被害人自己极端异常决定自杀行为，且丈夫拒签字手术并非当然必然引发“跳楼自杀”，因果关系及不作为杀人故意通常不成立","k":"","kb":87,"kh":[[71,89],[149,189]]},{"id":"2019-41","y":2019,"t":"多","s":"下列对于我国刑法第13条中“……但是情节显著轻微危害不大的，不认为是犯罪”的理解，正确的有（ ）。","o":["避免给轻微的违法行为打上“犯罪”的标记","表明认定犯罪需要正确“定性”及合理“定量”","是区分“违法行为”与“犯罪行为”的宏观标准","合理配置司法资源以集中力量惩罚“严重违法行为”"],"a":"ABCD","e":"\u0001《刑法》第13条但书在我国刑法史上独具特色，既划定实质“定性+定量”入罪门槛，也是宏观区分一般违法与刑事犯罪的标准，有效防止轻微违法泛犯罪化并优化司法资源集中惩治重罪。\u0002\nA✓ 防止把轻微治安违法行为贴上犯罪标签，落实刑法谦抑精神\nB✓ 体现了我国犯罪概念“定性（危害社会且依法应受罚）+定量（危害不能情节显著轻微不大）”的双重标准\nC✓ 是划分一般民事/行政违法行为与刑法意义上犯罪行为的宏观分水岭\nD✓ 避免司法机关在鸡毛蒜皮小事上耗费宝贵刑事司法资源，集中火力惩治严重危害社会行为","k":"","kb":85,"kh":[[283,326]]},{"id":"2020-4","y":2020,"t":"单","s":"不作为犯罪的主观方面（ ）。","o":["只能是过失","只能是故意","不要求故意及过失","可以是故意也可以是过失"],"a":"D","e":"\u0001作为与不作为都属于“犯罪客观方面”的行为表现形态，它们与主观罪过形式（故意还是过失）没有固定捆绑——不作为既可以出于故意，也可以出于过失。\u0002\nA✗ 如不喂奶故意饿死婴儿是不作为故意杀人罪\nB✗ 如铁路扳道工忘记扳道岔致列车相撞是不作为过失\nC✗ 现代刑法实行主客观相统一原则，任何不作为犯罪都必须具备故意或者过失之一\nD✓ 可以是故意也可以是过失：客观“不为某种义务行为”与主观“故意或过失心理态度”可以自由组合（既有不作为故意杀人/遗弃，也有不作为过失致人死亡/玩忽职守）","k":"","kb":87,"kh":[[190,205]]},{"id":"2020-11","y":2020,"t":"单","s":"下列关于刑法因果关系的说法中,正确的是（ ）。","o":["因果关系的认定必须考虑行为人的主观认识","因果关系的存在是行为人承担刑事责任的充分条件","危害行为与危害结果之间存在条件关系即可认定因果关系存在","不作为犯罪中不作为与危害结果之间的因果关系是客观存在的"],"a":"D","e":"\u0001刑法因果关系考察的是现实行为与现实结果之间纯粹的客观引起与被引起关联（唯物主义客观存在，不以主观是否认识到或预期为转移），哪怕在不作为犯罪中也客观存在因果联系。\u0002\nA✗ 因果关系属于\u0001犯罪客观方面\u0002的事实认定，在判断因果是否成立时完全不需考虑行为人主观认识（否则就会出现“以为没死结果死了无因果”的荒谬逻辑；主观认识留在犯罪主观方面再评价）\nB✗ 具备因果关系只是行为人对结果负刑事责任的\u0001客观必要条件\u0002，绝不是“充分条件”（光有因果没有故意或过失，例如意外事件撞死人照样有物理因果关系却不负刑事责任！）\nC✗ 简单的条件关系（“若无前者就无后者”）并不等于最终成立刑法因果关系——如果中间介入了异常独立的他因（如打轻伤送医途遇车祸或花盆砸死），因果关系就被中断了\nD✓ 不作为犯罪中不作为与危害结果之间的因果关系是客观存在的：如果不履行特定义务的消极状态阻止了本可生效的救助/防果进程（“若行为人履行义务则结果几乎确定不会发生”），便客观存在因果关系","k":"","kb":88,"kh":[[152,246]]},{"id":"2021-42","y":2021,"t":"多","s":"下列关于犯罪客体的理解中,正确的有","o":["犯罪客体与犯罪对象之间是本质与现象的关系","我国刑法分则体系主要以同类客体为基础加以构建","一般客体是指社会主义社会关系的整体","重婚犯罪侵害的直接客体是婚姻自由权利"],"a":"ABC","e":"\u0001犯罪客体是本质、犯罪对象是载体现象；一般客体是社会关系整体；分则主要依同类客体构建；重婚罪的直接客体是“一夫一妻制婚姻关系”（而非“婚姻自由”）。\u0002\nA✓ 犯罪对象为外在具体人/物（现象），犯罪客体为内在被侵害的社会关系（本质），客体寓于对象之中\nB✓ 我国《刑法》分则正是主要依各类罪共同侵犯的同类客体分十章构建分则体系\nC✓ 一般客体即社会主义刑法所保护的社会主义社会关系的整体\nD✗ 重婚罪往往是当事人在已经合法结婚的前提下“自愿”另行重婚，它并不侵犯“婚姻自由权”，其侵犯的直接客体是我国婚姻法确立的\u0001一夫一妻制的婚姻制度（婚姻关系）\u0002（侵犯婚姻自由权利的是暴力干涉婚姻自由罪）","k":"","kb":85,"kh":[[34,97],[159,177]]},{"id":"2022-1","y":2022,"t":"单","s":"下列对于我国刑法中犯罪构成要件的理解,正确的是","o":["刑法总则规定了犯罪构成的一般要件","刑法分则中的犯罪主观方面仅包括故意和过失","法条竞合的数罪具备完全相同的犯罪构成要件","因果关系是所有犯罪都必须具备的犯罪构成要件"],"a":"A","e":"\u0001我国《刑法》总则规定犯罪构成的共同一般要件，分则规定具体犯罪构成；分则主观方面除了故意过失还有特定目的动机；法条竞合并不需要两罪要件“完全相同”；并非所有犯罪都要求因果关系（如举动犯、单纯不作为行为犯）。\u0002\nA✓ 刑法总则规定了犯罪构成的一般要件：诸如刑事责任年龄、精神责任能力、故意过失定义、未完成形态与共同犯罪规则均在总则统一阐明\nB✗ 刑法分则众多罪名在主观方面不仅包括故意与过失，还专门规定了特定的\u0001犯罪目的\u0002（如以牟利为目的、以非法占有为目的、以出卖为目的）甚至特定动机（徇私舞弊）\nC✗ 法条竞合恰恰是由于一宽一窄（包容或交叉关系），两条文构成要件\u0001绝非“完全相同”\u0002（如诈骗罪与合同诈骗罪在是否利用经济合同上有特别要件之差）\nD✗ 只有结果犯才必须考察结果与行为间的因果关系；单纯的行为犯（偷越国边境、脱逃）、持有型犯罪（非法持有枪支）和举动犯（参加黑社会性质组织）根本不涉及危害结果，也就不存在刑法因果关系判断","k":"","kb":86,"kh":[[68,83]]},{"id":"2024-10","y":2024,"t":"单","s":"属于危险犯的是（ ）。","o":["脱逃罪","破坏交通工具罪","交通肇事罪","煽动分裂国家罪"],"a":"B","e":"\u0001《刑法》第116条规定破坏火车、汽车、电车、船只、航空器“足以使……发生倾覆、毁坏危险，尚未造成严重后果的”即处三年以上十年以下有期徒刑——这正是具体危险犯。\u0002\nA✗ 脱逃罪指依法被关押的罪犯脱逃出监管控制范围即告既遂，属于\u0001行为犯\u0002\nB✓ 破坏交通工具罪：法条明文将“足以使交通工具发生倾覆、毁坏危险”设为基本既遂标志（即便列车及时制动未真正车毁人亡，也已构成本罪既遂），是典型\u0001危险犯\u0002（具体危险犯）\nC✗ 交通肇事罪是过失犯罪，必须造成致人重伤、死亡或者公私财产重大损失的实际物质结果才能成罪，是典型的\u0001结果犯（实害犯）\u0002\nD✗ 煽动分裂国家罪一经实施煽动鼓惑的言行即刻构成既遂（不要求真正诱使发生分裂行为或高度现实危险），通常归类为\u0001举动犯（或行为犯）\u0002","k":"","kb":88,"kh":[[51,90]]},{"id":"2024-41","y":2024,"t":"多","s":"关于社会危害性的说法,正确的是（ ）。","o":["行为没有社会危害性,就不应该规定为犯罪","犯罪的社会危害性是各种主观因素和客观因素的统一","社会危害性是否达到严重程度,是犯罪与其他违法行为的根本性区别","社会危害性是指行为对刑法所保护的社会关系造成或可能造成损害的特性"],"a":"ABCD","e":"\u0001社会危害性是犯罪最本质、最实质的特征：无社会危害性不应规定为犯罪；社会危害性是主客观各要素统一；社会危害性达到严重程度方能与一般违法划清界限；本质就是对刑法保护的社会关系造成或可能造成损害。\u0002\nA✓ 没有社会危害性的纯无害行为不值得国家动用最严厉刑罚处罚（入罪的实质正当性原则）\nB✓ 社会危害性绝不只看客观死伤多少或主观念头恶不恶，而是客观行为后果与主观故意过失等所有因素的有机统一\nC✓ 是否具有“相当严重程度的社会危害性”是犯罪区别于一般行政、民事违法行为的根本界限\nD✓ 精准概括了社会危害性的本体定义（对刑法法益/社会关系造成现实实害或具体/抽象威胁损害）","k":"","kb":85,"kh":[[240,282]]},{"id":"2025-1","y":2025,"t":"单","s":"犯罪行为与违法行为的根本区别在于（ ）。","o":["行为自身是否具有违法性","行为人是否需要承担法律后果","行为主体是否具有有责性","社会危害性是否达到相当严重的程度"],"a":"D","e":"\u0001违法性（违背法秩序）与需承担法律后果（民事/行政/刑事责任）都是一般违法与犯罪的共性；犯罪行为与一般违法行为之间最核心的根本区别在于“社会危害性是否达到相当严重的程度”。\u0002\nA✗ 民事违约侵权、治安违法和犯罪都同样具有违法性\nB✗ 一般违法行为也要承担赔偿损失、罚款、行政拘留等法律后果\nC✗ 不少民事行政违法主体同样是有辨认控制能力的成年人（有责性）\nD✓ 社会危害性是否达到相当严重的程度：依《刑法》第13条但书与犯罪实质概念，只有社会危害性越过定量门槛达到严重程度，方才升格为犯罪","k":"","kb":85,"kh":[[240,272]]},{"id":"2025-7","y":2025,"t":"单","s":"下列选项中,构成不纯正不作为犯的是（ ）。","o":["甲持有假币,数额较大","乙虚列支出逃避缴纳税款,数额巨大","丙酒后驾车致车辆侧翻,造成乘车人死亡","丁沉迷赌博数日不归,致瘫痪在床的父亲饿死"],"a":"D","e":"\u0001不纯正不作为犯是指“负有特定义务者用消极不作为去犯通常由积极作为实施的罪名”：丁对瘫痪父亲负法定赡养照护义务，却数日沉迷赌博不归致父活活饿死，构成不作为形式的故意杀人罪。\u0002\nA✗ 持有假币罪属于“持有型”犯罪（非法购入、藏匿持有伪造货币），通说认为支配管领假币主要是积极持有的作为行为\nB✗ 虚列支出不缴纳税款构成逃税罪，在法硕考纲通说里明确认定为\u0001纯正不作为犯\u0002（而非不纯正）\nC✗ 酒后积极超速驾驶机动车引发车祸翻车致人死亡是典型积极的\u0001作为\u0002犯（交通肇事罪）\nD✓ 丁沉迷赌博数日不归，致瘫痪在床的父亲饿死：对丧失自理能力的直系尊亲属负有法定义务却刻意不予照护喂养致其活活饿死，这是用不作为方式实现典型作为罪名（故意杀人罪），属于标准的\u0001不纯正不作为犯\u0002","k":"","kb":87,"kh":[[274,331]]},{"id":"2026-1","y":2026,"t":"单","s":"下列表述中,体现马克思主义的犯罪实质概念观点的是","o":["犯罪是对他人权利的一种侵犯行为","犯罪的本质在于对社会共同法益的侵害","犯罪是藐视社会秩序的最明显、最极端的表现","犯罪是出于不道德的动机而实施的行为"],"a":"C","e":"\u0001马克思主义法学将犯罪的实质本质界定为“孤立的个人反对统治关系的斗争，是藐视社会秩序的最明显、最极端的表现”（马克思恩格斯《德意志意识形态》经典论断）。\u0002\nA✗ “侵犯他人权利”属于启蒙时代自然法学派（如费尔巴哈）的“权利侵害说”\nB✗ “法益侵害说”源于德国大陆法系刑法学（比恩鲍姆、李斯特及现代德日通说），非马克思主义原始本质定义\nC✓ 犯罪是藐视社会秩序的最明显、最极端的表现：精准引用马克思、恩格斯关于犯罪作为反抗现存社会统治秩序之最极端斗争表现的经典论断\nD✗ “道德过错说”属传统伦理道德主义刑法观，混淆了法律犯罪与纯道德谴责","k":"","kb":85,"kh":[[240,255]]},{"id":"2026-4","y":2026,"t":"单","s":"下列对于作为义务的理解,正确的是","o":["医生对拒不支付医疗费的病人不负有救助义务","休假中的警察对危险情形的公民负有救助义务","受雇看护儿童的保姆在紧急情况下对儿童不负有保护义务","行为人故意伤害他人后,对生命垂危的被害人负有救助义务"],"a":"D","e":"\u0001故意伤害他人导致重伤垂危属于“先行不法行为”，使行为人即刻产生必须抢救防止其死亡的特定作为义务（若放任不管致死则可能不作为杀人）；而医生拒诊受诊疗合同约束、保姆因受雇协议负保护义务、休假警察一般不当然负特定职务救护义务。\u0002\nA✗ 医疗机构及执业医师基于《民法典》医疗服务关系与《基本医疗卫生与健康促进法》急救规定，对紧急危重患者负有法定的救死扶伤与紧急抢救义务，绝对不得因未缴费拒绝紧急施救\nB✗ 警察在非工作休假期间一般不负有刑法意义上随时强制执行职务的特定作为保证人义务（否则任何休假民警只要恰巧路遇他人斗殴事故都将一律坐牢，考纲通说明确不认定休假警察负普遍刑法保证人义务）\nC✗ 受雇专职看护年幼儿童的保姆在受雇工作期间基于雇佣契约明确承受了保护儿童安全生命之特定照护义务\nD✓ 行为人故意伤害他人后，对生命垂危的被害人负有救助义务：由于自己的\u0001先行危险/不法行为\u0002使他人生命陷入紧迫极度危险状态，行为人负有立即采取医疗送医等举措阻止死亡发生的特定义务","k":"","kb":87,"kh":[[116,147]]},{"id":"2026-11","y":2026,"t":"单","s":"下列有关犯罪构成理论的理解,正确的是","o":["犯罪构成理论仅关注具体犯罪的构成","可以通过犯罪构成理论直接认定犯罪","不同犯罪构成理论模式的优劣显而易见","犯罪构成理论为追究犯罪人的刑事责任提供基础"],"a":"D","e":"\u0001犯罪构成是连接罪刑规范与个案追责的核心桥梁，集中回答了“什么是犯罪、成立需哪些主客观标准”，为国家司法机关追究犯罪人刑事责任提供法定基准。\u0002\nA✗ 刑法犯罪构成理论既研究刑法总则共同适用的一般抽象构成要件体系（四要件或三阶层共性原则），也研究分则具体犯罪的特定构成\nB✗ 理论本身只是认识分析工具，不能跳过《刑法》成文法条和经法定程序查证属实的案件证据事实“直接凭理论认定犯罪”\nC✗ 四要件说、三阶层说等不同犯罪构成理论模式各有法哲学基础与优缺点，学界一直争鸣互补，并非优劣高下一目了然\nD✓ 犯罪构成理论为追究犯罪人的刑事责任提供基础：无论采用何种犯罪论体系，其核心功能皆是系统界定成立犯罪的主客观要件规格，为依法定罪量刑追究刑事责任奠定规范标准","k":"","kb":86,"kh":[[54,67]]}]},{"sub":"刑法","name":"罪数","w":1.9,"L":37,"qs":[{"id":"2005-10","y":2005,"t":"单","s":"甲伪造国家机关公文用于实施诈骗活动,分别构成伪造国家机关公文罪和诈骗罪,这种情形属于罪数论中的（ ）。","o":["牵连犯","想象竞合犯","继续犯","连续犯"],"a":"A","e":"\u0001为了实现诈骗而先行伪造国家机关公文，手段行为（伪造公文罪）与目的行为（诈骗罪）具有密不可分手段目的牵连关系，属于牵连犯。\u0002\nA✓ 牵连犯：以骗取财物为最终目的，先后实施了“伪造公文”（手段行为）和“诈骗”（目的行为）两个相对独立但服务于同一目的的不同罪名行为，符合\u0001牵连犯\u0002特征\nB✗ 想象竞合犯要求“只实施了一个行为”；而本题显然先后实施了伪造公文和拿假公文行骗两个犯罪行为\nC✗ 继续犯也是一个犯罪行为及其不法状态在时间上持续\nD✗ 连续犯要求数个连续行为触犯的是\u0001同一罪名\u0002；本案先后触犯伪造公文罪与诈骗罪两个完全不同罪名","k":"","kb":92,"kh":[[102,140]]},{"id":"2005-11","y":2005,"t":"单","s":"下列哪一种犯罪在既遂之后犯罪行为也随之而结束,但由犯罪行为造成的不法状态仍可能继续存在（ ）。","o":["诈骗罪","故意杀人罪","非法拘禁罪","非法持有枪支罪"],"a":"A","e":"\u0001诈骗罪在骗得财物到手即告既遂并且欺骗实行行为也随之完结，此后被害人财物长期流失于甲手虽属违法状态持续，但已无后续诈骗行为本身，属于“状态犯”（而非继续犯）。\u0002\nA✓ 诈骗罪：只要受害人受骗处分交付财物，诈骗实行行为即完全终结，此后仅仅是财产占有失控的不法状态继续存在（又称\u0001状态犯\u0002），并不属于犯罪行为本身也在持续的继续犯\nB✗ 故意杀人罪只要被害人死亡，既不存在继续加害（若尚未死则还处于未遂继续杀），更关键在死后不存在可逆持续恢复的“不法状态”\nC✗ 非法拘禁罪在拘禁既遂后，只要没放人，限制剥夺人身自由的犯罪行为自身仍在一天天持续进行，是典型的\u0001继续犯\u0002\nD✗ 非法持有枪支罪在整个藏匿管控枪支期间，持有的犯罪实行行为与违法状态始终同步持续，亦属\u0001继续犯\u0002","k":"","kb":91,"kh":[[95,134]]},{"id":"2005-15","y":2005,"t":"单","s":"甲开办一间小汽修店,因修理一进口轿车缺零配件,便于晚间在一停车场将一同型号小轿车备用轮胎一个(价值1200 元)和发动机(价值 50000 元)拆下盗走,甲的行为（ ）。","o":["构成盗窃罪和破坏交通工具罪,数罪并罚","构成盗窃罪和破坏交通工具罪,属想象竞合犯,从一重罪即破坏交通工具罪定罪处罚","只构成破坏交通工具罪","只构成盗窃罪"],"a":"D","e":"\u0001甲仅出于盗窃汽配零件之目的，把整辆小汽车的“发动机”都直接拆下盗走，该轿车彻底沦为无法发动行驶的废壳，绝不可能再上路危及不特定多数人交通安全，故只构成盗窃罪。\u0002\nA✗ 拆走整个发动机后车根本无法启动上路，缺乏危及公共交通安全的可能性，不构成破坏交通工具罪\nB✗ 同上，根本不具备“足以使汽车发生倾覆、毁坏危险”要件，不存在想象竞合\nC✗ 没有破坏交通工具行为致倾覆危及公共安全问题（若偷走关键刹车片/方向盘拉杆致车辆仍可发动上路一开即翻车，才会既构成盗窃又构成破坏交通工具罪想象竞合）\nD✓ 只构成盗窃罪：盗走发动机直接令汽车失去动力完全开不动，毫无危害公共交通安全危险；同时破坏/窃取价值51200元财物，仅构成\u0001盗窃罪\u0002一罪","k":"","kb":93,"kh":[[482,517]]},{"id":"2005-23","y":2005,"t":"多","s":"下列情形中,应当数罪并罚的有（ ）。","o":["判决宣告前,查明甲分别实施了三次受贿行为,数额分别为 2 万、3 万、5 万元","乙因受贿被判处有期徒刑二年,缓刑三年,在缓刑考验期内,又查明其另外一起受贿 2 万元的罪行","丙因故意伤害罪被判处有期徒刑三年,在服刑期间又犯故意伤害罪","丁因盗窃罪被判处有期徒刑二年,执行完毕后,发现其在该次盗窃以前还有一起重大盗窃犯罪行为"],"a":"BC","e":"\u0001判决宣告前多次受贿（同种漏罪/同种数罪）累计按一罪；刑罚执行完毕后才发现漏罪不再并罚；但在缓刑考验期内发现判决前未处理漏罪，或服刑期间又犯新罪，依法一律数罪并罚！\u0002\nA✗ 甲在判决宣告前连续实施的同种三次受贿罪行，依《刑法》第383条受贿数额累计计算，按受贿罪一罪从重或直接累计量刑处罚（同种数罪一般不并罚）\nB✓ 乙因受贿被判处有期徒刑二年，缓刑三年，在缓刑考验期内，又查明其另外一起受贿2万元的罪行：依照《刑法》第77条第1款，缓刑考验期限内发现判决宣告以前还有其他罪没有判决的，应当撤销缓刑，对新发现的罪作出判决，把前罪和后罪所判处的刑罚依第69条实行\u0001数罪并罚\u0002（注意：哪怕新发现的漏罪与前罪同种，因为前罪已作出确定宣告判决，也必须数罪并罚！）\nC✓ 丙因故意伤害罪被判处有期徒刑三年，在服刑期间又犯故意伤害罪：依照《刑法》第71条“先减后并”规则，在刑罚执行期间又犯新罪（哪怕罪名同为故意伤害罪），一律实行\u0001数罪并罚\u0002\nD✗ 丁的前罪刑罚已经“执行完毕”，前刑不复存在（已执行刑无法再行限制加重或先减后并），对新发现判决前的盗窃漏罪在追诉期限内直接单独就该漏罪定罪判刑即可，不发生数罪并罚","k":"","kb":93,"kh":[[358,406],[423,480]]},{"id":"2006-7","y":2006,"t":"单","s":"关于刑法中法条竞合关系的表述,错误的是（ ）。","o":["法条竞合关系的表现形式之一是一些条文之间在内容上存在交叉关系","对法条竞合关系的处理原则是,在一般情况下依照特别法条优于普通法条的原则,适用特别法条","诈骗罪与信用卡诈骗罪之间存在法条竞合关系","行贿罪与受贿罪之间存在法条竞合关系"],"a":"D","e":"\u0001法条竞合存在于“一个犯罪行为触犯内容重合或交叉的两个法条”之间（如诈骗罪与金融/信用卡诈骗罪），而行贿罪与受贿罪是双方各自独立行为构成的“对向犯”，毫无竞合关系！\u0002\nA✗ 该表述正确：法条竞合除了全部包容（普通法与特别法，如盗窃罪与盗窃枪支罪）外，确有一部分在内容上表现为交叉关系（如招摇撞骗罪与诈骗罪）\nB✗ 该表述正确：处理法条竞合的基本通则即“特别法优于普通法”（仅法律另有明确规定时如重法优先例外）\nC✗ 该表述正确：诈骗罪为普通法条，信用卡诈骗罪为特别法条，二者系典型包容竞合关系\nD✓ 行贿罪与受贿罪之间存在法条竞合关系（当选错误项）：行贿与受贿是“你送我收”两个不同犯罪人各自实施的不同性质行为（刑法理论上称为\u0001对向犯\u0002），既非同一个人的行为也不存在法条涵盖交叉，绝不存在法条竞合","k":"","kb":92,"kh":[[346,363]]},{"id":"2006-14","y":2006,"t":"单","s":"保险受益人甲故意杀害被保险人乙,造成乙死亡,骗取了 20 万元保险金。对甲应当（ ）。","o":["以故意杀人罪定罪处罚","以保险诈骗罪定罪处罚","以保险诈骗罪和故意杀人罪的牵连犯择一重罪处罚","以故意杀人罪和保险诈骗罪数罪并罚"],"a":"D","e":"\u0001《刑法》第198条第2款明文规定：投保人、受益人故意造成被保险人死亡、伤残或者疾病骗取保险金，同时构成其他犯罪的，依照数罪并罚的规定处罚（牵连犯法定并罚例外）。\u0002\nA✗ 既故意杀害被保险人又向保险公司提交虚假死因理赔骗得20万元保险金，不能只定杀人罪\nB✗ 杀害无辜被保险人的恶性重大生命犯罪绝对不能被保险诈骗罪吸收\nC✗ 虽然杀人系手段、骗保系目的，理论上存在牵连，但《刑法》第198条第2款作出了强制数罪并罚的特别除外条款\nD✓ 以故意杀人罪和保险诈骗罪数罪并罚：严格适用《刑法》第198条第2款特别条款，故意杀人罪与保险诈骗罪并罚","k":"","kb":78,"kh":[[17,58]]},{"id":"2007-9","y":2007,"t":"单","s":"下列情形中,应当数罪并罚的是 （ ）。","o":["甲除走私 1000 克冰毒外,还曾与他人共同运输 3000 克海洛因","乙非法购买一支手枪,并长期私藏在家中","丙谋杀仇人张某后,发现张某携有现金 1 万多元,遂取走该现金","丁见李某带有大量现金,将李某毒杀,劫取其所带全部财物,并将李某尸体剁成碎块后掩埋"],"a":"C","e":"\u0001多次走私运输毒品累计作一罪；非法买枪后长期私藏属吸收犯（仅定非法买卖枪支罪）；抢劫时当场先杀后劫与碎尸（不可罚事后行为）仅定抢劫罪一罪；唯有先杀仇人后临时起意拿走尸体上现金，构成故意杀人罪与盗窃罪（或侵占/2007年统考按“死者身上财物仍归继承人占有”定盗窃罪）数罪并罚！\u0002\nA✗ 走私、贩卖、运输、制造毒品罪为选择性罪名，且未经处理的多次走私运输毒品数量依法累计一并计算，只定走私、运输毒品罪一罪\nB✗ 非法购买枪支行为必然伴随之后将枪支保存藏匿，后一持有行为被先前的非法买卖枪支罪高度盖然性吸收，属\u0001吸收犯\u0002，仅定非法买卖枪支罪一罪\nC✓ 丙谋杀仇人张某后，发现张某携有现金1万多元，遂取走该现金：杀人最初并无图财目的（故意杀人罪独立成立并既遂）；杀完人后临时起意另行起意非法占有死者身上/随身贵重财物（依司法实践通说死者刚遇害瞬间财物仍受财产法秩序及近亲属保护，成立盗窃罪），另起新犯意实施新行为，构成\u0001故意杀人罪与盗窃罪数罪并罚\u0002\nD✗ 为了劫取财物而采用暴力毒杀被害人，这是抢劫罪的典型暴力压制反抗劫财一罪（《刑法》第263条抢劫致人死亡加重犯），此后“碎尸掩埋”属于为毁灭罪证的不可罚事后行为，仍只定抢劫罪一罪\n记法：“先杀后见财临时起意拿钱”＝另起犯意＝杀人＋盗窃并罚；“为抢财而杀人＋碎尸掩埋”＝抢劫致死一罪＋不可罚事后行为。","k":"","kb":93,"kh":[[422,462],[607,627]]},{"id":"2008-13","y":2008,"t":"单","s":"下列情形中,属于牵连犯特征的是（ ）。","o":["实施某个犯罪,其手段行为又触犯其他罪名","实施一个犯罪行为触犯数个罪名","数个犯罪行为触犯同一罪名","犯罪既遂状态与犯罪造成的不法状态同时存在"],"a":"A","e":"\u0001牵连犯的本质特征是“出于一个最终犯罪目的，实施了两个以上犯罪行为，触犯不同罪名，且手段行为与目的行为（或原因行为与结果行为）之间存在通常牵连关系”。\u0002\nA✓ 实施某个犯罪，其手段行为又触犯其他罪名：准确概括了牵连犯中手段行为与目的行为触犯不同罪名的典型构造\nB✗ “实施一个犯罪行为触犯数个罪名”指的是\u0001想象竞合犯\u0002，而非数行为的牵连犯\nC✗ “数个犯罪行为触犯同一罪名”指的是\u0001连续犯\u0002\nD✗ “犯罪既遂状态与不法状态同时存在（继续存在）”指的是\u0001继续犯\u0002","k":"","kb":92,"kh":[[102,130]]},{"id":"2009-17","y":2009,"t":"单","s":"下列犯罪行为中,属于继续犯的是（ ）。","o":["甲以非法占有为目的骗取对方当事人 5 万元后逃匿","乙非法剥夺武某人身自由 10 天","丙一夜之间盗窃同一住宅楼 3 户人家财物共 5 万元","丁在实施抢劫过程中致受害人重伤且久治不愈"],"a":"B","e":"\u0001非法拘禁罪从抓扣剥夺人身自由之时起到放人为止，限制人身自由的违法犯罪行为和被害人被拘禁的不法状态始终同时处于持续进行之中，是典型的继续犯。\u0002\nA✗ 诈骗5万元后逃匿属于既遂后欺诈行为完结的即时状态犯\nB✓ 乙非法剥夺武某人身自由10天：非法拘禁持续10天，犯罪实行行为本身与被拘禁不法状态整整十天同时延绵持续，属典型\u0001继续犯\u0002\nC✗ 一夜之间连续入室盗窃3户财物，有三个相对独立分别既遂的盗窃行为，属于\u0001连续犯\u0002\nD✗ 抢劫致被害人重伤（即使伤情久治不愈），抢劫攻击行为早已停止，属于\u0001结果加重犯\u0002","k":"","kb":91,"kh":[[12,51]]},{"id":"2009-18","y":2009,"t":"单","s":"甲盗割正在使用中的通讯电缆致通讯中断,既符合盗窃罪的犯罪构成,也符合破坏公用电信设施罪的犯罪构成。甲的犯罪属于（ ）。","o":["吸收犯","连续犯","牵连犯","想象竞合犯"],"a":"D","e":"\u0001只实施了“盗割正在使用中通讯电缆”这一个犯罪动作，同时触犯盗窃罪与破坏公用电信设施罪两个完全不同的独立罪名，属于想象竞合犯（从一重罪处罚）。\u0002\nA✗ 吸收犯存在数个前后不同的行为（如先制造后持有、先非法买卖后藏匿），而盗割电缆只有“一剪刀/一次偷割”一个行为\nB✗ 连续犯需连续多次实施行为触犯同一罪名\nC✗ 牵连犯必须具备两个以上的不同独立犯罪行为，一剪刀下去不可能拆成两个行为\nD✓ 想象竞合犯：仅实施\u0001一个犯罪行为\u0002（割下并拿走正在服役的通讯电缆）却同时侵害国家通信公共安全与财产所有权而触犯两个罪名，属于标准\u0001想象竞合犯\u0002","k":"","kb":91,"kh":[[139,217]]},{"id":"2010-8","y":2010,"t":"单","s":"下列关于罪数的表述中,正确的是（ ）。","o":["数罪并罚时采用限制加重原则","并科原则可以适用于附加刑和管制","数罪中有被处死刑的,对主刑应当采用吸收原则","限制加重原则只适用于有期徒刑"],"a":"C","e":"\u0001我国《刑法》第69条确立以限制加重为原则、以吸收和并科为补充的折中数罪并罚体系；其中死刑（绝对吸收）、无期徒刑（绝对吸收）对主刑一律采用吸收原则。\u0002\nA✗ 我国数罪并罚并非一概适用限制加重原则，而是“以限制加重为主、吸收原则与并科原则为补充”的折中原则（有死刑/无期采用吸收，附加刑、有期+管制等适用并科）\nB✗ 附加刑与附加刑之间、以及《刑修九》后有期徒刑/拘役与管制之间适用并科；但是判处几个相同种类“管制”之间适用限制加重原则（最高不超过3年），不能对纯管制之间简单相加并科\nC✓ 数罪中有被处死刑的，对主刑应当采用吸收原则：人只死一次，无论数罪中判了一个死刑还是数个死刑，主刑全部被死刑吸收（注意仍应与附加刑并科）\nD✗ 限制加重原则不仅适用于有期徒刑，还适用于两个以上相同种类的\u0001拘役\u0002（最高不超1年）和\u0001管制\u0002（最高不超3年）","k":"","kb":42,"kh":[[30,87]]},{"id":"2010-22","y":2010,"t":"多","s":"下列行为中,以抢劫罪一罪定罪处罚的有（ ）。","o":["甲采用暴力制服某首饰店门卫,劫取大量首饰后,担心被门卫认出而将其杀害","乙在抢劫某金店过程中,因金店门卫与之搏斗而杀死门卫","丙将某银行运钞车押运员打死后取走现金 100万元","丁抢劫一重病患者的治疗费用后,该患者因无钱治病而自杀身亡"],"a":"BCD","e":"\u0001在抢劫过程中为压制反抗或直接当场取得财物使用暴力致被害人死亡，直接以抢劫罪一罪（致人死亡升格档）论处；被害人抢后因绝望自杀不转化；但若抢劫既遂已经结束后为灭口另行杀害人，则是故意杀人罪与抢劫罪数罪并罚！\u0002\nA✗ 已经采用暴力制服门卫并“劫取大量首饰”（抢劫罪已完全既遂终了），此后仅因“担心被门卫认出”而另起灭口犯意将其杀害，不属于在抢劫当场为取得财物使用暴力，依法应当以\u0001抢劫罪与故意杀人罪数罪并罚\u0002\nB✓ 抢劫金店过程中因门卫激烈反抗搏斗而为压制反抗当场杀死门卫，暴力致死属于抢劫罪自身包含的当场暴力手段致人死亡加重情节，定\u0001抢劫罪一罪\u0002\nC✓ 为夺取运钞车巨额现金当场将押运员打死后取走100万元，杀人正是作为强行当场劫取财物的暴力手段，适用第263条“抢劫致人死亡”，定\u0001抢劫罪一罪\u0002\nD✓ 抢劫重病患者治病钱，被害人因绝望事后自杀身亡——抢劫行为并未直接打死患者，患者自杀不成立另起故意杀人，也不直接加重定抢劫致死，仍以抢劫罪一罪从重考量处罚","k":"","kb":93,"kh":[[607,627]]},{"id":"2011-8","y":2011,"t":"单","s":"下列关于牵连犯说法中,正确的是（ ）。","o":["出于一个犯罪目的,实施两个以上犯罪行为的都是牵连犯","牵连犯是行为人实施一个犯罪行为触犯数个罪名的犯罪形态","牵连犯的处断原则是除法律有特别规定的以外,择一重罪处罚","牵连犯的成立不仅要求行为人主观上具有牵连意图,还要求行为触犯的数个法条之间存在竞合关系"],"a":"C","e":"\u0001牵连犯处断原则是“除刑法分则明确规定实行数罪并罚的例外情形外，一般从一重罪处罚”（有时还并重从重处罚）。\u0002\nA✗ 出于一个目的实施两个以上行为，不一定都是牵连犯（如果缺乏类型化通常手段目的牵连关系，例如杀甲后为掩盖盗窃而顺手纵火但非一般日常典型牵连，或触犯同一罪名系连续犯，以及法定并罚等都不按普通牵连犯）\nB✗ 一个行为触犯数个罪名是想象竞合犯；牵连犯必须存在两个以上独立的犯罪行为\nC✓ 牵连犯的处断原则是除法律有特别规定的以外，择一重罪处罚：精准符合我国刑法通说及司法实践\nD✗ 牵连犯的成立不要求“数个法条之间存在竞合关系”（法条竞合是立法层面的交叉包含，而牵连犯是现实中先后发生手段行为与目的行为两个独立犯罪的实质罪数问题）","k":"","kb":92,"kh":[[155,177]]},{"id":"2011-9","y":2011,"t":"单","s":"甲因犯盗窃罪被判处有期徒刑5年,在刑罚执行3年后,又发现他在判决宣告前还犯有放火罪,应判处有期徒刑7年。经数罪并罚决定执行10年有期徒刑。对甲还需要继续执行的刑期是（ ）。","o":["12年","10年","9年","7年"],"a":"D","e":"\u0001刑罚执行期间“发现判决宣告以前的漏罪”，依照《刑法》第70条实行“先并后减”：先将原判5年与新发现7年并罚决定执行10年，再减去已经执行的3年，剩余还需继续执行7年！\u0002\nA✗ 总和相加且未扣减已执行刑期，完全违反限制加重与“先并后减”公式\nB✗ 忘记扣除甲在监狱里已经白白服完的3年刑期（如果还执行10年那就总共服了13年，超过了并罚决定的10年执行刑）\nC✗ 不能直接用“原判5-已服3=2”再去和7相加，那是“先减后并”（针对服刑期犯新罪的第71条规则）\nD✓ 7年：因为发现的是\u0001“判决宣告前”的漏罪\u0002，严格遵循第70条\u0001“先并后减”\u0002公式——先将原判5年与漏罪7年合并决定执行10年（合并总和12年，最高7年，决定10年合法），然后从这10年总执行期里减去已经执行的3年，即 `10 - 3 = 7` 年\n记法：漏罪第70条“先并后减”：先定合刑10年，再减已执行3年，剩7年。口诀：漏先并（对被告有利），新先减（重罚）。","k":"","kb":42,"kh":[[50,87]]},{"id":"2011-14","y":2011,"t":"单","s":"检察员甲在承办一起组织、领导传销活动案件的审查起诉工作时,接受一名本应被提起公诉的犯罪嫌疑人的家属5万元贿赂后弄虚作假,致使检察机关对该犯罪嫌疑人作出了不起诉决定。甲的行为（ ）。","o":["只构成受贿罪","构成徇私枉法罪与受贿罪,应择一重罪定罪处罚","构成滥用职权罪与受贿罪,应择一重罪定罪处罚","构成受贿罪与徇私枉法罪,应实行数罪并罚"],"a":"B","e":"\u0001司法工作人员检察员收受贿赂并徇私枉法作出不当不起诉决定，同时触犯《刑法》第385条受贿罪和第399条第1款徇私枉法罪，依第399条第4款明文规定“依照处罚较重的规定定罪处罚”（择一重罪，不数罪并罚！）。\u0002\nA✗ 既受贿又徇私枉法，还必须全面评价其徇私枉法行为，择两罪中较重者定罪处罚（而非无脑只定受贿）\nB✓ 构成徇私枉法罪与受贿罪，应择一重罪定罪处罚：检察员系司法工作人员，收贿后在刑事审查起诉活动中故意包庇应诉嫌疑人作出不起诉决定，构成\u0001徇私枉法罪\u0002与\u0001受贿罪\u0002；依据《刑法》第399条第4款特别规则，此情形“依照处罚较重的规定定罪处罚”（择一重，不并罚）\nC✗ 徇私枉法罪与普通滥用职权罪系特别法与普通法条竞合，在刑事司法追诉中徇私作假优先适用特别条文徇私枉法罪\nD✗ 普通行政渎职受贿才并罚，唯独第399条涉及的司法工作人员渎职与受贿受第4款特别约束“从一重罪论处”","k":"","kb":93,"kh":[[211,269]]},{"id":"2011-44","y":2011,"t":"多","s":"下列犯罪中,应按数罪并罚原则处理的有（ ）。","o":["参加黑社会性质组织又杀人的","拐卖妇女过程中奸淫被拐卖的妇女的","民事案件的审判人员因受贿而枉法裁判的","在走私犯罪过程中采用暴力方法抗拒缉私人员缉私的"],"a":"AD","e":"\u0001依法应当数罪并罚：参加黑社会性质组织后又杀人（《刑法》第294条）、走私中采用暴力方法抗拒缉私（《刑法》第157条第2款）；而拐卖中奸淫（一罪加重）、司法人员受贿枉法裁判（第399条第4款择一重）均不并罚。\u0002\nA✓ 《刑法》第294条第4款明文规定：犯组织、领导、参加黑社会性质组织罪又有其他犯罪行为的，依照\u0001数罪并罚\u0002的规定处罚\nB✗ 拐卖妇女过程中奸淫被拐卖的妇女的，属于第240条第1款第3项法定升格条件，仅定拐卖妇女罪一罪从重（加重法定刑），不另数罪并罚\nC✗ 民事案件审判人员受贿枉法裁判触犯受贿罪与民事枉法裁判罪，依第399条第4款特别规定\u0001依照处罚较重的规定定罪处罚\u0002（不数罪并罚）\nD✓ 《刑法》第157条第2款明文规定：以暴力、威胁方法抗拒缉私的，以走私罪和妨害公务罪（或者袭警罪等），依照\u0001数罪并罚\u0002的规定处罚","k":"","kb":93,"kh":[[75,102],[136,171],[591,606]]},{"id":"2012-14","y":2012,"t":"单","s":"下列情形中,属于结果加重犯的是（ ）。","o":["聚众斗殴致他人死亡","非法行医造成就诊人死亡","强制猥亵妇女致其因羞愤自杀死亡","遗弃没有独立生活能力的人致其死亡"],"a":"B","e":"\u0001《刑法》第336条第1款规定非法行医罪“严重损害就诊人身体健康的，处3年以上10年以下有期徒刑……；造成就诊人死亡的，处10年以上有期徒刑”，属于标准的结果加重犯！\u0002\nA✗ 《刑法》第292条第2款明确规定聚众斗殴“致人重伤、死亡的，依照本法第二百三十四条（故意伤害罪）、第二百三十二条（故意杀人罪）的规定定罪处罚”，属法律拟制之\u0001转化犯\u0002，而非聚众斗殴罪本身的结果加重犯\nB✓ 非法行医造成就诊人死亡：行医基本行为是非法从事执业医疗，一旦过失导致就诊人死亡这一加重实害结果，第336条明确大幅提升至“10年以上有期徒刑并处罚金”，罪名仍定非法行医罪一罪，属于典型\u0001结果加重犯\u0002\nC✗ 第237条强制猥亵、侮辱罪规定了聚众、在公共场所当众等“情节加重犯”，并未设置“致使被害人自杀死亡”的结果加重档次\nD✗ 第261条遗弃罪全文只有一个“五年以下有期徒刑、拘役或者管制”的单一法定刑档，不可能存在提升至更高法定刑档的结果加重犯","k":"","kb":91,"kh":[[222,275],[298,340]]},{"id":"2012-16","y":2012,"t":"单","s":"下列情形中,应当数罪并罚的是（ ）。","o":["甲为迫使不满18 周岁的未成年女子卖淫而对其实施强奸","乙非法拘禁债务人张某10天,其间多次毒打张某,致张某伤残","丙无证驾车,在被交警查处时使用暴力抗拒执法,失手将交警打死","丁开地下卷烟厂,制售劣质卷烟数量巨大,在县联合执法队前来查处时,组织数十村民围攻执法人员,迫使执法队暂时撤离"],"a":"D","e":"\u0001丁开地下烟厂制售劣质卷烟（生产、销售伪劣产品罪）后围攻抗拒执法撤离（妨害公务罪），依据司法解释明文规定应当数罪并罚！另注意《刑修九》后第一情形“强迫卖淫+强奸”依现行法亦改数罪并罚，但以2012年官方考题答案D为准。\u0002\nA✗ 依2012年真题旧法条文第358条，强奸后迫使卖淫规定在强迫卖淫罪升格法定刑中按一罪论处（因此2012年官方答案为“围攻执法”情形）。【新法提示】2015年《刑法修正案（九）》删去了该升格项，依现行《刑法》，为迫使卖淫而强奸的，应以强奸罪与强迫卖淫罪\u0001数罪并罚\u0002（详见补充说明）\nB✗ 非法拘禁中使用暴力致人伤残（《刑法》第238条第2款），转化为\u0001故意伤害罪一罪\u0002论处（转化犯），不与非法拘禁罪并罚\nC✗ 普通妨害公务过程中暴力失手致人死亡（第277条未规定过失致死升格或依过失致人死亡罪与妨害公务想象竞合从一重），且无证驾车被查仅单一抗法行为未构成前后数罪并罚（2012年命题按一罪/转化或想象竞合处断，不并罚）\nD✓ 丁开地下卷烟厂，制售劣质卷烟数量巨大，在县联合执法队前来查处时，组织数十村民围攻执法人员，迫使执法队暂时撤离：丁的制售伪劣卷烟行为构成\u0001生产、销售伪劣产品罪\u0002，组织群众暴力围攻阻挠查处构成\u0001妨害公务罪\u0002；根据两高办理伪劣商品犯罪司法解释第11条规定，实施生产销售伪劣产品罪又以暴力威胁抗拒查处构成妨害公务的，依法\u0001数罪并罚\u0002\n【新法提示】《刑法修正案（九）》修订第358条后，为强迫卖淫而实施强奸的，现行有效《刑法》明确应当以强奸罪和强迫卖淫罪数罪并罚。但2012年当年官方标准单选答案为最后一项（制售劣质卷烟+暴力围攻执法数罪并罚），作答历史真题请识记2012官方键的同时务必牢记现行新法改动！","k":"","kb":93,"kh":[[291,308],[650,678]]},{"id":"2013-7","y":2013,"t":"单","s":"按照我国刑法理论,绑架罪属于（ ）。","o":["继续犯","结合犯","状态犯","连续犯"],"a":"A","e":"\u0001绑架罪一旦成功实力控制被害人即构成既遂，但此后只要一天没释放人质，绑架非法拘押控制行为和被害人被绑状态都在持续推进，属于典型的继续犯。\u0002\nA✓ 继续犯：绑架从强行劫走控制人质开始直至放人或人质脱险，犯罪行为对人身自由的侵害持续不间断，追诉时效从放人或犯罪行为终了之日起算，属\u0001继续犯\u0002\nB✗ 我国现行刑法通说通常认为不存在典型的“结合犯”（甲罪+乙罪法律强制合为新丙罪）\nC✗ 状态犯在既遂瞬间行为本身已彻底结束（如盗窃、诈骗），仅留有物权丧失结果状态\nD✗ 连续犯指基于同一概括故意多次反复实施数个同种犯罪行为","k":"","kb":91,"kh":[[12,55]]},{"id":"2013-11","y":2013,"t":"单","s":"甲伪造人民币100万元,后运输至外地出售, 获赃款10万元。对甲的行为（ ）。","o":["应以伪造货币罪定罪处罚","应以出售、运输假币罪定罪处罚","应以伪造货币罪和出售、运输假币罪数罪并罚","应以伪造货币罪和出售、运输假币罪的想象竞合择一重罪定罪处罚"],"a":"A","e":"\u0001伪造货币并亲自将所造假币运往外地出售，运输、出售自己亲手伪造的假币属于《刑法》第171条第3款（吸收关系）的特别法条包容情形，只按较重的伪造货币罪一罪从重处罚！\u0002\nA✓ 应以伪造货币罪定罪处罚：依据《刑法》第171条第3款规定，伪造货币并出售或者运输伪造的货币的，依照第170条（\u0001伪造货币罪\u0002）的规定\u0001从重处罚\u0002，不与出售、运输假币罪数罪并罚\nB✗ 运输出售“他人”伪造的假币才定出售、运输假币罪；自己造自己卖由更重的伪造货币罪一罪吸收从重\nC✗ 刑法明文规定按伪造货币罪一罪从重，绝不数罪并罚\nD✗ 先伪造后异地运输、出售有多个先后步骤行为（非一行为），系吸收/法定一罪从重处理而非一行为想象竞合","k":"","kb":93,"kh":[[518,542]]},{"id":"2013-14","y":2013,"t":"单","s":"甲为自己的厂房投保后,指使他人放火烧毁厂房,结果殃及附近民房,之后骗取了保险金。对甲的行为（ ）。","o":["应以放火罪论处","应以放火罪和保险诈骗罪数罪并罚","应以保险诈骗罪论处","应按牵连犯理论以放火罪从重处罚"],"a":"B","e":"\u0001为了骗取保险金而放火烧毁自己厂房同时殃及附近民房，先放火危害公共安全后向保险公司骗保，本属牵连犯，但依《刑法》第198条第2款明文规定应当以放火罪与保险诈骗罪数罪并罚。\u0002\nA✗ 指使纵火后实际已经骗取了保险金，放火与保险诈骗均独立成立既遂\nB✓ 应以放火罪和保险诈骗罪数罪并罚：《刑法》第198条第2款规定，投保人、被保险人故意造成财产损失的保险事故（如放火、故意损坏财产）骗取保险金，同时构成其他犯罪的，\u0001依照数罪并罚的规定处罚\u0002\nC✗ 故意放火殃及周边民房严重危害公共安全，绝对不能仅按较轻的保险诈骗罪吞并\nD✗ 虽属典型手段目的牵连，但《刑法》第198条第2款明文否定了“从一重处罚”常规规则，强制要求并罚","k":"","kb":78,"kh":[[17,58]]},{"id":"2013-17","y":2013,"t":"单","s":"甲收买被拐卖的张某后,为让其心甘情愿地做自己的妻子,强行与张某发生了性关系。对甲的行为（ ）。","o":["应以强奸罪定罪处罚","应以收买被拐卖的妇女罪定罪处罚","应以收买被拐卖的妇女罪与强奸罪数罪并罚","应以收买被拐卖的妇女罪与强奸罪择一重罪定罪处罚"],"a":"C","e":"\u0001《刑法》第241条第2款明确规定：收买被拐卖的妇女，强行与其发生性关系的，依照《刑法》第236条（强奸罪）的规定定罪处罚，并与收买被拐卖的妇女罪数罪并罚！\u0002\nA✗ 除了强奸行为外，前面还单独构成了收买被拐卖的妇女罪，不能遗漏收买行为\nB✗ 注意强烈对比：拐卖者自己奸淫被拐妇女只定拐卖妇女罪一罪（第240条），而“收买”者强奸被收买的妇女则必须“数罪并罚”（第241条第2款）！\nC✓ 应以收买被拐卖的妇女罪与强奸罪数罪并罚：严格适用《刑法》第241条第2、4款规定，收买被拐卖妇女又强行发生性关系的，两罪数罪并罚\nD✗ 法条明确规定并罚而非择一重罪处罚\n记法：“拐卖＋奸淫”＝仅一罪加重（第240条）；“收买＋强奸/拘禁/伤害/侮辱”＝数罪并罚（第241条）。","k":"","kb":69,"kh":[[187,223]]},{"id":"2014-10","y":2014,"t":"单","s":"甲盗割高压电线,既构成破坏电力设备罪,又构成盗窃罪。这种犯罪形态属于（ ）。","o":["想象竞合犯","继续犯","连续犯","吸收犯"],"a":"A","e":"\u0001“盗割高压电线”仅仅是一个割剪窃电线的动作（一个实行行为），但同时毁损正在运转电力设备危害公共安全又偷盗电力物资，一行为触犯数罪名，属于想象竞合犯。\u0002\nA✓ 想象竞合犯：只实施了盗割电线这\u0001一个行为\u0002，同时符合破坏电力设备罪和盗窃罪两项犯罪构成，属于想象竞合犯，应从一重罪处罚\nB✗ 继续犯是一个行为在时间上持续不间断侵害同一客体且只触犯一个罪名\nC✗ 连续犯是数个同种行为连续触犯同一罪名\nD✗ 吸收犯存在两个以上先后关联但不同性质的犯罪行为","k":"","kb":91,"kh":[[139,217]]},{"id":"2015-20","y":2015,"t":"单","s":"甲秘密窃取他人持有的枪支,该行为同时符合盗窃罪和盗窃枪支罪的犯罪构成。按照我国刑法理论,这种情形属于（ ）。","o":["牵连犯","法条竞合","想象竞合犯","结果加重犯"],"a":"B","e":"\u0001“盗窃枪支罪”只是把《刑法》第264条“盗窃罪”犯罪对象收窄限定为特别违禁危险物品“枪支”，两罪条文逻辑上呈现“一般法条与特别法条”的包容交叉竞合关系，属于法条竞合！\u0002\nA✗ 只有偷枪一个行为，不存在手段与目的两个不同行为\nB✓ 法条竞合：由于立法分则另外专设保护枪支公共安全管理秩序的特别罪名（第127条盗窃枪支罪），导致普通盗窃罪（第264条）与第127条在“秘密窃取枪支”上法条内容发生包容重叠，依特别法优于普通法适用盗窃枪支罪，属于\u0001法条竞合\u0002（提醒：仅“盗窃普通财物+刚好在他人手里拿了枪”这一行为只触犯一个法条，之所以同时符合两个条文纯属法条体系重合所致，而非犯罪人犯了多罪）\nC✗ 想象竞合是一行为因现实侵犯数个无包容关系独立法益而触犯完全不同的两罪（如开一枪同时打死一人毁坏国宝）；而盗窃枪支本就是盗窃特殊物，两条文自身存在大圈包小圈的包含重叠关系，属法条竞合\nD✗ 不存在一基本罪引起更重结果升格档次问题","k":"","kb":92,"kh":[[234,254],[295,345]]},{"id":"2016-16","y":2016,"t":"单","s":"下列选项中,应以一罪定罪处罚的是（ ）。","o":["运送他人偷越国境,并杀害检查人员的","生产伪劣产品,并以威胁方法抗拒查处的","收买被拐卖妇女,并非法限制其人身自由的","走私毒品,并以暴力方法抗拒检查,情节严重的"],"a":"D","e":"\u0001依据《刑法》第347条第2款第4项，“走私、贩卖、运输、制造毒品，以暴力抗拒检查、拘留、逮捕，情节严重的”直接作为毒品犯罪升格至15年/无期/死刑的一罪加重法定刑处理（例外不另与妨害公务并罚）！\u0002\nA✗ 《刑法》第321条第3款规定：运送他人偷越国（边）境，对被运送人或检查人员有杀害、伤害等犯罪行为的，依照\u0001数罪并罚\u0002的规定处罚\nB✗ 《两高关于办理生产、销售伪劣商品刑事案件具体应用法律若干问题的解释》第11条规定：实施第140至148条伪劣商品罪又以暴力威胁抗拒查处构成其他犯罪的，依法\u0001数罪并罚\u0002\nC✗ 《刑法》第241条第3、4款规定：收买被拐卖妇女并非法限制其人身自由的，依收买被拐卖妇女罪与非法拘禁罪\u0001数罪并罚\u0002\nD✓ 走私毒品，并以暴力方法抗拒检查，情节严重的：因《刑法》第347条第2款第4项早已将“武装掩护或以暴力抗拒检查、拘留、逮捕情节严重的”直接写入走私毒品罪自身高达无期死刑的重罪构成升格法定刑档中，仅以\u0001走私毒品罪一罪\u0002定罪处罚（切记区分：走私“普通货物”抗拒缉私要并罚，而走私“毒品”暴力抗拒检查情节严重的只定一罪升格处重刑！）\n记法：超级对比记忆：走私普通货物＋抗拒缉私 ＝ 数罪并罚（第157条）；走私毒品＋暴力抗拒检查情节严重 ＝ 直接15年/无期/死刑（一罪，第347条）。","k":"","kb":93,"kh":[[543,590]]},{"id":"2016-41","y":2016,"t":"多","s":"下列关于刑法中法条竞合的说法,正确的有（ ）。","o":["法条竞合是指一个犯罪行为同时触犯数个罪名的犯罪形态","处理法条竞合时一般适用特别法优于普通法的规则","我国刑法中的法条竞合主要存在于刑法分则之中","在竞合的数个法条中,仅应择一适用"],"a":"BCD","e":"\u0001法条竞合是立法技术导致分则条文交叉重合的法律适用问题（不是一行为触犯数个真实罪名的犯罪形态）；处理原则通常为特别法优于普通法，且数个竞合法条之间只能择一适用！\u0002\nA✗ “一个犯罪行为同时触犯数个罪名的犯罪形态”是\u0001想象竞合犯\u0002的定义；而法条竞合仅仅是由于刑法条文内容重叠交叉所导致的“法律适用竞合”，实质上只构成一个犯罪、只触犯一个应适用条文，根本不是“犯罪形态”\nB✓ 处理法条竞合的根本一般规则即“特别法优于普通法”（部分特殊规定如诈骗类第266/198条等重法优先属例外）\nC✓ 普通条文与特别条文之设专门大量集中体现在刑法分则各章具体罪名之间\nD✓ 在相竞合的两个或数个法条中，禁止重复评价，最终仅择一条适用定罪处罚","k":"","kb":92,"kh":[[234,309]]},{"id":"2017-19","y":2017,"t":"单","s":"【案情】甲以自己为受益人给妻子购买了人身意外伤害险，后设计杀害了妻子，并以妻子意外死亡为由，申请并获得保险金80万元。\n甲骗取保险金和杀害妻子的犯罪行为属于（ ）。","o":["想象竞合犯","连续犯","吸收犯","牵连犯"],"a":"D","e":"\u0001为了向保险公司骗领80万元保险金（目的行为）而故意设计杀害作为被保险人的妻子（手段行为），手段与目的紧扣、触犯两个不同罪名，犯罪形态上属于牵连犯。\u0002\nA✗ 想象竞合犯是“仅实施一个犯罪行为”；甲显然实施了“杀人”与“伪造理赔申报骗保”前后两个独立犯罪行为\nB✗ 连续犯要求连续数个行为触犯同一罪名，而杀人罪与保险诈骗罪罪名迥异\nC✗ 故意杀人罪与保险诈骗罪之间并不存在常规必然包含吸收关系\nD✓ 牵连犯：以骗保为最终非法获利目的，其制造被保险人死亡的手段行为（故意杀人罪）与最终理赔取款的目的行为（保险诈骗罪）形成典型手段—目的牵连关系，属\u0001牵连犯\u0002","k":"","kb":92,"kh":[[102,130],[141,153]]},{"id":"2017-20","y":2017,"t":"单","s":"【案情】甲以自己为受益人给妻子购买了人身意外伤害险，后设计杀害了妻子，并以妻子意外死亡为由，申请并获得保险金80万元。\n甲的行为应认定为（ ）。","o":["合同诈骗罪一罪","保险诈骗罪和故意杀人罪","故意杀人罪一罪","保险诈骗罪一罪"],"a":"B","e":"\u0001尽管在行为结构上属于牵连犯，但《刑法》第198条第2款针对“故意制造被保险人伤亡保险事故骗取保险金”作出了法定数罪并罚的特别除外条款，因此应当认定为保险诈骗罪和故意杀人罪（数罪并罚）。\u0002\nA✗ 向保险机构骗领人身意外伤害保险金在法条竞合上适用特别法条\u0001保险诈骗罪\u0002，不适用一般合同诈骗罪\nB✓ 保险诈骗罪和故意杀人罪：依照《刑法》第198条第2款明确规定，投保人、受益人故意造成被保险人死亡骗取保险金，同时构成其他犯罪的，依法实行\u0001数罪并罚\u0002（这是牵连犯一般“从一重处罚”规则的法定重大例外）\nC✗ 杀妻后还实际向保险公司提交材料并骗取到80万元保险金，故意杀人罪不能吞并保险诈骗罪\nD✗ 杀妻夺命岂能只定金融诈骗轻罪了事，必须两罪并罚","k":"","kb":78,"kh":[[17,58]]},{"id":"2019-5","y":2019,"t":"单","s":"下列选项中,与盗窃罪存在法条竞合关系的是（ ）。","o":["侵占罪","贪污罪","诈骗罪","抢夺罪"],"a":"B","e":"\u0001贪污罪（《刑法》第382条）的客观手段包括“侵吞、窃取、骗取”，其中利用职务便利“窃取”公共财物与普通“盗窃罪”（第264条）形成特别主体职务型与普通型的法条竞合关系！\u0002\nA✗ 侵占罪是将本来合法代为保管的财物变占有为所有（无需“秘密窃取”动作），与窃取型的盗窃罪不存在法条包含交叉关系\nB✓ 贪污罪：贪污罪罪状涵括国家工作人员利用职务之便“窃取”公共财物，这与普通盗窃罪在“窃取公私财物”要件上高度重叠，贪污罪相当于特别身份法条，与盗窃罪成立\u0001法条竞合\u0002（特别法优于普通法定贪污罪）\nC✗ 诈骗罪（骗取使人产生错误认识主动交付财物）与盗窃罪（违背意志秘密窃取或平和拿走）客观行为构造截然不同，互为排斥并非法条竞合\nD✗ 抢夺罪是公然趁人不备暴力/猛力夺取财物，与盗窃罪手段性质不同","k":"","kb":92,"kh":[[332,345]]},{"id":"2019-9","y":2019,"t":"单","s":"食品安全监管人员甲收受张某的巨额财物后, 对其销售不符合安全标准食品的行为不履行监管职责,导致了重大食品安全事故,后果特别严重。甲的行为应当（ ）。","o":["直接以受贿罪一罪定罪处罚","以食品监管渎职罪与受贿罪并罚","直接以食品监管渎职罪一罪定罪处罚","以食品监管渎职罪与受贿罪从一重罪处断"],"a":"B","e":"\u0001国家机关工作人员在实施食品监管渎职犯罪的过程中收受他人巨额财物，并非司法渎职（第399条第4款特例之外），依两高贪污贿赂司法解释第17条应当以食品监管渎职罪与受贿罪数罪并罚！\u0002\nA✗ 不仅收了贿赂，还实质纵容有毒有害食品流出造成重大食品安全事故，决不能放过食品监管渎职罪\nB✓ 以食品监管渎职罪与受贿罪并罚：根据两高《关于办理贪污贿赂刑事案件适用法律若干问题的解释》第17条及通说，负有渎职职责的行政机关工作人员因受贿而滥用职权或玩忽职守（包括食品监管渎职），同时构成受贿罪与渎职罪的，除刑法第399条第4款等另有规定外，一律实行\u0001数罪并罚\u0002\nC✗ 也不能忽视收受巨额贿赂本身所构成的受贿罪\nD✗ 受贿+渎职“从一重罪处断”仅限于《刑法》第399条第4款明确列举的四项司法人员渎职罪（徇私枉法、民事/行政枉法裁判、执行失职/滥用职权），绝不扩及普通行政渎职或食品监管渎职","k":"","kb":93,"kh":[[211,289]]},{"id":"2019-14","y":2019,"t":"单","s":"下列选项中,不属于继续犯的是（ ）。","o":["诈骗罪","遗弃罪","非法拘禁罪","非法持有毒品罪"],"a":"A","e":"\u0001继续犯常见于“侵犯人身自由类（非法拘禁、绑架）”、“不作为持续违背义务类（遗弃）”、“持有违禁品类（非法持有毒品/枪支）”；而诈骗罪一旦骗到手即刻既遂终结，不属于继续犯！\u0002\nA✓ 诈骗罪（正选不属于项）：被害人处分财物落入行为人控制那一刻诈骗实行行为即完全结束，此后只是失财状态留存（状态犯），不存在持续不断进行骗术的继续过程\nB✗ 遗弃罪负扶养义务而不履行的消极拒养行为持续整个遗弃过程，属于继续犯\nC✗ 非法拘禁罪持续控制剥夺他人行动自由，是最典型继续犯\nD✗ 非法持有毒品罪只要毒品还在行为人现实掌控下，持有的犯罪行为就一直在继续进行中，属于继续犯","k":"","kb":91,"kh":[[12,71],[95,103]]},{"id":"2020-6","y":2020,"t":"单","s":"下列关于继续犯的理解中,正确的是（ ）。","o":["继续犯属于法定的一罪","非法拘禁罪是典型的继续犯","继续犯的追诉时效从犯罪之日起计算","继续犯的不法状态发生于不法行为结束之后"],"a":"B","e":"\u0001继续犯由于是一个犯罪行为在时间维度上持续不断侵害同一客体，在理论上属于实质的一罪；追诉时效从“犯罪行为终了之日”起算；最典型即非法拘禁罪。\u0002\nA✗ 继续犯与想象竞合犯、结果加重犯合称“\u0001实质的一罪\u0002”，而不属于“法定的一罪”（集合犯、惯犯才属法定的一罪）\nB✓ 非法拘禁罪是典型的继续犯：行为人非法关押被害人，从拘禁行为着手剥夺自由达到既遂后，直至最终释放被害人，拘禁实行行为与剥夺自由状态自始至终同时并存延续\nC✗ 《刑法》第89条明文规定：犯罪行为有连续或者继续状态的，追诉期限从\u0001犯罪行为终了之日\u0002起计算（而非“犯罪之日/开始之日”）\nD✗ 既遂行为结束后仅不法结果状态依然继续的是\u0001状态犯\u0002（如盗窃、诈骗）；继续犯的特征恰恰是“犯罪行为与不法状态在既遂后同步持续存在”","k":"","kb":91,"kh":[[0,51],[72,94]]},{"id":"2020-14","y":2020,"t":"单","s":"下列选项中,应按故意杀人罪一罪定罪处罚的是（ ）。","o":["甲为索取债务将孙某关在宾馆房间,其间多次毒打孙某致其死亡","乙为勒索财物绑架钱某,从钱某家人处获得赎金后将钱某杀害","丙为牟取暴利组织多人偷越国境,其间将被组织者吴某殴打致死","丁为劫取财物杀死曹某,并按照计划将曹某驾驶的车辆变卖获利"],"a":"A","e":"\u0001为索取合法债务而非法拘禁债务人，在拘禁过程中使用暴力殴打致被害人死亡，依《刑法》第238条第2款明文转化规定按故意杀人罪一罪定罪从重处罚！\u0002\nA✓ 甲为索取债务将孙某关在宾馆房间，其间多次毒打孙某致其死亡：构成索债型非法拘禁罪，而《刑法》第238条第2款规定“使用暴力致人伤残、死亡的，依照本法第234条（故意伤害）、第232条（故意杀人）的规定定罪处罚”，即转化为\u0001故意杀人罪一罪\u0002\nB✗ 以勒索财物为目的绑架人质并杀害被绑架人的（《刑法》第239条第2款），仍只定\u0001绑架罪一罪\u0002（法定处无期徒刑或者死刑，并处没收财产）\nC✗ 组织他人偷越国（边）境过程中对被组织人有杀害、伤害等犯罪行为的（《刑法》第318条第2款），依照\u0001数罪并罚\u0002的规定处罚（组织偷越国边境罪与故意杀人罪并罚）\nD✗ 为了劫取财物而当场故意杀害被害人随后变卖汽车（《刑法》第263条抢劫致人死亡），定\u0001抢劫罪一罪\u0002（不另定故意杀人或销赃）","k":"","kb":91,"kh":[[341,368]]},{"id":"2020-41","y":2020,"t":"多","s":"下列选项中,属于我国刑法理论中处断的一罪的有（ ）。","o":["集合犯","连续犯","牵连犯","吸收犯"],"a":"BCD","e":"\u0001刑法理论通常把原本具有数个行为/数重外观但最终按一罪处理的形态三分：①实质的一罪（继续、想象竞合、结果加重）；②法定的一罪（集合犯、惯犯）；③处断的一罪（连续犯、牵连犯、吸收犯）。\u0002\nA✗ 集合犯（及惯犯）因为刑法分则条文在规定罪状时就将多次反复实施同类行为预设概括为单一犯罪构成，属于\u0001法定的一罪\u0002\nB✓ 连续犯（基于同一或者概括的故意，连续实施性质相同的数个犯罪行为触犯同一罪名）属处断的一罪\nC✓ 牵连犯（以一罪为目的而手段或结果行为又触犯他罪）属处断的一罪\nD✓ 吸收犯（一个行为依通常发展阶段或依附关系被另一更重行为吸收）属处断的一罪","k":"","kb":92,"kh":[[18,31],[60,70],[102,105],[178,182]]},{"id":"2022-4","y":2022,"t":"单","s":"甲集资诈骗并将所骗得的巨额赃款转移至境外,以掩饰其性质。甲的行为应认定为","o":["集资诈骗罪和洗钱罪(数罪并罚)","集资诈骗罪或洗钱罪(择一重处断)","集资诈骗罪和掩饰、隐瞒犯罪所得罪(数罪并罚)","集资诈骗罪或掩饰、隐瞒犯罪所得罪(择一重处断)"],"a":"A","e":"\u0001《刑法修正案（十一）》正式将“自洗钱”纳入洗钱罪打击范围！行为人先实施集资诈骗罪（属金融诈骗类7大上游犯罪之一），再自己将所得巨额赃款转移至境外以掩饰其来源和性质，不再作不可罚事后行为处理，应当以集资诈骗罪和洗钱罪数罪并罚！\u0002\nA✓ 集资诈骗罪和洗钱罪（数罪并罚）：2021年3月1日生效的《刑法修正案（十一）》删去第191条“明知是……而提供资金账户/协助……”等限于他人帮助的限制词，确立\u0001“自洗钱”独立成罪规则\u0002。甲先犯上游金融诈骗类集资诈骗罪，又亲自转移赃款至境外掩饰犯罪所得性质，构成“自洗钱”，依法以\u0001集资诈骗罪和洗钱罪数罪并罚\u0002\nB✗ 不是同一法益想象竞合或单从一重，而是两个不同行为侵害金融管理秩序（金融诈骗）和金融安全与司法查处秩序（洗钱），依法必须并罚\nC✗ 掩饰、隐瞒犯罪所得罪（第312条）是“他犯后行为”（法硕通说要求行为人不能是上游犯罪正犯本人，本犯自己掩饰转移赃物除了第191条这七类特定上游罪外一般属不可罚事后行为）；正因第191条特别将涉金融诈骗“自洗钱”入罪，才精准定洗钱罪而非第312条\nD✗ 既不是第312条也不适用择一重处断","k":"","kb":93,"kh":[[309,356]]},{"id":"2023-5","y":2023,"t":"单","s":"下列情形中,应当数罪并罚的是","o":["甲长期虐待母亲,致其重伤","乙以暴力干涉女儿婚姻自由,致其服毒身亡","丙(投保人)勒死其妻(被保险人),骗取巨额保险金","丁(侦查人员)对犯罪嫌疑人实行刑讯逼供,致其死亡"],"a":"C","e":"\u0001《刑法》第198条第2款明文规定：投保人、受益人故意杀害被保险人骗取保险金的，依照故意杀人罪与保险诈骗罪数罪并罚！而虐待致伤亡（第260条结果加重）、暴力干涉婚姻自由致死（第257条结果加重）、刑讯逼供致死（第247条转化故意杀人一罪）均只定一罪！\u0002\nA✗ 长期虐待母亲致重伤属于《刑法》第260条第2款规定的虐待罪结果加重犯，仅定\u0001虐待罪一罪\u0002（注意非故意打伤而系持续虐待引起）\nB✗ 以暴力干涉女儿婚姻自由致其被害人自杀/服毒身亡，属于第257条第2款明确的结果加重犯，仅定\u0001暴力干涉婚姻自由罪一罪\u0002\nC✓ 丙(投保人)勒死其妻(被保险人)，骗取巨额保险金：投保人故意杀害被保险人制造死亡理赔事故再向保险公司骗领保险金，依《刑法》第198条第2款特别规定，以\u0001故意杀人罪和保险诈骗罪数罪并罚\u0002\nD✗ 侦查人员对嫌疑人刑讯逼供致人死亡的，依据第247条规定直接转化按\u0001故意杀人罪一罪\u0002从重处罚","k":"","kb":78,"kh":[[17,58]]},{"id":"2025-8","y":2025,"t":"单","s":"下列情形中,应当数罪并罚的是（ ）。","o":["甲奸淫被自己拐卖的妇女","乙投毒欲杀妻却致其子死亡","丙非法拘禁致被拘禁人死亡","丁在食品监管渎职过程中受贿"],"a":"D","e":"\u0001在食品安全监管渎职过程中收受贿赂，除第399条第4款司法人员特定四罪择一重外，普通行政及食品监管渎职与受贿罪依法实行数罪并罚！\u0002\nA✗ 奸淫被自己拐卖的妇女属于《刑法》第240条第1款第3项拐卖妇女罪法定刑升格情节，仅定\u0001拐卖妇女罪一罪\u0002\nB✗ 投毒欲杀妻子结果错把毒汤给儿子喝死，仍在“故意杀人罪”同一法定构成要件之内（具体对象/打击错误），仅成立\u0001故意杀人罪既遂一罪\u0002（不数罪并罚）\nC✗ 单纯非法拘禁（未超过常规限度故意殴打伤残）因过失意外导致被拘禁人自杀或发病死亡，属于第238条第2款前半句“致人死亡”的\u0001结果加重犯\u0002（即便暴力殴打致死也只是转化为故意杀人罪一罪），绝不并罚\nD✓ 丁在食品监管渎职过程中受贿：依据两高《贪污贿赂司法解释》第17条规定，国家工作人员受贿并为请托人谋利进而构成第397至408条渎职罪（含第408条之一食品监管渎职罪）的，除第399条第4款司法四罪外，应当以\u0001食品监管渎职罪与受贿罪数罪并罚\u0002","k":"","kb":93,"kh":[[270,289]]}]},{"sub":"民法","name":"物权通则与物权变动","w":1.9,"L":31,"qs":[{"id":"2005-50","y":2005,"t":"单","s":"对主物与从物的关系,下列说法中正确的是（ ）。","o":["从物属于主物的构成部分","从物所有权只在当事人有特别约定时,才随主物所有权的转移而转移","从物必须依附于主物而存在","从物与主物的所有权人是同一人"],"a":"D","e":"\u0001主物与从物必须属于同一所有权人，且是在功能上相互结合、物理上独立可分的两个物。\u0002\nA✗ 从物是独立存在之物而非主物的物理构成部分（否则仅为主物的成分，非主从物）。\nB✗ 法律规定或当事人未另作特别约定时，从物所有权“当然”随主物所有权转移而转移。\nC✗ 主物与从物各自独立存在，仅在使用功能上从物辅助发挥主物效用，非物理依附不可脱离。\nD✓ 构成主从物关系的前提之一是两物同属一个所有权人（分属不同所有人时仅构成他人独立物）。","k":"","kb":118,"kh":[[304,330]]},{"id":"2005-55","y":2005,"t":"多","s":"物权法的基本原则包括（ ）。","o":["物权法定","一物一权","物权行为独立性和无因性","物权公示、公信"],"a":"ABD","e":"\u0001我国物权法的基本原则包括物权法定、一物一权与物权公示公信原则，不采纳物权行为独立性与无因性。\u0002\nA✓ 物权的种类和内容由法律明确规定，即物权法定原则（《民法典》第116条）。\nB✓ 一个独立物之上原则上只能设定一个所有权或互不相容的支配权，即一物一权原则。\nC✗ 物权行为独立性与无因性属于德国民法理论，我国民法采债权形式主义/区分原则，并未确认无因性原则。\nD✓ 物权设立与变动须以登记或交付方式公开展示并产生公信效力，即公示公信原则。","k":"","kb":118,"kh":[[63,115]]},{"id":"2008-39","y":2008,"t":"单","s":"下列对所有权关系的判断,错误的是（ ）。","o":["所有权关系属于物权关系","所有权关系属于绝对法律关系","所有权关系的客体包括物与行为","所有权关系的权利主体是特定的，义务主体是不特定的"],"a":"C","e":"\u0001所有权关系属于绝对法律关系，其客体仅限于“物”，而不包括当事人的行为。\u0002\nA✗ 所有权是最典型、支配效力最充分的完全物权，故属物权关系（表述正确）。\nB✗ 所有权对抗世上一切不特定人，属于绝对法律关系（表述正确）。\nC✓ 行为是债权关系的客体；所有权法律关系的客体仅限于特定有体物（或法律拟制物），不包括行为，故本项表述错误。\nD✗ 所有权关系的权利主体是特定的所有权人，义务主体则是除权利人之外的一切不特定人（表述正确）。","k":"","kb":118,"kh":[[127,171]]},{"id":"2008-40","y":2008,"t":"单","s":"下列情形中,属于所有权继受取得方式的是（ ）。","o":["以所有的意思占有无主财产","拾得他人遗失物","获取自有财产的孳息","依照遗嘱取得遗产"],"a":"D","e":"\u0001继受取得是指通过原所有人的转让、遗赠或遗嘱继承等合法移转途径取得所有权；先占、拾得遗失物和孳息均属原始取得。\u0002\nA✗ 先占无主财产不依赖前手权利移转，属于原始取得。\nB✗ 拾得遗失物（无人认领依法归国家等情形）亦非从原权利人继受移转。\nC✗ 依法取得自有财产孳息基于物权固有权能派生，属于原始取得。\nD✓ 依照遗嘱取得遗产是从被继承人原有所有权依法移转而来，属于典型继受取得。","k":"","kb":119,"kh":[[453,468]]},{"id":"2009-37","y":2009,"t":"单","s":"根据物权客体的种类,物权可分为（ ）。","o":["完全物权与限定物权","主物权与从物权","动产物权与不动产物权","用益物权与担保物权"],"a":"C","e":"\u0001以物权客体种类（动产还是不动产）为分类标准，物权分为动产物权与不动产物权。\u0002\nA✗ 完全物权与限定物权是以支配力范围大小进行的划分。\nB✗ 主物权与从物权是以物权能否独立存在为标准的划分。\nC✓ 动产物权（如动产质权、留置权）与不动产物权（如土地承包经营权、建设用地使用权）正以客体标的物种类为划分依据。\nD✗ 用益物权与担保物权是以设立目的及支配标的物使用价值或交换价值为标准划分。","k":"","kb":118,"kh":[[235,300]]},{"id":"2010-35","y":2010,"t":"单","s":"出租人甲将房屋交给承租人乙占有使用,乙对该房屋的占有属于（ ）。","o":["直接占有","间接占有","善意占有","恶意占有"],"a":"A","e":"\u0001承租人基于租赁合同直接对租赁房屋加以实际占有和管领控制，在占有人分类中属于直接占有。\u0002\nA✓ 乙实际居住并使用房屋，在事实上直接管领控制标的物，属于直接占有（甲则构成间接占有）。\nB✗ 出租人甲将房屋交由乙占有，由甲通过租赁关系对物施加支配，甲才属于间接占有。\nC✗ 善意占有与恶意占有是对“无权占有”进行的再细分；乙依租赁合同合法占有，属有权占有。\nD✗ 乙基于有效租赁协议持有房屋，既非无权占有更非恶意占有。","k":"","kb":120,"kh":[[105,114],[115,119],[135,139]]},{"id":"2010-38","y":2010,"t":"单","s":"甲将一件名贵瓷器交乙保管。在保管期间乙提出购买此瓷器,甲、乙双方达成买卖合意。在买卖合同中,瓷器的交付方式属于（ ）。","o":["简易交付","现实交付","指示交付","占有改定"],"a":"A","e":"\u0001买卖前买受人已基于保管关系实际占有瓷器，双方达成买卖合意时物权即发生变动，属于简易交付。\u0002\nA✓ 买受人乙先已依法占有该瓷器，签订买卖合意时省去重复交还与再交付过程，即属简易交付。\nB✗ 现实交付指直接将动产现实移交对方控制，本案此前已交乙保管。\nC✗ 指示交付适用于动产由第三人占有的情形。\nD✗ 占有改定是出让人自己继续占有标的物同时约定买受人间接占有而转移所有权。","k":"","kb":119,"kh":[[256,280]]},{"id":"2011-21","y":2011,"t":"单","s":"下列选项中,不属于民法上的物的是（ ）。","o":["金银制品","空气","货币","枪支"],"a":"B","e":"\u0001民法上的物须能为人力所认识并实际支配控制，大自然的流动空气无法被人力排他控制，不属于民法上的物。\u0002\nA✗ 金银制品具备有体性、独立性及经济价值，属于典型民法上的物。\nB✓ 空气处于自然界无限流动状态，人力尚不能排他独占控制，故一般空气不属于民法上的物（装瓶压缩的氧气则可成为物）。\nC✗ 货币是高度替代性的特种动产，属于民法上的物。\nD✗ 枪支虽属限制流通物，但能为人力控制且具有物理实体，仍属民法上的物。","k":"","kb":118,"kh":[[171,235]]},{"id":"2011-47","y":2011,"t":"多","s":"下列选项中,物权变动的情形包括（ ）。","o":["政府征收了甲村的土地","乙将自己的彩电赠与了好友","丙在其宅基地上建造了房屋","法院判决所有权有争议的汽车属于丁"],"a":"ABCD","e":"\u0001物权变动包括基于法律行为（赠与彩电）、公法原因（政府征收、法院裁判）以及事实行为（合法建房）引起的所有权设变或消灭。\u0002\nA✓ 政府征收土地导致集体土地所有权消灭、国家取得所有权，属基于公法行为的物权变动。\nB✓ 乙将彩电赠与并交付好友，引发彩电所有权转移，属基于法律行为的物权变动。\nC✓ 丙在其宅基地上合法建造房屋，自建造完成时即原始取得房屋所有权。\nD✓ 人民法院确认或形成所有权的生效法律文书导致该汽车所有权归属确定变更。","k":"","kb":119,"kh":[[347,351],[369,378],[414,452]]},{"id":"2012-21","y":2012,"t":"单","s":"下列各组财产中,构成主物与从物关系的是（ ）。","o":["赵某的房屋和房门","李某的手表和孙某的表带","钱某的电视机和遥控器","周某的汽车和车轮"],"a":"C","e":"\u0001电视机与遥控器互相独立且功能辅助、同属钱某一人所有，构成典型主物与从物关系。\u0002\nA✗ 房门安装于房屋之上成为不动产不可分重要成分，不具有独立物格。\nB✗ 手表属李某而表带属孙某，不满足“同属一个所有人”要件。\nC✓ 电视机（主物）与专用遥控器（从物）均具物理独立性，功能上遥控器辅助电视机发挥效用，且同归钱某所有。\nD✗ 车轮在整车状态下通常作为汽车整体组成部分（仅备用轮胎才可视为从物，通说及真题均以汽车与车轮为整体与成分关系）。","k":"","kb":118,"kh":[[304,380]]},{"id":"2012-48","y":2012,"t":"多","s":"我国《物权法》规定的动产交付方式包括","o":["指示交付","现实交付","简易交付","占有改定"],"a":"ABCD","e":"\u0001我国现行物权制度认可的动产交付方式有现实交付以及指示交付、简易交付、占有改定三种观念交付。\u0002\nA✓ 指示交付（第227条）通过让与返还请求权完成动产交付。\nB✓ 现实交付（第224条）是直接转移实物占有的基本交付方式。\nC✓ 简易交付（第226条）适用权利人事先已合法占有动产之情形。\nD✓ 占有改定（第228条）适用于双方另约由出让人继续占有动产之情形。","k":"","kb":119,"kh":[[251,320]]},{"id":"2013-30","y":2013,"t":"单","s":"甲将自行车交乙保管,不久乙去世。乙之子丙误将该自行车当成遗产继承,后在使用过程中致自行车损坏。根据有关规定（ ）。","o":["丙系恶意占有人","丙应当返还自行车给甲","丙应当向甲承担违约责任","丙应当赔偿甲的损失"],"a":"B","e":"\u0001丙误将他人寄存在乙处的自行车作为遗产继承，属无权善意占有人，无合同关系不担违约责任，但应向真权利人甲返还原物。\u0002\nA✗ 丙不知且不应当知道自行车属甲而非乙遗产，属于善意占有而非恶意占有。\nB✓ 乙并非自行车所有权人，自行车不构成遗产，甲作为真所有权人有权依物权请求权要求无权占有人丙返还自行车。\nC✗ 保管合同仅存在于甲、乙之间，丙与甲并无契约关系，不负违约责任。\nD✗ 依《民法典》第460条，善意占有人因使用导致占有物毁损灭失的，不负赔偿责任（仅在获有赔偿金、保险金或现存利益范围负返还责任）。","k":"","kb":120,"kh":[[155,246]]},{"id":"2014-40","y":2014,"t":"单","s":"甲将自己的摄像机交给乙保管,丙从乙处盗走该摄像机并卖给了不知情的丁。下列主体中,对该摄像机的占有属于他主占有的是（ ）。","o":["甲","乙","丙","丁"],"a":"B","e":"\u0001保管人乙代甲保管摄像机，不具有将摄像机据为己有的自主所有意图，对其占有属于他主占有。\u0002\nA✗ 所有权人甲当然具有所有意思，为自主占有。\nB✓ 乙受托代为保管摄像机，明知所有权归甲并仅履行保管职责，属于典型的他主占有。\nC✗ 小偷丙窃得财物意欲以所有人自居自行支配处分，在占有分类上亦属自主占有。\nD✗ 不知情买受人丁以为自己合法买了摄像机，同样以所有意图进行自主占有。","k":"","kb":120,"kh":[[48,103]]},{"id":"2014-48","y":2014,"t":"多","s":"在当事人没有约定时,能够取得原物的天然孳息所有权的有（ ）。","o":["所有权人","留置权人","土地承包经营权人","动产抵押权人"],"a":"AC","e":"\u0001在无特别约定时，天然孳息由所有权人取得；既有所有权人又有用益物权人的，由用益物权人取得；担保物权人不当然直接取得。\u0002\nA✓ 所有权人对自有原物所生天然孳息当然享有所有权（无用益物权人并存时）。\nB✗ 留置权属于担保物权，留置权人收取留置财产孳息仅用于优先抵充债权，并非直接取得孳息所有权。\nC✓ 土地承包经营权属于用益物权，在同时存在集体土地所有权人和承包经营权人时，天然孳息归用益物权人取得。\nD✗ 动产抵押权人不仅未实际占有标的物，法律亦仅规定扣押后方可收取孳息以充抵债权，不能直接取得所有权。","k":"","kb":118,"kh":[[480,549]]},{"id":"2015-30","y":2015,"t":"单","s":"甲下班时误将同事的同款电脑当成自己的电脑带回家。甲对该电脑的占有属于（ ）。","o":["有权占有","间接占有","善意占有","他主占有"],"a":"C","e":"\u0001甲误将同事的同款电脑当作自己的带回家，不知自己缺乏占有合法根据，属于无权占有中的善意占有。\u0002\nA✗ 甲对该同事电脑并无本权基础，客观上属于无权占有。\nB✗ 甲将电脑直接随身带回自己家中管领，属于直接占有而非间接占有。\nC✓ 甲主观上误以为系己物，不知道也不应当知道自己无权占有，构成善意占有。\nD✗ 甲主观测度上误认该电脑归自己所有，系以所有人意思管领，属自主占有。","k":"","kb":120,"kh":[[155,183]]},{"id":"2015-47","y":2015,"t":"多","s":"甲、乙系对门邻居,同时装修房屋。某日,在甲家装修的丙公司工人丁误将乙堆放在公共过道上的瓷砖当成甲所有,贴到甲家厨房墙壁。乙可以要求（ ）。","o":["甲返还原物","甲返还不当得利","丙公司赔偿损失","丙公司与丁承担连带责任"],"a":"BC","e":"\u0001装修工人丁误将乙瓷砖贴附甲家墙面形成不可分附合：乙不可强拆返还原物，可请求甲返还不当得利并请求用人单位丙公司赔损。\u0002\nA✗ 瓷砖已经水泥砂浆粘贴附合成为甲房屋不可分组成部分，乙丧失原瓷砖所有权，不得请求拆墙返还原物。\nB✓ 甲墙面无合法根据因乙之瓷砖增值受益、致乙受损，乙可向甲主张返还不当得利（偿付折价款）。\nC✓ 丙公司员工丁在执行装修工作任务中过错侵害乙财产权益，应由用人单位丙公司承担侵权损害赔偿责任。\nD✗ 依用人单位侵权责任规则，对外由丙公司单独承担赔偿责任，丙公司与员工丁不成立连带责任（丙公司赔付后可依重大过失等内追偿）。","k":"","kb":120,"kh":[[401,455]]},{"id":"2016-40","y":2016,"t":"单","s":"【案情】2014年3月12日，甲、乙签订房屋买卖合同，并于当日办理了预告登记。合同约定，乙于3月15日支付全款，双方于3月30日前办理过户手续。乙依约支付房款后，因甲出差双方一直未办理过户手续。7月10日甲又将该房屋卖给丙并办理了过户手续。\n2014年8月1日,乙将甲诉至法院。此时（ ）。","o":["预告登记有效,但丙取得房屋所有权","预告登记有效,丙不能取得房屋所有权","预告登记失效,丙取得房屋所有权","预告登记失效,但丙不能取得房屋所有权"],"a":"C","e":"\u0001预告登记后自能够进行不动产登记之日起90日内未申请登记的，预告登记失效；丙已办理过户登记，依法取得房屋所有权。\u0002\nA✗ 3月30日起已具备过户登记条件（乙付全款且未逾登记条件期），至8月1日早已远远超过90日，预告登记已失效。\nB✗ 预告登记失效后不再具备排斥第三人过户取得物权的法律效力。\nC✓ 3月30日（最迟具备过户条件日）起算满90日即于6月底届满而权利人乙未申请登记（也未主张保权等有效延续），预告登记失效，7月10日丙已办理登记，合法取得所有权。\nD✗ 预告登记一旦失效，甲向丙再售并登记过户的行为有效产生物权移转后果，丙取得所有权。","k":"","kb":119,"kh":[[506,566]]},{"id":"2017-30","y":2017,"t":"单","s":"甲经政府主管部门批准,在其宅基地上盖了一栋楼房,未办理房屋登记手续。3年后甲死亡,其唯一的继承人乙将房屋卖给同村的丙,并交付丙占有使用。现该房屋的所有权人是（ ）。","o":["国家","甲所在村集体","乙","丙"],"a":"C","e":"\u0001合法建房自建成时取得所有权，死后由唯一继承人乙自继承开始时直接取得房屋所有权；未办登记再出卖交付给丙的，不发生物权变动，丙未取得所有权。\u0002\nA✗ 该房屋由村民甲合法建造并由合法继承人乙继承，不归国家所有。\nB✗ 地上房屋本身属于公民私人合法财产而非村集体所有。\nC✓ 甲合法建造房虽未登记仍原始取得所有权，甲死亡时由唯一继承人乙自继承开始即继受取得所有权；但乙此后“再处分（出卖）该不动产未经办理登记不发生物权效力”，故房屋所有权人仍是乙。\nD✗ 乙依非基于法律行为虽享所有权，但其以买卖合同处分该不动产未经登记不发生物权效力，丙仅交付占用并未取得房屋所有权。\n记法：法条精讲：《民法典》第232条——“继承取物权虽不要登记，再往外卖房必须先补登过户！”","k":"","kb":119,"kh":[[379,413]]},{"id":"2018-22","y":2018,"t":"单","s":"甲将一部相机借给乙，乙擅自将相机卖给不知情的丙，丙又将相机卖给不知情的丁并交付。对此，下列说法正确的是（ ）。","o":["丁根据善意取得取得相机的所有权","丁基于丙的交付取得相机的所有权","丁在甲追认后方可取得相机的所有权","丁在付清全部款项后方可取得相机的所有权"],"a":"B","e":"\u0001乙将借来的相机卖与不知情的丙并交付，丙通过善意取得已成为真正所有权人；丙再转卖交付丁时是有权处分，丁基于正常交付继受取得所有权。\u0002\nA✗ 善意取得制度专门解决“无权处分”情形下的第三人受让保护；丙既已先善意取得所有权，其转售给丁属于“有权处分”，丁无需再援引善意取得。\nB✓ 前手丙已依法善意取得所有权，故丙向丁出售并交付相机系合法有效的有权处分，丁直接基于丙的交付行为继受取得相机所有权。\nC✗ 丙已为有权所有权人，无须原借出人甲的追认。\nD✗ 动产物权移转自交付时发生效力，不以买受人全部付清价款为必要前提（除非另有所有权保留约定）。","k":"","kb":119,"kh":[[580,640]]},{"id":"2018-34","y":2018,"t":"单","s":"甲将汽车以15 万元的价格卖给乙并交付,后甲从乙处借回该车,并以 16 万元的价格卖给不知情的丙,同时办理了登记手续,但车仍由甲占有。乙得知后,要求甲、丙返还汽车、赔偿损失。对此,下列选项正确的是（ ）。","o":["汽车归丙所有,乙的损失由甲赔偿","汽车归丙所有,乙的损失由甲、丙连带赔偿","汽车归乙所有,乙有权要求甲返还汽车、赔偿损失","汽车归乙所有,乙有权要求丙返还汽车、赔偿损失"],"a":"C","e":"\u0001甲先卖车并交付乙，乙已取得所有权；后甲借回再卖丙虽办理车辆过户登记但未现实交付，丙未受交付不能善意取得，车仍归乙所有。\u0002\nA✗ 机动车物权变动以交付为生效要件，登记仅起对抗效力；甲再售丙系无权处分且始终未实际交付给丙，丙既未继受取得亦不符合善意取得要求的“已交付”条件，故汽车仍属乙。\nB✗ 丙并未取得该车所有权，且汽车本就归乙，甲、丙无需连带赔车价损失（仅乙可向甲主张返还和赔偿）。\nC✓ 汽车始终归所有权人乙所有，现由借用人甲实际占有，因此乙有权要求甲返还汽车并赔偿损失。\nD✗ 丙既未占有该车又未取得物权，乙的返还请求权应直接向实际无权占有汽车的甲主张。\n记法：关键区分：普通动产及机动车均“交付才转移所有权，登记只对抗善意第三人”；无权处分动产善意取得也必须完成“交付”，光办车牌过户不转移所有权！","k":"","kb":119,"kh":[[165,187],[244,250]]},{"id":"2018-47","y":2018,"t":"多","s":"下列选项中,无需登记即可发生物权变动的有（ ）。","o":["甲公司将其股权出质给银行","乙公司将其轮船的所有权转让给高某","丙公司通过拍卖取得建设用地使用权","丁农户将土地承包经营权转让给钱某"],"a":"BD","e":"\u0001轮船所有权转让与土地承包经营权互换、转让均采登记对抗主义，合同生效或交付时即发生物权变动，无需登记；股权质押与建设用地使用权出让则采登记生效。\u0002\nA✗ 依《民法典》第443条，以股权出质的，质权自办理出质登记时设立。\nB✓ 轮船属特殊动产，其所有权转让自交付（合意移转）时即发生效力，未经登记仅不得对抗善意第三人。\nC✗ 依《民法典》第349条，设立建设用地使用权必须办理登记，自登记时设立（拍卖成交不直接创设物权）。\nD✓ 依《民法典》第335条，土地承包经营权互换、转让的，自合同生效时发生物权变动效力，未经登记不得对抗善意第三人。","k":"","kb":119,"kh":[[147,243]]},{"id":"2018-50","y":2018,"t":"多","s":"甲将拾得的手表赠与不知情的乙,乙对该手表的占有属于（ ）。","o":["有权占有","善意占有","直接占有","自主占有"],"a":"BCD","e":"\u0001乙不知手表系甲拾得而受赠并直接拿着使用，构成无权占有、善意占有、直接占有与自主占有。\u0002\nA✗ 拾得人甲无权处分他人遗失物，受赠人乙对遗失物欠缺本权（无偿受赠亦不满足善意取得有偿对价且拾得物不适用一般善意取得），故属无权占有而非有权占有。\nB✓ 乙不知道也不应当知道手表为他人遗失物，属于善意占有。\nC✓ 乙实际佩戴、管领该手表，属于直接占有。\nD✓ 乙以自己所有的意思占有该受赠手表，属于自主占有。","k":"","kb":120,"kh":[[48,86],[105,114],[126,132],[155,175],[184,193]]},{"id":"2020-29","y":2020,"t":"单","s":"甲将自己的房屋赠与好友乙,已交付但未办理过户登记。一年后,甲因急需资金,将该房卖给丙并办理了过户登记,同时约定在丙付清全款前,甲保留房屋所有权。对此,下列选项正确的是（ ）。","o":["甲仍享有房屋所有权","乙继受取得房屋所有权","丙善意取得房屋所有权","丙继受取得房屋所有权"],"a":"D","e":"\u0001甲将房屋赠与乙仅交付未过户，乙未取得所有权；后甲卖给丙并办理过户登记，丙继受取得房屋所有权（双方保留所有权约定对不动产无效）。\u0002\nA✗ 房屋已依法办理变更登记至丙名下，甲已丧失所有权。\nB✗ 不动产物权变动采登记生效，乙受赠房屋但始终未办理过户登记，未取得房屋所有权。\nC✗ 因乙未过户，甲卖给丙时仍是房屋真正所有权人，系“有权处分”，丙是正常继受取得而非善意取得。\nD✓ 丙受让房屋自有权所有权人甲并完成过户登记，依法继受取得所有权；所有权保留仅适用于动产买卖，双方私约保留房屋所有权不生阻断过户物权之效力。","k":"","kb":119,"kh":[[50,111]]},{"id":"2020-31","y":2020,"t":"单","s":"甲将借给乙的笔记本电脑卖给丙,甲、丙约定由丙直接向乙请求返还电脑。该电脑的交付方式属于（ ）。","o":["现实交付","占有改定","简易交付","指示交付"],"a":"D","e":"\u0001甲出卖借给乙占有的笔记本电脑，约定由买受人丙直接向乙请求返还，属于指示交付。\u0002\nA✗ 甲未先取回实物再亲自递交给丙，并非现实交付。\nB✗ 出让人甲自己并未继续占有电脑，电脑在第三人乙手中，故非占有改定。\nC✗ 买受人丙此前并未占有该电脑，故非简易交付。\nD✓ 出让动产正由第三人乙占有，出让人甲通过将对乙的返还请求权让与丙并通知乙代替实物交付，属于指示交付。","k":"","kb":119,"kh":[[281,305]]},{"id":"2020-46","y":2020,"t":"多","s":"甲拾得乙丢失的手机,向乙索要2000元报酬,乙表示面谈。见面后乙称只给500元,甲因此拒绝返还手机。乙要求甲返还手机的请求权有（ ）。","o":["侵权请求权","物权请求权","不当得利请求权","无因管理请求权"],"a":"ABC","e":"\u0001拾得人拒不返还遗失物并无理索要高额报酬，失主乙有权向其主张物权请求权、不当得利返还请求权以及侵权请求权。\u0002\nA✓ 甲无合法根据拒不返还他人手机构成对乙所有权的侵害，乙可主张侵权返还或赔偿请求权。\nB✓ 乙作为手机所有权人，有权向无权占有人甲行使返还原物请求权（《民法典》第235条）。\nC✓ 甲无合法依据继续占有手机获有利益且致乙丧失占有受损，乙可主张不当得利返还请求权。\nD✗ 无因管理请求权是管理人向受益人主张费用偿还的权利；拾得人甲恶意拒还更无管理合意可言，且不能由失主反以无因管理向拾得人索还。","k":"","kb":120,"kh":[[269,338]]},{"id":"2021-30","y":2021,"t":"单","s":"甲将房屋出租给乙。租赁期间甲将房屋卖给了丙,办理了过户登记手续,双方约定剩余租期的租金由丙收取。其后甲将上述事实告知乙。租期届满后,乙继续占有该房屋。对此,下列表述正确的是 （ ）。","o":["丙只能请求乙向甲返还房屋","丙既可以请求甲交付房屋,也可以请求乙返还房屋","丙只能请求甲交付房屋","丙只能请求乙返还房屋"],"a":"D","e":"\u0001甲在租期内将房屋卖给丙并办理过户登记，租期届满后承租人乙拒不腾退；此时丙已为唯一所有权人，只能直接请求无权占有人乙返还房屋。\u0002\nA✗ 房屋所有权已由丙依法继受取得，应由乙向现所有权人丙返还，而非向原房东甲返还。\nB✗ 甲已将出租及房屋实占情况如实告知丙并完成了法律上的所有权登记移转与指示交付配合，丙无权要求未占有房屋的甲再作实物交付。\nC✗ 原房东甲已不再实际占有且无违约隐瞒行为，租期届满后乙无权占有对抗的是新房东丙。\nD✓ 租赁期满后房屋返还义务指向现所有权人丙；丙既有基于所有权的返还原物请求权，亦可依《民法典》第725条“买卖不破租赁”下当然承受的租赁合同请求乙腾房。","k":"","kb":119,"kh":[[112,144]]},{"id":"2021-40","y":2021,"t":"单","s":"下列选项中,构成原物与孳息关系的是","o":["名画原件与其复制品","母牛与其产下的牛犊","水库与水库里的鱼","果树与果树上的果实"],"a":"B","e":"\u0001母牛与所产牛犊在物理上已分离且由母牛派生收益，构成典型的原物与天然孳息关系。\u0002\nA✗ 复制品系再制产物，并非原画自然或依法派生的收益，不属孳息。\nB✓ 牛犊由母牛受孕分娩而出且成为独立动产，母牛为原物，牛犊为天然孳息。\nC✗ 水库里天然生存但未脱离水库的鱼群属于水库水域生态整体组成部分（或独立野生动产群），非水库自体派生之孳息。\nD✗ 尚未从果树上采摘分离的“果树上的果实”仍属果树的组成部分，须待采摘分离后方成独立孳息物。","k":"","kb":118,"kh":[[430,478]]},{"id":"2022-49","y":2022,"t":"多","s":"预告登记的失效原因包括","o":["预告登记的权利人死亡或者终止","买卖不动产物权的协议被撤销","买卖不动产物权的协议被认定无效","自能够进行不动产登记之日起90日内权利人未申请登记"],"a":"BCD","e":"\u0001预告登记后，债权消灭（主协议无效、被撤销或解除）或自能够进行不动产登记之日起90日内未申请登记的，预告登记失效。\u0002\nA✗ 预告登记所保障的债权依法可由继承人或继受主体承继，权利人死亡或终止本身不当然导致预告登记失效。\nB✓ 买卖协议被撤销后债权溯及消灭，失却预告登记所担保之本权基础，预告登记随之失效。\nC✓ 买卖协议被认定无效则基础债权自始不存在，预告登记失效。\nD✓ 自能够进行不动产登记之日起90日内权利人怠于申请正式登记的，预告登记依法失效。","k":"","kb":119,"kh":[[486,536]]},{"id":"2024-48","y":2024,"t":"多","s":"甲坐高铁时不小心误拿了邻座乙的背包，通过背包里面的名片打电话给乙要归还背包，甲在返还的途中，因为车厢拥挤，背包被偷。下列说法正确的有（ ）。","o":["甲对背包属于直接占有","甲拿乙的背包不属于侵权行为","甲的行为属于无因管理","甲对背包被偷没有重大过失,不需要承担责任"],"a":"ABD","e":"\u0001高铁误拿邻座背包并非侵权，主动送还系履行法定返还义务而非无因管理；途中遭窃若无重大过失则免赔。\u0002\nA✓ 甲实际拿起并携带该背包在身边，在占有人分类上属于直接占有（且为善意无权占有）。\nB✓ “不小心误拿”欠缺过错侵权主观要件，不构成侵权行为。\nC✗ 甲因错误取得背包在先而产生向失主返还原物（占有物/不当得利返还）的法定义务，通知归还系在清偿自身法定义务，不成立无因管理。\nD✓ 参照善意占有人或无偿保管返还义务规则，甲在车厢拥挤状态下正常送还途中遇盗并无故意或重大过失，无须承担丢失赔偿责任。","k":"","kb":120,"kh":[[338,401]]},{"id":"2025-50","y":2025,"t":"多","s":"A 公司获得某地块的建设用地使用权,已建造一栋楼房。后该地块被当地政府提前收回用于建设高铁站。对此,下列说法正确的有（ ）。","o":["提前收回该地块后应当对A 公司建造的楼房给予补偿","A 公司丧失建设用地使用权系非基于法律行为的物权变动","提前收回该地块后应当对A 公司可预见的利益损失给予赔偿","提前收回该地块后应当退还A 公司建设用地使用权剩余期限的出让金"],"a":"ABD","e":"\u0001因公共利益提前收回建设用地使用权属于非基于法律行为的物权变动，应当对地上建造楼房给予补偿并退还剩余期限出让金。\u0002\nA✓ 依《民法典》第358条及第243条，提前收回该土地的，应当对该土地上的房屋以及其他不动产给予公平合理补偿。\nB✓ 政府基于公共利益征收/提前收回土地属于国家公权力决定的非基于法律行为的物权变动。\nC✗ 政府依公法合法收回土地适用《民法典》的“补偿”标准（按房屋及不动产价值补偿并退还出让金），而非违法违约责任下的“赔偿预期可得利益损失”。\nD✓ 依《民法典》第358条，提前收回建设用地使用权的应当退还建设用地使用权人相应的（剩余期限）出让金。","k":"","kb":121,"kh":[[278,329]]},{"id":"2026-34","y":2026,"t":"单","s":"下列情形中,办理登记才能完成所有权转移的是","o":["甲的父亲在生前所立遗嘱中载明房屋由甲继承","乙起诉与配偶离婚,法院判决夫妻共同房屋归乙所有","丙的伯父因丙考上大学奖励其一套房屋","丁依法取得宅基地使用权后,在土地上自行建造一套房屋"],"a":"C","e":"\u0001因赠与这一民事法律行为移转房屋所有权的，须办理不动产过户登记方完成所有权转移；遗嘱继承、法院判决、合法建房均无需登记直接取得。\u0002\nA✗ 遗嘱继承属于非基于法律行为的物权变动，自被继承人死亡、继承开始时甲即取得房屋所有权。\nB✗ 离婚诉讼中人民法院分割共有房产的生效形成判决一经生效，乙即直接取得所有权。\nC✓ 伯父对丙的房屋赠与属于基于民事法律行为的不动产变动，依《民法典》第209条必须办理过户登记才转移房屋所有权。\nD✗ 合法建造房屋属于事实行为，丁自建造完成时即原始取得房屋所有权，无需先行登记。","k":"","kb":119,"kh":[[40,57],[324,378]]}]},{"sub":"民法","name":"担保物权","w":1.8,"L":34,"qs":[{"id":"2005-43","y":2005,"t":"单","s":"下列合同中,当事人不能行使留置权的是（ ）。","o":["借款合同","运输合同","承揽合同","行纪合同"],"a":"A","e":"\u0001留置权须债权人基于合法关系占有债务人动产且与债权同属一法律关系；借款合同不以债权人占有标的物为内容，无法行使留置权。\u0002\nA✓ 单纯消费借款合同仅移转金钱所有权给借款人，出借人一般并不合法占有债务人其他可留置动产，不存在法定留置权基础。\nB✗ 《民法典》第836条规定托运人或收货人不付运费保管费时，承运人对相应运输货物享有留置权。\nC✗ 《民法典》第783条规定定作人未向承揽人支付报酬或者材料费价款的，承揽人对完成的工作成果享有留置权。\nD✗ 《民法典》第959条规定行纪人完成或者部分完成委托事务而委托人不按约支付报酬的，行纪人对委托物享有留置权。","k":"","kb":128,"kh":[[95,146]]},{"id":"2005-49","y":2005,"t":"单","s":"下列选项中,可以质押的是（ ）。","o":["动产和智力成果","动产和权利","智力成果和权利","人身利益和权利"],"a":"B","e":"\u0001质权标的可为动产和依法可转让的财产权利；智力成果本身系无形思想客体不能直接出质，仅其对应财产权可设权利质权。\u0002\nA✗ “智力成果”本身（如技术方案、作品思想本身）不同于注册商标专用权、专利权和著作权中的财产权利，不能直接设定质权。\nB✓ 依《民法典》第425、440条，质权包括动产质权与权利质权，其法定客体正是动产和可转让的财产权利。\nC✗ 智力成果客观形态并非法律允许出质的财产权本身。\nD✗ 生命、健康、姓名、肖像等人身利益具有专属性且不得转让变价，不可用来出质担保。","k":"","kb":125,"kh":[[209,244]]},{"id":"2006-31","y":2006,"t":"单","s":"担保物权人在其全部债权受清偿前,可以就担保物的全部行使权利,这体现的是担保物权法律属性中的（ ）。","o":["变价受偿性","物上代位性","不可分性","从属性"],"a":"C","e":"\u0001担保物权的不可分性指担保物权的每一部分担保债权的全部，在全部债权受清偿前，担保权人得就担保物之全部行使权利。\u0002\nA✗ 变价受偿性侧重通过折价、拍卖、变卖实现担保物交换价值，非题干所强调“未全清偿前就全部标的物主张”。\nB✗ 物上代位性指担保物毁损灭失后其效力及于保险金、赔偿金或补偿金。\nC✓ 即使债务人已偿还部分借款或担保物发生分割，在全部本息获全额清偿之前，债权人仍可对整个完整担保物主张优先受偿权，即不可分性。\nD✗ 从属性强调担保物权依附于主债权的成立、移转与消灭命运。","k":"","kb":125,"kh":[[114,139]]},{"id":"2006-44","y":2006,"t":"单","s":"根据我国担保法规定,担保物权包括（ ）。","o":["抵押权、质权和典权","抵押权、质权和留置权","抵押权、质权、典权和留置权","抵押权、典权和留置权"],"a":"B","e":"\u0001我国法律明文规定的三类法定担保物权是抵押权、质权和留置权；典权属于用益物权。\u0002\nA✗ 典权是以使用收益不动产为目的的用益物权，且漏列了法定担保物权留置权。\nB✓ 抵押权、质权（意定担保物权）与留置权（法定担保物权）合称我国三大法定担保物权。\nC✗ 典权不属于担保物权。\nD✗ 漏列了质权并混入了典权。","k":"","kb":125,"kh":[[57,83]]},{"id":"2006-55","y":2006,"t":"多","s":"下列权利中,其客体可以是动产的是（ ）。","o":["所有权","抵押权","质权","留置权"],"a":"ABCD","e":"\u0001所有权、抵押权、质权和留置权的客体均可以是动产。\u0002\nA✓ 所有权客体包括动产和不动产。\nB✓ 抵押权客体既可以是动产（设备、车辆等），也可以是不动产或权利。\nC✓ 质权包括动产质权与权利质权，动产是核心质押物。\nD✓ 留置权更是只能设定于债权人占有的债务人动产之上。","k":"","kb":125,"kh":[[163,181],[209,224],[258,282]]},{"id":"2007-33","y":2007,"t":"单","s":"下列权利中,其客体既可以是动产,也可以是不动产的是 （ ）。","o":["地上权","抵押权","相邻权","典权"],"a":"B","e":"\u0001在地上权、抵押权、相邻权和典权四者中，只有抵押权的客体既可以是动产（如汽车机器），也可以是不动产（如房屋建设用地）。\u0002\nA✗ 地上权专以他人土地等不动产为客体。\nB✓ 依《民法典》第395条，抵押权既可以设定在房屋、建设用地使用权等不动产上，也可设定于生产设备、交通工具等动产上。\nC✗ 相邻权仅发生于相互毗邻的不动产之间，不涉动产。\nD✗ 典权是以不动产占有使用收益为内容的传统用益物权。","k":"","kb":125,"kh":[[163,181]]},{"id":"2007-38","y":2007,"t":"单","s":"根据担保法规定,下列财产中,不得抵押的是 （ ）。","o":["乡办企业的厂房","国有企业的机器设备","学校的教学楼","私营企业的交通运输工具"],"a":"C","e":"\u0001学校教学楼属于以公益为目的的非营利教育设施，依法不得用于抵押担保。\u0002\nA✗ 企业依法有权处分的厂房可以设立不动产抵押（注意乡镇企业建设用地随厂房一并抵押）。\nB✗ 国有企业享有处分权的生产机器设备依法可以抵押。\nC✓ 依《民法典》第399条第3项（原《担保法》第37条），学校的教学楼属公益教育设施，不得抵押。\nD✗ 私营企业依法所有的车辆等交通运输工具可以设定动产抵押。\n【新法提示】现行《民法典》第399条第3项精简完善为“学校、幼儿园、医疗机构等为公益目的成立的非营利法人的教育设施、医疗卫生设施和其他公益设施”不得抵押（民办营利性教育机构的设施可依法抵押）。","k":"","kb":126,"kh":[[94,146]]},{"id":"2007-39","y":2007,"t":"单","s":"画家甲为办画展向朋友乙借款 5 万元,并将自己的一幅画交给乙作担保,要求其妥善保管。双方约定 1 年内甲还款取画,否则该画即归乙所有。现乙对该画 （ ）。","o":["享有权利质权","享有动产质权","不享有任何权利","享有留置权"],"a":"B","e":"\u0001甲将动产画作移交乙占有以担保5万元借款，虽约定逾期未还则归乙所有（该流质条款无效），但动产质权已依法成立有效。\u0002\nA✗ 画作是有体动产，移交画作原件占有设定的是动产质权而非权利质权。\nB✓ 甲与乙达成担保合意并将该画作交付给乙占有，已具备动产质权全部成立要件；双方关于“到期不还画归乙”的流质条款无效（依第428条仅流质条款无效且只生优先受偿效力，不影响质权有效设立）。\nC✗ 流质约定无效并不导致整个质押合同或动产质权归于无效。\nD✗ 乙因双方质押合同主动移交取得画作占有，非依法定事由产生留置权（且债权与画作不属修画/保管同一业务债权）。","k":"","kb":127,"kh":[[56,73],[120,149]]},{"id":"2007-40","y":2007,"t":"单","s":"甲因购房向乙借款 10 万元,由合伙企业丙担任保证人,并约定由甲以小提琴质押给乙,但甲并未将小提琴交给乙。则 （ ）。","o":["保证与质押均成立","保证与质押均不成立","保证不成立,质押成立","保证成立,质押不成立"],"a":"D","e":"\u0001普通合伙企业可以依法担任保证人故保证成立；但质押小提琴未完成实物交付，动产质权不成立（即质押未生效设立）。\u0002\nA✗ 小提琴尚未移交债权人乙占有，动产质权未设立。\nB✗ 合伙企业作为普通民事商事主体（非机关或公益单位），依法可以担任保证人，保证成立。\nC✗ 保证成立与质押未设立正好说反了。\nD✓ 合伙企业丙与乙达成保证合意即成立保证关系；而甲未将小提琴交付给乙占有，依“质权自交付时设立”规则，动产质权不成立。","k":"","kb":127,"kh":[[56,83]]},{"id":"2008-32","y":2008,"t":"单","s":"下列权利中,其客体既可以是动产也可以是权利的是（ ）。","o":["所有权","抵押权","地役权","留置权"],"a":"B","e":"\u0001抵押权客体既可以是动产（生产设备、车辆），也可以是不动产用益权利（建设用地使用权、海域使用权等）。\u0002\nA✗ 所有权的客体主要是有体物（动产、不动产），原则上不包括财产权利。\nB✓ 依据《民法典》第395条，抵押权既可设立在机器汽车等动产上，也可以设立在建设用地使用权、海域使用权或土地经营权等财产权利上。\nC✗ 地役权是不动产用益物权，只能设定于他人不动产之上，不可设定于动产或一般权利。\nD✗ 留置权客体只能是动产，既不包括不动产也不包括权利。","k":"","kb":125,"kh":[[163,208],[258,289]]},{"id":"2008-41","y":2008,"t":"单","s":"甲到乙处修理汽车,由于所携带的钱款不足,将自己的名贵手表留于乙处,双方商定甲次日付款取表。则乙对甲的手表享有（ ）。","o":["留置权","质权","抵押权","所有权"],"a":"B","e":"\u0001修车钱款不足主动将名表留予修理人乙作为次日付款担保，该手表与修车费债权非同一法律关系，属意定设立的动产质权而非留置权。\u0002\nA✗ 自然人之间的留置权严格要求债权人占有的动产“与债权属于同一法律关系”；本案被维修的标的物是汽车而非名贵手表，名表是甲另行交予担保付款的质物，不成立留置权。\nB✓ 甲因付款不足另行合意将名表交付乙占有作为担保，具备质押合意和动产交付要件，乙依法对名表享有动产质权。\nC✗ 抵押权不转移担保物占有；手表已交乙占有控制。\nD✗ 甲仅交付手表作担保，未将名表所有权让渡给乙。","k":"","kb":127,"kh":[[211,270]]},{"id":"2009-40","y":2009,"t":"单","s":"2007 年 5 月 10 日,甲用自己的一台汽车作抵押,向朋友乙借款 7 万元,并进行了抵押登记。6 月 1 日, 甲又将该汽车抵押给银行,从银行借款 8 万元,也进行了抵押登记。现两笔债务均过履行期,甲均未清偿。乙和银行对甲的汽车都主张优先受偿权。经拍卖,该汽车卖得 13 万元。根据物权法规定,对此款项的受偿应该是（ ）。","o":["乙优先受偿","银行优先受偿","乙与银行按比例受偿","乙与银行平均受偿"],"a":"A","e":"\u0001同一汽车先后抵押给乙和银行且均办理登记的，按照登记时间先后清偿；乙登记在先（5月10日），有权在7万元债权范围内最先全部受偿。\u0002\nA✓ 依《民法典》第414条第1款第1项，抵押权已登记的，按照登记的时间先后确定清偿顺序。乙先于5月10日登记，先由乙优先拿走7万元，其余6万元归银行。\nB✗ 银行于6月1日才办理登记，顺位劣后于乙。\nC✗ 均未登记时才按债权比例清偿；均已登记严格按登记先后顺位全额受偿后剩余部分归后手。\nD✗ 登记担保物权排斥平均分配规则。","k":"","kb":126,"kh":[[548,570]]},{"id":"2010-39","y":2010,"t":"单","s":"下列合同中当事人可以行使留置权的是（ ）。","o":["行纪合同","买卖合同","租赁合同","委托合同"],"a":"A","e":"\u0001行纪合同中委托人不按约支付报酬的，行纪人对委托物依法享有留置权；买卖、租赁、委托（无特别法定留置列举）通常不当然产生法定留置。\u0002\nA✓ 《民法典》第959条（原《合同法》第422条）明确赋予行纪人以法定留置权。\nB✗ 买卖合同中出卖人尚未交付时行同时履行抗辩或拒绝交货，已交付则丧失占有且通常不设留置权制度。\nC✗ 租赁合同系出租人交付租赁物供承租人使用，承租人欠租时出租人可直接解约收房或依另行规定扣留搬迁，并非法定典型留置关系。\nD✗ 有偿委托下受托人虽可就费用追偿，但现行及旧法典并未直接像承揽/运输/保管/仓储/行纪那样对委托合同直接广泛授予典型留置权（一般按无因或普通债权处理）。","k":"","kb":128,"kh":[[95,117]]},{"id":"2011-26","y":2011,"t":"单","s":"根据《物权法》的规定,下列财产中,可以抵押的是（ ）。","o":["正在建造的船舶","宅基地使用权","被查封的财产","集体土地所有权"],"a":"A","e":"\u0001正在建造的船舶属于法定可抵押财产；宅基地使用权（除法定例外）、被查封财产、集体土地所有权均依法禁止抵押。\u0002\nA✓ 依《民法典》第395条第1款第5项，正在建造的建筑物、船舶、航空器依法可以设立抵押。\nB✗ 宅基地使用权除法律另有规定外，不得单独抵押。\nC✗ 依法被查封、扣押、监管的财产处于公法限制处分状态，不得抵押。\nD✗ 土地所有权（包括国家与集体所有权）一律严禁抵押。","k":"","kb":126,"kh":[[60,70],[94,125],[156,170]]},{"id":"2012-28","y":2012,"t":"单","s":"冯某将其所有的大卡车送至通达汽车修理厂修理。因冯某未依约定支付修理费,修理厂遂依法将该车留置,但未与冯某约定留置汽车后支付修理费的期间。根据物权法的规定,修理厂在实现其留置权前应当给冯某支付修理费的期间为（ ）。","o":["1个月以上","2个月以上","3个月以上","6个月以上"],"a":"B","e":"\u0001留置权人与债务人未约定留置财产后的履行宽限期时，依法应当给予债务人不少于2个月（60日以上）的履行期。\u0002\nA✗ 法条规定为“2个月以上”（《物权法》第236条及《民法典》第453条现精准表述为“六十日以上”，2个月即对应原《物权法》条文标准）。\nB✓ 依据命题当时适用的《物权法》第236条（现《民法典》第453条改表述为“六十日以上”），修理厂应当给冯某2个月以上的支付修理费宽限期间（鲜活易腐物除外）。\nC✗ 3个月不是法定最低宽限期限。\nD✗ 6个月过长，不符合法定两个月以上标准。\n【新法提示】现行《民法典》第453条将原《物权法》的“两个月以上”微调表述为“六十日以上”，实质均约两个月宽限期。","k":"","kb":128,"kh":[[316,372]]},{"id":"2013-29","y":2013,"t":"单","s":"甲以房屋作抵押向乙借款,并办理了抵押登记。后甲未按期归还借款,且未与乙就如何实现抵押权达成协议。根据我国物权法规定（ ）。","o":["乙有权直接取得房屋的所有权","乙有权直接变卖房屋以实现抵押权","乙只能委托拍卖公司拍卖房屋以实现抵押权","乙可以请求人民法院拍卖、变卖房屋以实现抵押权"],"a":"D","e":"\u0001抵押权实现时未就折价或拍卖协议达成一致的，抵押权人不得直接强占所有权或私自变卖，有权请求人民法院拍卖、变卖抵押财产。\u0002\nA✗ 债务到期未受清偿时，抵押权人未经协商折价协议不得直接把抵押房占归己有（禁止流押）。\nB✗ 未经协商一致，抵押权人个人无权擅自私下变卖抵押物。\nC✗ 请求人民法院拍卖、变卖并非只能委托民间拍卖公司，应当通过法院非讼/执行程序拍卖或变卖。\nD✓ 依《民法典》第410条第2款，抵押权人与抵押人未就抵押权实现方式达成协议的，抵押权人可以请求人民法院拍卖、变卖抵押财产。","k":"","kb":126,"kh":[[526,546]]},{"id":"2013-48","y":2013,"t":"多","s":"甲因借款与乙签订房屋抵押合同,未办理抵押登记。其后甲又因借款将该房屋抵押给丙并办理了抵押登记。现甲不能偿还对乙、丙的欠款。根据我国民法相关规定（ ）。","o":["甲、乙之间的抵押合同成立","甲、丙之间的抵押合同成立","乙享有抵押权","丙享有抵押权"],"a":"ABD","e":"\u0001房屋抵押合同自双方达成合意即成立（并生效），与抵押权是否登记设立相区分；未登记的乙不享有抵押权，已登记的丙享有抵押权。\u0002\nA✓ 甲与乙签订房屋抵押合同意思表示真实一致，合同依法成立且有效（区分原则）。\nB✓ 甲与丙签订房屋抵押合同同样依法成立有效。\nC✗ 不动产抵押权自登记时设立，乙未办理抵押登记，仅享有有效的抵押合同债权请求权而尚未取得抵押物权。\nD✓ 丙已依法办理了不动产抵押登记，依法正式取得该房屋的抵押权。","k":"","kb":126,"kh":[[374,411]]},{"id":"2014-39","y":2014,"t":"单","s":"下列选项中,属于法定物权的是（ ）。","o":["留置权","地役权","权利质权","宅基地使用权"],"a":"A","e":"\u0001留置权直接基于法律规定要件成就而产生，不以当事人订立担保合同为前提，属于法定担保物权。\u0002\nA✓ 留置权是三大担保物权中唯一的法定担保物权，只要符合合法占有同一法律关系动产且债务到期未履行等法定条件即当然成立。\nB✗ 地役权基于双方书面地役权合同意定设立，属于意定用益物权。\nC✗ 权利质权通过质押合同及登记/交付权利凭证意定设立。\nD✗ 宅基地使用权须经申请审批登记取得，非题干针对担保/物权分类所指传统典型法定担保物权。","k":"","kb":128,"kh":[[45,56]]},{"id":"2015-39","y":2015,"t":"单","s":"甲向乙银行贷款,以其别墅设定抵押。之后, 甲在别墅院内建造了独立车库。贷款到期,甲无力偿还。乙银行享有优先受偿权的财产（ ）。","o":["仅限于别墅","包括别墅、车库","包括别墅、建设用地使用权","包括别墅、车库及建设用地使用权"],"a":"C","e":"\u0001以建筑物抵押的，占用范围内建设用地使用权一并抵押；但抵押后院内新增独立建筑物（独立车库）不属于抵押财产。\u0002\nA✗ 依据“房地一体”原则，抵押别墅时该别墅占用范围内的建设用地使用权视为一并抵押，不仅限于别墅本身。\nB✗ 抵押登记后新建的独立车库属于新增建筑物，依法不属于原有的抵押财产，乙银行对车库拍卖价款无优先受偿权。\nC✓ 依《民法典》第397条和第417条，乙银行对原别墅及其占用范围内的建设用地使用权享有优先受偿权（实现抵押权时虽需将新增独立车库一并处分，但银行无权就车库变价部分优先受偿）。\nD✗ 新建独立车库并非抵押财产范围，优先受偿范围不含车库自身价值。","k":"","kb":126,"kh":[[250,345]]},{"id":"2016-32","y":2016,"t":"单","s":"甲向乙借款5万元,以自己的汽车作抵押并办理了抵押登记。抵押期间,丙向甲表示愿意购买该车。根据我国《物权法》,下列选项正确的是（ ）。","o":["甲通知乙后即有权转让该车","甲告知丙后即有权转让该车","甲征得乙同意后有权转让该车","甲在任何情况下均无权转让该车"],"a":"C","e":"\u0001依据2016年题干适用的原《物权法》第191条，抵押期间抵押人转让已抵押汽车原则上应当征得抵押权人乙同意。\u0002\nA✗ 原《物权法》第191条要求经抵押权人“同意”（而《民法典》第406条新规则改为允许转让并“及时通知”抵押权人，两者立法规则有重大转折）。\nB✗ 告知买受人丙并不足以在原《物权法》下豁免征得抵押权人乙同意的限制。\nC✓ 依据题干明确指明的《物权法》第191条，抵押期间甲征得抵押权人乙同意后方有权转让该抵押汽车。\nD✗ 并非绝对无权转让，经抵押权人同意或由受让人代偿消灭抵押权均可转让。\n【新法提示】现行《民法典》第406条已废除原《物权法》的同意限制：抵押期间，抵押人无需征得抵押权人同意即可转让抵押财产（另有约定的除外），只需及时通知抵押权人，且抵押权不受影响。","k":"","kb":126,"kh":[[590,643]]},{"id":"2017-26","y":2017,"t":"单","s":"甲将一批货物存放在乙的仓库,之后丙因甲拖欠其15万元货款,强行将该批货物拉走抵债。对此,下列说法正确的是（ ）。","o":["丙的行为属于自助行为","丙的行为属于行使留置权","乙请求丙返还货物的权利存续期间为1年","甲请求丙返还货物的权利存续期间为2年"],"a":"C","e":"\u0001丙强行抢走乙仓库中货物既非自助也不构成留置权；乙作为直接占有人有权在侵夺发生之日起1年内行使占有返还请求权。\u0002\nA✗ 因15万货款纠纷有充足公力诉讼仲裁途径可救济，不符合自助行为“情况紧迫且来不及请求国家机关保护”的前提。\nB✗ 留置权须债权人原本已“合法占有”债务人动产；丙系强行抢拉而非合法先占。\nC✓ 依《民法典》第462条，乙作为仓库合法直接占有人，其请求侵夺人丙返还占有的占有保护请求权存续期间（除斥期间）为自侵夺发生之日起1年。\nD✗ 1年除斥期间针对占有返还请求权；原所有权人甲基于所有权的返还原物请求权适用物权返还及诉讼时效规则，并无“2年存续期间”规定。","k":"","kb":128,"kh":[[468,515]]},{"id":"2017-28","y":2017,"t":"单","s":"甲为担保对乙的债务,于2015年3月1日与乙签订质押合同,承诺将自己的越野车质押给乙。同年4月1日甲交付越野车,但未将随车工具箱交付给乙。对此,下列说法正确的是（ ）。","o":["乙于3月1日取得质权","乙对随车工具箱享有质权","质押合同于3月1日生效","质押合同于4月1日成立"],"a":"C","e":"\u0001质押合同系诺成合同于3月1日签字即生效，而质权于4月1日交付越野车时设立（未交付的工具箱不在质权效力范围内）。\u0002\nA✗ 3月1日仅签订质押合同尚未移交车辆占有，此时质权尚未设立。\nB✗ 质权设立以移转占有为准，随车工具箱未交付给乙占有，乙不对工具箱享有质权。\nC✓ 依《民法典》第427、429条及合同编规则，质押合同自3月1日双方合意订立时成立并生效，与质权4月1日交付设立相互区分。\nD✗ 质押合同并非实践合同，3月1日签定合同之时即已成立，4月1日交付是质权的“设立时间”而非合同“成立时间”。","k":"","kb":127,"kh":[[40,97]]},{"id":"2018-40","y":2018,"t":"单","s":"【案情】甲与金科公司约定，甲委托金科公司为自己提供出借人的相关信息，甲在与出借人订立借款合同后向金科公司支付报酬。后根据金科公司提供的信息，甲从创富公司借款36万元并以其房产设定抵押，但一直未办理抵押登记手续。\n甲与创富公司之间签订的房产抵押合同 （ ）。","o":["有效","可撤销","效力待定","无效"],"a":"A","e":"\u0001基于区分原则，未办理抵押登记仅导致房屋抵押权未设立，并不影响甲与创富公司之间书面房产抵押合同本身的法律效力。\u0002\nA✓ 甲与创富公司主体适格、意思表示真实且内容合法，房产抵押合同有效；未办抵押登记仅产生不设立物权（对方可主张违约配合或担保责任）的后果。\nB✗ 未办理抵押登记不构成欺诈、胁迫或重大误解等可撤销事由。\nC✗ 不动产登记与否不决定合同效力待定。\nD✗ 不能因未办理物权登记而否定已依法达成的担保合同本身的效力。","k":"","kb":126,"kh":[[374,411]]},{"id":"2019-49","y":2019,"t":"多","s":"甲公司分期支付乙公司货款,可用于甲公司向乙公司提供担保的财产有（ ）。","o":["甲公司的职工班车","甲公司持有的丙公司股权","甲公司效益最好的分公司的厂房","甲公司与相邻丁公司存在争议的货场使用权"],"a":"ABC","e":"\u0001企业职工班车、持有的他公司股权及分公司合法厂房均可用来设抵押或股权质押；与邻居存在争议的货场使用权依法禁止抵押。\u0002\nA✓ 公司名下职工班车属于合法所有的交通运输工具，可以设立动产抵押。\nB✓ 持有的其他有限责任公司/股份公司股权可依《民法典》第440条出质设立权利质权。\nC✓ 分公司不具备独立法人资格，其名下厂房实归总公司甲公司所有且有处分权，甲公司可将其用于抵押担保。\nD✗ 依《民法典》第399条第4项，所有权、使用权不明或者有争议的财产不得抵押。","k":"","kb":126,"kh":[[60,86],[147,155]]},{"id":"2020-30","y":2020,"t":"单","s":"甲向乙借款100万元。为担保乙的债权,甲以一套价值50万元的房屋作抵押,丙以一套价值50 万元的房屋作抵押,丁提供保证。现甲不能偿还到期债务。对此,下列说法正确的是（ ）。","o":["乙应当先就甲的房屋实现抵押权","乙应当先就丙的房屋实现抵押权","乙应当先请求丁承担保证责任","乙可以同时请求甲、丙、丁承担按份担保责任"],"a":"A","e":"\u0001混合担保中无约定且债务人甲自己提供房屋抵押，又有第三人丙物保与丁保证时，债权人乙应当先就债务人甲的房屋实现抵押权。\u0002\nA✓ 依《民法典》第392条，无特别约定时，债务人甲自己提供房屋抵押的，债权人乙必须先就甲自己的房屋拍卖变卖受偿，不足部分方可向第三人物保人丙或保证人丁追索。\nB✗ 必须先行处置债务人自己提供的担保物，不能跳过债务人直接优先拍卖第三人丙的房屋。\nC✗ 存在债务人自身物保时，普通保证人丁同样享有让债权人先就甲房屋受偿的抗辩利益。\nD✗ 法律规定了债务人自物保优先受偿原则，且第三人担保彼此无特别约定时并非无顺位混同均摊。","k":"","kb":125,"kh":[[309,379]]},{"id":"2020-35","y":2020,"t":"单","s":"甲向乙借款,将自己的汽车抵押给乙,办理了抵押登记。后甲又向丙借款,将该车质押给丙。丙在占有该车期间,发现汽车有故障,送到丁厂修理。丁厂因未收到修理费将该车留置。本案的担保物权受偿顺序是（ ）。","o":["抵押权;质权;留置权","质权;留置权;抵押权","留置权;抵押权;质权","留置权;质权;抵押权"],"a":"C","e":"\u0001同一汽车先登记抵押给乙，再交付质押给丙，最后因修车被丁厂合法留置；留置权永远最先受偿，已登记抵押权早于后交付质权，故顺序为留置权、抵押权、质权。\u0002\nA✗ 虽然抵押权登记在质权交付前，但最后合法产生的法定留置权优于一切在先的抵押权与质权。\nB✗ 本案抵押登记在先、质权交付在后，且留置权最优先，顺序全乱。\nC✓ 依《民法典》第456条“留置权优先于同一动产上的抵押权和质权”及第415条“抵押权与质权按登记、交付时间先后受偿”，本案顺序为：留置权（丁）＞抵押权（乙，登记在先）＞质权（丙，交付在后）。\nD✗ 抵押权与质权竞合以登记与交付时间先后定序，题干先办理了乙的抵押登记，后才质押交付给丙，故乙优先于丙。","k":"","kb":128,"kh":[[394,450]]},{"id":"2022-24","y":2022,"t":"单","s":"X银行、Y公司、Z公司三方约定∶X银行贷款给Y公司，Y公司以存放在港口仓库中的1000吨某型号钢材提供质押，X银行委托Z公司监管。合同签订后，Z公司派员工入驻钢材仓储地控制钢材。本案中，质权的设立时间为（ ）。","o":["三方协议生效之日","X银行放贷之日","Z公司实际控制钢材之日","港口仓库收到三方协议之日"],"a":"C","e":"\u0001动产质权自出质人交付质押财产时设立；委托第三方Z公司监管钢材的，质权于监管人Z公司实际控制该批钢材之日设立。\u0002\nA✗ 三方签订书面质押监管协议仅产生债法约束力，尚未完成质物占有移转。\nB✗ 贷款发放时间不影响质押财产交付及质权设立的时间判断（注意区分主债权产生与物权交付）。\nC✓ 依《民法典》第429条及担保制度解释第55条，债权人委托第三方监管质物的，自监管人Z公司派员实际控制该1000吨钢材之时完成交付，质权正式设立。\nD✗ 仅由仓库收文而不实际移转控制权尚不足以完成质物占有控制交付。","k":"","kb":127,"kh":[[98,119]]},{"id":"2023-25","y":2023,"t":"单","s":"甲将汽车抵押给乙，向乙借款50万元，约定抵押期间甲不得转让汽车。双方在办理抵押登记时，未将禁止转让汽车的约定予以登记。后甲将汽车卖给不知情的丙并交付。对此，乙有权（ ）。","o":["请求甲承担违约责任","主张丙未取得汽车所有权","请求丙承担侵权责任","请求确认甲与丙之间的买卖合同无效"],"a":"A","e":"\u0001当事人约定禁止转让抵押财产但未办理该约定的登记，不能对抗善意第三人；不知情买受人丙交付取得汽车所有权，乙只能请求甲承担违约责任。\u0002\nA✓ 依《民法典》第406条及担保制度解释第43条，未将禁止转让抵押物的约定办理登记的，不得对抗善意买受人；甲违约擅自出卖，乙仅有权向甲追究违约责任。\nB✗ 未登记禁转约定不发生对抗第三人效力，不知情的丙购买并受交付后已合法取得汽车所有权（且乙的抵押权可依物上追及或对应规则处理）。\nC✗ 丙基于正常买卖合同购买并受让交付且不知禁转约定，对乙不构成侵权。\nD✗ 未登记的禁止转让约定不影响甲与丙之间买卖合同的有效性。","k":"","kb":126,"kh":[[644,691]]},{"id":"2023-46","y":2023,"t":"多","s":"某公司向银行借款,以其现有的以及将有的原材料、半成品、产品抵押,并办理了抵押登记。银行依约向该公司发放了贷款。对此,下列选项正确的有","o":["公司未按期还款时,抵押财产确定","银行的抵押权从办理抵押登记之日起设立","银行的抵押权不得对抗正常经营活动中已支付合理价款并取得抵押财产的买受人","银行的抵押权不得对抗抵押登记后已支付合理租金并占有抵押财产的承租人"],"a":"AC","e":"\u0001动产浮动抵押自抵押合同生效时设立（非登记时）；债务人不按期还款时抵押财产确定；抵押权不得对抗正常经营活动中付款取得抵押物的买受人。\u0002\nA✓ 依《民法典》第411条第1项，债务履行期限届满债权未实现的，浮动抵押财产确定。\nB✗ 依《民法典》第403条，以动产抵押（含浮动抵押）的，抵押权自抵押合同生效时设立，未经登记仅不得对抗善意第三人。\nC✓ 依《民法典》第404条，以动产抵押的，不论是否登记，均不得对抗正常经营活动中已经支付合理价款并取得抵押财产的买受人。\nD✗ 《民法典》第404条“正常经营活动买受人”规则仅保护“买受人”，先押后租（抵押登记后承租）的承租人不能对抗已登记抵押权。","k":"","kb":126,"kh":[[413,524]]},{"id":"2024-40","y":2024,"t":"单","s":"甲把一块手表给乙保管,乙擅自将手表质押给丙,向丙借款2万元,丙在乙未同意的情况下质押给知情人债权人丁,用来担保自己的1万元货款,现上述债务均已到期,下列正确的是（ ）。","o":["只有丙有质权","丙、丁享有质权,丙质权优先","丙、丁均不享有质权","丙丁享有质权,丁质权优先"],"a":"A","e":"\u0001保管人乙擅自出质给不知情丙使丙善意取得动产质权；丙未经乙同意擅自转质给知情的丁，既非有效承诺转质亦不构成善意取得，故仅丙享有质权。\u0002\nA✓ 乙合法持有委托保管手表并无权出质给不知情丙且交付，丙依法善意取得动产质权；丙擅自转质给知情人丁（未经同意的责任转质不生新质权效力且丁非善意），因此丁不享质权，只有丙享有质权。\nB✗ 丙未经出质人（乙及原所有权人）同意擅自转质给知情第三人丁，丁无法成立有效质权或善意取得质权。\nC✗ 乙虽无权处分，但丙为善意受让人且已完成交付并放款，依据动产质权善意取得规则，丙已合法取得质权。\nD✗ 丁根本未有效取得质权，更谈不上优先于丙。","k":"","kb":127,"kh":[[291,375]]},{"id":"2024-46","y":2024,"t":"多","s":"甲向银行贷款,银行要求甲提供担保,甲现在对土地拥有土地承包经营权,对A公司拥有货物债权,甲还出版了一批畅销书籍,对一套房屋拥有所有权(现已被查封),甲可以设立担保物权的有（ ）。","o":["土地经营权","债权","房屋","著作权中的财产性权利"],"a":"ABD","e":"\u0001土地经营权、应收账款等债权、著作权中的财产性权利均可依法设立担保物权；已被依法查封的房屋严禁抵押。\u0002\nA✓ 流转取得或依法可融资的土地经营权依法可以设立抵押等担保物权。\nB✓ 依《民法典》第440条，合法的金钱债权（应收账款等）可以设定权利质权。\nC✗ 依《民法典》第399条第5项，依法被查封、扣押、监管的财产严禁设定抵押。\nD✓ 依《民法典》第440条第5项，知识产权中的著作权财产权可依法出质。","k":"","kb":126,"kh":[[60,93],[156,170]]},{"id":"2024-49","y":2024,"t":"多","s":"甲将其汽车借给乙,乙在开车时将车门撞坏,在丙处进行维修,乙未支付修车费而离去。丙将该汽车留置。下列说法正确的有（ ）。","o":["维修厂丙有权留置该汽车","甲可以代为支付维修费","甲有权要求乙归还车辆","甲有权要求丙归还车辆"],"a":"AB","e":"\u0001乙将借来的汽车送丙修理未付修车费，不知情修理厂丙可善意行使留置权；车主甲可代偿修车费取车，但现下不得无偿要求乙或丙直接还车。\u0002\nA✓ 修理厂丙合法占有该汽车修理且不知乙非车主，修车费与修车形成同一法律关系，丙依法善意成立留置权，有权留置汽车。\nB✓ 甲作为车辆所有权人及利害关系人，有权主动代乙向丙清偿修理费以消灭留置权取回车辆（后可再向乙追偿）。\nC✗ 车辆目前在修理厂丙处被合法留置占有，乙已丧失实际占有且客观无法直接取回交付（借期亦未交代届满），甲现下无法直接从乙处实取返还。\nD✗ 丙对该汽车享有合法有效留置权，在修车费清偿前甲无权直接跳过留置权要求丙无条件返还车辆。","k":"","kb":128,"kh":[[212,299]]},{"id":"2025-24","y":2025,"t":"单","s":"甲向银行借款,并以其出租给乙的房屋抵押。抵押期间甲将该房屋转让给丙。乙在租赁期满后拒绝搬出。甲到期未还款。下列人员中,无权代甲还款的是（ ）。","o":["甲的配偶","甲的父母","乙","丙"],"a":"C","e":"\u0001依据《民法典》第524条，甲的配偶、父母（近亲属）和抵押房产受让人丙均对代偿具有合法利益；租期已满且拒不搬离的乙已无合法租权利益，无权代偿。\u0002\nA✗ 根据合同编通则解释第30条，债务人的近亲属（包括配偶）依法属于对履行债务具有合法利益的第三人，有权代甲还款。\nB✗ 甲的父母同属于债务人的近亲属，对维护子女家庭信用及房产利益具备法定合法代偿资格。\nC✓ 乙租赁期满后仍拒绝腾退，已丧失合法租赁占有权源且对抵押房产清偿不再具备法律保护之合法利益，依法无权代甲清偿债务。\nD✗ 丙作为已受让抵押房屋的第三人（《民法典》第524条典型受让人代偿涤除权主体），若不代甲还钱房屋将被银行拍走，其极具合法利害关系有权代偿。","k":"","kb":125,"kh":[[450,527]]},{"id":"2025-34","y":2025,"t":"单","s":"A 公司向B 公司订货,双方在合同中约定了如下担保条款:A 公司董事长张某以全部个人资产作抵押,担保B 公司的债权。张某在合同书上以担保人身份签字,但事后未办理抵押登记。B 公司交货后,A 公司未依约支付货款。对此,下列说法正确的是（ ）。","o":["担保条款有效,但抵押权未设立","担保条款因违反物权客体特定原则而无效","B 公司有权基于保证请求张某承担连带责任","B 公司有权就张某的全部个人资产优先受偿"],"a":"A","e":"\u0001张某笼统以“全部个人资产”作抵违反物权客体特定原则且未登记，故抵押权未设立；但依据区分原则担保条款本身合意有效。\u0002\nA✓ “全部个人资产”未特定化且未办抵押登记，物权层面抵押权确未设立；但依区分原则合同条款合意真实不违法，书面担保条款有效（A公司违约时乙可依据有效条款主张相应违约或限度责任）。\nB✗ 物权客体特定原则制约的是物权本身能否设立，不导致作为债权合意的担保合同条款无效。\nC✗ 张某明示以“个人资产作抵押”提供的是物的担保而非人的保证，不能在未约定保证时强行推定其承担连带保证责任。\nD✗ 既然抵押权根本未设立，B公司就不享有就张某全部个人资产优先受偿的物权。","k":"","kb":126,"kh":[[180,222]]}]},{"sub":"民法","name":"民事法律行为","w":1.8,"L":34,"qs":[{"id":"2005-33","y":2005,"t":"单","s":"在所附条件不成就时,附解除条件的民事法律行为（ ）。","o":["自动解除","自始无效","继续有效","不生效"],"a":"C","e":"\u0001附解除条件的民事法律行为已生效，当所附解除条件不成就时，该行为不发生失效后果而继续有效。\u0002\nA✗ 解除条件“成就”才使民事法律行为失效，条件不成就时不发生解除效力。\nB✗ 解除条件仅影响向后的效力消灭，无论成就与否均非自始无效。\nC✓ 解除条件未成就，行为丧失失效触发前提，因此继续维持有效状态。\nD✗ 附生效（延缓）条件不成就才是不生效；附解除条件成立时即已生效。","k":"","kb":117,"kh":[[210,244]]},{"id":"2005-46","y":2005,"t":"单","s":"依据我国《继承法》的相关规定,口头遗嘱属于（ ）。","o":["要式民事法律行为","不要式民事法律行为","要物民事法律行为","附条件民事法律行为"],"a":"A","e":"\u0001口头遗嘱虽采用口头形式，但依法须在危急情况下且有两个以上见证人在场见证方能成立，属于要式民事法律行为。\u0002\nA✓ 法律对口头遗嘱设定了“危急情况+两名以上见证人在场见证”的法定形式要件，属于要式法律行为。\nB✗ 不要式行为允许当事人自由选择形式；口头遗嘱并非随便口头表达即成立。\nC✗ 要物行为（实践行为）须交付标的物方成立，遗嘱属于死因单方要式行为而非要物行为。\nD✗ 遗嘱附条件需在遗嘱中另有约定，口头遗嘱本身属性并非附条件行为。","k":"","kb":113,"kh":[[375,417]]},{"id":"2005-52","y":2005,"t":"多","s":"某甲与某乙签订了一份租房协议,协议约定:如果甲之子在一年内出国,则甲将房租给乙居住。这一民事法律行为（ ）。","o":["既未成立,也未生效","已成立但未生效","是附条件的民事法律行为","是附期限的民事法律行为"],"a":"BCD","e":"\u0001租房协议双方意思达成一致即已成立，但因同时附有生效条件（出国）和生效期限（一年内），在成就前尚未生效。\u0002\nA✗ 协议已经双方签署达成合意，已依法成立。\nB✓ 合同成立与生效可分离，条件与期限未到达前该协议已成立但尚未生效。\nC✓ 甲之子是否出国具有或然性（可能发生也可能不发生），构成附生效条件。\nD✓ “一年内”设定了条件成就的时间界限，兼具附期限特征。","k":"","kb":117,"kh":[[129,153]]},{"id":"2006-33","y":2006,"t":"单","s":"根据我国有关法律规定,属于效力未定合同的是（ ）。","o":["因重大误解而订立的合同","无权处分人与第三人订立的处分他人财物的合同","因受胁迫而订立的合同","法定代表人超越代表权限订立的合同"],"a":"B","e":"\u0001依据当时适用的原《合同法》第51条，无权处分人与第三人订立的处分他人财物的合同属于效力未定合同。\u0002\nA✗ 因重大误解订立的合同属于可撤销合同，而非效力未定合同。\nB✓ 依据原《合同法》第51条，无权处分他人财物所订立合同须经权利人追认或事后取得处分权方才有效，在2006年考纲下属典型效力未定合同。\nC✗ 受胁迫订立的合同原则上属于可撤销合同（原《合同法》仅损害国家利益才无效）。\nD✗ 法定代表人超越内部权限订立的合同，相对人善意时有效，且原法及现行法均不归入典型效力待定合同。\n【新法提示】本题按2006年原《合同法》第51条命题选无权处分选项。现行《民法典》第597条已彻底变更该规则：出卖人未取得处分权不影响买卖合同本身效力，合同有效；买受人因此不能取得所有权的，可解除合同并请求出卖人承担违约责任。","k":"","kb":116,"kh":[[276,333]]},{"id":"2006-54","y":2006,"t":"多","s":"下列行为中,属于单方法律行为的是（ ）。","o":["授权行为","行使撤消权的行为","买卖行为","行使法定抵消权的行为"],"a":"ABD","e":"\u0001基于一方当事人的单方意思表示即可成立的法律行为为单方法律行为，授权、行使撤销权与行使法定抵销权均属此类。\u0002\nA✓ 被代理人单方授予代理权（授权行为）仅凭本人单方意思表示即生效。\nB✓ 行使撤销权属于行使形成权，由单方意思表示引发法律关系变动。\nC✗ 买卖合同必须双方当事人达成合意方能成立，属于典型双方法律行为。\nD✓ 法定抵销权由当事人单方通知相对人即生抵销效力，属于单方行为。","k":"","kb":113,"kh":[[280,303]]},{"id":"2007-54","y":2007,"t":"多","s":"根据合同法规定,导致合同无效的情形包括 （ ）。","o":["权利义务显失公平","以合法形式掩盖非法目的","损害社会公共利益","违反行政规章的强制性规定"],"a":"BC","e":"\u0001依原《合同法》第52条，以合法形式掩盖非法目的与损害社会公共利益均直接导致合同无效。\u0002\nA✗ 权利义务显失公平的合同属于可撤销（原法可变更可撤销）合同，并非无效。\nB✓ 原《合同法》第52条明确将“以合法形式掩盖非法目的”列为合同无效事由。\nC✓ 原《合同法》第52条规定“损害社会公共利益”的合同无效。\nD✗ 只有违反“法律、行政法规”的效力性强制性规定才致合同无效，部门或地方行政规章不在此列。\n【新法提示】现行《民法典》删去了“可变更”概念，显失公平仅可撤销；原“以合法形式掩盖非法目的”由第146条“虚假意思表示无效+隐藏行为依规定处理”替代，“损害社会公共利益”则整合进第153条第2款“违背公序良俗”。","k":"","kb":116,"kh":[[444,525]]},{"id":"2008-35","y":2008,"t":"单","s":"民法通则所称的重大误解不包括（ ）。","o":["对民事行为性质的误解","对民事行为相对人的误解","对民事行为内容的误解","对民事行为动机的误解"],"a":"D","e":"\u0001重大误解限于对行为性质、对方当事人及标的物关键属性等的错误认识，单纯对交易动机的误解不构成重大误解。\u0002\nA✗ 对民事行为性质的误解（如误将买卖当赠与）属于典型重大误解。\nB✗ 对民事行为相对人的误解（如认错交易或赠与对象）可成立重大误解。\nC✗ 对标的物品种、质量、规格、数量等行为主要内容的误解属于重大误解。\nD✓ 民事行为人内心购买或缔约动机未表现在意思表示内容中，对动机的误解原则上由表意人自负风险，不构成重大误解。","k":"","kb":115,"kh":[[158,227]]},{"id":"2008-36","y":2008,"t":"单","s":"根据民法通则规定,可撤销行为在当事人申请撤销之前为（ ）。","o":["有效行为","效力未定行为","无效行为","部分无效行为"],"a":"A","e":"\u0001可撤销民事法律行为在被有权机关或当事人依法撤销前，在法律上保持有效效力。\u0002\nA✓ 可撤销行为在成立时即发生法律效力，仅在撤销权人依法行使撤销权且被撤销后才自始归于无效。\nB✗ 效力未定行为在追认前效力尚未确定；可撤销行为事前已确定有效。\nC✗ 在撤销之前并非无效，撤销权人也可以选择放弃撤销权使其确定有效。\nD✗ 效力存续与否取决于整个行为是否被撤销，而非先天部分无效。","k":"","kb":115,"kh":[[227,253]]},{"id":"2008-37","y":2008,"t":"单","s":"下列行为中,属于事实行为的是（ ）。","o":["签订合同","承认债务","创作作品","设立遗嘱"],"a":"C","e":"\u0001事实行为不以意思表示为核心要件，只要法律规定客观行为产生后果即成立，创作作品即属事实行为。\u0002\nA✗ 签订合同须双方意思表示一致，属于典型的双方法律行为。\nB✗ 承认债务引起诉讼时效中断，属于通知或感情表示性质的准民事法律行为。\nC✓ 创作作品无论创作者主观上有无取得著作权的意思，创作完成即依法自动取得著作权，属于事实行为。\nD✗ 设立遗嘱系自然人处分身后遗产的意思表示，属于单方要式民事法律行为。","k":"","kb":113,"kh":[[126,152]]},{"id":"2008-53","y":2008,"t":"多","s":"下列行为中,属于有偿法律行为的有（ ）。","o":["承揽合同","租赁合同","赠与合同","运输合同"],"a":"ABD","e":"\u0001有偿法律行为指一方取得利益须向对方支付相应对价，承揽、租赁和运输合同均属有偿法律行为。\u0002\nA✓ 承揽合同中定作人须向完成工作的承揽人给付报酬，是有偿行为。\nB✓ 租赁合同中承租人使用租赁物须支付租金，是有偿行为。\nC✗ 赠与合同原则上系赠与人无偿给予财产，受赠人无需支付对价，属于无偿法律行为。\nD✓ 一般民事运输合同中旅客或托运人须向承运人支付票款或运费，是有偿行为。","k":"","kb":113,"kh":[[346,373]]},{"id":"2009-35","y":2009,"t":"单","s":"下列行为中,可以构成附条件民事法律行为的是（ ）。","o":["小张在与保险公司签订的合同中约定“发生保险事故时,保险公司赔偿保险金”","小王与小李在房屋买卖合同中约定“双方到房产部门办理登记过户手续后,房屋所有权转移”","甲公司与乙
