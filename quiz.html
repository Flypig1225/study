死亡（第247条），均定故意杀人罪；行政滥用职权致人死亡本身为滥用职权罪结果构成要件，不转化。\u0002\nA✓ 《刑法》第292条第2款：聚众斗殴致人重伤、死亡的，依照故意伤害罪、\u0001故意杀人罪\u0002定罪处罚\nB✓ 脱逃罪中暴力打死监管人员，同时触犯脱逃罪与故意杀人罪（或暴力拒捕袭警致死），从一重罪按\u0001故意杀人罪\u0002定罪处罚\nC✓ 《刑法》第247条：刑讯逼供或者暴力取证致人伤残、死亡的，依照故意伤害罪、\u0001故意杀人罪\u0002定罪从重处罚\nD✗ 国家机关工作人员在行政管理活动中滥用职权过失或间接地造成他人死亡（“致使公共财产、国家和人民利益遭受重大损失”），仍直接定\u0001滥用职权罪\u0002（不转化故意杀人罪）","k":"","kb":66,"kh":[[130,167],[234,264],[269,312]]},{"id":"2014-6","y":2014,"t":"单","s":"国家机关工作人员甲,因不满父亲再婚,与之断绝往来。其父晚年孤身一人、身患重病时,甲拒绝照顾,情节恶劣,构成遗弃罪。在本案中,甲违反了（ ）。","o":["法律行为引起的义务","职务要求的义务","先前行为引起的义务","法律明文规定的义务"],"a":"D","e":"\u0001拒不照顾晚年孤身患重病父亲致构成遗弃罪，作为义务源于《民法典》（原《婚姻法》）明文规定的成年子女对父母的法定扶养赡养义务，属于法律明文规定的义务。\u0002\nA✗ 法律行为引起的义务主要指基于合同约定（如受雇保姆照料婴儿）产生的作为义务，子女赡养父母不是自愿签合同才有\nB✗ 甲虽是国家机关工作人员，但照顾年老患病父亲属于公民家庭义务而非公务员公务职责\nC✗ 父母年迈生病不是甲的先行危险行为导致的\nD✓ 法律明文规定的义务：我国《民法典》及《老年人权益保障法》明文规定了成年子女对患病或生活不能自理父母的\u0001法定赡养义务\u0002，遗弃罪违反的正是法律明文规定的扶养义务","k":"","kb":70,"kh":[[188,191]]},{"id":"2014-15","y":2014,"t":"单","s":"下列行为中,应以绑架罪定罪处罚的是（ ）。","o":["以出卖为目的偷盗他人幼儿","以索取赌债为目的偷盗他人婴儿","以索取工程款为目的偷盗他人幼儿","以索取虚构的欠款为目的偷盗他人婴儿"],"a":"D","e":"\u0001以出卖定拐卖儿童；索真债/赌债/工程款偷盗婴幼儿因缺乏“勒索非法财物”目的定拐骗儿童罪；唯独以“索取虚构的欠款（根本无债权，实质借口勒索）”偷盗婴儿成立绑架罪。\u0002\nA✗ 以出卖为目的偷盗他人幼儿，构成《刑法》第240条\u0001拐卖儿童罪\u0002\nB✗ 为索取赌债（确实存在的非法债务）偷盗他人婴儿，依索债型司法解释精神或没有勒索他人原本财物故意，一般按非法拘禁罪或\u0001拐骗儿童罪\u0002处理\nC✗ 为索取真实存在的工程欠款偷盗他人幼儿，系索取现实债权，不构绑架罪（定拐骗儿童罪或非法拘禁罪）\nD✓ 以索取虚构的欠款为目的偷盗他人婴儿：因为欠款纯属虚构，行为人主观实质上就是\u0001以勒索财物为目的偷盗婴幼儿\u0002，依《刑法》第239条第3款（及第1款）直接构成\u0001绑架罪\u0002","k":"","kb":68,"kh":[[184,220]]},{"id":"2017-14","y":2017,"t":"单","s":"下列选项中,应以强奸罪一罪追究刑事责任的是（ ）。","o":["甲利用业务关系,在女推销员半推半就的情况下与之发生性行为","乙在拐卖过程中,违背被拐卖妇女的意志与之发生性行为","丙宣传迷信,以“行为治疗法”蒙骗求医女性与之发生性行为","丁将男性同事灌醉,趁其熟睡与之发生同性性行为"],"a":"C","e":"\u0001违背妇女意志是强奸罪的核心：利用“看病治病”宣扬迷信（行为治疗法）欺骗求医女性发生性关系的，被害人根本不具有真正意义上的性同意（受蒙骗处于不知情非自愿状态），成立强奸罪一罪！\u0002\nA✗ 女推销员半推半就通常反映内心矛盾后实质予以容忍默许或并不明显违背性自主决定权，司法实践除非确有暴力威胁否则一般不以强奸罪论处\nB✗ 在拐卖妇女过程中奸淫被拐卖妇女的，依据《刑法》第240条第1款第3项规定作为拐卖妇女罪的\u0001法定刑升格加重情节\u0002，仍以\u0001拐卖妇女罪一罪\u0002论处，而非“以强奸罪一罪论处”\nC✓ 丙宣传迷信，以“行为治疗法”蒙骗求医女性与之发生性行为：司法解释及刑法通说一贯认定，利用封建迷信、假借治病消除灾祸等“蒙骗方法”致使妇女处于无从识别性侵害真相、违背其真实意志状态下与之发生性关系的，构成\u0001强奸罪一罪\u0002\nD✗ 现行《刑法》第236条强奸罪被害人严格限于妇女和幼女；将成年男性同事灌醉后实施同性性侵害，依法应当适用第237条\u0001强制猥亵罪\u0002（《刑修九》将猥亵对象由“妇女”扩展到“他人”），而非强奸罪","k":"","kb":67,"kh":[[215,250]]},{"id":"2017-15","y":2017,"t":"单","s":"甲为了报复素有矛盾的刘某,捏造刘某贪污的材料向检察机关举报,导致刘某被逮捕。甲的行为构成（ ）。","o":["诬告陷害罪","诽谤罪","报复陷害罪","伪证罪"],"a":"A","e":"\u0001捏造刘某贪污材料向检察机关举报（意图使他人受刑事追究）且致其被逮捕，完全符合诬告陷害罪。\u0002\nA✓ 诬告陷害罪：捏造国家工作人员贪污犯罪事实，向拥有反贪或立案侦查/监督权的检察机关举报，致使无辜的刘某被错误逮捕，构成\u0001诬告陷害罪\u0002\nB✗ 诽谤罪是散播有损个人道德品行或私生活名誉的虚假事实，向司法机关告发犯罪并图谋使其坐牢定诬告陷害罪\nC✗ 报复陷害罪须主体为\u0001国家机关工作人员\u0002且针对控告人、申诉人、批评人、举报人利用职权报复；甲既非国家机关人员，刘某也非举报人\nD✗ 伪证罪发生在刑事诉讼已经立案开始之后的作证、鉴定等环节中，且限于证人、鉴定人等四类人员","k":"","kb":70,"kh":[[17,55]]},{"id":"2017-16","y":2017,"t":"单","s":"下列选项中,应认定为故意伤害罪的是（ ）。","o":["抢劫未果却造成被害人轻伤的","强奸过程中造成被害人重伤的","刑讯逼供时造成犯罪嫌疑人伤残的","拐卖儿童过程中造成被拐卖儿童重伤的"],"a":"C","e":"\u0001《刑法》第247条规定刑讯逼供致人伤残（包括重伤/残疾）的转化为故意伤害罪从重处罚；抢劫致轻伤、强奸致重伤、拐卖致重伤均属于各自本罪既遂或加重情节，不单定故意伤害罪。\u0002\nA✗ 抢劫造成被害人轻伤属于抢劫罪的既遂条件，被抢劫罪完全涵盖，只定抢劫罪\nB✗ 强奸过程中造成被害人重伤属于《刑法》第236条“致使被害人重伤”的加重法定刑情形，只定强奸罪一罪\nC✓ 刑讯逼供时造成犯罪嫌疑人伤残的：依《刑法》第247条法定转化规定，不再定刑讯逼供罪，一律转化按\u0001故意伤害罪\u0002定罪并从重处罚\nD✗ 拐卖儿童过程中造成被拐卖儿童重伤的（非另行故意施暴仅系拐卖过失或附随行为造成），依《刑法》第240条作为拐卖儿童罪加重法定情节处理（注意240条只有“造成重伤”属拐卖加重刑格，无转化故意伤害条款）","k":"","kb":66,"kh":[[130,167]]},{"id":"2017-44","y":2017,"t":"多","s":"下列选项中,构成非法拘禁罪的有（ ）。","o":["甲（警察）因私怨与刘某发生口角，用手铐将刘某铐在警车内","乙为索取合法债务,非法扣押债务人涂某的妻子","丙为了索要劳务报酬,偷走龙某出生不久的儿子","丁为了追索高利贷,扣留债务人钱某"],"a":"ABD","e":"\u0001警察因私怨用手铐将他人铐在警车内、为索取合法债务扣押对方妻子、为追索高利贷扣留债务人，均构成非法拘禁罪；为索劳务报酬偷走婴儿构绑架罪还是拐骗儿童？注意偷盗婴幼儿不构非法拘禁。\u0002\nA✓ 警察甲因私人恩怨（刘某并非违法犯罪嫌疑人）动用警械手铐将刘某锁在警车内剥夺自由，属于国家机关工作人员利用职权非法拘禁他人，依司法解释构成\u0001非法拘禁罪\u0002（从重）\nB✓ 为索取合法债务而非法扣押债务人的配偶（第三人或债务人本人均同），依第238条第3款依然定\u0001非法拘禁罪\u0002\nC✗ 偷走对方刚出生不久尚无行动辨识能力的\u0001婴儿\u0002索要劳务报酬，无法侵害婴儿自身行走自由，在刑法上视索债真实情况定\u0001拐骗儿童罪\u0002（或者涉嫌绑架罪），绝不构成非法拘禁罪\nD✓ 高利贷虽在民法上超出法定利率部分不受保护，但仍属于“非法债务”，为追索高利贷扣留债务人仍依《刑法》第238条第3款以\u0001非法拘禁罪\u0002论处","k":"","kb":68,"kh":[[42,89]]},{"id":"2019-2","y":2019,"t":"单","s":"下列对于破坏选举罪构成要件的理解,正确的是（ ）。","o":["主体包括自然人和单位","主观方面包括故意和过失","客体包括选民的选举权和被选举权","客观方面限于暴力、威胁、欺骗或贿赂行为"],"a":"C","e":"\u0001破坏选举罪的客体包括选民的选举权、被选举权及国家正常选举制度；本罪主体只有自然人（不含单位），主观只能是故意，客观手段还涵盖伪造选举文件、虚报选举票数等。\u0002\nA✗ 《刑法》第256条破坏选举罪没有规定单位犯罪，只能由自然人构成\nB✗ 本罪的主观方面只能是\u0001故意\u0002，过失不构成破坏选举罪\nC✓ 客体包括选民的选举权和被选举权：既侵害了公民宪法赋予的选举权与被选举权，也破坏了我国人民代表大会代表与国家领导人选举制度\nD✗ 第256条列明的客观手段除了暴力、威胁、欺骗、贿赂之外，还明文包括“\u0001伪造选举文件、虚报选举票数或者有其他破坏选举行为\u0002”，并非限于前四种","k":"","kb":71,"kh":[[41,95],[105,129]]},{"id":"2019-17","y":2019,"t":"单","s":"幼儿园教师甲在幼儿园卫生间多次用针刺戳肖某等10余名幼儿的臀部,虽未造成伤害后果,但情节十分恶劣。甲的行为应认定为（ ）。","o":["侮辱罪","猥亵儿童罪","虐待被监护、看护人罪","故意伤害罪"],"a":"C","e":"\u0001幼儿园教师对负有看护职责的多名幼儿多次用针刺戳臀部，未造成轻伤以上但情节十分恶劣，构成《刑法修正案（九）》增设的虐待被监护、看护人罪。\u0002\nA✗ 行为人是负有专业幼教看护职责人员反复折磨刺戳幼童肉体，并非仅在语言或举止上公然贬损人格\nB✗ 题目明确是“用针刺戳幼童臀部”体罚虐待发泄（并非出于满足性刺激的性侵猥亵），不构猥亵儿童罪\nC✓ 虐待被监护、看护人罪：幼儿园教师属于对未成年幼儿负有看护职责的人，其多次用针刺戳十余名幼童虐待被看护人且情节恶劣，完全符合《刑法》第260条之一构成要件\nD✗ 题干特意注明“\u0001虽未造成伤害后果\u0002”，即尚未达到轻伤以上，不构成故意伤害罪（正体现了增设第260条之一填补非亲属看护虐待轻微伤但情节恶劣刑法空白的立法目的）","k":"","kb":70,"kh":[[246,322]]},{"id":"2019-42","y":2019,"t":"多","s":"甲指使乙重伤江某,乙同意后持钢管将江某打成轻伤,并在离开现场时,为防止江某报警,勒令江某交出手机。对此,下列选项中正确的有（ ）。","o":["甲的行为构成故意伤害罪","甲的行为构成抢劫罪","乙的行为构成故意伤害罪","乙的行为构成抢劫罪"],"a":"ACD","e":"\u0001教唆乙重伤江某，乙将其打成轻伤（未超出教唆范围，甲乙均构成故意伤害罪）；乙在离开时为防报警强行抢走手机属于个人临时起意超出共犯范围（实行过限），仅乙另构成抢劫罪。\u0002\nA✓ 甲教唆乙重伤江某，乙实际实施殴打致轻伤，属于在共同故意伤害罪范围内成立既遂，甲成立故意伤害罪（教唆犯）\nB✗ 乙临时起意抢手机完全超出甲“重伤江某”的教唆范围，属\u0001实行过限\u0002，甲不对乙的抢劫罪承担责任\nC✓ 乙直接持钢管将江某打成轻伤，构成故意伤害罪\nD✓ 乙在伤害完江某后，趁江某受伤反抗能力减弱之际强行“勒令交出手机”非法占有，成立\u0001抢劫罪\u0002（与故意伤害罪数罪并罚）","k":"","kb":66,"kh":[[23,28]]},{"id":"2020-3","y":2020,"t":"单","s":"甲向乙表示自己愿意出高价“买”妻,乙与其妻丙商量,让丙假扮为被拐卖妇女,并将丙“出卖”给甲。三天后,乙协助丙逃离甲家。对此,下列选项中正确的是（ ）。","o":["甲构成拐卖妇女罪","乙构成拐卖妇女罪","乙构成诈骗罪","丙不构成犯罪"],"a":"C","e":"\u0001乙与妻子丙合谋让丙假扮被拐卖妇女“卖”给想“买妻”的甲并在三天后协助丙逃走骗钱，丙并非真实被拐妇女而是同伙骗钱，乙、丙共同构成诈骗罪。\u0002\nA✗ 甲出钱想收买妻子（非以出卖为目的），本就不构成拐卖妇女罪（且丙并非真实被拐卖人员，甲客观上仅可能涉及收买对象不能犯或行政问题）\nB✗ 拐卖妇女罪侵害的是妇女自身人格尊严和自由权且必须有被拐卖之真实被害人；妻子丙自愿配合演戏做饵骗取甲钱财，本质上是仙人跳/卖妻式诈骗，不构成拐卖妇女罪\nC✓ 乙构成诈骗罪：乙、丙共谋虚构“出售被拐妻子”事实诱使甲陷入错误认识并自愿交出高价购妻款，随后协助丙逃走骗取钱财，二人共同成立\u0001诈骗罪\u0002\nD✗ 丙深度参与虚假演出并与乙共谋骗取甲财物，同样构成诈骗罪共犯","k":"","kb":69,"kh":[[20,56]]},{"id":"2020-7","y":2020,"t":"单","s":"医生甲明知夏某不满18周岁,仍应夏某要求, 摘取其左肾移植给自己的病人。卖肾所得5万元全部交给夏某。甲的行为应认定为（ ）。","o":["不构成犯罪","非法行医罪","非法经营罪","故意伤害罪"],"a":"D","e":"\u0001《刑法》第234条之一第2款规定，即使征得未成年人本人“同意”并给付全额报酬，只要“摘取不满18周岁的人的器官”，一律直接以故意伤害罪或故意杀人罪定罪处罚。\u0002\nA✗ 摘取未成年人器官绝不因未成年人“自愿承诺/本人要求”而免罪（不满18周岁人没有有效器官捐献处分承诺能力）\nB✗ 行为人虽为医生但法律明文拟制直接定故意伤害/杀人罪（而且问题不在有无行医执照，而在于非法摘取未成年人肾脏）\nC✗ 《刑法》第234条之一第1款才是针对成年人有偿买卖组织出卖人体器官罪；摘取未成年人左肾（未致死）法律明文适用第2款重罪转化\nD✓ 故意伤害罪：依据《刑法》第234条之一第2款，摘取不满18周岁的人的器官的，直接依照\u0001故意伤害罪\u0002（造成重伤残疾，如致死则定故意杀人罪）定罪处罚","k":"","kb":66,"kh":[[346,392]]},{"id":"2020-8","y":2020,"t":"单","s":"李某遭甲强奸后,逃离时滑落河中。甲看到李某在水中挣扎,仍离开现场,李某溺水身亡。甲的行为应认定为（ ）。","o":["强奸罪","故意杀人罪","强奸罪和故意杀人罪","强奸罪和过失致人死亡罪"],"a":"A","e":"\u0001李某遭强奸后在自行逃跑途中意外滑落河中溺水，甲看见其挣扎离开。依2020年真题采纳标准，先期犯罪（强奸）本身通说争议或认为被害人自己逃跑滑落非甲主动推下且强奸已结束未成立新作为义务，仅定强奸罪（注：实务不同观点，严遵真题口径）。\u0002\nA✓ 强奸罪：按法硕2020年真题官方解析设定，强奸这一先期故意犯罪行为本身不当然在被害人自行逃跑失足落水时直接创设刑法上绝对救助义务（且难以当然归因），因而甲不另成立不作为故意杀人罪或过失致人死亡罪，仅定\u0001强奸罪\u0002\nB✗ 不能直接把强奸后的单纯离去跳过强奸罪而单定故意杀人罪\nC✗ 按真题命题定论，甲见其自己逃跑滑落未救不构成不作为故意杀人罪，不与强奸罪数罪并罚\nD✗ 既未成立故意杀人亦未成立过失致人死亡\n考试口径提示：2020年法硕官方真题认为“强奸后被害人自己逃跑意外落水，行为人见死不救离开现场”因故意犯罪能否产生作为义务学理有争议及因果关联较弱，最终以\u0001强奸罪一罪\u0002认定；与“将被害人亲手推入水中或遗弃偏僻深山”不同。","k":"","kb":67,"kh":[[10,13]]},{"id":"2020-18","y":2020,"t":"单","s":"下列关于强奸罪的说法中,正确的是（ ）。","o":["强奸罪的犯罪对象可以是男性","强奸罪的犯罪主体不可以是女性","只要与幼女发生性关系就应以强奸罪论处","强奸引起被害人自杀的,不属于强奸“致使被害人死亡”"],"a":"D","e":"\u0001强奸罪法条“致使被害人重伤、死亡”仅指强奸暴力殴打压迫或奸淫动作本身直接导致的严重身体损伤乃至当场或抢救无效死亡，一般不包括被害人事后因羞愤等自行自杀（事后自杀可作为从重处罚情节）。\u0002\nA✗ 我国《刑法》第236条强奸罪明确限缩保护对象为\u0001妇女（及幼女）\u0002，对男性实施强制猥亵性侵目前依第237条强制猥亵罪论处\nB✗ 妇女虽然因生理构造不能单独直接作为强奸罪的直接正犯（实行犯），但完全可以帮男人按住被害女方、唆使或作为间接正犯（或共同实行犯中的非直接奸淫共犯）构成强奸罪\u0001共犯\u0002\nC✗ 奸淫幼女罪（按强奸罪从重处罚）仍遵循主客观相统一原则：如果是12–14岁发育成熟的幼女故意谎报自己已成年而行为人客观上根本无法识别、确不知对方可能是幼女且系双方自愿恋爱性关系，通常不按强奸罪处理（注：最高法已重申对不知且无理由疑为幼女的特例界分）\nD✓ 强奸引起被害人自杀的，不属于强奸“致使被害人死亡”：依照法硕统考及2020官方解析通说，“致使被害人重伤、死亡”严格指因强奸暴力手段或奸淫行为自身直接导致的被害人身体器官重大损伤或死亡，被害人事后自杀因中间介入了被害人自身自主决定，不直接认定为结果加重犯“致使被害人死亡”（在量刑时作为恶劣情节从重考量）","k":"","kb":90,"kh":[[71,122]]},{"id":"2020-45","y":2020,"t":"多","s":"我国刑法保护的公民个人信息包括（ ）。","o":["财产状况","行踪轨迹","身份证件号码","通讯联系方式"],"a":"ABCD","e":"\u0001侵犯公民个人信息罪的“公民个人信息”包含财产状况、行踪轨迹、身份证件号码、通讯联系方式等一切能单独或结合识别特定自然人身份或反映其活动情况的信息。\u0002\nA✓ 财产状况属于反映特定自然人重要隐私与活动情况的公民个人信息（高危敏感信息）\nB✓ 行踪轨迹属于反映特定自然人活动轨迹的高度敏感公民个人信息\nC✓ 身份证件号码是最核心的能直接单独识别自然人身份的信息\nD✓ 通讯联系方式属于能够结合或单独识别联系特定自然人身份的基本个人信息","k":"","kb":71,"kh":[[211,250]]},{"id":"2021-3","y":2021,"t":"单","s":"甲(15周岁)实施的下列行为中,构成犯罪的是（ ）。","o":["积极参加其堂兄领导的黑社会性质组织","打破汽车玻璃,拿走车内贵重物品","为勒索财物绑架同学,并将其打成重伤","燃放爆竹时不慎引燃邻居住宅,造成重大财产损失"],"a":"C","e":"\u000115周岁（已满14不满16周岁）只对“八大重罪”负刑责，其中为勒索财物绑架同学并将之打成重伤，不负绑架罪责任但对打伤行为构成故意伤害罪（致人重伤）。\u0002\nA✗ 参加黑社会性质组织罪不在14—16周岁负刑责的八种犯罪之内\nB✗ 砸车窗盗窃车内财物属普通盗窃罪，15周岁人不负刑事责任\nC✓ 为勒索财物绑架同学并将其打成重伤：15周岁人对绑架罪不负刑责，但依据《刑法》第17条第2款及司法解释，对绑架过程中故意把同学\u0001打成重伤\u0002的行为，应当以\u0001故意伤害罪（致人重伤）\u0002追究刑事责任\nD✗ “不慎”燃放爆竹引燃邻居住宅属过失引起的失火罪（非故意放火罪），15周岁人对过失犯罪一律不负刑事责任","k":"","kb":66,"kh":[[23,28]]},{"id":"2021-10","y":2021,"t":"单","s":"甲为索取赌债,扣押 \"赌友“李某数天。甲的行为应认定为（ ）。","o":["抢劫罪","敲诈勒索罪","绑架罪","非法拘禁罪"],"a":"D","e":"\u0001为索取赌债（非法债务）而非法扣押“赌友”李某数天（未达重伤死亡），构成非法拘禁罪。\u0002\nA✗ 没有当场以暴力非法劫取无债权关系之财物，不构成抢劫罪\nB✗ 索讨事先已存在的赌博债权而剥夺人身自由数日，按第238条第3款专条定性\nC✗ 有真实存在的在先债务关系（哪怕属赌债等不受民法保护之非法债务），仍不以绑架罪论处\nD✓ 非法拘禁罪：《刑法》第238条第3款“为索取债务非法扣押、拘禁他人的”，包含为索取\u0001赌债、高利贷等法律不予保护的非法债务\u0002而扣押他人，均构成非法拘禁罪","k":"","kb":68,"kh":[[42,89]]},{"id":"2022-8","y":2022,"t":"单","s":"甲为报复仇人高某,利用AI技术,将一段色情视频的表演者\"换脸\"为高某,并通过互联网发布,导致高某不堪受辱精神失常。甲的行为应认定为","o":["侮辱罪","诽谤罪","报复陷害罪","传播淫秽物品罪"],"a":"B","e":"\u0001利用AI深度伪造技术把色情视频女主角“换脸”成仇人高某并在互联网公开散布致高某精神失常，属于捏造并公然散布虚构事实破坏名誉情节严重，定诽谤罪。\u0002\nA✗ 侮辱罪无需“捏造虚假事实”，一般采取泼秽物、打耳光或当众贴真实丑照辱骂；利用AI合成假淫秽视频“捏造了高某拍色情片的虚假事实”，精准属于诽谤罪\nB✓ 诽谤罪：利用AI换脸制作并网传高某不实色情视频并导致被害人精神失常（情节严重），完全符合《刑法》第246条\u0001捏造事实并通过网络散布诽谤他人\u0002的犯罪特征\nC✗ 无国家机关工作人员滥用职权报复控告、举报人的情节\nD✗ 本案旨在发泄私愤重点毁坏特定个人高某名誉（若涉淫秽视频扩散或兼有传播淫秽物品，但核心且当年真题明确以侵犯人格名誉权精准区分侮辱与诽谤，定诽谤罪）","k":"","kb":70,"kh":[[115,149]]},{"id":"2022-18","y":2022,"t":"单","s":"【案情】甲（15周岁）深夜闯入临街店铺意图行窃，被留下理货的店主（系聋哑人）发现。\n假设一∶甲见势不妙拔腿就跑,店主随后追赶但因天黑路滑不慎摔成重伤。甲的行为","o":["不构成犯罪","构成盗窃罪","构成抢劫罪","构成非法侵入住宅罪"],"a":"A","e":"\u000115周岁（不满16岁）深夜闯入“临街经营性店铺”行窃被发现后逃跑，店主自己追赶因天黑路滑摔成重伤，甲既未构抢劫、15岁又不构盗窃及非法侵入住宅罪（且店铺非住宅），无罪。\u0002\nA✓ 不构成犯罪：首先，15周岁对普通盗窃罪和非法侵入住宅罪均不负刑责（况且\u0001临街店铺属于商业营业场所并非供日常起居生活的“住宅”\u0002）；其次，甲未采取任何暴力逃走，店主自己因天黑路滑摔伤，甲既非暴力转化抢劫也无伤害行为（对过失致人重伤罪15岁亦无责），全案不构成犯罪\nB✗ 15周岁（未满16周岁）对盗窃罪不负刑事责任\nC✗ 甲“见势不妙拔腿就跑”，没有使用任何暴力或以暴力相威胁，且未转化成抢劫\nD✗ 一是临街店铺非私人“住宅”，二是15周岁对非法侵入住宅罪也不负刑事责任","k":"","kb":68,"kh":[[10,15]]},{"id":"2022-45","y":2022,"t":"多","s":"非法植入基因编辑、克隆胚胎罪的客观方面表现为","o":["将基因编辑、克隆的人类胚胎植入人体内,情节严重的","将基因编辑、克隆的动物胚胎植入人体内,情节严重的","将基因编辑、克隆的人类胚胎植入动物体内,情节严重的","将基因编辑、克隆的动物胚胎植入动物体内,情节严重的"],"a":"ABC","e":"\u0001《刑法修正案（十一）》增设的非法植入基因编辑、克隆胚胎罪涵括三类排列组合：“人→人”、“人→兽”、“兽→人”，唯独不包含“动物胚胎植入动物体内”。\u0002\nA✓ 将基因编辑、克隆的\u0001人类胚胎植入人体内\u0002，情节严重的，构成本罪\nB✓ 将基因编辑、克隆的\u0001动物胚胎植入人体内\u0002，情节严重的，构成本罪\nC✓ 将基因编辑、克隆的\u0001人类胚胎植入动物体内\u0002，情节严重的，构成本罪\nD✗ 将基因编辑、克隆的动物胚胎植入动物体内属于普通动物生物实验，未跨及人类基因安全伦理底线，不构成该罪\n记法：非法植入胚胎三组合：“人入人、人入兽、兽入人”，纯动物之间实验（兽入兽）不管！","k":"","kb":71,"kh":[[280,332]]},{"id":"2023-7","y":2023,"t":"单","s":"甲因所订外卖经常被他人拿走,颇为恼火。一日,甲点了某“超级辣”外卖套餐,想要给偷拿外卖的人“一点颜色”。邻家幼童偷吃放在甲家门口的该套餐后,严重过敏。送医途中,因交通堵塞,幼童未能得到及时救治而死亡。甲的行为应认定为","o":["故意杀人罪","故意伤害罪","过失致人死亡罪","不构成犯罪"],"a":"D","e":"\u0001点正规商户售卖的“超级辣”外卖放在自己家门口以捉弄经常偷外卖的人，邻家幼童偷吃后因极端过敏体质加堵车救治不及时死亡，无非法杀伤或可预见过失风险，属意外事件不构罪。\u0002\nA✗ 点一份普通商家合法销售的“超级辣”外卖放在自家门前，并非投放毒药，客观上不存在杀害任何人的杀人行为与故意\nB✗ 食物加辣在正常社会生活允许范围内，既不存在违法的伤害行为也无造成幼童重伤死亡的故意\nC✗ 作为普通订餐市民，根本无法预见也不负有义务去预防小偷恰巧是个“一吃超级辣就会严重过敏”且遇严重堵车致死的幼童，欠缺刑法上的注意义务与过失罪过\nD✓ 不构成犯罪：在自家门口放置正常合法餐食（超级辣外卖），既没有刑法意义上的违法实行危险行为，对偷食幼童因罕见过敏体质兼遇堵车未及时抢救死亡的结果亦不能预见，属于\u0001意外事件\u0002","k":"","kb":78,"kh":[[138,222]]},{"id":"2023-9","y":2023,"t":"单","s":"甲因琐事将同事钱某打成轻伤,后无意中发现钱某身旁的背包中装有巨款,于是趁钱某不注意,将包拿走。甲的行为应认定为","o":["抢夺罪","故意伤害罪","故意伤害罪和盗窃罪","故意伤害罪和侵占罪"],"a":"C","e":"\u0001先因琐事打伤同事（故意伤害罪），打完之后无意间看到其背包有巨款再临时起意“趁人不注意”拿走（盗窃罪），前后分别独立产生犯意，数罪并罚（而非抢劫）。\u0002\nA✗ 本案实施了两次性质不同的独立犯罪，仅定抢夺不仅忽略了在先故意伤害罪，且趁人不注意拿取也不是抢夺\nB✗ 漏掉了事后另起贼心顺走装有巨款背包的盗窃行为\nC✓ 故意伤害罪和盗窃罪：先前因琐事打人时只有伤害故意（并不为劫财），构成\u0001故意伤害罪\u0002；殴打结束后“无意中发现”巨款再临时起意趁人不备偷拿走，构成\u0001盗窃罪\u0002（不构成抢劫罪，因为先前的暴力不是为了取财，取财时也没有再次实施暴力压制反抗），两罪数罪并罚\nD✗ 受害人背包及其内巨款在被害人自身携带支配下，甲并不是代为保管或拾得他人遗忘物，故后行为定盗窃罪而非侵占罪\n高发区分（先打人后临时起意拿财物）：\n- 被害人仍清醒只是\u0001没注意\u0002，趁人不备顺手偷走 → \u0001故意伤害罪 + 盗窃罪\u0002；\n- 被害人已被打昏失去反抗能力，直接从昏迷者身上拿走财物（无另施暴力且利用昏迷状况？通说多数如趁其昏迷未另起暴力顺手拿走仍多按故意伤害+盗窃，只有利用暴力压制继续取财或劫财故意转化时才探讨抢劫）。","k":"","kb":66,"kh":[[23,28]]},{"id":"2023-43","y":2023,"t":"多","s":"根据我国刑法规定,负有照护职责人员性侵罪中的照护职责包括","o":["监护职责","收养职责","看护职责","医疗职责"],"a":"ABCD","e":"\u0001《刑法》第236条之一明文规定“负有照护职责人员性侵罪”的照护职责人员为：对已满14不满16周岁未成年女性负有“监护、收养、看护、教育、医疗”等特殊职责的人员。\u0002\nA✓ 监护职责（如继父、近亲属监护人等）属于第236条之一法定五类特殊职责首项\nB✓ 收养职责（养父等合法或事实收养照料人）属于法定特殊职责之一\nC✓ 看护职责（如保姆、保育员、生活管理员等）属于法定特殊职责之一\nD✓ 医疗职责（如医生、护士等医务人员）属于法定特殊职责之一（全条包括“监护、收养、看护、教育、医疗等特殊职责”）\n记法：第236条之一五大照护职责口诀：“医（医疗）教（教育）看（看护）收（收养）监（监护）”，保护对象为“已满14不满16周岁未成年女性”。","k":"","kb":67,"kh":[[319,343]]},{"id":"2023-45","y":2023,"t":"多","s":"甲(男)在拐骗金某(女)的过程中,多次奸淫金某,后将其卖给乙。乙将金某锁在家中,几天后欲强行与其发生性关系,因金某激烈反抗而未得逞。对此,下列说法正确的有","o":["甲的行为应认定为拐卖妇女罪一罪","甲的行为应认定为拐卖妇女罪和强奸罪,数罪并罚","乙的行为应认定为收买被拐卖的妇女罪和非法拘禁罪,数罪并罚","乙的行为应认定为收买被拐卖的妇女罪、非法拘禁罪和强奸罪(未遂),数罪并罚"],"a":"AD","e":"\u0001人贩子拐卖途中多次奸淫被拐妇女，依第240条属拐卖妇女罪加重情节定一罪；买家收买后锁在家中（非法拘禁罪）又欲强奸遭反抗未遂（强奸罪未遂），依第241条三罪数罪并罚。\u0002\nA✓ 依《刑法》第240条第1款第3项，拐卖妇女过程中“\u0001奸淫被拐卖的妇女的\u0002”直接作为拐卖妇女罪加重处罚情节（处10年以上、无期或死刑），不单独再定强奸罪数罪并罚，故甲只定拐卖妇女罪一罪\nB✗ 拐卖过程中的奸淫行为已在第240条明文规定为拐卖妇女罪一罪之加重结果或法定加重事由，切忌数罪并罚\nC✗ 漏掉了乙“几天后欲强行与其发生性关系”构成的强奸罪（未遂）\nD✓ 依《刑法》第241条第2、3、4款明确规定，乙收买被拐卖妇女（收买罪）、锁在家中非法限制人身自由（非法拘禁罪）、又使用强力欲强奸未得逞（强奸罪未遂），三者依法\u0001数罪并罚\u0002","k":"","kb":69,"kh":[[57,66],[100,127],[187,223]]},{"id":"2024-19","y":2024,"t":"单","s":"【案情】甲趁女友肖某不备，将事先购买的安眠药放入其水杯中，肖某喝水后不久开始意识模糊，甲与肖某发生性关系，在此过程中，甲发现肖某呼吸衰弱，不断呕吐，遂拨打120呼叫救护车。\n如在救护车到达之前,肖某因呕吐物堵塞呼吸道,窒息死亡,甲的行为应认定为 （ ）。","o":["强奸罪","故意杀人罪","过失致人死亡罪","投放危险物质罪"],"a":"A","e":"\u0001投安眠药迷昏女友并趁其意识模糊与其发生性关系（强奸已着手并既遂），过程中肖某因药物反应呕吐堵塞呼吸道窒息死亡，属强奸致使被害人死亡结果加重犯，仅定强奸罪一罪。\u0002\nA✓ 强奸罪：趁被害人喝下安眠药意识模糊与其发生性关系属于使用“其他使妇女不知/不能反抗的麻醉手段”强奸；因安眠药反应呕吐窒息死亡系强奸行为直接引起的“\u0001致使被害人死亡\u0002”加重结果，依法认定\u0001强奸罪（结果加重犯）\u0002一罪处罚\nB✗ 甲发现呕吐后立即拨打120急救，主观上不希望也未放任肖某死亡，不成立故意杀人罪\nC✗ 对死亡结果的过失已经直接被强奸罪“致使被害人死亡”法定加重刑格所涵盖吸收，不另定或并罚过失致人死亡罪\nD✗ 安眠药是单独投放于特定被害人肖某水杯用于迷奸，不危及不特定多数人公共安全，不构成投放危险物质罪\n重要罪名提示：\n投安眠药麻醉特定单一被害人（用于强奸或抢劫），根本不产生不特定公共危险，绝对不构成投放危险物质罪；导致该被害人死亡的直接适用\u0001强奸罪（或抢劫罪）致人死亡\u0002的结果加重犯。","k":"","kb":53,"kh":[[46,90]]},{"id":"2024-44","y":2024,"t":"多","s":"为保护未成年人的合法权益,在办理强奸、猥亵未成年人案件时,下列做法正确的有（ ）。","o":["对强奸未成年人的成年被告人判处刑罚时不得适用缓刑","对于奸淫幼女,致使其感染艾滋病毒的,应认定为强奸致使被害人重伤","对于利用职业便利实施猥亵未成年人犯罪的,人民法院应当依法适用从业禁止","对已满14周岁的未成年女性负有特殊职责的人员,利用优势地位迫使被害人与其发生性关系的以强奸罪定罪"],"a":"BCD","e":"\u0001奸淫幼女致染艾滋病按“致使被害人重伤”论；利用职业便利猥亵未成年人应适用从业禁止；负有特殊职责人员迫使14+少女发生性关系定强奸罪；对成年被告人系“一般不适用缓刑”而非绝不适用。\u0002\nA✗ 《两高两部关于办理性侵害未成年人刑事案件的意见》规定，对强奸未成年人的成年被告人\u0001“一般不适用缓刑”\u0002（并非刑法条文绝无例外地“不得适用缓刑”）\nB✓ 奸淫幼女致其感染艾滋病病毒、梅毒等严重传染性疾病（造成严重后果）的，依法认定为强奸“\u0001致使被害人重伤\u0002”加重情形\nC✓ 对利用职业便利实施猥亵儿童或性侵未成年人犯罪的，法院\u0001应当依法适用从业禁止\u0002（《刑法》第37条之一，禁止从事密切接触未成年人工作）\nD✓ 对已满14周岁未成年女性负有监护、收养、看护、教育、医疗等特殊职责的人员，不仅限于乘人之危自愿，而是\u0001“利用优势地位迫使”\u0002其发生性关系的，直接依处罚更重的\u0001强奸罪\u0002定罪处罚","k":"","kb":35,"kh":[[66,73],[127,141],[170,180],[229,275]]},{"id":"2025-18","y":2025,"t":"单","s":"【案情】甲为自己投保了巨额人身保险，之后在网上物色到与自己年龄、体态、样貌相仿的孙某，将其骗至深山后杀人焚尸，但还未开始申领保险金即被公安机关抓获。\n甲的行为应认定为（ ）。","o":["保险诈骗罪","故意杀人罪","故意杀人罪和保险诈骗罪","故意杀人罪和故意毁坏尸体罪"],"a":"B","e":"\u0001先为自己投巨额人身险，再找体貌相似替身骗至深山杀人焚尸以图骗保，但“还未开始申领保险金即被抓获”，只构成故意杀人罪（焚尸属事后不可罚），尚未着手保险诈骗。\u0002\nA✗ 尚未向保险公司提交理赔申报材料即被警方抓获，并未着手实行骗取保险金行为（至多为保险诈骗预备），不可能单定保险诈骗罪\nB✓ 故意杀人罪：甲故意杀害孙某以图骗保已经构成\u0001故意杀人罪（既遂）\u0002；由于其尚未向保险机构申领理赔即告案发（尚未着手实施骗保），且杀后焚尸属于为毁灭罪证事后不可罚行为，依法仅定故意杀人罪一罪\nC✗ 《刑法》第198条第2款规定“同时构成其他犯罪的数罪并罚”，但前提是保险诈骗本身已进入可追诉的既遂/未遂（或实务以开始向保险人提出虚假理赔申请为着手）；本题明确提示尚未开始申领保险金即被抓，真题定单一故意杀人罪\nD✗ 本人杀人之后将被害人尸体焚烧掩盖罪行（事后不可罚行为），不另成立侮辱/毁坏尸体罪（侮辱尸体罪一般针对非自己所杀他人尸体或另有猥亵侮辱独立恶意）","k":"","kb":78,"kh":[[59,125]]},{"id":"2026-16","y":2026,"t":"单","s":"甲、乙在餐厅吃饭,甲和隔壁桌温某因琐事产生纠纷,发生打斗。甲在击打温某面部过程中,将劝架的李某打成重伤。甲的行为应认定为","o":["不构成犯罪","寻衅滋事罪","过失致人重伤罪","故意伤害罪"],"a":"D","e":"\u0001餐厅打斗欲击打对方温某面部却失手将劝架第三人李某打成重伤，属同一身体健康法益内之打击错误（行为偏差），依法定符合说成立故意伤害罪（重伤）。\u0002\nA✗ 在斗殴击打过程中致劝架人重伤，显然具有刑事可罚性，不属意外或合法防卫\nB✗ 明确因餐厅纠纷针对特定温某发生打斗，而非无事生非任意殴打路人，不成立寻衅滋事罪\nC✗ 按法硕考试通说\u0001法定符合说\u0002，预想伤害对象温某与他人生命健康法益与实际受损对象劝架人李某在刑法构成要件内一致，直接归责为\u0001故意伤害罪\u0002而非降格为过失致人重伤罪\nD✓ 故意伤害罪：意图殴打温某而击中劝架人李某致重伤属于\u0001打击错误（行为偏差）\u0002；依通说法定符合说，甲主观上有伤害他人身体故意且客观造成他人重伤，直接成立\u0001故意伤害罪（既遂）\u0002","k":"","kb":66,"kh":[[23,28]]},{"id":"2026-45","y":2026,"t":"多","s":"甲离婚后结识乙,二人同居。乙长期虐待甲的未成年女儿王某,情节严重, 多次致使王某轻伤。甲对乙的上述行为,视而不见。对于本案,下列说法正确的有","o":["甲的行为构成虐待罪","甲的行为构成故意伤害罪","乙的行为构成虐待罪","乙的行为构成故意伤害罪"],"a":"ACD","e":"\u0001同居伴侣乙长期虐待甲的未成年女儿并多次殴打致其轻伤（虐待罪 + 故意伤害罪），甲作为亲生母亲负有法定监护保护义务，明知却长期视而不见放任构成虐待罪不作为共犯。\u0002\nA✓ 甲作为未成年人王某的亲生母亲，负有法定监护和保护女儿人身安全职责，面对同居人乙长期虐待视而不见不制止，属于以不作为方式成立\u0001虐待罪共犯\u0002\nB✗ 题干侧重甲明知长期日常“虐待”却袖手旁观（不作为容任），并没有证据表明甲与乙共同直接谋划或实施了每一次构成轻伤之伤害故意行为，真题官方答案排除了甲之故意伤害罪共犯\nC✓ 乙与甲长期稳定同居并共同照料生活，与未成年继女王某已形成事实家庭成员关系，其长期打骂折磨幼童情节严重构成\u0001虐待罪\u0002\nD✓ 虐待罪基本行为不包括每次有意造成“轻伤”以上具体身体伤害后果；乙“多次致使王某轻伤”已超出虐待罪一般家庭管教或轻微折磨限度，同时构成\u0001故意伤害罪\u0002","k":"","kb":70,"kh":[[213,244]]}]},{"sub":"民法","name":"知识产权","w":2.4,"L":43,"qs":[{"id":"2005-38","y":2005,"t":"单","s":"根据我国《专利法》的规定,以下发明创造中不能授予专利权的是（ ）。","o":["饮料的配方","转基因大豆的生产方法","疾病治疗仪的制造方法","疾病的预防和治疗方法"],"a":"D","e":"\u0001依《专利法》第25条第1款第3项，疾病的诊断和治疗方法因直接作用于有生命人体且具伦理公益性，不能授予专利权。\u0002\nA✗ 饮料配方属于化学或食品产品配方发明，依法可以申请并授予发明专利权。\nB✗ 转基因大豆等植物品种的“生产方法”可以依照专利法规定授予专利权（仅动植物品种本身不授权）。\nC✗ 用于疾病诊断和治疗的“仪器设备及其制造方法”本身可以授予专利权。\nD✓ 依据《专利法》第25条，科学发现、智力活动规则和方法、疾病的诊断和治疗方法、动物和植物品种等不授予专利权。","k":"","kb":149,"kh":[[60,110]]},{"id":"2005-39","y":2005,"t":"单","s":"甲创作一小说已发表;乙经甲同意,将该小说改编成戏剧剧本,也已发表;丙表演该戏剧并由丁音像公司制作成录像制品出售,丁应（ ）。","o":["只向甲付酬","只向乙付酬","只向丙付酬","向甲、乙、丙付酬"],"a":"D","e":"\u0001录像制品使用了他人改编剧本与现场表演，且剧本又改编自原小说，故丁音像公司制作出售录像制品须向原小说作者甲、剧本改编者乙与表演者丙三方支付报酬。\u0002\nA✗ 乙对改编戏剧剧本及丙对戏剧表演分别享有独立的演绎著作权及邻接权（表演者权），不可遗漏。\nB✗ 使用演绎作品（剧本）同样使用了原小说核心表达，应当同时取得原著作者甲许可并付酬。\nC✗ 录用他人剧作表演不能绕开词曲/剧本创作者。\nD✓ 依据《著作权法》第13条及第42条，制作录像制品使用改编作品并录用表演的，应当取得原小说作者甲、剧本作者乙以及表演者丙的许可并支付报酬。","k":"","kb":147,"kh":[[160,220]]},{"id":"2006-45","y":2006,"t":"单","s":"根据我国专利法规定,实用新型专利权的保护期限为（ ）。","o":["十年","二十年","二十五年","五十年"],"a":"A","e":"\u0001依据《专利法》第42条，实用新型专利权的保护期限始终为十年（自申请日起计算）。\u0002\nA✓ 《专利法》第42条规定：发明专利权的期限为20年，实用新型专利权的期限为10年，均自申请日起计算。\nB✗ 二十年是发明专利权的保护期限，而非实用新型专利权。\nC✗ 二十五年不属于我国《专利法》设定的专利保护年限。\nD✗ 五十年是自然人作者死后或法人作品发表后著作财产权的保护期限。\n【新法提示】2020年修改的《专利法》第42条（2021年6月1日施行）将外观设计专利权期限由10年延长至15年，而发明（20年）与实用新型（10年）期限维持不变。","k":"","kb":149,"kh":[[274,311]]},{"id":"2006-46","y":2006,"t":"单","s":"根据我国著作权法规定,文字作品著作权产生的时间为（ ）。","o":["作品创作时","作品完成时","作品发表时","作品出版时"],"a":"B","e":"\u0001依据我国《著作权法》第2条及实施条例第6条，著作权自“作品创作完成”之日起自动产生，无须登记或发表。\u0002\nA✗ 创作过程中尚在构思草稿、未形成可感知客观表达定型成果时著作权尚未产生。\nB✓ 我国采著作权自动保护原则，文字作品著作权自作品创作完成时自动产生。\nC✗ 未发表的已完成作品同样自完成时即享有完整著作权。\nD✗ 出版与否不影响著作权本身的产生。","k":"","kb":146,"kh":[[50,83]]},{"id":"2007-44","y":2007,"t":"单","s":"根据商标法规定,商标权的保护期限为 （ ）。","o":["10 年","20 年","30 年","50 年"],"a":"A","e":"\u0001依据《商标法》第39条，注册商标的有效期为十年，自核准注册之日起计算（期满可不断续展）。\u0002\nA✓ 注册商标专用权每一次核准有效期限均为10年，不同于著作权（50年）和发明专利（20年）。\nB✗ 20年是发明专利权期限。\nC✗ 30年非商标法期限。\nD✗ 50年是著作权财产权及出版/音像邻接权相关期限。","k":"","kb":150,"kh":[[184,206]]},{"id":"2007-45","y":2007,"t":"单","s":"画家甲将其创作的一幅中国画卖给乙公司,乙公司因此取得 （ ）。","o":["该作品的修改权","该作品的复制权","该作品原件的所有权和展览权","该作品原件的所有权和著作权"],"a":"C","e":"\u0001依《著作权法》第20条，画家出卖美术作品原件，买受人取得的是画作原件的所有权与原件“展览权”，著作权中的修改权、复制权等仍归画家甲。\u0002\nA✗ 修改权等著作人身权永远专属作者，不随画作原件出售而转移。\nB✗ 复制权仍归著作权人甲所有，乙公司不得未经许可印制画册出售。\nC✓ 《著作权法》第20条规定，作品原件所有权的转移不改变作品著作权的归属，但美术、摄影作品原件的展览权由原件所有人享有。\nD✗ 美术作品原件所有权与知识产权相互分离，买画不等于买断全部著作权。","k":"","kb":146,"kh":[[275,323]]},{"id":"2007-46","y":2007,"t":"单","s":"张三受甲厂委托为其开发一种新型节能灯,双方未约定专利申请权归属。其后,张三找来朋友李四帮助自己收集和整理资料。发明完成后,专利申请权属于 （ ）。","o":["张三","甲厂","张三和甲厂","张三和李四"],"a":"A","e":"\u0001受委托研发发明创造未约定申请权归属的，申请专利的权利属于完成发明创造的受托方（张三）；仅辅助收集整理资料的李四并非共同发明人。\u0002\nA✓ 依《专利法》第8条，委托完成的发明创造除另有协议外申请专利权归完成人张三；且李四仅从事资料搜集整理辅助工作、未对发明实质性特点作出创造性贡献，故不成为共同申请权人。\nB✗ 委托人甲厂在未约定的情况下不自动取得专利申请权。\nC✗ 只有合作开发才可能共有申请权，一般委托发明归受托方。\nD✗ 辅助人员李四未作出创造性贡献，不是法律意义上的共同发明人。","k":"","kb":149,"kh":[[188,249]]},{"id":"2008-54","y":2008,"t":"多","s":"根据专利法规定,发明和实用新型取得专利权必须具备的条件有（ ）。","o":["新颖性","创造性","实用性","先进性"],"a":"ABC","e":"\u0001依《专利法》第22条，授予专利权的发明和实用新型应当具备新颖性、创造性和实用性三性要件，并没有“先进性”要求。\u0002\nA✓ 新颖性指不属于现有技术且无抵触申请。\nB✓ 创造性指与现有技术相比具有突出的实质性特点和显著进步（发明）或实质性特点和进步（实用新型）。\nC✓ 实用性指能够制造或者使用，并且能够产生积极效果。\nD✗ 专利审查仅审查相较于现有技术是否“有进步”的创造性，并不要求达到行业最尖端“先进性”。","k":"","kb":149,"kh":[[111,159]]},{"id":"2009-45","y":2009,"t":"单","s":"根据商标法规定,商标权的主体是（ ）。","o":["商标注册人","商标设计人","商标制作人","商标使用人"],"a":"A","e":"\u0001在我国商标注册取得原则下，商标专用权的主体只能是依法提出申请并获国家知识产权局商标局核准注册的“商标注册人”。\u0002\nA✓ 依《商标法》第3条及第4条，经核准注册的商标为注册商标，商标注册人享有商标专用权。\nB✗ 设计人设计出商标图案仅可能享有美术作品著作权，若未注册商标则不享商标权。\nC✗ 印制商标标识的印刷制作人不是商标权主体。\nD✗ 未注册商标使用人原则上仅在特定条件下有先用权抗辩而不享独占注册商标专用权（被许可人亦非商标权人本身）。","k":"","kb":150,"kh":[[184,193]]},{"id":"2009-54","y":2009,"t":"多","s":"根据著作权法规定,邻接权的具体类型包括（ ）。","o":["出版者的权利","表演者的权利","录音制作者的权利","播放者的权利"],"a":"ABCD","e":"\u0001著作权邻接权包括出版者权（版式设计）、表演者权、录音录像制作者权以及广播电台电视台（播放者）权利四大类型。\u0002\nA✓ 图书报刊出版者的版式设计专有权（10年）属于典型邻接权。\nB✓ 演员、歌手等表演者享有的表演者权属于邻接权。\nC✓ 录音及录像制作者对其录制的音像制品享有邻接权。\nD✓ 广播电台、电视台作为节目播放者对其播放的广播电视信号享有邻接权。","k":"","kb":146,"kh":[[375,413],[441,453]]},{"id":"2010-46","y":2010,"t":"单","s":"甲与乙约定:由甲从乙拍摄的照片中选择150 幅,供出版之用。为出版的必要,出版社将甲选出的部分照片作了修剪。出版物封面标明“甲著”,封底标明“乙摄影”。本案中,出版社的行为（ ）。","o":["既侵害乙的保护作品完整权,也侵害乙的署名权","未侵害乙的保护作品完整权,也未侵害乙的署名权","未侵害乙的保护作品完整权,但侵害乙的署名权","侵害乙的保护作品完整权,未侵害乙的署名权"],"a":"D","e":"\u0001出版社虽于封底合理署名“乙摄影”未侵害署名权，但未经作者乙许可擅自将摄影作品修剪裁切破坏其完整构图意境，侵害了乙的保护作品完整权。\u0002\nA✗ 出版物封底已明确标明“乙摄影”，如实体现了乙对照片的作者身份，未侵害署名权。\nB✗ 为出版排版而自行修剪裁切摄影作品构图未征得作者同意，构成歪曲改动作品完整构图，侵害保护作品完整权（注意“为出版的必要修剪”豁免仅限于《著作权法》对文字作品报刊编辑作技术文字删改且仍需护完整，摄影作品直接裁剪一般仍需授权）。\nC✗ 结论刚好相反。\nD✓ 出版社未经同意擅自裁剪摄影照片侵害乙的保护作品完整权，但在封底明确标明了摄影作者乙，未侵害署名权。","k":"","kb":147,"kh":[[48,83]]},{"id":"2010-54","y":2010,"t":"多","s":"下列行为中,侵犯专利权的有（ ）。","o":["为科学研究和实验而使用有关专利的","从代理商处购买专利产品后,转售该产品的","不知情而为生产经营目的制造侵害专利权产品的","在临时通过中国领海的捕鲸船上,使用中国专利技术加工鲸鱼产品的"],"a":"CD","e":"\u0001不知情为生产经营目的“制造”专利产品以及在临时过境外国船舶上“加工产品”（非运输工具自身航行需要）均不适用侵权豁免，构成侵犯专利权。\u0002\nA✗ 专为科学研究和实验而使用有关专利的，依《专利法》第75条第4项不视为侵犯专利权。\nB✗ 从合法代理商处购买合法专利产品后再转售，适用《专利法》第75条第1项“专利权用尽原则”，不视为侵权。\nC✓ 即使不知情，“制造”侵害专利权产品本身就绝对构成侵权（《专利法》第77条的善意免赔抗辩仅适用于“使用、许诺销售、销售”，绝不豁免“制造”与“进口”，且即使可免赔也仍构成侵权）。\nD✓ 依《专利法》第75条第3项，临时通过中国领海的外国运输工具依协议或互惠原则仅限于“为运输工具自身需要”在其装置设备中使用有关专利方不侵权；用于商业加工鲸鱼产品明显超出自身航行机械需要，构成侵权。","k":"","kb":149,"kh":[[388,490]]},{"id":"2011-28","y":2011,"t":"单","s":"工程师甲在本职工作范围内,利用单位的物质技术条件,创作完成了一项由单位承担责任的产品设计图。根据法律规定,下列表述正确的是（ ）。","o":["该设计图的著作权由甲与其所在的单位共同享有","该设计图的著作权归属由甲与其所在单位协商决定","该设计图的著作权由甲享有,甲的单位在业务范围内有两年优先使用权","该设计图由甲享有署名权,由甲的单位享有著作权的其他权利"],"a":"D","e":"\u0001本职工作中主要利用单位物质技术条件创作且由单位承担责任的产品设计图属于《著作权法》第18条第2款特殊职务作品，作者仅享署名权，其余著作权由单位享有。\u0002\nA✗ 特殊职务作品除署名权外其余著作权全归单位，并非与作者共同共有。\nB✗ 本职且主要利用单位条件并由单位担责的工程/产品设计图适用法定权属分配。\nC✗ 作者享有全部著作权、单位仅享2年业务优先使用权的是“一般职务作品”（第18条第1款），而题干明示“利用单位物质技术条件、由单位承担责任的产品设计图”正是第2款特殊职务作品。\nD✓ 完全契合《著作权法》第18条第2款：工程设计图、产品设计图等职务作品，作者享有署名权，著作权的其他权利由法人或者非法人组织享有（单位可给予作者奖励）。","k":"","kb":146,"kh":[[191,251]]},{"id":"2011-29","y":2011,"t":"单","s":"甲为撰写毕业论文,复印了某杂志上的一篇文章作为参考。甲的这一行为属于（ ）。","o":["法定许可使用行为","侵权行为","合理使用行为","强制许可使用行为"],"a":"C","e":"\u0001为个人学习、研究或者欣赏，复印使用他人已经公开发表的一篇期刊文章供自己写毕业论文参考，属于典型合理使用（无须许可也无须付酬）。\u0002\nA✗ 法定许可须用于报刊转载、教材编写等法定商业/公共出版传播并支付报酬。\nB✗ 符合个人学习研究之法定豁免边界，不侵权。\nC✓ 依《著作权法》第24条第1款第1项，为个人学习、研究或者欣赏，使用他人已经发表的作品，构成合理使用。\nD✗ 我国著作权法原则上不设专利意义上的“强制许可”。","k":"","kb":148,"kh":[[55,95]]},{"id":"2011-30","y":2011,"t":"单","s":"下列行为中,构成侵犯专利权的是（ ）。","o":["专为科学研究和实验而使用有关专利","购买合法销售的专利产品后再转卖给他人","临时过境的运输工具依互惠原则为自身需要在其设备中使用有关专利","为生产经营目的使用不知道是未经专利人许可而制造并售出的专利产品"],"a":"D","e":"\u0001依《专利法》第77条，为生产经营目的使用不知是未获许可制造售出专利产品的，虽能证明合法来源可免除“赔偿责任”，但行为本身仍构成侵犯专利权（须停止使用）。\u0002\nA✗ 专为科研实验使用依法不视为侵犯专利权。\nB✗ 购入合法销售产品再转卖适用权利用尽原则，不侵权。\nC✗ 临时过境交通工具按互惠原则为其自身装置需要在设备中使用专利，依法不视为侵权。\nD✓ 即使善意不知情且能证明合法来源，为生产经营目的未经许可“使用”专利侵权产品的，客观上仍然构成侵犯专利权（《专利法》第77条仅免除善意使用/销售者的“赔偿责任”，不改变侵权性质，且仍应承担停止侵害责任）。","k":"","kb":149,"kh":[[490,537]]},{"id":"2011-32","y":2011,"t":"单","s":"下列选项中,可以作为商标注册的是（ ）。","o":["“锐利”牌剪刀","“耐穿”牌皮鞋","“蝴蝶”牌缝纫机","“精粉”牌馒头"],"a":"C","e":"\u0001任意性商标“蝴蝶”用在缝纫机上与商品自身功能原材料特性毫无直接关联，具有高度显著性可注册；“锐利”剪刀、“耐穿”皮鞋、“精粉”馒头均直接叙述商品特性质量。\u0002\nA✗ “锐利”直接表示剪刀的功能特点，缺乏显著特征。\nB✗ “耐穿”直接表示皮鞋的耐用质量特点，不可注册。\nC✓ “蝴蝶”与缝纫机功能、品质毫无直接描述关系，属任意性标志，显著性强，可以作为商标注册。\nD✗ “精粉”直接表示馒头的主要原料成分，不得注册。","k":"","kb":150,"kh":[[207,245],[282,289]]},{"id":"2012-33","y":2012,"t":"单","s":"甲创作的话剧剧本《秋日的私语》于2009年发表，乙话剧团经甲许可获得该剧本的表演权。2010年丙话剧团也欲使用该剧本演出，丙话剧团（ ）。","o":["应经甲许可并支付报酬","应经乙话剧团许可并支付报酬","无须经甲或乙话剧团许可,但须向甲支付报酬","应经甲与乙话剧团共同许可,并向甲、乙话剧团支付报酬"],"a":"A","e":"\u0001乙话剧团仅获得甲剧本的普通表演权，并无转授权他人排演权利；丙话剧团欲演出同一剧本必须直接取得原作者甲的许可并向甲支付报酬。\u0002\nA✓ 普通或一般表演权授权只许可被许可方自己演出，丙话剧团另行排演该剧本仍应依法向原著作权人甲请求许可并支付报酬。\nB✗ 乙话剧团仅仅是受许可演出人（并非剧本著作权继受人或经授权可再转许可的专有独占方），丙找乙许可无效。\nC✗ 戏剧演出公开商业表演剧本不属于著作权法上的法定许可情形（注意现行法原第37条第1款关于“他人已发表作品表演可只付酬不经许可”早已在2001/2010《著作权法》修订中删除，现一律必须先经许可并付酬）。\nD✗ 无须取得前手普通被许可人乙话剧团的同意与双份报酬。","k":"","kb":147,"kh":[[221,265]]},{"id":"2012-34","y":2012,"t":"单","s":"下列选项中,属于邻接权客体的是（ ）。","o":["计算机软件","即兴演讲","具有独特造型的建筑物","瑜伽录像制品"],"a":"D","e":"\u0001瑜伽录像制品（未达视听作品独创性高度而单纯记录动作过程）受录像制作者权即“邻接权”保护；软件、即兴演讲与独特建筑均为著作权作品客体。\u0002\nA✗ 计算机软件属于《著作权法》第3条明确列举的著作权作品客体。\nB✗ 即兴演讲属于口述作品，为著作权客体。\nC✗ 具有独特造型的建筑物属于建筑作品，为著作权客体。\nD✓ 录像制品保护的是录像制作者在录制加工过程中的劳动与投资利益，属于《著作权法》第四章规定的邻接权客体。","k":"","kb":146,"kh":[[397,440]]},{"id":"2012-35","y":2012,"t":"单","s":"在发明专利申请文件中,确定专利权保护范围的主要依据是（ ）。","o":["说明书","说明书摘要","请求书","权利要求书"],"a":"D","e":"\u0001依《专利法》第64条第1款，发明或者实用新型专利权的保护范围以“权利要求”的内容为准，说明书及附图可以用于解释权利要求的内容。\u0002\nA✗ 说明书仅用来清楚完整地说明发明内容并“解释”权利要求，本身不直接划定排他边界。\nB✗ 说明书摘要仅作技术情报检索概述使用，不具有法律效力。\nC✗ 请求书载明申请人、发明名称等形式事项，不界定技术保护边界。\nD✓ 完全符合《专利法》第64条规定：发明或实用新型专利权保护范围以其权利要求的内容为准。","k":"","kb":149,"kh":[[313,334]]},{"id":"2012-36","y":2012,"t":"单","s":"甲与乙均为丙研究所的工作人员,二人受丁公司委托利用业余时间合作研发了一种新型电池,各方未就专利申请权的归属作出约定。该发明的专利申请权应属于（ ）。","o":["甲与乙","丙研究所","甲、乙和丙研究所","丁公司"],"a":"A","e":"\u0001甲乙虽在丙研究所任职，但是利用“业余时间”接受外单位丁公司委托研发且未主要利用丙研究所物质技术条件，与丙无关；又未与丁约定归属，依受托规则归完成人甲与乙。\u0002\nA✓ 研发既未在丙研究所本职工作中作出、也未利用丙的物质技术条件，不属于丙的职务发明；按委托开发未约定归属原则（《专利法》第8条），专利申请权归实际完成人甲与乙共有。\nB✗ 题干明确系业余时间接受外部委托独立研发，不构成所在单位丙研究所的职务发明。\nC✗ 丙研究所既非委托人也未投入科研条件，不共享专利申请权。\nD✗ 委托开发合同对申请专利权归属未作约定的，申请专利的权利属于研究开发人即受托方甲与乙，而非委托人丁公司。","k":"","kb":149,"kh":[[188,233]]},{"id":"2012-37","y":2012,"t":"单","s":"根据我国商标法的规定,注册商标的有效期为10年,其起算点为（ ）。","o":["商标公告之日","商标核准注册之日","申请人提出商标注册申请之日","商标局收到商标注册申请之日"],"a":"B","e":"\u0001依《商标法》第39条，注册商标的有效期为十年，起算点为“核准注册之日”（区别于专利权自申请日起算）。\u0002\nA✗ 公告之日（初步审定公告供异议或注册公告）均不是有效期的法律起算基准（注册公告当日实质对应核准注册，但法条严格写明“自核准注册之日起计算”）。\nB✓ 《商标法》第39条明文规定：注册商标的有效期为十年，自核准注册之日起计算。\nC✗ 申请日期仅确立商标申请先后（申请在先原则）及专利权期限起算点，非商标有效期起算日。\nD✗ 收到申请日亦为决定申请日之程序节点而非有效期起算点。","k":"","kb":150,"kh":[[184,206]]},{"id":"2013-37","y":2013,"t":"单","s":"下列申请注册的商标,不符合我国商标法规定的是（ ）。","o":["“仙山”牌药品商标","“奔月”牌电脑商标","“耐用”牌家具商标","“暖阳”牌毛巾商标"],"a":"C","e":"\u0001“耐用”牌直接描述了家具的质量与使用寿命特征，依《商标法》第11条第1款第2项属于仅直接表示商品质量、特点的标志，缺乏显著性不能作为商标注册。\u0002\nA✗ “仙山”与药品本身特点无直接描述关系，具有显著性。\nB✗ “奔月”用在电脑上属于任意性想象商标，完全可以注册。\nC✓ “耐用”系家具的通用质量特征描述词，缺乏区分商品来源的显著特征，不得作为商标注册（除非通过长期使用获得第二含义）。\nD✗ “暖阳”与毛巾商品本质无关，具有固有显著特征可注册。","k":"","kb":150,"kh":[[207,252],[302,323]]},{"id":"2013-38","y":2013,"t":"单","s":"甲创作了一首歌曲,乙经甲授权后演唱并将该首歌曲收录在由丙公司为其录制的唱片中。丁网站未经任何人许可,擅自将该唱片中的所有歌曲上传供网民免费下载。根据我国著作权法规定,丁网站 （ ）。","o":["侵犯了甲、乙的发表权","侵犯了乙、丙的播放权","侵犯了甲、乙、丙的复制权","侵犯了甲、乙、丙的信息网络传播权"],"a":"D","e":"\u0001唱片已收录歌曲并向公众发行，丁网站未经曲词作者甲、演唱表演者乙及唱片录音制作者丙许可，擅自上传供网民免费选点下载，同时侵害三方的“信息网络传播权”。\u0002\nA✗ 歌曲已经灌制唱片并公开发行，发表权已经一次用尽，未再侵害发表权。\nB✗ 播放权并非《著作权法》规定的法定专有权利名目，网络点播下载适用的是信息网络传播权。\nC✗ 题干侧重面向大众上传互联网“供网民下载”（在选定时间地点获得作品），精准对应《著作权法》规定的信息网络传播权。\nD✓ 依《著作权法》第10、39、44条，丁网站未经词曲作者甲、表演者乙与录音制作者丙许可擅自上传歌曲供公众点播下载，一并侵害三方的信息网络传播权。","k":"","kb":147,"kh":[[84,139]]},{"id":"2015-34","y":2015,"t":"单","s":"甲在《雾都》杂志发表了一部小说,未作版权声明。某读者阅读后十分喜欢,遂推荐给《传奇文摘》杂志社。《传奇文摘》杂志社若转载该小说,则（ ）。","o":["不必经甲同意,但应向甲支付稿酬","必须经甲同意,但不必向甲支付稿酬","不必经《雾都》杂志社同意,但应向其支付稿酬","必须经《雾都》杂志社同意,但不必向其支付稿酬"],"a":"A","e":"\u0001作品在报刊刊登后未作禁止转载声明，其他报刊杂志社转载或者文摘刊登的，依法适用《著作权法》第35条报刊转载“法定许可”：无须甲同意，但应向甲支付稿酬。\u0002\nA✓ 完全符合《著作权法》第35条第2款规定：《传奇文摘》杂志社转载《雾都》杂志已刊发且未附禁止转载声明的小说，无须事先征得作者甲同意，但必须依法向作者甲支付稿酬并标明出处。\nB✗ 正好将法定许可“免许可但付酬”的规则完全倒置。\nC✗ 报刊转载法定许可支付稿酬的对象是著作权人作者甲本人，而不是原首刊杂志社《雾都》。\nD✗ 原刊杂志社不享有小说实质著作权（除非另有专有许可或禁止转载约定），无需经其许可。","k":"","kb":148,"kh":[[206,292]]},{"id":"2016-30","y":2016,"t":"单","s":"甲购得某画家创作的一幅油画。根据我国著作权法,甲获得该作品的（ ）。","o":["著作权","复制权","修改权","原件展览权"],"a":"D","e":"\u0001买受人甲购买油画原件后取得的是该油画原件所有权和基于《著作权法》第20条享有的原件“展览权”，著作权人身与财产诸权利仍归画家。\u0002\nA✗ 画作原件买卖不转移油画著作权本身。\nB✗ 复制权归原画家所有，购画人不可擅自翻印复制画作贩卖。\nC✗ 修改权属著作人身权，禁止买受人擅改画家画作。\nD✓ 依据《著作权法》第20条，美术、摄影作品原件的所有权转移后，该美术作品原件的“展览权”由原件所有人甲依法享有。","k":"","kb":146,"kh":[[275,323]]},{"id":"2016-47","y":2016,"t":"多","s":"下列行为中,构成侵犯商标权的有（ ）。","o":["甲销售伪造的注册商标标识","乙擅自制造他人注册商标标识","丙未经商标注册人同意,更换其注册商标并将该更换商标的商品又投入市场","丁在类似商品上,将与他人注册商标近似的标志作为商品装潢使用,误导公众"],"a":"ABCD","e":"\u0001《商标法》第57条规定：销售或擅自制造伪造注册商标标识、反向假冒更换商标重投市场、在类似商品上将近似商标作装潢误导公众，全部构成侵犯注册商标专用权。\u0002\nA✓ 销售伪造、擅自制造的注册商标标识属于法定商标侵权行为（第57条第4项）。\nB✓ 未经许可擅自制造他人注册商标标识同样构成侵害注册商标专用权（第57条第4项）。\nC✓ 未经商标注册人同意更换其注册商标并将更换后的商品又投入市场的（反向假冒），直接构成第57条第5项商标侵权。\nD✓ 在相同或类似商品上将与他人注册商标相同或近似的标志作为商品名称或商品装潢使用误导公众的，依《商标法实施条例》第76条亦认定为商标侵权行为。","k":"","kb":150,"kh":[[349,422]]},{"id":"2018-23","y":2018,"t":"单","s":"甲在报纸上发表了一篇时事性文章,未声明不允许其他媒体刊登,乙杂志社未经甲同意予以转载且未支付报酬。乙杂志社的行为不构成侵权的法律依据是（ ）。","o":["许可使用","法定许可","强制许可","合理使用"],"a":"D","e":"\u0001报刊、期刊、广播电视等媒体刊登或播报其他媒体已发表的关于政治、经济、宗教问题的“时事性文章”（未禁转），既无须作者许可亦无须付酬，依据为《著作权法》第24条合理使用。\u0002\nA✗ 未经甲同意而合法刊登显然不属于意定许可使用。\nB✗ 法定许可须“支付报酬”，本案“未支付报酬”依然不侵权，由此一举排除法定许可（注意小说、文学作品文摘走法定许可要付酬，时事性文章走合理使用免付酬！）。\nC✗ 著作权中无此强制许可制度。\nD✓ 依据《著作权法》第24条第1款第5项，媒体转载其他媒体已经发表的关于政治、经济、宗教问题的时事性文章（作者未声明禁转），无须许可亦无须支付报酬，属于合理使用。","k":"","kb":148,"kh":[[97,179]]},{"id":"2019-36","y":2019,"t":"单","s":"作家甲的私人书信被乙收藏。对此,下列选项正确的是（ ）。","o":["书信著作权和书信原件所有权均归甲","书信著作权和书信原件所有权均归乙","书信著作权归甲,书信原件所有权归乙","书信著作权归乙,书信原件所有权归甲"],"a":"C","e":"\u0001私人书信同样体现物权与知识产权分离原理：收藏人乙依法拥有信纸原件的物权所有权，而作为文字作品的书信著作权（含发表权等）仍归作家甲所有。\u0002\nA✗ 信件实物纸张既然合法转交并被乙收藏，该纸面物权原件所有权已归乙。\nB✗ 收藏信纸不代表买断作家书写文字作品的著作权，乙不得擅自将甲的私人书信结集公开出版。\nC✓ 依《著作权法》第20条精神，作品原件所有权移转不改变著作权归属：私人书信原件所有权归收藏人乙，而文字内容著作权依然属于作家甲。\nD✗ 权利归属刚好颠倒。","k":"","kb":146,"kh":[[324,353]]},{"id":"2019-38","y":2019,"t":"单","s":"甲汽车公司委托乙建筑设计公司设计4S店, 合同未约定著作权条款。后丙汽车公司请人仿照甲公司的这家4S店建造了一家汽车美容店,并办理了著作权登记。丙公司侵犯了（ ）。","o":["甲公司的复制权","乙公司的复制权","甲公司的商誉权","乙公司的版式设计权"],"a":"B","e":"\u0001乙建筑设计公司受甲公司委托设计4S店建筑设计图（未约著作权归属），依第19条著作权归受托人乙公司；丙公司仿照该独特建筑施工建造实体店面侵害乙公司的“复制权”。\u0002\nA✗ 甲公司系委托人且未在合同中约定归委托方，因此甲不享有建筑作品著作权（不能代替乙维权复制权）。\nB✓ 受委托创作的建筑设计作品未约定著作权归属时归受托人乙设计公司；依《著作权法》第10条第5项，按照建筑设计图立体建成建筑物或者仿造该建筑物均属于对建筑作品的“复制”行为，故丙公司未经许可仿造侵害乙公司的复制权。\nC✗ 与商业信誉无涉，且甲不是该作品著作权人。\nD✗ 版式设计权是图书报刊出版者对其印刷排版设计的邻接权，不适用于建筑实体建造模仿。\n记法：建筑版权经典双考点：①委托设计图未约归受托方；②“按图盖楼/按楼仿建”均属侵犯“复制权”！","k":"","kb":146,"kh":[[84,98],[123,143]]},{"id":"2019-50","y":2019,"t":"多","s":"下列知识产权中,对其法律保护没有时间限制的有（ ）。","o":["甲公司的保密除虫剂配方","乙制作的电影《问道昆仑》","丙企业的驰名商标“云南白药及图”","丁行业协会的“阳澄湖大闸蟹”地理标志"],"a":"AD","e":"\u0001在广义知识产权保护客体中，商业秘密（只要持续保密便永不过期）与地理标志（随地域品质长期存续）无固定法定保护期限；电影作品与注册商标均有固定期限（商标虽可续展但单期10年）。\u0002\nA✓ 商业秘密不以向社会公开换取有限垄断期，只要甲公司一直妥善采取保密措施不外泄，保密除虫剂配方的商业秘密保护期就没有时间限制。\nB✗ 视听/电影作品的著作财产权保护期限为50年（自首次发表日或创作完成日起算）。\nC✗ 注册商标即便获评驰名商标，每次核准有效期依然是10年，届满需依法办理续展方可延续，并非天然无期限保护。\nD✓ 地理标志保护自然人文地域特色产品声誉，只要该特色地理标志条件持续存在，其法律保护没有固定的到期届满时间限制。","k":"","kb":150,"kh":[[101,167]]},{"id":"2020-37","y":2020,"t":"单","s":"我国专利法对发明和实用新型采用的新颖性标准是（ ）。","o":["绝对新颖性标准","绝对新颖性为主,相对新颖性为补充","相对新颖性标准","相对新颖性为主,绝对新颖性为补充"],"a":"A","e":"\u0001自2008年《专利法》第三次修改以来，我国对发明和实用新型的新颖性全面采用“绝对新颖性标准”（即在全球范围内既未公开出版过也未通过公开使用或其他方式为公众所知）。\u0002\nA✓ 依据现行《专利法》第22条第2款，现有技术是指申请日以前在“国内外为公众所知”的技术，故我国统一采取绝对新颖性标准（取消了2008年前使用公开仅限国内的混合/相对标准）。\nB✗ 旧法曾采以出版物绝对标准为主、使用公开相对标准为辅的混合标准，2008年修法已彻底改为全面绝对新颖性。\nC✗ 我国现行法明确以全球“国内外公开”为准，非仅看国内之相对标准。\nD✗ 表述不实。","k":"","kb":149,"kh":[[111,140]]},{"id":"2021-32","y":2021,"t":"单","s":"根据我国《专利法》规定,外观设计专利权的保护范围（ ）。","o":["以申请文件的内容为准","以表示在图片或者照片中的该产品的外观设计为准","以权利要求的内容为准","以说明书记载的内容为准"],"a":"B","e":"\u0001依《专利法》第64条第2款，外观设计专利权的保护范围以“表示在图片或者照片中的该产品的外观设计”为准（简要说明可用于解释图片或照片）。\u0002\nA✗ 申请文件笼统包含请求书、缴费等全部材料，不精确划定边界。\nB✓ 《专利法》第64条第2款明文规定：外观设计专利权的保护范围以表示在图片或者照片中的该产品的外观设计为准。\nC✗ 外观设计专利根本不提交“权利要求书”（权利要求书仅用于发明与实用新型）。\nD✗ 发明和实用新型才提交说明书；外观设计只附图片照片及简要说明。","k":"","kb":149,"kh":[[335,361]]},{"id":"2021-33","y":2021,"t":"单","s":"甲受所在单位委托,创作了雕塑《峰》。乙在拍卖会上购得该雕塑后,捐赠给某高校。雕塑《峰》的著作权人是（ ）。","o":["甲的所在单位","某高校","甲","乙"],"a":"C","e":"\u0001甲受单位委托创作非为完成本职工作任务之雕塑作品《峰》，双方未就著作权归属作约定，依第19条著作权归受托作者甲；乙购得原件并捐赠高校仅移转物权及原件展览权。\u0002\nA✗ 注意题目表述为“受所在单位委托”而非完成单位工作任务的职务作品，依《著作权法》第19条委托创作未约归属时著作权归受托人甲，而非委托单位。\nB✗ 高校因受赠取得雕塑原件所有权及展览权，但未取得雕塑作品的著作权。\nC✓ 受托创作未约定著作权归属时由受托作者甲享有著作权，后续拍卖与捐赠仅流转了雕塑“原件所有权”与展览权，不影响甲的著作权人地位。\nD✗ 乙竞拍买得雕塑曾拥有原件物权，从未取得著作权。","k":"","kb":146,"kh":[[99,107],[123,143]]},{"id":"2021-50","y":2021,"t":"多","s":"下列选项中,可以作为台灯注册商标的有","o":["“照明”牌","“轻风”牌","“金榜”牌","“护眼”牌"],"a":"BC","e":"\u0001“照明”牌与“护眼”牌直接描述了台灯本身的功能与主要用途特点，缺乏显著特征不可注册；“轻风”牌与“金榜”牌属任意性商标与台灯无直接功能联系，可以注册。\u0002\nA✗ “照明”直接说明了台灯的核心使用功能与用途，缺乏显著性，不能注册为台灯商标。\nB✓ “轻风”与台灯照明属性毫不相关，具备极强固有显著特征，可以注册。\nC✓ “金榜”带有美好寓意而非台灯材质或功能直接描述词，具显著性可以注册。\nD✗ “护眼”直接描述了现代护眼台灯的主要功能与质量宣称特点，依法不得作为台灯注册商标。","k":"","kb":150,"kh":[[253,301]]},{"id":"2022-27","y":2022,"t":"单","s":"W公司(国有独资公司)和X设计院签订了技术咨询合同。受托方X设计院在履行合同过程中,利用W公司提供的技术资料和工作条件完成了一项新的技术成果。双方对此类新技术成果归属未作约定,该成果依法属于","o":["X设计院","W公司","X设计院和W公司","国家"],"a":"A","e":"\u0001依据《民法典》第879条（技术咨询与服务合同），受托方在履行咨询合同过程中利用委托人提供的技术资料和工作条件完成新的技术成果，未作约定的，属于受托人（X设计院）。\u0002\nA✓ 依据《民法典》第879条第1款，在技术咨询合同履行过程中，受托人利用委托人提供的技术资料和工作条件完成的新的技术成果，没有约定归属的，依法属于受托人（X设计院）；反之委托人利用受托人成果完成新成果才归委托人。\nB✗ 尽管W公司提供了资料和条件，技术咨询合同法定兜底归属于实际做出创造研发的受托人。\nC✗ 不实行双方共有（区别于合作开发共有原则）。\nD✗ 国有独资公司参与技术市场平等交易，无权直接归属国家。","k":"","kb":149,"kh":[[250,271]]},{"id":"2022-38","y":2022,"t":"单","s":"著作权人以有线或者无线方式向公众提供作品,使公众可以在其选定的时间和地点获得作品的权利是","o":["展览权","发行权","广播权","信息网络传播权"],"a":"D","e":"\u0001著作权人以有线或无线方式向公众提供作品，使公众可以在其“个人选定的时间和地点”获得作品（交互式网络传播），该权利为信息网络传播权。\u0002\nA✗ 展览权指公开陈列美术、摄影作品原件或者复制件。\nB✗ 发行权指以出售或者赠与方式向公众提供作品原件或者复制件，针对有形物理载体流转。\nC✗ 广播权是单向同步有线无线公开播送，受众不能自己自由点播选时间地点。\nD✓ 完全对应《著作权法》第10条第1款第12项信息网络传播权的法定定义（核心识别词：“选定的时间和地点”）。","k":"","kb":147,"kh":[[84,111]]},{"id":"2022-47","y":2022,"t":"多","s":"下列选项中,属于知识产权客体的有","o":["地理标志","植物新品种","商业秘密","集成电路布图设计"],"a":"ABCD","e":"\u0001依据《民法典》第123条第2款明文列举，知识产权包括作品、发明实用新型外观设计、商标、地理标志、商业秘密、集成电路布图设计、植物新品种以及法律规定的其他客体。\u0002\nA✓ 地理标志是《民法典》第123条明确列明的知识产权保护客体。\nB✓ 植物新品种是法定的知识产权客体。\nC✓ 商业秘密受《反不正当竞争法》与《民法典》第123条保护，属于知识产权客体。\nD✓ 集成电路布图设计同样被《民法典》第123条明文纳入知识产权客体范围。","k":"","kb":150,"kh":[[55,100]]},{"id":"2023-49","y":2023,"t":"多","s":"【案情】A公司委托B公司为其推出的新车制作视频广告，并同意B公司与C公司合作完成委托事项。C公司邀请演员赵某出演该视频广告。C公司制作完成后，B公司对该广告稍加改动交给A公司，A公司未严格审核即在网络上公开发布。不久，大学生王某发现，该视频广告中采用的文案与自己公开发表的文章内容相同，但视频广告中并未标明。\n王某受到侵害的权利有","o":["发表权","署名权","摄制权","信息网络传播权"],"a":"BCD","e":"\u0001视频广告抄袭了王某已经公开发表过的文章文案：发表权已因先前公开而一次用尽故未受侵害；未经许可使用、拍摄并发布上网，侵害了王某的署名权、摄制权与信息网络传播权。\u0002\nA✗ 题干已写明该文章系王某自己“公开发表的文章”，发表权系一次性权利，发表后即告用尽，故未侵害发表权。\nB✓ 视频广告中使用王某文章文案却完全未标明王某作者姓名，直接侵害了王某的署名权。\nC✓ 擅自将文字作品作为台词文案拍摄制作成广告视频固定于载体，侵犯了著作权人以摄制视听作品方式使用作品的“摄制权”。\nD✓ 最终将该侵权视频公开发布于网络上供公众浏览点播，侵犯了王某的信息网络传播权。","k":"","kb":147,"kh":[[266,311]]},{"id":"2023-50","y":2023,"t":"多","s":"【案情】A公司委托B公司为其推出的新车制作视频广告，并同意B公司与C公司合作完成委托事项。C公司邀请演员赵某出演该视频广告。C公司制作完成后，B公司对该广告稍加改动交给A公司，A公司未严格审核即在网络上公开发布。不久，大学生王某发现，该视频广告中采用的文案与自己公开发表的文章内容相同，但视频广告中并未标明。\n应当对王某承担侵权责任的有","o":["A公司","B公司","C公司","赵某"],"a":"ABC","e":"\u0001受托制作并侵权实施文案拍片、改稿移交与未审核即上网公开发布的委托方及两级受托广告制作企业均参与侵害王某著作权，应当承担侵权责任；单纯受邀出演的演员赵某无过错不担责。\u0002\nA✓ 广告委托方与最终网络公开发布方未尽严格版权审查义务即发布侵权广告，直接侵害信息网络传播权等，应承担侵权责任。\nB✓ 中间承揽总包方对收受的广告片进行修改后交付公开发布而未注明来源，参与了侵权制作传递链条，应担责。\nC✓ 具体统筹拍摄制作涉案侵权广告文案视频的公司直接侵害摄制权、署名权，应承担侵权责任。\nD✗ 演员赵某仅受邀依剧本广告词出演，无审查文案版权源头之能力或决定发布权限，非著作权直接侵权行为人，无须对王某担责。","k":"","kb":147,"kh":[[312,345]]},{"id":"2024-23","y":2024,"t":"单","s":"某公司利用人工智能技术,生成虚拟歌手X。并将X演唱甲的成名歌曲的音频上传到互联网。该歌曲系由乙作词作曲。该公司的行为（ ）。","o":["侵害甲的著作权","侵害乙的著作权","系合理使用,不构成侵权","系法定许可,不构成侵权"],"a":"B","e":"\u0001利用AI生成虚拟歌手翻唱成名歌曲并上传网络供公众收听，并未征得原词曲作者乙许可，侵害了歌曲词曲作者乙的著作权（而原唱歌手甲仅是表演者而非歌曲词曲著作权人）。\u0002\nA✗ 甲只是该歌曲的原唱歌手，享有的是针对自身原声演出的邻接权（表演者权），对歌曲词曲本身并不享有著作权；且系由虚拟歌手声线翻唱并未直接复制甲原录音。\nB✓ 词曲作者乙对涉案音乐作品享有完整的词曲著作权（含信息网络传播权及改编/复制权），该公司未经许可即用AI翻唱并上传网传，直接侵害了词曲作者乙的著作权。\nC✗ 商业公司利用人工智能翻唱流行音乐公开传播上网不属于《著作权法》第24条规定的个人欣赏、教学科研等合理使用。\nD✗ 将录音音频上传互联网供网络传播不适用录音制品法定许可（录音法定许可仅限于使用他人合法录制为录音制品的音乐作品“制作新录音制品”，不包括信息网络传播权）。","k":"","kb":146,"kh":[[108,122]]},{"id":"2025-38","y":2025,"t":"单","s":"甲向乙借款2 万元,制作了一部网络微电影,同时利用拍摄过程中收集的素材,剪辑制作了一部纪录片。对此,下列说法正确的是（ ）。","o":["网络微电影属于视听作品,甲享有著作权","网络微电影属于摄影作品,甲和乙共同享有著作权","纪录片属于摄影作品,甲享有著作权","纪录片属于视听作品,甲和乙共同享有著作权"],"a":"A","e":"\u0001网络微电影与剪辑纪录片均为摄制在一定介质上由连续画面伴音构成的“视听作品”；乙仅出借2万元给甲未参与创作，故著作权归实际制作创作者甲个人单独享有。\u0002\nA✓ 现行《著作权法》已将原“电影作品和以类似摄制电影的方法创作的作品”统一并称为“视听作品”，网络微电影与纪录片均属视听作品；甲独立借款并筹拍剪辑完成作品，乙仅仅是出借资金的债权人而非合作作者，著作权由甲单独享有。\nB✗ 连续画面作品是视听作品而非静态摄影作品；且债权人乙不共享著作权。\nC✗ 纪录片同样由动态连续画面构成，属于视听作品而非摄影作品。\nD✗ 借钱赞助资金方乙未实施独创性创作行为，不取得共同著作权。","k":"","kb":146,"kh":[[50,83]]},{"id":"2026-29","y":2026,"t":"单","s":"A 服装公司与B 公司签订商标普通使用许可合同,许可B 公司使用A 公司的注册商标。C 公司大量购入B 公司生产的服装,将商标更换为自己的商标后对外销售。对此,下列说法正确的是","o":["A 公司有权请求C 公司采取召回措施","B 公司有权请求C 公司赔偿损失","C 公司的行为侵害A 公司的注册商标专用权","C 公司的行为构成对A 公司商业标识的仿冒"],"a":"C","e":"\u0001购入他人正品服装后撕换注册商标以自己商标出售构成“反向假冒”，依《商标法》第57条第5项直接侵害注册商标专用权人（第一家服装公司）的商标权；普通被许可方无权单独起诉。\u0002\nA✗ 反向假冒销售的本身系购自正牌被许可方的正品服装（并未涉危及人身安全的缺陷假劣商品），权利人无权强制采取产品召回措施，而应请求停止侵害、赔偿损失等。\nB✗ 最高法商标司法解释明确：普通使用许可合同的被许可人原则上“无权独立提起侵权诉讼”请求赔偿损失（仅在商标注册人明确授权时才可）。\nC✓ 依据《商标法》第57条第5项，未经商标注册人同意，更换其注册商标并将该更换商标的商品又投入市场的“反向假冒”行为，依法直接构成对原商标注册人注册商标专用权的侵害。\nD✗ 反向假冒与仿冒恰相反：一般假冒是用他人牌子卖自己货，反向假冒是撤掉别人真牌换贴自己牌子阻断品牌商誉积累，属法定注册商标侵权专条规制行为。","k":"","kb":150,"kh":[[390,455]]},{"id":"2026-46","y":2026,"t":"多","s":"甲系某科研机构研究员,为完成单位规定的科研任务,2024 年撰写5 篇学术论文,已发表3 篇。对此,说法正确的有","o":["5 篇论文均为职务作品","对于已发表的3 篇,甲享有修改权","对于未发表的2 篇,甲不享有著作权","对于已发表的3 篇,甲所在单位有权在其业务范围内优先使用"],"a":"ABD","e":"\u0001科研员为完成单位工作任务撰写的5篇学术论文均属一般职务作品，著作权归作者甲享有（含未发表2篇著作权和已发表修改权等），单位依法享有业务范围内2年优先使用权。\u0002\nA✓ 《著作权法》第18条规定，自然人为完成法人或者非法人组织工作任务所创作的作品是职务作品；5篇论文均因完成单位科研任务撰写，全部属于职务作品。\nB✓ 一般职务作品的完整著作权（包括修改权、署名权等著作人身权和财产权）均由作者甲本人享有。\nC✗ 著作权自作品创作完成时自动产生，尚未发表的2篇论文著作权同样由作者甲完整享有。\nD✓ 《著作权法》第18条第1款明确赋予单位对一般职务作品在其业务范围内享有优先使用的权利（作品完成两年内，未经单位同意，作者不得许可第三人以与单位使用的相同方式使用该作品）。","k":"","kb":146,"kh":[[144,190]]}]},{"sub":"刑法","name":"分则·妨害社会管理秩序罪","w":2.2,"L":41,"qs":[{"id":"2005-19","y":2005,"t":"单","s":"下列行为,不属于妨害公务罪的行为是（ ）。","o":["甲以暴力、威胁方法阻碍工商行政管理机关工作人员依法查处伪劣商品的行为","乙以暴力、威胁方法阻碍国有公司经理依法履行组织生产经营职责的行为","丙以暴力、威胁方法阻碍市人大代表依法执行代表职务的行为","在发生重大洪灾中,丁以暴力、威胁方法阻碍红十字会工作人员依法履行防疫职责的行为"],"a":"B","e":"\u0001妨害公务罪保护对象是国家机关工作人员、各级人大代表、突发事件中的红十字会工作人员（及国安公安执法）；国有公司经理并非国家机关工作人员，阻碍其经营管理不构成妨害公务罪。\u0002\nA✗ 工商行政管理机关工作人员查处伪劣商品属于国家机关工作人员依法执行职务，以暴力威胁阻碍成立妨害公务罪\nB✓ 不属于妨害公务罪（正选）：国有公司属于企业法人，\u0001国有公司经理\u0002是企业经营管理人员而非代表国家行使公共行政管理权力的“国家机关工作人员”，阻碍其工作不构成妨害公务罪\nC✗ 《刑法》第277条第2款明文保护各级人民代表大会代表依法执行代表职务，阻碍其履职成立妨害公务罪\nD✗ 《刑法》第277条第3款规定在自然灾害和突发事件中暴力威胁阻碍红十字会工作人员依法履行职责，以妨害公务罪论处","k":"","kb":72,"kh":[[21,94]]},{"id":"2009-20","y":2009,"t":"单","s":"下列有关寻衅滋事罪的表述中,正确的是（ ）。","o":["寻衅滋事罪是指肆意挑衅,无事生非,起哄闹事的行为","因寻衅滋事而致人轻伤的,以寻衅滋事罪定罪处罚","因寻衅滋事而致人重伤的,以寻衅滋事罪与故意伤害罪并罚","因寻衅滋事而致人死亡的,以寻衅滋事罪与故意杀人罪并罚"],"a":"B","e":"\u0001寻衅滋事致人轻伤仍以寻衅滋事罪定罪处罚；只有在寻衅滋事过程中致人“重伤或者死亡”的，才转化或想象竞合从一重直接定故意伤害罪、故意杀人罪。\u0002\nA✗ 《刑法》第293条构成寻衅滋事罪必须达到“\u0001情节恶劣\u0002”、“\u0001破坏社会秩序\u0002”或者“\u0001情节严重\u0002”程度，选项漏掉“情节恶劣/严重”这一核心构罪门槛\nB✓ 因寻衅滋事而致人轻伤的，以寻衅滋事罪定罪处罚：普通寻衅滋事中的“随意殴打他人情节恶劣”本身就包含造成轻伤以下或一般轻伤结果，直接以寻衅滋事罪评价（若造成2人以上轻伤亦属加重或情节恶劣），不另升格或并罚\nC✗ 因寻衅滋事而致人重伤的，依据司法解释按处罚更重的\u0001故意伤害罪\u0002一罪定罪处罚，而非数罪并罚\nD✗ 因寻衅滋事而致人死亡的，按处罚更重的\u0001故意杀人罪\u0002（或故意伤害致死）一罪定罪处罚，不实行数罪并罚","k":"","kb":74,"kh":[[54,104]]},{"id":"2010-12","y":2010,"t":"单","s":"下列行为中,构成招摇撞骗罪的是（ ）。","o":["甲冒充某省电视台记者骗取他人钱财,数额巨大","乙冒充工商局副局长玩弄多名女青年","丙冒充国有公司总经理玩弄多名女青年,并致两人怀孕","丁冒充某大学招生办主任骗取他人钱财,数额巨大"],"a":"B","e":"\u0001招摇撞骗罪必须冒充的是“国家机关工作人员”（如工商局副局长），诈骗罪可由财物或非财产利益（玩弄女性）组成；电视台记者、国企老总、大学招生办主任皆非国家机关人员。\u0002\nA✗ 省电视台属于新闻事业单位，电视台记者并非国家机关工作人员，冒充记者骗巨额财物定\u0001诈骗罪\u0002\nB✓ 乙冒充工商局副局长玩弄多名女青年：工商局属于国家行政机关，工商局副局长是典型\u0001国家机关工作人员\u0002；招摇撞骗罪的非法利益不限于金钱，包括骗色玩弄女性，完全符合《刑法》第279条\nC✗ 国有公司总经理是企业负责人，不属于国家机关工作人员\nD✗ 公办高校属于事业单位，大学招生办主任不属于国家机关工作人员，骗取巨额财物定\u0001诈骗罪\u0002","k":"","kb":72,"kh":[[179,252]]},{"id":"2011-18","y":2011,"t":"单","s":"甲因抢劫被公安机关追捕,逃至朋友乙家,对乙说:“公安要抓我,想在你这里躲几天。”乙遂收留甲在家。乙的行为构成（ ）。","o":["窝藏、包庇罪","包庇罪","窝藏罪","妨害公务罪"],"a":"C","e":"\u0001明知抢劫通缉犯正在被公安追捕而提供住所收留躲藏，符合“提供隐藏处所帮助逃匿”之窝藏罪；并未向司法机关作假证明故非包庇罪。\u0002\nA✗ 窝藏、包庇罪是选择性罪名，在裁判确定具体罪名时须拆开根据所实施的具体行为分别定“窝藏罪”或“包庇罪”（仅实施窝藏行为不能合并写成“窝藏、包庇罪”）\nB✗ 包庇罪是指向司法机关作虚假证明掩盖罪行；本案乙未接触司法机关作假证\nC✓ 窝藏罪：乙明知甲抢劫犯罪正在被公安抓捕，仍收留在家为其\u0001提供隐藏处所帮助逃匿\u0002，构成《刑法》第310条\u0001窝藏罪\u0002\nD✗ 乙没有使用任何暴力、威胁手段当面阻碍公安人员依法执行职务","k":"","kb":73,"kh":[[18,65]]},{"id":"2011-43","y":2011,"t":"多","s":"下列人员中,可以成为逃脱罪主体的有","o":["依法被判处管制的罪犯","依法被关押的罪犯","依法被关押的被告人","依法被关押的犯罪嫌疑人"],"a":"BCD","e":"\u0001脱逃罪主体仅限于“依法被关押的罪犯、被告人、犯罪嫌疑人”（三类被关押剥夺人身自由人员）；被判管制的罪犯居于社会接受社区矫正未受关押，非脱逃罪主体。\u0002\nA✗ 依法被判处管制的罪犯在社区服刑且不被关押于看守所或监狱，其擅自违反规定外出属于违反社区矫正规定，不能构成脱逃罪\nB✓ 依法被关押的罪犯逃脱监管构成脱逃罪\nC✓ 依法被关押的被告人逃脱羁押构成脱逃罪\nD✓ 依法被关押的犯罪嫌疑人逃脱看守拘留羁押构成脱逃罪","k":"","kb":73,"kh":[[249,285]]},{"id":"2013-12","y":2013,"t":"单","s":"甲明知男友乙实施了抢劫商店的行为,但为了掩盖乙的犯罪事实,在法庭审理时,作证说案发时乙在家中。对甲的行为应认定为（ ）。","o":["窝藏罪","包庇罪","伪证罪","徇私枉法罪"],"a":"C","e":"\u0001明知男友抢劫商店却“在法庭审理时出庭作证”做虚假不在场证明，发生在刑事诉讼侦查审判程序中且系以证人身份故意作伪证，依特别法优于普通包庇罪，定伪证罪。\u0002\nA✗ 未提供隐藏处所或资助财物助其逃跑，不是窝藏罪\nB✗ 包庇罪适用刑事诉讼外或者非以四类诉讼参与人身份做假证的掩护行为；而在刑事诉讼开庭审理过程中以\u0001证人\u0002身份故意作虚假证明包庇罪犯，依特别法优先适用第305条\u0001伪证罪\u0002\nC✓ 伪证罪：甲在法庭审理刑事案件时担任证人，对男友案发时间地点等重要情节故意作虚假证明以隐匿罪证，符合《刑法》第305条\u0001伪证罪\u0002\nD✗ 徇私枉法罪主体必须是\u0001司法工作人员\u0002","k":"","kb":72,"kh":[[312,326]]},{"id":"2014-17","y":2014,"t":"单","s":"药剂师甲明知不含毒品成分的药品已经过期失效,仍冒充为毒品卖给乙,乙将“毒品”卖给吸毒人员。本案中（ ）。","o":["甲和乙均构成诈骗罪","甲和乙均构成贩卖毒品罪","甲构成诈骗罪,乙构成贩卖毒品罪","甲构成销售假药罪,乙构成诈骗罪"],"a":"C","e":"\u0001药剂师甲明知过期药不含毒品成分仍冒充毒品卖给乙骗钱（构诈骗罪）；乙真以为是真毒品并转手卖给吸毒者（对象不能犯未遂），仍构成贩卖毒品罪（未遂）。\u0002\nA✗ 乙不知道该药实为过期假货，乙主观上有明确的贩毒故意并实施了向吸毒人员售卖行为，并不以骗财为业\nB✗ 药剂师甲自己明知药品根本不含任何毒品成分，只是拿假东西骗乙的钱，客观上也未危害毒品管制，只成立诈骗罪\nC✓ 甲构成诈骗罪，乙构成贩卖毒品罪：甲虚构过期普药为高价毒品骗取乙财物定\u0001诈骗罪\u0002；乙误认为真毒品而向外销售给吸毒人员，属对象认识错误的不能犯，成立\u0001贩卖毒品罪（未遂）\u0002\nD✗ 甲冒充的不是国家批准治病药品而是卖给下家毒贩作为“毒品”，且乙是在故意售卖自以为的“毒品”并非骗钱","k":"","kb":75,"kh":[[205,230]]},{"id":"2014-19","y":2014,"t":"单","s":"下列行为中,应以窝藏罪定罪处罚的是（ ）。","o":["甲利用担任司法警察的职务便利,将正在服刑的李某放走","乙明知赵某的现金为贩毒所得,仍将其兑换成外币汇往境外","丙明知刘某的3辆摩托车是盗窃所得,仍将其藏匿在自家车库中","丁明知蔡某刚从监狱脱逃出来,仍向他提供1 万元现金助其逃跑"],"a":"D","e":"\u0001丁明知刚从监狱脱逃出来的罪犯需要资金逃匿，向其提供1万元现金助其逃跑，成立窝藏罪；司法警察放犯是私放在押人员罪；帮洗毒资是洗钱罪；藏匿盗窃摩托是掩饰隐瞒犯罪所得罪。\u0002\nA✗ 司法警察利用职务之便放走在押服刑人员，构成《刑法》第400条\u0001私放在押人员罪\u0002\nB✗ 明知是毒品犯罪所得现金而兑换成外币汇往境外协助隐瞒掩饰来源，构成《刑法》第191条\u0001洗钱罪\u0002\nC✗ 明知三辆摩托车属于盗窃犯罪所得赃物而藏匿在家中车库，构成《刑法》第312条\u0001掩饰、隐瞒犯罪所得罪\u0002\nD✓ 丁明知蔡某系越狱逃犯仍提供1万元现金资助其潜逃，完全符合《刑法》第310条“提供财物帮助犯罪分子逃匿”之\u0001窝藏罪\u0002","k":"","kb":73,"kh":[[18,65]]},{"id":"2015-10","y":2015,"t":"单","s":"甲公司将3000公斤生产废料直接倒入河中, 该废料遇水反应生成毒气,毒气随风飘至附近数个村庄,致上百村民呼吸系统受损,并造成直接经济损失 100多万元。甲公司的行为构成（ ）。","o":["污染环境罪","重大责任事故罪","投放危险物质罪","以危险方法危害公共安全罪"],"a":"A","e":"\u0001直接向河流排放3000公斤生产废料生成毒气飘至数村致上百村民呼吸受损、损失百余万，违反环保排污规定导致严重污染环境后果，构成污染环境罪。\u0002\nA✓ 污染环境罪：甲公司直接向水体违反国家规定倾倒排放工业生产废料并产生毒气扩散，严重污染大气与水体环境并致使大量群众受损，符合《刑法》第338条\u0001污染环境罪\u0002\nB✗ 并非作业机械操作直接酿成的安全生产责任事故，而是向自然环境倾倒生产废料排污\nC✗ 企业生产过程中的违法倾倒废料排污行为属于环境污染犯罪，法条已有污染环境罪专门评价，与以危害公共安全为目的直接向人畜饮水食源投毒之投放危险物质罪不同\nD✗ 同理，不适用兜底条款以危险方法危害公共安全罪","k":"","kb":56,"kh":[[17,72]]},{"id":"2016-9","y":2016,"t":"单","s":"甲明知王某是逃犯,在公安人员前来抓捕王某时,给其3000元帮他逃跑。甲的行为构成（ ）。","o":["窝藏罪","妨害公务罪","包庇罪","私放在押人员罪"],"a":"A","e":"\u0001明知王某是逃犯而在警察前来抓捕时给其3000元盘缠帮其外逃，属于“提供财物帮助犯罪的人逃匿”，构成窝藏罪。\u0002\nA✓ 窝藏罪：甲明知王某是被抓捕逃犯而向其提供3000元现金帮助逃跑，完全符合第310条\u0001窝藏罪\u0002\nB✗ 甲没有在警察抓捕现场使用暴力或威胁阻拦警察，不构成妨害公务罪\nC✗ 甲并没有向公安或司法机关编造虚假证明掩护逃犯，不是包庇罪\nD✗ 甲是一般公民且王某是在逃犯（非已经被关押受监管押解之人），不是司法工作人员私放在押人员","k":"","kb":73,"kh":[[18,65]]},{"id":"2016-15","y":2016,"t":"单","s":"某组织采用暴力、威胁手段长期控制某地长途汽车客运业务。甲参加该组织后,按照组织的指令,将一名“不听话”的司机打成重伤。甲的行为应认定为（ ）。","o":["故意伤害罪","参加恐怖组织罪","参加黑社会性质组织罪","参加黑社会性质组织罪和故意伤害罪"],"a":"D","e":"\u0001参加黑社会性质组织后又按组织指令将不听话司机打成重伤，依据《刑法》第294条第3款，参加黑社会性质组织罪与所犯具体故意伤害罪实行数罪并罚。\u0002\nA✗ 不能只定故意伤害罪而忽略其积极参加黑社会性质组织的长期组织犯罪\nB✗ 该组织为垄断长途客运业务实施暴力控制，符合黑社会性质组织特征，而非以政治颠覆或恐怖袭击为目的之恐怖活动组织\nC✗ 不能只定参加黑社会性质组织罪而把重伤他人的具体犯罪吸收省略\nD✓ 参加黑社会性质组织罪和故意伤害罪：《刑法》第294条第3款明文规定，犯组织、领导、参加黑社会性质组织罪又有其他犯罪行为的，\u0001依照数罪并罚的规定处罚\u0002","k":"","kb":57,"kh":[[262,298]]},{"id":"2017-17","y":2017,"t":"单","s":"下列选项中,在情节严重的情况下,应认定为妨害公务罪的是（ ）。","o":["甲多次煽动他人在镇政府门前广场非法聚集","乙为了解决医疗纠纷,带领多人封堵公立医院大门","丙纠集多人打砸警车,阻止警察带走涉嫌诈骗的丈夫","丁纠集多名亲友,在村口阻碍警察带走被收买的儿童"],"a":"C","e":"\u0001丙纠集多人直接“打砸警车、阻止警察带走嫌疑人”，属于以暴力方法直接阻碍国家机关工作人员依法执行职务，构成妨害公务罪（注意：2021《刑修十一》新增袭警罪，当时依2017法答妨害公务罪）。\u0002\nA✗ 煽动他人在政府广场非法聚集（未使用暴力威胁阻碍具体执勤公务），一般构成《刑法》第290条第3款\u0001组织、资助非法聚集罪\u0002或聚众扰乱社会秩序罪\nB✗ 医患纠纷带头封堵公立医院大门干扰医疗机构秩序，公立医院医生非国家机关工作人员，通常构成\u0001聚众扰乱社会秩序罪\u0002\nC✓ 丙纠集多人打砸警车，阻止警察带走涉嫌诈骗的丈夫：以砸毁警车的暴力手段阻碍警察依法执行抓捕押解公务，符合妨害公务罪（注：2021年《刑修（十一）》实施后，若打砸警车直接危及在场警察人身安全的现升级定\u0001袭警罪\u0002）\nD✗ 纠集多名亲友阻碍解救被拐卖、收买的妇女儿童，刑法分则第242条第2款明文规定“聚众阻碍国家机关工作人员解救被收买的妇女、儿童的首要分子”专门以\u0001聚众阻碍解救被收买的妇女、儿童罪\u0002论处（若使用暴力造成伤亡等例外才另定），注意非首要分子仅未用暴力一般不构妨害公务\n\u0001【新法提示】\u00022021年《刑法修正案（十一）》增设独立的\u0001袭警罪\u0002（第277条第5款）。现行法下若打砸警车直接危及现场执勤民警人身安全的，优先以\u0001袭警罪\u0002定罪（但本题对比“非法聚集”、“堵医院”和“聚众阻碍解救被收买儿童罪”四罪界分依然是经典考法）。","k":"","kb":72,"kh":[[21,39]]},{"id":"2018-4","y":2018,"t":"单","s":"下列关于包庇罪的表述,正确的是（ ）。","o":["行为方式必须是作为","行为主体必须是特殊主体","行为时间必须发生在审查起诉之后","行为对象必须是判决确定的犯罪分子"],"a":"A","e":"\u0001包庇罪必须积极实施作虚假证明等“作为”方式（单纯知情不举不构包庇）；主体为一般主体；行为时间在犯罪发生后即可；对象不限于法院生效判决确定之罪犯。\u0002\nA✓ 行为方式必须是作为：包庇罪要求积极向司法机关作出虚假陈述或提供伪证来掩盖罪犯身份或罪责；消极沉默、拒不报案不成立不作为包庇罪\nB✗ 包庇罪为一般主体，任何达到刑事责任年龄具有责任能力的自然人均可构成\nC✗ 包庇行为只要在他人“实施犯罪之后”（包括侦查前、侦查中、起诉审理甚至判决逃亡后）均可实施，不限于审查起诉之后\nD✗ 被包庇对象只需客观上实施了犯罪行为即可（“犯罪的人”），绝不要求必须经过法院最终判决已宣告定罪","k":"","kb":73,"kh":[[66,127]]},{"id":"2018-20","y":2018,"t":"单","s":"下列选项中,应认定为寻衅滋事罪的是（ ）。","o":["因宅基地纠纷将邻居家电视机砸毁","因感情纠纷随意殴打路人情节恶劣","因债务纠纷率众人拿走债务人财物","因医患纠纷将主治医师困在办公室"],"a":"B","e":"\u0001为发泄情绪无事生非而在街头“随意殴打路人（不相干的第三人）”情节恶劣，符合寻衅滋事罪；针对宅基地、债务或医患特定当事人发泄不属于无事生非的寻衅滋事。\u0002\nA✗ 因具体邻里宅基地纠纷砸坏邻居电视机，对象与事由均特定明确，达数额较大定\u0001故意毁坏财物罪\u0002\nB✓ 因感情纠纷随意殴打路人情节恶劣：虽然起因于自身感情不顺，但将怒气撒在毫不相干的无辜\u0001路人\u0002身上随意殴打发泄情绪且情节恶劣，完全符合寻衅滋事罪\nC✗ 因真实债务纠纷带人拿走债务人财物属于特定讨债矛盾（视暴力或金额可能涉抢劫/抢夺或治安冲突，但非寻衅滋事）\nD✗ 因医患纠纷将特定主治医师非法限制困在办公室，涉嫌\u0001非法拘禁罪\u0002而非随意挑衅无关路人","k":"","kb":74,"kh":[[10,15],[54,64]]},{"id":"2018-44","y":2018,"t":"多","s":"下列聚众斗殴的情形中,属于“持械\"的有","o":["牵引恶犬参与斗殴","携带非法持有的枪支参与斗殴","在斗殴现场抢夺对方棍棒并使用","斗殴时使用事先藏匿在斗殴地点的砍刀"],"a":"BD","e":"\u0001聚众斗殴罪中的“持械”包括携带国家管制的非法枪支、或者使用事先准备/藏匿于现场的砍刀等致人重伤死亡凶器；不包括牵引动物（恶犬）或在斗殴中临场反抢对方的木棍。\u0002\nA✗ 最高法司法解释与实务共识认为，聚众斗殴之“械”特指能直接作用于人体的器械工具（金属棍棒、刀具、枪支等），\u0001恶犬等动物不属于“器械”\u0002\nB✓ 枪支属于严重危及生命的典型器械，携带非法枪支参与聚众斗殴认定为“持械”加重情节（同时另涉非法持有枪支罪并罚）\nC✗ 最高法相关答复或实务通说明确，在斗殴现场临时夺取\u0001对方\u0002攻击自己的棍棒用于反击防卫或斗殴，原则上不认为是事先或主动“持械”聚众斗殴\nD✓ 为了斗殴预先将砍刀藏匿在斗殴现场并在开打时取出使用，属于典型的“持械”聚众斗殴","k":"","kb":74,"kh":[[175,208]]},{"id":"2019-6","y":2019,"t":"单","s":"甲目睹了朋友乙抢劫王某的全过程后实施的下列行为,可以构成窝藏罪的是（ ）。","o":["劝说乙不要自首","转账5000元给乙供其外出躲避","经法院通知无正当理由拒不出庭作证","对侦查人员表示:乙只是捡拾了王某掉落的财物"],"a":"B","e":"\u0001明知朋友乙实施了抢劫，通过转账5000元给乙“供其外出躲避”属于提供财物帮助犯罪人逃匿，构成窝藏罪；谎称捡拾财物是包庇罪。\u0002\nA✗ 仅仅口头劝说不要自首并没有向司法机关作假证，也未提供实质躲藏住所与逃匿资金，一般不构成窝藏或包庇罪\nB✓ 转账5000元给乙供其外出躲避：直接为已知犯罪分子提供了潜逃资金资助其躲避司法抓捕，完全符合\u0001窝藏罪\u0002\nC✗ 拒不出庭作证属于妨害正常诉讼程序的证人义务违背（可采取训诫拘留等诉讼强制措施），不是向犯罪人提供逃匿协助的窝藏罪\nD✗ 向侦查人员谎称“乙只是捡拾财物”以掩盖其抢劫罪行，构成\u0001包庇罪\u0002而非窝藏罪","k":"","kb":73,"kh":[[18,65]]},{"id":"2019-7","y":2019,"t":"单","s":"甲为境外赌球网站担任代理,开设个人微信公众号接受投注,情节严重。甲的行为应认定为（ ）。","o":["帮助信息网络犯罪活动罪","赌博罪","非法经营罪","开设赌场罪"],"a":"D","e":"\u0001为境外赌球网站“担任代理”并开设个人微信公众号直接“接受投注”抽成牟利，依两高赌博罪司法解释直接构成开设赌场罪（而非帮信罪或普通赌博罪）。\u0002\nA✗ 帮助信息网络犯罪活动罪仅是外围提供纯粹技术支持、支付结算等中立/间接辅助；直接为赌博网站担任代理并发展会员接受投注属于赌场核心组织经营环节\nB✗ 聚众赌博或者以赌博为业才定普通赌博罪；直接为网络赌博平台担任代理抽头接单属于开设网络赌场\nC✗ 非法经营罪是兜底经济秩序罪，开设网络赌博平台由专门的开设赌场罪涵括\nD✓ 开设赌场罪：两高一部《关于办理网络赌博犯罪案件适用法律若干问题的意见》明确规定，\u0001为赌博网站担任代理并接受投注的，属于“开设赌场”\u0002，定开设赌场罪","k":"","kb":75,"kh":[[20,33]]},{"id":"2019-10","y":2019,"t":"单","s":"下列选项中,属于成立组织卖淫罪必须具备的条件的是（ ）。","o":["卖淫人员在三人以上","组织者在三人以上","非法获利数额巨大","设置固定的卖淫场所"],"a":"A","e":"\u0001依据《刑法》及两高组织卖淫司法解释，“以招募、雇佣、纠集等手段，管理或者控制他人卖淫，卖淫人员在三人以上”是成立组织卖淫罪的必要核心门槛。\u0002\nA✓ 卖淫人员在三人以上：组织卖淫罪属于危害社会风化与治安秩序的重罪，司法解释刚性规定被组织、管理、控制从事卖淫的人员必须达到\u00013人以上\u0002\nB✗ 对组织者本身人数没有限制（单人完全可以构成组织卖淫罪）\nC✗ 本罪为行为犯，只要实施组织控制3人以上卖淫即告成立，不要求已取得“数额巨大”之非法获利\nD✗ 组织卖淫并不以设置洗浴中心、会所等固定物理场所为要件，通过网络招嫖或上门派单调度管理卖淫同样成立\n组织卖淫罪常考三大不要求：不要求组织者≥3人（一人即可组织）；不要求设置固定场所（流窜/网上派单亦可）；不要求非法获利巨大；\u0001唯一硬性人数门槛：被组织卖淫人员≥3人\u0002！","k":"","kb":74,"kh":[[10,15]]},{"id":"2020-15","y":2020,"t":"单","s":"甲因经营不善欠下巨额债务,为转移财产,与朋友乙伪造甲向乙借款200万元的借款合同,让乙向法院提起诉讼,第三人丙得知后申请参加诉讼。法院经开庭审理查明,该借款合同属于甲、乙恶意伪造的合同。甲的行为应认定为（ ）。","o":["伪证罪","妨害作证罪","虚假诉讼罪","扰乱法庭秩序罪"],"a":"C","e":"\u0001与朋友恶意串通捏造200万元借款合同让其向法院起诉以虚构债务转移财产，严重妨害民事审判司法秩序与债权人利益，成立虚假诉讼罪。\u0002\nA✗ 伪证罪仅发生在\u0001刑事诉讼\u0002之中且主体限于证人、鉴定人、记录人、翻译人；甲乙是在民事诉讼中伪造原被告民事合同纠纷\nB✗ 妨害作证罪是指以暴力、威胁、贿买等方法阻止证人作证或指使他人作伪证（甲直接与他人共谋捏造虚假民事债权提起诉讼应适用专门的虚假诉讼罪）\nC✓ 虚假诉讼罪：《刑法》第307条之一明文规定，以捏造的事实提起民事诉讼，妨害司法秩序或者严重侵害他人合法权益的，构成\u0001虚假诉讼罪\u0002（与企图逃债侵财目的相区别）\nD✗ 扰乱法庭秩序罪是聚众哄闹冲击法庭或殴打司法工作人员导致庭审无法正常进行","k":"","kb":72,"kh":[[352,388]]},{"id":"2020-20","y":2020,"t":"单","s":"甲毒瘾发作,委托乙到住在同一小区的毒贩 (另案处理)处代购毒品,并向乙支付了“劳务费”。乙购买了2小包海洛因交给甲吸食。对此,下列说法中正确的是（ ）。","o":["甲构成贩卖毒品罪","乙构成贩卖毒品罪","乙构成非法持有毒品罪","甲、乙均不构成犯罪"],"a":"B","e":"\u0001毒瘾发作的吸毒者甲委托同住小区的乙帮忙到毒贩处买2小包海洛因自吸，甲单纯购买吸食不构罪；但乙收了甲支付的“劳务费”（变相获利）为吸毒者代购毒品，构成贩卖毒品罪。\u0002\nA✗ 吸毒者单纯购买少量毒品供自己吸食（未达非法持有数量起点），我国刑法不处罚单纯吸毒或为自吸而购买少量毒品行为\nB✓ 乙构成贩卖毒品罪：依据全国法院毒品审判会议纪要，\u0001代购者（乙）以贩卖牟利为目的，变相加价或收取交通食宿费以外的“劳务费/介绍费”帮他人购买毒品的\u0002，一律认定为\u0001贩卖毒品罪\u0002\nC✗ 2小包海洛因若未达10克起刑点本不构非法持有，即便达标，因乙收取劳务费牟利亦应定性更重且行为属代购销售的贩卖毒品罪（不另定非法持有）\nD✗ 乙因收取“劳务费”牟利已经跨越无偿代买底线，依法成立贩卖毒品罪\n“代购毒品”区分三句话：\n1. 帮吸毒者\u0001无偿\u0002代购（未收额外利益且总量不满10克海洛因）→ 无罪；\n2. 帮吸毒者无偿代购达到较大数量（如≥10克海洛因）→ 非法持有毒品罪；\n3. 帮吸毒者代购并\u0001加价或收取“劳务费/介绍费”\u0002牟利（哪怕仅几克）→ 一律\u0001贩卖毒品罪\u0002！","k":"","kb":75,"kh":[[127,161]]},{"id":"2021-12","y":2021,"t":"单","s":"甲在互联网上有偿提供制毒工艺视频。乙从甲处购买了该视频，并根据视频中的工艺试制少量毒品，后被抓获。甲的行为应认定为（ ）。","o":["非法利用信息网络罪","传授犯罪方法罪","非法经营罪","制造毒品罪(帮助犯)"],"a":"B","e":"\u0001在网上有偿售卖、提供“制毒工艺视频”（明确教导他人如何制造毒品的具体犯罪方法），行为直指传授制作毒品方法，成立《刑法》第295条传授犯罪方法罪。\u0002\nA✗ 有专门罪名精准涵括“传授制造毒品方法”行为，不再退而求其次适用兜底型非法利用信息网络罪\nB✓ 传授犯罪方法罪：故意通过互联网有偿售卖制毒工艺操作视频，把制造毒品的犯罪手段和方法传授给他人，符合《刑法》第295条\u0001传授犯罪方法罪\u0002\nC✗ 贩卖制毒犯罪方法视频绝非一般行政许可违法的非法经营罪\nD✗ 甲只是面向互联网不特定买家出售工艺视频，事前并不直接与乙共谋参与乙的个别试制过程或分享制成品；刑法已将传授犯罪方法专门独立正犯化，乙买来自己试制也无从再将甲逆推为制造毒品帮助犯","k":"","kb":76,"kh":[[202,223]]},{"id":"2021-13","y":2021,"t":"单","s":"甲驾车闯红灯,当场撞死行人王某。甲的朋友乙闻讯后让甲离开,并在交警调查时谎称是自己开车肇事。乙的行为应认定为（ ）。","o":["窝藏罪","伪证罪","交通肇事罪","包庇罪"],"a":"D","e":"\u0001甲闯红灯撞死行人（构成交通肇事罪），朋友乙闻讯让甲逃离现场并主动在交警调查时“顶包”谎称自己开的车，属于明知犯罪之人而作假证明包庇，构成包庇罪。\u0002\nA✗ 乙没有给甲提供藏匿处所或潜逃钱财，而是在交警面前编造虚假驾驶事实“顶包”\nB✗ 在交警事故调查（尚未进入刑事诉讼侦查审判作证程序）阶段冒名顶替，且未作为证人出庭作证，符合一般包庇罪而非伪证罪\nC✗ 乙在交通事故发生后才到场帮忙“顶包”，并非事故发生时开车或指使肇事的驾驶人，不构成交通肇事罪\nD✓ 包庇罪：乙明知朋友甲交通肇事撞死人已构成犯罪，故意在交警调查时作虚假顶替陈述掩盖甲罪行，符合《刑法》第310条\u0001包庇罪\u0002","k":"","kb":73,"kh":[[66,89]]},{"id":"2021-17","y":2021,"t":"单","s":"甲开设网站,以体育彩票开奖号码作为参考号码,接受该网站注册会员投注并开奖,从中抽头渔利6万元。甲的行为应认定为（ ）。","o":["开设赌场罪","诈骗罪","非法经营罪","赌博罪"],"a":"A","e":"\u0001自己架设网站借用国家体育彩票开奖号码作参考结果并公开接受注册会员下赌注，从中抽头渔利6万元，符合“建立赌博网站并接受投注”之开设赌场罪。\u0002\nA✓ 开设赌场罪：两高司法解释明确规定“建立赌博网站并接受投注的”属于《刑法》第303条第2款之\u0001“开设赌场”\u0002（借用正规体彩号码自坐庄开盘接收会员下注抽头渔利正是典型网上私彩开设赌场）\nB✗ 甲并未动手操纵体彩开奖结果，只是借公信开奖号按规则赌博对赌抽水，未实行欺诈\nC✗ 若仅仅未获国家批准代销正规彩票可能涉非法经营，但此处是自建平台直接面向会员接受私下押注赌博抽水，定开设赌场罪\nD✗ 建立专门网站常年接收会员投注抽头属于“开设赌场”而非传统线下面对面临时凑局的普通赌博罪","k":"","kb":75,"kh":[[34,54]]},{"id":"2021-18","y":2021,"t":"单","s":"甲从竞争对手的网络店铺大量虚假购买商品,电商平台因此认定该店铺恶意刷单,并予以搜索降权处理,导致该店铺的产品难以被消费者检索到, 造成经济损失35万余元。甲的行为应认定为（ ）。","o":["非法侵入计算机信息系统罪","损害商业信誉罪","不构成犯罪","破坏生产经营罪"],"a":"D","e":"\u0001恶性竞争中通过大量虚假下单刷空单，蓄意诱发电商平台反作弊算法误判将竞争对手店铺“搜索降权”致正常生意瘫痪损失35万余元，符合《刑法》第276条“以其他方法破坏生产经营”罪。\u0002\nA✗ 甲是用自己控制的买家账号在平台正常页面下虚假订单，并没有侵入或攻破电商平台底层服务器数据库\nB✗ 《刑法》第221条损害商业信誉罪要求“捏造并散布虚伪事实”；本案没有向公众散布诽谤竞争对手商品质量造谣言论，而是用虚假刷单触发平台搜索降权规则\nC✗ 恶意制造35万元以上巨额经营损失，具备严重社会危害性和刑事可罚性\nD✓ 破坏生产经营罪：出于恶意打击竞争对手的个人泄愤报复或排挤目的，通过反向恶性刷单诱发电商平台对被害店铺搜不到商品降权封杀，造成正常生产经营活动严重受阻并损失35万余元，实务指导性案例及真题明确认定为《刑法》第276条\u0001破坏生产经营罪\u0002\n最高检/最高法经典指导案例考点：“反向恶意刷单”致竞争对手电商平台搜索降权，既未入侵系统又未散布谣言，而是破坏电商正常经营工具和秩序，以\u0001破坏生产经营罪\u0002（“以其他方法破坏生产经营”）定罪！","k":"","kb":76,"kh":[[94,104]]},{"id":"2021-43","y":2021,"t":"多","s":"2012年至2018年,甲与其两名兄弟纠集数十名社会闲散人员,在某豌豆主产区要求农民低价出售豌豆给他们。多年来,数名不服从要求的农民被打成重伤,其他农民不得不将豌豆低价出售。甲的行为应认定为（ ）。","o":["故意伤害罪","寻衅滋事罪","组织领导黑社会性质组织罪","强迫交易罪"],"a":"ACD","e":"\u0001长期纠集数十人在主产区垄断霸市、压价强迫农民卖豌豆，多次将不服从者打成重伤，同时成立组织、领导黑社会性质组织罪、强迫交易罪和故意伤害罪，依法数罪并罚。\u0002\nA✓ 多年间将数名不服从强迫收购的农民打成重伤，符合\u0001故意伤害罪\u0002\nB✗ 本案每一起强买、殴打均直接瞄准了压价垄断收购豌豆的具体经济目的与特定拒绝者，非无事生非式的寻衅滋事\nC✓ 组织人数众多（数十名社会闲散人员）、长期存在（2012—2018年达六年）、骨干较固定、在当地豌豆主产区形成非法控制并欺压百姓严重破坏经济社会秩序，构成\u0001组织、领导黑社会性质组织罪\u0002\nD✓ 以暴力威胁手段强迫农民必须低价出售农产品给其垄断组织，构成\u0001强迫交易罪\u0002（依第294条第3款三罪数罪并罚）","k":"","kb":74,"kh":[[228,290]]},{"id":"2022-9","y":2022,"t":"单","s":"被执行人甲屡次殴打人民法院执行干警,阻拦其进入执行现场,致使生效判决文书无法执行。甲的行为应认定为","o":["故意伤害罪","妨害公务罪","寻衅滋事罪","拒不执行判决、裁定罪"],"a":"D","e":"\u0001被执行人甲有执行能力却“屡次殴打法院执行干警、阻拦进入现场致使生效判决无法执行”，依《刑法》第313条与第277条法条竞合关系，特别法拒不执行判决、裁定罪优先。\u0002\nA✗ 题干未交代殴打致使执行干警达到“轻伤”以上（仅一般殴打阻挠），不成立故意伤害罪\nB✗ 虽暴力阻碍法院执行干警执行公务同时符合妨害公务罪特征，但“抗拒生效判决、裁定执行”由《刑法》第313条作为特别法规定\nC✗ 甲针对特定上门强制执行生效判决的法院干警施暴阻挠，不属无事生非的寻衅滋事\nD✓ 拒不执行判决、裁定罪：作为有能力执行生效判决的被执行人，屡次以暴力殴打执行人员阻拦进入执行，致使生效文书无法执行（情节严重），适用特别法\u0001拒不执行判决、裁定罪\u0002（如暴力重伤则再与重伤竞合从重）","k":"","kb":73,"kh":[[165,204]]},{"id":"2022-17","y":2022,"t":"单","s":"文某在疫情防控期间,为发泄不满情绪,将发热门诊值班医生打成轻微伤,并损坏其防护用具,致使该医生被隔离观察无法正常从事诊疗工作,情节恶劣。文某的行为应认定为","o":["寻衅滋事罪","故意伤害罪","妨害传染病防治罪","故意毁坏财物罪"],"a":"A","e":"\u0001疫情期间为发泄不满在发热门诊将医生打成“轻微伤”（未达轻伤）并损坏防护用具导致隔离停诊情节恶劣，未达故意伤害罪门槛而属《传染病/寻衅》司法意见明确的寻衅滋事罪。\u0002\nA✓ 寻衅滋事罪：殴打发热门诊医生仅造成\u0001轻微伤\u0002（不构故意伤害罪），但无端生事损坏防护用具致使涉疫医生被隔离无法正常接诊，严重扰乱医疗与社会秩序且情节恶劣，依《依法惩治妨害疫情防控犯罪意见》应定\u0001寻衅滋事罪\u0002\nB✗ 故意伤害罪至少要求造成\u0001轻伤\u0002以上后果；题目特意交代仅致“轻微伤”且未致医生感染病毒，不成立故意伤害罪\nC✗ 《刑法》第330条妨害传染病防治罪主要是拒绝执行卫生防疫机构防控措施引起甲类/按甲类管理传染病传播或者有传播严重危险，此处不是拒检导致疫情传播\nD✗ 仅损毁医生个人一套防护用具，财物价值通常远未达到故意毁坏财物罪数额较大标准，被寻衅滋事罪行为全面吸收","k":"","kb":74,"kh":[[54,64]]},{"id":"2022-44","y":2022,"t":"多","s":"司法机关在认定高空抛物行为人是否具有犯罪故意时,应结合行为人的生活阅历及生活常识综合考量","o":["行为人对抛物场所的认识","行为人对抛物高度的认识","行为人对抛物时间的认识","行为人对所抛具体物品的认识"],"a":"ABCD","e":"\u0001认定高空抛物是否具有犯罪故意，需结合行为人生活常识综合判断对“抛物场所、高度、时间、所抛物品”的全面认识（是否容易致下方人员伤害及情节严重）。\u0002\nA✓ 抛物场所是否在人流往来小区道路、公共广场还是无人荒地，直接决定危险程度认知\nB✓ 抛物高度（比如从15楼高抛还是从1楼窗台下扔）直接影响坠落杀伤力与故意判断\nC✓ 抛物时间（如正午放学出入高峰期还是凌晨绝对无人时）对危险认知有直接影响\nD✓ 所抛具体物品是菜刀砖块铁锤还是几张纸片空矿泉水瓶，直接决定危害程度和行为人认知\n最高法《关于依法妥善审理高空抛物、坠物案件的意见》明确：判断高空抛物故意与危险性，须全方位结合动机、\u0001抛物场所、高度、时间、物品性质及后果\u0002四维要素。","k":"","kb":74,"kh":[[10,15]]},{"id":"2023-13","y":2023,"t":"单","s":"李某毕业回国后从甲国邮购大量“快乐草”卖给吸毒人员，获利数十万元，后被警方查获。经鉴定，李某所销售的“快乐草”系毒品。李某辩称：①自己具有甲国永久居留权，因而享有外交豁免权；②不清楚“快乐草”成分，没有贩毒故意；③吸食、售卖“快乐草”在甲国合法，因此也不违反中国刑法；④即使“快乐草”是毒品，也应当按照纯度折算数量。根据我国刑法规定，上述辩解（ ）。","o":["①③成立","②③成立","②④成立","均不成立"],"a":"D","e":"\u0001①永居权不是外交人员不享有外交豁免权；②“快乐草”是否知晓系毒品看事实推定不能空口免责；③外国合法但在中国刑法属地管辖内照样构罪；④毒品一律不按纯度折算，故四项辩解均不成立。\u0002\nA✗ 拥有甲国“永久居留权”（俗称绿卡）依然是中国公民且更不是派驻外交使节，绝对没有外交豁免权；且在中国境内贩毒依《刑法》第6条属地原则必须追责，与国外是否合法无关\nB✗ 在国外邮购并高价向“吸毒人员”销售致瘾物品，司法机关完全可推定其明知所卖物具有致瘾毒品属性（或违法认知），且甲国合法不影响中国属地管辖\nC✗ 《刑法》第357条第2款明文规定“毒品的数量……\u0001不以纯度折算\u0002”，故按纯度折算辩解违法\nD✓ 均不成立：①有外国永居权≠享有外交豁免权；②从国外特定通道邮购专卖给“吸毒人员”谋取暴利几十万可充分认定/推定贩毒明知；③在中国领域内犯罪适用中国刑法，无论该物品在境外是否合法；④毒品数量法定不以纯度折算","k":"","kb":75,"kh":[[267,286]]},{"id":"2023-16","y":2023,"t":"单","s":"甲购买由乙开发的赌博软件，用于开设赌博网站，并和乙约定由乙维护该网站。截至案发，该网站收取赌资1300万元，乙收取开发及维护费用10万元。乙的行为应认定为（ ）。","o":["帮助信息网络犯罪活动罪","非法利用信息网络罪","拒不履行信息网络安全管理义务罪","开设赌场罪"],"a":"D","e":"\u0001乙在为甲开发赌博软件后还“约定由乙专门负责持续维护该赌博网站”（全程深度参与赌博网站长期运维保障，收受10万元，网站吸赌1300万），依网络赌博解释成立开设赌场罪（共犯）。\u0002\nA✗ 《两高一部关于办理利用信息网络开设赌场犯罪适用法律若干问题的意见》及帮信罪司法解释区分：仅提供一次性普通通用中立软件服务不知他人赌博的仅非罪或帮信；明知专用于开设赌博网站且\u0001与开设赌场者约定长期提供核心技术维护支持并收取高额报酬\u0002，形成开设赌场罪共同犯罪故意\nB✗ 非仅仅发布违法招募或设立一般信息通讯群组\nC✗ 拒不履行信息网络安全管理义务罪主体必须是“网络服务提供者”，且须经监管部门责令改正而拒不改正导致严重后果；本案乙直接合谋开发并专程负责该赌博网站运营维护\nD✓ 开设赌场罪：明知甲用于开设网络赌场，不仅开发定制赌博软件而且深度约定全程长期负责“维护该网站”并以此获利10万元，属于与赌场实际经营者形成共谋合作的\u0001开设赌场罪共同犯罪\u0002","k":"","kb":75,"kh":[[56,97]]},{"id":"2023-19","y":2023,"t":"单","s":"【案情】甲与母亲发生争执，一气之下将电脑显示器从五楼抛下，掉落到行人刘某身旁，导致刘某受惊摔伤，入院就医。派出所接警后派两名民警着警服到场处置，甲突然掏出管制刀具追赶到场民警，严重危及民警人身安全。\n甲的行为应认定为","o":["高空抛物罪和袭警罪","高空抛物罪和妨害公务罪","以危险方法危害公共安全罪和袭警罪","以危险方法危害公共安全罪和妨害公务罪"],"a":"A","e":"\u0001五楼抛下显示器掉到行人身旁致其受惊摔伤（未直接砸致重伤死但情节严重）定高空抛物罪；随后掏出管制刀具追赶着警服出警民警严重危及人身安全定袭警罪，两罪并罚。\u0002\nA✓ 高空抛物罪和袭警罪：五楼扔电脑显示器掉在刘某身旁仅致受惊摔伤（尚未发生直接击中重大伤亡规模且无持续高度公共毁灭危情），构成《刑法》第291条之二\u0001高空抛物罪\u0002；之后掏出管制刀具追赶正在依法执行职务的着警服民警严重危及民警安全，构成《刑法》第277条第5款\u0001袭警罪\u0002，数罪并罚\nB✗ 《刑法修正案（十一）》增设专门的“袭警罪”后，暴力袭击正在依法执行职务的人民警察一律定\u0001袭警罪\u0002，不再定普通妨害公务罪\nC✗ 电脑显示器并未直接击中行人致重伤/死亡，在单次抛掷受惊摔伤情形下通常适用新设的轻罪名高空抛物罪即可评价，未上升到以危险方法危害公共安全罪\nD✗ 既误拔高定性了高空抛物罪，又忽略了《刑修十一》独立的袭警罪","k":"","kb":57,"kh":[[19,56],[166,184],[202,236]]},{"id":"2024-7","y":2024,"t":"单","s":"甲系某快递企业(一人有限责任公司)的法定代表人,为赚取显著高于市场价格的运费,违规将寄件人更换包装箱、能使人形成瘾癖国家规定管制的精神药品运往全国各地,本案中,司法机关（ ）。","o":["可以通过推定的方式认定甲主观明知","需要证明甲获利的金额达到特定数额","只能针对自然人甲追究相关刑事责任","可以根据纯度折算甲运输的药品数量"],"a":"A","e":"\u0001作为快递一人公司法定代表人，贪图“显著高于市场价运费”违规运输更换隐蔽包装的国家管制精神药品（法律意义上的毒品），司法机关可通过反常情形推定其主观“明知”（可单位犯罪，不计获利额，不折算纯度）。\u0002\nA✓ 可以通过推定的方式认定甲主观明知：两高一部《办理毒品犯罪案件规范意见》规定，行为人具有高度反常情形（如\u0001收取明显高于市场正常价格数倍运费\u0002、明知寄件人故意撕换拆改外包装掩人耳目仍违规全国跨省运输管制致瘾精神药品）而不能作出合理解释的，司法机关\u0001可以推定其“明知是毒品”\u0002\nB✗ 运输毒品罪只看所运毒品数量或情节，不要求必须证明行为人实际获利金额达到特定标准（哪怕免费帮带或未收到运费亦可构罪）\nC✗ 《刑法》第347条第5款明文规定：\u0001单位犯走私、贩卖、运输、制造毒品罪的，实行双罚制\u0002；一人有限责任公司依法可构成单位运输毒品罪（既处罚公司也追究法定代表人甲刑责），并非“只能追究自然人”\nD✗ 《刑法》第357条第2款刚性规定毒品数量以查证属实数量计算，\u0001绝对不以纯度折算\u0002","k":"","kb":75,"kh":[[231,286]]},{"id":"2024-17","y":2024,"t":"单","s":"甲通过即时通信软件销售某品牌保健品,为吸引客户浏览在客户群组发送淫秽视频链接,并因此提高了销量,情节严重,获利巨大,甲的行为如何认定（ ）。","o":["非法经营罪","虚假广告罪","传播淫秽物品牟利罪","传播淫秽物品罪"],"a":"D","e":"\u0001为卖普通保健品而单纯在客户群组发“淫秽视频链接”当诱饵吸引客户点开群组浏览提高保健品销量（并非通过直接售卖淫秽视频或会员点击付费赚钱），不具有“传播淫秽物品直接牟利”目的，仅定传播淫秽物品罪。\u0002\nA✗ 虽属违法恶意营销宣传，但传播淫秽视频引流由专门保护社会管理风尚之淫秽物品罪条款专门调整\nB✗ 题干并未交代保健品本身存在欺诈虚假夸大疗效广告内容\nC✗ 《刑法》第363条传播淫秽物品牟利罪要求“以牟利为目的”，两高解释强调行为人直接以出卖、出租、收费观看、广告分成等\u0001靠淫秽物品本身传播直接换取非法利益\u0002；此处甲收费卖的是保健品而非淫秽链接，发送淫秽链接只是免费拉人气手段，不成立牟利型\nD✓ 传播淫秽物品罪：在社交软件客户群组发送大量淫秽视频链接（达到情节严重程度）吸引浏览，虽客观促进了保健品销量，但并未通过贩卖传播淫秽信息本身直接收费牟利，依《刑法》第364条定\u0001传播淫秽物品罪\u0002","k":"","kb":76,"kh":[[240,315]]},{"id":"2024-18","y":2024,"t":"单","s":"甲乘坐飞机抵达我国某机场时,因携带毒品被海关查获,经鉴定,甲携带毒品净重超过2公斤,甲的行为如何认定（ ）。","o":["贩卖毒品罪(预备)","运输毒品罪(未遂)","非法持有毒品罪(中止)","走私毒品罪(既遂)"],"a":"D","e":"\u0001乘坐国际航班抵达我国某机场时随身携带2公斤毒品在海关当场被查获，飞机已降落我国领土、行为人及毒品已经实际越过我国国境线入境，依法构成走私毒品罪（既遂）。\u0002\nA✗ 已经在国际旅行途中把毒品随身携带入中国机场海关口岸，远远越过预备阶段\nB✗ 在海关内虽属进境运输，但行为人携带毒品自境外跨越国（边）境进入我国领土控制范围，应首先评价走私入境而非国内运输\nC✗ 被海关现场执法人员查获绝非主动中止，且两公斤走私入境早已构罪\nD✓ 走私毒品罪（既遂）：两高毒品纪要及通说认为，采取隐瞒夹带等逃避海关监管方式乘坐国际航班飞抵我国机场，行为人携带毒品\u0001实际入境跨越我国国境线即成立走私毒品罪既遂\u0002（在机场海关查验通道被查获不影响走私入境既遂之认定）","k":"","kb":75,"kh":[[162,204]]},{"id":"2024-42","y":2024,"t":"多","s":"下列致使判决、裁定无法执行的情形中,属于拒不执行判决、裁定罪中有能力执行而拒不执行,情节严重的有（ ）。","o":["被执行人隐藏财产","被执行人转移财产","担保人转让已向人民法院提供担保的财产","担保人故意毁坏已向人民法院提供担保的财产"],"a":"ABCD","e":"\u0001依两高《拒执罪司法解释》，被执行人隐藏、转移财产，以及担保人转让、故意毁坏已向法院提供担保的财产，均属于“有能力执行而拒不执行，情节严重”。\u0002\nA✓ 被执行人隐藏财产致使法院生效判决、裁定无法执行的，属于典型拒执罪\nB✓ 被执行人转移财产规避强制执行的，属于典型拒执罪\nC✓ 担保人（含拒执案件中为判决执行向法院提供担保之人）擅自转让已向法院提供担保的财产致使无法执行的，司法解释明确列入“情节严重”\nD✓ 担保人故意毁坏已向法院提供担保的财产致使判决无法执行的，同样依法以拒不执行判决、裁定罪追责","k":"","kb":73,"kh":[[190,235]]},{"id":"2024-45","y":2024,"t":"多","s":"位于河道上游的甲企业违规向河流中排放含有酸性有害物质的工业废水,严重污染环境,位于下游的乙企业违规将含有碱性有害物质的废水排入河流,严重污染环境,两种废水混合发生反应产生某种有毒物质致使多人重伤。对此,下列选项正确的有（ ）。","o":["甲企业的行为认定为污染环境罪(基本犯)","甲企业的行为认定为污染环境罪(结果加重犯)","乙企业的行为认定为污染环境罪 (基本犯)","乙企业的行为认定为污染环境罪(结果加重犯)"],"a":"BD","e":"\u0001上游甲企业排酸性废水、下游乙企业排碱性废水，各自违规排污均严重污染环境；两股废水混合生成有毒物质致多人重伤（累积因果关系且各行为均为加重后果发生之必要原因），两企业各自构成污染环境罪（结果加重犯）。\u0002\nA✗ 由于客观上已经因排放行为协同混流反应造成“多人重伤”的严重人体伤亡后果，突破了基本犯范畴\nB✓ 污染环境罪的结果加重犯（《刑法》第338条及两高污染环境解释）：甲企业违规排酸，其酸性废水与下游碱性废水混合化学反应导致多人重伤，即便两企业事前无意思联络，因各自违法行为共同累积引发且缺一不可造成加重伤亡结果（累积因果关系），甲企业成立\u0001污染环境罪（结果加重犯）\u0002\nC✗ 同理，乙企业不能仅定基本犯\nD✓ 乙企业违规排碱也是引发剧毒混流致多人重伤不可或缺的条件，乙企业同样成立\u0001污染环境罪（结果加重犯）\u0002","k":"","kb":76,"kh":[[330,380]]},{"id":"2025-15","y":2025,"t":"单","s":"甲冒用购物网站买家身份进入网站内部评价系统,删改购物评价,后果严重。甲的行为应认定为（ ）。","o":["不构成犯罪","破坏计算机信息系统罪","非法利用信息网络罪","非法侵入计算机信息系统罪"],"a":"B","e":"\u0001冒用他人买家身份登录购物网站后台评价系统“恶意删改”存储其中的商品购物评价数据造成严重后果，破坏了计算机系统内存储数据完整性与正常运行，构成破坏计算机信息系统罪。\u0002\nA✗ 删改网店核心经营数据造成严重后果，绝非单纯民事侵权，已构成严重信息网络犯罪\nB✓ 破坏计算机信息系统罪：依据《刑法》第286条第2款，违反国家规定，对计算机信息系统中\u0001存储、处理或者传输的数据和应用程序进行删除、修改、增加的操作\u0002，后果严重的，依照前款（破坏计算机信息系统罪）规定处罚\nC✗ 非法利用信息网络罪是专门针对建群组、发广告等为他人犯罪搭桥准备的工具类行为，不涵盖直接动手篡改后台数据\nD✗ 非法侵入计算机信息系统罪（第285条第1款）仅保护\u0001国家事务、国防建设、尖端科学技术领域\u0002的系统；购物网站属于普通民商事商业平台","k":"","kb":76,"kh":[[106,185]]},{"id":"2026-5","y":2026,"t":"单","s":"甲通过技术手段非法获取上百户家庭的摄像头控制权限,远程观看他人隐私画面,并截图保存部分画面。甲的行为应认定为","o":["传播淫秽物品罪","非法利用信息网络罪","侵犯公民个人信息罪","非法控制计算机信息系统罪"],"a":"D","e":"\u0001利用技术手段非法获取上百户家庭智能摄像头控制权限并远程偷窥隐私画面、截图留存，侵害计算机系统控制安全，定非法控制计算机信息系统罪。\u0002\nA✗ 仅个人偷看及截图保存并未向外向他人广泛传播淫秽视频\nB✗ 并未设立违法犯罪网站、群组或发布违法犯罪招募交易信息\nC✗ 本罪核心行为是通过网络木马或漏洞控制接管上百户家用物联网摄像头设备（计算机信息系统），而非单纯倒卖汇总数据库公民个人身份证电话行踪信息\nD✓ 非法控制计算机信息系统罪：家庭联网监控摄像头属于计算机信息系统范畴，甲通过技术手段非法获取上百户控制权限远程操控偷窥，完全符合《刑法》第285条第2款\u0001非法控制计算机信息系统罪\u0002","k":"","kb":76,"kh":[[27,86]]},{"id":"2026-10","y":2026,"t":"单","s":"下列选项中,属于袭警罪规定的“暴力袭击”的是","o":["打砸警车危及警察人身安全","与警察有轻微肢体冲突","为摆脱警察抓捕实施挣脱行为","对警察实施辱骂、讽刺行为"],"a":"A","e":"\u0001依据《两高一部关于依法惩治袭警违法犯罪行为的指导意见》，对警车实施打砸直接危及车内/现场警察人身安全的属于袭警罪“暴力袭击”；轻微肢体冲突、单纯挣脱和辱骂不构成袭警罪。\u0002\nA✓ 打砸警车危及警察人身安全：最高法、最高检、公安部指导意见明确规定，不仅直接殴打撕咬警察本人，\u0001打砸、冲撞警车等直接危及警察人身安全的暴力行为\u0002亦属于袭警罪的“暴力袭击”\nB✗ 在执法纠缠中发生“轻微肢体冲突”但明显未达到暴力袭击危及人身安全程度（如推搡磕碰），一般不以袭警罪论处（治安管理处罚）\nC✗ 犯罪嫌疑人为躲避抓捕本能用力向后挣脱手腕、转身逃跑，属于消极抵抗摆脱而非主动攻击袭击警察\nD✗ 口头辱骂、讽刺警察属于侮辱言语冒犯而非“暴力袭击”（构成治安处罚或寻衅侮辱，非袭警罪）","k":"","kb":72,"kh":[[126,164]]},{"id":"2026-19","y":2026,"t":"单","s":"【案情】甲谎称主审法官是自己的大学同学，骗取当事人家属信任，担任刑事案件辩护人，并收取高额律师费。辩护失败拒不返还。事后查明甲的律师身份系伪造。\n如甲在诉讼过程中出示当事人提供的不实证据,该行为应认定为","o":["不构成犯罪","伪证罪","辩护人伪造证据罪","帮助伪造证据罪"],"a":"C","e":"\u0001冒充律师骗取当事人信任担任刑事案件辩护人（在形式上已进入刑事诉讼担任诉讼辩护人角色），并在庭审/诉讼中出示当事人提供的不实伪造证据，构成第306条辩护人伪造证据罪。\u0002\nA✗ 故意在刑事诉讼中出示不实伪证干扰司法公正，依法构罪（假冒辩护人亦受实质诉讼地位规制）\nB✗ 《刑法》第305条伪证罪的主体限定为刑事诉讼中的\u0001证人、鉴定人、记录人、翻译人\u0002四类人员，不包括辩护人\nC✓ 辩护人伪造证据罪：甲虽假冒律师身份但实际上已被接受委托作为该刑事案件的\u0001辩护人\u0002参与诉讼，并在刑事诉讼过程中故意出示当事人提供的不实虚假证据，符合《刑法》第306条\u0001辩护人毁灭证据、伪造证据罪\u0002（按2026真题官方结论，哪怕伪造律师身份仍承担辩护人伪造证据罪主体责）\nD✗ 《刑法》第307条第2款帮助毁灭、伪造证据罪是一般主体针对他人诉讼帮忙作伪；而在刑事诉讼中由本人以辩护人身份提交假证，依特别规定适用第306条","k":"","kb":72,"kh":[[327,351]]},{"id":"2026-43","y":2026,"t":"多","s":"2023 年,甲伪造某市人力资源和社会保障局劳动力管理专用章以及该市多家建筑公司印章。2025 年,甲在该市多个公开招标工程项目中冒用上述建筑公司资质,并使用伪造的劳动管理专用章制作若干虚假的社保缴费单,帮助乙围标并最终中标,中标项目总金额1000 万元。对此,下列说法正确的有","o":["甲构成串通投标罪","甲的行为构成伪造公司印章罪","甲的行为构成伪造国家机关印章罪","对甲应从一重罪处断"],"a":"ABC","e":"\u0001伪造人社局专章（伪造国家机关印章罪）、伪造多家建筑公司印章（伪造公司印章罪）、冒用资质并用假社保单帮人围标中标1000万（串通投标罪），分别构成三罪且应数罪并罚。\u0002\nA✓ 帮助乙使用多家虚假企业资质围标并成功中标1000万元（达情节严重标准），成立《刑法》第223条\u0001串通投标罪\u0002\nB✓ 先后伪造多家建筑公司印章，构成《刑法》第280条第2款\u0001伪造公司印章罪\u0002\nC✓ 伪造某市人力资源和社会保障局劳动力管理专用章，人社局属于国家行政机关，构成《刑法》第280条第1款\u0001伪造国家机关印章罪\u0002\nD✗ 伪造国家机关印章与伪造公司印章在2023年即已先行分别完成（而且二者侵犯不同性质印章公信力本即数罪），后在2025年多个工程项目中广泛使用帮助围标，分别侵害公私印章公信力及工程市场公平招投标秩序，依法实行\u0001数罪并罚\u0002（不按牵连犯从一重罪处断）","k":"","kb":77,"kh":[[42,145]]}]},{"sub":"民法","name":"婚姻家庭","w":2.2,"L":41,"qs":[{"id":"2005-45","y":2005,"t":"单","s":"依据我国《婚姻法》的有关规定,可撤销婚姻的撤销事由是（ ）。","o":["重婚","未到法定婚龄","因欺诈而结婚","因胁迫而结婚"],"a":"D","e":"\u0001依《民法典》第1052条（原《婚姻法》第11条），因胁迫结婚的属可撤销婚姻（现《民法典》另增一方隐瞒重大疾病不如实告知）；重婚与未到婚龄为无效婚姻，普通欺诈不构成可撤销。\u0002\nA✗ 重婚属于自始绝对无效的“无效婚姻”。\nB✗ 未到法定婚龄属于“无效婚姻”。\nC✗ 我国婚姻法对一般“欺诈”（如虚报家境学历）不认定为可撤销事由，仅特定重大疾病隐瞒可撤销。\nD✓ 因受对方或第三人胁迫违背真实意愿结婚的，受胁迫方自结婚登记或脱离人身自由限制起1年内可向法院请求撤销婚姻。","k":"","kb":151,"kh":[[314,347]]},{"id":"2005-53","y":2005,"t":"多","s":"依据我国《婚姻法》的规定,有下列情形,调解无效,应判决准予离婚的是（ ）。","o":["因感情不和分居满一年的","重婚或有配偶者与他人同居的","实施家庭暴力或虐待、遗弃家庭成员的","有赌博、吸毒等恶习屡教不改的"],"a":"BCD","e":"\u0001依《民法典》第1079条第3款，重婚或与他人同居、家暴或虐待遗弃、赌博吸毒恶习屡教不改经调解无效的应准予离婚；因感情不和分居必须满“二年”而非一年。\u0002\nA✗ 法定的应准予离婚标准是因感情不和分居满“二年”（2年），分居满一年尚未达标。\nB✓ 重婚或者与他人同居属破坏一夫一妻制重大过错，调解无效应当判决离婚。\nC✓ 实施家庭暴力或者虐待、遗弃家庭成员严重伤害身心健康，调解无效应当准予离婚。\nD✓ 有赌博、吸毒等恶习屡教不改经调解无效的，应当准予离婚。","k":"","kb":152,"kh":[[402,449]]},{"id":"2006-34","y":2006,"t":"单","s":"某甲出生后不久,父母协议离婚。引起某甲与其父母之间抚养关系发生及甲之父母婚姻关系解除的法律事实分别是（ ）。","o":["事件、事件","行为、行为","事件、行为","行为、事件"],"a":"C","e":"\u0001自然人出生属于不以人的意志为转移的自然事实即“事件”（一经出生即依法发生父母子女法定抚养关系）；而双方协议离婚则是当事人意思表示决定的“法律行为”。\u0002\nA✗ 协议离婚由双方达成解除婚姻协议并登记完成，属于法律行为而非自然事件。\nB✗ 婴儿出生是生理自然事件，并非刚出生的婴儿与父母所作民事法律行为。\nC✓ 出生引起父母子女抚养关系依法发生属于法律“事件”；父母协议登记离婚引起婚姻关系解除属于民事法律“行为”。\nD✗ 先后关系刚好写反。\n记法：法硕真题经典对照：自然人的出生与死亡本身都是客观自然事实（事件），协议结婚和协议离婚都是双方意思表示行为。","k":"","kb":151,"kh":[[44,55]]},{"id":"2006-48","y":2006,"t":"单","s":"在夫妻双方没有约定时,婚姻关系存续期间所得的下列财产中属于夫妻共同财产的是（ ）。","o":["一方专用的生活用品","一方的婚前财产","一方身体受到伤害获得的医疗费","一方的知识产权收益"],"a":"D","e":"\u0001依《民法典》第1062条，婚姻关系存续期间所得的知识产权实际收益属于夫妻共同财产；一方专用生活用品、婚前财产与因伤获医疗费归个人所有。\u0002\nA✗ 一方专用的生活用品（如衣物鞋帽）归一方个人所有。\nB✗ 一方的婚前财产属于个人财产。\nC✗ 一方因受到人身损害获得的赔偿或者补偿（含医疗费）归个人所有。\nD✓ 婚姻关系存续期间所得的知识产权财产性收益（如已实现取得或明确可得的版权费、专利转让费）归夫妻共同所有。","k":"","kb":152,"kh":[[69,88],[146,183]]},{"id":"2006-49","y":2006,"t":"单","s":"某甲的外祖父与某乙的父亲是亲兄弟,某丙的外祖母与某丁的祖母是亲姐妹。则（ ）。","o":["某甲与某乙、某丙与某丁的婚姻均有效","某甲与某乙、某丙与某丁的婚姻均无效","某甲与某乙的婚姻均无效,某丙与某丁的婚姻均有效","某甲与某乙的婚姻均有效,某丙与某丁的婚姻均无效"],"a":"A","e":"\u0001旁系血亲代数计算至双方共同直系尊亲属较高一方代数为准：外祖父与父亲系亲兄弟、外祖母与祖母系亲姐妹，均在四代旁系血亲之外（第四代），不属于三代以内禁婚范围，婚姻均有效。\u0002\nA✓ 甲→母→外祖父→曾祖父母为4代；丙→母→外祖母→曾外祖父母也为4代，甲乙与丙丁均为四代旁系血亲，不在《民法典》第1048条“三代以内旁系血亲”禁止结婚之列，两对婚姻均合法有效。\nB✗ 仅三代以内旁系血亲（如亲表兄妹即三代）才禁止结婚无效，四代起允许通婚。\nC✗ 甲、乙实为隔代远房表舅甥关系（外祖父的亲兄弟是甲的舅公，乙是舅公之子即甲母的亲表弟——共4代旁系血亲），非三代。\nD✗ 丙、丁同样相距四代旁系血亲，亦合法有效。","k":"","kb":151,"kh":[[82,139]]},{"id":"2007-47","y":2007,"t":"单","s":"在我国,结婚的必备条件之一是 （ ）。","o":["双方不得有血亲关系","双方完全自愿","双方签订婚约","男方在 25 周以上,女方在 23 周岁以上"],"a":"B","e":"\u0001依《民法典》第1046条（原《婚姻法》第5条），结婚应当男女双方完全自愿，禁止任何一方对另一方加以强迫，禁止任何组织或者个人加以干涉。\u0002\nA✗ 法律只禁止直系血亲和三代以内的旁系血亲结婚，四代及以上旁系远亲血亲并未禁止。\nB✓ 结婚男女双方完全自愿，是婚姻自由原则的核心和结婚的首要必备实质要件。\nC✗ 订立婚约不是结婚的法律前置程序，法律不保护强制婚约效力。\nD✗ 我国《民法典》第1047条规定的法定婚龄是“男不得早于二十二周岁，女不得早于二十周岁”（25与23曾是倡议晚婚年龄，非法定必备条件）。","k":"","kb":151,"kh":[[56,64]]},{"id":"2007-48","y":2007,"t":"单","s":"甲（女，8周岁）之父病故后，甲母一人抚养甲及其弟、妹，备感艰辛，遂决定将甲送与他人收养。依我国收养法规定，下列人员中可以作为收养人的是（ ）。","o":["乙，女，29周岁，未婚，无子女，有抚养能力","丙,男, 45 周岁,离婚,无子女,有抚养能力","丁,女, 38 周岁,丧偶,无子女,有抚养能力","戊,女, 42 周岁,已婚,一子已上大学,有抚养能力"],"a":"C","e":"\u0001收养人须年满30周岁、无不利犯罪且有抚养能力（并受无配偶收养异性须差40岁及旧法无子女条件约束）：仅38岁丧偶无子女女性丁收养8岁同性女孩甲合法有效。\u0002\nA✗ 乙仅29周岁，未达到法定收养人必须年满30周岁的最低年龄要求。\nB✗ 无配偶的男性丙（45周岁）收养女性甲（8周岁），年龄仅差37周岁，不满法定的“应当相差四十周岁以上”条件。\nC✓ 丁（女，38周岁）年满30周岁且丧偶无子女有抚养能力，同性收养不受40周岁年龄差限制，合法有效。\nD✗ 2007年考试时尚适用旧《收养法》要求收养人“无子女”（注意现行《民法典》已放宽为只有一名子女亦可收养一名，但2007题干在旧法时代且该选项仅列戊个人已婚“单独”未言夫妻共同收养亦有问题，丁依然是最无瑕疵标准答案）。\n【新法提示】现行《民法典》第1098、1100条放宽了收养人子女数限制（已有1名子女的夫妻可共同收养1名子女），第1102条将40周岁年龄差扩大适用于所有“无配偶者收养异性子女”。","k":"","kb":153,"kh":[[74,96],[152,164],[198,220]]},{"id":"2007-51","y":2007,"t":"多","s":"甲因海难下落不明,被法院宣告死亡。两年后,甲重新出现。法院依甲的申请撤销了对甲的死亡宣告。甲与原配偶的婚姻关系不能自行恢复的情形包括 （ ）。","o":["原配偶虽未再婚,但拒绝与甲恢复婚姻关系","原配偶再婚,但愿意与甲恢复婚姻关系","原配偶再婚后其配偶病故","原配偶再婚后又离婚"],"a":"BCD","e":"\u0001被宣告死亡人重新出现并撤销死亡宣告后，只要其配偶已与他人“再婚”，不论原配偶现在是否愿意恢复、再婚配偶之后是否病故或者再次离婚，原婚姻一律不得自行恢复。\u0002\nA✗ 依据《民法典》第51条，只要原配偶“未再婚”，婚姻关系自撤销死亡宣告之日起即自行恢复（不因原配偶单方嘴上拒绝恢复而阻却自行恢复，若不愿继续可随后办离婚！）。\nB✓ 只要原配偶曾经再婚，即使之后又非常愿意与生还者恢复，原婚姻关系也绝对不能自行恢复。\nC✓ 原配偶再婚后即便新配偶很快病故再次恢复单身，旧婚姻亦早已因再婚消灭而不能自行恢复，必须重新办理复婚登记。\nD✓ 原配偶再婚后即便又离婚，也不能让已被再婚打断的前一段婚姻关系自动起死回生。\n记法：死而复生婚姻恢复黄金法则：原配偶没再婚→直接自动恢复（即使拒绝恢复也得先恢复再去离）；一旦再过婚（哪怕后死偶或又离了）→绝对不恢复，想在一起只能重新领证！","k":"","kb":151,"kh":[[420,430]]},{"id":"2008-46","y":2008,"t":"单","s":"根据婚姻法规定,下列情形属于无效婚姻的是（ ）。","o":["与丙同居多年的甲与乙缔结的婚姻","甲因受胁迫与乙缔结的婚姻","甲因受欺诈与乙缔结的婚姻","甲与其祖父的外孙女缔结的婚姻"],"a":"D","e":"\u0001甲与其祖父的外孙女（即甲的亲姑表妹）同源于甲之祖父，属于三代以内的旁系血亲，违反《民法典》第1048条禁婚规定，所缔结的婚姻自始绝对无效。\u0002\nA✗ 有配偶者与他人同居重婚才无效；曾与他人同居后分手并不阻碍和他人合法结婚。\nB✗ 因受胁迫结婚属于可撤销婚姻，而非自始无效婚姻。\nC✗ 因一般欺诈结婚既不无效也不可撤销，婚姻有效。\nD✓ 甲（己身1）→父（2）→祖父（3）；祖父的外孙女（1）→母/姑姑（2）→祖父（3），双方同出于祖父处于三代以内旁系血亲，属于法定无效婚姻。","k":"","kb":151,"kh":[[82,168]]},{"id":"2009-46","y":2009,"t":"单","s":"根据婚姻法规定,夫妻对婚姻关系存续期间所得的财产约定归各自所有的,对夫或妻一方对外所负的债务（ ）。","o":["债权人知道该约定的,以夫或妻一方所有的财产清偿","债权人知道该约定的,以夫和妻所有的财产清偿","债权人不知道该约定的,以夫或妻一方所有的财产清偿","无论债权人是否知道该约定,都以夫和妻所有的财产清偿"],"a":"A","e":"\u0001依《民法典》第1065条第3款（原《婚姻法》第19条第3款），夫妻约定实行分别财产制且“第三人知道该约定的”，对夫或妻一方对外所负债务以夫或妻一方所有的个人财产清偿。\u0002\nA✓ 债权人知道夫妻分别财产约定的，该约定对债权人生效，由负债一方以自己所有的个人财产清偿（除非用于夫妻共同生活形成共同意思表示）。\nB✗ 如债权人明知双方分别财产制仍放贷，无权找无债务一方配偶承担连带清偿。\nC✗ 债权人“不知道”夫妻内部各自财产制约定的，该内部约定不得对抗善意第三人（按法定共同生活及债务规则认定）。\nD✗ 忽略了“债权人是否知道”对分别财产制外部对抗效力的关键区分。","k":"","kb":152,"kh":[[293,320]]},{"id":"2011-34","y":2011,"t":"单","s":"根据《婚姻法》的规定,法院审理离婚案件,准予离婚的情形是（ ）。","o":["夫妻感情确已破裂","婚姻关系确已破裂","一方有过错","双方已就子女抚养和财产分割协商一致"],"a":"A","e":"\u0001依据《民法典》第1079条第2款（原《婚姻法》第32条第2款），人民法院审理离婚案件应当进行调解；如果夫妻感情确已破裂、调解无效的，应当准予离婚。\u0002\nA✓ 我国离婚诉讼的法定实质标准即“夫妻感情确已破裂”（且调解无效）。\nB✗ 法条规范用语严格为“夫妻感情确已破裂”，非泛指婚姻关系外形破裂。\nC✗ 单方有过错若未达到法定感情破裂且无过错方仍不同意或经调解和好，不当然一律判决离婚。\nD✗ 协议离婚才以协商一致为基础；法院诉讼离婚主要判断感情是否确已破裂。","k":"","kb":152,"kh":[[402,437]]},{"id":"2011-35","y":2011,"t":"单","s":"根据《婚姻法》的规定,离婚时,原为夫妻共同生活所负的债务,应当共同偿还;共同财产不足清偿的,其处理办法是（ ）。","o":["双方不再负清偿责任","由双方协议清偿;协议不成时,由人民法院判决","由双方协议清偿;协议不成时,依法由双方各清偿一半","由双方协议清偿;协议不成时,依法由经济条件较好的一方清偿"],"a":"B","e":"\u0001依《民法典》第1089条，离婚时原为夫妻共同生活所负债务应当共同偿还；共同财产不足清偿或财产归各自所有的，由双方协议清偿，协议不成的由人民法院判决。\u0002\nA✗ 不能因离婚共同财产分完便逃避对外未清偿的合法共同债务。\nB✓ 完全契合《民法典》第1089条原文：共同财产不足清偿或者财产归各自所有的，由双方协议清偿；协议不成的，由人民法院判决。\nC✗ 法院在判决时会考量双方经济能力、抚养负担与过错等因素酌定分担，并非机械一律各半。\nD✗ 没有直接硬性判令由经济较好一方包揽清偿的规定。","k":"","kb":152,"kh":[[370,400]]},{"id":"2011-36","y":2011,"t":"单","s":"在我国,有权宣告婚姻无效的机关是（ ）。","o":["公安机关","人民法院","婚姻登记机关","基层组织"],"a":"B","e":"\u0001我国确认婚姻无效只能向人民法院提起诉讼申请，唯有“人民法院”有权依法宣告婚姻无效（婚姻登记机关现行法下仅对被胁迫撤销等不再受理，只法院享有婚姻无效宣告权）。\u0002\nA✗ 公安机关负责户籍治安等行政管理，无权确认民事婚姻效力。\nB✓ 依《民法典》第1051条及婚姻家庭编司法解释（一），仅有“人民法院”有权依法受理并宣告婚姻无效。\nC✗ 民政婚姻登记机关在可撤销婚姻中也已被《民法典》第1052条删去撤销权（仅法院可行使婚姻无效宣告与撤销权，登记机关仅处理错登更正等行政纠错）。\nD✗ 居委会、村委会等基层群众自治组织无权宣告婚姻无效。","k":"","kb":151,"kh":[[285,312]]},{"id":"2011-37","y":2011,"t":"单","s":"下列情形中,收养关系有效的是（ ）。","o":["29周岁的某单身女子收养1周岁的孤儿","44周岁的某单身男子收养5周岁的女孩","46周岁的某单身女子收养12周岁的男孩","48周岁的某男与妻子生育一女后共同收养父母尚健在的2周岁男孩"],"a":"D","e":"\u0001依《民法典》第1098、1100、1102条，现行法放宽为已有“一名子女”的夫妻共同收养一名子女合法有效；而46岁单身女子收养12岁男孩因异性年龄差未满40周岁在现行法下不能成立。\u0002\nA✗ 29周岁未达到收养人须“年满三十周岁”的法定年龄下限。\nB✗ 44岁单身男收养5岁女孩，年龄仅差39周岁，不满“应当相差四十周岁以上”要求。\nC✗ 原《收养法》时代单身女性收养男孩不要求差40岁（当年曾选C），但现行《民法典》第1102条已修改为所有“无配偶者收养异性子女”均须相差40周岁以上（46与12仅差34岁），故现行法下不能成立！\nD✓ 依《民法典》第1098、1100条，已有一名子女的夫妻依法可以共同收养一名子女，48岁夫妇有抚养能力共同收养合法（注：生父母尚健在须同时符合《民法典》第1093条“生父母有特殊困难无力抚养”的送养前提）。\n【新法提示】2011年考题按旧《收养法》原答为无子女单身女子收养男孩；现行《民法典》第1098条允许已有1名子女者收养1名，且第1102条扩大了40岁年龄差限制覆盖无配偶女性收养男孩，故现行标准答案已调整为已育一女之夫妇共同收养。","k":"","kb":153,"kh":[[86,130],[199,249]]},{"id":"2011-38","y":2011,"t":"单","s":"养子女与生父母之间的权利义务关系因收养关系的成立而（ ）。","o":["中止","中断","延缓","解除"],"a":"D","e":"\u0001依据《民法典》第1111条第2款（原《收养法》第23条第2款），养子女与生父母以及其他近亲属间的权利义务关系，因收养关系的成立而“消除/解除”。\u0002\nA✗ 并非暂时停顿待恢复的中止状态。\nB✗ 不存在时效重新起算式的“中断”。\nC✗ 并非延迟生效的“延缓”。\nD✓ 收养关系一经合法成立，养子女成为养父母法律上的拟制血亲子女，其与原生父母间的抚养赡养继承等民事权利义务关系即归于彻底“解除”（《民法典》第1111条用词为“消除”）。","k":"","kb":153,"kh":[[332,350]]},{"id":"2012-38","y":2012,"t":"单","s":"没有配偶且符合其他结婚条件的男女同居生活的,如果当事人向法院起诉请求解除同居关系,人民法院（ ）。","o":["按离婚处理","不予受理","按解除同居关系处理","对有子女的按离婚处理"],"a":"B","e":"\u0001没有配偶且符合结婚条件男女纯粹同居生活的，不形成合法婚姻关系；一方仅请求法院“解除同居关系”的，人民法院依法不予受理（仅就财产分割与子女抚养争议方予受理）。\u0002\nA✗ 未登记领取结婚证的同居关系不受合法婚姻效力保护，不得按离婚程序审理。\nB✓ 依《民法典婚姻家庭编解释（一）》第3条，当事人仅提起诉讼请求解除同居关系的，人民法院不予受理；只有对因同居期间财产分割或者子女抚养纠纷提起诉讼的，法院才依法受理。\nC✗ 除涉及早年1994年前符合条件事实婚姻或有配偶者与他人同居外，普通双方无配偶纯求解除同居直接裁定不予受理。\nD✗ 有同居非婚生子女纠纷只受理“子女抚养权/抚养费”诉讼，本身同居关系仍不按离婚处理。","k":"","kb":151,"kh":[[373,418]]},{"id":"2012-39","y":2012,"t":"单","s":"无配偶的男性收养女性的,收养人与被收养人之间的年龄差应当为（ ）。","o":["30周岁以上","35周岁以上","40周岁以上","45周岁以上"],"a":"C","e":"\u0001依据《民法典》第1102条（及原《收养法》第9条），无配偶的男性收养女性（现《民法典》已扩至所有无配偶者收养异性子女）的，收养人与被收养人的年龄应当相差四十周岁以上。\u0002\nA✗ 30周岁是法定收养人的最低自身实岁年龄，非异性年龄差要求。\nB✗ 35周岁无法律依据。\nC✓ 无配偶者收养异性子女年龄差底线为“40周岁以上”，旨在防止伦理失范并保护未成年人利益。\nD✗ 45周岁过高。","k":"","kb":153,"kh":[[199,220]]},{"id":"2012-40","y":2012,"t":"单","s":"未成年养子女与养父母解除收养关系的,其与生父母之间的权利义务关系（ ）。","o":["自行恢复","经人民法院判决后恢复","经生父母同意后恢复","经生父母与养父母协商同意后恢复"],"a":"A","e":"\u0001依《民法典》第1117条（原《收养法》第29条），收养关系解除后，养子女与养父母的权利义务消除；如果被收养人尚未成年，其与生父母间的权利义务关系“自行恢复”。\u0002\nA✓ 《民法典》第1117条明文区分：未成年养子女解除收养关系的，与生父母间权利义务“自行恢复”（以防未成年人沦为无人监护孤儿）；若已成年解除，则需双方协商一致方恢复。\nB✗ 未成年人无须法院另行判令恢复，法律直接赋予自行恢复效力。\nC✗ 为充分保障未成年人基本监护保障权益，生父母不能拒绝自行恢复。\nD✗ 协商一致仅针对“成年”养子女解除收养后是否恢复权利义务。","k":"","kb":153,"kh":[[432,456]]},{"id":"2013-24","y":2013,"t":"单","s":"甲、乙结婚多年。某日,甲外出后失踪,乙四处寻找仍无结果。五年后,乙欲与丙登记结婚。根据我国民法相关规定,下列选项中正确的是（ ）。","o":["乙、丙二人可以直接登记结婚","乙只能申请宣告甲死亡,待法院宣告甲死亡后再与丙登记结婚","丙可以申请宣告甲死亡,待法院宣告甲死亡后再与乙登记结婚","乙可以起诉请求与甲解除婚姻关系,待法院作出离婚判决后再与丙登记结婚"],"a":"D","e":"\u0001配偶失踪5年，乙不必只能等宣告死亡后再婚；乙既可依法申请宣告甲死亡，也可直接向法院起诉离婚（法院依《民法典》第1079条第4款：一方被宣告失踪另一方提起离婚诉讼的应当准予离婚，或按普通离婚公告送达判决离婚后持证再婚）。\u0002\nA✗ 前婚关系在未经离婚或死亡宣告终结前依然有效存续，直接登记结婚将构成重婚罪且新婚无效。\nB✗ 甲虽已失踪5年达宣告死亡年限，但申请宣告死亡并不是唯一路径，法律允许直接提起离婚诉讼解除婚姻。\nC✗ 丙系第三人、无婚姻利害亲属或债权债务利益，根本不具备申请宣告甲死亡的利害关系人主体资格。\nD✓ 乙完全可以直接向法院起诉请求判决与甲解除婚姻关系，拿到生效离婚判决书后再依法与丙办理结婚登记。","k":"","kb":151,"kh":[[420,463]]},{"id":"2013-27","y":2013,"t":"单","s":"在婚姻关系存续期间所得的下列财产,归夫或妻一方所有的是（ ）。","o":["参加体育比赛所获奖金","因身体受到伤害获得的医疗费","通过法定继承分得的遗产","以婚前个人存款炒股所得的收益"],"a":"B","e":"\u0001依据《民法典》第1063条第2项，一方因受到人身损害获得的赔偿或者补偿（医疗费、残疾补助费等）属于个人财产；比赛奖金、法定继承无指定遗产及个人婚前存款婚后炒股收益均归夫妻共同所有。\u0002\nA✗ 婚姻存续期间参加体育竞赛所获奖金属于工资、奖金范畴，归夫妻共同所有。\nB✓ 因身体受到伤害获得的医疗费、残疾人生活补助费等具有高度人身救助补偿属性，明确属于夫妻一方的个人财产。\nC✗ 通过法定继承分得的遗产（无遗嘱指定只归一方），属于《民法典》第1062条第4项夫妻共同财产。\nD✗ 婚前个人存款本身归个人，但婚后主动积极“炒股”（投入时间精力脑力经营操作）所赚得的股票投资收益依法归夫妻共同所有（区分纯天然孳息与银行自然定期利息）。","k":"","kb":152,"kh":[[89,183]]},{"id":"2014-35","y":2014,"t":"单","s":"甲婚后通过网聊结识乙,并与之发生婚外情, 被甲妻发现。甲妻诉至法院,以甲违反忠实义务为由请求赔偿精神损害10万元,但未请求离婚。对于本案,人民法院（ ）。","o":["应当受理","不予受理","根据精神损害程度,决定是否受理","根据违反忠实义务程度,决定是否受理"],"a":"B","e":"\u0001依《民法典婚姻家庭编解释（一）》第88条，当事人仅因配偶违背夫妻忠实义务而单独提起损害赔偿请求、并未一并提起离婚诉讼的，人民法院不予受理。\u0002\nA✗ 在不愿离婚维系婚姻的情况下起诉配偶赔偿精神损失违背家庭和谐司法克制原则，不予受理。\nB✓ 司法解释明文规定：在婚姻关系存续期间，当事人不起诉离婚而单独依据忠实义务或《民法典》第1091条提出损害赔偿请求的，人民法院不予受理（注意婚外“抓小三返还赠与夫妻共同财产”除外，那是返还共有财产而非诉请配偶精神赔偿）。\nC✗ 法院不因精神损害大小酌情受理此种单纯向在婚配偶索赔精神损失之诉。\nD✗ 即便违背忠实义务程度严重，不离婚亦不能单独提起离婚损害赔偿诉讼。","k":"","kb":152,"kh":[[450,473]]},{"id":"2014-50","y":2014,"t":"多","s":"顾某欲与闫某离婚。下列情形中,顾某既可以之作为起诉离婚的理由,同时可请求损害赔偿的有（ ）。","o":["闫某变卖夫妻共同财产","闫某殴打顾某致其残疾","闫某与婚外异性同居","闫某经常赌博且屡教不改"],"a":"BC","e":"\u0001依据《民法典》第1079条与第1091条，实施家庭暴力殴打致残及与他人同居，既属于应当准予离婚的法定事由，又属于无过错方离婚时可同时主张“离婚损害赔偿”的法定过错情形。\u0002\nA✗ 婚内擅自变卖夫妻共同财产可以诉请婚内分割财产或离婚时少分不分，但不属于《民法典》第1091条列举的法定离婚损害赔偿事由（且非当然法定的判离理由）。\nB✓ 殴打致残属于实施家庭暴力，既应判离，顾某又有权请求离婚损害赔偿。\nC✓ 与他人同居属于第1079条应判离情形及第1091条第2项法定损害赔偿情形。\nD✗ 赌博屡教不改经调解无效可作为法定判离理由，但在《民法典》第1091条（及原《婚姻法》第46条）中“其他重大过错”传统与2014考纲中均未单列一般赌博本身必然支持赔偿，2014真题标准多选即为BC（注：《民法典》第1091条新增第5项“有其他重大过错”兜底，严重赌博倾家荡产实务中可探讨）。","k":"","kb":152,"kh":[[474,500]]},{"id":"2015-50","y":2015,"t":"多","s":"甲与妻子乙协议离婚,约定8周岁儿子由乙抚养,甲支付抚养费。后甲与有一女儿的丙再婚,并在婚后继续给付儿子抚养费。十年后,丙因病去世。丙去世时,其近亲属还有姐姐丁。有权继承丙遗产的人有（ ）。","o":["甲","甲的儿子","丙的女儿","丁"],"a":"AC","e":"\u0001丙去世时，其配偶甲（第一顺序）及其亲生女儿（第一顺序）同为第一顺序法定继承人；甲前婚所生8岁儿子自始随生母乙抚养、与继母丙未形成扶养关系故无继承权；姐姐丁系第二顺序被排斥。\u0002\nA✓ 甲系丙的合法配偶，属于法定第一顺序继承人。\nB✗ 甲与前妻乙离婚时已约定8周岁儿子由乙直接抚养，甲仅按月支付抚养费，甲再婚后该子未与继母丙共同生活亦未受其长期实质扶养教育，故“未形成有扶养关系的继子女”身份，不能继承继母丙遗产。\nC✓ 丙的亲生女儿为法定第一顺序继承人，当然有权继承。\nD✗ 姐姐丁为第二顺序法定继承人，因存在第一顺序继承人甲与丙女，丁依法不参加继承。\n记法：看清继子女继承门槛：“有扶养关系”才继承！离婚后一直跟随生母生活、生父只寄钱的儿子与继母之间没共同生活扶养，继母死后其无继承权！","k":"","kb":152,"kh":[[89,102]]},{"id":"2016-25","y":2016,"t":"单","s":"下列权利中,属于身份权的是（ ）。","o":["名誉权","名称权","隐私权","配偶权"],"a":"D","e":"\u0001配偶权依托于合法夫妻身份关系产生，属于典型身份权；名誉权、名称权与隐私权均属于人格权。\u0002\nA✗ 名誉权属于自然人、法人均享有的核心人格权。\nB✗ 名称权属于法人和非法人组织专属的人格权。\nC✗ 隐私权属于自然人专有人格权。\nD✓ 配偶权、亲权、亲属权以婚姻血缘拟制亲属特定身份关系为基础，属于典型的身份权。\n记法：人身权二分法：人格权（生来固有，如名誉、名称、隐私）vs 身份权（因婚姻或血缘身份产生，如配偶权、亲权、亲属权）。","k":"","kb":151,"kh":[[44,55]]},{"id":"2016-36","y":2016,"t":"单","s":"甲、乙婚后开了一家便利店,由乙经营。2013 年6月起二人分居,同年9月乙向丙借款用于便利店的经营,2014年12月甲、乙离婚。不久,丙请求乙偿还到期欠款,乙拒绝。该债务应由（ ）。","o":["甲、乙承担按份责任","甲、乙承担连带责任","乙承担全部责任","乙承担责任,甲承担补充责任"],"a":"B","e":"\u0001虽已分居但尚未离婚，乙向丙借款系明确用于甲、乙夫妻婚后共同开设之便利店的共同生产经营，依法属于夫妻共同债务，应当由甲、乙双方共同承担连带清偿责任。\u0002\nA✗ 夫妻共同债务对外承担的是连带清偿责任，而非按份各承担一半。\nB✓ 依《民法典》第1064条第2款（及原婚姻法司法解释），夫妻一方在婚姻关系存续期间以个人名义超出家庭日常生活需要所负债务，债权人能够证明该债务用于夫妻共同生活、共同生产经营的，属于夫妻共同债务，由夫妻共同连带偿还。\nC✗ 虽然夫妻已分居并由乙个人实际经营出面举债，但盈利收益属家庭共享且经营本体仍系夫妻共同开设的门店，不得只让乙独自担责。\nD✗ 不存在先由乙赔、甲担补充责任的区分。","k":"","kb":152,"kh":[[321,369]]},{"id":"2016-49","y":2016,"t":"多","s":"甲、乙系夫妻。在不损害债权人利益的情况下,甲请求分割夫妻共同财产能得到法院支持的理由有（ ）。","o":["乙伪造夫妻共同债务","乙挥霍夫妻共同财产","乙隐藏夫妻共同财产","乙变卖夫妻共同财产"],"a":"ABCD","e":"\u0001依《民法典》第1066条，婚姻关系存续期间，一方有隐藏、转移、变卖、毁损、挥霍夫妻共同财产或者伪造夫妻共同债务等严重损害夫妻共同财产利益行为的，另一方可请求婚内分割共同财产。\u0002\nA✓ 伪造夫妻共同债务严重威胁共同财产安全，在不损害债权人前提下支持婚内分割。\nB✓ 挥霍夫妻共同财产属于《民法典》第1066条第1项明文列举的法定婚内分割理由。\nC✓ 隐藏夫妻共同财产属于第1066条第1项法定婚内分割事由。\nD✓ 擅自变卖夫妻共同财产损及对方利益属于第1066条第1项法定婚内分割事由。","k":"","kb":152,"kh":[[183,225]]},{"id":"2017-37","y":2017,"t":"单","s":"根据我国收养法,下列情形中,收养关系可以成立的是（ ）。","o":["甲(男,28周岁,未婚)收养2周岁的孤儿","乙(女,50周岁,离异)收养自己15周岁的亲侄子","丙(女,60周岁,丧偶)收养自己19周岁的继女","丁(女,45周岁,有配偶)单独收养自己5周岁的外甥"],"a":"B","e":"\u0001收养三代以内旁系血亲子女可不受生父母特殊困难及部分年龄差等条件限制（旧法亦不受被收养人不满14周岁限制）；28岁未满30岁、19岁已成年、有配偶未共同收养外甥均不成立。\u0002\nA✗ 甲仅28周岁，不符合收养人必须“年满三十周岁”的条件。\nB✓ 乙（女，50周岁，离异无子女）收养自己15周岁亲侄子，属于收养三代以内旁系自然血亲子女：依《民法典》第1099条（及原《收养法》第7条），收养三代以内旁系血亲的子女在旧法下即豁免不满14周岁限制、现行法放宽全部未成年人，且同代际/同居无配偶者年龄差问题——注意《民法典》第1099条亦豁免了无配偶者收养异性子女须差40周岁限制！\nC✗ 继女已满19周岁属于成年人，无论是普通收养还是继父母收养继子女，被收养人原则上必须是未满18周岁的未成年人。\nD✗ 有配偶者收养子女，依法必须由夫妻双方“共同收养”，丁单独收养无效（只有继父母收养继子女才可以单方收养）。\n【新法提示】现行《民法典》第1093条、第1099条进一步明确所有未满18周岁的未成年人均可被依法收养（删除原“不满14周岁”门槛），并明确收养三代以内旁系血亲子女同样不受第1102条“无配偶者收养异性须差40周岁”之限制。","k":"","kb":153,"kh":[[152,175],[250,313]]},{"id":"2017-38","y":2017,"t":"单","s":"甲(18周岁)伪造身份信息与乙(23周岁)登记结婚。有权以甲未达到法定婚龄为由申请宣告婚姻无效的利害关系人是（ ）。","o":["甲的近亲属","乙的近亲属","甲住所地的基层组织","乙住所地的基层组织"],"a":"A","e":"\u0001依《民法典婚姻家庭编解释（一）》第9条，以“未到法定婚龄”为由申请宣告婚姻无效的，有权提出申请的利害关系人限定为“未达到法定婚龄者的近亲属”（故仅甲的近亲属有权）。\u0002\nA✓ 针对未达法定婚龄事由，唯有未达婚龄一方当事人“甲的近亲属”属于法定适格利害关系人。\nB✗ 乙已年满23周岁达到婚龄，乙的近亲属不具备就“未达法定婚龄”事由申请宣告无效的资格（对比重婚、禁止亲属双方近亲属基层组织均可申请）。\nC✗ 村委会/居委会等基层组织只能针对重婚、禁止结婚的亲属关系申请无效，对未达法定婚龄不享有申请权。\nD✗ 乙住所地基层组织同样无申请权。","k":"","kb":151,"kh":[[232,274]]},{"id":"2018-33","y":2018,"t":"单","s":"甲声称具有某海外名校学历,与乙登记结婚。半年后,乙发现甲的毕业证书系伪造。甲、乙之间的婚姻（ ）。","o":["无效","有效","因欺诈可撤销","因重大误解可撤销"],"a":"B","e":"\u0001学历造假属于普通婚恋道德欺诈；我国《民法典》规定婚姻可撤销事由仅限受胁迫和一方隐瞒重大疾病（均不含一般欺诈），且该婚姻不涉重婚、近亲或未达婚龄，故婚姻依然有效。\u0002\nA✗ 未触及重婚、禁婚亲属关系和未到法定婚龄三类法定无效事由。\nB✓ 因学历、财产、相貌等虚假夸大包装的“欺诈结婚”既不导致婚姻无效也不构成法定可撤销事由，双方合意登记结婚依然合法有效。\nC✗ 民事法律行为一般的欺诈可撤销规则在身份结婚领域不直接适用，婚姻法有严格列举的可撤销限制（胁迫、重大疾病隐瞒）。\nD✗ 同上，不因婚姻履历存在一般重大误解而准予撤销结婚登记（若感情确已破裂仅得通过协议或诉讼离婚解除）。","k":"","kb":151,"kh":[[347,371]]},{"id":"2019-32","y":2019,"t":"单","s":"下列关于收养关系解除的说法中,正确的是（ ）。","o":["养父母遗弃未成年养子女的,养子女有权要求解除收养关系","养父母虐待未成年养子女的,送养人有权要求解除收养关系","在被收养人成年以前,收养人经民政部门同意可以解除收养关系","养父母与未成年养子女关系恶化,无法共同生活的,可以协议解除收养关系"],"a":"B","e":"\u0001依《民法典》第1115条（原《收养法》第27条），养父母与成年养子女关系恶化无法共同生活方能协议解除；收养人不履行抚养义务、有虐待遗弃等侵害未成年养子女合法权益行为的，送养人有权要求解除。\u0002\nA✗ 未成年养子女不具备完全诉讼行为能力，法律把主动解除权明确授予原“送养人”（或生父母等）；若养父母与“成年”养子女关系恶化则由双方协议解除。\nB✓ 完全契合《民法典》第1115条规定：收养人不履行抚养义务，有虐待、遗弃等侵害未成年养子女合法权益行为的，送养人有权要求解除养父母与养子女间的收养关系。\nC✗ 依《民法典》第1114条，收养人在被收养人“成年以前”，不得任意解除收养关系，必须与送养人双方协商一致才可协议解除。\nD✗ 因关系恶化无法共同生活可以协议或诉请解除收养关系的前提是“养父母与成年养子女”，不包括未成年养子女。","k":"","kb":153,"kh":[[390,431]]},{"id":"2019-35","y":2019,"t":"单","s":"甲在2005年与乙登记结婚,2010年又与丙登记结婚,并生有一子。2015年甲与乙协议离婚。现甲与丙的婚姻（ ）。","o":["有效","无效","可撤销","不成立"],"a":"B","e":"\u0001甲在2005年已与乙登记结婚且尚未离婚时，2010年再与丙登记结婚构成重婚，属《民法典》第1051条第1项法定无效婚姻；虽然2015年甲与乙离婚，重婚性质一般不被当然治愈。\u0002\nA✗ 重婚违反我国一夫一妻根本婚姻制度并触犯刑律，不同于可因时间经过填补的未达婚龄，不能因前婚日后离异而自然补正成有效后婚。\nB✓ 依据《民法典》第1051条及婚姻家庭编解释（一）第10条精神（以及2019真题原标准答案），甲2010年与丙结婚时属于重婚，依法自始无效，虽事后于2015年与乙离婚，重婚婚姻原则上仍属无效婚姻。\nC✗ 重婚系绝对无效婚姻，而非可撤销婚姻。\nD✗ 已办理完备婚姻登记程序形式上成立婚姻登记外观，在法律效力评估上为“无效婚姻”而非“不成立”。","k":"","kb":151,"kh":[[198,231]]},{"id":"2020-27","y":2020,"t":"单","s":"下列选项中，属于继父或继母收养继子女的条件是（ ）。","o":["继子女不满14周岁","继父母无子女","经生父母同意","生父母有特殊困难无力抚养子女"],"a":"C","e":"\u0001依据《民法典》第1103条，继父或者继母经继子女的生父母同意，可以收养继子女（豁免被收养人限制、无子女或一名子女数量限制、收养人年满30周岁以及夫妻共同收养要求等多数一般条件）。\u0002\nA✗ 只要经继子女生父母同意，任何未满18周岁的未成年继子女均可被继父母收养（旧法亦早已规定继子女不受不满14周岁限制）。\nB✗ 继父或继母即使本人之前已有其他子女，亦可收养继子女，不受子女数量限制。\nC✓ 《民法典》第1103条明文规定：继父或者继母经继子女的生父母同意，可以收养继子女，且可不受第1093条、第1094条等一般限制。\nD✗ 生父母无须具备特殊困难无力抚养条件，只要生父母明确同意即可。","k":"","kb":153,"kh":[[176,196]]},{"id":"2020-49","y":2020,"t":"多","s":"我国婚姻法规定,“父母不履行抚养义务时, 未成年的或不能独立生活的子女,有要求父母付给抚养费的权利。”其中,“不能独立生活的子女”包括 （ ）。","o":["在校接受高中学历教育的成年子女","在校接受大学本科学历教育的成年子女","丧失劳动能力无法维持正常生活的成年子女","未完全丧失劳动能力无法维持正常生活的成年子女"],"a":"ACD","e":"\u0001依《民法典婚姻家庭编解释（一）》第41条，尚在抚养义务涵盖内的“不能独立生活的成年子女”指尚在校接受高中及其以下学历教育，或者丧失、未完全丧失劳动能力等非因主观原因无法维持正常生活的成年子女（不含大学本科生）。\u0002\nA✓ 在校接受高中及其以下学历教育的成年子女，属于法定的“不能独立生活的子女”，有权继续要求抚养费。\nB✗ 司法解释已明确把“高中及其以下学历教育”封顶，已经考入大学本科就读的成年大学生一般不再属于父母负有法定强制抚养费义务的对象。\nC✓ 丧失劳动能力无法维持正常生活的成年子女，父母仍有法定的持续抚养义务。\nD✓ 未完全丧失劳动能力但非因主观怠惰确无法维持正常生活的成年子女，同样受法律抚养费救济保护。","k":"","kb":153,"kh":[[456,521]]},{"id":"2021-27","y":2021,"t":"单","s":"甲的外祖父与乙的父亲是亲兄弟。甲与乙属于（ ）。","o":["四代旁系血亲","五代旁系血亲","二代旁系血亲","三代旁系血亲"],"a":"A","e":"\u0001甲的外祖父与乙的父亲是亲兄弟（同源于甲的曾外祖父母/乙的祖父）：从甲己身数（甲1→母2→外祖父3→曾外祖父母4），至同源共同祖先较高一方数达4代，故甲与乙属于四代旁系血亲。\u0002\nA✓ 算至共同祖先：甲→母→外祖父→曾外祖父母为4代；乙→父→乙的祖父（即甲的曾外祖父母）为3代；以代数多的一方（4代）定旁系亲等，故为四代旁系血亲（法律允许通婚）。\nB✗ 共同祖先是甲的曾外祖父母，不到第五代高祖辈。\nC✗ 二代旁系血亲仅限于亲兄弟姐妹关系。\nD✗ 三代旁系血亲包括堂/表兄弟姐妹以及伯叔姑舅姨与侄甥关系；甲之母与乙才是三代以内旁系血亲（表兄妹），甲往下又降一辈到了第四代。","k":"","kb":151,"kh":[[82,124]]},{"id":"2021-28","y":2021,"t":"单","s":"甲、乙结婚后,乙与丙、丁、戊设立一合伙企业,四人的出资比例是1: 2:3:4。五年后,甲与乙协议离婚,双方约定将乙在合伙企业中的财产份额全部转让给甲。甲取得合伙人地位的条件是（ ）。","o":["丁、戊同意即可","经丙、丁、戊一致同意","丙、丁同意即可","丙、戊同意即可"],"a":"B","e":"\u0001夫妻离婚分割合伙企业财产份额，转让给非合伙人配偶甲时，因普通合伙具有极强人合性，依《民法典婚姻家庭编解释（一）》第74条须经“其他合伙人一致同意”（丙、丁、戊一致同意）甲才取得合伙人地位。\u0002\nA✗ 不可仅由部分大比例出资人同意即绕开小出资额合伙人丙（10%出资），人合性遵循一人一票“全体一致同意”。\nB✓ 依据婚姻家庭编司法解释（一）第74条（及《合伙企业法》第22条），离婚双方协商将一方在合伙企业中的财产份额全部或部分转让给非合伙人配偶，必须取得“其他全体合伙人（丙、丁、戊）一致同意”，甲方可取得合伙人地位（不同意可依法主张优先购买权或折价退伙补偿）。\nC✗ 不能忽略其他出资比例最大合伙人戊的同意权。\nD✗ 同理，不得漏掉合伙人丁的同意权。","k":"","kb":152,"kh":[[226,253]]},{"id":"2022-36","y":2022,"t":"单","s":"甲丧偶后不久罹患重病,无力抚养2岁的儿子小明,依法将其送养。小明成年后找到甲,见甲生活窘困,按月给甲500元生活费。小明给付生活费的行为系","o":["履行道德义务","履行法定赡养义务","公益捐赠","紧急救助"],"a":"A","e":"\u0001小明2岁时已依法送养，养子女与生父母间的权利义务关系因收养成立即全面解除；成年后小明见生母甲生活窘困按月给生活费，不属于法律强制赡养义务，而是履行道德义务。\u0002\nA✓ 依据《民法典》第1111条第2款，小明因合法送养与生母甲已解除法律上的父母子女权利义务关系，其成年后感念生恩自愿按月给付500元生活费，属于主动履行道德义务（给付后不得以不当得利请求返还）。\nB✗ 法定赡养义务已随着合法收养关系的成立转移至养父母身上，对生母已无法定赡养义务。\nC✗ 公益捐赠针对不特定社会公益或慈善救助组织，不适用于私人资助生母。\nD✗ 并非紧急危难状态下采取的急救救助措施。","k":"","kb":153,"kh":[[332,389]]},{"id":"2024-30","y":2024,"t":"单","s":"2018年甲、乙结婚。2019年甲以个人名义向弟弟丙借款100万元购买商品房,登记在乙名下。2021年甲、乙离婚。甲向丙所借的钱应当（ ）。","o":["全部由甲偿还","全部由乙偿还","由甲和乙连带偿还","由甲和乙按份偿还"],"a":"C","e":"\u0001婚后甲以个人名义向弟弟借款100万元虽超出日常家事代理限度，但款项实际全部用于购买登记在配偶乙名下的夫妻共有商品房，明确用于夫妻共同生活，依法构成夫妻共同债务，由甲和乙连带偿还。\u0002\nA✗ 借钱买下婚后登记在乙名下的夫妻共有商品房，乙直接享受房产收益，绝非甲个人独担债务。\nB✗ 甲是直接签字借款的债务人，不能免除债务只推给房产登记名义人乙。\nC✓ 依《民法典》第1064条第2款，婚姻关系存续期间以个人名义超出日常家事需要所负债
