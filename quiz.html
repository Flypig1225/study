任，即使乙有重大过失亦首先由甲对外赔付丙（事后甲可依法向有故意或重大过失的乙追偿）。\nB✗ 提供劳务一方在执行工作任务期间致第三人受损，不直接单独由受雇司机个人对外赔偿。\nC✗ 雇主与雇员之间对外不承担按份责任。\nD✗ 依据《民法典》第1191、1192条，用人单位与员工对外统一由用人单位/接受劳务人担责，不再采取旧司法解释中的“重大过失连带”模式。","k":"","kb":157,"kh":[[325,381]]},{"id":"2010-50","y":2010,"t":"单","s":"甲邀请乙一同到河边钓鱼。当乙甩竿时,鱼钩挂在旁边裸露的电线上,乙当场触电身亡。经查, 该输电线路属供电局所有。对乙的死亡应承担责任的是（ ）。","o":["甲","乙","供电局","甲和供电局"],"a":"C","e":"\u0001高压输电线路属于《民法典》第1240条高度危险物致人损害，适用无过错责任；乙甩竿意外触碰裸露电线身亡非受害人故意自杀，甲邀约无过错，由线路管理人供电局承担赔偿责任。\u0002\nA✗ 好友甲正常邀请同去河边钓鱼本身属于常规善意社交约伴，无法预见附近供电线路裸露导电，无任何过错。\nB✗ 乙在正常垂钓甩竿时意外碰触存在重大裸露隐患的高压电线，不属于“故意”自杀触电，供电局不得以此全免责。\nC✓ 供电局对其所属输电线路（尤其是存在裸露未尽安全防护之处）导致的触电身亡适用无过错高度危险责任，依法由供电局承担赔偿责任。\nD✗ 甲没有任何安全注意疏失，不与供电局共同担责。","k":"","kb":159,"kh":[[259,279]]},{"id":"2011-50","y":2011,"t":"多","s":"一般侵权行为民事责任的抗辩事由包括（ ）。","o":["不可抗力","受害人的故意","意外事件","受害人同意"],"a":"ABCD","e":"\u0001一般侵权行为采过错责任，可阻却归责或违法性的抗辩事由既包括不可抗力、意外事件（无过错），也包括受害人故意以及受害人同意（自甘冒险/阻却违法）。\u0002\nA✓ 不可抗力属于法定一般民事及侵权免责抗辩事由（《民法典》第180条）。\nB✓ 损害是由受害人自己故意造成的，行为人不承担责任（《民法典》第1174条）。\nC✓ 既无主观故意也无疏忽懈怠的意外事件证明行为人毫无过错，是一般过错侵权的免责抗辩。\nD✓ 经受害人事先明确自愿同意（且未违背公序良俗及生命健康底线）阻却行为违法性，不构成侵权。","k":"","kb":155,"kh":[[69,92],[113,118]]},{"id":"2013-39","y":2013,"t":"单","s":"市政公司在挖掘的坑道两侧设置了障碍物和夜间警示灯。某夜，甲酒后驾车，撞毁障碍物和夜间警示灯后逃逸。次日凌晨，乙骑自行车经过时摔入坑道受伤。乙的损失应当（ ）。","o":["由市政公司承担赔偿责任","由甲承担赔偿责任","由市政公司和甲承担连带责任","由乙自己承担"],"a":"A","e":"\u0001在公共道路挖掘坑道虽曾设置警示灯，但被他人撞毁后至次日凌晨期间施工人未及时检查修复维护，施工人市政公司无法证明持续尽到防护与安全标志义务，依过错推定应赔付乙（赔后可追偿甲）。\u0002\nA✓ 依据《民法典》第1258条第1款，在公共场所或者道路上挖掘地下设施造成他人损害的，施工人不能证明已经持续妥善设置明显标志和采取安全措施的，应当由施工人（市政公司）向受害人承担侵权赔偿责任（市政公司赔后有权向撞毁警示灯逃逸的甲追偿）。\nB✗ 题干侧重第1258条施工人地下设施施工致人损害法条保护直接受害人路径，2013官方真题单选唯一指定A（直接由市政公司担责赔付，避免受害人因甲逃逸无着落）。\nC✗ 市政公司疏于修复与甲醉驾撞毁无共同意思联络，亦无连带法律规定。\nD✗ 凌晨骑车人乙遭遇缺乏夜间警示灯的开放坑道，自身没有重大过失，不应自行负担。","k":"","kb":160,"kh":[[454,512]]},{"id":"2013-40","y":2013,"t":"单","s":"根据我国《侵权责任法》的规定,下列情形可以适用精神损害赔偿的是（ ）。","o":["某公司连续一年未发工资，致职工甲忧心忡忡","某学校违反合同提前解聘教师乙,致其痛苦不堪","某行政机关公布对工作人员丙的处分决定,致其精神萎靡不振","某医院因失误致产妇丁抱错孩子,其抚养15 年后发现真相痛苦万分"],"a":"D","e":"\u0001医院严重失误抱错孩子使产妇丁抚养他人骨肉15年后方知真相痛苦万分，严重侵害亲属身份关系与人格情感利益，可适用精神损害赔偿；拖欠工资、普通违约解聘与正常行政处分均不赔精神损害。\u0002\nA✗ 公司拖欠工资属于劳动报酬给付违约纠纷，不支持精神损害赔偿。\nB✗ 提前解除聘用合同属于一般劳动/合同违约争议（2013《侵权责任法》时代普通违约不得请求精神损害）。\nC✗ 行政机关依法作出内部纪律处分公布行为属于行政职权管理范围，不适用民事精神损害赔偿。\nD✓ 医院过失抱错婴儿致亲子关系离散15年造成严重精神痛苦，依精神损害赔偿司法解释第2条及《民法典》第1183条，权利人有权请求精神损害赔偿。","k":"","kb":154,"kh":[[449,485]]},{"id":"2013-50","y":2013,"t":"多","s":"甲乘坐公交公司司机乙驾驶的公交车时,公交车与一私家车相撞,甲受伤致残。经认定,该起交通事故应由乙负全部责任。对此,下列选项中,不正确的有（ ）。","o":["甲的损失应由乙承担责任","甲的损失应由公交公司承担责任","甲的损失应由乙与公交公司承担按份责任","甲的损失应由乙与公交公司承担连带责任"],"a":"ACD","e":"\u0001用人单位的工作人员因执行工作任务造成他人损害的，依法由“用人单位（公交公司）”独自对外承担全部侵权责任；由乙个人承担、按份或与公司连带均属错误表述（反向选择题）。\u0002\nA✓ 表述错误，符合“选出不正确选项”题意：公交司机乙是在执行客运驾驶工作任务中发生事故，对外由用人单位公交公司承担赔付责任，不应直接由乙对外赔偿。\nB✗ 表述正确，不符合“不正确的有”要求：公交公司作为用人单位依法应当独自对外向受伤乘客甲承担全部赔偿责任。\nC✓ 表述错误，符合题意：不存在工作人员乙与用人单位公交公司对外承担按份责任的制度。\nD✓ 表述错误，符合题意：用人单位责任为无过错替代责任，由公司对外担责而非连带责任（公司赔后有重大过失再内部追偿）。","k":"","kb":157,"kh":[[274,284],[325,381]]},{"id":"2014-25","y":2014,"t":"单","s":"根据《侵权责任法》的规定,污染环境造成损害的,污染者承担侵权责任的归责原则是（ ）。","o":["公平责任原则","过错责任原则","无过错责任原则","过错推定责任原则"],"a":"C","e":"\u0001依据《民法典》第1229条（原《侵权责任法》第65条），因污染环境、破坏生态造成他人损害的，污染者/侵权人一律适用无过错责任原则承担侵权责任。\u0002\nA✗ 污染企业不得适用公平分担代替自身法定无过错赔偿。\nB✗ 即使企业达标排污主观无过错，只要造成他人污染损害依然须承担赔偿责任。\nC✓ 环境污染侵权作为现代工业典型特殊侵权，无论行为人主观上有无过错，只要污染行为与损害间存在因果关系即承担无过错侵权责任。\nD✗ 法律并未赋予排污者自证无过错即可免责的权利（举证倒置仅针对因果关系与减免责事由）。","k":"","kb":154,"kh":[[72,118]]},{"id":"2014-26","y":2014,"t":"单","s":"某医院医生张某在为患者李某做手术时将一块纱布遗留在李某腹腔,李某因此所受的损害应由 （ ）。","o":["医院承担全部赔偿责任","张某承担全部赔偿责任","医院和张某承担连带赔偿责任","张某承担赔偿责任,医院承担补充责任"],"a":"A","e":"\u0001医生张某系甲医院医务人员，在正常开展外科手术诊疗职务工作期间不慎遗留纱布致李某损害，依据《民法典》第1218条（及第1191条），由医疗机构（医院）承担全部赔偿责任。\u0002\nA✓ 《民法典》第1218条明确规定：患者在诊疗活动中受到损害，医疗机构或者其医务人员有过错的，由医疗机构承担赔偿责任。\nB✗ 医生职务行为后果由医院对外承担，不由执业医生张某个人直接对外赔付。\nC✗ 医疗机构与医生之间不对外承担连带责任。\nD✗ 完全由医院承担直接全责，非医生主赔、医院补充责任。","k":"","kb":157,"kh":[[285,293],[325,362]]},{"id":"2014-27","y":2014,"t":"单","s":"章某为曙光中学初一学生。某日,在放学回家路过育才幼儿园时,章某用弹弓射树上小鸟,不料误伤在园内玩耍的幼儿吕某。吕某的损害应由（ ）。","o":["曙光中学承担全部赔偿责任","育才幼儿园承担全部赔偿责任","章某的监护人承担全部赔偿责任","育才幼儿园和章某的监护人承担连带赔偿责任"],"a":"C","e":"\u0001初中生章某在“放学回家路过”其他学校幼儿园门口时使用弹弓弹射误伤园内幼儿吕某，既不在曙光中学学习期间也不在育才幼儿园管理过错下，属校外未成年人致损，由章某的监护人承担全部责任。\u0002\nA✗ 学生已经放学离开学校，不在曙光中学教育管理期间内，中学无过错不担责。\nB✗ 外人从墙外路上使用弹弓突射树上小鸟误伤园内儿童，育才幼儿园本身不存在保安门卫放任危险或设施管理缺陷，不担责。\nC✓ 依《民法典》第1188条，限制民事行为能力人章某在放学后造成他人损害的，由其监护人承担侵权赔偿责任。\nD✗ 育才幼儿园未违反安全管理义务，不应承担连带或补充责任。","k":"","kb":157,"kh":[[70,94]]},{"id":"2014-28","y":2014,"t":"单","s":"根据《侵权责任法》的规定,民用航空器造成他人损害的,民用航空器经营者的免责事由是（ ）。","o":["战争","不可抗力","受害人故意","受害人重大过失"],"a":"C","e":"\u0001依据《民法典》第1238条（原《侵权责任法》第71条），民用航空器造成他人损害的，民用航空器经营者仅在能够证明损害是因“受害人故意”造成时方可免责。\u0002\nA✗ 《民法典》第1237条规定的“战争”免责只适用于核设施、核材料损害（民用核损害），而不适用于民用航空器！\nB✗ 民用航空器坠落或致地上损害连不可抗力（如极端暴风雷雨致坠机砸伤地面居民）都不免责！\nC✓ 完全契合《民法典》第1238条原文：民用航空器造成他人损害的，民用航空器的经营者应当承担侵权责任；但是，能够证明损害是因受害人故意造成的，不承担责任。\nD✗ 受害人重大过失在民用航空器侵权中也不能免除经营者责任。","k":"","kb":159,"kh":[[176,258]]},{"id":"2014-47","y":2014,"t":"多","s":"下列权利中,受侵权责任法保护的有（ ）。","o":["股权","监护权","发现权","继承权"],"a":"ABCD","e":"\u0001依据原《侵权责任法》第2条及现行《民法典》第1164条，侵权责任编全面保护自然人、法人的各项人身与财产权益，股权、监护权、发现权、继承权全部受其保护。\u0002\nA✓ 股权（含股东财产性收益和成员参与权）属于法律明文保护的民事权益。\nB✓ 监护权作为重要亲属身份保护权益，受到侵权责任法全面保护。\nC✓ 发现权（科技科学发现荣誉与权益）列于原《侵权责任法》第2条第2款明文保护目录中。\nD✓ 继承权同为原《侵权责任法》第2条明文列举受保护的民事权益。","k":"","kb":154,"kh":[[166,192]]},{"id":"2015-25","y":2015,"t":"单","s":"甲出差,委托同事乙照看其9周岁儿子丙。某日,乙将丙单独留在家中,自己出去打麻将。丙在玩耍时将邻居小孩丁打伤。丁的损害应由（ ）。","o":["甲单独承担责任","乙单独承担责任","甲、乙承担连带责任","甲承担责任,乙承担相应的补充责任"],"a":"C","e":"\u00012015年考题依据原《民通意见》第22条规定：监护人将监护职责委托给他人且受托人有过错（丢下9岁孩子去打麻将）的，监护人甲与受托人乙负连带责任（现《民法典》改定相应责任）。\u0002\nA✗ 受托人乙擅自离开致孩子处于无人看护境地存在重大过错，在2015考纲下不能只由甲独自赔。\nB✗ 不能免除原法定监护人甲本身的对外法定监护责任。\nC✓ 依据2015年考试当时适用的《民通意见》第22条，监护人委托他人照看被监护人，被委托人确有过错的，与监护人共同负连带责任。\nD✗ 注意原司法解释为连带而非补充责任（现行法下《民法典》第1189条亦为监护人承担、受托有过错承担“相应责任”而非补充责任）。\n【新法提示】现行《民法典》第1189条修改了旧《民通意见》第22条的连带责任规定，明确“无民事行为能力人、限制民事行为能力人造成他人损害，监护人将监护职责委托给他人的，监护人应当承担侵权责任；受托人有过错的，承担相应的责任”。","k":"","kb":157,"kh":[[141,196]]},{"id":"2015-36","y":2015,"t":"单","s":"甲在某饭店醉酒闹事,饭店员工和就餐顾客纷纷躲闪,顾客乙躲闪不及被甲打伤。乙的损害应由 （ ）。","o":["甲单独承担责任","甲和饭店承担连带责任","饭店承担责任,甲承担相应的补充责任","甲承担责任,饭店承担相应的补充责任"],"a":"D","e":"\u0001依据《民法典》第1198条第2款，因第三人（甲醉酒闹事）的行为造成他人损害的，由第三人甲承担主要侵权责任；经营场所管理人（饭店）未尽到安全保障义务的，承担相应的补充责任。\u0002\nA✗ 饭店员工未及时制止醉汉闹事也未护送疏导顾客避险，未尽合理安全保障义务不能完全免责。\nB✗ 安全保障义务人对第三人直接侵权所承担的是有顺位的“补充责任”，而非连带责任。\nC✗ 正好把直接施暴人（甲）与安保补充义务人（饭店）的责任主次顺位颠倒了。\nD✓ 依《民法典》第1198条第2款，直接打伤乙的醉酒闹事者甲承担侵权赔偿责任，未尽安全保障义务的饭店在能够防止或制止损害范围内承担相应的补充责任（饭店赔后有权向甲追偿）。","k":"","kb":158,"kh":[[154,208]]},{"id":"2015-37","y":2015,"t":"单","s":"甲超速驾驶汽车,乙逆行骑摩托车。两车相撞,摩托车飞至人行道,将行人丙砸伤。丙的损害应由（ ）。","o":["甲单独承担责任","乙单独承担责任","甲、乙承担连带责任","甲、乙承担按份责任"],"a":"C","e":"\u0001甲超速驾驶与乙逆行骑车直接发生碰撞后摩托车飞出砸伤行人丙，属于二人无意思联络但共同违法结合碰撞直接导致同一不可分损害且各自均有较大原因力，依典型道路共同致害连带责任承担（或结合原《侵权责任法》第11条足以造成全部损害的连带责任）。\u0002\nA✗ 乙违法逆行对发生碰撞飞出具有直接重大过错，甲不独担全责。\nB✗ 甲违法超速同样加大撞击动能与风险，乙不独担全责。\nC✓ 依据《民法典》第1171条（原《侵权责任法》第11条）及司法实务考题设定：甲高速超速驾车与乙逆行均足以在碰撞中猛烈抛甩出物体造成行人重伤同一损害后果，或者二人共同违法行为直接结合，对无辜行人丙应由甲、乙承担连带赔偿责任。\nD✗ 2015年法硕标准单选采《侵权责任法》第11条二人以上分别侵权但各行为/结合直接导致不可分严重撞击同一后果定性为连带责任。","k":"","kb":156,"kh":[[66,117]]},{"id":"2015-38","y":2015,"t":"单","s":"甲承租乙的房屋。某日,甲在阳台上修剪花草,顺手将剪刀放在阳台边上,不料剪刀被大风吹落, 扎伤行人丙。丙的损害应由（ ）。","o":["甲单独承担责任","乙单独承担责任","丙自行承担","甲、乙共同承担责任"],"a":"A","e":"\u0001承租人甲是房屋及阳台的“实际使用人”，其自己将剪刀顺手搁置在阳台边致被大风吹落扎伤丙，房东乙对此毫无过错与实际管领控制，由使用人甲单独承担赔偿责任。\u0002\nA✓ 依据《民法典》第1253条，建筑物上的搁置物、悬挂物脱落坠落致损，由所有人、管理人或者“使用人”不能证明自己没有过错时担责；甲既是搁置剪刀人又是当前实际使用人，房东乙已经证明交付出租后剪刀放阳台并非房屋固有缺陷，故由甲单独承担责任。\nB✗ 房屋所有权人乙未入住管理亦未留放剪刀，不存在管理维护过错，不承担责任。\nC✗ 大风吹落放置于阳台边缘之危险剪刀并非完全不可抗力，且使用人未收好物品明显存在疏忽过错，无辜路人丙无需自认倒霉。\nD✗ 房东乙无过错，不与甲共同承担。","k":"","kb":160,"kh":[[380,422]]},{"id":"2015-49","y":2015,"t":"多","s":"甲医院误将患者乙的左肾切除。甲医院有义务赔偿乙的（ ）。","o":["精神损害","后续治疗费用","护理费和交通费","因误工减少的收入"],"a":"ABCD","e":"\u0001医疗事故误将患者正常左肾切除造成严重器官功能丧失，依据《民法典》第1179条及第1183条，甲医院应当赔偿乙的精神损害、后续治疗费用、护理费和交通费以及因误工减少的收入。\u0002\nA✓ 器官重大毁损致严重残疾和终身痛苦，依法必须赔偿精神损害抚慰金。\nB✓ 依《民法典》第1179条及人损司法解释，因康复或者继续治疗实际发生的必要后续治疗费用依法应予赔偿。\nC✓ 护理费和就医往返合理交通费均为《民法典》第1179条明文列举的人身损害基本赔付项目。\nD✓ 因受伤治疗及休养导致误工减少的收入同样应当全额赔偿。","k":"","kb":154,"kh":[[240,274]]},{"id":"2016-31","y":2016,"t":"单","s":"某高校学生甲、乙在学校操场上打篮球时,乙投篮,球反弹将甲的头部砸伤。甲的损害应由（ ）。","o":["甲自己承担","乙承担全部责任","该高校承担全部责任","该高校与乙共同承担责任"],"a":"A","e":"\u0001体育运动篮球比赛本身伴随球体高速碰撞反弹风险，甲自愿参与对抗性篮球活动，乙正常投篮致篮板反弹砸伤甲并无故意或重大过失犯规，适用《民法典》第1176条自甘风险规则，由甲自己承担损失。\u0002\nA✓ 依据《民法典》第1176条“自甘风险”原则（及2016年法理通说），自愿参加具有一定风险的文体活动，因其他参加者的正常投篮活动受到损害的，受害人不得请求其他参加者承担侵权责任，故由甲自己承担。\nB✗ 乙正常跳投未实施恶意恶意冲撞、违背体育道德的故意或重大过失动作，不承担赔偿责任。\nC✗ 高校正常提供合乎标准的露天操场篮球架，在普通日常打球反弹意外中无管理设施瑕疵过错，不担责。\nD✗ 高校与乙均无侵权过错。","k":"","kb":155,"kh":[[244,272]]},{"id":"2016-33","y":2016,"t":"单","s":"甲、乙分别在山上伐木,为图方便各自将伐下的原木从山上滚下,不料其中一根木头砸伤了山下的行人丙,且无法确定是谁推下的这根木头。丙的损害应由（ ）。","o":["甲、乙承担按份责任","甲、乙承担连带责任","甲、乙、丙分担","丙自己承担"],"a":"B","e":"\u0001甲、乙各自实施高空滚落原木的危险行为，客观上有一根木头砸伤行人丙但无法确认究竟是甲还是乙滚下的这根，构成典型“共同危险行为”，依《民法典》第1170条由甲、乙承担连带责任。\u0002\nA✗ 虽然不知谁的具体原木致伤，但无法证明自己不是具体侵权人时，法律为充分保护无辜受害人一律要求所有共同危险行为人负连带责任而非按份责任。\nB✓ 完全符合《民法典》第1170条共同危险行为规则：二人以上实施危及他人人身安全的行为且其中一人或数人的行为造成他人损害，不能确定具体侵权人的，行为人承担连带责任。\nC✗ 丙路过山下正常行走毫无过错，不得用公平分担转嫁给无辜伤者。\nD✗ 无法确定具体致害人不意味着受害人要自吞苦果。","k":"","kb":156,"kh":[[271,298]]},{"id":"2016-34","y":2016,"t":"单","s":"根据我国《侵权责任法》,侵害他人财产的, 如果财产损失按照市场价格计算,则市场价格的确定时间为（ ）。","o":["损失发生时","被侵权人提起诉讼时","侵权行为实施时","被侵权人知道损失发生时"],"a":"A","e":"\u0001依《民法典》第1184条（原《侵权责任法》第19条），侵害他人财产的，财产损失按照“损失发生时”的市场价格或者其他合理方式计算。\u0002\nA✓ 《民法典》第1184条明文确立计算时点基准为“损失发生时”的市场价格。\nB✗ 起诉时间可由原告人为延后挑市价高点选择，不利交易确定性。\nC✗ 有时侵权行为实施与实际财产毁损结果发生存在时间差（如潜伏期腐坏），法条精确锁定为“损失发生时”。\nD✗ 主观发现知晓时间不确定且易被操作，不用作计价时点。","k":"","kb":154,"kh":[[327,361]]},{"id":"2016-46","y":2016,"t":"多","s":"明知产品存在缺陷仍然实施某些行为,造成他人死亡或者健康严重损害的,被侵权人有权请求相应的惩罚性赔偿。这些行为包括（ ）。","o":["生产","销售","运输","保管"],"a":"AB","e":"\u0001依《民法典》第1207条（原《侵权责任法》第47条），明知产品存在缺陷仍然“生产、销售”，或者未采取有效补救措施，造成他人死亡或者健康严重损害的，被侵权人有权请求惩罚性赔偿。\u0002\nA✓ 明知存在致命或致残缺陷仍故意“生产”产品属惩罚性赔偿责任主体行为。\nB✓ 明知存在严重缺陷仍故意“销售”产品同样触发惩罚性赔偿责任。\nC✗ 单纯接受委托承担运输任务的物流承运人不属于产品责任制造/销售主体，法律未对运输环节设定产品缺陷惩罚性赔偿。\nD✗ 仓储保管人不属于制造/销售链条生产者销售者，不适用第1207条惩罚性赔偿。","k":"","kb":154,"kh":[[392,416]]},{"id":"2017-35","y":2017,"t":"单","s":"甲驾车正常行驶,乙酒后驾车闯红灯,两车相撞,致甲的车撞伤正在执勤的交警丙。丙的损害应由 （ ）。","o":["甲承担全部责任","乙承担全部责任","甲、乙承担连带责任","甲承担次要责任,乙承担主要责任"],"a":"B","e":"\u0001交警丙被撞伤完全是由乙酒后驾车严重闯红灯撞击正常行驶的甲车而引发，甲驾车正常行驶既无过错亦非实质危险制造者，依《民法典》第1208条及交安法理，应由全责方乙承担全部赔偿责任。\u0002\nA✗ 甲正常守法驾驶没有闯红灯或任何违章过错，甲车仅仅是被动撞击传导机械物体，不应承担全部责任。\nB✓ 本案事故全部过错及引发原因在于乙严重酒驾闯红灯，甲的机动车系被撞击推进致伤丙、无交通违章无过错（且机动车双方交涉由过错方全责吸收，无责机动车至多涉交强险极微限额而真题明确认定实质全责由乙承担，2017真题官方单选唯一为B）。\nC✗ 甲并无共同故意或共同过失侵权，不成立连带责任。\nD✗ 题目已明确“甲驾车正常行驶”，无任何过错可分担次要责任。","k":"","kb":160,"kh":[[122,166]]},{"id":"2017-36","y":2017,"t":"单","s":"甲工厂、乙工厂分别位于某河流的上游和中游,两工厂单独排放的废水均不会造成损害,但废水汇集后导致下游丙的鱼塘的鱼大量死亡。对于丙的损失（ ）。","o":["甲、乙均不承担责任","甲、乙承担按份责任","甲、乙承担连带责任","甲、乙、丙三方分担"],"a":"B","e":"\u0001甲、乙工厂无意思联络且各自独立排污均不足以造成鱼塘死鱼，但两股废水在下游汇合产生累积毒性导致鱼群大量死亡，属典型数人分别污染环境无意思联络叠加侵权，依《民法典》第1172条（及第1231条）承担按份责任。\u0002\nA✗ 两家均排污并在客观上共同导致下游渔业重大死鱼后果，绝不可双双豁免。\nB✓ 各自排放量均“不足以单独造成全部损害”，不符合第1171条（各行为均足以致全损才连带），而恰好落入《民法典》第1172条及第1231条“承担按份责任”之标准要件！\nC✗ 既无共同意思联络，且单独任一厂排水又不会造成鱼死亡结果，故依法不能判处连带责任。\nD✗ 渔业养殖户丙并无任何过错，不应分担自身财产损失。","k":"","kb":156,"kh":[[383,459]]},{"id":"2017-49","y":2017,"t":"多","s":"小明在父母离异后跟随母亲生活。某日午休时，小明在幼儿园与小朋友小刚打闹，幼儿园老师余某因外出接电话而未能发现和制止，小明将小刚的头打伤。对于小刚的损害，不应承担责任的有（ ）。","o":["小明的母亲","幼儿园","小明的父亲","余某"],"a":"ACD","e":"\u00015岁幼童小明在幼儿园午休期间受教师脱离岗位接电话失管打伤同学小刚，依《民法典》第1199条（原《侵权责任法》第38条），由幼儿园担责；小明父母及执行职务的余老师个人均不应直接对外承担责任（反向多选）。\u0002\nA✓ 选对（不应担责）：在幼儿园在园生活受教师照管期间且幼儿园教师外出接电话存在明显过失，依校内致损规则由幼儿园担责，已交托孩子且自身无过错的母亲一般不赔（2017真题官方多选ACD不含B）。\nB✗ 不选（应担责）：幼儿园工作人员余某午休时擅离职守外出接电话未制止打闹，幼儿园未能证明自己尽到教育管理职责，依法应当承担侵权赔偿责任。\nC✓ 选对（不应担责）：小明父母离异由母亲直接抚养，未直接共同生活亦不在场的父亲不对外承担该幼儿园事故责任。\nD✓ 选对（不应担责）：余某系幼儿园的在职教职工，其在执行工作任务期间的失职行为后果由用人单位幼儿园对外承担，老师个人不直接向小刚家赔付。","k":"","kb":158,"kh":[[235,319]]},{"id":"2017-50","y":2017,"t":"多","s":"下列民事权益中,受我国侵权责任法保护的有（ ）。","o":["婚姻自主权","担保物权","股权","商业秘密"],"a":"ABCD","e":"\u0001《民法典》侵权责任编全面保护一切人身与财产合法民事权益，婚姻自主权、担保物权、股权以及受法律保护的商业秘密全部受其保护。\u0002\nA✓ 婚姻自主权属于自然人人身自由人格权范畴，干涉婚姻自由受侵权法救济。\nB✓ 担保物权属于重要他物权，恶意毁损灭失抵押质押标的物侵犯担保物权，受侵权编保护。\nC✓ 股权为《民法典》保护的典型财产性与社员综合性民事权益。\nD✓ 商业秘密系受反不正当竞争法及民法典保护的重要知识产权与财产利益。","k":"","kb":154,"kh":[[166,216]]},{"id":"2018-24","y":2018,"t":"单","s":"甲在某酒店公用洗手间滑倒,摔碎了眼镜。经查:甲滑倒系因酒店清洁工乙清洁不彻底,地面湿滑所致。甲的损失应由（ ）。","o":["甲自己承担","酒店承担全部责任","酒店和乙承担按份责任","酒店和乙承担连带责任"],"a":"B","e":"\u0001清洁工乙系酒店员工，因执行酒店日常保洁工作任务未清干净导致地面湿滑致使客人甲滑倒摔碎眼镜，依《民法典》第1191条及第1198条，完全由用人单位兼安保义务人酒店承担全部责任。\u0002\nA✗ 公共洗手间地面湿滑且未设防滑警示牌明显是酒店过错所致，甲正常如厕滑倒不应自负损失。\nB✓ 工作人员乙在履行保洁工作任务中因疏忽过失致人受损，且酒店负有场所安全保障义务，依法统一由用人单位酒店承担全部赔偿责任。\nC✗ 员工工作任务侵权不由员工与酒店对外按份。\nD✗ 用人单位与职工之间对外无连带赔偿责任。","k":"","kb":157,"kh":[[294,308],[325,362]]},{"id":"2018-27","y":2018,"t":"单","s":"甲将自己的汽车借给乙使用。某日,乙酒后驾驶该车撞伤丙,丙的损失应该由（ ）。","o":["甲全部赔偿","乙全部赔偿","甲、乙按份赔偿","甲、乙连带赔偿"],"a":"B","e":"\u0001出借正常状态良好的自有汽车给有驾驶资格的乙使用，发生交通事故撞伤丙系因借用人乙醉酒驾驶违章所致，依《民法典》第1209条，出借人甲无过错不担责，完全由驾驶人乙赔偿。\u0002\nA✗ 仅当汽车存在隐患或明知乙无证/已醉酒仍借车时出借人甲才承担相应过错责任；本案借车后乙才酒驾，甲毫无过错。\nB✓ 依据《民法典》第1209条，因租赁、借用等情形机动车所有人、管理人与使用人不是同一人时，发生交通事故属于该机动车一方责任的，由机动车使用人（乙）承担赔偿责任；所有人（甲）对损害的发生没有过错的，不承担赔偿责任。\nC✗ 所有人甲无过错即完全免责，不参与按份分担。\nD✗ 更不构成连带责任。","k":"","kb":160,"kh":[[82,121]]},{"id":"2018-31","y":2018,"t":"单","s":"甲（10周岁）、乙（11周岁）、丙（12周岁）翻越高速公路天桥旁水泥护栏后，趴在防护网上往高速公路抛掷石块击打过往车辆，其中一石块击中司机丁致其重伤，但无法确认该石块是谁投掷。丁的损害应由（ ）。","o":["甲、乙、丙连带赔偿","高速公路管理机构赔偿","甲、乙、丙的监护人连带赔偿","甲、乙、丙的监护人和高速公路管理机构连带赔偿"],"a":"C","e":"\u0001三名10-12周岁未成年人共同翻越护栏往高速路抛掷石块致过往司机丁重伤且无法确认具体砸中石块归属，构成共同危险行为；因系无/限制民事行为能力人造成他人损害，依法由三人的监护人共同承担连带赔偿责任。\u0002\nA✗ 未成年人自己通常无独立财产担责，由其各自法定监护人承担侵权赔偿责任（《民法典》第1188条）。\nB✗ 高速路天桥已设置常规水泥护栏与防护网，三少年刻意违法翻越攀爬高空恶意掷石，高速路公司已尽常规管理职责，无过错不赔。\nC✓ 三少年均实施危险投石行为且无法辨明具体致伤石块是谁所扔，属典型共同危险行为（第1170条），依法由各自监护人（父母）对外共同承担连带赔偿责任。\nD✗ 高速管理机构不存在过错，不承担连带赔偿责任。","k":"","kb":156,"kh":[[299,361]]},{"id":"2019-22","y":2019,"t":"单","s":"甲骑乙公司运营的共享单车上班。途中,单车刹车失灵,甲躲闪不及,撞伤丙。丙的损害应当 （ ）。","o":["由甲承担全部赔偿责任","由乙公司承担全部赔偿责任","由甲和乙公司承担按份责任","由甲和乙公司承担连带责任"],"a":"B","e":"\u0001共享单车存在“刹车失灵”产品/租赁器械质量安全隐患，导致守法骑行人甲躲闪不及撞伤行人丙，属于单车租赁运营者（乙公司）提供缺陷单车造成伤害，甲无过错，由乙公司承担全部赔偿责任。\u0002\nA✗ 甲正常骑行中因共享单车自身刹车突然机械失灵引发事故，甲主观无过错，依法不应自行全赔（且非机动车一般不由无过错骑行人负无过错责任）。\nB✓ 共享单车运营企业乙公司负有投放维护性能完好合格车辆的安全保障与租赁交付义务，现因投放车辆存在刹车失灵严重缺陷致第三人丙受损，乙公司应对损害承担全部侵权赔偿责任。\nC✗ 甲正常骑行刹车失灵无过错，不承担按份责任。\nD✗ 甲与乙公司间不成立连带侵权责任。","k":"","kb":159,"kh":[[77,101]]},{"id":"2019-33","y":2019,"t":"单","s":"甲网购了一条乙销售的裙子,收到后发现面料不是乙宣称的真丝,便在网站上给了差评。乙认为甲的差评影响到网店声誉和商品销量,遂联系甲要求其删除差评,并表示愿退还双倍货款,甲拒绝。乙后来了解到,甲系一服装店店主。甲的行为（ ）。","o":["不构成侵权","构成商业诽谤","侵犯了乙的经营权","构成不正当竞争"],"a":"A","e":"\u0001网购买家收到实物面料与卖家宣称“真丝”不符，在平台真实发表差评并拒绝卖家以双倍退款换删评，系消费者行使正当监督批评评价权；即使甲自身开服装店亦不构成商业诽谤或不正当竞争。\u0002\nA✓ 消费者基于亲身购买所收实物货不对板事实发表客观真实负面评价，属于依法行使合法消费者评价权与监督权，未虚构捏造假事，不构成民事侵权。\nB✗ 商业诽谤须以捏造、虚构虚假事实散布损害竞争对手商誉为前提，甲所述面料非真丝属客观真实情况。\nC✗ 网店经营权不受合法消费者真实差评的阻却。\nD✗ 甲以普通个人网购买家身份如实差评假真丝裙，并非恶意雇佣水军批量刷差评打击同业竞争者，不构成不正当竞争。","k":"","kb":155,"kh":[[119,145]]},{"id":"2019-37","y":2019,"t":"单","s":"甲雇乙粉刷楼房外墙。乙工作时,丙驾驶的摩托车失控撞向脚手架,致乙从脚手架上跌落,摔成重伤。乙对自己的损害（ ）。","o":["只能要求甲承担赔偿责任","只能要求丙承担赔偿责任","可以要求甲、丙承担按份责任","可以要求甲、丙承担连带责任"],"a":"D","e":"\u0001在2019年旧法时期考试结合原《人身损害赔偿司法解释》与劳务雇佣法理，提供劳务者乙作业时被第三人丙驾车撞跌重伤，考试答案采雇主与第三方均可索赔（连带/不真正连带）；现《民法典》第1192条已改定。\u0002\nA✗ 乙对直接撞伤脚手架的侵权人丙当然有权请求全额侵权损害赔偿，非只能找雇主甲。\nB✗ 无论旧法还是现行《民法典》，受损劳务方不仅能请求直接侵权第三人丙赔，亦有权向接受劳务方甲主张救济。\nC✗ 不成立各自一半的按份赔付责任。\nD✓ 依据2019年命题当时司法解释及官方真题答案标准，雇员在从事雇佣活动中因安全生产/第三人原因遭受人身损害，既可向直接致害第三人丙主张赔偿，也可向雇主甲主张赔偿责任（当年真题以D“连带责任”表述广义竞合请求择一全额受偿，注意现行《民法典》对接受劳务方与第三人责任性质已作重大细化修订）。\n【新法提示】现行《民法典》第1192条第2款已作精准区分：提供劳务期间因第三人的行为造成提供劳务一方损害的，提供劳务一方有权请求第三人承担侵权责任，“也有权请求接受劳务一方给予补偿”（接受劳务方补偿后可以向第三人追偿），不再定性为“连带责任”。","k":"","kb":157,"kh":[[382,459]]},{"id":"2020-21","y":2020,"t":"单","s":"某地多日暴雪,甲在公交站等车时,站台顶棚因积雪过多塌落,将甲砸伤。该公交站站台系乙公司设计、丙公交公司管理。甲的损害应由（ ）。","o":["本人承担","乙公司赔偿","丙公司赔偿","乙公司和丙公司共同赔偿"],"a":"C","e":"\u0001站台顶棚因多日暴雪积雪过重未及时清扫而倒塌压伤候车乘客甲，依《民法典》第1253条建筑物/构筑物管理人过错推定责任，管理人丙公交公司不能证明自己无过错，由丙公司承担赔偿责任。\u0002\nA✗ 候车站台积雪属管理人可预见及时清扫排除的人为维护障碍，不能让候车无辜公民甲自认倒霉。\nB✗ 题目并未交待乙公司原始设计存在不符合抗雪规范质量缺陷，坍塌主因是“积雪过多未及时清理”。\nC✓ 依据《民法典》第1253条，构筑物发生倒塌脱落造成他人损害，管理人（丙公交公司）未及时组织除雪排除安全隐患致塌落伤人，不能证明自己无过错，由丙公司承担侵权赔偿责任。\nD✗ 设计方乙公司无过错，不共同担责。","k":"","kb":160,"kh":[[423,452]]},{"id":"2020-22","y":2020,"t":"单","s":"两个以上污染者污染环境造成他人损害的, 污染者承担（ ）。","o":["按份责任","连带责任","过错责任","公平责任"],"a":"A","e":"\u0001依据《民法典》第1231条，两个以上侵权人污染环境、破坏生态的，承担责任的大小根据污染物的种类、浓度、排放量、破坏方式范围程度及原因力确定，即承担按份责任。\u0002\nA✓ 完全精准对应《民法典》第1231条规则：多数人污染环境原则上按各自污染物种类、浓度、排放量及行为对损害所起作用承担按份责任（注意第1171条各行为均足以单独致全损才例外连带）。\nB✗ 《民法典》专门新增第1231条明确数人分别排污承担“按份责任”而非笼统连带责任。\nC✗ 按归责原则而言污染环境自始适用“无过错责任”而非过错责任，题目选项设问的是数人分担方式“按份责任”。\nD✗ 排污方系强制无过错赔偿，非公平责任。","k":"","kb":159,"kh":[[337,357]]},{"id":"2020-23","y":2020,"t":"单","s":"甲物业公司委托乙清洁公司清洁其管理的某住宅楼外墙,乙公司指派的员工丙因操作不当,致清洁工具从高处掉落,砸中业主丁的汽车。丁的损害应由（ ）。","o":["甲公司承担责任","乙公司承担责任","甲公司和乙公司承担连带责任","乙公司和丙承担连带责任"],"a":"B","e":"\u0001甲物业公司将外墙清洁业务合法承揽发包给具有相应资质的乙清洁公司，乙公司指派自身员工丙操作不当高空坠物砸车，依承揽与用人单位规则，由用人单位乙公司独自对外承担责任。\u0002\nA✗ 物业公司作为定作人，在选任有资质的乙清洁公司和指示方面并无过失（《民法典》第1193条定作人原则上不担责）。\nB✓ 丙是乙清洁公司派出的工作人员，因执行清洁外墙工作任务过失致他人汽车受损，依《民法典》第1191条用人单位责任，由乙公司承担侵权赔偿责任。\nC✗ 定作人甲物业无定作、指示或选任过失，不与承揽人乙公司连带担责。\nD✗ 用人单位乙公司与执行职务的员工丙之间不对外承担连带责任。","k":"","kb":157,"kh":[[308,381]]},{"id":"2020-36","y":2020,"t":"单","s":"王某在甲汽车销售店购买了乙公司制造的汽车。某日,王某驾驶该车在高速公路上正常行驶,安全气囊突然弹开,导致车辆失控,王某受伤。王某 （ ）。","o":["只能向甲请求赔偿","只能向乙请求赔偿","只能要求甲和乙按份赔偿","可向甲请求赔偿,也可向乙请求赔偿"],"a":"D","e":"\u0001新车在高速正常行驶中安全气囊突发弹出导致失控撞伤，属典型产品存在危及人身安全的不合理缺陷，依《民法典》第1203条，受害人既可向销售者甲4S店请求赔偿也可向生产者乙请求赔偿。\u0002\nA✗ 消费者有权跳过销售商直接起诉汽车厂家生产者，非“只能”找甲。\nB✗ 消费者同样享有向直接购车合同兼销售商甲4S店主张产品缺陷侵权赔偿的权利，非“只能”找乙。\nC✗ 生产者和销售者对外承担不真正连带责任（先行全额赔付），绝非让消费者分别各要一半的按份赔偿。\nD✓ 依据《民法典》第1203条第1款，因产品存在缺陷造成他人损害的，被侵权人可以向产品的生产者（乙公司）请求赔偿，也可以向产品的销售者（甲销售店）请求赔偿。","k":"","kb":159,"kh":[[102,146]]},{"id":"2020-40","y":2020,"t":"单","s":"【案情】傍晚，甲驾驶拖拉机在乡村公路上行驶，乙招手搭车，甲让其上车，并告知车上有一口空棺材。不久下起大雨，乙钻进棺材避雨，过了一会儿睡着了。后又有丙请求搭车，甲也让她上了车。乙醒后手托棺材盖露出头来透气，丙吓得大喊“有鬼”，跳下车，致左腿骨折。\n丙的损害应由（ ）。","o":["甲承担责任","乙承担责任","甲和乙承担按份责任","丙自己承担"],"a":"D","e":"\u0001甲在拖拉机好意顺风车载乙、丙，乙钻入事先明示告知的空棺材躲雨睡觉，途中乙正常起身掀盖透气却把后上车的丙惊吓得呼喊有鬼并自行跳下移动拖拉机致腿骨折；甲乙均无侵权行为与过错，由丙自己承担。\u0002\nA✗ 甲好意让乙、丙搭车且尽到车内有空棺材之正常告知，甲正常行驶与无法控制乘客突喊“有鬼”跳车，甲毫无过错。\nB✗ 乙只是先上车躲雨在空棺材内睡着后醒来露出头透气，乙并不知晓后面又上来过路女子丙，更无故意惊吓企图，主观无故意无过失，且正常透气动作与丙迷信盲目跳车缺乏侵权违法因果关联。\nC✗ 甲和乙均无过错亦不构成公平分担依据。\nD✓ 本案属于典型的缺乏预见可能性的意外事件及丙自身迷信惊恐盲动跳车造成的自身损害，甲、乙行为均不构成民事侵权，损失依法应由丙自行承担。","k":"","kb":155,"kh":[[343,397]]},{"id":"2020-50","y":2020,"t":"多","s":"甲将祖父的遗像交给乙装裱,乙粗心大意,弄丢了该遗像,甲非常痛苦。甲有权要求乙（ ）。","o":["返还原物","恢复原状","赔偿财产损失","赔偿精神损害"],"a":"CD","e":"\u0001祖父的遗像属于不可复制的“具有人身意义的特定物”，装裱店乙粗心弄丢致甲遭受严重精神痛苦并失物损财；因实物已经永久灭失，不能要求返还原物或恢复原状，可请求赔偿财产损失与精神损害。\u0002\nA✗ “弄丢了”意味着标的物已不在乙处占有或已灭失，客观上已经无法再请求返还原物。\nB✗ 老祖父生前独一无二的遗像已经灭失不可复原，在客观物理上不能恢复原状。\nC✓ 乙履行装裱保管义务存在重大过失弄丢祖父遗像，甲有权要求乙赔偿相应物品及装裱财产损失。\nD✓ 完全契合《民法典》第1183条第2款规定：因故意或者重大过失侵害自然人具有人身意义的特定物（祖父遗像）造成严重精神损害的，被侵权人有权请求精神损害赔偿。","k":"","kb":154,"kh":[[275,326]]},{"id":"2021-34","y":2021,"t":"单","s":"动物园的动物造成他人损害,动物园不承担责任的情形是（ ）。","o":["动物园能够证明该致损动物并非危险动物","动物园能够证明损害系第三人的过错造成","动物园能够证明尽到管理职责","动物园能够证明损害系被侵权人重大过失造成"],"a":"C","e":"\u0001依据《民法典》第1248条，动物园的动物造成他人损害的，动物园应当承担侵权责任；但是，能够证明“尽到管理职责”的，不承担侵权责任（动物园适用过错推定原则）。\u0002\nA✗ 即便并非猛兽而是温顺动物（如羊驼、梅花鹿），只要在动物园内伤人而园方未能证明尽到围栏提示管理职责的，同样须担责。\nB✗ 第三方过错或诱发时不能直接简单取代动物园自身是否尽到管理防卫职责的判断（即使有第三人原因，动物园未能证明自己已尽管理职责仍需对外担责）。\nC✓ 完全精准对应《民法典》第1248条规定：动物园能够证明自己已尽到管理职责（如设置足够隔离护栏、安全警示及巡查劝阻）的，推翻过错推定，不承担侵权责任。\nD✗ 受害人重大过失在《民法典》第1245条普通饲养动物中仅作“减轻”事由而非动物园专条的完全免责规则（故意才免，但1248条核心法定免责表态即“证明尽到管理职责”）。","k":"","kb":160,"kh":[[241,271]]},{"id":"2022-26","y":2022,"t":"单","s":"甲之子小甲、乙之子小乙在同一所小学上学。乙平时工作较忙,经常请甲帮忙接小乙放学。某日,乙又请甲接小乙。在甲骑车载小乙回家途中。小乙擅自解开安全带从车后座掉下受伤。甲立即将小乙送到医院,支付医疗费若干。该医疗费应当","o":["全部由甲承担","全部由乙承担","由甲和乙平均分担","由甲承担大部分"],"a":"B","e":"\u0001甲出于邻里互助无偿好意顺路帮接小乙放学途中，小学生小乙自己擅自解开安全带摔落受伤，甲即时发现并主动送医；无偿帮接无故意或重大过失的甲不负侵权赔责，医疗费由小乙监护人乙全部承担。\u0002\nA✗ 甲好意帮忙接同学放学且并无驾驶违章、故意或重大过失（安全带亦已系好，系小乙自己擅解），不承担赔偿责任。\nB✓ 依据《民法典》第1188、1217条及无偿委托/好意施惠法理，受托无偿照看帮接儿童中甲尽到了一般合理注意无重大过失，小乙擅自解扣致伤的后果及甲先垫付的医疗费依法均应由法定监护人乙全部承担。\nC✗ 甲无侵权责任亦无共担过错，不适用平均分担。\nD✗ 无偿帮忙的善意邻里非商业托育，不应反让好意施惠者承担大部医疗费（否则严重违背社会公序良俗与倡导互助价值导向）。","k":"","kb":157,"kh":[[197,235]]},{"id":"2022-37","y":2022,"t":"单","s":"2021 年1月1日,甲、乙、丙、丁聚餐,席间虽无人劝酒,四人仍喝到深夜,后各自打车回家。次日凌晨乙因酒精中毒死亡。该损害应当由","o":["甲、乙、丙、丁分担","乙自行承担","甲、丙、丁承担连带赔偿责任","甲、丙、丁承担按份赔偿责任"],"a":"B","e":"\u0001成年人甲、乙、丙、丁自愿相约聚餐饮酒，全程“无人劝酒”、各人自酌适度离开并各自安全打车回家，次日凌晨乙自行酒精中毒死亡；同桌甲丙丁毫无过错且尽了常规各自散场安全照管，损害由乙自己承担。\u0002\nA✗ 同饮人甲、丙、丁未劝酒灌酒、未放任醉倒路边不顾（各自安全打车返家），不存在侵权过错或公平分担前提。\nB✓ 完全民事行为能力人应当对自己的酒量与生命健康负首责，在其余同席人毫无劝酒灌酒、放任危险等违反安全注意义务情形下，乙自行饮酒过量凌晨家中中毒死亡，由乙自行承担。\nC✗ 同桌朋友未共同侵害乙生命权，绝不承担连带赔偿责任。\nD✗ 同桌人毫无过错，亦不承担按份赔偿责任。","k":"","kb":155,"kh":[[315,342]]},{"id":"2023-26","y":2023,"t":"单","s":"甲、乙、丙、丁同在一个微信群,甲为群主,群成员共200余人,均为实名。某日,乙因不赞同丙的观点在群里多次辱骂丙,被甲移出群聊。丁为此在群里指责甲滥用群主权利,也被甲移出群聊。对此,下列选项正确的是","o":["甲有权请求丁赔偿精神损失","乙有权请求甲将自己加回微信群","丙有权请求乙赔礼道歉","丁有权请求甲承担侵权责任"],"a":"C","e":"\u0001微信群主甲依群规将多次公然辱骂他人的乙及公开指责自己的丁移出群聊系群主行使合法互联网空间社区自律管理权，不构成侵权；但乙公然多次辱骂丙直接侵害丙的名誉权与人格尊严，丙有权请求乙赔礼道歉。\u0002\nA✗ 丁只是在群内批评指责群主甲“滥用群主权利”，属于对群治理方式的主观意见评价争议，尚未达到捏造恶毒虚假事实诽谤侵害人格权并致严重精神损害地步。\nB✗ 互联网群组自治不构成强制缔约关系，被踢出群聊不产生强制要求拉回群聊的民事债权请求权。\nC✓ 乙在200余人实名大群中多次公然辱骂丙，严重贬损丙的人格尊严与社会评价构成侵害名誉权，依《民法典》第179、995、1024条，丙有权请求乙承担赔礼道歉、消除影响等侵权责任。\nD✗ 依据最高法及民法司法通说，微信群主基于微信群管理秩序对群成员作出移出群聊操作属于社交平台空间内部自律自治行为，一般不产生诉诸法院的民事侵权法救济权利（不构成侵害民事权益）。","k":"","kb":155,"kh":[[146,200]]},{"id":"2023-34","y":2023,"t":"单","s":"甲驾车送同事乙回家,到达后为图方便在道路禁停路段停车。乙一边接听电话,一边打开左侧车门准备下车。丙在道路上正常骑行,因躲闪不及,撞上车门受伤。丙的损害应当由","o":["甲、丙分担","甲、乙共同赔偿","乙、丙分担","甲、乙、丙分担"],"a":"B","e":"\u0001甲违规在道路禁停路段临时停车，乘客乙开门下车时又一边打接电话疏忽未仔细观察后方非机动车道来车，致正常骑行的丙撞上打开的左车门受伤；二人无意思联络但共同违法过失结合致害，应当由甲、乙共同赔偿。\u0002\nA✗ 题干明确写明丙是在道路上“正常骑行”，丙毫无交通违章或疏忽过错，不应分担自身损失。\nB✓ 违停司机甲与疏忽开左侧门致“开门杀”的乘客乙均存在直接违反道路交通安全注意义务过失，各自行为直接结合造成同一不可分受伤结果，依《民法典》第1168、1171条（及道路交通安全责任实务）应由甲、乙共同承担赔偿责任。\nC✗ 漏掉了违停提供危险车位条件的司机甲，且正常骑行的丙不应分担。\nD✗ 无辜正常骑行受伤的丙无需为违停加“开门杀”买单。","k":"","kb":156,"kh":[[189,250]]},{"id":"2023-38","y":2023,"t":"单","s":"甲开车正常行驶,乙突然靠近甲的汽车意欲“碰瓷”,不慎摔倒,致右脚被车碾压受伤。甲无需对此承担侵权责任的理由是","o":["不可抗力","自甘风险","受害人故意","意外事件"],"a":"C","e":"\u0001乙故意靠近正常行驶的车辆“碰瓷”试图诈赔却不慎摔倒被压伤脚，甲正常驾驶完全无过错且损害系乙自己故意涉险制造，符合《民法典》第1174条及第1208条“受害人故意”法定完全免责事由。\u0002\nA✗ 他人故意碰瓷属于人为故意行为，而非不能预见不能避免且不能克服的自然灾害等客观不可抗力。\nB✗ 自甘风险适用于《民法典》第1176条自愿参加“具有一定风险的文体活动”，碰瓷系不法讹诈行为不属正常文体活动。\nC✓ 依据《民法典》第1174条及《道路交通安全法》第76条第2款，机动车交通事故中损害是由受害人（碰瓷者乙）故意碰撞机动车造成的，机动车一方甲不承担任何赔偿责任。\nD✗ 在法定免责条文有明确专项对应概念“受害人故意”时，不绕用一般主观无过错之意外事件。","k":"","kb":155,"kh":[[309,314]]},{"id":"2024-32","y":2024,"t":"单","s":"小学生甲十周岁,在教室门口玩耍。来校访友的乙将车开到教室前禁行路段时,不慎将甲撞伤。经调查,学校存在未尽到管理职责的情形,甲的损失应当（ ）。","o":["全部由乙赔偿","全部由学校赔偿","由乙赔偿,学校承担相应补充责任","由学校和乙承担连带赔偿责任"],"a":"C","e":"\u0001依据《民法典》第1201条，10岁小学生甲在学校期间被校外第三人（访友驾车禁行区撞人之乙）侵害受到人身损害的，由侵权人乙承担侵权责任；学校未尽到管理职责的，承担相应的补充责任。\u0002\nA✗ 学校任由外来社会车辆驶入教学楼教室门口禁行路段并撞伤学生，明显未尽校园安全管理职责，不应由乙赔完学校却丝毫不承担补充责任。\nB✗ 直接开车撞伤孩子的第三人乙才是首要直接侵权人，不全部由学校扛下直接主责。\nC✓ 完全精准契合《民法典》第1201条规定：无民事行为能力人或者限制民事行为能力人在幼儿园、学校或者其他教育机构学习、生活期间，受到幼儿园、学校或者其他教育机构以外的第三人人身损害的，由第三人（乙）承担侵权责任；幼儿园、学校或者其他教育机构未尽到管理职责的，承担相应的补充责任。\nD✗ 第1201条明确规定学校承担顺位在后的“相应的补充责任”，而非对外直接承担连带赔偿责任。","k":"","kb":158,"kh":[[320,380]]},{"id":"2024-36","y":2024,"t":"单","s":"甲承租乙的房屋后私自进行装修,装修公司根据甲的装修要求拆除了承重墙,致多个楼层墙壁开裂,该楼居民被紧急疏散。该楼居民的损失应当由（ ）。","o":["甲承担全部赔偿责任","装修公司承担全部赔偿责任","甲和装修公司共同承担赔偿责任","甲乙和装修公司承担连带赔偿责任"],"a":"C","e":"\u0001承租人甲擅自要求拆除承重墙，装修公司作为专业施工单位明知承重墙不得破坏仍接受委托实施拆除导致整栋大楼开裂疏散，甲与装修公司构成共同故意/共同侵权破坏建筑物安全，应共同（连带）承担赔偿责任。\u0002\nA✗ 装修公司具备专业建筑施工认知，面对违章拆除承重墙要求负有拒绝义务，实际动手破墙拆毁不能免责推给甲一人。\nB✗ 指示并坚持要求拆墙的承租人甲是违法破坏共同发起人，不能逃避责任。\nC✓ 依据《民法典》第1168、1169条共同侵权规则，甲违法指使且装修公司配合违法拆除承重墙共同造成整楼住户受损，甲和装修公司应当共同（连带）承担侵权赔偿责任。\nD✗ 房东乙对租客甲私自找人偷偷砸墙毫不知情也未授权批准，房东本身毫无过错不参与连带赔偿。","k":"","kb":156,"kh":[[118,188]]},{"id":"2024-38","y":2024,"t":"单","s":"小刚父亲带3岁的小刚去儿童乐园，小刚父亲去点餐区点餐，小刚在十几米外的儿童游乐区，现场无工作人员维持秩序，也无安全提示标志，小刚从滑梯跳下受伤，该损伤由（ ）。","o":["小刚独自承担","儿童乐园和工作人员共同承担赔偿责任","儿童乐园承担赔偿责任,但可予以减轻","儿童乐园和小刚根据公平原则分担"],"a":"C","e":"\u0001儿童乐园游乐区既无工作人员维持秩序也无任何安全提示标志，未尽《民法典》第1198条安保义务应担责；但3岁幼童之父将其独自留在十几米外自己去点餐未尽监护职责存过失，依法适用过失相抵减轻儿童乐园责任。\u0002\nA✗ 儿童乐园滑梯区现场无专人值守且缺乏醒目警示标志，明显未尽儿童游乐场所高标准安全保障义务，不能完全免责。\nB✗ 儿童乐园工作人员的职务失职过错由用人单位儿童乐园统一对外承担，工作人员个人不与乐园共同对外赔付。\nC✓ 依据《民法典》第1198条与第1173条过失相抵原则：儿童乐园未尽合理安保义务应当承担侵权赔偿责任；同时小刚父亲对年仅3岁极需贴身看护的幼儿在公共滑梯独处十余米外存在明显监护失职过失，可依法减轻儿童乐园的赔偿责任。\nD✗ 双方均有各自明确过错，应按过错侵权及过失相抵规则处理，非无过错情形下按公平原则分担。","k":"","kb":158,"kh":[[98,153]]},{"id":"2025-30","y":2025,"t":"单","s":"甲在禁止游泳的河道里游泳,见河对岸有一只小船,于是游到对岸试图爬上小船。小船失去平衡侧翻将甲砸伤。该损害应由（ ）。","o":["甲自行承担","小船所有人全部赔偿","河道管理单位全部赔偿","河道管理单位和小船所有人连带赔偿"],"a":"A","e":"\u0001甲无视明确“禁止游泳”禁令擅自横渡危险河道并自行擅攀对岸停靠小船致使失去平衡侧翻被砸伤，完全系完全行为能力人违背禁令自甘冒险与自身过错导致，小船主人与河道管理方均无过错，由甲自行承担。\u0002\nA✓ 河道已经明令禁止游泳，对岸正常停泊的小船亦无隐藏危险缺陷，成年人甲违禁横渡并擅自攀爬无关小船引致侧翻，全责系甲自己违禁擅为过错，依法由甲自行承担损害。\nB✗ 小船所有人正常停靠船只并无违法妨碍或过错，不能因为船被偷爬翻了反倒赔伤者。\nC✗ 河道管理单位已经设立“禁止游泳”警示标识履行了管理与劝阻职责，无过错不担责。\nD✗ 两方均无侵权过错。","k":"","kb":155,"kh":[[273,308]]},{"id":"2026-22","y":2026,"t":"单","s":"甲牵着禁止饲养的烈性犬在小区散步时,该犬突然冲向骑自行车的乙致乙摔伤。事后查明乙当时正在查看手机。乙的损害应由","o":["甲全部赔偿","乙自行承担","甲和乙分担","甲和小区物业服务企业连带赔偿"],"a":"A","e":"\u0001依据《民法典》第1247条，禁止饲养的烈性犬等危险动物造成他人损害的，适用“绝对无过错责任”（不设任何免责或减轻事由）；故即便受害人骑车时正在看手机，饲养人甲仍须承担全部赔偿责任。\u0002\nA✓ 《民法典》第1247条严格规定：“禁止饲养的烈性犬等危险动物造成他人损害的，动物饲养人或者管理人应当承担侵权责任。”立法特意不留任何“被侵权人故意或重大过失可以减轻”的例外减责空间（且正常看手机尚不构成故意，即使有一般疏忽亦绝对不减免），故由甲全部赔偿。\nB✗ 违禁饲养烈性犬危害极重，不可由被冲撞摔伤的无辜路人自行担责。\nC✗ 法律故意不在第1247条规定过失相抵减责条款（对比第1245条一般饲养动物），以最严厉规则禁绝养烈性犬伤人，故不分担。\nD✗ 烈性犬系甲牵领在手引发突发冲撞事故，未显示小区物业放任长期流浪恶犬不管，物业不担连带责任。","k":"","kb":160,"kh":[[190,240]]},{"id":"2026-23","y":2026,"t":"单","s":"甲驾驶机动车搭载同事乙上班,途中因走神发生了追尾事故,导致乙受伤。乙的损失应由","o":["甲全部承担","甲适当承担","乙自行承担","甲赔偿,但可减轻赔偿责任"],"a":"D","e":"\u0001依据《民法典》第1217条“好意同乘”规则，非营运机动车发生交通事故造成无偿搭乘人损害，属于该机动车一方责任的，应当减轻其赔偿责任，但是机动车使用人有故意或者重大过失的除外。\u0002\nA✗ 若无故意或重大过失而一律由好心免费搭人的同事全赔，将寒了互助善举之心，不符合第1217条立法精神。\nB✗ “适当承担”不是法定责任形态且容易误读成公平分担；《民法典》第1217条精准法定表述为“应当减轻其赔偿责任”。\nC✗ 驾驶人甲途中短暂“走神”属于一般驾驶疏忽（一般过失，并非酒驾、严重超速、恶意别车等“重大过失”或故意），因此不能免除甲的全部赔偿责任，不能只由搭乘人乙自己吞下损害。\nD✓ 完全契合《民法典》第1217条原文：甲好意免费捎同事乙上班构成非营运机动车好意同乘，途中因一般走神疏忽发生追尾事故且无故意或重大过失，甲应当承担赔偿责任但依法可以/应当减轻赔偿责任。","k":"","kb":155,"kh":[[398,456]]},{"id":"2026-25","y":2026,"t":"单","s":"甲带5 岁的女儿乙在小区公园玩耍,邻居丙给了乙一根香蕉,乙把香蕉分享给小伙伴丁。丁在吃香蕉时不慎吸入气管窒息而死,丁的死亡","o":["应由甲承担侵权责任","应由丙承担侵权责任","应由甲、丙承担连带责任","是意外事件,各方均无责任"],"a":"D","e":"\u0001邻居分享普通安全零食香蕉给幼童，5岁小孩再分给同龄玩伴吃时不慎吸入气管窒息死亡，整个日常分享过程完全无违规毒害物品，对偶发吞咽窒息各方均无合理预见可能性，属于意外事件，各方均不担侵权责任。\u0002\nA✗ 甲带领5岁女儿在公园正常玩耍且正常分享水果，并未预见亦难以防范偶发一口呛入气管窒息极小概率意外，甲无监护失责。\nB✗ 丙善意送给玩伴儿童一根普通卫生熟透香蕉并无食物变质毒害或明显尖锐危害，且不知亦未直接强行塞喂给幼儿丁，无过错不担责。\nC✗ 甲、丙均无过错且无侵权违法性，不存在连带责任。\nD✓ 幼童食用软熟香蕉意外呛咳窒息属于难以预见的极端偶发悲剧，甲和丙均尽到正常合理生活注意义务毫无过错，依法属于意外事件，各方均无民事侵权责任。","k":"","kb":155,"kh":[[88,112]]},{"id":"2026-28","y":2026,"t":"单","s":"A 公司组织低空飞行爱好者开展滑翔伞飞行活动,甲报名参加。在飞行过程中, 因突遇上升气流,未及时得到救援受伤。甲的损害应由","o":["A 公司全部赔偿","甲自行承担","甲和A 公司平均分担","A 公司承担主要责任,甲承担次要责任"],"a":"A","e":"\u0001商业滑翔伞低空飞行属于高风险专业户外商业运动，组织方依法负有高度专业气象监测与应急救援安全保障义务；因突遇上升气流未及时开展有效救援致报名者甲受伤，由组织方承担全部赔偿责任。\u0002\nA✓ 依据《民法典》第1198条及体育活动经营者安全保障规则：滑翔伞商业组织公司不是普通民间自发搭伴球友，不得直接援引第1176条参加者间自甘风险彻底推责；因组织公司未在遭遇危险气流时及时提供专业指导与应急施救措施未尽高度安全保障义务，应向消费者甲承担全部赔偿责任。\nB✗ 《民法典》第1176条“自甘风险”豁免的是普通“其他参加者”而非负有高标准安全设施监测与及时救援义务的“活动组织者/经营者”。\nC✗ 甲系正常报名参加活动并服从调度飞行的消费者，不存在明显故意违章操作过失，不与组织方平分责任。\nD✗ 甲本身没有过错，不应承担次要责任。","k":"","kb":158,"kh":[[60,97]]},{"id":"2026-47","y":2026,"t":"多","s":"下列有权请求行为人承担惩罚性赔偿责任的有","o":["甲故意侵害肖某知识产权,情节严重","乙明知产品存在严重缺陷而销售,造成肖某健康严重损害","丙违反法律故意污染环境,造成肖某重大财产损害","丁不适当履行合同导致肖某婚戒毁损,造成肖某严重精神损害"],"a":"ABC","e":"\u0001《民法典》明文规定了三类法定惩罚性赔偿：故意侵害知识产权情节严重（第1185条）、明知产品缺陷生产/销售致死亡或严重健康损害（第1207条）及违法故意污染生态致严重后果（第1232条）；违约损戒不适用惩罚性赔偿。\u0002\nA✓ 依据《民法典》第1185条，故意侵害他人知识产权，情节严重的，被侵权人有权请求相应的惩罚性赔偿。\nB✓ 依据《民法典》第1207条，明知产品存在缺陷仍然生产、销售，造成他人死亡或者健康严重损害的，被侵权人有权请求相应的惩罚性赔偿。\nC✓ 依据《民法典》第1232条，侵权人违反法律规定故意污染环境、破坏生态造成严重后果的，被侵权人有权请求相应的惩罚性赔偿。\nD✗ 丁不适当履行保管/服务合同导致婚戒毁损仅属合同违约责任（虽然依《民法典》第996条及第1183条第2款可探讨特定纪念物严重精神损害救济，但绝不存在双倍或数倍“惩罚性赔偿”制度）。","k":"","kb":154,"kh":[[362,447]]}]},{"sub":"刑法","name":"刑法基础与效力","w":2.6,"L":50,"qs":[{"id":"2005-1","y":2005,"t":"单","s":"甲于 1997 年 8 月实施了故意杀人行为,于 2004 年 7 月被抓获归案。在 1979 年刑法和 1997 年刑法中故意杀人罪定罪处刑标准、法定刑完全相同。对本案（ ）。","o":["应适用 1997 年刑法","应适用 1979 年刑法","由审理本案的法院审判委员会决定适用 1979 年刑法还是 1997 年刑法","报请最高人民法院裁定适用 1979 年刑法还是 1997 年刑法"],"a":"B","e":"\u0001从旧兼从轻原则下，当1979年旧刑法与1997年新刑法对故意杀人罪定罪标准和法定刑完全相同时，原则上应“从旧”适用行为当时的1979年刑法。\u0002\nA✗ 只有在新刑法不认为是犯罪或者法定刑“处刑较轻”时才例外溯及适用新法；新旧法轻重完全相同则“从旧”\nB✓ 应适用1979年刑法：依照《刑法》第12条\u0001从旧兼从轻原则\u0002，1997年刑法较之1979年刑法并未规定更轻法定刑或出罪，应当直接适用行为时的1979年刑法\nC✗ 新旧法适用由《刑法》第12条明确规定统一规则，不由个案审判委员会自由裁量\nD✗ 法定溯及力规则明晰无需层报最高人民法院裁定","k":"","kb":81,"kh":[[142,164]]},{"id":"2005-18","y":2005,"t":"单","s":"甲男(15 岁)与乙女(13 岁)在同一所中学上学,二人在参加校文体活动时相识并成为好友,关系日渐密切。某日二人在公园发生性关系时被发现。据甲交待,二人还曾在家中发生过一次性关系。甲、乙均表示是双方自愿。乙的家长要求追究甲的刑事责任。经调查二人确属自愿且未造成其他严重后果。甲的行为（ ）。","o":["构成奸淫幼女罪","构成强奸罪","情节显著轻微、危害不大,不认为是犯罪","构成猥亵儿童罪"],"a":"C","e":"\u000115周岁（已满14不满16周岁）少年与13岁女同学双方自愿且未造成严重后果的恋爱性行为，依最高法司法解释属于情节显著轻微、危害不大，不认为是犯罪。\u0002\nA✗ 1997年《刑法》已经取消了旧“奸淫幼女罪”这一独立罪名\nB✗ 虽然15周岁已达强奸罪责任年龄，但针对同龄青春期少男少女自愿发生且未造成严重后果的情形，司法解释专门从宽排除犯罪认定\nC✓ 情节显著轻微、危害不大，不认为是犯罪：最高法《关于审理强奸案件有关问题的解释》明确规定，\u0001已满14不满16周岁的人与幼女发生性关系，情节轻微、尚未造成严重后果的\u0002，不认为是犯罪（依《刑法》第13条但书精神责令家长管教）\nD✗ 双方系自愿恋爱发生性关系且情节显著轻微，既非专门猥亵也依法不认定犯罪","k":"","kb":82,"kh":[[169,219]]},{"id":"2005-21","y":2005,"t":"多","s":"根据我国刑法规定,对下列哪些情形适用属地管辖原则（ ）。","o":["外国人甲在中国境外打猎,因疏忽大意击中中国境内的外国公民斯某,致其重伤","外国人乙乘坐外国航空器,当该航空器进入中国领空时在该航空器上实施犯罪","中国人丙乘坐中国民用航空器,当该航空器进入外国领空时在该航空器上实施犯罪","中国人丁在中国境内打猎,因过于自信的过失造成中国境外外国公民布某重伤"],"a":"ABCD","e":"\u0001只要“犯罪行为地”或“犯罪结果地”有一项发生在我国领土、领水、领空或我国船舶/航空器内，即认为在我国领域内犯罪，适用属地管辖。\u0002\nA✓ 虽然打猎行为地在境外，但子弹击中了位于\u0001中国境内的斯某\u0002（犯罪结果地在中国领域内），适用属地管辖\nB✓ 外国航空器进入\u0001中国领空\u0002时属于我国主权领空，在该航空器内实施犯罪即行为地在中国领域内，适用属地管辖\nC✓ 根据《刑法》第6条第2款，凡在\u0001中华人民共和国航空器内\u0002犯罪的（即使正飞越公海或外国领空），均适用中国刑法属地管辖\nD✓ 打猎射击的\u0001犯罪行为地在中国境内\u0002（哪怕子弹飞越边境击中境外被害人），犯罪行为地在中国即适用属地管辖","k":"","kb":80,"kh":[[49,75],[125,169]]},{"id":"2006-1","y":2006,"t":"单","s":"如果某犯罪案件不是发生在中国领域,且该案犯罪人不是中国公民,被害人也不是中国国家或者中国公民,但中国对此案仍能行使刑事管辖权的,是基于（ ）。","o":["属地管辖原则","普遍管辖原则","保护管辖原则","属人管辖原则"],"a":"B","e":"\u0001犯罪地不在我国、犯罪人与被害人均非我国公民/国家，但我国依据缔结或参加的国际条约行使刑事管辖权，属于普遍管辖原则。\u0002\nA✗ 属地管辖要求犯罪行为地或结果地至少有一项在我国领域内\nB✓ 普遍管辖原则：当行为地、犯罪人国籍、被害人国籍均与我国无关时，我国基于打击国际条约公罪义务对进入我国境内之犯罪人行使管辖，依据即《刑法》第9条\u0001普遍管辖原则\u0002\nC✗ 保护管辖要求被害人是中华人民共和国国家或者公民\nD✗ 属人管辖要求犯罪人是中华人民共和国公民","k":"","kb":80,"kh":[[375,401],[444,448]]},{"id":"2006-2","y":2006,"t":"单","s":"下列做法中不违背罪刑法定原则要求的是（ ）。","o":["重法效力溯及既往","法律规定不确定的刑罚","适用行为后的轻法","适用类推解释"],"a":"C","e":"\u0001罪刑法定原则禁止重法溯及既往、不定期刑与类推解释，但允许有利于被告人的“行为后轻法”溯及既往（从旧兼从轻）。\u0002\nA✗ 对被告人不利的重法溯及既往直接违背罪刑法定保障公民预测可能性的核心精神\nB✗ 法律规定不确定的刑罚违背罪刑法定的“明确化”与“禁止绝对不定期刑”要求\nC✓ 适用行为后的轻法：当新修改的法律将原来犯罪出罪或法定刑改轻时，允许轻法溯及既往（有利被告人原则），不仅不违背而且正是现代罪刑法定原则所倡导\nD✗ 适用有罪类推解释等同于司法造法，严厉违背罪刑法定原则","k":"","kb":79,"kh":[[100,121]]},{"id":"2007-1","y":2007,"t":"单","s":"我国刑法规定:凡在中国船舶或者航空器内犯罪的,适用中国刑法。其确定刑法效力范围的根据是 （ ）。","o":["属地原则","属人原则","保护原则","普遍管辖原则"],"a":"A","e":"\u0001根据《刑法》第6条第2款（旗国主义），中国船舶和航空器视同中国主权领土的延伸，在其中犯罪适用我国刑法基于属地管辖原则。\u0002\nA✓ 属地原则：《刑法》第6条第2款将我国船舶与航空器作为我国领域的自然延伸（拟制领土），因此依\u0001属地管辖原则\u0002适用我国刑法\nB✗ 属人原则针对我国公民在国外犯罪，哪怕外国人在中国船只/飞机内犯罪依然依第6条第2款受中国管辖\nC✗ 保护原则针对国外外国人侵害中国公民/国家，与中国船只飞机空间属地无关\nD✗ 普遍管辖针对国际条约罪行，不限于本国交通工具","k":"","kb":80,"kh":[[49,75]]},{"id":"2007-21","y":2007,"t":"多","s":"下列选项中,符合罪刑法定原则的有 （ ）。","o":["犯罪与刑罚必须由立法明确规定","禁止重法效力溯及既往","禁止采用习惯法","禁止对犯罪人判处不定期刑"],"a":"ABCD","e":"\u0001罪刑法定原则要求：罪刑须由立法明文规定、禁止重法溯及既往、禁止采用习惯法、禁止绝对不定期刑。\u0002\nA✓ 罪刑法定化要求犯罪的构成要件与刑罚种类幅度必须由成文刑事立法明确事先规定\nB✓ 禁止事后通过加重新法追溯惩罚行为时法不认为是犯罪或处刑较轻的行为\nC✓ 刑法渊源只能是成文刑法，严禁法官援引民间习惯法作为定罪量刑依据\nD✓ 明确性要求刑罚必须有法定上下限幅度，禁止不规定任何刑期标准的绝对不定期刑","k":"","kb":79,"kh":[[83,130]]},{"id":"2008-15","y":2008,"t":"单","s":"《刑法》第 307 条第 1 款规定:“以暴力威胁、贿买等方法阻止证人作证或者指使他人作伪证的,处......”。这种罪状形式属于（ ）。","o":["简单罪状","叙明罪状","空白罪状","引证罪状"],"a":"B","e":"\u0001《刑法》第307条第1款详细描述了“以暴力、威胁、贿买等方法阻止证人作证或者指使他人作伪证”的具体客观行为方式，属于叙明罪状。\u0002\nA✗ 简单罪状仅一笔带过罪名核心行为而无具体手段描述（如“故意杀人的”）\nB✓ 叙明罪状：条文对妨害作证罪的手段（暴力、威胁、贿买）及对象行为（阻止作证、指使作伪证）进行了详细具体描述\nC✗ 空白罪状本身不写具体违法动作而指引去参照行政管理法规\nD✗ 引证罪状引用同部刑法的其他条款来表明构成特征","k":"","kb":84,"kh":[[59,102]]},{"id":"2008-21","y":2008,"t":"多","s":"全国人大常委会有关解释规定:“刑法第 228 条、第 342 条、第 410 条规定的‘违反土地管理法规’,是指违反土地管理法、森林法、草原法等法律以及有关行政法规中关于土地管理的规定。”这一解释属于（ ）。","o":["立法解释","有权解释","学理解释","类推解释"],"a":"AB","e":"\u0001全国人大常委会针对刑法第228条等条文中的“违反土地管理法规”所作的正式解释，按解释机关和效力既属于有权解释，又具体属于立法解释。\u0002\nA✓ 我国宪制下，\u0001全国人大及其常委会\u0002对刑法条文作出的阐明属于最高效力的\u0001立法解释\u0002\nB✓ 立法解释与司法解释均具有普遍法律约束力，同属\u0001有权解释（正式解释）\u0002\nC✗ 学理解释是指学者、教学科研机构所作的不具有法律强制效力的无权解释\nD✗ 该解释仅仅是将同属土地、森林、草原资源管理类的行政法律范围加以明确阐明，并非违法创设罪名的类推解释","k":"","kb":83,"kh":[[9,30]]},{"id":"2009-1","y":2009,"t":"单","s":"下列犯罪中,应当认为在中国领域内犯罪的是（ ）。","o":["甲乘坐外国轮船从中国港口出发,当行至公海时实施犯罪","乙乘坐外国轮船前往中国,在公海上失手致中国公民落水而亡","丙乘坐外国轮船前往中国,在公海上与同行的旅客斗殴,致其重伤,该旅客被送人中国医院后经抢救无效死亡","丁在其本国境内打猎,致正在该国旅游的中国公民死亡"],"a":"C","e":"\u0001在公海外国轮船上殴打旅客致重伤，但被害伤者随后被送入中国境内医院经抢救无效死亡，因“犯罪结果地（死亡发生地）”在中国领域内，视为在中国领域内犯罪。\u0002\nA✗ 在公海上的“外国轮船”内实施犯罪，行为地与结果地均在公海及外国船上，不在中国领域内\nB✗ 在公海外国轮船上失手致中国公民落水死亡，行为与结果均在公海发生（可依第8条保护管辖或过失看是否达3年以上最低刑考察，但不属于第6条“在中国领域内犯罪”）\nC✓ 丙在公海外国船上打人致重伤，但被害人被送入\u0001中国医院抢救无效死亡\u0002，犯罪结果地（死亡地）发生在中国领域内，依第6条第3款认为是在中国领域内犯罪\nD✗ 在外国领土内致中国公民死亡（符合保护管辖条件时适用保护管辖），并不属于在中国领域内犯罪","k":"","kb":80,"kh":[[125,169]]},{"id":"2009-2","y":2009,"t":"单","s":"《刑法》第 13 条规定 :“......但是情节显著轻微危害不大的,不认为是犯罪。”该“但书”规定的目的主要在于（ ）。","o":["对已经构成犯罪的行为免予刑罚处罚","对已经构成犯罪的行为予以非刑罚处罚","给予司法机关确定行为是否构成犯罪的自由裁量权","避免轻微的违法行为犯罪化"],"a":"D","e":"\u0001《刑法》第13条“但是情节显著轻微危害不大的，不认为是犯罪”的“但书”规定，在罪与非罪之间划出定量门槛，旨在防止将轻微一般违法行为犯罪化。\u0002\nA✗ “不认为是犯罪”意味着行为\u0001根本不构成犯罪\u0002，而不是“已经构成犯罪再免予刑罚处罚”\nB✗ 同上，压根不是犯罪分子\nC✗ “但书”不是赋予法官随意出入人罪的任意裁量特权，而是用“情节显著轻微危害不大”这一严格定性定量标准限制入罪\nD✓ 避免轻微的违法行为犯罪化：我国刑法采取“定性+定量”的犯罪概念模式，该但书正体现将情节显著轻微的一般治安/民事违法排除出犯罪圈","k":"","kb":82,"kh":[[102,132]]},{"id":"2010-1","y":2010,"t":"单","s":"A国公民甲在我国境内抢劫A国公民乙后逃回A国，被A国法院判处监禁。甲刑满后来我国，我国法院对甲的上述抢劫行为行使管辖权，是基于（ ）。","o":["属人管辖原则","属地管辖原则","保护管辖原则","普遍管辖原则"],"a":"B","e":"\u0001A国公民在我国境内抢劫A国公民（即使逃回A国已被判过刑），因为犯罪行为发生在中国领域内，我国法院依法依属地管辖原则享有优先刑事管辖权。\u0002\nA✗ 犯罪嫌疑人甲是外国人（A国公民），不适用我国属人管辖\nB✓ 属地管辖原则：抢劫犯罪发生在我国境内（哪怕犯罪人、被害人均系外国人且外国已审理判决过），依据《刑法》第6条属地管辖及第10条外国刑事判决不当然阻止我国再行追诉，我国享有属地管辖权\nC✗ 被害人乙也是A国公民而非中国公民/国家，不适用保护管辖\nD✗ 普通抢劫罪不属于国际条约规定应普遍管辖的特定国际公罪","k":"","kb":80,"kh":[[15,48]]},{"id":"2011-1","y":2011,"t":"单","s":"A国驻华金融机构工作人员甲策划、参与了由中国向A国走私文物的犯罪活动。对甲应当（ ）。","o":["直接驱逐出境","通过外交途径解决其刑事责任","适用我国法律追究其刑事责任","适用A国法律追究其刑事责任"],"a":"C","e":"\u0001A国驻华金融机构工作人员（不享有外交特权与豁免权的普通外籍商企人员）在我国实施走私文物犯罪，依据属地管辖应当适用我国法律追究刑事责任。\u0002\nA✗ 对于犯重罪（走私文物等）的外国人原则上先行依法定罪判刑并在服刑完毕后（或单独、附加）再决定是否驱逐出境，并非不审不判一走了之直接驱逐\nB✗ 依据《刑法》第11条，只有“享有外交特权和豁免权的外国人”的刑事责任才通过外交途径解决；外国普通驻华企业/银行工作人员不享有外交豁免权\nC✓ 适用我国法律追究其刑事责任：犯罪发生在我国领土且嫌疑人无外交特权豁免，严格适用第6条属地原则依法追诉\nD✗ 我国法院审理我国领土内犯罪只适用中国《刑法》，绝不适用外国刑法判罪","k":"","kb":80,"kh":[[15,48]]},{"id":"2011-4","y":2011,"t":"单","s":"我国1997年《刑法》关于溯及力的规定采取的是（ ）。","o":["从旧原则","从新原则","从新兼从轻原则","从旧兼从轻原则"],"a":"D","e":"\u0001我国1997年《刑法》第12条在时间效力（溯及力）问题上明文采取从旧兼从轻原则。\u0002\nA✗ 纯粹的“从旧原则”绝不允许新法哪怕对被告人更轻时溯及既往\nB✗ “从新原则”会导致不合理的重法溯及既往，违背罪刑法定\nC✗ “从新兼从轻”违背新法一般不溯及既往的安全底线\nD✓ 从旧兼从轻原则：原则上适用犯罪行为当时的旧法，唯独当新法不认为是犯罪或者处刑较轻时，才适用有利被告人的新法","k":"","kb":81,"kh":[[15,22]]},{"id":"2012-1","y":2012,"t":"单","s":"根据相关统计,自《刑法修正案(八)》实施7 个月来,公安机关查获的醉酒驾驶机动车案件数量较上一年同期下降43.7%。这一数据变化反映了刑法的（ ）。","o":["保障机能","规制机能","保护机能","预防机能"],"a":"B","e":"\u0001《刑法修正案（八）》增设醉驾入刑后，社会大众自觉减少酒后驾车行为、醉驾案件数量显著下降43.7%，直接彰显刑法指导约束国民行为的规制机能。\u0002\nA✗ 保障机能强调保障公民和被告人不受国家刑罚权不当侵害与法外惩罚\nB✓ 规制机能：刑法通过明文将醉驾规定为犯罪并配置刑罚，明确向社会传递行为底线指令，从而有效规制和约束了驾驶人不再酒驾\nC✗ 保护机能重在通过事后惩罚具体犯罪使受损法益免于再受侵害或获得保护；本题“醉驾案件数量因新法出台明显大幅下降”侧重的是事先规范民众行为的规制效果\nD✗ 通常归纳刑法的三大机能为规制机能、保护机能与保障机能，教材不单列“预防机能”作为三大机能之一","k":"","kb":79,"kh":[[258,270]]},{"id":"2012-2","y":2012,"t":"单","s":"我国公民甲在德国旅游时,盗窃了我国公民乙一部价值1万元的相机。对甲的行为适用我国刑法的依据是（ ）。","o":["属地原则","保护原则","属人原则","普遍管辖原则"],"a":"C","e":"\u0001我国公民甲在德国旅游期间盗窃我国公民乙的价值1万元相机，犯罪地在德国，我国行使刑事管辖权的依据是属人管辖原则（只要本国公民在境外犯罪即属人优先）。\u0002\nA✗ 盗窃发生在德国境内，对德国是属地，对我国不属于属地\nB✗ 《刑法》第8条保护管辖专门适用于“\u0001外国人\u0002在我国领域外对我国国家或公民犯罪”；本案犯罪人甲本身是中国公民，适用第7条属人原则\nC✓ 属人原则：凡中华人民共和国公民在中华人民共和国领域外犯我国刑法规定之罪的（盗窃1万元最高刑可达3年以上，不属于最高刑3年以下可不追究情形，应当追究），依《刑法》第7条\u0001属人管辖原则\u0002适用我国刑法\nD✗ 普通盗窃不属于普遍管辖的国际条约罪行","k":"","kb":80,"kh":[[182,215]]},{"id":"2013-1","y":2013,"t":"单","s":"甲使用暴力劫取国有档案,人民法院根据我国《刑法》第329条“抢夺、窃取国家所有的档案的, 处·.....”的规定,判决甲犯抢夺国有档案罪。本案中, 法院的解释属于（ ）。","o":["司法解释","文理解释","目的解释","扩大解释"],"a":"D","e":"\u0001法院判决中将“使用暴力劫取”解释进《刑法》第329条“抢夺、窃取国家所有的档案”的“抢夺”一词内（该解释对“抢夺”文义作了高于日常字面宽度的扩充），属于扩大解释。\u0002\nA✗ 只有最高法、最高检发布的规范性解释文件才属于有权司法解释，基层或中级法院个案刑事判决书并非法定“司法解释”\nB✗ 纯粹字面文理解释下，“抢夺”通常指趁人不备公然夺取而不包含暴力压制反抗的“暴力抢劫”\nC✗ 虽也考虑立法目的，但就“抢夺”字面范围被扩延到涵括“暴力抢劫档案”这一解释技法而言，精准对应“扩大解释”（注：亦有观点质疑属类推但当年真题命题基于第329条未设“抢劫国有档案罪”而按官方认可之扩大解释作答）\nD✓ 扩大解释：因《刑法》第329条仅写了“抢夺、窃取国有档案”，为了弥补规范漏洞而不致重罪（暴力抢劫国有档案）反而轻判或不罚，法院将“抢夺”在规范意义上扩充解释涵盖暴力劫取档案，在2013年真题中确立为\u0001扩大解释\u0002","k":"","kb":83,"kh":[[194,208]]},{"id":"2013-2","y":2013,"t":"单","s":"2012年5月,缅甸籍毒贩糯康在泰国境内制造“湄公河惨案”,杀害了十余名我国船员,后被老挝移送到我国受审。我国司法机关对于糯康进行刑事审判的依据是（ ）。","o":["属地管辖权","保护管辖权","普遍管辖权","属人管辖权"],"a":"B","e":"\u0001外国毒贩糯康在国外（泰国境内湄公河段）杀害我国多名船员，外国人在我国领域外对中国公民实施重罪（最低刑3年以上），我国行使管辖的依据是保护管辖权。\u0002\nA✗ 案发地点位于泰国境内（中国船员遇害于外国水域/未称中国船舶本身管辖），并非中国领域内\nB✓ 保护管辖权：缅甸籍外国人糯康在中国领域外杀害十余名中国籍船员，所犯故意杀人罪我国法定最低刑在三年以上有期徒刑且为犯罪地（泰国）法律所同样处罚，依《刑法》第8条\u0001保护管辖权\u0002受中国司法审判\nC✗ 虽糯康也是毒贩，但“湄公河惨案”审理核心罪行是在境外针对中国公民实施的故意杀人罪，依第8条保护管辖直接管辖（而非无受害国关联的纯普遍管辖）\nD✗ 罪犯糯康为缅甸国籍并非中国公民，不能用属人管辖","k":"","kb":80,"kh":[[286,344]]},{"id":"2013-16","y":2013,"t":"单","s":"我国《刑法》第295条规定:“传授犯罪方法的,处·......”,本条的罪状形式是（ ）。","o":["空白罪状","简单罪状","引证罪状","叙明罪状"],"a":"B","e":"\u0001《刑法》第295条仅仅写“传授犯罪方法的，处……”，没有对具体怎么传授作繁复罗列，属于简明扼要概括犯罪特征的简单罪状。\u0002\nA✗ 没有援引其他非刑事行政法规，“违反国家规定”之类才叫空白罪状\nB✓ 简单罪状：条文仅仅用最精炼的六个字\u0001“传授犯罪方法的”\u0002指出犯罪行为特征而不再展开细节描述，属典型简单罪状\nC✗ 没有引用本刑法条文中的前款或他条罪状\nD✗ 没有像“以暴力、胁迫……”那样逐项详尽拆解行为手段、对象与结果","k":"","kb":84,"kh":[[21,43]]},{"id":"2014-1","y":2014,"t":"单","s":"下列选项中,体现罪责刑相适应原则的是哪项（ ）。","o":["刑法关于空间效力范围的规定","刑法关于怀孕的妇女不适用死刑的规定","刑法关于享有外交特权的外国人刑事责任的规定","刑法关于放火罪与失火罪构成要件及法定刑的不同规定"],"a":"D","e":"\u0001刑法对故意实施的“放火罪”规定较重法定刑（3–10年乃至死刑），而对过失引起的“失火罪”规定较轻构成与法定刑（3–7年或3年以下），充分体现了罪责刑相适应原则。\u0002\nA✗ 刑法的空间效力体现国家主权原则及管辖范围划分\nB✗ 审判时怀孕的妇女不适用死刑主要体现刑罚人道主义与保护无辜胎儿生命原则\nC✗ 享有外交特权与豁免权的外国人通过外交途径解决属于国际公法外交豁免礼让与主权对等制度\nD✓ 刑法关于放火罪与失火罪构成要件及法定刑的不同规定：同样烧毁财产危及公共安全，但故意（主观恶性极大）与过失（主观恶性较轻）在立案门槛和法定刑轻重上截然有别，生动体现了\u0001重罪重罚、轻罪轻罚\u0002的罪责刑相适应原则","k":"","kb":79,"kh":[[205,221]]},{"id":"2014-2","y":2014,"t":"单","s":"根据解释的效力,可以把刑法解释分为（ ）。","o":["立法解释、司法解释和学理解释","当然解释、文理解释和论理解释","当然解释、扩大解释和缩小解释","文理解释、论理解释和学理解释"],"a":"A","e":"\u0001根据解释的效力（有无正式法律约束力及机关层级），刑法解释分为立法解释、司法解释和学理解释。\u0002\nA✓ 立法解释、司法解释和学理解释：按照解释效力划分，立法解释（全国人大常委会）与司法解释（两高）为\u0001有权解释\u0002，学理解释为\u0001无权解释\u0002\nB✗ 文理解释与论理解释是按照\u0001解释的方法\u0002进行的分类\nC✗ 当然解释、扩大解释和缩小解释均属于论理解释方法内部的子分类\nD✗ 把“方法分类”与“效力分类”混杂在了一起","k":"","kb":83,"kh":[[9,30],[74,88],[105,115]]},{"id":"2014-3","y":2014,"t":"单","s":"依照我国《刑法》第13条的“但书”规定,“不认为是犯罪”的条件是（ ）。","o":["情节轻微的","危害不大的","情节轻微危害不大的","情节显著轻微危害不大的"],"a":"D","e":"\u0001精准背诵《刑法》第13条但书原话：“但是情节显著轻微危害不大的，不认为是犯罪。”（“显著轻微”+“危害不大”，缺一字都不行）。\u0002\nA✗ 遗漏“显著”和“危害不大的”，门槛过宽\nB✗ 仅写“危害不大的”遗漏“情节显著轻微”\nC✗ 少了关键限定词\u0001“显著”\u0002二字（仅仅“情节轻微”仍可能构成犯罪，只是可免予刑事处罚；只有“显著轻微”才直接不认为是犯罪）\nD✓ 情节显著轻微危害不大的：严格符合《刑法》第13条但书一字不差的法定表述","k":"","kb":82,"kh":[[80,100]]},{"id":"2014-12","y":2014,"t":"单","s":"下列罪状中,属于叙明罪状的是（ ）。","o":["过失犯前款罪的","收买被拐卖的妇女、儿童的","以暴力、胁迫手段组织残疾人或者不满14周岁的未成年人乞讨的","违反国家规定,侵入国家事务、国防建设、尖端科学技术领域的计算机信息系统的"],"a":"C","e":"\u0001“以暴力、胁迫手段组织残疾人或者不满14周岁的未成年人乞讨的”（组织残疾人、儿童乞讨罪）详尽叙述了犯罪手段、行为方式及特定被害对象，属叙明罪状。\u0002\nA✗ “过失犯前款罪的”是引用同一条前款具体内容，属于\u0001引证罪状\u0002\nB✗ “收买被拐卖的妇女、儿童的”仅作简略提示而未展开描述收买经过，属于\u0001简单罪状\u0002\nC✓ 以暴力、胁迫手段组织残疾人或者不满14周岁的未成年人乞讨的：详细描述了手段、行为和对象，是标准的\u0001叙明罪状\u0002\nD✗ “违反国家规定，侵入……”须参照国家计算机安全行政保护法规来填充“国家规定”，属于\u0001空白罪状（混合罪状）\u0002","k":"","kb":84,"kh":[[103,132],[169,187]]},{"id":"2014-41","y":2014,"t":"多","s":"对于下列毒品犯罪,我国可按照普遍管辖原则行使刑事管辖权的有（ ）。","o":["无国籍人在外国生产毒品,后来到我国旅游, 被我国司法机关抓获","他国公民从第三国购买毒品回本国贩卖,被本国通缉,后被我国司法机关抓获","我国公民在外国乘坐外国客机将毒品带往第三国贩卖,被他国司法机关抓获","他国公民携带贩卖的毒品乘坐他国飞机在我国机场换乘时,被我国司法机关抓获"],"a":"AB","e":"\u0001毒品犯罪是我国参加的国际禁毒公约所规定国际罪行，因此哪怕犯罪地在国外、行为人（无国籍人或他国人）与被害人均无中国因素，只要进入我国领土被我抓获，均可适用普遍管辖原则。\u0002\nA✓ 无国籍人在外国生产毒品后到中国旅游被我抓获，虽属境外涉毒但该嫌疑人现身中国境内，我方依国际禁毒条约行使\u0001普遍管辖权\u0002\nB✓ 他国公民在国外涉毒被他国通缉后入境我国被我国司法机关抓获，我国依普遍管辖权亦可依法审判（或视引渡合作）\nC✗ “我国公民”在外国犯罪且被他国抓获，一方面这是我国公民应适用\u0001属人管辖原则\u0002（而非普遍管辖），另一方面人也不在我国境内\nD✗ 携带贩卖的毒品乘坐客机经我国机场换乘（犯罪行为地/毒品运输经过地已经进入\u0001我国境内机场\u0002），我国应当直接依据\u0001属地管辖原则\u0002管辖（不适用补位性质的普遍管辖）\n管辖优先级黄金顺位：\u0001属地 ＞ 属人 ＞ 保护 ＞ 普遍\u0002！只要案子能落入我国境内（比如在我国机场转机），立刻用第6条属地原则，轮不到普遍管辖！","k":"","kb":80,"kh":[[15,30],[375,448]]},{"id":"2015-1","y":2015,"t":"单","s":"原铁道部部长刘某因受贿罪、滥用职权罪被追究刑事责任。有人认为,在对刘某量刑时“应考虑他对中国高铁建设的贡献”。这种说法违背了我国刑法中的（ ）。","o":["罪刑法定原则","刑法适用平等原则","罪责刑相适应原则","主客观相统一原则"],"a":"C","e":"\u0001认为刘某受贿、滥用职权“应考虑他对中国高铁建设的贡献”去减免罪责，违背“刑罚轻重仅与犯罪分子所犯罪行和承担的刑事责任相适应”的罪责刑相适应原则。\u0002\nA✗ 题干并不是探讨无罪与有罪的法定化问题\nB✗ “刑法适用平等原则”主要反对因社会身份/地位高贵特权而同罪不同罚（注意也有一定关联，但真题解析立足于“功劳贡献不属于罪行与刑责本身要素，不能拿行政政绩功劳抵销刑罚”，核心违背罪责刑相适应原则）\nC✓ 罪责刑相适应原则：决定刑罚轻重的唯一基准是犯罪分子\u0001所犯罪行和承担的刑事责任\u0002（社会危害性与人身危险性），决不能把非刑法因素（如过去的行业工作成绩/建设贡献）拿来充抵减刑（真正立功也必须是法定的揭发犯罪等刑事立功）\nD✗ 该主张不是主观心理与客观行为的割裂问题","k":"","kb":79,"kh":[[175,203]]},{"id":"2015-5","y":2015,"t":"单","s":"针对吸毒后在道路上驾驶汽车的现象,有人认为,虽然刑法未规定吸毒驾驶构成犯罪,但是吸毒驾驶和醉酒驾驶具有相同的社会危害性,故而应以危险驾驶罪论处。这种观点属于（ ）。","o":["扩大解释","文理解释","类推解释","当然解释"],"a":"C","e":"\u0001刑法明文规定危险驾驶罪限于“醉酒驾驶”等四类情形，将完全不同的“吸毒后驾驶”比附援引按危险驾驶罪处罚，超出了“醉酒”文义任何可能边界，属被禁止的类推解释。\u0002\nA✗ “醉酒”在任何语言常识中都不可能包括“吸食冰毒/海洛因等毒品”，把“吸毒”说成“醉酒”完全超出了“醉酒”的文义射程\nB✗ 按字面文理解释“醉酒”绝对不包含吸毒\nC✓ 类推解释：在“吸毒后驾驶”与“醉酒驾驶”仅具有“导致判断力下降发生交通事故”某种相似性、但文字根本无法包含的前提下比附套用危险驾驶罪，属于典型被刑法禁止的\u0001有罪类推解释\u0002\nD✗ 当然解释强调“举轻以明重/举重以明轻”仍在法条预设逻辑范围内部；吸毒与醉酒性质截然不同且未入危险驾驶罪条文","k":"","kb":83,"kh":[[247,281]]},{"id":"2016-1","y":2016,"t":"单","s":"从刑法的形式渊源来看,全国人大常委会《关于惩治骗购外汇、逃汇和非法买卖外汇犯罪的决定》是（ ）。","o":["狭义刑法","单行刑法","附属刑法","立法解释"],"a":"B","e":"\u00011998年全国人大常委会专门出台的《关于惩治骗购外汇、逃汇和非法买卖外汇犯罪的决定》（1997年刑法典之后唯一一部单行刑法）属于单行刑法。\u0002\nA✗ 狭义刑法是指一部体系完整的刑法典（即1997年修订颁布的《中华人民共和国刑法》）\nB✓ 单行刑法：国家立法机关专门就某一类特定犯罪及刑罚事项单独颁布的法律文件（1997年《刑法》施行后仅颁布过这一部单行刑法）\nC✗ 附属刑法指附带规定在民法、经济法、环保法、海关法等非刑事专门法律中的刑事责任条文（我国目前尚无真正独立的罪刑法定附属刑法）\nD✗ 立法解释只对现有刑法既有条文含义作澄清说明，不能直接创设全新的“骗购外汇罪”新罪名和法定刑","k":"","kb":83,"kh":[[354,374]]},{"id":"2016-2","y":2016,"t":"单","s":"“过失犯罪,,法律有规定的才负刑事责任。”刑法的这一规定体现的原则是（ ）。","o":["罪刑法定","主客观相统一","罪责刑相适应","刑法适用平等"],"a":"A","e":"\u0001《刑法》第15条第2款“过失犯罪，法律有规定的才负刑事责任”明确将过失入罪严格限定于法律明文规定范围内，体现了罪刑法定原则。\u0002\nA✓ 罪刑法定：法律有明确规定的过失行为才作为犯罪追责，否则哪怕过失造成重大损失（如过失毁坏普通财物）也不定罪，精准体现了\u0001“法无明文规定不为罪”\u0002的罪刑法定原则\nB✗ 主客观相统一强调定罪须兼具主观罪过与客观危害行为，但第15条第2款特别重申“法律有规定才追责”的核心立意是法定化\nC✗ 罪责刑相适应探讨的是罪重刑重、罪轻刑轻的匹配程度\nD✗ 平等原则禁止因人而异定罪处刑","k":"","kb":79,"kh":[[16,59]]},{"id":"2016-3","y":2016,"t":"单","s":"甲挪用公款炒股亏损无力归还,被检察机关以贪污罪起诉,人民法院依法认定甲的行为构成挪用公款罪。人民法院对本案罪名的变更实现了刑法的（ ）。","o":["规制机能","保护机能","保障机能","威慑机能"],"a":"C","e":"\u0001检察院以重罪名“贪污罪”起诉，法院审理后依法变更定性为较轻且准确的“挪用公款罪”，保护了被告人不受错误重罪名及过重刑罚处罚的权利，体现了刑法的人权保障机能。\u0002\nA✗ 规制机能是向社会一般公众宣布禁止某种行为从而规范行为选择\nB✗ 保护机能侧重严厉打击犯罪以保卫国家利益、公共利益和被害人法益\nC✓ 保障机能：通过严格恪守构成要件将检察院指控的“贪污罪”改判为较轻且合乎法律事实的“挪用公款罪”，保障了被告人免受不当重罪追诉与超限刑罚侵害，体现了刑法的\u0001保障机能\u0002\nD✗ “威慑机能”不属于我国刑法教科书规定的三大基本机能（三大机能：规制、保护、保障）","k":"","kb":79,"kh":[[286,330]]},{"id":"2016-11","y":2016,"t":"单","s":"依据刑法规定，在道路上驾驶机动车追逐竞驶，情节恶劣的，“处拘役，并处罚金。”此处的法定刑属于（ ）。","o":["援引法定刑","绝对确定法定刑","相对确定法定刑","绝对不确定法定刑"],"a":"C","e":"\u0001“处拘役，并处罚金”在立法上指明了具体刑种（拘役+罚金）和一般幅度的法定伸缩范围（拘役1–6个月、无限额罚金），属于相对确定法定刑。\u0002\nA✗ 援引法定刑是指条文不直接写刑罚而写“依照本法第XX条的规定处罚”\nB✗ 绝对确定法定刑只规定唯一毫无伸缩空间的固定刑种和固定刑期（如仅写“处死刑”），本条“拘役”从1至6个月有裁量幅度，故非绝对确定\nC✓ 相对确定法定刑：分则条文明确了可适用的刑种及上下限裁量幅度，由法官在幅度内具体裁量，我国刑法绝大多数条文（包括“处拘役，并处罚金”）均属此类\nD✗ 绝对不确定法定刑（完全不规定刑种刑期，交由法官随心所欲）为罪刑法定原则所严格禁止","k":"","kb":84,"kh":[[223,258]]},{"id":"2017-1","y":2017,"t":"单","s":"近年,我国司法机关展开“猎狐行动”,追捕潜逃海外的犯罪嫌疑人回国接受刑事审判,此举是为了实现刑法的（ ）。","o":["规制机能","保障机能","保护机能","补偿机能"],"a":"C","e":"\u0001国家开展“猎狐行动”跨国追捕外逃贪腐及经济犯罪嫌疑人归案受审，意在打击犯罪、挽回损失并维护国家、社会与人民合法法益，体现刑法的保护机能。\u0002\nA✗ 规制机能是规范指引尚未犯罪的公民行为规则；追逃已犯罪的通缉犯归案受审旨在实现国家追诉打击与保护法益\nB✗ 保障机能着眼于约束司法机关保障被告人不被滥施刑罚（如无罪推定、改判轻罪、正当防卫不捕不诉）\nC✓ 保护机能：通过将外逃犯罪嫌疑人缉拿归案绳之以法，直接惩罚犯罪并保护国家、社会与被害人合法利益不受侵害，彰显刑法的\u0001保护机能\u0002\nD✗ 刑法三大基本机能不含“补偿机能”","k":"","kb":79,"kh":[[271,285]]},{"id":"2017-2","y":2017,"t":"单","s":"甲国公民乘坐乙国飞机飞越丙国领空时，殴打中国籍乘客刘某致其重伤。甲国公民对刘某的犯罪，适用我国刑法的依据是（ ）。","o":["属地管辖原则","保护管辖原则","属人管辖原则","普遍管辖原则"],"a":"B","e":"\u0001外国人（甲国公民）在国外（乘坐乙国飞机在丙国领空——全在外国领域内）殴打中国籍乘客致重伤（我国刑法最低刑为3年以上有期徒刑，且属于各国普遍惩罚的伤害重罪），我国依保护管辖原则适用中国刑法。\u0002\nA✗ 飞机为乙国航空器且正处于丙国领空，犯罪行为地与结果地均不在我国领域内，不适用属地管辖\nB✓ 保护管辖原则：甲国人在中国领域外伤害中国公民（故意伤害致人重伤我国法定刑为\u0001三年以上十年以下有期徒刑\u0002，满足“最低刑3年以上”条件且各国均处罚该重伤犯罪），符合《刑法》第8条\u0001保护管辖原则\u0002\nC✗ 行为人是甲国外国人而非中国公民，不适用属人管辖\nD✗ 普通殴打伤害一名特定乘客并非反人类、海盗、毒品、劫机等国际公约普遍管辖罪行","k":"","kb":80,"kh":[[286,344]]},{"id":"2017-12","y":2017,"t":"单","s":"我国《刑法》第266条中规定“诈骗公私财物, 数额较大的”,这种罪状是（ ）。","o":["叙明罪状","空白罪状","简单罪状","引证罪状"],"a":"C","e":"\u0001《刑法》第266条“诈骗公私财物，数额较大的……”仅用“诈骗”一词简要概括犯罪核心特征，未作详尽行为描述，属于简单罪状。\u0002\nA✗ 条文并未详尽写明“用虚构事实或者隐瞒真相的方法……”（注意：那是刑法教科书的理论定义，第266条《刑法》条文原文真的只有“诈骗公私财物，数额较大的”十个字！），故非叙明罪状\nB✗ 未指明需参照适用其他非刑事行政法律，非空白罪状\nC✓ 简单罪状：《刑法》第266条条文原文极为简练（“诈骗公私财物，数额较大的，……”），因“诈骗”一词在公众语境中不言自明，属于典型\u0001简单罪状\u0002\nD✗ 未引用其他条文条款，非引证罪状","k":"","kb":84,"kh":[[21,58]]},{"id":"2017-41","y":2017,"t":"多","s":"下列选项中,属于刑法立法解释的有（ ）。","o":["全国人大常委会《关于惩治骗购外汇、逃汇和非法买卖外汇犯罪的决定》","全国人大常委会《关于<中华人民共和国刑法>有关信用卡规定的解释》","全国人大常委会法制工作委员会刑法室《关于挪用资金罪有关问题的答复》","全国人大常委会《关于〈中华人民共和国刑法〉第二百六十六条的解释》"],"a":"BD","e":"\u0001只有全国人民代表大会及其常务委员会作出的法律解释文件才属于刑法立法解释；单行刑法与全国人大常委会法工委（办事机构）的答复意见均不属于立法解释。\u0002\nA✗ 《关于惩治骗购外汇、逃汇和非法买卖外汇犯罪的决定》创设了新罪名和法定刑，是独立的\u0001单行刑法\u0002，不是解释既有条文的立法解释\nB✓ 全国人大常委会通过的《关于〈中华人民共和国刑法〉有关信用卡规定的解释》属于正式的\u0001立法解释\u0002\nC✗ 全国人大常委会\u0001法制工作委员会刑法室\u0002只是人大常委会下设工作办事机构的内部部门，没有国家最高立法解释权（其“答复”仅供实务参考，不具有正式立法解释效力）\nD✓ 全国人大常委会通过的《关于〈中华人民共和国刑法〉第二百六十六条的解释》属于正式的\u0001立法解释\u0002","k":"","kb":83,"kh":[[9,73]]},{"id":"2018-1","y":2018,"t":"单","s":"关于我国刑法溯及力的适用,下列表述中正确的是（ ）。","o":["司法解释应适用从新兼从轻原则","处刑较轻是指法院判处的宣告刑较轻","应以“审判时”作为新旧法选择适用的判断基础","按照审判监督程序重新审判的案件适用行为时的法律"],"a":"D","e":"\u0001依照两高司法解释，对于在刑法典或新司法解释施行前已经发生法律效力并按照审判监督程序重新审判（再审）的案件，应当适用行为时的法律，不适用从旧兼从轻溯及新法。\u0002\nA✗ 两高《关于适用刑事司法解释时间效力问题的规定》确立刑法司法解释同样适用\u0001从旧兼从轻原则\u0002\nB✗ 《刑法》第12条所指“处刑较轻”，比较的是新旧刑法条文规定的\u0001法定刑\u0002幅度轻重（而非法院在个案中最终判处的宣告刑）\nC✗ 《刑法》第12条“从旧兼从轻”的比较基准起点是\u0001“犯罪行为发生时”\u0002的有效法律与审判时现行有效新法对比，不能直接按审判时倒推无视行为时法\nD✓ 按照审判监督程序重新审判的案件适用行为时的法律：最高法明确规定，对于本法施行前已经审结生效的案件（即原审早已终审判决），即便日后因发现错误进入审判监督程序（再审），仍应当\u0001适用行为时的法律\u0002，不以事后新颁布的更轻刑法或更轻司法解释为由去推翻原合法生效判决","k":"","kb":81,"kh":[[165,214]]},{"id":"2018-11","y":2018,"t":"单","s":"最高人民法院发布的《关于审理抢劫案件具体应用法律若干问题的解释》中规定,抢劫正在使用中的银行或其他金融机构的运钞车的,视为\"抢劫银行或者其他金融机构\"。该规定使用的解释方法是 （ ）。","o":["扩大解释","类推解释","限制解释","文理解释"],"a":"A","e":"\u0001把正在使用中的运钞车解释纳入《刑法》第263条“抢劫银行或者其他金融机构”范围，对“银行或者其他金融机构”外延作了扩大且未超出“金融机构流动营业/金库延展”文义射程，属于扩大解释。\u0002\nA✓ 扩大解释：运钞车是银行履行现金调拨和金库运转职能的流动金融设施载体，将其视为银行的流动延伸属于在“金融机构”概念范围内作适当宽泛解读，属于\u0001扩大解释\u0002\nB✗ 运钞车本身即隶属或服务于金融机构专属现金运送，并非将风马牛不相及的事物类比成银行\nC✗ 限制解释（缩小解释）是将词语范围缩窄，而本条恰恰将原词范围由固定网点扩充覆盖流动运钞车\nD✗ 按纯字面常识理解“银行或金融机构”一般先想到营业厅网点大楼，延伸到运钞车离不开立法精神与规范目的之论理解释","k":"","kb":83,"kh":[[181,193]]},{"id":"2018-41","y":2018,"t":"多","s":"甲在街头摆气球射击摊,因向顾客提供的六支枪形物被鉴定为枪支,被法院以非法持有枪支罪判处有期徒刑同时宣告缓刑。法院的做法符合（ ）。","o":["罪刑法定原则","罪责刑相适应原则","从旧兼从轻原则","主客观相统一原则"],"a":"ABD","e":"\u0001街头气球射击摊涉案枪形物鉴定为枪支被定非法持有枪支罪同时判处缓刑，体现定罪上的罪刑法定、枪支认知与故意考察中的主客观相统一、以及兼顾微弱危害性与社会危险性的罪责刑相适应原则。\u0002\nA✓ 凡持有被依法鉴定符合枪支致伤力标准之枪支即依法构成非法持有枪支罪，体现了严格守法的\u0001罪刑法定原则\u0002\nB✓ 因街头气球摊致伤力极微、非涉黑涉暴恶性犯罪且无再犯危险，法院对之宣告缓刑从轻处罚，体现了\u0001罪责刑相适应原则\u0002\nC✗ 案情全程并未涉及刑法修订新旧法交替衔接问题，不涉及从旧兼从轻原则\nD✓ 综合考察行为人主观认识程度、持有用途与客观鉴定结果后作出定罪并处以缓刑的判决，体现了\u0001主客观相统一原则\u0002","k":"","kb":79,"kh":[[8,14],[165,173]]},{"id":"2019-11","y":2019,"t":"单","s":"下列关于我国刑法中罪刑法定原则的理解, 正确的是（ ）。","o":["简单罪状因缺乏明确性不符合罪刑法定原则","将习惯法视为刑法的渊源不违反罪刑法定原则","罪刑法定原则不允许有利于被告人的新法溯及既往","罪刑法定原则中的“法”不包括行政法规"],"a":"D","e":"\u0001罪刑法定原则中所指的“法”（刑法渊源）仅限于全国人民代表大会及其常务委员会制定的法律，绝对不包括国务院行政法规和习惯法。\u0002\nA✗ 简单罪状虽然行文简短，但所涉行为核心意义清晰明确（如故意杀人、盗窃、强奸），完全符合明确性要求\nB✗ 罪刑法定派生原则明文禁止把习惯法作为刑法定罪处刑渊源\nC✗ 罪刑法定禁止的是不利于被告人的重法溯及既往，不仅允许而且鼓励\u0001有利于被告人的轻法溯及既往\u0002\nD✓ 罪刑法定原则中的“法”不包括行政法规：我国《立法法》和罪刑法定原则严格规定，犯罪和刑罚只能由\u0001全国人大及其常委会制定的法律\u0002加以规定（绝不可由行政法规直接创设罪名和刑罚）","k":"","kb":79,"kh":[[131,158]]},{"id":"2019-12","y":2019,"t":"单","s":"我国公民甲在某国杀害乙（无国籍人），被该国法院判处有期徒刑12年。如甲在该国服刑完毕回到我国，我国司法机关依照刑法对甲行使刑事管辖权的根据是（ ）。","o":["属地原则","属人原则","保护原则","普遍管辖原则"],"a":"B","e":"\u0001我国公民在国外杀害无国籍人且在当地服刑12年期满回国，我国司法机关对我国公民在领域外犯罪行使管辖权的根据依然是属人管辖原则。\u0002\nA✗ 犯罪发生在某外国境内，不适用我国属地管辖\nB✓ 属人原则：犯罪嫌疑人甲是中国公民且在境外犯故意杀人重罪（法定最高刑远高于3年），依《刑法》第7条属人原则适用中国刑法（按第10条在外国已受过刑罚处罚的仍可依法追究，但可以免除或者减轻处罚）\nC✗ 被害人为无国籍人而非中国国家或者中国公民，不适用保护管辖\nD✗ 普通个人境外杀人并非普遍管辖所指国际条约罪行","k":"","kb":80,"kh":[[182,215]]},{"id":"2020-1","y":2020,"t":"单","s":"无国籍人甲在美国通过网络对正在中国旅游的英国人乙实施诈骗,骗得巨额钱款。对甲的行为, 我国司法机关（ ）。","o":["没有刑事管辖权","依属地原则享有刑事管辖权","依保护原则享有刑事管辖权","依普遍原则享有刑事管辖权"],"a":"B","e":"\u0001无国籍人在美国利用网络对正身处中国境内旅游的英国公民实施诈骗并得逞，诈骗结果（被害人在中国被骗转款财产受损）发生在中国境内，我国依据属地原则享有管辖权。\u0002\nA✗ 尽管罪犯是无国籍人且被害人是英国人，但犯罪结果发生在我国领土内，我国完全享有刑事管辖权\nB✓ 依属地原则享有刑事管辖权：被害人乙当时身在中国境内旅游并被骗失财，\u0001犯罪结果地在中国领域内\u0002，依《刑法》第6条第3款认为是在中国领域内犯罪，适用属地管辖权\nC✗ 被害人乙是英国公民并非我国国家或中国公民，不符合保护管辖主体要件\nD✗ 普通网络个人诈骗并非国际公约规定的普遍管辖犯罪","k":"","kb":80,"kh":[[125,169]]},{"id":"2021-1","y":2021,"t":"单","s":"下列选项中,符合我国刑法关于空间效力规定的是（ ）。","o":["外国人在我国领域外对我国公民犯罪,而按我国刑法规定的最低刑为3年以上有期徒刑的,应适用我国刑法","凡在我国领域外犯罪,依照我国刑法应当负刑事责任的,虽然经过外国审判,仍然应依照我国刑法追究","我国国家工作人员在我国领域外犯我国刑法规定之罪的,应适用我国刑法","犯罪行为没有发生在我国领域内的,不应认为是在我国领域内犯罪"],"a":"C","e":"\u0001《刑法》第7条第2款明文规定：“中华人民共和国国家工作人员和军人在中华人民共和国领域外犯本法规定之罪的，适用本法。”（不享3年以下豁免）。\u0002\nA✗ 《刑法》第8条保护管辖不仅要求我国刑法最低刑为3年以上有期徒刑，还必须加上但书“\u0001但是按照犯罪地的法律不受处罚的除外\u0002”（即双重犯罪原则）\nB✗ 依据第10条，经外国审判的我国公民，我国虽有管辖追诉权但属于“\u0001可以\u0002（而非应当/仍然必须）”再行追究，且已在外国受过刑罚处罚的可以免除或者减轻处罚\nC✓ 我国国家工作人员在我国领域外犯我国刑法规定之罪的，应适用我国刑法：严丝合缝对应《刑法》第7条第2款绝对属人原则\nD✗ 只要犯罪行为地或犯罪\u0001结果地\u0002有一项发生在我国领域内的，就认为是在我国领域内犯罪","k":"","kb":80,"kh":[[245,273]]},{"id":"2021-44","y":2021,"t":"多","s":"某刑法教科书提出“盗窃行为并不限于秘密窃取”，这种解释属于（ ）。","o":["类推解释","论理解释","无权解释","文理解释"],"a":"BC","e":"\u0001法学教科书中专家学者提出“盗窃行为不限于秘密窃取”的理论观点，属于根据理论目的和法益实质进行的论理解释，且在效力上属于无权解释（学理解释）。\u0002\nA✗ 近年来“盗窃包括平和公开窃取”主张旨在探究财产侵夺实质与规范目的，且在学者看来并未把盗窃推及到无关抢劫等异质行为，不属于典型越界类推解释（且题干考分类：这是教科书作者作出的论理解释+无权解释）\nB✓ 论理解释：突破字面传统“秘密”狭隘理解，根据法理精神与盗窃罪构造推演得出新定义，属于解释方法上的\u0001论理解释\u0002\nC✓ 无权解释：该论断出自某\u0001刑法教科书\u0002（学者理论阐述而非全国人大常委会或两高文件），没有正式法律拘束力，属\u0001无权解释（学理解释）\u0002\nD✗ 依纯粹字面文理解释，“窃取”一词的日常文义天然带有悄悄秘密取得之意，不限于秘密的说法明显超出了纯词义文理解释范畴","k":"","kb":83,"kh":[[105,125],[132,141]]},{"id":"2022-2","y":2022,"t":"单","s":"下列选项中,属于类推解释的是","o":["将\"盗窃燃气\"的行为解释为\"盗窃财物\"","将\"侮辱无名英烈名誉\"的行为解释为\"侵害英雄烈士名誉\"","将\"使用电子干扰手段劫持小型无人机\"的行为解释为\"劫持航空器\"","将\"以个人名义将公款供其他单位使用\"解释为挪用公款\"归个人使用\""],"a":"C","e":"\u0001小型消费级无人机既非载人大型交通运输航空器也不直接涉及航空客货民航安全，强行将其纳入《刑法》第121条“劫持航空器罪”（绝对死刑/10年以上重罪）已超出“航空器”日常及专业可能文义边界，属于类推解释。\u0002\nA✗ 管道燃气虽然不是固体有形物体，但属于具有财产经济价值的可控制、可计量财物，解释为“盗窃财物”属于\u0001扩大解释\u0002\nB✗ 英雄烈士包含在历史战役中牺牲的“无名英烈”（亦属中华人民共和国英雄烈士保护法保护对象），未越出“英雄烈士”文义，属\u0001扩大解释\u0002（或文理解释）\nC✓ 类推解释（正选）：第121条劫持航空器罪重罚针对的是危害大型民航客机等公共交通安全的行为，而“小型无人机”仅仅是遥控飞行玩具/航拍器材，用相似能飞将其比附为“劫持航空器”明显超出文义范围，属于被禁止的\u0001类推解释\u0002\nD✗ 个人名义擅自将公款出借给其他单位使用以谋取个人人情私利，本就属于司法解释和立法解释早已认可的“归个人使用”之\u0001扩大解释\u0002","k":"","kb":83,"kh":[[282,289]]},{"id":"2022-11","y":2022,"t":"单","s":"A国人甲拐卖B国妇女到我国境内被查获。对此,下列说法中正确的是","o":["我国没有刑事管辖权,应当交由A国处理","我国没有刑事管辖权,应当交由B国处理","我国有刑事管辖权,应依照我国刑法规定处理","我国有刑事管辖权,应依照相关国际惯例处理"],"a":"C","e":"\u0001A国人甲拐卖B国妇女到达我国境内后被我方查获，因犯罪行为（接送/中转/控制）或结果发生在我国领域内，我国依法享有属地管辖权且必须依照我国刑法处理。\u0002\nA✗ 犯罪就发生并查获于中国领域内，我国享有完整主权属地管辖权，无需也绝不拱手交由外国处置\nB✗ 理由同上，虽被害人为B国妇女，但犯罪已进入中国境内，我国直接依属地原则行使主权司法管辖\nC✓ 我国有刑事管辖权，应依照我国刑法规定处理：根据《刑法》第6条属地原则，凡在我国境内犯罪（拐卖妇女罪的实行或继续状态跨越进入我国境内被查获），一律依法适用我国刑法处理\nD✗ 刑事定罪量刑适用的是我国现行有效《刑法》，并非泛泛依照所谓国际惯例","k":"","kb":80,"kh":[[15,48]]},{"id":"2023-1","y":2023,"t":"单","s":"刑法的体系是指刑法的组成和结构。关于我国刑法的体系,下列表述正确的是","o":["我国刑法规范只有条、款,而无项的规定","我国刑法条文采用统一编号以实现系统化的目的","我国刑法条文均规定了罪名、罪状和法定刑","我国刑法分为总则、分则和附则三部分,各为一编"],"a":"B","e":"\u0001我国《刑法》全法典采用统一连续数字编号（第1条至第452条，含修正案增补条文“之一、之二”），实现体系的系统化；我国刑法由总则、分则两编及一条附则组成。\u0002\nA✗ 我国《刑法》规范体系完整包含编、章、节、条、款、项（如第87条、第236条等均明确带有“（一）（二）”等项级单位），并非无项\nB✓ 我国刑法条文采用统一编号以实现系统化的目的：无论总则、分则还是附则，全部条文从第1条至第452条统一顺号连续编排，修正案新设条文亦附编在对应条号后（如第133条之一）\nC✗ 刑法总则第1条至第101条全都不规定具体分则罪名、罪状和法定刑，且分则内部部分纯解释定义条款也无单独法定刑\nD✗ 我国《刑法》只有\u0001第一编 总则\u0002和\u0001第二编 分则\u0002共两编；最后的附则仅有一条（第452条），并不是独立的一编","k":"","kb":83,"kh":[[316,352]]},{"id":"2023-41","y":2023,"t":"多","s":"最高人民法院研究室在某答复中指出:“伪造、变造、买卖民用机动车号牌行为不能以伪造、变造、买卖国家机关证件罪定罪处罚.·从当前我国刑法的规定看,不能将机动车号牌认定为国家机关证件。”该答复体现了罪刑法定原则的","o":["法定化","明确化","平等化","合理化"],"a":"ABD","e":"\u0001拒绝将“民用机动车号牌”类推解释进刑法保护的“国家机关证件”，守住了成文罪刑底线、维护条文概念边界及正当合理处罚范围，体现了罪刑法定原则的法定化、明确化和合理化三大内容。\u0002\nA✓ 法定化：犯罪行为必须由刑法条文事先明文规定（法无明文“机动车号牌算证件”不得入罪）\nB✓ 明确化：国家机关证件与普通交通号牌各有清楚确定界限，不允许含糊扩延\nC✗ “平等化”不属于罪刑法定原则三大要素内容（平等适用刑法是刑法另外一项独立基本原则）\nD✓ 合理化：通过禁止不合理类推将较轻交通管理号牌违法行为纳入重罪打击，保障罪刑设置与国民预期合理相称\n记法：罪刑法定三化：“法（法定化）明（明确化）理（合理化）”，不含“平等化”。","k":"","kb":79,"kh":[[61,77]]},{"id":"2024-1","y":2024,"t":"单","s":"2023年最高人民检察院工作报告列举了下列数据变化,其中彰显刑法保障机能的是","o":["起诉破坏市场经济秩序犯罪人数比前五年上升32.3%","2022年受理审查起诉杀人、放火等犯罪为近二十年来最低","认定正当防卫不捕不诉人数是前五年的5.8倍","起诉利用网络实施诈骗、赌博等犯罪人数年均上升43.3%"],"a":"C","e":"\u0001正当防卫认定不捕不诉数量大幅增长，精准守护无罪公民不因合法制止不法侵害而遭国家刑罚错案追究，是刑法“保障机能”（人权保障）最典型的体现。\u0002\nA✗ 严厉起诉破坏市场经济秩序犯罪体现了惩治经济犯罪、保护社会主义市场经济秩序的\u0001保护机能\u0002\nB✗ 重罪发案率走低体现了预防震慑违法犯罪的\u0001规制机能与保护机能\u0002\nC✓ 认定正当防卫不捕不诉人数是前五年的5.8倍：切实贯彻“法不能向不法让步”，严格防止防卫公民陷入不当刑事追诉，最大化发挥了刑法限制刑罚权滥用、保卫公民合法自由的\u0001保障机能\u0002\nD✗ 加大打击网络诈骗赌博犯罪体现了惩治新型犯罪维护网络公众法益的\u0001保护机能\u0002","k":"","kb":79,"kh":[[286,318]]},{"id":"2025-2","y":2025,"t":"单","s":"下列关于属地管辖的理解,正确的是（ ）。","o":["我国承认使领馆是派遣国领土的延伸部分","我国刑法对犯罪地的确定采取行为地说","私人所有的船舶不属于我国的拟制领土","网络犯罪的刑事管辖权应采用属地原则确定"],"a":"C","e":"\u0001我国刑法中的拟制领土（船舶与航空器）依据现代国际法与权威刑法学通说是指公用性质或我国登记注册航行中船舶航空器，纯粹私人所有（或未经登记之私船/私有域外船舶且传统观点侧重国有公用或特定登记）——按2025年官方真题标准明确选“私人所有的船舶不属于我国的拟制领土”（或强调传统权威书籍界定拟制领土限于公用船舶等；注意同时分析其他三项绝对错因）。\u0002\nA✗ 依据现代国际法与我国司法立场，驻外\u0001使领馆只是享有外交特权与豁免的办公馆舍\u0002，并非派遣国的“领土延伸”（仅其馆舍不可侵犯）\nB✗ 我国《刑法》第6条第3款对犯罪地的确定明确采取的是\u0001行为与结果择一说（混合说）\u0002，只要行为或结果有一项在我国即管辖，并非单一“行为地说”\nC✓ 私人所有的船舶不属于我国的拟制领土：2025年真题严格对应高教版/权威教材表述（依据权威教材对“拟制领土”理论之阐释，国家公有、国营或挂旗受国家主权严格延展代表国家领土的多指具有公用性质的国家船舶，纯粹私人所有小型船只并非当然主权领土本身；同时其余三项均存在绝对法理硬伤）\nD✗ 网络犯罪跨国界特征显著，若我国公民在境外针对国外犯罪或涉普遍保护，管辖权需按具体案情依\u0001属地、属人、保护或普遍管辖四原则综合确定\u0002，绝非“一刀切仅采用属地原则”\n重要辨析提示：在2025年真题中，使领馆不是领土延伸、犯罪地采行为结果并重说而非单一行为地说、网络犯罪管辖不限于属地原则，均属绝对错误，唯“私人所有的船舶不属于我国的拟制领土”精准贴合权威命题出处对拟制领土限定的考查口径。","k":"","kb":80,"kh":[[76,123]]},{"id":"2025-12","y":2025,"t":"单","s":"某人民法院在判决书中认为,作为虐待罪犯罪对象的“家庭成员”包括与行为人具有共同生活事实,处于较为稳定的同居状态,形成事实上的家庭关系的人。该解释属于（ ）。","o":["当然解释","文理解释","司法解释","扩大解释"],"a":"D","e":"\u0001法院在个案判决书中将稳定同居共同生活的人解释纳入虐待罪“家庭成员”范围，属于在词语边缘做扩充解释（扩大解释）；个案法院判决书不是“司法解释”（仅两高有权）。\u0002\nA✗ 当然解释是“举重以明轻/举轻以明重”的逻辑推理；将同居人扩入“家庭成员”是从字面范围扩大外延\nB✗ 严格按纯文理解释，“家庭成员”日常多指婚姻登记夫妻及父母子女亲属\nC✗ 我国享有正式“司法解释权”的机关仅限\u0001最高人民法院和最高人民检察院\u0002；地方中基层或高级法院在个案判决书中的说理阐释不是规范性司法解释，属于判决适用解释\nD✓ 扩大解释：因“家庭成员”立法旨在保护共同家庭生活弱势方，故判决书顺应生活事实将具备长期稳定共同生活事实的同居人扩充纳入“家庭成员”文义外延之内，属于\u0001扩大解释\u0002","k":"","kb":83,"kh":[[74,105],[209,224]]},{"id":"2026-12","y":2026,"t":"单","s":"下列选项中，不符合罪刑法定原则的是（ ）。","o":["将伪造比特币的行为解释为“伪造货币”","将携带枪支抢夺的行为解释为“持枪抢劫”","将进入牧民帐篷盗窃的行为解释为“入户盗窃”","将为了增重对毒品掺杂掺假的行为解释为“制造毒品”"],"a":"A","e":"\u0001罪刑法定原则严禁不利于被告人的类推解释。“伪造比特币”属于数字虚拟资产算法挖掘或篡改数据，“比特币”并非国家法定货币，“伪造比特币 = 伪造货币”属于被禁止的类推解释。\u0002\nA✓ 不符合罪刑法定原则（正选）：比特币在我国定性为特定虚拟商品而不具有法定货币地位与法偿性，“货币”一词在任何正常文字射程内都不包含去中心化网络代币；强行将伪造比特币按《刑法》第170条“伪造货币罪”论处属于违背罪刑法定的\u0001类推解释\u0002\nB✗ 携带枪支抢夺在《刑法》第267条第2款转化为抢劫罪基础上，将其归入第263条“持枪抢劫”（或在法定拟制下解释为持枪抢劫）属于学理与实务认可的\u0001扩大解释\u0002，不违反罪刑法定\nC✗ “牧民帐篷”虽不同于钢筋水泥房屋，但长期供游牧家庭日常起居生活、与外界相对隔离，将其解释为“户”（入户盗窃）属于典型\u0001扩大解释\u0002，符合罪刑法定\nD✗ 依据全国法院毒品审判会议纪要，以增重、提高纯度或改变性状、效用为目的对毒品掺杂掺假使毒品数量或物理形态发生加工变化，将其解释入“制造毒品”属于实务认可的\u0001扩大解释\u0002","k":"","kb":83,"kh":[[225,245],[290,300]]}]},{"sub":"民法","name":"民事主体","w":2.5,"L":45,"qs":[{"id":"2005-47","y":2005,"t":"单","s":"合伙经营期间发生亏损，退伙人已分担合伙债务的，对其参加合伙期间的全部债务（ ）。","o":["负连带责任","负部分责任","负补充责任","不负责任"],"a":"A","e":"\u0001退伙人对基于退伙前原因发生的合伙债务仍对外承担无限连带责任，不因内部已分担债务而免除。\u0002\nA✓ 退伙人即使已按内部分担合伙债务，对参加合伙期间全部债务仍负连带责任。\nB✗ 外部债务连带清偿，并非仅负部分责任。\nC✗ 普通合伙人对外不享有先诉抗辩权或补充责任优待。\nD✗ 退伙后对退伙前债务不得免责。","k":"","kb":112,"kh":[[93,103],[128,152]]},{"id":"2006-36","y":2006,"t":"单","s":"关于社团法人的下列表述，正确的是（ ）。","o":["社团法人是社会团体法人的简称","社团法人以人的集合为成立基础","社团法人均以社会公益为目的","社团法人的设立行为属于单方民事法律行为"],"a":"B","e":"\u0001学理上的社团法人是以人的集合为成立基础的法人，区别于以财产集合为基础的财团法人。\u0002\nA✗ 学理社团法人（含公司等营利社团）与我国旧法社会团体法人概念不同。\nB✓ 社团法人以人的集合（社员结合）为成立基础，符合学理定义。\nC✗ 社团法人包括营利性社团法人（如公司）和公益性社团法人，并非均以公益为目的。\nD✗ 社团法人设立需多数设立人共同意思表示，属共同（多方）法律行为；财团法人捐助设立属单方行为。","k":"","kb":111,"kh":[[49,64],[76,87]]},{"id":"2007-34","y":2007,"t":"单","s":"公民甲户籍地在新疆,去南京培训 1 年后,到深圳工作 3 年。后因病到广州治疗,目前已在广州一家医院住院 16 个月。依我国民法规定,某甲的住所地在 （ ）。","o":["南京","新疆","广州","深圳"],"a":"D","e":"\u0001自然人连续居住1年以上的经常居住地视为住所，但住院治病的地方除外。\u0002\nA✗ 南京培训仅1年且非最后连续居住1年以上之地。\nB✗ 新疆虽为户籍地，但后来已有连续居住满1年的经常居住地，应优先以经常居住地为住所。\nC✗ 在广州住院已达16个月，但因病住院治病不构成经常居住地。\nD✓ 某甲曾在深圳连续工作居住3年且其后仅为治病住院，故最后经常居住地深圳为其住所。","k":"","kb":108,"kh":[[398,446]]},{"id":"2007-35","y":2007,"t":"单","s":"甲、乙、丙三人合伙开饭店,甲以门面房折价 10 万元出资,担任店长;乙出现金 5 万元,负责经营管理;丙以技术出资,作价 3 万元。三人约定盈余均分,亏损由乙承担。该饭店经营两年后,欠丁 6 万元。对此债务 （ ）。","o":["甲、乙、丙各承担 2 万元","按约定由乙全部承担","甲、乙、丙承担连带责任","由店长甲全部承担"],"a":"C","e":"\u0001合伙人对合伙债务对外负无限连带责任，合伙协议关于亏损由某一人承担的内部约定不能对抗债权人。\u0002\nA✗ 对外债权人可要求任一合伙人清偿全部6万元，并非对外按份分担2万元。\nB✗ 亏损由乙承担仅在合伙人内部结算有效，不能限制债权人丁向甲、丙求偿。\nC✓ 甲、乙、丙作为合伙人对6万元债务对外承担无限连带责任。\nD✗ 店长甲对外同样负连带责任，非由其一人单独对外承担。","k":"","kb":112,"kh":[[54,92]]},{"id":"2007-36","y":2007,"t":"单","s":"下列有关法人民事行为能力的判断,正确的是 （ ）。","o":["法人民事行为能力范围与其民事权利能力范围不同","法人一旦被申请宣告破产,民事行为能力即终止","不同类型的法人,民事行为能力范围不同","法人民事行为能力起止时间与其民事权利能力起止时间不同"],"a":"C","e":"\u0001法人民事行为能力与权利能力起止相同、范围一致，但不同性质法人的宗旨与业务范围不同，行为能力范围也不同。\u0002\nA✗ 法人民事行为能力范围与其民事权利能力范围相一致。\nB✗ 被申请宣告破产时法人仍存续，须待依法清算结束并办理注销登记时才终止。\nC✓ 不同类型法人的业务宗旨决定其权利能力与行为能力范围互有差异。\nD✗ 法人的民事行为能力与民事权利能力均自法人成立时发生、至法人终止时消灭，起止时间一致。","k":"","kb":111,"kh":[[342,416]]},{"id":"2008-33","y":2008,"t":"单","s":"甲、乙、丙三人合伙经营一电器商场,效益不佳,已欠债 2 万元。三人经协商一致邀请有经营能力的丁加入到合伙之中, 丁在被告知合伙经营状况后出资加入其中,并以合伙人的身份参与经营。两年后,该电器商场因故停业。对丁入伙前电器商场对外所欠的 2 万元债务,依法应当（ ）。","o":["由甲、乙、丙、丁四人承担按份责任","由甲、乙、丙、丁四人承担连带责任","由甲、乙、丙三人承担按份责任","由甲、乙、丙三人承担连带责任"],"a":"B","e":"\u0001新合伙人入伙普通合伙企业的，对入伙前合伙企业的债务依法承担无限连带责任。\u0002\nA✗ 普通合伙人对外为连带责任而非按份责任。\nB✓ 丁入伙后需对入伙前已欠的2万元债务与甲、乙、丙共同承担无限连带责任。\nC✗ 新合伙人丁对入伙前债务同样连带，且普通合伙不是按份责任。\nD✗ 丁作为新普通合伙人不能免除对入伙前企业债务的连带责任。","k":"","kb":112,"kh":[[153,176]]},{"id":"2008-34","y":2008,"t":"单","s":"根据民法通则规定,高等院校属于（ ）。","o":["机关法人","企业法人","事业单位法人","社会团体法人"],"a":"C","e":"\u0001从事教育、科研、文化等社会公益服务的高等院校属于事业单位法人。\u0002\nA✗ 机关法人指行使国家公共管理职能的各级国家机关。\nB✗ 企业法人是以营利为目的从事商品生产经营的组织。\nC✓ 公立高等院校是为社会公益目的举办的教育服务机构，属于事业单位法人（现行《民法典》下归入非营利法人）。\nD✗ 社会团体法人是由成员自愿组成的非营利性协会、学会等组织。","k":"","kb":111,"kh":[[142,153]]},{"id":"2008-51","y":2008,"t":"多","s":"影响自然人民事行为能力的因素包括（ ）。","o":["财产","智力","年龄","性别"],"a":"BC","e":"\u0001自然人民事行为能力的有无与大小由年龄和智力（精神健康状况）共同决定。\u0002\nA✗ 个人财产多少不影响其识别与判断能力，不决定民事行为能力等级。\nB✓ 智力及精神健康状况直接决定自然人能否独立辨认自己行为的后果。\nC✓ 年龄阶段是划分完全、限制、无民事行为能力人的法定标准。\nD✗ 民事主体地位平等，性别不影响民事行为能力。","k":"","kb":108,"kh":[[154,186]]},{"id":"2009-32","y":2009,"t":"单","s":"根据民法通则规定,监护人可以处分被监护人财产的条件是（ ）。","o":["征得被监护人同意","为了被监护人的利益","征得其他监护人同意","征得被监护人所在地的居(村)委会同意"],"a":"B","e":"\u0001监护人履行监护职责应坚持最有利于被监护人原则，除为了被监护人的利益外不得处分其财产。\u0002\nA✗ 被监护人系无或限制民事行为能力人，其自身同意不是处分财产的充分合法条件。\nB✓ 为了维护被监护人的利益是监护人依法处分被监护人财产的核心法定条件。\nC✗ 其他监护人同意亦不能正当化损害被监护人利益的处分行为。\nD✗ 日常依法为被监护人利益处分财产无需征得居委会或村委会同意。","k":"","kb":109,"kh":[[367,390]]},{"id":"2009-33","y":2009,"t":"单","s":"甲、乙、丙三人平均出资,自愿合伙成立了一个采石组,约定三人共同劳动、按劳取酬,并推举甲为采石组负责人 , 主要负责劳动安全。在一次爆破作业中,乙违章操作致左眼受伤,花去治疗费 5 千余元。此损害应当（ ）。","o":["由甲、丙共同承担","由甲、乙、丙共同承担","由甲全部承担","由乙自行承担"],"a":"B","e":"\u0001个人合伙成员在共同劳动中因执业事故受伤，虽自身存在违章过失，仍应先由合伙财产或全体合伙人共同分担补偿。\u0002\nA✗ 乙作为合伙成员在执行合伙劳动中受损，并非完全排除乙自身按合伙份额/过错承担部分。\nB✓ 采石组属个人合伙共同体，成员执行合伙业务受伤先由合伙共同体即甲、乙、丙共同承担（内部可酌情考量乙的违章过错分担）。\nC✗ 甲仅是推举的安全负责人而非雇主，不需由甲个人独力赔付全部损害。\nD✗ 乙在为全体合伙人利益采石作业中受损，不应全部由受伤合伙人自认倒霉。","k":"","kb":112,"kh":[[189,242]]},{"id":"2010-31","y":2010,"t":"单","s":"下列选项中,具有民事权利能力的是（ ）。","o":["7个月的胎儿","满月的婴儿","会画画的猩猩","被诽谤的死者"],"a":"B","e":"\u0001自然人的民事权利能力始于出生终于死亡，满月的婴儿已出生并存活，当然具备民事权利能力。\u0002\nA✗ 胎儿一般不具有独立民事权利能力，仅在涉及遗产继承、接受赠与等胎儿利益保护时视为具有（注意娩出为死体则自始不存在）。\nB✓ 满月的婴儿已出生存活，依法具有完整的民事权利能力。\nC✗ 动物属于物权客体而非民事主体，不具有民事权利能力。\nD✗ 死者民事权利能力已随死亡消灭；法律保护死者人格利益系对逝者尊严与近亲属利益的延伸保护，而非赋予死者权利能力。","k":"","kb":108,"kh":[[50,72],[109,121],[136,149]]},{"id":"2010-32","y":2010,"t":"单","s":"公民因飞机失事失踪的,利害关系人申请宣告其死亡的时间要件是（ ）。","o":["飞机失事发生之日起满2年","政府公布失踪人员名单之日起满2年","飞机失事发生之日起满4年","政府公布失踪人员名单之日起满4年"],"a":"A","e":"\u0001因飞机失事等意外事件下落不明申请宣告死亡的，法定期间自意外事件发生之日起满2年（无不可能生存证明时）。\u0002\nA✓ 飞机失事属意外事件，题干未交待有关机关出具不可能生存证明，故自飞机失事发生之日起满2年可申请宣告死亡。\nB✗ 起算点为意外事件发生之日，而非政府公布失踪名单之日。\nC✗ 满4年适用于普通下落不明情形，意外事件缩短为满2年。\nD✗ 起算点与期限均不符法律规定。","k":"","kb":110,"kh":[[249,273]]},{"id":"2012-22","y":2012,"t":"单","s":"某童星15周岁，其演出收入能够满足自己的生活需要。该童星未经监护人同意独立实施的下列行为中，有效的是（ ）。","o":["向户籍管理部门申请变更姓名","向工商管理部门申请注册公司","购买价格为2万元的摄像机","接受10万元现金的赠与"],"a":"D","e":"\u000115周岁未成年人属限制民事行为能力人，未经监护人同意独立实施纯获利益的行为（接受10万元赠与）有效。\u0002\nA✗ 申请变更姓名属重大身份及行政登记事项，超出15周岁未成年人独立能力。\nB✗ 设立登记公司涉及重大财产权责与商事行为，非限制民事行为能力人可独立决定。\nC✗ 购买价格2万元的高价摄像机明显超出未成年人年龄智力及日常消费相适应范围，未经追认不发生效力。\nD✓ 纯接受10万元现金赠与不附义务，属于纯获利益的民事法律行为，无需监护人同意即有效。\n题干中某童星“未满16周岁”，故即使演出收入能满足生活需要，也不能视为完全民事行为能力人。","k":"","kb":108,"kh":[[215,224],[250,280]]},{"id":"2012-23","y":2012,"t":"单","s":"监护人有权处理被监护人财产的法定情形是（ ）。","o":["发生紧急情况","为被监护人的利益","经被监护人同意","经被监护人所在地的基层组织同意"],"a":"B","e":"\u0001监护人除为了被监护人的利益外，不得处分被监护人的财产。\u0002\nA✗ 紧急情况若非为了被监护人利益，亦不得随意处分其财产。\nB✓ 为了被监护人的利益是监护人有权处理被监护人财产的法定要件。\nC✗ 被监护人缺乏完全判断能力，仅经其本人同意不能使有害处分合法化。\nD✗ 日常为被监护人利益依法处分财产不以居村委等基层组织批准为前提。","k":"","kb":109,"kh":[[367,390]]},{"id":"2012-24","y":2012,"t":"单","s":"2008年5月,甲、乙、丙合开了一间酒吧,甲以现金10万元出资,乙以其所有的房屋出资,丙以担任调酒师工作的劳务出资。2008年12月,酒吧欠某酒厂5万元货款。后甲因与其他合伙人发生矛盾,于 2009年2月退伙。上述债务应当（ ）。","o":["由乙独立承担责任","由乙和丙承担连带责任","由甲和乙承担连带责任","由甲、乙和丙承担连带责任"],"a":"D","e":"\u0001合伙人退伙后，对基于其退伙前原因发生的合伙企业债务依然承担无限连带责任。\u0002\nA✗ 乙作为现存合伙人担责，但不能免除已退伙的甲和另一合伙人丙的连带责任。\nB✗ 该5万元酒款发生于2008年12月，在甲2009年2月退伙之前，甲不得免责。\nC✗ 丙以劳务出资同样是普通合伙人，对外应连带担责。\nD✓ 债务形成于甲退伙前，甲、乙、丙三人对此共同承担无限连带责任。","k":"","kb":112,"kh":[[128,152]]},{"id":"2013-23","y":2013,"t":"单","s":"不满10周岁的小学生所为的下列行为中,无效的是（ ）。","o":["在自动售货机上买零食","接受学校对三好生的物质奖励","将自己的200元压岁钱送给同学","写了一篇文章并发表在校报上"],"a":"C","e":"\u0001将200元压岁钱无偿赠送同学，既非纯获利益也与小学生年龄智力不相适应，未经法定代理人同意或追认无效。\u0002\nA✗ 在自动售货机购买小零食属日常生活微额交易，与小学生年龄智力相适应，有效。\nB✗ 接受学校三好生物质奖励系纯获利益行为，独立实施即有效。\nC✓ 将200元压岁钱赠与他人属单纯减少财产的无偿处分行为，超限且未获追认时不生法律效力。\nD✗ 写作投稿发表属事实行为，不以具备相应民事行为能力为要件。\n【新法提示】本题2013年命制时依旧《民法通则》以10周岁为无、限制民事行为能力分界；现行《民法典》第19、20条已将分界线下调至8周岁。若该生已满8周岁且未满10周岁属限制民事行为能力人，赠与200元未经追认归于无效；若不满8周岁则为无民事行为能力人，除微额生活琐碎事务外一般处分行为无效。","k":"","kb":108,"kh":[[187,192],[250,280]]},{"id":"2013-25","y":2013,"t":"单","s":"甲、乙、丙三人共同出资设立一合伙企业,甲被推举为合伙事务执行人。根据我国合伙企业法规定,甲在任职期间有权单独实施的行为是（ ）。","o":["与A公司签订货物买卖合同","转让合伙企业拥有的一间商铺","以合伙企业名义为B公司提供担保","聘任丁担任合伙企业的经营管理人员"],"a":"A","e":"\u0001合伙事务执行人有权单独决定日常货物买卖业务；处分不动产、对外担保及聘任外人任管理人则需全体一致同意。\u0002\nA✓ 与客户签订货物买卖合同属于合伙企业日常经营事务，事务执行人甲有权单独实施。\nB✗ 处分合伙企业的不动产（商铺）除协议另有约定外须经全体合伙人一致同意。\nC✗ 以合伙企业名义为他人提供担保须经全体合伙人一致同意。\nD✗ 聘任合伙人以外的人担任企业经营管理人员须经全体合伙人一致同意。","k":"","kb":112,"kh":[[326,335],[353,418]]},{"id":"2014-22","y":2014,"t":"单","s":"16周岁的中学生史某在一次抽奖活动中获得10万元大奖。史某用该笔款项不仅交纳了自己的学费,还帮助父亲偿还了5万元欠款。史某（ ）。","o":["是完全民事行为能力人","是限制民事行为能力人","视为限制民事行为能力人","视为完全民事行为能力人"],"a":"B","e":"\u000116周岁以上未成年人视为完全民事行为能力人，须以自己的“劳动收入”为主要生活来源，中奖等偶然收益不在此列。\u0002\nA✗ 未满18周岁不属当然的完全民事行为能力人。\nB✓ 史某16周岁且正在中学就读，10万元系偶然中奖而非稳定劳动收入，依法仍为限制民事行为能力人。\nC✗ 8周岁以上未成年人本即为限制民事行为能力人，无需“视为”。\nD✗ 因缺乏持续独立的劳动收入作为主要生活来源，不满足视为完全民事行为能力人的法定条件。","k":"","kb":108,"kh":[[315,367]]},{"id":"2014-24","y":2014,"t":"单","s":"法人必须依据特别立法或国家元首的许可才得以设立的原则称为（ ）。","o":["准则主义","特许主义","行政许可主义","自由设立主义"],"a":"B","e":"\u0001依据专门立法或国家元首特别许可方得以设立法人的立法模式称为特许主义。\u0002\nA✗ 准则主义指法律预先规定条件，具备条件向登记机关登记即设立法人，无需特别审批。\nB✓ 特许主义要求法人的成立必须经过特别立法或者国家元首的特别许可。\nC✗ 行政许可主义指经行政主管机关审查批准后才能登记成立，而非专指特别立法或国家元首许可。\nD✗ 自由设立主义指设立无需国家审批或专门登记，听凭当事人自由设立。","k":"","kb":111,"kh":[[280,301]]},{"id":"2014-46","y":2014,"t":"多","s":"根据《合伙企业法》的规定,有限合伙人（ ）。","o":["不执行合伙事务","有权对外代表合伙企业","可以用实物和知识产权出资","对合伙企业的债务承担有限责任"],"a":"ACD","e":"\u0001有限合伙人不执行合伙事务、不对外代表企业、可以用实物或知识产权等非劳务出资，以其认缴出资额为限承担有限责任。\u0002\nA✓ 有限合伙企业由普通合伙人执行合伙事务，有限合伙人不执行合伙事务。\nB✗ 有限合伙人不得对外代表合伙企业。\nC✓ 有限合伙人可以用货币、实物、知识产权、土地使用权等财产权利出资（仅禁止以劳务出资）。\nD✓ 有限合伙人以其认缴的出资额为限对合伙企业债务承担有限责任。","k":"","kb":112,"kh":[[521,587]]},{"id":"2015-22","y":2015,"t":"单","s":"下列选项中,具备法人资格的是（ ）。","o":["合伙企业","个体工商户","个人独资企业","一人有限责任公司"],"a":"D","e":"\u0001一人有限责任公司经登记成立，拥有独立财产并独立对外担责，具有完整企业法人资格。\u0002\nA✗ 合伙企业属于非法人组织，不具有法人资格，普通合伙人承担无限连带责任。\nB✗ 个体工商户属自然人从事工商业经营的特殊形式，不具备法人资格。\nC✗ 个人独资企业属于非法人组织，投资人以其个人财产对企业债务承担无限责任。\nD✓ 一人有限责任公司适用《公司法》，属于营利法人，具备独立法人资格。","k":"","kb":111,"kh":[[115,134],[747,773]]},{"id":"2015-24","y":2015,"t":"单","s":"甲系精神病人,有亲属如下:母亲,75周岁, 瘫痪在床;弟弟,48周岁,工人;儿子,20周岁,在校大学生;女儿,17周岁,无业。甲的监护人应为（ ）。","o":["甲母","甲弟","甲子","甲女"],"a":"C","e":"\u0001成年人法定监护依次由配偶、父母子女、其他近亲属及同意协助者中有监护能力的人担任。\u0002\nA✗ 甲母虽在第二顺位，但75周岁且瘫痪在床，客观上不具备监护能力。\nB✗ 甲弟属第三顺位近亲属，仅在配偶、父母子女均无或均无能力时才轮到其担任。\nC✓ 甲子20周岁已成年有监护能力，与父母同属第二顺位，优先于第三顺位的甲弟，应担任甲的监护人。\nD✗ 甲女仅17周岁且无业，尚未完全成年（非完全民事行为能力人），一般不具法定监护能力。","k":"","kb":109,"kh":[[114,131],[169,181]]},{"id":"2015-46","y":2015,"t":"多","s":"甲离家出走,下落不明已满5年。下列人员中,可向人民法院申请甲为失踪人的有（ ）。","o":["甲的妻子","甲的姐姐","甲的债权人","甲的外祖父"],"a":"ABCD","e":"\u0001宣告失踪的利害关系人范围广泛，包括配偶、兄弟姐妹、外祖父母及债权人等与被申请人有民事权利义务关系之人。\u0002\nA✓ 配偶是最核心近亲属之一，有权申请宣告失踪。\nB✓ 兄弟姐妹等近亲属均有权作为利害关系人提出申请。\nC✓ 债权人为确定债务清算与财产代管主体，亦属于法定利害关系人。\nD✓ 外祖父母属于近亲属范畴，具备申请资格。","k":"","kb":110,"kh":[[67,135]]},{"id":"2016-23","y":2016,"t":"单","s":"甲为精神病人乙的监护人。甲的下列行为中,属于依法履行监护职责的是（ ）。","o":["免除丙欠乙的1万元债务","撤销乙患病前低价卖表给丁的合同","用乙的存款为乙支付医疗费","为防止乙出门用铁链将其锁在家里"],"a":"C","e":"\u0001监护人用被监护人的存款支付其医疗费，符合“为了被监护人利益”及最有利于被监护人原则。\u0002\nA✗ 擅自免除他人对乙所欠1万元债务会纯损乙的财产权益，违背监护人忠实职责。\nB✗ 乙患病前具有完全民事行为能力时低价卖表若无欺诈胁迫等法定撤回/撤销事由，监护人无权任意撤销有效旧约。\nC✓ 用乙自身存款为乙治病付费，完全符合维护被监护人身心健康及财产合法用途的原则。\nD✗ 用铁链锁人构成非法限制人身自由，严重侵害被监护人人身权利。","k":"","kb":109,"kh":[[342,390]]},{"id":"2016-28","y":2016,"t":"单","s":"甲、乙、丙三人共同设立一会计师事务所,该事务所为特殊的普通合伙企业。甲、乙在办理一笔业务时,因重大过失造成客户损失10万元。该损失应由（ ）。","o":["甲、乙、丙承担按份责任","甲、乙、丙承担无限连带责任","甲、乙承担按份责任,丙承担补充责任","甲、乙承担无限连带责任,丙承担有限责任"],"a":"D","e":"\u0001特殊普通合伙企业中，因故意或重大过失致债的合伙人负无限连带责任，无过失的其他合伙人仅以财产份额为限担责。\u0002\nA✗ 致害合伙人与无过失合伙人的责任性质不同，并非全体均分按份责任。\nB✗ 丙对该执业过失无故意或重大过失，享受有限责任保护，不负无限连带责任。\nC✗ 甲、乙作为过错执业人共同对外负无限连带责任而非按份；丙只限额担责。\nD✓ 因重大过失造成客户损失的甲、乙负无限连带责任，无过失的丙仅以其在合伙企业中的财产份额为限担责。","k":"","kb":112,"kh":[[437,517]]},{"id":"2016-35","y":2016,"t":"单","s":"甲公司章程规定:公司的法定代表人为张某; 公司签订金额100万元以上的合同须经董事会决议。后张某擅自以甲公司名义与不知情的乙公司签订了一份金额为150万元的合同。张某的代表行为（ ）。","o":["有效","可撤销","无效","效力待定"],"a":"A","e":"\u0001法人章程对法定代表人代表权限的内部限制，不得对抗不知情的善意相对人，代表行为有效。\u0002\nA✓ 乙公司对甲公司章程100万元的内部限额不知情（善意），故张某超越限额签署的150万元合同代表行为对甲公司直接有效。\nB✗ 内部越权不构成可撤销事由，应保护善意第三人交易安全。\nC✗ 内部限制不能用来对抗善意相对人主张合同无效。\nD✗ 法定代表人代表行为与无权代理不同，在对方善意时直接有效而非效力待定。","k":"","kb":111,"kh":[[537,565]]},{"id":"2017-46","y":2017,"t":"多","s":"甲被依法宣告失踪,乙为甲的财产代管人。下列选项中,由乙从甲的财产中支付的有（ ）。","o":["甲所欠税款","甲所欠债务","甲应支付的赡养费","乙代管财产的管理费"],"a":"ABCD","e":"\u0001财产代管人应从失踪人财产中支付其所欠税款、债务、应付赡养费及必要管理费等费用。\u0002\nA✓ 失踪人生前或失踪期间所欠国家税款应由财产代管人依法清缴。\nB✓ 失踪人所欠合法债务由代管人从其财产中清偿。\nC✓ 法定赡养费、扶养费、抚育费属于“应付的其他费用”，应按时支取支付。\nD✓ 为保管失踪人财产所支出的必要管理费用可从代管财产中开支。","k":"","kb":110,"kh":[[153,218]]},{"id":"2017-47","y":2017,"t":"多","s":"某服装公司员工实施的下列行为中,该公司不予认可但仍应承担民事法律后果的有（ ）。","o":["超越代表权限与不知情的L公司订立买卖合同","超越公司经营范围与不知情的M公司订立买卖合同","伪造公司印章与不知情的P公司订立买卖合同","以自己的名义将公司的电脑转让给不知情的 Q公司"],"a":"AB","e":"\u0001法定代表人超越内部限权及企业超越经营范围与善意相对人订立的合同，原则上对公司发生效力。\u0002\nA✓ 超越章程等内部代表权限与不知情相对人签约，不得对抗善意相对人，由公司承受后果。\nB✓ 当事人超越经营范围订约，只要不违背国家限制经营、特许经营及强行法规定，不当然无效，公司应担责。\nC✗ 纯属员工伪造公章的行为既无代理授权亦无表见基础（仅假借公章本身通常不足单独构成表见代理），公司可予否认而不担责。\nD✗ 员工以自己名义处分电脑，属于个人无权处分或个人合同，未以公司名义行为，公司不直接承受合同后果。","k":"","kb":111,"kh":[[537,581],[599,646]]},{"id":"2018-21","y":2018,"t":"单","s":"李某于2012 年7 月将户籍由甲市迁往乙市, 因遗失户籍迁移证而未能落户,后李某因工作需要, 自2013 年8 月起租住在丙市,并在2014 年9 月至 2015 年 12 月期间因重病在丁市某医院住院治疗。 2015 年10 月时李某的住所是（ ）。","o":["甲市","乙市","丙市","丁市"],"a":"C","e":"\u0001经常居所地为连续居住1年以上之地（住院治病除外），故丙市租住满1年后虽赴丁市长期住院，住所仍为丙市。\u0002\nA✗ 户籍由甲市迁出后虽未在乙市落户，但已在丙市形成连续居住超过1年的经常居所。\nB✗ 未能在乙市实际落户且从未在乙市连续居住满1年。\nC✓ 2013年8月至2014年9月在丙市连续租住已满1年，成为经常居所；其后赴丁市住院治病不计入经常居所变更，故2015年10月住所为丙市。\nD✗ 因重病在丁市医院住院治疗超过1年属于法定例外情形，不产生新的经常居住地。","k":"","kb":108,"kh":[[398,446]]},{"id":"2018-32","y":2018,"t":"单","s":"下列情形中,不属于法人解散原因的是 （ ）。","o":["被吊销营业执照","被吊销登记证书","章程规定的存续期间届满","变更名称"],"a":"D","e":"\u0001法人单纯变更名称只需办理变更登记，不导致法人解散。\u0002\nA✗ 依法被吊销营业执照是《民法典》第69条明确的法人解散原因。\nB✗ 依法被吊销登记证书属于法人法定解散原因。\nC✗ 法人章程规定的存续期间届满是法人解散原因之一。\nD✓ 法人变更名称后主体继续存续，完全不属于法人解散原因。","k":"","kb":111,"kh":[[665,716]]},{"id":"2018-46","y":2018,"t":"多","s":"甲、乙、丙设立一合伙企业。2014年8月，该合伙企业欠星月公司货款36万元，同年10月，丙经甲、乙同意退伙，依约承担了15万元的合伙债务。2015年2月，丁经甲、乙同意入伙，并约定：丁对入伙前该合伙企业所欠债务不承担责任。对该合伙企业欠星月公司的债务应承担无限连带责任的有（ ）。","o":["甲","乙","丙","丁"],"a":"ABCD","e":"\u0001普通合伙人无论是否退伙或新入伙，对存续或退伙前债务对外一律负无限连带责任，内部免责约定不得对抗债权人。\u0002\nA✓ 甲作为原合伙人兼现存合伙人对合伙债务负无限连带责任。\nB✓ 乙作为原合伙人兼现存合伙人对合伙债务负无限连带责任。\nC✓ 丙退伙时虽按内部协议分担了15万元，但对退伙前已发生的36万元货款对外仍负无限连带责任。\nD✓ 丁作为新入伙的普通合伙人对入伙前债务对外负无限连带责任，内部不担责的约定不得对抗星月公司。","k":"","kb":112,"kh":[[93,176]]},{"id":"2019-23","y":2019,"t":"单","s":"甲为设立蓝天公司,以自己的名义承租乙公司的房屋作为蓝天公司筹备处的办公场所,约定租金 2万元。蓝天公司成立后,乙公司对到期未付的租金（ ）。","o":["只能请求甲支付","只能请求蓝天公司支付","有权选择请求甲或蓝天公司支付","有权请求甲和蓝天公司承担按份责任"],"a":"C","e":"\u0001设立人以自己名义为设立中的法人订约，法人成立后，第三人有权选择请求设立人或已成立的法人承担民事责任。\u0002\nA✗ 法人已经成立并实际使用承租房屋，第三人并非只能请求甲个人承担。\nB✗ 合同是以设立人甲自己名义签署的，法律赋予第三人选择向甲或蓝天公司追索的权利。\nC✓ 依《民法典》第75条，设立人以自己名义为设立法人从事活动，法人成立后第三人享有选择权，可请求甲或蓝天公司支付租金。\nD✗ 法律赋予的是第三人择一请求权（实质可单方选定追索对象），而非按份责任。","k":"","kb":111,"kh":[[461,512]]},{"id":"2019-24","y":2019,"t":"单","s":"甲、乙系夫妻,1998年5月儿子丙出生。2017 年10月甲与侄子丁签订书面协议,约定在甲丧失民事行为能力时,丁担任甲的监护人。一年后甲丧失民事行为能力,其好友戊表示愿意担任甲的监护人,并得到甲住所地居委会的同意。此时甲的监护人是（ ）。","o":["乙","丙","丁","戊"],"a":"C","e":"\u0001意定监护协议优先于法定监护及居委会同意的指定/协议监护适用，故应由书面协议确定的丁担任监护人。\u0002\nA✗ 虽配偶乙在法定监护中居第一顺位，但甲事先已设立有效的书面意定监护，排除法定监护顺序适用。\nB✗ 成年儿子丙属法定监护第二顺位，同样让位于在先意定监护协议。\nC✓ 甲在具完全行为能力时与侄子丁以书面形式约定由丁担任自己失能后的监护人，该意定监护优先发生效力。\nD✗ 好友戊虽获居委会同意，但该兜底顺位仅在无意定监护且无法定监护人时方能适用。","k":"","kb":109,"kh":[[186,251]]},{"id":"2019-46","y":2019,"t":"多","s":"我国《民法总则》依据法人存在的目的,将法人分为营利法人、非营利法人和特别法人。下列选项中,属于特别法人的有（ ）。","o":["机关法人","事业单位法人","捐助法人","农村集体经济组织法人"],"a":"AD","e":"\u0001《民法典》规定特别法人包括机关法人、农村集体经济组织法人、城镇农村的合作经济组织法人和基层群众性自治组织法人。\u0002\nA✓ 机关法人属于四类法定特别法人之一。\nB✗ 事业单位法人属于非营利法人，而非特别法人。\nC✗ 捐助法人（如基金会）属于非营利法人。\nD✓ 农村集体经济组织法人属于特别法人。","k":"","kb":111,"kh":[[222,268]]},{"id":"2020-38","y":2020,"t":"单","s":"营利法人依法解散进行清算期间,营利法人 （ ）。","o":["主体资格消灭,不能进行任何民事活动","主体资格消灭,但可以从事与清算有关的活动","主体资格不消灭,可以进行各种民事活动","主体资格不消灭,但不得从事与清算无关的活动"],"a":"D","e":"\u0001营利法人解散进入清算期间，法人主体资格并不消灭，仍依法存续，但不得从事与清算无关的民事活动。\u0002\nA✗ 清算期间法人资格尚未注销终止，仍可开展清理债权债务等清算活动。\nB✗ 并非主体资格已经消灭，而是主体资格继续存续至完成注销登记。\nC✗ 清算阶段能力受到目的限制，禁止开展与清算无关的新增营利经营活动。\nD✓ 清算期间法人存续，但行为范围严格限于了结现务、清理财产等与清算有关的活动。","k":"","kb":111,"kh":[[717,743]]},{"id":"2020-47","y":2020,"t":"多","s":"下列选项中,属于非营利法人的有（ ）。","o":["基层群众性自治组织法人","社会团体法人","事业单位法人","农村合作经济组织法人"],"a":"BC","e":"\u0001非营利法人包括事业单位法人、社会团体法人、基金会、社会服务机构等捐助法人。\u0002\nA✗ 基层群众性自治组织法人（如村委会、居委会）属于特别法人。\nB✓ 社会团体法人属于非营利法人。\nC✓ 事业单位法人属于非营利法人。\nD✗ 城镇农村的合作经济组织法人属于特别法人。","k":"","kb":111,"kh":[[136,165],[222,268]]},{"id":"2021-21","y":2021,"t":"单","s":"下列关于捐助法人的表述，正确的是（ ）。","o":["捐助法人终止时应将剩余财产返还给捐助人","捐助法人无须设立决策机构","捐助人是捐助法人的法定代表人","捐助法人是为公益目的设立的非营利法人"],"a":"D","e":"\u0001捐助法人是为公益目的以捐助财产设立的非营利法人，须设决策机构，终止后剩余财产不得返还捐助人。\u0002\nA✗ 公益非营利法人终止时，不得向出资人、设立人或者会员分配剩余财产，应转归公益目的。\nB✗ 捐助法人依法应当设立理事会、民主管理组织等决策机构，并设执行机构。\nC✗ 依照《民法典》第93条，捐助法人的法定代表人是由理事长等负责人按照章程担任，并非捐助人本人。\nD✓ 捐助法人专指为公益目的以捐助财产依法登记成立的非营利法人（如基金会、社会服务机构）。","k":"","kb":111,"kh":[[161,219]]},{"id":"2021-46","y":2021,"t":"多","s":"监护人因发生突发事件等紧急情况暂时无法履行监护职责,被监护人的生活处于无人照料状态的,应当为被监护人安排必要的临时生活照料措施的组织有（ ）。","o":["被监护人住所地的民政部门","监护人的所在单位","被监护人住所地的居民委员会","被监护人住所地的村民委员会"],"a":"ACD","e":"\u0001因发生突发事件等紧急情况导致监护人暂时无法履行职责、被监护人生活无人照料的，居委会、村委会或民政部门应当安排必要临时生活照料。\u0002\nA✓ 被监护人住所地的民政部门负有法定兜底临时照料职责。\nB✗ 监护人的所在单位不是《民法典》第34条规定的法定临时生活照料义务主体。\nC✓ 被监护人住所地的居民委员会应当安排必要临时生活照料措施。\nD✓ 被监护人住所地的村民委员会负有同等临时生活照料职责。","k":"","kb":109,"kh":[[260,331]]},{"id":"2023-29","y":2023,"t":"单","s":"下列选项中,可以成为有限合伙企业中普通合伙人的是","o":["国有独资公司","上市公司","个人独资企业","慈善组织"],"a":"C","e":"\u0001国有独资公司、国有企业、上市公司以及公益性事业单位和社会团体不得成为普通合伙人；个人独资企业则不受此限。\u0002\nA✗ 国有独资公司被《合伙企业法》第3条明确禁止成为普通合伙人，只可作有限合伙人。\nB✗ 上市公司不得成为普通合伙人，以免无限连带风险危及公众股东利益。\nC✓ 个人独资企业无禁止限制，可以成为有限合伙企业中的普通合伙人（由其投资人以个人财产最终承担无限责任）。\nD✗ 公益性社会团体（慈善组织）依法不得成为普通合伙人。","k":"","kb":112,"kh":[[587,644]]},{"id":"2023-33","y":2023,"t":"单","s":"【案情】甲、乙忙于工作，其子小明出生后便由乙的母亲丙照顾。甲向丙许诺，在丙照顾孩子期间每月给丙2000元补贴，年底一次性支付。小明5岁时，甲、乙离婚，小明由甲直接抚养，甲委托其父母照顾小明。\n甲、乙离婚后,小明的监护人是","o":["甲","甲、乙","甲的父母","甲、乙和甲的父母"],"a":"B","e":"\u0001父母对未成年子女的法定监护职责不因离婚或交由祖父母代为照料而消灭，离婚后甲、乙双方仍是监护人。\u0002\nA✗ 甲虽取得直接抚养权，但并未因此取消乙作为母亲的法定监护人地位。\nB✓ 父母离婚后对子女仍有抚养、教育、保护的权利和义务，甲和乙均继续担任小明的法定监护人。\nC✗ 甲的父母只是受甲委托代为日常照料，并非取得法定监护人资格（有监护能力的父母健在）。\nD✗ 甲的父母系受托照料人，未替代或并列加入法定监护人行列。","k":"","kb":109,"kh":[[36,92]]},{"id":"2023-35","y":2023,"t":"单","s":"个体工商户的债务,个人经营的,以个人财产承担;家庭经营的,以家庭财产承担;无法区分的,应当","o":["以个人财产承担","以夫妻共同财产承担","以经营所得承担","以家庭财产承担"],"a":"D","e":"\u0001个体工商户的债务，个人经营的以个人财产承担，家庭经营的以家庭财产承担，无法区分的推定以家庭财产承担。\u0002\nA✗ 无法区分究竟是个人还是家庭经营时，法律出于保护债权人考量推定由家庭财产承担而非个人财产。\nB✗ 《民法典》第56条明确规定为“以家庭财产承担”，概念宽于且不同于单纯的“夫妻共同财产”。\nC✗ 个体工商户不具独立法人财产权，责任不限于经营所得本身。\nD✓ 符合《民法典》第56条规定：无法区分个人或家庭经营的，应当以家庭财产承担责任。","k":"","kb":108,"kh":[[475,516]]},{"id":"2024-21","y":2024,"t":"单","s":"甲与乙参加某景区的户外体验项目期间,乘坐的直升机落入水中,江中救援队经过紧急打捞找到了乙,甲则下落不明,对此,下列说法正确的是（ ）。","o":["甲下落不明后,利害关系人可以随时申请宣告甲死亡","自甲下落不明满两年,利害关系人可以申请宣告甲死亡","需自甲下落不明满四年,利害关系人才可以申请宣告甲死亡","需宣告即认定甲死亡"],"a":"B","e":"\u0001乘坐直升机坠水下落不明属意外事件，题干未交待有关机关出具不可能生存的证明，故须自事件发生满2年方可申请宣告死亡。\u0002\nA✗ 仅在“经有关机关证明该自然人不可能生存”时才不受2年期间限制，此处未获此类证明不能随时申请。\nB✓ 直升机落水且尚未发现甲属于因意外事件下落不明，利害关系人自意外事件发生下落不明满2年起可申请宣告死亡。\nC✗ 普通下落不明才需满4年，意外事件适用2年特别期间。\nD✗ 宣告死亡必须满足法定下落不明期间并经利害关系人申请及法院法定程序宣告，不可跳过期间即行认定。","k":"","kb":110,"kh":[[249,335]]},{"id":"2025-33","y":2025,"t":"单","s":"下列选项中,属于非法人组织的是（ ）。","o":["居民委员会","个人独资企业","个体工商户","农村集体经济组织"],"a":"B","e":"\u0001个人独资企业属于不具有法人资格、但能以自己名义从事民事活动的非法人组织。\u0002\nA✗ 居民委员会属于《民法典》规定的基层群众性自治组织法人，归入特别法人。\nB✓ 个人独资企业是《民法典》第102条列举的典型非法人组织。\nC✗ 个体工商户在法律分类上属于自然人的特殊商业登记形态，而非组织体性质的非法人组织。\nD✗ 农村集体经济组织属于特别法人。","k":"","kb":111,"kh":[[747,806]]},{"id":"2025-35","y":2025,"t":"单","s":"A 公司是B 公司的全资子公司,注册地在M 国,主要营业机构位于我国某市。现A 公司对C 公司负债700 万元。该债务应当（ ）。","o":["以A 公司的全部财产清偿","由A 公司与B 公司承担连带清偿责任","仅以A 公司主要营业机构的全部财产清偿","先由A 公司清偿,再由B 公司对A 公司不能清偿的部分承担补充责任"],"a":"A","e":"\u0001子公司具备独立法人资格，依法以其全部财产独立承担民事责任，不与母公司连带或混同。\u0002\nA✓ 母公司设立的全资子公司是独立法人，对外债务应当以子公司自己的全部财产独立清偿。\nB✗ 除法定人格否认（混同等滥用独立地位损害债权人利益）情形外，母公司不对子公司债务承担连带清偿责任。\nC✗ 公司以其“全部财产”对债务负责，并不仅限于主要营业机构所在地财产。\nD✗ 母公司作为出资人仅以其出资额为限承担有限责任，不对子公司不能清偿部分承担补充责任。","k":"","kb":111,"kh":[[416,445]]},{"id":"2026-27","y":2026,"t":"单","s":"甲、乙用夫妻共同财产购买房屋,登记在未成年儿子丙名下。后甲、乙向银行借款,以法定代理人身份将该房屋抵押,并办理抵押登记。获得贷款后,甲、乙主张抵押因损害丙的利益而无效。该抵押行为","o":["有效","无效","可撤销","不成立"],"a":"A","e":"\u0001父母用夫妻共有财产购买并登记在未成年子女名下的房产，为家庭共同需要抵押贷款的，抵押行为有效。\u0002\nA✓ 该房产实质系夫妻共同出资购买且抵押融资用于家庭共同债务或生活需要，并未恶意侵夺子女原有独立利益，且银行属善意抵押权人，父母事后反悔主张无效违背诚信原则，故抵押合法有效。\nB✗ 监护人虽不得损害被监护人利益处分其财产，但父母动用自身共有资金购置登记子女名下房产为家庭共同债务融资，实务认定未损及被监护人实质利益，并非无效。\nC✗ 不存在欺诈、胁迫、重大误解等法定可撤销事由。\nD✗ 双方已完成抵押合意并办理抵押登记，抵押法律行为已成立且有效。","k":"","kb":109,"kh":[[391,463]]}]},{"sub":"刑法","name":"分则·侵犯人身权利罪","w":2.4,"L":43,"qs":[{"id":"2005-9","y":2005,"t":"单","s":"下列行为中,应以故意杀人罪定罪处罚的是（ ）。","o":["甲在与钱某争吵中,突然抽出随身携带的匕首向钱某刺一刀后扬长而去,致其重伤","乙在非法拘禁孙某过程中,使用暴力致孙某死亡","丙在绑架李某、向李某家属勒索财物过程中,杀害李某","丁对公共建筑物放火,大火烧毁该建筑物,并且烧死二人"],"a":"B","e":"\u0001《刑法》第238条第2款明文规定，非法拘禁他人并使用暴力致人死亡的，依照故意杀人罪定罪处罚；绑架杀人定绑架罪一罪。\u0002\nA✗ 争吵中仅刺一刀后扬长而去（对死亡无明确追求、结果仅造成重伤），间接故意下按实际发生结果定\u0001故意伤害罪\u0002\nB✓ 乙在非法拘禁孙某过程中，使用暴力致孙某死亡：依据《刑法》第238条第2款转化型犯罪规定，直接依照\u0001故意杀人罪\u0002定罪处罚\nC✗ 《刑法》第239条规定在绑架过程中杀害被绑架人的，依然定\u0001绑架罪\u0002一罪（法定死刑，或无期/死刑），不改定故意杀人罪\nD✗ 对公共建筑物放火并烧死二人，应当认定为\u0001放火罪（致人死亡结果加重犯）\u0002一罪处罚","k":"","kb":66,"kh":[[76,115]]},{"id":"2006-9","y":2006,"t":"单","s":"某欠赌债不还,钱某邀朋友林某,涂某一起将刘某骗到一空房内捆绑起来吊在房梁上,用竹板抽打,逼其还钱。 2 天后,刘某被闻讯赶来的公安人员解救。经法医鉴定,刘某为轻微伤。对钱某等三人的行为应当（ ）。","o":["以非法拘禁罪从重处罚","以故意伤害罪从重处罚","以非法拘禁罪和故意伤害罪并罚","以绑架罪定罪处罚"],"a":"A","e":"\u0001为索取债务（含赌债等非法债务）而非法捆绑吊打他人仅造成轻微伤（未达重伤死亡），应以非法拘禁罪定罪并酌情从重或依非法拘禁论处。\u0002\nA✓ 以非法拘禁罪从重处罚：为索取债务（司法解释明确包括\u0001赌债等非法债务\u0002）非法扣押拘禁他人的定非法拘禁罪；使用殴打方法仅致轻微伤未达到重伤死亡转化门槛的，仍在非法拘禁罪内评价并从重处罚\nB✗ 仅造成“轻微伤”不构成故意伤害罪（故意伤害罪入罪底线至少为轻伤）\nC✗ 同一道理，未达重伤死亡不发生向故意伤害罪的转化，亦未构成两个罪名\nD✗ 索债型非法拘禁即使索要的是高利贷或赌债，因存在真实在先债权债务关系，原则上仍定非法拘禁罪而非绑架罪","k":"","kb":68,"kh":[[42,89]]},{"id":"2006-16","y":2006,"t":"单","s":"按照刑法规定,以下情形中,应当以故意杀人罪定罪处罚的是（ ）。","o":["拐卖妇女造成被害人死亡的","暴力干涉婚姻自由致使被害人死亡的","抢劫致被害人死亡的","刑讯逼供致被害人死亡的"],"a":"D","e":"\u0001《刑法》第247条规定，司法工作人员刑讯逼供致被害人死亡的，转化为故意杀人罪定罪从重处罚。\u0002\nA✗ 拐卖妇女过失或附带造成被害人死亡属于拐卖妇女罪的法定结果加重情节，仍定拐卖妇女罪一罪\nB✗ 《刑法》第257条第2款规定，暴力干涉婚姻自由致使被害人死亡的（通常指自杀身亡），仍定\u0001暴力干涉婚姻自由罪\u0002（处2–7年有期徒刑）\nC✗ 抢劫致被害人死亡属于第263条抢劫罪结果加重犯，只定抢劫罪\nD✓ 刑讯逼供致被害人死亡的：依《刑法》第247条规定，刑讯逼供或者暴力取证致人伤残、死亡的，\u0001依照故意伤害罪、故意杀人罪定罪从重处罚\u0002","k":"","kb":66,"kh":[[130,167]]},{"id":"2006-17","y":2006,"t":"单","s":"下列情形中,不属于刑法第 236 条强奸罪加重法定情节的是（ ）。","o":["强奸妇女多人的","利用妇女处于昏醉状态而强奸的","在公共场所当众强奸妇女的","二人以上轮奸的"],"a":"B","e":"\u0001《刑法》第236条明文列举的强奸罪加重法定情节不包含“利用妇女处于昏醉状态”（“其他手段”仅属基本犯实行方式，并非法定升格加重档次）。\u0002\nA✗ 强奸妇女多人的，属于第236条第3款第2项明文规定的法定加重情节\nB✓ 不属于法定加重情节（正选）：趁妇女昏醉实施强奸仅仅是强奸罪基本犯罪构成要件（“其他使妇女不知/不能反抗的手段”），本身不自动触发十年以上加重法定刑\nC✗ 在公共场所当众强奸妇女的，属于第236条第3款第3项法定加重情节\nD✗ 二人以上轮奸的，属于第236条第3款第4项法定加重情节","k":"","kb":67,"kh":[[122,134],[138,151],[155,162]]},{"id":"2007-5","y":2007,"t":"单","s":"下列情形中,属于故意杀人罪实行行为的是 （ ）。","o":["甲为谋杀刘某而持刀潜入刘某家中隐藏、守候","乙为谋杀孙某购买一支手枪,以便杀孙某时使用","丙为谋杀赵某而在赵某饮用的茶水中投放毒药","丁为谋杀李某而花 10 万元雇佣杀手"],"a":"C","e":"\u0001向被害人饮用的茶水中投放毒药，已经直接制造了致命食物摄入的紧迫危险，属于故意杀人罪的着手实行行为；潜伏、买枪、雇凶均属预备行为。\u0002\nA✗ 潜入刘某家中藏匿守候尚未见被害人行凶，属为杀人制造接近条件的犯罪预备行为\nB✗ 购买手枪属于典型的准备犯罪工具的预备行为\nC✓ 丙为谋杀赵某而在赵某饮用的茶水中投放毒药：投毒行为一经置入对方随时饮用的水杯，已开始实施杀人罪实行行为\nD✗ 花钱雇佣杀手属于联系纠集作案人、创造杀人条件的预备阶段行为（若杀手也未动手则全案停留在预备阶段）","k":"","kb":66,"kh":[[10,15]]},{"id":"2007-22","y":2007,"t":"多","s":"下列情形中,应以强奸罪定罪处罚的有 （ ）。","o":["利用迷信手段欺骗妇女与其发生性关系的","在拐卖妇女过程中,奸淫被拐卖妇女的","利用妇女极度疲劳昏睡之机,冒充其丈夫与其发生性关系的","谎称自己有能力为妇女办理出国手续,要求与妇女发生性关系,妇女为达到出国目的,与其发生性关系的"],"a":"AC","e":"\u0001利用迷信欺骗性交和趁妇女昏睡冒充丈夫奸淫均严重违背妇女真实性同意意志，构成强奸罪；拐卖过程中奸淫是拐卖罪加重情节；互相利用办出国属于权色交易不构强奸罪。\u0002\nA✓ 利用“驱魔消灾”等封建迷信手段欺骗妇女与其发生性关系，使妇女对行为性质陷入致命错误而非自愿性同意，成立\u0001强奸罪\u0002\nB✗ 在拐卖妇女过程中奸淫被拐卖妇女的，依《刑法》第240条第1款第3项定\u0001拐卖妇女罪（法定加重情节）\u0002一罪，不单独定强奸罪\nC✓ 利用妇女极度疲劳昏睡之机冒充其丈夫奸淫（误以为是自己丈夫而顺从），完全违背妇女真实配偶认同，成立\u0001强奸罪\u0002\nD✗ 男子谎称能帮办出国手续而女方出于出国利益自愿权色交换（不存在强制或对“性交本身性质”之误解），双方属利益欺骗交换而不以强奸罪论处","k":"","kb":67,"kh":[[212,277]]},{"id":"2008-12","y":2008,"t":"单","s":"区别拐卖妇女罪与绑架罪的关键是（ ）。","o":["犯罪对象是否为妇女","是否实施了绑架妇女的行为","是否通过出卖妇女获取钱财","是否非法剥夺了妇女的人身自由"],"a":"C","e":"\u0001绑架罪与拐卖妇女罪同样可以针对妇女实施、同样可以采取绑架手段并剥夺人身自由，二者最本质的分水岭在于主观上“是否以出卖获取钱财为目的”。\u0002\nA✗ 两罪均可针对妇女实施（女性人质也常成为绑架罪勒索对象）\nB✗ 《刑法》第240条明确规定拐卖妇女包括以出卖为目的的“绑架”妇女行为，因此有无“绑架手段”并不能区分两罪\nC✓ 是否通过出卖妇女获取钱财：拐卖妇女罪必须以\u0001“出卖”\u0002为目的，将妇女作为商品换钱谋利；而绑架罪是以\u0001勒索财物\u0002（向第三人要赎金）或满足其他不法要求为目的（并不将妇女本身当货物卖掉）\nD✗ 两罪在控制被害人期间都必然限制甚至非法剥夺妇女的人身自由","k":"","kb":90,"kh":[[148,174]]},{"id":"2010-11","y":2010,"t":"单","s":"甲因与乙有仇,便捏造乙卖淫的事实,到处散布并向公安局告发,使乙受到严重的精神伤害。甲的行为构成（ ）。","o":["诬告陷害罪","报复陷害罪","侮辱罪","诽谤罪"],"a":"D","e":"\u0001捏造乙卖淫（属于个人私德淫乱败坏名誉而非触犯刑法的犯罪事实）并到处公开散布且向公安告发致其严重精神伤害，捏造的不是“犯罪事实”故非诬告陷害，而定诽谤罪。\u0002\nA✗ 诬告陷害罪要求捏造的是“他人\u0001犯罪\u0002事实”且意图使他人受\u0001刑事追究\u0002；卖淫在我国仅属治安违法而非刑法罪名（若卖淫非组织卖淫则不构成犯罪），故不成立诬告陷害罪\nB✗ 报复陷害罪主体必须是\u0001国家机关工作人员\u0002，且必须滥用职权假公济私报复控告、申诉、批评、举报人；本题既未体现官职身份也无举报前提\nC✗ 侮辱罪无需“捏造虚假事实”（往往是当众辱骂、泼粪、暴力凌辱）；捏造虚构卖淫事实到处传播正是\u0001诽谤罪\u0002\nD✓ 诽谤罪：故意捏造“乙卖淫”这一毁损人格名誉的虚假事实并到处公开散布，导致乙受严重精神损害（达到情节严重），构成\u0001诽谤罪\u0002","k":"","kb":70,"kh":[[115,134],[163,180]]},{"id":"2011-11","y":2011,"t":"单","s":"甲因自己不能生育,花1万元从人贩子手中收买一男婴。3个月后,甲嫌抚养孩子太辛苦,遂以2 万元转卖给乙,并声称是自己的亲生儿子。甲的行为构成（ ）。","o":["遗弃罪","拐骗儿童罪","诈骗罪","拐卖儿童罪"],"a":"D","e":"\u0001最初不以出卖为目的收买被拐儿童，三个月后因嫌麻烦转手高价卖出（2万元），依《刑法》第241条第5款转化为拐卖儿童罪。\u0002\nA✗ 甲是以“2万元转卖”给他人抚养牟利，并非把孩子抛弃不管的遗弃行为\nB✗ 拐骗儿童罪是没有暴力胁迫且不是“买进卖出”的拐走留养行为（第262条）；收买后再出卖第241条明文转化定拐卖儿童罪\nC✗ 虽对买家乙谎称“亲生儿子”，但核心罪行是交易买卖儿童本身，依法定拐卖儿童罪（收买者转卖法定转化）\nD✓ 拐卖儿童罪：依据《刑法》第241条第5款，收买被拐卖的妇女、儿童后又出卖的，\u0001依照拐卖妇女、儿童罪定罪处罚\u0002","k":"","kb":69,"kh":[[149,186]]},{"id":"2011-15","y":2011,"t":"单","s":"民警甲为报私仇,趁乙与他人发生纠纷之机, 将乙非法拘押,并使用警棍殴打乙,致使乙残疾。对甲的行为（ ）。","o":["应定为故意伤害罪,并从重处罚","应定为非法拘禁罪,并从重处罚","应定为刑讯逼供罪,并从重处罚","应定为报复陷害罪,并从重处罚"],"a":"A","e":"\u0001民警利用职权借故将有矛盾者非法拘押并使用警棍暴打致其残疾（超出拘禁必需手段致伤残），依《刑法》第238条第2款转化为故意伤害罪并依警察利用职权或重伤评价从重处罚。\u0002\nA✓ 应定为故意伤害罪，并从重处罚：依《刑法》第238条第2款“非法拘禁使用暴力致人伤残、死亡的，依照故意伤害罪、故意杀人罪定罪处罚”；同时依据第238条第4款精神或渎职利用警械暴力伤害从重处理（真题选项唯一精准对应A）\nB✗ 使用警棍殴打致人\u0001残疾\u0002（重伤），已发生法定罪名转化，不再以非法拘禁罪定罪\nC✗ 刑讯逼供罪对象仅限犯罪嫌疑人、被告人；乙只是因与人发生纠纷且被民警挟私报复拘押，并非刑事案件嫌疑人，不构刑讯逼供罪\nD✗ 报复陷害罪须针对依法行使控告、申诉、批评、举报权之人；乙并非举报控告人","k":"","kb":66,"kh":[[76,115]]},{"id":"2012-9","y":2012,"t":"单","s":"警察甲因公民吴某举报自己受贿而怀恨在心, 遂用他人手机向某军官发了一条短信,捏造吴某与其妻子同居。该军官信任自己的妻子,未予理睬。甲的行为（ ）。","o":["构成诽谤罪","构成诬告陷害罪","构成报复陷害罪","不构成犯罪"],"a":"D","e":"\u0001警察甲因私怨发一条匿名短信给“某军官”捏造吴某与军官妻子同居，既未公开散布（不符合诽谤罪“公然/广泛散布”且未达情节严重），也未向司法/有关机关告发犯罪（非诬告陷害），亦未滥用警察职权（非报复陷害），不构成犯罪。\u0002\nA✗ 《刑法》第246条诽谤罪须“情节严重”，一般要求广泛传播严重损害名誉；仅向个别一人发一条匿名短信且对方未信不理睬，远未达犯罪程度\nB✗ 诬告陷害罪必须捏造“犯罪事实”并向公安司法等机关告发意图使他人受刑事追究；发短信给个人且捏造“同居”道德私事而非犯罪，不构诬告陷害罪\nC✗ 报复陷害罪须国家机关工作人员“滥用职权、假公济私”，甲用别人手机发私人短信并未动用警察职权\nD✓ 不构成犯罪：上述行为虽违反治安或道德纪律（侵害他人名誉或侮辱），但既未动用公权力，又只向单个军官发了一条短信未被采信，缺乏刑事社会危害严重性，不构犯罪","k":"","kb":70,"kh":[[24,80]]},{"id":"2012-12","y":2012,"t":"单","s":"甲明知卖淫女赵某未满14周岁,而与之发生性交易。甲的行为（ ）。","o":["不构成犯罪","构成强奸罪","构成猥亵儿童罪","构成嫖宿幼女罪"],"a":"B","e":"\u0001明知卖淫女系不满14周岁的幼女仍与之发生性交易，原依嫖宿幼女罪定罪；《刑法修正案（九）》正式废除嫖宿幼女罪，现行法一律以强奸罪论处并从重处罚。\u0002\nA✗ 不论幼女是否自愿、是否收钱交易，只要对方不满14周岁且行为人明知，一律成立犯罪\nB✓ 构成强奸罪：2015年《刑法修正案（九）》已删除《刑法》第360条第2款嫖宿幼女罪，与不满14周岁幼女发生性关系的（含所谓性交易），现行《刑法》第236条第2款统一以\u0001强奸罪\u0002论处，从重处罚\nC✗ 发生了实际性交行为（奸淫），应当适用比猥亵儿童罪更重的强奸罪\nD✗ 原2012年真题按旧法答案为D（嫖宿幼女罪）；但该罪名早已于2015年被《刑修（九）》彻底废除，现行法唯一正解为强奸罪\n\u0001【新法提示】\u0002原2012年真题依据《刑法》旧第360条第2款曾选“嫖宿幼女罪”。2015年《刑法修正案（九）》废除嫖宿幼女罪，且2021年《刑修（十一）》进一步增加“奸淫不满十周岁幼女或造成伤害”等10年以上加重档次。现行法下本题唯一正确答案为\u0001强奸罪\u0002。","k":"","kb":67,"kh":[[46,72]]},{"id":"2012-19","y":2012,"t":"单","s":"甲、乙、丙与周某打麻将赌钱,结果三人共输给周某30万元。事后,三人怀疑周某打麻将时做了手脚,遂将周某劫持到一空房内,逼其退还赌资。周某让妻子将30万元退还给了三人。甲、乙、丙三人的行为构成（ ）。","o":["抢劫罪","敲诈勒索罪","绑架罪","非法拘禁罪"],"a":"D","e":"\u0001怀疑对方赌博出老千后将之劫持到空房逼其退回输掉的30万赌资，最高法司法解释明确为索取债务（含赌债、高利贷等非法债务）非法扣押拘禁他人的定非法拘禁罪。\u0002\nA✗ 索取自认为对方欺骗赢得的赌资（仍属索债性纠纷范畴），缺乏强夺毫无关系他人财物的抢劫非法占有目的（注：若根本未输钱凭空敲诈才定抢劫或绑架）\nB✗ 为索回己方输掉并怀疑作弊的赌债而扣押人身，适用司法解释专门明确之非法拘禁罪定性\nC✗ 不是向无债务关系第三方勒索，而是直接扣押涉赌当事人退回己所输钱款，不构绑架罪\nD✓ 非法拘禁罪：依据最高法解释，为索取法律不予保护的\u0001赌债等非法债务\u0002（含逼对方退还疑因欺诈赢走的赌资）而非法扣押、拘禁他人的，依照\u0001非法拘禁罪\u0002定罪处罚","k":"","kb":68,"kh":[[42,89]]},{"id":"2013-4","y":2013,"t":"单","s":"甲(15周岁)拐骗一名男孩,准备将其出卖,后因小孩哭闹不止,甲对其进行殴打,造成重伤。甲的行为构成（ ）。","o":["绑架罪","拐卖儿童罪","故意伤害罪","非法拘禁罪"],"a":"C","e":"\u000115周岁（已满14不满16周岁）拐骗男童欲出卖虽不构拐卖儿童罪（非八大重罪），但殴打男童致其重伤，依法构成故意伤害罪（八大重罪之一）。\u0002\nA✗ 15周岁人对绑架罪不负刑事责任，且甲主观目的是出卖而非勒索\nB✗ 拐卖儿童罪不在《刑法》第17条第2款已满14不满16周岁人负刑责的八类犯罪之列\nC✓ 故意伤害罪：已满14周岁不满16周岁的人犯\u0001故意伤害致人重伤\u0002或者死亡的，依法应当负刑事责任\nD✗ 15周岁人对普通非法拘禁罪不负刑事责任","k":"","kb":66,"kh":[[23,28]]},{"id":"2013-44","y":2013,"t":"多","s":"下列行为中,应以故意杀人罪定罪处罚的有（ ）。","o":["在聚众斗殴过程中致人死亡","在脱逃过程中使用暴力致人死亡","在刑讯逼供时致犯罪嫌疑人死亡","在行政管理活动中滥用职权致他人死亡"],"a":"ABC","e":"\u0001聚众斗殴致人死亡（第292条第2款）、脱逃中使用暴力致人死亡（牵连从重）、刑讯逼供致人
