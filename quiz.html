08-23","y":2008,"t":"多","s":"下列关于缓刑的表述,正确的有（ ）。","o":["对累犯不适用缓刑","由公安机关对被宣告缓刑的犯罪分子进行考察","有期徒刑的缓刑考验为原判刑期以上 5 年以下","缓刑的对象是被判处 3 年以下有期徒刑、拘役或者管制的犯罪分子"],"a":"AB","e":"\u0001对累犯不适用缓刑；缓刑考察现由社区矫正机构（原法条为公安机关考察，基层配合）负责；有期徒刑缓刑考验期不少于1年；缓刑不适用于管制。\u0002\nA✓ 《刑法》第74条明确规定：对于\u0001累犯\u0002（和犯罪集团的首要分子），不适用缓刑\nB✓ 2008年真题依原《刑法》第76条规定，被宣告缓刑的犯罪分子在考验期内“由公安机关考察，所在单位或者基层组织予以配合”，为当年法条原文\nC✗ 有期徒刑的缓刑考验期限为原判刑期以上5年以下，但\u0001不能少于1年\u0002（例如判1年有期徒刑缓刑1年，不能缓6个月），漏掉下限1年不严密\nD✗ 缓刑仅适用于被判处\u0001拘役、3年以下有期徒刑\u0002的犯罪分子，不包括管制\n\u0001【新法提示】\u0002《刑法修正案（八）》及2020年《社区矫正法》实施后，《刑法》第76条已修改为对被宣告缓刑的犯罪分子“在缓刑考验期限内，\u0001依法实行社区矫正\u0002”（不再由公安机关负责日常考察，现由司法行政部门社区矫正机构执行）。","k":"","kb":43,"kh":[[15,36],[176,204],[211,231]]},{"id":"2010-7","y":2010,"t":"单","s":"根据《刑法》规定,减轻处罚是（ ）。","o":["判处法定刑中比较轻的刑罚","判处法定刑中最轻的刑罚","在法定刑以下判处刑罚","在法定刑限度以内判处刑罚"],"a":"C","e":"\u0001《刑法》第63条规定，减轻处罚是指“在法定刑以下判处刑罚”（本法规定有数个量刑幅度的，在下一个量刑幅度内判刑）。\u0002\nA✗ 在法定刑幅度以内选择相对较轻的刑期，属于\u0001从轻处罚\u0002\nB✗ 从轻处罚是在法定刑限度以内选择较轻刑罚，亦不必非选“最轻”刑罚\nC✓ 在法定刑以下判处刑罚：《刑法》第63条第1款明确规定，减轻处罚必须突破对应罪名法定量刑幅度的下限，在\u0001法定刑以下\u0002判处刑罚\nD✗ “在法定刑限度以内判处刑罚”是《刑法》第62条对从轻处罚和从重处罚的共同限度要求","k":"","kb":39,"kh":[[72,103]]},{"id":"2010-14","y":2010,"t":"单","s":"甲因非法经营罪被判处缓刑,在缓刑考验期内去外地参与传销活动(尚不构成犯罪),监督机关得知后多次通知其即刻返回,但甲以各种理由推托拒不返回,情节严重。对甲应当（ ）。","o":["撤销缓刑,同时认定构成脱逃罪,两罪并罚","撤销缓刑,执行原判刑罚","重新确定缓刑考验期","撤销缓刑,对原犯罪从重处罚"],"a":"B","e":"\u0001缓刑考验期内未经批准擅自离开所居住市县、拒不返回情节严重（未另构新罪），应撤销缓刑执行原判刑罚，不另构成脱逃罪。\u0002\nA✗ 《刑法》第316条脱逃罪的主体只能是“依法被关押的罪犯、被告人、犯罪嫌疑人”；缓刑犯处于监外自由生活状态，未被关押，不能构成脱逃罪\nB✓ 撤销缓刑，执行原判刑罚：在缓刑考验期内违反监督管理规定离开居住地参与传销、多次通知拒不返回且情节严重，依《刑法》第77条第2款应\u0001撤销缓刑，执行原判刑罚\u0002\nC✗ 法律没有规定因违规可重新起算或延长缓刑考验期\nD✗ 原犯罪生效判决已确定刑期，撤销缓刑只需直接收监执行原判刑罚，不得重新加重改判","k":"","kb":43,"kh":[[289,323]]},{"id":"2011-7","y":2011,"t":"单","s":"下列情形中,属于自首的是（ ）。","o":["甲杀人后,其父主动报案并将甲送到派出所, 甲如实交代了杀人事实","甲在与乙共同贪污之后,主动到检察机关交代自己的贪污事实,但未提及乙","甲在和乙共同盗窃之后,主动到公安机关反映乙曾经诈骗数千元,经查证属实","甲给派出所打电话,主动交代了自己杀害妻子的事实,然后出走,不知去向"],"a":"A","e":"\u0001杀人后由父亲主动报案并扭送到派出所且如实供述，依法视为自动投案，成立自首；共同犯罪自首须供述自己及同案犯共同罪行，投案电话后潜逃不算。\u0002\nA✓ 亲友主动报案后将犯罪嫌疑人送去投案，嫌疑人到案后如实交代杀人事实的，司法解释明确\u0001视为自动投案\u0002，成立自首\nB✗ 共同犯罪人成立自首必须供述自己罪行及\u0001所知的同案犯共同犯罪事实\u0002；未提及共同贪污同案犯乙，不成立自首\nC✗ 主动检举乙的另一独立诈骗罪行属于\u0001立功\u0002，而非对自身盗窃罪的自首\nD✗ 打电话交代后却出走不知去向，并未将自己置于司法机关控制下接受审查裁判，不成立自动投案与自首","k":"","kb":40,"kh":[[16,39],[253,278]]},{"id":"2011-42","y":2011,"t":"多","s":"被判处管制的罪犯、被判处缓刑的罪犯和被假释的罪犯应共同遵守的规定有（ ）。","o":["遵守法律、法规,服从监督","遵守有关机关关于会客的规定","按有关机关的规定报告自己的活动情况","离开所居住的市、县或者迁居,应当报经有关机关批准"],"a":"ABCD","e":"\u0001遵守法律法规服从监督、遵守会客规定、按规定报告活动情况、离市县迁居须批准四项是管制、缓刑、假释罪犯应当共同遵守的行为规范。\u0002\nA✓ 三类监外/非监禁罪犯均必须遵守法律法规，服从执行/社区矫正机关监督\nB✓ 三类罪犯在执行或考验期间均须遵守有关机关关于会客的规定\nC✓ 三类罪犯均须按照有关机关规定定期报告自己的活动情况\nD✓ 三类罪犯离开所居住的市、县或者迁居，均必须报经执行/社区矫正机关批准\n精准区分记忆：《刑法》第39条管制的5项义务中，唯独第2项“未经批准不得行使言论、出版、集会、结社、游行、示威自由的权利”是\u0001管制犯独有的刑罚义务\u0002，其余1、3、4、5共4项为管制、缓刑、假释共同遵守。","k":"","kb":44,"kh":[[126,140],[178,191],[195,208],[212,236]]},{"id":"2012-11","y":2012,"t":"单","s":"甲、乙分别为某国有公司总经理和副总经理, 二人挪用公司1000万元公款给张三从事期货交易, 收受并平分了张三的30万元回扣。司法机关在查处甲、乙挪用公款案件时,甲主动交代自己收受了张三 15万元回扣,并揭发乙也收受了15万元回扣。本案中（ ）。","o":["甲在受贿罪行上成立自首","甲在受贿罪行上成立自首和立功","甲在挪用公款和受贿罪行上均成立立功","甲在挪用公款罪行上成立立功,在受贿罪行上成立自首"],"a":"A","e":"\u0001司法机关查处挪用公款案时，甲主动供述司法机关尚未掌握的本人与他人共同受贿30万回扣罪行（不同种罪行）并供出同案犯，甲在受贿罪上成立特别自首而非立功。\u0002\nA✓ 甲在受贿罪行上成立自首：因挪用公款被查处后如实交代司法机关未掌握的\u0001受贿罪\u0002（与挪用公款属不同种罪名），且共同受贿须如实供出同案犯乙分受15万才算完整交代自己罪行，故仅成立特别自首\nB✗ 揭发同案犯\u0001共同犯罪以内\u0002的受贿事实是自首“如实供述”的必然要求，不重复认定为立功（揭发同案犯共同犯罪以外的其他犯罪才算立功）\nC✗ 挪用公款属已被查处的本案罪名，揭发同案犯共同受贿亦不构成“立功”\nD✗ 挪用公款既非主动投案也未另建新功，不成立立功\n高发考点：同案犯互相咬出“共同犯罪之内”分赃份额，只是自首成立条件（不加计立功）；只有揭发同案犯\u0001共同犯罪以外\u0002的其他罪行，才成立立功！","k":"","kb":40,"kh":[[78,148],[253,278]]},{"id":"2012-41","y":2012,"t":"多","s":"甲因犯泄露内幕信息罪被判处3年有期徒刑,缓刑5年。在缓刑考验期限内,甲又犯间谍罪,依法被判处5年有期徒刑。关于本案,下列说法中正确的有（ ）。","o":["甲构成累犯,应当从重处罚","对甲应当附加剥夺政治权利","对甲应在5年以上8年以下酌情决定执行的刑期","对甲应在5年以上10 年以下酌情决定执行的刑期"],"a":"BC","e":"\u0001缓刑考验期内犯危害国家安全的间谍罪，应撤销缓刑前罪3年与新罪5年实行限制加重并罚（5年以上8年以下），且危害国家安全罪应当附加剥夺政治权利，缓刑期内犯新罪不构成累犯。\u0002\nA✗ 累犯要求前罪刑罚\u0001执行完毕或者赦免以后\u00025年内再犯罪；缓刑考验期内原判刑罚尚未执行（更未执行完毕），再犯新罪不构成累犯\nB✓ 间谍罪属于《刑法》分则第一章危害国家安全罪，依第56条对于危害国家安全的犯罪分子\u0001应当附加剥夺政治权利\u0002\nC✓ 撤销缓刑后将前罪3年有期徒刑与后罪5年有期徒刑按限制加重原则并罚，即在数刑中最高刑期5年以上、总和刑期8年以下酌情决定执行刑期\nD✗ 原判有期徒刑为3年，不是“5年”（考验期5年不等于原判刑期5年），因此总和刑期是3+5=8年而非10年","k":"","kb":42,"kh":[[50,79]]},{"id":"2012-42","y":2012,"t":"多","s":"下列选项中,属于缓刑适用实质条件的有","o":["有悔罪表现","犯罪情节较轻","没有再犯罪的危险","宣告缓刑对所居住社区没有重大不良影响"],"a":"ABCD","e":"\u0001《刑法》第72条明文规定的缓刑适用四大实质条件：犯罪情节较轻、有悔罪表现、没有再犯罪的危险、宣告缓刑对所居住社区没有重大不良影响。\u0002\nA✓ 有悔罪表现：第72条第2项法定条件\nB✓ 犯罪情节较轻：第72条第1项法定条件\nC✓ 没有再犯罪的危险：第72条第3项法定条件\nD✓ 宣告缓刑对所居住社区没有重大不良影响：第72条第4项法定条件","k":"","kb":43,"kh":[[89,141]]},{"id":"2014-42","y":2014,"t":"多","s":"犯罪嫌疑人协助司法机关抓获其他犯罪嫌疑人的下列情形中,可认定为立功的有（ ）。","o":["带领侦查人员抓获其他犯罪嫌疑人的","按照司法机关的安排,当场指认其他犯罪嫌疑人的","提供司法机关尚未掌握的其他案件犯罪嫌疑人的藏匿地点的","按照司法机关的安排,打电话将其他犯罪嫌疑人约至指定地点的"],"a":"ABCD","e":"\u0001最高法《自首立功解释》明确规定，带领抓获、按安排当场指认、提供未掌握藏匿点、按安排打电话约至指定地点抓获，均属协助抓捕类立功。\u0002\nA✓ 带领侦查人员抓获其他犯罪嫌疑人的，认定为立功\nB✓ 按照司法机关的安排，当场指认其他犯罪嫌疑人的，认定为立功\nC✓ 提供司法机关尚未掌握的其他案件犯罪嫌疑人的藏匿地点的，认定为立功\nD✓ 按照司法机关的安排，打电话将其他犯罪嫌疑人约至指定地点的，认定为立功","k":"","kb":41,"kh":[[96,169]]},{"id":"2015-7","y":2015,"t":"单","s":"甲17周岁时因运输毒品被判处3年有期徒刑,刑满释放后不久,又因参加黑社会性质组织贩卖毒品被逮捕。甲属于（ ）。","o":["再犯","初犯","一般累犯","特别累犯"],"a":"A","e":"\u0001犯前罪（运输毒品）时仅17周岁（不满18周岁），即使出狱后成年再实施贩毒，依据第65条第1款仍不构成一般累犯或毒品再犯意义上的成年累犯，属于一般再犯。\u0002\nA✓ 再犯：由于甲犯前罪时\u0001不满18周岁（17周岁）\u0002，不满足《刑法》第65条一般累犯的年龄要求，在刑法上仅成立广义上的“再犯”（注：亦构成《刑法》第356条毒品再犯或普通再犯）\nB✗ 已有前科犯罪经历，显然不是初犯\nC✗ 《刑法》第65条第1款明确除外：“但是过失犯罪和\u0001不满十八周岁的人犯罪的除外\u0002”\nD✗ 《刑法》第66条特别累犯要求前后罪均属危害国家安全、恐怖活动或黑社会性质组织犯罪；甲前罪为运输毒品罪，既非三类特罪且前罪未成年，不成立特别累犯","k":"","kb":52,"kh":[[152,185]]},{"id":"2015-15","y":2015,"t":"单","s":"甲因侵占科研经费被捕。在侦查期间，甲主动供述自己曾和同事一起套取另一科研项目经费19万元用于自己房屋装修。甲供述与他人套取科研经费的行为属于（ ）。","o":["坦白","立功","自首","准自首"],"a":"A","e":"\u0001被动逮捕归案后在侦查期间供述自己和同事套取另一项目经费19万的同种职务侵占/贪污犯罪事实，同种余罪属坦白而非自首或立功。\u0002\nA✓ 坦白：甲因侵占科研经费被捕后供述与他人套取另一科研项目经费的\u0001同种罪行\u0002，同种罪行余罪不成立特别自首，依法认定为坦白\nB✗ 在同种罪行共犯中交代自己与同事的共同犯罪行为属于如实供述自身罪行范畴，不成立立功\nC✗ 被动逮捕归案，不具备自动投案，不成立一般自首\nD✗ 特别自首（准自首）必须供述司法机关还未掌握的本人\u0001不同种罪行\u0002；前后均属于同一套取侵占科研经费性质之罪，不能认定为准自首","k":"","kb":40,"kh":[[130,147],[182,215]]},{"id":"2015-45","y":2015,"t":"多","s":"甲在某学校附近利用“地沟油”生产“食用油”,被刘某举报。甲因此被判处有期徒刑1年,缓刑 2年,同时宣告禁止令。关于该禁止令的适用,正确的有（ ）。","o":["禁止甲接触刘某","禁止甲进入学校","禁止甲从事食用油生产经营行业","禁止令的执行期限从缓刑考验期满之日起计算"],"a":"AC","e":"\u0001适用禁止令时可以禁止缓刑犯接触举报人（刘某）、禁止从事关联食品安全行业；但禁止令不能一刀切禁止进入公共场所如学校，且期限从缓刑执行之日起计算。\u0002\nA✓ 《禁止令规定》明确可禁止被宣告缓刑的犯罪分子在考验期内未经同意接触控告人、批评人、\u0001举报人（刘某）\u0002\nB✗ 甲只是“在学校附近”生产销售地沟油，并非入校犯罪；禁止令一般限制进入中小学校区仅针对侵害未成年人或校园暴力等犯罪，本案与“进入学校”无直接必然关联（且非学校相关犯罪）\nC✓ 甲犯罪正是制售“地沟油”，禁止其从事\u0001食用油生产经营行业\u0002直接对应犯罪原因与行业风险\nD✗ 禁止令的执行期限应从\u0001缓刑考验期（即缓刑执行）开始之日起\u0002计算，而不是从考验期满才开始算","k":"","kb":44,"kh":[[33,51],[327,346]]},{"id":"2016-8","y":2016,"t":"单","s":"甲因涉嫌受贿被逮捕,在受讯问时如实供述了受贿罪行,并举报同监室的一名犯罪嫌疑人企图脱逃,经查证属实。下列选项中,正确的是（ ）。","o":["甲具有自首情节,对其可以从轻处罚","甲具有立功情节,对其可以免除处罚","甲具有坦白情节,对其可以从轻处罚","甲具有重大立功情节,对其应当免除处罚"],"a":"C","e":"\u0001被动逮捕后如实供述受贿罪行属坦白（可以从轻处罚）；举报同室在押犯企图脱逃（脱逃罪法定最高刑5年，未达无期/死刑）属一般立功（可以从轻或减轻，非应当免除）。\u0002\nA✗ 甲系被逮捕归案，缺乏自动投案，亦未交代司法机关未掌握的其他不同种余罪，不成立自首\nB✗ 一般立功的从宽幅度是“可以从轻或者减轻处罚”，不包含“免除处罚”（只有重大立功才“可以减轻或者免除处罚”）\nC✓ 甲具有坦白情节，对其可以从轻处罚：被逮捕后如实供述自己受贿罪行属坦白，依《刑法》第67条第3款\u0001可以从轻处罚\u0002\nD✗ 脱逃罪最高法定刑为五年有期徒刑（即便加情节亦远低于无期徒刑以上），故揭发脱逃只是一般立功，不是重大立功（且重大立功也是“可以”减轻免除而非“应当”）\n从宽用语精准对照：\n- 坦白：可以从轻（避免特别严重后果的，可以减轻）；\n- 一般立功：可以从轻或减轻；\n- 重大立功：可以减轻或免除；\n- 自首：可以从轻或减轻；犯罪较轻的，可以免除。","k":"","kb":40,"kh":[[172,181],[205,215]]},{"id":"2017-10","y":2017,"t":"单","s":"甲因涉嫌抢劫被公安机关逮捕后,主动供述自己曾入户盗窃。甲供述盗窃的行为属于（ ）。","o":["坦白","一般自首","立功","特别自首"],"a":"D","e":"\u0001因抢劫罪被公安机关逮捕后，主动如实供述司法机关尚不知晓的入户盗窃（不同种其他罪行），构成特别自首（准自首）。\u0002\nA✗ 供述司法机关未掌握的本人\u0001不同种罪行\u0002，不再按坦白而升级为特别自首\nB✗ 一般自首的前提是犯罪后尚未被控制时“自动投案”，甲是因抢劫被捕后供述\nC✗ 立功是揭发或协助抓获“他人”犯罪行为，自己交代本人罪行不可能成立立功\nD✓ 特别自首：《刑法》第67条第2款规定，被采取强制措施的犯罪嫌疑人如实供述司法机关还未掌握的本人\u0001其他不同种罪行\u0002（盗窃与抢劫属不同种罪），以自首论","k":"","kb":40,"kh":[[78,129]]},{"id":"2017-11","y":2017,"t":"单","s":"判决宣告前,一人犯数罪,分别被判处有期徒刑的,对于数个有期徒刑的并罚,应采用（ ）。","o":["吸收原则","简单相加原则","并科原则","限制加重原则"],"a":"D","e":"\u0001判决宣告前一人犯数罪均被判处有期徒刑，数个有期徒刑之间的合并处罚原则属于限制加重原则（在最高刑期以上、总和刑期以下，且受20/25年上限约束）。\u0002\nA✗ 吸收原则适用于数罪中有判处死刑或无期徒刑的情形（重刑吸收轻刑）\nB✗ 我国刑法不采用主刑无限简单绝对相加原则（附加刑中同种罚金等采取累加/合并执行，不同主刑与附加刑也有并科）\nC✗ 并科原则主要适用于附加刑或有期徒刑/拘役与管制并罚\nD✓ 限制加重原则：判决宣告前一人犯数罪同属有期徒刑、拘役或管制等同类自由刑时，依《刑法》第69条在\u0001数刑中最高刑期以上、总和刑期以下\u0002酌情决定执行刑期，并受法定封顶限制","k":"","kb":42,"kh":[[50,87]]},{"id":"2017-42","y":2017,"t":"多","s":"下列选项中,属于量刑制度的有（ ）。","o":["累犯","缓刑","自首","假释"],"a":"ABC","e":"\u0001我国刑法中的量刑制度包括累犯、自首、立功、数罪并罚、缓刑；假释属于刑罚执行制度。\u0002\nA✓ 累犯属于影响刑罚裁量的法定从重量刑制度\nB✓ 缓刑是在量刑裁决同时作出的暂缓执行制度，传统刑法体系归入量刑制度\nC✓ 自首属于法定从宽量刑制度\nD✗ 假释与减刑是在监狱刑罚执行阶段根据罪犯悔改立功表现作出的变更，属于\u0001刑罚执行制度\u0002，而非量刑制度","k":"","kb":43,"kh":[[15,36]]},{"id":"2018-42","y":2018,"t":"多","s":"下列选项中,应认定为自首中“自动投案”的有（ ）。","o":["在接受强制戒毒期间,主动向警方交代了自己抢劫他人的事实","因形迹可疑被父母捆绑到派出所后,如实交代了自己杀人的事实","匿名报案后在事故现场接受询问时,向警方交代了自己交通肇事的事实","在涉嫌诈骗被取保候审期间潜逃,途中找警方交代了自己绑架他人的事实"],"a":"ACD","e":"\u0001强制戒毒期间主动交代抢劫、匿名报案后在现场接受询问时交代交通肇事、取保期间潜逃后主动找警方交代绑架，均属自动投案；被父母捆绑送案不属自动投案。\u0002\nA✓ 因吸毒被行政强制戒毒期间，在公安机关尚未掌握情况下主动交代抢劫犯罪，属于\u0001自动投案\u0002\nB✗ “因形迹可疑被父母捆绑到派出所”违背了投案人的主观自愿性（被迫压送，且非本人自觉同意或主动配合报案），司法解释明确此种被亲属强行捆绑送案不认定为自动投案\nC✓ 交通肇事后匿名报警并留在现场等候处理，在民警现场询问时主动交代肇事事实，属于\u0001自动投案\u0002\nD✓ 涉嫌诈骗罪取保候审期间虽曾潜逃，但在潜逃途中主动向警方投案交代尚未掌握的绑架他人罪行，仍属于\u0001自动投案\u0002","k":"","kb":40,"kh":[[302,325]]},{"id":"2020-44","y":2020,"t":"多","s":"自动投案的罪犯的下列行为中,应认定为属于自首中“如实供述自己的罪行”的有（ ）。","o":["供述时对所知的同案犯未作供述的","如实供述行为事实但对行为性质加以辩解的","在司法机关掌握其主要犯罪事实之前主动交代的","供述的身份与真实情况有差别但未影响定罪量刑的"],"a":"BCD","e":"\u0001如实供述主要犯罪事实、对行为性质加以法律辩解、真实身份略有出入但不影响定罪量刑的，均不影响“如实供述”；漏不供述所知同案犯则不成立自首。\u0002\nA✗ 共同犯罪人投案后不仅须交代本人实施的行为，还\u0001必须交代所知的同案犯\u0002共同犯罪事实，否则不算“如实供述”\nB✓ 行为人客观如实供述了行为事实，仅以自己并非专业法律人士而对罪名或罪与非罪性质提出辩解（如辩称正当防卫），\u0001不影响自首成立\u0002\nC✓ 只要在司法机关掌握主要犯罪事实之前主动交代主要犯罪事实，即认定为如实供述\nD✓ 自动投案后虽然在姓名、年龄等具体身份细节上供述略有误差，只要\u0001未影响案件定罪量刑（如不影响刑事责任年龄、累犯身份等认定）\u0002，仍成立自首","k":"","kb":40,"kh":[[253,278],[326,366]]},{"id":"2021-8","y":2021,"t":"单","s":"“数罪中有判处有期徒刑和管制,或者拘役和管制的,有期徒刑、拘役执行完毕后,管制仍须执行。”这一规定体现的并罚原则是（ ）。","o":["并科原则","限制加重原则","加重原则","吸收原则"],"a":"A","e":"\u0001数罪中有判处有期徒刑（或拘役）与管制的，在有期徒刑或拘役执行完毕后管制仍须执行，是将不同种刑罚合并相加执行，体现并科原则。\u0002\nA✓ 并科原则：由于有期徒刑/拘役属于监禁刑而管制属于开放式社区非监禁刑，二者性质不同无法限制加重折算，故在监禁刑执行完毕后管制原封不动另行执行，典型体现\u0001并科原则\u0002\nB✗ 限制加重原则适用于同种自由刑（如数个有期徒刑、数个拘役或数个管制）之间合并\nC✗ “加重原则”并非我国刑法第69条规定的四大并罚基本原则名称\nD✗ 吸收原则适用于死刑/无期徒刑吸收其他主刑，以及有期徒刑吸收拘役（“有期与拘役，只执行有期”）\n记法：跨刑种并罚三句口诀：有期吸拘役（吸收）；有期/拘役加管制（并科）；附加刑同种合并、不同种分别（并科）。","k":"","kb":42,"kh":[[208,233]]},{"id":"2023-12","y":2023,"t":"单","s":"下列情形中,应当认定犯罪嫌疑人自动投案的是","o":["甲在投案途中被公安机关抓获","乙被亲友捆绑后送到司法机关","丙在被取保候审期间逃跑,后主动归案","丁在有关部门发现其车上的犯罪工具后如实供述"],"a":"A","e":"\u0001正在投案途中被公安机关抓获的应当认定为自动投案；被捆绑送案不自动；取保潜逃主动归案未交代逃跑前罪行未明确？注意对比选项B/C/D：C为何错！\u0002\nA✓ 正在投案途中被公安机关抓获：最高法《自首立功解释》第1条明文规定，\u0001“正在投案途中，被公安机关捕获的”\u0002，应当视为自动投案\nB✗ 被亲友“捆绑”后强行送到司法机关，违背犯罪嫌疑人意愿，欠缺投案的自动性，不认定为自动投案\nC✗ 犯罪嫌疑人被取保候审（此前已经归案并接受侦查控制），在取保候审期间逃跑后又自行归案的，不属于最初的“自动投案”（因先前已被采取强制措施且发生逃避审讯行为，司法解释明确\u0001交通肇事外一般取保逃跑再归案若原罪已被掌握且无逃跑前投案之实，不成立自首\u0002；只有原本因其他轻罪或潜逃途中供述未掌握新罪行时才论及新罪自首）\nD✗ 在公安或有关部门已经现场发现其车上的犯罪工具（罪迹已被掌握、即将或正在被盘查抓获）之后才如实供述，属被动交代，不成立自动投案\n最高法解释《关于处理自首和立功具体应用法律若干问题的解释》精确对照：\n1. \u0001投案途中被捕获\u0002 → 视为自动投案；\n2. \u0001被亲友捆绑送案\u0002 → 不视为自动投案；\n3. \u0001在取保候审、监视居住期间逃跑，后主动归案的\u0002 → 原本已经归案（此前已传唤到案并被取保），之后逃跑又回来不成立原罪的自首！","k":"","kb":40,"kh":[[16,39]]},{"id":"2025-20","y":2025,"t":"单","s":"【案情】甲为自己投保了巨额人身保险，之后在网上物色到与自己年龄、体态、样貌相仿的孙某，将其骗至深山后杀人焚尸，但还未开始申领保险金即被公安机关抓获。\n若甲因重大立功减刑后,又犯应判处有期徒刑的新罪,对甲应按照（ ）。","o":["吸收原则决定执行的刑罚","“先并后减”的方法决定执行的刑罚","并科原则决定执行的刑罚","“先减后并”的方法决定执行的刑罚"],"a":"D","e":"\u0001判决宣告以后、刑罚执行完毕以前，服刑人（哪怕此前获减刑）又犯新罪，依法适用《刑法》第71条“先减后并”的方法决定执行刑罚。\u0002\nA✗ 只有犯新罪被判处死刑或者无期徒刑时才产生吸收效果；前罪剩余有期徒刑与后罪有期徒刑之间应采用“先减后并”的限制加重并罚\nB✗ “先并后减”是《刑法》第70条发现\u0001漏罪\u0002（判决宣告前还有其他罪未判）的并罚方法\nC✗ 两个有期徒刑之间适用限制加重原则，而非简单并科原则\nD✓ “先减后并”：判决宣告后、刑罚执行完毕前\u0001又犯新罪\u0002，先把前罪已经执行的刑期（以及依法减去的刑期）从前罪中扣除得出“剩余未执行刑期”，再将剩余刑期与新罪所判刑罚合并，依第69条限制加重并罚","k":"","kb":42,"kh":[[304,380]]},{"id":"2025-44","y":2025,"t":"多","s":"下列选项中,应当认定为自首的有（ ）。","o":["甲交通肇事逃逸后自动投案,如实供述自己的罪行","乙醉驾被现场查获,经允许离开,后主动到案并如实供述自己的罪行","丙致人死亡后自动投案,如实供述自己的罪行但辩称自己的行为属于正当防卫","丁涉嫌窝藏罪被拘传到案后查无实据,主动如实供述组织出卖人体器官的罪行"],"a":"ACD","e":"\u0001交通肇事逃逸后自动投案并如实供述、自动投案如实供述但辩称正当防卫、涉嫌他罪被拘传查无实据后主动交代尚未掌握的另一不同种犯罪，均成立自首。\u0002\nA✓ 司法解释明确规定，交通肇事逃逸后自动投案、如实供述自己罪行的，依法认定为自首（交通肇事逃逸仅影响法定刑升格，不剥夺自首认定）\nB✗ 醉驾在现场被交警\u0001当场查获\u0002属于被动归案，即使事后配合传唤到案也不成立“自动投案”\nC✓ 投案后如实客观陈述致人死亡经过，仅在法律性质上辩称“属于正当防卫”，不影响如实供述与自首的认定\nD✓ 丁因涉嫌窝藏罪被拘传（已被采取强制措施），在司法机关尚未掌握的情况下主动交代了不同种的组织出卖人体器官罪行，成立\u0001特别自首\u0002","k":"","kb":40,"kh":[[104,129],[279,301],[326,344]]},{"id":"2026-3","y":2026,"t":"单","s":"为积极贯彻坦白从宽的立法规定,下列做法正确的是","o":["对如实供述司法机关尚未掌握的同种罪行的被告人认定坦白","对如实供述司法机关尚未掌握的不同种罪行的服刑人员认定坦白","对因坦白避免特别严重后果的犯罪嫌疑人可以免除处罚","对如实供述司法机关尚未掌握的同种罪行的犯罪嫌疑人认定坦白"],"a":"D","e":"\u0001被采取强制措施或归案的犯罪嫌疑人如实供述司法机关尚未掌握的“同种罪行”，成立坦白（非自首）；如实供述不同种余罪才属特别自首。\u0002\nA✗ 在公安侦查及司法机关掌握阶段一般规范表述为主体“犯罪嫌疑人”；但相比D选项，A主体限定在审判阶段“被告人”且往往与实务规范原文有别（按2026真题标准答案唯一指D）\nB✗ 服刑人员主动交代司法机关尚未掌握的\u0001不同种罪行\u0002，依《刑法》第67条第2款成立\u0001特别自首\u0002，而不是坦白\nC✗ 《刑法》第67条第3款明文规定：因其如实供述自己罪行，避免特别严重后果发生的，“\u0001可以减轻处罚\u0002”（不含免除处罚）\nD✓ 对如实供述司法机关尚未掌握的同种罪行的犯罪嫌疑人认定坦白：依据最高法司法解释，犯罪嫌疑人自动投案外归案后如实供述司法机关尚未掌握的\u0001同种罪行\u0002，不成立特别自首，依法以\u0001坦白\u0002论处（同种罪行较重的，一般应当从轻处罚）","k":"","kb":40,"kh":[[182,215],[227,245]]},{"id":"2026-20","y":2026,"t":"单","s":"【案情】甲谎称主审法官是自己的大学同学，骗取当事人家属信任，担任刑事案件辩护人，并收取高额律师费。辩护失败拒不返还。事后查明甲的律师身份系伪造。\n如甲将上述违法所得和其他合法财产共同用于投资,获利巨大。获利所得","o":["不应予以追缴","应全部追缴","应按份额追缴","应责令退赔"],"a":"B","e":"\u0001犯罪分子将违法所得（骗取的高额“律师费”）与个人合法财产混同用于投资所产生的全部巨大收益，属于犯罪孳息，依法应全部予以追缴。\u0002\nA✗ 违法所得产生的投资收益属于非法财物的衍生孳息，绝不允许由犯罪分子保留获利\nB✓ 应全部追缴：依据《最高人民法院关于适用〈中华人民共和国刑事诉讼法〉的解释》及刑法第64条追缴规则，将违法所得与合法财产共同用于投资等经营活动且\u0001混同后无法严格割裂\u0002所产生之全部收益，均属违法所得之孳息与收益，依法\u0001全部追缴\u0002\nC✗ 刑法不允许犯罪分子借混同投资按比例分割获取“非法本金带来的投资红利”，全部收益均应当追缴（合法本金本身依法发还或用于退赔罚金等）\nD✗ 被害人遭受损失的骗取本金应“责令退赔/发还被害人”；题干设问针对“投资获利巨大”之收益部分，超出被害人直接受损本金的暴利增值依法应\u0001全部追缴\u0002上缴国库","k":"","kb":49,"kh":[[214,247]]}]},{"sub":"刑法","name":"犯罪停止形态","w":1.5,"L":27,"qs":[{"id":"2005-7","y":2005,"t":"单","s":"下列哪一种情形,尚不能认为是犯罪行为（ ）。","o":["甲打电话邀约其朋友李某一起去实施抢劫","乙向其朋友赵某表示要杀掉仇人陈某","丙为了盗窃张某家财产,毒死了张某家的看家犬","丁为方便对刘某实施抢劫,对刘某的活动规律进行跟踪调查"],"a":"B","e":"\u0001仅仅用言语向别人流露想杀人的想法，没有实际实施任何准备工具或创造条件的客观行为，属于无社会危害行为的“犯意表示”，不构成犯罪。\u0002\nA✗ 打电话邀约纠集同伙共同实施抢劫，是在为实行抢劫准备同伙力量条件，构成\u0001抢劫罪预备\u0002\nB✓ 乙向其朋友赵某表示要杀掉仇人陈某：仅仅停留在口头思想倾诉层面而无任何制备工具、踩点等实质准备行为，属于法律不处罚的单纯\u0001犯意表示\u0002，尚不构成犯罪\nC✗ 为入室盗窃而先行毒杀看家犬以扫除障碍，属于创造便利条件，构成\u0001盗窃罪预备\u0002\nD✗ 为实施抢劫而跟踪调查被害人活动规律（踩点），是典型制造实行条件，构成\u0001抢劫罪预备\u0002","k":"","kb":36,"kh":[[102,137]]},{"id":"2005-8","y":2005,"t":"单","s":"甲前往乙住所杀乙,到达乙居住地附近,发现周围停有多辆警车,并有警察在活动,感到无法下手,遂返回。甲的行为属于（ ）。","o":["犯罪预备","犯罪中止","犯罪未遂","没有犯罪行为"],"a":"A","e":"\u0001在被害人住处附近守候准备杀人，尚未看到或着手攻击被害人便因警车出现而害怕返回，属于意志以外原因止步于犯罪预备。\u0002\nA✓ 犯罪预备：前往被害人住所附近“蹲点/守候”属于为实施杀人创造条件的\u0001犯罪预备行为\u0002（尚未着手直接加害），因发现警车等意志以外原因被迫返回，成立犯罪预备\nB✗ 甲返回是因为看到周围停着多辆警车、担心被抓感到无法下手，并非基于内心悔悟或惧怕将来惩罚的自动放弃（意志以内），故不成立中止\nC✗ 尚未见到被害人也未开始扣扳机/持刀刺杀等实行行为，尚未着手，故非犯罪未遂\nD✗ 为杀人前往蹲点已经超出内心思想或犯意表示，构成了刑法处罚的预备行为","k":"","kb":36,"kh":[[15,36],[65,101]]},{"id":"2006-25","y":2006,"t":"多","s":"下列表述中,正确的是（ ）。","o":["犯罪预备与犯罪未遂相区别的关键在于是否着手实施刑法分则所规定的犯罪实行行为","犯罪预备与犯罪中止相区别的关键在于是否处于犯罪过程中","犯罪行为实行终了,就不能成立犯罪中止","过失犯罪不存在犯罪未遂形态"],"a":"AD","e":"\u0001犯罪预备与犯罪未遂以“是否着手实施分则实行行为”区分；过失犯罪无未完成形态；预备阶段可成立中止；实行终了在结果发生前亦可成立中止。\u0002\nA✓ 是否已经\u0001着手实施刑法分则所规定的犯罪实行行为\u0002，是区分犯罪预备与犯罪未遂的唯一分水岭\nB✗ 犯罪预备与预备阶段犯罪中止同处于“准备阶段（犯罪过程中）”，区别在于\u0001停止的原因是否出于行为人意志以内自动放弃\u0002，而不是“是否处于犯罪过程中”\nC✗ 实行行为终了后、危害结果出现前，行为人\u0001自动有效地防止犯罪结果发生\u0002的，仍然可以成立犯罪中止（如投毒后立即送医救活）\nD✓ 只有直接故意犯罪才存在犯罪预备、未遂和中止等未完成形态，\u0001过失犯罪（和间接故意犯罪）不存在未遂形态\u0002","k":"","kb":37,"kh":[[15,48],[132,158]]},{"id":"2007-7","y":2007,"t":"单","s":"甲对一公共住宅放火,起火后即离开,但火情立即被他人发现并迅速扑灭。甲的行为属于 （ ）。","o":["放火罪的未遂","放火罪的既遂","放火罪的预备","故意毁坏财物罪的未遂"],"a":"B","e":"\u0001对公共住宅放火，已经起火但被人及时扑灭，因放火罪属于危险犯，只要已经引发足以危害公共安全的独立燃烧即成立放火罪既遂。\u0002\nA✗ 放火罪不以烧毁整栋楼宇或造成人员伤亡实害为既遂标志\nB✓ 放火罪的既遂：放火罪（《刑法》第114条）是\u0001危险犯\u0002，只要引燃对象物脱离点火媒介独立燃烧、产生危害公共安全的现实具体危险状态，即已既遂（事后他人迅速扑灭不逆转为未遂）\nC✗ 已经点火且使住宅“起火”，早就着手并完成了放火行为，不是犯罪预备\nD✗ 放火烧毁“公共住宅”直接危及不特定多数人公共安全，构成放火罪而非单纯的故意毁坏财物罪\n法硕必背各罪既遂标准：\n- \u0001危险犯\u0002（放火、爆炸、投放危险物质等）：只要达到独立燃烧/足以产生公共安全危险即既遂（不要求实际烧毁伤人）；\n- \u0001行为犯\u0002（强奸插、绑架控制、伪证作证完毕）：行为完成即既遂；\n- \u0001结果犯\u0002（故意杀人死、盗窃控制财物）：出现法定结果既遂。","k":"","kb":37,"kh":[[15,48]]},{"id":"2007-25","y":2007,"t":"多","s":"甲用枪射杀乙,乙中弹倒地。甲以为乙已死亡,遂弃“尸”于荒野。实际上,乙只是中弹受伤,并没有死亡。甲的行为属于 （ ）。","o":["实行终了的未遂","未实行终了的未遂","能犯未遂","不能犯未遂"],"a":"AC","e":"\u0001用枪射击乙致其中弹倒地，甲误以为乙已死亡（实行行为已全部实施完毕），实质乙仅受伤未死，属于实行终了的未遂和能犯未遂。\u0002\nA✓ 实行终了的未遂：甲以为开枪致乙倒地已达到杀人目的而弃之离开，从主观认识与客观动作来看，\u0001实现杀人所需的全部实行行为均已做完\u0002\nB✗ 甲并不觉得还需要再补枪，并非行为中途被迫打断的“未实行终了”\nC✓ 能犯未遂：甲使用的是真枪且射中被害人，客观上\u0001完全具有杀害成功的现实可能性\u0002，仅因未击中要害救治生还而未得逞，属能犯未遂\nD✗ 不能犯未遂是因工具绝对失效（如用白糖当砒霜、对尸体开枪）在客观上绝无既遂可能；真枪打中活人显然并非不能犯","k":"","kb":37,"kh":[[72,131]]},{"id":"2008-6","y":2008,"t":"单","s":"下列情形中,属于犯意表示的是（ ）。","o":["甲为非法制造枪支而购买钢管","乙对朋友发誓说要杀死仇人张某","丙发电子邮件邀约朋友参与盗窃","丁向他人发送敲诈财物的短信息"],"a":"B","e":"\u0001对朋友口头放狠话发誓“要杀死仇人张某”，仅止于内心意图向外部流露，未为犯罪准备工具或制造条件，属于无罪的犯意表示。\u0002\nA✗ 为非法制造枪支购买钢管，是为制造犯罪工具所做的准备，属于\u0001犯罪预备\u0002（甚至可能单独构成非法制造枪支预备）\nB✓ 犯意表示：仅仅对朋友口头宣泄杀意发誓，既未购置凶器也未踩点纠集同伙，未造成任何现实危险或实行准备，属于\u0001不处罚的犯意表示\u0002\nC✗ 发电子邮件“邀约朋友参与盗窃”是在积极纠集同伙、组织共同实行犯罪，属于制造犯罪条件的\u0001犯罪预备行为\u0002\nD✗ 向被害人发送敲诈财物的威胁短信，已经直接实施了胁迫索财的实行行为，属于\u0001敲诈勒索罪的着手（未遂）\u0002","k":"","kb":36,"kh":[[102,137]]},{"id":"2008-9","y":2008,"t":"单","s":"区别犯罪预备与犯罪未遂的关键于行为人是否着手实施了（ ）。","o":["有助于犯罪既遂的行为","有助于实现犯罪目的的行为","有助于犯罪结果发生的行为","刑法分则规定的犯罪实行行为"],"a":"D","e":"\u0001“是否着手实行刑法分则规定的犯罪实行行为”是划分犯罪预备与犯罪未遂的根本界限。\u0002\nA✗ 磨刀、踩点也有助于犯罪既遂，但那些仍停留在预备阶段，关键看是否进入分则构成要件实行行为\nB✗ 实现犯罪目的的辅助行动在预备阶段就可能大量存在，不能作为着手分水岭\nC✗ 预备行为同样有助于推进结果发生，不能区分预备与未遂\nD✓ 刑法分则规定的犯罪实行行为：行为人只有开始实施\u0001刑法分则具体条文所描述的实行行为\u0002，产生法益侵害紧迫直接危险时，才算“着手”进入实行阶段","k":"","kb":36,"kh":[[65,80]]},{"id":"2008-10","y":2008,"t":"单","s":"下列情形中,属于犯罪未遂的是（ ）。","o":["甲持匕首在张三每天下夜班经过的路口守候,准备杀死张三,但张三当夜没有出现在这一地点","乙携带匕首乘坐出租车,准备对出租车司机进行抢劫,因形迹可疑,出租车司机将车开进了派出所将其抓获","丙非法购进两支手枪还未来得及出卖即被抓获","丁为抢劫李四钱财,假装劝酒将李四灌醉,没来得及取走李四财物,因被李四的妻子发现而慌忙逃走"],"a":"D","e":"\u0001已实施抢劫方法行为（将李四灌醉），仅在取财阶段被其妻子发现逃走，属于已经着手抢劫但因意志以外原因未得逞的犯罪未遂。\u0002\nA✗ 在受害人经过的路口守候蹲点尚未碰到被害人，未着手实行杀人，属于\u0001犯罪预备\u0002\nB✗ 仅乘出租车怀揣匕首意图抢劫，尚未拔刀威胁或控制司机，出租车直接开去派出所，属于\u0001犯罪预备\u0002\nC✗ 非法买卖枪支罪只要购进或卖出行为一完成即成立\u0001犯罪既遂\u0002（不以再转卖出去为既遂条件）\nD✓ 犯罪未遂：假装劝酒将李四灌醉是抢劫罪“以其他方法使被害人不知反抗”的\u0001方法行为（已经着手）\u0002，后因妻子发现被吓跑而未劫得财物，构成抢劫罪未遂","k":"","kb":37,"kh":[[15,48]]},{"id":"2009-10","y":2009,"t":"单","s":"下列关于犯罪既遂的说法中,错误的是（ ）。","o":["对犯罪既遂,按照刑法分则条文规定的法定刑处罚","犯罪既遂的法律标准是行为人的行为具备刑法分则所规定的基本犯罪构成的全部要件","行为人没有实现犯罪的预期目的.也可以成立犯罪既遂","只要出现犯罪结果就构成犯罪既遂"],"a":"D","e":"\u0001犯罪既遂的判断标准是行为人的行为完整齐备了刑法分则规定的特定基本犯罪构成全部要件，并非任何罪名都需要“出现实害结果”。\u0002\nA✗ 犯罪既遂直接依照分则条文法定刑裁量，表述正确，故不选\nB✗ 我国刑法理论判断既遂的统一标准正是“犯罪构成要件齐备说”，表述正确，故不选\nC✗ 既遂不看行为人内心期待是否全部落袋，只要符合构成要件即可（如盗窃拿到即既遂，即使没卖到预期高价也既遂），表述正确，故不选\nD✓ 错误（正选）：许多犯罪（如\u0001危险犯、行为犯、举动犯\u0002）的既遂并不要求发生实际的物质性实害结果，而且有时出现伤害结果但如果分则要求死亡（如故意杀人），仅伤未死也仍是未遂","k":"","kb":37,"kh":[[15,48]]},{"id":"2009-11","y":2009,"t":"单","s":"下列行为中,已经着手实行犯罪的是（ ）。","o":["甲为劫财而将受害人骗到预定地点","乙为劫财而埋伏在阴暗处等候被害人出现","丙为劫财而在被害人饮料中投放麻醉药","丁为劫财而购买了一把匕首"],"a":"C","e":"\u0001为劫财而在被害人饮料中投放麻醉药，已经开始实施抢劫罪使被害人不知/不能反抗的强制方法行为，即已“着手”实行抢劫犯罪。\u0002\nA✗ 将受害人骗到预定地点尚未进行暴力胁迫或麻醉侵害，仅在为抢劫创造条件，属\u0001犯罪预备\u0002\nB✗ 在阴暗处埋伏守候被害人出现，尚未对被害人人身着手控制或施暴，属\u0001犯罪预备\u0002\nC✓ 已经在饮料中投放麻醉药：向被害人饮品投放麻醉药物直接危害被害人人身意志自由并随时导致丧失反抗能力，属于开始实施抢劫罪\u0001“其他方法”实行行为（已着手）\u0002\nD✗ 购买作案工具匕首属于典型的准备工具，属\u0001犯罪预备\u0002","k":"","kb":37,"kh":[[15,23]]},{"id":"2009-13","y":2009,"t":"单","s":"下列关于犯罪中止的说法中,正确的是（ ）。","o":["犯罪中止可以发生在预备犯罪过程中","犯罪中止只能发生在着手实行犯罪以后","犯罪中止只能发生在犯罪行为实行终了以前","出现了损害结果就不能成立犯罪中止"],"a":"A","e":"\u0001犯罪中止既可以发生在预备阶段，也可以发生在实行过程中及实行终了结果出现前，只要求“在犯罪过程中”自动放弃或有效防止结果。\u0002\nA✓ 可以发生在预备犯罪过程中：《刑法》第24条的“在犯罪过程中”涵盖\u0001预备阶段\u0002和实行阶段全过程\nB✗ 犯罪中止在预备阶段同样可以成立（如买好毒药后自动倒掉放弃）\nC✗ 犯罪行为实行终了后但犯罪结果尚未发生时，自动有效地防止结果发生（如毒发后主动送医抢救成功）依然成立中止\nD✗ “造成损害的中止犯应当减轻处罚”恰恰证明中止犯\u0001可以出现一定损害结果\u0002（只要该结果不是构成要件的最终既遂结果，如杀人造成轻伤后自动停手）","k":"","kb":38,"kh":[[15,50],[86,126]]},{"id":"2010-5","y":2010,"t":"单","s":"下列情形中,属于犯罪预备的是（ ）。","o":["甲买回剧毒农药企图杀害妻子,后念及妻子多年情分,悄悄将农药处理掉了","乙以出卖为目的买到一婴儿,但尚未出手即被抓获","丙尾随从银行取款出来的刘某意图抢劫,在小区人口处被保安阻拦","丁乘某女不备,将其扑倒,意图强奸,却被该女制服"],"a":"C","e":"\u0001尾随从银行取款出来的被害人意图抢劫但在进入小区门口时即被保安拦截，尚未动手抢劫便被意志以外因素截停，成立犯罪预备。\u0002\nA✗ 买回农药后自行悄悄处理掉，是预备阶段的\u0001犯罪中止\u0002（意志以内自动放弃）\nB✗ 以出卖为目的购买婴儿，一旦收买控制婴儿就已构成拐卖儿童罪的\u0001犯罪既遂\u0002（拐卖儿童罪包含“收买”且控制即既遂）\nC✓ 犯罪预备：丙仅仅实施“尾随”这一为抢劫创造接近被害人条件的行为，尚未开始暴力或胁迫抢夺财物，被小区保安拦停属于意志以外原因未着手，成立\u0001犯罪预备\u0002\nD✗ 扑倒女方意图强奸已被反抗制服，属于已着手实行犯罪因意志以外原因未得逞的\u0001犯罪未遂\u0002","k":"","kb":36,"kh":[[15,36],[65,101]]},{"id":"2011-41","y":2011,"t":"多","s":"下列行为中,属于犯罪未遂的有（ ）。","o":["甲在发表分裂国家的演讲时,被群众扭送到公安机关","乙为制造列车倾覆事故,在轨道上安装了脱轨装置,该装置被巡道工及时拆除","丙欲杀害张某,用猎枪射击骑马的张某后即逃走,结果将马打死,造成张某轻伤","丁正在撬保险柜时,某同伙打来电话,告知该保险柜中没有值钱的东西,丁便离去"],"a":"CD","e":"\u0001朝被害人开枪仅伤及马死人轻伤逃跑、撬保险柜时听说柜内空无一物而停手，均属已着手实施且因意志以外原因未得逞的犯罪未遂。\u0002\nA✗ 煽动分裂国家罪属于\u0001举动犯（行为犯）\u0002，在公共场所发表分裂国家演讲之时行为即告完成，成立\u0001犯罪既遂\u0002\nB✗ 破坏交通设施罪是\u0001具体危险犯\u0002，在轨道上安装足以使列车倾覆的脱轨装置即告危害公共安全之危险形成，巡道工拆除前已成立\u0001犯罪既遂\u0002\nC✓ 犯罪未遂：丙开枪欲杀张某却仅打死马、造成张某轻伤后逃走，意志以外原因（枪法偏差）致未杀死，成立故意杀人罪\u0001未遂\u0002\nD✓ 犯罪未遂：丁正在撬保险柜却因“内部根本没有钱物”这一客观对象不存在的意志以外原因（无法得逞）而离开，成立盗窃罪\u0001未遂\u0002\n特别易错对比（未遂 vs 中止）：\n如果犯罪分子在盗窃时被同伙告知“里面只有几张废纸/没值钱东西”而离开，之所以放弃是因为\u0001客观上没财物可偷（欲取而不能，属意志以外原因）\u0002，故定\u0001盗窃未遂\u0002而非中止！","k":"","kb":37,"kh":[[15,48]]},{"id":"2012-13","y":2012,"t":"单","s":"甲得知某单位财务室的保险柜中有10万元工资款将于次日发放,遂携工具深夜潜入财务室撬保险柜。因保险柜十分坚固,甲用了3个小时都没有撬开,便离开。甲的行为属于（ ）。","o":["未实行终了的中止","实行终了的中止","能犯未遂","不能犯未遂"],"a":"C","e":"\u0001深夜潜入撬保险柜3小时因保险柜极其坚固始终撬不开而放弃离开，客观上有工资款（能犯）却因障碍撬不开，属能犯未遂。\u0002\nA✗ 放弃并非内心不忍，而是竭尽全力撬3个小时依然“打不开”这一意志以外的客观阻力\nB✗ 理由同上，停止原因系客观撬不开（意志以外），非自动中止\nC✓ 能犯未遂：财务室保险柜内\u0001确实装有10万元工资款\u0002，该盗窃行为本来存在得逞可能，只因保险柜过于坚固撬不开而未能窃得，属能犯未遂\nD✗ 如果保险柜本来就是空的（或偷空枪），才可能是对象不能犯未遂；保险柜有10万现金只是防撬牢固，属能犯未遂","k":"","kb":37,"kh":[[106,131]]},{"id":"2015-3","y":2015,"t":"单","s":"甲欲杀死赵某,掐赵某脖子致其休克后,甲以为赵某死亡,将其投入河中,赵某溺水而亡。甲的行为构成（ ）。","o":["故意伤害罪(致人死亡)","过失致人死亡罪","故意杀人罪(未遂)","故意杀人罪(既遂)"],"a":"D","e":"\u0001以为把被害人掐死而抛尸入河致其实际溺水身亡（事前故意/因果关系错误），在故意杀人罪同一生命构成要件内因果进程相当，成立故意杀人罪既遂。\u0002\nA✗ 行为人自始就是想杀人，只是误以为前一步已杀死而抛尸，不存在转为仅故意伤害之问题\nB✗ 过失致人死亡会不合理割裂行为人杀人故意与死亡结果的直接联系\nC✗ 甲客观上已把被害人置于死地（死亡结果正源于甲自身投河动作），成立既遂而非未遂\nD✓ 故意杀人罪（既遂）：属于因果关系错误中的\u0001事前故意（韦伯的事前故意）\u0002，第一行为与第二抛尸行为处于同一概括杀人意图或合乎常规发展进程之中，杀人结果可归责于甲，定故意杀人罪既遂","k":"","kb":27,"kh":[[71,77]]},{"id":"2015-12","y":2015,"t":"单","s":"甲男将女同事汪某骗至宾馆,要求与之发生性关系,否则在网上散布汪某的不雅照。汪某对甲破口大骂,甲觉得无趣,遂打消奸淫念头离去。甲的行为属于（ ）。","o":["犯罪预备","犯罪未遂","犯罪中止","犯罪既遂"],"a":"C","e":"\u0001试图逼迫女同事发生性关系，遭对方破口大骂后“觉得无趣”自主打消奸淫念头离去（当时尚可强行继续），属于自动放弃犯罪的犯罪中止。\u0002\nA✗ 甲以泄露不雅照为威胁要求发生性关系，已经开始实施强奸罪的胁迫实行行为，进入实行阶段\nB✗ 女同事仅仅是“破口大骂”，在密闭宾馆房间内并不足以对甲构成强力物理阻止（客观上甲仍可继续强奸），甲是因为“觉得无趣”心理丧失兴致而放弃，应认定为意志以内的自动放弃\nC✓ 犯罪中止：能够继续实施却因主观上觉得没意思而自动放弃实行，具备时间性、自动性与彻底性，成立强奸罪\u0001犯罪中止\u0002\nD✗ 尚未发生性关系，远未达到强奸罪既遂","k":"","kb":38,"kh":[[15,50]]},{"id":"2016-5","y":2016,"t":"单","s":"甲在丈夫的水杯中投毒，意图杀害丈夫，丈夫中毒后呕吐不止，甲见状不忍，将丈夫送到医院，使之得救。甲的行为属于（ ）。","o":["犯罪预备","犯罪未遂","犯罪中止","犯罪既遂"],"a":"C","e":"\u0001投毒杀夫并见丈夫中毒呕吐后，于心不忍主动送医救活，属于在实行行为终了后危害结果发生前自动有效防止结果发生的犯罪中止。\u0002\nA✗ 已在水杯中投毒且丈夫喝下中毒，早已超越准备阶段而进入实行完毕状态\nB✗ 丈夫最终脱险是由甲主动送医抢救所致，完全符合行为人意志，并非意志以外的原因\nC✓ 犯罪中止：犯罪实行行为虽然已经终了，但在死亡结果发生前，甲因不忍而\u0001自动、有效地将丈夫送医救活\u0002，成立故意杀人罪犯罪中止\nD✗ 被害人获救未死，故意杀人罪结果未发生，不构成既遂","k":"","kb":38,"kh":[[15,50],[112,126]]},{"id":"2016-19","y":2016,"t":"单","s":"甲误将黄色染料当硫黄,制造了“炸弹”,并投掷到邻居刘某家,意图杀死刘某,但“炸弹”未能爆炸, 刘家五口人安然无恙。甲的行为应认定为（ ）。","o":["投放虚假危险物质罪(既遂)","故意杀人罪(未遂)","爆炸罪(未遂)","投放危险物质罪(未遂)"],"a":"C","e":"\u0001误把黄色染料当硫黄制作炸弹并投掷到邻居家庭院（住宅区）意图报复未爆，危及公共安全（邻居五口人及周边），属爆炸罪不能犯未遂。\u0002\nA✗ 投放虚假危险物质罪要求主观明知是虚假物质并故意投放引起社会恐慌；甲主观上是想真制造真爆炸\nB✗ 把炸弹扔进住有多人的邻居家中（潜在危机波及不特定多数人及周边住宅公共安全），即使主观针对特定人，客观上侵害的是\u0001公共安全法益\u0002，应定爆炸罪而非单纯故意杀人罪\nC✓ 爆炸罪（未遂）：甲主观意欲实施爆炸、客观投掷了自制“炸弹”，危害了公共安全（虽针对刘某但家有五口且地处居住区），因误用原料染料（工具不能犯）未爆炸未得逞，成立\u0001爆炸罪未遂\u0002\nD✗ 甲意在通过瞬间“爆炸”摧毁杀人而非散布毒害性/放射性物质，罪名是爆炸罪而非投放危险物质罪","k":"","kb":37,"kh":[[106,131]]},{"id":"2019-16","y":2019,"t":"单","s":"甲意图杀死范某,持刀潜伏在范某家门口树林里,久等未见范某归来,因惧怕受到法律惩罚,弃刀回家。甲的行为应认定为（ ）。","o":["犯罪预备","犯罪中止","犯罪未遂","不构成犯罪"],"a":"B","e":"\u0001持刀潜伏在范某门前树林久等未归，因为惧怕法律惩罚而主动弃刀回家，属预备阶段自动放弃的犯罪中止。\u0002\nA✗ 甲并不是因为遭遇警察巡逻或绝对等不到人被迫返回，而是因为“惧怕受到法律惩罚”在内心犹豫权衡后\u0001主动放弃\u0002\nB✓ 犯罪中止：尚处于潜伏守候的预备阶段，仅因内心顾忌法律制裁而自我唤醒良知弃刀撤回（能继续而不继续），成立\u0001预备阶段的犯罪中止\u0002\nC✗ 尚未见到被害人、未动手刺杀，未进入实行阶段\nD✗ 先前的持刀埋伏已经构成故意杀人罪预备行为，后续中止属于故意杀人罪中止（只是没有造成损害应当免除处罚，但仍属有罪的犯罪形态）","k":"","kb":38,"kh":[[57,71],[86,99]]},{"id":"2021-2","y":2021,"t":"单","s":"下列对于犯罪形态的理解中,正确的是","o":["自动放弃重复侵害行为的,应认定为犯罪既遂","准备用于预备行为的工具的,应认定为犯罪预备","间接故意犯罪可以存在未遂形态","在犯罪预备阶段可以成立犯罪中止"],"a":"D","e":"\u0001犯罪中止在预备阶段和实行阶段均可成立；自动放弃重复侵害属中止；工具准备属预备；间接故意与过失无未遂。\u0002\nA✗ 杀伤被害人后尚能继续致死却心软主动放弃重复侵害行为、未死成功的，成立\u0001犯罪中止\u0002（而非犯罪既遂）\nB✗ “准备用于\u0001实行犯罪\u0002的工具”才是犯罪预备，准备“用于预备行为”的工具尚未进入犯罪实行预备阶段（或者仅为更前期的日常器具筹备）\nC✗ 间接故意对结果持放任态度而无明确追求目标，未造成结果不构成任何犯罪，因此\u0001不存在未遂形态\u0002\nD✓ 在犯罪预备阶段可以成立犯罪中止：只要在预备工具、制造条件期间自动放弃继续实施犯罪，即可成立\u0001预备中止\u0002","k":"","kb":38,"kh":[[86,99]]},{"id":"2021-5","y":2021,"t":"单","s":"甲欲杀乙,将毒药掺入乙饭后服用的药物中, 乙服药后呕吐不止,甲于心不忍,将乙送到医院抢救, 乙脱离危险。经查,乙呕吐的原因为食物中毒。甲的行为成立（ ）。","o":["犯罪未遂","犯罪既遂","犯罪预备","犯罪中止"],"a":"D","e":"\u0001误将食物中毒呕吐当作自己下的毒已发挥致命药效，因怜悯送医抢救使乙脱险（虽实际投毒尚未起效或未毒发），只要主观以为己能造成既遂而积极挽救，成立犯罪中止。\u0002\nA✗ 甲客观上确实把毒药掺进了饭后药物中且乙也实际吞服（并非不可挽回的纯不能犯，或者甲真心以为中毒是自己所下毒药使之呕吐而真诚积极抢救阻止死亡），学理与真题认定其具有自动有效性，优先成立更有利的犯罪中止\nB✗ 乙在甲积极救治下脱离生命危险未死，未达到故意杀人罪既遂\nC✗ 已经下毒并被乙吃下，早就越过准备阶段\nD✓ 犯罪中止：甲在投毒后处于对被害人的怜悯，主观以为危险由自己下毒引起且\u0001积极主动送医抢救并最终保障乙生还\u0002，体现自动放弃与有效防止结果发生，成立犯罪中止","k":"","kb":38,"kh":[[15,50]]},{"id":"2022-5","y":2022,"t":"单","s":"甲以出卖为目的中转被拐卖的儿童张某,其间,张某摆脱甲的控制逃跑,甲因腿伤未加追赶。甲的行为应认定为","o":["犯罪既遂","犯罪未遂","犯罪预备","犯罪中止"],"a":"A","e":"\u0001以出卖为目的“中转”被拐卖儿童并控制期间，儿童摆脱控制逃跑，因为拐卖妇女儿童罪只要对被害人实现“实际控制”即已既遂，故成立犯罪既遂。\u0002\nA✓ 犯罪既遂：拐卖妇女、儿童罪中无论是拐骗、收买、接送还是\u0001中转\u0002，只要行为人已经达到对被拐儿童的\u0001实际控制程度即构成既遂\u0002；后续被拐儿童逃跑不影响既遂成立\nB✗ 甲已经成功接手并中转实际控制了张某，不能因为之后张某自行逃脱而溯及改判未遂\nC✗ 甲已实质实施中转控制行为，超越预备阶段\nD✗ 甲因腿伤未追赶既不具有“自动性”，且该罪本身早已在控制完成时既遂，既遂之后不可能再中止","k":"","kb":38,"kh":[[128,140],[192,217]]},{"id":"2022-19","y":2022,"t":"单","s":"【案情】甲（15周岁）深夜闯入临街店铺意图行窃，被留下理货的店主（系聋哑人）发现。\n假设二：甲抽下腰带将店主捆住，在店内翻找现金未果，悻悻离开，甲的行为属于（ ）。","o":["实质数罪","犯罪未遂","入户实施犯罪","携带凶器实施犯罪"],"a":"B","e":"\u0001为劫财捆住店主翻找现金未果离开，捆绑行为是抢劫罪手段吸收为抢劫一罪，因未翻到钱属意志以外原因未得逞，成立犯罪未遂（抢劫未遂）。\u0002\nA✗ 为了便于抢劫而用腰带捆绑被害人，非法拘禁行为是抢劫罪方法手段的当然吸收部分，只定抢劫一罪（处断的一罪/法条竞合或吸收，非实质数罪）\nB✓ 犯罪未遂：已经采取捆绑暴力的抢劫实行手段（且已着手），因店内未搜到现金而未能劫得财物离开，属于因意志以外原因未得逞的\u0001抢劫罪未遂\u0002\nC✗ 案情注明闯入的是\u0001“临街店铺”\u0002且店主仅临时留下理货而非日常生活起居住宅，不符合刑法“入户抢劫”之“户”的特征\nD✗ 日常系在裤上的普通腰带并非为实施犯罪专门携带的凶器，亦非管制刀具等国家禁止携带器械，不认定为“携带凶器抢夺/抢劫”","k":"","kb":37,"kh":[[15,48]]},{"id":"2022-42","y":2022,"t":"多","s":"下列对于犯罪既遂的认定,不正确的有","o":["只有导致被害人死亡才能认定遗弃罪既遂","只有导致被害人死亡才能认定绑架罪既遂","只有造成财物被烧毁才能认定放火罪既遂","只有窃得公私财物数额较大才能认定盗窃罪既遂"],"a":"ABCD","e":"\u0001遗弃罪达情节恶劣即既遂、绑架罪实力控制被害人即既遂、放火罪独立燃烧危及公共安全即既遂、盗窃罪控制财物（哪怕未达数额较大如入户/扒窃/多次/携凶）即既遂。\u0002\nA✓ 错误表述（应选）：遗弃罪只要达到“情节恶劣”程度即可既遂，并不以导致被害人死亡为既遂要件（遗弃致人死亡通常另定或属重后果）\nB✓ 错误表述（应选）：绑架罪属于\u0001行为犯/持续犯\u0002，只要实际绑架并实力控制了人质就成立既遂，不要求必须导致被害人死亡或获得赎金\nC✓ 错误表述（应选）：放火罪属于\u0001危险犯\u0002，只要点火引起独立燃烧、产生危害公共安全的现实危险即告既遂，不要求造成财物实际烧毁\nD✓ 错误表述（应选）：除“数额较大”外，\u0001入户盗窃、携带凶器盗窃、扒窃、多次盗窃\u0002即使未盗得数额较大财物，只要窃得财物（甚至入户盗窃取得财物控制）亦可成立盗窃罪既遂","k":"","kb":37,"kh":[[15,48]]},{"id":"2024-2","y":2024,"t":"单","s":"犯罪预备行为与犯罪实行行为的实质区别在于（ ）。","o":["是否违反行政法等前置法","是否直接侵害犯罪客体","是否基于实施犯罪的故意","是否可以对其进行防卫"],"a":"B","e":"\u0001为什么准备砍刀（预备）不是直接砍人（实行）？犯罪预备行为与犯罪实行行为的实质区别在于“实行行为直接侵害刑法分则设定的犯罪客体”，而预备行为只为实现直接侵害创造条件。\u0002\nA✗ 部分预备行为（如非法购买管制刀具、盗窃作案车牌）同样可能违反行政法等前置法，甚至有些实行行为（如非法侵入住宅）最初就是违背民法/治安法，有无违反前置法不是二者实质区分\nB✓ 是否直接侵害犯罪客体：预备行为只是为未来侵害客体准备工具、踩点制造便利条件，本身尚不足以现实直接破坏/威胁具体法益；而一旦进入\u0001实行行为\u0002阶段，便对犯罪构成保护的\u0001犯罪客体造成了直接紧迫现实侵害\u0002\nC✗ 犯罪预备和犯罪实行（在直接故意未完成形态讨论中）全都是基于同一实现犯罪的直接故意\nD✗ 对已经形成紧迫危险或即将过渡为实行的部分严重犯罪预备行为（如带炸药包已在潜入路上），客观紧迫危险下亦可能允许正当防卫，且可否防卫是由法益紧迫性决定的外在后果而非二者本体结构区别","k":"","kb":89,"kh":[[62,88]]},{"id":"2024-20","y":2024,"t":"单","s":"【案情】甲趁女友肖某不备，将事先购买的安眠药放入其水杯中，肖某喝水后不久开始意识模糊，甲与肖某发生性关系，在此过程中，甲发现肖某呼吸衰弱，不断呕吐，遂拨打120呼叫救护车。\n如果肖某经抢救转危为安,甲的行为应认定为（ ）。","o":["犯罪预备","犯罪未遂","犯罪中止","犯罪既遂"],"a":"D","e":"\u0001迷奸女友肖某并已实际发生性关系（强奸罪已然既遂），随后发现其呼吸衰弱呕吐而呼救使其脱险，既遂后不能再成立强奸罪中止，应定强奸罪既遂。\u0002\nA✗ 甲已实施投放安眠药并发生性关系，远远超越预备阶段\nB✗ 强奸罪的既遂标准是男女发生性接触（插入说），题干写明\u0001“甲与肖某发生性关系”\u0002，强奸罪构成要件已齐备\nC✗ 犯罪一旦进入\u0001既遂状态\u0002，就不可能再向后逆转为犯罪中止；甲拨打120救治仅仅有效防止了“致人死亡”加重结果的发生，而不改变强奸罪已经既遂的性质\nD✓ 犯罪既遂：甲趁肖某饮用混有安眠药的水意识模糊时\u0001与之发生了性关系\u0002，强奸罪已达既遂；此后救助脱离生命危险，仅作避免死亡加重结果之量刑考量，强奸罪仍定犯罪既遂","k":"","kb":38,"kh":[[128,140],[192,217]]},{"id":"2025-42","y":2025,"t":"多","s":"下列关于犯罪着手的理解,正确的有（ ）。","o":["未能着手实行犯罪是犯罪预备的成立条件","不法侵害的开始与犯罪的着手未必相一致","原因行为的着手即是原因自由行为的着手","教唆犯的着手应以被教唆人的着手为前提"],"a":"AB","e":"\u0001未能着手实行犯罪是犯罪预备的成立条件之一；因行为方式与损害出现存在时空分离（如邮寄毒药），不法侵害的开始与犯罪的着手未必同步。\u0002\nA✓ 《刑法》第22条决定“为了犯罪，准备工具、制造条件”而\u0001“尚未着手实行犯罪”\u0002正是犯罪预备区别于犯罪未遂的必要成立条件\nB✓ 犯罪的着手是实行行为开始（如投递毒药包裹或设下陷阱）；而不法侵害对法益产生紧迫实际作用可能滞后于收件拆封之时，二者\u0001未必完全重合一致\u0002\nC✗ 在原因自由行为（如故意醉酒后实施杀人）中，自陷无责任能力状态的饮酒动作只是“原因行为”，并非杀人罪本身的\u0001实行着手\u0002（须持刀行凶时才算杀人着手）\nD✗ 在教唆犯与实行犯的共犯关系中，教唆犯自身若成立实行形态下的犯意引发责任或预备/未遂从属判定，原则上教唆之罪能否进入实行阶段要看\u0001被教唆人是否着手实行\u0002（该表述将顺序说反了）","k":"","kb":36,"kh":[[65,80]]}]},{"sub":"刑法","name":"犯罪主体","w":1.4,"L":24,"qs":[{"id":"2005-5","y":2005,"t":"单","s":"尚未完全丧失辨认或者控制能力的精神病人,实施严重危害社会行为的（ ）。","o":["不负刑事责任","应当负刑事责任,但应当减轻或者免除处罚","应当负完全的刑事责任","应当负刑事责任,但可以从轻或者减轻处罚"],"a":"D","e":"\u0001限制刑事责任能力的精神病人（尚未完全丧失辨认或者控制自己行为能力）犯罪，应当负刑责，但可以从轻或者减轻处罚。\u0002\nA✗ 完全丧失辨认或者控制能力且经法定程序鉴定的精神病人才不负刑事责任\nB✗ 法条规定是“\u0001可以\u0002从轻或者减轻处罚”，而非“应当减轻或者免除处罚”\nC✗ 限制刑事责任能力人应当负刑责，但享有“可以从轻或者减轻处罚”的法定从宽条款，并非与正常人毫无区别\nD✓ 《刑法》第18条第3款原文：尚未完全丧失辨认或者控制自己行为能力的精神病人犯罪的，\u0001应当负刑事责任，但是可以从轻或者减轻处罚\u0002\n《刑法》第18条精神病人与盲聋哑人对比：\n- 尚未完全丧失能力精神病人：应当负刑责，但\u0001可以从轻或者减轻处罚\u0002；\n- 又聋又哑的人或盲人：可以从轻、减轻\u0001或者免除\u0002处罚（多一档“免除”）。","k":"","kb":30,"kh":[[101,148]]},{"id":"2005-20","y":2005,"t":"单","s":"下列哪一选项最恰当地指明了伪证罪的主体范围（ ）。","o":["证人","证人、鉴定人","证人、鉴定人、记录人","证人、鉴定人、记录人、翻译人"],"a":"D","e":"\u0001《刑法》第305条明文限定伪证罪主体为刑事诉讼中的证人、鉴定人、记录人、翻译人。\u0002\nA✗ 仅包含证人不完整，遗漏了其余三类诉讼参与人\nB✗ 遗漏了记录人与翻译人\nC✗ 遗漏了翻译人\nD✓ 证人、鉴定人、记录人、翻译人：刑事诉讼中负有如实作证/鉴定/记录/翻译义务的四类特定人员，缺一不可\n记法：伪证罪四大主体记忆：“见（鉴）证翻（译）记（录）”，仅限刑事诉讼中。","k":"","kb":33,"kh":[[107,137]]},{"id":"2006-22","y":2006,"t":"多","s":"下列表述中，正确的是（ ）。","o":["甲盗走铁路上钢轨 10 米,因铁路巡道员发现钢轨被盗,采取紧急措施,才避免了火车颠覆事故的发生。对甲按照破坏交通设施罪的既遂适用法律","乙为一 15 周岁的未成年人,绑架他人作为人质后,因勒索财物未成而杀害被绑架人,应当追究乙的刑事责任","丙是某国有仓库保管员,利用职务之便,盗窃其保管的物资价值 2 万元。后听说单位要来盘点物资,担心事发, 遂将所盗物资送回仓库,丙的行为成立犯罪中止","丁设立一家公司，专门用于虚开增值税专用发票，谋取非法利益。对此虚开增值税专用发票的行为，应当按照自然人犯罪处理"],"a":"ABD","e":"\u0001破坏交通设施罪属危险犯，拆钢轨达危险即既遂；15岁杀害被绑架人按故意杀人罪追责；专门用于虚开发票而设公司按自然人犯罪处理。\u0002\nA✓ 破坏交通设施罪是\u0001具体危险犯\u0002，盗走铁轨10米已使火车发生倾覆、毁坏的现实危险（巡道员紧急排除亦不影响），构成既遂\nB✓ 15周岁（已满14不满16周岁）虽不因单纯绑架罪负刑责，但杀害被绑架人成立\u0001故意杀人罪\u0002，属八种重罪范围，依法应当追责\nC✗ 国有仓库保管员利用职务便利盗窃2万元，\u0001贪污罪/盗窃罪已经既遂\u0002；事后害怕盘点退回赃物属“退赃”量刑情节，不再成立犯罪中止\nD✓ 个人为进行违法犯罪活动而设立的公司、或者公司设立后以实施犯罪为主要活动的，\u0001不以单位犯罪论处\u0002，按自然人犯罪处罚","k":"","kb":31,"kh":[[167,234]]},{"id":"2008-1","y":2008,"t":"单","s":"下列行为中,已满 14 周岁不满 16 周岁的人应当负刑事责任的是（ ）。","o":["故意伤害致人重伤或者死亡、强奸、抢劫、拐卖儿童","强奸、抢劫、抢夺、放火、爆炸","强奸、抢劫、贩卖毒品、放火、爆炸","抢劫、绑架、放火、爆炸"],"a":"C","e":"\u0001已满14周岁不满16周岁的人仅对“烧杀淫掠、伤爆毒投”（八类严重犯罪）负刑事责任。\u0002\nA✗ 拐卖儿童罪不在14—16周岁承担刑事责任的八种犯罪之列\nB✗ 抢夺罪（非暴力抢劫）不在14—16周岁负刑责范围内\nC✓ 强奸、抢劫、贩卖毒品、放火、爆炸：五项均严格属于《刑法》第17条第2款列举的八类罪行\nD✗ 绑架罪不在14—16周岁负刑责的八种犯罪中（仅在绑架过程中故意杀人/重伤人时按故意杀人/故意伤害罪负责）\n记法：14–16岁八大罪口诀：“烧（放火）杀（故意杀人）淫（强奸）掠（抢劫），伤（故意伤害致重伤或死亡）爆（爆炸）毒（贩卖毒品）投（投放危险物质）”。","k":"","kb":29,"kh":[[37,104]]},{"id":"2008-4","y":2008,"t":"单","s":"间歇性精神病人在不能辨认或者不能控制自己行为时,实施严重危害社会行为的（ ）。","o":["应当负刑事责任","不负刑事责任","应当负刑事责任,但可以减轻或者免除处罚","待治疗痊愈后再追究刑事责任"],"a":"B","e":"\u0001间歇性精神病人在“不能辨认或者不能控制自己行为的时候”发病造成危害结果，经鉴定确认，不负刑事责任。\u0002\nA✗ 只有间歇性精神病人在“精神正常的时候”犯罪才负刑责\nB✓ 不负刑事责任：《刑法》第18条第1款明确规定，不能辨认或不能控制自己行为时造成危害结果且经法定程序鉴定的，\u0001不负刑事责任\u0002\nC✗ 只有“尚未完全丧失”辨认控制能力的精神病人才负刑责并可从轻/减轻\nD✗ 行为时无刑事责任能力即永久不构成犯罪、不追究刑事责任（对有继续危害社会可能的，可依法责令家属看管或决定强制医疗）","k":"","kb":30,"kh":[[25,71]]},{"id":"2008-24","y":2008,"t":"多","s":"下列选项中,应当以单位犯罪处罚的有（ ）。","o":["某国有公司明知他人进行走私，为其提供贷款的","某有限责任公司领导层为了单位利益,集体决定走私假币的","自然人投资设立有限责任公司后,该公司以实施走私为主要活动的","自然人以走私石油为目的注册有限责任公司后,该公司大量走私石油的"],"a":"AB","e":"\u0001国有公司通谋为走私者提供贷款、有限责任公司集体决定为单位利益走私假币，均依法成立单位犯罪；为犯罪而设公司不成立单位犯罪。\u0002\nA✓ 依据《刑法》第156条，明知他人走私而通谋提供贷款的，以走私罪共犯论处，且走私罪可由\u0001单位构成\u0002（《刑法》第151条至153条等）\nB✓ 有限责任公司由领导层集体决定为单位利益实施走私假币，且走私假币罪属于刑法明文规定可由单位实施的犯罪，成立\u0001单位犯罪\u0002\nC✗ 个人设立公司后\u0001以实施犯罪为主要活动\u0002的，依司法解释不以单位犯罪论处，而以自然人犯罪定罪\nD✗ 自然人\u0001为进行违法犯罪活动而设立\u0002公司实施犯罪的，即使大量走私石油亦不按单位犯罪论处，按自然人共同犯罪处理","k":"","kb":31,"kh":[[167,234]]},{"id":"2009-6","y":2009,"t":"单","s":"下列关于单位犯罪的表述中,错误的是（ ）。","o":["法律明文规定单位可以成为犯罪主体的犯罪才能成为单位犯罪","单位犯罪中的单位不包括几个自然人投资设立的有限责任公司","高等院校也可以成为单位犯罪的主体","对单位犯罪的两罚制是既处罚单位又处罚直接负责的主管人员和其他直接负责人员"],"a":"B","e":"\u0001依法由自然人投资设立的有限责任公司属于公司法人，完全可以成为单位犯罪的主体。\u0002\nA✗ 单位犯罪实行法定原则（只有法律明文规定单位可构成的才能成立单位犯罪），该选项表述正确，不符合“错误的是”提问要求\nB✓ 错误（正选）：依法设立的\u0001自然人投资的有限责任公司\u0002（只要不是专门为犯罪设立或设立后以犯罪为主业）完全属于《刑法》第30条的“公司”，可以构成单位犯罪\nC✗ 高等院校属于事业单位，依第30条可以成为单位犯罪主体，该项正确故不选\nD✗ 单位犯罪的两罚制即是对单位判处罚金、同时对其直接负责的主管人员和其他直接责任人员判处刑罚，该项正确故不选","k":"","kb":32,"kh":[[159,228]]},{"id":"2009-24","y":2009,"t":"多","s":"下列犯罪中，属于特殊主体犯罪的有（ ）。","o":["贪污罪","非法行医罪","私放在押人员罪","滥用职权罪"],"a":"ACD","e":"\u0001贪污罪（国家工作人员）、私放在押人员罪（司法工作人员）、滥用职权罪（国家机关工作人员）均为特殊主体犯罪；非法行医罪为一般主体。\u0002\nA✓ 《刑法》第382条贪污罪要求主体必须是\u0001国家工作人员\u0002（含受委托管理、经营国有财产人员），属特殊主体\nB✗ 《刑法》第336条非法行医罪指“未取得医生执业资格的人非法行医”，法律没有赋予特定身份门槛，任何一般自然人皆可构罪，属于\u0001一般主体\u0002\nC✓ 《刑法》第400条私放在押人员罪要求主体必须是\u0001司法工作人员\u0002，属特殊主体\nD✓ 《刑法》第397条滥用职权罪要求主体必须是\u0001国家机关工作人员\u0002，属特殊主体\n高发陷阱：“未取得执业资格的人”是否算特殊主体？不算！正相反，“未取得XX资格”是对不具备特定职业资格的\u0001一般大众\u0002的消极描述，故非法行医罪是一般主体犯罪！","k":"","kb":33,"kh":[[48,106],[158,188]]},{"id":"2010-4","y":2010,"t":"单","s":"下列关于单位犯罪的表述正确的是（ ）。","o":["单位犯罪都是故意犯罪","单位犯罪都是以单位牟利为目的的","单位犯罪都采用双罚制","单位犯罪也可以只处罚自然人"],"a":"D","e":"\u0001单位犯罪既可存在过失（如工程重大安全事故罪），也可存在“只处罚自然人而不罚单位”的单罚制例外（如私分国有资产罪、重大责任事故罪等）。\u0002\nA✗ 单位犯罪也可能是\u0001过失犯罪\u0002，如《刑法》第137条工程重大安全事故罪\nB✗ 既然单位犯罪可以是过失犯罪，就无所谓“都是以单位牟利为目的”\nC✗ 《刑法》第31条明确“本法分则和其他法律另有规定的，依照规定”，例如工程重大安全事故罪、私分国有资产罪、重大劳动安全事故罪即实行\u0001单罚制\u0002（仅处罚直接责任人员）\nD✓ 单位犯罪也可以只处罚自然人：虽然以双罚制为原则，但在《刑法》明文规定的\u0001单罚制单位犯罪\u0002中，只处罚直接负责的主管人员和其他直接责任人员","k":"","kb":31,"kh":[[107,136]]},{"id":"2011-17","y":2011,"t":"单","s":"关于处理未成年人犯罪案件,下列表述中正确的是（ ）。","o":["对未成年人罪犯不得判处罚金","对罪行极其严重的未成年人罪犯,可以适用无期徒刑","对犯罪时不满18周岁的罪犯,应当减轻或者免除处罚","对罪行极其严重的未成年人罪犯,可以判处死刑缓期二年执行"],"a":"B","e":"\u0001对罪行极其严重的未成年人可以适用无期徒刑，但不适用死刑（含死缓），应当从轻或者减轻处罚，可判处罚金。\u0002\nA✗ 对未成年人犯罪可以判处罚金，只需依法从轻或者减轻处罚并考虑实际缴纳能力\nB✓ 可以适用无期徒刑：对犯罪时不满18周岁的未成年人不适用死刑（含死缓），但对\u0001罪行极其严重\u0002的未成年人（尤其是16—18周岁）可以依法判处无期徒刑\nC✗ 法条原文是“应当\u0001从轻或者减轻\u0002处罚”，不包含“免除处罚”\nD✗ 《刑法》第49条“不适用死刑”包括死刑立即执行和\u0001死刑缓期二年执行（死缓）\u0002","k":"","kb":29,"kh":[[209,219],[233,263]]},{"id":"2012-5","y":2012,"t":"单","s":"甲(15周岁)盗窃他人钱包被陈某发现后,为窝藏赃物而当场使用暴力,失手将陈某打死。甲的行为构成（ ）。","o":["抢劫罪","盗窃罪","故意伤害罪","过失致人死亡罪"],"a":"C","e":"\u000115周岁（不满16周岁）盗窃时为窝藏赃物当场施暴失手打死被害人，因15岁对盗窃罪、普通抢劫转化条款第269条（不以盗窃为前提之成年要求）通说不成立转化抢劫罪，实务与2012年真题定故意伤害罪（注意《刑修》及实务解释）。\u0002\nA✗ 最高法《关于审理未成年人刑事案件具体应用法律若干问题的解释》第10条规定：已满14不满16周岁的人盗窃后为窝藏赃物当场使用暴力，\u0001致人重伤或者死亡的，应当分别以故意伤害罪或者故意杀人罪定罪处罚\u0002（不再按第269条拟制转化为抢劫罪！）\nB✗ 15周岁对普通盗窃罪不负刑事责任\nC✓ 故意伤害罪：甲系15周岁未成年人，盗窃后为窝藏赃物当场施暴“失手打死”被害人（无直接杀害故意、系伤害致死），依照上述司法解释专门规定认定为\u0001故意伤害罪（致人死亡）\u0002\nD✗ 15周岁人对过失致人死亡罪不负刑事责任，且甲是有意对陈某实施当场殴打暴力致人死亡，并非无伤害故意之纯过失\n法硕必背特例（《未成年人解释》第10条）：14—16周岁未成年人犯盗窃/诈骗/抢夺后为抗拒抓捕/窝藏赃物当场施暴，\u0001一律不转化为抢劫罪\u0002——致人重伤或死亡的分别定\u0001故意伤害罪、故意杀人罪\u0002；未造成重伤死亡的不构成犯罪！","k":"","kb":66,"kh":[[23,28]]},{"id":"2012-6","y":2012,"t":"单","s":"下列关于处理未成年人犯罪的表述,正确的是","o":["对不满18周岁的犯罪人不得适用没收财产刑","对犯罪时不满18周岁的人,应当减轻或者免除处罚","对罪行极其严重的未成年人罪犯,可以适用无期徒刑","对未成年人因犯抢劫、绑架等暴力犯罪被判处有期徒刑的,均可假释"],"a":"C","e":"\u0001对罪行极其严重的未成年罪犯可以适用无期徒刑；未成年人亦可依法并处没收财产，且对未成年人并非均应当减轻或免除，亦不排斥暴恐/抢劫等重罪假释（一般从宽）。\u0002\nA✗ 对未成年人实施分则规定并处没收财产的犯罪，仍可以依法适用没收财产刑（依法从轻）\nB✗ 《刑法》第17条第4款规定的是“应当\u0001从轻或者减轻\u0002处罚”，并无“免除处罚”之法定要求\nC✓ 对罪行极其严重的未成年人罪犯，\u0001可以适用无期徒刑\u0002（已满14不满16周岁一般不判处无期徒刑，已满16不满18周岁罪行极其严重的可适用）\nD✗ 《刑法》第81条第2款规定，对累犯以及因故意杀人、强奸、\u0001抢劫、绑架\u0002等暴力性犯罪被判处\u0001十年以上有期徒刑、无期徒刑\u0002的犯罪分子，不得假释（未成年人被判十年以上抢劫、绑架亦受该禁止假释限制，“均可假释”错误）","k":"","kb":34,"kh":[[65,90]]},{"id":"2013-18","y":2013,"t":"单","s":"甲公司的董事长乙,指使公司经理丙欺骗银行,使公司获得贷款800万元用于经营。但因经营不善,造成银行500万元贷款无法收回。关于本案,下列选项中正确的是（ ）。","o":["甲公司、乙、丙构成共同犯罪,乙是主犯","甲公司构成单位犯罪,乙与丙构成共同犯罪","甲公司不构成犯罪,乙与丙构成共同犯罪","甲公司构成单位犯罪,乙与丙是单位犯罪中的直接责任人员"],"a":"D","e":"\u0001骗取贷款用于公司经营、仅因经营不善未能偿还的，无非法占有目的不构贷款诈骗罪而构骗取贷款罪；因骗取贷款罪有单位犯罪，故公司构单位犯罪、乙丙为直接责任人员。\u0002\nA✗ 公司与内部负责人员之间是单位犯罪内部组织关系，单位犯罪与其直接责任人员之间不按普通自然人共同犯罪的“主犯/从犯”来划分身份\nB✗ 同一道理，单罚/双罚单位犯罪内部，乙和丙属于\u0001直接负责的主管人员和其他直接责任人员\u0002，不另称单位犯罪之外的自然人共同犯罪\nC✗ 本案资金\u0001用于公司经营\u0002，并非私分也非以非法占有为目的诈骗，故甲公司构成骗取贷款罪的单位犯罪\nD✓ 骗取贷款罪属于可由单位实施的犯罪（《刑法》第175条之一），乙作为董事长、丙作为经理分别是直接负责的主管人员和其他直接责任人员，故\u0001甲公司构成单位犯罪，乙与丙是单位犯罪中的直接责任人员\u0002\n关键辨析：\n- \u0001贷款诈骗罪\u0002（第193条，须有非法占有目的）：只能是自然人犯罪，单位不构成；\n- \u0001骗取贷款罪\u0002（第175条之一，无非法占有目的但欺骗获取贷款）：单位可以构成单位犯罪！","k":"","kb":31,"kh":[[15,60],[81,106]]},{"id":"2013-42","y":2013,"t":"多","s":"下列选项中,符合刑法关于未成年人刑事责任规定的有（ ）。","o":["未成年人犯罪不构成累犯","未成年人犯罪符合缓刑条件的应当宣告缓刑","未成年人犯罪都应当从轻或者减轻处罚","未成年人犯罪的可适用死刑缓期二年执行"],"a":"ABC","e":"\u0001未成年人犯罪不构成累犯、符合缓刑条件应当宣告缓刑、都应当从轻或减轻处罚；未成年人犯罪绝对不适用死刑（含死缓）。\u0002\nA✓ 《刑法》第65条第1款明确规定，一般累犯“过失犯罪和不满十八周岁的人犯罪的除外”\nB✓ 《刑法》第72条第1款明确规定，对被判处拘役、三年以下有期徒刑的不满18周岁的人，符合缓刑条件的，\u0001应当\u0002宣告缓刑\nC✓ 《刑法》第17条第4款规定，对依法追究刑责的不满18周岁的人，\u0001应当从轻或者减轻处罚\u0002\nD✗ 《刑法》第49条规定犯罪时不满18周岁的人\u0001不适用死刑\u0002，包括死刑立即执行和死刑缓期二年执行（死缓）","k":"","kb":29,"kh":[[185,219],[233,263],[272,287]]},{"id":"2014-4","y":2014,"t":"单","s":"甲醉酒驾驶,撞死一行人后逃逸,在被追赶时精神病复发。对甲（ ）。","o":["不追究刑事责任","应当追究刑事责任","应当追究刑事责任,但是可以从轻或者减轻处罚","应当追究刑事责任,但是可以减轻或者免除处罚"],"a":"B","e":"\u0001醉酒的人犯罪应当负刑责；间歇性精神病人在精神正常时（醉酒撞人逃逸时）有辨认控制能力，事后逃跑中复发不影响对之前交通肇事逃逸罪责的追究。\u0002\nA✗ 评判刑事责任能力的时间点是\u0001“实施犯罪行为之时”\u0002而非事后逃跑或受审之时\nB✓ 应当追究刑事责任：甲实施醉酒驾车撞死人并逃逸行为时精神正常，且醉酒犯罪依法负刑事责任，事后被追赶时精神病复发不影响犯罪成立与追责\nC✗ 行为时并未处于精神病发病状态，因此不适用第18条精神病从宽条款\nD✗ 行为时既非精神病发作亦非限制责任能力，不能按精神病条款减轻或者免除处罚","k":"","kb":30,"kh":[[73,99],[150,164]]},{"id":"2014-7","y":2014,"t":"单","s":"人民法院认定,甲公司于2011年12月偷逃税款,构成犯罪,但该公司已于2012年7月宣告破产。对于甲公司的逃税犯罪行为（ ）。","o":["不再予以追究","仍应追究其刑事责任","按照单位犯罪仅追究直接责任人员的刑事责任","按照自然人犯罪追究直接责任人员的刑事责任"],"a":"C","e":"\u0001涉嫌单位犯罪的单位在审判前被宣告破产的，对该单位不再追诉，但仍应按单位犯罪的规定追究直接负责的主管人员和其他直接责任人员的刑事责任。\u0002\nA✗ 单位虽然破产消失，但其直接负责的主管人员和其他直接责任人员依然在世，依法仍需追究刑责\nB✗ 破产后的单位法律人格已消灭，无法对其判处罚金，故对该单位不再追诉\nC✓ 按照单位犯罪仅追究直接责任人员的刑事责任：最高检批复明确，涉嫌犯罪单位被撤销、注销、吊销营业执照或者宣告破产的，\u0001按单位犯罪只追究直接负责的主管人员和其他直接责任人员刑责\u0002，不再对单位追诉\nD✗ 该逃税行为本来就是单位集体决定为单位谋利实施的单位犯罪，不能将其改按自然人犯罪的定罪量刑标准去追诉（两者的入罪门槛和量刑档次可能不同）","k":"","kb":32,"kh":[[50,140]]},{"id":"2017-43","y":2017,"t":"多","s":"下列情形中,可以成立单位犯罪的有（ ）。","o":["甲设立公司,主要从事为他人虚开增值税专用发票活动以牟利","乙与公司股东商议后,以公司名义走私香烟, 所得收益归公司所有","丙为使其公司承建工程,向国有投资公司主管人员支付巨额回扣","丁以公司名义吸收公众存款,并将违法所得用来购买豪华别墅"],"a":"BC","e":"\u0001为单位利益且经单位决策决定走私香烟、向国企高管支付巨额回扣以承建工程，成立单位犯罪；专设虚开或违法所得私分的按自然人犯罪。\u0002\nA✗ 设立公司主要从事虚开增值税专用发票违法活动，属于\u0001“设立后以实施犯罪为主要活动”\u0002，不以单位犯罪论处\nB✓ 经公司股东集体商议、以公司名义走私香烟且收益归公司所有，符合单位犯罪的单位意志、名义与利益三大要素，且走私普通货物罪有单位犯罪\nC✓ 为本单位承建工程而向国有投资公司主管人员支付巨额回扣，构成\u0001单位行贿罪\u0002（第393条）\nD✗ 虽以公司名义吸收存款，但将违法所得用来为自己购买豪华别墅（\u0001违法所得由个人私分/私用\u0002），依自然人犯罪定集资诈骗/非法吸存罪","k":"","kb":31,"kh":[[167,234],[235,280]]},{"id":"2018-12","y":2018,"t":"单","s":"下列关于单位犯罪的表述,正确的是（ ）。","o":["没有可执行财产的单位分支机构不会构成单位犯罪","我国刑法中有关单位犯罪的规定不适用于外国公司、企业","两个以上单位以共同故意实施犯罪的可不区分主犯、从犯","对单位犯罪直接负责的主管人员和其他直接责任人员可不区分主犯从犯"],"a":"D","e":"\u0001对单位犯罪中直接负责的主管人员和其他直接责任人员主从关系不明显的，可以不区分主犯从犯；单位分支机构、外国法人、两单位共犯均可成为犯罪主体。\u0002\nA✗ 单位犯罪主体资格看是否以分支机构名义、利益相对独立决定实施犯罪，与其账上“是否有可执行财产”无关\nB✗ 我国《刑法》关于单位犯罪的规定同样适用于符合我国法人条件或在我国领域内犯罪的\u0001外国公司、企业\u0002\nC✗ 两个以上单位共同故意犯罪的，构成单位之间的共同犯罪，\u0001需要\u0002依各自在共同犯罪中的作用区分主犯、从犯\nD✓ 《全国法院审理金融犯罪案件工作座谈会纪要》明确：单位犯罪中对直接负责的主管人员和其他直接责任人员，主从关系不明显的，\u0001可不区分主犯、从犯\u0002（直接按各自在单位犯罪中的作用、地位分别裁量刑罚）","k":"","kb":32,"kh":[[229,265]]},{"id":"2021-6","y":2021,"t":"单","s":"下列对于单位犯罪的理解中,正确的是（ ）。","o":["个人为进行违法犯罪活动而设立的企业实施犯罪的,不以单位犯罪论处","符合我国法人资格条件的外国企业犯罪的,不应依照单位犯罪的规定追究刑事责任","依法成立的一人公司,不能成为单位犯罪的主体","以单位内设机构名义实施犯罪的,不应认定为单位犯罪"],"a":"A","e":"\u0001个人为违法犯罪而设立的企业不以单位犯罪论处；符合我国法人条件的外国企业、一人公司、内设机构以自己名义利益实施犯罪均可构成单位犯罪。\u0002\nA✓ 个人为进行违法犯罪活动而设立的企业实施犯罪的，\u0001不以单位犯罪论处\u0002（按自然人犯罪处罚）\nB✗ 符合我国法人资格条件的外国公司、企业，依法可以依照我国刑法关于单位犯罪的规定追究刑事责任\nC✗ 依法设立的\u0001一人有限责任公司\u0002具有独立企业法人资格（只要独立建账、公私财产未混同、非专设犯罪），可以成为单位犯罪主体\nD✗ 以单位内设机构名义实施犯罪，且违法所得归该\u0001内设机构所有\u0002的，应当认定为单位犯罪","k":"","kb":31,"kh":[[167,197],[226,234]]},{"id":"2022-43","y":2022,"t":"多","s":"正确审理未成年人刑事案件应贯彻\"教育为主,惩罚为辅\"的原则。对此,下列选项中正确的有","o":["对已满14周岁不满16周岁的人犯罪一般不判处无期徒刑","对未成年罪犯判处附加剥夺政治权利的,应当依法从轻判处","对未成年罪犯适用刑罚,应当充分考虑是利千未成年罪犯的教育和矫正","对未成年罪犯的减刑、假释,在掌握标准上可以比照成年罪犯依法适度放宽"],"a":"ABCD","e":"\u0001已满14不满16岁一般不判无期徒刑；附加剥夺政治权利对未成年人应依法从轻；应考虑教育矫正；减刑假释标准可比照成年人适度放宽。\u0002\nA✓ 对已满14周岁不满16周岁的人犯罪，因年龄幼小，司法解释规定\u0001一般不判处无期徒刑\u0002\nB✓ 除刑法规定“应当”附加剥夺政治权利外一般不判处；如果判处附加剥夺政治权利的，\u0001应当依法从轻判处\u0002\nC✓ 对未成年罪犯适用刑罚，应当充分考虑是否有利于未成年罪犯的\u0001教育和矫正\u0002\nD✓ 对未成年罪犯的减刑、假释，在掌握标准上可以比照成年罪犯\u0001依法适度放宽\u0002","k":"","kb":34,"kh":[[91,117],[161,175],[200,232]]},{"id":"2023-11","y":2023,"t":"单","s":"下列选项中,符合我国刑法刑事责任年龄相关规定的是","o":["甲(11周岁)故意杀人致人死亡,应当负刑事责任","乙(13周岁)故意伤害致人重伤,情节恶劣,应当负刑事责任","丙(15周岁)故意伤害致人重伤,应当负刑事责任","丁(17周岁)故意杀人致人死亡,应当负刑事责任,可以适用死刑"],"a":"C","e":"\u0001已满14不满16周岁人对故意伤害致人重伤依法应当负刑责；11岁完全无责；13岁普通重伤未达“特别残忍致重伤造成严重残疾”；17岁不适用死刑。\u0002\nA✗ 11周岁（不满12周岁）在任何情况下均属于\u0001完全无刑事责任年龄\u0002，不负刑事责任\nB✗ 《刑法》第17条第3款（已满12不满14周岁）核准追诉限于故意杀人、故意伤害罪“\u0001致人死亡或者以特别残忍手段致人重伤造成严重残疾\u0002，情节恶劣”，普通的故意伤害致重伤不在此列\nC✓ 丙已满15周岁（处于14—16周岁相对负刑事责任年龄段），犯“\u0001故意伤害致人重伤\u0002或者死亡”依法应当负刑事责任\nD✗ 丁17周岁，虽然应当负故意杀人罪的刑事责任，但依据第49条犯罪时不满18周岁的人\u0001不适用死刑\u0002","k":"","kb":29,"kh":[[37,70],[106,161],[233,263]]},{"id":"2023-20","y":2023,"t":"单","s":"【案情】甲与母亲发生争执，一气之下将电脑显示器从五楼抛下，掉落到行人刘某身旁，导致刘某受惊摔伤，入院就医。派出所接警后派两名民警着警服到场处置，甲突然掏出管制刀具追赶到场民警，严重危及民警人身安全。\n如事后经鉴定,甲系间歇性精神病人,案发时处于精神正常状态,则甲","o":["无需承担刑事责任","应由政府强制医疗","应被责令具结悔过","应赔偿刘某经济损失"],"a":"D","e":"\u0001间歇性精神病人在精神正常状态下犯罪应当负刑事责任并承担民事赔偿；不适用针对无责精神病人的强制医疗程序。\u0002\nA✗ 甲案发时处于\u0001精神正常状态\u0002，依法应当对高空抛物、持刀袭警行为负完全刑事责任，不存在无需担责之说\nB✗ 依《刑事诉讼法》第302条，政府强制医疗仅适用于实施暴力行为、经鉴定\u0001依法不负刑事责任\u0002的精神病人；甲案发时精神正常须负刑责，直接走正常定罪判刑而非强制医疗\nC✗ 具结悔过主要适用于不满法定刑事责任年龄未予刑事处罚等轻违或免刑训诫情形，与案发时正常的重罪嫌疑人不符\nD✓ 应赔偿刘某经济损失：甲案发时精神正常，在负刑事责任的同时，因高空抛物致行人刘某受惊摔伤就医，依法应当\u0001赔偿被害人刘某医疗费等经济损失\u0002","k":"","kb":30,"kh":[[73,99]]},{"id":"2025-4","y":2025,"t":"单","s":"下列选项中,成立单位犯罪的是（ ）。","o":["甲设立的A 公司专门从事电信网络诈骗活动","B 公司提供虚假担保骗取巨额贷款,后因经营不善无力偿还","C 公司设立后以为他人虚开增值税专用发票为主要活动","乙以D 公司名义实施合同诈骗,并让受害人将资金打入乙妻子的银行账户"],"a":"B","e":"\u0001B公司作为合法存续公司通过虚假担保骗取巨额贷款并用于正常业务经营，因经营不善无力偿还，符合单位犯罪成立条件（骗取贷款罪）。\u0002\nA✗ 甲为进行电信网络诈骗而\u0001专门设立\u0002公司，不以单位犯罪论处\nB✓ B公司并非专为违法而设，且在客观上以公司名义为单位经营融资，构成了可由单位作为犯罪主体的\u0001骗取贷款罪\u0002单位犯罪\nC✗ C公司设立后\u0001以实施犯罪（虚开增值税专用发票）为主要活动\u0002，不以单位犯罪论处，按自然人犯罪追究\nD✗ 乙盗用D公司名义行骗，并让被害人将资金打入其妻子个人账户（\u0001违法所得由个人私分占为己有\u0002），按自然人合同诈骗罪处罚","k":"","kb":31,"kh":[[167,234],[235,280]]},{"id":"2026-14","y":2026,"t":"单","s":"下列对于犯罪主体特殊身份的判定,正确的是","o":["首要分子属于特殊身份","教唆犯不受特殊身份限制","特殊身份与刑事责任无关","叛逃罪的主体应具备特殊身份"],"a":"D","e":"\u0001叛逃罪主体必须是国家机关工作人员（或在掌握国家秘密的国家工作人员），属于法律明文规定的特殊主体身份犯。\u0002\nA✗ 犯罪主体中的“特殊身份”是指刑法所规定的影响行为人\u0001定罪或量刑\u0002的特定个人身份（如国家工作人员、军人、司法工作人员），“首要分子”是在共同或聚众犯罪形成过程里扮演的角色地位，不是犯罪主体特殊身份\nB✗ 有身份者与无身份者共同犯罪，无身份者可成立身份犯的教唆犯或帮助犯，\u0001但定罪须随有身份之实行犯而受身份犯构成要件制约\u0002（不能脱离实行犯身份独立实行纯正身份犯）\nC✗ 特殊身份分为定罪身份（决定犯罪能否成立或罪名归属）与量刑身份（决定刑罚轻重），均直接关系刑事责任有无或大小\nD✓ 《刑法》第109条叛逃罪明确限定犯罪主体只能是\u0001国家机关工作人员\u0002（以及掌握国家秘密的国家工作人员），是典型的纯正特殊主体身份犯","k":"","kb":33,"kh":[[138,156]]}]},{"sub":"刑法","name":"刑罚种类","w":1.3,"L":25,"qs":[{"id":"2005-4","y":2005,"t":"单","s":"使罪犯在有关人士帮助、监督、辅导下能更好地适应社会自由生活,减少该犯罪再次犯罪的机率。下列选项中较能体现这一观念的制度是（ ）。","o":["缓刑","管制","假释","减刑"],"a":"C","e":"\u0001假释是在监禁执行一定刑期后附加考察考验条件提前重返社会，在监督辅导下重新适应正常社会生活以预防再犯。\u0002\nA✗ 缓刑自始不进入监狱服刑，不存在出狱后从监禁过渡重新适应社会的问题\nB✗ 管制是不予关押、直接放在社区限制一定自由的主刑，从未入狱\nC✓ 假释：对有期徒刑、无期徒刑罪犯在狱中服刑一定期限后附条件提前释放，在考验期内接受社区矫正和辅导，正是为了\u0001帮助罪犯从长期监禁平稳过渡回社会生活\u0002\nD✗ 减刑只是缩短在狱内或主刑上的执行期限，只有减刑后服刑期满直接释放，并不包含出狱后的专项适应辅导考验期","k":"","kb":52,"kh":[[26,59]]},{"id":"2005-12","y":2005,"t":"单","s":"赵某犯A罪，依法应当附加剥夺政治权利。合议庭提出以下四种量刑意见，其中必定错误的意见是（ ）。","o":["判处有期徒刑 2 年,附加剥夺政治权利 1 年","判处有期徒刑 2 年,缓刑 3 年,附加剥夺政治权利 1 年","判处管制 2 年,附加剥夺政治权利 1 年","判处拘役 6 个月,附加剥夺政治权利 1 年"],"a":"C","e":"\u0001《刑法》第55条第2款规定，判处管制附加剥夺政治权利的，剥夺政治权利的期限必须与管制的期限相等、同时执行，绝不可能“管制2年配剥权1年”。\u0002\nA✗ 有期徒刑2年附加剥夺政治权利1年完全符合第55条“一年以上五年以下”规定，意见合法\nB✗ 有期徒刑宣告缓刑附加剥夺政治权利1年同样合法（附加刑仍须执行）\nC✓ 必定错误（正选）：判处管制2年附加剥夺政治权利时，两者的期限\u0001必须相等（均为2年）并同时起算执行\u0002，不得只附加1年剥夺政治权利\nD✗ 拘役6个月附加剥夺政治权利1年符合第55条第1款（1年以上5年以下），意见合法","k":"","kb":48,"kh":[[66,95]]},{"id":"2005-22","y":2005,"t":"多","s":"甲武装掩护走私毒品,法院判决其构成走私毒品罪,判处无期徒刑,并处没收财产。甲的下列哪些财产可纳入适用没收财产刑予以没收的范围（ ）。","o":["甲在走私毒品中使用的枪支","甲被查获的毒品和贩毒资金","甲在银行帐户上的 500 万元存款","甲所有的 2 辆豪华轿车"],"a":"CD","e":"\u0001没收财产刑的对象仅限于犯罪分子本人所有的合法财产（银行存款、名下豪车）；犯罪所用枪支及毒品毒资依法应按第64条专门没收/追缴而非适用没收财产刑。\u0002\nA✗ 甲走私中使用的枪支属于《刑法》第64条“违禁品和供犯罪所用的本人财物”，应当直接没收，不属于第59条“没收财产刑”的标的\nB✗ 毒品和贩毒资金属于违法所得及违禁品，应依据第64条予以没收或追缴\nC✓ 甲在银行账户上的500万元合法存款属于个人合法财产，可纳入没收财产刑范围\nD✓ 甲个人名下的2辆豪华轿车（合法来源）属于个人合法财产，可纳入没收财产刑范围","k":"","kb":49,"kh":[[20,61],[192,213]]},{"id":"2006-8","y":2006,"t":"单","s":"无期徒刑减为有期徒刑时，附加剥夺政治权利的期限应当改为（ ）。","o":["5 年以上 10 年以下","3 年以上 10 年以下","3 年以上 8 年以下","1 年以上 5 年以下"],"a":"B","e":"\u0001《刑法》第57条第2款规定，死缓或无期徒刑减为有期徒刑时，应当把附加剥夺政治权利终身改为三年以上十年以下。\u0002\nA✗ 下限是3年，不是5年\nB✓ 3年以上10年以下：严格对应《刑法》第57条第2款法定修改幅度\nC✗ 上限是10年，不是8年\nD✗ 1年以上5年以下是一般有期徒刑/拘役或独立适用剥夺政治权利的期限","k":"","kb":48,"kh":[[157,196]]},{"id":"2007-11","y":2007,"t":"单","s":"甲因抢劫罪被判处有期徒刑 10 年,附加剥夺政治权利 3 年。甲 （ ）。","o":["在监狱服刑期间被剥夺政治权利 3 年, 3 年期满后享有政治权利","在监狱服刑期间被剥夺政治权利,出狱后还需剥夺政治权利 3 年","在监狱服刑期间不被剥夺政治权利,出狱后开始执行剥夺政治权利 3 年","在监狱服刑期间的最后 3 年被剥夺政治权利"],"a":"B","e":"\u0001《刑法》第58条规定，附加剥夺政治权利刑期从主刑执行完毕（或假释）之日起计算，且在主刑服刑期间当然剥夺政治权利。\u0002\nA✗ 监狱服刑10年期间并不开始计算那3年附加剥权刑期，出狱后仍需另行执行3年\nB✓ 在监狱服刑期间被剥夺政治权利，出狱后还需剥夺政治权利3年：即监狱服刑的10年里同样没有政治权利，出狱后才开始起算那3年附加剥权期（实际共计被剥权13年）\nC✗ 主刑执行期间犯罪分子同样被剥夺政治权利（“当然施用于主刑执行期间”），并非享有政治权利\nD✗ 附加刑与主刑并非重合在最后3年执行，而是主刑完毕后紧接着单算3年","k":"","kb":48,"kh":[[201,256]]},{"id":"2009-12","y":2009,"t":"单","s":"下列关于无期徒刑的表述中,正确的是（ ）。","o":["对不满 16 周岁的人不得适用无期徒刑","被判处无期徒刑的犯罪人在判决执行以前的羁押不得折抵刑期","对被判处无期徒刑的犯罪人不得适用假释","对被判处无期徒刑的犯罪人可以附加剥夺政治权利 10 年以上"],"a":"B","e":"\u0001无期徒刑没有具体刑期，判决前先行羁押时间无法也无需折抵无期徒刑；死刑和无期徒刑必须附加剥夺政治权利终身。\u0002\nA✗ 已满14周岁不满16周岁的人犯特定重罪（如故意杀人等）也可以适用无期徒刑（司法解释只是说“一般不判处”，并非法律“不得适用”）\nB✓ 被判处无期徒刑的犯罪人在判决执行以前的羁押不得折抵刑期：无期徒刑是剥夺终身自由，没有固定年数可扣减（若日后减为有期徒刑，亦从减刑裁定之日起算有期徒刑，原羁押仍不折抵）\nC✗ 除第81条第2款暴恐累犯重罪禁限情形外，一般被判处无期徒刑（如贪污无期徒刑、非禁止类犯罪）实际执行满13年且悔改的\u0001可以适用假释\u0002\nD✗ 《刑法》第57条规定，对被判处死刑、无期徒刑的犯罪分子，应当剥夺政治权利\u0001终身\u0002，并非“10年以上”","k":"","kb":48,"kh":[[124,152]]},{"id":"2009-19","y":2009,"t":"单","s":"下列关于没收财产刑的说法,正确的是（ ）。","o":["没收财产前犯罪分子所负的任何债务都不能以没收的财产偿还","对犯罪分子非法取得的财产应当适用没收财产刑","在判处没收财产刑时不得没收犯罪分子家属应有的财产","对犯罪分子在犯罪中使用的本人财物应当适用没收财产刑"],"a":"C","e":"\u0001判处没收财产时不得没收属于犯罪分子家属所有或应有的财产；没收前正当债务经债权人请求应当以没收财产偿还。\u0002\nA✗ 《刑法》第60条明文规定，没收财产以前犯罪分子所负的正当债务，需要以没收的财产偿还的，经债权人请求，\u0001应当偿还\u0002\nB✗ 犯罪分子非法取得的财物（赃款赃物）依法应当依据第64条予以\u0001追缴或者责令退赔\u0002，不能适用第59条没收财产刑\nC✓ 在判处没收财产刑时不得没收犯罪分子家属所有或者应有的财产（如夫妻共同财产中配偶的一半份额及子女财产）\nD✗ 供犯罪所用的本人财物（如作案汽车、工具）依据《刑法》第64条专门予以没收，也不归入第59条没收财产刑范围","k":"","kb":49,"kh":[[62,83],[106,147]]},{"id":"2013-3","y":2013,"t":"单","s":"下列选项中,符合我国刑法关于罚金规定的是（ ）。","o":["罚金在判决指定的期限内一次或者分期缴纳","不允许未成年罪犯的监护人代为垫付罚金","在判决指定的期限内不缴纳罚金的,应改判为有期徒刑","由于不能抗拒的灾祸,确实不能缴纳罚金的, 应免除罚金"],"a":"A","e":"\u0001罚金应在判决指定期限内一次或分期缴纳；未成年罚金允许监护人自愿垫付；不缴纳应强制/随时追缴（不能易科徒刑）；遇灾祸缴纳困难可延期/酌减/免除。\u0002\nA✓ 罚金在判决指定的期限内一次或者分期缴纳：完全符合《刑法》第53条第1款\nB✗ 司法解释明确规定，对被判处罚金刑的未成年人，其监护人或者其他人\u0001自愿代为垫付的，应当允许\u0002\nC✗ 我国刑法不实行西方“易科自由刑”制度，不缴纳罚金只能强制缴纳或随时追缴，\u0001绝不可改判为有期徒刑\u0002\nD✗ 遭遇不能抗拒灾祸缴纳确实有困难的，经法院裁定可以\u0001延期缴纳、酌情减少或者免除\u0002，而非一律“应免除”","k":"","kb":47,"kh":[[53,72],[102,148]]},{"id":"2014-11","y":2014,"t":"单","s":"甲（17周岁，无业）收受犯罪人窃得的笔记本电脑后，为其窝藏赃物，构成犯罪，依法应处3年以上7年以下有期徒刑，并处罚金。对甲适用罚金的正确做法是（ ）。","o":["应对甲免除罚金","应判令甲的监护人缴纳罚金","应对甲处以不少于500元的罚金","应将甲收受的电脑拍卖充抵罚金"],"a":"C","e":"\u0001对未成年人犯罪判处罚金应当从轻或者减轻，但司法解释规定罚金最低数额不得少于500元；不能判令监护人缴纳或直接没收收受来的赃物电脑抵债。\u0002\nA✗ 条文法定刑写明“并处罚金”，甲已满17周岁虽无业仍须从轻或减轻判处罚金，不能以无业为由违法免除必并处罚金\nB✗ 刑事责任自负，人民法院只能允许监护人“自愿垫付”，绝不能在判决中强行“判令监护人缴纳”\nC✓ 应对甲处以不少于500元的罚金：最高法《适用财产刑规定》明确未成年罪犯罚金应当从轻或减轻处罚，但\u0001最低不得少于500元\u0002（成年人一般不少于1000元）\nD✗ 甲窝藏来的笔记本电脑属于被害人的合法被盗财物（赃物），依法应当追缴并发还被害人，不能拿别人的电脑来充抵甲的罚金","k":"","kb":47,"kh":[[199,242]]},{"id":"2015-43","y":2015,"t":"多","s":"下列选项中,依法不得适用死刑的有（ ）。","o":["审判时怀孕的妇女","审判时已满75周岁的人","犯罪时不满18周岁的人","犯罪时又聋又哑的人"],"a":"AC","e":"\u0001审判时怀孕的妇女和犯罪时不满18周岁的人绝对不得适用死刑；审判时已满75周岁的人存在“以特别残忍手段致人死亡”的例外；又聋又哑的人可适用死刑。\u0002\nA✓ 审判的时候怀孕的妇女（包括审判期间人工流产/自然流产的妇女）绝对不适用死刑\nB✗ 《刑法》第49条第2款明确存在但书：“但以特别残忍手段致人死亡的除外”，故非绝对不得适用死刑\nC✓ 犯罪的时候不满18周岁的人（哪怕审判时已成年）绝对不适用死刑\nD✗ 《刑法》第19条规定又聋又哑的人或者盲人犯罪“可以从轻、减轻或者免除处罚”，并无不适用死刑之刚性禁令","k":"","kb":46,"kh":[[19,49],[50,86]]},{"id":"2016-45","y":2016,"t":"多","s":"甲(76周岁)因生活琐事与妻子发生争执,盛怒之下用水果刀将妻子一刀捅死。对于甲的刑事责任,下列选项中正确的有（ ）。","o":["对甲可以适用死刑","对甲不能适用死刑","对甲可以从轻或者减轻处罚","对甲可以判处死刑缓期执行,同时决定对其限制减刑"],"a":"BC","e":"\u000176周岁老人盛怒下用水果刀一刀捅死妻子，不属于“以特别残忍手段致人死亡”，因此不适用死刑（含死缓），且对已满75周岁故意犯罪“可以从轻或者减轻处罚”。\u0002\nA✗ 虽然老人在审判时已满75周岁（76岁），但其一刀捅死不属于“以特别残忍手段（如肢解、焚尸、极度虐待致死等）致人死亡”，不得适用死刑\nB✓ 对甲不能适用死刑：依据第49条第2款，审判时已满75周岁的人原则上不适用死刑\nC✓ 依据第17条之一：已满75周岁的人\u0001故意犯罪的，可以从轻或者减轻处罚\u0002（过失犯罪应当从轻或者减轻）\nD✗ “不适用死刑”既禁止判处死刑立即执行，也禁止判处\u0001死刑缓期二年执行（死缓）\u0002，死缓亦属于死刑执行方式","k":"","kb":46,"kh":[[50,113]]},{"id":"2017-7","y":2017,"t":"单","s":"下列关于罚金的表述,符合我国刑法规定的是（ ）。","o":["对未成年人判处的罚金,不得由其监护人垫付","是否判处罚金,不应考虑犯罪人的经济条件","应根据犯罪情节,决定判处罚金的数额","对累犯应当并处罚金"],"a":"C","e":"\u0001判处罚金应当根据犯罪情节决定罚金数额（并综合考虑经济负担能力）；允许未成年罪犯监护人自愿垫付；对累犯没有必须并处罚金的规定。\u0002\nA✗ 对未成年罪犯的罚金，其监护人或者其他人\u0001自愿代为垫付的，人民法院应当允许\u0002\nB✗ 判处罚金在以犯罪情节为基础的同时，司法解释明确规定也应当综合考虑犯罪分子的\u0001实际经济负担能力\u0002\nC✓ 应根据犯罪情节，决定判处罚金的数额：完全符合《刑法》第52条原文规定\nD✗ 刑法仅规定对累犯“应当从重处罚”，并未规定必须并处罚金","k":"","kb":47,"kh":[[19,52]]},{"id":"2017-9","y":2017,"t":"单","s":"下列选项中,不属于“应当”附加剥夺政治权利的是（ ）。","o":["危害公共安全的犯罪分子","被判处无期徒刑的犯罪分子","危害国家安全的犯罪分子","被判处死刑的犯罪分子"],"a":"A","e":"\u0001危害国家安全罪、被判死刑、被判无期徒刑均“应当”附加剥夺政治权利；危害公共安全犯罪并不一律“应当”附加剥夺政治权利（部分严重犯罪如爆炸、放火属“可以”）。\u0002\nA✓ 不属于“应当”附加（正选）：依《刑法》第56条，只有危害国家安全的犯罪分子\u0001应当\u0002附加剥夺政治权利；对于严重破坏社会秩序犯罪（含放火、爆炸等危害公共安全犯罪）仅为\u0001“可以”\u0002附加剥夺政治权利\nB✗ 被判处无期徒刑的犯罪分子，依第57条\u0001应当\u0002剥夺政治权利终身\nC✗ 危害国家安全的犯罪分子，依第56条\u0001应当\u0002附加剥夺政治权利\nD✗ 被判处死刑的犯罪分子，依第57条\u0001应当\u0002剥夺政治权利终身","k":"","kb":48,"kh":[[100,152]]},{"id":"2018-7","y":2018,"t":"单","s":"下列关于管制的描述,不正确的是（ ）。","o":["在劳动中同工同酬","依法实行社区矫正","可同时适用禁止令","刑期从判决宣告之日起计算"],"a":"D","e":"\u0001管制的刑期从“判决执行之日”起计算（判决前羁押一日折抵刑期二日），而非从“判决宣告之日”起计算。\u0002\nA✗ 第39条第2款规定被判处管制的罪犯在劳动中应当同工同酬，表述正确\nB✗ 第38条第3款规定对判处管制的罪犯依法实行社区矫正，表述正确\nC✗ 第38条第2款规定判处管制可以同时宣告禁止令，表述正确\nD✓ 不正确（正选）：依据《刑法》第41条，管制的刑期应从\u0001判决执行之日\u0002起计算（宣判之日到实际交付社区矫正执行之间可能存在上诉期和移交时间差），不是从判决宣告之日起算","k":"","kb":44,"kh":[[281,320]]},{"id":"2018-18","y":2018,"t":"单","s":"下列关于罚金的表述,正确的是（ ）。","o":["对于未成年人不得适用罚金刑","罚金的最低数额由法官酌情确定","一人犯数罪分别判处罚金刑的应该合并执行","一人犯数罪同时判处没收财产和罚金刑的应合并执行"],"a":"C","e":"\u0001一人犯数罪分别被判处罚金的（同种附加刑）合并执行；未成年人可判罚金；最低数额由司法解释规定；没收财产与罚金（不同种附加刑）分别执行。\u0002\nA✗ 《刑法》与司法解释均允许对未成年人罪犯判处罚金（应当从轻/减轻，不少于500元）\nB✗ 罚金最低数额一般不少于1000元、未成年不少于500元，有明确司法解释底线，并非法官毫无限制任意酌定\nC✓ 一人犯数罪分别判处罚金刑的应该合并执行：依据《刑法》第69条第3款，数罪判处\u0001种类相同的附加刑（数个罚金）应当合并执行\u0002（累加合并）\nD✗ 没收财产刑与罚金刑属于\u0001不同种类\u0002的附加刑，依照第69条第3款应当\u0001分别执行\u0002，不采用合并执行（或实务先并科各自执行）","k":"","kb":42,"kh":[[253,279]]},{"id":"2019-19","y":2019,"t":"单","s":"下列对于我国刑法中“终身监禁”的理解,正确的是（ ）。","o":["终身监禁属于一种新的刑罚种类而非刑罚执行方式","终身监禁作出后不得根据服刑表现进行减刑或假释","终身监禁应适用于国家工作人员实施的各种职务犯罪","判处死刑缓期执行的罪犯减为无期徒刑时应适用终身监禁"],"a":"B","e":"\u0001终身监禁是贪污受贿死缓减为无期徒刑后不得减刑、假释的刑罚执行措施（非独立刑种），且由法院在判处死缓时同时决定。\u0002\nA✗ 我国《刑法》第33、34条规定的刑种并未增加“终身监禁”；它只是死缓减为无期徒刑后\u0001不得减刑、假释的刑罚执行方式\u0002\nB✓ 终身监禁作出后不得根据服刑表现进行减刑或假释：一经作出终身监禁决定，在死缓期满依法减为无期徒刑后将终身服刑于狱中，\u0001绝对不得减刑或假释\u0002\nC✗ 依据《刑法》第383条第4款，终身监禁目前仅适用于\u0001特重大贪污罪、受贿罪\u0002，并不适用于滥用职权、挪用公款等所有职务犯罪\nD✗ 终身监禁的决定时点是在\u0001一并判处死刑缓期二年执行的同时\u0002作出（禁止等两年期满减为无期徒刑时再事后追加终身监禁）","k":"","kb":46,"kh":[[184,237]]},{"id":"2019-44","y":2019,"t":"多","s":"按照我国刑法规定,应当适用社区矫正的对象包括（ ）。","o":["被裁定假释的犯罪分子","被宣告缓刑的犯罪分子","被判处管制的犯罪分子","被单处剥夺政治权利的犯罪分子"],"a":"ABC","e":"\u0001被裁定假释、宣告缓刑、判处管制的罪犯均应当适用社区矫正；“被单处剥夺政治权利”本身表述不完整（且《社区矫正法》实施后现行四类范围不含单处剥夺政治权利）。\u0002\nA✓ 被裁定假释的犯罪分子依法适用社区矫正\nB✓ 被宣告缓刑的犯罪分子依法适用社区矫正\nC✓ 被判处管制的犯罪分子依法适用社区矫正\nD✗ 在2019年原《刑事诉讼法》语境下亦须限定为“在社会上执行”；且自2020年7月《社区矫正法》施行后，法定社区矫正对象已明确固定为管制、缓刑、假释、暂予监外执行四类，不含单处剥夺政治权利\n\u0001【新法提示】\u00022020年《中华人民共和国社区矫正法》第2条明确规定社区矫正对象仅限四类：“被判处管制、宣告缓刑、假释和暂予监外执行的罪犯”（不含单处剥夺政治权利人员），记忆上更清晰、无争议。","k":"","kb":52,"kh":[[26,59]]},{"id":"2020-12","y":2020,"t":"单","s":"下列关于剥夺政治权利的最高期限的说法中，正确的是（ ）。","o":["单处剥夺政治权利的期限不得超过10年","判处管制,附加剥夺政治权利的期限不得超过 5年","判处有期徒刑,附加剥夺政治权利的期限不得超过5年","从无期徒刑减为有期徒刑时,附加剥夺政治权利的期限不得超过15年"],"a":"C","e":"\u0001附加于有期徒刑（或拘役、独立适用）时剥夺政治权利期限为1年以上5年以下，故其最高期限不得超过5年。\u0002\nA✗ 独立适用剥夺政治权利的期限为1年以上5年以下，最高为5年而非10年\nB✗ 判处管制附加剥夺政治权利期限与管制刑期相等（管制单罪最高2年，数罪并罚最高3年），绝不超过3年\nC✓ 判处有期徒刑，附加剥夺政治权利的期限不得超过5年：依《刑法》第55条第1款为1年以上5年以下\nD✗ 从无期徒刑减为有期徒刑时，剥夺政治权利期限依法改为\u00013年以上10年以下\u0002，最高为10年而非15年","k":"","kb":48,"kh":[[26,61],[157,196]]},{"id":"2020-13","y":2020,"t":"单","s":"公司经理甲利用职务上的便利,侵吞本单位财物数额巨大。对此犯罪,我国刑法规定的法定刑是“处五年以上有期徒刑,可以并处没收财产。”根据本条对甲量刑（ ）。","o":["最高可判处15年有期徒刑,并处没收财产","最高可判处20年有期徒刑,并处没收财产","最高可判处25年有期徒刑,不并处没收财产","如果判处5年有期徒刑,则不能并处没收财产"],"a":"A","e":"\u0001法条未写上限而规定“处五年以上有期徒刑”时，依《刑法》第45条单罪有期徒刑一般最高15年（而非20年或25年），“可以并处没收财产”亦可依法并处。\u0002\nA✓ 最高可判处15年有期徒刑，并处没收财产：单罪有期徒刑的法定一般最高期限就是\u000115年\u0002（20年、25年仅见于数罪并罚或死缓减刑）\nB✗ 20年仅属于总和刑期不满35年时数罪并罚上限，单一罪行判不了20年有期徒刑\nC✗ 25年仅属于总和刑期在35年以上时数罪并罚上限或死缓减刑特例\nD✗ 法律规定“可以并处没收财产”，即使选择判处5年有期徒刑亦同样可以根据情节决定并处没收财产","k":"","kb":50,"kh":[[17,52]]},{"id":"2021-7","y":2021,"t":"单","s":"下列对于禁止令的理解中,正确的是（ ）。","o":["禁止令的期限应与缓刑、管制执行的期限相同","禁止令的执行期限从缓刑、管制执行之日起计算","禁止令由公安机关负责执行","禁止令属于附加刑的具体种类"],"a":"B","e":"\u0001禁止令的执行期限从管制、缓刑执行之日起计算；其期限可短于或等于管制/缓刑期限，由社区矫正机构（司法行政机关）执行，不是附加刑种类。\u0002\nA✗ 禁止令期限既可以与管制执行、缓刑考验期限相同，也可以\u0001短于\u0002管制/缓刑期限（但管制下不少于3个月、缓刑下不少于2个月）\nB✓ 禁止令的执行期限从缓刑、管制执行之日起计算：符合四部门《禁止令规定（试行）》第6条明文规定\nC✗ 禁止令由\u0001司法行政机关（社区矫正机构）\u0002负责执行（人民检察院依法监督），违反禁止令情节未达撤销缓刑的才由公安机关给予治安管理处罚\nD✗ 禁止令是人民法院判处管制、宣告缓刑同时作出的一项\u0001辅助性非刑罚监管措施\u0002，并非《刑法》第34条规定的附加刑","k":"","kb":44,"kh":[[327,361],[383,412]]},{"id":"2022-14","y":2022,"t":"单","s":"适用没收财产刑时,可以没收","o":["被告人收受的贿赂款","被告人持有的股票","被告人的土地承包经营权","被告人作案使用的电脑"],"a":"B","e":"\u0001没收财产刑仅没收犯罪分子个人所有的合法财产（如持有的股票）；贿赂款（赃款）与作案电脑（工具）依第64条追缴/没收；土地承包经营权以户为单位且非个人所有权不适用。\u0002\nA✗ 受贿所得贿赂款属于违法所得赃款，依法适用第64条追缴上缴国库，不属没收财产刑对象\nB✓ 被告人个人合法持有的\u0001股票\u0002属于其个人所有的合法财产性权益，可以适用没收财产刑\nC✗ 农村土地承包经营权以\u0001“户”\u0002为单位享有且系用益物权（旨在保障农民家庭基本生计），不属于个人可没收的私有财产\nD✗ 作案使用的电脑属于《刑法》第64条“供犯罪所用的本人财物”，应依该条直接予以没收，而不是作为没收财产刑的标的","k":"","kb":49,"kh":[[20,61],[192,213]]},{"id":"2022-15","y":2022,"t":"单","s":"如果我国刑法规定,犯甲罪的,处10年以上有期徒刑、无期徒刑或者死刑,对犯甲罪的被告人适用减刑时","o":["可以判处拘役","可以判处无期徒刑","可以判处8年有期徒刑","可以判处死刑缓期2年执行"],"a":"C","e":"\u0001法定刑为“10年以上有期徒刑、无期徒刑或者死刑”时，若被告人被判处10—15年有期徒刑并符合条件适用减刑（实际执行不低于原判刑期1/2），减刑后可能变为8年有期徒刑，不可能减成拘役、无期或死缓。\u0002\nA✗ 对被判10年以上有期徒刑或无期徒刑的被告人减刑，由于减后实服刑期不得少于原判1/2（至少5年）或13年，绝不可能减为\u0001拘役\u0002\nB✗ 《刑法》第78条减刑是将重刑向下减轻：原判有期徒刑绝不可能减成无期徒刑；原判无期徒刑减刑后应减为有期徒刑（20年以上/22年以上），不可能减后仍维持“无期徒刑”\nC✓ 可以判处（减为）8年有期徒刑：若被告人原审被判处10年至15年有期徒刑（例如判14年，二分之一即7年），服刑中经过减刑后完全可能减为实际执行\u00018年有期徒刑\u0002\nD✗ 死刑缓期2年执行是死刑的执行制度，绝不能由有期/无期经普通减刑变为死缓（而死缓两年期满依法减为无期徒刑属于第50条死缓减刑特例，非普通减刑结果）","k":"","kb":52,"kh":[[196,253]]},{"id":"2024-5","y":2024,"t":"单","s":"我国刑法规定,非法吸收公众存款,扰乱金融秩序的,处三年以下有期徒刑或拘役, 并处罚金。此处规定的罚金属于（ ）。","o":["限额罚金","无限额罚金","比例罚金","倍比罚金"],"a":"B","e":"\u0001条文仅规定“并处罚金”或“单处罚金”而未具体列明罚金绝对金额、幅度或倍数比例，属于无限额罚金制。\u0002\nA✗ 限额罚金制在条文中会直接标明具体的金钱上下限（如“并处二万元以上二十万元以下罚金”）\nB✓ 无限额罚金：《刑法》第176条仅规定“并处罚金或者单处罚金”，既不设定金额区间也不限定比例倍数，由法官依第52条结合犯罪情节裁量，属\u0001无限额罚金制\u0002\nC✗ 比例罚金制以犯罪金额或销售金额的特定百分比例（如“销售金额百分之五十以上二倍以下”）计算罚金\nD✗ 倍比罚金制以违法所得或偷逃税额的一定倍数（如“偷税数额一倍以上五倍以下罚金”）作为处罚标准","k":"","kb":47,"kh":[[157,177]]},{"id":"2024-11","y":2024,"t":"单","s":"持A国临时边境通行证的人员可从指定口岸出入我国国境，并在规定的边境区活动，A国人员甲持该证入境后，未向我国出入境管理部门申请办理前往我国非边境地区的证件，伙同多名A国人员前往我国非边境区打工。后被查获，正确的是（ ）。","o":["对甲可以独立适用驱逐出境","甲没有偷越我国国(边)境","我国对甲的行为没有刑事管辖权","甲的行为属于组织他人偷越我国国(边)境"],"a":"A","e":"\u0001外国人持仅限边境区的通行证擅自伙同多人非法进入我国非边境区打工，属偷越国（边）境行为，在我国领域内犯罪有属地管辖权，对其可以独立适用驱逐出境。\u0002\nA✓ 对甲可以独立适用驱逐出境：甲为A国国籍（外国人）且在我国境内实施涉边境犯罪，依据《刑法》第35条对于犯罪的外国人\u0001可以独立适用或者附加适用驱逐出境\u0002\nB✗ 司法解释明确规定，持用仅限边境地区通行的证件未经批准超出允许范围进入我国非边境地区的，构成\u0001偷越国（边）境\u0002\nC✗ 违法行为发生在中国领土范围内，依《刑法》第6条属地管辖原则，我国当然具有刑事管辖权\nD✗ 甲仅仅是“伙同”多名同胞结伴去打工，共同偷越国（边）境（可能构成一般偷越国（边）境罪共犯），而非以组织策划他人偷渡并招募运送为业的\u0001组织他人偷越国（边）境罪\u0002","k":"","kb":45,"kh":[[15,40],[78,126]]},{"id":"2025-11","y":2025,"t":"单","s":"下列选项中,体现我国刑罚特殊预防目的的是（ ）。","o":["开展宣传教育,提高公民的刑事法治观念","通过对犯罪分子的处罚,安抚被害人及其亲属","通过对犯罪分子的处罚,威慑意图实施犯罪的其他人","对判处管制的犯罪分子实行社区矫正,预防其重新犯罪"],"a":"D","e":"\u0001特殊预防是指通过对犯罪人适用和执行刑罚（如对管制犯开展社区矫正教育），防止该犯罪分子本人再度犯罪。\u0002\nA✗ 开展面向社会公民的普法宣传教育以遏制潜在违法，属于\u0001一般预防\u0002\nB✗ 安抚被害人及其亲属情绪体现刑罚的\u0001安抚/报应正义功能\u0002，而非专门预防再犯之特殊预防\nC✗ 通过对犯罪分子惩罚以震慑社会上尚未犯罪但意图效仿的其他人，属于\u0001一般预防\u0002\nD✓ 对判处管制的犯罪分子实行社区矫正，预防其重新犯罪：精准指向\u0001“已经犯罪的人本身不再重新犯罪”\u0002，正是特殊预防的核心内涵","k":"","kb":50,"kh":[[116,156]]}]},{"sub":"刑法","name":"共同犯罪","w":1.3,"L":24,"qs":[{"id":"2006-6","y":2006,"t":"单","s":"甲因遭丈夫乙的虐待而被迫离家独居。某日其女儿丙(13 岁)来看望甲,甲叫丙把家中的老鼠药放到乙喝的酒中。丙按甲的吩咐行事,致乙死亡。对此案,下列说法中正确的是（ ）。","o":["甲,丙构成共同犯罪","甲构成投放危险物质罪","甲是故意杀人罪的教唆犯","甲单独构成故意杀人罪"],"a":"D","e":"\u0001教唆未满14周岁无责任能力人投放毒药杀特定人，构成故意杀人罪的间接正犯（单独犯）。\u0002\nA✗ 丙年仅13周岁，尚未达到故意杀人罪的刑事责任年龄，二人不成立共同犯罪\nB✗ 投放老鼠药的目标明确指向特定个人（丈夫乙），并未危害不特定多数人的公共安全，不构成投放危险物质罪\nC✗ 教唆无刑事责任能力人犯罪，不成立共犯中的教唆犯，而成立\u0001间接正犯\u0002\nD✓ 甲单独构成故意杀人罪：利用13岁幼女作为工具毒杀丈夫，甲成立故意杀人罪的\u0001间接正犯\u0002","k":"","kb":22,"kh":[[74,99],[132,148]]},{"id":"2006-23","y":2006,"t":"多","s":"甲教唆乙杀丁,丙知情后,给乙提供一把匕首,乙将丁杀害。关于本案,下列说法中正确的是（ ）。","o":["本案的共同犯罪是复杂共同犯罪","本案的共同犯罪是必要共同犯罪","甲,乙一般可以认定为主犯","丙一般可以认定为从犯"],"a":"ACD","e":"\u0001甲教唆、乙实行、丙提供匕首帮助杀害丁，三人之间存在分工且非必要共犯，甲乙通常为主犯、丙通常为从犯。\u0002\nA✓ 复杂共同犯罪：各共同犯罪人之间存在明确分工（教唆犯、实行犯、帮助犯），即属复杂共同犯罪\nB✗ 必要共同犯罪指法律规定必须二人以上才能构成的罪（如聚众斗殴、重婚）；故意杀人罪可一人独犯，属\u0001任意共同犯罪\u0002\nC✓ 甲起意教唆并促成犯意、乙直接实行杀人行为，二者通常在共同犯罪中起主要作用，为主犯\nD✓ 丙仅提供一把匕首起到次要、辅助作用，一般认定为从犯（应当从轻、减轻或免除处罚）","k":"","kb":23,"kh":[[31,47],[147,174]]},{"id":"2007-8","y":2007,"t":"单","s":"甲教唆 15 周岁的乙实施盗窃,乙按照甲的教唆盗窃了一辆价值 1 万元的摩托车。对此案的正确处理是 （ ）。","o":["甲与乙共同构成盗窃罪,甲是主犯,乙是从犯","甲与乙共同构成盗窃罪,甲是教唆犯,乙是实行犯","甲构成教唆罪,乙构成盗窃罪","甲单独构成盗窃罪"],"a":"D","e":"\u0001教唆15周岁（未达盗窃罪16周岁责任年龄）的未成年人盗窃，不成立共同犯罪，甲单独成立盗窃罪（间接正犯）。\u0002\nA✗ 15周岁人对普通盗窃罪不负刑事责任，甲、乙不具备共同犯罪的主体资格\nB✗ 乙不构成盗窃罪，因而不存在教唆犯与实行犯的共犯关系\nC✗ 刑法分则没有独立的“教唆罪”罪名，教唆犯按所教唆具体罪名定罪；且本案系间接正犯\nD✓ 甲单独构成盗窃罪：利用未达刑事责任年龄人实施盗窃，成立盗窃罪的\u0001间接正犯\u0002（单独正犯）","k":"","kb":22,"kh":[[74,99],[132,148]]},{"id":"2008-11","y":2008,"t":"单","s":"甲与乙共谋后,分别从前、后门进入李家追杀李某,李某被甲追至后门处被乙一刀捅死。甲、乙的共同犯罪形式是（ ）。","o":["必要共同犯罪","简单共同犯罪","复杂共同犯罪","特殊共同犯罪"],"a":"B","e":"\u0001甲乙共谋并分头入室共同追杀被害人，二人均属于直接实施构成要件的实行犯（无分工），属简单共同犯罪。\u0002\nA✗ 故意杀人罪一人即可完成，不是刑法要求二人以上才能成立的必要共同犯罪\nB✓ 简单共同犯罪（共同正犯）：甲和乙共同实施故意杀人罪的实行行为，共犯内部不存在教唆、帮助与实行之分工\nC✗ 复杂共同犯罪要求存在实行犯与教唆犯、帮助犯之间的角色分工\nD✗ 特殊共同犯罪是指三人以上为共同实施犯罪而组成的较为固定的犯罪集团","k":"","kb":22,"kh":[[21,31]]},{"id":"2008-22","y":2008,"t":"多","s":"下列关于共同犯罪的表述,正确的有（ ）。","o":["二人以上共同过失犯罪的,不以共同犯罪论处","对组织、领导犯罪集团的首要分子,按照犯罪集团的全部罪行处罚","事前与盗窃犯罪人通谋、事后为其销赃的行为,构成盗窃罪的共同犯罪","实行犯的实行行为超过了共同犯罪故意范围的,其他共同犯罪人对超出共同故意范围的行为不承担刑事责任"],"a":"ABCD","e":"\u0001共同过失不构成共犯；犯罪集团首要分子按集团全部罪行负责；事前通谋事后销赃构盗窃共犯；实行过限由实行者自负。\u0002\nA✓ 《刑法》第25条第2款明文规定：\u0001二人以上共同过失犯罪，不以共同犯罪论处\u0002，应负刑责的按各自所犯之罪分别处罚\nB✓ 《刑法》第26条第3款明文规定：对组织、领导犯罪集团的首要分子，\u0001按照集团所犯的全部罪行处罚\u0002\nC✓ 事前与盗窃犯罪人通谋、事后按约定窝藏或销赃的，具有共同犯意，构成\u0001盗窃罪的共同犯罪\u0002\nD✓ 共同犯罪人中有人实施了超出共同犯罪故意范围的行为（实行过限），\u0001其他共犯人对超出部分不承担刑事责任\u0002\n记法：共犯四条铁律：共同过失不成团；集团首脑全买单；事前通谋销赃成共犯；实行过限各自担。","k":"","kb":22,"kh":[[32,51],[149,166]]},{"id":"2009-14","y":2009,"t":"单","s":"甲、乙二人不约而同在同一商场内行窃,各自盗窃财物数额较大。下列对甲、乙二人行为的认定,正确的是（ ）。","o":["甲、乙二人是共同实行犯","甲、乙二人互为片面共犯","甲、乙二人互为间接正犯","甲、乙二人不构成盗窃罪共犯"],"a":"D","e":"\u0001二人互不知情、不约而同在同一商场各自盗窃，欠缺共同犯罪故意（意思联络），属同时犯而非共犯。\u0002\nA✗ 甲、乙相互间没有任何犯意沟通与意思联络，不成立共同实行犯\nB✗ 片面共犯（通说认可单向暗中帮助等情形，但仍须一方明知并配合另一方）；“互为片面共犯”本身不成立，且本案双方互不知情\nC✗ 双方均未把对方当作犯罪工具支配利用，不成立间接正犯\nD✓ 不构成盗窃罪共犯：二人缺乏共同犯罪的\u0001意思联络（共同故意）\u0002，仅属于刑法上的\u0001同时犯\u0002，各自对自己盗窃数额负责","k":"","kb":22,"kh":[[15,31],[109,122]]},{"id":"2009-16","y":2009,"t":"单","s":"甲教唆乙杀文某,并指使丙为乙提供枪支,乙、丙按甲的要求实施了相应的行为。甲、乙、丙的犯罪属于（ ）。","o":["必要共同犯罪","特殊共同犯罪","简单共同犯罪","复杂共同犯罪"],"a":"D","e":"\u0001甲教唆、乙实行杀人、丙提供枪支帮助，存在教唆犯、实行犯、帮助犯三种角色分工，属复杂共同犯罪。\u0002\nA✗ 故意杀人罪无需法定的二人以上主体，属任意共同犯罪\nB✗ 特殊共同犯罪须为三人以上组成的较为固定的犯罪集团；本案系临时协同杀人，属一般共同犯罪\nC✗ 简单共同犯罪要求各共同犯罪人都是实行犯而无分工\nD✓ 复杂共同犯罪：存在\u0001教唆犯（甲）、实行犯（乙）、帮助犯（丙）\u0002之间的明确分工","k":"","kb":22,"kh":[[21,31]]},{"id":"2009-25","y":2009,"t":"多","s":"下列情形中,应以共犯论处的有（ ）。","o":["与走私罪犯通谋,为其提供运输方便的","直接向走私人非法收购国家禁止进口物品的","非国家工作人员与国家工作人员勾结,伙同贪污的","知道或者应当知道他人实施生产、销售伪劣商品犯罪而为其提供生产、经营场所的"],"a":"ACD","e":"\u0001通谋协助走私、内外勾结贪污、明知他人生产销售伪劣商品而提供场所，刑法明文规定以共犯论处。\u0002\nA✓ 《刑法》第156条：与走私罪犯通谋，为其提供贷款、资金、账号、发票、证明或运输、保管、邮寄等方便的，\u0001以走私罪的共犯论处\u0002\nB✗ 《刑法》第155条规定，\u0001直接向走私人非法收购\u0002国家禁止进口物品的，直接\u0001以走私罪（正犯/实行犯）论处\u0002（注意法条用词是“以走私罪论处”，非“以共犯论处”）\nC✓ 《刑法》第382条第3款：非国家工作人员与国家工作人员勾结，伙同贪污的，\u0001以共犯论处\u0002\nD✓ 相关司法解释规定，明知或应知他人实施生产、销售伪劣商品犯罪而提供生产、经营场所的，以生产、销售伪劣商品犯罪的\u0001共犯论处\u0002\n特别留意区分刑法条文表述：\n- 第156条（通谋帮走私）：以走私罪的\u0001共犯\u0002论处；\n- 第155条（直接向走私人收购）：\u0001以走私罪论处\u0002（间接走私正犯，非共犯）。","k":"","kb":22,"kh":[[15,31]]},{"id":"2010-18","y":2010,"t":"单","s":"国家工作人员甲与普通公民乙相互勾结,由乙接受他人财物,由甲为行贿人谋取利益。甲、乙的行为（ ）。","o":["属于必要的共同犯罪","属于任意的共同犯罪","属于特殊的共同犯罪","不成立共同犯罪"],"a":"B","e":"\u0001国家工作人员与普通公民勾结共同受贿，受贿罪法律未规定必须二人以上构成，故属任意的共同犯罪。\u0002\nA✗ 必要共同犯罪是指分则条文规定必须由二人以上才能实施的犯罪（如聚众犯罪、行贿与受贿属对向犯但各自成罪），受贿罪单人即可实施\nB✓ 任意的共同犯罪：受贿罪一人即可实施，普通公民与国家工作人员勾结共谋受贿形成共犯，法律未限定主体必须复数，故属\u0001任意共犯\u0002\nC✗ 特殊共同犯罪须是3人以上组成的犯罪集团，本案仅甲、乙二人\nD✗ 普通公民与国家工作人员勾结共同收受财物并谋利，依共同犯罪理论成立受贿罪共犯","k":"","kb":22,"kh":[[21,31]]},{"id":"2011-12","y":2011,"t":"单","s":"甲指使15周岁的乙盗窃轿车,乙将盗得的轿车交给甲,甲销赃得款10万元。在本案中（ ）。","o":["甲、乙构成共同犯罪","甲是教唆犯,且属于主犯","乙是实行犯,是从犯","甲是实行犯"],"a":"D","e":"\u0001指使15周岁未成年人盗窃轿车后交由自己销赃，双方不成立共犯，指使人属于盗窃罪的实行犯（间接正犯）。\u0002\nA✗ 15周岁人对普通盗窃罪无刑事责任能力，二人主体要件不符，不成立共同犯罪\nB✗ 既不成立共同犯罪，便不存在共犯体系中的教唆犯与主犯\nC✗ 15周岁的乙不构成盗窃罪，更非共同犯罪中的从犯\nD✓ 甲是实行犯：利用未达刑事责任年龄的乙作为犯罪工具窃取轿车，甲成立盗窃罪的\u0001间接正犯\u0002（间接正犯本质上属于正犯/实行犯）\n间接正犯不是共犯，而是把无责任能力人当工具利用，自己单独直接充当\u0001实行犯（正犯）\u0002。","k":"","kb":22,"kh":[[74,99],[132,148]]},{"id":"2012-10","y":2012,"t":"单","s":"甲雇佣乙杀胡某,并且带乙辨认了胡某。乙在某夜将王某误当作胡某而杀害。甲因此拒付 \"佣金”,在本案中（ ）。","o":["甲构成故意杀人罪既遂","甲构成故意杀人罪未遂","乙构成故意杀人罪未遂","乙构成过失致人死亡罪"],"a":"A","e":"\u0001教唆他人杀人，实行犯夜误认将王某当作胡某杀害，按法定符合说及共犯既遂从属原则，教唆犯亦成立故意杀人罪既遂。\u0002\nA✓ 甲构成故意杀人罪既遂：实行犯乙虽发生对象错误（杀错人），但在“生命法益”同一构成要件内依\u0001法定符合说\u0002成立故意杀人罪既遂；基于共犯\u0001“一人既遂、全案既遂”\u0002原则，教唆犯甲同样既遂\nB✗ 甲未能阻止乙杀人成功，且乙客观上已造成他人死亡结果，不能对甲优待认定为未遂\nC✗ 乙误将王某当胡某杀死，对具体对象认错但对侵害生命法益未发生客体错误，直接构成故意杀人罪既遂\nD✗ 乙主观上明确有杀人故意并直接开枪或挥刀致人死亡，并非过失","k":"","kb":27,"kh":[[96,144]]},{"id":"2013-5","y":2013,"t":"单","s":"甲为泄愤,教唆乙炸毁某公司办公楼,乙因害怕没有实施爆炸。对甲的行为（ ）。","o":["应以教唆罪定罪处罚","应认定为爆炸罪的犯意表示","应以爆炸罪定罪,但应当免除处罚","应以爆炸罪定罪,但可以从轻或者减轻处罚"],"a":"D","e":"\u0001教唆犯教唆他人炸毁办公楼但被教唆者害怕未实施，属于被教唆人未犯被教唆之罪（教唆未遂），按爆炸罪定罪并可从宽。\u0002\nA✗ 教唆犯不是独立罪名，我国刑法没有“教唆罪”，必须按\u0001所教唆的具体罪名（爆炸罪）\u0002定罪\nB✗ 教唆行为已经具体向他人传达犯意并督促实行，具有现实社会危害性，不属于无罪的犯意表示\nC✗ 《刑法》第29条第2款规定的处罚幅度是“\u0001可以从轻或者减轻处罚\u0002”，而非“应当免除”\nD✓ 应以爆炸罪定罪，但可以从轻或者减轻处罚：属于《刑法》第29条第2款“\u0001被教唆的人没有犯被教唆的罪\u0002”情形（独立教唆犯/教唆未遂）","k":"","kb":24,"kh":[[62,94]]},{"id":"2013-6","y":2013,"t":"单","s":"我国刑法划分共同犯罪人种类的依据是（ ）。","o":["作用","作用为主,兼顾分工","分工","分工为主,兼顾作用"],"a":"B","e":"\u0001我国《刑法》以共同犯罪人在共同犯罪中所起的作用为主、兼顾分工，划分出主犯、从犯、胁从犯和教唆犯四类。\u0002\nA✗ 只按作用划分仅能分出主犯、从犯、胁从犯，解释不了为何另有教唆犯\nB✓ 作用为主，兼顾分工：前三种（主犯、从犯、胁从犯）按作用大小划分，教唆犯则体现了\u0001分工标准\u0002\nC✗ 纯粹按分工划分应是正犯（实行犯）、教唆犯、帮助犯，并非我国立法体例\nD✗ 我国立法重在考察犯罪人在共犯中所起\u0001作用大小\u0002以决定量刑轻重，故作用为主而非分工为主","k":"","kb":23,"kh":[[147,193]]},{"id":"2014-9","y":2014,"t":"单","s":"甲受乙教唆,雇佣童工从事危重劳动,情节严重。甲、乙的犯罪属于（ ）。","o":["必要的共同犯罪","简单的共同犯罪","特殊的共同犯罪","任意的共同犯罪"],"a":"D","e":"\u0001教唆他人实施雇佣童工从事危重劳动罪，因法律未要求该罪必须二人以上构成，故属于任意的共同犯罪。\u0002\nA✗ 雇佣童工从事危重劳动罪单个雇主即可实施，并非刑法分则强制要求二人以上才可构成的必要共犯\nB✗ 乙是教唆犯、甲是实行犯，二人存在角色分工，属于\u0001复杂共同犯罪\u0002而非简单共同犯罪\nC✗ 仅甲、乙二人临时形成犯意，未形成三人以上固定的犯罪集团，不属于特殊共同犯罪\nD✓ 任意的共同犯罪：只要刑法分则没有限定犯罪主体必须复数，二人以上共同实施即属任意共同犯罪","k":"","kb":22,"kh":[[21,31]]},{"id":"2017-6","y":2017,"t":"单","s":"甲约乙去偷笔记本电脑,乙不敢去偷,但答应负责找销路。甲得手后将盗得的10台电脑交给乙, 乙找到经营电子产品的丙,丙觉得电脑的来路不明, 就以10000元的价格收购了价值45000元的电脑。对","o":["甲、乙的行为构成盗窃罪的共同犯罪","甲、乙、丙的行为构成盗窃罪的共同犯罪","乙的行为构成盗窃罪和掩饰、隐瞒犯罪所得罪","乙、丙的行为构成掩饰、隐瞒犯罪所得罪的共同犯罪"],"a":"A","e":"\u0001事前通谋盗窃并负责事后销赃的乙，与盗窃实行犯甲成立盗窃罪共犯；丙事前未通谋而事后低价收购赃物，单独构成掩饰、隐瞒犯罪所得罪。\u0002\nA✓ 甲、乙构成盗窃罪共同犯罪：乙虽然害怕未去现场行窃，但\u0001事前答应负责找销路\u0002，具备事前通谋与共同犯罪故意，成立盗窃罪共犯\nB✗ 丙在甲、乙盗窃既遂之后才介入收赃，事前并无通谋，不与甲、乙成立盗窃罪共犯\nC✗ 乙因成立盗窃罪共犯，其后续销赃属于\u0001事后不可罚行为（共犯行为的自然延伸）\u0002，不再另定掩饰、隐瞒犯罪所得罪\nD✗ 乙销赃不另构成掩饰、隐瞒犯罪所得罪，故乙与丙也不成立该罪的共犯（丙独自构成本罪）\n销赃核心口诀：\u0001“事前通谋事后销赃＝盗窃共犯（事后销赃不另定罪）；事前无通谋事后知情收赃＝掩饰、隐瞒犯罪所得罪（单独定罪）”\u0002。","k":"","kb":22,"kh":[[149,166]]},{"id":"2020-43","y":2020,"t":"多","s":"下列选项中,应认定为共同犯罪中的教唆犯的有（ ）。","o":["甲引诱17岁的王某盗窃了巨额财物","乙唆使已有自杀决意的高某赶快自杀","丙在演讲中煽动听众实施分裂国家的活动","丁说服丈夫刘某利用职权向他人索取巨额财物"],"a":"AD","e":"\u0001引起17岁少年犯意（教唆犯）及说服丈夫索贿（教唆犯）均属教唆犯；教唆自杀或分则独立成罪的煽动行为不成立教唆犯。\u0002\nA✓ 甲引诱已满16周岁的王某盗窃巨额财物，王某达完全盗窃刑事责任年龄，甲构成\u0001教唆犯\u0002（且因王某不满18周岁应当从重处罚）\nB✗ 一则高某\u0001已有自杀决意\u0002，不存在被引发意图；二则自杀本身不构成犯罪，通常教唆自杀不构成教唆犯（若无欺骗/强迫）\nC✗ 煽动分裂国家已被《刑法》第103条第2款规定为独立的\u0001煽动分裂国家罪（正犯）\u0002，不再按教唆犯论处\nD✓ 丁说服拥有职务便利的丈夫刘某索贿，虽丁本人非国家工作人员，仍可与丈夫构成受贿罪的\u0001教唆犯\u0002\n高发考点辨析：\n1. 非国家工作人员完全可以成为受贿罪、贪污罪等身份犯的教唆犯或帮助犯；\n2. 刑法分则把“煽动……”明文独立成罪的（如煽动分裂国家罪、煽动颠覆国家政权罪），按独立正犯定罪，不再适用总则教唆犯。","k":"","kb":24,"kh":[[41,61]]},{"id":"2021-11","y":2021,"t":"单","s":"下列对于首要分子的理解中,正确的是（ ）。","o":["首要分子只存在于共同犯罪之中","主犯不一定是首要分子,首要分子不一定是主犯","主犯一定是首要分子","首要分子一定是主犯"],"a":"B","e":"\u0001首要分子与主犯是交叉关系：犯罪集团首要分子一定是主犯，但聚众犯罪（如只处罚首要分子的罪）的首要分子未必在共犯中且主犯不一定是首要分子。\u0002\nA✗ 某些聚众犯罪（如聚众扰乱公共场所秩序罪等）刑法规定\u0001只处罚首要分子\u0002，此时仅一人构罪，不成立共同犯罪\nB✓ 主犯不一定是首要分子（一般共同犯罪中的主要作用者或犯罪集团里的普通骨干均是主犯但非首要分子）；首要分子也不一定是主犯（如单罚首要分子的聚众犯罪无主从犯之分）\nC✗ 一般共同犯罪中起主要作用的行为人是主犯，但无所谓“首要分子”\nD✗ 法律只处罚首要分子一人的聚众犯罪中，首要分子构成单独犯罪而非共同犯罪中的主犯","k":"","kb":23,"kh":[[13,47]]},{"id":"2021-19","y":2021,"t":"单","s":"某国有资本参股公司财务总监甲(非国家工作人员)勾结该公司董事乙(国家工作人员),分别利用各自的职务便利,共同将公司财物占为己有,数额特别巨大。对甲、乙行为性质的认定,正确的是","o":["按照主犯的犯罪性质定罪","按照甲、乙的犯罪性质分别定罪","按照甲的身份性质定罪","按照乙的身份性质定罪"],"a":"A","e":"\u0001非国家工作人员与国家工作人员勾结，分别利用各自职务便利共同将本单位财物占为己有，按照主犯的犯罪性质定罪。\u0002\nA✓ 按照主犯的犯罪性质定罪：最高法司法解释明文规定，混合主体分别利用各自职权共同非法占有本单位财物的，\u0001依主犯的犯罪性质（贪污罪或职务侵占罪）统一定罪\u0002\nB✗ 共同犯罪原则上统一罪名定罪处罚，不能各按各的身份分别定贪污罪和职务侵占罪\nC✗ 不一定按非国家工作人员甲的身份定职务侵占罪，需比较谁在共同犯罪中起主要作用\nD✗ 不一定按国家工作人员乙的身份定贪污罪（如果非国家工作人员甲是主犯，则全案依甲定职务侵占罪）\n混合身份共犯定性对比：\n- 仅国家工作人员利用职务便利、普通人配合 → 一律随身份者定\u0001贪污罪\u0002；\n- 各自利用各自职务便利共同侵占 → \u0001按主犯犯罪性质定罪\u0002；难以区分主从犯的，按贪污罪定罪处罚。","k":"","kb":25,"kh":[[128,164]]},{"id":"2022-16","y":2022,"t":"单","s":"下列行为人中,应认定为走私毒品罪共犯的是","o":["包庇走私毒品的犯罪分子的缉毒人员甲","被胁迫帮助贩毒分子运送毒品入境的乙","为走私毒品的犯罪分子隐瞒犯罪所得的丙","非法携带大量用于制造毒品的原料出境的丁"],"a":"B","e":"\u0001被胁迫帮助运送毒品入境的胁从犯属于走私毒品罪的共同犯罪人。\u0002\nA✗ 缉毒人员包庇走私毒品犯罪分子，刑法第349条规定了独立的\u0001包庇毒品犯罪分子罪\u0002（且属司法/缉毒工作人员重刑罪），非走私毒品共犯\nB✓ 被胁迫帮助运送毒品入境：胁从犯（第28条）是在共同犯罪中受胁迫参加犯罪之人，\u0001胁从犯属于共同犯罪人之一\u0002\nC✗ 事后为毒品犯罪分子隐瞒犯罪所得属于\u0001洗钱罪\u0002（第191条）或窝藏转移毒品赃物罪，事前无通谋不成立走私毒品共犯\nD✗ 非法携带大量制毒物品/原料出境成立\u0001非法买卖、运输、携带、持有毒品原植物种子、幼苗或走私制毒物品罪\u0002，不直接等同走私毒品罪","k":"","kb":22,"kh":[[15,31]]},{"id":"2022-41","y":2022,"t":"多","s":"下列行为人中,应认定为主犯的有","o":["诈骗集团的骨干成员","教唆13岁少年杀人后抛尸的成年人","遭暴力胁迫实施抢劫行为的犯罪分子","聚众扰乱公共场所秩序罪的首要分子"],"a":"AB","e":"\u0001诈骗集团骨干成员（起主要作用）、教唆13岁少年杀人抛尸的成年人（依据第17条第3款13岁杀人核准追诉后共犯中起主要作用），均认定为主犯。\u0002\nA✓ 诈骗集团的骨干成员在犯罪集团中起主要作用，依法认定为\u0001主犯\u0002\nB✓ 依据《刑法修正案（十一）》增设的《刑法》第17条第3款，已满12周岁不满14周岁的人犯故意杀人罪经最高检核准追诉应当负刑事责任；成年教唆者在共同犯罪中起主要支配作用，依法认定为\u0001主犯\u0002\nC✗ 遭暴力胁迫参加抢劫的犯罪分子属于\u0001胁从犯\u0002（《刑法》第28条），不属于主犯\nD✗ 聚众扰乱公共场所秩序罪（第291条）刑法\u0001只处罚首要分子\u0002，若仅处罚首要分子一人则不成立共同犯罪，无所谓主犯\n\u0001【新法关联】\u00022021年3月《刑法修正案（十一）》将极端暴力杀人伤人最低刑事责任年龄降至12周岁（需最高检核准追诉），彻底打破了以往“教唆13岁少年杀人一律不成立共犯”的旧考点，上述教唆情形正是据此命题。","k":"","kb":23,"kh":[[13,47]]},{"id":"2023-2","y":2023,"t":"单","s":"甲与乙合谋诈骗张某钱财。后乙发现张某系独居老人,心生不忍,借故退出。甲按计划继续与张某联系,骗得60万元。乙的行为属于","o":["犯罪预备","犯罪未遂","犯罪中止","犯罪既遂"],"a":"D","e":"\u0001共谋诈骗后仅因心软“借故退出”而未消除自己先前心理或物理贡献、亦未阻止同伙继续行骗，仍应对同伙既遂结果承担既遂责任。\u0002\nA✗ 同伙甲已经继续实施诈骗并顺利骗得60万元，全案已达到既遂状态\nB✗ 共同犯罪遵循\u0001“部分实行、全部责任”\u0002原则，共犯一人既遂原则上全案既遂\nC✗ 共犯人成立犯罪中止要求必须\u0001有效切断自己对后续犯罪的因果影响或积极阻止共犯得逞\u0002；仅仅消极“借故退出”不足以成立中止\nD✓ 犯罪既遂：乙与甲预先共谋诈骗并已形成共同犯意，后消极退出既未劝阻甲亦未消除影响，应对甲骗得60万元的\u0001既遂结果共同承担既遂责任\u0002\n共犯中止的严格标准：单方“退出”想成立犯罪中止，必须\u0001有效消除自己先前提供的帮助/共谋作用，或者成功阻止其他共犯人完成犯罪\u0002；如果其他共犯仍然既遂，则退出者亦不能免除既遂责任。","k":"","kb":22,"kh":[[15,31]]},{"id":"2024-14","y":2024,"t":"单","s":"下列选项中可以认定为主犯的是（ ）。","o":["主动提出开车送朋友到他人家中盗窃的甲","受他人蛊惑,积极实施扰乱公共场所秩序行为的乙","在组织领导传销活动犯罪中承担宣传职责的丙","为黑社会性质组织经营的公司提供租车服务的丁"],"a":"C","e":"\u0001在组织、领导传销活动犯罪中承担管理、协调、宣传、培训等职责的人员属于组织者、领导者，在传销共犯中可以认定为主犯。\u0002\nA✗ 主动开车接送盗窃属于为他人实行盗窃提供交通工具便利的\u0001帮助犯\u0002，一般起次要作用，通常认定为从犯\nB✗ 聚众扰乱公共场所秩序罪（第291条）刑法只处罚首要分子；受人蛊惑积极参与者既非首要分子，通常不构罪或非主犯\nC✓ 两高一部传销意见明确：在传销活动中承担\u0001管理、协调、宣传、培训\u0002等职责的人员属组织者、领导者（本罪仅追责组织领导者），在共同犯罪中起主要作用，应认定为\u0001主犯\u0002\nD✗ 仅仅为黑社会性质组织经营的公司提供常规汽车租赁服务，在共同犯罪中（即使明知）一般仅起到外围次要辅助作用或正常经营边界，不认定为主犯","k":"","kb":25,"kh":[[34,90]]},{"id":"2025-6","y":2025,"t":"单","s":"下列选项中,成立共同犯罪的是（ ）。","o":["商人甲低价收购徐某盗窃的贵重珠宝","毒贩乙在练歌房向过生日的顾客胡某出售冰毒","经理丙指使下属黄某打牌时故意输钱实施行贿","主播丁向“粉丝”郑某高价出售撬锁的方法"],"a":"C","e":"\u0001指使下属以故意输钱的方式向官员行贿，双方形成行贿共同故意，成立共同犯罪。\u0002\nA✗ 事前没有通谋，事后低价收购他人盗窃赃物的，不成立盗窃罪共犯，单独构成\u0001掩饰、隐瞒犯罪所得罪\u0002\nB✗ 贩卖毒品罪中，毒贩卖给吸毒者吸食属\u0001对向犯\u0002，吸毒者单纯购买自吸不构成贩卖毒品罪，二人不成立共同犯罪\nC✓ 经理丙指使下属黄某通过打牌故意输钱实施变相行贿，二人就共同行贿达成意思联络并协力实施，\u0001成立行贿罪的共同犯罪\u0002\nD✗ 主播向粉丝传授犯罪方法仅单独构成\u0001传授犯罪方法罪\u0002（第295条），对方若未采纳或双方无特定联合犯意时不成立共犯","k":"","kb":22,"kh":[[21,31],[149,166]]},{"id":"2026-2","y":2026,"t":"单","s":"对于参与犯罪谋划而未参与犯罪实行者,下列表述正确的是","o":["不成立共同犯罪","可以成立犯罪中止","无法成立犯罪未遂","无法成立犯罪既遂"],"a":"B","e":"\u0001仅参与犯罪谋划而未参与实际实行者属于共谋共同正犯，若他人实行前成功中止或阻止结果可成立犯罪中止。\u0002\nA✗ 事前参与谋划、形成共同故意后即使未亲临现场实行，在刑法理论上仍成立\u0001共同犯罪\u0002（共谋共同正犯）\nB✓ 可以成立犯罪中止：虽然仅参与谋划，但只要在犯罪既遂前主动放弃犯意，并\u0001有效阻止同伙实施或消除自身共谋贡献防止结果发生\u0002的，可以成立犯罪中止\nC✗ 若实行犯在实行过程中因意志以外原因未得逞（未遂），未亲自实行的共谋人同样随全案成立\u0001犯罪未遂\u0002\nD✗ 若实行犯顺利得逞，依据“部分实行全部责任”，未到场实行的共谋人同样构成\u0001犯罪既遂\u0002","k":"","kb":22,"kh":[[15,31],[109,122]]}]},{"sub":"刑法","name":"刑罚执行与消灭","w":1.3,"L":22,"qs":[{"id":"2006-11","y":2006,"t":"单","s":"按照刑法的规定,下列犯罪人中,不可能被减刑的对象是（ ）。","o":["被判处管制的犯罪分子","被单处罚金的犯罪分子","作为累犯被判处有期徒刑的犯罪分子","被宣告缓刑的犯罪分子"],"a":"B","e":"\u0001单处罚金刑不能适用《刑法》第78条规定的减刑（只存在酌情减少或免除缴纳）。\u0002\nA✗ 管制犯在执行期间确有悔改或立功表现的，可以适用减刑\nB✓ 单处罚金刑：减刑对象仅限被判处\u0001管制、拘役、有期徒刑、无期徒刑\u0002四类主刑的犯罪分子，不包括单处罚金\nC✗ 累犯不得假释和缓刑，但\u0001累犯可以减刑\u0002\nD✗ 被宣告缓刑的罪犯原则上一般不予减刑，但有\u0001重大立功表现\u0002的可以减刑（并非“不可能”）\n记法：减刑只看四主刑（管、拘、有、无），单处罚金只酌减免；累犯禁缓禁假不禁减。","k":"","kb":12,"kh":[[18,41],[223,245]]},{"id":"2006-13","y":2006,"t":"单","s":"楚某1997年3月5日犯甲罪，追诉期限应为10年，2002年3月5日又犯乙罪，乙罪的追诉期限也是10年。这时甲罪的追诉期限应（ ）。","o":["从犯乙罪之日起计算,共计 20 年,即以甲罪的追诉期限 10 年加乙罪的追诉期限 10 年","从犯乙罪之日起计算,共计 15 年,即以甲罪追诉期限剩余的 5 年加乙罪的追诉期限 10 年","从犯乙罪之日起计算,还有 5 年","从犯乙罪之日起计算,还有 10 年"],"a":"D","e":"\u0001追诉期限内又犯新罪的，前罪追诉期限中断，从犯后罪之日起重新计算前罪原完整追诉期限。\u0002\nA✗ 并非简单把两罪追诉期限相加为20年，而是前罪重新起算原10年追诉期（与后罪10年同期计算）\nB✗ 不是“剩余的5年加后罪10年”，前罪已过去的5年作废，重新完整起算10年\nC✗ 追诉时效中断后前罪时间归零重计，不是只剩5年\nD✓ 从犯乙罪之日起重新计算10年：前罪1997年犯下（追诉期10年），2002年又犯新罪发生\u0001追诉时效中断\u0002，从2002年3月5日起重新起算甲罪10年追诉期限","k":"","kb":15,"kh":[[337,365]]},{"id":"2007-13","y":2007,"t":"单","s":"甲于 2001 年 1 月 20 日对一处国家保护的名胜古迹进行破坏,情节严重。 2006 年 1 月 21 日甲因嫖娼行为被公安人员抓获,交代了上述破坏名胜古迹行为。我国刑法规定,故意毁损国家保护的名胜古迹,情节严重的, 处 5 年以下有期徒刑或者拘役,并处或者单处罚金。甲的破坏名胜古迹行为 （ ）。","o":["已超过追诉时效期限,不应追究刑事责任","仍在追诉时效期限内,应当追究刑事责任","应认为是对名胜古迹的持续破坏,不受追诉时效期限的限制","虽已超过追诉时效期限,但可报最高人民检察院核准,追究其刑事责任"],"a":"B","e":"\u0001立案侦查或受理案件后逃避侦查审判的，追诉期限不受限制；但未立案也未控告的正常经过法定最高刑对应追诉期才中断或届满（注意本题5年零1日抓获为何仍在内——等会儿核对原题立案还是2006年计算！）。\u0002\nA✗ 《刑法》第87条规定“法定最高刑为不满五年有期徒刑的”，经过五年；但本罪最高刑正好是\u00015年有期徒刑\u0002，适用“五年以上不满十年”的\u000110年追诉期\u0002\nB✓ 仍在追诉时效期限内：法定刑“5年以下有期徒刑”的最高刑是\u00015年\u0002，属于《刑法》第87条第（二）项“五年以上不满十年”，追诉期限为\u000110年\u0002（2001年至2006年仅过5年零1天，未过10年）\nC✗ 破坏名胜古迹行为当时即已完成，并非持续5年以上的继续犯\nD✗ 既未超过10年追诉期，且只有最高刑为无期徒刑、死刑满20年才须报最高检核准\n超高频陷阱：\u0001“5年以下有期徒刑”的法定最高刑恰好是5年\u0002，故适用第（二）项“5年以上不满10年→经过10年”，而不是第（一）项“不满5年→经过5年”！","k":"","kb":15,"kh":[[33,53],[57,81]]},{"id":"2008-14","y":2008,"t":"单","s":"甲于 2004 年 11 月 1 日实施了引诱不满 14 周岁幼女卖淫的行为。根据刑法规定,引诱不满 14 周岁的幼女卖淫的,处 5 年以上有期徒刑,并处罚金。在不具备追诉时效中断或延长的情况下,对甲的行为的追诉时效是（ ）。","o":["5 年","10 年","15 年","20 年"],"a":"C","e":"\u0001引诱幼女卖淫罪“处5年以上有期徒刑”的法定最高刑为15年有期徒刑，故追诉时效为15年。\u0002\nA✗ “5年以上有期徒刑”指的是5年至15年，最高刑不是5年而是15年\nB✗ 最高刑为15年（属于10年以上有期徒刑），追诉期不是10年\nC✓ 15年：单一有期徒刑只设下限“5年以上”未设上限时，按有期徒刑最高期限\u000115年\u0002计算，适用“10年以上有期徒刑经过15年”\nD✗ 20年追诉时效仅适用于法定最高刑为无期徒刑或死刑的情形","k":"","kb":15,"kh":[[85,106]]},{"id":"2011-6","y":2011,"t":"单","s":"甲因绑架罪被判处有期徒刑12年。入狱后, 甲认真遵守监规,接受教育改造,确有悔改表现。根据《刑法》的规定,对甲（ ）。","o":["既可以减刑也可以假释","可以减刑但不能假释","可以假释但不能减刑","既不能减刑也不能假释"],"a":"B","e":"\u0001绑架罪判处12年有期徒刑可以减刑，但属于不得假释的八种严重暴力犯罪之一（10年以上）。\u0002\nA✗ 因绑架罪被判处10年以上有期徒刑（本案12年），绝对禁止假释\nB✓ 可以减刑但不能假释：甲服刑期间有悔改表现满足减刑条件；但因\u0001绑架罪被判处12年有期徒刑\u0002，触犯第81条第2款不得假释红线\nC✗ 恰恰相反，不能假释但可以减刑\nD✗ 虽不得假释，但只要认真遵守监规、确有悔改表现仍可以依法减刑\n记法：禁止假释八宗罪（需判十年以上/无期）：杀、奸、抢、绑、放火、爆、投毒、有组织暴力（+累犯）。","k":"","kb":14,"kh":[[110,174]]},{"id":"2012-44","y":2012,"t":"多","s":"甲利用职务便利,侵占本单位财物数额巨大。根据我国《刑法》的规定,其罪行的法定刑幅度为5年以上有期徒刑。关于本案,下列选项中正确的有","o":["该案的追诉期限为10年","该案的追诉期限为15年","如果甲在公安机关侦查期间逃跑,则不受追诉期限的限制","该案如果超过追诉期限,经最高人民检察院核准,仍可追诉"],"a":"BC","e":"\u0001法定刑幅度“5年以上有期徒刑”最高刑为15年，追诉期限15年；侦查期间逃跑不受追诉期限限制。\u0002\nA✗ “5年以上有期徒刑”最高刑为15年（非不满10年），追诉期不是10年\nB✓ 追诉期限为15年：无上限的“5年以上有期徒刑”最高刑为\u000115年\u0002，对应第87条第（三）项15年追诉期限\nC✓ 侦查期间逃跑不受追诉期限限制：符合第88条第1款司法机关立案侦查后逃避侦查的\u0001追诉时效延长\u0002情形\nD✗ 只有法定最高刑为\u0001无期徒刑、死刑\u0002的犯罪过了20年，才可报请最高人民检察院核准追诉","k":"","kb":15,"kh":[[85,106],[173,228]]},{"id":"2013-8","y":2013,"t":"单","s":"2000年3月1日,甲因犯盗窃罪被公安机关立案侦查后逃往外地。甲又因在2009年9月7日犯抢劫罪,于2010年6月7日被抓获。甲所犯盗窃罪的追诉期限（ ）。","o":["不受限制","应从2000年3月1日起计算","应从2009年9月7日起计算","应从2010年6月7日起计算"],"a":"A","e":"\u0001在公安机关立案侦查后潜逃的，该案追诉期限不受限制（优先于再犯新罪中断规则）。\u0002\nA✓ 不受限制：2000年盗窃罪已被\u0001公安机关立案侦查后逃往外地\u0002，已触发第88条时效延长，永远不再受追诉期限限制\nB✗ 时效已因立案逃避侦查而永久延长，不再按2000年3月1日计算固定期限\nC✗ 一旦成立第88条时效延长（不受限制），此后犯新罪不再恢复计算有限追诉期\nD✗ 不从被抓获日计算追诉期","k":"","kb":15,"kh":[[173,228]]},{"id":"2013-19","y":2013,"t":"单","s":"下列情形中,符合假释的罪刑条件的是（ ）。","o":["甲因抢劫罪被判处有期徒刑10年","乙因故意伤害罪被判处有期徒刑15年","丙因危险驾驶罪被判处拘役6个月","丁因参加有组织的暴力性犯罪被判处无期徒刑"],"a":"B","e":"\u0001故意伤害罪不在第81条第2款列举的禁止假释暴力犯罪名单内，虽判15年有期徒刑仍符合假释罪刑条件。\u0002\nA✗ 抢劫罪被判处10年以上有期徒刑（本项正好10年），依法\u0001不得假释\u0002\nB✓ 故意伤害罪被判15年有期徒刑：\u0001故意伤害罪不在第81条第2款列举的七个具体重罪之列\u0002（前提未涉及“有组织的暴力性犯罪”），可以假释\nC✗ 假释只适用于被判处\u0001有期徒刑或无期徒刑\u0002的犯罪分子，拘役不适用假释\nD✗ 有组织的暴力性犯罪被判处无期徒刑的，明确\u0001不得假释\u0002\n考试极易考的细节点：\u0001普通故意伤害罪（不属有组织暴力犯罪）不在禁止假释罪名之列\u0002，哪怕判处15年甚至无期徒刑，执行到法定最低期限仍可假释。","k":"","kb":14,"kh":[[18,30],[44,56],[110,174]]},{"id":"2015-4","y":2015,"t":"单","s":"甲涉嫌犯聚众斗殴罪,在2010年8月9日被抓捕时逃跑。2014年6月5日,甲抢夺他人财物,数额特别巨大。下列选项中,正确的是（ ）。","o":["甲所犯抢夺罪的追诉期限为5年","甲所犯聚众斗殴罪因其逃跑而不受追诉期限的限制","甲所犯聚众斗殴罪的追诉期限从2010年8月 9日起计算","甲所犯聚众斗殴罪的追诉期限从2014年6月 5日起计算"],"a":"B","e":"\u0001被抓捕时逃跑属于“在公安机关立案侦查后逃避侦查”，该罪追诉期限不受限制。\u0002\nA✗ 抢夺数额特别巨大法定刑在10年以上有期徒刑，追诉期限应为\u000115年\u0002而非5年\nB✓ 聚众斗殴罪不受追诉期限限制：在司法机关\u0001抓捕时逃跑\u0002，属于立案侦查后逃避侦查，适用第88条第1款\nC✗ 已发生追诉时效延长，不再适用常规起算期限\nD✗ 因已经适用第88条不受限制，不再因后罪触发第89条重新计算","k":"","kb":15,"kh":[[173,228]]},{"id":"2015-13","y":2015,"t":"单","s":"下列情形中,不得适用假释的是（ ）。","o":["因诈骗罪被判处12年有期徒刑","因叛逃罪被判处15年有期徒刑","因放火罪被判处13年有期徒刑","因故意杀人罪被判处5年有期徒刑"],"a":"C","e":"\u0001因放火罪被判处13年有期徒刑，属于“八类不得假释罪名+10年以上有期徒刑”，不得适用假释。\u0002\nA✗ 诈骗罪并非暴力性犯罪，即使判处12年有期徒刑仍可以假释\nB✗ 叛逃罪不在禁止假释罪名之列，可适用假释\nC✓ 放火罪判处13年有期徒刑：放火罪属八类禁止假释罪名之一，且刑期在\u000110年以上\u0002，依法不得假释\nD✗ 故意杀人罪虽属禁止假释罪名，但仅判处\u00015年有期徒刑（不满10年）\u0002，仍可以适用假释\n“不得假释”必须同时具备\u0001“特定八罪名”+“十年以上有期徒刑或无期徒刑”\u0002两个条件，如故意杀人被判5年仍可假释。","k":"","kb":14,"kh":[[110,174]]},{"id":"2015-41","y":2015,"t":"多","s":"下列犯罪中，属于我国《刑法》所规定的告诉才处理的有（ ）。","o":["重婚罪","侮辱罪","暴力干涉婚姻自由罪","遗弃罪"],"a":"BC","e":"\u0001侮辱罪、暴力干涉婚姻自由罪属于刑法明确规定的告诉才处理罪名；重婚罪、遗弃罪为公诉罪名。\u0002\nA✗ 重婚罪属于公诉罪名（也可刑事自诉，但并非“告诉才处理”的纯亲告罪）\nB✓ 侮辱罪：《刑法》第246条第2款明文规定告诉的才处理（严重危害社会秩序和国家利益的除外）\nC✓ 暴力干涉婚姻自由罪：《刑法》第257条第1款规定告诉的才处理（致使被害人死亡的除外）\nD✗ 遗弃罪属于公诉罪名，并非告诉才处理的犯罪（注意：虐待罪是告诉才处理，遗弃罪不是）\n记法：告诉才处理五罪：侮辱、诽谤、暴干婚、虐待、侵占（注意有“虐待”无“遗弃”，无“重婚”）。","k":"","kb":16,"kh":[[60,69],[102,117]]},{"id":"2016-6","y":2016,"t":"单","s":"2014年6月20日,甲持枪抢劫后逃至外地。同年11月8日,甲因琐事将他人殴打成重伤。对甲的抢劫犯罪（ ）。","o":["经过20年一般不再追诉","从2014年6月20日起计算追诉期限","因为甲逃避侦查,其追诉期限不受限制","如果20年后认为必须追诉的,报请公安部核准"],"a":"A","e":"\u0001持枪抢劫最高刑为死刑，追诉期限20年，满20年一般不再追诉（注意本案尚未经过司法机关立案侦查，仅系逃至外地并另犯新罪）。\u0002\nA✓ 经过20年一般不再追诉：持枪抢劫法定最高刑为\u0001死刑\u0002，追诉期20年；20年以后必须追诉的报最高检核准，故“一般不再追诉”\nB✗ 2014年11月8日另犯故意伤害罪引发\u0001追诉时效中断\u0002，前罪抢劫罪追诉期应从2014年11月8日重新起算\nC✗ 第88条“不受限制”的前提是\u0001司法机关已经立案侦查或法院已受理案件\u0002；未立案之前自行潜逃不触发延长\nD✗ 追诉期满20年核准机关是\u0001最高人民检察院\u0002，不是公安部","k":"","kb":15,"kh":[[110,158],[337,365]]},{"id":"2016-20","y":2016,"t":"单","s":"甲在死刑缓期执行期间,因过失造成另一罪犯重伤。二年期满后,对甲应（ ）。","o":["减为无期徒刑","减为二十年有期徒刑","执行死刑","减为二十五年有期徒刑"],"a":"A","e":"\u0001死缓期间过失犯罪（造成他人重伤），不属于“故意犯罪”，二年期满应正常减为无期徒刑。\u0002\nA✓ 减为无期徒刑：死缓期间只有\u0001故意犯罪\u0002才导致重算期间或执行死刑，\u0001过失犯罪\u0002不影响正常减为无期徒刑\nB✗ 死缓二年期满正常减为无期徒刑或（有重大立功时）二十五年有期徒刑，没有“减为二十年”这一档\nC✗ 死缓期间只有故意犯罪且情节恶劣，报请最高法核准才执行死刑\nD✗ 二年期满确有\u0001重大立功表现\u0002才减为二十五年有期徒刑","k":"","kb":13,"kh":[[28,60]]},{"id":"2019-1","y":2019,"t":"单","s":"追诉期限的长短应与犯罪的社会危害性程度、刑罚的轻重相适应。下列对于追诉时效的表述,正确的是（ ）。","o":["法定最高刑为死刑的犯罪,经过20年,则一律不再追诉","被害人在追诉期限内提出控告,公安机关应当立案而不予立案的,超过20年即不再追诉","挪用公款归个人使用进行非法活动的,追诉期限从挪用行为实施完毕之日起计算","玩忽职守行为造成的重大损失当时没有发生,而是在玩忽职守行为后一定时间发生的, 应从玩忽职守行为时起计算追诉期限"],"a":"C","e":"\u0001挪用公款归个人使用进行非法活动的，追诉期限从挪用行为实施完毕之日起计算。\u0002\nA✗ 最高刑为死刑的犯罪经过20年并非“一律”不再追诉，认为必须追诉的报最高人民检察院核准后仍可追诉\nB✗ 被害人在追诉期内提出控告而应当立案不立案的，\u0001不受追诉期限的限制\u0002（即使过20年仍可追诉）\nC✓ 最高法批复明确规定：挪用公款归个人使用进行非法活动的，追诉期限从\u0001挪用行为实施完毕之日起计算\u0002\nD✗ 渎职等结果犯以法定犯罪成立要件齐备（\u0001重大损失发生之日\u0002）作为“犯罪之日”起算追诉期限，而不是从渎职行为实施之时起算\n对于行为与结果分离的结果犯，追诉期限从\u0001危害结果发生（犯罪成立）之日\u0002起算；而挪用公款进行非法活动或营利活动从挪用完毕起算，“超过三个月未还型”从满3个月犯罪成立之日起算。","k":"","kb":15,"kh":[[146,158],[258,278],[296,308]]},{"id":"2019-45","y":2019,"t":"多","s":"下列关于减刑适用的理解,正确的有（ ）。","o":["对于被判处2年有期徒刑并宣告缓刑的甲,一般不适用减刑","对于被判处管制2年并在执行期间确有立功表现的乙,可以减刑","丙被判处无期徒刑,有重大立功表现,应当减刑,但实际执行的刑期不能少于10年","丁被判处死刑缓期2年执行,无论经过几次减刑,其实际执行的刑期都不得少于15年,且死刑缓期执行期间不包括在内"],"a":"ABD","e":"\u0001缓刑一般不减刑；管制犯立功可减刑；死缓经几次减刑后实际执行刑期不得少于15年（不含死缓2年）。\u0002\nA✓ 司法解释明确规定：被判处拘役或3年以下有期徒刑并宣告缓刑的罪犯，\u0001一般不适用减刑\u0002\nB✓ 被判处管制2年确有立功表现的，符合减刑对象与条件，依法可以减刑\nC✗ 被判处无期徒刑（含重大立功减刑），减刑以后实际执行的刑期不能少于\u000113年\u0002（不是10年）\nD✓ 死缓犯经过一次或几次减刑后实际执行的刑期不得少于\u000115年\u0002，且\u0001死缓执行期间（2年）不计入\u0002实际执行刑期\n数字必背：\u0001管制拘役有期减刑底线≥1/2；无期≥13年；普通死缓减刑后≥15年（不含2年死缓期）\u0002；限制减刑死缓犯减无期≥25年、减25年有期≥20年。","k":"","kb":12,"kh":[[154,169],[179,210]]},{"id":"2020-42","y":2020,"t":"多","s":"下列选项中,减刑的适用对象有（ ）。","o":["被判处管制的犯罪分子","被判处拘役的犯罪分子","被判处有期徒刑的犯罪分子","被判处无期徒刑的犯罪分子"],"a":"ABCD","e":"\u0001减刑的适用对象为被判处管制、拘役、有期徒刑、无期徒刑的犯罪分子。\u0002\nA✓ 管制属于减刑适用的主刑之一（实执不少于原判1/2）\nB✓ 拘役属于减刑适用的主刑之一（实执不少于原判1/2）\nC✓ 有期徒刑属于减刑适用的主刑之一（实执不少于原判1/2）\nD✓ 无期徒刑属于减刑适用的主刑之一（实执不少于13年）","k":"","kb":12,"kh":[[18,41]]},{"id":"2021-41","y":2021,"t":"多","s":"刑罚消灭的法定事由包括（ ）。","o":["犯罪人死亡","被害人谅解","经特赦免除刑罚","超过追诉时效"],"a":"ACD","e":"\u0001刑罚消灭的法定事由包括犯罪人死亡、经特赦免除刑罚、超过追诉时效（被害人谅解仅属酌定/和解从宽情节）。\u0002\nA✓ 犯罪人死亡：主体不复存在，刑罚随之消灭\nB✗ 被害人谅解属于量刑从宽情节或特定刑事和解从宽事由，一般公诉案件不当然直接消灭刑罚\nC✓ 经特赦免除刑罚：全国人大常委会决定、国家主席发布特赦令免除特定罪犯的刑罚\nD✓ 超过追诉时效：超过法定追诉期限且无中断延长事由的，不再追究刑事责任，刑罚消灭","k":"","kb":17,"kh":[[53,75]]},{"id":"2023-4","y":2023,"t":"单","s":"甲骗取国家出口退税款,数额较大,其应适用的主刑幅度为“五年以下有期徒刑或者拘役”。对甲的追诉时效期限为","o":["5年","10年","15年","20年"],"a":"B","e":"\u0001“五年以下有期徒刑或者拘役”的法定最高刑恰好是5年，对应“5年以上不满10年”即10年追诉期限。\u0002\nA✗ 5年追诉期限适用于“法定最高刑为\u0001不满5年\u0002有期徒刑”，不包含恰好等于5年\nB✓ 10年：“5年以下有期徒刑”最高刑为\u00015年\u0002，落入第87条第（二）项“5年以上不满10年有期徒刑”，追诉期为\u000110年\u0002\nC✗ 15年追诉期限适用于法定最高刑为10年以上有期徒刑\nD✗ 20年追诉期限适用于法定最高刑为无期徒刑、死刑","k":"","kb":15,"kh":[[33,53],[57,81]]},{"id":"2023-42","y":2023,"t":"多","s":"在中华人民共和国成立七十周年之际,我国决定对依据2019年1月1日前人民法院作出的生效判决正在服刑的九类罪犯实行特赦。本次特赦","o":["体现了依法治国理念","体现了人道主义精神","是赦免特定的犯罪人","既赦犯罪又赦刑罚"],"a":"ABC","e":"\u0001我国现行宪法规定特赦，体现依法治国与人道主义精神，赦免特定犯罪分子的刑罚但不赦免其罪名。\u0002\nA✓ 特赦由全国人大常委会依法决定、国家主席发布命令执行，体现依法治国理念\nB✓ 特赦涵盖老弱病残或特定功勋人员等，体现人道主义精神与宽严相济刑事政策\nC✓ 特赦的对象是\u0001特定的正在服刑的犯罪人\u0002（如本题九类罪犯），而非一切罪犯\nD✗ “既赦犯罪又赦刑罚”是大赦的特点；我国只实行\u0001特赦（只赦刑罚，不赦犯罪/仍留有罪记录）\u0002\n大赦 vs 特赦：\u0001大赦既赦其罪又赦其刑（我国现行宪法未规定大赦）；特赦只赦其刑而不赦其罪\u0002（仍构成前科/累犯评价基础，除非另有规定）。","k":"","kb":17,"kh":[[128,162]]},{"id":"2024-9","y":2024,"t":"单","s":"关于追诉期限计算的表述,正确的是（ ）。","o":["甲连续盗窃同一仓库,应从第一次盗窃行为完成之日起计算","乙故意伤害李某,李某重伤住院一个月后死亡,从住院之日起计算","丙挪用公款,数额较大、进行盈利活动,从挪用行为实施完毕之日起计算","丁未履行监管职责,致工程存在严重质量问题而垮塌,造成严重伤亡后果,从工程验收之日起计算"],"a":"C","e":"\u0001挪用公款进行营利活动的追诉期限从挪用行为实施完毕之日起计算。\u0002\nA✗ 连续盗窃同一仓库具有连续状态，应从\u0001犯罪行为终了（最后一次盗窃完成）之日\u0002起算，非第一次\nB✗ 故意伤害致人死亡属于结果加重犯，被害人一个月后死亡，追诉期从\u0001危害结果发生（死亡）之日\u0002起算，非住院日\nC✓ 挪用公款数额较大进行营利活动（或非法活动）的，追诉期限从\u0001挪用行为实施完毕之日起计算\u0002\nD✗ 玩忽职守或工程监管渎职犯罪以“重大损失发生”为构成要件，应从\u0001工程垮塌造成严重伤亡结果发生之日\u0002起算，非工程验收日","k":"","kb":15,"kh":[[296,336]]},{"id":"2025-19","y":2025,"t":"单","s":"【案情】甲为自己投保了巨额人身保险，之后在网上物色到与自己年龄、体态、样貌相仿的孙某，将其骗至深山后杀人焚尸，但还未开始申领保险金即被公安机关抓获。\n若甲被判处死刑缓期执行,期间有重大立功表现,二年期满后应减为（ ）。","o":["无期徒刑","20 年有期徒刑","25 年有期徒刑","35 年有期徒刑"],"a":"C","e":"\u0001死缓期间有重大立功表现，二年期满后减为25年有期徒刑。\u0002\nA✗ 无故意犯罪且无重大立功表现的，二年期满才减为无期徒刑\nB✗ 死缓减刑法定只有“无期徒刑”或“25年有期徒刑”两档，没有20年档\nC✓ 25年有期徒刑：《刑法》第50条明定，死缓期间确有\u0001重大立功表现\u0002，二年期满以后减为25年有期徒刑\nD✗ 我国有期徒刑最高期限通常为15年（数罪并罚或死缓减刑最高25年），不存在35年有期徒刑","k":"","kb":13,"kh":[[61,89]]},{"id":"2026-41","y":2026,"t":"多","s":"以下情形,可以视为刑事责任终结的有","o":["犯罪人自杀身亡","法院裁决认定有罪但免除刑罚","对犯罪人判处的刑罚宣告缓刑","检察机关对犯罪人依法作出不起诉决定"],"a":"ABD","e":"\u0001犯罪人自杀身亡、法院有罪免罚、检察院作出不起诉决定均可终结刑事责任；宣告缓刑并未终结刑事责任。\u0002\nA✓ 犯罪人自杀身亡：刑事责任主体消灭，不再追究刑事责任（追诉/执行程序终止）\nB✓ 定罪免罚（有罪但免除刑罚）：案件已作终局刑事裁决且无刑罚执行负担，刑事责任实现并终结\nC✗ 宣告缓刑只是附条件暂不执行原判刑罚，考验期内若犯新罪或发现漏罪或严重违规仍要撤销缓刑收监执行，\u0001刑事责任尚未终结\u0002\nD✓ 检察院依法作出不起诉决定（含法定不起诉、酌定不起诉等）：终止刑事追诉程序，刑事责任随之终结","k":"","kb":17,"kh":[[53,58],[79,127]]}]},{"sub":"民法","name":"继承","w":1.3,"L":22,"qs":[{"id":"2005-37","y":2005,"t":"单","s":"根据我国《继承法》的规定,放弃继承与放弃受遗赠可采取的行为方式是（ ）。","o":["放弃继承既可采明示方式,也可采默示方式,放弃受遗赠亦如此","放弃继承只能采明示方式,放弃受遗赠亦如此","放弃继承只能采明示方式,放弃受遗赠则既可采明示方式,也可采默示方式","放弃继承只能采明示方式,也可采默示方式,放弃受遗赠则既可采明示方式"],"a":"C","e":"\u0001《民法典》第1124条与原《继承法》第25条确立：继承开始后放弃继承必须采明示（书面）方式，沉默视为接受；而受遗赠人既可明示也可默示（到期未表示视为放弃）。\u0002\nA✗ 放弃继承人不能通过沉默默示放弃，不说话依法反被“视为接受继承”。\nB✗ 放弃受遗赠既可以明确声明拒绝，也可以超过法定表示期限沉默（默示视为放弃）。\nC✓ 继承开始后继承人放弃继承只能采用明示方式（没有表示即视为接受）；受遗赠人则必须在60日/2个月内明确表示接受才有效，否则默示不作为即视为放弃。\nD✗ 刚好把继承与受遗赠规则完全说反了。","k":"","kb":144,"kh":[[243,329]]},{"id":"2005-54","y":2005,"t":"多","s":"依据我国《继承法》的规定,遗产的范围包括（ ）。","o":["林木","文物","著作权","宅基地使用权"],"a":"AB","e":"\u0001林木、文物属于自然人死亡时遗留的个人合法财产，可以作为遗产继承；普通“著作权”（含不可继承著作人身权）及与农户成员绑定的宅基地使用权在2005真题定性中不直接笼统归入。\u0002\nA✓ 公民依法种植所有的人工林木及果木属于个人合法财产，可以继承。\nB✓ 合法收藏流转归个人所有的文物属于可继承个人合法财产。\nC✗ 依据原《继承法》第3条第6项（及现行法理），只有“著作权中的财产权利”可以继承，著作权中的署名权、修改权、保护作品完整权等人身权具有专属性不能继承，故单选笼统“著作权”不严谨、真题不选。\nD✗ 宅基地使用权与农村集体经济组织成员身份及一户一宅社会保障绑定，公民死亡后只能继承宅基地上的“房屋”，房屋灭失后宅基地使用权由集体收回，本身一般不能单独作为遗产继承。","k":"","kb":144,"kh":[[101,177]]},{"id":"2006-50","y":2006,"t":"单","s":"依据我国继承法规定,不必有两个以上见证人在场见证的遗嘱是（ ）。","o":["自书遗嘱","口头遗嘱","代书遗嘱
