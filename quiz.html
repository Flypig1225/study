","录音遗嘱"],"a":"A","e":"\u0001自书遗嘱由遗嘱人亲笔书写、签名并注明年月日即可成立，法律并不要求必须有两个以上无利害关系见证人在场见证。\u0002\nA✓ 依《民法典》第1134条，自书遗嘱由遗嘱人亲笔书写、签名，注明年、月、日，无须任何见证人在场。\nB✗ 危急情况下立口头遗嘱，应当有两个以上见证人在场见证。\nC✗ 代书遗嘱应当有两个以上见证人在场见证（由其中一人代书）。\nD✗ 以录音录像形式立的遗嘱，应当有两个以上见证人在场见证（见证人在录音录像中记录姓名或肖像及年月日）。","k":"","kb":145,"kh":[[84,119]]},{"id":"2008-47","y":2008,"t":"单","s":"甲在遗嘱中指定所留房屋归其子乙,存款归侄女丙。甲死之后乙、丙两人被告知 3 个月后参加甲的遗产分割。但直至遗产分割时,乙和丙均未做出是否接受遗产的意思表示。根据继承法规定,下列说法中正确的是（ ）。","o":["将乙、丙的行为均视为接受遗产","将乙、丙的行为均视为放弃接受遗产","将乙的行为视为接受遗产,将丙的行为视为放弃接受遗产","将乙的行为视为放弃接受遗产,将丙的行为视为接受遗产"],"a":"C","e":"\u0001乙为法定兼遗嘱继承人，至3个月后遗产分割时尚未表示放弃继承，依法视为接受继承；侄女丙系受遗赠人，期限内未表示接受，依法视为放弃受遗赠。\u0002\nA✗ 受遗赠人丙逾期未作出接受表示，依法应视为放弃，而非视为接受。\nB✗ 第一顺序继承人乙只要没有在遗产处理前书面作出放弃继承表示，均视为接受继承。\nC✓ 依《民法典》第1124条（原《继承法》第25条）：法定/遗嘱继承人乙无表示视为接受；受遗赠人（非法定继承人范围的侄女）丙在知道受遗赠后法定60日（旧法2个月）内沉默未作表示的，视为放弃受遗赠。\nD✗ 规则恰好颠倒。","k":"","kb":144,"kh":[[243,329]]},{"id":"2008-55","y":2008,"t":"多","s":"根据继承法规定,继承人所为的下列行为中,可导致其丧失继承权的有（ ）。","o":["故意杀害被继承人","伪造遗嘱情节严重","遗弃被继承人","虐待被继承人情节严重"],"a":"ABCD","e":"\u0001依《民法典》第1125条，继承人故意杀害被继承人、伪造篡改销毁遗嘱情节严重、遗弃被继承人或虐待被继承人情节严重的，均丧失继承权（后三项确有悔改宽恕例外）。\u0002\nA✓ 继承人只要故意杀害被继承人（无论既遂未遂、也无论出于何种动机），绝对且永久丧失继承权。\nB✓ 伪造、篡改、隐匿或者销毁遗嘱，情节严重的，丧失继承权。\nC✓ 遗弃被继承人的，直接依法丧失继承权（注意对遗弃只要实施即失权，“情节严重”限定的是虐待）。\nD✓ 虐待被继承人，情节严重的，依法丧失继承权。","k":"","kb":144,"kh":[[177,217]]},{"id":"2009-47","y":2009,"t":"单","s":"甲立有遗嘱,其内容为自己死后遗产全部由独生子乙继承。在一次车祸中甲乙同时遇难,甲当场死亡,乙在送往医院的途中死亡。乙的儿子丙依甲的遗嘱继承了甲的全部遗产。丙继承甲遗产的方式是（ ）。","o":["代位继承","转继承","第一顺序法定继承","第二顺序法定继承"],"a":"B","e":"\u0001甲先当场死亡、乙稍后在送医途中死亡；独生子乙作为被继承人甲死亡时尚健在的继承人已实际取得遗产继承权利，后未及分割即死亡，由乙之子丙发生转继承。\u0002\nA✗ 代位继承的前提是被继承人的子女“先于”被继承人死亡；本案乙在甲死亡时尚活着（后于甲死亡），不符合代位条件。\nB✓ 甲先死时独生子乙即时依法获得甲全部遗产的遗嘱/法定继承地位，随后乙在遗产实际分割前在送医途中死亡，乙已经取得的遗产份额转由乙的法定继承人丙继承，属于典型的“转继承”（注意遗嘱继承亦可发生转继承）。\nC✗ 丙并非甲的直接第一顺序法定继承人，而是作为乙的继承人间接通过转继承得产。\nD✗ 孙子在任何意义上均不属祖父母的“第二顺序法定继承人”。","k":"","kb":144,"kh":[[517,563]]},{"id":"2010-48","y":2010,"t":"单","s":"甲立有遗嘱,表示其遗产由独生子乙继承。乙因病先于甲死亡。甲死亡后,乙的儿子丙继承甲的遗产。这属于（ ）。","o":["遗嘱继承","代位继承","转继承","第二顺序法定继承"],"a":"B","e":"\u0001独生子乙先于父亲甲死亡，甲所立指定由乙继承的遗嘱因继承人先亡而失效；甲的遗产随之按法定继承处理，并由乙的儿子丙依据法律规定代位继承。\u0002\nA✗ 遗嘱继承人先于立遗嘱人死亡时，该部分遗嘱失效、不发生遗嘱继承或遗嘱下直接代位，而是转为适用法定继承再行代位。\nB✓ 乙先于甲死亡致使指定由乙继承的遗嘱失去效力，甲遗产依法定继承办理，同时因被继承人的子女乙先于甲死亡，由乙的晚辈直系血亲丙（孙子）依法代位继承甲的遗产。\nC✗ 转继承适用于继承人“后于”被继承人死亡、在遗产分割前亡故的情形；本案乙“先于”甲死。\nD✗ 孙子女不是祖父母的第二顺序法定继承人，是通过代位权取代父母第一顺位继承。","k":"","kb":144,"kh":[[464,516]]},{"id":"2011-49","y":2011,"t":"多","s":"甲与妻子乙育有一子一女,儿子与其妻丁生有一子戊,儿子于2005年遇车祸死亡。儿子去世后, 甲、乙老无生活来源,女儿丙拒不赡养,甲、乙主要由再婚的丁供养。甲于2010年3月死亡,留下房屋3 间。依照继承法的规定,可以参加第一顺序继承的人有（ ）。","o":["乙","丙","丁","戊"],"a":"ABCD","e":"\u0001妻子乙及未丧失继承权女儿丙为当然第一顺序继承人；丧偶儿媳丁对公婆尽了主要赡养义务（即便已再婚）作为第一顺序继承人；孙子戊可同时代位先亡父亲丁夫继承，互不冲突。\u0002\nA✓ 配偶乙是法定的第一顺序继承人。\nB✓ 女儿丙虽拒不赡养，但若未达到遗弃或情节严重虐待致法定丧失继承权程度，仍属于法定第一顺序继承人（分配遗产时应当不分或少分）。\nC✓ 依《民法典》第1129条，丧偶儿媳对公婆尽了主要赡养义务的，作为第一顺序继承人（即使丁已另行再婚亦不影响其独自取得的法定继承人资格）。\nD✓ 儿媳丁因尽主要赡养义务独立作为第一顺序继承人，不影响其子戊（甲的孙子）依法代位已故父亲行使第一顺序代位继承权。","k":"","kb":144,"kh":[[390,450]]},{"id":"2012-50","y":2012,"t":"多","s":"下列选项中,属于我国继承法基本原则的有","o":["养老育幼原则","诚实信用原则","继承权男女平等原则","互谅互让、团结和睦原则"],"a":"ACD","e":"\u0001《民法典》继承编体现了保护私有财产继承权、继承权男女平等、养老育幼、互谅互让团结和睦、权利义务相一致五大基本原则；“诚实信用原则”是民法典总则的基本原则（并非继承编特有基本原则）。\u0002\nA✓ 养老育幼原则（特留份/必留份照顾缺乏劳动能力又无生活来源继承人等）是继承编重要原则\nB✗ 诚实信用原则（《民法典》第7条）是贯穿全部民事活动的民法总则“帝王原则”，不在传统继承法特定基本原则列举之中\nC✓ 继承权男女平等原则（第1126条）明文写入继承编\nD✓ 互谅互让、团结和睦原则（第1132条遗产分割应发扬的精神）是继承编基本原则","k":"","kb":102,"kh":[[95,188]]},{"id":"2014-36","y":2014,"t":"单","s":"赵某死亡后,甲依遗嘱继承了一套房屋(价值 180万元),乙依遗赠分得一幅字画(价值40万元), 丙依法定继承分得现金60万元。遗产分割完毕后, 赵某的债权人找到甲、乙、丙,要求偿还欠款40万元。该欠款应（ ）。","o":["全部由甲偿还","全部由丙偿还","由甲偿还30万元,丙偿还10万元","由甲、乙、丙按照各自分得的遗产价值比例偿还"],"a":"B","e":"\u0001既有法定继承又有遗嘱继承、遗赠的，应当先由法定继承人清偿被继承人依法应缴纳的税款和债务；本案法定继承现金60万元足以全额清偿40万元欠款，故全部由丙偿还。\u0002\nA✗ 甲系遗嘱继承人，只有在法定继承人所得遗产（60万元）不足清偿时，才需按比例以所得遗产补足偿还。\nB✓ 依《民法典》第1163条，既有法定继承又有遗嘱继承和遗赠的，由法定继承人丙先以其所得遗产（60万元现金）清偿40万元全部欠款，足够清偿故不再累及甲和乙。\nC✗ 先法定后遗嘱/遗赠，并不在法定继承人足够还债时让遗嘱继承人提前按比例分担。\nD✗ 同上，不是一律按遗产总价值比例分摊清偿。","k":"","kb":145,"kh":[[439,519]]},{"id":"2014-37","y":2014,"t":"单","s":"2013年3月28日,毕某病逝。3月31日,子女将其安葬。4月2日,毕某的子女一起清理毕某的遗产并确定继承份额。4月5日,遗产分割完毕。遗产继承开始的时间是（ ）。","o":["3月28日","3月31日","4月2日","4月5日"],"a":"A","e":"\u0001根据《民法典》第1121条第1款（原《继承法》第2条），继承从被继承人死亡（3月28日病逝）时开始，与安葬、清理或分割遗产日期无关。\u0002\nA✓ 自然人死亡（包括生理死亡和宣告死亡判决生效日）时点即继承开始之时，故为3月28日毕某病逝之日。\nB✗ 安葬日期属于丧葬礼俗事务日，并非继承开始时间。\nC✗ 清理遗产确定份额属于继承发生后的遗产管理行为。\nD✗ 遗产分割完毕日是遗产所有权从共同共有向各自分得单独所有转化时点，非继承开始日。","k":"","kb":144,"kh":[[76,100]]},{"id":"2016-37","y":2016,"t":"单","s":"甲立有遗嘱,将其两幅字画留给好友乙。甲死后次日,乙表示接受遗赠。后乙在遗产分割前死亡。对此,下列表述正确的是（ ）。","o":["该遗赠失效","两幅字画由乙的继承人继承","该遗赠不生效","两幅字画由乙的晚辈直系血亲继承"],"a":"B","e":"\u0001受遗赠人乙在甲死后次日（未逾60日/2个月期限）已明确表示接受遗赠，即已实际取得该受遗赠遗产权利；后在遗产分割前死亡，由乙的合法继承人通过转继承取得两幅字画。\u0002\nA✗ 乙已于法定期间内明示接受遗赠，遗赠已经发生确定法律效力，不会因之后乙去世而失效。\nB✓ 乙生前已有效接受遗赠取得字画财产权利，其在遗产尚未具体分割前死亡构成转继承，该两幅字画列入乙的遗产由乙的法定或遗嘱继承人继承。\nC✗ 乙及时明确接受了遗赠，遗赠依法生效。\nD✗ 转继承与仅限“晚辈直系血亲”的代位继承不同，转继承人可以是乙的配偶、父母、子女等一切合法继承人，并非仅限于晚辈直系血亲。","k":"","kb":144,"kh":[[517,579]]},{"id":"2017-48","y":2017,"t":"多","s":"甲、乙系夫妻,有一子丙。丙与丁结婚,生有一女戊。2008年丙去世,丁与庚再婚,二人一起照顾甲、乙的生活起居。2015年5月甲去世。对甲遗产的继承,第一顺序继承人有（ ）。","o":["乙","丁","戊","庚"],"a":"ABC","e":"\u0001配偶乙、尽主要赡养义务的丧偶儿媳丁（再婚不影响）、及代位先亡父亲丙继承的孙女戊均为甲的第一顺序继承人；丁的再婚新配偶庚与公婆甲并无直系法定血缘或姻亲继承资格。\u0002\nA✓ 配偶乙为法定第一顺序继承人。\nB✓ 丧偶儿媳丁在丙去世后继续照顾公婆生活起居尽了主要赡养义务，即便之后与庚再婚，依然依法作为甲的第一顺序继承人。\nC✓ 孙女戊因其父亲丙先于祖父甲死亡，依法享有第一顺序代位继承权（不因母亲丁独立成为一顺位继承人而被排斥）。\nD✗ 《民法典》第1129条赋予的是“丧偶儿媳”或“丧偶女婿”本人第一顺序继承人资格，不包含其再婚新配偶庚；庚对甲的照料只可依第1131条适当分得遗产，而非第一顺序继承人。","k":"","kb":144,"kh":[[390,462]]},{"id":"2018-36","y":2018,"t":"单","s":"2005年，甲立公证遗嘱，将自己的一套房屋留给儿子乙，后甲与丙结婚，生有一子丁。2008年，甲立自书遗嘱，指定前述房屋由丙、丁二人共同继承。2017年，甲去世，该房屋（ ）。","o":["应按照公证遗嘱由乙继承","应按照自书遗嘱由丙、丁共同继承","应由乙、丙、丁依照法定继承共同继承","属于甲和丙的共同财产,应当先析产后继承"],"a":"B","e":"\u0001依据现行《民法典》第1142条规定，立有数份遗嘱内容相抵触的，不再区分公证与自书形式效力高低，一律以最后所立的合法有效遗嘱（2008年自书遗嘱）为准。\u0002\nA✗ 原《继承法》第20条曾赋予公证遗嘱最高效力、自书遗嘱不得变更撤销公证遗嘱，但现行《民法典》已彻底废除该公证遗嘱优先规定，故不得再按2005年旧公证遗嘱由乙继承。\nB✓ 依据《民法典》第1142条第3款，立有数份遗嘱内容相抵触的，以最后的遗嘱为准；2008年自书遗嘱立于2005年公证遗嘱之后，该房屋应当由丙、丁二人共同继承。\nC✗ 甲留下了合法有效且未撤销的最后自书遗嘱，应当优先适用遗嘱继承而非转为法定继承。\nD✗ 房屋系甲在2005年与丙结婚“之前”早已个人拥有的婚前个人财产，无需夫妻析产。\n【新法提示】2018年考试时尚适用旧《继承法》第20条（公证遗嘱效力优先）；现行《民法典》第1142条已废除公证遗嘱优先效力、统一改按最后遗嘱为准（自书遗嘱由丙、丁共同继承）！","k":"","kb":145,"kh":[[219,273]]},{"id":"2018-48","y":2018,"t":"多","s":"志愿者甲经常照顾孤寡老人乙。 2015 年3 月 20 日,乙病故,遗嘱执行人丙告诉甲,乙遗赠给甲3 万元和一套古籍。 5 月 15 日,甲明确表示拒绝接受古籍。 5 月 18 日,甲联系丙,表示撤销此前拒绝接受古籍的行为。 5 月28 日,甲请求丙执行遗嘱,丙（ ）。","o":["应将3 万元交付给甲","应将古籍交付给甲","无需向甲交付3 万元","无需向甲交付古籍"],"a":"CD","e":"\u0001受遗赠人甲于5月15日明示拒绝古籍即确定丧失该受遗赠权（5月18日反悔撤回无效）；同时甲直到5月28日方才要求交付3万元，已逾知道受遗赠（3月20日）起2个月/60日除斥期间，视为放弃。\u0002\nA✗ 甲自3月20日获知受遗赠后，直至5月28日（已超两个月/60日法定期间）始终未作出接受3万元的表示，依法早已视为放弃受遗赠，丙无需交付。\nB✗ 甲于5月15日已经明确作出放弃接受古籍的表示，放弃遗产或受遗赠一旦有效作出即发生确定拘束力，嗣后在5月18日单方反悔撤回不生效力。\nC✓ 受遗赠人应在知道受遗赠后两个月（《民法典》改为60日）内明确表示接受，5月20日（5月19日）期限已满仍未表态接受3万元，视为放弃，故执行人丙无需交付3万元。\nD✓ 甲已明确拒绝接受古籍并发生确定弃权效力，后续撤回无效，故丙无需向其交付古籍。","k":"","kb":144,"kh":[[283,356]]},{"id":"2021-29","y":2021,"t":"单","s":"20 10年甲立自书遗嘱一份,表示自己的房屋由儿子乙继承,屋内的紫檀家具由孙子丙继承。2018 年甲将该房屋卖给任某,得款120万元,并办理了过户登记手续。后甲病故。对此,下列表述正确的是 （ ）。","o":["乙有权基于遗嘱继承取得卖房款1 20万元","丙有权基于遗赠取得紫檀家具","甲所立自书遗嘱的内容全部被撤回","甲立遗嘱后不得出卖遗嘱处分的财产"],"a":"B","e":"\u0001甲立遗嘱后出售房屋并过户，系以相反民事法律行为撤回了关于房屋部分的遗嘱内容；未出售且依然存在的屋内紫檀家具遗嘱依然有效，孙子丙有权依遗赠取得。\u0002\nA✗ 立遗嘱后将遗嘱涉及的房产出售并过户给任某，依《民法典》第1142条第2款“立遗嘱后，遗嘱人实施与遗嘱内容相反的民事法律行为的，视为对遗嘱相关内容的撤回”，房屋遗嘱已被撤回，卖房款系现金货币不再适用原房屋遗嘱。\nB✓ 撤回部分遗嘱处分财产的行为仅及于“相关内容”（房屋），不影响遗嘱中尚存且未被撤回的其他合法处分部分，故孙子丙（非法定继承人）仍有权依该有效遗嘱受遗赠取得紫檀家具。\nC✗ 只视为撤回涉及已出售房产的“相关内容”，而非整份自书遗嘱全部撤回。\nD✗ 遗嘱是在遗嘱人死后才生效的死因行为，立遗嘱人生前依然完全享有对自己财产的所有权及自由处分权，随时可以变卖。","k":"","kb":145,"kh":[[149,219]]},{"id":"2021-36","y":2021,"t":"单","s":"甲、乙系夫妻,育有一子丙。甲的父亲去世后,甲的母亲李某与甲的弟弟丁一起生活。1990年起李某为照看丙,开始与甲一家共同生活。2010年甲因病去世,李某伤心过度而中风,乙一直照顾李某。 2018年李某去世,留下存款6万元。该6万元（ ）。","o":["只能由丙、丁继承","应当由乙、丙、丁继承","全部由丁继承","只能由乙、丙继承"],"a":"B","e":"\u0001甲先死，儿媳乙在中风后一直扶养照顾婆婆李某尽了主要赡养义务，作为第一顺序继承人；孙子丙代位已故父亲甲继承；李某亲生小儿子丁同为一顺位继承人，共乙、丙、丁三人平分遗产。\u0002\nA✗ 遗漏了同样符合《民法典》第1129条对婆婆尽了主要赡养义务并取得第一顺位继承资格的丧偶儿媳乙。\nB✓ 甲先于母亲李某死亡：丧偶儿媳乙一直照顾中风婆婆李某尽了主要赡养义务，依法作为第一顺序继承人；甲之子丙依法代位父亲甲成为第一顺序继承人；丁系李某儿子同属第一顺序继承人，故6万元应由乙、丙、丁共同继承。\nC✗ 剥夺了尽主要赡养义务儿媳乙与代位继承人孙子丙的法定继承权。\nD✗ 遗漏了同为李某亲生子女的法定第一顺序继承人丁。","k":"","kb":144,"kh":[[390,425],[464,478]]},{"id":"2021-39","y":2021,"t":"单","s":"张某在丈夫去世后,与其保姆李某签订了遗赠扶养协议,张某的子女得知后不认可该遗赠扶养协议的效力。该遗赠扶养协议的效力为（ ）。","o":["可撤销","效力待定","有效","无效"],"a":"C","e":"\u0001张某生前依法自愿与法定继承人以外的保姆李某签订双方负担生养死葬权利义务的遗赠扶养协议，不以子女认可或同意为生效要件，协议自双方合意成立即合法有效。\u0002\nA✗ 双方真实意思表示订立遗赠扶养协议无欺诈胁迫或重大误解，不属可撤销合同。\nB✗ 处分自己名下合法个人财产立遗赠扶养协议是完全行为能力人的自由处分权，无需子女追认，非效力待定。\nC✓ 依《民法典》第1158条，自然人可以与继承人以外的组织或者个人签订遗赠扶养协议，该协议合意达成即依法有效，且在效力上优先于遗嘱与法定继承。\nD✗ 有效民事法律行为，依法受法律保护。","k":"","kb":145,"kh":[[303,353]]},{"id":"2022-34","y":2022,"t":"单","s":"甲丧偶,无子女,唯一的亲属乙(甲的侄子)远在外地,邻居丙主动照顾甲长达 30年,并在甲去世后为其操办后事。甲的遗产","o":["应当由乙、丙各继承50%","应当全部由丙继承","应当首先用于支付丙照顾甲的报酬","可以适当分给丙"],"a":"D","e":"\u0001甲丧偶无子女仅一远方侄子，邻居丙长达30年悉心照顾甲并操办后事，属于“继承人以外的对被继承人扶养较多的人”，依法“可以适当分给”甲的遗产。\u0002\nA✗ 邻居丙并非法定继承人，法律没有机械设定由乙丙各分50%的强制比例，具体份额由协商或法院结合扶养程度酌定。\nB✗ 甲尚有依法可第二顺位代位继承（《民法典》第1128条第2款被继承人兄弟姐妹子女可代位继承，如侄子乙可代位继承，或非无人继承归公），因此并非当然全部归丙。\nC✗ 邻里互助照顾在无事先劳务报酬协议时系酌情分得遗产，而非作为劳务雇佣欠薪报酬优先偿债。\nD✓ 完全契合《民法典》第1131条规定：继承人以外的对被继承人扶养较多的人，可以分给适当的遗产。","k":"","kb":144,"kh":[[581,622]]},{"id":"2023-27","y":2023,"t":"单","s":"村民甲生前立有遗嘱,指定房屋由儿子乙继承,其他财产由女儿丙继承,并指定丁担任遗嘱执行人。甲去世后,丁拒绝担任遗嘱执行人,乙和丙也未推选遗产管理人。此种情况下,遗产管理人应为","o":["乙","丁","乙和丙","甲生前住所地的村民委员会"],"a":"C","e":"\u0001遗嘱指定的遗嘱执行人丁拒绝担任，且各继承人乙、丙之间又未另行推选出遗产管理人的，依据《民法典》第1145条顺位，由全体继承人乙和丙共同担任遗产管理人。\u0002\nA✗ 遗产由儿子乙和女儿丙分别遗嘱继承房屋与其他财产，在未推选由某一人独任时应当“共同担任”，而非单独只归乙。\nB✗ 遗嘱执行人有权拒绝承担管理职务，丁既明确拒绝便不再担任遗产管理人。\nC✓ 依据《民法典》第1145条遗产管理人产生顺位：有遗嘱执行人的先由其担任，无遗嘱执行人（包括拒绝担任）时应由继承人及时推选，未推选的由继承人“共同担任”——即由乙和丙共同担任遗产管理人。\nD✗ 仅在没有继承人或者继承人均放弃继承的兜底情形下，才由被继承人住所地的民政部门或者村民委员会担任遗产管理人。","k":"","kb":145,"kh":[[354,413]]},{"id":"2025-40","y":2025,"t":"单","s":"甲以12 万元的价格将网络游戏道具转让给乙,约定先付款后交货。甲收到货款后过于激动,突发脑溢血去世。甲的近亲属只有父亲丙,丙无法登录甲的游戏账号。对此,下列说法正确的是（ ）。","o":["网络游戏平台对游戏道具转让不承担协助义务","游戏道具属于网络虚拟财产,丙有权继承","因甲死亡,故甲与乙之间的转让合同无效","丙不承担交付游戏道具的义务"],"a":"B","e":"\u0001网络游戏道具属于法律保护的网络虚拟财产，甲死亡后可作为遗产由唯一近亲属父亲丙合法继承；丙既继承遗产，也应在继承遗产实际价值范围内承担合同交付义务。\u0002\nA✗ 继承人丙无法独自登录账号履行遗产转移交付时，网络游戏平台在查验合法继承证明后负有配合查询、协助过户转移道具的法定协助义务（《民法典》第1147条遗产管理及协作法理）。\nB✓ 依《民法典》第127条及第1122条，法律保护数据与网络虚拟财产，依法具备合法财产属性的游戏道具属于自然人合法财产遗产，唯一法定继承人父亲丙有权依法继承。\nC✗ 一方自然人死亡不当然导致已经成立的普通财产买卖合同无效；除具有严格人身专属性之合同外，合同权利义务由继承人承受。\nD✗ 丙依法继承了游戏账号道具并包括已收取的12万元买款遗产，在继承遗产实际价值范围内应当继续承受并履行甲生前所签有效转让合同的交货义务。","k":"","kb":144,"kh":[[101,129]]},{"id":"2025-47","y":2025,"t":"多","s":"颜某去世时留下一套价值40 万元的房屋和20 万元存款。颜某遗产的第一顺序法定继承人为甲、乙、丙、丁。颜某生前立有遗嘱,指定存款由甲、乙、丙平分,但未对房屋作出处分。后乙表示放弃对房屋的继承。颜某生前欠李某9 万元借款。下列人员中,应当在自己继承的遗产价值内偿还该笔债务的有（ ）。","o":["甲","乙","丙","丁"],"a":"ACD","e":"\u0001房屋40万元走法定继承由甲、丙、丁均分（乙放弃），存款20万元走遗嘱继承归甲、乙、丙；法定继承遗产40万元足够偿还9万元债务，依《民法典》第1163条仅由法定继承人甲、丙、丁清偿。\u0002\nA✓ 甲属于未放弃房屋法定继承的法定继承人，应当在所继承遗产实际价值内承担9万元债务清偿责任。\nB✗ 乙明确表示放弃对未处分房屋的法定继承，仅取得遗嘱继承的存款；而法定继承遗产价值（40万元房屋）已经远远超过并足额覆盖9万元债务，依《民法典》第1163条无需动用遗嘱继承人乙的份额偿债。\nC✓ 丙同时为法定继承人（分得房屋部分）和遗嘱继承人，依第1163条应当以法定继承所得遗产优先承担9万元债务。\nD✓ 丁未列入存款遗嘱继承，但作为第一顺序法定继承人分得房屋份额，依法应当在其继承遗产价值内共同清偿该9万元债务。","k":"","kb":145,"kh":[[439,519]]}]},{"sub":"刑法","name":"分则·危害公共安全罪","w":1.2,"L":24,"qs":[{"id":"2005-14","y":2005,"t":"单","s":"交通肇事并具有下列哪种情形的,应追究刑事责任（ ）。","o":["致 3 人死亡,负事故次要责任的","致 2 人死亡,负事故同等责任的","致 1 人死亡,负事故主要责任的","造成财产损失无能力赔偿数额 20 万元以上不满 30 万元,负事故全部责任的"],"a":"C","e":"\u0001交通肇事“死亡一人或者重伤三人以上”须负事故“全部或者主要责任”才入罪；死亡三人以上须负“同等责任”以上；财产无能力赔偿须达30万元以上。\u0002\nA✗ 致3人死亡必须负\u0001同等责任以上\u0002才追刑责，仅负次要责任不构成交通肇事罪\nB✗ 负事故同等责任须达到\u0001死亡3人以上\u0002才构罪，仅致2人死亡不入罪\nC✓ 致1人死亡，负事故主要责任：完全符合《交通肇事解释》第2条第1款第1项基础入罪标准\nD✗ 负全责/主责造成财产直接损失无能力赔偿的入罪起点是\u000130万元以上\u0002，20万不满30万未达标\n记法：交通肇事一般入罪数字：“全主1死或3重伤，同等3死才算上；财产无赔30万，全主才进牢房关。”","k":"","kb":54,"kh":[[139,234]]},{"id":"2006-10","y":2006,"t":"单","s":"甲在生产作业期间,违反操作规程造成供电线路短路,引起火灾,烧毁厂房,致 3 名工人死亡,造成直接经济损失1 千万元。甲的行为构成（ ）。","o":["失火罪","过失致人死亡罪","重大责任事故罪","失火罪和过失致人死亡罪"],"a":"C","e":"\u0001在生产作业期间违反操作规程引发火灾致3人死亡、损失1千万，同时符合重大责任事故罪与失火罪、过失致人死亡罪要件，特别法优于一般法，定重大责任事故罪。\u0002\nA✗ 发生于工厂\u0001生产作业期间\u0002违反操作规程所致火灾，应适用特别法《刑法》第134条重大责任事故罪，而非普通失火罪\nB✗ 过失致人死亡罪是一般过失犯罪，被业务/生产安全事故罪的特别条文优先排除\nC✓ 重大责任事故罪：在生产作业中违反安全管理规定引发重大火灾致3死、损失1000万元，属业务过失特别罪名优先适用\nD✗ 一行为引起火灾及工人死亡后果属于一行为触犯数个法条竞合（特别法优于一般法），仅定重大责任事故一罪不数罪并罚","k":"","kb":55,"kh":[[22,62],[99,125]]},{"id":"2007-15","y":2007,"t":"单","s":"甲见固定在河道中放置航标灯的小船适宜做猪食槽,就砍断锚链,将小船拖回家。所幸航标灯灭失的情况被及时发现,才避免了船毁人亡的结果。甲的行为构成 （ ）。","o":["破坏交通工具罪","破坏交通设施罪的既遂","破坏交通设施罪的未遂","盗窃罪"],"a":"B","e":"\u0001航标灯属于水上“交通设施”，砍断锚链拖走航标灯小船足以使船只发生倾覆、毁坏危险，因破坏交通设施罪属危险犯，即使及时发现未出事仍成立破坏交通设施罪既遂。\u0002\nA✗ 航标灯起到警示导航功能，属于交通设施而非直接承载客货运行的交通工具\nB✓ 破坏交通设施罪的既遂：航标灯属于第117条保护的交通设施（“灯塔、标志”），砍断锚链拖走行为已经客观上造成航行船只倾覆毁坏之\u0001具体危险\u0002，即告既遂\nC✗ 破坏交通设施罪不是实害犯，不以实际发生船毁人亡才叫既遂，巡查及时发现避免事故不改变已经既遂的事实\nD✗ 一行为既侵犯小船财产所有权（盗窃）又危害公共交通安全（破坏交通设施），属于想象竞合犯，择一重罪定破坏交通设施罪","k":"","kb":53,"kh":[[219,292]]},{"id":"2008-17","y":2008,"t":"单","s":"甲驾驶车辆在城市主干道不慎将乙撞成重伤,负事故主要责任。由于抢救乙的医疗费用不断增加,甲感到很紧张, 遂到寺庙中祈祷乙快点死去。在其祈祷后的第二天,乙死亡。甲的行为构成（ ）。","o":["过失致人死亡罪","交通肇事罪和故意杀人罪","过失致人重伤罪和故意杀人罪","交通肇事罪"],"a":"D","e":"\u0001驾车撞人重伤（交通肇事未达3人重伤入罪标准？或看死亡与行为因果）后仅前往寺庙诅咒祈祷被害人快死，迷信祈祷行为与死亡结果无刑法因果关系，仅负前行为交通肇事罪责。\u0002\nA✗ 甲违规驾驶发生重大交通事故致人死亡，属于交通管理法规范围内的交通运输过失，应适用特别法交通肇事罪而非普通过失致人死亡罪\nB✗ 去寺庙烧香祈祷乙死去纯属迷信思想行为，客观上没有任何杀害乙的实行行为与因果力，不能成立故意杀人罪\nC✗ 理由同上，既不成立普通过失致人重伤，更不因迷信祈祷成立故意杀人\nD✓ 交通肇事罪：乙次日伤重死亡完全由甲此前的交通肇事行为直接引起（死亡1人且负事故主要责任构成交通肇事罪），去寺庙祈祷与死亡毫无因果关系，只构成交通肇事罪","k":"","kb":54,"kh":[[17,44],[142,167]]},{"id":"2008-18","y":2008,"t":"单","s":"甲欲杀乙,乘乙与朋友在餐馆聚会,向其投掷自制炸药,炸药爆炸后没有伤着乙,却致与乙一起聚餐的丙当场死亡,丁、戊受重伤。甲的行为应以（ ）。","o":["故意杀人罪定罪处罚","故意杀人罪与故意伤害罪并罚","爆炸罪定罪处罚","故意杀人罪与故意伤害罪、爆炸罪并罚"],"a":"A","e":"\u0001针对特定仇人及其聚餐朋友投掷炸药（仅限于餐馆局部包间或几名特定对象聚餐场合，当年真题认定未危害不特定多数人公共安全），一行为致一死两重伤属想象竞合择一重罪定故意杀人罪。\u0002\nA✓ 故意杀人罪定罪处罚：按2008年真题命题设定（针对特定乙与其聚餐对象投掷自制炸药，未危及餐馆外不特定公众与周边建筑安全），一行为导致丙死亡与丁戊重伤成立故意杀人罪与故意伤害罪的\u0001想象竞合犯\u0002，从一重罪按故意杀人罪定罪处罚\nB✗ 仅投掷一次自制炸药属于“一个行为”触犯数个罪名（想象竞合），依法只能择一重罪处罚，不能数罪并罚\nC✗ 本案命题界定爆炸波及范围局限在聚餐特定对象范围内、未危及公共安全（注：实务中若餐馆营业人流密集则也可认定爆炸罪，应紧扣当年真题明确考察“针对特定多人且一行为想象竞合择一重罪”）\nD✗ 一行为想象竞合绝不数罪并罚\n考试对比技巧（2008-18 vs 2010-17）：\n- 仅致与仇人同桌聚餐的特定几人死伤（未提公共场所人流密集）→ 2008真题定\u0001故意杀人罪\u0002（重点测“一行为数结果”想象竞合择一重）；\n- 明确交代在“农贸市场”、“机场大厅”等人流密集公共场所掷炸药 → 必选\u0001爆炸罪\u0002！","k":"","kb":53,"kh":[[46,90]]},{"id":"2010-9","y":2010,"t":"单","s":"甲在行驶中的公共汽车上与售票员发生争执, 气愤之下举起随身携带的铁锤猛砸汽车车窗,致车窗破碎,造成经济损失1万余元。甲的行为构成（ ）。","o":["破坏交通工具罪","故意毁坏财物罪","破坏交通设施罪","以危险方法危害公共安全罪"],"a":"B","e":"\u0001在公交车上用铁锤砸碎汽车车窗玻璃造成损失1万余元，车窗玻璃并非危及行车倾覆的关键机械部件且未危及不特定多数人公共安全，只构成故意毁坏财物罪。\u0002\nA✗ 破坏交通工具罪要求破坏的是发动机、制动刹车系统、方向盘等\u0001足以使交通工具发生倾覆、毁坏危险\u0002的关键部位；砸破车窗玻璃不足以导致客车倾覆\nB✓ 故意毁坏财物罪：故意砸坏公交车车窗玻璃致直接经济损失1万余元（已达数额较大起刑点），侵害他人财产权，成立故意毁坏财物罪\nC✗ 公共汽车属于“交通工具”，不属于轨道、桥梁、信号灯等“交通设施”\nD✗ 单纯砸破一块车窗不产生类似于失控撞人、纵火等导致不特定多数人死伤的重大公共危险","k":"","kb":53,"kh":[[219,244],[342,355]]},{"id":"2010-15","y":2010,"t":"单","s":"某矿井在开采中瓦斯浓度超标,工人向矿主反映。矿主拒绝解决问题,并威胁不干活即开除,要求工人继续采矿,致3人窒息死亡,5人重伤。该矿主的行为应定为（ ）。","o":["重大责任事故罪","过失致人死亡罪","过失以危险方法危害公共安全罪","强令违章冒险作业罪"],"a":"D","e":"\u0001矿主明知瓦斯浓度超标仍威胁不开除就必须下井采矿，致3死5伤，构成《刑法》第134条第2款强令违章冒险作业罪。\u0002\nA✗ 普通重大责任事故罪仅是工人在作业中自行违反安全规章；本案是矿主\u0001“强令”和以开除相威胁\u0002迫使工人违章下井，应定专门的第134条第2款强令违章冒险作业罪\nB✗ 发生于矿井开采生产作业过程中且系强令冒险作业所致，应按特别法（第134条第2款）定罪\nC✗ 与不特定公众无关且明确指向矿井作业违章强令，应按业务事故特别罪名处理\nD✓ 强令违章冒险作业罪：明知矿井瓦斯超标重大隐患，仍以“不干即开除”相威胁强迫工人下井致3死5重伤，完美符合《刑法》第134条第2款构成要件\n\u0001【新法提示】\u0002《刑法修正案（十一）》将本罪名扩充修改为“\u0001强令、组织他人违章冒险作业罪\u0002”，即使未暴力强逼而明知有重大隐患仍“冒险组织作业”的也构成该罪。","k":"","kb":55,"kh":[[151,208]]},{"id":"2010-17","y":2010,"t":"单","s":"甲为报复杀害其仇人乙,在农贸市场将自制的爆炸装置点燃后掷向乙,致乙重伤,并造成三名菜农轻伤。对甲的行为应定为（ ）。","o":["故意杀人罪","故意杀人罪和故意伤害罪","故意伤害罪","爆炸罪"],"a":"D","e":"\u0001为杀害仇人在人群稠密的“农贸市场”投掷爆炸装置，客观上必然威胁周围大量无辜摊贩及群众生命财产安全，应以爆炸罪定罪。\u0002\nA✗ 在农贸市场人群稠密区域使用爆炸物，哪怕主观目的只针对仇人乙，但明知可能伤及众多无辜仍实施爆炸，危害公共安全，由更严厉且保护公共法益的爆炸罪涵括\nB✗ 一次爆炸一行为触犯爆炸罪与杀人/伤害罪，属想象竞合绝不数罪并罚\nC✗ 远超单纯故意伤害个人罪名所能评价的公共安全危险\nD✓ 爆炸罪：农贸市场人员密集，投掷爆炸物致仇人重伤及三名菜农轻伤，足以危害不特定多数人公共安全，应认定为\u0001爆炸罪\u0002","k":"","kb":53,"kh":[[46,90]]},{"id":"2011-2","y":2011,"t":"单","s":"甲是某运输公司的经理,为了抢运煤炭,甲亲自跟车督促驾驶。在驾驶员乙已经连续驾驶10多个小时的情况下,甲仍强令乙继续加速。乙因过度疲劳,操作不当,在驾驶中撞死路边一摆摊商贩。关于本案,下列说法正确的是（ ）。","o":["甲构成重大责任事故罪","甲、乙成立交通肇事罪共犯","甲构成交通肇事罪","甲构成强令违章冒险作业罪"],"a":"C","e":"\u0001运输公司经理亲自跟车并强令已连续驾驶10多小时的司机继续加速，致疲劳驾驶撞死路人，依司法解释第7条，指使强令违章驾驶的单位主管人员直接以交通肇事罪定罪处罚。\u0002\nA✗ 强令违章驾驶发生在道路公共交通运输活动中，司法解释专门明确按交通肇事罪定罪处罚，不另定重大责任事故罪\nB✗ 注意第7条与第5条第2款的区别：指使强令违章驾驶（第7条）法条写明“\u0001以交通肇事罪定罪处罚\u0002”（即各自单独成立或分别构成，考试真题单选严格遵循“司法解释未在强令违章条款中写‘以共犯论处’，而是在指使逃逸条款写‘以共犯论处’”，故C而非B！）\nC✓ 甲构成交通肇事罪：依最高法《交通肇事解释》第7条，单位主管人员强令驾驶员疲劳超速违章驾驶造成重大交通事故致1人死亡的，直接\u0001以交通肇事罪定罪处罚\u0002\nD✗ 公路驾驶运输领域由特别法/司法解释专门归入交通肇事罪，而非第134条第2款厂矿作业之强令违章冒险作业罪\n《交通肇事解释》两大极易混淆考点对照：\n- 事后指使\u0001逃逸\u0002致被害人死亡（第5条第2款）→ 以交通肇事罪的\u0001共犯\u0002论处（过失犯罪特例成立共犯）；\n- 事前指使/强令\u0001违章驾驶\u0002致重大事故（第7条）→ 对指使人直接“以交通肇事罪定罪处罚”（不叫共犯）。","k":"","kb":54,"kh":[[307,376]]},{"id":"2012-7","y":2012,"t":"单","s":"甲在乡村公路上高速驾驶拖拉机,因视线不好将拴在路边的耕牛撞死。对甲的行为（ ）。","o":["不应认定为犯罪","以危险驾驶罪定罪处罚","可以免予刑事处罚","以交通肇事罪定罪处罚"],"a":"A","e":"\u0001在乡村公路上撞死拴在路边的耕牛（财产），未致人重伤/死亡，且拖拉机系农业机械或未造成30万以上无法赔偿财产损失，既不构成交通肇事罪也不构成危险驾驶罪，不应认定为犯罪。\u0002\nA✓ 不应认定为犯罪：仅撞死一头耕牛（远未达到30万元以上重大公私财产损失无能力赔偿标准），且没有致人重伤死亡、也没有追逐竞驶/醉酒驾驶等危险驾驶行为，缺乏刑事违法性\nB✗ 《刑法》第133条之一危险驾驶罪仅限追逐竞驶、醉酒驾驶、严重超员超速客运/校车或违规运危化品四种（注：驾驶拖拉机正常行车视线不佳撞牛绝非危险驾驶）\nC✗ 免予刑事处罚的前提是行为已然构成犯罪但情节轻微不需要判刑；撞死一头牛压根不构成犯罪，应直接作无罪处理\nD✗ 交通肇事罪要求致人死亡/重伤或财产损失无力赔偿30万元以上，撞死一头耕牛仅涉民事损害赔偿","k":"","kb":54,"kh":[[190,234]]},{"id":"2012-45","y":2012,"t":"多","s":"下列选项中,应以投放危险物质罪定罪处罚的有（ ）。","o":["甲在其竞争对手销售的面粉中掺入毒鼠强","乙为吸引顾客,在火锅底料中掺入罂粟壳","丙工厂违反规定,向河流中排放有毒废物,造成下游大片农作物绝收","丁意图报复本单位领导,在单位的公用饮水机中投放无色无味的剧毒农药"],"a":"AD","e":"\u0001向面粉厂竞争对手的面粉中掺入剧毒“毒鼠强”、向单位公用饮水机投入无色无味剧毒农药，足以危及不特定或多数人生命安全，定投放危险物质罪；火锅加罂粟壳一般仅治安/有毒有害食品；工厂排污定污染环境罪。\u0002\nA✓ 面粉销售面广面向不特定消费者，掺入剧毒“毒鼠强”足以造成多人急性中毒死亡，构成\u0001投放危险物质罪\u0002\nB✗ 在火锅底料中掺入罂粟壳主要是为提鲜成瘾，不具备瞬间毒死或造成严重伤亡的剧毒公共高度危险（视情节通常构成\u0001生产、销售有毒、有害食品罪\u0002或行政违法）\nC✗ 工厂向河流违法排放工业有毒废物造成农作物绝收，侵害环境生态法益，依法构成《刑法》第338条\u0001污染环境罪\u0002\nD✓ “单位的公用饮水机”面向本单位全体员工及来访人员等多数不特定饮用者，投放无色无味剧毒农药足以危害公共安全，构成\u0001投放危险物质罪\u0002","k":"","kb":53,"kh":[[56,90]]},{"id":"2013-9","y":2013,"t":"单","s":"甲驾驶货车途经某村庄时,刮倒了路边的赵某。甲从后视镜中看见赵某被拖挂在车后,但为逃避责任继续行驶,致赵某被拖死。甲的行为构成（ ）。","o":["交通肇事罪","交通肇事罪和故意杀人罪","故意杀人罪","以危险方法危害公共安全罪"],"a":"C","e":"\u0001货车仅仅刮倒路边行人尚未构成交通肇事罪（未造成重伤/死亡），后明知被害人拖挂在车底却为逃责加速行驶将其活活拖死，转化为间接故意的故意杀人罪（仅定故意杀人罪）。\u0002\nA✗ 此前仅轻轻刮倒路人并未直接造成重伤/死亡，在逃跑前尚不成立交通肇事罪；拖死人是因明知挂在车后仍继续行驶的放任故意，不能仅按过失交通肇事逃逸致死评价\nB✗ 前一次单纯刮倒行为没有达致交通肇事入罪门槛，因此前罪不成立，无需数罪并罚\nC✓ 故意杀人罪：从后视镜明确看见赵某被挂在车后，却不顾其生死继续强行驾车逃离致其拖死，对死亡后果持明知且放任态度，成立间接故意的\u0001故意杀人罪\u0002\nD✗ 本案危害对象仅仅是拖挂在车后的特定受害人赵某，并未威胁路上不特定多数公众，不构成以危险方法危害公共安全罪\n高发辨析：\n- \u0001已经撞致重伤/危重\u0002（已成立交通肇事罪）后，仅仅消极驾车逃逸未救助致人死亡 → 定\u0001交通肇事罪（因逃逸致人死亡）\u0002；\n- 先前仅轻刮未构罪，或者把伤者\u0001拖入偏僻荒野隐藏/明知挂在车底仍强行拖拽碾压\u0002致死 → 定\u0001故意杀人罪\u0002！","k":"","kb":54,"kh":[[437,470]]},{"id":"2014-44","y":2014,"t":"多","s":"甲在长途汽车站窃得他人挎包一个,事后发现包内有现金2000元、海洛因200克、手枪一把,遂将海洛因和手枪藏在家中。甲的行为构成（ ）。","o":["盗窃罪","盗窃枪支罪","非法持有枪支罪","非法持有毒品罪"],"a":"ACD","e":"\u0001不知手提包内有海洛因和手枪而秘密窃取（含现金2000元），因缺乏盗窃枪支/毒品的故意仅定盗窃罪；事后发现并藏匿在家中非法持有，另定非法持有枪支罪、非法持有毒品罪并罚。\u0002\nA✓ 盗窃挎包内现金2000元（数额较大）及其他财物，主观具有窃取财物故意，成立\u0001盗窃罪\u0002\nB✗ 《刑法》第127条盗窃枪支罪要求行为人实施盗窃时“明知是枪支”而窃取；偷包时并不知包内有手枪，不构成盗窃枪支罪\nC✓ 事后发现手枪仍不交公而擅自藏匿在家中，具有持有枪支的明知与故意，构成\u0001非法持有枪支罪\u0002（第128条）\nD✓ 事后发现200克海洛因（远超50克以上入罪门槛）仍私藏家中，构成\u0001非法持有毒品罪\u0002（第348条）","k":"","kb":58,"kh":[[34,125]]},{"id":"2015-8","y":2015,"t":"单","s":"甲在某机场到达大厅出口外引爆自制爆炸装置,造成一人轻伤。甲的行为应认定为（ ）。","o":["爆炸罪","寻衅滋事罪","故意伤害罪","以危险方法危害公共安全罪"],"a":"A","e":"\u0001在人流密集的机场到达大厅出口外引爆自制爆炸装置，即使仅造成1人轻伤，由于爆炸罪属危险犯且危及不特定多数人公共安全，成立爆炸罪。\u0002\nA✓ 爆炸罪：机场到达大厅人员高度密集且流动性强，在出口引爆爆炸装置足以危及不特定多数人生命健康和公共秩序，成立\u0001爆炸罪（既遂）\u0002\nB✗ 使用自制炸药引爆绝非普通的滋扰打闹，应当定性为严重危害公共安全的爆炸罪\nC✗ 行为手段与危及的客体远超特定个人身体健康范畴，不按一般故意伤害罪论处\nD✗ 法条已明确把“爆炸”单独列明为《刑法》第114条具体罪名，“以危险方法危害公共安全罪”只是兜底条款，有明确对应危险方法的（放火、决水、爆炸、投毒）不适用兜底罪名","k":"","kb":53,"kh":[[46,90]]},{"id":"2015-16","y":2015,"t":"单","s":"甲遇红灯停车时,与路人孙某发生口角,甲下车将孙某打倒在地,驾车离去。孙某坐在马路上,不听他人劝导,拒绝离开。十分钟后,乙超速驾车经过此处,来不及刹车,将孙某撞死。下列选项中,正确的是（ ）。","o":["甲构成故意伤害罪(致人死亡)","甲构成寻衅滋事罪","甲和乙共同构成交通肇事罪","乙构成交通肇事罪"],"a":"D","e":"\u0001甲打倒孙某后即驾车离开，孙某清醒坐于马路拒绝他人劝离开，10分钟后乙超速车来不及刹车撞死孙某。甲的伤害行为与乙超速撞死结果之间因被害人异常介入及第三人重大违规介入而中断因果关系，乙独自构成交通肇事罪。\u0002\nA✗ 甲将孙某打倒时未造成致死伤情，后续孙某拒不听劝滞留马路长达10分钟后被超速行驶的乙撞死，该死亡结果是由\u0001乙超速违章驾驶及孙某自身异常行为\u0002介入导致，甲的伤害行为与死亡之间因果关系已中断，甲仅承担普通殴打责任（若未轻伤则不构成故意伤害致死）\nB✗ 仅仅因口角一时冲突殴打，通常尚不足以达到寻衅滋事罪所要求的情节恶劣程度（且不对此后死亡负责），相比明确构成的交通肇事罪，本题核心考点正是介入因素因果关系中断\nC✗ 交通肇事罪为过失犯罪，二人事前事中均无共同过失意思联络且行为时空完全隔断，不可能成立共犯\nD✓ 乙构成交通肇事罪：乙超速驾驶违反交通运输法规，撞死滞留道路上的孙某（死亡1人且超速违章存在重大过错责任），依法构成\u0001交通肇事罪\u0002","k":"","kb":54,"kh":[[17,44]]},{"id":"2016-12","y":2016,"t":"单","s":"甲在封闭的居民小区内醉酒驾驶,拐弯时因采取措施不当,将人行道上的2人撞成重伤。甲的行为应认定为（ ）。","o":["危险驾驶罪","交通肇事罪","故意伤害罪","过失致人重伤罪"],"a":"D","e":"\u0001封闭居民小区内部道路原则上不属于“道路（公共道路）”故不构成危险驾驶罪；仅撞伤2人未达到“重伤3人以上”亦不构交通肇事罪，依法定过失致人重伤罪。\u0002\nA✗ 《刑法》第133条之一危险驾驶罪的“在道路上”依照《道路交通安全法》是指公路、城市道路以及\u0001允许社会机动车通行的广场、公共停车场等公共道路\u0002；封闭管理的小区内部人行道不属于“道路”，不构危险驾驶罪\nB✗ 交通肇事罪既要求公共交通管理范围，又要求“死亡1人或重伤3人以上（酒驾须重伤1人以上但仍以在公共交通管理范围为前提）”；封闭居民小区非公共交通管理道路且本题当年认定为\u0001过失致人重伤罪\u0002\nC✗ 醉酒拐弯操作不当撞伤路人属于过失而非故意伤害\nD✓ 过失致人重伤罪：封闭居民小区内驾驶未在公共交通管理范围内，驾车措施不当致2人重伤，成立普通过失犯罪即\u0001过失致人重伤罪\u0002","k":"","kb":54,"kh":[[381,436]]},{"id":"2018-19","y":2018,"t":"单","s":"乘客甲明知擅自打开飞机应急舱门会危及飞行安全,在飞机被牵引车推出阶段故意将应急舱门打开,地勤人员发现应急充气滑梯弹出后将飞机迫离。甲的行为应认定为（ ）。","o":["破坏交通工具罪","暴力危及飞行安全罪","重大飞行事故罪","以危险方法危害公共安全罪"],"a":"D","e":"\u0001在飞机已被牵引车推出准备起飞阶段故意打开应急舱门弹出滑梯导致飞机迫停，虽未达破坏关键结构或对航空人员施暴之要件，但以其他危险方法危及不特定乘客航空公共安全，定以危险方法危害公共安全罪。\u0002\nA✗ 擅自按规程开关打开应急舱门并未破坏损坏飞机机身部件，不构成破坏交通工具罪\nB✗ 《刑法》第123条暴力危及飞行安全罪要求“对飞行中的航空器上人员使用暴力”，甲在地面牵引推出阶段（尚非飞行中）且未对机组人员施暴\nC✗ 《刑法》第131条重大飞行事故罪的主体是\u0001航空人员\u0002（特殊主体），乘客不能构成，且未发生重大事故\nD✓ 以危险方法危害公共安全罪：明知擅自开启应急舱门弹出救生滑梯会直接危机航空器运行与全体机上人员安全仍故意实施，构成\u0001以危险方法危害公共安全罪\u0002","k":"","kb":53,"kh":[[75,100]]},{"id":"2020-10","y":2020,"t":"单","s":"甲被公司处分后心怀不满,毁坏公司正在铺设的在建地铁专用电缆,造成重大财产损失。甲的行为构成（ ）。","o":["破坏交通设施罪","破坏生产经营罪","破坏电力设备罪","以危险方法危害公共安全罪"],"a":"B","e":"\u0001因被处分不满而毁坏公司正在铺设的“在建地铁专用电缆”造成重大财产损失，地铁尚未建成投入运行通车、电缆尚未通电运行，故不危及公共安全，定破坏生产经营罪。\u0002\nA✗ 《刑法》第117条破坏交通设施罪的对象必须是\u0001正在使用中\u0002的交通设施，且电缆非直接轨道信号设施\nB✓ 破坏生产经营罪：出于被处分不满的泄愤报复目的，毁坏正在铺设中的地铁施工专用电缆造成重大损失（尚在施工建设中不产生通车供电公共危险），符合《刑法》第276条\u0001破坏生产经营罪\u0002\nC✗ 《刑法》第118条破坏电力设备罪的对象必须是\u0001正在使用中（已通电或已并网投入使用）\u0002的电力设备；“正在铺设的在建电缆”尚未投入运行使用，不危及公共安全\nD✗ 破坏未投入使用、无公共客运或通电运行的在建施工物料不危及不特定多数人公共安全","k":"","kb":53,"kh":[[356,372]]},{"id":"2021-4","y":2021,"t":"单","s":"甲喝醉后在家耍酒疯,随手将笔记本电脑从 15楼扔出窗外,砸中在小区散步的居民王某,致其重伤。甲的行为应认定为（ ）。","o":["过失致人重伤罪","不构成犯罪","以危险方法危害公共安全罪","故意伤害罪"],"a":"C","e":"\u0001从15楼高空醉酒扔下笔记本电脑将小区散步居民王某砸成重伤，高空抛掷重物足以砸死砸伤过往不特定行人，依《刑法》第291条之二第2款，同时构成重罪以危险方法危害公共安全罪时从重定罪。\u0002\nA✗ 从15楼高空扔电脑砸伤行人的危害程度远超普通过失致人重伤罪的评价范围\nB✗ 醉酒状态犯罪应当负刑事责任\nC✓ 以危险方法危害公共安全罪：从15层高楼向小区公共行人区域抛掷沉重物品（笔记本电脑）并致人重伤，客观具有高度致人重伤或死亡的公共危险，依《刑法》第291条之二第2款“同时构成其他犯罪的，依照处罚较重的规定定罪处罚”，定\u0001以危险方法危害公共安全罪\u0002\nD✗ 甲只是耍酒疯随手扔出，并无专门把王某打伤的特定故意伤害目标，而是放任砸中不特定行人之公共危险","k":"","kb":57,"kh":[[66,128]]},{"id":"2021-16","y":2021,"t":"单","s":"甲偷割使用中的高速公路紧急信息警示屏的电源线,价值5000元。甲的行为应认定为（ ）。","o":["故意毁坏财物罪","破坏交通设施罪","盗窃罪","破坏交通工具罪"],"a":"B","e":"\u0001偷割“正在使用中”的高速公路紧急信息警示屏电源线（价值5000元），同时破坏高速公路交通安全指引标志/设施并构成盗窃罪，一行为想象竞合择一重罪定破坏交通设施罪。\u0002\nA✗ 破坏高速公路正在运行的交通指示信息设施，比一般故意毁坏财物罪严重得多，应当定危害公共安全罪\nB✓ 破坏交通设施罪：高速公路紧急信息警示屏属于保障高速行驶车辆安全的重要\u0001交通设施\u0002，偷割其电源线使其瘫痪足以危及高速公路往来车辆交通安全，同时触犯破坏交通设施罪与盗窃罪，属想象竞合犯，择一重罪定\u0001破坏交通设施罪\u0002\nC✗ 破坏交通设施罪（未造成严重后果即3年以上10年以下有期徒刑）重于5000元盗窃罪（3年以下有期徒刑），应当从重选择破坏交通设施罪\nD✗ 高速公路警示屏属于道路附属交通设施，并非火车、汽车等交通工具","k":"","kb":53,"kh":[[312,341]]},{"id":"2022-3","y":2022,"t":"单","s":"文某为卖废铁,深夜盗窃了公路机动车道上的电力检修井盖,致一辆正常行驶的小汽车陷入检修井并毁坏。文某的行为应认定为","o":["破坏交通工具罪","破坏交通设施罪","破坏电力设备罪","以危险方法危害公共安全罪"],"a":"B","e":"\u0001深夜盗窃“公路机动车道上”的电力检修井盖，致使正常行驶的小汽车陷入井内毁坏，机动车道井盖关乎车辆行车安全属道路交通设施组成部分，构成破坏交通设施罪。\u0002\nA✗ 井盖位于公路路面，不属于汽车等交通工具自身零部件\nB✓ 破坏交通设施罪：盗窃正在使用中的公路机动车道井盖，直接破坏公路路面完整性，足以使过往汽车发生倾覆、毁坏危险（且实际已致汽车毁坏），定\u0001破坏交通设施罪\u0002（与盗窃罪竞合从重）\nC✗ 该行为直接破坏公路路面本身危及车辆倾覆而非破坏供电电网引发触电或大面积断电，最高法相关司法解释明确盗窃机动车道井盖足以危害汽车交通安全的定破坏交通设施罪\nD✗ 凡有破坏交通设施罪等具体危害公共安全罪名精确涵括的，不得再绕开去适用兜底罪名以危险方法危害公共安全罪","k":"","kb":53,"kh":[[312,341]]},{"id":"2023-10","y":2023,"t":"单","s":"甲酒后驾车回家途中,未注意前方禁行标志,驶入禁行路段,导致车辆坠入桥下,两名同乘人员一死一伤。甲的行为应认定为","o":["交通肇事罪","危险驾驶罪","以危险方法危害公共安全罪","过失致人死亡罪"],"a":"A","e":"\u0001酒后驾车且未注意禁行标志闯入禁行路段坠桥，致两名乘车人一死一伤，已经发生重大伤亡事故（死亡1人），危险驾驶与交通肇事吸收或竞合从重定交通肇事罪。\u0002\nA✓ 交通肇事罪：酒后驾车误闯禁行路段坠桥造成同乘人员\u0001一死一伤\u0002，违反交规发生重大交通事故致1人死亡（甲负全责/主责），符合《刑法》第133条交通肇事罪，酒驾之危险驾驶行为被交通肇事罪从重吸收（不数罪并罚）\nB✗ 单纯酒驾未发生重大事故才定危险驾驶罪；一旦酒驾引发致人死伤的重大交通事故，应当升级按处罚更重的\u0001交通肇事罪\u0002定罪处罚\nC✗ 行为人系“未注意”禁行标志的过失驶入禁行路段坠桥，并无在公路上故意高速冲撞人群放任死伤的故意，不成立以危险方法危害公共安全罪\nD✗ 发生在公共交通道路驾驶活动中，交通肇事罪是过失致人死亡罪的特别法条，优先定交通肇事罪","k":"","kb":54,"kh":[[139,167],[243,301]]},{"id":"2025-16","y":2025,"t":"单","s":"甲在办公室值班时违规使用电炉取暖,接续值班的乙见状没有制止,并继续使用该电炉,半夜电炉自燃引发火灾。对此,下列选项正确的是（ ）。","o":["甲、乙均构成犯罪","甲不构成犯罪,乙构成犯罪","甲、乙均不构成犯罪","甲构成犯罪,乙不构成犯罪"],"a":"A","e":"\u0001甲违规使用电炉未处理即离开，接续值班的乙明知电炉违规发热风险既不制止还继续使用引发失火，二人均存在独立或承继的安全注意义务过失，均构成失火罪。\u0002\nA✓ 甲、乙均构成犯罪：甲违规使用电炉取暖直接制造了火灾危险源，乙作为接续值班人员发现危险未制止反而继续使用，二人分别违反防火安全义务的过失行为共同结合引起了电炉自燃火灾严重后果，均构成\u0001失火罪\u0002\nB✗ 甲率先违规开启使用电炉留下重大火灾隐患，并非无罪\nC✗ 电炉自燃引发火灾造成严重后果，甲、乙均应对过失引起火灾承担失火罪刑责\nD✗ 乙接班后负有安全监管职责且实际继续使用该危险电炉，不制止反而促成起火，同样构成失火罪","k":"","kb":55,"kh":[[260,280]]},{"id":"2026-9","y":2026,"t":"单","s":"甲将汽车低价卖给陈某,心有不甘。某日,甲通过手机软件发现该车辆正处于高速行驶状态,于是远程发送强制熄火指令,致使陈某在高速公路上无法正常操控车辆,险些造成连续事故。甲的行为应认定为","o":["故意伤害罪","危险驾驶罪","非法利用信息网络罪","以危险方法危害公共安全罪"],"a":"D","e":"\u0001通过手机软件远程对正在高速公路上高速行驶的车辆发送强制熄火指令，足以造成高速连环追尾群死群伤，构成以危险方法危害公共安全罪。\u0002\nA✗ 险些造成连续事故尚未致具体人员伤残且危险波及高速公路不特定车辆与行人，远非故意伤害个人\nB✗ 危险驾驶罪仅涵盖亲自驾车在道路上追逐竞驶、醉驾等四种情形，远程操控使他人行驶车辆熄火不属于危险驾驶罪\nC✗ 非法利用信息网络罪主要是利用网络设立违法群组或发布违法犯罪信息，与直接利用远程软件熄火危害道路公共安全不符\nD✓ 以危险方法危害公共安全罪：在高速公路上远程强制使正在高速行驶的汽车熄火失控，客观上具有与放火、决水、爆炸相当的危害高速路不特定多数驾乘人员生命安全的高度紧迫危险，构成本罪（具体危险犯）","k":"","kb":53,"kh":[[75,100]]}]},{"sub":"刑法","name":"犯罪主观方面","w":1.2,"L":23,"qs":[{"id":"2005-6","y":2005,"t":"单","s":"根据我国的刑法学说和司法实践,最有可能排除某种犯罪故意的认识错误是（ ）。","o":["法律上的认识错误","对象认识错误","手段认识错误","客体认识错误"],"a":"D","e":"\u0001客体认识错误跨越了不同犯罪构成的边界，最有可能导致行为人缺少实际造成损害所对应罪名的故意。\u0002\nA✗ 法律认识错误（如误以为某种犯罪合法）原则上不影响故意和刑事责任成立\nB✗ 对象认识错误在同一犯罪构成客体内发生时（如误把甲当乙杀），不排除杀人故意\nC✗ 手段认识错误仅影响能否达到预期危害结果（可能成立未遂或不能犯），不当然排除故意\nD✓ 客体认识错误：由于行为人主观认识的客体性质与客观实际侵害的客体性质\u0001不属于同一犯罪构成\u0002（如把人当野兽误杀），最可能直接排除实际发生结果（如故意杀人）的犯罪故意","k":"","kb":27,"kh":[[145,182]]},{"id":"2006-4","y":2006,"t":"单","s":"甲于夜晚在一条封闭的高速公路上驾车正常行驶时,乙突然翻越护栏横穿公路,甲刹车不及将乙撞死。交警认定甲的行为不构成交通肇事罪。下列说法中,不应当作为交警认定依据的是（ ）。","o":["甲的行为与乙的死亡结果之间没有刑法上的因果","甲的行为不违反交通法律法规,缺乏构成交通肇事罪的客观条件","本案属于意外事件","甲对乙的死亡结果没有罪过"],"a":"A","e":"\u0001交警认定正常行驶撞死翻越封闭高速护栏的行人不构罪，关键在于行为人无违反交通法规且无罪过（意外事件），而非否定客观因果关系。\u0002\nA✓ 不应当作为不构罪依据：高速行驶车辆直接撞击确是导致行人死亡的原因，客观上\u0001存在刑法上的因果关系\u0002；不构罪是因为缺乏客观违章行为和主观罪过，而非否认因果关系\nB✗ 甲正常驾车未违章，欠缺交通肇事罪“违反交通运输管理法规”的客观前提，属于正确认定依据\nC✗ 封闭高速上行人违章翻越护栏突发横穿属不能预见事由，认定意外事件是正确依据\nD✗ 甲对死亡结果既无故意又无过失，缺乏主观罪过是正确的不构罪依据","k":"","kb":26,"kh":[[149,204]]},{"id":"2006-5","y":2006,"t":"单","s":"甲明知自己的枪法很差,但为了杀乙,也顾不了那么多了,遂从 100 米外向乙开枪,没想到居然打中了乙,致乙死亡。此案中甲杀害乙的罪过形式是（ ）。","o":["直接故意","间接故意","疏忽大意","过于自信的过失"],"a":"A","e":"\u0001行为人明确追求杀害乙的目的而向其射击并击中致死，即使自知枪法差导致把握不大，仍属于直接故意。\u0002\nA✓ 直接故意：甲主观目的明确是\u0001希望乙死亡（“为了杀乙”）\u0002，即使把握不高也积极追求该危害结果发生，故属直接故意\nB✗ 间接故意是指放任危害结果发生，不具有明确积极追求死亡的目的\nC✗ 疏忽大意是应当预见而未预见结果发生\nD✗ 过于自信的过失是轻信能够避免结果发生且排斥该结果发生\n区分直接故意与间接故意的关键不是“击中概率大小”，而是意志因素上是否\u0001希望（追求）\u0002该危害结果发生。","k":"","kb":26,"kh":[[15,47]]},{"id":"2007-6","y":2007,"t":"单","s":"甲意图杀害张三,在实行犯罪时误把李四认作张三而杀死,张三未遇害。对甲的行为应当 （ ）。","o":["以故意杀人罪 ( 未遂 ) 和过失致人死亡罪数罪并罚","以过失致人死亡罪定罪处罚","以故意杀人罪 ( 未遂 ) 定罪处罚","以故意杀人罪 ( 既遂 ) 定罪处罚"],"a":"D","e":"\u0001意图杀张三却认错对象把李四当作张三杀死，属同客体内的对象错误，依通说法定符合说成立故意杀人罪（既遂）。\u0002\nA✗ 同一生命法益内部的对象认错，不拆分为对张三未遂和对李四过失而数罪并罚\nB✗ 甲明知并积极追求开枪/挥刀致被害人死亡，主观为直接杀人故意而非过失\nC✗ 刑法保护的法益是抽象的“他人生命”，甲想杀“人”也实际杀死了“人”，已经既遂，并非未遂\nD✓ 以故意杀人罪（既遂）定罪处罚：把李四误认作张三杀死属于具体事实认识错误中的\u0001对象错误\u0002，预想客体与实际被害客体在“人的生命”同一构成要件范围内相一致，不影响故意杀人罪既遂成立","k":"","kb":27,"kh":[[113,144]]},{"id":"2008-8","y":2008,"t":"单","s":"甲明知自己的枪法很差,但为杀乙,置乙身边丙的生命安全于不顾,向乙射击。结果没有击中乙,却打死了丙。对于丙的死亡,甲的罪过形式是（ ）。","o":["直接故意","间接故意","疏忽大意的过失","过于自信的过失"],"a":"B","e":"\u0001为杀害乙而明知可能误伤其身旁的丙却放任不管，最终误打死丙，对丙死亡的心理态度为间接故意。\u0002\nA✗ 甲追求的是乙的死亡，对丙的死亡并未积极希望，故不是直接故意\nB✓ 间接故意：明知自己枪法差极可能误击丙，却\u0001“置丙生命安全于不顾”\u0002放任结果发生，对丙死亡属于间接故意\nC✗ 甲已经清楚认识到可能打中丙的危险，并非没有预见\nD✗ 甲并未心怀“相信能避开丙”而采取措施或轻信可避免，而是“置之不顾”","k":"","kb":26,"kh":[[15,47]]},{"id":"2009-7","y":2009,"t":"单","s":"间接故意与过于自信的过失区别的关键在于行为人（ ）。","o":["对危害结果发生的心理态度不同","对危害结果发生的认识因素不同","对危害结果发生是否积极追求","对危害结果发生是否知情"],"a":"A","e":"\u0001间接故意（明知可能发生且“放任”）和过于自信过失（明知可能发生但轻信能避免、“否定/排斥”结果）在认识因素上几乎一致，真正差异在于意志因素即对危害结果的心理态度！\u0002\nA✓ 对危害结果发生的心理态度不同：两者对结果发生“都有预见（认识相同）”，关键分野在于意志要素——间接故意是听之任之的\u0001“放任”\u0002，过于自信过失是真心不愿其发生的\u0001“排斥否定”\u0002\nB✗ 认识因素基本相同，二者都预见到自己行为“可能发生”危害社会的结果（真正认识不同的是“明知必然”与“应当预见而未预见”）\nC✗ 两者都\u0001不是积极追求\u0002（积极追求是直接故意才有的态度，间接故意和过于自信过失均不积极追求结果）\nD✗ 对发生可能性都是有预见（知情）的","k":"","kb":26,"kh":[[35,47],[109,120]]},{"id":"2009-8","y":2009,"t":"单","s":"甲在教育自己的小孩时,因方法粗暴致其重伤。甲认为自己的行为不构成犯罪。甲的这种认识属于（ ）。","o":["对象认识错误","法律认识错误","因果关系认识错误","手段认识错误"],"a":"B","e":"\u0001因粗暴管教重伤子女却自以为“不构成犯罪”，属于对行为法律性质产生误解的法律认识错误（假想无罪）。\u0002\nA✗ 对自己的小孩本身客观身份与对象均无误认，不是对象认识错误\nB✓ 法律认识错误（假想非罪）：行为人清楚自己实施了粗暴殴打行为，仅误认为家庭教育重伤行为\u0001不触犯刑法\u0002，属于法律认识错误\nC✗ 对殴打行为引起孩子重伤的因果历程没有产生认知偏差\nD✗ 对采用的粗暴手段本身也没有发生误认","k":"","kb":27,"kh":[[10,38],[79,95]]},{"id":"2010-2","y":2010,"t":"单","s":"甲将自己亲生的婴儿以2万元价格卖给他人。甲认为自己的行为不构成犯罪,甲的这一认识错误属于（ ）。","o":["法律认识错误","对象认识错误","客体认识错误","手段认识错误"],"a":"A","e":"\u0001出卖自己亲生婴儿获利却以为“卖亲生孩子不犯罪”，属于法律认识错误中的“假想非罪”。\u0002\nA✓ 法律认识错误：明知在出卖亲生婴儿这一事实，只是错误地理解法律认为不构成拐卖儿童罪（假想非罪），原则上\u0001不影响拐卖儿童罪成立\u0002\nB✗ 明知出卖的是自己亲生婴儿，对象认识完全准确\nC✗ 非对客观侵犯法益的性质发生事实层面误判\nD✗ 没有发生对工具或实施手段性质的误解","k":"","kb":27,"kh":[[10,38]]},{"id":"2010-25","y":2010,"t":"多","s":"犯罪目的在定罪中的作用有（ ）。","o":["决定某些犯罪的成立","决定故意犯罪的既遂","决定某些犯罪的性质","决定是否成立共同犯罪"],"a":"AC","e":"\u0001特定犯罪目的在某些目的犯中决定犯罪是否成立，亦可在行为相同而目的不同时决定犯罪性质（区分此罪与彼罪）。\u0002\nA✓ 在目的犯（如以营利为目的的赌博罪、传播淫秽物品牟利罪）中，是否具有该特定目的\u0001直接决定犯罪能否成立\u0002\nB✗ 是否既遂的判断标准是\u0001刑法分则规定的构成要件是否齐备\u0002，而不是看犯罪目的是否在现实中完全实现（目的犯只需要主观具备该目的即可既遂）\nC✓ 同一客观行为因目的不同而定不同罪名（如以牟利目的传播淫秽物品 vs 无牟利目的传播淫秽物品；以非法占有为目的挪用 vs 临时使用挪用），目的\u0001决定犯罪性质\u0002\nD✗ 共同犯罪只要求共同故意（并非要求各共犯一定具备相同动机或相同最终私利），有些犯罪（如片面或一般共犯）不单纯以特定目的决定能否成共犯","k":"","kb":28,"kh":[[28,76]]},{"id":"2011-3","y":2011,"t":"单","s":"甲喜新厌旧,欲杀害妻子乙后与情妇结婚,虽然明知其儿子丙有与乙在同一饭碗里吃饭的习惯,由于杀乙心切而不顾丙的死活,仍在乙的饭碗里投放毒药。结果乙、丙均中毒身亡。本案中甲对丙死亡的心理态度是（ ）。","o":["直接故意","间接故意","过于自信的过失","疏忽大意的过失"],"a":"B","e":"\u0001杀妻心切明知儿子常同碗吃饭极可能一并中毒身亡仍投毒“不顾儿子死活”，对儿子死亡属于间接故意。\u0002\nA✗ 甲希望杀死的是妻子，并不希望儿子死亡，非直接故意\nB✓ 间接故意：明知投毒极可能毒死同碗吃饭的儿子却\u0001“不顾丙的死活”放任不管\u0002，对丙死亡属间接故意\nC✗ 甲并未认为儿子“不会死”或采取任何避险措施，而是明知可能毒死且持无所谓、放任态度\nD✗ 甲明知儿子与妻子同一饭碗吃饭，已经明确预见危害结果发生的可能性","k":"","kb":26,"kh":[[15,47]]},{"id":"2013-13","y":2013,"t":"单","s":"甲意图杀死李某,某夜来到李某家院门外,从门缝窥见院内有一黑影在移动,以为是李某,忙举弩射击。甲次日得知射死的是李某家的驴。对甲的行为应认定为（ ）。","o":["意外事件","打击错误","故意毁坏财物罪","故意杀人罪"],"a":"D","e":"\u0001深夜意图射杀李某，误将院内移动的黑影（驴）当作李某射击致驴死亡，属对象错误（更精确为客体错误/未遂），构成故意杀人罪（未遂）。\u0002\nA✗ 甲主观上有明确的杀人故意并实际开枪射击，绝非没有罪过的意外事件\nB✗ 甲是主观看错了目标把驴当成了人（对象辨认错误），而非看准李某却枪法偏离击中了驴（打击错误）\nC✗ 甲主观上只有杀人之故意而无毁损财物之故意，不构成故意毁坏财物罪\nD✓ 故意杀人罪（未遂）：甲主观意欲杀人并实施了开枪射杀的实行行为，因对象/客体认识错误客观上仅击中驴而未致人死亡，依法成立\u0001故意杀人罪（未遂）\u0002","k":"","kb":27,"kh":[[145,197]]},{"id":"2014-8","y":2014,"t":"单","s":"甲和乙意图置常某于死地,甲持匕首向常某刺去,常某急忙躲闪,匕首刺中了乙,乙流血过多死亡。甲的行为应认定为（ ）。","o":["故意杀人罪(既遂)","过失致人死亡罪","故意杀人罪(未遂)","故意杀人罪(未遂)与过失致人死亡罪"],"a":"A","e":"\u0001欲刺杀常某却因对方躲闪误刺中同伙乙致其死亡，属同一生命法益内的打击错误，依通说法定符合说成立故意杀人罪（既遂）。\u0002\nA✓ 故意杀人罪（既遂）：甲针对常某刺去因常某躲闪而击中乙致死，属于\u0001打击错误（行为偏差）\u0002；按法硕通说\u0001法定符合说\u0002，预想侵害对象与实际侵害对象均属刑法保护的“人的生命”，故直接成立故意杀人罪既遂\nB✗ 虽然具体符合说主张对常某未遂与对乙过失致死想象竞合，但\u0001法硕考试通说采法定符合说\u0002\nC✗ 在法定符合说下不认定为仅成立未遂，乙的死亡结果归属于甲的杀人故意\nD✗ 法硕历年真题按法定符合说定一罪既遂，不采未遂与过失并合之具体符合说","k":"","kb":27,"kh":[[96,144]]},{"id":"2015-6","y":2015,"t":"单","s":"关于故意的认识内容,下列选项中正确的是（ ）。","o":["成立受贿罪,要求行为人认识到自己是国家 ·工作人员","成立聚众淫乱罪,要求行为人认识到自己行为的违法性","成立故意毁坏财物罪,要求行为人认识到毁坏财物的数额较大","成立传播淫秽物品罪,要求行为人认识到传播的是淫秽物品"],"a":"D","e":"\u0001犯罪故意的认识因素仅要求对构成要件所属客观事实与危害性有认识，不要求认识到特殊身份、行为违法性或具体数额标准。\u0002\nA✗ 受贿罪中行为人只需要明知自己所在单位岗位职责及收财办事的事实即可，不要求在法律概念上自己意识到自己是刑法界定的“国家工作人员”\nB✗ 犯罪故意的认识内容一般不要求行为人明确认识到自己行为在刑法规范上的\u0001违法性\u0002\nC✗ 只要求一般地认识到财物有价值并毁坏即可，不要求精确认识到“数额较大”的刑法立案追诉数额标准\nD✓ 成立传播淫秽物品罪，客观构成要件对象就是“淫秽物品”，行为人主观必须\u0001认识到自己传播的是淫秽物品\u0002（否则若误以为普通风景画则阻却故意）","k":"","kb":26,"kh":[[15,32]]},{"id":"2015-42","y":2015,"t":"多","s":"下列选项中,属于法律认识错误的有（ ）。","o":["甲以为在网上窃取“Q币”不犯罪而为之","乙以为杀死他人可以驱除恶灵而杀死他人","丙以为夜间在道路上追逐竞驶不犯罪而为之","丁把他人灌醉后拿走其随身财物,辩称自己犯的是盗窃罪"],"a":"ACD","e":"\u0001假想非罪（窃Q币以为不犯法、夜间飙车以为不犯法）以及对罪名发生误解（醉盗财辩称盗窃罪实为抢劫）均属法律认识错误。\u0002\nA✓ 误以为窃取虚拟财产“Q币”不触犯刑法，属于法律认识错误中的\u0001假想非罪\u0002\nB✗ 以为杀人能“驱除恶灵”属于荒谬迷信下的犯罪动机（仍清楚自己在杀人），不属于法律认识错误\nC✓ 误以为夜间道路飙车不犯法，属于法律认识错误中的\u0001假想非罪\u0002（实际上可能成立危险驾驶罪）\nD✓ 把人灌醉后取财客观上以暴力/麻醉手段使被害人不知/不能反抗，应属抢劫罪，行为人辩称是盗窃罪，属于对\u0001自己行为触犯的罪名及轻重发生误解\u0002的法律认识错误","k":"","kb":27,"kh":[[10,38]]},{"id":"2016-44","y":2016,"t":"多","s":"下列情形中,属于事实认识错误的有（ ）。","o":["甲殴打张某时,失手打中了路人李某,致其重伤","乙认为家长教训孩子天经地义,经常在家殴打孩子","丙误以为前来抓捕自己的警察赵某是仇家,挥棍将其打成重伤","丁开车欲撞死钱某,钱某被撞后倒地昏迷,丁误认为其已死亡于是离去"],"a":"ACD","e":"\u0001失手打中路人（打击错误）、误把抓捕警察当仇家（对象错误）、误以为撞死伤者而离开（因果关系错误）均属事实认识错误。\u0002\nA✓ 殴打张某失手打中路人李某，属于行为实际击中目标偏离预想目标的\u0001打击错误（行为偏差）\u0002\nB✗ 认为“家长打孩子天经地义”是对行为合法性产生的\u0001法律认识错误\u0002，而非事实认识错误\nC✓ 误将便衣/抓捕警察赵某当作私仇报复，属于对行为人真实身份的\u0001对象认识错误\u0002（如排除妨害公务故意，仍定故意伤害）\nD✓ 撞倒受害人误以为已死亡，属于行为结果与因果进程上的\u0001因果关系认识错误\u0002","k":"","kb":27,"kh":[[39,78]]},{"id":"2017-5","y":2017,"t":"单","s":"甲想用水果刀伤害张三,却失手将张三旁的李四捅伤。这种情形在我国刑法中属于（ ）。","o":["因果关系错误","打击错误","行为性质错误","意外事件"],"a":"B","e":"\u0001甲拿刀本欲捅张三，因挥刀偏差失手捅到了站在旁边的李四（攻击行为发生空间偏离，实际击中对象并非本想侵害之人），属于“打击错误”（行为偏差）。\u0002\nA✗ 因果关系错误是对行动到结果间具体致害过程发生了认知失误，而本题甲并没误认李四就是张三，纯粹是“准头偏了刺错人”\nB✓ 打击错误：又称为方法错误、行为偏差，是指行为人对自己意欲侵害的对象（张三）没有认错，仅仅由于动作失准、风向或被害人躲闪等客观失手误打到了旁边另一个人（李四），属于典型\u0001打击错误\u0002\nC✗ 客体（行为性质）错误是指主观想打砸财物却砸死人或想砸国宝却误以为普通废铁（跨越了不同犯罪构成客体），而张三与李四法益同属于公民人身健康权同一构成要件\nD✗ 甲持刀主动故意杀人伤害，显然有故意犯罪意思，绝非无罪过的意外事件","k":"","kb":27,"kh":[[113,144]]},{"id":"2018-13","y":2018,"t":"单","s":"下列选项中,主观方面可以表现为过失的是 （ ）。","o":["放火罪","虐待罪","危险驾驶罪","食品监管渎职罪"],"a":"D","e":"\u0001食品监管渎职罪（现食品、药品监管渎职罪）同时包含滥用职权（故意）和玩忽职守（过失）两种罪过形态。\u0002\nA✗ 放火罪只能由故意构成（过失引起火灾为失火罪）\nB✗ 虐待罪只能由故意构成\nC✗ 危险驾驶罪属于故意犯罪（主观上要求明知自己在醉驾或追逐竞驶）\nD✓ 食品监管渎职罪：既可因\u0001滥用职权（故意）\u0002实施，也可因\u0001玩忽职守（过失）\u0002导致发生重大食品安全事故\n\u0001【新法提示】\u0002《刑法修正案（十一）》将“食品监管渎职罪”扩充修改为“\u0001食品、药品监管渎职罪\u0002”，主观方面依然既包括故意滥用职权也包括过失玩忽职守。","k":"","kb":26,"kh":[[74,120]]},{"id":"2018-16","y":2018,"t":"单","s":"甲误把张某当作李某推入水井,意图将其淹死,但事实上井中无水,结果张某摔死,这属于 （ ）。","o":["客体错误","工具错误","打击错误","因果关系错误"],"a":"D","e":"\u0001虽然甲同时把张某错当成李某（同一构成要件内的对象错误——在刑法评价上完全等价不影响故意杀人既遂），但“本打算投井淹死结果井是干的摔死了”属于手段引发因果流向与预想不符的狭义因果关系错误（选项无对象错误，直选因果关系错误）。\u0002\nA✗ 人与人同属生命权犯罪构成，张某与李某均受《刑法》第232条同一客体保护，不存在跨罪质客体错误\nB✗ 不存在此“工具错误”导致结果背离\nC✗ 行为本来就是朝眼前的那个人推进井里去（准头完全没偏），只不过自己认错了人（对象错误）且弄错了致死机制\nD✓ 因果关系错误：甲预想的死亡因果链路是“落入有水井→溺水窒息死”，而现实发生的链路是“落入无水干井→高坠摔死”；这属于\u0001狭义的因果关系错误\u0002，由于推人入井行为本身即高度致命，主观故意与客观因果并未脱离，仍定故意杀人罪既遂","k":"","kb":27,"kh":[[61,77]]},{"id":"2019-3","y":2019,"t":"单","s":"甲看见猎物旁边有猎人赵某潜伏，虽明知自己枪法不好，仍向猎物开枪，结果将赵某打死。甲对赵某死亡的心理态度属于（ ）。","o":["直接故意","疏忽大意的过失","间接故意","过于自信的过失"],"a":"C","e":"\u0001明知猎物旁有人且枪法不好，虽不希望打死赵某但仍贸然开枪射杀猎物，属于放任结果发生的间接故意。\u0002\nA✗ 甲打猎的目的是击中猎物，并不希望打死猎人赵某，不是直接故意\nB✗ 甲“看见”赵某在旁并明知自己枪法差，已经预见到击中赵某的危险，不属于应当预见而没预见的疏忽大意过失\nC✓ 间接故意：明知极可能误杀赵某却没有任何可靠避免措施，为打猎贸然开枪\u0001放任死亡结果发生\u0002，属间接故意\nD✗ 过于自信的过失要求“轻信能够避免”（如自恃枪法精准、自以为必中猎物）；题干明确甲\u0001“明知自己枪法不好”\u0002，毫无可靠把握\n间接故意 vs 过于自信过失的经典判别标志：\u0001“明知枪法不好”仍开枪 = 毫无避免依据而放任（间接故意）；“自恃枪法极好”开枪失手 = 轻信能够避免（过于自信过失）\u0002。","k":"","kb":26,"kh":[[15,47]]},{"id":"2020-19","y":2020,"t":"单","s":"工休期间,建筑工人甲在工地上将与自己相互嬉闹的工友乙推倒,致乙跌落摔死。甲的行为应认定为（ ）。","o":["意外事件","重大责任事故罪","故意伤害罪","过失致人死亡罪"],"a":"D","e":"\u0001工休时间相互嬉闹推倒工友摔死，非生产作业过程不构成重大责任事故罪，无伤害故意而成立过失致人死亡罪。\u0002\nA✗ 在工地上推搡工友本就伴有跌倒受伤风险，属于应当预见而疏忽大意未能避免的过失，并非不能预见的意外事件\nB✗ 重大责任事故罪必须发生在\u0001生产、作业过程中\u0002且违反安全管理规定；本案发生在工休嬉闹时\nC✗ 双方仅系互相嬉闹，甲没有伤害乙身体健康的故意，不成立故意伤害罪\nD✓ 过失致人死亡罪：工休推搡致工友意外跌落摔死，行为人有过失且非生产作业事故，构成普通过失致人死亡罪","k":"","kb":26,"kh":[[74,106]]},{"id":"2022-6","y":2022,"t":"单","s":"甲驾驶车辆在封闭的高速公路上正常行驶,突然发现有人横穿公路,躲避不及,将该人撞死。甲对该死亡结果","o":["无罪过","具有疏忽大意的过失","具有间接故意","具有过于自信的过失"],"a":"A","e":"\u0001在封闭高速公路正常驾驶突然撞死违规翻越横穿公路的行人，属不能预见的原因引起的无罪过事件（意外事件）。\u0002\nA✓ 无罪过（意外事件）：封闭高速公路禁止行人进入，驾驶员正常合法行驶不可能也无义务预见突然横穿的行人，属于\u0001不能预见\u0002引起的意外事件\nB✗ 注意客观条件“封闭的高速公路正常行驶”，一般谨慎驾驶人不应当预见会有行人突然横穿，无疏忽大意过失\nC✗ 驾驶员完全没有撞人的预见与放任心理，非间接故意\nD✗ 事前根本未预见到有人横穿，亦非过于自信的过失","k":"","kb":26,"kh":[[149,204]]},{"id":"2022-12","y":2022,"t":"单","s":"下列选项中,不应认定为存在犯罪故意的是","o":["精神病人犯罪的","醉酒的人犯罪的","防卫过当造成重大损害的","不可抗力造成损害结果的"],"a":"D","e":"\u0001不可抗力造成损害结果的，因缺乏故意和过失属于无罪过事件，不应认定为存在犯罪故意。\u0002\nA✗ 未发病的精神病人或间歇性精神病人在精神正常时，甚至虽达限制责任能力者，完全可能具有犯罪故意（仅严重发病不能辨认控制时不负刑责）\nB✗ 醉酒的人犯罪同样可以具有犯罪故意，依法负刑事责任\nC✗ 防卫过当的罪过形式多数为过失，但防卫人认识到明显超过限度会造成重大损害却仍放任发生的，\u0001也可以具有间接故意\u0002\nD✓ 不可抗力属于《刑法》第16条规定的\u0001无罪过事件\u0002（不是出于故意或者过失，而是由于不能抗拒的原因引起），绝对不存在犯罪故意","k":"","kb":30,"kh":[[150,164]]},{"id":"2026-42","y":2026,"t":"多","s":"下列犯罪中,属于我国刑法明文规定的目的犯的有","o":["盗窃罪","高利转贷罪","侵犯著作权罪","破坏经营罪"],"a":"BCD","e":"\u0001高利转贷罪（以转贷牟利为目的）、侵犯著作权罪（以营利为目的）、破坏生产经营罪（由于泄愤报复或者其他个人目的）均属刑法明文规定的目的犯；盗窃罪非法占有目的属于不成文主观要素。\u0002\nA✗ 《刑法》第264条盗窃罪条文只写“盗窃公私财物”，其“非法占有目的”属于刑法理论上公认的\u0001不成文的主观超过要素\u0002，而非条文“明文规定”\nB✓ 《刑法》第175条高利转贷罪明文规定：\u0001“以转贷牟利为目的”\u0002\nC✓ 《刑法》第217条侵犯著作权罪明文规定：\u0001“以营利为目的”\u0002\nD✓ 《刑法》第276条破坏生产经营罪明文规定：\u0001“由于泄愤报复或者其他个人目的”\u0002\n高发微考点：刑法分则条文\u0001明文写明目的\u0002的常见犯罪包括高利转贷罪、走私淫秽物品罪、侵犯著作权罪、破坏生产经营罪、拐卖妇女儿童罪、集资诈骗罪、贷款诈骗罪等；而\u0001盗窃罪、诈骗罪、抢劫罪\u0002的“以非法占有为目的”是理论推定的不成文要素。","k":"","kb":28,"kh":[[78,93],[94,108],[109,132]]}]},{"sub":"刑法","name":"分则·贪污贿赂罪","w":1.1,"L":22,"qs":[{"id":"2006-12","y":2006,"t":"单","s":"下列表述中,正确的说法是（ ）。","o":["村民委员会主任甲利用职务之便侵吞救济款物,构成贪污罪","普通公民乙利用受聘担任国有公司经理职务的便利条件,侵吞国有财务,不构成贪污罪","国家工作人员利用职务上的便利向他人索取财物,但未为他人谋取利益,不构成受贿罪","丁采用暴力方法阻碍国家机关工作人员执行公务,并致使该工作人员重伤,以妨害公务罪从重处罚"],"a":"A","e":"\u0001村委会主任协助政府管理救济款物属于“依照法律从事公务的人员”，利用职务便利侵吞救济款物构成贪污罪。\u0002\nA✓ 村基层组织人员协助人民政府从事\u0001救济款物管理\u0002等七项行政管理工作时，依照全国人大常委会立法解释以国家工作人员论，侵吞救济款物构成\u0001贪污罪\u0002\nB✗ 依《刑法》第382条第2款，受国有公司委托管理、经营国有财产的人员，利用职务便利侵吞国有财物的，\u0001以贪污论\u0002\nC✗ 依《刑法》第385条，\u0001索贿\u0002（利用职务便利向他人索取财物）不需要“为他人谋取利益”即可构成受贿罪\nD✗ 暴力阻碍公务并致国家机关工作人员重伤的，同时构成妨害公务罪与故意伤害罪，依法应当按处罚较重的\u0001故意伤害罪\u0002定罪处罚（而非仅以妨害公务从重）\n记法：索贿不要求“谋利”；村官协助管理“七大公款”（救灾抢险防汛优抚扶贫移民救济、公益、土地、征地补偿、税款、计生户籍征兵）即算贪污罪主体。","k":"","kb":51,"kh":[[30,88]]},{"id":"2007-19","y":2007,"t":"单","s":"关于挪用公款罪的认定,下列说法中正确的是 （ ）。","o":["以个人名义将公款供其他单位使用的,属于挪用公款归个人使用","行为人挪走公款后未使用该公款的,构成挪用公款罪的未遂","挪用公款以后,携带挪用的公款潜逃的,以挪用公款罪从重处罚","挪用救灾、救济物资数量较大,归个人使用的,不构成挪用公款罪"],"a":"A","e":"\u0001以个人名义将公款供其他单位使用的，属于挪用公款“归个人使用”。\u0002\nA✓ 归个人使用情形二：依全国人大常委会立法解释，\u0001以个人名义将公款供其他单位使用的\u0002，即使未谋私利亦属挪用公款归个人使用\nB✗ 挪用公款罪不要求挪走后实际使用了才既遂，\u0001公款脱离单位控制（挪出）即成立既遂\u0002\nC✗ 携带挪用的公款潜逃，主观上已转化为非法占有目的，应以\u0001贪污罪\u0002定罪处罚\nD✗ 挪用救灾、救济等特定款物归个人使用的，构成\u0001挪用公款罪\u0002且应当\u0001从重处罚\u0002","k":"","kb":9,"kh":[[96,133],[192,208]]},{"id":"2008-20","y":2008,"t":"单","s":"甲为某市副市长,在代表该市到其他省、市进行招商引资活动中多次接受对方省、市赠送的礼品,价值 50 万元, 应当交公而没有交公。甲的行为构成（ ）。","o":["侵占罪","受贿罪","贪污罪","职务侵占罪"],"a":"C","e":"\u0001副市长在国内公务活动中接受应当交公的礼品价值50万元不交公，依照贪污罪定罪处罚。\u0002\nA✗ 侵占罪主体为一般主体，针对代为保管的他人财物、遗忘物、埋藏物，不适用于国家工作人员拒不交公礼品\nB✗ 本题礼金系代表政府招商引资中正常往来获赠、应依法上交而隐匿占为己有，刑法第394条明定\u0001按贪污罪论\u0002（而非普通受贿）\nC✓ 贪污罪：依据《刑法》第394条，国家工作人员在国内公务活动或对外交往中接受礼物，应当交公而不交公，数额较大的，\u0001依照贪污罪定罪处罚\u0002\nD✗ 职务侵占罪的主体是\u0001非国家工作人员\u0002（公司、企业或其他单位人员），副市长属国家工作人员","k":"","kb":8,"kh":[[170,219]]},{"id":"2008-25","y":2008,"t":"多","s":"下列行为中,构成挪用公款罪的有（ ）。","o":["某国有公司经理将本单位公款 10 万元借给亲友使用半年","某国有公司经理以个人名义将本单位公款 10 万元供另一公司使用半年","某高校校长为方便学生实习,个人决定以单位名义将本校公款 100 万元借给某设计研究院使用半年","某村民委员会主任个人决定，将社会捐助的用于该村灾民房屋重建的水泥50吨借给其表弟经营建材业务半年"],"a":"ABD","e":"\u0001挪用公款“归个人使用”包括供亲友/个人使用、以个人名义供其他单位使用、个人决定以单位名义供其他单位使用且谋取个人利益。\u0002\nA✓ 将本单位公款借给亲友使用，属于“将公款供本人、亲友或者其他自然人使用”\nB✓ 以个人名义将本单位公款供另一公司使用，属于“以个人名义将公款供其他单位使用”\nC✗ 个人决定以单位名义将公款借给其他单位使用，但目的是\u0001方便学生实习（未谋取个人利益）\u0002，不构成挪用公款罪\nD✓ 村委会主任管理特定救灾款物时属国家工作人员，个人决定将救灾水泥借给表弟经营建材业务半年，构成挪用公款罪\n注意：虽将抗震/救灾“水泥”挪用，但依立法与司法解释，挪用救灾、扶贫等\u0001特定款物归个人使用\u0002亦构成挪用公款罪（包含款和物）；而挪作其他“公用”方构成挪用特定款物罪。","k":"","kb":9,"kh":[[169,188],[192,208],[212,239]]},{"id":"2010-16","y":2010,"t":"单","s":"甲与国有公司仓库保管员乙合谋后,由甲在乙值班时将库存物资运出。销赃所得3万元由二人平分。在本案中（ ）。","o":["甲乙都构成贪污罪","甲乙都构成盗窃罪","甲构成盗窃罪,乙构成贪污罪","甲构成掩饰、隐瞒犯罪所得罪,乙构成盗窃罪"],"a":"A","e":"\u0001国有公司仓库保管员（国家工作人员）利用职务便利与普通公民甲合谋盗出库存物资销赃分钱，依据《刑法》第382条第3款“内外勾结伙同贪污，以共犯论处”，甲、乙均定贪污罪。\u0002\nA✓ 甲乙都构成贪污罪：乙系国有公司仓库保管员，具有国家工作人员身份且利用职务便利监守自盗；甲虽为普通公民但与乙事前勾结共同实行并平分赃款，依《刑法》第382条第3款\u0001与国家工作人员勾结伙同贪污的，以贪污罪共犯论处\u0002\nB✗ 有身份者（乙）利用职务便利且为主或支配时，无身份者随有身份者定贪污罪，不按无身份者的盗窃罪定\nC✗ 共同犯罪原则上实行统一罪名定罪，不能各自定盗窃和贪污\nD✗ 甲参与事前合谋且亲自将物资运出，是直接实行共同犯罪人，绝非仅事前无通谋的事后销赃","k":"","kb":64,"kh":[[97,141]]},{"id":"2010-21","y":2010,"t":"多","s":"国家工作人员利用职务上的便利实施下列行为,构成挪用公款罪的有（ ）。","o":["甲将优抚资金10万元借给朋友购买股票,2 个月内归还","乙将价值10万元的防汛物资借给朋友建造住宅,半年后归还","丙将教育专项资金100万元用作自己开办公司的注册资本,1个月内归还","丁将救济款项50万元用于本单位购买高级轿车"],"a":"ABC","e":"\u0001国家工作人员挪用特定款物或公款给个人/自然人使用或营利，均构成挪用公款罪；挪作其他公用才成立挪用特定款物罪。\u0002\nA✓ 优抚资金属特定款物，借给朋友炒股属于挪用特定款物\u0001归个人使用\u0002，成立挪用公款罪（不受三个月限制且从重处罚）\nB✓ 防汛物资借给朋友建房（归个人使用），半年后归还，亦构成挪用公款罪（从重处罚）\nC✓ 将教育专项资金100万元用于\u0001自己开办公司\u0002作注册资本，属挪用公款进行营利活动，数额较大即构罪（不论归还期限）\nD✗ 将救济款用于\u0001本单位购买高级轿车\u0002，属于“将特定款物挪作其他公用”，应构成\u0001挪用特定款物罪\u0002（第273条），不构成挪用公款罪\n关键区别：\u0001特定款物挪归私用 = 挪用公款罪（从重）；挪作其他公用 = 挪用特定款物罪\u0002。","k":"","kb":9,"kh":[[32,68],[96,133]]},{"id":"2012-8","y":2012,"t":"单","s":"某村委会主任甲利用职务便利,将国家下拨的扶贫款20万元用于炒股,后因亏损而无法归还。甲的行为构成（ ）。","o":["贪污罪","挪用公款罪","挪用资金罪","职务侵占罪"],"a":"B","e":"\u0001村委会主任利用协助管理国家扶贫款职务便利挪用炒股，属于国家工作人员，构成挪用公款罪。\u0002\nA✗ 贪污罪须有永久非法占有目的；挪用炒股因亏损无法归还时，若原只有临时使用打算且未携带潜逃/隐匿账目，仍定\u0001挪用公款罪\u0002\nB✓ 挪用公款罪：村委会主任在协助政府管理国家扶贫款等款物时以\u0001国家工作人员论\u0002，挪用炒股属进行营利活动，构成本罪\nC✗ 挪用资金罪主体为\u0001非国家工作人员\u0002，且针对公司企业或村集体自有资金；国家扶贫款属公款，不适用挪用资金罪\nD✗ 职务侵占罪要求永久占有本单位非国家公共资金\n因炒股亏损客观上无力归还≠主观上具有非法占有目的；只有有证据证明行为人客观上有能力归还而拒不归还或携带潜逃时才转化为贪污罪。","k":"","kb":9,"kh":[[52,68]]},{"id":"2012-15","y":2012,"t":"单","s":"甲为某市交通局副局长,负责公路建设工程招标工作。乙为承揽工程,送给甲30万元。不料甲在数日后被调离,不再负责工程招标。乙闻讯后要甲退回30万元,遭拒绝。乙到检察机关投案,交代了给甲30万元欲请甲帮助承揽工程的事实。检察机关遂对甲、乙立案查处,并立即将30万元追缴。下列选项中,正确的是（ ）。","o":["甲构成受贿罪未遂","乙构成行贿罪中止","乙成立立功","对乙可以减轻或者免除处罚"],"a":"D","e":"\u0001甲收受30万元即受贿既遂；乙事后在被追诉前主动交代行贿事实（依当时刑法可减轻或免除处罚）。\u0002\nA✗ 甲已实际收受30万元且已达成谋利约定，受贿罪已\u0001既遂\u0002（承诺或谋利并非受贿罪既遂要件，收受财物即既遂）\nB✗ 乙送出财物给甲时行贿罪已\u0001既遂\u0002，事后索回不成立中止\nC✗ 立功须检举揭发\u0001他人\u0002与己无关的犯罪；交代共同行贿受贿关联事实不属于立功\nD✓ 依2012年命题时《刑法》第390条第2款，行贿人在被追诉前主动交代行贿行为的，可以减轻或者免除处罚\n\u0001【新法提示】\u0002《刑法修正案（九）》将第390条第2款修改为：行贿人在被追诉前主动交待行贿行为的，\u0001可以从轻或者减轻处罚\u0002；只有犯罪较轻、对侦破重大案件起关键作用或者有重大立功表现的，才可以减轻或者免除处罚（不再一律“可以免除”）。","k":"","kb":11,"kh":[[167,195]]},{"id":"2013-15","y":2013,"t":"单","s":"甲收受乙公司50万元现金后,请求在某市交通局当处长的堂兄丙“帮助”乙公司承包某工程。丙遂利用职权,违规操作,帮助乙公司承包了该工程。甲的行为（ ）。","o":["不构成犯罪","构成受贿罪","构成利用影响力受贿罪","构成非国家工作人员受贿罪"],"a":"C","e":"\u0001非国家工作人员（普通公民甲）通过自己当处长的国家工作人员堂兄丙之职务行为，为请托人乙公司违规中标谋取不正当利益并收受50万元，精准构成《刑法》第388条之一利用影响力受贿罪！\u0002\nA✗ 虽非国家工作人员也不是堂兄直接共犯（如未通谋分赃共受贿，堂兄丙也未必然被写明知情分钱而可能系受请托违规操作），但甲独立符合第388条之一构成犯罪\nB✗ 甲本人并非国家工作人员，且题干未言明甲与堂兄丙通谋共同收受贿赂分赃（若堂兄不知情甲拿钱，仅甲收钱通过堂兄违规操作），甲不构成第385条受贿罪正犯或共犯\nC✓ 构成利用影响力受贿罪：甲身为某市交通局处长丙的堂弟（\u0001国家工作人员关系密切的人/近亲属\u0002），通过堂兄的职务行为违规帮助乙公司承包工程（为请托人谋取不正当利益），自己收受50万元好处费（数额巨大），构成第388条之一\u0001利用影响力受贿罪\u0002\nD✗ 甲并不是替任何民企或非国有公司担任职员并在单位采购业务中收受回扣","k":"","kb":10,"kh":[[115,159],[202,239]]},{"id":"2013-45","y":2013,"t":"多","s":"下列选项中,属于挪用公款“归个人使用”的有（ ）。","o":["甲个人决定以单位名义将公款供一有限责任公司使用,自己未从中获利","乙以单位名义将公款供某街道办企业使用,自己从中收取利息","丙以个人名义将公款供某国有企业使用,自己未从中获利","丁将公款借给朋友,供该朋友的孩子出国留学"],"a":"BCD","e":"\u0001个人决定以单位名义将公款供其他单位使用，必须“谋取个人利益”才属挪用公款归个人使用。\u0002\nA✗ 个人决定以单位名义将公款借给其他公司使用，但\u0001自己未从中谋利\u0002，不成立挪用公款“归个人使用”\nB✓ 个人决定以单位名义将公款供其他单位使用，\u0001从中收取利息\u0002属于谋取个人利益，成立“归个人使用”\nC✓ 以\u0001个人名义\u0002将公款供某国有企业使用，无论是否谋利，均成立“归个人使用”\nD✓ 将公款借给朋友（自然人）使用，无论朋友用于何事，均成立“归个人使用”\n记法：“个人名义”无论是否谋利都算；“单位名义”须“个人决定+谋取个人利益”才算。","k":"","kb":9,"kh":[[169,188],[192,208],[212,239]]},{"id":"2016-14","y":2016,"t":"单","s":"法官甲违背事实和法律,判决赵某的儿子无罪。事后,赵某按照和甲事前的约定,将5万元现金送给甲的妻子乙,乙打电话向甲问明情况后收下现金。关于甲、乙的行为,判断正确的是（ ）。","o":["甲只构成徇私枉法罪,乙构成受贿罪","甲只构成徇私枉法罪,乙构成利用影响力受贿罪","甲构成徇私枉法罪和受贿罪,乙构成受贿罪","甲构成受贿罪,乙不构成犯罪"],"a":"C","e":"\u0001司法工作人员收受贿赂并徇私枉法构成数罪，依《刑法》第399条第4款择一重罪处罚；其妻知情后共谋收钱成立受贿罪共犯。\u0002\nA✗ 甲既触犯徇私枉法罪又触犯受贿罪（法律规定择一重罪，但并非“只构成徇私枉法罪”而无受贿罪）\nB✗ 甲事先与赵某约定并通过妻子收受贿赂，乙系\u0001受贿罪共犯\u0002，而非单独构成利用影响力受贿罪\nC✓ 甲分别实施枉法裁判和收受贿赂行为，\u0001构成徇私枉法罪和受贿罪\u0002（量刑时依第399条第4款从一重处罚）；乙知情后共同收钱构成受贿罪共犯\nD✗ 乙事先或事中向甲问明情况后代收贿赂，有共同受贿故意，成立受贿罪共犯\n区分罪数定性与处罚原则：甲的行为实际上触犯徇私枉法罪和受贿罪两个罪名，但法律特别规定“依照处罚较重的规定定罪处罚”（即定一重罪而不并罚）。","k":"","kb":5,"kh":[[170,220]]},{"id":"2017-18","y":2017,"t":"单","s":"甲(建委主任)与妻子乙商议后,由乙出面收受请托人现金300万元,甲为请托人办理建筑审批手续。乙的行为（ ）。","o":["构成受贿罪","构成利用影响力受贿罪","不构成犯罪","构成受贿罪和利用影响力受贿罪"],"a":"A","e":"\u0001妻子与国家工作人员丈夫事先商议后代为出面收受贿赂，成立受贿罪的共同犯罪。\u0002\nA✓ 受贿罪（共犯）：妻子乙与建委主任甲\u0001事前通谋\u0002，由甲履职谋利、乙出面收款，二人形成共同受贿故意，乙构成受贿罪共犯\nB✗ 利用影响力受贿罪要求国家工作人员\u0001不知情或未共谋\u0002，若国家工作人员知情并与亲属共同受贿，则整体定受贿罪共犯\nC✗ 非国家工作人员与国家工作人员勾结共同受贿的，依共同犯罪定罪处罚，并非无罪\nD✗ 受贿罪共犯与利用影响力受贿罪处于互斥关系，不能并列同时成立\n辨析要点：\u0001配偶/近亲属是否与国家工作人员“通谋”\u0002——有通谋定受贿罪共犯；无通谋（靠影响独立斡旋）方定利用影响力受贿罪。","k":"","kb":10,"kh":[[63,95]]},{"id":"2018-8","y":2018,"t":"单","s":"【案情】甲加盖违章建筑，并串通负责房屋征收的国家机关工作人员乙，乙利用职务上的便利帮甲违法取得了200万元征收补偿款，事后，甲将其中的5万元送给乙。\n甲的行为应认定为（ ）。","o":["诈骗罪","贪污罪","行贿罪","侵占罪"],"a":"A","e":"\u0001行贿国家工作人员非法骗取200万元国家征收补偿款（共犯未获选时官方标准答案定诈骗罪）。\u0002\nA✓ 诈骗罪：甲加盖违章建筑骗取200万元征收补偿款，其向乙行贿5万元属诈骗行为的手段/牵连环节，依官方标准答案从一重定\u0001诈骗罪\u0002\nB✗ 按官方真题答案解析，此处未将甲认定为贪污罪共犯（若按新近法考共同贪污观点亦有讨论，真题标准答案为诈骗罪）\nC✗ 甲虽行贿5万元，但骗取200万元补偿款的行为更重，不单独仅定行贿罪\nD✗ 侵占罪对象为合法代为保管的财物，违章补偿款系骗取而非合法占有\n本题官方真题标准答案为诈骗罪（与2018-9官方答案受贿罪配套）；若按“内外勾结骗取国有资金”理论探讨，亦有认定甲、乙成立贪污罪共犯的观点，但做真题应以官方答案为准。","k":"","kb":8,"kh":[[15,54]]},{"id":"2018-9","y":2018,"t":"单","s":"【案情】甲加盖违章建筑，并串通负责房屋征收的国家机关工作人员乙，乙利用职务上的便利帮甲违法取得了200万元征收补偿款，事后，甲将其中的5万元送给乙。\n乙的行为应认定为（ ）。","o":["诈骗罪","贪污罪","受贿罪","职务侵占罪"],"a":"C","e":"\u0001国家工作人员利用职务便利帮他人违法获取补偿款并收受5万元，官方答案定受贿罪。\u0002\nA✗ 乙本人未直接自己骗取财物，而是受托利用职权为甲谋利收受好处费\nB✗ 按官方真题解析与标准答案，乙主要因收受甲5万元贿赂而以受贿罪评价\nC✓ 受贿罪：国家工作人员乙利用负责房屋征收的职务便利，为甲违法谋取利益并\u0001非法收受5万元\u0002，符合受贿罪特征\nD✗ 职务侵占罪的主体是\u0001非国家工作人员\u0002，乙系国家机关工作人员\n\u0001【新法提示】\u0002《刑法修正案（十一）》已将职务侵占罪最高刑由十五年有期徒刑提高至无期徒刑；同时注意本题官方参考答案为受贿罪（有实务观点亦探讨构成贪污罪共犯）。","k":"","kb":10,"kh":[[15,62]]},{"id":"2019-8","y":2019,"t":"单","s":"交通协管员甲以真实身份从多名请托人处收受巨额财物,后向与之关系密切的某交警“打招呼”, 让其对请托人的违章行为减免处罚。甲的行为应认定为（ ）。","o":["诈骗罪","受贿罪","职务侵占罪","利用影响力受贿罪"],"a":"D","e":"\u0001交通协管员（非国家工作人员）凭借真实协管身份向多名请托人收受巨额好处费，利用平时工作与某交警的密切关系找该交警打招呼免除违章处罚，构成利用影响力受贿罪。\u0002\nA✗ 甲是凭借“真实身份”并且“真正找到交警打招呼”办事，并未虚构身份骗钱，不构成诈骗罪\nB✗ 交通协管员本身不属于依法从事公务的国家工作人员（或国家机关工作人员），受贿罪主体不适格（非国家工作人员无法单独定受贿罪）\nC✗ 甲不是侵占本单位交警队既有财物，而是向外收受请托人的“跑腿打点钱”\nD✓ 利用影响力受贿罪：协管员甲虽非正式民警（国家工作人员），但属于“\u0001与该国家工作人员（某交警）关系密切的人\u0002”，利用该关系通过交警职务便利为请托人谋取违章免罚不正当利益并收受巨额财物，精确成立《刑法》第388条之一\u0001利用影响力受贿罪\u0002","k":"","kb":64,"kh":[[165,236]]},{"id":"2019-18","y":2019,"t":"单","s":"国有公司负责人甲的下列行为,应当认定为挪用公款归个人使用的是（ ）。","o":["经单位集体决定后将公款供其他私人公司使用","经单位集体决定后将公款供个人承包企业使用","以个人名义将公款供其他国有资本控股企业使用","个人决定以单位名义将公款供其他单位使用但没有谋取个人利益"],"a":"C","e":"\u0001以个人名义将公款供其他国有控股企业使用，成立挪用公款“归个人使用”。\u0002\nA✗ 经\u0001单位集体决定\u0002将公款借给其他公司使用，不属个人决定或个人名义，不构成挪用公款罪\nB✗ 经单位集体决定借给个人承包企业（非自然人且为单位决策），不成立挪用公款归个人使用\nC✓ 挪用公款罪：虽借给国有控股公司，但系\u0001以个人名义\u0002借出，符合立法解释第（二）项“以个人名义将公款供其他单位使用”\nD✗ 个人决定以单位名义借给其他单位使用但\u0001未谋取个人利益\u0002，不构成挪用公款罪","k":"","kb":9,"kh":[[192,208]]},{"id":"2021-14","y":2021,"t":"单","s":"甲(市政府工作人员)接受请托人乙的30万元,通过妹夫刘某(市公安局干警)违规撤销了对乙的网上追逃信息。甲的行为应认定为（ ）。","o":["介绍贿赂罪","利用影响力受贿罪","滥用职权罪","受贿罪"],"a":"B","e":"\u0001国家工作人员通过其近亲属/关系密切的另一国家工作人员职务行为为他人谋取不正当利益并受财，成立利用影响力受贿罪。\u0002\nA✗ 介绍贿赂罪仅撮合行贿与受贿双方意思表示并从中牵线，不直接收受巨额请托财物由自己占有\nB✓ 利用影响力受贿罪：甲虽为市政府工作人员，但就妹夫刘某（市公安局干警）的\u0001撤销网逃职权\u0002而言，甲并非直接主管官员，系利用关系密切者的职务行为收财谋取不正当利益\nC✗ 甲未利用自己作为市政府工作人员的职权，而是通过妹夫的公安职权\nD✗ 甲未直接利用自己本人职务上的便利（且未言明通过本人职权形成便利条件为正当或一般斡旋受贿），依法定利用影响力受贿罪\n注意：即使是国家工作人员，只要其没有利用自身职权或地位形成的便利条件（或单纯以近亲属/密切关系请托其他国家工作人员），也可成为利用影响力受贿罪的主体。","k":"","kb":10,"kh":[[129,159],[202,224]]},{"id":"2022-13","y":2022,"t":"单","s":"对于行贿罪的司法认定,下列选项中正确的是","o":["行贿的方式包括通过赌博向国家工作人员提供巨额现金","行贿的对象包括国家工作人员以及国家机关、国有企事业单位","行贿的内容包括为国家工作人员提供子女就读重点中学的机会","行贿的主体包括被勒索给予国家工作人员以财物但未获得不正当利益的人"],"a":"A","e":"\u0001行贿财物包括通过赌博等变相方式提供巨额现金，但不包括非财产性利益。\u0002\nA✓ 行贿罪的“财物”包括货币、物品以及可用金钱衡量的财产性利益，\u0001通过赌博故意输钱提供巨额现金\u0002属于典型变相行贿\nB✗ 行贿罪的对象只能是\u0001国家工作人员（自然人）\u0002；向国有企事业单位送钱构成\u0001对单位行贿罪\u0002（第391条）\nC✗ 提供子女就读重点中学机会属于无法直接折算市场价格的非财产性利益，刑法中行贿罪对象仅限\u0001财物及财产性利益\u0002\nD✗ 因\u0001被勒索\u0002给予财物且\u0001没有获得不正当利益\u0002的，刑法第389条第3款明确规定“不是行贿”","k":"","kb":11,"kh":[[15,36],[111,142]]},{"id":"2023-15","y":2023,"t":"单","s":"某村民委员会主任甲,未经集体讨论和表决同意,擅自将协助政府管理的社会捐助公益资金100万元借贷给他人用于经营活动。甲的行为应认定为","o":["职务侵占罪","挪用公款罪","挪用资金罪","挪用特定款物罪"],"a":"B","e":"\u0001村委会主任挪用协助政府管理的社会捐助公益资金借给他人营利/经营，构成挪用公款罪。\u0002\nA✗ 甲系临时擅自将资金借出营利，主观上无永久非法占为己有的意图，不成立职务侵占罪或贪污罪\nB✓ 挪用公款罪：村委会主任协助人民政府管理救灾、抢险、社会捐助公益款物时\u0001以国家工作人员论\u0002，未经同意擅自出借给他人经营属于“归个人使用”，构成本罪\nC✗ 挪用资金罪规制挪用本单位非国有/非协助政府管理资金；协助政府管理的社会捐助公益资金属\u0001公款\u0002\nD✗ 挪用特定款物罪仅指挪作其他\u0001公用\u0002；借给他人用于个人经营活动属于“归个人使用”，定挪用公款罪\n村委会等基层组织人员在协助政府从事七项行政管理工作（救灾款物管理等）时，以国家工作人员论，适用贪污罪、挪用公款罪、受贿罪。","k":"","kb":9,"kh":[[96,133]]},{"id":"2023-17","y":2023,"t":"单","s":"下列关于行贿罪的表述,正确的是","o":["在经济往来中,给予国家工作人员以回扣的,不以行贿论处","为谋取正当利益,给予国家工作人员以财物的,成立行贿罪","行贿人在被追诉前主动交待行贿行为的,应当从轻或者减轻处罚","因被勒索给予国家工作人员以财物,没有获得不正当利益的,不是行贿"],"a":"D","e":"\u0001因被勒索给予国家工作人员以财物且没有获得不正当利益的，不构成行贿罪。\u0002\nA✗ 经济往来中违反国家规定给予国家工作人员各种名义的回扣、手续费，数额较大的，\u0001以行贿论处\u0002\nB✗ 行贿罪主观上必须以\u0001“谋取不正当利益”\u0002为目的，为谋取正当利益给财物不构成行贿罪\nC✗ 《刑法》第390条第2款规定的是“\u0001可以\u0002从轻或者减轻处罚”，而非“应当”\nD✓ 《刑法》第389条第3款明文规定：因被勒索给予国家工作人员以财物，\u0001没有获得不正当利益的，不是行贿\u0002","k":"","kb":11,"kh":[[42,67],[111,142]]},{"id":"2024-16","y":2024,"t":"单","s":"某县财政局科长甲被辞退后,通过该局局长乙职务行为,为丙谋取不正当利益,丙因此免除了甲欠自己的五万元债务,甲的行为如何认定（ ）。","o":["不构成犯罪","受贿罪","利用影响力受贿罪","非国家工作人员受贿罪"],"a":"C","e":"\u0001被辞退（离职）的财政局科长通过原单位局长职务行为为请托人谋取不正当利益并免除债务，构成利用影响力受贿罪。\u0002\nA✗ 免除5万元债务属于获得财产性利益，行为已严重侵害公职廉洁性，构成犯罪\nB✗ 甲已经被辞退，丧失国家工作人员身份，不再直接利用本人现职职务便利，不构成受贿罪\nC✓ 利用影响力受贿罪：《刑法》第388条之一第2款明确规制\u0001离职的国家工作人员\u0002通过其他国家工作人员职务行为为请托人谋取不正当利益并收受财物（含免除债务）\nD✗ 本罪侵害的是国家机关公职人员的廉洁性及职务行为不可收买性，不属于非国家工作人员受贿罪\n\u0001免除债务\u0002属于实质受贿（财产性利益）；“被辞退的科长”正属于第388条之一第2款“离职的国家工作人员”。","k":"","kb":10,"kh":[[242,287]]},{"id":"2025-17","y":2025,"t":"单","s":"国有公司负责人甲利用职务之便,与某律师事务所合谋虚增公司的律师服务费,收受该律师事务所给予的服务费差价100 万元。甲的行为应认定为（ ）。","o":["诈骗罪","贪污罪","受贿罪","职务侵占罪"],"a":"B","e":"\u0001国有公司负责人与外部律所合谋虚增服务费套取公司资金分赃，成立贪污罪。\u0002\nA✗ 国企负责人利用职务便利伙同外部人员虚报骗取本单位公款，应适用特别法条\u0001贪污罪\u0002（与普通诈骗罪系特殊与一般关系）\nB✓ 贪污罪：国有公司负责人甲利用职务之便，采取\u0001虚增律师服务费的欺骗手段\u0002非法占有国有公司财物，成立贪污罪\nC✗ 本案不是为律所谋取正当或不正当业务利益后收取感谢费，而是共同\u0001虚构支出套取本单位资金\u0002，核心侵害公款所有权\nD✗ 职务侵占罪主体为非国家工作人员；国有公司中从事公务的负责人属国家工作人员","k":"","kb":8,"kh":[[21,59],[137,156]]}]},{"sub":"刑法","name":"正当行为","w":1.0,"L":18,"qs":[{"id":"2005-24","y":2005,"t":"多","s":"甲误认为遭到乙的紧急的不法侵害,而对乙实行防卫行为,致乙死亡。事后证实乙的行为不具有不法侵害的性质。甲的行为（ ）。","o":["可能构成故意杀人罪","可能构成过失致人死亡罪","可能属于意外事件","可能属于防卫过当"],"a":"BC","e":"\u0001假想防卫因欠缺现实不法侵害不成立故意犯罪与防卫过当，有过失定过失犯罪，无过失属意外事件。\u0002\nA✗ 假想防卫主观上旨在防卫而非故意加害，欠缺杀人故意，不成立故意杀人罪\nB✓ 假想防卫中行为人对不存在不法侵害应当预见而疏忽未能预见，致人死亡的，成立\u0001过失致人死亡罪\u0002\nC✓ 假想防卫中行为人对不存在不法侵害在当时客观条件下不可能预见的，属于\u0001意外事件\u0002\nD✗ 防卫过当的前提是存在真实且正在进行的不法侵害；假想防卫欠缺起因条件，绝不成立防卫过当","k":"","kb":20,"kh":[[61,116]]},{"id":"2006-21","y":2006,"t":"多","s":"关于正当防卫,下列表述中,正确的是（ ）。","o":["正当防卫的起因条件是有不法侵害行为发生","正当防卫的时间条件是不法侵害行为即将发生或者正在进行。特殊情况下,对已经结束的侵害也可以正当防卫","防卫的目的是为了保护合法权利免受不法侵害","正当防卫与防卫过当区别的关键在于是否明显超过必要限度造成重大损害"],"a":"ACD","e":"\u0001正当防卫须有不法侵害正在发生，防卫目的是保护合法权益，防卫过当的关键在于明显超过必要限度造成重大损害。\u0002\nA✓ 起因条件：正当防卫要求必须有真实存在的\u0001不法侵害行为发生\u0002\nB✗ 对已经结束的侵害反击属于\u0001事后防卫\u0002，不能成立正当防卫（特殊情况下可酌情量刑从宽，但不成立正当防卫）\nC✓ 主观条件：防卫意图是为了使国家、公共利益或个人合法权利免受不法侵害\nD✓ 限度条件：区分正当防卫与防卫过当的关键在于是否\u0001明显超过必要限度造成重大损害\u0002","k":"","kb":19,"kh":[[43,54],[99,114]]},{"id":"2007-10","y":2007,"t":"单","s":"甲与乙因生活琐事互相斗殴,乙感到不是甲的对手而逃跑。甲紧追不舍,乙逃出 500 米后被甲追上。甲用木棒朝乙劈头盖脸打来。情急之下,乙抽出随身携带的水果刀朝甲刺去,致甲重伤。乙的行为 （ ）。","o":["构成故意杀人罪 ( 未遂 )","构成故意伤害罪","构成寻衅滋事罪","不构成犯罪"],"a":"D","e":"\u0001斗殴已结束乙主动逃跑，甲紧追500米追上持木棒猛击，乙为防卫用水果刀刺成重伤，不法侵害已由甲重新单方挑起且危及人身安全，成立正当防卫不构罪。\u0002\nA✗ 乙事先明确退出斗殴并逃跑500米，是甲不依不饶追杀；乙并非无端实施犯罪，不构成故意杀人罪未遂\nB✗ 在双方原本斗殴中一方明确放弃斗殴撤离、另一方仍紧追袭击时，追击者的攻击重新构成正在进行的\u0001不法侵害\u0002，反击致重伤不成立故意伤害罪\nC✗ 乙系被动自保反击而非无故寻衅滋事\nD✓ 不构成犯罪（正当防卫）：乙退出互殴逃跑500米后，斗殴状态已终止；甲追上用木棒劈头盖脸猛击属于单方正在进行的暴力不法侵害，乙持水果刀反刺致其重伤属于\u0001正当防卫\u0002","k":"","kb":19,"kh":[[15,54],[69,94]]},{"id":"2008-5","y":2008,"t":"单","s":"消防队员甲在执行灭火任务中,担心被大火毁容,逃离火灾现场。甲的行为（ ）。","o":["属于紧急避险","属于紧急避险过当","不成立紧急避险","属于假想避险"],"a":"C","e":"\u0001消防队员在执行灭火任务时负有法定特定职责，不适用关于避免本人危险的紧急避险规定。\u0002\nA✗ 依《刑法》第21条第3款，消防队员对火灾危险负有特定职务责任，不得为避免自身受伤而临阵逃避\nB✗ 根本不具备适用紧急避险的主体前提，不成立紧急避险过当\nC✓ 不成立紧急避险：消防队员属于\u0001职务上、业务上负有特定责任的人\u0002，法律禁止其为避免本人危险而舍弃抢险职责\nD✗ 火灾危险客观真实存在，并非主观误认的假想避险","k":"","kb":21,"kh":[[120,155]]},{"id":"2009-9","y":2009,"t":"单","s":"下列关于紧急避险的表述中,正确的是（ ）。","o":["紧急避险的前提条件是出现了不法侵害以外的危险","紧急避险必须在迫不得已的情况下才能实施","紧急避险所造成的损害可以小于或者等于所保护的利益","紧急避险与正当防卫的主体范围一致"],"a":"B","e":"\u0001紧急避险必须在迫不得已没有其他合法方法可以避险时才能实施，且损害须小于所保护利益。\u0002\nA✗ 紧急避险的危险来源不限于“不法侵害以外”，必要时（如被野生动物咬或借用他人车辆躲避歹徒追杀）亦可针对不法侵害引起的危险避险\nB✓ 限制条件：紧急避险以牺牲另一无辜合法权益为代价，必须在\u0001迫不得已\u0002（无其他替代方法）时才能实施\nC✗ 限度条件：紧急避险造成的损害必须\u0001小于\u0002所保护的利益，\u0001不能等于\u0002（更不能大于）\nD✗ 正当防卫主体无特殊限制，而紧急避险排除职务、业务上负有特定责任之人避免本人危险\n重要数字边界：紧急避险造成的损害必须\u0001小于\u0002所保全的利益；防卫过当则要求造成的损害不得明显超过必要限度（故正当防卫的损害可等于甚至适度大于不法侵害人的利益）。","k":"","kb":21,"kh":[[53,65],[136,155]]},{"id":"2011-5","y":2011,"t":"单","s":"甲酒后到一洗浴中心进行足浴,发现为其洗脚的女服务员乙很漂亮,于是提出要与乙发生性行为, 遭乙拒绝。甲便采取暴力欲强奸乙。乙在反抗中用修脚刀刺死了甲。乙的行为属于（ ）。","o":["正当防卫","紧急避险","故意杀人","故意伤害致人死亡"],"a":"A","e":"\u0001对正在进行强奸的严重暴力犯罪实行防卫致侵害人死亡的，属于特别防卫（不成立防卫过当）。\u0002\nA✓ 正当防卫（特别防卫）：面对正在实施的\u0001强奸\u0002暴力犯罪，女服务员持修脚刀反抗刺死侵害人，依第20条第3款不属防卫过当，仍为正当防卫\nB✗ 乙直接针对不法侵害人甲本人实施反击，而非损害第三人合法权益，不是紧急避险\nC✗ 合法行使特别防卫权，依法不负刑事责任，不构成故意杀人罪\nD✗ 防卫行为依法阻却违法性，不成立故意伤害致人死亡\n记法：特别防卫五类重暴力：行凶、杀人、抢劫、强奸、绑架（及其他严重危及人身安全的暴力犯罪）。","k":"","kb":19,"kh":[[136,198]]},{"id":"2016-10","y":2016,"t":"单","s":"张某深夜撬门进入甲家,被甲安装在保险柜上的防盗装置击中头部受轻伤。甲的行为属于（ ）。","o":["事先防卫","正当防卫","假想防卫","防卫过当"],"a":"B","e":"\u0001事先安装的防盗装置在盗窃犯实际撬门入室实施盗窃时发挥作用致其轻伤，满足时间与限度条件，成立正当防卫。\u0002\nA✗ 虽然装置预先安装，但作用发挥于张某\u0001深夜撬门入室正在实施不法侵害之时\u0002，不属事先防卫\nB✓ 正当防卫：防盗装置仅针对入侵贼人触发且仅造成轻伤，具备起因、时间、对象与限度五要件，成立正当防卫\nC✗ 不法侵害实际正在发生，并非误认的假想防卫\nD✗ 仅造成盗窃犯轻伤，未明显超过必要限度造成重大损害","k":"","kb":19,"kh":[[43,54],[81,94]]},{"id":"2017-8","y":2017,"t":"单","s":"甲下夜班回家,目睹一男将一女强行拉进小巷,女子大叫:“放开我!”甲以为该男子欲行不轨,遂冲上去,用砖头将男子打成轻伤。事后查明,该男女系夫妻关系,事发时男子阻止女子回娘家。甲的行为成立（ ）。","o":["事前防卫","假想防卫","正当防卫","防卫过当"],"a":"B","e":"\u0001丈夫阻止妻子回娘家并非严重危及妻子的不法侵害，甲误以为发生暴力犯罪而打伤男子，成立假想防卫。\u0002\nA✗ 事前防卫须后续存在即将到来的真实不法侵害而提前动手；本案根本不存在犯罪性不法侵害\nB✓ 假想防卫：夫妻家庭纠纷中男子阻拦妻子回娘家不属于刑法上的暴力不法侵害，甲基于误认实施反击打成轻伤，成立\u0001假想防卫\u0002\nC✗ 缺乏不法侵害现实存在这一起因条件，不能成立正当防卫\nD✗ 只有先成立正当防卫的前提下超出限度才叫防卫过当，不存在现实不法侵害则不成立防卫过当","k":"","kb":20,"kh":[[61,90]]},{"id":"2018-2","y":2018,"t":"单","s":"犯罪分子为日后向甲勒索财物,用枪威逼甲杀死一名路人并录像。甲的杀人行为属于（ ）。","o":["正当防卫","紧急避险","自救行为","犯罪行为"],"a":"D","e":"\u0001被犯罪分子持枪威逼杀死无辜路人的，因不能以牺牲无辜生命保全自己生命，甲的行为仍属犯罪行为。\u0002\nA✗ 正当防卫只能针对\u0001不法侵害人本人\u0002，路人是无辜第三人\nB✗ 紧急避险所牺牲的利益必须\u0001小于\u0002保全的利益；生命权重等价，原则上不允许用无辜他人生命换取自己生命\nC✗ 自救行为指权利人在事后依法自力恢复受损权利，与被胁迫杀害无辜路人无关\nD✓ 犯罪行为：生命价值同等，法律不承认以他人生命为代价的紧急避险，甲受胁迫杀人原则上构成\u0001故意杀人罪\u0002（可评价为胁从犯，依法减轻或免除处罚）\n法律基本伦理红线：生命法益之间不得相互比较大小，\u0001紧急避险不能以牺牲他人生命来保全自己生命\u0002，被胁迫杀害无辜者时仍成立犯罪（量刑上按胁从犯从宽）。","k":"","kb":21,"kh":[[53,78]]},{"id":"2019-15","y":2019,"t":"单","s":"债权人王某伙同他人将债务人甲关在办公室中长达十几个小时并持续辱骂，甲求救未果后持水果刀将王某刺成重伤。甲的行为应认定为（ ）。","o":["防卫过当","假想防卫","偶然防卫","正当防卫"],"a":"A","e":"\u0001面对仅实施非法拘禁并持续辱骂而未危及生命安全的不法侵害人，持刀将其刺成重伤明显超过必要限度，构成防卫过当。\u0002\nA✓ 防卫过当：王某非法拘禁长达十余小时并持续辱骂确系正在进行的不法侵害，但未伴随足以危及生命或严重人身安全的暴力，\u0001持水果刀刺成重伤\u0002明显超过必要限度，属防卫过当\nB✗ 非法拘禁行为客观正在进行，不属假想防卫\nC✗ 甲为摆脱拘禁而反击，主观上有明确的防卫意图，不是缺乏防卫意图的偶然防卫\nD✗ 普通非法拘禁不适用特别防卫；刺成重伤的后果远超制止拘禁所需限度，不能直接按无罪的正当防卫处理","k":"","kb":19,"kh":[[95,135]]},{"id":"2019-20","y":2019,"t":"单","s":"甲饥饿难耐,夜入位于高层住宅一楼的小超市行窃,尚未得手便惊醒了一直住在超市里的店主夫妇。甲用超市内销售的菜刀砍死前来查看的店主,砍伤店主妻子并点燃现场易燃物后逃离。火势在蔓延之前被邻居扑灭,但浓烟导致店主妻子窒息死亡。下列对于甲行为性质的认定,正确的是（ ）。","o":["甲进入超市实施盗窃,应属于紧急避险","甲进入超市实施盗窃,不属于入户盗窃","甲用刀砍死店主,应认定为故意杀人罪","甲放火致人死亡,应认定为放火罪一罪"],"a":"D","e":"\u0001放火烧毁一楼超市并致浓烟窒息死一人，一行为同时危害公共安全并致人死亡，认定放火罪一罪（结果加重）。\u0002\nA✗ 紧急避险要求“迫不得已”，甲虽饥饿但有其他合法求助方式，绝不允许用盗窃行窃侵害他人财产权\nB✗ 店主夫妇\u0001一直居住在超市内\u0002，该小超市具备家庭日常起居生活功能，符合“户”的特征，夜间入室行窃构成入户盗窃\nC✗ 盗窃被发现后为抗拒抓捕当场使用暴力砍死店主，依照《刑法》第269条转化成\u0001抢劫罪\u0002（抢劫致人死亡），不单独定故意杀人罪\nD✓ 放火罪一罪：放火行为造成浓烟致店主妻子窒息死亡，属于《刑法》第115条第1款规定的\u0001放火致人死亡\u0002结果加重情形，定放火罪一罪即可评价全部后果\n一鱼多吃真题点：\n1. 店主常住的小超市 = \u0001“户”\u0002（商业与生活兼营且与外界相对隔离的场所，在非营业时间即属于户）；\n2. 盗窃中当场杀人 = \u0001转化型抢劫罪\u0002；\n3. 放火烧毁现场致人死亡 = \u0001放火罪结果加重犯\u0002（不数罪并罚）。","k":"","kb":21,"kh":[[15,65]]},{"id":"2020-2","y":2020,"t":"单","s":"假想防卫不属于正当防卫,主要是因为欠缺正当防卫成立的（ ）。","o":["主观条件","起因条件","限度条件","时间条件"],"a":"B","e":"\u0001假想防卫是不存在现实不法侵害却误以为存在，欠缺正当防卫成立的起因条件。\u0002\nA✗ 假想防卫中行为人主观上确有保护合法权益的防卫认识与意图，不欠缺主观条件\nB✓ 起因条件：正当防卫的前提是\u0001客观上真实存在不法侵害\u0002，假想防卫正是因为实际根本不存在不法侵害，欠缺起因条件\nC✗ 假想防卫在根本不满足防卫成立基础时即已排除，不进入限度条件判断\nD✗ 时间条件探讨侵害是否正在进行；根本不存在侵害时首先欠缺的是起因条件","k":"","kb":20,"kh":[[61,82]]},{"id":"2022-20","y":2022,"t":"单","s":"【案情】甲（15周岁）深夜闯入临街店铺意图行窃，被留下理货的店主（系聋哑人）发现。\n假设三∶甲为防止罪行败露,用双手紧扼店主颈部,店主随手抓起身旁健身用的哑铃,将甲砸死。对此,下列选项中正确的是","o":["店主需要承担刑事责任及民事赔偿责任","店主不需要承担刑事责任及民事赔偿责任","店主需要承担刑事责任但不需要承担民事赔偿责任","店主不需要承担刑事责任但需要承担民事赔偿责任"],"a":"B","e":"\u0001面对盗窃转化暴力杀人紧扼颈部的严重危及人身安全暴力犯罪，店主用哑铃砸死侵害人属特别防卫，不负刑责亦不赔民事。\u0002\nA✗ 特别防卫阻却刑事犯罪成立，依《民法典》第181条正当防卫亦不承担民事责任\nB✓ 店主不负刑责且不承担民事责任：甲用双手紧扼店主颈部属于\u0001正在进行的行凶/故意杀人暴力犯罪\u0002，店主反击砸死甲属于特别防卫，刑民均免责\nC✗ 防卫行为依法成立特别防卫，既不需要承担刑事责任也不需要承担民事赔偿责任\nD✗ 特别防卫不存在防卫过当，因此也不存在《民法典》第181条第2款“正当防卫超过必要限度承担适当民事责任”的适用余地","k":"","kb":19,"kh":[[136,205]]},{"id":"2023-3","y":2023,"t":"单","s":"下列致人死亡的情形中,甲构成正当防卫的是","o":["张某入户盗窃甲的财物,被甲发现,甲将其打死","王某持刀行凶,砍伤路人甲,甲情急之下推倒王某,致其被驶来的汽车轧死","李某到债务人甲家里闹事,并限制甲的自由,甲气愤之下持刀将李某捅死","赵某在深夜的巷子里走在甲的身后,甲以为赵某要对自己实施侵犯而将其打死"],"a":"B","e":"\u0001面对持刀行凶砍伤路人的暴徒，情急之下将其推倒致其被驶来汽车轧死，成立特别防卫（正当防卫）。\u0002\nA✗ 入户盗窃财物不属于严重危及人身安全的暴力犯罪（甲尚未受暴力攻击），将单纯盗窃犯打死属于\u0001防卫过当\u0002\nB✓ 正当防卫：王某\u0001持刀行凶\u0002已砍伤甲，正在严重危及甲的生命健康安全，甲推倒王某致死属特别防卫范围（不属防卫过当），成立正当防卫\nC✗ 因债务纠纷限制自由且未持凶器威胁生命安全，直接持刀捅死讨债人明显超出必要限度，构成\u0001防卫过当\u0002\nD✗ 赵某仅在身后正常行走并未实施不法侵害，甲将其打死属于\u0001假想防卫\u0002（可能成立过失致人死亡或意外事件）","k":"","kb":19,"kh":[[136,198]]},{"id":"2024-15","y":2024,"t":"单","s":"防卫过当与事后防卫的共同之处在于（ ）。","o":["均属于量刑情节","均阻却犯罪成立","均构成故意犯罪","均超过防卫限度"],"a":"A","e":"\u0001防卫过当与事后防卫均不阻却犯罪成立，且均可在量刑阶段作为法定或酌定从宽情节予以考虑。\u0002\nA✓ 均属于量刑情节：防卫过当本身构成犯罪，法定\u0001应当减轻或免除处罚\u0002；事后防卫也构成犯罪，但司法实践中因系受先期不法侵害刺激，可\u0001酌情从轻处罚\u0002，二者均属量刑情节而非出罪事由\nB✗ 只有合法的正当防卫才阻却犯罪成立；防卫过当与事后防卫均构成犯罪\nC✗ 防卫过当的主观罪过多数是\u0001过失\u0002（或间接故意），而非一定构成故意犯罪\nD✗ 事后防卫发生时侵害已结束，根本不存在正当防卫前提与“防卫限度”可言（防卫不适时，而非防卫过当）\n防卫过当（限度不适→法定减轻免除处罚） vs 事后防卫（时间不适→可作为酌定量刑从宽情节）：二者皆构成犯罪，仅在量刑层面发挥调节作用。","k":"","kb":20,"kh":[[117,163]]},{"id":"2025-5","y":2025,"t":"单","s":"甲与霸占自己座位拒不离开的乘客刘某当众发生争吵,刘某挥拳猛击甲,甲用随身携带的背包还击,致刘某轻伤。甲的行为应认定为（ ）。","o":["正当防卫","自救行为","故意伤害罪","寻衅滋事罪"],"a":"A","e":"\u0001面对率先挥拳猛击的侵害人，使用随身携带背包适度还击致其轻伤，成立正当防卫。\u0002\nA✓ 正当防卫：刘某率先挥拳殴打甲（不法侵害正在进行），甲使用随身背包反击仅致轻伤，符合起因、时间、对象、意图与限度全部要件\nB✗ 自救行为是在权利受损后、来不及请求公力救济时事后保全恢复；面对正在进行的人身殴打反击属于正当防卫\nC✗ 虽致刘某轻伤，但正当防卫依法阻却违法性，不负刑事责任\nD✗ 寻衅滋事罪要求无事生非、借故生非随意殴打他人；甲系被动挨打后反击，不构成寻衅滋事罪","k":"","kb":19,"kh":[[15,54],[69,94]]},{"id":"2025-41","y":2025,"t":"多","s":"下列关于紧急避险的理解,正确的有（ ）。","o":["对于儿童实施的侵害行为进行反击,成立紧急避险","紧急避险行为与刑法总则规定的胁从犯存在本质区别","对于动物的侵袭不能实施正当防卫,只能实施紧急避险","业务上负有特定责任的人不能为避免本人的危险进行紧急避险"],"a":"BD","e":"\u0001紧急避险与胁从犯本质不同（合法行为 vs 犯罪）；职务/业务负有特定责任人不能为避免本人危险实施紧急避险。\u0002\nA✗ 正当防卫针对客观上的不法侵害，不要求侵害人具备刑事责任能力，对儿童等无责任能力人的侵害也可实施正当防卫\nB✓ 紧急避险是合法的正当化事由（无罪）；胁从犯是被他人胁迫参加共同犯罪的犯罪人（有罪），二者具有本质区别\nC✗ 对于他人驱使动物进行侵害的，可以实施\u0001正当防卫\u0002；对于野生动物或无主动物袭击，通常认定为紧急避险（反击未必只能紧急避险）\nD✓ 《刑法》第21条第3款明确规定：避免本人危险的紧急避险不适用于职务上、业务上负有特定责任的人","k":"","kb":21,"kh":[[120,155]]},{"id":"2026-8","y":2026,"t":"单","s":"对于下列行为,不可以实行特别防卫的是","o":["以投毒方式杀人的甲","以绑架手段拐卖妇女的乙","以暴力手段抢劫爆炸物的丙","在人流密集的公共区域驾车冲撞的丁"],"a":"A","e":"\u0001特别防卫仅限于“暴力犯罪”；暗中投毒杀人属于非暴力隐蔽手段，不适用特别防卫。\u0002\nA✓ 不可以实行特别防卫：投毒杀人虽侵害生命，但并非公开、剧烈的\u0001暴力犯罪\u0002方式，不能适用第20条第3款特别防卫（若需制止只能按一般正当防卫考察必要限度）\nB✗ 以暴力绑架手段拐卖妇女严重危及人身安全（包含绑架性质暴力），可以适用特别防卫\nC✗ 暴力抢劫爆炸物属于“抢劫”且严重危及人身安全，可以适用特别防卫\nD✗ 在人流密集区驾车冲撞属于正在进行的严重危及人身安全的暴力犯罪（行凶/以危险方法危害公共安全/杀人），可以适用特别防卫\n《刑法》第20条第3款核心限定词是\u0001“暴力犯罪”\u0002：暗中投毒、秘密窃取等非暴力犯罪，不能机械援引特别防卫规则。","k":"","kb":19,"kh":[[136,172]]}]},{"sub":"民法","name":"民法总则与基本原则","w":0.9,"L":18,"qs":[{"id":"2005-31","y":2005,"t":"单","s":"下列有关民事法律关系的说法中错误的是（ ）。","o":["民事法律关系属于思想的社会关系","民事法律关系需具备主体、内容和客体三个要素","民事法律关系只能因合法行为而产生","民事法律关系只能存在于平等民事主体之间"],"a":"C","e":"\u0001民事法律关系既可以由合同等合法行为产生，也可以由侵权行为、违约行为等非法行为（甚至自然出生死亡等事件）产生，因此“只能因合法行为而产生”的说法错误。\u0002\nA✗ 该表述正确：民事法律关系是由民法规范确认调控的社会关系，贯穿国家法律意志，属于思想的社会关系\nB✗ 该表述正确：任何法律关系都包括主体（民事主体）、内容（权利义务）与客体（物、行为、智力成果等）三大基本要素\nC✓ 民事法律关系只能因合法行为而产生（当选错误表述）：民事法律关系同样可以因\u0001侵权行为、违约行为、不当得利\u0002等不合法行为或自然事件而直接发生\nD✗ 该表述正确：只有平等主体间的人身与财产关系方为民事法律关系","k":"","kb":100,"kh":[[226,256]]},{"id":"2006-35","y":2006,"t":"单","s":"下列权利中,属于请求权的是（ ）。","o":["物权","人格权","债权","继承权"],"a":"C","e":"\u0001债权是权利人请求特定义务人为一定给付（交付财物、支付金钱、完成工作等）或不为一定行为的权利，属于最典型的请求权。\u0002\nA✗ 物权是直接支配特定物并排斥他人干涉的\u0001支配权\u0002\nB✗ 人格权是民事主体直接享有并支配自身人格利益的\u0001支配权\u0002\nC✓ 债权：债权人自己无法直接控制债务人财产或人身，必须请求债务人履行给付义务方能实现权利利益，是典型\u0001请求权\u0002\nD✗ （既得）继承权（特指放弃权/选择权等形成权功能或具有取得财产支配之期待/综合财产权）——在法硕2006年传统考纲分类下以债权代表典型请求权（注：现行学理或将纯放弃继承表述为形成权、请求返还遗产属物权/继承回复请求权，就选项对比唯一典型“请求权”唯独债权）","k":"","kb":101,"kh":[[50,70]]},{"id":"2007-31","y":2007,"t":"单","s":"下列民事法律关系中,属于绝对法律关系的是 （ ）。","o":["人身权法律关系","无因管理法律关系","不当得利法律关系","合同法律关系"],"a":"A","e":"\u0001绝对法律关系是指权利人特定，而义务人为“一切不特定第三人”（承担不得侵害的消极不作为义务）的法律关系，人身权、物权、知识产权法律关系均属此类。\u0002\nA✓ 人身权法律关系：任何自然人或法人享有的生命、健康、名誉、隐私等人身权，均面向社会上不特定的每一个人产生“不得侵害”义务，属于\u0001绝对法律关系\u0002\nB✗ 无因管理法律关系仅存在于特定的“管理人与受益人”双方之间，属于\u0001相对法律关系\u0002\nC✗ 不当得利法律关系仅存在于特定的“受损人与得利人”双方之间，属于\u0001相对法律关系\u0002\nD✗ 合同法律关系遵循合同相对性，义务人仅限签约特定相对方，属于\u0001相对法律关系\u0002","k":"","kb":101,"kh":[[204,237],[247,283]]},{"id":"2008-31","y":2008,"t":"单","s":"下列社会关系中,属于民事关系的是（ ）。","o":["用人单位与劳动者之间的关系","税务机关与纳税人之间的关系","发包人与设计单位之间的关系","专利授权机关与专利申请人之间的关系"],"a":"C","e":"\u0001发包人与建筑设计单位是平等市场主体之间围绕建设工程设计服务达成的有偿契约关系，受《民法典》合同编调整，属民事关系。\u0002\nA✗ 用人单位与劳动者之间兼含管理与从属性，由《劳动法》《劳动合同法》专门调整（不直接归为纯粹平等民事关系）\nB✗ 税务机关征收税款与纳税人之间是命令与服从的纵向\u0001行政税收征管关系\u0002\nC✓ 发包人与设计单位之间的关系：双方地位完全平等、意思自治签订工程设计合同，属于典型民事法律关系\nD✗ 国家知识产权局（专利局）依法审查批准专利权与申请人之间属于\u0001行政许可审批关系\u0002","k":"","kb":100,"kh":[[15,75]]},{"id":"2009-31","y":2009,"t":"单","s":"胡某花了 1.5 万元找刘某算命,后觉得刘某算得不准,将刘某告上法院索要算命款。对胡某与刘某之间的关系, 下列表述中正确的是（ ）。","o":["二者之间形成合同关系","二者之间形成不当得利关系","二者之间形成侵权关系","二者之间不能形成民事法律关系"],"a":"D","e":"\u0001找人“算命”属于法律不予承认保护的封建迷信消费闹剧，既不形成有效民事合同也不构成民法上的债权债务或侵权关系（但若构成诈骗则另涉治安或刑事违法），在传统民事法律关系界定中“不能形成民事法律关系”。\u0002\nA✗ 算命占卜违反科学精神与公序良俗且无真实合法交易标的，不为法律保护，不能成立有效民事合同\nB✗ 本题2009真题立足于“民事法律关系是由民事法律规范调整所确认保护的社会关系，算命属法外迷信活动”；若认为单纯不予法律确认保护而不成立合法有效民法债之关系，故2009官方答案为二者不形成民事法律关系（注：在民法典下亦因违背公序良俗无效可依第157条返还，但该题按当年考纲标准测试民法规范调整对象）\nC✗ 不符算命准不准之纯民法侵权要件\nD✓ 二者之间不能形成民事法律关系：民事法律关系必须由民事法律规范确认与保护；算命卜卦属于不受我国民法规范确认调整的封建迷信社会行为（2009年法硕官方标准答案定位“法律关系之调整边界”）","k":"","kb":100,"kh":[[123,140]]},{"id":"2011-22","y":2011,"t":"单","s":"下列权利中,属于相对权的是（ ）。","o":["配偶权","抵押权","邻接权","债权"],"a":"D","e":"\u0001相对权是指权利人只能向“特定”义务人主张权利、请求为或不为一定行为的权利，债权是最典型的相对权；配偶权、抵押权、邻接权均属绝对权/对世权。\u0002\nA✗ 配偶权属于身份权，任何人不得破坏或干涉他人合法婚姻配偶身份，义务人为一切不特定第三人，属\u0001绝对权\u0002\nB✗ 抵押权属于担保物权（物权），具有对抗一切不特定第三人的对世效力，属\u0001绝对权\u0002\nC✗ 邻接权（出版者权、表演者权、录音录像制作者权等）属于知识产权，义务人为不特定全体社会公众，属\u0001绝对权\u0002\nD✓ 债权：基于合同、侵权等产生的债权只能向特定的债务人要求给付，不能向合同或侵权关系外的无关第三人追偿，是典型\u0001相对权\u0002","k":"","kb":101,"kh":[[204,269]]},{"id":"2012-29","y":2012,"t":"单","s":"下列权利中,可以转让的是（ ）。","o":["劳动报酬请求权","人身损害赔偿请求权","支付租金请求权","近亲属间的扶养请求权"],"a":"C","e":"\u0001依据《民法典》第545条，具有高度人身专属性或依性质不得转让的债权（劳动报酬、人身伤害精神抚慰或医疗赔偿、近亲属间扶养费请求权）不得转让；而普通商业房屋/物品租赁产生的“支付租金请求权”纯系一般金钱财产债权，可依法自由转让。\u0002\nA✗ 劳动报酬请求权与劳动者自身生计及劳动法特别保护强绑定，原则上不得转让（否则可能架空最低工资保护）\nB✗ 基于生命健康人格受损产生的人身损害赔偿请求权具强烈人身专属性，一般不得转让\nC✓ 支付租金请求权：房东要求房客交房租属于纯粹的金钱给付债权，完全不附带任何专属人身属性（如银行保理、物业资产证券化常常转让租金收益权），依法\u0001可以转让\u0002\nD✗ 父母子女配偶间的抚养/扶养/赡养请求权立足于特定身份关系生存维系，依法严禁转让","k":"","kb":101,"kh":[[79,132]]},{"id":"2012-46","y":2012,"t":"多","s":"民事权利的私力救济方式包括（ ）。","o":["自卫行为","民间调解","自助行为","民事仲裁"],"a":"AC","e":"\u0001民事权利的保护分为公力救济（诉讼、仲裁等公/社会力介入）与私力救济；私力救济包括自卫行为（正当防卫、紧急避险）和自助行为（《民法典》第1177条）。\u0002\nA✓ 自卫行为包括正当防卫（《民法典》第181条）与紧急避险（第182条），属典型法定私力救济\nB✗ 民间调解虽然非官方法院，但仍依靠居委会、人民调解委员会等第三方社会力量居中斡旋调处，属社会救济而非单方私力救济\nC✓ 自助行为指权利人合法权益受侵害且情况紧迫、来不及请求公力救助时自己采取扣留侵权人财物等必要措施（《民法典》第1177条正式确立），属典型私力救济\nD✗ 民事仲裁由法定第三方仲裁机构居中作出具有强制执行力的裁决，属社会公力/准司法救济","k":"","kb":101,"kh":[[288,348]]},{"id":"2013-21","y":2013,"t":"单","s":"下列选项中,属于民事法律关系的是（ ）。","o":["甲男与乙女之间的恋人关系","甲公司与乙公司之间的技术转让关系","甲公司与其分支机构之间的业务指导关系","甲教育局与乙中学之间的管理关系"],"a":"B","e":"\u0001企业法人之间平等自愿达成的“技术转让合同关系”是典型受民法调整的财产流转民事法律关系；男女恋爱不生法律权利义务、企业与内设分支机构属内部隶属、教育局与中学系行政领导管辖，均非民事法律关系。\u0002\nA✗ 男女恋爱（尚未缔结婚姻也未签订特殊财产协议）纯粹属于情感生活道德领域，不产生民事法律权利义务\nB✓ 甲公司与乙公司之间的技术转让关系：两个独立平等的企业法人围绕技术成果权属移转与价款支付形成民商事合同法律关系\nC✗ 公司内部分支机构（如不具独立法人资格的分公司、业务部）服从总公司内部经营调度管理，二者并非两个平等独立的民事主体\nD✗ 教育局对公办/辖区中学的行政监管指导属于纵向的行政管理关系，地位不平等","k":"","kb":100,"kh":[[76,83],[167,192]]},{"id":"2014-21","y":2014,"t":"单","s":"下列选项中,属于民事法律事实的是（ ）。","o":["王某报考公务员","孙某在宅基地上建造房屋","崔某请李某吃饭","林某代李生妹妹举行结婚仪式"],"a":"B","e":"\u0001民事法律事实是能够引起民事法律关系产生、变更、消灭的客观情况。宅基地上合法建造房屋属于“事实行为”，一经建成即原始取得房屋所有权（产生新的物权法律关系）；报考公务员、请客吃饭、代办婚礼均不产生民事权利义务关系。\u0002\nA✗ 报考国家公务员属于公法领域的招录考试申请行为，不引起平等主体民事关系变动\nB✓ 孙某在宅基地上建造房屋：依据《民法典》第231条，合法建造房屋属于民法中的\u0001事实行为\u0002（法律事实之一），房子盖好立即在孙某名下原始设立产生房屋所有权法律关系\nC✗ 单纯朋友间请客吃饭属于纯生活社交情谊行为，一般不创设民事法律债权义务\nD✗ 受托主持仪式或代新人举行民俗婚礼仪式属于单纯的礼仪社交事务，并非创设婚姻关系的法律登记（民法登记才发生婚姻关系）","k":"","kb":100,"kh":[[257,274]]},{"id":"2015-21","y":2015,"t":"单","s":"下列民事权利中,属于支配权的是（ ）。","o":["甲对无权代理的追认权","乙对自身肖像的使用权","丙因受欺诈享有的撤销合同的权利","丁被他人打伤享有的请求赔偿的权利"],"a":"B","e":"\u0001支配权是权利人直接支配权利客体并享有独占排他利益的权利：对自身肖像的使用权（决定允许或禁止别人用自己照片，第1018条）是人身支配权；无权代理追认权和受欺诈撤销权是形成权，打伤赔偿请求权是请求权。\u0002\nA✗ 被代理人对无权代理是否追认，仅凭单方意思表示即决定合同有效或自始无效，属于\u0001形成权\u0002\nB✓ 乙对自身肖像的使用权：乙对其肖像这一人格利益可以直接依法自主制作、使用、公开或许可他人使用并禁止任何人擅自窃用歪曲，属\u0001支配权\u0002\nC✗ 受欺诈方请求/通知撤销合同是依单方意思令既有法律关系归于无效的\u0001形成权\u0002\nD✗ 被他人打伤后要求侵权人赔偿医药费，必须依赖加害人给付方能实现，属于典型的\u0001请求权\u0002","k":"","kb":101,"kh":[[16,43]]},{"id":"2016-22","y":2016,"t":"单","s":"下列民事法律关系中,需要两个法律事实才能产生的是（ ）。","o":["抵押关系","遗嘱继承关系","侵权赔偿关系","婚姻关系"],"a":"B","e":"\u0001遗嘱继承法律关系的最终生效必须同时满足“立有合法有效遗嘱（法律行为）”＋“被继承人死亡（事件）”多个法律事实结合（法硕考题称为构成事实需两个以上法律事实）；动产抵押自抵押合同生效（一个事实）即设立，侵权与婚姻登记亦各有单核心事实。\u0002\nA✗ 动产抵押关系依照《民法典》第403条（原《物权法》第188条）自抵押合同生效时设立（登记仅产生对抗善意第三人效力，设立本身只需合同生效一个法律事实）\nB✓ 遗嘱继承关系：仅立了有效遗嘱只要立遗嘱人还活着就不会立刻发生遗产继承关系；必须先有\u0001“生前立有效遗嘱”\u0002（行为）＋后有\u0001“立遗嘱人死亡”\u0002（自然事件，且继承人未丧失或放弃），至少需要两个法律事实结合才能引发继承法律关系产生\nC✗ 侵权损害赔偿关系只要发生满足要件的侵权行为（单个加害行为法律事实）即瞬间成立\nD✗ 婚姻法律关系在男女双方亲自到婚姻登记机关完成结婚登记（行政确认下的合意登记这一法律事实）时即刻成立","k":"","kb":100,"kh":[[293,352]]},{"id":"2017-21","y":2017,"t":"单","s":"下列事实中,能引起甲、乙之间民事法律关系发生的是（ ）。","o":["甲向乙问路,乙因疏忽指错方向","甲赌博输给乙2万元并当场给付","甲、乙约定某日商谈“互联网+创意”合作合同","甲开车撞断乙公司的输电线,造成损失 3000元"],"a":"D","e":"\u0001开车撞断他人公司输电线造成3000元财产损失，构成《民法典》侵权行为法律事实，立即在甲与乙公司之间产生侵权损害赔偿之债这一民事法律关系；指错路、非法赌债及空头约谈均不发生民事关系。\u0002\nA✗ 好心指路却因疏忽记错方向（无偿情谊帮忙且无重大恶意故意欺诈害人），一般不产生法律约束力和民事赔偿法律关系\nB✗ 赌博属于国家法律严厉禁止的非法活动，赌债属于不受民法保护的非法债（给付亦不准追索返还）\nC✗ 仅仅口头约定某日见面“商谈合作”（连预约合同都尚不构成），还不产生任何民事权利义务\nD✓ 甲开车撞断乙公司的输电线，造成损失3000元：撞断输电线侵害乙公司财产所有权并造成明确实际损害，引起\u0001侵权损害赔偿民事法律关系\u0002发生","k":"","kb":100,"kh":[[84,125]]},{"id":"2017-23","y":2017,"t":"单","s":"甲、乙未婚同居。乙谎称怀孕,迫使甲承诺: 甲给付乙“结婚保证金”50万元,如半年内不与乙结婚不得要求返还。甲、乙之间的约定（ ）。","o":["因甲受胁迫可撤销","因甲受欺诈可撤销","因违反公序良俗原则而无效","因违反法律的强制性规定而无效"],"a":"C","e":"\u0001婚姻自由与人格尊严受法律高度保护，拿虚假怀孕逼签“半年不结婚即没收50万元‘结婚保证金’”的协议把婚姻自由与巨额经济惩罚强行挂钩，严重违背社会伦理善良风俗，应认定违反公序良俗而无效！\u0002\nA✗ 胁迫是行为人以将要发生的非法暴力或隐私揭露等紧迫危害相恐吓；乙“谎称怀孕”（非真要伤害对方）并逼签卖身式巨额不结婚罚金条款，核心违背结婚自由伦理底线\nB✗ 虽然有“谎称怀孕”的欺骗因子，但如果定为“可撤销”，则只要1年内不撤销合同就仍有效——法律绝不容忍以50万巨款直接买断挟制公民婚姻自由的约定有效存在，故不适用仅保护私益的欺诈可撤销\nC✓ 因违反公序良俗原则而无效：恋爱婚姻必须完全基于双方真实自愿爱情；约定“不与某人结婚就没收50万元”实质上是通过高额经济惩罚变相剥夺婚姻自由，严重违背\u0001公序良俗\u0002，依《民法典》第153条第2款当然自始绝对\u0001无效\u0002\nD✗ 并没有触犯直接禁止性具体强行法规条文（如买卖毒品枪支），而是违背整体婚姻自由伦理道德秩序即公序良俗","k":"","kb":102,"kh":[[40,92]]},{"id":"2019-21","y":2019,"t":"单","s":"下列行为中,由民法调整的是（ ）。","o":["甲与网友相约一起参加电子竞技","乙大学拒绝授予郑某硕士学位","丙在相亲活动中与王某成功“牵手”","丁公安局发布公告:“提供破案线索者,奖励 3000元”"],"a":"D","e":"\u0001公安局发布“提供破案线索奖励3000元”属于《民法典》第499条规定的\u0001悬赏广告\u0002——尽管发布者是公安局，但该公告面向不特定社会民众创设平等民事给付报酬之单方允诺/民事债之关系，由民法调整！\u0002\nA✗ 网友相约一起打电子游戏属于纯粹娱乐消遣情谊活动，无创设法律约束力意思\nB✗ 大学根据国务院学位条例授予或拒授硕士学位属于行使国家授权的\u0001行政管理职权\u0002，双方不是平等主体关系（适用行政诉讼法）\nC✗ 相亲活动中短暂牵手尚未形成婚约彩礼纠纷或婚姻登记关系，属纯生活情感交际\nD✓ 丁公安局发布公告：“提供破案线索者，奖励3000元”：国家机关发布悬赏公告征集线索并承诺兑现3000元奖金，此时公安局并非凭借强制公权力命令公民必须履行义务，而是以平等民事主体身份发出\u0001悬赏广告\u0002；一旦有人完成指定提供有效线索行为，即有权依《民法典》第499条要求兑付报酬，受民法调整","k":"","kb":100,"kh":[[49,64],[141,149]]},{"id":"2020-39","y":2020,"t":"单","s":"【案情】傍晚，甲驾驶拖拉机在乡村公路上行驶，乙招手搭车，甲让其上车，并告知车上有一口空棺材。不久下起大雨，乙钻进棺材避雨，过了一会儿睡着了。后又有丙请求搭车，甲也让她上了车。乙醒后手托棺材盖露出头来透气，丙吓得大喊“有鬼”，跳下车，致左腿骨折。\n甲让乙搭车的行为属于（ ）。","o":["事实行为","无因管理","情谊行为","合同行为"],"a":"C","e":"\u0001好心顺路让老乡免费搭乘自己的拖拉机回家，完全没有收取车费或订立受法律强制拘束的客运合同意思，纯粹为了互助便利维系乡邻情谊，属于典型的“情谊行为”（好意施惠）。\u0002\nA✗ 事实行为（如建造房屋、创作作品、拾得遗失物）虽不以意思表示为要素但依法当然直接发生确定法律效果；而好意搭车本身并不当然创设运输合同权利义务\nB✗ 无因管理旨在避免他人既有利益受损失而管理他人事务；乙是自己拦车主动请求搭便车并非陷入危难无人救治\nC✓ 情谊行为：甲免费顺道载乙回家，既无偿且双方没有成立受法律约束运输契约的法律意愿，纯粹基于人际情谊助人，属于\u0001情谊行为（好意施惠）\u0002（注：若行车中因驾驶过错发生车祸致好意搭乘者伤亡，则另依《民法典》第1217条侵权编减轻责任规则承担侵权损害赔偿，不影响上车邀请本身属情谊行为）\nD✗ 双方没有达成受法律强制力约束的正式客运合同合意，若甲突然临时改道有急事不去目的地，乙无权告甲违约","k":"","kb":100,"kh":[[353,374]]},{"id":"2023-21","y":2023,"t":"单","s":"下列选项中,不属于自然事实的是","o":["战争爆发","侵权行为","时间的经过","人的出生"],"a":"B","e":"\u0001民事法律事实分为“自然事实（事件与状态）”与“人的行为（表意行为与事实行为）”。战争爆发（社会事件）、时间的经过（自然状态）、人的出生（自然事件）均不以当事人主观意志为转移，属自然事实；而“侵权行为”是受人意志支配的“行为”！\u0002\nA✗ 战争爆发相对于普通民事合同当事人来说属于不能预见控制的客观社会\u0001事件\u0002，属自然事实\nB✓ 侵权行为（正选不属于自然事实项）：侵权行为通常是侵权人有意识实施的侵害他人合法权益的\u0001事实行为\u0002（人的行为），并非不以人的意志为转移的自然事实\nC✗ 时间的经过（如诉讼时效届满、出生满18岁成年）不以任何人为转移，是典型的自然事实（法律状态）\nD✗ 人的出生（包括死亡）属于典型不以本人意志为转移的自然\u0001事件\u0002（自然事实）","k":"","kb":100,"kh":[[275,292]]},{"id":"2025-48","y":2025,"t":"多","s":"关于民法典施行前的法律事实引起的民事纠纷案件的法律适用,下列说法正确的有 （ ）。","o":["法律事实持续至民法典施行后,适用民法典的规定,但是法律、司法解释另有规定的除外","当时的法律、司法解释有规定的,一律适用当时的法律、司法解释的规定","当时的法律、司法解释没有规定而民法典有规定的,一律适用民法典的规定","当时的法律、司法解释仅有原则性规定而民法典有具体规定的,适用当时的法律、司法解释的规定,但是可以依据民法典具体规定进行裁判说理"],"a":"AD","e":"\u0001根据最高法《民法典时间效力规定》：民法典施行前的法律事实持续至民法典施行后的，除另有规定外适用民法典（A）；当时仅有原则性规定而民法典有具体规定的，适用当时规定但可以依据民法典具体规定进行裁判说理（D）！\u0002\nA✓ 严格对应《时间效力规定》第1条第3款：民法典施行前的法律事实持续至民法典施行后的，该法律事实引起的民事纠纷案件，适用民法典的规定，但是法律、司法解释另有规定的除外\nB✗ 并非铁板一块“一律”适用旧法——如旧法当年认定无效但民法典认定有效的（第8条空白溯及），或者法律事实持续跨越至民法典施行后的，以及符合更利于保护民事主体合法权益、维护社会和经济秩序、弘扬社会主义核心价值观等“有利溯及”例外情形时，依法均可适用民法典\nC✗ 当时法律、司法解释没有规定而民法典有规定的，只是“\u0001可以\u0002适用民法典的规定”（《时间效力规定》第2条还限定了“但是明显减损当事人合法权益、增加当事人法定义务或者背离当事人合理预期的除外”），绝非无条件“一律适用”\nD✓ 严格对应《时间效力规定》第3条：民法典施行前的法律事实引起的民事纠纷案件，当时的法律、司法解释仅有原则性规定而民法典有具体规定的，适用当时的法律、司法解释的规定，但是\u0001可以依据民法典具体规定进行裁判说理\u0002","k":"","kb":100,"kh":[[408,484]]}]},{"sub":"民法","name":"无因管理与不当得利","w":0.9,"L":17,"qs":[{"id":"2005-36","y":2005,"t":"单","s":"甲、乙二人同在山坡上放羊,乙的羊混入甲的羊群,甲不知,赶羊回家入圈。甲的行为属于（ ）。","o":["拾得遗失物","获取不当得利","无因管理","侵权行为"],"a":"B","e":"\u0001乙的羊不知不觉混入甲的羊群，甲无法律依据获有羊群增值之利而乙受损，构成不当得利。\u0002\nA✗ 甲并无拾得他人遗失物之主观认知与捡拾行为，乙的羊亦系在放牧中混入羊群。\nB✓ 甲取得乙的羊没有法律根据，导致乙受有财产损失，完全符合不当得利的构成要件（不以得利人主观恶意或故意为要件）。\nC✗ 无因管理要求管理人主观上须有“为避免他人利益受损失”的认识与管理意思；甲根本不知羊群混入。\nD✗ 甲不知情且无过错，未实施主动侵害行为，不成立侵权行为。","k":"","kb":107,"kh":[[344,371]]},{"id":"2005-51","y":2005,"t":"多","s":"下列事实不能引起不当得利之债的有（ ）。","o":["养子女给付生父母赡养费用","明知不欠他人钱款而为给付","提前偿还所欠他人债务","为履行合同而支付对方金钱,后该合同被确认无效"],"a":"ABC","e":"\u0001依《民法典》第985条（及传统不当得利构成规则）：履行道德义务（养子女给生父母赡养费）、明知无给付义务清偿（明知不欠款而给付）、提前偿还本来就欠的未到期合法债务，三者均“不能”引起不当得利；唯独履行无效合同而给付的金钱因合同自始无效丧失合法根据，可成立不当得利返还（或第157条返还）。\u0002\nA✓ 被依法收养后法律上的扶养赡养关系转移到养父母，但出于孝道与人伦情感给付亲生父母生活费属于\u0001为履行道德义务进行的给付\u0002，不成立不当得利（不能反悔要回）\nB✓ “明知没有给付义务”而偏偏自愿掏钱给他人，属于自愿赠与或法定非债清偿排除（第985条第3项），不能回过头主张不当得利\nC✓ 本来确实欠别人钱，只是主动提前履行未到期债务，既有真实合法债权债务基础又属债务人放弃期限利益自愿提前清偿（第985条第2项），绝非不当得利\nD✗ 因履行合同而交付对方价款，随后该合同被依法确认自始无效，对方持有该笔金钱便彻底丧失了合法依据，可以产生不当得利返还请求权（及第157条无效返还）——本题选“不能引起”的三项","k":"","kb":107,"kh":[[372,436]]},{"id":"2007-42","y":2007,"t":"单","s":"甲5岁之子与乙6岁之子同在丙家中玩耍，乙之子不慎毁坏丙价值1万元的电脑。甲误认为是其子所为，遂赔偿丙一部同等价值的电脑。丙不知事实真相而受领，后将该电脑以1.1万元出售给丁。现甲得知事实真相，欲主张权利，则其（ ）。","o":["只能要求丙返还1万元","有权要求丙返还 1.1 万元","有权要求丙返还电脑","有权要求丁返还电脑"],"a":"A","e":"\u0001善意受领人返还不当得利的范围以“受损人所受损失”和“自己现存利益”中较低者为准。丙不知真相善意受领1万元电脑并1.1万元高价转售丁，丁合法有偿善意取得电脑所有权不可追夺；而丙返还范围以甲实际遭受的1万元损失为上限（多赚的1000元商业转售差价利益无需上交，甲只能向丙索赔返还1万元）！\u0002\nA✓ 只能要求丙返还1万元：丙对电脑损坏责任误认毫不知情，属于\u0001善意得利人\u0002；善意得利人取得的利益大于对方损失时，返还义务严格以受损失方实际受损价值为准（甲自己只白赔出一部值1万元的电脑，因此只能请求善意人丙返还1万元），不得剥夺善意人转卖增值赚的1000元\nB✗ 只有在得利人属于“恶意得利人”或特殊利润归属下才可追及全部1.1万元得利加赔偿；对善意得利人以受损人实际损失（1万元）为返还限额\nC✗ 原物电脑已经被丙出售并交付给了善意第三人丁，丁已取得该动产电脑所有权，丙客观上已返还不能\nD✗ 丙是从误赔受领交付取得该电脑处分资格后有偿市场价1.1万卖给丁，丁属于善意有偿受让取得动产所有权，甲无权要求第三人丁吐出原物电脑","k":"","kb":107,"kh":[[437,457]]},{"id":"2007-43","y":2007,"t":"单","s":"下列行为中,构成无因管理的是 （ ）。","o":["将他人耕牛误认为是自家所有而喂养","主动修缮两家共用的围墙","未受委托而招待朋友的客人","商店保安抓住小偷使某顾客免遭损害"],"a":"B","e":"\u0001修缮“两家共同使用的共有围墙”在各自应承担份额之外兼顾替邻居修补管理了属于邻居的那一半围墙事务（既有为他人避免塌陷受损之意又无法定约定义务），成立无因管理！把别人牛误当自己牛喂（无为他人管理意思）、请客吃饭（生活情谊事务）、保安捉贼（负有安保合同职务义务）均非无因管理。\u0002\nA✗ 误把别人耕牛当“自己家的牛”喂养，主观上完全是为了照料“自己的财产”，缺乏“为他人利益而管理他人事务”的管理意思（通常仅涉返还原物与饲养必要费用不当得利/添附，不成立无因管理）\nB✓ 主动修缮两家共用的围墙：邻居家共墙倒塌危及两边各自房屋利益，甲主动修缮除了便利保护自己之外，对邻居应负份额而言完全具备“无约定法定义务、为避免邻居财产继续损毁而替邻管理”要件，成立\u0001无因管理\u0002（可要求邻居分担相应修墙必要费用）\nC✗ 未受委托自行在自己家招待朋友的客人属于日常生活社交好意情谊行为，不会因此找朋友报销菜钱，不成立无因管理\nD✗ 商店保安抓小偷保护顾客财物安全，正处于保安人员履行本职雇佣\u0001劳动职务义务\u0002范围之内（不满足“没有法定或者约定的义务”要件），不成立无因管理","k":"","kb":107,"kh":[[62,73]]},{"id":"2007-49","y":2007,"t":"单","s":"甲见乙挥拳打丙,遂上前制止,结果被乙误伤。对甲因此所受的损害 （ ）。","o":["由乙、丙承担按份赔偿责任","由乙、丙承担连带赔偿责任","由丙承担全部赔偿责任","由乙承担赔偿责任。如果乙无力承担,可责令丙给予适当补偿"],"a":"D","e":"\u0001因阻止乙殴打丙而受乙误伤（见义勇为），第一顺位赔偿责任人永远是直接侵权加害人“乙”；只有当侵权人乙逃逸或者无力赔偿时，受益人丙才应当给予适当补偿（在旧法《民法通则》第109条表述为“由侵害人承担赔偿责任，受益人也可以/无力承担时可责令给予适当补偿”）。\u0002\nA✗ 被救助的受害受益人丙并没有任何过错侵害行为，绝不是与打人的乙共同按份分摊赔偿\nB✗ 理由同上，乙与丙绝不构成共同侵权，丙无需与乙连带赔偿全责\nC✗ 有直接加害侵权人乙存在时，不能让无辜被救的受益人丙去顶缸承担“全部赔偿责任”\nD✓ 由乙承担赔偿责任。如果乙无力承担，可责令丙给予适当补偿：完美符合侵权救济见义勇为法定顺位——由侵害人乙承担全部民事侵权赔偿责任，只有在乙无力承担（或逃逸/无侵权人）时才由受益人丙给予适当补偿（注：在现行《民法典》第183条下，如乙有赔付能力时丙可自愿适当补偿；如乙逃逸或无力赔偿且见义勇为人甲请求补偿的，受益人丙\u0001应当\u0002给予适当补偿）","k":"","kb":107,"kh":[[234,317]]},{"id":"2008-42","y":2008,"t":"单","s":"甲将邻居乙未上锁的自行车推进车棚,并以自己的名义缴纳了保管费。甲的此种行为属于（ ）。","o":["合同行为","无权代理","无因管理","侵权行为"],"a":"C","e":"\u0001邻居自行车没锁停在外面极易丢失，甲既无看车合同义务也无监护职责，纯粹为避免邻居丢车损失主动推进车棚并替其垫付保管费，虽然用“自己名义”签存车单缴费（不成立显名代理），但在甲乙之间精准成立无因管理之债！\u0002\nA✗ 甲推车停放只和车棚管理员成立保管合同，在甲与邻居乙之间从未达成任何委托修管协议\nB✗ 甲是“以自己的名义”缴纳保管费而非“以乙的名义”，不符合代理名义要件，绝非无权代理\nC✓ 无因管理：甲在没有任何法定义务与约定义务前提下，出于保护邻居乙自行车免遭失窃之好意替乙照管车辆并自垫保管费，精准成立\u0001无因管理\u0002，甲可要求乙偿还所垫保管费\nD✗ 把没锁面临被盗风险的邻居单车推入车棚安全保管，符合乙真实意思与利益（并非不法侵害他人财产占用），绝不构成侵权行为","k":"","kb":107,"kh":[[84,96]]},{"id":"2009-39","y":2009,"t":"单","s":"2006 年 9 月,董某到某银行取款时,意外发现自己的银行卡里多了 50 万元存款。经查,是银行误将一个与董某同名同姓人的存款存入董某的卡里。此种情形可构成（ ）。","o":["意外事件","不当得利","赠与行为","侵权行为"],"a":"B","e":"\u0001银行操作失误将同名同姓他人的50万元误转入董某账户，董某获益50万而银行（或真正储户）受损50万，二者之间具有直接因果关系，且董某获得这50万元既无赠与合同也无债务清偿等任何法律根据，构成典型不当得利。\u0002\nA✗ 这是银行工作人失误打错账与资金错位流动，“意外事件”通常用于侵权或刑法无罪过归责判断，不能回答民法债的产生依据\nB✓ 不当得利：董某账户平白无故多出50万元（一方获益）、银行/真实存款人少50万（他方受损）、存在直接因果关系且没有任何合同或法定理由（无合法根据），完全具备\u0001不当得利\u0002全部四项构成要件\nC✗ 银行与原储户绝没有任何免费白送50万元给董某的赠与意思表示\nD✗ 董某坐在家里银行卡莫名其妙被动进账，自己并无实施主动加害行为，不属于董某侵权（若银行索还而董某拒不归还甚至恶意取现挥霍才另涉后续违法犯罪或拒不返还不当得利之责）","k":"","kb":107,"kh":[[344,371]]},{"id":"2010-53","y":2010,"t":"多","s":"甲发现一头牛在自家田里吃麦苗,便将其牵回家喂养,后牛生病,甲请来兽医为其治疗。一个月后乙发现自己的牛在甲家牛棚,便向甲要求返还,甲同意返还, 但是要求乙支付费用。乙应当支付的费用有（ ）。","o":["拾牛报酬","麦田损失费","饲料费","牛的治疗费"],"a":"BCD","e":"\u0001甲将偷吃自家麦苗的失主牛牵回照料喂养并治病（构成对走失牛只的无因管理）：无因管理人甲有权要求受益人乙赔偿因牛吃麦苗导致的“直接财产损失”以及因照料牛支出的必要费用“饲料费”和“牛的治疗费”，但无因管理系无偿互助制度，甲绝对无权索取“拾牛报酬”！\u0002\nA✗ 我国《民法典》第979条无因管理制度仅保障管理人补偿“必要费用”及“所受损失”，明确不允许无因管理人额外主张劳务报酬（本案甲也并未因悬赏广告找回，且乙未公开悬赏“重金酬谢”）\nB✓ 饲养动物损害责任：乙的牛闯入甲家麦田吃毁麦苗，侵害甲财产权，乙应当依法赔偿\u0001麦田损失费\u0002（《民法典》第1245条）\nC✓ 甲饲养照顾期间花费的\u0001饲料费\u0002属于为避免牛饿死维持其健康生存的必要费用，应由乙偿还\nD✓ 牛生病后甲请兽医花费的\u0001治疗费\u0002同样属于避免乙牛病死受损所支出的必要管理费用，应由乙偿还","k":"","kb":107,"kh":[[163,218]]},{"id":"2011-27","y":2011,"t":"单","s":"下列行为中,构成无因管理的是（ ）。","o":["未受委托替朋友招待客人","未成年人抢救落水儿童","主动代同事值夜班","代替配偶放弃继承权"],"a":"B","e":"\u0001未受托抢救落水儿童（保护儿童生命安全，尽管未成年人在保护他人生命健康时法律依然高度肯定其实施的救助构成见义勇为型无因管理）构成无因管理；招待朋友客人（生活情谊）、代同事值夜班（单位劳动排班调休内部事务不生民事无因管理）、放弃继承（须本人亲自决定不得无权代弃）均不成立。\u0002\nA✗ 未受托替朋友招待客人属于一般日常生活社交情谊行为，不产生成立无因管理之债法律效果\nB✓ 未成年人抢救落水儿童：无因管理本质上属于\u0001事实行为\u0002（并非必须具备完全民事行为能力的法律行为），只要未成年人客观上实施了为避免落水儿童溺亡受损之救援管理行为，依然依法成立\u0001无因管理\u0002（受益儿童及监护人应对救人产生的必要医疗或救助损失予以偿还或适当补偿）\nC✗ 替同事上夜班属于用人单位劳动排班与内部工作分工调剂事务（不具有直接管理对方个人独立民事法益之属性，亦不宜产生同事间民事债权强迫追费）\nD✗ 放弃继承权属于具有极强身份专属性的处分意思表示（且不交涉他人财产管理保护，反而直接剥夺配偶财产权），绝对不允许他人擅自代为放弃，违背本人利益及法律规范不构成无因管理","k":"","kb":107,"kh":[[74,83]]},{"id":"2013-49","y":2013,"t":"多","s":"下列选项中,属于不当得利构成要件的有 （ ）。","o":["一方获得利益,他方受有损失","受损方不存在过错","获益与受损之间有因果关系","获益方获得利益没有合法根据"],"a":"ACD","e":"\u0001不当得利成立必须同时具备四个构成要件：①一方获得利益；②他方受有损失；③获益与受损之间有因果关系；④获益没有合法根据。与受损失方自己主观上“是否存在过错”毫无关系（哪怕受损人自己粗心转账汇错款、自己过错赔错钱，只要对方无合法根据得利照样成立不当得利）！\u0002\nA✓ 一方获得财产利益且另一方相应财产受损是当然客观事实基础\nB✗ 不当得利制度旨在矫正客观失衡的财产流动结果，哪怕受损失方自己糊涂粗心犯错把钱转错了账号（存在明显自身过错），依然毫不妨碍向得利方主张返还不当得利\nC✓ 获益和受损之间必须由同一事件或关联流转引起的因果关系相连接\nD✓ 核心要件在于获益既没有法律规定也没有合法有效合同依据","k":"","kb":107,"kh":[[344,371]]},{"id":"2016-38","y":2016,"t":"单","s":"下列行为中,可引起不当得利之债的是（ ）。","o":["甲偿还5万元赌债","乙清偿明知超过诉讼时效期间的债务","丙被他人收养,成年后给付生父母生活费","丁误将邻居的装修材料用于自己房屋的装修"],"a":"D","e":"\u0001误把邻居买来的装修水泥瓷砖拿去装修自家房子——邻居少材料（受损）、丁房子白白添附装修增效（获益）、直接因果关联、毫无合同或法律依据，精准构成不当得利之债！而还赌债、明知过时效还债、养子给生父母生活费均为法定除外情形。\u0002\nA✗ 赌债属于非法原因给付且法律禁止保护，偿还赌债不产生不当得利返还请求权（否则变成鼓励先赌输赖账再由法院帮忙追回赌资）\nB✗ 明知债权已经超过诉讼时效期间却仍然清偿，一来债权本身依然客观存在（非无合法根据），二来亦属《民法典》第985条第3项明文排除的“明知无给付义务”自愿履行，不可反悔按不当得利要回\nC✗ 丙被依法收养后虽对生父母无法律强制赡养义务，但其成年后自愿给付生父母生活费属于\u0001“为履行道德义务进行的给付”\u0002（第985条第1项），明确排除不当得利\nD✓ 丁误将邻居的装修材料用于自己房屋的装修：丁无合法依据使用了邻居材料导致自家房屋增值获益、邻居材料消灭受损，即使因建筑附合材料所有权归丁所有而无法返还原材料物权，但法律在二者间直接成立\u0001不当得利之债\u0002，丁须折价返还不当利益","k":"","kb":107,"kh":[[372,436]]},{"id":"2018-25","y":2018,"t":"单","s":"下列选项中,甲的行为构成无因管理的是 （ ）。","o":["甲主动将摔倒在人行道上的老人扶起","甲儿时被收养,成年后赡养亲生父母","甲为了出行便利,出钱修复邻居家被台风刮倒的院墙","甲的狗将他人咬伤,甲误以为是好友乙的狗咬伤人而赔偿伤者"],"a":"C","e":"\u0001为了自己出入方便同时也帮邻居修好被台风吹倒压断道路（也损害邻居房屋围蔽安全）的邻居院墙，虽兼有为自己通行便利之私利动机，但客观上管理的是“邻居的围墙”且同样避免了邻居受损，仍然成立无因管理！\u0002\nA✗ 在人行道上随手扶起摔倒老人仅仅是举手之劳的日常社会公德互助情谊行为（除非专门护送去医院挂号并垫付医药费），单单扶起本身尚不成立产生管理费用报销的无因管理之债\nB✗ 被收养后成年主动赡养亲生父母属于纯粹履行伦理\u0001道德义务\u0002，非“管理他人事务”\nC✓ 甲为了出行便利，出钱修复邻居家被台风刮倒的院墙：无因管理不要求管理人必须是“100%大公无私、丝毫不能带点私心”；只要客观上确实替他人（邻居）管理了事务避免了邻居院墙进一步倾毁丢失损害，即便甲同时怀有顺便清理自己家门前通行通道的个人动机，依然完全成立\u0001无因管理\u0002\nD✗ “误以为”是好友乙的狗才帮赔钱——实务上却是甲“自己家的狗”咬人，甲本来就依法应当赔偿，这属于履行自己的法定义务而非管理乙的事务（反之若明知或误把别人当自己的则缺为他意）","k":"","kb":107,"kh":[[129,161]]},{"id":"2019-40","y":2019,"t":"单","s":"甲闻到邻居乙的房间有刺鼻煤气味,便破门而人关闭煤气管道阀门,此时煤气爆炸,甲、乙均被炸伤。对此,下列选项正确的是（ ）。","o":["乙应当对甲给予适当补偿","乙应当赔偿甲的全部损失","甲、乙各自承担自己的损失","甲应当赔偿乙的房门损失"],"a":"A","e":"\u0001甲为避免邻居乙家煤气泄漏发生更大事故果断破门关闭阀门（属无因管理/紧急见义勇为），不料意外爆炸均被炸伤。本案“没有侵权人”，故依《民法典》第183条后段规定，受甲保护民事权益的受益人乙应当对甲的损害给予适当补偿（而非全额赔偿）！\u0002\nA✓ 乙应当对甲给予适当补偿：依据《民法典》第183条规定，因保护他人民事权益使自己受到损害的，没有侵权人的（意外煤气泄漏爆炸），受害人请求补偿的，受益人乙\u0001应当给予适当补偿\u0002\nB✗ “全部损失赔偿”适用于过错或无过错侵权加害人；乙本人并非故意恶意加害的侵权人且同样是事故受害者，法律只责令受益人“适当补偿”而非赔光“全部损失”\nC✗ 不能让挺身而出破门救险的见义勇为人甲白流血自己扛全部损失，否则将摧毁社会互助精神\nD✗ 甲破门是紧急危难下实施的正当避险及合法无因管理救险行为（依《民法典》第182条及第979条），对救险中造成的必要门锁损失依法免责不赔","k":"","kb":107,"kh":[[275,317]]},{"id":"2021-22","y":2021,"t":"单","s":"甲借用乙的平房居住。后平房漏雨,甲联系不到乙,遂委托丙维修并依承诺向丙支付维修费。甲请求乙偿还维修费的依据是（ ）。","o":["代理行为","委托合同","无因管理","单方允诺"],"a":"C","e":"\u0001甲只是免费借用乙的平房居住（仅负日常一般保管义务，重大房屋修缮属房主乙的利益事务），在联系不上房主乙的情况下自己找人修漏雨并垫付维修费，没有法定或约定义务而为避免他人房屋利益受损进行管理，构成无因管理！\u0002\nA✗ 甲根本联系不上乙、并未获得乙任何委托授权，也没用乙名义（而是自己委托丙并承诺付款），不成立代理\nB✗ 借用合同本身仅是乙免费把房子给甲住，甲与乙之间并没有签订“甲有义务替乙出钱修房”的委托修缮合同\nC✓ 无因管理：房屋遇雨漏水如不及时修补将损伤房主乙的不动产利益，借用人甲并无大修房屋的法定或约定义务，在无法联系乙时主动委托丙维修并自行先付维修费，完全具备无因管理三大要件，可依据《民法典》第979条\u0001无因管理\u0002请求受益人乙偿还必要维修费\nD✗ 单方允诺指单方悬赏广告等对他人作利益承诺；乙没有任何单方发公告允诺给付","k":"","kb":107,"kh":[[97,111],[163,184]]},{"id":"2021-35","y":2021,"t":"单","s":"甲在某餐厅用餐,根据菜单点了一道标价为 98元的菜。结账时,餐厅要求甲支付298元,甲则坚持以菜单为准付款,这时餐厅才发现菜单被调包。经查,菜单调包系刚刚来此就餐的某顾客所为。甲与餐厅之间债的发生原因是（ ）。","o":["侵权行为","不当得利","合同","缔约过失"],"a":"B","e":"\u0001餐厅菜单被先前顾客调包致使甲吃298元的菜只付98元，餐厅无合同错价合意亦无正当依据受损、甲得利200元，双方之间债的发生原因为不当得利。\u0002\nA✗ 调包菜单系第三方先前顾客所为，就餐人甲本人并未故意调包或有侵权过错，甲不构成侵权行为。\nB✓ 甲实际消费了价值298元菜品而因客观误示仅支付98元，获得200元财产差价利益没有合法合同等根据并致餐厅受损，构成不当得利之债。\nC✗ 甲基于被调包菜单298元菜按98元点的合意存在表意认识不一致或错误基础（未就298元菜达真实合意，或依原真题及当年学理定性，双方对298元差价并无有效赠与/低价合同合意，故发生不当得利）。\nD✗ 餐厅及甲自身在订约中均无欺诈隐瞒或违反先合同义务的过错，不成立缔约过失责任。","k":"","kb":107,"kh":[[344,371]]},{"id":"2022-32","y":2022,"t":"单","s":"早高峰地铁上,乘客甲、乙因琐事发生肢体冲突,乘客丙奋力将二人分开。事后, 丙发现胳膊被抓伤。丙的行为构成","o":["无因管理","情谊行为","紧急避险","正当防卫"],"a":"A","e":"\u0001地铁早高峰乘客甲乙斗殴，旁边乘客丙没有执法职务义务也不是受托人，却为避免甲乙人身安全遭受更大打斗重伤而主动奋力劝阻拉架导致自己胳膊抓伤。丙在客观上保护了他人人身法益且具备防损利他意图，在民法性质上构成无因管理（可就抓伤等必要医疗损害依《民法典》第183/979条向受益人/侵权人求偿补偿）。\u0002\nA✓ 无因管理：乘客丙并无法定或约定的见义勇为强制劝架职务，为避免斗殴双方尤其被殴者身体受重创主动介入劝阻拉开，属于为避免他人利益受损而提供服务管理的\u0001无因管理\u0002\nB✗ 好意请客搭车这类普通日常情谊行为欠缺受法律保护调解债权的意志；而奋力拉架制止斗殴受伤直接旨在防止他人人身遭受侵害，法律赋予其明确民事保护与补偿求偿权利，属无因管理而非单纯无法律后果的情谊行为\nC✗ 紧急避险是指“不得已损害另一较小合法权益以保全较大权益”；拉架并没有故意砸毁或牺牲无辜第三人的什么东西\nD✗ 正当防卫是针对不法侵害人本人反击使其受损害免责，而本题考察的是“丙主动拉架导致自己胳膊受伤”这一救助他人行为本身的债法性质定性——在法硕考纲2022真题中明确按“无因管理”（管理他人利益免受斗殴损伤之事务）定性","k":"","kb":107,"kh":[[112,128]]},{"id":"2023-36","y":2023,"t":"单","s":"关于不当得利之债的效力,下列表述不正确的是","o":["不当得利一经成立,当事人之间形成债的关系","得利人不知道且不应当知道取得的利益没有法律根据,取得的利益已经不存在的,不承担返还该利益的义务","得利人已经将取得的利益无偿转让给第三人的,受损失的人无权请求第三人返还","得利人为恶意时,受损失的人可以请求得利人返还其取得的利益并依法赔偿损失"],"a":"C","e":"\u0001《民法典》第988条明文规定：“得利人已经将取得的利益无偿转让给第三人的，受损失的人可以请求第三人在相应范围内承担返还义务。”因此声称“受损失人无权请求第三人返还”的说法公然违背法律明文！\u0002\nA✗ 该表述正确：不当得利是法定之债的一种，一经成立双方即产生返还不当利益的债之关系\nB✗ 该表述正确：精准复述《民法典》第986条善意得利人免责规则（现存利益已灭失不再返还）\nC✓ 得利人已经将取得的利益无偿转让给第三人的，受损失的人无权请求第三人返还（当选不正确项）：恰恰相反，依据《民法典》第988条，既然第三人是不花一分钱“\u0001无偿\u0002”白拿的，法律认为其没有值得优先保护的交易安全利益，受损人\u0001有权请求第三人在相应范围内承担返还义务\u0002\nD✗ 该表述正确：精准复述《民法典》第987条恶意得利人不仅应全部吐出利益还要赔偿损失之重责","k":"","kb":107,"kh":[[471,521]]}]},{"sub":"民法","name":"诉讼时效与期间","w":0.8,"L":15,"qs":[{"id":"2006-38","y":2006,"t":"单","s":"根据有关法律法规规定,《民法通则》中的“二十年诉讼时效期间”（ ）。","o":["可以中止和中断","可以中断和延长","可以延长","可以中止和延长"],"a":"C","e":"\u0001最长诉讼时效期间（二十年，自权利受到损害之日起算）的三大特点：①绝对性（无论权利人知不知情）；②不适用中止、中断规定；③“有特殊情况的，人民法院可以根据权利人的申请决定延长”（《民法典》第188条第2款沿用）。\u0002\nA✗ 20年最长保护期间不适用诉讼时效的中止，也不适用中断\nB✗ 20年最长期间不适用中断\nC✓ 可以延长：无论是当年《民法通则》第137条还是现行《民法典》第188条第2款均明文规定，“自权利受到损害之日起超过二十年的，人民法院不予保护，有特殊情况的，人民法院可以根据权利人的申请决定\u0001延长\u0002”\nD✗ 20年最长期间不适用中止","k":"","kb":106,"kh":[[125,167]]},{"id":"2008-38","y":2008,"t":"单","s":"下列事由中,能够引起诉讼时效中断的是（ ）。","o":["权利人申请仲裁","权利人丧失民事行为能力","义务人被宣告死亡","当事人所在地发生不可抗力"],"a":"A","e":"\u0001提起诉讼或“申请仲裁”（《民法典》第195条第3项）均属于权利人借助法定公/社会救济程序积极主张权利，依法导致诉讼时效中断（已走时间归零重新起算）。\u0002\nA✓ 权利人申请仲裁：与向法院提起诉讼具有完全同等的时效中断效力，依法引起诉讼时效\u0001中断\u0002\nB✗ 无/限制民事行为能力人没有法定代理人等客观障碍（发生在最后6个月内）引发的是诉讼时效\u0001中止\u0002，绝非中断\nC✗ 义务人被宣告死亡并不属于权利人主动向义务人提出请求或提起诉讼仲裁，不引发中断（若涉及继承人未确定发生在最后6个月可引发中止）\nD✗ 发生不可抗力使权利人无法行使请求权（且须在最后6个月内）引发的是诉讼时效\u0001中止\u0002，而不是中断","k":"","kb":106,"kh":[[441,469]]},{"id":"2010-42","y":2010,"t":"单","s":"2007年12月31日,甲被人打伤,但直至2008 年4月30日,甲才得知凶手是乙。2008年12月5日至2008年12月14日,甲因所在地发生地震,且一直无法与外界联系。甲向人民法院起诉不丧失胜诉权的最后日期是（ ）。","o":["2008年12月31日","2009年4月30日","2009年5月10日","2010年5月10日"],"a":"C","e":"\u0001按2010年当时有效的《民法通则》第136条+第139条：人身伤害诉讼时效为1
