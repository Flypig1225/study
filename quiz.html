年（2008.4.30知道凶手→2009.4.30），最后6个月地震中止10天顺延补计10天→2009年5月10日！【新法提示】现行《民法典》废除了1年短期时效并改为统一3年，且中止改为障碍消除日起“满6个月”届满！\u0002\nA✗ 诉讼时效不是从被打伤之日（尚不知道凶手是谁）起算1年，而是从“知道或者应当知道权利被侵害以及义务人”之日（2008年4月30日）起算\nB✗ 忽略了最后6个月内发生10天地震不可抗力所引发的诉讼时效中止顺延效力\nC✓ 2009年5月10日（保留2010真题旧法官方答案）：依当年《民法通则》，身体受伤害赔损时效为1年，自2008年4月30日得知乙为凶手起算原定至2009年4月30日届满；在最后6个月内的2008年12月5日至14日因地震通信断绝发生中止（共暂停10天），中止消除后顺延补足这10天，最后截止日为\u00012009年5月10日\u0002。【新法提示】现行《民法典》第188、194条①废除了1年短期时效，改为统一3年（即延至2011年4月30日）；②中止改规定为“自中止原因消除之日起满六个月，诉讼时效期间届满”\nD✗ 在2010年当年有效法下人身伤害赔损并不适用2年一般时效\n【新法提示】现行《民法典》全面废除了《民法通则》1年短期诉讼时效，身体受伤害赔偿统一适用3年普通时效；且第194条把中止计算规则由“继续计算（停几天加几天）”大幅改为“自中止时效的原因消除之日起满六个月届满”。","k":"","kb":106,"kh":[[45,99]]},{"id":"2010-52","y":2010,"t":"多","s":"下列请求中，不适用诉讼时效的有（ ）。","o":["离婚请求权","不当得利返还请求权","分割家庭财产请求权","排除妨害请求权"],"a":"ACD","e":"\u0001根据《民法典》第196条及婚姻家庭物权法通则：具有强烈身份伦理基础的“离婚请求权”、“分割家庭共有财产请求权”以及不动产物权防御请求权“排除妨害请求权”均不适用诉讼时效；“不当得利返还请求权”属于普通债权请求权，适用诉讼时效！\u0002\nA✓ 离婚请求权是涉及身份解除的专属人身形成/诉讼权利（哪怕分居多年随时都有权提起离婚诉讼），不适用诉讼时效\nB✗ 不当得利返还请求权属于法定债权请求权（普通财产债权），完全适用三年诉讼时效规定\nC✓ 因共有关系（共同共有/家庭共有状态）存续期间随时可请求分割析产，分割家庭财产请求权不适用诉讼时效\nD✓ 根据《民法典》第196条第1项，请求停止侵害、排除妨碍（排除妨害）、消除危险的物权请求权明文规定不适用诉讼时效","k":"","kb":106,"kh":[[189,298]]},{"id":"2011-33","y":2011,"t":"单","s":"根据法律规定,因技术进出口合同争议提起诉讼的期限为（ ）。","o":["1年","2年","3年","4年"],"a":"D","e":"\u0001《民法典》第594条明文保留了特别时效规定：因国际货物买卖合同和\u0001技术进出口合同\u0002争议提起诉讼或者申请仲裁的时效期间为\u0001四年\u0002。\u0002\nA✗ 1年是原《民法通则》短期时效，现已全面废除且从未适用于技术进出口\nB✗ 2年是旧《民法通则》普通时效\nC✗ 3年是现行《民法典》普通诉讼时效\nD✓ 4年：严格依据《民法典》第594条规定，因国际货物买卖合同和技术进出口合同争议提起诉讼或者申请仲裁的时效期间为\u0001四年\u0002","k":"","kb":106,"kh":[[101,124]]},{"id":"2012-26","y":2012,"t":"单","s":"下列情形中,不能引起诉讼时效中断的是 （ ）。","o":["权利人申请仲裁","权利人主张权利","义务人同意履行义务","权利人因不可抗力不能起诉"],"a":"D","e":"\u0001《民法典》第195条列明引起诉讼时效“中断”的四类事由：权利人向义务人提出履行要求、义务人同意履行义务、权利人提起诉讼或者申请仲裁、其他同等效力事由。不可抗力属于引发“中止”的客观障碍，绝不引起“中断”！\u0002\nA✗ 权利人申请仲裁依法引起诉讼时效中断\nB✗ 权利人主动向义务人提出履行要求（主张权利）依法引起诉讼时效中断\nC✗ 义务人主动向权利人表示同意履行义务（如签还款计划、请求宽限、支付利息）依法引起诉讼时效中断\nD✓ 权利人因不可抗力不能起诉（正选不能中断项）：不可抗力在诉讼时效最后六个月内发生引起的是暂时暂停进行的诉讼时效\u0001中止\u0002，而不是使已走过时效一笔勾销重来的“中断”","k":"","kb":106,"kh":[[365,392],[441,469]]},{"id":"2013-28","y":2013,"t":"单","s":"下列选项中,可引起诉讼时效中止的事由是（ ）。","o":["义务人同意履行义务","当事人提起诉讼","权利人提出请求","发生不可抗力"],"a":"D","e":"\u0001在诉讼时效进行到最后六个月时发生地震、洪水等不可抗力客观障碍致使权利人无法行使请求权的，依法引起诉讼时效中止；义务人同意、提起诉讼、权利人主张请求均属“中断”事由。\u0002\nA✗ 义务人同意履行义务引发诉讼时效\u0001中断\u0002\nB✗ 当事人提起诉讼引发诉讼时效\u0001中断\u0002\nC✗ 权利人向义务人提出履行请求引发诉讼时效\u0001中断\u0002\nD✓ 发生不可抗力：属于客观障碍，发生在诉讼时效期间最后六个月内引发诉讼时效\u0001中止\u0002","k":"","kb":106,"kh":[[365,392]]},{"id":"2014-23","y":2014,"t":"单","s":"根据《民法通则》的规定,诉讼时效中止后,从中止时效的原因消除之日起,诉讼时效期间（ ）。","o":["届满","不再计算","重新计算","继续计算"],"a":"D","e":"\u0001在2014年真题所依《民法通则》第139条旧规下，“从中止时效的原因消除之日起，诉讼时效期间继续计算”；而《民法典》第194条现已修改为“自中止时效的原因消除之日起满六个月，诉讼时效期间届满”！\u0002\nA✗ 中止只是暂时阻断推进而非令时效立刻届满归零\nB✗ 中止事由一旦消除仍需给出法定救济时间给权利人去起诉\nC✗ “重新计算”整段三年期间是诉讼时效\u0001中断\u0002的法律后果，切忌把中止与中断混为一谈\nD✓ 继续计算（保留2014旧法官方答案）：严格依据题干明示前提“根据《民法通则》的规定”（该法第139条原文即“从中止时效的原因消除之日起，诉讼时效期间\u0001继续计算\u0002”）。【新法提示】现行《民法典》第194条已删改该句，改为“自中止时效的原因消除之日起满六个月，诉讼时效期间届满”\n【新法提示】注意题干特意标注了“根据《民法通则》的规定”，故对应当年旧法原文“继续计算”。而在现行《民法典》第194条下，不再“继续计算”，统一改为自中止事由消除之日起“满六个月”诉讼时效届满。","k":"","kb":106,"kh":[[393,439]]},{"id":"2015-26","y":2015,"t":"单","s":"甲将一批货物存放于乙的仓库,提货时发现部分货物丢失。甲要求乙赔偿损失的诉讼时效期间是（ ）。","o":["6个月","1年","2年","4年"],"a":"B","e":"\u0001在2015年有效《民法通则》第136条第3项下，“寄存财物被丢失或者损毁的，诉讼时效期间为一年”；【新法提示】现行《民法典》第188条已彻底废除了一年短期诉讼时效，现在寄存财物丢失索赔一律适用三年普通诉讼时效！\u0002\nA✗ 无论新法还是旧法均无6个月的诉讼时效期间\nB✓ 1年（保留2015真题官方答案）：2015年适用《民法通则》第136条第3项特别短期时效“寄存财物被丢失或者损毁的，诉讼时效期间为\u0001一年\u0002”。【新法提示】现行《民法典》已全部删除一年短期诉讼时效规定，按现行法寄存财物丢失要求赔偿适用\u0001三年\u0002普通诉讼时效\nC✗ 2年为《民法通则》一般时效而非寄存物丢失特别时效\nD✗ 4年仅限国际货物买卖合同与技术进出口合同争议\n【新法提示】现行《民法典》彻底取消了身体受伤害、出售质量不合格商品未声明、延付拒付租金及寄存财物被丢失损毁这4种一年短期时效，现行法下寄存丢失索赔统一适用3年普通诉讼时效！","k":"","kb":106,"kh":[[45,99]]},{"id":"2015-27","y":2015,"t":"单","s":"甲欠乙10万元,时效期间届满未还。乙索要时,甲承诺2个月内偿还,但事后只给付了2万元。乙索要余款时,甲以10万元欠款已超过诉讼时效期间为由拒绝,并要求乙返还之前给付的2万元。下列选项中,正确的是（ ）。","o":["甲应偿还剩余的8万元","甲承诺偿还引起诉讼时效中断","甲给付的2万元属于不当得利,乙应返还","甲无权要求乙返还2万元,但剩余的8万元可以不偿还"],"a":"A","e":"\u0001依据《民法典》第192条第2款（及最高法司法解释）：诉讼时效期间届满后，义务人自愿同意履行的（哪怕事后反悔没全还完，或已经履行了一部分），构成对原自然债务的重新确认并放弃时效利益，“不得以诉讼时效期间届满为由抗辩”——且之前已履行的2万元亦有效清偿，非不当得利！\u0002\nA✓ 甲应偿还剩余的8万元：10万元债务虽已过诉讼时效，但债权本身并未消灭（沦为自然债务）；乙索要时甲主动书面或明确“承诺2个月内偿还”并实际先付2万元，依法视为主动放弃时效抗辩利益、对原10万元债务作出新的有效履行承诺，不得再反悔拒绝归还剩余的8万元\nB✗ 诉讼时效“中断”只能发生在诉讼时效正在进行且尚未届满之前！已经彻底届满的时效不可能发生中断（时效届满后承诺还钱是产生新约束力或放弃抗辩权，而不是让旧时效中断）\nC✗ 第192条第2款明文规定“诉讼时效期间届满后，义务人已经自愿履行的，不得请求返还”，因债权债务本质依然存在，绝非无合法根据的不当得利\nD✗ 甲不仅不能要回已付的2万元，而且因已承诺2个月内全额偿还，对剩下8万元也不得再耍赖援引时效抗辩","k":"","kb":106,"kh":[[559,591]]},{"id":"2016-21","y":2016,"t":"单","s":"2014年3月2日,甲、乙离婚并分割了共同财产。2015年3月8日,甲发现乙在离婚时将属于夫妻共有的40万元存款转移到了乙兄的银行账户中,遂向人民法院起诉,请求分割该40万元存款。本案的诉讼时效期间起算日为（ ）。","o":["2014年3月2日","2014年3月3日","2015年3月8日","2015年3月9日"],"a":"D","e":"\u0001《民法典》第1092条规定离婚后发现一方隐藏转移夫妻共同财产可起诉请求再次分割；依《民法典婚姻家庭编解释（一）》第84条及《民法典》第201条期间计算通则：时效自“发现之次日”（2015年3月9日）开始计算！\u0002\nA✗ 2014年3月2日离婚分割当时甲对隐瞒存款毫不知情，无从知晓权利受侵害，不从离婚当日直接起算\nB✗ 2014年3月3日时甲依然尚未发现隐藏存款事实\nC✗ 依据期间计算通用法律规则（《民法典》第201条第1款），“按照年、月、日计算期间的，开始的当日不计入，自下一日开始计算”，故从发现日2015年3月8日的次日起算\nD✓ 2015年3月9日：甲于2015年3月8日才发现乙在离婚时恶意转移夫妻共同存款40万元，诉讼时效自发现权利受损事实的“下一日”即\u00012015年3月9日\u0002起算（注：当时婚姻法解释规定为两年，现行《民法典》已统一延长至三年，但起算日始终均为发现之次日）","k":"","kb":106,"kh":[[334,364]]},{"id":"2016-24","y":2016,"t":"单","s":"下列情形中,可引起诉讼时效中止的是（ ）。","o":["发生不可抗力","债权人起诉后又撤诉","债权人向公安机关报案","债权人向债务人主张权利"],"a":"A","e":"\u0001导致诉讼时效“中止”（暂时停表）的是在时效最后六个月内发生的客观障碍（如不可抗力）；起诉后又自行撤诉（依司法解释一般原则上引发或看情况——起诉本引中断但撤诉未送达等不中断，若送达后撤诉依新解释甚至仍可中断，总之不叫中止！）、向公安报案和向债务人主张权利均讨论中断而非中止！\u0002\nA✓ 发生不可抗力：《民法典》第194条明确列举，在诉讼时效最后六个月内因不可抗力不能行使请求权的，诉讼时效\u0001中止\u0002\nB✗ 债权人提起诉讼后又主动撤诉考察的是诉讼时效是否仍可\u0001中断\u0002（与中止无关；注：仅起诉状副本送达后才发生中断或视情形不发生中断）\nC✗ 债权人向公安机关等国家公权力机关报案控告考察的是等效于主张权利引起\u0001中断\u0002，不属中止\nD✗ 债权人直接向债务人主张履行权利是典型的\u0001中断\u0002事由","k":"","kb":106,"kh":[[365,392]]},{"id":"2018-38","y":2018,"t":"单","s":"除斥期间的适用对象通常是（ ）。","o":["形成权","请求权","支配权","抗辩权"],"a":"A","e":"\u0001除斥期间（预定存续期间，固定不变，不中止、不中断、不延长，法院可主动依职权审查适用）的适用对象原则上是“形成权”（如合同撤销权、解除权、追认权、债权人撤销权等），期间一到权利本身彻底消灭。\u0002\nA✓ 形成权：如重大误解撤销权、受欺诈胁迫撤销权、法定解除权均适用固定不变的\u0001除斥期间\u0002（自知道或行为发生起算满1年或90日未行使即永久丧失该形成权）\nB✗ 请求权（尤其是债权请求权）适用的是\u0001诉讼时效\u0002（届满后权利实体并不消灭，只是对方取得抗辩权）\nC✗ 支配权（如所有权、人格权）原则上永久存在，既不适用诉讼时效也不适用除斥期间\nD✗ 抗辩权依附于基础法律关系或对方请求权而防御性存在，一般不单独适用除斥期间","k":"","kb":106,"kh":[[306,320]]},{"id":"2021-49","y":2021,"t":"多","s":"下列关于诉讼时效的约定,无效的有（ ）。","o":["关于诉讼时效中止事由的约定","关于诉讼时效中断事由的约定","关于诉讼时效期间的约定","关于诉讼时效计算方法的约定"],"a":"ABCD","e":"\u0001《民法典》第197条确立诉讼时效制度的强行法属性：“诉讼时效的期间、计算方法以及中止、中断的事由由法律规定，当事人约定无效。当事人对诉讼时效利益的预先放弃无效。”\u0002\nA✓ 诉讼时效的中止事由严格法定，当事人约定增加或减少中止事由一律无效\nB✓ 诉讼时效的中断事由严格法定，当事人约定一律无效\nC✓ 诉讼时效的期间长度（如约定把3年改为1年或10年）严格法定，约定一律无效\nD✓ 诉讼时效的计算方法（如约定怎么起算何时到期）严格法定，约定一律无效","k":"","kb":106,"kh":[[470,502]]},{"id":"2026-21","y":2026,"t":"单","s":"甲借钱给乙,乙到期未偿还。诉讼时效期间届满后,甲到乙家索要借款,乙不在,乙的母亲丙承诺乙会在一周内还款,一周后甲仍未收到借款,遂起诉。对此,下列说法正确的是","o":["甲的起诉导致诉讼时效中断","丙的承诺导致诉讼时效中断","法院可以主动适用诉讼时效的规定","乙有权提出诉讼时效抗辩"],"a":"D","e":"\u0001借款诉讼时效届满后，债权人起诉或无权/非债务人第三人（乙的母亲丙既非债务人本人也非乙的法定/委托代理人或连带债务人）单方承诺代还，均不能令已经届满的诉讼时效“中断”！同时法院绝不得主动释明或主动援引诉讼时效判败诉，唯独债务人乙自己有权提出时效抗辩。\u0002\nA✗ 一方面，时效一旦“已经届满”就不可能再发生中断；另一方面即便假设原本还在时效期内，若诉讼时效已过，起诉本身只会导致被告获得胜诉抗辩权\nB✗ 即使在时效未届满时，同意履行也必须由\u0001义务人（或连带债务人、授权代理人）\u0002作出才引发中断；且本案时效早已届满，乙母丙既不是债务人又无代理权，其单方许诺既不构成有效时效利益放弃也不发生中断\nC✗ 依照《民法典》第193条明文规定：“人民法院不得主动适用诉讼时效的规定。”法官也不得向被告违背中立地主动提醒释明“你可以用过时效来拒赔”\nD✓ 乙有权提出诉讼时效抗辩：诉讼时效已经届满，乙并未亲自作出同意履行的表示也没有授权母亲承诺，因此债务人乙依法享有时效经过抗辩权，有权在庭审中主动抗辩拒绝清偿","k":"","kb":106,"kh":[[514,558]]}]},{"sub":"民法","name":"用益物权","w":0.8,"L":13,"qs":[{"id":"2005-42","y":2005,"t":"单","s":"在我国,典权属于（ ）。","o":["担保物权","用益物权","动产物权","完全物权"],"a":"B","e":"\u0001典权是指支付典价占有使用收益他人不动产并保留回赎权的传统财产权利，在分类上属于用益物权。\u0002\nA✗ 担保物权侧重支配物的交换价值以确保债权受偿；典权主要支配典物的使用与收益价值。\nB✓ 典权人占有并使用、收益他人房屋等不动产，在民法学理分类中属于用益物权（注意现行《民法典》未单设典权章）。\nC✗ 典权的标的物为房屋等不动产，非动产物权。\nD✗ 所有权仍归出典人，典权仅为在他物上设定的限定物权而非完全物权。\n【新法提示】现行《民法典》物权编未规定典权，但法硕传统物权分类真题仍将其作为用益物权习惯/学理典型加以识别。","k":"","kb":121,"kh":[[128,144]]},{"id":"2007-53","y":2007,"t":"多","s":"下列权利中,属于用益物权的有 （ ）。","o":["地上权","地役权","典权","土地承包经营权"],"a":"ABCD","e":"\u0001以占有、使用、收益他人财产为目的的权利属于用益物权，地上权、地役权、典权与土地承包经营权皆属此类。\u0002\nA✓ 地上权是以在他人土地上建造并保有建筑物等为目的的典型学理用益物权（对应我国建设用地使用权）。\nB✓ 地役权是为提高需役地效益而利用他人供役地的典型用益物权。\nC✓ 典权以占有、使用、收益他人不动产为内容，属于传统用益物权。\nD✓ 土地承包经营权是我国《民法典》明确规定的一项核心农用益物权。","k":"","kb":121,"kh":[[93,157]]},{"id":"2008-52","y":2008,"t":"多","s":"下列有关于益物权的判断,正确的有（ ）。","o":["用益物权属于定限物权","用益物权属于他物权","用益物权具有物上代位性","用益物权以支配物的使用价值为内容"],"a":"ABD","e":"\u0001用益物权以支配标的物的使用价值为内容，属于他物权和定限物权；物上代位性则是担保物权特有的属性。\u0002\nA✓ 用益物权仅在占有、使用、收益特定方面支配物权客体，属于定限（限定）物权。\nB✓ 用益物权是设定在他人所有之物上的权利，属于他物权。\nC✗ 物上代位性（毁损灭失保险金或补偿金代位担保）系担保物权保障交换价值的固有属性，用益物权一般不具有物上代位性。\nD✓ 用益物权旨在通过直接利用他人之物获得物的使用价值与收益。","k":"","kb":121,"kh":[[43,93]]},{"id":"2009-52","y":2009,"t":"多","s":"建设用地使用权的取得方式有（ ）。","o":["出让","转让","划拨","先占"],"a":"ABC","e":"\u0001建设用地使用权可以通过出让、划拨方式原始设立，也可以通过转让、互换等方式继受取得；先占仅适用于无主动产。\u0002\nA✓ 出让是有偿设立国有建设用地使用权的主要方式。\nB✓ 已设定的建设用地使用权可以通过买卖转让等方式由受让人继受取得。\nC✓ 国家公益事业等用地可通过无偿划拨方式设立建设用地使用权。\nD✗ 土地归国家或集体所有不存在无主土地，且先占仅适用于动产而非不动产用益物权。","k":"","kb":121,"kh":[[244,277]]},{"id":"2012-27","y":2012,"t":"单","s":"根据物权法的规定,土地承包经营权的设立时间是（ ）。","o":["土地承包经营权合同成立时","土地承包经营权合同生效时","土地承包经营权登记时","取得土地承包经营权证时"],"a":"B","e":"\u0001土地承包经营权采取意思主义设立规则，自土地承包经营权合同生效时设立。\u0002\nA✗ 需合同依法“生效”而非仅仅“成立”时设立。\nB✓ 依《民法典》第333条第1款，土地承包经营权自土地承包经营权合同生效时设立。\nC✗ 登记造册与发放权属证书仅为确认宣示功能，并非设立生效要件。\nD✗ 权属证书的领取并不决定土地承包经营权何时正式设立。","k":"","kb":121,"kh":[[177,203]]},{"id":"2013-34","y":2013,"t":"单","s":"根据我国《物权法》的规定,土地承包经营权的取得时间是（ ）。","o":["承包合同生效时","承包合同登记时","承包合同公证时","主管机关批准时"],"a":"A","e":"\u0001土地承包经营权无论原始取得或互换转让，原则上均自土地承包合同生效时取得物权。\u0002\nA✓ 依《民法典》第333、335条，土地承包经营权自承包合同生效时设立并取得。\nB✗ 土地承包经营权登记采对抗效力而非设立生效要件。\nC✗ 公证不是土地承包经营权成立或取得的法定条件。\nD✗ 常规发包无须专门主管机关批准方才取得物权。","k":"","kb":121,"kh":[[177,203]]},{"id":"2013-47","y":2013,"t":"多","s":"甲为自己房屋使用的便利与乙签订地役权合同,约定五年内乙不得加盖楼房,甲支付5万元。合同签订后,双方办理了登记手续。三年后甲去世,房屋由丙继承。同年,乙将楼房卖给丁,随后丁加盖楼房,遭丙阻止。在本案中（ ）。","o":["丙无权制止丁加盖楼房","地役权由丙享有","地役权不因甲死亡而消灭","丁有权要求乙承担违约责任"],"a":"BC","e":"\u0001地役权从属于需役地（及供役地），不因原主死亡而消灭，继承人丙承受需役地即一并享有已登记地役权，有权制止丁违约加盖。\u0002\nA✗ 地役权已办理登记产生对抗第三人效力，丁受让供役地须承受该地役权负担，丙有权制止丁加盖楼房。\nB✓ 地役权从属于需役地，甲死亡后丙继承房屋即一并继续享有原设定的眺望/采光地役权。\nC✓ 地役权为财产权性质的物权从权利，除合同另有约定或专属性外，不因权利人甲死亡而消灭（区别于具有人身专属性的居住权）。\nD✗ 丁作为买受人若事前不知道或乙隐瞒已登记地役权负担时才涉及瑕疵担保追责，且题干中该地役权已依法办理了不动产登记（丁理应查询知悉），故原题标准答案不选此项。","k":"","kb":121,"kh":[[401,461]]},{"id":"2017-39","y":2017,"t":"单","s":"【案情】甲村为了灌溉A地，与乙村签订书面合同，约定：甲村每年支付乙村4000元，在乙村的水库取水10000立方米；期限为20年。合同签订后，双方办理了权利登记。一年后，甲村将A地发包给丙。后丙将部分承包地转包给丁。\n甲村与乙村设定的有关取水的权利属于（ ）。","o":["地役权","相邻权","租赁权","土地承包经营权"],"a":"A","e":"\u0001甲村与乙村以书面合同约定每年付费在非相邻或邻村水库取水灌溉，属依合同意定设定的典型地役权。\u0002\nA✓ 地役权是通过双方书面合同意定设立的为提高自己不动产（需役地）效益而利用他人不动产（供役地）的用益物权，包含取水地役权。\nB✗ 相邻关系源于法律直接规定的最低限度容忍便利，无须合同付费约定且通常限于毗邻关系。\nC✗ 取水地役权已办理权利登记并设立在不动产之上，属于物权性用益物权而非单纯债权租赁。\nD✗ 取水权是利用他人水库资源而非承包耕种该土地。","k":"","kb":121,"kh":[[333,401]]},{"id":"2017-40","y":2017,"t":"单","s":"【案情】甲村为了灌溉A地，与乙村签订书面合同，约定：甲村每年支付乙村4000元，在乙村的水库取水10000立方米；期限为20年。合同签订后，双方办理了权利登记。一年后，甲村将A地发包给丙。后丙将部分承包地转包给丁。\n在丙将部分承包地转包给丁后,关于取水的权利表述正确的是（ ）。","o":["只有丙有权取水","只有丁有权取水","丙、丁均有权取水","丙、丁均无权取水"],"a":"C","e":"\u0001甲村发包已享有取水地役权的农地给丙，丙又转包（流转土地经营权）给丁，依地役权从属性及一并移转规则，丙、丁均享有相应地役取水权。\u0002\nA✗ 丙将部分承包地转包给丁后，相应地块的土地承包经营/经营利用权人丁一并取得地役权便利，并非只有丙能取水。\nB✗ 丙仅将“部分”承包地转包给丁，丙对其余未转包承包地仍继续享有该取水地役权。\nC✓ 依《民法典》第380、381条，土地所有权人享有的地役权在设立土地承包经营权后由承包人享有，部分转包/流转时亦随同一并享有，故丙和丁均有权依约取水灌溉各自耕地。\nD✗ 丙、丁分别就其各自承包的土地继续受该有效登记地役权的利益。","k":"","kb":121,"kh":[[410,448]]},{"id":"2022-23","y":2022,"t":"单","s":"根据《民法典》规定,土地承包经营权的设立时间为","o":["土地承包经营权合同成立时","土地承包经营权合同生效时","土地承包经营权登记时","土地承包经营权证发放时"],"a":"B","e":"\u0001依《民法典》第333条，土地承包经营权自土地承包经营权合同生效时设立。\u0002\nA✗ 合同成立仅代表合意达成，法条精确表述为合同“生效”时设立。\nB✓ 完全符合《民法典》第333条第1款关于土地承包经营权设立时间的明文规定。\nC✗ 登记并非农村土地承包经营权的设立前提。\nD✗ 发放土地承包经营权证仅系确权登记证明手续，不决定权利设立时点。","k":"","kb":121,"kh":[[177,203]]},{"id":"2024-47","y":2024,"t":"多","s":"下列关于居住权表述正确的有（ ）。","o":["居住权以无偿为原则,有偿为例外","居住权既可以用于满足自然人生活居住需要,也可以用于满足其生产经营需要","居住权人在居住权期限内死亡,居住权消灭","居住权的设立只能是自然人"],"a":"AC","e":"\u0001居住权以无偿设立为原则，因具有人身专属性故居住权人在期限内死亡居住权即消灭；不可用于生产经营，设立人亦不限于自然人。\u0002\nA✓ 依《民法典》第368条，居住权原则上无偿设立，但当事人另有约定的除外。\nB✗ 依《民法典》第366条，设立居住权的目的是为了“满足生活居住的需要”，不得用于从事生产经营活动。\nC✓ 依《民法典》第370条，居住权期限届满或者居住权人死亡的，居住权消灭（居住权不得转让、继承）。\nD✗ 居住权人（享有居住权的主体）只能是自然人，但房屋所有权人即“设立人”既可以是自然人，也可以是法人或非法人组织（如单位为职工养老设立居住权）。","k":"","kb":121,"kh":[[465,540],[576,589]]},{"id":"2025-36","y":2025,"t":"单","s":"甲在病重期间立下遗嘱,以自己的房屋为朋友乙设立居住权。甲于2023 年1 月15 日病故。乙于1 月25 日收到遗产管理人的通知,3 月1 日表示接受为自己设立的居住权,3 月 10 日办理居住权登记。乙取得居住权的时间为（ ）。","o":["2023 年1 月15 日","2023 年1 月25 日","2023 年3 月1 日","2023 年3 月10 日"],"a":"D","e":"\u0001依据《民法典》第368条与第371条，居住权自办理居住权登记时设立，即便是通过遗嘱设立亦须完成登记方取得物权。\u0002\nA✗ 2023年1月15日甲病故仅使遗嘱生效，乙取得请求设立居住权的债权性基础，但居住权物权尚未登记设立。\nB✗ 收到遗产管理人通知只是知悉遗嘱内容，不产生物权登记设立效果。\nC✗ 乙单方表示接受遗嘱利益系接受遗赠的意思表示，尚未办理不动产登记。\nD✓ 依《民法典》第368条“居住权自登记时设立”及第371条“以遗嘱方式设立居住权的，参照适用本章规定”，2023年3月10日完成居住权登记之日乙正式取得居住权。","k":"","kb":121,"kh":[[541,575]]},{"id":"2026-31","y":2026,"t":"单","s":"某村农户钱家的承包地因自然灾害严重损毁。村集体经济组织决定将该村5 亩机动地调整给钱家承包经营,但村民委员会决定该村机动地不予调整,以保持土地承包关系的稳定。对此,下列说法正确的是","o":["村集体经济组织和村民委员会应当就是否调整承包土地进行协商","村集体经济组织的决定和村民委员会的决定相互冲突,均无效","钱家有权取得5 亩机动地的土地承包经营权","钱家无权取得5 亩机动地的土地承包经营权"],"a":"A","e":"\u0001村集体经济组织与村民委员会均依法对集体土地享有管理职能，就灾毁机动地调整决定冲突时应当先行协商。\u0002\nA✓ 农村土地承包调整关乎集体成员根本利益，村集体经济组织与村委会作为农村集体两套治理协调主体意见冲突时，应当先行依法协商并依民主议定程序处理。\nB✗ 两个主体各自在其管理职权范围内形成意见，不存在只要意见相左即自动“均无效”的法定规则。\nC✗ 土地承包地调整还需经村民会议三分之二以上成员或代表同意并报乡政府及县农业主管部门批准等法定程序，不能仅凭一方决定直接取得。\nD✗ 钱家承包地确因自然灾害严重损毁，依据《农村土地承包法》第28条存在通过法定民主议定和审批程序从机动地中调整的合法可能，不能绝对断言“无权取得”。","k":"","kb":121,"kh":[[204,244]]}]},{"sub":"民法","name":"代理","w":0.7,"L":13,"qs":[{"id":"2005-41","y":2005,"t":"单","s":"根据代理权产生依据的不同,可将代理分为（ ）。","o":["法定代理、指定代理与委托代理","自己代理与双方代理","直接代理与间接代理","显明代理与隐名代理"],"a":"A","e":"\u0001在2005年考纲所依《民法通则》第64条规定下，按代理权产生根据不同，将代理分为“委托代理、法定代理和指定代理”。注意现行《民法典》已将指定代理合并入法定代理，仅保留委托代理与法定代理两类！\u0002\nA✓ 法定代理、指定代理与委托代理：完美对应《民法通则》第64条对代理权发生根据的传统三分法（2005年真题唯一标准答案）\nB✗ 自己代理与双方代理是根据代理权是否违背忠实利益冲突规则而划分的\u0001滥用代理权\u0002类型\nC✗ 直接代理与间接代理以代理人是否直接以“被代理人名义”实施行为为区分标准\nD✗ 显名代理与隐名代理以第三人订约时是否知晓代理关系存在为区分标准\n【新法提示】现行《民法典》第163条（沿自2017年《民法总则》）已经取消了“指定代理”这一独立分类，现行法仅规定“委托代理和法定代理”两种代理类型（原人民法院等指定监护人产生的代理权直接并入法定代理）。","k":"","kb":103,"kh":[[244,301]]},{"id":"2007-37","y":2007,"t":"单","s":"下列情形中,导致委托代理关系终止的是 （ ）。","o":["代理人经委托人同意,转托他人代理","代理人丧失民事行为能力","作为代理人的法人法定代表人更换","被代理人死亡"],"a":"B","e":"\u0001依照《民法典》第173条（原《民法通则》第69条），代理人丧失民事行为能力或代理人死亡，均必然导致委托代理终止！而经过同意转委托、法人更换法定代表人以及（在特定法定情形下）被代理人死亡，均不必然导致终止。\u0002\nA✗ 代理人经委托人同意进行有效转委托（《民法典》第169条复代理），原委托代理关系并不一定因此就彻底断绝终止（转委托人在代理人与被代理人同意下通常仅在委托事务范围建立复代理或仅对选任指示负责）\nB✓ 代理人丧失民事行为能力：受托人自己丧失行为能力已无法独立正确作意思表示代为办事，依照《民法典》第173条第1款第4项（及原《民法通则》），委托代理关系当然终止\nC✗ 法人独立于其法定代表人存在（法人人格并未终止），法定代表人换人绝不影响该法人机构对外承担或受托执行的委托代理合同效力\nD✗ （注意对比！）原则上被代理人死亡委托代理终止，但《民法典》第174条列举四种例外（如代理人不知道且不应当知道、被代理人继承人予以承认、授权明确约定事务完成止、死亡前已实施为继承人利益继续完成）——实际上在原《民法通则》第69条时代法条压根只写了“被代理人取消委托”和“代理人死亡/丧失行为能力”，并未直接把“被代理人死亡”列进一般委托终止条款（因民通司法解释规定在特殊情形下甚至不终止），故2007年唯一明确无争议终止事由是“代理人丧失民事行为能力”","k":"","kb":103,"kh":[[354,414]]},{"id":"2009-36","y":2009,"t":"单","s":"下列行为中,属于代理行为的是（ ）。","o":["代人书写起诉状","代人办理企业登记","代人整理资料","代人看管小孩"],"a":"B","e":"\u0001民事代理的核心特征是代理人以被代理人名义向第三方独立作出“意思表示”（设权、变更民事法律关系）。代人办理工商企业登记（向登记机关提交申请材料以设立公司这一法律效果）符合代理特征；代写诉状、整理资料、看小孩均为劳务或纯事实辅助行为。\u0002\nA✗ 代人书写起诉状只是根据委托人自己口述事实执笔整理文字，代书人自己不作独立意思表示也不以委托人名义对外决定诉讼权利，仅是民事劳务/辅助行为\nB✓ 代人办理企业登记：受托人携带授权书以委托人名义向登记机关提交登记申请、签领营业执照、作出设立公司法人设立的意思表示并依法直接使委托人取得公司股东或法人登记法律后果，属典型\u0001代理行为\u0002\nC✗ 代人整理文件资料纯属机械性的劳务事实行为，无任何对外设立权利义务之意思表示\nD✗ 代人看管照料小孩属于日常生活照管事实行为（劳务或情谊），并非替家长或孩子对外签订合同等法律行为","k":"","kb":103,"kh":[[19,43],[215,233]]},{"id":"2010-34","y":2010,"t":"单","s":"甲欲按乙公司寄送的价目表上的报价购买某型号电脑一台。某日,甲委托朋友丙转告乙公司其购买意向。在民法上,丙是甲的（ ）。","o":["代理人","代表人","传达人","居间人"],"a":"C","e":"\u0001甲自己早已完全打定主意并确定报价型号（已独立决定全部意思表示内容），仅仅让朋友丙跑腿带句话转告乙公司，丙本身不具有任何自由磋商、裁量决策空间，属于民法上的“传达人”（而非代理人）。\u0002\nA✗ 代理人必须在代理权限内享有\u0001独立作出意思表示\u0002的判断裁量空间（如决定选哪款电脑、如何议价）；丙只是原封不动把甲决定好的话传过去，不作独立意思表示\nB✗ 代表人指法定代表人代表法人机关对外履职，与个人委托跑腿传话无关\nC✓ 传达人：丙仅仅像“活信使”一样机械转达甲早已完全决定的购买意思表示，本身无权修改条款或独立作意思决定，民法上定性为\u0001传达人\u0002\nD✗ 居间人（《民法典》称中介人）是指受托向委托人报告订立合同的机会或提供订约媒介服务的中间商，通常不以一方名义替买方传话下单","k":"","kb":103,"kh":[[174,213]]},{"id":"2011-23","y":2011,"t":"单","s":"甲欲出售一辆汽车,乙向甲声称受丙委托购买该车,甲托人向丙核实,丙未予否认。甲遂将该车交给乙,乙将车开走后不知去向,甲向丙要求付款遭拒绝。此案的正确处理方法是（ ）。","o":["由甲自行承担损失","由乙支付车款","由丙支付车款","由乙、丙承担连带付款责任"],"a":"C","e":"\u0001在2011年《民法通则》第66条旧法规则下，“本人知道他人以本人名义实施民事行为而不作否认表示的，视为同意”，故丙未否认时需由丙负责付款；但《民法典》第171条第2款已彻底反转该规则，改为“未作表示的，视为拒绝追认”！\u0002\nA✗ 按2011年当时有效的《民法通则》第66条第1款，甲尽到了托人向丙核实的义务且丙沉默“未予否认”，视为丙追认授权有效，甲不自行吞下损失\nB✗ 同上，在2011年旧法下代理行为被视为经丙默示同意而生效，因此买卖合同当事人是甲和丙，而非直接找无权代理人乙个人追讨\nC✓ 由丙支付车款（保留2011官方标准答案）：乙无权代理以丙名义购车，甲当面托人向被代理人丙核实确认时，丙知情却未表态否认；依2011年考场上有效的《民法通则》第66条“知道他人以本人名义实施民事行为而不作否认表示的，视为同意”，因此视为丙同意授权由丙付款。【新法提示】现行《民法典》第171条第2款已废除此规则，明文改为“被代理人未作表示的，视为拒绝追认”！如按现行法且不构成表见代理时，应由无权代理人乙担责而非丙\nD✗ 在有效授权或追认情形下由被代理人丙单独履约；在无权代理未获追认下（不构表见代理）才由行为人乙担责（仅明知无权代理的相对人或特定恶意情形才涉过错分担或恶意串通连带），甲已积极核实，不应无端要求乙丙连带\n【新法提示】本题是《民法总则》及《民法典》重大颠覆性改法经典例题！2011年依据旧《民法通则》第66条“沉默视为同意”选“由丙支付车款”；现行《民法典》第171条第2款明确规定“被代理人未作表示的，视为拒绝追认”（保护被代理人免于被动被强加合同）。现今考场上遇类似沉默未作否认情形，除非另有公章授权书外观构成表见代理，否则一律视为拒绝追认！","k":"","kb":104,"kh":[[201,256]]},{"id":"2011-46","y":2011,"t":"多","s":"下列行为中,可以代理的有（ ）。","o":["立遗嘱","申请商标注册","订立合同","参加行政诉讼"],"a":"BCD","e":"\u0001只有依法必须由本人亲自实施的强人身专属性行为（立遗嘱、结婚/离婚登记、收养等）禁止代理；普通的民事合同订立、申请商标注册以及参加行政诉讼均依法允许委托代理。\u0002\nA✗ 立遗嘱系极强个人死因处分人身意愿行为，必须由立遗嘱人本人亲自作出（或有见证人代书但由本人签名确认真实遗嘱意思），绝对不允许由他人代理立遗嘱\nB✓ 申请商标注册属于普通知识产权确权商事手续，《商标法》明确规定可以委托商标代理机构办理（外国人甚至必须委托代理）\nC✓ 订立普通民事合同是委托代理最日常普遍的适用领域\nD✓ 《行政诉讼法》明确规定公民法人可以委托1至2名律师或基层法律服务工作者等作为诉讼代理人参加行政诉讼","k":"","kb":103,"kh":[[90,164]]},{"id":"2012-25","y":2012,"t":"单","s":"甲、乙双方同意协议离婚。甲因出差,故委托丙去婚姻登记机关代为办理离婚登记手续。根据我国法律,丙（ ）。","o":["不得代理","可以代理","在取得甲书面授权后可以代理","在取得乙同意后可以代理"],"a":"A","e":"\u0001结婚、协议离婚登记直接涉及公民核心身份关系的设立与消灭，属于法律规定必须由当事人双方本人亲自到婚姻登记机关办理的强人身专属性行为，绝对不得委托他人代理！\u0002\nA✓ 不得代理：离婚登记涉及夫妻身份解除、子女抚养与共同财产重大人生抉择，依照《民法典》第1076条及《婚姻登记条例》必须由男女双方亲自到婚姻登记机关申请办理，哪怕出差也不能写授权委托书由丙去代办离婚手续\nB✗ 婚姻身份关系解除绝对不能适用意思表示代理制度\nC✗ 哪怕经过公证的书面特别授权委托书，婚姻登记处也依法拒绝办理协议离婚代理登记（注：诉讼离婚中特殊情形下可委托诉讼代理人出庭，但协议行政婚姻登记绝对不可代理！）\nD✗ 强行性法律规定即使乙配偶表示同意，婚姻登记处依然绝不受理无本人到场的代理离婚登记","k":"","kb":103,"kh":[[106,117]]},{"id":"2012-47","y":2012,"t":"多","s":"下列行为中,属于滥用代理权的有（ ）。","o":["自己代理","双方代理","越权代理","无权代理"],"a":"AB","e":"\u0001滥用代理权是指代理人“手里确实拥有代理权”，却违背被代理人利益最大化诚实信用原则去使用权利：法定包括①自己代理、②双方代理、③代理人与相对人恶意串通三种。越权代理与无权代理根本就没有代理权，谈不上“滥用”！\u0002\nA✓ 自己代理（代理人以被代理人名义与自己本人为民事法律行为，如甲代理乙公司把房子低价卖给自己）属于滥用代理权\nB✓ 双方代理（同一代理人同时代理买卖双方签订同一份合同）属于滥用代理权\nC✗ 越权代理（超越被代理人授予权限范围订约）属于\u0001无权代理\u0002的一种具体表现形式，而非“手里有该权限而滥用”\nD✗ 无权代理指根本不享有代理权而以他人名义活动，逻辑前提就与“手中有权却滥用”的滥用代理权相悖","k":"","kb":104,"kh":[[23,51],[112,140]]},{"id":"2013-26","y":2013,"t":"单","s":"学校委托教务人员王某购买一批教学器材。王某到百货公司购买时,恰逢该公司举行有奖销售, 王某抽中数码相机一台。该相机应当（ ）。","o":["归学校所有","归王某所有","归学校与王某共有","归学校所有,但学校应给王某适当奖励"],"a":"A","e":"\u0001代理人在代理权限内以被代理人名义实施民事法律行为，所产生的财产权利与法律后果（含附随抽奖所得）归被代理人承受。\u0002\nA✓ 王某是受学校委托、用学校公款为学校购买教学器材，中奖相机作为买受标的物的附随利益归属于合同相对人（被代理人）学校。\nB✗ 代理人不得私自将执行代理事务附随取得的财物占为己有。\nC✗ 抽奖资格依附于购买器材主合同而生，不属于学校与王某共有。\nD✗ 法律并未规定受托人职务购货中奖必由被代理人给予特定份额奖励（是否嘉奖属单位内部行政激励）。","k":"","kb":103,"kh":[[19,54]]},{"id":"2016-29","y":2016,"t":"单","s":"甲委托乙购买某品牌新款手机并预付了购机款,乙又委托丙办理此事,但未将购机款交给丙,也未征求甲的意见。丙购得手机后交给甲,甲拒绝接受。对此,下列选项正确的是（ ）。","o":["丙系甲的指定代理人","乙的转委托行为有效","甲有权要求乙返还购机款","丙有权要求甲支付购机款"],"a":"C","e":"\u0001《民法典》第923条规定：受托人经委托人同意才可以转委托；未经同意或追认擅自转委托的，受托人应当对转委托第三人的行为承担责任！甲未同意也未追认乙转托丙，甲有权拒绝接受并直接向收了自己预付款的乙要求返还购机款！\u0002\nA✗ 《民法典》已无“指定代理”概念，且丙是受乙个人私下转托而非法院或行政机关指定给甲的代理人\nB✗ 委托合同具有高度人身信任基础，未经委托人甲同意也未经事后追认，乙擅自转委托原则上无效（至少对甲不发生转委托效力，仅由乙自己向丙负责）\nC✓ 甲有权要求乙返还购机款：乙既未征求甲同意也未事后获追认即擅自转托丙去买手机（且还没有把甲的购机款转给丙），转委托对甲无效；甲根本不认识丙且有权拒绝接受丙买来的手机，直接依据原委托合同要求\u0001乙返还预付购机款\u0002\nD✗ 甲从未同意转委托且不知晓丙（或未获追认），甲与丙之间不发生直接的委托付款关系，丙只能找委托自己的乙索要手机货款","k":"","kb":104,"kh":[[312,367]]},{"id":"2017-25","y":2017,"t":"单","s":"甲委托乙以乙的名义为甲购买一辆汽车。乙与丙签订购车合同后,由于甲的原因不能依约向丙支付购车款,乙遂向丙披露了委托人甲。对此,下列说法正确的是（ ）。","o":["丙只能请求甲支付购车款","丙只能请求乙支付购车款","丙可以在甲、乙中择一请求支付购车款","丙请求甲支付购车款遭拒后,可请求乙支付"],"a":"C","e":"\u0001《民法典》第926条第2款（原《合同法》第403条第2款）：受托人乙以自己名义与丙订立购车合同（间接代理），因委托人甲的原因对第三人丙不付款时，乙向丙披露委托人甲后，丙作为第三人享有选择权——“可以选择受托人（乙）或者委托人（甲）作为相对人主张其权利”！（但是选定后不得再变更）\u0002\nA✗ 丙并非“只能”找甲要钱，也可以选择找与自己直接签白纸黑字合同的乙要钱\nB✗ 在乙已依法披露真正委托人甲的情况下，丙依法新增了一项直接选择找幕后委托人甲要钱的权利\nC✓ 丙可以在甲、乙中择一请求支付购车款：精准对应《民法典》第926条第2款之\u0001“第三人选择权”\u0002（受托人以自己名义订约且因委托人原因不履行，向第三人披露委托人后，第三人可择一选定受托人或委托人主张权利，但一经选定不得反悔改选另一方）\nD✗ 条文确立的是一次性不可逆的“选择权”（选了甲就只能一路找甲追责，不能找甲要不到再改回头去告乙！这是法考/法硕高频陷阱：选择权一经行使即告确定，不得变更选定的相对人）","k":"","kb":104,"kh":[[368,447]]},{"id":"2023-28","y":2023,"t":"单","s":"甲将一幅字画交给乙代售。丙出价400万元,丁出价300万元并许诺给乙50万元“好处费”。乙以甲的名义将字画卖给丁,并向甲隐瞒了丙的报价。甲得知真相后拒绝承认该交易。该买卖合同","o":["无效","可撤销","效力待定","不成立"],"a":"A","e":"\u0001《民法典》第164条第2款、第154条明文规定：代理人乙与相对人丁恶意串通（丁许诺给乙50万元好处费、乙故意隐瞒丙的400万高价而以300万贱卖甲的字画），损害被代理人甲合法权益的，该买卖合同自始绝对无效！（不需要等甲拒绝才无效）\u0002\nA✓ 无效：代理人乙收受相对人丁50万元私下“好处费”回扣，故意压低100万元并隐瞒更高报价将甲的字画贱卖给丁，属于典型的\u0001代理人与相对人恶意串通损害被代理人合法权益\u0002；依据《民法典》第154条及第164条第2款，该合同自始\u0001无效\u0002，且乙与丁应对甲承担连带赔偿责任\nB✗ 恶意串通损害他人合法权益属于法定绝对无效事由，绝不是仅可撤销的合同\nC✗ 效力待定适用于“善意相对人面对普通无权代理”等待本人追认之情形；而本案乙本来就是甲委托代售的有权代理人（只不过在滥用代理权），且与相对人恶意串通侵害被代理人利益，法律直接判定自始绝对无效，绝不可能通过“事后追认”洗白变成有效待定\nD✗ 甲乙丁之间意思表示外观已就字画买卖300万元达成形式合意，合同已经成立，只不过因内容构成恶意串通而被法律宣告无效","k":"","kb":104,"kh":[[51,111]]},{"id":"2024-29","y":2024,"t":"单","s":"甲伪造A公司公章,以A公司名义与不知情的B公司签订产品推广合同。关于该合同,下列说法正确的是（ ）。","o":["A公司追认前,B公司有权通知A公司撤销合同","A公司追认后,B公司有权通知A公司解除合同","无论A公司是否追认,B公司均有权请求甲履行合同","无论A公司是否追认,B公司均有权请求法院撤销合同"],"a":"A","e":"\u0001甲“伪造A公司公章”以A公司名义与不知情的B公司签约，属于典型无权代理（注：私刻伪造公章因被代理人A公司本身没有任何赋予权限的过错外观，一般不构成表见代理！）。依照《民法典》第171条第2款：“行为人实施的行为未被追认前，善意相对人有撤销的权利。撤销应当以通知的方式作出。”\u0002\nA✓ A公司追认前，B公司有权通知A公司撤销合同：B公司对甲伪造公章事实毫不知情，属于\u0001善意相对人\u0002；根据《民法典》第171条第2款，在被代理人A公司正式作出追认之前，善意相对人B公司有权以\u0001通知的方式\u0002直接撤销该无权代理合同，使其确定归于无效\nB✗ 一旦A公司依法追认了该合同，该合同即自始对A公司与B公司发生完全合法有效的法律拘束力，双方均须严守履约，B公司无权随便通知单方解除有效合同\nC✗ 只有当A公司最终拒绝追认时，善意相对人B公司才能依据第171条第3款请求无权代理人甲履行债务或者赔偿损失；如果A公司追认了合同，合同就由A公司承担履约责任，B再无权强行要求甲亲自履行\nD✗ 第一，一旦A公司已经追认即不再有善意相对人撤销权；第二，第171条规定的善意相对人撤销权通过“通知”即可行使（普通形成权），并不像受欺诈胁迫那样必须向法院或仲裁机构起诉请求撤销","k":"","kb":104,"kh":[[258,285]]}]},{"sub":"刑法","name":"分则·渎职罪","w":0.5,"L":10,"qs":[{"id":"2006-20","y":2006,"t":"单","s":"下列情形中，构成徇私枉法罪的是（ ）。","o":["某看守所警察甲利用值班之机,徇私情故意放跑因受贿罪被关押的犯罪嫌疑人刘某","某法院法官乙在行政案件审判中故意曲解法律,偏袒原告,作出违背事实与法律的判决,情节严重","警察丙在对陈某的抢夺行为进行侦察过程中,因接受陈某家属的吃请而隐匿陈某犯罪的证据","警察丁为使其仇人王某受刑事追究，捏造王某犯罪的事实，向人民检察院举报，致使王某被无辜羁押100天"],"a":"C","e":"\u0001侦查人员接受吃请后隐匿犯罪证据包庇犯罪人，成立徇私枉法罪。\u0002\nA✗ 看守所警察故意放走被关押的犯罪嫌疑人，成立\u0001私放在押人员罪\u0002（第400条）\nB✗ 法官在\u0001行政案件\u0002审判中枉法裁判，成立\u0001民事、行政枉法裁判罪\u0002（第399条第2款），不成立徇私枉法罪\nC✓ 徇私枉法罪：警察在刑事侦查中受贿吃请、\u0001隐匿犯罪证据包庇有罪之人\u0002，完全符合徇私枉法罪\nD✗ 捏造犯罪事实向检察院举报使他人受刑事追究，属于\u0001诬告陷害罪\u0002（第243条）\n徇私枉法罪仅限于\u0001刑事诉讼\u0002中的追诉、包庇或刑事审判；民事、行政审判枉法适用“民事、行政枉法裁判罪”。","k":"","kb":5,"kh":[[45,60],[76,95]]},{"id":"2007-20","y":2007,"t":"单","s":"下列情形中,可以构成玩忽职守罪的是 （ ）。","o":["某国有企业的总经理在经营活动中严重不负责任,造成该公司严重亏损","某高校校长对财务管理严重不负责任,造成巨额资金无法收回","某法院执行庭庭长在执行民事判决中严重不负责任,不履行法定执行职责,致使当事人利益遭受重大损失","某外汇管理部门工作人员在外汇管理工作中严重不负责任,造成大量逃汇,致使国家利益遭受重大损失"],"a":"D","e":"\u0001玩忽职守罪要求主体为国家机关工作人员，且致使公共财产、国家和人民利益遭受重大损失。\u0002\nA✗ 国有企业总经理不是国家机关工作人员，严重不负责任造成破产或严重损失定\u0001国有公司、企业人员失职罪\u0002\nB✗ 高校校长属事业单位工作人员，应认定为\u0001事业单位人员失职罪\u0002\nC✗ 法院执行人员在执行民事判决中失职有专门罪名——\u0001执行判决、裁定失职罪\u0002（第399条第3款），且强调当事人等利益受损\nD✓ 玩忽职守罪：外汇管理部门工作人员属于国家机关工作人员，失职造成国家利益重大损失，符合普通玩忽职守罪\n注意普通渎职罪（滥用职权/玩忽职守）与特别渎职罪（执行判决失职/滥用职权罪）以及国企、事业单位失职罪的罪名界分。","k":"","kb":4,"kh":[[23,63]]},{"id":"2010-19","y":2010,"t":"单","s":"下列行为中，应以故意泄露国家秘密罪定罪处罚的是（ ）。","o":["公安机关办案人员甲打电话告知犯罪嫌疑人张三将对其执行逮捕的机密,张三听后随即潜逃","国家机关工作人员乙接受国外情报机构收买, 为其提供所掌握的国家秘密","有限责任公司工程师丙未经许可,私自出售本单位保密的专有技术配方","国家机关工作人员丁为筹措儿子的留学经费,将掌握的国家秘密出售给境外媒体"],"a":"A","e":"\u0001办案人员向犯罪嫌疑人通风报信致其潜逃，成立故意泄露国家秘密罪。\u0002\nA✓ 故意泄露国家秘密罪：警方内部即将执行逮捕的办案机密属于国家秘密，\u0001故意向嫌犯通风报信致其潜逃\u0002，情节严重，成立本罪\nB✗ 接受国外情报机构收买并为其提供国家秘密，成立\u0001间谍罪\u0002\nC✗ 私自出售企业专有技术配方侵害的是商业秘密，成立\u0001侵犯商业秘密罪\u0002\nD✗ 将掌握的国家秘密直接出售给境外媒体，应定\u0001为境外非法提供国家秘密罪\u0002","k":"","kb":3,"kh":[[111,150]]},{"id":"2014-20","y":2014,"t":"单","s":"下列选项中,属于渎职罪的是（ ）。","o":["贪污罪","强令违章冒险作业罪","医疗事故罪","执行判决、裁定滥用职权罪"],"a":"D","e":"\u0001执行判决、裁定滥用职权罪属于刑法分则第九章渎职罪。\u0002\nA✗ 贪污罪属于刑法分则第八章\u0001贪污贿赂罪\u0002\nB✗ 强令违章冒险作业罪属于刑法分则第二章\u0001危害公共安全罪\u0002\nC✗ 医疗事故罪属于刑法分则第六章\u0001妨害社会管理秩序罪\u0002（妨害公共卫生罪）\nD✓ 执行判决、裁定滥用职权罪规定在《刑法》第399条第3款，属于刑法分则第九章\u0001渎职罪\u0002","k":"","kb":5,"kh":[[27,43]]},{"id":"2016-18","y":2016,"t":"单","s":"质监局局长甲明知某食品加工厂违法使用食品添加剂,但未依法采取措施,致食用该厂食品的多名消费者食物中毒,社会影响恶劣。甲的行为应认定为（ ）。","o":["食品监管渎职罪","玩忽职守罪","放纵制售伪劣商品犯罪行为罪","滥用职权罪"],"a":"A","e":"\u0001质监局长明知食品违禁添加仍不查处致人中毒，成立食品监管渎职罪。\u0002\nA✓ 食品监管渎职罪：负有食品安全监督管理职责的人员玩忽职守不查处，导致多人食物中毒，适用\u0001特别法条（第408条之一）\u0002\nB✗ 玩忽职守罪是一般渎职罪名，有\u0001食品监管渎职罪\u0002专门条文时应优先适用\nC✗ 放纵制售伪劣商品犯罪行为罪侧重于公安、工商等追诉移交，食品安全监管环节优先适用第408条之一\nD✗ 滥用职权罪是普通渎职罪名，不优先于食品监管渎职罪适用\n\u0001【新法提示】\u0002《刑法修正案（十一）》已将“食品监管渎职罪”扩展修改为“食品、药品监管渎职罪”，并细化了不依法查处、隐瞒谎报、未按规定移交等五类具体渎职行为。","k":"","kb":7,"kh":[[39,73],[153,176]]},{"id":"2020-5","y":2020,"t":"单","s":"监狱司法工作人员甲接受在押人员乙的妻子请托,在押送乙外出就医途中,违规打开乙的戒具,并暗示乙逃跑。乙成功逃跑后,甲收受了乙妻所送的50 万元。对此,下列说法中正确的是（ ）。","o":["对甲按私放在押人员罪和受贿罪并罚","对甲按脱逃罪(共犯)和受贿罪并罚","对甲按私放在押人员罪和受贿罪从一重处断","对甲按脱逃罪(共犯)和受贿罪从一重处断"],"a":"A","e":"\u0001监狱干警私放在押犯并受贿，依最新司法解释按私放在押人员罪和受贿罪数罪并罚。\u0002\nA✓ 私放在押人员罪和受贿罪并罚：2016年《贪污贿赂解释》第17条明确，收受贿赂同时构成渎职犯罪的，\u0001除刑法另有规定外数罪并罚\u0002\nB✗ 监狱人员利用职权放走在押人员应定专门的\u0001私放在押人员罪\u0002，不定脱逃罪共犯\nC✗ 刑法第399条第4款仅针对徇私枉法、民事行政枉法裁判、执行判决裁定失职/滥用职权四罪规定“择一重”，私放在押人员罪不适用择一重\nD✗ 既不成立脱逃罪共犯，亦不适用从一重处断\n记法：受贿+渎职原则“并罚”，唯有399条（徇私枉法/民事行政枉法/执行失职滥权）“择一重”。","k":"","kb":18,"kh":[[62,80],[132,145]]},{"id":"2022-10","y":2022,"t":"单","s":"国家机关工作人员甲,发现好友王某生产、销售不符合食品安全标准的食品后,滥用食品安全监管职权,未依法将王某移交司法机关追究刑事责任,情节严重。甲的行为应认定为","o":["滥用职权罪","徇私枉法罪","食品监管渎职罪","徇私舞弊不移交刑事案件罪"],"a":"C","e":"\u0001食药监管人员发现好友销售有毒不符合安全标准食品而不移交，构成食品、药品监管渎职罪。\u0002\nA✗ 滥用职权罪是一般法条，存在特别法条第408条之一时应优先适用特别罪名\nB✗ 徇私枉法罪主体仅限\u0001司法工作人员\u0002，监管行政官员不属司法工作人员\nC✓ 食品监管渎职罪（现为食品、药品监管渎职罪）：条文明确列明“依法应当移交司法机关追究刑事责任不移交的”直接构成本罪\nD✗ 徇私舞弊不移交刑事案件罪（第402条）是一般行政执法机关不移交刑事案件的罪名，食品安全监管领域已被第408条之一特别吸收","k":"","kb":7,"kh":[[182,202]]},{"id":"2024-12","y":2024,"t":"单","s":"下列不可以作为玩忽职守罪主体的是（ ）。","o":["乡人民代表大会主席","合同制民警","工人编制的镇工商所所长","火车站售票员"],"a":"D","e":"\u0001火车站售票员属于一般服务性岗位职工，不是从事国家公务的人员，不能作为玩忽职守罪主体。\u0002\nA✗ 乡人大主席属于依法履行国家权力机关公务的\u0001国家机关工作人员\u0002，可成为本罪主体\nB✗ 合同制民警虽无正式编制，但系\u0001虽未列入编制但在国家机关中从事公务的人员\u0002，依立法解释以国家机关工作人员论\nC✗ 工人编制的镇工商所所长属\u0001未列入国家机关编制但在行政机关中从事公务的人员\u0002，可成为本罪主体\nD✓ 火车站售票员仅从事商业售票劳务活动，\u0001不具有行使国家行政职权、从事公务的性质\u0002，不能作为玩忽职守罪主体","k":"","kb":4,"kh":[[180,237]]},{"id":"2025-9","y":2025,"t":"单","s":"警察甲依法押解涉嫌招摇撞骗罪的王某,途中发现王某系自己的恩人,遂偷偷将其手铐打开,放任王某借上厕所之机脱逃。甲的行为应认定为（ ）。","o":["徇私枉法罪","私放在押人员罪","滥用职权罪","失职致使在押人员脱逃罪"],"a":"B","e":"\u0001警察押解途中故意打开手铐放任嫌犯逃跑，成立私放在押人员罪。\u0002\nA✗ 徇私枉法罪规制侦查、起诉、审判中伪造证据、包庇或枉法裁判，非看管押解中直接放人\nB✓ 私放在押人员罪：警察属于司法工作人员，押解途中\u0001故意打开戒具放任脱逃\u0002，符合第400条第1款\nC✗ 滥用职权罪系一般渎职罪名，私放在押人员罪系特别法条，\u0001特别法优于一般法\u0002\nD✗ 失职致使在押人员脱逃罪为主观\u0001过失\u0002犯罪，本案系故意放纵，不构成过失犯罪","k":"","kb":6,"kh":[[22,47]]},{"id":"2026-15","y":2026,"t":"单","s":"公路稽查人员甲在执法过程中发现逃避检查的逃逸车辆,进行追查。逃逸车辆驾驶人员小张慌不择路,坠桥身亡。甲的行为应认定为","o":["正当业务行为","滥用职权罪","玩忽职守罪","过失致人死亡罪"],"a":"B","e":"\u0001公路稽查人员违规追缉逃逸车辆导致驾驶人坠桥身亡，属于滥用职权罪。\u0002\nA✗ 正当业务行为要求执法手段、限度合法合规，违规超越限度追查不构成正当业务行为\nB✓ 滥用职权罪：积极违规实施超越职权的强制追查行为致使人死亡，属于\u0001滥用职权\u0002（作为型渎职）\nC✗ 玩忽职守罪通常表现为严重不负责任的\u0001不作为/怠于履职\u0002，本案为主动违规追缉，定滥用职权罪\nD✗ 国家机关工作人员在执行职务过程中滥用职权致人死亡的，依专门渎职犯罪定罪而非普通过失致人死亡罪","k":"","kb":4,"kh":[[23,63]]}]},{"sub":"刑法","name":"分则·危害国家安全罪","w":0.5,"L":9,"qs":[{"id":"2007-14","y":2007,"t":"单","s":"甲是国家机关工作人员,为其子开办公司筹措资金,应外国人乙的要求,潜入单位保密室,将一件国家机密级文件复印后出卖给乙。甲的行为构成 （ ）。","o":["买卖国家机关公文罪","故意泄露国家秘密罪","为境外窃取国家秘密罪","买卖国家机关公文罪和为境外窃取国家秘密罪"],"a":"C","e":"\u0001向外国人出卖国家机密级文件，成立为境外窃取、刺探、收买、非法提供国家秘密罪。\u0002\nA✗ 买卖国家机关公文罪：对象为一般国家机关公文，本案出卖的是\u0001国家机密级文件\u0002，应定专门危害国家安全的秘密类犯罪\nB✗ 故意泄露国家秘密罪：泄密对象不限于境外；向\u0001境外机构、组织或人员\u0002提供国家秘密应适用特别法条\nC✓ 为境外窃取国家秘密罪：应\u0001外国人乙\u0002要求潜入保密室窃取并出卖国家机密级文件，完全符合本罪要件\nD✗ 牵连数罪：为窃取出卖而获取秘密是一行为触犯数罪名或吸收关系，不与买卖国家机关公文罪并罚\n区分故意泄露国家秘密罪与为境外提供国家秘密罪的关键在于\u0001提供对象是否具有涉外因素\u0002（境外的机构、组织、人员）。","k":"","kb":2,"kh":[[36,69]]},{"id":"2008-16","y":2008,"t":"单","s":"中国公民甲在境外被一外国间谍组织收买,接受该间谍组织指派,回国搜集某沿海军事基地情报。甲的行为构成（ ）。","o":["间谍罪","为境外窃取、刺探国家秘密罪","非法提供国家秘密、情报罪","故意泄露国家秘密罪"],"a":"A","e":"\u0001接受外国间谍组织收买和指派回国搜集军事情报，直接成立间谍罪。\u0002\nA✓ 间谍罪：被外国间谍组织收买并\u0001接受间谍组织指派\u0002执行搜集军事情报任务，直接符合间谍罪客观行为\nB✗ 为境外窃取、刺探国家秘密罪：虽有刺探军事情报行为，但系\u0001接受间谍组织任务\u0002而为，优先定间谍罪\nC✗ 非法提供国家秘密、情报罪：无接受间谍组织指派这一要件时方适用本罪\nD✗ 故意泄露国家秘密罪：不区分对方是否间谍组织，无法评价接受间谍指派的危害","k":"","kb":1,"kh":[[72,94]]},{"id":"2012-18","y":2012,"t":"单","s":"国家机关工作人员甲通过电子邮件,将因工作便利获悉的国家经济秘密发送给某境外机构。甲的行为构成（ ）。","o":["间谍罪","非法获取国家秘密罪","故意泄露国家秘密罪","为境外非法提供国家秘密罪"],"a":"D","e":"\u0001国家机关工作人员向某境外机构发送国家经济秘密，应定为境外非法提供国家秘密罪。\u0002\nA✗ 间谍罪：仅向境外机构发送秘密，题干未交代该机构为\u0001间谍组织\u0002或受其指派\nB✗ 非法获取国家秘密罪：甲系因\u0001工作便利获悉\u0002秘密，不存在窃取、刺探、收买等非法获取行为\nC✗ 故意泄露国家秘密罪：当国家秘密泄露给\u0001境外机构、组织、人员\u0002时，应定危害国家安全罪中的为境外非法提供国家秘密罪\nD✓ 为境外非法提供国家秘密罪：将因工作便利获悉的国家经济秘密发送给\u0001境外机构\u0002，完全符合本罪构成\n本题虽属涉密犯罪，但在存在\u0001境外机构、组织、人员\u0002接收对象时，为境外非法提供国家秘密罪（第111条）与故意泄露国家秘密罪（第398条）构成特别法与一般法关系，优先适用第111条。","k":"","kb":2,"kh":[[36,69]]},{"id":"2014-13","y":2014,"t":"单","s":"下列行为中,应以间谍罪(既遂)定罪处罚的是（ ）。","o":["甲非法获取国家秘密后,出售给外国间谍组织","乙在境外参加外国间谍组织,回国后没来得及从事收集情报工作即被抓获","丙为境外的公司刺探国内公司的相关商业秘密,尚未送出该秘密即被抓获","丁将通过职务行为获得的国家秘密上传到互联网上,该秘密被外国间谍组织获取"],"a":"B","e":"\u0001在境外参加外国间谍组织即构成间谍罪既遂，属于行为犯。\u0002\nA✗ 题干未交待甲明知对方是间谍组织且受其指派，出售非法获取的国家秘密应认定为\u0001为境外非法提供国家秘密罪\u0002\nB✓ 间谍罪既遂：只要\u0001参加间谍组织\u0002即告既遂，是否实际实施搜集情报行为不影响既遂成立\nC✗ 商业秘密不属于国家秘密，刺探商业秘密的行为构成\u0001侵犯商业秘密罪\u0002（不构成间谍罪）\nD✗ 上传互联网仅具泄密故意而非特定向间谍组织提供，应认定为\u0001故意泄露国家秘密罪\u0002","k":"","kb":1,"kh":[[72,94],[110,135]]},{"id":"2020-9","y":2020,"t":"单","s":"下列关于危害国家安全罪的说法中,正确的是（ ）。","o":["危害国家安全罪的主体是一般主体","危害国家安全罪的主观方面可以是过失","对于危害国家安全的犯罪分子都可以判处死刑","对于危害国家安全的犯罪分子应当附加剥夺政治权利"],"a":"D","e":"\u0001危害国家安全罪依法应当附加剥夺政治权利，且主观只能是故意。\u0002\nA✗ 并非全为一般主体，如背叛国家罪、叛逃罪等要求\u0001中国公民\u0002或\u0001国家机关工作人员\u0002等特殊身份\nB✗ 危害国家安全罪全部只能由\u0001故意\u0002构成，不存在过失犯罪\nC✗ 仅部分情节特别恶劣、对国家和人民危害特别严重的犯罪分子（如叛逃罪等除外）方可判处死刑，非“都可以”\nD✓ 《刑法》第56条明文规定：对于危害国家安全的犯罪分子\u0001应当附加剥夺政治权利\u0002\n记法：应当附加剥夺政治权利的两类对象：危害国家安全罪犯 + 死刑、无期徒刑罪犯。","k":"","kb":0,"kh":[[122,145]]},{"id":"2023-18","y":2023,"t":"单","s":"甲拾得一标有“绝密”字样的移动硬盘,破解后发现其中存有大量飞行器照片,便将照片卖给某外国媒体,情节特别严重。经鉴定,上述照片属于国家秘密。甲的行为应认定为","o":["间谍罪","故意泄露国家秘密罪","为境外非法提供国家秘密罪","非法获取国家秘密罪"],"a":"C","e":"\u0001拾得绝密移动硬盘破解后卖给外国媒体，成立为境外非法提供国家秘密罪。\u0002\nA✗ 间谍罪：未参加间谍组织，也未接受间谍组织及其代理人任务\nB✗ 故意泄露国家秘密罪：提供对象为\u0001外国媒体（境外机构）\u0002，应适用危害国家安全罪中的专门罪名\nC✓ 为境外非法提供国家秘密罪：明知硬盘标有“绝密”属国家秘密仍破解并出售给\u0001境外媒体\u0002，完全符合本罪\nD✗ 非法获取国家秘密罪：甲属于\u0001拾得\u0002而非窃取、刺探、收买取得，且后续有向境外非法提供行为，应定第111条","k":"","kb":2,"kh":[[36,69]]},{"id":"2024-13","y":2024,"t":"单","s":"甲定期使用专业照相器材拍摄军港停泊的军舰,并将拍摄的照片发送到某“军迷群”进行炫耀,事后查明,涉事照片中大量绝密级国家秘密被隐藏于“军迷群”中的境外人员获得,甲的行为应认定为（ ）。","o":["间谍罪","故意泄漏国家秘密罪","非法获取国家秘密罪","为境外刺探、非法提供国家秘密罪"],"a":"C","e":"\u0001军迷擅自拍摄军舰发至国内群聊炫耀（无涉外提供故意），成立非法获取国家秘密罪。\u0002\nA✗ 间谍罪：甲未参加间谍组织，也未接受间谍组织或其代理人的指派任务\nB✗ 故意泄露国家秘密罪：通常规制合法知悉/掌管秘密者向外泄露，甲系\u0001非法拍摄窃取\u0002秘密而非因职务知悉\nC✓ 非法获取国家秘密罪：使用专业器材偷拍军港军舰，属于\u0001以窃取、刺探方法非法获取国家秘密\u0002\nD✗ 为境外刺探、非法提供国家秘密罪：甲仅发送至“军迷群”炫耀，主观上\u0001没有为境外刺探或提供给境外人员的故意\u0002\n本案高频易混点：虽然绝密级照片客观上被潜伏在群内的境外人员获取，但行为人主观上\u0001欠缺“为境外”的明知与故意\u0002，根据主客观相统一原则不能认定为危害国家安全犯罪。","k":"","kb":3,"kh":[[24,45]]},{"id":"2025-43","y":2025,"t":"多","s":"与境外机构、组织、个人相勾结实施下列犯罪,依照我国刑法应当从重处罚的有（ ）。","o":["间谍罪","叛逃罪","分裂国家罪","颠覆国家政权罪"],"a":"CD","e":"\u0001与境外相勾结实施分裂国家、颠覆国家政权等罪的，依法从重处罚（间谍罪、叛逃罪本身即涉境外，不适用第106条）。\u0002\nA✗ 间谍罪（第110条）本身即以参加或接受外国间谍组织任务为要件，不在第106条“从重处罚”列举范围之内\nB✗ 叛逃罪（第109条）不在第106条列举的从重处罚罪名之内\nC✓ 分裂国家罪（第103条）：属《刑法》第106条明确列举的与境外勾结\u0001应当从重处罚\u0002之罪\nD✓ 颠覆国家政权罪（第105条）：属《刑法》第106条明确列举的与境外勾结\u0001应当从重处罚\u0002之罪\n记法：106条勾结境外从重三罪条：103分裂、104叛暴、105颠覆（三“内乱”型犯罪）。","k":"","kb":0,"kh":[[10,83]]},{"id":"2026-7","y":2026,"t":"单","s":"甲受境外势力胁迫加入间谍组织,入境后心生悔意,拒绝执行该组织的任务。甲的行为应认定为","o":["不构成犯罪","间谍罪(既遂)","间谍罪(中止)","间谍罪(预备)"],"a":"B","e":"\u0001受胁迫加入间谍组织即已既遂，入境后反悔拒绝执行任务不成立犯罪中止。\u0002\nA✗ 间谍罪不因后续拒绝执行任务而阻却前已完成的“参加间谍组织”行为（被胁迫参加属量刑上的胁从犯评价，而非当然无罪）\nB✓ 间谍罪（既遂）：加入间谍组织之时\u0001构成要件已齐备即告既遂\u0002，既遂之后不存在犯罪中止\nC✗ 犯罪中止只能发生在犯罪过程之中、\u0001既遂以前\u0002，不能出现既遂后再中止\nD✗ 行为人已实际完成“加入间谍组织”的实行行为，超出预备阶段","k":"","kb":1,"kh":[[72,94],[110,135]]}]}]
