<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>法硕（非法学）专业基础课 真题刷题</title>
<style>
:root{--bg:#f5f5f2;--card:#fff;--ink:#1d1d1f;--sub:#6b6b70;--line:#e3e3e0;--acc:#2f6fdb;--ok:#1f9d55;--okbg:#e7f6ec;--bad:#d64545;--badbg:#fdeaea;--warn:#b7791f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}
.wrap{max-width:780px;margin:0 auto;padding:12px 14px 80px}
header{display:flex;align-items:center;gap:10px;margin:4px 0 12px}
header h1{font-size:19px;margin:0;flex:1}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.tab{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:15px;white-space:nowrap;cursor:pointer}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.stats b{display:block;font-size:20px}
.stats span{font-size:12.5px;color:var(--sub)}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px;font-size:17px;font-weight:600;cursor:pointer;margin-top:10px}
.btn.pri{background:var(--acc);color:#fff}
.btn.sec{background:#eef1f6;color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.addwb{display:block;margin:6px 2px 0 auto;background:none;border:0;padding:4px 2px;font-size:13px;color:var(--sub);cursor:pointer}
.addwb:disabled{cursor:default;opacity:.7}
.hint{font-size:13px;color:var(--sub);margin-top:6px}
.unit{display:flex;align-items:center;gap:10px;padding:10px 2px;border-top:1px solid var(--line);cursor:pointer}
.unit:first-child{border-top:0}
.unit .rk{width:26px;color:var(--sub);font-size:13px;text-align:right;flex:none}
.unit .nm{flex:1;min-width:0}
.unit .nm div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unit .meta{font-size:12.5px;color:var(--sub)}
.unit .nm div.meta{white-space:normal}
.bar{height:5px;background:#ececea;border-radius:3px;margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.unit.drop{opacity:.6}
.unit .rs{flex:none;border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:8px;padding:3px 9px;font-size:12.5px;cursor:pointer}
.sw{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--sub);margin:4px 0 8px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.back{border:0;background:none;font-size:15px;color:var(--acc);cursor:pointer;padding:6px 0}
.top .where{flex:1;font-size:13px;color:var(--sub);text-align:right;line-height:1.35}
.tag{display:inline-block;font-size:12.5px;color:var(--sub);background:#f0f0ee;border-radius:6px;padding:1px 8px;margin-right:6px}
.tag.rev{background:#fff4e0;color:var(--warn)}
.stem{font-size:18px;margin:10px 0 14px;line-height:1.7;white-space:pre-line}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:11px 13px;margin-bottom:9px;font-size:16.5px;cursor:pointer;color:var(--ink)}
.opt .L{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid #c9c9c6;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600}
.opt.sel{border-color:var(--acc)}
.opt>span:nth-child(2){flex:1;min-width:0}
.oe{display:block;margin-top:5px;font-size:14.5px;line-height:1.6;color:#55555a}
.oe b{color:var(--ink)}
@media (max-width:899px){.oe{font-size:13.5px}}
.opt.sel .L{background:var(--acc);border-color:var(--acc);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ok .L{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt.bad .L{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.miss{border-color:var(--ok);background:var(--okbg)}
.opt.miss .L{border-color:var(--ok);color:var(--ok)}
.judge{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.judge .opt{justify-content:center;font-size:18px;font-weight:600}
.res{border-radius:12px;padding:10px 14px;margin:6px 0 10px;font-weight:600}
.res.ok{background:var(--okbg);color:var(--ok)}
.res.bad{background:var(--badbg);color:var(--bad)}
.res small{font-weight:400;color:var(--sub);display:block}
.box{border-left:3px solid var(--line);padding:2px 0 2px 12px;margin:10px 0;font-size:15px;white-space:pre-wrap;word-break:break-word}
.box b{font-weight:700;color:var(--ink)}
.xp{margin:3px 0}
.xo{display:flex;align-items:flex-start;gap:9px;margin:8px 0}
.xk{flex:none;width:22px;height:22px;margin-top:2px;border-radius:50%;font-size:12.5px;font-weight:700;line-height:22px;text-align:center;color:#fff;background:var(--bad)}
.xo.ok .xk{background:var(--ok)}
.xt{flex:1;min-width:0}
.xo.hit{background:var(--badbg);border:1.5px solid var(--bad);border-radius:8px;padding:4px 7px;margin-left:-8px;margin-right:-8px}
.xo.hit.miss{background:none;border-style:dashed}
.xg{flex:none;align-self:center;font-size:12.5px;font-weight:700;color:var(--bad);background:var(--badbg);border-radius:6px;padding:0 7px}
.xm{margin:4px 0 8px;padding:7px 11px;background:#f4f5f7;border-radius:8px}
.xl{font-weight:700;color:var(--warn);margin-right:8px}
.box h4{margin:0 0 2px;font-size:13px;color:var(--sub);font-weight:600}
.box.book{border-color:#9db8e8}
.box.note{border-color:#e8c48a}
.empty{text-align:center;color:var(--sub);padding:30px 0}
.warnbar{background:#fff4e0;color:#7a5410;border-radius:10px;padding:8px 12px;font-size:13.5px;margin-bottom:10px}
textarea{width:100%;height:90px;font-size:12px;border:1px solid var(--line);border-radius:8px;padding:8px}
.foot{display:flex;gap:8px;flex-wrap:wrap}
.foot button{flex:1;min-width:120px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px;font-size:14px;cursor:pointer}
.wb{padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.wb:first-child{border-top:0}
.wb .a{color:var(--ok);font-weight:600}

.kbd{font-size:12px;color:var(--sub);text-align:center;margin-top:8px}
@media (max-width:520px){.kbd{display:none}.stem{font-size:17px}}
@media (max-width:899px){.quizpg{padding-top:3vh}body{font-size:15px}header h1{font-size:18px}.stem{font-size:16px}.opt{font-size:15.5px}.opt .L{font-size:13px}.judge .opt{font-size:17px}.btn{font-size:16px}.box{font-size:14px}.wb{font-size:14px}.tab{font-size:14px}.back{font-size:14px}.stats b{font-size:19px}}
@media (min-width:900px){
.wrap{max-width:960px;padding-top:20px}
body{font-size:17px}
header h1{font-size:22px}
.quizpg{padding-top:12vh}
.quizpg .card{padding:24px 30px}
.stem{font-size:22px;margin:12px 0 20px}
.opt{font-size:19px;padding:14px 18px;margin-bottom:12px;gap:14px}
.opt .L{width:30px;height:30px;font-size:15px}
.judge .opt{font-size:21px}
.btn{font-size:18px;padding:15px}
.res{font-size:18px}
.box{font-size:16.5px}
.tag{font-size:13.5px}
.top .where{font-size:14px}
.back{font-size:16px}
.unit .meta{font-size:13.5px}
.stats b{font-size:24px}.stats span{font-size:14px}
}
</style>
</head>

[{"sub":"民法","name":"合同通则","w":3.6,"L":68,"qs":[{"id":"2005-44","y":2005,"t":"单","s":"下列选项中,乙的哪种行为构成我国《合同法》规定的承诺（ ）。","o":["甲向丙发出要约,乙得知后向甲表示接受甲在要约中规定的条件","甲向乙发出要约,要求乙在接到要约后七日内给予答复,逾期未答复则视为承诺。乙未按期答复","甲在报纸上刊登广告:本公司有圣诞礼物出售,欲购者请速与本公司联系。乙打电话给甲订购若干","甲在报纸上刊登附有价目表的广告称:本书店新到图书若干,欲购者可在一个月内汇款,款到寄书。乙汇款给甲"],"a":"D","e":"\u0001书店在广告中具体列明新到图书价目、1个月内汇款及款到寄书条件构成要约，乙直接依约汇款属于以行为方式作出的有效承诺。\u0002\nA✗ 甲发出要约的受要约人是特定人丙，非受要约人乙向甲表示接受不构成承诺，而是乙向甲发出的新要约。\nB✗ 除法律规定、事先约定或交易习惯外，要约人单方限定“逾期未答复视为承诺”对乙不发生承诺约束力。\nC✗ 广告只泛称“有圣诞礼物出售，请速联系”，未载明品名、价格和数量，内容不具体确定，仅构成要约邀请，乙打电话订购才是要约。\nD✓ 甲刊登的广告已明确书目价款表及一个月汇款寄书交货条件，内容具体确定、经承诺即受约束，构成向不特定人发出的要约；乙在期内汇款，以履约行为完成承诺。","k":"","kb":129,"kh":[[77,96]]},{"id":"2005-48","y":2005,"t":"单","s":"甲、乙双方连续几年订有买卖“交流电机”的合同。有一次签定合同时,在“标的物”一栏只写了“电机”两字。当时正值交流电机热销,而甲方供不应求,故甲方就以直流电机交货。就民法的基本原则而言,甲方违反了（ ）。","o":["自愿原则","诚实信用原则","禁止权利滥用原则","公序良俗原则"],"a":"B","e":"\u0001甲、乙长年连续交易交流电机，此次简写“电机”按交易习惯应指交流电机；甲乘交流电机热销私改直流电机交货，违反诚实信用原则。\u0002\nA✗ 自愿原则强调缔约与条款自主决定，甲方未违背缔约自愿本身，而是违背交易诚信履行义务。\nB✓ 依据《民法典》第7条及第509条，当事人应遵循诚信原则并依据合同交易习惯履行义务；甲趁机偷换产品类别牟利，典型违背诚实信用原则。\nC✗ 甲属于不诚信违约履约，而非在合法行权时故意损人利己的禁止权利滥用问题。\nD✗ 调换交货电机型号未触及公共道德底线或社会公共秩序。","k":"","kb":131,"kh":[[76,110]]},{"id":"2006-32","y":2006,"t":"单","s":"甲公司欠乙公司 500 万元,后甲公司被乙公司兼并,二者之间的债务关系因此消灭。导致这一债的关系消灭的法律事实是（ ）。","o":["混同","免除","抵销","解除"],"a":"A","e":"\u0001甲公司被乙公司兼并合并，甲公司所负500万元债务的债权人与债务人合归于乙公司一人，债的关系因混同而消灭。\u0002\nA✓ 债权和债务同归于同一民事主体（企业合并概括承受），自己不能对自己履行债务，债权债务因混同而消灭。\nB✗ 免除是债权人单方放弃债权的意思表示，本案并非乙公司主动抛弃债权。\nC✗ 抵销须双方互相负有到期同种类债务，题干仅单方欠债。\nD✗ 解除针对尚未履行完毕的合同效力消灭，不适用于公司兼并概括承受债之消灭。","k":"","kb":133,"kh":[[47,75]]},{"id":"2006-37","y":2006,"t":"单","s":"根据合同法规定,标的物提存后,毁损、灭失的风险（ ）。","o":["由债权人承担","由债务人承担","由债权人和债务人共同承担","由提存机关承担"],"a":"A","e":"\u0001标的物依法提存后，债务人的清偿义务即消灭，标的物毁损、灭失的风险转由债权人承担。\u0002\nA✓ 依《民法典》第573条，标的物提存后，毁损、灭失的风险由债权人承担（提存期间孳息亦归债权人）。\nB✗ 债务人完成依法提存即等效于完成清偿，不再承担意外毁损灭失风险。\nC✗ 风险全部移转给债权人，并非共同分担。\nD✗ 仅在提存机关存在保管过错致损时才赔损，一般不可归责之毁损灭失风险由债权人承担。","k":"","kb":133,"kh":[[490,510]]},{"id":"2006-41","y":2006,"t":"单","s":"当事人就履行地点约定不明确,如果是给付货币,履行地点应当是（ ）。","o":["给付一方所在地","接受给付一方所在地","合同签订地","合同标的物所在地"],"a":"B","e":"\u0001当事人对合同履行地点约定不明且协议补充不能的，给付货币的一方应在接受货币一方所在地履行。\u0002\nA✗ 交付普通动产等其他标的才一般在履行义务一方所在地，给付货币恰好相反。\nB✓ 依《民法典》第511条第3项（原《合同法》第62条第3项），给付货币的，在接受货币一方所在地履行。\nC✗ 合同签订地不是法定履行地补充规则的确定标准。\nD✗ 不动产才在不动产所在地，金钱给付应前往收款方所在地。","k":"","kb":131,"kh":[[119,133]]},{"id":"2006-51","y":2006,"t":"多","s":"关于合同履行的下列说法中,正确的是（ ）。","o":["履行期限不明确的，债务人可以随时履行，但应当给对方必要的准备时间","履行方式不明确的,按照有利于实现合同目的的方式履行","履行费用的负担不明确的,由接受履行一方负担","价款不明确的,按照卖方确定的价款履行"],"a":"AB","e":"\u0001合同条款不明时，履行期限不明的债务人可随时履行但应给必要准备时间；履行方式不明的按有利于实现合同目的的方式履行。\u0002\nA✓ 依《民法典》第511条第4项，履行期限不明确的，债务人可随时履行，债权人也可随时请求履行，但均应当给对方必要的准备时间。\nB✓ 依《民法典》第511条第5项，履行方式不明确的，按照有利于实现合同目的的方式履行。\nC✗ 履行费用的负担不明确的，依法应当由“履行义务一方”负担（因债权人原因增加的履行费用由债权人负担），并非由接受履行一方负担。\nD✗ 价款或报酬不明确的，按照订立合同时履行地的市场价格履行（执行政府定价/指导价的从其规定），绝非听凭卖方单方面随意定价。","k":"","kb":131,"kh":[[135,176],[224,239]]},{"id":"2007-41","y":2007,"t":"单","s":"甲与乙签订一份货款为人民币 50 万元的买卖合同,并依约定交付给乙定金人民币 15 万元。后乙违约没有履行该合同。乙应返还给甲人民币 （ ）。","o":["20 万元","25 万元","30 万元","35 万元"],"a":"B","e":"\u0001定金上限为主合同标的额的20%（50万×20%=10万），超额5万作普通预付款；收受定金方乙违约应双倍返还有效定金20万再加退还超额5万，共25万元。\u0002\nA✗ 20万元仅是有效定金10万元的双倍返还额，漏算了超额部分5万元作为普通预付款必须原额退还。\nB✓ 50万元的20%为10万元有效定金，另外5万元不发生定金效力仅属预付款。乙违约应向甲双倍返还有效定金20万元+原数退还超额预付款5万元=25万元。\nC✗ 定金15万元全额双倍返还即30万元，错误地没有核减超过20%法定上限的部分。\nD✗ 15万元双倍加5万元之误算毫无依据。","k":"","kb":134,"kh":[[367,445]]},{"id":"2008-43","y":2008,"t":"单","s":"下列行为中属于要约的是（ ）。","o":["投标","发布拍卖公告","寄送价目表","刊登招股说明书"],"a":"A","e":"\u0001投标书包含具体标的价格、工期及施工承诺，一经中标即成立合同，属于要约；拍卖公告、寄送价目表、招股说明书均属要约邀请。\u0002\nA✓ 在招投标流程中，招标公告是邀约邀请，投标人向招标人递交投标文件属于内容具体确定、愿受中标拘束的“要约”。\nB✗ 拍卖公告意在邀请竞买人出价竞拍，属于要约邀请。\nC✗ 企业对外寄送商品价目表旨在邀请客户下单，属于要约邀请。\nD✗ 刊登招股说明书供公众了解公司状况并认购，属于法定典型要约邀请。","k":"","kb":129,"kh":[[74,76],[173,195]]},{"id":"2008-50","y":2008,"t":"单","s":"甲公司与乙农场签订一份购销合同,由乙农场供应甲公司一批奶牛。乙农场将部分患有传染病的奶牛交付给甲公司,致使甲公司饲养的其他奶牛大量染病。根据合同法规定,甲公司（ ）。","o":["只能要求乙农场承担违约责任","只能要求乙农场承担侵权责任","有权要求乙农场同时承担违约责任与侵权责任","有权在违约责任与侵权责任中选择其一要求乙农场承担"],"a":"D","e":"\u0001乙农场交付病牛致甲牛群染病，既违反合同质量瑕疵担保义务构成违约，又侵害甲原有健康牛群财产权益构成侵权，甲有权择一请求承担违约或侵权责任。\u0002\nA✗ 违约同时侵害固有财产利益发生责任竞合，甲并非“只能”主张违约。\nB✗ 甲基于买卖合同也可以主张违约赔偿，并非“只能”主张侵权。\nC✗ 依《民法典》第186条责任竞合制度，受损害方仅得“选择”其一主张，不能同时获双重赔付。\nD✓ 甲有权依据自身举证便利与赔偿范围考量，在违约责任与侵权责任中择一要求乙农场承担。","k":"","kb":135,"kh":[[357,368],[420,451]]},{"id":"2009-34","y":2009,"t":"单","s":"某医院与危重病人家属签订医疗协议。协议对双方的权利义务进行了约定,其中有一免责条款:“在治疗过程中, 患者发生任何伤亡情况,医院概不负责。”根据合同法规定,该协议的效力为（ ）。","o":["无效","有效","效力待定","部分有效、部分无效"],"a":"D","e":"\u0001医院格式/免责条款约定“患者发生任何伤亡概不负责”违反《民法典》第506条强制性规定无效，但其余合法医疗服务条款仍然有效。\u0002\nA✗ 免责条款自身无效并不必然拖垮整份有效医疗协议的其余权利义务条款。\nB✗ 免除造成对方人身伤害的免责条款属法定绝对无效，该部分不能有效。\nC✗ 绝对无效条款无需等待追认，非效力待定。\nD✓ 依《民法典》第506条及第156条，造成对方人身伤害的免责条款无效，但合同部分无效不影响其他部分效力的，其他部分仍然有效，即部分有效、部分无效。","k":"","kb":130,"kh":[[165,193],[277,308]]},{"id":"2009-41","y":2009,"t":"单","s":"某旅游者与旅行社签订一份由旅行社提供的旅游合同。在该合同履行过程中,旅行社和旅游者对合同中“名胜古迹”含义的理解发生分歧。旅游者认为某建筑属于名胜古迹,旅行社应当安排游览,而旅行社持相反观点。根据合同法规定 , 对此条款的解释应按照（ ）。","o":["通常理解进行解释","公平原则进行解释","旅游习惯进行解释","对旅行社不利原则进行解释"],"a":"D","e":"\u0001旅行社提供的旅游格式合同中“名胜古迹”发生两种以上解释分歧，依法应当作出不利于格式条款提供方（旅行社）的解释。\u0002\nA✗ 《民法典》第498条规定先按通常理解解释，仅当“有两种以上解释的”时作出不利于提供方解释；本题双方存在合理分歧即两种以上解释且旅行社为提供方，2009真题直接考查不利解释原则（选不利于旅行社一方）。\nB✗ 公平原则是民法基本原则而非格式条款争议的专属裁判顺位规则。\nC✗ 旅游习惯在条文解释分歧时让位于法定的不利于格式条款提供方解释规则。\nD✓ 格式条款发生理解争议存在两种以上解释时，应当作出不利于格式条款提供方（即旅行社）的解释。","k":"","kb":130,"kh":[[373,439]]},{"id":"2009-42","y":2009,"t":"单","s":"甲、乙签订了一份货款为1千万元的钢材供应合同。甲为供方，乙为需方。合同约定，乙预付200万元定金，违约金为合同总额的5%。事后，乙交付了定金。后甲违约，对此（ ）。","o":["乙只能要求适用定金条款","乙只能要求适用违约金条款","乙可以选择适用违约金条款或者定金条款","乙可以要求违约金条款和定金条款同时适用"],"a":"C","e":"\u0001当事人既约定违约金又约定定金的，一方违约时，对方可以选择适用违约金或者定金条款，不得同时并罚。\u0002\nA✗ 乙不限于只能适用定金条款（如5%违约金50万低于200万超限定金上限200万双倍，但法理上仍享有择一选择权）。\nB✗ 乙也可以选择适用定金条款（注意本题200万刚好等于1000万货款的20%，定金条款下可得双倍返还400万即额外赔200万，反比5%的50万违约金更优！）。\nC✓ 依《民法典》第588条第1款，违约金与定金不得并用，守约方乙享有选择适用违约金条款或者定金条款的权利。\nD✗ 违约金条款与定金条款不能同时叠加适用。","k":"","kb":134,"kh":[[446,481]]},{"id":"2009-53","y":2009,"t":"多","s":"甲商场与乙公司签订了购买800辆自行车的书面合同，合同约定：乙可分三次发货，甲商场见货付款。第一批200辆自行车到货后，甲商场见销路不好，便以书面形式向乙公司提出取消后两批货物订购，乙公司以书面形式表示同意，本案中涉及的民事法律事实有（ ）。","o":["订立合同的行为","履行合同的行为","变更合同的行为","解除合同的行为"],"a":"ABD","e":"\u0001甲乙订立买卖合同、乙按约交付第一批200辆车、甲提议并经乙书面同意取消后两批货，分别构成订立合同、履行合同和协议解除合同。\u0002\nA✓ 双方签署购买800辆自行车的书面协议构成订立合同的法律行为。\nB✓ 乙公司依约分批发出第一批200辆自行车交付甲商场构成履行合同的行为。\nC✗ 双方取消尚未履行的后两批货物系对剩余合同部分协商终止消灭，在学理与真题分类中定性为部分解除（协议解除）而非继续维系改造内容的“变更”。\nD✓ 甲提议取消后两批订购且乙书面同意，属于双方协商一致终止未履行合同关系，构成解除合同的行为。","k":"","kb":133,"kh":[[312,332]]},{"id":"2010-40","y":2010,"t":"单","s":"债务人将其债务转移给第三人的生效条件之一是（ ）。","o":["通知债权人","债务人充当保证人","取得债权人的同意","向债权人提供抵押物"],"a":"C","e":"\u0001债务人将债务的全部或者部分转移给第三人的，应当经债权人同意方才对债权人发生效力（区别于债权转让仅需通知）。\u0002\nA✗ 仅通知债权人不足以发生债务转移，否则债务人随便转给毫无偿债能力的人将严重损害债权实现。\nB✗ 原债务人无须强制充当保证人，仅须债权人同意。\nC✓ 依《民法典》第551条，债务人将债务转移给第三人的，应当经债权人同意。\nD✗ 提供抵押物并非法定债务转移生效的必要条件。","k":"","kb":132,"kh":[[516,531]]},{"id":"2010-41","y":2010,"t":"单","s":"在以招标方式订立合同时,下列行为属于承诺的是（ ）。","o":["投标","定标","开标","招标"],"a":"B","e":"\u0001在招标投标缔约程序里，招标属于要约邀请，投标属于要约，定标（发出中标通知书）属于承诺。\u0002\nA✗ 投标人递交标书提出具体价格方案请求中标，属于要约。\nB✓ 招标人确定中标人即定标（发出中标通知书）表明接受特定投标人的要约条件，属于承诺，中标通知书到达时合同成立。\nC✗ 开标只是公开开启查看各投标文件内容的工作程序步骤，尚不构成同意缔约的承诺意思表示。\nD✗ 招标人发布招标公告或招标文件意在征集多家报价竞标，属于要约邀请。\n记法：招投标三部曲：招标（要约邀请）→ 投标（要约）→ 定标/发中标通知书（承诺）。","k":"","kb":129,"kh":[[74,76]]},{"id":"2010-43","y":2010,"t":"单","s":"甲与乙订立买卖合同,约定甲于10月10日交货,乙在收货后10天内付款。交货期届满时,甲发现乙有转移资金以逃避债务的行为。对此,甲可依法行使（ ）。","o":["先履行抗辩权","同时履行抗辩权","先诉抗辩权","不安抗辩权"],"a":"D","e":"\u0001作为先交货一方的甲在履行期届满时发现后付款方乙有转移资金逃避债务情形，可依法行使不安抗辩权中止交货。\u0002\nA✗ 先履行抗辩权是“后履行一方”对抗先履行一方违约的权利；甲恰是约定先交货的一方。\nB✗ 同时履行抗辩权适用于双方无先后履行顺序的合同；本案明确先交货后10日付款，有先后顺序。\nC✗ 先诉抗辩权专属于一般保证人，与买卖双方无关。\nD✓ 甲系先履行义务方，乙存在转移资产以逃避债务等可能丧失履约能力的确切危及债权情形，甲可依《民法典》第527条行使不安抗辩权暂时中止交货并及时通知乙。","k":"","kb":131,"kh":[[378,416]]},{"id":"2011-31","y":2011,"t":"单","s":"根据《合同法》的规定，双务合同履行中的抗辩权包括（ ）。","o":["同时履行抗辩权、先履行抗辩权和不安抗辩权","同时履行抗辩权、先履行抗辩权和先诉抗辩权","后履行抗辩权、合同无效抗辩权和不安抗辩权","后履行抗辩权、合同消灭抗辩权和先诉抗辩权"],"a":"A","e":"\u0001双务合同履行中的三大抗辩权为同时履行抗辩权、先履行抗辩权和不安抗辩权；先诉抗辩权是一般保证人专属抗辩权。\u0002\nA✓ 我国《民法典》第525-527条（原《合同法》第66-68条）完整确立了上述三项双务合同履行抗辩权。\nB✗ 先诉抗辩权源于《民法典》第687条一般保证制度，不属于双务合同履行抗辩权。\nC✗ 我国现行民法通说仅设同时履行、先履行和不安抗辩权，不设独立的“后履行抗辩权”与“合同无效抗辩权”。\nD✗ 同上，名称混淆且混入保证先诉抗辩权。","k":"","kb":131,"kh":[[299,329],[340,346],[378,383],[417,447]]},{"id":"2011-48","y":2011,"t":"多","s":"根据法律规定,定金的种类包括（ ）。","o":["立约定金","解约定金","违约定金","守约定金"],"a":"ABC","e":"\u0001我国现行民法理论与司法实务承认立约定金、成约定金、证约定金、解约定金与违约定金五类，并无所谓“守约定金”。\u0002\nA✓ 立约定金用于担保将来正式订立本约合同（拒绝订立本约可适用定金罚则）。\nB✓ 解约定金指当事人保留通过抛弃定金或双倍返还来单方解除合同之权利的定金。\nC✓ 违约定金是最常见的定金类型，一方不履行债务致使不能实现合同目的时适用定金罚则。\nD✗ 法律与学理上根本不存在“守约定金”这一分类。","k":"","kb":134,"kh":[[329,367]]},{"id":"2012-30","y":2012,"t":"单","s":"2009年8月5日,甲公司向乙公司发出订购图书的订单,订单中详细列明了订购数量、交货日期等,并要求乙公司在接到该订单之日起3日内向甲公司发出确认函。乙公司8 月6日接到订单,于8 月10 日向甲公司发出确认函,同时寄出该批图书。甲公司收到图书后,拒绝接受。关于本案的以下表述,正确的是（ ）。","o":["甲公司向乙公司发出订单的行为属于要约邀请","乙公司向甲公司发出确认函的行为属于承诺","乙公司向甲公司发出确认函的行为属于要约","乙公司向甲公司寄出图书的行为属于履行合同"],"a":"C","e":"\u0001甲的订单限定了3天承诺期限，乙超期于8月10日方才发确认函并寄书，属逾期承诺；甲拒绝接受，故乙的确认函原则上只构成新要约。\u0002\nA✗ 订单已写明订购数量、交货日期及答复期限等具体内容，意经乙确认即受拘束，属于内容明确的要约而非要约邀请。\nB✗ 甲于8月6日收到，3日期限至8月9日届满，乙8月10日发出已属逾期承诺；要约人甲未及时通知该承诺有效，依《民法典》第486条逾期承诺为新要约，不产生承诺效力。\nC✓ 超过承诺期限发出确认函原则上不构成有效承诺，仅视为受要约人向原要约人发出的新要约；现甲收货拒绝接受，新要约未获承诺，合同不成立。\nD✗ 双方合同尚未成立，乙公司寄出图书仅相当于以实际履行方式进一步表达订约要约，不构成有效合同履行。","k":"","kb":129,"kh":[[331,359]]},{"id":"2012-49","y":2012,"t":"多","s":"甲、乙互负债务,根据《合同法》的规定,双方债务法定抵销的条件包括（ ）。","o":["双方协商一致","双方所负债务数额相等","双方的给付为同种类、同品质","双方的债务均届清偿期"],"a":"CD","e":"\u0001法定抵销要求双方互负到期债务（均届清偿期）且给付标的物种类、品质相同；无需双方协商一致或数额绝对相等。\u0002\nA✗ 法定抵销属于形成权，只要符合法定条件，一方单方通知到达对方即可发生抵销效力，无须双方另行协商一致（协商一致乃“合意抵销”）。\nB✗ 双方互负债务数额无需相等，不等额时在等额范围内消灭，差额部分仍继续存在。\nC✓ 依《民法典》第568条，法定抵销要求双方债务标的物种类、品质相同（如均为同等币种货币或同标准现货）。\nD✓ 法定抵销原则上要求双方互负的债务均已届清偿期（到期）。","k":"","kb":133,"kh":[[165,220]]},{"id":"2013-31","y":2013,"t":"单","s":"下列协议中,应由我国合同法调整的是（ ）。","o":["甲与乙签订的收养协议","甲与乙离婚时签订的子女抚养协议","甲行政机关与公务员签订的廉政协议","甲村委会与本村村民签订的土地承包经营权协议"],"a":"D","e":"\u0001土地承包经营权协议属于确定民事土地承包经营财产权利义务的民事合同，可由合同法及农村土地承包法调整；收养、离婚抚养等身份协议与行政廉政协议不直接适用旧《合同法》。\u0002\nA✗ 收养协议涉及亲属身份关系的创设，在原《合同法》第2条第2款明文排除适用，归婚姻家庭/收养专门法调整。\nB✗ 离婚子女抚养协议涉及身份关系与法定抚养责任，不直接适用原《合同法》。\nC✗ 行政机关与公务员签订的廉政协议属于内部行政管理公法协议，并非平等主体间民事合同。\nD✓ 村委会作为发包方与本村村民就集体农地发包达成的土地承包经营权协议系平等主体民事合同，纳入民事合同规范调整范畴。\n【新法提示】现行《民法典》第464条第2款适度微调：婚姻、收养、监护等有关身份关系的协议，优先适用有关该身份关系的法律规定；没有规定的，可以根据其性质参照适用合同编规定。","k":"","kb":135,"kh":[[145,206]]},{"id":"2013-32","y":2013,"t":"单","s":"下列关于债的提存的说法中,符合我国合同法规定的是（ ）。","o":["债权人无正当理由拒绝受领标的物是提存的条件之一","提存物在提存期间产生的擎息归提存人所有","债权人超过法定期限不领取提存物,提存物归债务人所有","提存期间,提存物毁损灭失的风险由提存机关承担"],"a":"A","e":"\u0001债权人无正当理由拒绝受领标的物属于债务人依法可以提存的情形之一；提存后孳息与风险归债权人，逾期5年不领归国家。\u0002\nA✓ 依《民法典》第570条，债权人无正当理由拒绝受领、下落不明或死亡未定继承人等致难以履行的，债务人可将标的物提存。\nB✗ 提存期间提存物所产生的孳息归债权人所有，而非归提存人（债务人）。\nC✗ 债权人领取提存物的权利自提存之日起5年内不行使而消灭，提存物扣除提存费用后归国家所有，而非退归原债务人。\nD✗ 提存后标的物毁损灭失的意外风险由债权人承担，非由提存机关承担。","k":"","kb":133,"kh":[[470,544]]},{"id":"2013-33","y":2013,"t":"单","s":"根据我国《合同法》的规定,以书面形式作出承诺的,承诺的生效时间是（ ）。","o":["承诺人作出承诺时","承诺通知发出时","承诺通知到达要约人时","要约人了解承诺时"],"a":"C","e":"\u0001我国合同法对书面形式或非对话方式作出的承诺统一采到达主义，承诺通知到达要约人时生效。\u0002\nA✗ 单方作出尚未发出或未到达对方时不发生承诺生效效力。\nB✗ 发信主义不被我国民法一般规则采用。\nC✓ 依《民法典》第484条及第137条，以非对话方式作出的承诺通知到达要约人时生效，即合同同时成立。\nD✗ 承诺通知只要送达要约人可控制范围（如邮箱、前台）即告到达生效，不以要约人实际拆阅了解为前提。","k":"","kb":129,"kh":[[360,379]]},{"id":"2014-29","y":2014,"t":"单","s":"下列选项中,不属于债权特征的是（ ）。","o":["平等性","相容性","任意性","永久性"],"a":"D","e":"\u0001债权具有平等性、相容性、任意性与相对性，并在一定存续期限内有效，不具有物权那种永续存在之“永久性”。\u0002\nA✗ 平等性指同一债务人身上的多个普通债权不论发生先后均居平等受偿地位，是债权重要特征。\nB✗ 相容性指在同一标的物上可同时成立数个内容相同的债权合同（一物数卖均可有效），不同于物权排他性。\nC✗ 任意性指债权内容多由当事人意思自治自由约定，不必受物权法定约束。\nD✓ 所有权等物权具有永久性，而债权有履行期限且受诉讼时效规制，终归以清偿而消灭，不具有永久性。","k":"","kb":135,"kh":[[66,77],[119,145]]},{"id":"2014-49","y":2014,"t":"多","s":"甲对乙享有债权,乙对丙享有债权。因乙未清偿到期债务,甲欲行使代位权。甲提起代位权诉讼应具备的条件包括（ ）。","o":["乙对丙的债权合法","乙对丙的债权已经到期","乙对丙的债权不属于专属性债权","乙对丙未提起诉讼或者申请仲裁"],"a":"ABCD","e":"\u0001甲提起代位权诉讼须满足乙对丙的债权合法、已经到期、非专属性债权及乙怠于行使（未诉未仲）等全部法定条件。\u0002\nA✓ 次债务关系即乙对丙的债权须合法有效存在。\nB✓ 乙对丙的到期债权须已经届至履行期，甲方可代位请求丙清偿。\nC✓ 乙对丙的债权不得是养老金、抚恤金、人身损害赔偿等专属于债务人自身的债权。\nD✓ 乙既未以诉讼方式也未以仲裁方式向其债务人丙主张该到期债权，构成法定“怠于行使”。","k":"","kb":132,"kh":[[60,111]]},{"id":"2015-32","y":2015,"t":"单","s":"甲向某电脑公司购买一批电脑送给母校。甲指示电脑公司将电脑交给学校,并将订货情况通知了学校。后电脑公司委托某快递公司将电脑运至学校,运输过程中两台电脑毁坏。下列选项中,正确的是（ ）。","o":["甲有权要求电脑公司承担违约责任","甲有权要求快递公司承担违约责任","学校有权要求电脑公司承担侵权责任","学校有权要求快递公司承担侵权责任"],"a":"A","e":"\u0001甲购电脑指示卖方电脑公司向母校交付，快递途毁系卖家委托承运人过错造成；依合同相对性，买受人甲有权请求合同方电脑公司担违约责任。\u0002\nA✓ 甲与电脑公司是买卖合同当事人，交付的电脑中两台毁损，卖方履行不符合约定，甲有权请求电脑公司承担违约责任（后电脑公司可再依运输合同找快递追偿）。\nB✗ 运输合同系电脑公司与快递公司订立，甲并非运输合同当事人，依合同相对性无权直接请求快递公司违约赔偿。\nC✗ 学校既非买卖合同缔约方（仅是受指示收货第三人，且电脑未送达交付学校前所有权尚未移转至学校），故无权向电脑公司主张侵权。\nD✗ 尚未现实受领交付取得电脑所有权的受赠母校，不能跳过所有权人甲与托运人电脑公司直接对快递公司索赔侵权。","k":"","kb":131,"kh":[[476,518]]},{"id":"2015-33","y":2015,"t":"单","s":"甲将住房出租给乙。签订合同前乙来看房,发现室内有很浓的装修气味。甲告诉乙,开开窗,过几天味道就没了。乙住了两个月后,气味依然很浓。经检测,该房屋有害气体严重超标。对此,乙（ ）。","o":["无权主张任何权利","有权解除合同","有权请求确认合同无效","有权要求甲承担侵权责任"],"a":"B","e":"\u0001出租屋有害气体严重超标经两月仍不能消散，严重危害承租人健康致居住合同目的落空，依《民法典》第731条及第563条乙有权解除合同。\u0002\nA✗ 租赁物危及承租人安全或者健康的，即使承租人订立合同时明知该租赁物质量不合格，仍然可以随时解除合同。\nB✓ 出租房屋空气严重污染危及人体健康，导致乙无法正常安居，依法享有单方解除权。\nC✗ 房屋质量超标不触发合同自始无效（不违背强制效力规定），可通过法定解除及时止损并追责。\nD✗ 题干仅显示检测到气体超标而尚未造成甲具体医疗人身损害后果，核心直接有效救济为依法行使法定解除权（若有损害方可主张违约或侵权）。","k":"","kb":133,"kh":[[281,292]]},{"id":"2016-39","y":2016,"t":"单","s":"【案情】2014年3月12日，甲、乙签订房屋买卖合同，并于当日办理了预告登记。合同约定，乙于3月15日支付全款，双方于3月30日前办理过户手续。乙依约支付房款后，因甲出差双方一直未办理过户手续。7月10日甲又将该房屋卖给丙并办理了过户手续。\n关于两份房屋买卖合同的效力,下列选项正确的是（ ）。","o":["甲、乙之间的合同和甲、丙之间的合同均有效","甲、乙之间的合同有效,甲、丙之间的合同无效","甲、乙之间的合同无效,甲、丙之间的合同有效","甲、乙之间的合同有效,甲、丙之间的合同效力待定"],"a":"A","e":"\u0001依据物权变动与合同效力的区分原则，即便一房二卖中后买受人丙抢先办理过户登记，甲乙和甲丙两份房屋买卖合同只要意思真实不违法均合法有效。\u0002\nA✓ 两份房屋买卖合同本身均属当事人真实意思表示，不因随后甲将房屋过户给丙而导致早先订立的甲乙合同失效（甲仅对乙承担履行不能之违约责任）。\nB✗ 甲丙买卖合同是后手签约且合法过户，只要不涉恶意串通损害，同样合法有效。\nC✗ 甲乙合同成立有效，虽已办预告登记但后因90日未登记失效，亦不反向使甲乙买卖合同变成自始无效。\nD✗ 一房二卖时卖方在再签甲丙合同之时还是登记所有权人，即使在《民法典》第597条下无权处分亦不使买卖合同效力待定。","k":"","kb":131,"kh":[[826,860]]},{"id":"2017-32","y":2017,"t":"单","s":"甲公司于4月24日通知乙公司急需货物10 吨,乙公司遂于4月25日按双方之间的交易惯例发货。4月26日甲公司又通知乙公司不需要该批货物。对此,下列说法正确的是（ ）。","o":["乙公司的发货行为构成要约","甲公司4月24日的通知构成要约邀请","甲公司4月26日的通知构成要约的撤销","甲公司、乙公司之间的合同于4月25日成立"],"a":"D","e":"\u0001甲公司4月24日求购通知属要约，长期交易伙伴乙公司4月25日按惯例直接发货构成以行为方式作出的承诺，合同于4月25日成立；次日撤销通知已迟。\u0002\nA✗ 乙公司是受要约人，按照双方长期交易习惯直接以履行（发货）行为作出的正是承诺，而非新要约。\nB✗ 双方长期供货对货物规格价款均已明确，甲通知“急需货物10吨”构成内容具体确定的要约。\nC✗ 要约的撤销通知必须在受要约人作出承诺通知或以行为作出承诺“之前”到达，4月25日乙已发货使承诺生效合同成立，4月26日通知已无法撤销。\nD✓ 依《民法典》第480、483、484条，根据交易习惯可以通过行为作出承诺的，承诺自4月25日乙实施发货行为时生效，合同当日成立。","k":"","kb":129,"kh":[[142,171]]},{"id":"2018-26","y":2018,"t":"单","s":"甲公司欠乙公司货款50 万元,乙公司欠甲公司租金50 万元,后甲公司被乙公司兼并,甲公司与乙公司之间的债的消灭的原因是（ ）。","o":["混同","免除","抵销","清偿"],"a":"A","e":"\u0001甲、乙两公司互负债务后，甲公司被乙公司吸收兼并，全部债权债务概括归于同一法人乙公司，发生债的混同而消灭。\u0002\nA✓ 相互享有债权债务的两个法人合并为一个法人主体，债权与债务同归一人，构成债的混同而归于消灭。\nB✗ 并未发生债权人单独抛弃债权之免除行为。\nC✗ 虽然兼并前双方互负50万同种类债务本具抵销可能，但双方并未行使抵销权，是企业兼并这一事件直接导致人格合一而混同消灭。\nD✗ 双方并未现实履行50万元债务清偿。","k":"","kb":133,"kh":[[47,75]]},{"id":"2018-49","y":2018,"t":"多","s":"甲公司与乙幼儿园签订空气净化器买卖合同,约定:净化器的PM2.5 去除率应达到95% ,验收合格后付款。后乙幼儿园经甲公司同意将合同转让给丙幼儿园,丙幼儿园验收时,发现PM2. 5 去除率远未达到合同约定的标准。对此,下列说法正确的是 （ ）。","o":["丙幼儿园有权解除买卖合同","丙幼儿园可以对甲公司行使先履行抗辩权","丙幼儿园可以请求乙幼儿园承担违约责任","乙幼儿园与丙幼儿园之间的转让合同有效"],"a":"ABD","e":"\u0001乙经甲同意将合同权利义务概括转让给丙，转让合同有效；丙受让后成为合同买方，产品达不到95%去除率时可对甲行使先履行抗辩或解除合同。\u0002\nA✓ 所供空气净化器PM2.5去除率远未达合同约定的95%关键性能标准，致使合同目的不能实现，作为合同新买方的丙幼儿园有权请求解除合同。\nB✓ 约定验收合格后才付款，现甲交付货物性能不合格，丙对甲享有先履行抗辩权拒付货款。\nC✗ 乙在经甲同意将合同权利义务“概括转让”给丙后已退出原买卖合同关系，除非另约担保，否则丙应向实际履约违约方甲公司追责，无权向乙追索产品瑕疵违约责任。\nD✓ 依《民法典》第555条，经对方（甲公司）同意，当事人一方（乙幼儿园）可以将自己在合同中的权利和义务一并转让给第三人（丙幼儿园），该概括转让合同合法有效。","k":"","kb":132,"kh":[[533,569]]},{"id":"2019-25","y":2019,"t":"单","s":"甲外出务工多年未与家中联系,经其配偶乙申请,法院宣告甲死亡。甲的好友丙替甲偿还了欠丁的1万元。后乙与丙组成家庭。一日,甲返乡。对此,下列说法正确的是（ ）。","o":["甲和乙之间的婚姻关系自动恢复","乙和丙之间的婚姻关系自动解除","乙、丙婚后,丙可向乙主张1万元债权","无论甲、乙是否恢复婚姻关系,丙均有权要求甲偿还1万元债务"],"a":"D","e":"\u0001乙在甲被宣告死亡期间已与丙再婚，甲返乡撤销死亡宣告后原婚姻不自动恢复、乙丙婚姻有效；但丙曾代甲偿还欠丁的1万元债，丙仍有权向真正债务人甲追偿。\u0002\nA✗ 配偶乙已与他人再婚的，即便死亡宣告日后撤销，原婚姻关系亦绝对不能自动恢复。\nB✗ 乙与丙依法登记结婚构成合法有效婚姻，不会因前夫生还而自动解除。\nC✗ 乙与丙系配偶，且当初是丙替“甲”个人偿还其欠丁之1万元债务，债务承担或不当得利返还主体是甲而非乙。\nD✓ 不论甲、乙婚姻关系是否恢复，丙为甲清偿所产生的代偿求偿/不当得利之债存在于丙与真实债务人甲之间，甲生还后当然应归还丙该1万元。","k":"","kb":135,"kh":[[452,476]]},{"id":"2019-27","y":2019,"t":"单","s":"甲请同事吃饭,结账时发现没带钱,遂请好友乙帮忙买单,乙碍于情面付款。后乙要求甲偿还,甲拒绝。乙的付款行为属于（ ）。","o":["赠与","代为清偿","无因管理","情谊行为"],"a":"B","e":"\u0001好友乙碍于情面替忘记带钱的甲向餐厅结清餐费，履行的是甲与餐厅间的餐费债务，在民法上构成第三人代为清偿。\u0002\nA✗ 乙帮忙买单后随即要求甲偿还，显然没有无偿送钱放弃求偿的意思，不构成赠与。\nB✓ 乙替债务人甲向债权人餐厅付款消灭餐费债务，属于典型的第三人代为清偿（事后甲应向乙偿还垫付款）。\nC✗ 甲明确邀请乙到场“请好友帮忙买单”，双方存在委托垫付指示而非“没有法定或约定义务”主动插手之无因管理。\nD✗ 替人支付餐费并在事后明确请求偿还具有清晰财产债权债务意义，不是纯社交情谊行为。","k":"","kb":131,"kh":[[527,544]]},{"id":"2019-28","y":2019,"t":"单","s":"甲听说乙有一祖传玉石,遂前往询价,甲问: 你多少钱卖?乙说:你出多少钱?甲问:15万元卖不卖?乙说:20万元可以马上拿走。甲未置可否。三天后,甲携款20万元前来购买,乙说:25万元才能卖。对此,下列选项正确的是（ ）。","o":["乙说“你出多少钱”属于要约","乙说“20万元可以马上拿走”属于要约邀请","甲携款20万元前来购买时合同成立","乙说“25万元才能卖”属于要约"],"a":"D","e":"\u0001乙回“你出多少钱”系询价属要约邀请，“20万元可以马上拿走”是要约但甲当时未承诺后失效，三天后甲携款20万变成新要约，乙反报“25万元才能卖”则是新要约。\u0002\nA✗ “你出多少钱”内容不含具体价款，仅为引诱对方报价的要约邀请。\nB✗ “20万元可以马上拿走”价款与标的确定且经承诺即受约束，属于要约（因当时对话未即时承诺而失效）。\nC✗ 甲当时未置可否，对话要约当场失去效力；三天后甲带20万来买仅发出新要约，乙明确拒绝并改报25万，双方未达成合意，合同未成立。\nD✓ 乙拒绝20万新要约并提出“25万元才能卖”对价款作出实质性变更，依法构成乙向甲发出的新要约。","k":"","kb":129,"kh":[[97,119],[208,223]]},{"id":"2019-34","y":2019,"t":"单","s":"甲欠乙5万元逾期不还,乙要求甲马上偿还, 否则就起诉。甲遂将自己仅有的财产即市价5万元的汽车以4万元卖给知情的丙,后被乙得知。对于甲和丙之间的买卖合同,下列说法正确的是（ ）。","o":["乙有权以书面通知方式撤销","乙得知一年后不再享有撤销权","乙有权请求确认无效","乙无权撤销"],"a":"D","e":"\u0001市价5万元的汽车以4万元（市场价80%）出售，未低于市场交易价70%（3.5万元）的“明显不合理低价”标准，故即使丙知情，债权人乙仍无权行使撤销权。\u0002\nA✗ 首先债权人撤销权必须通过向人民法院提起诉讼行使（不得单方发书面通知撤销）；其次本案根本不符合低价转让要件。\nB✗ 债权人撤销权自知道撤销事由之日起1年内行使，但前提是须具备撤销权成立条件，此处自始无撤销权。\nC✗ 债务人与知情人以尚属正常的8折价格交易并非通谋虚伪或法定绝对无效情形。\nD✓ 依据合同编通则解释（及原合同法解释二），转让价达不到市场交易价70%的一般方认定为“明显不合理低价”；5万以4万卖已达80%，不构明显低价，乙无权撤销。","k":"","kb":132,"kh":[[262,335]]},{"id":"2019-39","y":2019,"t":"单","s":"甲、乙签订买卖合同,约定:甲于9月30日交货,乙于10月5日付款。9月30日甲得知乙经营状况严重恶化,遂通知乙暂不交货。甲行使的是（ ）。","o":["先诉抗辩权","不安抗辩权","先履行抗辩权","同时履行抗辩权"],"a":"B","e":"\u0001先履行一方甲于交货期9月30日得知后付款方乙经营状况严重恶化并通知暂不交货，甲行使的是不安抗辩权。\u0002\nA✗ 先诉抗辩权为一般保证人针对债权人要求先向主债务人追偿财产的抗辩。\nB✓ 甲有先交货义务，在有确切证据得知后履行义务人乙经营状况严重恶化可能丧失付款能力时，甲依法行使不安抗辩权中止履行并通知乙。\nC✗ 先履行抗辩权是后履行方在先履行方不履约时享有的抗辩；甲为先交货人。\nD✗ 双方约定了9月30日交货、10月5日付款，存在明确先后履行顺序，不适用同时履行抗辩权。","k":"","kb":131,"kh":[[378,416]]},{"id":"2020-26","y":2020,"t":"单","s":"甲收到乙通讯公司短信,内容为:本公司为您提供实时天气预报服务,每月收费5元,如不接受此服务,请回复“N”。甲看后未予理睬。后甲发现乙公司向自己收取了该费用,遂要求返还。甲与乙公司之间的天气预报服务合同（ ）。","o":["不成立","无效","可撤销","有效"],"a":"A","e":"\u0001乙通讯公司单方声明“不接受请回复N”，甲未理睬，沉默不构成承诺意思表示，故涉案收费服务合同根本不成立。\u0002\nA✓ 除法律规定、双方事先约定或交易习惯外，单纯沉默不作为不能视作同意订立合同的承诺意思表示，因此甲与乙公司之间的天气预报合同未成立。\nB✗ 未经历有效要约承诺达成合意前，合同处于“不成立”状态，尚未进入“有效或无效”的效力评价阶段。\nC✗ 合同不成立无须亦谈不上行使撤销权。\nD✗ 乙公司单方捆绑默示扣费条文非法强加义务，合同未成立有效。","k":"","kb":129,"kh":[[419,440]]},{"id":"2021-24","y":2021,"t":"单","s":"某幼儿园教师组织幼儿做游戏时,小莉被小明撞倒,前额磕伤。小莉的父母向幼儿园索赔,幼儿园以入园登记表中有“若非教师人为原因导致幼儿磕碰、摔伤等伤害,幼儿园不承担责任”的内容为由拒赔。该免责条款（ ）。","o":["可撤销","效力待定","有效","无效"],"a":"D","e":"\u0001幼儿园入园格式条款约定“非教师人为磕碰摔伤概不负责”，既违反《民法典》第506条人身伤害免责无效规定又违反第497条不合理免除责任规定，该免责条款无效。\u0002\nA✗ 法定绝对无效格式条款并非待一方申请才生效力变动的可撤销条款。\nB✗ 无须等待追认，免除人身损害及核心看护责任的格式条文自始确定无效。\nC✗ 幼儿园依法负有教育管理和保护安全义务，不得借格式免责条文豁免法定责任。\nD✓ 该入园登记表条款属造成对方人身伤害的免责条款，且不合理地免除提供格式条款一方的法定义务与责任，依据《民法典》第497、506条确定无效。","k":"","kb":130,"kh":[[194,217]]},{"id":"2021-25","y":2021,"t":"单","s":"甲与某影视公司签订合同,约定甲两年内完成一部电视剧剧本,影视公司支付稿酬50万元。后甲将请求支付稿酬的权利转让给乙。甲请求支付稿酬的权利（ ）。","o":["经影视公司同意才可以转让","依合同性质不得转让","在转让通知到达影视公司时发生转让","在转让合同生效时发生转让"],"a":"D","e":"\u0001编剧甲对影视公司50万元金钱债权转让无须征得债务人同意（且约定不得转让也不得对抗），该债权自转让合同生效时发生转让。\u0002\nA✗ 债权转让遵循通知生效而非债务人同意原则，不需要影视公司同意。\nB✗ 创作剧本的行为义务具有人身技能依附性不得随意转给别人代写，但已经约定或可得的“请求支付50万元稿酬的金钱债权”属普通财产权，完全可以转让。\nC✗ 通知到达影视公司是债权转让对债务人影视公司发生拘束效力的时点；而债权本身移转给受让人乙的时间是“转让合同生效时”。\nD✓ 依《民法典》第545、546条原理，债权转让系准物权/处分契约，甲、乙间债权转让合同依法生效时该50万元稿酬请求权即由甲移转至乙（通知仅解决对债务人对抗效力）。","k":"","kb":132,"kh":[[379,422]]},{"id":"2021-47","y":2021,"t":"多","s":"甲与乙签订预订书,约定一年内订立房屋买卖合同。后乙拒绝订立买卖合同。对于乙违反预订书的行为,甲可以（ ）。","o":["请求乙赔偿精神损害","请求乙承担侵权责任","请求乙承担违约责任","解除预订书"],"a":"CD","e":"\u0001签订约定1年内买房的预订书属于预约合同；乙拒绝订立本约买房合同构成违反预约合同违约，甲有权请求乙承担违约责任并解除预订书。\u0002\nA✗ 违反财产买卖预约合同属于财产性契约违约，一般不导致精神损害赔偿。\nB✗ 拒绝订立预约之本约不涉及人身物权绝对权侵害，不成立侵权责任。\nC✓ 依《民法典》第495条，当事人一方不履行预约合同约定的订立合同义务的，对方可以请求其承担预约合同的违约责任。\nD✓ 乙明确拒绝订立本约致使预订书合同目的彻底不能实现，甲依法有权解除该预订书。","k":"","kb":135,"kh":[[222,235],[262,313]]},{"id":"2022-22","y":2022,"t":"单","s":"2020年2月27日,某网店以100元的优惠价格寄给老客户甲一盒新到的面膜,并附说明∶若不同意购买,请在10天内寄回,邮费到付。3月1日,甲收到面膜并放在桌子上, 3天后将面膜扔进垃圾桶。3月12日,该网店要求甲付款,甲表示拒绝。该网店和甲之间的买卖合同","o":["未成立","有效","无效","被撤销"],"a":"A","e":"\u0001网店未经同意先寄出面膜并附“10天不退寄回视为购买”，甲收下放置后扔进垃圾桶；沉默不作为承诺，甲亦无积极消费买受意思，买卖合同未成立。\u0002\nA✓ 沉默原则上不能作为承诺表示；对商家强行先寄来的试用/推销商品，收件人未寄回并弃置亦不构成同意购买的默示行为承诺，买卖合同未成立。\nB✗ 双方并未达成买卖合意，合同尚且未成立，不可能有效。\nC✗ 并未成立的合同无需按效力否定为“无效”。\nD✗ 未成立之合同不存在行使撤销权余地。","k":"","kb":129,"kh":[[441,477]]},{"id":"2022-29","y":2022,"t":"单","s":"A、B、C、D四家公司对E公司负有400万元的连带债务,内部约定每家公司负担四分之一,现债务到期。对此,下列说法中正确的是","o":["如A的债务被E免除,B、C、D仍需履行400万元债务","如B与E因合并成为同一主体,A、C、D的债务消灭","如C将自己对E的债权与400万元债务抵销，C有权就300万元债务向A、B、D追偿","如D履行了400万元债务，其有权请求A、B、C对400万元债务承担连带责任"],"a":"C","e":"\u0001四公司连带欠款400万元内部各分担1/4：一方全额抵销后有权就超出自身100万份额的300万元向其余三家追偿。\u0002\nA✗ 依《民法典》第520条第2款，债权人免除部分连带债务人债务的，在该连带债务人应当承担的份额（100万元）范围内，其他债务人对债权人的债务消灭，其余三家仅需再履行300万元而非400万元。\nB✗ 依第520条第3款，部分连带债务人的债务与债权人的债权因合并混同的，在扣除该债务人应当承担的100万份额后，债权人对其他三家债务人的债权在300万元范围内继续存在，并非全盘消灭。\nC✓ 依《民法典》第520条第1款及第519条，抵销方将自己债权与全部400万元连带债务抵销后，其余三方对债权人债务归于消灭，抵销方有权就超出自己100万份额的300万元向其余三家连带债务人按份追偿。\nD✗ 清偿全额400万元的债务人只能就超出自己份额的“300万元”（且原则上按各自100万元内部分担份额追偿，仅其中一方不能分担才按比例分摊），不能向其他方连带索要全额400万元。","k":"","kb":131,"kh":[[583,661]]},{"id":"2022-30","y":2022,"t":"单","s":"甲倒车时操作失误撞倒围墙,压死了站在墙后的甲母。甲向保险公司索赔,保险公司拒赔,理由是保险合同约定∶\"保险车辆造成被保险人或其允许的驾驶员及他们的家庭成员人身伤亡,保险人均不赔偿。\"经查,在签订保险合同时保险公司并未提示甲注意该格式条款。甲可以主张该条款","o":["无效","可撤销","效力待定","不成为保险合同的内容"],"a":"D","e":"\u0001保险公司未采取合理方式提示甲注意免除自身核心赔付责任的格式免责条款，依《民法典》第496条第2款，甲可以主张该条款不成为合同的内容。\u0002\nA✗ 未履行提示说明义务针对的是“是否订入合同”的订立规则，法律赋予相对方的救济是“主张该条款不成为合同的内容”，而非直接按第497条宣告其内容无效（除非另有不合理免责或法定无效实质）。\nB✗ 不触发可撤销法律后果。\nC✗ 不属于需要追认的效力待定条款。\nD✓ 完全精准对应《民法典》第496条第2款法条原文：提供格式条款的一方未履行提示或者说明义务，致使对方没有注意或者理解与其有重大利害关系的条款的，对方可以主张该条款不成为合同的内容。","k":"","kb":130,"kh":[[52,142]]},{"id":"2022-31","y":2022,"t":"单","s":"甲和乙签订了一份合同,未约定履行顺序。甲请求乙先履行,乙以甲未履行为由拒绝。乙拒绝履行系行使","o":["请求权","抗辩权","形成权","相对权"],"a":"B","e":"\u0001甲请求乙先履行时，乙以无先后履行顺序且甲自己未履行为由拒绝履行，乙行使的是同时履行抗辩权，在民事权利作用分类中属于抗辩权。\u0002\nA✗ 请求权是主动要求对方为一定给付的权利；乙此处是在防御对抗甲的履约要求。\nB✓ 同时履行抗辩权是指双方互负债务且无先后履行顺序时，一方在对方未履行之前对抗对方履行请求、暂时拒绝自己履行的权利，性质上属于典型抗辩权。\nC✗ 形成权单方使法律关系变动消灭，同时履行抗辩权仅暂时阻却履行而非消灭合同。\nD✗ 相对权是对世权/绝对权的对应概念，题干四个选项针对的是权利的作用分类（支配、请求、抗辩、形成），“抗辩权”最精准。","k":"","kb":131,"kh":[[299,329]]},{"id":"2022-33","y":2022,"t":"单","s":"某网店打折促销某型号扫地机器人,甲见后立即提交订单购买10台并付款。后该网店以库存不足为由拒绝发货。对此,该网店","o":["不承担民事责任","应当承担违约责任","应当承担缔约过失责任","应当承担违反预约合同的责任"],"a":"B","e":"\u0001网店打折促销扫地机器人，甲提交订单购买10台并成功付款时买卖合同依法成立并生效；网店事后以库存不足拒绝发货应当承担违约责任。\u0002\nA✗ 网店既已上架明码标价促销并接受订单付款，不能任意毁约拒发而不负责。\nB✓ 依《民法典》第491条第2款，当事人通过互联网发布的商品信息符合要约条件的，对方选择该商品并提交订单成功时合同成立；网店拒绝发货构成违约，应担违约责任。\nC✗ 合同已经依法成立生效，此时不履行交付义务产生的是违约责任而非缔约过失责任。\nD✗ 网购提交订单成立的是正式买卖合同本约，并非预约合同。","k":"","kb":129,"kh":[[120,141]]},{"id":"2022-48","y":2022,"t":"多","s":"情事变更制度体现的民法基本原则包括","o":["自愿原则","公序良俗原则","平等原则","公平原则"],"a":"ACD","e":"\u0001情事变更制度允许受明显不公不利影响的当事人协商变更或解除合同，具体体现了民法的自愿、平等与公平原则，但不直接体现公序良俗原则。\u0002\nA✓ 情事变更首先鼓励双方当事人通过“重新协商”以意思自治方式化解危机，体现了自愿原则。\nB✗ 情事变更主要解决因客观情势剧变导致双方利益失衡的交易公平分配问题，与善良风俗、公共道德秩序（公序良俗）无直接关联。\nC✓ 禁止一方借客观情势巨变强行压榨对方履约，维系双方当事人的平等法律地位。\nD✓ 情事变更最核心的制度理念即在基础客观条件发生重大变化后防止“继续履行显失公平”，直接践行公平原则。","k":"","kb":131,"kh":[[750,826]]},{"id":"2023-24","y":2023,"t":"单","s":"关于涉及第三人的合同的履行,下列说法正确的是","o":["当事人约定由债务人向第三人履行债务，债务人未向第三人履行债务的，应当向第三人承担违约责任","债权人接受第三人履行后,其对债务人的债权转让给第三人,但是债权人和债务人另有约定的除外","债务人不履行债务,第三人对履行该债务具有合法利益的,第三人有权向债权人代为履行,但是只能由债务人履行的除外","当事人约定由第三人向债权人履行债务,第三人履行债务不符合约定的,第三人应当向债权人承担违约责任"],"a":"C","e":"\u0001债务人不履行债务时，对履行该债务具有合法利益的第三人有权向债权人代为履行（只能由债务人履行的除外）。\u0002\nA✗ 依《民法典》第522条第1款，当事人约定由债务人向第三人履行债务，债务人未向第三人履行或者履行不符合约定的，应当向“债权人”（而非向第三人）承担违约责任（真正利益第三人合同另有约定的除外）。\nB✗ 依第524条第2款，债权人接受具有合法利益的第三人履行后，其对债务人的债权“转让给第三人”（注意并非一般无合法利益任意第三人，且需结合法定条件）；当年2023真题对比第524条第1款原文表述，该项错在未限定为“具有合法利益的”第三人一般代偿即当然发生法定债权移转。\nC✓ 完全契合《民法典》第524条第1款原文规定：债务人不履行债务，第三人对履行该债务具有合法利益的，有权向债权人代为履行；但根据债务性质、按照当事人约定或法律规定只能由债务人履行的除外。\nD✗ 依第523条，约定由第三人向债权人履行债务（第三人代为履行合同），第三人不履行或者履行不符合约定的，应当由“债务人”（而非第三人）向债权人承担违约责任。","k":"","kb":131,"kh":[[545,560]]},{"id":"2023-30","y":2023,"t":"单","s":"甲与乙签订合同约定:标的总额为100万元;任何一方违约,应向对方支付违约金20万元。后乙违约,给甲造成损失40万元。甲有权请求乙给付的最高金额是","o":["80万元","60万元","40万元","20万元"],"a":"C","e":"\u0001约定的违约金（20万元）低于造成的实际损失（40万元）的，守约方甲可请求法院或仲裁机构予以增加至实际损失40万元，而不得另行叠加。\u0002\nA✗ 违约方损失为40万元，不得超越实际损失再要走80万元（除非惩罚性约定且未过分高于损失）。\nB✗ 违约金具有补偿性为主的特点，在“增额请求”情形下，是“将20万元调整增加到40万元”使总赔付恰好覆盖40万元损失，而非20万元+40万元=60万元重复赔付。\nC✓ 依《民法典》第585条第2款，约定的违约金20万元低于造成的损失40万元的，甲有权请求法院予以增加，最高以弥补实际全部损失40万元为限。\nD✗ 20万元只是原约较低金额，法律明确允许守约方申请调高至实际损失40万元。","k":"","kb":134,"kh":[[153,215]]},{"id":"2023-37","y":2023,"t":"单","s":"甲与乙签订购货合同,约定甲签订合同后10日内付款,乙收到货款后交货。甲届期只付了部分货款,乙以甲未依约付款为由拒绝交货。乙的行为系行使","o":["请求权","抗辩权","形成权","支配权"],"a":"B","e":"\u0001先履行一方甲只支付部分货款，后交付方乙以甲未全面依约付款为由暂时拒绝交货，乙依法行使的是先履行抗辩权（属于抗辩权）。\u0002\nA✗ 请求权为主动主张对方履约，乙在此系防御对抗甲的交货要求。\nB✓ 乙基于《民法典》第526条先履行抗辩权拒绝交货，在权利分类上属于典型的抗辩权。\nC✗ 抗辩权仅暂时中止自己履行，并未单方解除或变更合同关系，不属形成权。\nD✗ 支配权是对物权或知识产权等直接支配权能，乙拒付属于债的关系抗辩。","k":"","kb":131,"kh":[[340,377]]},{"id":"2023-40","y":2023,"t":"单","s":"【案情】A公司与B公司签订合同，约定：A公司为B公司制作家具100套，价款100万元；B公司预付20万元，其余货款待交货验收后一次性付清；A公司提供制作家具所需木材，B公司提供设计图纸。\n如A公司按约定完成制作,但双方对合同履行地存在争议,则合同履行地应为","o":["A公司所在地","B公司所在地","家具所在地","合同签订地"],"a":"A","e":"\u0001制作家具100套属于交货义务且双方对履行地有争议（补充协议不能），依《民法典》第511条第3项在“履行义务一方（制作方即原物料提供制作方）所在地”履行。\u0002\nA✓ 本案交付定制家具既非给付货币也非交付不动产，属于“其他标的”，在无约定且不能交易习惯补充时，依《民法典》第511条第3项应当在履行交付家具义务一方（制作方——卖方/承揽方所在地）履行。\nB✗ 购买方所在地仅在交付货币付款义务视角下为收款方地点；而围绕制作交付标的发生履行地争议时，交付标的物的履行地是制作方所在地。\nC✗ 仅不动产才在不动产所在地履行，家具动产不适用“标的物所在地”规则。\nD✗ 合同签订地并非法定补充履行地规则标准。","k":"","kb":131,"kh":[[191,222]]},{"id":"2023-47","y":2023,"t":"多","s":"甲在某交易平台购买卖家乙的自行车,该车被乙标注为某品牌“原装正品”自行车,甲收货后发现该车系无品牌的拼装车。甲有权","o":["请求乙承担侵权责任","请求乙承担违约责任","请求撤销与乙的买卖合同","请求交易平台承担违约责任"],"a":"BC","e":"\u0001卖家乙将无品牌拼装车标为某品牌“原装正品”售卖，既违反质量与品牌品质约定构成违约，又故意欺骗消费者构成欺诈，甲可请求违约责任或请求撤销合同。\u0002\nA✗ 购得拼装车本身主要是交易标的价值履行瑕疵，未交代自行车导致甲人身跌伤或损害其他既有财产，一般不成立侵权损害赔偿责任。\nB✓ 卖家交付的实物与约定的某品牌原装正品严重不符，构成违约，甲可请求乙承担违约责任（或三倍惩罚赔偿）。\nC✓ 卖家故意虚构品牌及原装正品信息诱使买家陷入错误购买，构成民事欺诈，甲亦有权请求法院撤销该买卖合同（注意违约与撤销仅择一终局实现，但均属甲有权主张之权利）。\nD✗ 网络交易平台仅是撮合中介，买卖合同存在于买家甲与卖家乙之间，交易平台一般不直接承担买卖合同违约责任。","k":"","kb":135,"kh":[[388,413]]},{"id":"2024-22","y":2024,"t":"单","s":"甲向乙借10万元,乙称暂无现款,不过丙欠自己的10万元货款已到期,可将债权转让给甲。甲同意,乙将此事通知丙,丙不同意,并向乙支付了10万元货款。3日后,丙发现货物有瑕疵,要求乙按照合同约定支付2万元违约金。同日,甲请求丙支付10万元,丙拒绝,并提出以下理由。其中能得到法院支持的是（ ）。","o":["自己已经向乙支付了货款","乙转让10万元债权未经自己同意","甲乙之间的合同为实践合同,尚未成立","自己应付的款项可与乙应支付的违约金部分抵销"],"a":"D","e":"\u0001债权转让通知到达丙后即生效力，丙再擅向乙付款对甲无效；但丙因同买卖合同货物瑕疵对乙享有的2万元违约金债权，可依法向受让人甲主张抵销。\u0002\nA✗ 乙已将债权转让一事通知丙，此后丙未向受让人甲履行却擅自向原债权人乙付款10万元，对新债权人甲不发生清偿消灭效力，丙仍须向甲清偿（丙可另向乙索回错付的10万元）。\nB✗ 依《民法典》第546条，债权人转让债权只需“通知”债务人即可对其发生效力，不需要征得债务人丙同意。\nC✗ 虽自然人之间借款合同属实践合同，但甲同意受让到期10万货款债权并接受让与抵借且已通知丙，且债务人不得随意拿转让人与受让人的原因合同抗辩，亦非未成立而免对丙债权。\nD✓ 依《民法典》第549条第2项，虽然2万元违约金是在收到转让通知3日后才因发现货物瑕疵主张，但因该违约金债权与被转让的10万元货款债权“是基于同一买卖合同产生”，丙依法有权向受让人甲主张将该2万元违约金抵销相应货款债务。\n记法：《民法典》第549条高频考法：接到债权转让通知“之后”才产生的反向债权本不能向受让人抵销——唯一的例外是“基于同一合同产生”的反向债权（如同一买卖合同的质量违约金）！","k":"","kb":132,"kh":[[443,515]]},{"id":"2024-24","y":2024,"t":"单","s":"司机甲在某货运平台上接单,货主乙委托其运输一批水果,订单未载明履行时间与顺序,甲请求乙先支付报酬。乙主张按照之前与他人交易习惯,需要甲先送货,自己由收货方结清货款后,再向甲支付报酬。对此下面说法正确的是（ ）。","o":["甲应当先送货","甲享有先履行抗辩权","甲在送货后可以随时请求乙支付报酬","乙的付款期限应当按照其与他人的交易习惯确定"],"a":"C","e":"\u0001订单未载明履行顺序和期限，乙单方以往“与他人”的交易习惯不能约束甲；甲送货完成后付款期限不明确，甲有权随时请求乙支付报酬。\u0002\nA✗ 双方订单未约定先送货后结清条款，在无其他交易习惯下并非当然单方强压甲先垫资送货并等收货方回款后才能拿运费（按服务合同及同时履行抗辩权原理，乙不得强加无约义务）。\nB✗ 双方并未约定乙须在送货前先付运费，甲不是后履行方，不享有要求乙先付款否则拒送的先履行抗辩权。\nC✓ 依《民法典》第511条第4项及第813条，合同对付款期限未作约定且双方间无特定交易习惯时，履行期限不明，甲依约完成送货后可以随时请求乙支付报酬，乙不得以与第三人惯例拖延付款。\nD✗ 《民法典》第510条所指“交易习惯”原则上需是“双方当事人之间”在交易中形成的习惯或行业公认惯例，乙自己以前与别家司机的私人做法不构成可强加给甲的交易习惯。","k":"","kb":131,"kh":[[135,190]]},{"id":"2024-27","y":2024,"t":"单","s":"甲在A网站团购B餐厅的100元代金券,券上显著标明“周末不得使用”。甲周五中午去就餐,结账的B餐厅表示周五属于周末不能用券。对此下列选项正确的是（ ）。","o":["代金券上的“周末不得使用”为“霸王条款”,甲有权主张该条款无效","A网站存在欺诈,甲有权撤销与A网站的买卖合同","甲与B餐厅未就餐饮价格达成合意,餐饮服务合同未成立","代金券上的使用时间应当按照通常理解予以解释,甲有权使用代金券"],"a":"D","e":"\u0001格式条款应首先按照通常理解予以解释；“周末不得使用”依生活常理指周六、周日，不包括周五中午，甲周五就餐有权使用代金券。\u0002\nA✗ 优惠代金券正常排除了周末高峰期使用，并未不合理地排除消费者主要权利，不属于当然无效的“霸王条款”。\nB✗ 商家明确标明了使用限制，分歧在于“周末”词义界定，不构成故意虚构欺诈。\nC✗ 甲下单团购即达成合意，餐饮服务及团购券合同均已成立生效。\nD✓ 依《民法典》第498条，对格式条款的理解发生争议的，应当首先按照通常理解予以解释；我国通用社会观念“周末”指周六和周日（或周五下班晚间以后），周五中午显然属于工作日而非周末，甲有权使用。","k":"","kb":130,"kh":[[326,372]]},{"id":"2024-31","y":2024,"t":"单","s":"A公司向B工厂订购一批零配件，并约定任意一方履行迟延15日以上，对方可以解除合同。后B工厂因产能不足迟延20日仍无法发货。A公司可以（ ）。","o":["解除该订购合同","撤销该订购合同","变更该订购合同","请求B工厂赔偿损失"],"a":"A","e":"\u0001双方约定一方履行迟延15日以上对方可解除合同（约定解除条件）；现对方已迟延20日仍未发货，解除条件成就，对方公司可单方解除该合同。\u0002\nA✓ 依《民法典》第562条第2款，当事人可以约定一方解除合同的事由，事由发生时解除权人可以解除合同。该工厂迟延达20日超过15日上限，订购方有权通知解除合同。\nB✗ 履约迟延属于履行期违约行为，并非订约时存在欺诈、胁迫、重大误解，不适用撤销合同。\nC✗ 一方未达成协议或未生情事变更时，守约方不能单方强行变更合同履行内容（本题意在直接行使约定解除权）。\nD✗ 注意本题干中B工厂因“产能不足”迟延且题干未展示已经造成具体损失事实（相比紧扣“迟延15日以上可解除合同”之约定解除权核心考点），A选项是最直接准确、毫无争议的法定选项（2024官方真题单选A）。","k":"","kb":133,"kh":[[249,275]]},{"id":"2024-33","y":2024,"t":"单","s":"甲公司与乙公司约定，乙公司于11月30日前向甲公司提供价值50万元的柴油或燃煤，后甲公司为了减少煤渣处理成本，要求乙公司交付柴油，乙公司拒绝并表示燃煤已备货，于11月25日将燃煤运到甲公司所在地。下列说法正确的是（ ）。","o":["乙公司应交付柴油","甲公司和乙公司订立的合同产生的是简单之债","甲公司可以请求乙公司承担违约责任","乙公司的合同债务已经履行"],"a":"D","e":"\u0001约定提供价值50万元的柴油“或”燃煤构成选择之债，未约选择权归属时依《民法典》第515条归债务人（供货方乙公司），其提前交付燃煤即已履行完毕。\u0002\nA✗ 选择之债在双方未约定且无习惯时，选择权归属于债务人乙公司，债权人甲公司无权强行要求乙交付柴油。\nB✗ 提供“柴油或燃煤”标的有两项可供择一给付，属于选择之债而非只有单一给付标的的简单之债。\nC✗ 债务人乙公司在约定期限11月30日前（11月25日）按自己依法享有的选择权将燃煤运抵交货地，履行完全合法正当，不构成违约。\nD✓ 乙公司行使选择权择定燃煤并按时如数运送至甲公司所在地完成给付，乙公司的合同债务已经依法履行消灭。","k":"","kb":131,"kh":[[245,295]]},{"id":"2024-34","y":2024,"t":"单","s":"甲借给乙10万元,约定到期偿还12万,该笔债务由丙提供担保。后甲将汽车以12 万价格卖给乙,乙未付款。现两项债务均已到期,乙将8万交给甲清偿债务。半年后,甲乙就债务清偿发生争议,乙主张自己清偿的是借款债务。对此,下列说法正确的是（ ）。","o":["因借款债务约定有利息,故乙清偿的是借款债务","因汽车价款债务缺乏担保,故乙清偿的是汽车价款债务","因清偿任何债务可以由债务人指定,故乙清偿的是借款债务","因债具有平等性,故乙的清偿为按比例清偿两项债务"],"a":"B","e":"\u0001债务人对同一债权人负有两项同到期金钱债务，清偿8万不足全还时无约定或指定，依《民法典》第560条优先抵充“缺乏担保”的汽车价款债务。\u0002\nA✗ 依法定清偿抵充顺序规则（《民法典》第560条第2款），优先清偿的是缺乏担保或担保最少的债务，而借款10万本息有丙提供担保，汽车12万价款无担保。\nB✓ 两笔同种债务均已到期且乙还款时未即时指定抵充对象（半年后争议时补称无效），依《民法典》第560条第2款，应优先抵充缺乏担保或者担保最少的债务，即缺乏担保的汽车价款债务。\nC✗ 债务人指定权必须在“清偿之时”作出；乙当时交给甲8万元未作任何指定，半年发生争议后事后单方宣称自己还的是借款，不能取代法定抵充顺序。\nD✗ 仅在两项债务的担保情况、负担轻重和到期时间完全相同时，才按比例抵充；本案一项有丙担保、一项无担保，担保条件不同。\n记法：《民法典》第560条法定清偿抵充顺序（无指定+全到期）：先抵充“最不安全（没有担保或担保最少）的”，若担保相同再抵“对债务人负担最重的”，仍相同按“到期先后”，全同才“按比例”！","k":"","kb":131,"kh":[[679,746]]},{"id":"2024-35","y":2024,"t":"单","s":"甲向乙发函:“我急需10吨X材料,愿以每吨5万元的价格购买,贵方如有货源请直接发货。”乙立即回函:“最近成本上涨,仅能以每吨6万元的价格出售。”次日,乙向甲发出10吨X材料,同时电话通知甲已按甲要求的数量发货。后甲收到乙的函件,以乙的报价过高为由拒收运抵的材料。对此,下列说法正确是（ ）。","o":["甲、乙之间的买卖合同未成立","乙有权请求甲承担违约责任","乙有权请求甲承担缔约过失责任","甲有权请求乙承担缔约过失责任"],"a":"A","e":"\u0001甲发函出价每吨5万元属要约，乙回函改价每吨6万元属实质性变更变成新要约（原要约失效），乙擅自发货被拒收，故买卖合同未成立。\u0002\nA✓ 乙将每吨5万元改为6万元属于对价款内容作出实质性变更，构成拒绝原要约并提出新要约；甲收到函后拒收货物，即未对乙的新要约作出承诺，买卖合同未成立。\nB✗ 合同尚未成立，乙无权请求甲承担违约责任。\nC✗ 甲此前求购函中并未隐瞒重要事实或恶意磋商，对乙实质涨价的新要约有权自主拒绝订约，甲无缔约过失责任。\nD✗ 题干未交待甲因乙直接发货实际发生了具体信赖利益损失（相比合同成立与否，2024真题考纲重点考查要约实质变更即新要约规则，A精确反映合同法律状态）。","k":"","kb":129,"kh":[[287,329]]},{"id":"2024-39","y":2024,"t":"单","s":"A公司将厂房出租给B公司进行生产活动,某天,B公司工作人员操作不当引燃生产原料,因A公司装修时使用法律禁止用于装修的易燃材料,火势蔓延,B公司损失达20万元。对此B公司（ ）。","o":["只能请求A公司承担违约责任","只能请求A公司承担侵权责任","无权请求A公司承担赔偿责任","有权选择A公司承担违约责任或侵权责任"],"a":"D","e":"\u0001出租人使用国家法律禁止的易燃装修材料致出租房火灾蔓延扩损20万元，既构成违约违反适租安全保证，又构成侵害承租人财产的侵权，承租公司可择一主张违约或侵权。\u0002\nA✗ 并非只能请求违约责任，侵权损害赔偿亦同时符合要件（注意本案混合过错下责任比例另按过失相抵酌定，但请求权基础可选择）。\nB✗ 出租人交付存在重大安全隐患的违法易燃装修厂房同样构成违约，非只能走侵权。\nC✗ 出租人使用禁燃材料对扩大损失存在重大过错，不得因对方操作不当引发最初火情而完全免责。\nD✓ 依《民法典》第186条责任竞合规定，承租企业既可基于租赁合同违约索赔，也可基于安全保障/财产侵权索赔，有权选择其一请求责任。","k":"","kb":135,"kh":[[369,387],[420,451]]},{"id":"2024-50","y":2024,"t":"多","s":"顾客与健身房签订了健身锻炼合同,在教练的指导下,顾客不仅未达到想要的健身目的,并且身体还被拉伤,去医院治疗,其间耽误了工作。顾客有权（ ）。","o":["要求健身房支付医药费、误工费、护理费","解除和健身房的服务合同","要求健身房退还未上完课程费用","请求健身房赔礼道歉"],"a":"ABC","e":"\u0001在健身教练指导下不仅未健身反而拉伤身体，健身房违反安全保障及服务附随义务，顾客有权索赔医药误工护理费、解除合同并退还未上完课程费用。\u0002\nA✓ 因违约或侵权造成他人人身伤害的，依法应当赔偿医疗费、护理费、交通费以及误工费等合理损失。\nB✓ 健身房专业指导致使顾客受伤，合同目的已不能实现且严重破坏信任基础，顾客有权解除健身服务合同。\nC✓ 健身服务合同解除后，尚未消费履行的剩余未上完课程预付费用应当依法予以退还。\nD✗ 人身拉伤过失违约/普通身体伤害主要通过财产性损害赔偿与精神损害抚慰金（如构成伤残/严重精神损害时）救济，一般合同服务纠纷不支持“赔礼道歉”。","k":"","kb":134,"kh":[[103,133]]},{"id":"2025-21","y":2025,"t":"单","s":"甲到A 厂更换轮胎,双方约定更换4 个单价为800 元的轮胎。A 厂因疏忽为甲更换了4 个单价为1500 元的轮胎。后双方就增加的费用发生争议。A 厂更换轮胎的行为构成（ ）。","o":["添附","无因管理","合同变更","违约行为"],"a":"D","e":"\u0001修理厂未按双方约定的800元单价更换轮胎，而是疏忽误换1500元轮胎，属于未按约定正确履行合同标的义务的违约行为（瑕疵/不当履行）。\u0002\nA✗ 汽车所有权属甲，轮胎所有权转移亦围绕修理承揽履约过程发生，且题干重在定性厂方错换履约行为法律性质为违约而非物权添附纠纷。\nB✗ 修理厂是依据双方签订的换胎承揽/修理合同履行职务行为，具有明确合同义务根据，非“没有法定或约定义务”之无因管理。\nC✗ 更换贵价轮胎是修理厂员工自己疏忽弄错，甲未与厂方合意变更合同价款规格。\nD✓ 修理厂未按合同约定的轮胎规格型号履行，属于典型的不适当履行（违约行为），不应要求甲强行高价埋单。","k":"","kb":134,"kh":[[44,84]]},{"id":"2025-23","y":2025,"t":"单","s":"甲与A 公司签订合作协议,约定:甲为A 公司平台的独家主播,期限三年;甲违约需支付违约金80 万元,且不得调整。经A 公司包装,甲成为网红主播。A 公司每月从甲的直播活动中获利约8 万元。签约一年后甲毁约。A 公司起诉请求甲支付80 万元违约金,甲要求酌减。对此,下列说法正确的是（ ）。","o":["人民法院应当对违约金予以酌减","关于违约金数额的约定因有违公平无效","甲应当支付80 万元违约金","关于违约金不得调整的约定对双方当事人具有约束力"],"a":"C","e":"\u0001主播毁约前该平台月均获利8万元（3年预期总利约288万元），且签约已投入包装成本，故80万元违约金未过分高于实际损失（含可得利益），甲应按约支付80万元。\u0002\nA✗ 仅当约定违约金“过分高于”（一般超过实际损失含可得利益损失的30%）造成的损失时才予以酌减；本案仅余下2年预期利益即近192万元外加包装成本，80万元明显不过分高，不应酌减。\nB✗ 双方商事/演艺包装合作协议约定违约金80万元意思表示真实，且与投入培育收益匹配，不存在显失公平或无效情形。\nC✓ 违约损失包括已投入成本及合同履行后可以获得的预期利益（余下2年预期获利约192万元），80万元违约金低于或远未过分高于损失，甲应当依约全额支付80万元违约金。\nD✗ 依《民法典》第585条第2款及司法解释精神，当事人预先约定“违约金不得调整”的条款并不能排除法院依法行使酌减或调增之司法干预权，真正让80万不减的理由是其确实“未过分高于损失”而非该约定本身具绝对拘束力。","k":"","kb":134,"kh":[[217,311]]},{"id":"2025-29","y":2025,"t":"单","s":"甲欠乙90 万元借款,到期未偿还。双方约定甲以一套房屋抵偿该债务,但未实际履行。半年后,甲通知乙办理抵债房屋过户手续,乙以房价下跌为由要求甲偿还90 万元。对此,下列说法正确的是（ ）。","o":["甲与乙之间的以物抵债协议未成立","甲与乙达成以物抵债协议后,原债务消灭","甲有权请求履行以物抵债协议","乙有权请求甲偿还90 万元"],"a":"C","e":"\u0001甲、乙以房屋抵偿到期90万借款的以物抵债协议自合意成立即有效（原借款暂未消灭，属新债清偿）；债务人甲主动请求办理过户履行以物抵债协议的，债权人乙不得反悔拒受。\u0002\nA✗ 履行期届满后达成的以物抵债协议属于诺成性合同，只要双方达成以房抵债合意，协议即告成立并生效。\nB✗ 依《民法典合同编通则解释》第27条，以物抵债协议订立本身并不当然消灭原金钱借款债务，须待抵债房屋过户交付“履行完毕”后原90万元债务才消灭。\nC✓ 该以物抵债协议有效成立且在有效履行期内债务人甲积极通知履行过户手续，乙无权因房价下跌擅自单方反悔，甲依法有权请求继续履行该以物抵债协议（通过履行过户清偿全部债务）。\nD✗ 仅当债务人未按约履行以物抵债协议经催告在合理期限内仍不履行时，债权人方可择一请求履行原债务；本案甲未违约且主动请求履行过户，乙无权跳过抵债协议强行索要90万元现款。","k":"","kb":133,"kh":[[76,149]]},{"id":"2025-37","y":2025,"t":"单","s":"A 公司欠B 公司100 万元货款,到期未偿还。C 公司欠A 公司120 万元货款,A 公司曾发函催要,但C 公司一直未清偿。现B 公司诉至人民法院,要求C 公司还款。对此,下列说法正确的是（ ）。","o":["B 公司无权提起代位权诉讼","B 公司行使代位权以120 万元为限","即使B 公司胜诉,C 公司也只应向A 公司履行","B 公司起诉导致A 公司对C 公司债权的诉讼时效中断"],"a":"D","e":"\u0001债务人只发函催收而未起诉或仲裁属于“怠于行使到期债权”，债权人代位起诉次债务人虽仅以自己100万债权为限且直接受偿，但能依法中断债务人对次债务人的诉讼时效。\u0002\nA✗ 债务人仅发函催要而未采取“诉讼或者仲裁”方式向次债务人主张权利，依最高法司法解释仍认定为“怠于行使”，债权人有权提起代位权诉讼。\nB✗ 债权人代位权的行使范围以“债权人自己的到期债权（100万元）”为限，不得全额跨界索要120万元。\nC✗ 依《民法典》第537条，人民法院认定代位权成立的，由次债务人直接向“债权人”（而非向原债务人）履行义务，履行后相应债权债务即告消灭。\nD✓ 依《民法典合同编通则解释》第35条第1款，债权人提起代位权诉讼的，应当认定对债务人与相对人（次债务人）之间的债权诉讼时效发生中断。","k":"","kb":132,"kh":[[85,111],[133,197]]},{"id":"2025-46","y":2025,"t":"多","s":"A 公司与B 公司签订研制机器人的合作意向书,A 公司向B 公司交付了定金,约定待B 公司形成可行性研究报告后,双方订立合作开发合同。B 公司完成研究报告后,拒绝与A 公司签订合作开发合同。A 公司有权请求B 公司（ ）。","o":["双倍返还定金","承担违反合作意向书的违约责任","承担违反合作开发合同的违约责任","承担合作意向书未生效的缔约过失责任"],"a":"AB","e":"\u0001合作意向书（交付定金待报告完成订立本约）属于具独立拘束力的预约合同；一方拒绝订立合作开发合同本约，对方有权请求其双倍返还定金并承担违反预约合同的违约责任。\u0002\nA✓ 合作意向书约定交付定金担保将来订立合作开发合同（立约定金），现收受定金方恶意拒订本约，给付方有权主张适用定金罚则要求双倍返还定金。\nB✓ 《民法典》第495条明确赋予预约合同违约救济效力，一方拒签本约应承担违反合作意向书这一预约合同的违约责任。\nC✗ 正式的合作开发合同（本约）尚未订立成立，不存在违反本约的违约责任。\nD✗ 预约合同自成立即合法有效，违反有效预约承担的是“预约违约责任”而非“未生效的缔约过失责任”。","k":"","kb":135,"kh":[[222,320]]},{"id":"2026-30","y":2026,"t":"单","s":"2024 年5 月2 日,A 公司因经营困难向甲发函声明解除与甲的合同。甲收到后未予理睬。因A 公司长期不履行,甲于11 月3 日起诉请求解除合同,后撤诉。 12 月5 日,甲向A 公司发出合同解除通知函,通知函于次日送达。该合同的解除时间为","o":["2024 年5 月2 日","2024 年11 月3 日","2024 年12 月5 日","2024 年12 月6 日"],"a":"D","e":"\u0001违约方无权单方发函强行解除合同；甲起诉解除后又主动撤诉不生解除效力；12月5日甲正式发送的合法解除通知于12月6日送达对方时，合同依法解除。\u0002\nA✗ 5月2日是违约方以“自身经营困难”发函试图解除，违约方不享有法定或约定单方解除权，对方未理睬亦未达成协议解除，故5月2日不解除。\nB✗ 依最高法合同编通则解释第54条，当事人以起诉方式通知解除合同但随后“撤诉”的，不发生合同解除的法律效力。\nC✗ 单方通知解除采“到达主义”，自解除通知“到达对方”时生效，而非发出当天生效。\nD✓ 甲于12月5日依法向长期违约方发出的合法单方解除通知函，于次日即2024年12月6日送达对方时正式发生合同解除的法律效力（《民法典》第565条）。","k":"","kb":133,"kh":[[338,380]]},{"id":"2026-36","y":2026,"t":"单","s":"甲在A 网店网购一件衣服,约定送货上门。B 公司的快递员乙未经甲同意,自行将快递交给甲所居住社区的门卫丙,导致衣服丢失。对此,甲有权请求","o":["A 网店赔偿损失","B 公司赔偿损失","乙赔偿损失","丙赔偿损失"],"a":"A","e":"\u0001网购合同约定送货上门，快递员乙未经买家同意擅放门卫导致衣服丢失，卖方网店违反送货上门主合同交付义务，买家甲应向合同相对方网店索赔。\u0002\nA✓ 买卖合同存在于买家甲与网店之间，卖方网店委托快递履行交付，未经买受人同意交由门卫签收致货丢属出卖人履约违约（《民法典》第593条履行辅助人过错由债务人网店对外担责），故甲应请求网店赔偿损失。\nB✗ 运输合同存在于网店与快递公司之间，依合同相对性原则，甲无权跳过网店直接向快递公司主张合同违约责任（除特定侵权情形外通常向卖方主张交付违约）。\nC✗ 快递员乙系快递公司职务履职人员且非买卖合同当事方，甲不直接向快递员个人追偿合同损失。\nD✗ 社区门卫丙无权且未与甲订立保管合约，一般收发室转递亦需看其故意重大过失或首先基于买卖合同向未能如约交付至甲本人之卖方追索。","k":"","kb":135,"kh":[[74,118]]},{"id":"2026-50","y":2026,"t":"多","s":"刘某在家附近的商场逛街时,某游泳培训机构人员向其推销游泳课程,每节课程原价100 元,购买20 节可打八折。刘某购买课程支付1600 元,在刘某完成 5 次课程后,该机构与商场A 租赁合同到期,搬迁至离刘某家较远的地方,刘某遂要求解除合同。对此,说法正确的有","o":["刘某有权解除合同","刘某有权请求商场A 赔偿损失","若合同解除,培训机构应返还刘某预付本金1100 元","若合同解除,刘某有权请求培训机构返还预付款利息"],"a":"AD","e":"\u0001游泳培训机构迁至较远地点致使消费目的难实现，顾客有权解约并依预付式消费新规索还剩余本金与利息；扣费应按优惠折后单价（80元/节）算应退1200元而非1100元。\u0002\nA✓ 培训机构经营场所重大搬迁给消费者带来明显履约不便（合同基础/履行地点剧变致目的落空），顾客依法有权解除合同。\nB✗ 商场只是把场地租给培训机构，并非游泳预付式培训服务合同的相对方，机构租赁到期正常搬离，商场不承担违约或赔偿责任。\nC✗ 依最高法《预付式消费司法解释》第15条，因“经营者原因”解除合同的，已消费的5节课应按购买时的实际优惠折扣单价（1600÷20=80元/节）计算共400元，应退还剩余本金为1600−400=1200元，而非按原价100元扣除500元只退1100元。\nD✓ 因经营者原因导致预付式消费合同解除的，培训机构除了退还剩余预付款本金外，依法还应当按规定支付相应预付款利息。","k":"","kb":133,"kh":[[382,452]]}]},{"sub":"刑法","name":"分则·破坏市场经济秩序罪","w":3.2,"L":52,"qs":[{"id":"2005-16","y":2005,"t":"单","s":"境外走私人阿某向中国境内走私石油,偷逃关税 50 万元,王某得知后,向阿某收购了这批走私进境的石油。王某的行为构成（ ）。","o":["非法经营罪","走私普通货物罪","收购赃物罪","偷税罪"],"a":"B","e":"\u0001直接向境外走私人员非法收购走私进境的普通货物（石油），属于《刑法》第155条第1项规定的“间接走私”，依照走私普通货物罪定罪处罚。\u0002\nA✗ 行为针对的并非一般市场特许经营倒卖问题，而是专门明知系偷逃海关关税之走私物品并直接向走私人一手收购，依法侵害海关监管秩序与关税征管权\nB✓ 走私普通货物罪：根据《刑法》第155条第1项，直接向走私人非法收购走私进口的其他货物、物品，数额较大的，以走私罪论处（\u0001间接走私\u0002），即定\u0001走私普通货物罪\u0002\nC✗ 《刑法》第312条收购赃物（现称掩饰、隐瞒犯罪所得罪）是一般性罪名，在直接从走私人手里购进走私货时被第155条特别条文“间接走私”优先排除\nD✗ 向税务机关逃避国内税款才定偷逃税罪；逃避海关关境关税属走私罪范畴","k":"","kb":95,"kh":[[92,148]]},{"id":"2005-17","y":2005,"t":"单","s":"集资诈骗罪与吸收公众存款罪区别的关键是（ ）。","o":["是否涉及巨额资金","是否涉及众多被害人","是否具有非法占有目的","是否由单位组织实施"],"a":"C","e":"\u0001非法吸收公众存款罪与集资诈骗罪在涉案金额、被害人数众广、单位均可构成等方面并无不同，区分两罪的根本关键在于主观上是否具有“非法占有目的”。\u0002\nA✗ 两罪在司法实践中均常高达数千万乃至数十亿元，涉案资金数额大小不能区分两罪\nB✗ 两罪面向社会不特定公众公开筹资，均会卷入成百上千被害人\nC✓ 是否具有非法占有目的：非法吸收公众存款罪行为人通常确实打算用于生产经营、预期日后还本付息；而\u0001集资诈骗罪\u0002自始（或后来）具有彻底吞没占为己有的\u0001非法占有目的\u0002，毫无归还意愿与能力\nD✗ 单位和自然人都可以依法构成非法吸收公众存款罪与集资诈骗罪","k":"","kb":97,"kh":[[56,74]]},{"id":"2005-25","y":2005,"t":"多","s":"甲未获烟草专卖许可,擅自购进明知是假冒的“中华”牌香烟 100 箱进行批发和零售,在被查获时已销售出 80 箱, 收款 120 万元。经检验该批香烟属于不合格产品。甲的行为（ ）。","o":["触犯非法经营罪","触犯销售假冒注册商标的商品罪","触犯销售伪劣产品罪","属于想象竞合犯,从一重罪定罪处罚"],"a":"ABCD","e":"\u0001一个未经许可批发零售“假冒中华牌（注册商标）且经检验属不合格产品”香烟的经营销售行为，同时触犯非法经营罪（无烟草专卖许可）、销售假冒注册商标的商品罪和销售伪劣产品罪三罪名，属想象竞合犯，择一重罪处罚。\u0002\nA✓ 烟草属国家专卖专营物品，未获专卖许可证擅自批发零售达120万元，触犯《刑法》第225条第1项\u0001非法经营罪\u0002\nB✓ 明知购进并销售假冒“中华”注册商标香烟已达数额较大（销售120万元），触犯第214条\u0001销售假冒注册商标的商品罪\u0002\nC✓ 香烟经检验属不合格产品并以合格品名义销售达120万元（远超5万元入罪线），触犯第140条\u0001销售伪劣产品罪\u0002\nD✓ 两高涉烟草犯罪及知识产权司法解释明确：因同一无证卖假烟行为同时构成非法经营、销售假冒注册商标的商品及销售伪劣产品等罪名的，属于\u0001想象竞合犯\u0002，依照处罚较重的规定从一重罪定罪处罚","k":"","kb":99,"kh":[[314,336]]},{"id":"2006-18","y":2006,"t":"单","s":"下列情形中,构成非法经营罪的是（ ）。","o":["甲医药公司擅自从事假药生产,销售,违法所得数额巨大","乙国有图书公司明知是盗版图书仍然进行销售,违法所得数额巨大","丙公司倒卖窃取的商业秘密,违法所得数额巨大","丁公司未经许可擅自倒卖烟草,违法所得数额巨大"],"a":"D","e":"\u0001烟草属于法律、行政法规明确规定的国家专营、专卖物品，未经烟草专卖局许可擅自倒卖烟草违法所得数额巨大，依法构成《刑法》第225条第1项非法经营罪。\u0002\nA✗ 擅自生产销售假药直接适用第141条特别罪名\u0001生产、销售假药罪\u0002，不另泛定非法经营罪\nB✗ 明知是盗版侵权复制品仍予销售违法所得巨大的，直接适用第218条\u0001销售侵权复制品罪\u0002（或相关著作权条文）\nC✗ 倒卖窃取他人商业秘密直接适用第219条\u0001侵犯商业秘密罪\u0002\nD✓ 丁公司未经许可擅自倒卖烟草，违法所得数额巨大：违反国家烟草专卖法规定擅自经营国家专卖烟草制品扰乱市场秩序且情节严重，精准符合《刑法》第225条第1项\u0001非法经营罪\u0002","k":"","kb":99,"kh":[[314,336]]},{"id":"2006-19","y":2006,"t":"单","s":"在走私普通货物犯罪过程中,以暴力,威胁方法抗拒缉私的,应当（ ）。","o":["以妨害公务罪定罪处罚","以武装掩护走私罪定罪处罚","以走私普通货物罪定罪处罚","以走私普通货物罪与妨害公务罪数罪并罚"],"a":"D","e":"\u0001依据《刑法》第157条第2款明文规定：以暴力、威胁方法抗拒缉私的，以走私普通货物罪和妨害公务罪（第277条）依照数罪并罚的规定处罚！\u0002\nA✗ 走私行为本身独立成罪，决不能漏判走私罪名\nB✗ “武装掩护走私”是指携带枪支弹药等武装力量保驾护航进行走私（第157条第1款从重一罪），与普通暴力抗拒缉私（第157条第2款）截然不同\nC✗ 只判走私一罪遗漏了对海关缉私暴力抗法的单独评价（注意：走私“普通货物”暴力抗拒缉私要并罚，走私“毒品”暴力抗拒检查情节严重才直接升格一罪）\nD✓ 以走私普通货物罪与妨害公务罪数罪并罚：严格适用《刑法》第157条第2款特别并罚规定","k":"","kb":95,"kh":[[150,193]]},{"id":"2006-24","y":2006,"t":"多","s":"明知是下列哪些犯罪的违法所得及其产生的收益，为掩饰、隐瞒其来源和性质而提供资金账户的，构成洗钱罪（ ）。","o":["恐怖活动犯罪","毒品犯罪","受贿犯罪","走私犯罪"],"a":"ABD","e":"\u00012006年1月全国研考时《刑法》第191条洗钱罪上游仅包括毒品、黑社会、恐怖活动、走私四类；6个月后《刑修六》方把“受贿（贪污贿赂）”和金融犯罪添入洗钱罪上游。故保留官方真题标准ABD，并务必识记现行法全四项皆已构成洗钱罪！\u0002\nA✓ 恐怖活动犯罪自始即属于《刑法》第191条洗钱罪的法定上游犯罪\nB✓ 毒品犯罪自1997年《刑法》施行起即属于洗钱罪核心上游犯罪\nC✗ 【2006旧题说明与新法提示】在2006年1月考场上，当时《刑法》第191条尚未修订，受贿犯罪还不算洗钱罪上游（所以当年标准答案为三项）。【新法提示】2006年6月《刑法修正案（六）》明确增补“贪污贿赂犯罪、破坏金融管理秩序犯罪、金融诈骗犯罪”，现行法中明知是\u0001受贿犯罪\u0002违法所得而提供资金账户亦已明确构成洗钱罪\nD✓ 走私犯罪亦是《刑法》第191条确立之初即包含的法定上游犯罪\n【新法提示】2006年6月《刑法修正案（六）》已将贪污贿赂犯罪（含受贿犯罪）、破坏金融管理秩序犯罪、金融诈骗犯罪正式增列为洗钱罪上游犯罪，现行《刑法》第191条下四个选项全属于洗钱罪上游。为忠实还原2006年历史真题答案，本题保留官方标准ABD。","k":"","kb":97,"kh":[[227,250]]},{"id":"2007-16","y":2007,"t":"单","s":"甲弄虚作假,采用将高关税税率货物伪报为低关税税率货物的方法进口货物,偷逃关税 20 万元。甲的行为构成 （ ）。","o":["偷税罪","走私罪","诈骗罪","走私普通货物、物品罪"],"a":"D","e":"\u0001将高关税货物伪报为低关税货物逃避海关监管进口，实质上是采用欺骗手法逃避海关对合法进出口应税货物征收关税，偷逃关税20万元构成走私普通货物、物品罪。\u0002\nA✗ 偷逃国内税务部门征收的增值税/所得税才属逃税罪；逃避海关关境税款属海关监管型走私罪\nB✗ 我国《刑法》分则并无单独笼统的“走私罪”这一概括罪名（走私武器、走私文物、走私普通货物各有具体罪名）\nC✗ 向海关报关瞒骗偷逃关税侵害国家对外贸易管制与关税征管秩序，系特别法条走私普通货物罪，不适用普通诈骗罪\nD✓ 走私普通货物、物品罪：违反海关法规、采取伪报品名税率等欺诈通关方式偷逃普通货物应缴税额（个人偷逃10万元以上即达数额较大起刑点，本题偷逃20万元），成立\u0001走私普通货物、物品罪\u0002","k":"","kb":95,"kh":[[0,54]]},{"id":"2007-17","y":2007,"t":"单","s":"甲的私营企业在 2004 年生产的产品全部内销,并缴纳了各种税收 50 万元。甲在年底向税务机关谎称其中部分产品出口,并出具了虚假的出口外销合同及相关证明,获得国家 20 万元的出口退税。甲的行为构成 （ ）。","o":["合同诈骗罪","诈骗罪","偷税罪","合同诈骗罪和偷税罪"],"a":"C","e":"\u0001《刑法》第204条第2款明文规定：纳税人“缴纳税款后”，再假报出口骗取“所缴纳的税款”的，不按更重的骗取出口退税罪论处，而是“依照逃税罪（2007年原罪名为偷税罪）的规定定罪处罚”；仅超出原缴纳税款部分才定骗取出口退税罪！\u0002\nA✗ 假报出口骗税有专门税收犯罪条文规制，不适用普通合同诈骗罪\nB✗ 同上，特别法条优先于普通诈骗罪\nC✓ 偷税罪（现行法已改名为“逃税罪”）：甲先实打实缴纳了50万元税款，再虚构出口骗回20万元（未超出自己已缴的50万元），完全落入《刑法》第204条第2款“骗回已缴税款”情形，按\u0001逃税罪\u0002（当年旧称偷税罪）定罪处罚\nD✗ 并无骗取超过原缴50万元以外的额外国家补贴税款，不会转化也不与合同诈骗罪并罚\n【新法提示】2009年《刑法修正案（七）》将《刑法》第201条的“偷税罪”修改为“逃税罪”。当前考试遇同等案情请规范表述为“逃税罪”。","k":"","kb":98,"kh":[[15,41],[58,98]]},{"id":"2010-10","y":2010,"t":"单","s":"甲伪造10万美元假币,出售了其中的5万美元,还剩5万美元假币美元未出售。对甲的行为应 （ ）。","o":["以伪造货币罪定罪处罚","以伪造货币罪与出售假币罪并罚","以出售假币罪定罪处罚","以伪造货币罪与持有假币罪并罚"],"a":"A","e":"\u0001依据《刑法》第171条第3款规定，行为人“伪造货币并出售或者运输伪造的货币的”，不进行数罪并罚，只以重罪伪造货币罪一罪从重处罚。\u0002\nA✓ 以伪造货币罪定罪处罚：甲亲手伪造了10万美元假币，随后卖出一半留有一半，其后续“出售”和“持有”均被前面的核心上游重罪\u0001伪造货币罪\u0002所包容吸收，仅定伪造货币罪一罪并从重处罚\nB✗ 《刑法》第171条第3款排除了自己造假币自己卖/运时与第171条第1款的数罪并罚\nC✗ 只有本身没伪造、纯粹去买假币来卖的人才定出售假币罪\nD✗ 伪造剩余未卖出的5万美元假币是伪造行为当然遗留状态（不可罚的事后持有状态），不另定持有假币罪并罚","k":"","kb":96,"kh":[[370,392]]},{"id":"2010-20","y":2010,"t":"单","s":"下列行为中,应以抗税罪定罪处罚的是 （ ）。","o":["企业负责人甲指使财务人员拒不进行纳税申报","企业经理人乙在税务人员来征缴税款时指使职工暴力抗拒,致该税务人员重伤","公司财务人员丙在税务人员来征缴税款时将账簿隐藏起来,拒不交出","企业负责人丁在税务人员来征缴税款时拒绝缴纳,并指使职工砸坏征税工作车辆"],"a":"D","e":"\u0001抗税罪（《刑法》第202条）的本质核心是使用“暴力、威胁方法”当场拒不缴纳税款；仅消极拒不申报或藏匿账簿没有采用暴力威胁抗拒的，定逃税罪；而暴力抗税致税务人员重伤则依法转化为故意伤害罪！\u0002\nA✗ 消极欺瞒、拒不进行纳税申报（无暴力威胁抗拒），构成\u0001逃税罪\u0002\nB✗ 依据两高司法解释，暴力抗税过程中故意致税务人员“重伤、死亡”的，依照《刑法》第234条、第232条转化为\u0001故意伤害罪、故意杀人罪\u0002从重处罚（超越抗税罪包容限度）\nC✗ 藏匿账簿拒绝提供检查属于逃避缴税的隐瞒手段，构成\u0001逃税罪\u0002\nD✓ 企业负责人丁在税务人员来征缴税款时拒绝缴纳，并指使职工砸坏征税工作车辆：在征税现场拒绝缴税并以暴力打砸公车方式激烈威胁阻吓征税工作（未造成税务员重伤死亡），构成\u0001抗税罪\u0002（或与故意毁坏财物想象竞合，依法定抗税罪）","k":"","kb":98,"kh":[[129,209]]},{"id":"2010-23","y":2010,"t":"多","s":"虚开增值税专用发票罪的行为方式有（ ）。","o":["为他人虚开增值税专用发票","为自己虚开增值税专用发票","让他人为自己虚开增值税专用发票","介绍他人虚开增值税专用发票"],"a":"ABCD","e":"\u0001《刑法》第205条第4款明文将虚开增值税专用发票行为全面界定为四种方式：为他人虚开、为自己虚开、让他人为自己虚开、介绍他人虚开。\u0002\nA✓ 无真实货物交易而帮外部第三方公司开具发票（为他人虚开）\nB✓ 利用自己掌控的税控设备无真实购销而给自己开具（为自己虚开）\nC✓ 花钱买票让上游公司给自己虚开发票抵扣税款（让他人为自己虚开）\nD✓ 居中牵线搭桥介绍买卖双方虚开发票（介绍他人虚开）","k":"","kb":98,"kh":[[229,266]]},{"id":"2010-24","y":2010,"t":"多","s":"下列给商业秘密权利人造成重大损失的行为中,构成侵犯商业秘密罪的有（ ）。","o":["以盗窃的方法获取他人商业秘密","以贿买的手段获取他人商业秘密","明知是他人盗窃来的商业秘密而收买","违反保守商业秘密约定,披露他人商业秘密"],"a":"ABCD","e":"\u0001盗窃、贿赂、欺诈、胁迫、电子侵入获取商业秘密，或者明知非法获取而收买使用、或违反保密约定擅自披露使用他人商业秘密造成重大损失，均构成侵犯商业秘密罪。\u0002\nA✓ 以盗窃等不正当手段获取权利人商业秘密，构成侵犯商业秘密罪\nB✓ 以贿买利诱内部研发人员等不正当手段获取商业秘密，构成侵犯商业秘密罪\nC✓ 明知是他人盗窃来的商业秘密仍予收购获取、使用或者披露（第三人间接侵犯），同样构成本罪\nD✓ 合法掌握商业秘密的员工等违反保守商业秘密的约定，擅自披露、使用或允许他人使用，构成侵犯商业秘密罪\n【新法提示】《刑法修正案（十一）》对第219条进行了完善：入罪门槛由“给权利人造成重大损失”修改为“情节严重”，同时在不正当获取手段中明确新增了“电子侵入”方式。","k":"","kb":99,"kh":[[140,197]]},{"id":"2011-10","y":2011,"t":"单","s":"甲在香港购买一批香烟,隐藏于免税货物中从海关入境。该批香烟偷逃关税8万元。甲的行为构成（ ）。","o":["逃税罪","非法经营罪","走私普通货物罪","掩饰、隐瞒犯罪所得罪"],"a":"C","e":"\u0001把国外购买的合法商品（香烟）混藏进免税货物行李中企图偷逃通关应缴关税，偷逃税额8万元（注：2011年时个人走私普通货物罪入罪门槛为偷逃应缴税额5万元），定走私普通货物罪。\u0002\nA✗ 逃避的是海关进口关税而非国内税务机关征管税收，不应定逃税罪\nB✗ 虽后续涉及转卖等环节，但隐藏夹带瞒报入境偷逃关税核心行为侵害国家海关监管秩序，定走私普通货物罪\nC✓ 走私普通货物罪：行为人违反海关法规将本属一般应税合法消费品（香烟）混藏隐匿闯关逃避关税达定罪标准（注：现行司法解释个人走私普通货物入罪门槛已调整为偷逃应缴税额10万元以上，本题2011年命题按当时5万元标准判定成立\u0001走私普通货物罪\u0002）\nD✗ 甲本人就是亲自动手逃避海关的直接走私正犯，不是下游事后帮他人藏赃的第三人","k":"","kb":95,"kh":[[0,70]]},{"id":"2011-16","y":2011,"t":"单","s":"甲为牟利,未经著作权人许可,私自复制影视作品的DVD出售,销售金额4万元,获纯利润3万余元。这批DVD因质量太差导致他人在播放时经常死机。对甲的行为应定为（ ）。","o":["销售侵权复制品罪","侵犯著作权罪","非法经营罪","生产、销售伪劣产品罪"],"a":"B","e":"\u0001以营利为目的，未经著作权人许可私自“复制”并发行出售他人影视作品DVD，无论产品本身制作质量好坏，直接成立《刑法》第217条侵犯著作权罪（非仅向下游倒卖的销售侵权复制品罪）。\u0002\nA✗ 第218条“销售侵权复制品罪”专指行为人\u0001自己没有复制行为\u0002、只是去买别人已经印好的盗版光盘拿来倒卖（且入罪门槛较高，要求违法所得数额巨大即10万元以上）；而甲自己实施了\u0001“私自复制+出售”\u0002全套行为，直接构第217条侵犯著作权罪\nB✓ 侵犯著作权罪：甲以营利为目的，未经著作权人许可既“复制”又“发行销售”影视作品DVD，在违法所得达标/具其他严重情节下成立\u0001侵犯著作权罪\u0002（当时违法所得3万余元已满足旧司法解释侵犯著作权罪3万元入罪线）\nC✗ 著作权侵权由第217条专门规制，不再套用兜底的非法经营罪（注意：同时涉及非法出版物的才在当年另论，本题考点核心在“复制+出售”定侵犯著作权罪与第218条“仅销售”的区分）\nD✗ 光盘死机质量问题虽属次品但未达销售金额5万元以上（本案销售金额才4万元，不到第140条5万元伪劣产品入罪红线！）\n记法：第217条侵犯著作权罪（自己既复制又卖） VS 第218条销售侵权复制品罪（自己没印制，纯粹倒卖别人印好的盗版）。","k":"","kb":99,"kh":[[0,60]]},{"id":"2011-19","y":2011,"t":"单","s":"下列行为中,构成逃税罪的是（ ）。","o":["甲采用暴力方法拒不缴纳税款2万元","乙以逃避海关监管的方式偷逃海关关税5 万元","丙虚开增值税专用发票,造成国家税款流失 25万元","丁缴纳某批次货物税款10万元后,假报该批次货物出口,骗取出口退税8万元"],"a":"D","e":"\u0001严格把握《刑法》第204条第2款分水岭：事先已经缴纳10万元税款，后来假报出口只骗回8万元（未超过已缴的10万元）——本质只是“把刚交上去的税偷骗回来”，定逃税罪！\u0002\nA✗ 用“暴力方法”拒不缴纳税款构成\u0001抗税罪\u0002\nB✗ 逃避海关监管偷逃海关关税构成\u0001走私普通货物罪\u0002\nC✗ 虚开增值税专用发票构成\u0001虚开增值税专用发票罪\u0002\nD✓ 丁缴纳某批次货物税款10万元后，假报该批次货物出口，骗取出口退税8万元：假报出口骗取“自己此前已缴纳的税款”（8万≤10万），依据第204条第2款明文规定，依照\u0001逃税罪\u0002定罪处罚（只有若骗取了15万，超过已缴的5万元部分才另定骗取出口退税罪并与逃税罪并罚）","k":"","kb":98,"kh":[[58,127]]},{"id":"2011-45","y":2011,"t":"多","s":"甲伪造食盐专营许可证,从盐业公司购进30 吨食盐进行销售。同时,还从一非法生产者处购进明知系假冒注册商标的非碘盐,冒充碘盐进行销售,销售金额达30万元。关于本案,下列说法中正确的有 （ ）。","o":["甲的行为构成非法经营罪","甲的行为构成假冒注册商标罪","甲的行为构成销售伪劣产品罪","甲伪造国家机关证件的行为与非法经营的行为具有牵连关系"],"a":"ACD","e":"\u0001甲未取得食盐专营许可而非法经营食盐、同时购进假冒他人商标的“非碘盐”冒充碘盐销售30万元，既构成非法经营罪和销售伪劣产品罪，且前手“伪造食盐专营许可证（伪造国家机关证件）”与后手“非法经营”之间具有手段目的牵连关系；但他只是从上游买来已贴假标的成品直接卖，并未自己“制造假冒商标”或使用在同类“合法真盐”上，不构成假冒注册商标罪！\u0002\nA✓ 在2011年食盐专营管控体制下，未经许可经营食盐专营物品情节严重构成\u0001非法经营罪\u0002\nB✗ 第213条假冒注册商标罪惩罚的是“自己未经许可在同一种商品上\u0001擅自印制/使用\u0002他人注册商标的假冒生产者”；而甲仅从他人处购进已经假冒贴牌好的非碘盐进行销售，客观上属于销售行为而非自己冒用制造（何况食盐专卖销售主要规制在销售假冒商标商品罪且非本题“假冒注册商标罪”）\nC✓ 用非碘盐以假充真冒充加碘食盐销售达30万元，符合第140条\u0001销售伪劣产品罪\u0002（以假充真且销售金额远超5万元）\nD✓ 伪造国家机关证件罪（假食盐专营许可证）是为顺利实现后续非法经营行为而实施的手段行为，二者形成\u0001牵连关系\u0002（注：非法经营罪与销售伪劣产品罪想象竞合，与伪造证件牵连，依法择一重处）\n【新法/政策提示】自2017年我国《盐业体制改革方案》放开食盐批零跨区限制等行政许可政策调整后，新法环境下单纯未批售普通合法食盐不再当然一律按非法经营罪定罪；但本题甲不仅无证且“伪造国家机关许可证”并以非碘盐冒充加碘盐高额售假，依当年考纲逻辑亦清晰演示了“伪造证件→非法经营→售假”的牵连与竞合辨析。","k":"","kb":99,"kh":[[337,381]]},{"id":"2012-20","y":2012,"t":"单","s":"下列情形中,应当以非法经营罪定罪处罚的是（ ）。","o":["甲销售盗版图书,违法所得20万元","乙开办公司专门为他人虚开增值税专用发票, 违法所得20万元","丙公司未经证监会批准,非法从事证券业务, 违法所得100万元","丁开办废品站专门从盗窃犯罪分子手中收购赃物,倒卖牟利,违法所得20万元"],"a":"C","e":"\u0001未经国家证券监督管理机构批准擅自非法从事证券业务达100万元，属于《刑法》第225条第3项明确列举的非法经营罪（证券、期货、保险业务）；其余三项分别属第218条销售侵权复制品、第205条虚开增值税发票、第312条掩饰隐瞒犯罪所得。\u0002\nA✗ 自己未印制而单纯贩卖盗版图书违法所得20万元，构成第218条\u0001销售侵权复制品罪\u0002\nB✗ 专门为他人虚开增值税专用发票构成第205条\u0001虚开增值税专用发票罪\u0002\nC✓ 丙公司未经证监会批准，非法从事证券业务，违法所得100万元：精准对应《刑法》第225条第3项“未经国家有关主管部门批准非法经营证券、期货、保险业务的”，构成\u0001非法经营罪\u0002\nD✗ 废品站明知系盗窃赃物而收购、倒卖牟利构成第312条\u0001掩饰、隐瞒犯罪所得罪\u0002","k":"","kb":99,"kh":[[383,391]]},{"id":"2012-43","y":2012,"t":"多","s":"组织领导传销活动罪中“传销活动”的特征包括（ ）。","o":["目的是骗取他人财物","参加者按照一定顺序组成层级开展活动","计酬或者返利以参加者发展的人员数量为依据","要求参加者以缴纳费用或者购买商品、服务等方式获得加入资格"],"a":"ABCD","e":"\u0001直接对照《刑法》第224条之一“组织、领导传销活动罪”法定定义四要素：以推销商品服务等经营活动为名、要求缴费或购商品取得资格（入门费）、组成层级团队（层级性）、以直接或间接发展人员数量计酬返利（拉人头计酬）、骗取财物。\u0002\nA✓ 实质目的是通过发展下线“拉人头”骗取加入者财物（并非靠真实消费产品价值赚钱）\nB✓ 参加者按照上下线推荐关系组成三个以上层级开展团队计酬传销活动\nC✓ 返利/奖金不是靠个人实际卖掉多少产品，而是直接或间接以向下发展人员的数量作为计酬依据\nD✓ 必须预先缴纳高额“入门费”或者认购高价指定商品服务作为获得入局发展下线资格的前提条件","k":"","kb":99,"kh":[[199,276]]},{"id":"2013-10","y":2013,"t":"单","s":"2010年7月,甲成立了一公司,宣称只要购买该公司999元的产品,便可成为“商务代表”,获取发展人员资格,并以发展人员的数量支付报酬。甲共引诱2987人参加并形成了五级“销售”网络,骗取财物总值200余万元。对甲的行为（ ）。","o":["应以诈骗罪定罪处罚","应以非法经营罪定罪处罚","应以集资诈骗罪定罪处罚","应以组织、领导传销活动罪定罪处罚"],"a":"D","e":"\u0001“买999元产品获‘商务代表’发展人员资格+五级网络+按发展人头数量支付报酬+骗取200余万”，四大构成特征与第224条之一组织、领导传销活动罪分毫不差！\u0002\nA✗ 诈骗罪为普通法条；在利用传销层级拉人头模式骗财时，优先适用特别条文组织、领导传销活动罪\nB✗ 在2009年《刑修七》增设第224条之一之前传销曾按非法经营罪判处，但《刑修七》之后已单独成罪，绝不退回兜底定非法经营罪\nC✗ 甲并不是承诺保本付息向公众非法吸资金融诈骗，而是拉人头发展五级消费代表网络\nD✓ 应以组织、领导传销活动罪定罪处罚：甲作为公司设立者和组织领导者，以购999元产品为入门门槛、构建五级层级、按拉人头数量计酬骗财，100%成立\u0001组织、领导传销活动罪\u0002","k":"","kb":99,"kh":[[276,299]]},{"id":"2013-20","y":2013,"t":"单","s":"甲公司明知乙受贿,仍提供银行账户帮助乙将受贿所得兑换成美元,汇往境外,并收取乙支付的高额“手续费”。对甲公司的行为应认定为（ ）。","o":["受贿罪","洗钱罪","非法经营罪","掩饰、隐瞒犯罪所得罪"],"a":"B","e":"\u0001受贿罪属于贪污贿赂犯罪，正是《刑法》第191条洗钱罪七大上游犯罪之一；甲公司明知乙收受贿赂所得赃款而提供资金账户协助兑换美元并汇往境外，单位同样可成为洗钱罪主体，构成洗钱罪。\u0002\nA✗ 甲公司只是受乙委托协助事后转移清洗受贿赃款（并非事前共同索贿受贿），不构成受贿罪\nB✓ 洗钱罪：受贿犯罪属于洗钱罪法定上游犯罪；甲公司（《刑法》第191条第2款明文规定单位可以犯洗钱罪）提供资金账户协助将受贿赃款兑换美元汇往境外以掩饰、隐瞒其来源性质，完全成立\u0001洗钱罪\u0002\nC✗ 虽然提供了资金账户兑换外币协助转移资金，但明确为了掩饰、隐瞒受贿违法所得来源性质，优先适用第191条特别洗钱罪（并非普通地下钱庄泛滥经营外汇的非法经营罪）\nD✗ 下游第312条掩饰、隐瞒犯罪所得罪是普通法条；面对第191条法定七大上游犯罪（含贪污贿赂）洗钱手段，特别法条\u0001洗钱罪\u0002优先适用","k":"","kb":97,"kh":[[143,188]]},{"id":"2014-14","y":2014,"t":"单","s":"下列行为中,应以非国家工作人员受贿罪定罪处罚的是（ ）。","o":["税务局局长甲,要求辖区内的公司为该局建设办公楼提供财物支持","国有资产管理公司负责人乙,在处置国有资产的过程中,收受他人财物","已离职的工商局局长丙,收受刘某的钱财,要求被自己提拔起来的工商局副局长停止对刘某销售伪劣产品案件的查处","已退休的卫生局局长丁,与朋友共同出资设立有限责任公司,并担任副总经理,利用这一职务在采购物资时收受回扣归自己所有"],"a":"D","e":"\u0001退休的老局长早已离开国家公职岗位脱离国有资产管理职权；其与朋友合伙设立的普通有限责任公司副总经理职务属于纯粹民营企业员工身份，利用该民企采购职权吃回扣构成非国家工作人员受贿罪（第163条）！\u0002\nA✗ 税务局局长甲属于国家机关工作人员，利用税务管辖职权向辖区企业强索办公楼赞助财物（无论入私囊还是单位利益注意：为本单位公款索赞助可能涉单位受贿，若个人收受则受贿，绝非“非国家工作人员受贿”）\nB✗ 国有资产管理公司负责人乙（或国有公司委派从事公务人员）在处置国有资产中利用职务便利受贿，以国家工作人员论，构成\u0001受贿罪\u0002\nC✗ 离职的工商局局长丙收钱后让曾提拔的现任工商局副局长停止查处违法案件，离职人员利用原职权形成的影响力收钱办事，构成\u0001利用影响力受贿罪\u0002\nD✓ 已退休的卫生局局长丁，与朋友共同出资设立有限责任公司，并担任副总经理，利用这一职务在采购物资时收受回扣归自己所有：退休后彻底回归普通私营有限责任公司高管职务，此时在私人公司采购中吃回扣完全与公权力无关，依法成立\u0001非国家工作人员受贿罪\u0002","k":"","kb":96,"kh":[[93,145]]},{"id":"2014-43","y":2014,"t":"多","s":"下列行为中,应以合同诈骗罪定罪处罚的有（ ）。","o":["甲以虚构的单位与某公司签订合同,骗取数额较大的财物后潜逃","乙与电脑公司签订代销合同,在收到对方送来的代销电脑后携带电脑潜逃","丙谎称手中有优质投资项目,吸引公众投资, 收取巨额投资款后挥霍一空","丁以假房产证作担保,与银行签订借款合同, 骗取巨款后购买豪车"],"a":"AB","e":"\u0001《刑法》第224条规定了合同诈骗罪的典型表现方式：包括“以虚构的单位或者冒用他人名义签订合同”、“收受对方当事人给付的货物、货款、预付款或者担保财产后逃匿”等；向公众集资挥霍属集资诈骗罪，用假房产证骗银行贷款属贷款诈骗罪。\u0002\nA✓ 完全符合第224条第1项“以虚构的单位或者冒用他人名义签订合同的”，成立\u0001合同诈骗罪\u0002\nB✓ 完全符合第224条第4项“收受对方当事人给付的货物后逃匿的”，成立\u0001合同诈骗罪\u0002\nC✗ 向社会不特定公众公开虚假宣传高利投资项目筹集巨额投资款并挥霍，属于针对社会金融投资群体的\u0001集资诈骗罪\u0002（第192条）\nD✗ 以假房产证作担保欺骗\u0001银行\u0002签订借款合同骗取贷款，侵害银行贷款金融秩序，特别法优先适用第193条\u0001贷款诈骗罪\u0002","k":"","kb":97,"kh":[[0,33]]},{"id":"2014-45","y":2014,"t":"多","s":"下列行为中,应以侵犯著作权罪定罪处罚的有（ ）。","o":["甲复制外国的淫秽影片出售,获利数额较大","乙未经录像制作者许可,复制其制作的录像, 获利数额较大","丙未经权利人许可,复制发行他人计算机软件并出售牟利,获利数额较大","丁未经拍摄者许可,将其拍摄的大量视频文件上传到网络免费供他人下载"],"a":"BC","e":"\u0001《刑法》第217条侵犯著作权罪保护录像制作者（B）和计算机软件著作权人（C）；而盗版淫秽物品（违禁违法物品）不受著作权法保护（应定复制传播淫秽物品牟利罪），且免费上传供下载既非以“营利为目的”也不属法定入罪要件（注：除非修十一后情节严重情形但题干无营利也无违法所得）。\u0002\nA✗ 淫秽影片属于国家严禁出版传播的违禁淫秽物品，没有合法受刑法著作权条文保护的作品地位；复制出售淫秽影片获利定\u0001复制淫秽物品牟利罪\u0002\nB✓ 未经录像制作者许可，以营利为目的复制发行其制作的录像并获利数额较大，精准符合第217条第3项\u0001侵犯著作权罪\u0002\nC✓ 未经著作权人许可，复制发行他人计算机软件并出售牟利获利较大，符合第217条第1项\u0001侵犯著作权罪\u0002\nD✗ “免费供他人下载”不具备\u0001“以营利为目的”\u0002（第217条成立前提：2014年真题及通说均严守“以营利为目的”；注意《刑修十一》仍保留“以营利为目的”作为217条开篇核心主观要件！），因此不构成本罪（仅承担民事侵权责任）","k":"","kb":99,"kh":[[0,32],[56,85],[103,107]]},{"id":"2015-11","y":2015,"t":"单","s":"空姐甲长期在国外购买化妆品,经无申报通道携带入境,交由其表妹在网店销售,偷逃高额海关关税,获利数额巨大。甲的行为应认定为（ ）。","o":["逃税罪","走私普通货物、物品罪","非法经营罪","为亲友非法牟利罪"],"a":"B","e":"\u0001空姐利用执飞便利在国外买化妆品经无申报通道偷运携带入境交表妹转卖，偷逃巨额关税，属于典型的绕关/瞒关闯关走私普通货物、物品行为（《刑法》第153条）。\u0002\nA✗ 逃避的是海关进口关税及进口环节增值税，适用第153条走私普通货物物品罪，而非税务机关日常征管之逃税罪\nB✓ 走私普通货物、物品罪：逃避海关监管经无申报通道非法携带境外应税商品（化妆品）进境偷逃巨额关税，成立\u0001走私普通货物、物品罪\u0002\nC✗ 网店代购转卖自己走私进境商品，主体核心行为在于逃避海关监管偷逃关税\nD✗ “为亲友非法牟利罪”主体仅限国有公司、企业、事业单位工作人员利用职务将本单位盈利业务交由亲友经营等，与空姐海关私带完全无关","k":"","kb":95,"kh":[[0,70]]},{"id":"2015-17","y":2015,"t":"单","s":"下列行为中,可以认定为妨害信用卡管理罪的是（ ）。","o":["拾得他人信用卡并使用","窃得他人信用卡并使用","使用虚假的居民身份证骗领信用卡","使用以虚假居民身份证骗领的信用卡"],"a":"C","e":"\u0001依据《刑法》第177条之一，“使用虚假的居民身份证骗领信用卡的”即直接成立妨害信用卡管理罪；而骗领之后进一步实际拿卡去消费取现才升级定信用卡诈骗罪！\u0002\nA✗ 拾得他人信用卡并实际刷卡取现使用的，属于第196条第1款第3项“冒用他人信用卡”，定\u0001信用卡诈骗罪\u0002\nB✗ 窃得他人信用卡并实际使用的，依第196条第3款拟制直接定\u0001盗窃罪\u0002\nC✓ 使用虚假的居民身份证骗领信用卡：仅处于虚假申领卡片阶段（尚未实际持该卡恶意透支或诈骗银行资金），精准符合第177条之一第1款第3项\u0001妨害信用卡管理罪\u0002\nD✗ 已经“使用”以虚假身份证骗领的信用卡去消费取现套利（直接骗取银行放贷资金），适用第196条第1款第1项定\u0001信用卡诈骗罪\u0002","k":"","kb":97,"kh":[[285,332],[376,394]]},{"id":"2015-44","y":2015,"t":"多","s":"下列行为中,应以非法经营罪(不考虑数额或者情节)定罪处罚的有（ ）。","o":["甲在生产的饲料中添加“瘦肉精”","乙私设转接设备,擅自经营国际电信业务","丙组织多人出卖人体器官,并从中获取介绍费","丁用POS机为他人刷信用卡套取现金,赚取手续费"],"a":"ABD","e":"\u0001依法及司法解释明文规定均属非法经营罪：在饲料中非法添加违禁“瘦肉精”（A）、私设转接设备擅自经营国际电信业务（B）、用POS机虚构交易为他人套现赚取手续费（D）；组织出卖人体器官另有专门罪名。\u0002\nA✓ 在生产的饲料中添加国家明令禁止的盐酸克仑特罗等“瘦肉精”并销售，依两高司法解释以\u0001非法经营罪\u0002定罪处罚\nB✓ 未经电信部门许可，私设VOIP转接设备或国际专线擅自经营国际电信业务扰乱电信市场秩序，依司法解释以\u0001非法经营罪\u0002定罪处罚\nC✗ 组织多人出卖人体器官并收取介绍费构成《刑法》第234条之一第1款专设独立罪名——\u0001组织出卖人体器官罪\u0002，不适用非法经营罪\nD✓ 违反国家银行卡收单规定，利用POS机通过虚构商品交易刷卡套现并赚取手续费，依两高司法解释以\u0001非法经营罪\u0002定罪处罚","k":"","kb":99,"kh":[[307,312],[392,436]]},{"id":"2016-13","y":2016,"t":"单","s":"甲将面粉制作的小丸冒充消炎药卖给某药店,获利巨大。对甲的行为（ ）。","o":["应以诈骗罪定罪处罚","只能以生产、销售假药罪定罪处罚","只能以生产、销售伪劣产品罪定罪处罚","应以生产、销售假药罪与生产、销售伪劣产品罪择一重罪处断"],"a":"D","e":"\u0001把面粉捏成小丸冒充消炎药卖给药店获利巨大，既属于《刑法》第141条“以非药品冒充药品”的假药罪，又构成第140条“以假充真”的伪劣产品罪；依第149条明文竞合规则应“依照处罚较重的规定定罪处罚”（择一重罪）。\u0002\nA✗ 向药店出售以假充真药品，有特别生产销售假药/伪劣产品法条竞合优先适用，不直接单论普通诈骗罪（注意真题2016单选在假药罪与伪劣产品罪中依第149条直接作竞合择一重罪处断，且当时两罪并列待选重罪）\nB✗ “只能以假药罪”忽略了该行为同时完全符合第140条生产销售伪劣产品罪（销售金额巨大时第140条可判至15年/无期，反比未致死伤假药罪更重），必须依第149条比对法定刑从一重处断\nC✗ “只能以伪劣产品罪”同样绝对化，若后续查实加重情节或金额未比假药重，则从假药罪重罪，故必须“择一重处”\nD✓ 应以生产、销售假药罪与生产、销售伪劣产品罪择一重罪处断：严格符合《刑法》第149条之法定法条竞合择一重处断原则","k":"","kb":94,"kh":[[95,140],[159,185]]},{"id":"2016-42","y":2016,"t":"多","s":"下列行为中,可以构成侵犯著作权罪的有（ ）。","o":["出售假冒某画家署名的油画","出版某出版社享有专有出版权的考试辅导书","未经某作家许可,复制发行其创作的历史小说","未经某音像公司许可,复制发行其制作的音乐唱片"],"a":"ABCD","e":"\u0001对照《刑法》第217条法定四种核心侵犯著作权方式（2016考纲及修十一均严密涵盖）：制作、出售假冒他人署名的美术作品（A）、出版他人享有专有出版权的图书（B）、未经许可复制发行文字作品（C）或录音录像制品（D）。\u0002\nA✓ 《刑法》第217条专门独立列举：制作、出售假冒他人署名的美术作品（如冒充著名画家签名卖假油画），直接构成侵犯著作权罪\nB✓ 在2016年考纲有效《刑法》第217条中，出版他人享有专有出版权的图书属第2项明确列举情形（注：《刑修十一》将此项“出版专有出版权图书”在文字整合中微调至授权及传播体系下或视侵权复制处理；按2016年真题及现行第217条第2项实际仍覆盖“出版他人享有专有出版权的图书的”，现行《刑修十一》依然保留了该第2项！）\nC✓ 未经著作权人许可复制发行其文字作品（历史小说），属第1项最典型情形\nD✓ 未经录音制作者许可复制发行其制作的音乐唱片，属第3项（现行条文第4项）明确列举情形","k":"","kb":99,"kh":[[0,17],[56,60],[103,123]]},{"id":"2017-13","y":2017,"t":"单","s":"下列选项中,属于信用卡诈骗罪中冒用他人信用卡情形的是（ ）。","o":["盗窃他人信用卡并使用","使用作废的信用卡","使用伪造的信用卡","拾得他人信用卡并使用"],"a":"D","e":"\u0001依据《刑法》第196条及两高司法解释，拾得他人遗失的信用卡并使用属于典型的“冒用他人信用卡”；盗窃后使用定盗窃罪；使用作废卡与伪造卡是与“冒用他人信用卡”并列的其他类型。\u0002\nA✗ 盗窃他人信用卡并使用的，依第196条第3款法律拟制直接按\u0001盗窃罪\u0002论处\nB✗ 使用作废的信用卡是第196条第1款第2项独立列举行为，与第3项“冒用他人信用卡”分立并列\nC✗ 使用伪造的信用卡（或以虚假身份骗领卡）是第196条第1款第1项独立列举行为，不属于冒用他人真实合法信用卡\nD✓ 拾得他人信用卡并使用：卡片系原持卡人真实合法有效卡，拾得人非盗非伪非废而冒充持卡人身份刷卡取现，精准符合第196条第1款第3项\u0001冒用他人信用卡\u0002","k":"","kb":97,"kh":[[395,413]]},{"id":"2018-10","y":2018,"t":"单","s":"下列关于走私罪的表述正确的是（ ）。","o":["走私的废物中混有普通货物的,构成走私废物罪","基于走私目的向海关人员行贿数额巨大的,应数罪并罚","走私普通货物偷逃关税数额特别巨大的,可以判处死刑","具有走私故意但对走私具体对象不明确而走私的,应认定无罪"],"a":"A","e":"\u0001依据《两高办理走私刑事案件适用法律若干问题的解释》，走私的废物中混有普通货物的，以走私废物罪一罪定罪处罚；《刑修八》已废除走私普通货物罪死刑；走私概括故意按实际走私对象定罪；仅有走私意图而向海关行贿的定行贿罪一罪。\u0002\nA✓ 走私的废物中混有普通货物的，构成走私废物罪：依最高法司法解释，走私禁止或限制进口固体废物中混杂普通货物的，按较重且主要性质的\u0001走私废物罪\u0002一罪定罪处罚（混有其他违禁品的才并罚）\nB✗ 题干仅称“基于走私目的（主观尚停留在想法意图阶段）向海关人员行贿”，并未交待实际实施走私货物通关行为本身，因此目前仅构成\u0001行贿罪一罪\u0002，不成立数罪并罚\nC✗ 2011年《刑法修正案（八）》已正式废除了走私普通货物、物品罪的死刑（最高刑为无期徒刑）\nD✗ 对走私具体物品不明确但具有概括走私故意的，并非宣告无罪，而是依照主客观相统一原则根据\u0001实际查获的走私犯罪对象\u0002定罪处罚","k":"","kb":95,"kh":[[200,281]]},{"id":"2018-43","y":2018,"t":"多","s":"在情节严重的情况下,下列行为应认定为非法经营罪的有（ ）。","o":["使用伪造的药品经营许可证,非法经营药品","长期以暴力手段强迫他人向自己借款,赚取利息","以营利为目的,长期通过网络有偿提供删除信息服务","非法生产具备赌博功能的电子游戏机,供他人开设赌场"],"a":"ACD","e":"\u0001无证/假证卖药（A）、以营利为目的网络有偿删帖（C）、非法生产销售赌博机供开设赌场（D）均有两高明确司法解释按《刑法》第225条非法经营罪追责；暴力强迫借钱赚利息构成强迫交易罪。\u0002\nA✓ 违反国家药品管理法规，使用伪造药品经营许可证非法经营药品扰乱药品市场秩序情节严重的，依司法解释定\u0001非法经营罪\u0002（注：《刑修十一》将未取得批文进口药品纳入妨害药品管理罪，但不含持假经营许可证无照违规流通合规药品）\nB✗ 长期以暴力手段强迫他人向自己借款以赚取利息，构成《刑法》第226条\u0001强迫交易罪\u0002（强迫接受金融借贷服务）或非法放贷等，2018考纲明确对应强迫交易罪而不选作非法经营罪\nC✓ 违反国家规定，以营利为目的通过信息网络有偿提供删除信息服务情节严重的，依两高网络诽谤司法解释以\u0001非法经营罪\u0002定罪处罚\nD✓ 非法生产、销售具有赌博功能的电子游戏机供他人开设赌场（或作为开设赌场共犯/独立非法经营赌博器材），依两高涉赌司法解释明确以\u0001非法经营罪\u0002定罪处罚","k":"","kb":99,"kh":[[437,464]]},{"id":"2018-45","y":2018,"t":"多","s":"生产、销售伪劣产品罪的客观方面表现为,在生产销售的产品中（ ）。","o":["以次充好","以假充真","掺杂","掺假"],"a":"ABCD","e":"\u0001完整背诵《刑法》第140条生产、销售伪劣产品罪客观行为五选四模式：“掺杂、掺假，以假充真，以次充好，或者以不合格产品冒充合格产品”。\u0002\nA✓ “以次充好”（低等级低质量产品冒充高等级优质品）属于第140条明文行为\nB✓ “以假充真”（假货冒充完全不同属性真品）属于第140条明文行为\nC✓ “掺杂”（混入无关杂质增加重量体积）属于第140条明文行为\nD✓ “掺假”（混入假冒伪劣替代品成分）属于第140条明文行为","k":"","kb":94,"kh":[[22,55]]},{"id":"2019-4","y":2019,"t":"单","s":"下列选项中,不属于洗钱罪的上游犯罪的是（ ）。","o":["毒品犯罪","贪污犯罪","走私犯罪","组织传销活动犯罪"],"a":"D","e":"\u0001现行《刑法》第191条洗钱罪严格限定七大类上游犯罪：毒品犯罪、黑社会性质的组织犯罪、恐怖活动犯罪、走私犯罪、贪污贿赂犯罪、破坏金融管理秩序犯罪、金融诈骗犯罪。组织传销活动罪属于破坏市场经济秩序罪但不在这七类上游之内！\u0002\nA✗ 毒品犯罪属于洗钱罪第一大法定上游犯罪\nB✗ 贪污贿赂犯罪自《刑修六》起即属洗钱罪法定上游犯罪\nC✗ 走私犯罪属于洗钱罪核心法定上游犯罪\nD✓ 组织传销活动犯罪（正选不属于项）：帮助隐瞒掩饰组织、领导传销活动犯罪违法所得的，因传销不在第191条七类上游犯罪之列，应定第312条\u0001掩饰、隐瞒犯罪所得罪\u0002，不构成洗钱罪\n记法：洗钱罪七大上游神级口诀：“毒黑恐走，贪金破”（毒＝毒品、黑＝黑社会、恐＝恐怖活动、走＝走私、贪＝贪污贿赂、金＝金融诈骗、破＝破坏金融管理秩序）。","k":"","kb":97,"kh":[[158,226]]},{"id":"2019-43","y":2019,"t":"多","s":"下列人员中,利用职务上的便利,非法收受他人财物为他人谋取利益,数额较大,可以构成非国家工作人员受贿罪的有（ ）。","o":["公立医院的医生","村民委员会主任","工程承包队队长","文艺演出筹委会主任"],"a":"ABCD","e":"\u0001非国家工作人员受贿罪主体涵盖所有非国有公司、企业或其他单位中不具有国家工作人员身份的工作人员：公立医院普通医护人员（非行政领导公务岗）、村委会主任（处理纯自治村务而非协助行政管理时）、工程承包队负责人及文艺筹委会主任均可以成为该罪主体！\u0002\nA✓ 公立医院的普通临床医生（非院长等行政管理职权者）利用开处方/采购耗材临床诊疗职务便利收受药代回扣，以\u0001非国家工作人员受贿罪\u0002论处（最高法两高医疗商业贿赂意见明确规定）\nB✓ 村民委员会主任平时经手普通村集体土地发包、集体财产管理等非全国人大立法解释列举之“协助政府行政管理工作”的普通村级自治事务时收受贿赂，构成\u0001非国家工作人员受贿罪\u0002（《刑法》第163条“其他单位工作人员”）\nC✓ 工程承包队虽然非法人企业，但作为相对稳定的“其他单位”，其队长利用工程发包采购便利收受回扣亦属非国家工作人员受贿罪\nD✓ 文艺演出筹委会等临时性组织机构亦属于“其他单位”范畴，其主任利用筹办演出招标便利受贿同样构成本罪","k":"","kb":96,"kh":[[39,92]]},{"id":"2020-16","y":2020,"t":"单","s":"甲在其制作的玉米馒头中违规超量添加色素,销售金额累计达22万元。此种色素为合法食品添加剂,超量使用不足以造成严重食物中毒事故或者其他严重食源性疾病。甲的行为应认定为（ ）。","o":["不构成犯罪","生产、销售伪劣产品罪","生产、销售有毒、有害食品罪","生产、销售不符合安全标准的食品罪"],"a":"B","e":"\u0001注意法律严格区分：“合法食品添加剂（但违规超限量使用）”且“不足以造成严重食物中毒或者其他严重食源性疾病”——既非有毒有害非食品原料（排除有毒有害食品罪），又无致严重疾病危险（排除不符合安全标准食品罪），仅属不合格产品（销售额22万≥5万），成立生产、销售伪劣产品罪！\u0002\nA✗ 销售不合格产品金额达22万元，已远远超过第140条5万元入罪门槛\nB✓ 生产、销售伪劣产品罪：在产品中超范围或超限量使用合法添加剂致成品不符合食品安全标准，但未达到足以造成严重食物中毒事故危险也不含非食品有毒物质，属于“以不合格产品冒充合格产品”，且销售金额超过5万元，准确构成\u0001生产、销售伪劣产品罪\u0002\nC✗ 第144条生产、销售有毒、有害食品罪要求掺入的是国家明禁的“有毒、有害的\u0001非食品原料\u0002”（如工业酒精、瘦肉精、吊白块）；本案色素本身是“合法食品添加剂”\nD✗ 第143条生产、销售不符合安全标准的食品罪是具体危险犯，必须达到“足以造成严重食物中毒事故或者其他严重食源性疾病”的程度；题干已明确排除了该危险","k":"","kb":94,"kh":[[67,92]]},{"id":"2021-9","y":2021,"t":"单","s":"甲伪造身份证骗领了5张信用卡，用其在网上银行套取10万元用于个人消费，后将卡销毁。甲的行为应认定为（ ）。","o":["伪造身份证件罪","妨害信用卡管理罪","盗窃罪","信用卡诈骗罪"],"a":"D","e":"\u0001“伪造身份证骗领信用卡（触犯伪造身份证件罪+妨害信用卡管理罪）→再用该假身份骗领来的信用卡套取10万元（触犯信用卡诈骗罪）”，手段行为与最终骗钱目的行为之间存在紧密牵连，依法按重罪信用卡诈骗罪一罪处罚！\u0002\nA✗ 伪造身份证只是前面用来冒名办卡的手段步骤之一\nB✗ “以虚假身份证件骗领信用卡”虽本身成立妨害信用卡管理罪，但在拿卡去套取10万元得手后即被目的重罪信用卡诈骗罪吸收\nC✗ 并不是偷别人名下既有卡取钱，而是冒用虚假身份向银行申办骗领新卡再恶意套取银行信用资金，定信用卡诈骗罪\nD✓ 信用卡诈骗罪：根据《刑法》第196条第1款第1项，“使用以虚假的身份证明骗领的信用卡的”即属信用卡诈骗；全案伪造证件、骗领卡片皆为最终刷卡套取10万元的手段，牵连从一重定\u0001信用卡诈骗罪\u0002","k":"","kb":97,"kh":[[376,394]]},{"id":"2021-20","y":2021,"t":"单","s":"下列行为如满足数额条件,应认定为伪造货币罪的是（ ）。","o":["将英镑揭层一分为二","用黄金铸造流通的纪念金币","临摹欧元收藏","铸造珍稀古钱币"],"a":"B","e":"\u0001“流通的纪念金币”依然是我国央行依法发行具有法定面额及流通货币职能的国家货币（非法用黄金私自仿造足量假纪念金币照样损害法定货币信用与金融秩序），满足数额即构成伪造货币罪！\u0002\nA✗ 将真纸币（真英镑）揭层把正反面一分为二再拼贴粘贴增加张数，属于“在真币基础上加工”，定\u0001变造货币罪\u0002（第173条）而非伪造货币罪\nB✓ 用黄金铸造流通的纪念金币：央行发行的贵金属流通纪念金币依法属于现行流通人民币货币体系组成部分；哪怕用真金真银非法仿制印铸流通货币也侵害国家独家货币发行权，成立\u0001伪造货币罪\u0002\nC✗ 纯粹为了个人欣赏临摹绘画欧元收藏，既不以流通使用骗人为目的也不具备足以乱真的交易货币形态，不构犯罪\nD✗ 早已退出历史流通舞台的古代珍稀钱币不属于国内市场可流通或兑换的现行货币，伪造古钱币骗卖给收藏家可能成立诈骗罪，绝不成立伪造货币罪","k":"","kb":96,"kh":[[271,369]]},{"id":"2021-45","y":2021,"t":"多","s":"下列选项中,应认定为生产、销售有毒、有害食品罪的有（ ）。","o":["丙在屠宰过程中给牛肉注水并出售","丁在勾兑白酒时加入工业酒精并出售","甲使用洗衣粉加工油条并出售","乙使用工业盐腌制鸭蛋并出售"],"a":"BCD","e":"\u0001“有毒、有害食品罪”的核心门槛在于添加物必须是国家禁用或对人体有毒害性的“非食品原料”：工业酒精（甲醇剧毒）、洗衣粉、工业盐（亚硝酸钠剧毒）均属毒害非食品原料；给牛肉注普通水（不属有毒害物）只能按伪劣产品罪处理！\u0002\nA✗ 向牛肉里“注普通清水”属于掺杂掺水降低肉质但水本身无毒无害，如销售金额达5万元构成\u0001生产、销售伪劣产品罪\u0002，不成立有毒、有害食品罪\nB✓ 工业酒精含有剧毒甲醇致盲致死，在勾兑白酒中掺入并出售，成立\u0001生产、销售有毒、有害食品罪\u0002\nC✓ 洗衣粉是严禁食用的日化合成洗涤剂（有毒有害非食品原料），用以炸油条出售构成本罪\nD✓ 工业盐通常含高度毒性亚硝酸盐严禁食用，用来腌制鸭蛋出售构成本罪","k":"","kb":94,"kh":[[310,364]]},{"id":"2022-7","y":2022,"t":"单","s":"甲从拾到的手机中看到了失主的身份证信息和银行卡信息,遂将失主的微信与该银行卡绑定,并将卡上资金转到自己的微信钱包,且数额较大。甲的行为应认定为","o":["盗窃罪","侵占罪","信用卡诈骗罪","侵犯公民个人信息罪"],"a":"C","e":"\u0001拾得被害人手机并窥得身份证和银行卡密码/信息，悄悄绑定微信后划转卡内巨额存款——既非从卡主包里“秘密偷取银行卡”（是拾得），而是冒用持卡人电子验证信息通过发卡行/第三方支付向银行发起转账指令，精准定“冒用他人信用卡”型信用卡诈骗罪！\u0002\nA✗ 注意两高信用卡诈骗解释关键界分：窃取银行卡/信用卡信息资料后划转资金的定盗窃罪；但本题甲是\u0001“拾得”手机\u0002后看见银行卡和身份证信息绑定使用，属于“拾得他人信用卡/金融凭证信息资料并冒用”，在2022年法硕真题及主流实务判例（对比窃取定盗窃）中定\u0001信用卡诈骗罪\u0002！\nB✗ 即使拾得手机实体，划转银行卡内巨额存款远超拾得遗失物（手机）本身且是积极发起冒名绑定消费转账指令欺诈金融支付系统，不单定侵占罪\nC✓ 信用卡诈骗罪：甲并非“窃取”信用卡或信用卡信息，而是\u0001拾得\u0002他人手机查看银行卡信息后绑定微信转款冒名使用，符合《刑法》第196条“冒用他人信用卡”情形（借记卡在刑法立法解释中亦包括在信用卡范围内），定\u0001信用卡诈骗罪\u0002\nD✗ 偷看自己捡到的一部手机内卡主的身份信息转款，不具备向他人出售或非法批量提供公民个人信息的公开传播危害行为","k":"","kb":97,"kh":[[395,413]]},{"id":"2023-6","y":2023,"t":"单","s":"甲明知乙实施销售假药犯罪,仍为其提供广告宣传,甲的行为应认定为","o":["销售假药罪","非法经营罪","虚假广告罪","不构成犯罪"],"a":"A","e":"\u0001明知他人从事生产、销售假药犯罪，而专门为其提供广告宣传推广协助销售的，依照两高危害药品安全司法解释明文规定，以生产、销售假药罪的共犯定罪处罚！\u0002\nA✓ 销售假药罪：根据《两高关于办理危害药品安全刑事案件适用法律若干问题的解释》，明知他人实施生产、销售假药犯罪而为其提供广告宣传等帮助行为的，直接以\u0001销售假药罪\u0002（生产、销售假药罪）共犯论处\nB✗ 有明确的假药犯罪共犯规定，不按普通非法经营罪处理\nC✗ 若广告商不明知是假药仅夸大功效或受骗误发虚假宣传广告可能另涉虚假广告罪；一旦“明知乙实施销售假药犯罪”仍替其推广宣传，就升级为销售假药罪共同犯罪（重法或特定共犯吸收轻罪虚假广告）\nD✗ 明知假药故意打广告助纣为虐害人，当然构成严重刑事犯罪","k":"","kb":94,"kh":[[200,225]]},{"id":"2023-8","y":2023,"t":"单","s":"下列行为中,不构成强迫交易罪的是","o":["以暴力手段强迫他人参与拍卖,情节严重的","以威胁手段强迫他人从事劳动,情节严重的","以暴力手段强迫他人退出投标,情节严重的","以威胁手段强迫他人收购债券,情节严重的"],"a":"B","e":"\u0001以暴力、威胁手段强迫他人“从事劳动”构成《刑法》第244条强迫劳动罪（侵犯人身权利罪章）；而强迫参与/退出拍卖、投标及强迫收购转让股份债券均属第226条强迫交易罪！\u0002\nA✗ 以暴力手段强迫他人参与或者退出拍卖情节严重，正是《刑法》第226条第4项明文列举的强迫交易罪\nB✓ 以威胁手段强迫他人从事劳动，情节严重的（正选不构成项）：强迫劳动侵犯劳动者人身自由与劳动力支配权，适用《刑法》第244条专门罪名\u0001强迫劳动罪\u0002，不属于市场交易范畴的强迫交易罪\nC✗ 以暴力手段强迫他人参与或者退出投标情节严重，正是《刑法》第226条第3项明文列举的强迫交易罪\nD✗ 以威胁手段强迫他人转让或者收购公司、企业的股份、债券或者其他资产情节严重，正是《刑法》第226条第5项明文列举的强迫交易罪","k":"","kb":99,"kh":[[475,538],[558,579]]},{"id":"2023-14","y":2023,"t":"单","s":"国家工作人员甲为他人“办事”并收受一张银行卡,后将此银行卡交给妻子乙,同时交代乙抓紧“处理”。乙用卡中的300万元购买了股票。乙的行为应认定为","o":["掩饰、隐瞒犯罪所得罪","洗钱罪","受贿罪","包庇罪"],"a":"B","e":"\u0001国家工作人员甲受贿银行卡（贪污贿赂上游犯罪）后交妻子乙抓紧“处理”，乙明知系丈夫受贿赃款仍持卡用300万元购买股票以转化资金形态、掩饰其非法所得来源和性质，精准构成洗钱罪！\u0002\nA✗ 第312条掩饰、隐瞒犯罪所得罪是普通法条；一旦上游犯罪属于第191条七大洗钱上游之一（\u0001贪污贿赂犯罪\u0002正是其一！）且采用购入金融证券股票转化资金性质手段掩饰，特别法条第191条洗钱罪优先适用\nB✓ 洗钱罪：受贿罪是洗钱罪法定上游犯罪；妻子乙明知300万元系丈夫受贿所得，仍顺从“抓紧处理”交代并用赃款购买股票以转换资产形式、掩饰隐瞒受贿资金来源性质，精准符合《刑法》第191条\u0001洗钱罪\u0002（不要求乙具有公务员身份，也不当然构成受贿共犯——因为甲受贿早已完成交卡后才找妻子善后洗钱）\nC✗ 若乙事前与甲共谋受贿或代为在权钱交易中收钱才可能定受贿罪共犯；甲早已自己收完受贿银行卡交回家中再叫妻子去炒股“处理”，这属于事后帮受贿人转移转化赃款的洗钱行为\nD✗ 包庇罪是指作假证明包庇犯罪分子本人躲避刑事追究（针对“人”），而购股隐匿受贿款针对的是“赃款资金来源性质”","k":"","kb":97,"kh":[[143,188]]},{"id":"2023-44","y":2023,"t":"多","s":"甲将保健品冒充为提高免疫力的药品,以电话营销的方式向社会公众进行推销,获利颇丰。甲的行为构成","o":["妨害药品管理罪","生产、销售假药罪","生产、销售伪劣产品罪","诈骗罪"],"a":"BCD","e":"\u0001把根本不是药品的“保健品”冒充治病提免疫“药品”向公众推销骗取巨额货款：①以非药品冒充药品→生产、销售假药罪（B）；②以假充真销额超5万→生产、销售伪劣产品罪（C）；③虚构疗效骗民众财物→诈骗罪（D）。至于“妨害药品管理罪”则主要规制未经批准走私进口“真药”而非保健品假药！\u0002\nA✗ 《刑法修正案（十一）》新增第142条之一\u0001妨害药品管理罪\u0002主要惩罚生产销售禁药或未经批准证明文件生产进口“实质真药”（如走私国外未过审正牌靶向抗癌药）等行为；本案拿毫无治疗药效的保健品去冒充药品，明确落入《药品管理法》“以非药品冒充药品”之\u0001假药\u0002定义，不构成本罪\nB✓ 保健品是非药品，将其直接宣称冒充为治疗提升免疫力的药品推销，完全符合《药品管理法》及《刑法》第141条“以非药品冒充药品”之\u0001生产、销售假药罪\u0002\nC✓ 在产品中以低价保健品冒充高价特效药品属于典型“以假充真”，获利颇丰符合第140条\u0001生产、销售伪劣产品罪\u0002\nD✓ 以电话营销方式系统虚构保健品具有医学防病疗效诱骗广大群众高价购买，符合第266条\u0001诈骗罪\u0002构成要件（上述三罪实务中虽竞合择一重罪处断，但均属甲行为实际触犯之罪名）","k":"","kb":94,"kh":[[149,199],[228,287]]},{"id":"2024-3","y":2024,"t":"单","s":"甲长期在线直播手绘百元人民币,接受观众打赏,获利巨大,甲的行为应认定为 （ ）。","o":["不构成犯罪","非法经营罪","伪造货币罪","非法利用信息网络罪"],"a":"A","e":"\u0001网络主播甲在线手绘人民币仅仅是展示高超绘画技艺收看客自愿打赏，既没有以仿真度足以乱真的机械制版印刷大量投放市场流通，也没拿手绘纸拿去骗取他人财物当真钱花，完全不构成任何犯罪！\u0002\nA✓ 不构成犯罪：伪造货币罪要求采用印刷、拓印、机制等方法制出“外观上足以乱真”且意图/可能危害货币公共信用的假币；主播在线直播公开一笔一画手绘纸钞仅作为才艺表演接收观众自愿打赏，社会公众一目了然那是画作而非流通真币，绝不构成伪造货币罪或其他犯罪\nB✗ 普通网络直播美术绘本收打赏并不需要什么特许专营许可证，完全合法\nC✗ 手绘展示绝不是能够欺骗市场流通交易的“足以乱真”假币制造行为\nD✗ 直播画画打赏未利用网络设立诈骗群、发布违法犯罪信息或从事违禁黑产，不构非法利用信息网络罪","k":"","kb":96,"kh":[[348,368]]},{"id":"2024-43","y":2024,"t":"多","s":"使用诈骗方法非法集资,可以认定为以非法占有为目的的情形有（ ）。","o":["携带集资款逃匿的","将集资款用于违法犯罪的","因为破产无法返还资金的","拒不交代资金去向逃避返还资金的"],"a":"ABD","e":"\u0001在判断非法集资行为人是否具有“非法占有目的”时，最高法司法解释列举的典型情形明确包括：携带集资款逃匿（A）、将集资款用于违法犯罪活动（B）、拒不交代资金去向逃避返还资金（D）；正常经营失败破产不能直接反推非法占有目的！\u0002\nA✓ 卷款携带集资款潜逃躲债，直接反映不打算归还、彻底占为己有的非法占有目的\nB✓ 把借来声称干正经实业生意的钱拿去赌博、吸毒、行贿或其他违法犯罪挥霍，表明毫无正常履约还款诚意，认定具非法占有目的\nC✗ 正经投入生产经营但因市场行情剧变、天灾或商业判断失误破产亏损而客观上无力返还（并未挥霍转移隐匿），恰恰是没有非法占有目的的典型情形（往往只定非法吸收公众存款罪甚至只属民事借贷违约，绝不能仅凭“破产”就认定集资诈骗罪！）\nD✓ 明知应清退资金却顽固拒不交代巨额集资款流向、肆意隐藏转移以逃避返还，依法推定具备非法占有目的","k":"","kb":97,"kh":[[75,140]]},{"id":"2025-10","y":2025,"t":"单","s":"甲购得某公司开发的热门应用软件,破解了其内置的防复制程序,大量复制并以自己注册的品牌销售,获利巨大。甲的行为应认定为（ ）。","o":["非法经营罪","假冒注册商标罪","侵犯著作权罪","侵犯商业秘密罪"],"a":"C","e":"\u0001购得正版应用软件后擅自破解其防复制加密程序，未经著作权人许可大量复制并贴上自己的牌子（非假冒原公司品牌！）出售获利巨大——侵犯了软件著作权人的复制发行权，定侵犯著作权罪；因未冒用他人商标，不构假冒注册商标罪。\u0002\nA✗ 已有专门第217条侵犯计算机软件著作权规定，不适用兜底非法经营罪\nB✗ 注意细节：甲卖光盘/软件时“以自己注册的品牌销售”，并没有往盗版商品上贴别人的注册商标，所以不构成假冒注册商标罪\nC✓ 侵犯著作权罪：软件代码受《著作权法》及《刑法》第217条明确保护（“计算机软件”）；甲避开技术保护措施（破解防复制程序）、未经权利人许可大批量复制发行出售牟利获利巨大，精准构成\u0001侵犯著作权罪\u0002\nD✗ 应用软件本身早已作为公开商品面向大众销售，且未窃取未公开的核心保密技术文档，不属商业秘密","k":"","kb":99,"kh":[[80,102]]},{"id":"2025-13","y":2025,"t":"单","s":"甲将含有西药成分的药品冒充纯中药制剂销售牟利,对患者健康造成严重危害。甲的行为应认定为（ ）。","o":["销售劣药罪","销售假药罪","妨害药品管理罪","销售伪劣产品罪"],"a":"B","e":"\u0001甲将西药成分（一种药品）直接冒充为纯中药制剂（另一种药品）销售并对患者健康造成严重危害——100%对应假药法定界定“以他种药品冒充此种药品”，成立销售假药罪！\u0002\nA✗ 劣药是指成分的含量不符合国家药品标准或者被污染、超过有效期等；而拿西药当纯中药卖属于药品种类本质虚假替代（假药而非劣药）\nB✓ 销售假药罪：根据《药品管理法》第98条第2款，“以非药品冒充药品或者\u0001以他种药品冒充此种药品\u0002的，为假药”；甲拿西药冒充纯中药制剂欺骗患者销售并致健康严重危害，成立\u0001销售假药罪\u0002\nC✗ 妨害药品管理罪规制“未批先卖/进口”的真药等情形，不规制“以他种药冒充此种药”的典型假药\nD✗ 假药罪（致严重危害健康至少处3–10年甚至更重）法定刑重于普通销售伪劣产品罪或依法条竞合/第149条优先定销售假药罪","k":"","kb":94,"kh":[[120,148]]},{"id":"2025-45","y":2025,"t":"多","s":"在内幕信息敏感期内,下列人员从事与该内幕信息有关的期货交易,获利巨大,应当认定为内幕交易罪的有（ ）。","o":["利用骗取手段获取内幕信息的甲","利用窃听手段获取内幕信息的乙","利用刺探手段获取内幕信息的丙","利用私下交易手段获取内幕信息的丁"],"a":"ABCD","e":"\u0001根据两高涉证券期货内幕交易司法解释，通过窃取、骗取、套取、窃听、利诱、刺探或者私下交易等非法手段获取内幕信息并在敏感期内从事证券期货交易获利，均认定为第180条内幕交易罪之“非法获取证券、期货交易内幕信息的人员”。\u0002\nA✓ 利用骗取手段获取内幕信息并从事敏感期期货交易获利巨大，构成内幕交易罪\nB✓ 利用窃听手段获取内幕信息并交易获利，构成内幕交易罪\nC✓ 利用刺探手段套取内幕信息并交易获利，构成内幕交易罪\nD✓ 通过私下不正当交易收买交换获取内幕信息并交易获利，构成内幕交易罪","k":"","kb":97,"kh":[[427,480]]},{"id":"2026-6","y":2026,"t":"单","s":"行为人实施下列行为,情节严重,应认定为非法经营罪的是","o":["甲非法出售无线电干扰器","乙非法出售他人盗窃的文物","丙非法出售他人的行踪轨迹","丁非法出售盗版的音像制品"],"a":"A","e":"\u0001根据《刑法》第225条及相关专门法律、司法解释，非法生产、销售无线电干扰器或专用间谍器材（如黑广播、伪基站、无线屏蔽干扰器）情节严重的，以非法经营罪定罪处罚！\u0002\nA✓ 甲非法出售无线电干扰器：依据两高办理非法生产、销售无线电发射设备及干扰器材司法解释，违反国家规定擅自制造、销售专用于干扰无线电通信的器材设备（情节严重），依法以\u0001非法经营罪\u0002定罪处罚\nB✗ 明知是他人盗窃得来的文物而非法收购倒卖销售，直接适用第312条\u0001掩饰、隐瞒犯罪所得罪\u0002（或相关倒卖文物罪第326条）\nC✗ 非法出售他人行踪轨迹（高度敏感个人信息）直接适用第253条之一\u0001侵犯公民个人信息罪\u0002\nD✗ 非法出售盗版音像制品（自己没复制）直接适用第218条\u0001销售侵权复制品罪\u0002（若自己复制出售则定第217条侵犯著作权罪）","k":"","kb":99,"kh":[[464,473]]},{"id":"2026-13","y":2026,"t":"单","s":"某上市公司部门经理甲在商务谈判中提高公司商品售价,与他人签订买卖合同,甲未向公司如实报告,而是利用差价套取多余公司商品后私自售卖,获利巨大。甲的行为应认定为","o":["合同诈骗罪","职务侵占罪","非法经营同类营业罪","背信损害上市公司利益罪"],"a":"D","e":"\u0001上市公司高管甲在商务谈判中违背对上市公司的忠实义务，故意抬高售价签订买卖合同并暗中私吞差价对应的多余公司商品转卖牟巨利（损害上市公司利益），构成《刑法》第169条之一背信损害上市公司利益罪！\u0002\nA✗ 对外签约时买卖相对方照单正常履行付款买货并未受虚构事实骗取额外财产，不成立合同诈骗罪\nB✗ 职务侵占罪是直接利用职务之便把本单位现存保管财物直接偷偷盗走吞掉；而本案甲是通过故意高价签约操弄交易差价条款方式损害公司经济利益，精准契合背信损害上市公司利益罪之商业利益背信交易特征\nC✗ 《刑法》第165条非法经营同类营业罪（《刑修十二》虽扩展到其他公司企业董事经理违规竞业，但该条是指自己另开公司经营与任职公司同类的业务；而本案甲不是另起炉灶抢同业订单，而是直接在上市公司谈判中用价格差套取公司商品私卖，且当年考纲重点仍区分第165条主体与第169条之一适用对象）\nD✓ 背信损害上市公司利益罪：上市公司部门经理/高管（含负重要经营谈判职责人员按《刑修十二》/考纲实务）违背对上市公司的忠实义务，利用职务便利暗箱操弄采购或销售价格差额、恶意进行不公平关联或变相利益输送交易，致使上市公司利益遭受重大损失，成立\u0001背信损害上市公司利益罪\u0002","k":"","kb":96,"kh":[[147,252]]},{"id":"2026-17","y":2026,"t":"单","s":"某工程项目工作人员甲,利用为商户办理装修手续的便利,以延迟审批为威胁手段,要求多家商户从其处购买高于市场价格的装修材料,数额共计数十万元。甲的行为应认定为","o":["不构成犯罪","强迫交易罪","敲诈勒索罪","非国家工作人员受贿罪"],"a":"B","e":"\u0001工程项目审批人员利用办理装修审批之便，以“拖延不予审批”相要挟迫使众多商户以高于市场价购买其指定装修材料（通过强迫买高价商品达数十万元），属于典型的强迫交易罪！\u0002\nA✗ 威胁拖延审批强行卖高价装修材料总额数十万元，早已远超强迫交易罪立案标准（一般1万元以上即达情节严重）\nB✓ 强迫交易罪：以不给办手续延迟审批相胁迫，迫使他人违背真实商业意愿花高价向自己买商品（“强买强卖商品”且数额数十万），精准成立《刑法》第226条\u0001强迫交易罪\u0002\nC✗ 敲诈勒索罪是单方面直接逼着被害人白白掏钱（无商品服务对价交付）；而在存在真实装修材料交付前提下仅因威胁强迫高价交易，则依法归入第226条强迫交易罪（除非价格极端畸高悬殊纯属借卖东西之名行白抢勒索之实）\nD✗ 非国家工作人员受贿罪是收受请托人无偿贿赂款物为他人谋利；而本案甲并没有白收钱，而是强买强卖高价装修材料","k":"","kb":99,"kh":[[538,557]]},{"id":"2026-44","y":2026,"t":"多","s":"甲搭建“小韭菜”网贷平台,以直播推广等方式向不特定社会公众宣传理财产品,并承诺给付10%年化收益的高额回报,后因经营失败而案发。经查,该案涉案资金5 亿余元,造成损失1 亿余元。甲在被监视居住期间,将违法所得1000 万元转给其他人保管。甲的行为应认定为","o":["洗钱罪","集资诈骗罪","非法吸收公众存款罪","掩饰、隐瞒犯罪所得罪"],"a":"AC","e":"\u0001向社会不特定公众承诺10%高额年化收益吸储5亿元因经营失败暴雷（无非法占有目的，不成立集资诈骗），构成非法吸收公众存款罪；之后本犯甲自己又在监视居住期间把1000万元违法所得转交他人保管藏匿以掩饰其去向性质，因非法吸收公众存款罪属“破坏金融管理秩序罪”洗钱上游，甲构成“自洗钱”（洗钱罪，并不要求必须跨境！）并与非法吸收公众存款罪并罚！\u0002\nA✓ 洗钱罪：非法吸收公众存款罪属于破坏金融管理秩序罪，正是《刑法》第191条洗钱罪七大上游犯罪之一；《刑修十一》将“自洗钱”入罪后，本犯甲亲自将1000万元吸储赃款转移交他人代为保管隐匿，无需跨境转移即已构成\u0001洗钱罪\u0002（特别提示：因第191条本犯自洗钱独立入罪，不因未跨境而排除洗钱罪）\nB✗ 虽然涉案5亿造成巨额损失，但题目明确指出甲是“因经营失败而案发”，自始并没有把吸储资金携款卷逃或纯粹用于非法犯罪挥霍的\u0001非法占有目的\u0002，不成立集资诈骗罪\nC✓ 非法吸收公众存款罪：搭建网贷平台通过网络直播向不特定社会公众公开宣传并承诺固定10%年化保底高息吸收资金达5亿余元，精准符合第176条\u0001非法吸收公众存款罪\u0002\nD✗ 其一，第312条掩饰、隐瞒犯罪所得罪的传统主体一般限于“上游犯罪本犯以外的第三人”，自己藏匿自己的非洗钱类赃款一般属于不可罚事后行为；其二，本案上游刚好属于第191条洗钱罪范围，根据特别法优于普通法原则且第191条独创“自洗钱”处罚，一律定\u0001洗钱罪\u0002而不另定掩饰、隐瞒犯罪所得罪","k":"","kb":97,"kh":[[189,209],[262,282]]}]},{"sub":"民法","name":"侵权责任","w":3.1,"L":58,"qs":[{"id":"2006-47","y":2006,"t":"单","s":"根据我国法律规定,高度危险作业致人损害民事责任适用的归责原则是（ ）。","o":["过错责任原则","无过错责任原则","推定过错责任原则","公平责任原则"],"a":"B","e":"\u0001高度危险作业对周边公众安全具有极高风险，依《民法典》第1236条（及原《民法通则》第123条），适用无过错责任原则。\u0002\nA✗ 过错责任要求受害人证明作业人主观存在过错，对高度危险作业受害人过于严苛。\nB✓ 从事高空、高压、易燃、易爆、剧毒、高放射性等高度危险作业造成他人损害的，适用无过错责任原则。\nC✗ 过错推定仍容许作业人证明自己无过错而免责，高度危险作业仅在受害人故意等极狭隘情形方得免责。\nD✗ 公平责任仅在法律规定无过错方分担损失的例外情况下适用。","k":"","kb":159,"kh":[[176,202]]},{"id":"2006-53","y":2006,"t":"多","s":"某甲5岁，父母离异后由其母抚养。某日，某甲在幼儿园午餐时与小朋友某乙发生打斗，在场的带班教师某丙未及时制止。某甲将某乙推倒在地，造成某乙骨折，花去医药费3000余元。对某乙的损失（ ）。","o":["某甲之母应承担赔偿责任","如果某甲之母独立承担责任确有困难,某甲之父应承担赔偿责任","幼儿园应给予适当赔偿","某丙应承担连带赔偿责任"],"a":"ABC","e":"\u0001依2006年《民通意见》时代考点，5岁无行为能力人甲打伤乙，离异直接抚养人甲母应担责；母独立赔确有困难时父补充赔；带班老师未及时制止有过错故幼儿园应适当赔偿（老师丙职务行为不连带）。\u0002\nA✓ 父母是未成年子女的法定监护人，离婚后与某甲共同生活的直接抚养人母亲首先依法承担主要侵权赔偿责任。\nB✓ 依据原《民通意见》第158条（现行《民法典婚姻家庭编解释（一）》第52条）规定，夫妻离婚后未与未成年子女共同生活的一方在直接抚养方独立承担民事责任确有困难时，应责令非直接抚养方（甲父）共同负担赔偿责任。\nC✓ 2006年依据原《民通意见》第160条，无民事行为能力人在幼儿园学习生活期间致人或受人损害且幼儿园带班老师未尽管理保护制止义务有过错的，幼儿园应当给予适当赔偿。\nD✗ 带班教师某丙系执行幼儿园职务工作任务，其疏忽未制止后果依法由用人单位幼儿园对外承担，老师个人不直接与监护人对外连带赔偿。\n【新法提示】现行《民法典》第1199条细化了教育机构责任：无民事行为能力人在幼儿园学习、生活期间受到人身损害的，直接适用过错推定原则由幼儿园承担全责或相应过错责任（教师个人职务行为仍由园方对外担责）。","k":"","kb":157,"kh":[[95,140]]},{"id":"2007-50","y":2007,"t":"单","s":"高度危险作业致人损害民事责任的免责事由是 （ ）。","o":["受害人因过错造成损害","受害人故意造成损害","受害人因重大过失造成损害","受害人故意或因重大过失造成损害"],"a":"B","e":"\u0001高度危险作业致人损害适用无过错责任原则，依《民法典》第1236条（原《民法通则》第123条），唯一法定完全免责事由仅限于“受害人故意”造成损害。\u0002\nA✗ 受害人仅具一般过错（普通疏忽）不能成为高度危险作业的完全免责事由。\nB✓ 《民法典》第1236条明确规定：能够证明损害是因“受害人故意”或者不可抗力造成的，不承担责任（原《民法通则》仅限受害人故意，故B为标准唯一法定免责答案）。\nC✗ 受害人重大过失在高度危险作业中“只能减轻”而不能完全免除作业人的赔偿责任。\nD✗ 重大过失仅可“减轻”，不可与受害人故意并列作免责事由。","k":"","kb":159,"kh":[[203,225]]},{"id":"2008-48","y":2008,"t":"单","s":"根据民法通则规定,下列侵权行为中适用过错推定的归责原则的是（ ）。","o":["产品致人损害","环境污染致人损害","动物致人损害","建筑物致人损害"],"a":"D","e":"\u0001建筑物或者其他设施以及建筑物上的搁置物、悬挂物发生倒塌、脱落、坠落造成他人损害的，适用过错推定责任原则；产品、环境污染、动物侵权均属无过错责任。\u0002\nA✗ 产品缺陷致人损害依法适用无过错责任原则。\nB✗ 环境污染造成他人损害适用无过错责任原则。\nC✗ 饲养动物致人损害原则上适用无过错责任原则（仅动物园适用过错推定）。\nD✓ 依《民法典》第1253条（原《民法通则》第126条），建筑物、构筑物等脱落、坠落造成他人损害，所有人、管理人或者使用人“不能证明自己没有过错的”，应当承担侵权责任，即过错推定原则。","k":"","kb":154,"kh":[[119,166]]},{"id":"2009-48","y":2009,"t":"单","s":"2006 年 7 月 27 日,某农用航空服务站为某村进行飞行防治病虫害作业,多次超低空飞经个体养鸡户张某的鸡舍上空。飞机飞行的噪音使张某的鸡群受到惊吓,鸡陆续死亡,累计 2 千余只。此种侵权行为属于（ ）。","o":["一般侵权","高度危险作业侵权","环境污染侵权","产品缺陷侵权"],"a":"C","e":"\u0001航空农化作业频繁超低空飞行产生的剧烈噪声惊吓致死鸡群2千余只，属于超出合理限度的噪声环境污染致害他人财产，依法构成环境污染侵权（适用无过错责任）。\u0002\nA✗ 环境污染侵权属于特殊侵权，不按一般过错侵权认定。\nB✗ 虽然飞机系飞行器，但导致鸡群大批惊吓死亡并非飞行器坠落撞击或航空事故直接机械物理毁坏，而是长期超低空噪声污染生态与养殖环境所致。\nC✓ 噪音属于法定环境污染因子，多次超低空噪声惊吓导致两千余只鸡死亡，依法构成环境污染侵权。\nD✗ 未涉及出售或使用存在缺陷的工业产品。","k":"","kb":159,"kh":[[301,336]]},{"id":"2009-49","y":2009,"t":"单","s":"甲被恶狗追咬,为避免被咬伤,夺过从其旁边经过的乙的名贵手提包,向狗打去。狗被打伤,乙的手提包也被损坏。甲的行为构成（ ）。","o":["正当防卫","自助行为","侵权行为","紧急避险"],"a":"D","e":"\u0001甲为保护自己人身安全免遭恶狗撕咬这一正在发生的紧迫危险，不得已夺取无关第三人乙的手提包自卫反击致包受损，构成《民法典》第182条规定的紧急避险。\u0002\nA✗ 正当防卫须针对不法侵害者本人的利益进行反击（如直接拾木棍反打狗或狗主），而提包属于无辜路人乙的合法财产，毁损无辜第三方财物避险属于紧急避险。\nB✗ 自助行为旨在保护自身即将受损的到期债权而扣押或阻止债务人财物人身。\nC✗ 合法紧急避险阻却违法性，不构成过错侵权行为（依法仅由引起险情的狗主人承担赔偿或受益人适当补偿）。\nD✓ 因紧急避险造成无辜第三方乙的财产损害的，只要未超过必要限度，行为合法正当，构成紧急避险（《民法典》第182条）。","k":"","kb":155,"kh":[[200,219]]},{"id":"2009-50","y":2009,"t":"单","s":"村民方某将自己饲养的马拴在树上。同村村民何某来遛狗，狗见到马嗷嗷乱叫，并向马咬去，马受惊挣断缰绳，疯狂往公路上跑，将正在公路上练习骑摩托车的赵某撞倒，花去医疗费共2万余元。根据民法规定，此责任应由（ ）。","o":["方某承担","何某承担","方某和何某共同承担","方某、何某和赵某共同承担"],"a":"B","e":"\u0001在2009年原《民法通则》第127条时代，因第三人何某逗狗叫引发惊马撞伤赵某的过错完全由第三人造成，由何某独自担责（《民法典》第1250条现已改定不真正连带）。\u0002\nA✗ 在原《民法通则》下证明系第三人过错导致动物伤人即可免除动物饲养人方某责任。\nB✓ 2009年尚适用《民法通则》第127条“由于第三人的过错造成损害的，由第三人承担民事责任”，直接引发惊马事故的狗主人（第三人）何某应承担赔偿责任。\nC✗ 原法未设共同连带赔付选择权，现行法下也不属于对外“共同”按份，而是由被侵权人择一请求的不真正连带责任。\nD✗ 练摩托车的赵某在公路正常合法骑行本身没有任何过错，不应承担责任。\n【新法提示】现行《民法典》第1250条（2010《侵权责任法》第83条沿袭）作出了有利于受害人的重大修改：因第三人的过错致使动物造成他人损害的，被侵权人“可以向动物饲养人或者管理人请求赔偿，也可以向第三人请求赔偿”。动物饲养人或管理人赔偿后，有权向第三人追偿。","k":"","kb":160,"kh":[[273,349]]},{"id":"2010-49","y":2010,"t":"单","s":"甲雇佣乙为自己的长途货车司机。乙在送货过程中,因重大过失致行人丙受到伤害。对丙的伤害应由（ ）。","o":["甲承担赔偿责任","乙承担赔偿责任","甲和乙承担按份赔偿责任","甲和乙承担连带赔偿责任"],"a":"A","e":"\u0001依《民法典》第1191条及第1192条（原《人身损害赔偿解释》第9条），受雇人乙在从事雇佣（送货）职务活动中因重大过失致人丙受伤，对外由雇主甲承担全部赔偿责任。\u0002\nA✓ 用人单位/接受个人劳务一方对工作人员或提供劳务者在工作任务中致他人损害对外承担无过错替代责
