<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="法硕综合">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f7a68'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-size='34' font-weight='700' fill='%23fff' font-family='sans-serif'%3E综%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f7a68'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-size='34' font-weight='700' fill='%23fff' font-family='sans-serif'%3E综%3C/text%3E%3C/svg%3E">
<title>法硕（非法学）专业综合课 真题刷题</title>
<style>
:root{--bg:#f5f5f2;--card:#fff;--ink:#1d1d1f;--sub:#6b6b70;--line:#e3e3e0;--acc:#2f6fdb;--ok:#1f9d55;--okbg:#e7f6ec;--bad:#d64545;--badbg:#fdeaea;--warn:#b7791f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}
.wrap{max-width:780px;margin:0 auto;padding:12px 14px 80px}
header{display:flex;align-items:center;gap:10px;margin:4px 0 12px}
header h1{font-size:19px;margin:0;flex:1}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.tab{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:15px;white-space:nowrap;cursor:pointer}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.stats b{display:block;font-size:20px}
.stats span{font-size:12.5px;color:var(--sub)}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px;font-size:17px;font-weight:600;cursor:pointer;margin-top:10px}
.btn.pri{background:var(--acc);color:#fff}
.btn.sec{background:#eef1f6;color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.addwb{display:block;margin:6px 2px 0 auto;background:none;border:0;padding:4px 2px;font-size:13px;color:var(--sub);cursor:pointer}
.addwb:disabled{cursor:default;opacity:.7}
.hint{font-size:13px;color:var(--sub);margin-top:6px}
.ulhead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:2px}
.ulhead .utitle{font-size:14px;font-weight:600;color:var(--ink)}
.sortbtns{display:flex;gap:6px}
.smbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.unit{display:flex;align-items:center;gap:10px;padding:10px 2px;border-top:1px solid var(--line);cursor:pointer}
.unit:first-child{border-top:0}
.unit .rk{width:26px;color:var(--sub);font-size:13px;text-align:right;flex:none}
.unit .nm{flex:1;min-width:0}
.unit .nm .title-line{display:flex;align-items:center;gap:5px;flex-wrap:wrap;line-height:1.45}
.unit .meta{font-size:12.5px;color:var(--sub);margin-top:2px}
.unit .nm div.meta,.unit .nm div.pt{white-space:normal}
.unit .pt{font-size:12px;color:#5b5b62;margin-top:1px;line-height:1.4}
.bar{height:5px;background:#ececea;border-radius:3px;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.unit.drop{opacity:.6}
.unit .rs{flex:none;border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:8px;padding:4px 9px;font-size:12.5px;cursor:pointer}
.sw{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--sub);margin:4px 0 8px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.back{border:0;background:none;font-size:15px;color:var(--acc);cursor:pointer;padding:6px 0;flex:none}
.top .where{flex:1;min-width:130px;font-size:13px;color:var(--sub);text-align:right;line-height:1.35}
.top-acts{display:flex;gap:6px;flex:none;margin-left:auto}
.tag{display:inline-block;font-size:12.5px;color:var(--sub);background:#f0f0ee;border-radius:6px;padding:1px 8px;margin-right:6px}
.tag.rev{background:#fff4e0;color:var(--warn)}
.htag{display:inline-block;font-size:11.5px;border-radius:5px;padding:0 6px;font-weight:600;line-height:1.55}
.htag.核心{background:#eef4ff;color:#1f58c4}
.htag.新法{background:#fff3dc;color:#9a5b08}
.htag.回补{background:#f3ebff;color:#6c35b5}
.htag.降权{background:#f0f0ee;color:#6b6b70}
.stem{font-size:18px;margin:10px 0 14px;line-height:1.7;white-space:pre-line}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:11px 13px;margin-bottom:9px;font-size:16.5px;cursor:pointer;color:var(--ink)}
.opt .L{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid #c9c9c6;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600}
.opt.sel{border-color:var(--acc)}
.opt>span:nth-child(2){flex:1;min-width:0}
.oe{display:block;margin-top:5px;font-size:14.5px;line-height:1.6;color:#55555a}
.oe b{color:var(--ink)}
@media (max-width:899px){.oe{font-size:13.5px}}
.opt.sel .L{background:var(--acc);border-color:var(--acc);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ok .L{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt.bad .L{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.miss{border-color:var(--ok);background:var(--okbg)}
.opt.miss .L{border-color:var(--ok);color:var(--ok)}
.judge{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.judge .opt{justify-content:center;font-size:18px;font-weight:600}
.res{border-radius:12px;padding:10px 14px;margin:6px 0 10px;font-weight:600}
.res.ok{background:var(--okbg);color:var(--ok)}
.res.bad{background:var(--badbg);color:var(--bad)}
.res small{font-weight:400;color:var(--sub);display:block}
.box{border-left:3px solid var(--line);padding:2px 0 2px 12px;margin:10px 0;font-size:15px;white-space:pre-wrap;word-break:break-word}
.box b{font-weight:700;color:var(--ink)}
.xp{margin:3px 0}
.xo{display:flex;align-items:flex-start;gap:9px;margin:8px 0}
.xk{flex:none;width:22px;height:22px;margin-top:2px;border-radius:50%;font-size:12.5px;font-weight:700;line-height:22px;text-align:center;color:#fff;background:var(--bad)}
.xo.ok .xk{background:var(--ok)}
.xt{flex:1;min-width:0}
.xo.hit{background:var(--badbg);border:1.5px solid var(--bad);border-radius:8px;padding:4px 7px;margin-left:-8px;margin-right:-8px}
.xo.hit.miss{background:none;border-style:dashed}
.xg{flex:none;align-self:center;font-size:12.5px;font-weight:700;color:var(--bad);background:var(--badbg);border-radius:6px;padding:0 7px}
.xm{margin:4px 0 8px;padding:7px 11px;background:#f4f5f7;border-radius:8px}
.xl{font-weight:700;color:var(--warn);margin-right:8px}
.box h4{margin:0 0 2px;font-size:13px;color:var(--sub);font-weight:600}
.box.book{border-color:#9db8e8}
.box.note{border-color:#e8c48a}
.empty{text-align:center;color:var(--sub);padding:30px 0}
.warnbar{background:#fff4e0;color:#7a5410;border-radius:10px;padding:8px 12px;font-size:13.5px;margin-bottom:10px}
textarea{width:100%;height:90px;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:8px;font-family:monospace}
.foot{display:flex;gap:8px;flex-wrap:wrap}
.foot button,.foot label{flex:1;min-width:120px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px;font-size:14px;cursor:pointer;text-align:center;color:var(--ink)}
.syncrow{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.syncstat{font-size:13.5px;color:var(--sub);flex:1;min-width:180px}
.syncstat b{color:var(--ink)}
.syncbtns{display:flex;gap:6px;flex:none}
.syncbtns button,.smbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:5px 10px;font-size:13px;cursor:pointer;white-space:nowrap}
.smbtn.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
.smbtn.warn{color:var(--bad);border-color:#efc2c2}
.syncpanel{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.syncsec{margin-bottom:14px;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.syncsec:last-child{margin-bottom:0;padding-bottom:0;border-bottom:0}
.syncsec h4{margin:0 0 6px;font-size:14px;color:var(--ink)}
.syncin{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:16px;margin:4px 0 8px;background:#fafaf8;color:var(--ink)}
.syncmsg{font-size:13px;margin-top:6px;padding:6px 10px;border-radius:8px;background:#f4f5f7;color:var(--ink)}
.syncmsg.ok{background:var(--okbg);color:var(--ok)}
.syncmsg.bad{background:var(--badbg);color:var(--bad)}
.wb-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:2px}
.wb-info{flex:1;min-width:190px}
.wb-title{font-weight:700;font-size:15.5px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.wb-sub{font-size:12.5px;color:var(--sub);margin-top:2px}
.wb-acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.wb{padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.wb-list .wb:first-child{border-top:0}
.wb .a{color:var(--ok);font-weight:600}
.fin-list{text-align:left;margin-top:6px}
.fin-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
.fin-row:first-child{border-top:0}
.fin-nm{flex:1;min-width:0;font-size:14px}
.fin-acts{display:flex;gap:6px;flex:none}

.kbd{font-size:12px;color:var(--sub);text-align:center;margin-top:8px}
@media (max-width:520px){.kbd{display:none}.stem{font-size:17px}}
@media (max-width:899px){.quizpg{padding-top:3vh}body{font-size:15px}header h1{font-size:18px}.stem{font-size:16px}.opt{font-size:15.5px}.opt .L{font-size:13px}.judge .opt{font-size:17px}.btn{font-size:16px}.box{font-size:14px}.wb{font-size:14px}.tab{font-size:14px}.back{font-size:14px}.stats b{font-size:19px}}
@media (min-width:900px){
.wrap{max-width:960px;padding-top:20px}
body{font-size:17px}
header h1{font-size:22px}
.quizpg{padding-top:12vh}
.quizpg .card{padding:24px 30px}
.stem{font-size:22px;margin:12px 0 20px}
.opt{font-size:19px;padding:14px 18px;margin-bottom:12px;gap:14px}
.opt .L{width:30px;height:30px;font-size:15px}
.judge .opt{font-size:21px}
.btn{font-size:18px;padding:15px}
.res{font-size:18px}
.box{font-size:16.5px}
.tag{font-size:13.5px}
.top .where{font-size:14px}
.back{font-size:16px}
.unit .meta{font-size:13.5px}
.stats b{font-size:24px}.stats span{font-size:14px}
}
</style>
</head>

nB✗ 全面推进依法治国,首先要限制国家权力的行使,而不是规范公民权利的行使\nC✗ 法律是社会的重要调整器,但是法律不是唯一的调整器,法律具有局限性,道德、宗教等也是调整社会关系的重要手段,法律至上是指法律具有至高无上的地位,但并不意味着实现法治要排除宗教和道德的作用\nD✗ 当法律与当权者个人的意志发生冲突时,法治国家中的法律高于个人意志,而在人治国家则相反\n法治关注法律制度的内容,讲究 \" 之治,强调对权力的制约与对人权的保障,该项 \"良法选项正确。 法律的运行离不开人的作用,但是法治与人治的区别不在于是否可离开人的作用而运行,法治与人治的主要区别是:法治依据的是反映众人意志的法律,人治依据的是统治者个人或少数人的意志;","k":"","kb":19,"kh":[[22,48],[48,71]]},{"id":"2017-11","y":2017,"t":"单","s":"关于全面依法治国必须坚持的基本原则,下列理解正确的是（ ）。","o":["法律面前人人平等是全面依法治国的一项基本原则","法治与德治相结合要求将道德统一到法律中来","人民主体地位原则是指一切法律活动都应当交给全体公民来完成","从中国实际出发原则就是要拒绝移植和借鉴其他国家的制度和经验"],"a":"A","e":"\u0001全面依法治国,必须坚持法律面前人人平等,平等是社会主义法律的基本属性。\u0002\nA✓ 全面依法治国,必须坚持法律面前人人平等,平等是社会主义法律的基本属性\nB✗ 全面依法治国不是要将道德统一到法律中来,而是要发挥法律和道德的不同作用\nC✗ 全面依法治国,要坚持人民主体地位,但并不是一切法律活动都应当交由全体公民来完成,这不现实也不可能\nD✗ 全面依法治国要坚持从中国实际出发,汲取中华法律文化精华,借鉴国外法治有益经验\n全面依法治国,要坚持依法治国与以德治国相结合, 实现法律和道德相辅相成、法治和德治相得益彰。","k":"","kb":19,"kh":[[0,21],[22,48]]},{"id":"2017-12","y":2017,"t":"单","s":"下列关于法治思维的理解,正确的是（ ）。","o":["法治思维是实体思维而不是程序思维","法治思维须以合法性判断作为其核心内容","法治思维主要是立法机关采用的思维方式","法治思维是一种认识思维而不是实践思维 )。"],"a":"B","e":"\u0001法治思维是指按照社会主义法治的逻辑来观察、分析和解决社会问题的思维方式,是将法律规定、法律知识、法治理念付诸实施的认识过程。\u0002\nA✗ 法治思维是规则思维,是平等思维,是权力受制约思维,是程序思维\nB✓ 运用法治思维解决问题, 要求国家工作人员,特别是领导干部,在行使国家公权力时,应始终关注至少五个方面的内容,即目的是否合法、权限是否合法、内容是否合法、手段是否合法以及程序是否合法,法治思维…\nC✗ 法治思维是将法律作为判断是非和处理事务的准绳,它要求崇尚法治、尊重法律,善于运用法律手段解决问题和推进工作,法治思维主要是行政机关采用的思维方式\nD✗ 法治思维是按照社会主义法治的逻辑来观察、分析和解决社会问题的思维方式,是实践思维\n运用法治思维解决问题, 要求国家工作人员,特别是领导干部,在行使国家公权力时,应始终关注至少五个方面的内容,即目的是否合法、权限是否合法、内容是否合法、手段是否合法以及程序是否合法,法治思维以合法性判断为核心内容","k":"","kb":19,"kh":[[0,21],[119,166]]},{"id":"2017-48","y":2017,"t":"多","s":"下列关于我国法律职业的说法,正确的有（ ）。","o":["最高人民检察院检察长是首席大检察官","法官的职责之一是参加合议庭审判案件或独任审判案件","律师是依法取得律师执业证书,为社会提供法律服务的国家工作人员","狭义的法律职业从业者包括法官、检察官、律师和法学教学研究人员四大类"],"a":"AB","e":"\u0001法官是依法行使国家审判权的审判人员,法官的职责包括依法参加合议庭审判或者独任审判案件以及法律规定的其他职责。\u0002\nA✓ 检察官是依法行使国家检察权的检察人员,依照我国法律,检察官的级别分为十二级,最高人民检察院检察长为首席大检察官\nB✓ 法官是依法行使国家审判权的审判人员,法官的职责包括依法参加合议庭审判或者独任审判案件以及法律规定的其他职责\nC✗ 律师是依法取得执业证书,接受委托或者指定,为当事人提供法律服务的执业人员,律师不是国家工作人员\nD✗ 狭义的法律职业从业者包括法官、检察官和律师三大类,不包括法学教学研究人员","k":"","kb":19,"kh":[[218,252],[252,275]]},{"id":"2019-6","y":2019,"t":"单","s":"2018年,国家统一法律职业资格考试制度在我国正式实施。该制度集中体现的法律职业特征是（ ）。","o":["法律职业具有相当大的自治性","法律职业要求设置严格的准入门槛","法律职业必须具备特定的职业伦理","从事法律职业意味着肩负更多的社会责任"],"a":"B","e":"\u0001这体现了法律职业的准入特征。\u0002\nA✗ 法律职业具有自治特征,法律人从事法律活动,具有相当大的自主性或者自治性,对法律自治的追求也就体现出了职业主义的倾向,但本选项和题干不符\nB✓ 这体现了法律职业的准入特征\nC✗ 法律职业具有特定的职业伦理,法律职业伦理有别于大众伦理和其他职业伦理,因为它受法律活动规律的制约,受法律职业技能的影响\nD✗ 从事法律职业主要是解决社会关系中的矛盾,因此也肩负着更多的社会责任,但是相关表述与题目中的国家统一职业资格考试制度无关\n任何人加入法律职业都必须接受认真考查,获得资格证,得到头衔。 至于ACD,其说法都没有什么问题,只是和题干不符,本题核心是问国家统一法律职业资格考试制度在我国正式实施,这说明要取得法律职业资格,必须通过某种法律职业资格考试,才有可能成为法律职业共同体的一员,因此体现的是法律职业的准入特征。 从事法律职业主要是解决社会关系中的矛盾,因此也肩负着更多的社会责任,但是\u0001“从事法律职业意味着肩负更多的社会责任”\u0002与题目中的国家统一职业资格考试制度无关","k":"","kb":19,"kh":[[0,21],[167,218]]},{"id":"2019-43","y":2019,"t":"多","s":"“任何组织和个人都不得有超越宪法法律的特权,绝不允许以言代法、以权压法、逐利违法、徇私枉法。”该论断直接体现的法治理念有（ ）。","o":["程序正义理念","法律至上理念","权力受制约理念","法律面前人人平等理念"],"a":"BCD","e":"\u0001\"任何组织和个人都不得有超越法律 ',体现了法律面前人人平等理念和法律至上的特权理念,因此“法律至上理念”。\u0002\nA✗ 程序正义原则即正当程序原则,包含不能做自己的法官和听取当事人的意见两项内容题目论断\nB✓ 符合题意及现行制度规定（\u0001法律至上理念\u0002）\nC✓ \"绝不允许以言代法、 \" 体现了权力受制约理以权压法,逐利违法、徇私枉法念\nD✓ \"任何组织和个人都不得有超越法律 ',体现了法律面前人人平等理念和法律至上的特权理念,因此相关表述","k":"","kb":19,"kh":[[0,21],[22,48]]},{"id":"2020-42","y":2020,"t":"多","s":"某省会城市的市政府出台规范“共享单车”的规章,将“共享单车”纳入法治化管理轨道。对此, 下列说法正确的有（ ）。","o":["该政府出台规章属于广义的立法范畴","政府部门依据该规章管理“共享单车”,属于法的适用","该规章须报市人大常委会备案,这体现了权力监督的法治原则","公民、企业依据该规章行使权利、履行义务是守法的表现"],"a":"ACD","e":"\u0001广义的立法泛指有关国家机关按照法定的职权和程序,制定具有法律效力的各种规范性文件的活动。\u0002\nA✓ 狭义的立法仅指国家最高权力机关及其常设机关依照法定的权限和程序制定规范性法律文件的活动\nB✗ 执法是法的执行的简称,政 \"共享单车 \"体现的是法的执府部门依据该规章管理 \" 法的适用 \"即司法,通常指国家司法机关依照行,而法定职权和程序,具体应用法律处理各种案件的专门活动\nC✓ 规章向人大常委会备案,体现了权力机关的监督\nD✓ 守法既包括履行义务,也包括行使权利,公民依据该规章行事,是守法的表现","k":"","kb":19,"kh":[[0,21],[22,48]]},{"id":"2020-44","y":2020,"t":"多","s":"某人民法院在审理一起疑难案件时,参考了某法学家的学说后作出判决。对此,下列说法正确的有（ ）。","o":["该法学家的学说属于法的非正式渊源","该法学家的学说为疑难案件的解决提供了指引","参考法学家的学说作出判决有悖于审判独立原则","该法学家的学说与法律规定不一致时不应援引"],"a":"ABD","e":"\u0001法的正式渊源通常包括制定法、习惯法判例法和国际条约等。\u0002\nA✓ 该法学家的学说属于法的非正式渊源,可以为疑难案件的解决提供指引,但并不影响法院独立审判案件\nB✓ 符合题意及现行制度规定（\u0001该法学家的学说为疑难案件的解决提供了\u0002）\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ 符合题意及现行制度规定（\u0001该法学家的学说与法律规定不一致时不应\u0002）\n间接渊源又称为非正式意义上的渊源或非法定渊源,如习惯判例、宗教规则、法律学说、道德原则等。","k":"","kb":3,"kh":[[11,103],[143,200]]},{"id":"2021-43","y":2021,"t":"多","s":"法官职业伦理是法官从事审判工作必须遵循的基本准则。下列属于我国法官职业伦理核心范畴的有（ ）。","o":["自由","为民","公正","廉洁"],"a":"BCD","e":"\u0001最高人民法院出台的《法官职业道德基本准则》从五个方面对法官职业道德准则提出要求,强调法官职业道德的核心是公正、廉洁、为民。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 符合题意及现行制度规定（\u0001为民\u0002）\nC✓ 符合题意及现行制度规定（\u0001公正\u0002）\nD✓ 符合题意及现行制度规定（\u0001廉洁\u0002）","k":"","kb":19,"kh":[[0,21],[252,275]]},{"id":"2022-1","y":2022,"t":"单","s":"“坚持以人民为中心”是习近平法治思想的重要内容,其关涉的主要问题是（ ）。","o":["全面依法治国为了谁依靠谁","全面依法治国由谁领导","全面依法治国走什么路","全面依法治国如何保障"],"a":"A","e":"\u0001习近平法治思想的核心要义和理论精髓,集中体现为习近平总书记在中央全面依法治国工作会议上提出并系统阐述的\"十一个坚持\"。\u0002\nA✓ 在习近平法治思想的核心要义中,坚持以人民为中心回答了全面依法治国为了谁依靠谁的问题\nB✗ 坚持党对全面依法治国的领导回答了全面依法治国由谁领导的问题\nC✗ 坚持中国特色社会主义法治道路回答了全面依法治国走什么路的问题\nD✗ 坚持建设德才兼备的高素质法治工作队伍、坚持抓住领导干部这个\"关键少数\"回答了全面依法治国如何保障的问题","k":"","kb":19,"kh":[[0,21],[22,48]]},{"id":"2022-43","y":2022,"t":"多","s":"我国《法官法》规定，“法官应当勤勉尽责，清正廉明，恪守职业道德”“初任法官采用考试、考核的办法，按照德才兼备的标准，从具备法官条件的人员中择优提出人选”。上述条文体现的法官职业特征有（ ）。","o":["独立特征","准入特征","伦理特征","技能特征"],"a":"BCD","e":"\u0001法律职业是指以法官、检察官、律师等为代表的,受过专门的法律专业训练,具有娴熟的法律技能与法律伦理的法律人所构成的自治性共同体。\u0002\nA✗ 独立特征不属于法律职业特征\nB✓ 符合题意及现行制度规定（\u0001准入特征\u0002）\nC✓ (2)伦理特征,法律职业必须具备本职业特有的伦理,法律职业伦理受法律活动规律的制约,受法律职业技能的影响\nD✓ 法律职业具有以下特征:(1)技能特征,法律职业技能来源于法学教育,没有发达的法学教育就没有法律职业的形成\n(3)自治特征,法律人从事法律活动,具有相当大的自主性或自治性; (4)准人特征,加入法律职业必将受到认真考查,才能获得许可证,得到头衔。 \"法官应当勤勉尽责,清正廉明,恪守职业道德\"体现了伦理特征,\"初任法官采用考试、考核的办法,按照德才兼备的标准,从具备法官条件的人员中择优提出入选\"体现了技能特征以及准入特征。","k":"","kb":19,"kh":[[218,252],[252,275]]},{"id":"2023-1","y":2023,"t":"单","s":"全面依法治国是国家治理的一场深刻革命,必须更好发挥法治固根本、稳预期、利长远的保障作用,在法治轨道上全面建设社会主义现代化国家。全面依法治国的重点任务和主体工程是（ ）。","o":["推进公正司法","构建法治社会","建设法治政府","维护宪法权威"],"a":"C","e":"\u0001全面依法治国的重点任务和主体工程是建设法治政府。\u0002\nA✗ 推进公正司法是全面依法治国的\u0001最后防线与重要保障\u0002，并非重点任务和主体工程\nB✗ 构建法治社会是构筑法治国家的\u0001基础工程\u0002，而非重点任务和主体工程\nC✓ 政府承担着大量行政管理与公共服务职能，\u0001建设法治政府\u0002是全面依法治国的重点任务和主体工程\nD✗ 维护宪法权威是全面依法治国的\u0001首要任务和基础性工作\u0002，须依法依宪治国\n法治国家是目标，\u0001法治政府是重点任务和主体工程\u0002，法治社会是基础工程，三者必须一体建设、率先突破。","k":"","kb":19,"kh":[[22,48],[48,71]]},{"id":"2023-42","y":2023,"t":"多","s":"法治思维是基于对法律的尊崇和对法治的信念判断是非、权衡利弊、解决问题的思维方式。下列关于法治思维的表述,正确的有（ ）。","o":["法治思维是规则思维","法治思维是公平思维","法治思维是人权保障思维","法治思维是程序思维"],"a":"ABCD","e":"\u0001法治思维以合法性为前提，涵盖规则思维、公平思维、人权保障思维和程序思维等维度。\u0002\nA✓ \u0001规则思维\u0002是法治思维的起点，要求凡事依照现行法律规则界分是非并遵循法律位阶\nB✓ \u0001公平思维\u0002要求权利义务对等、机会平等、同等情形同等对待并兼顾实质公平\nC✓ \u0001人权保障思维\u0002要求国家公权行使以尊重保障公民基本人权与人格尊严为界限\nD✓ \u0001程序思维\u0002强调“正义不仅要实现而且要以看得见的方式实现”，严格恪守正当程序\n记忆法治思维核心五大特征：\u0001规则、公平（平等）、权力制约、人权保障、正当程序\u0002。","k":"","kb":19,"kh":[[0,21],[119,166]]},{"id":"2023-43","y":2023,"t":"多","s":"下列情形中,违反法律职业伦理的有（ ）。","o":["某法官在案件审理期间接受当事人的宴请","某律师在高校担任兼职研究生导师并领取报酬","某检察官在刊物上发表文章对正在审理的案件进行评论","某法官在任职期间接受政治、理论和业务培训"],"a":"AC","e":"\u0001法官接受当事人宴请、检察官公开评论在审案件，均严重违反法律职业伦理规范。\u0002\nA✓ 法官在案件审理期间\u0001私下接触并接受当事人宴请\u0002，严重破坏司法中立性与廉洁性，违反《法官法》与职业伦理\nB✗ 律师并非国家公职司法人员，在高校担任兼职导师授课并领取合法劳动报酬\u0001不违反法律职业伦理\u0002（法官检察官兼职受严格限制但经批准讲学除外，律师更无禁止）\nC✓ 检察官公开发表文章\u0001对正在审理中的未决案件进行评论\u0002，违背司法中立与保密克制要求，违反职业伦理\nD✗ 接受政治、理论和业务培训是法官、检察官应当履行的\u0001法定职业研修职责与权利\u0002，完全符合职业伦理\n法律职业伦理共同禁区：\u0001禁私下接触当事人及接受馈赠宴请\u0002、\u0001禁公开评论未决案件\u0002、\u0001法检严禁在营利企业兼职\u0002。","k":"","kb":19,"kh":[[218,252],[252,275]]},{"id":"2024-11","y":2024,"t":"单","s":"关于法律职业自治特征的表述,正确的是（ ）。","o":["法律职业从诞生之日起就只有自治性","法律职业的自治塑造了法律人独特的品格","法律人独特的知识传统促进了法律职业的自治","法律职业的自治意味着法律人的活动不受任何个人和组织的干预"],"a":"C","e":"\u0001法律人经过长期专业训练形成的独特法律知识传统与思维方法，促进了法律职业的自治。\u0002\nA✗ 法律职业在早期与宗教神职、行政官僚相混同，其自治性是在\u0001近代法治发展过程中逐步形成的\u0002\nB✗ 因果关系倒置：是法律人长期积累的专业方法、行业共同体与话语传统支撑塑造了自治，进而服务法治\nC✓ 法律职业特有的\u0001专业术语、推理技术与知识传统\u0002构成行业壁垒与共同准则，从而有力促进了法律职业的自治\nD✗ 法律职业自治是相对自治，法律人的职业活动仍受\u0001宪法法律约束、当事方监督与社会公众监督\u0002\n记住法律职业的四大特征：\u0001技能特征、伦理特征、自治特征、准入特征\u0002；任何自治都是依法范围内的\u0001相对自治\u0002。","k":"","kb":19,"kh":[[0,21],[22,48]]},{"id":"2024-12","y":2024,"t":"单","s":"近年来,以ChatGPT为代表的生成式人工智能技术在许多领域广泛运用,同时也带来许多风险和挑战,各国正着手制定相关法律予以应对,下面不正确的是（ ）。","o":["生成式人工智能技术可能引起传统法律概念变化","生成式人工智能技术将会拓展法律调整的范围","生成式人工智能技术已经创造出了新的法律主体","生成式人工智能技术可能影响法律关系的内容"],"a":"C","e":"\u0001生成式人工智能技术目前仍是法律客体或辅助工具，尚未成为独立承担权利义务的新法律主体。\u0002\nA✗ 大模型生成内容正深刻挑战著作权“作品”、侵权责任“过错”等\u0001传统法律概念\u0002，正确\nB✗ 应对算法深度伪造、算力治理等促使立法向新兴科技延伸，\u0001拓展了法律调整范围\u0002，正确\nC✓ 现行各国法律均要求权利义务归属自然人、法人或非法人组织，\u0001生成式人工智能尚未被赋予独立法律主体资格\u0002\nD✗ AI广泛应用必然引出数据权益、算法透明知情等\u0001新的权利义务内容变化\u0002，正确\n前瞻科技考点：AI目前是人类控制的\u0001工具/法律客体\u0002，法律责任最终仍由研发者、部署者或使用者承担。","k":"","kb":12,"kh":[[0,16],[196,279]]},{"id":"2024-41","y":2024,"t":"多","s":"在习近平法治思想的科学指引下，新时代中国特色社会主义法治建设发生历史性变革，取得历史性成就。对此下列理解正确的有（ ）。","o":["习近平法治思想是马克思主义法治理论中国化时代化的最新成果","习近平法治思想是对党领导法治建设丰富实践和宝贵经验的科学总结","习近平法治思想是法治轨道上推进国家法治体系和治理能力现代化的根本遵循","习近平法治思想是引领法治中国建设实现高质量发展的思想旗帜"],"a":"ABCD","e":"\u0001习近平法治思想是马克思主义法治理论中国化时代化的最新成果，是全面依法治国的根本遵循和行动指南。\u0002\nA✓ 习近平法治思想把马克思主义法治原理同中国具体实际与中华优秀传统法律文化相结合，是\u0001马克思主义法治理论中国化时代化的最新成果\u0002\nB✓ 习近平法治思想深刻总结了党领导社会主义法治建设的丰富实践经验，构成\u0001科学系统的理论总结\u0002\nC✓ 习近平法治思想是在法治轨道上全面推进国家治理体系和治理能力现代化的\u0001根本遵循\u0002\nD✓ 习近平法治思想为推动中国特色社会主义法治建设高质量发展提供了强大思想武器与\u0001思想旗帜\u0002\n四项全对，务必牢记习近平法治思想在全面依法治国中的指导地位与核心要义（“十一个坚持”）。","k":"","kb":19,"kh":[[0,21],[22,48]]},{"id":"2025-41","y":2025,"t":"多","s":"“法律是治国之重器,良法是善治之前提。”对此,下列理解正确的有（ ）。","o":["法治是国家治理体系和治理能力的重要依托","良法善治是中国特色社会主义法治的价值要义","中国特色社会主义法治是形式法治与实质法治的统一","在法治轨道上推进中国式现代化要坚持以良法保障善治"],"a":"ABCD","e":"\u0001法治作为国家治理体系和治理能力的重要依托,体现了法律在治理中的基础性作用。\u0002\nA✓ 法治作为国家治理体系和治理能力的重要依托,体现了法律在治理中的基础性作用\nB✓ 良法善治是中国特色社会主义法治的核心价值追求\nC✓ 国特色社会主义法治是形式法治与实质法治的统一\nD✓ 以良法保障善治,强调法治轨道上的现代化需兼顾法律质量与治理效能\n良法是善治的前提,而善治是法治的目标。 形式法治强调法律的形式完备性和程序正当性,实质法治注重法律内容的公平正义和价值导向。","k":"","kb":19,"kh":[[0,21],[22,48]]},{"id":"2025-44","y":2025,"t":"多","s":"下列情形中,违反法官职业伦理的有（ ）。","o":["法官甲在某企业兼任法律顾问","法官乙就某未决案件给当事人提供咨询意见","法官丙在审判委员会会议上对某争议案件发表意见","法官丁经单位批准在某高校协助开展实践性教学工作"],"a":"AB","e":"\u0001法官经单位批准在某高校协助开展实践性教学工作,属于正常的学术交流和教育活动,不违反法官职业伦理。\u0002\nA✓ 法官不得在企业或其他营利性组织中兼任法律顾问等职务,这是为了保持法官的独立性和公正性,相关表述违反了法官伦理\nB✓ 项违反了法官伦理\nC✗ 法官在审判委员会会议上对某争议案件发表意见是其职责所在,不违反职业伦理\nD✗ 法官经单位批准在某高校协助开展实践性教学工作,属 :"D","e":"\u0001\"是指贵族官僚中位高权重的八 \"八议种人犯罪后,普通司法机构无权审理,须在大臣 \" 后,由皇帝对其所犯罪行决定减免刑罚的制度。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ 本题中,萧龄 \" 系齐高帝五世孙 \",即前朝皇室宗之免死的原因是亲,因此属于议宾\n所犯 \" 即议亲(皇亲国戚)、议故(皇帝故旧)、议贤 \"八议 (有大德行与影响的人)、议能(有大才能的人)、议功 (有大功勋的人)、议贵(贵族官僚)、议勤(为国家勤劳服务的人)、议宾(前朝皇室宗亲)。","k":"","kb":46,"kh":[[20,81]]},{"id":"2021-35","y":2021,"t":"单","s":"唐朝“掌持邦国刑宪典章,以肃正朝廷”“纠正百官之罪恶”的国家机构是（ ）。","o":["大理寺","中书省","刑部","御史台"],"a":"D","e":"\u0001唐朝御史台作为监察机关,也是中央法律监督机构,其正副长官为御史大夫和御史中丞。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ 御史台掌纠察弹劾百官违法之事,同时负责监督大理寺和刑部的司法审判活动,也参与对重大案件的审判","k":"","kb":47,"kh":[[0,15],[16,77]]},{"id":"2022-30","y":2022,"t":"单","s":"唐天宝年间,有民某甲盗布二十匹,后畏罪自首,供述并交出赃物十五匹,匿赃五匹。根据唐律规定,某甲应承担的法律责任是（ ）。","o":["因自首不论罪","以盗五匹论罪","以盗十五匹论罪","以盗二十匹论罪"],"a":"B","e":"\u0001唐律完善了自首的规定,对犯罪分子交代犯罪性质不彻底的,叫\"自首不实\"。\u0002\nA✗ 唐律完善了自首的规定,对犯罪分子交代犯罪性质不彻底的,叫\"自首不实\"\nB✓ 某甲盗布二十匹,畏罪自首,如实交代,但自首不彻底,对其如实交代的十五匹不予追究,仅以盗五匹论罪\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选\n对犯罪情节不作彻底交代的,叫\"自首不尽\"。 \u0001《名例》\u0002规定,凡\"自首不实及自首不尽者\",各依\"不实不尽之罪罪之。 至死者,听减一等\"。 如实交代的部分,不再追究。","k":"","kb":46,"kh":[[156,201],[497,548]]},{"id":"2022-36","y":2022,"t":"单","s":"下列关于唐朝借贷契约的表述,不正确的是（ ）。","o":["负债违契不偿者应承担法律责任","法律对借贷利率任依私契,官不为理","债权人在债务人不能清偿债务时,可扣押债务人的财产","债权人可令无偿还能力的债务人及其家属以劳役抵偿债务"],"a":"B","e":"\u0001唐朝立法注重保护债权人的利益,《杂律》规定:\"诸负债违契不偿,一匹以上,违二十日,答二十,二十日加一等,罪止杖六十。\u0002\nA✗ 唐朝立法注重保护债权人的利益,\u0001《杂律》\u0002规定:\"诸负债违契不偿,一匹以上,违二十日,答二十,二十日加一等,罪止杖六十\nB✓ 唐后期的立法中,进一步降低法定利率,并对违法取利者加重处罚\nC✗ 唐朝法律还规定,允许债权人在债务人不能清偿债务时扣押债务人的财产,称为\"牵\"\nD✗ 债务人确无财产可供扣押,则可\"役身折酬\",即驱使债务人及其家属以劳役抵偿债务\n三十匹加二等,百匹,又加三等。 \u0001《杂令》\u0002规定:\"诸公私以财物出举者,任依私契,官不为理。 每月取利不得过六分,积日虽多,不得过一倍·.....又不得回利为本。 \"\"诸以粟麦出举,还为粟麦者,任依私契,官不为理。 仍以一年为断,不得因旧本更令生利, 又不得回利为本。 \"显然立法也注意保护债务人的合法权益,禁止私人高利贷。 但牵前须向官府报告并经批准。 本题为选非题, 故选择B。","k":"","kb":47,"kh":[[174,227]]},{"id":"2022-37","y":2022,"t":"单","s":"《大明律吏律职制》规定:“若刑部及大小各衙门官吏,不执法律,听从上司主使出入人罪者,罪亦如之。”该罪是指（ ）。","o":["见知故纵","不直","奸党","纵囚枉法"],"a":"C","e":"\u0001不直、纵因是秦律中规定的司法官的办案责任,一般指司法官故意枉法裁判。\u0002\nA✗ 见知故纵是汉律中危害国家政权的犯罪,即官吏见知贼盗犯罪真情而不及时举告,与罪犯判处同等刑罚\nB✗ 不直是指故意重罪轻判或轻罪重判,纵囚是指故意减轻犯罪情节或应论而不论者\nC✓ 甚至\"上言宰执大臣美政才德者\", 均构成奸党罪\nD✗ 与题干设问或现行制度要件不符，故不选\n鉴于历代臣下结党造成皇权削弱,统治集团内部矛盾导致国亡民乱的教训,明朝严禁臣下结党,在\u0001《大明律》\u0002中增设\"奸党\"罪,并罗列了该罪的种种表现:在朝官员交结朋党素乱朝政者; 大小官员巧言进谏,请求宽免死罪之人,暗中邀买入心者; 司法官不执行法律,而听从上级命令出入入罪者; \"奸邪进逸言,左使杀人者\";","k":"","kb":47,"kh":[[16,77],[174,227]]},{"id":"2022-49","y":2022,"t":"多","s":"《唐律疏议名例》规定：“盗缌麻以上财物，节级减凡盗之罪。若犯诈欺及坐赃之类，在律虽无减文，盗罪尚得减科，余犯明从减法。”其中所反映出的刑法原则有（ ）。","o":["合并论罪从重","轻重相举","依服制定罪","老幼恤刑"],"a":"BC","e":"\u0001合并论罪从重,是指一人犯两种或两种以上罪者,从重者论,但不累加处刑。\u0002\nA✗ 重罪吸收轻罪,刑不累加\nB✓ 轻重相举即类推原则, 盗窃尚能减轻处罚,比盗窃危害更小的诈骗和坐赃类犯罪就更应当减轻处罚,此即\"举重以明轻\"\nC✓ 盗窃缌麻以上亲等的财物,按服制减轻处罚\nD✗ 老幼恤刑即老幼废疾减刑,唐律对老幼废疾者,分不同情形实行减免刑罚\n依服制定罪是指亲属间的犯罪,据五等丧服所规定的亲等来定罪量刑。 古代服制把亲属分为五等: 斩衰、齐衰、大功、小功、缌麻。 凡以尊犯卑,服制愈近,处罚愈轻,服制愈远,处罚愈重; 凡以卑犯尊,服制愈近,处罚愈重,服制愈远,处罚愈轻。 对于家庭(族) 内的财产侵犯,则服制愈近,处罚愈轻,服制愈远,处罚愈重。 题目中这一规定没有体现老幼恤刑原则,","k":"","kb":46,"kh":[[0,19],[395,429]]},{"id":"2023-29","y":2023,"t":"单","s":"出土于敦煌的唐代《放妻书》写道:“既以二心不同,难归一意,快会及诸亲,各还本道解怨释结,更莫相憎;一别两宽,各生欢喜。”该《放妻书》所反映的唐代离婚制度是（ ）。","o":["义绝","和离","七出","三不去"],"a":"B","e":"\u0001《放妻书》记载夫妻双方情意不合协议解除婚姻关系，体现唐代的和离制度。\u0002\nA✗ 义绝是指夫妻一方对另一方及其亲属犯有殴打杀伤等恶性行为时，\u0001官府强制判令离婚\u0002\nB✓ 唐律规定“若夫妻不相安谐而和离者，不坐”，《放妻书》即是唐代\u0001夫妻双方自愿协议离婚（和离）\u0002的契约证明\nC✗ 七出是指夫方单方面休妻的七种法定事由，与“各生欢喜”的双方协议不符\nD✗ 三不去是对夫方行使“七出”休妻权的三种限制条件\n唐朝离婚制度三种路径：\u0001协议和离\u0002（不坐）、\u0001夫方七出\u0002（受三不去限制）、\u0001强制义绝\u0002（不离反坐徒一年）。","k":"","kb":47,"kh":[[227,291]]},{"id":"2023-35","y":2023,"t":"单","s":"唐中期某部尚书受所监临财物,赃值抵八匹,依律应判徒一年,但由于其为正三品职事官, 享有“八议”资格,据律可减一等处罚,则对其量刑应为（ ）。","o":["笞五十","杖九十","杖一百","徒半年"],"a":"C","e":"\u0001唐律封建五刑中比“徒一年”低一等的刑罚为“杖一百”。\u0002\nA✗ 笞刑共五等（笞十至笞五十），比徒一年依次降等为杖一百，远未降至笞五十\nB✗ 杖九十是比杖一百再低一等的刑罚，此处仅据“八议”减一等\nC✓ 唐律五刑自轻到重紧密衔接：笞（十至五十）→杖（六十、七十、八十、九十、一百）→徒（一年至三年）；故\u0001徒一年减一等正好是杖一百\u0002\nD✗ 唐律五刑的徒刑最低一等就是“徒一年”，不存在“徒半年”的法定刑等\n熟记《唐律》五刑二十等衔接：笞五十→\u0001杖六十…杖一百→徒一年\u0002（每增半年为一等至三年）→流二千里（加三千）→死（绞斩）。","k":"","kb":46,"kh":[[0,19],[91,156]]},{"id":"2023-37","y":2023,"t":"单","s":"相较于唐宋而言,明清时期刑律对于化外人犯罪的规定发生了重大变化。这种变化主要是（ ）。","o":["规定化外人犯罪不再科刑","确立完全的属人主义原则","确立完全的属地主义原则","采用属人主义与属地主义相结合原则"],"a":"C","e":"\u0001明清时期改变唐宋“化外人”属人兼属地原则，在刑律中确立了完全的属地主义原则。\u0002\nA✗ 明清对化外人在华犯罪一律依中国法律严加科刑惩治，并非免予科刑\nB✗ 唐律对“诸化外人同类自相犯者各依本俗法”体现了部分属人主义，明清则彻底抛弃属人主义\nC✓ 《大明律》《大清律例》规定“凡化外人犯罪者，并依律拟断”，取消同类依本俗法规定，确立\u0001完全的属地主义原则\u0002\nD✗ 采用属人主义与属地主义相结合（同类自相犯依本俗，异类相犯依唐律）正是\u0001唐宋时期\u0002的规则，非明清变革\n注意清后期因不平等条约才被迫丧失司法主权设立领事裁判权，但\u0001传统《明清律》法典本身采完全属地主义\u0002。","k":"","kb":49,"kh":[[260,298],[399,453]]},{"id":"2023-49","y":2023,"t":"多","s":"下列关于《开皇律》的表述,正确的有（ ）。","o":["完善了“官当”制度","正式确立了“十恶”罪名","设加役流为死刑减等后的刑罚","刑罚定型为死、流、徒、杖、笞五刑"],"a":"ABD","e":"\u0001《开皇律》完善官当、首立“十恶”、定型封建五刑，而“加役流”乃唐太宗《贞观律》创设。\u0002\nA✓ 隋文帝《开皇律》把此前零散的以官折抵徒罪规范化，\u0001进一步完善了“官当”制度\u0002\nB✓ 《开皇律》在《北齐律》“重罪十条”基础上整合删削，\u0001正式确立了封建刑法中的“十恶”罪名\u0002\nC✗ 设立\u0001“加役流”\u0002（流三千里加役三年，作为死刑减等替代刑）的是\u0001唐太宗《贞观律》\u0002，而非隋《开皇律》\nD✓ 《开皇律》彻底废除宫刑与鞭刑等残酷刑罚，最终\u0001定型为笞、杖、徒、流、死封建制五刑\u0002\n高频陷阱对比：\u0001《开皇律》定型五刑+十恶\u0002；\u0001《贞观律》增设加役流\u0002（减少死刑）。","k":"","kb":46,"kh":[[20,81],[244,320]]},{"id":"2024-30","y":2024,"t":"单","s":"唐玄宗时期,京北府某甲因盗牛事发而被官府抓获,他在受审时主动交代了私铸钱的犯罪行为。按照唐律规定,甲应承担的罪责是（ ）。","o":["窃盗罪","私铸钱罪","窃盗罪与私铸钱罪并罚","因自首而免除全部罪责"],"a":"A","e":"\u0001唐律严格区分“犯罪未发而自首”与“犯罪已发”，事发被捕后交代另一未发重罪（私铸钱）仅以该重罪（或仅免/轻处余罪?注意原案：唐律“因被问而自首别罪”，对已发盗牛罪必须追究，但新供私铸钱免罪，故甲最终仅承担已发的窃盗罪！）。\u0002\nA✓ 依据《唐律疏议·名例》“犯罪已发及已配而更为罪”及“犯罪未发而自首”条：\u0001自首免罪仅限于犯罪未发觉者\u0002；甲盗牛已被捕（已发），故\u0001窃盗罪不能免罪须如实承担\u0002；但受审时主动交代尚未发觉的私铸钱罪属于“因被问余罪而自首别罪”，依法\u0001免除其未发的私铸钱罪\u0002\nB✗ 私铸钱罪系官府尚未发觉而由甲主动交代，依唐律“余罪得自首免罪”原则，私铸钱罪予以免除\nC✗ 因私铸钱罪按自首得免，故无须并罚（且唐律二罪以上俱发亦行“重罪吸收轻罪”原则，不简单机械并罚）\nD✗ 已发觉被捕的盗牛罪不具备自首要件，不能免除全部罪责\n《唐律》自首黄金规则：\u0001“因甲罪被捕，主动交代尚未被发觉的乙罪，乙罪按自首免除，仍仅就已发的甲罪论处”\u0002！","k":"","kb":46,"kh":[[0,19],[395,429]]},{"id":"2024-36","y":2024,"t":"单","s":"中国古代创造了璀璨的法律文明，许多优秀的法典影响了整个东南亚国家和地区。被后世评论为“一准乎礼，以为出入，得古今之平”的古代法典是（ ）。","o":["开皇律","唐律疏议","宋刑统","大明律"],"a":"B","e":"\u0001被《四库全书总目提要》评价为“一准乎礼，以为出入，得古今之平”的古代法典是《唐律疏议》。\u0002\nA✗ 《开皇律》虽确立五刑与十恶，但礼法融贯及体系精密评语并非此句\nB✓ 《四库全书总目》称赞\u0001《唐律疏议》“一准乎礼，以为出入，得古今之平”\u0002，标志着中国古代法律儒家化的彻底完成与中华法系最高成就\nC✗ 《宋刑统》篇目虽承袭《唐律疏议》，且增加了门类与敕令格式起请，但“一准乎礼”特指《唐律疏议》\nD✗ 《大明律》体例改十二篇为七篇，强调“重其所重、轻其所轻”，非此赞誉对象\n记住《唐律疏议》两大经典名评：\u0001“一准乎礼，以为出入，得古今之平”\u0002、\u0001“礼法合一的典范”\u0002。","k":"","kb":46,"kh":[[20,81],[91,156]]},{"id":"2024-37","y":2024,"t":"单","s":"唐朝大中年间,某县令母亲病亡,为避免丁忧去官,县令隐蔽母亲丧情不报,未办丧事,按唐律规定,该县令的行为构成（ ）。","o":["不孝","不睦","恶逆","不义"],"a":"A","e":"\u0001父母病亡匿丧不报以贪恋官位（避免丁忧守丧），在唐律“十恶”中构成“不孝”。\u0002\nA✓ 《唐律疏议·名例》将“居父母丧，身自嫁娶，若作乐、释服从吉；\u0001闻祖父母、父母丧，匿不举哀\u0002”明确归入“十恶”之\u0001不孝\u0002\nB✗ 不睦指谋杀或卖缌麻以上亲，或殴告夫及大功以上尊长等破坏一般亲属和睦行为\nC✗ 恶逆指殴打及谋杀祖父母、父母、夫之祖父母父母等尊长最惨痛逆伦暴力行为\nD✗ 不义指杀本属府主、刺史、县令、现受业师及闻夫丧匿不举哀等非血缘尊卑伦常犯罪\n“不孝”与“不义”精确对照：\u0001父母丧匿不举哀属“不孝”\u0002；\u0001夫丧匿不举哀才属“不义”\u0002。","k":"","kb":46,"kh":[[20,81],[244,320]]},{"id":"2025-30","y":2025,"t":"单","s":"唐玄宗天宝年间,甲婚娶喜庆日,好友乙与甲嬉闹,将甲置于柜中,不幸柜倾覆,致甲死亡。依照唐律,乙构成的罪名是（ ）。","o":["故杀","戏杀","误杀","过失杀"],"a":"B","e":"\u0001\"故杀\"指事先虽无预谋,但情急杀人时已有杀人的意念。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 本题中甲与乙是好友,与甲嬉闹,将甲置于柜中,是\"以力共戏\",柜子倾覆导致甲死亡,乙构成戏杀\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ \"过失杀\"指\"耳目所不及,思虑所不至\"而杀人\n\"误杀\"指由于种种原因杀错了对象; \"戏杀\"指\"以力共戏\"而导致杀人。","k":"","kb":46,"kh":[[91,156],[351,388]]},{"id":"2025-35","y":2025,"t":"单","s":"依照唐律规定,债务人无力偿还债务时,债权人可令债务人及其户内男口,以劳务代偿债务。这一制度称为（ ）。","o":["牵掣","备偿","抵当","役身折酬"],"a":"D","e":"\u0001唐朝法律规定,允许债权人在债务人不能清偿债务时扣押债务人的财产,称为\"牵掣\"。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ 债务人确无财产可供扣押,则可\"役身折酬\",即驱使债务人及其家属以劳役抵偿债务\n但牵掣前须向官府报告并经批准。","k":"","kb":46,"kh":[[20,90]]},{"id":"2025-36","y":2025,"t":"单","s":"《唐律疏议贼盗》规定:“诸盗经断后,仍更行盗,前后三犯徒者,流二千里;三犯流者,绞。”这一规定所反映的刑法原则是（ ）。","o":["共犯加重","故意犯罪从重","累犯加重","合并论罪从重"],"a":"C","e":"\u0001唐朝规定了累犯加重原则。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✓ 其他犯罪均以此类推\nD✗ 与题干设问或现行制度要件不符，故不选\n对于盗窃、强盗犯罪,更犯累科,即犯罪已被告发或已配决者,重又犯罪的要加重处罚。 \u0001《唐律疏议·贼盗》\u0002:\"诸盗经断后仍更行盗,前后三犯徒者,流二千里; \"即前后三次犯应处徒刑的罪,不是按其中最重的一次处刑, 而是处以流刑两千里。","k":"","kb":46,"kh":[[0,19],[91,156]]},{"id":"2026-30","y":2026,"t":"单","s":"唐开元年间,长安城富商张某去世,遗留财产六百金。张某有三子,长子张大、次子张二和幼子张三。张大已于一年前因病亡故,留有两未成年小  ）。","o":["德国","瑞士","日本","苏俄"],"a":"BD","e":"\u0001这种立法体例所参酌效仿的国家包括瑞士、暹罗及苏俄等。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 南京国民政府的民事立法采取民商合一的编纂体例\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ 只编纂民法典,不单独编纂商法典\n\"民商依据民法起草委员会的\u0001《民法债编立法理由》\u0002, \"参酌瑞士、暹罗及苏俄诸国民法,特将商合一\"就是法总则中之经理人及代办商,商行为中之交互计算、 \" ,不能并行纪、仓库、运送营业及承揽运送一并订入入民法典的商事法律规范,以单行法另行规定。","k":"","kb":51,"kh":[[412,447],[447,555]]},{"id":"2021-32","y":2021,"t":"单","s":"下列关于《大清民律草案》与《中华民国民法》共同点的表述,正确的是（ ）。","o":["均由修订法律馆与礼学馆共同起草","均采用个人本位的立法原则","均采取民商分立的编纂模式","均采用《德国民法典》的编制体例"],"a":"D","e":"\u0001《中华民国民法》采用社会本位的立法原则。\u0002\nA✗ \u0001《中华民国民法》\u0002不是由修订法律馆与礼学馆起草,修订法律馆与札学馆是清末的机构,不 \"居是南京国民政府的机构\nB✗ \u0001《中华民国民法》\u0002采用社会本位的立法原则\nC✗ \u0001《中华民国民法》\u0002采取民商合一的编纂模式\nD✓ \u0001《大清民律草案》\u0002和\u0001《中华民国民法》\u0002均采用\u0001《德国民法典》\u0002的编制体例","k":"","kb":51,"kh":[[412,447]]},{"id":"2021-39","y":2021,"t":"单","s":"北洋政府时期的民事法律渊源中效力最高的是（ ）。","o":["条理","现行律民事有效部分","判例","民事习惯"],"a":"B","e":"\u0001大理院 \"本院查 '判断民事案件应先依法在判例中明确表示: 律所规定,无法律明文者,依习惯法。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 现在民国民法典尚未颁行,前清现行律关于民事各规定继续有效,自应根据以为判 \" 的效力高 \"现行律民事有效部分 '\",明确肯定了断于习惯和条理\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选\n现行律民事有效部分即\u0001《大清现行刑律》\u0002中民事规范经确认有效的部分。 北洋政府时期大量采用、删改清末新定之法律。 从1912年到1928年\u0001《中华民国民法》\u0002颁布之前,\"现行律民事有效部分一直为大理院和地方各级司法机关所适用。 无习惯法者,则依条理,盖通例也。","k":"","kb":50,"kh":[[132,190],[450,510]]},{"id":"2021-50","y":2021,"t":"多","s":"下列选项中，属于南京国民政府“六法全书”中法律部门的有（ ）。","o":["民事诉讼法","行政法","刑事诉讼法","经济法"],"a":"ABC","e":"\u00011928—1937年,国民政府先后公布实施了六个门类的法律法规,即宪法(《训政时期约法》)、民法、民事诉讼法、刑法、刑事诉讼法、行政法, 建立起国民政府法律体系的基本框架。\u0002\nA✓ 符合题意及现行制度规定（\u0001民事诉讼法\u0002）\nB✓ 符合题意及现行制度规定（\u0001行政法\u0002）\nC✓ 符合题意及现行制度规定（\u0001刑事诉讼法\u0002）\nD✗ 与题干设问或现行制度要件不符，故不选","k":"","kb":51,"kh":[[412,447],[447,555]]},{"id":"2022-40","y":2022,"t":"单","s":"1903年，上海英租界发生“苏报案”，革命党人邹容和章炳麟被捕入狱。清廷派遣谳员孙建臣、上海知县汪瑶庭，与英国副领事组成审判法庭，对该案进行审理并作出判决。该案的审判组织属于（ ）。","o":["会审公靡","领事法庭","城漱局","地方审判厅"],"a":"A","e":"\u0001外国在华领事裁判权的主要内容包括\"不同国家的侨民之间的争讼,一般均适用被告主义原则,由被告一方所属国的领事法院或相应机构审理,中国官员亦不得过问。\u0002\nA✓ 实际上所谓\"会审\",只是空有其名,甚至租界内纯粹中国人之间的诉讼,最终也须外国领事观审并操纵判决\nB✗ \" 可见,领事法庭为外国在华设置的审判机构,而非清政府在租界内设立的特殊审判机关\nC✗ 城局和地方审判厅为清末的审判机构\nD✗ 与题干设问或现行制度要件不符，故不选\n会审公解,又称会审公堂,是清政府在租界内设立的特殊审判机关,实际上是领事裁判权制度的延伸。 1864年清政府与英、法、美三国驻上海领事协议在租界内设立专门审判机构,正式形成了会审公解制度。 会审公解名义上是中国官府派驻租界的基层法庭,对租界内中国人之间及中国人为被告的案件实施管辖,但凡诉讼牵涉外国人,若被告系有约国人,由其本国领事裁判; 若被告是无约国人,仍须邀一名外国官员\"陪审\"。 在清末法制改革中,为了尽快建立新审判机构,沈家本主持编成\u0001《大理院审判编制法》\u0002,共包括五节:总纲、大理院、京师高等审判厅、城内外地方审判厅、城局。","k":"","kb":50,"kh":[[379,450],[450,510]]},{"id":"2022-50","y":2022,"t":"多","s":"1935年南京国民政府颁布《中华民国刑法》,采取社会防卫主义,增设保安处分。保安处分的适用对象有（ ）。","o":["未成年犯罪之人","已经构成犯罪之人","有潜在犯罪危险之人","有犯罪或妨碍社会秩序嫌疑之人"],"a":"ACD","e":"\u0001保安处分是用来补充或替代刑罚以预防犯罪、维护社会秩序的强制性措施,其适用对象是未成年的少年犯及有犯罪或妨碍社会秩序嫌疑之人, 特别是那些有潜在犯罪危险,而不是已经构成犯罪的人员。\u0002\nA✓ 符合题意及现行制度规定（\u0001未成年犯罪之人\u0002）\nB✗ 与题干设问或现行制度要件不符，故不选\nC✓ 符合题意及现行制度规定（\u0001有潜在犯罪危险之人\u0002）\nD✓ 保安处分是用来补充或替代刑罚以预防犯罪、维护社会秩序的强制性措施,其适用对象是未成年的少年犯及有犯罪或妨碍社会秩序嫌疑之人, 特别是那些有潜在犯罪危险,而不是已经构成犯罪的人员","k":"","kb":51,"kh":[[412,447],[447,555]]},{"id":"2023-39","y":2023,"t":"单","s":"下列宪法或宪法性文件中,对“国权”和“地方制度”分别作出专章规定的是（ ）。","o":["《钦定宪法大纲》","《中华民国临时约法》","《中华民国约法》","1923年《中华民国宪法》"],"a":"D","e":"\u00011923年北洋政府《中华民国宪法》（“贿选宪法”）首次专章规定“国权”与“地方制度”。\u0002\nA✗ 1908年《钦定宪法大纲》仅设“君上大权”与附“臣民权利义务”，全篇未设国权或地方专章\nB✗ 1912年《临时约法》设中华民国、人民、参议院、临时大总统、国务员、法院等章，无“国权”“地方制度”专章\nC✗ 1914年袁记《中华民国约法》强化总统独裁体制，亦无地方制度专章\nD✓ 1923年曹锟《中华民国宪法》打着“联省自治”幌子，专门设立\u0001“国权”和“地方制度”\u0002两章划分中央地方权限\n民国宪法特征速记：临时约法（内阁制）、袁记约法（总统独裁）、\u00011923贿选宪法（国权+地方制度专章）\u0002。","k":"","kb":51,"kh":[[193,244],[268,305]]},{"id":"2023-40","y":2023,"t":"单","s":"南京国民政府时期,负责审理行政诉讼案件的机构是（ ）。","o":["司法院","地方法院","行政法院","最高法院"],"a":"C","e":"\u0001南京国民政府设立与普通法院并列的“行政法院”，专门负责审理行政诉讼案件。\u0002\nA✗ 司法院是南京国民政府最高司法行政及统筹机关，其下分设最高法院、行政法院与公务员惩戒委员会\nB✗ 地方法院属于普通司法审级的第一审法院，审理一般民刑案件，不受理行政诉讼\nC✓ 南京国民政府实行二元司法体制，由司法院直属的\u0001行政法院\u0002专门审理全国不服行政处分的行政诉讼（实行一审终审制）\nD✗ 最高法院为普通民刑案件的最高终审法院，不管辖行政诉讼\n注意区分：北洋政府行政诉讼机关叫\u0001平政院\u0002，南京国民政府行政诉讼机关叫\u0001行政法院\u0002。","k":"","kb":51,"kh":[[412,447],[555,578]]},{"id":"2023-50","y":2023,"t":"多","s":"《中华民国民法》第1条明确规定:“民事法律未规定者,依习惯,无习惯者,依法理。”下列关于南京国民政府时期民事立法中“习惯”的表述,正确的有（ ）。","o":["习惯的适用优先于法理","习惯的适用以法无明文为限","习惯构成南京国民政府民事法律的渊源","习惯以不违背公共秩序和善良风俗为限"],"a":"ABCD","e":"\u00011929年《中华民国民法》第1条构建了“制定法→习惯→法理”的近代民事法源适用顺位。\u0002\nA✓ 从“无习惯者，依法理”的文义可见，习惯在填补法律漏洞时\u0001适用顺位优先于法理\u0002\nB✓ 条文规定“民事法律未规定者，依习惯”，说明\u0001习惯仅在制定法无明文规定时补充适用\u0002\nC✓ 该条将习惯正式吸纳进法源序列，证明\u0001习惯构成南京国民政府正式的民事法律渊源\u0002\nD✓ 《中华民国民法》第2条进一步明确限制：习惯之适用\u0001以不背于公共秩序或善良风俗者为限\u0002\n南京国民政府《民法》第1、2条考法经典：适用顺位\u0001制定法→不背公序良俗之习惯→法理\u0002（现我国《民法典》第10条亦吸收类似精神）。","k":"","kb":51,"kh":[[412,447],[447,555]]},{"id":"2024-32","y":2024,"t":"单","s":"中国近代推进法律改革，引入了世界通行的法律理念和原则，先后制定了多部近代化的刑事法典，《大清新刑律》与1935年颁布的《中华民国刑法》是其中的代表。下列选项中，属于这两部法典共同点的是（ ）。","o":["采取社会防卫主义","采取从新从轻主义","侧重于主观主义","遵循罪刑法定原则"],"a":"D","e":"\u0001《大清新刑律》与1935年《中华民国刑法》两部近代刑法典均明确确立并遵循了罪刑法定原则。\u0002\nA✗ 采取社会防卫主义（增设“保安处分”专章）主要见于\u00011935年《中华民国刑法》\u0002，《大清新刑律》仍以传统近代古典报应/感化主义为主，无保安处分专章\nB✗ 1935年《中华民国刑法》采取\u0001从旧兼从轻\u0002或“行为时法/裁判时法最有利于行为人”原则，并非一概从新从轻\nC✗ 主观主义刑法观主要是1935年《中华民国刑法》吸收现代刑法思潮后的转向特征，《大清新刑律》侧重客观主义行为特征\nD✓ 1911年《大清新刑律》第10条首创中国近代\u0001罪刑法定原则\u0002（“法律无正条者，不问何种行为，不为罪”），1935年《中华民国刑法》第1条亦予以完整继承\n中国近代刑法两大标杆对比：《大清新刑律》引入\u0001罪刑法定\u0002；1935《民国刑法》在保留罪刑法定同时增设\u0001保安处分\u0002（社会防卫）。","k":"","kb":51,"kh":[[447,555]]},{"id":"2024-40","y":2024,"t":"单","s":"《中华民国临时约法》是中国近代第一部资产阶级共和国性质的宪法文件，构建了全新的政权组织形式，依照《临时约法》“代表临时政府，总揽政务，公布法律”的是（ ）。","o":["参议院","临时大总统","国务总理","最高法院"],"a":"B","e":"\u0001依据1912年《中华民国临时约法》第29条和第30条，代表临时政府总揽政务并公布法律的是临时大总统。\u0002\nA✗ 参议院行使\u0001立法权\u0002，负责议决法律、预算、选举临时大总统及弹劾总统等，不总揽行政政务\nB✓ 尽管《临时约法》采取责任内阁制（国务员须副署总统命令法律），但名义上与宪制地位上\u0001“临时大总统代表临时政府，总揽政务，公布法律”\u0002\nC✗ 国务总理率领国务员辅佐临时大总统并负其责任（须副署以制约总统），在《临时约法》文本中并不直接“代表临时政府总揽政务”\nD✗ 法院（最高司法机关）独立行使审判权，不掌管行政政务与法律公布\n重要易错辨析：《临时约法》虽实行\u0001责任内阁制\u0002限制袁世凯，但条文第30条原文仍是\u0001“临时大总统代表临时政府，总揽政务，公布法律”\u0002！","k":"","kb":51,"kh":[[71,143],[193,244]]},{"id":"2024-49","y":2024,"t":"多","s":"北洋政府时期是我国民事法律近代化过程中的重要阶段,其民事法律渊源包括（ ）。","o":["制定法","民事习惯","条理","大理院判例解释例"],"a":"ABCD","e":"\u0001北洋政府民事法律渊源呈现过渡时期多元性，包括制定法、民事习惯、条理及大理院判例解释例。\u0002\nA✓ 北洋政府虽未正式颁行完整民法典，但大量沿用《大清现行刑律》民事有效部分及单行民事法规作为\u0001制定法\u0002渊源\nB✓ 当制定法无规定时，北洋司法大量适用经确认不违背公序良俗的\u0001民事习惯\u0002判案\nC✓ 制定法与习惯均欠缺时，法官依据公平正义与民法原理（\u0001条理\u0002）作出裁判\nD✓ 北洋时期最高审判机关\u0001大理院作出的判例及解释例\u0002具有极强拘束力与填补漏洞功能，成为极重要的民事正式法源\n北洋司法近代化亮点：虽未完成独立民法典，但\u0001制定法+民事习惯+条理+大理院判例解释例\u0002构建了过渡民事法源体系。","k":"","kb":50,"kh":[[132,190],[450,510]]},{"id":"2025-32","y":2025,"t":"单","s":"北洋政府时期设立的审核国家财政收入和支出决算的机构是（ ）。","o":["参政院","平政院","司法院","审计院"],"a":"D","e":"\u0001北洋政府时期设立独立于行政机关的审计院,负责审核国家财政收入和支出的决算,核准国家岁出之支付命令。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ 北洋政府时期设立独立于行政机关的审计院,负责审核国家财政收入和支出的决算,核准国家岁出之支付命令\n参议院是立法机关,司法院是司法机关,平政院是负责审理行政诉讼的机关,AB","k":"","kb":51,"kh":[[373,386],[578,613]]},{"id":"2025-39","y":2025,"t":"单","s":"根据《中华民国临时政府组织大纲》,南京临时政府的政权组织形式是（ ）。","o":["议会内阁制","总统共和制","君主立宪制","议行合一制"],"a":"B","e":"\u0001依据题干考查要点，正确表述为“总统共和制”。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ \u0001《临时政府组织大纲》\u0002第一次以法律形式宣告废除封建帝制,以美国的国家制度为蓝本,确立了中华民国的基本政治体制:规定临时政府为总统制共和政体,临时大总统为国家元首和政府首脑,统率军队并行使行政权…\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选\n\u0001《临时政府组织大纲》\u0002第一次以法律形式宣告废除封建帝制,以美国的国家制度为蓝本,确立了中华民国的基本政治体制:规定临时政府为总统制共和政体,临时大总统为国家元首和政府首脑,统率军队并行使行政权力,立法权由参议院行使,审判所作为行使最高司法权的机关,由临时大总统取得参议院同意后设立。","k":"","kb":51,"kh":[[18,71],[71,143]]},{"id":"2025-50","y":2025,"t":"多","s":"下列中国传统法律制度中,《中华民国民法》予以保留的有（ ）。","o":["永佃权","主婚权","教令权","宗祧继承"],"a":"ABC","e":"\u0001《中华民国民法》第三编物权,分通则、所有权、地上权、永佃权、地役权、抵押权、质权、典权、留置权、占有10 章。\u0002\nA✓ \u0001《中华民国民法》\u0002第三编物权,分通则、所有权、地上权、永佃权、地役权、抵押权、质权、典权、留置权、占有10 章\nB✓ 符合题意及现行制度规定（\u0001主婚权\u0002）\nC✓ 符合题意及现行制度规定（\u0001教令权\u0002）\nD✗ 民法典废除了宗祧继承\n民法典肯定包办买卖婚姻及传统习惯,维护夫妻间的不平等和家长制。 如夫妻财产由夫管理,子女从父姓,家置家长,双方合意的买卖婚姻有效等。 因此保留了主婚权和教令权,该项","k":"","kb":51,"kh":[[18,192]]},{"id":"2026-40","y":2026,"t":"单","s":"预备立宪期间，清政府于各省设立谘议局。谘议局“为各省采取舆论之地，以指陈通省利病，筹计地方治安为宗旨”。下列选项中，不属于谘议局权力的有（ ）。","o":["议决本省兴革事宜","议决本省预算决算","选举资政院议员","推举本省督抚人选"],"a":"D","e":"\u0001谘议局无推举督抚权力,督抚中央任命。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ ABC 均为谘议局法定职权\n二、多项选择题(41-50)","k":"","kb":50,"kh":[[89,131]]},{"id":"2026-50","y":2026,"t":"多","s":"南京国民政府1935 年颁布的《中华民国刑法》,吸收借鉴了外国近代刑法的制度原则。1935 年《中华民国刑法》主要借鉴的外国刑法有（ ）。","o":["1927 年德国刑法典","1928 年西班牙刑法典","1930 年意大利刑法典","1931 年日本刑法修正案"],"a":"ABCD","e":"\u00011935 新刑法大量吸收德、西、意、日近代刑法制度。\u0002\nA✓ 符合题意及现行制度规定（\u00011927 年德国刑法典\u0002）\nB✓ 符合题意及现行制度规定（\u00011928 年西班牙刑法典\u0002）\nC✓ 符合题意及现行制度规定（\u00011930 年意大利刑法典\u0002）\nD✓ 符合题意及现行制度规定（\u00011931 年日本刑法修正案\u0002）","k":"","kb":51,"kh":[[412,447],[447,555]]}]},{"sub":"中国宪法学","name":"公民基本权利（平等、政治、自由）","w":3.8,"w5":3.4,"wh":4.7,"bt":"核心","pt":"近5年宪法第1(3.4分/年)·AI治理/数字权利/人格尊严","L":70,"qs":[{"id":"2005-16","y":2005,"t":"单","s":"宪法最主要、最核心的价值在于（ ）。","o":["确认社会各阶级的政治地位","使民主制度法律化","保障公民的基本权利","集中体现阶级力量对比关系"],"a":"C","e":"\u0001宪法最主要、最核心的价值在于,它是公民权利保障书。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✓ 宪法的基本出发点是保障公民权利和自由, 这体现在以下两个方面: (1)从历史角度看,宪法是确认权利和自由的成果\nD✗ 与题干设问或现行制度要件不符，故不选\n(2)从宪法的基本内容看,宪法的基本内容分为两大部分:即国家权力的正确行使和公民权利的有效保障,其凯程民权利的有效保障居于支配地位。","k":"","kb":34,"kh":[[0,22],[23,82]]},{"id":"2005-31","y":2005,"t":"单","s":"某甲出生在美国,父亲是中国人,母亲是美国人,父母定居在美国。根据中国国籍法的规定,关于某甲国籍的正确表述是（ ）。","o":["具有中国国籍","具有双重国籍","无国籍","不具有中国国籍"],"a":"D","e":"\u0001中国国籍法不承认双重国籍,也在一定程度上避免无国籍。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ 某甲出生时取得美国国籍,因此不能取得中国国籍","k":"","kb":34,"kh":[[0,22],[23,82]]},{"id":"2005-32","y":2005,"t":"单","s":"在公民享有的宪法基本权利体系中,最基础的权利是（ ）。","o":["经济社会权利","人身自由","选举权和被选举权","言论自由"],"a":"B","e":"\u0001人身自由,是公民所应享有的最起码的权利,是其他自由和权利的基础。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 人身自由,是公民所应享有的最起码的权利,是其他自由和权利的基础\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选\n没有人身自由也就谈不上其他基本权利和自由。","k":"","kb":35,"kh":[[0,23],[24,76]]},{"id":"2005-54","y":2005,"t":"多","s":"我国现行宪法规定保护公民合法的私有财产,其范围包括（ ）。","o":["生活资料","生产资料","公民拾到的财物","其他债权和知识产权"],"a":"ABD","e":"\u0001公民的私有财产只要是合法的,宪法就予以保护。\u0002\nA✓ 符合题意及现行制度规定（\u0001生活资料\u0002）\nB✓ 符合题意及现行制度规定（\u0001生产资料\u0002）\nC✗ 公民拾到的财物,依照\u0001《民法通则》\u0002第 79 条第2 款,拾得遗失物、漂流物或者失散的饲养动物,应当归还失主,因此而支出的费用由失主偿还\nD✓ 符合题意及现行制度规定（\u0001其他债权和知识产权\u0002）\n据此,公民拾到的财物并不当然归其所有,因此应当排除。","k":"","kb":34,"kh":[[0,22],[23,82]]},{"id":"2006-28","y":2006,"t":"单","s":"某县法院在审理一起民事案件中,为查明案件事实,对一当事人的信件进行拆检,弄清了案情并作出判决。下列说法中正确的是（ ）。","o":["法院为了查明案情可以对当事人的信件进行拆检","法院对当事人与案件无关的信件无权拆检","法院对当事人所有的信件都无权拆检","法院拆检信件并不重要,重要的是作出公正的判决"],"a":"C","e":"\u0001《宪法》第40 条规定,因国家安全或刑事犯罪的需要,由公安机关或检察机关检查公民信件。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✓ 符合题意及现行制度规定（\u0001法院对当事人所有的信件都无权拆检\u0002）\nD✗ 与题干设问或现行制度要件不符，故不选","k":"","kb":34,"kh":[[0,22],[23,82]]},{"id":"2006-29","y":2006,"t":"单","s":"下列关于我国宪法中庇护权的表述,错误的是（ ）。","o":["受庇护权只能给予提出申请要求的外国人","外国人向我国政府提出避难要求,必须是由于政治原因","我国政府对于外国人提出的避难要求应当同意","取得庇护权的外国人,不被引渡或驱逐"],"a":"C","e":"\u0001庇护权的含义:1受庇护权只给予提出申请的外国人2必须出于政治原因3我国政府可同意,也可以不同意4被给予受庇护的权利的外国人不被引渡或驱逐。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✓ 符合题意及现行制度规定（\u0001我国政府对于外国人提出的避难要求应当\u0002）\nD✗ 庇护权的含义:1受庇护权只给予提出申请的外国人2必须出于政治原因3我国政府可同意,也可以不同意4被给予受庇护的权利的外国人不被引渡或驱逐","k":"","kb":34,"kh":[[144,197]]},{"id":"2006-58","y":2006,"t":"多","s":"规定公民有取得国家赔偿权利的我国宪法是（ ）。","o":["1954 年宪法","1975 年宪法","1978 年宪法","1982 年的宪法"],"a":"AD","e":"\u00011954 年《宪法》和1982 年《宪法》(现行)规定公民有取得国家赔偿权利。\u0002\nA✓ 1954 年\u0001《宪法》\u0002和1982 年\u0001《宪法》\u0002(现行)规定公民有取得国家赔偿权利\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ 符合题意及现行制度规定（\u00011982 年的宪法\u0002）","k":"","kb":34,"kh":[[0,22],[23,82]]},{"id":"2007-18","y":2007,"t":"单","s":"以《人权和公民权利宣言》作为宪法序言的是 （ ）。","o":["1787 年的美国宪法","1791 年的法国宪法","1918 年的苏俄宪法","1919 年的德国魏玛宪法"],"a":"B","e":"\u0001依据题干考查要点，正确表述为“1791 年的法国宪法”。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 人权宣言\u0001《人权和公民权利宣言》\u0002(简称\u0001《人权宣言》\u0002)是法国大革命时期制定的,后来成为法国第一部宪法-1791 年宪法的序言\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选","k":"","kb":22,"kh":[[171,209],[209,242]]},{"id":"2007-20","y":2007,"t":"单","s":"关于公民出生国籍的确定,我国采用的原则是 （ ）。","o":["血统主义原则","出生地主义原则","以血统主义为主、出生地主义为辅的原则","以出生地主义为主、血统主义为辅的原则"],"a":"C","e":"\u0001国籍的取得根据国籍法的规定,我国采取的是以血统主义为主,以出生地主义为辅的原则。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✓ 国籍的取得根据国籍法的规定,我国采取的是以血统主义为主,以出生地主义为辅的原则\nD✗ 与题干设问或现行制度要件不符，故不选\n其具体内容是:父母双方或者一方为中国公民,本人出生在中国的; 父母双方或者一方为中国公民,本人出生在外国的,具有中国国籍,但是如果父母双方或者一方为中国公民并定居在外国,本人出生时具有外国国籍的,则不具有中国国籍; 父母无国籍,或者国籍不明,定居在中国,本人出生在中国的,具有中国国籍。","k":"","kb":34,"kh":[[0,22],[23,82]]},{"id":"2007-31","y":2007,"t":"单","s":"下列关于公民财产权保护的表述中,符合我国现行宪法规定的是 （ ）。","o":["公民的私有财产不受侵犯","公民的私有财产神圣不可侵犯","公民的合法的私有财产不受侵犯","公民的合法的私有财产神圣不可侵犯"],"a":"C","e":"\u0001依据题干考查要点，正确表述为“公民的合法的私有财产不受侵犯”。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✓ 财产权 2004 年修改宪法时,将宪法第 13 条修改为\"公民的合法的私有财产不受侵犯\",没有\"神圣\"二字:\nD✗ 与题干设问或现行制度要件不符，故不选","k":"","kb":34,"kh":[[0,22],[23,82]]},{"id":"2007-54","y":2007,"t":"多","s":"我国现行宪法规定的公民文化权利有（ ）。","o":["科学研究的自由","出版自由","文学艺术创作的自由","言论自由"],"a":"AC","e":"\u0001依据题干与现行制度规定综合判断作答。\u0002\nA✓ 我国公民的文化权利在我国,公民的文化权利包括从事科学研究的权利、文艺创作的权利和从事其他文化活动的权利,而出版自由和言论自由属于政治自由的范畴,题目要求\nB✗ 与题干设问或现行制度要件不符，故不选\nC✓ 符合题意及现行制度规定（\u0001文学艺术创作的自由\u0002）\nD✗ 与题干设问或现行制度要件不符，故不选","k":"","kb":34,"kh":[[0,22],[23,82]]},{"id":"2007-59","y":2007,"t":"多","s":"我国公民取得国家赔偿的情况包括 （ ）。","o":["行政赔偿","刑事被害赔偿","刑事赔偿","精神损害赔偿"],"a":"AC","e":"\u0001取得赔偿的权利 . 宪法规定,由于国家机关和国家机关工作人员侵犯公民权利而受到损失的人,有依照法律规定取得赔偿的权利。\u0002\nA✓ 符合题意及现行制度规定（\u0001行政赔偿\u0002）\nB✗ 与题干设问或现行制度要件不符，故不选\nC✓ 符合题意及现行制度规定（\u0001刑事赔偿\u0002）\nD✗ 刑事被害人赔偿是在刑事诉讼中针对被告人提出的,精神损害赔偿是在民事诉讼中针对加害人提出的\n目前我国的国家赔偿包括行政赔偿和刑事赔偿。","k":"","kb":34,"kh":[[0,22],[23,82]]},{"id":"2008-23","y":2008,"t":"单","s":"按照马克思主义的观点,公民享有的监督权的核心是（ ）。","o":["批评权","罢免权","言论自由","政治自由"],"a":"C","e":"\u0001依据题干考查要点，正确表述为“言论自由”。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✓ 言论自由,是公民通过各种语言形式宣传自己思想和观点的自由,宪法中主要指政治言论自由,是公民参与国家管理的有效形式,在政治权利体系中处于核心地位,是民主政治的基础,具有政治监督作用\nD✗ 与题干设问或现行制度要件不符，故不选","k":"","kb":34,"kh":[[0,22],[198,246]]},{"id":"2008-31","y":2008,"t":"单","s":"根据我国现行宪法和法律的规定,有权决定扣押或者拆检公民信件的国家机关是（ ）。","o":["审判机关和检察机关","公安机关和检察机关","公安机关和审判机关","公安机关和监察机关"],"a":"B","e":"\u0001根据《宪法》第40 条,除因国家安全或者追查刑事犯罪的需要,由公安机关或者检察机关依照法律规定的程序对通信进行检查外,任何组织或者个人不得以任何理由侵犯公民的通信自由和通信秘密。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 根据\u0001《宪法》\u0002第40 条,除因国家安全或者追查刑事犯罪的需要,由公安机关或者检察机关依照法律规定的程序对通信进行检查外,任何组织或者个人不得以任何理由侵犯公民的通信自由和通信秘密\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选\n据此,对通信进行检查(包括扣押或者拆检)的机关仅有公安机关应当从广义上理解,包括公安机关、国家安全机关、军队保卫部门、监狱、海关等依照刑事诉讼法行使刑事侦查权的机关。","k":"","kb":35,"kh":[[0,23],[196,309]]},{"id":"2008-55","y":2008,"t":"多","s":"根据我国现行宪法的规定,下列关于受庇护权的表述,正确的有（ ）。","o":["受庇护权保护的对象只能是外国人","申请庇护可以基于政治原因,也可以是其他原因","对于受庇护的申请,我国政府可以同意也可以不同意","享有庇护权的人不被驱逐或引渡"],"a":"ACD","e":"\u0001根据《宪法》第32 条第2 款,中华人民共和国对于国为政治原因要求避难的外国人,可以给予受庇护的权利。\u0002\nA✓ 对此注意以下四点:受庇护的对象只能是外国人\nB✗ (2)给予庇护的原因仅限于政治原因\nC✓ 符合题意及现行制度规定（\u0001对于受庇护的申请,我国政府可以同意也\u0002）\nD✓ (4)给予庇护后,该享有庇护权的人不被驱逐或引渡\n(3)庇护可以给予,也可以不给予;","k":"","kb":35,"kh":[[0,23]]},{"id":"2008-58","y":2008,"t":"多","s":"外国人或无国籍人申请加入中国国籍应具备的条件有（ ）。","o":["申请人是中国公民的近亲属","申请人定居在外国","申请人自愿","申请人有其他正当理由"],"a":"ACD","e":"\u0001根据《国籍法》第7 条,外国人或无国籍人,愿意遵守中国宪法和法律,并具有下列条件之一的, 可以经申请批准加入中国国籍:(1)中国人的近亲属。\u0002\nA✓ 根据\u0001《国籍法》\u0002第7 条,外国人或无国籍人,愿意遵守中国宪法和法律,并具有下列条件之一的, 可以经申请批准加入中国国籍:(1)中国人的近亲属\nB✗ 申请人定居在外国并非可以申请加入中国的情形\nC✓ 符合题意及现行制度规定（\u0001申请人自愿\u0002）\nD✓ (3)有其他正当理由\n(2)定居在中国的; 申请人定居在中国的,可申请加入中国国籍。","k":"","kb":34,"kh":[[0,22],[23,82]]},{"id":"2009-52","y":2009,"t":"多","s":"在我国现行宪法中,既表现为权利又表现为义务的一剖（ ）。","o":["平等权","劳动权","受教育权","言论自由权"],"a":"BC","e":"\u0001《宪法》的第42 条规定,中华任命共哈国公民有劳动的权利和义务。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 符合题意及现行制度规定（\u0001劳动权\u0002）\nC✓ 劳动权和受教育权及保险为全力又表现为义务\nD✗ 与题干设问或现行制度要件不符，故不选\n第46 条规定,中华人民共和国的公民有受教育的权利和义务。 平等全市公民的基本权利,言论自由是公民的政治自由的一种。 \u0001“平等权”\u0002和此题。","k":"","kb":34,"kh":[[0,22],[23,82]]},{"id":"2009-55","y":2009,"t":"多","s":"公民甲因涉嫌犯罪,有关机关欲搜查其住处。根据我国现行宪法和法律的规定,应当遵循的法定程序包括（ ）。","o":["由公安机关执行","经人民法院批准","有相关的证人在场","工作人员应当出示搜查证见"],"a":"ACD","e":"\u0001《刑事诉讼法》第109 条规定,为了收集犯罪证据,查获犯罪人, 侦查人员可以对犯罪嫌疑人以及可能隐藏罪犯或者犯罪证据的人的身体、物品、住处和其他有关的地方进行授查。\u0002\nA✓ \u0001《刑事诉讼法》\u0002第109 条规定,为了收集犯罪证据,查获犯罪人, 侦查人员可以对犯罪嫌疑人以及可能隐藏罪犯或者犯罪证据的人的身体、物品、住处和其他有关的地方进行授查\nB✗ 侦查机关授查住所,不是必须经人民法院批准\nC✓ 应当有被授查人或其他的家属、邻居或者其他见证人在场\nD✓ 第111 条规定,进行授查时,必须向被授查人出示授查证\n本体考察公民的人身自由。 第112 条规定,在授查的时候。","k":"","kb":35,"kh":[[0,23],[24,76]]},{"id":"2009-58","y":2009,"t":"多","s":"根据我国现行宪法规定,对宗教信仰自由的限制表现为（ ）。","o":["不得利用宗教进行破坏社会秩序的活动","不得利用宗教进行损害公民身体健康的活动","不得利用宗教进行妨碍国家教育制度的活动","宗教团体和宗教事务不受外国势力的支配"],"a":"ABCD","e":"\u0001《宪法》第36 条规定,中华人民共和国公民有宗教信仰自由。\u0002\nA✓ 任何人不得利用宗教进行破坏社会秩序、损害公民身体健康、妨碍国家教育制度的活动\nB✓ 符合题意及现行制度规定（\u0001不得利用宗教进行损害公民身体健康的活\u0002）\nC✓ 符合题意及现行制度规定（\u0001不得利用宗教进行妨碍国家教育制度的活\u0002）\nD✓ 宗教团体和宗教事物不受外国势力的支配\n此题考查宗教信仰自由。 任何国家机关、社会团体和个人不得强制公民信仰宗教或者不信仰宗教,不得歧视信仰宗教和不信仰宗教的公民。 国家保护正常的宗教活动。","k":"","kb":34,"kh":[[0,22],[247,290]]},{"id":"2009-59","y":2009,"t":"多","s":"我国保护华侨适用的方式有（ ）。","o":["法律途径保护","政治庇护","外交途径保护","经济手段保护"],"a":"AC","e":"\u0001保护华侨的正当权益,是我国政府的责任,即国际惯例和国际法上对侨民通常的权益保护,以及按对等原则所确定的权益保护,属于我国政府的因尽职责。\u0002\nA✓ 概括的说,我国保护华侨适用的方式有按照国际法进行的法律途径保护\nB✗ 根据\u0001《宪法》\u0002第32 条第2 款,我国的政治庇护是给予\"因为政治原因要求避难的\"外国人而非中国公民\nC✓ 对于一切反华、排华、迫害华侨和损害华侨正当权益的行为,国家通过外交途径与有关国家交涉,对华侨权益作出保护\nD✗ 与题干设问或现行制度要件不符，故不选\n\u0001《宪法》\u0002第50 条固定; 中华人民共和国保护华侨的正当的权利和利益,保护归侨和侨眷的合法的权利和利益。 华侨是居住在外国的中国公民。 根据国际上的通例,我国政府有权维护华侨的正当权益,反对强迫入籍,反对歧视和迫害华侨;","k":"","kb":34,"kh":[[0,22],[144,197]]},{"id":"2010-25","y":2010,"t":"单","s":"我国对于集会游行示威自由的管理方式是（ ）。","o":["备案制","许可制","追惩制","预防制"],"a":"B","e":"\u0001根据《集会游行示威法》对公民集会、游行、示威的申请和许可,集会、游行、示威的举行、时间和地点都作了明确规定。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 可知我国对集会、游行、示威采取许可制\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选\n对于集会、游行、示威的管理方式有登记制、许可制和追惩制。","k":"","kb":34,"kh":[[0,22],[198,246]]},{"id":"2010-30","y":2010,"t":"单","s":"在我国,公民人格尊严不受侵犯属于宪法权利类别中的（ ）。","o":["政治权利和自由","人身自由","平等权","社会经济权利"],"a":"B","e":"\u0001人身自由通常包括公民的人身自由不受侵犯,公民的人格尊严不受侵犯,公民的住宅不受侵犯,公民的通信自由和通信秘密受法律的保护。\u0002\nA✗ 公民基本权利包括:平等权、政治权利和自由、宗教信仰自由、人身自由、监督权和财产权、社会经济文化教育权利\nB✓ 人身自由通常包括公民的人身自由不受侵犯,公民的人格尊严不受侵犯,公民的住宅不受侵犯,公民的通信自由和通信秘密受法律的保护\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选","k":"","kb":35,"kh":[[0,23],[24,76]]},{"id":"2010-31","y":2010,"t":"单","s":"下列选项中,不属于宪法调整的社会关系是（ ）。","o":["国家与公民之间的关系","政党内部的关系","国家机关之间的关系","国家机关内部的关系 )。"],"a":"B","e":"\u0001宪法主要调整的社会关系是国家与公民的关系、国家机关之间的关系、国家与其他社会主体之间的关系及国家机关内部的关系。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 政党内部的关系不是宪法所调整的关系\nC✗ 与题 理差别; (3)依据民族的差异所采取的合理差别。","k":"","kb":34,"kh":[[0,22],[23,82]]},{"id":"2013-57","y":2013,"t":"多","s":"我国《宪法》规定:“中华人民共和国公民有依照法律纳税的义务。”对于该条文,下列理解正确的有（ ）。","o":["税收属于法律保留事项","依法纳税是公民的一项基本义务","“依照法律”包括对国家征税权的约束","该条中的“法律”仅限于全国人大及其常委会制定的法律"],"a":"ABCD","e":"\u0001根据《宪法》和《立法法》,税收基本制度属于只能制定法律的事项,依法纳税是公民的基本 \" 为狭义法律,即全 \"法律义务。\u0002\nA✓ 符合题意及现行制度规定（\u0001税收属于法律保留事项\u0002）\nB✓ 根据\u0001《宪法》\u0002和\u0001《立法法》\u0002,税收基本制度属于只能制定法律的事项,依法纳税是公民的基本 \" 为狭义法律,即全 \"法律义务\nC✓ 纳税义务的法定性,同时也是对国家征税权的限制\nD✓ 条文中的 \" 强调公民 \"依照法律国人大及其常委会制定的法律\n因此选ABCD。","k":"","kb":35,"kh":[[0,23],[196,309]]},{"id":"2014-28","y":2014,"t":"单","s":"下列选项中,属于公民政治权利的是（ ）。","o":["平等权","人格尊严","言论自由","受教育权"],"a":"C","e":"\u0001根据《宪法》规定,公民的基本权利包括:平等权,政治权利,宗教信仰自由,人身自由,财产权、社会文化权利,监督权。\u0002\nA✗ 根据\u0001《宪法》\u0002规定,公民的基本权利包括:平等权,政治权利,宗教信仰自由,人身自由,财产权、社会文化权利,监督权\nB✗ 与题干设问或现行制度要件不符，故不选\nC✓ 政治权利包括:选举权和被选举权,言论自由,出版自由,集会、游行、示威自由,结社自由\nD✗ 与题干设问或现行制度要件不符，故不选\n所以C属于政治权利,正确; B属于人身自由的权利; D属于社会文化权利。 因此选\u0001“言论自由”\u0002。 (公民的基本权利是历年考试的重点,所占分值很大,尤其是平等权和人身自由,经常出现在分析题中,望考生加以重视。","k":"","kb":35,"kh":[[0,23],[93,162]]},{"id":"2014-53","y":2014,"t":"多","s":"下列行为中,侵犯了我国宪法规定的公民通信自由和通信秘密的有（ ）。","o":["某县第一中学为了提高学生升学率,禁止学生携带手机进入校园","某县法院在审理一起民事案件过程中,为查明案件事实,对当事人信件进行拆检","某县检察院在侦查一起贪污案件过程中,依法对犯罪嫌疑人王某的电话进行录音","某县公安局因刘某在网络上批评该县征地过程中存在的违法行为,进入刘某的电子邮箱进行查看"],"a":"AB","e":"\u0001O 通信自由是指公民有根据自己的意愿自由进行通信不受他人干涉的自由。\u0002\nA✓ 不让学生带手机侵犯其通信自由的权利,侵犯了公民的通信自由和通信秘密\nB✓ 通信秘密是指公民通信的内容受国家法律保护,任何人不得非法私拆、毁弃、偷阅他人的信件\nC✗ 是基于刑事案件的需要\nD✗ 与题干设问或现行制度要件不符，故不选\n公民的通信包括书信、电话、电报等进行通信的各种手段。 根据法律规定,扣押和拆检公民的信件必须满足以下条件:(1)只有公安机关和检察机关才有权决定扣押或拆检公民的信件(法院除外)。 (2)原因只有两种:一是国家安全的需要,二是追查刑事犯罪的需要。 BD项既不是追查刑事犯罪的需要也不是追查国家安全的需要。 因此选ABD项。","k":"","kb":35,"kh":[[196,309]]},{"id":"2015-29","y":2015,"t":"单","s":"2014年春节期间,县人大代表刘某因酒后交通肇事逃逸,涉嫌犯罪,县公安局拟对其实施逮捕。对此,下列做法中正确的是（ ）。","o":["公安局可自行决定并实施逮捕","公安局经县人民法院决定后可实施逮捕","公安局经县人民检察院批准后可实施逮捕","非经县人大常委会许可,公安局不得实施逮捕"],"a":"D","e":"\u0001代表法规定:\"县级以上的地方各级人民代表大会代表,非经本级人民代表大会主席团许可, 在大会闭会期间,非经本级人民代表大会常务委员会许可,不受逮捕或者刑事审判。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ 春节期间,说明是人大闭会期间,酒后逃逸,说明不是现行犯,故根据法律规定,非经县级人民代表大会常务委员会许可,不受逮捕或者刑事审判\n如果因为是现行犯被拘留,执行拘留的公安机关应当立即向该级人 \" 本题中, 民代表大会主席团或者常务委员会报告。","k":"","kb":35,"kh":[[24,76]]},{"id":"2015-55","y":2015,"t":"多","s":"根据我国《宪法》关于公民私有财产的规定, 下列表述正确的有（ ）。","o":["公民的合法的私有财产不受侵犯","国家机关不得没收任何公民的私有财产","公民的私有财产受法律保护,并可依法继承","国家为了公共利益的需要,可依法对公民的私有财产实行征收或征用并给予补偿"],"a":"ACD","e":"\u0001我国宪法关于财产权内容的规定主要有:(I)国家保护公民的合法收入、储蓄、房屋和其他合法财产的所有权。\u0002\nA✓ (3)公民的合法私有财产不受侵犯\nB✗ AC国家保护公民的合法私有财产,而不是任何公民的私有财产\nC✓ (2)国家依照法律规定保护公民的私有财产的继承权\nD✓ (5)国家为了公共利益的需要,可以依照法律规定对公民的私有财产实行征收或者征用并给予补偿\n(4)国家依照法律规定保护公民的私有财产权和继承权。","k":"","kb":34,"kh":[[0,22],[23,82]]},{"id":"2015-57","y":2015,"t":"多","s":"根据我国宪法和法律,下列职务中只能由实行区域自治的民族的公民担任的有（ ）。","o":["自治区主席","自治州人大常委会主任","自治州人民检察院检察长","自治县县长"],"a":"AD","e":"\u0001根据宪法和法律规定:(I)民族自治地方的人大都是由实行区域自治的民族以及居住在本区域内的其他民族的公民按人口比例产生代表组成, 人口特别少的其他民族,至少应有1名代表。\u0002\nA✓ 符合题意及现行制度规定（\u0001自治区主席\u0002）\nB✗ 考生注意,自治地方的人大常委会主任或者副主任其中之一由实行区域自治的民族的公民担任即可,所以自治州人大常委会主任不是只能由实行区域自治的民族的公民担任\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ 符合题意及现行制度规定（\u0001自治县县长\u0002）\n(2)民族自治地方人大常委会应当由实行区域自治的民族的公民担任主任或者副主任; (3)自治区主席、自治州州长、自治县县长由实行区域自治的民族的公民担任; (4)民族自治地方政府的其他组成人员和自治机关所属工作部门的干部中,应当合理配备实行区域自治的民族和其他少数民族的人员。","k":"","kb":34,"kh":[[0,22],[23,82]]},{"id":"2016-24","y":2016,"t":"单","s":"下列关于言论自由的表述,不正确的是（ ）。","o":["言论自由是公民政治权利的重要内容","保障言论自由为各国宪法所普遍承认","规制言论自由的方式主要有预防制和追惩制","行使言论自由时侵害他人名誉权的,构成违宪"],"a":"D","e":"\u0001言论自由是指公民通过口头等形式表达其意见和观点的自由。\u0002\nA✗ 它是公民政治权利最重要的内容之一\nB✗ 言论自由为世界各国宪法和国际人权公约所普遍承认\nC✗ 宪法学将各国不同的法律限制方式分为预防制和追惩制两种\nD✓ 公民在行使言论自由时不得侵害他人的隐私权和名誉权,否则可能构成民事侵权,不是构成违宪\n但言论自由的行使也会受到一定程度的限制。 对于言论自由的限制方式,许多国家都制定了专门的法律加以调整。","k":"","kb":34,"kh":[[0,22],[23,82]]},{"id":"2016-52","y":2016,"t":"多","s":"下列关于公民这一概念的表述,正确的有（ ）。","o":["公民概念通常在个体意义上使用","公民是享有基本权利的唯一主体","公民与人民具有相同的内涵外延","凡具有中国国籍的人都是中国公民"],"a":"AD","e":"\u0001公民,是指具有某个国家国籍的自然 \" 凡具有中华人民共和国国籍人。\u0002\nA✓ 公民通常表达的是个体的概念,人民所表达的是群体的概念\nB✗ 公民不是享有基本权利的唯一主体,国家机关也是享有基本权利的主体\nC✗ 公民的人都是中华人民共和国公民与人民是两个不同的概念,内涵和外延都不相同\nD✓ 我国\u0001《宪法》\u0002规定: \" 或 \"","k":"","kb":34,"kh":[[0,22],[23,82]]},{"id":"2016-55","y":2016,"t":"多","s":"下列关于平等权的表述,正确的有（ ）。","o":["平等权是我国公民的基本权利","国家对公民的平等权负有保障义务","平等权意味着公民平等地享有权利、履行义务","平等权反对特权和歧视,也不允许存在任何差别对待"],"a":"ABC","e":"\u0001平等权是公民的基本权利,是国家的基本义务。\u0002\nA✓ 平等权是公民的基本权利,是国家的基本义务\nB✓ 国家不得剥夺公民的平等权,也不得允许其他组织和个人侵害公民的平等权\nC✓ 平等权意味着公民平等地享有权利和履行义务\nD✗ 平等权允许合理差别的存在,比如由于年龄、生理差异、民族差异等所采取的合理差别\n公民有权利要求国家给予平等保护,国家有义务无差别的保护每一个公民的平等地位。","k":"","kb":34,"kh":[[0,22],[23,82]]},{"id":"2017-19","y":2017,"t":"单","s":"下列选项中,不属于宪法所调整的社会关系的是（ ）。","o":["国家与公民之间的关系","公民与公民之间的关系","国家机关之间的关系","国家机关内部之间的关系"],"a":"B","e":"\u0001宪法规范所调整的社会关系涉及的领域非常广泛,几乎包括国家和社会生活的各个方面, 宪法关系的一方通常是国家或国家机关。\u0002\nA✗ 宪法所调整的社会关系主要包括:国家与公民之间的关系、国家与其他社会主体之间的关系、国家机关之间的关系国家机关内部的关系\nB✓ 公民与公民之间的关系由民法调整, 不由宪法调整,相关表述不属于宪法所调整的社会关系\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选\nACD项属于宪法所调整的社会关系。 \u0001“公民与公民之间的关系”\u0002公民与公民之间的关系由民法调整, 不由宪法调整,“公民与公民之间的关系”不属于宪法所调整的社会关系,","k":"","kb":34,"kh":[[0,22],[23,82]]},{"id":"2017-20","y":2017,"t":"单","s":"我国现行《宪法》规定,公民在法律面前一律平等。下列关于“平等”的理解,正确的是（ ）。","o":["平等本质上是权利与义务的对等","形式上的平等与实质上的平等是一回事","平等指立法上的平等而非法律适用上的平等","平等既是一项宪法原则,又是公民的一项基本权利"],"a":"D","e":"\u0001在我国,平等权是公民的基本权利,是国家的基本义务,平等也是一项宪法原则。\u0002\nA✗ 平等权意味着公民平等地享有权利履行义务,但不意味着权利与义务的对等\nB✗ 实质平等主要体现在合理差别上,由于年龄、生理、民族的差异,给予差别对待\nC✗ 法律内容平等说认为平等权不限千人们在法律适用上的平等,还应包含人们在法律内容上也享有平等的权利\nD✓ 在我国,平等权是公民的基本权利,是国家的基本义务,平等也是一项宪法原则\n形式上的平等与实质上的平等不是一回事,我们所说的形式上的平等,是对于所有的公民应当采取无差别的对待,尤其是不得把种族、性别、家庭出身、宗教信仰作为法律上的不同对待的理由。 有关平等权的效力范围,存在两种观点:\"法 \" 和 \" 法律内容平等说 \" 。 法律适用平律适用平等说等说认为平等权仅限定千法律适用上的平等,而不包含法律内容上的平等。 因为平等是否包含立法上的平等,目前还未有定论,但是必然包含法律适用上的平等。","k":"","kb":34,"kh":[[0,22],[82,126]]},{"id":"2017-21","y":2017,"t":"单","s":"下列选项中,属于我国现行《宪法》规定的公民政治权利的是（ ）。","o":["结社自由","通信自由","劳动者休息的权利","受教育权"],"a":"A","e":"\u0001根据我国现行宪法的规定,公民的政治权利包括选举权和被选举权、言论自由、出版自由、集会游行示威自由、结社自由等。\u0002\nA✓ 根据我国现行宪法的规定,公民的政治权利包括选举权和被选举权、言论自由、出版自由、集会游行示威自由、结社自由等\nB✗ 通信自由是人身自由的一部分,不是政治权利\nC✗ 劳动者休息的权利和文化教育权是社会文化权利,不是政治权利,该项\nD✗ 与题干设问或现行制度要件不符，故不选\n公民的政治权利是公民参与政治生活的一切权利与自由的总称。","k":"","kb":35,"kh":[[0,23],[196,309]]},{"id":"2017-54","y":2017,"t":"多","s":"关于公民基本权利的限制,下列表述正确的有（ ）。","o":["限制基本权利必须以宪法和法律为依据","限制基本权利时需要严格遵守比例原则","限制基本权利的主要目的是维护公共利益","对基本权利的限制必须内容明确,使其可以成为公民行动的合理预期"],"a":"ABCD","e":"\u0001对公民基本权利的限制,必须满足明确性原则,法律对公民基本权利所作的限制,必须内容明确,可以成为公民行动的合理预期。\u0002\nA✓ 除了立法机关通过宪法和法律的形式以外,其他机关无权限制公民基本权利的行使\nB✓ 符合题意及现行制度规定（\u0001限制基本权利时需要严格遵守比例原则\u0002）\nC✓ 比例原则要求为公共利益而限制公民基本权利的时候,必须要在手段和目的之间进行利益衡量\nD✓ 对公民基本权利的限制,必须满足明确性原则,法律对公民基本权利所作的限制,必须内容明确,可以成为公民行动的合理预期\n宪法对公民基本权利限制的形式有宪法限制和法律限制。 对公民基本权利的限制,还必须满足比例原则。 限制基本权利的目的必须具有宪法正当性。 宪法对公民基本权利进行限制所采取的手段必须适合目的之达成,立法所采取的是对基本权利影响、限制最小的手段,而且要求手段达成的公共目的与造成的损害之间具有适当的比例关系。","k":"","kb":34,"kh":[[0,22],[23,82]]},{"id":"2017-56","y":2017,"t":"多","s":"根据我国《宪法》和《国籍法》,下列关于国籍的表述,正确的有（ ）。","o":["张某出生在中国,其母亲是中国人,父亲是法国人,张某具有中国国籍","中国公民李某公派德国学习期间生下赵某,赵某具有中国国籍","杨某为国家工作人员,其可以加入外国国籍","秦某加入了加拿大国籍,其可以保留中国国籍"],"a":"AB","e":"\u0001根据《国籍法》的规定,父母双方或一方为中国公民,本人出生在中国,具有中国国籍。\u0002\nA✓ 根据\u0001《国籍法》\u0002的规定,父母双方或一方为中国公民,本人出生在中国,具有中国国籍\nB✓ 但父母双方或一方为中国公民并定居在外国,本人出生时即具有外国国籍的,不具有中国国籍\nC✗ 国家工作人员和现役军人,不得退出中国国籍\nD✗ 定居外国的中国公民,自愿加入或取得外国国籍的,即自动丧失中国国籍\n父母双方或一方为中国公民,本人出生在外国,具有中国国籍; 中华人民共和国不承认中国公民具有双重国籍。","k":"","kb":34,"kh":[[0,22],[23,82]]},{"id":"2018-16","y":2018,"t":"单","s":"在甲、乙离婚案件的审理过程中,甲以怀疑乙有婚外情为由。请求法院向移动通信公司调取乙的通话记录清单作为证据。根据现行宪法,下列说法正确的是（ ）。","o":["甲只能雇佣私人侦探调取乙的通话记录清单","法院为查清事实,有权要求移动通信公司提供用户的通话记录清单","移动通信公司为保护用户,有权拒绝任何机构对通信进行调查","通话记录清单属于公民通信秘密的范围,移动通信公司有保护通信秘密的义务"],"a":"D","e":"\u0001公民的基本权利,即公民的通信自由与通信秘密受法律保护。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ 私人侦探、相关表述法院均无权调取乙的通话记录\n扣押和拆检公民的信件必须满足两个基本条件:主体只有两个,公安机关和检察机关; 前提必须是为了国家安全的需要或者是追查刑事案件的需要。","k":"","kb":35,"kh":[[196,309]]},{"id":"2018-17","y":2018,"t":"单","s":"为治理交通拥堵,某市制定地方性法规《道路交通管理条例》,规定行人闯红灯罚款20元,累计10次处以行政拘留,下列有关该条例的表述,正确的是（ ）。","o":["该条例有权规定对行人闯红灯的行为处以罚款","该条例只有在获得全国人大常委会授权后才可设定行政拘留","只有该市人大有权制定该条例,该市人大常委会无权制定","法院可以根据被处罚人的审查要求撤销该条例"],"a":"A","e":"\u0001符合条件的市的人大和人大常委会都有权制定地方性法规。\u0002\nA✓ 符合题意及现行制度规定（\u0001该条例有权规定对行人闯红灯的行为处以\u0002）\nB✗ 地方性法规无权设定限制人身自由的强制措施,对公民政治权利的剥夺限制人身自由的强制措施和处罚是法律保留事项\nC✗ 符合条件的市的人大和人大常委会都有权制定地方性法规\nD✗ 法院无权撤销抽象行政行为,一般只审查具体行政行为,对地方性法规无权审查,更无权撤销","k":"","kb":35,"kh":[[0,23],[24,76]]},{"id":"2018-46","y":2018,"t":"多","s":"外来务工人员刘某在为其子办理小学人学报名手续的过程中,被要求到户籍所在地派出所开具无犯罪记录证明,刘某不同意开具该证明,学校因此拒绝其子人学,依据现行宪法,在这一事件当中,刘某之子受到侵犯的基本权利有（ ）。","o":["沉默权","平等权","财产权","受教育权"],"a":"BD","e":"\u0001“沉默权”不属于基本权利,“财产权”与题干无关,学校的行为没有侵犯刘某之子的财产权。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 符合题意及现行制度规定（\u0001平等权\u0002）\nC✗ 不属于基本权利,相关表述与题干无关,学校的行为没有侵犯刘某之子的财产权\nD✓ 学校以无犯罪记录证明拒绝刘某之子入学,侵犯了刘某之子的平等权和受教育权","k":"","kb":34,"kh":[[0,22]]},{"id":"2019-19","y":2019,"t":"单","s":"根据我国宪法和法律,下列关于公民财产权的表述,正确的是（ ）。","o":["公民行使财产权,不得损害公共利益","2004年宪法修正案规定,公民的私有财产神圣不可侵犯","公民财产权规定在宪法第二章“公民的基本权利和义务”中","国家为经济发展的需要,可依法对私有财产进行征收并赔偿"],"a":"A","e":"\u0001\" 公民的合法 2004年宪法修正案规定 \" ,相关表述\" 神圣不可侵犯 \",而不是的私有财产不受侵犯 \" 总纲 \"中,而不是 \"公民错误。\u0002\nA✓ 符合题意及现行制度规定（\u0001公民行使财产权,不得损害公共利益\u0002）\nB✗ \" 公民的合法 2004年宪法修正案规定 \" ,相关表述\" 神圣不可侵犯 \",而不是的私有财产不受侵犯 \" 总纲 \"中,而不是 \"公民\nC✗ 财产权规定在第一章 \"部分\nD✗ 国家为了公共利益基本权利义务的需要,可以依照法律规定对公民的私有财产实行征 \"赔偿\"\n本收或者征用并给予补偿,不是题选A。","k":"","kb":34,"kh":[[0,22],[23,82]]},{"id":"2019-47","y":2019,"t":"多","s":"根据我国宪法,公民人身自由的内容包括 。","o":["住宅不受侵犯","人身自由不受侵犯","人格尊严不受侵犯","通信自由和通信秘密受法律保护"],"a":"ABCD","e":"\u0001我国宪法规定的人身自由包括:公民的人身自由不受侵犯,公民的人格尊严不受侵犯,公民的住宅不受侵犯和公民通信自由与秘密受法律保护。\u0002\nA✓ 符合题意及现行制度规定（\u0001住宅不受侵犯\u0002）\nB✓ 符合题意及现行制度规定（\u0001人身自由不受侵犯\u0002）\nC✓ 符合题意及现行制度规定（\u0001人格尊严不受侵犯\u0002）\nD✓ 符合题意及现行制度规定（\u0001通信自由和通信秘密受法律保护\u0002）\n因此,本题ABC","k":"","kb":35,"kh":[[93,162],[196,309]]},{"id":"2020-17","y":2020,"t":"单","s":"根据现行宪法,下列关于平等保护原则的表述,正确的是（ ）。","o":["国家机关拒绝录用“乙肝”表面抗原携带者, 不构成歧视","政府优先采购残疾人福利企业的产品,违反了平等保护原则","为保护妇女的就业权,在任何工种或岗位上都不得设置性别限制","国家对少数民族给予某些适当的照顾不违反平等保护原则"],"a":"D","e":"\u0001在宪法中,我们所说的平等保护,从原则上来讲,对于所有的公民应当采取无差别的待遇, 除非存在进行差别对待的合理理由。\u0002\nA✗ 尤其是不得把种族性别、家庭出身、宗教信仰作为法律上的不同对 \" 乙肝 \"表面抗原携带者构成歧待的理由\nB✗ 合理差别, 没有违反合理保护原则\nC✗ 选项过于绝对,男女在生理等方面存在差异,应允许合理差别\nD✓ 判断政府的措施是合理差别还是违反平等保护的歧视性做法的标准如下:首先,政府进行差别对待的目的必须是为了实现正当的而且是重大的利益\n但是平等不等于平均、相同,平等保护和合理差别共存。 其次,这种差别对待必须是实现其所宣称的正当目标的合理的乃至是必不可少的手段; 最后,政府负有举证责任。 相关表述过于绝对,男女在生理等方面存在差异,应允许合理差别","k":"","kb":34,"kh":[[0,22],[247,290]]},{"id":"2020-45","y":2020,"t":"多","s":"某县第一中学为防止校园欺凌事件的发生, 作出专门规定。下列规定中,符合宪法和法律的有（ ）。","o":["学校禁止学生宣扬校园暴力","学校禁止学生携带管制刀具进入校园","学校可定期检查学生手机储存的信息","学校可将实施欺凌的学生的姓名、照片公布于本地报刊"],"a":"AB","e":"\u0001公民的人格尊严不受侵犯,根据《宪法》第38条的规定,公民的人格尊严不受侵犯,禁止采用任何方法对公民进行侮辱、诽谤和诬告陷害。\u0002\nA✓ 符合题意及现行制度规定（\u0001学校禁止学生宣扬校园暴力\u0002）\nB✓ 符合题意及现行制度规定（\u0001学校禁止学生携带管制刀具进入校园\u0002）\nC✗ 学校无权检查学生手机\nD✗ 学校将实施欺凌的学生的姓名、照片公布于本地报刊的行为涉嫌侵犯了学生的人格尊严和肖像权等\n公民的人格权包括姓名权、肖像权、名誉权和隐私权等。 根据\u0001《宪法》第40条\u0002的规定,除因国家安全或者追查刑事犯罪的需要,由公安机关或者检察机关依照法律规定的程序对通信进行检查外,任何组织或者个人不得以任何理由侵犯公民的通信自由和通信秘密。","k":"","kb":35,"kh":[[93,162],[196,309]]},{"id":"2021-17","y":2021,"t":"单","s":"关于设区的市的人民政府制定的地方政府规章,下列表述正确的是（ ）。","o":["没有上位法依据,地方政府规章不得设定减损公民权利或增加其义务的规范","制定地方性法规条件不成熟的,可先制定地方政府规章,实施至法规制定为止","地方政府规章由市长决定并予以公布","为加强历史文化保护,地方政府规章可作出对本地文化产业实行免税的规定"],"a":"A","e":"\u0001\"省、自治区、《立法法》第82条规定: 直辖市和设区的市、自治州的人民政府,可以根据法律、行政法规和本省、自治区、直辖市的地方性法规, 制定规章。\u0002\nA✓ 没有法律、行政法规、地方性法规的依据,地方政府规章不得设定减损公民、法人和其他组织权利或者增加其义务的规范\nB✗ 应当制定地方性法规但条件尚不成熟的,因行政管理迫切需要,可以先制定地方政府规章\nC✗ 地方政府规章由省长、自治区主席、市长或者自治州州长签署命令予以公布\nD✗ 与题干设问或现行制度要件不符，故不选\n地方政府规章可以就下列事项作出规定: (一)为执行法律、行政法规、地方性法规的规定需要制定规章的事项; (二)属于本行政区域的具体行政管理事项。 设区的市、自治州的人民政府根据本条第一款第二款制定地方政府规章,限于城乡建设与管理、环境保护、历史文化保护等方面的事项。 已经制定的地方政府规章,涉及上述事项范围以外的,继续有效。 除省、自治区的人民政府所在地的市,经济特区所在地的市和国务院已经批准的较大的市以外,其他设区的市、自治州的人民政府开始制定规章的时间,与本省、自治区人民代表大会常务委员会确定的本市、自治州开始制定地方性法规的时间同步。 规章实施满两年需要继续实施规章所规定的行政措施的,应当提请本级人民代表大会或者其常务委员会制定地方性法规。 第84条规定:\"部门规章应当经部务会议或者委员会会议决定。 地方政府规章应当经政府常务会议或者全体会议决定。 \"第85条规定:\"部门规章由部门首长签署命令予以公布。\n【修法提示】2023年《立法法》修改将原第82条顺延为第93条，并将设区的市立法权限中的“环境保护”扩展为“生态文明建设”、新增“基层治理”。","k":"","kb":34,"kh":[[0,22],[23,82]]},{"id":"2021-26","y":2021,"t":"单","s":"下列关于我国宪法上平等权的理解,不正确的是（ ）。","o":["平等权不仅反对显性歧视,而且反对隐性歧视","平等权意味着平等保护,不得设置任何差别对待","平等权是公民的一项基本权利","男女平等、民族平等都是平等权的具体体现"],"a":"B","e":"\u0001根据我国《宪法》的规定,我国公民平等权具有下列含义:首先,平等权的主体是全体公民, 它意味着全体公民法律地位的平等。\u0002\nA✗ 既反对显性歧视,也反对隐性歧视\nB✓ 平等权意味着平等保护,但可以设置合理差别\nC✗ 国家不得剥夺公民的平等权,也不能允许其他组织和个人侵害公民的平等权\nD✗ 最后,平等权是贯穿于公民其他权利的一项权利,它通过其他权利如男女平等、民族平等、受教育权平等而具体化\n其次,平等权是公民的基本权利,是国家的基本义务。 公民有权利要求国家给予平等保护,国家有义务无差别地保护每一个公民的平等地位。 再次,平等权意味着公民平等地享有权利履行义务。 平等不能和特权并存,平等也不允许歧视现象存在。","k":"","kb":34,"kh":[[0,22],[82,126]]},{"id":"2022-15","y":2022,"t":"单","s":"公民文某拒绝服兵役,当地政府对其进行处罚。根据我国宪法和法律,下列关于公民服兵役的表述,正确的是（ ）。","o":["服兵役是公民的基本权利和义务","依法被剥夺政治权利的公民不得服兵役","凡年满16周岁的公民,都有服兵役的义务","公民如拒绝履行服兵役的义务,就无权享有政治权利"],"a":"B","e":"\u0001我国现行《兵役法》规定我国实行以志愿兵役为主体的志愿兵役与义务兵役相结合的兵役制度。\u0002\nA✗ 服兵役是公民的义务而非基本权利\nB✓ 依法被剥夺政治权利的人没有服兵役的资格\nC✗ 我国公民不分民族、种族、职业、家庭出身、宗教信仰和教育程度,凡年满18周岁的,都有义务依法服兵役\nD✗ 公民如拒绝履行服兵役的义务,将会受到一定的处罚,并不必然被剥夺政治权利","k":"","kb":34,"kh":[[0,22],[247,290]]},{"id":"2022-17","y":2022,"t":"单","s":"根据我国宪法,下列关于公民人身自由的表述,正确的是（ ）。","o":["企业为管理需要可以翻包检查员工携带的物品","公安机关为收集犯罪证据可以依法对犯罪嫌疑人进行搜查","法院对严重违反法庭秩序的人员可以执行逮捕","行政法规可以设定限制人身自由的强制措施"],"a":"B","e":"\u0001人身自由包括:公民的人身自由不受侵犯,公民的人格尊严不受侵犯,公民的住宅不受侵犯和公民通信自由与秘密受法律保护。\u0002\nA✗ 员工携带的物品属于私人物品,企业无权翻包检查\nB✓ 宪法禁止对公民的人身进行非法搜查,但公安机关为收集犯罪证据可以依法对犯罪嫌疑人进行搜查,是合法的\nC✗ 法院对严重违反法庭秩序的人员可以决定逮捕,具体执行应当交由公安机关执行\nD✗ 行政法规不可以设定限制人身自由的强制措施\n公民的人身自由是公民一切权利和自由的基础。 现行宪法明确规定,任何公民,非经人民检察院批准或者决定或者人民法院决定,并由公安机关执行,不受逮捕。 禁止非法拘禁和以其他方法剥夺或者限制公民的人身自由,禁止非法搜查公民的身体。 根据\u0001《立法法》\u0002的规定,对公民政治权利的剥夺、限制人身自由的强制措施和处罚只能由法律设定。","k":"","kb":35,"kh":[[0,23],[24,76]]},{"id":"2022-23","y":2022,"t":"单","s":"下列关于我国宪法上男女平等的表述,不正确的是（ ）。","o":["实行男女同工同酬","国家培养和选拔妇女干部","国家保护妇女的权利和利益是对妇女的优待","妇女在政治、经济、文化、社会和家庭生活等方面享有同男子平等的权利"],"a":"C","e":"\u0001我国《宪法》第48条规定:\"中华人民共和国妇女在政治的、经济的、文化的、社会的和家庭的生活等各方面享有同男子平等的权利。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✓ 国家保护妇女的权利和利益是基于平等权这一公民的基本权利,而非对妇女的优待\nD✗ 我国\u0001《宪法》第48条\u0002规定:\"中华人民共和国妇女在政治的、经济的、文化的、社会的和家庭的生活等各方面享有同男子平等的权利\n国家保护妇女的权利和利益,实行男女同工同酬,培养和选拔妇女干部。 本题为选非题,故选择C。","k":"","kb":34,"kh":[[0,22],[23,82]]},{"id":"2023-16","y":2023,"t":"单","s":"根据现行宪法,下列情形中属于公民行使监督权的是（ ）。","o":["甲参加学术会议并作主题发言","乙参与社区普法宣传教育活动","丙发现网购的家用电器不合格,给商家差评","丁写信给某国家机关,对其工作人员的失职行为提出批评"],"a":"D","e":"\u0001公民依法对国家机关及国家工作人员的失职行为提出批评建议，属于行使监督权。\u0002\nA✗ 参加学术会议发言属于行使《宪法》第47条规定的\u0001科学研究等文化权利\u0002，而非监督权\nB✗ 参与社区普法宣传属于履行法治参与及公民社会责任，不涉及监督国家机关\nC✗ 给网购商家差评属于民事消费者评价维权，监督权的对象仅限于\u0001国家机关和国家工作人员\u0002\nD✓ 《宪法》第41条规定公民对国家机关及其工作人员有\u0001批评、建议、申诉、控告和检举\u0002的监督权\n特别注意：宪法第41条监督权的对象仅限于\u0001国家机关和国家工作人员\u0002，向企业或个人维权不属于宪法监督权。","k":"","kb":36,"kh":[[24,63],[63,83]]},{"id":"2023-45","y":2023,"t":"多","s":"近年来,我国修订了《未成年人保护法》和《预防未成年人犯罪法》,制定了《家庭教育促进法》。根据我国宪法和法律,下列关于保护未成年人的表述,正确的有（ ）。","o":["未成年人的权利受宪法保护","父母有抚养教育未成年子女的义务","保护未成年人是国家、社会、学校和家庭的共同责任","处理涉及未成年人事项,应尊重未成年人人格尊严,保护其个人信息"],"a":"ABCD","e":"\u0001未成年人权益保护涉及宪法基础保障、父母法定抚养义务、多方协同责任及人格隐私保护。\u0002\nA✓ 《宪法》第49条明确规定\u0001儿童受国家的保护\u0002，禁止虐待儿童，故未成年人的权利受宪法保护\nB✓ 《宪法》第49条规定\u0001父母有抚养教育未成年子女的义务\u0002，《家庭教育促进法》进一步细化了家庭教育职责\nC✓ 修订后的《未成年人保护法》确立\u0001国家、社会、学校和家庭\u0002共同保障及最有利于未成年人原则\nD✓ 保护未成年人必须尊重其\u0001人格尊严与隐私，依法严格保护未成年人个人信息\u0002\n宪法第49条连记三款：\u0001儿童受国家保护\u0002；\u0001父母抚养教育未成年子女\u0002；\u0001成年子女赡养扶助父母\u0002。","k":"","kb":35,"kh":[[0,23],[93,162]]},{"id":"2023-47","y":2023,"t":"多","s":"下列对于我国宪法上的“公民的住宅不受侵犯”的理解,正确的有（ ）。","o":["该规定保护了公民隐私","该规定是公民人身自由的重要内容","该规定保障了居住安全和生活安宁","该规定要求禁止非法搜查或者非法侵入公民的住宅"],"a":"ABCD","e":"\u0001宪法“公民的住宅不受侵犯”属于广义人身自由重要内容，保障隐私、居住安全与生活安宁。\u0002\nA✓ 住宅作为私人生活的核心空间，住宅不受侵犯直接护佑着公民的\u0001生活秘密与个人隐私\u0002\nB✓ 在我国宪法基本权利体系中，狭义人身自由、人格尊严、\u0001住宅不受侵犯与通信自由秘密\u0002共同构成广义人身自由权利\nC✓ 住宅不受侵犯旨在切实保障公民的\u0001居住安全与安宁稳定的私生活秩序\u0002\nD✓ 《宪法》第39条明文规定：中华人民共和国公民的住宅不受侵犯，\u0001禁止非法搜查或者非法侵入公民的住宅\u0002\n记忆第37–40条“广义人身自由四件套”：\u0001第37条人身自由\u0002、\u0001第38条人格尊严\u0002、\u0001第39条住宅安全\u0002、\u0001第40条通信自由秘密\u0002。","k":"","kb":35,"kh":[[93,162],[163,195]]},{"id":"2024-46","y":2024,"t":"多","s":"下列关于公民权利限制的表述,正确的是（ ）。","o":["现行宪法在列举各项公民基本权利的同时,规定了对公民基本权利的限制","基于公共利益等理由限制公民基本权利,也应受到相应的限制","限制公民基本权利,应当遵循明确性原则","限制公民基本权利,应当在手段和目的之间衡量"],"a":"ABCD","e":"\u0001公民基本权利行使并非绝对无界，而限制公民基本权利也必须受到比例原则、明确性原则等“对限制的限制”。\u0002\nA✓ 现行《宪法》在列举政治自由等权利的同时，在第51条明确规定行使权利\u0001不得损害国家的、社会的、集体的利益和其他公民的合法自由权利\u0002\nB✓ 为公共利益限制公民权利并非无节制，公权力自身的限制行为必须遵循宪法界限（即\u0001“对基本权利限制的限制”\u0002）\nC✓ 限制公民基本权利的法律条款必须要件清晰、范围确定，使公民可预见行为后果，即遵循\u0001明确性原则\u0002\nD✓ 公权力限制公民权利必须在手段与所欲达成的公共目的之间进行权衡，确保必要、适当、均衡（\u0001比例原则\u0002）\n基本权利限制的三大宪法防线：\u0001法律保留原则\u0002、\u0001明确性原则\u0002、\u0001比例原则（手段与目的均衡）\u0002。","k":"","kb":34,"kh":[[0,22],[23,82]]},{"id":"2025-21","y":2025,"t":"单","s":"下列关于我国宪法上公民住宅权的表述,正确的是（ ）。","o":["公民住宅权是积极权利","公民被限制在住宅中侵犯了公民住宅权","公民住宅权要求禁止非法搜查公民的住宅","公民住宅权保护的核心法益是住宅的财产价值"],"a":"C","e":"\u0001住宅权保护的核心法益是居住安全和生活安宁。\u0002\nA✗ 社会文化权利是积极权利,公民住宅权是消极权利\nB✗ 公民被限制在住宅中,侵犯了公民的人身自由,而不是公民住宅权\nC✓ 公民的住宅不受侵犯又称住宅权,指公民居住、生活以及保存私人财产的场所不受非法侵入和搜查\nD✗ 住宅权保护的核心法益是居住安全和生活安宁","k":"","kb":35,"kh":[[0,23],[24,76]]},{"id":"2025-24","y":2025,"t":"单","s":"下列规范中,规定于现行宪法“总纲”一章的是（ ）。","o":["国家尊重和保障人权","公民的合法的私有财产不受侵犯","国家对就业前的公民进行必要的劳动就业训练","保卫祖国、抵抗侵略是中华人民共和国每一个公民的神圣职责"],"a":"B","e":"\u0001\"国家尊重和保障人权\"\"国家对就业前的公民进行必要的劳动就业训练\"\"保卫祖国、抵抗侵略是中华人民共和国每一个公民的神圣职责\"规定在\"公民的基本权利和义务\" 一章。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ \"公民的合法的私有财产不受侵犯\"规定在\"总纲\"一章\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ \"国家尊重和保障人权\"\"国家对就业前的公民进行必要的劳动就业训练\"\"保卫祖国、抵抗侵略是中华人民共和国每一个公民的神圣职责\"规定在\"公民的基本权利和义务\" 一章","k":"","kb":34,"kh":[[23,82],[126,144]]},{"id":"2026-21","y":2026,"t":"单","s":"某市人民政府制定的规范性文件规定,因犯罪受过刑事处罚的人员不得享受最低生活保障待遇。根据我国宪法,该规定主要侵犯的公民基本权利是（ ）。","o":["财产权","人身自由","社会保障权","人格尊严"],"a":"C","e":"\u0001最低生活保障属于社会保障权,剥夺刑满人员低保,侵犯社会保障平等享有权利。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✓ 最低生活保障属于社会保障权,剥夺刑满人员低保,侵犯社会保障平等享有权利\nD✗ 与题干设问或现行制度要件不符，故不选","k":"","kb":35,"kh":[[0,23],[24,76]]},{"id":"2026-46","y":2026,"t":"多","s":"各级政府有序推进入工智能大模型在政府服务领域的应用,政府履职数字化、智能化水平不断提升。下列选项中,正确的有（ ）。","o":["人工智能技术应用,有助于政府建设智能高效政府","人工智能技术发展丰富了政府和公众的互动方式","人工智能技术发展彻底改变了宪法上的国家公民关系","应用人工智能技术赋能数字政府建设,应当符合法治价值追求"],"a":"ABD","e":"\u0001C\"彻底改变\"绝对错误。\u0002\nA✓ 符合题意及现行制度规定（\u0001人工智能技术应用,有助于政府建设智能\u0002）\nB✓ 符合题意及现行制度规定（\u0001人工智能技术发展丰富了政府和公众的互\u0002）\nC✗ C\"彻底改变\"绝对\nD✓ AI 丰富政务渠道、提升效率,数字政府必须坚守法治底线","k":"","kb":34,"kh":[[0,22],[23,82]]},{"id":"2026-47","y":2026,"t":"多","s":"关于公民通信自由和通信秘密,下列说法正确的有（ ）。","o":["宪法对公民通信自由和通信秘密给予严格保护","通过微信转发他人敏感信息是行使通信自由的形式之一","公安机关因国家安全需要,可以依法对公民通信进行检查","通信自由和通信秘密,涉及公民私生活、思想活动、社会交往等切身利益"],"a":"ACD","e":"\u0001擅自转  ）。","o":["中央军事委员会","省级人民代表大会常务委员会","全国人民代表大会各专门委员会","30名以上全国人民代表大会代表联名"],"a":"AC","e":"\u0001在全国人大常委会期间,全国人大各专门委员会、国务院、中央军委、最高人民法院、最高人民检察院以及常委会组成人员10 名以上联名,可以向常委会提出常委职权范围内的议案。\u0002\nA✓ 符合题意及现行制度规定（\u0001中央军事委员会\u0002）\nB✗ 与题干设问或现行制度要件不符，故不选\nC✓ 在全国人大常委会期间,全国人大各专门委员会、国务院、中央军委、最高人民法院、最高人民检察院以及常委会组成人员10 名以上联名,可以向常委会提出常委职权范围内的议案\nD✗ 在全国人大会议期间,全国人民代表大会主席团、全国人大常委会、全国人大各专门委员会、国务院、中央军委、最高人民法院、最高人民检察院以及一个代表团或者30名以上的全国人大代表联名, 可以向全国人…\n在全国人大会议期间,全国人民代表大会主席团、全国人大常委会、全国人大各专门委员会、国务院、中央军委、最高人民法院、最高人民检察院以及一个代表团或者30名以上的全国人大代表联名, 可以向全国人大提出属于全国人大职权范围内的议案。 为方便考生应考,现特别将一些与全国人大及其常委会相关的、涉及提案主体、批准人数的考点整理如下:(l) 延迟选举之情形:若遇到不能进行选举的非常情况,由全国人大常委会以全体委员的2/3 以上多数通过,可以推迟选举,延长本届人大的任期; (2) 罢免案:由全国人大选举、决定的国家领导人,根据全国人大主席团或者三个以上代表团或者1/10 以仁的代表提出的罢免案,全国人大有权依照法律程序,在主席团提请大会审议并经全体代表过半数的同意后,予以罢免; (3) 全国人大临时会议:若全国人大常委会认为必要或者1/5 以上的全国人大代表提议, 可以召集全国人大临时会议; (4) 修改宪法:宪法的修改由全国人大常委会或者1/5 以上的全国人大代表提议,并由全国人大以全体代表的2/3 以上多数通过; (5)质询案:在全国人大开会期间,一个代表团或者30名以上代表联名,可以书面提出对国务院和国务院领导的各部委的质询案。 在常委会会议期间,常委会组成人员10 人以上联名,可以向常委会书面提出对国务院和国务院领导的各部委和最高人民法院和最高人民检察院的质询案。","k":"","kb":37,"kh":[[199,378],[379,441]]},{"id":"2012-57","y":2012,"t":"多","s":"根据现行《宪法》的规定,下列国家领导人中连续任职不得超过两届的有（ ）。","o":["国家主席","国务院总理","中央军事委员会主席","全国人民代表大会常务委员会委员长"],"a":"BD","e":"\u0001考生还应注意的就是绝大部分地方领导没有任期限制,只有特别行政区行政长官任期 5年,可连任一次。\u0002\nA✗ 国家主席在2018年宪法修改之前,也是连任不超过两届,但是最新的宪法修正案取消了对国家主席连任的限制,为此,本题最新\nB✓ 符合题意及现行制度规定（\u0001国务院总理\u0002）\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ 绝大部分国家领导人每届任期5年,连任不能超过两届,包括全国人大常委会委员长、副委员长、国务院总理、副总理、国务委员、国家监察委员会主任、最高人民法院院长、最高人民检察院检察长, 但中央军委主…\n【修宪动态】2018年《宪法修正案》取消了国家主席、副主席连续任职不得超过两届的限制（2012年原题曾将国家主席列入连任限两届，现行宪法下仅国务院总理与全国人大常委会委员长受连任两届限制）。","k":"","kb":37,"kh":[[0,30],[199,378]]},{"id":"2012-59","y":2012,"t":"多","s":"下列关于国家机关之间关系的表述,正确的有（ ）。","o":["在全国人民代表大会闭会期间,各专门委员会受全国人大常委会领导","国务院领导地方各级人民政府的工作","上级人民法院领导下级人民法院的工作","最高人民检察院指导下级人民检察院的工作"],"a":"AB","e":"\u0001全国人大的专门委员会是按专业分工设立的辅助性工作机构。\u0002\nA✓ 专门委员会是常设性机构, 在全国人大会议期间向全国人民代表大会负责,在全国人大闭会期间向全国人大常委会负责\nB✓ 最高人民法院监督地方各级人民法院和专门法院的审判工作\nC✗ 上级人民法院监督下级人民法院的审判工作\nD✗ 最高人民检察院领导地方各级人民检察院和专门人民检察院的工作,上级人民检察院领导下 地方性法规和决议; (九)在全国人民代表大会闭会期间,根据国务院总理的提名,决定部长、委员会主任、审计长、秘书长的人选; (十)在全国人民代表大会闭会期间, 根据中央军事委员会主席的提名,决定中央军事委员会其他组成人员的人选; (十二)根据最高人民法院院长的提请,任免最高人民法院副院长、审判员、审判委员会委员和军事法院院长; (十四)决定驻外全权代表的任免; (十五)决定同外国缔结的条约和重要协定的批准和废除; (十六)规定军人和外交人员的衔级制度和其他专门衔级制度; (十七)规定和决定授予国家的勋章和荣誉称号; (十八)决定特赦; (十九)在全国人民代表大会闭会期间,如果遇到国家遭受武装侵犯或者必须履行国际间共同防止侵略的条约的清况,决定战争状态的宜布; (二十)决定全国总动员或者局部动员; (二十一)决定全国或者个别省、自治区、直辖市进入紧急状态; (二十二)全国人民代表大会授予的其他职权。","k":"","kb":37,"kh":[[31,95],[199,378]]},{"id":"2021-46","y":2021,"t":"多","s":"下列关于全国人大专门委员会的表述,正确的有（ ）。","o":["专门委员会委员不得担任国家行政机关、监察机关、审判机关和检察机关的职务","十三届全国人大设有宪法和法律委员会、特定问题调查委员会等专门委员会","专门委员会是全国人大的专门性工作机构","专门委员会委员由全国人大主席团在代表中提名,大会通过"],"a":"CD","e":"\u0001专门委员会委员没有任职方面的限制。\u0002\nA✗ 专门委员会委员没有任职方面的限制\nB✗ 特定问题调查委员会不是专门委员会,而是临时性委员会\nC✓ 全国人大的专门委员会是按专业分工设立的辅助性工作机构\nD✓ 在大会闭会期间,全国人民代表大会常务委员会可以任免专门委员会的副主任委员和委员,由委员长会议提名,常务委员会会议表决通过\n各专门委员会的主任委员、副主任委员和委员的人选由主席团在代表中提名,全国人民代表大会会议表决通过。","k":"","kb":37,"kh":[[379,441],[492,581]]},{"id":"2022-19","y":2022,"t":"单","s":"根据我国宪法和法律,下列关于全国人大会议主席团的表述,不正确的是（ ）。","o":["主席团主持全国人民代表大会会议","主席团常务主席可以召开代表团团长会议","主席团常务主席召集并主持主席团会议","主席团的决定,由主席团全体成员三分之二以上多数通过"],"a":"D","e":"\u0001《全国人民代表大会组织法》第12条第1、2款规定:\"主席团主持全国人民代表大会会议。\u0002\nA✗ \u0001《全国人民代表大会组织法》第12条\u0002第1、2款规定:\"主席团主持全国人民代表大会会议\nB✗ \u0001《全国人民代表大会议事规则》第13条第1款\u0002规定:\"主席团常务主席可以召开代表团团长会议,就议案和有关报告的重大问题听取各代表团的审议意见,进行讨论,并将讨论的情况和意见向主席团报告\nC✗ 主席团推选常务主席若干人,召集并主持主席团会议\nD✓ 主席团的决定,由主席团全体成员的过半数通过\n\u0001《全国人民代表大会议事规则》第9条\u0002规定:\"主席团主持全国人民代表大会会议。 本题为选非题,故选择D。","k":"","kb":37,"kh":[[379,441],[492,581]]},{"id":"2022-27","y":2022,"t":"单","s":"下列关于全国人大常委会工作机构的表述,正确的是（ ）。","o":["全国人大常委会工作机构负责审查代表的选举是否符合法律规定","工作机构的主任和副主任应从全国人大常委会组成人员中产生","在备案审查中,工作机构可以和全国人大专门委员会召开联合审查会议","全国人大常委会根据全国人大专门委员会需要分别设置对应的工作机构"],"a":"C","e":"\u0001根据《全国人民代表大会组织法》第28条的规定:\"常务委员会设立法制工作委员会、预算工作委员会和其他需要设立的工作委员会。\u0002\nA✗ 根据我国\u0001《选举法》\u0002规定,代表资格审查委员会依法对当选代表是否符合宪法、法律规定的代表的基本条件,选举是否符合法律规定的程序,以及是否存在破坏选举和其他当选无效的违法行为进行审查,提出代表当选…\nB✗ \"可见,全国人大常委会工作机构的主任和副主任由委员长提请全国人大常委会会议任免,并非从全国人大常委会组成人员中产生\nC✓ 也可以由法律委员会与有关的专门委员会、常务委员会工作机构召开联合审查会议,要求制定机关到会说明情况, 再向制定机关提出书面审查意见\nD✗ 全国人大常委会工作机构并非根据全国人大专门委员会需要而分别对应设置\n根据我国\u0001《选举法》\u0002规定,代表资格审查委员会依法对当选代表是否符合宪法、法律规定的代表的基本条件,选举是否符合法律规定的程序,以及是否存在破坏选举和其他当选无效的违法行为进行审查,提出代表当选是否有效的意见,向本级人民代表大会常务委员会或者乡、民族乡、镇的人民代表大会主席团报告。 为了保证全国人大及其常委会依法履行职权,根据相关法律规定以及实际需要,常委会设立了办事机构一办公厅和工作机构—法制工作委员会、预算工作委员会、香港特别行政区基本法委员会和澳门特别行政区基本法委员会。 工作委员会的主任、副主任和委员由委员长提请常务委员会任免。 全国人大专门委员会包括民族委员会、宪法和法律委员会、监察和司法委员会、财政经济委员会、教育科学文化卫生委员会、外事委员会、华侨委员会、环境与资源保护委员会、农业与农村委员会、社会建设委员会。 根据我国\u0001《立法法》\u0002规定,全国人民代表大会专门委员会、常务委员会工作机构在审查、研究中认为行政法规、地方性法规、自治条例和单行条例同宪法或者法律相抵触的,可以向制定机关提出书面审查意见、研究意见;","k":"","kb":37,"kh":[[199,378],[379,441]]},{"id":"2023-15","y":2023,"t":"单","s":"下列关于全国人大宪法和法律委员会的表述,正确的是（ ）。","o":["宪法和法律委员会有权解释宪法","宪法和法律委员会负责组织宪法宣誓仪式","宪法和法律委员会可以修改除全国人大制定的法律以外的其他法律","宪法和法律委员会可以组织对有关法律进行立法后评估"],"a":"D","e":"\u0001全国人大宪法和法律委员会负责统一审议法律草案，并可组织对有关法律进行立法后评估。\u0002\nA✗ 根据《宪法》第67条，\u0001宪法解释权专属于全国人大常委会\u0002，专门委员会无权解释宪法\nB✗ 宪法宣誓仪式由\u0001选举产生、决定任命或者任免机关\u0002负责组织，而非由宪法和法律委员会包办\nC✗ 修改非基本法律的职权专属于\u0001全国人大常委会\u0002，专门委员会作为工作机构不具备立法权\nD✓ 依据2023年《立法法》，\u0001全国人大专门委员会（含宪法和法律委）和常委会工作机构可组织开展立法后评估\u0002\n宪法和法律委员会由原“法律委员会”于2018年更名而来，核心职责是\u0001推动宪法实施、开展宪法解释辅助研究、推进合宪性审查\u0002及统一审议法律草案。","k":"","kb":37,"kh":[[199,378],[379,441]]},{"id":"2023-18","y":2023,"t":"单","s":"根据《立法法》,下列关于授权立法的表述,正确的是（ ）。","o":["授权决定应当明确授权的目的、事项、范围、期限等","被授权机关可以将被授予的权力转授给其他机关","授权立法事项由全国人大常委会制定法律后,相应授权继续有效","被授权机关应当在授权期限届满一年前,向授权机关报告授权决定实施情况"],"a":"A","e":"\u0001授权立法决定应当明确授权的目的、事项、范围、期限以及实施遵循原则等。\u0002\nA✓ 依据《立法法》第13条，授权决定应当明确\u0001授权的目的、事项、范围、期限\u0002及实施应当遵循的原则等\nB✗ 授权立法强调专属信任，\u0001被授权机关不得将该权力转授给其他机关\u0002\nC✗ 授权立法事项条件成熟制定法律后，\u0001相应授权终止\u0002，并非继续有效\nD✗ 被授权机关应当在授权期限届满的\u0001六个月以前\u0002向授权机关报告实施情况，而非一年前\n牢记授权立法“四要点”：\u0001期限一般不超5年\u0002、\u0001绝对保留事项不得授\u0002、\u0001不得转授\u0002、\u0001届满前6个月报告\u0002。","k":"","kb":37,"kh":[[0,30],[199,378]]},{"id":"2023-24","y":2023,"t":"单","s":"根据我国宪法和法律,关于质询案的提出,下列表述正确的是（ ）。","o":["全国人大会议期间,一个代表团可书面提出质询案","全国人大会议期间,专门委员会可书面提出质询案","全国人大会议期间,十名以上代表可联名书面提出质询案","全国人大常委会会议期间,委员长可书面提出质询案"],"a":"A","e":"\u0001在全国人大会议期间，一个代表团或三十名以上代表联名可以书面提出质询案。\u0002\nA✓ 依据《宪法》第73条与《全国人大组织法》，全国人大会议期间\u0001一个代表团或者三十名以上代表联名\u0002可书面提出对国务院及各部委等的质询案\nB✗ 全国人大专门委员会是工作机构，无权直接提出质询案\nC✗ 全国人大会议期间代表联名提质询案须\u0001三十名以上\u0002（十名以上仅适用于全国人大常委会会议期间常委会组成人员）\nD✗ 委员长会议和常委会组成人员联名十人以上方可提案/质询，委员长个人无权单独提交质询案\n记忆口诀：\u0001大会期间一团或三十人，常委会期间十人以上\u0002。","k":"","kb":37,"kh":[[199,378],[441,492]]},{"id":"2023-27","y":2023,"t":"单","s":"下列关于人大代表执行职务保障的表述,正确的是（ ）。","o":["对人大代表采取强制措施,应当由人大常委会决定","人大代表在各种会议上的发言和表决,不受法律追究","人大代表建议、批评和意见办理情况的报告,不予公开","无固定工资收入的人大代表执行代表职务,由本级财政给予适当补贴"],"a":"D","e":"\u0001无固定工资收入的人大代表执行代表职务时，由本级财政给予适当补贴。\u0002\nA✗ 对县级以上人大代表逮捕等限制人身自由措施，须经\u0001本级人大主席团或常委会许可\u0002，并非由常委会决定逮捕\nB✗ 代表言论免责仅限于\u0001在人民代表大会各种会议上的发言和表决\u0002，并非任何私人或社会公开会议\nC✗ 依据《代表法》，人大常委会应当将代表建议批评意见办理情况的报告\u0001予以公开\u0002\nD✓ 依据《代表法》，无固定工资收入的兼职人大代表执行代表职务，\u0001由本级财政给予适当补贴\u0002\n代表豁免权与保障两大铁律：\u0001仅限于人大会议上的发言表决免责\u0002；\u0001非经许可不受逮捕或刑事审判\u0002。","k":"","kb":37,"kh":[[0,30],[492,581]]},{"id":"2024-14","y":2024,"t":"单","s":"根据我国《立法法》的规定,诉讼制度和仲裁基本制度的事项,只能制定法律,这一规定体现的主要原则是（ ）。","o":["人民主权原则","法律保留原则","法制统一原则","权力制约原则"],"a":"B","e":"\u0001某些基本事项“只能制定法律”而不允许行政法规先行创制，体现的正是法律保留原则。\u0002\nA✗ 人民主权原则强调国家一切权力属于人民，未直接指向国家机关间立法事项的权限分工\nB✓ \u0001法律保留原则\u0002（《立法法》第11条）要求涉及公民基本权利限制与国家基本制度（如诉讼仲裁、犯罪刑罚）只能由全国人大及其常委会制定法律\nC✗ 法制统一原则强调下位法不得与上位法抵触、维护整体规范体系和谐统一\nD✗ 权力制约原则重在公权力彼此监督制衡与防止滥用，法律保留重在\u0001重要立法权限专属立法机关\u0002\n法律保留区分：\u0001绝对保留\u0002（犯罪刑罚、剥夺政治权利、限制人身自由强制措施与处罚、司法制度）与\u0001相对保留\u0002（诉讼仲裁制度等可依法授权）。","k":"","kb":36,"kh":[[372,460]]},{"id":"2024-20","y":2024,"t":"单","s":"下列关于全国人大专门委员会的表述,不正确的是（ ）。","o":["全国人大专门委员会是全国人大会议期间的临时工作机构","宪法和法律委员会是统一审议向全国人大常委会提出的法律草案","民族委员会可以对加强民族团结问题进行调查研究,提出建议","社会建设委员会研究,拟定社会保障,民政事务,群团组织等方面的议案"],"a":"A","e":"\u0001全国人大各专门委员会是常设性的专门工作机构，而非仅在人大会议期间设立的临时机构。\u0002\nA✓ 全国人大专门委员会是\u0001常设性工作机构\u0002，在大会闭会期间接受全国人大常委会领导持续工作（临时性的是特定问题调查委员会）\nB✗ 宪法和法律委员会负责对向全国人大或者全国人大常委会提出的法律草案\u0001进行统一审议\u0002，正确\nC✗ 民族委员会职责包括对加强民族团结问题\u0001进行调查研究并提出建议\u0002，审议自治条例等，正确\nD✗ 社会建设委员会（2018年增设）主要负责研究、拟定并审议\u0001劳动就业、社会保障、民政事务、群团组织\u0002等方面议案，正确\n严格区分常设与临时机构：\u0001专门委员会（10个）是常设性工作机构\u0002；\u0001特定问题调查委员会\u0002才是临时性机构。","k":"","kb":37,"kh":[[199,378],[379,441]]},{"id":"2025-18","y":2025,"t":"单","s":"某市人民代表大会组织行政事业单位资产特定问题调查委员会,对该市行政事业单位失管闲置、低效利用、未确权的资产开展特定问题调查。根据我国宪法和法律,下列关于该调查委员会的表述,正确的是（ ）。","o":["市人大代表可以单独或联名,书面提议组织该调查委员会","该调查委员会应当向市人民代表大会提出调查报告","该调查委员会由主任委员、副主任委员、委员和秘书长组成","该调查委员会的组成须报上一级人大常委会批准"],"a":"B","e":"\u0001主席团或者十分之一以上代表书面联名,可以向本级人民代表大会提议组织关于特定问题的调查委员会,由主席团提请全体会议决定。\u0002\nA✗ 主席团或者十分之一以上代表书面联名,可以向本级人民代表大会提议组织关于特定问题的调查委员会,由主席团提请全体会议决定\nB✓ 人民代表大会可以授权它的常务委员会听取调查委员会的调查报告,常务委员会可以作出相应的决议,报人民代表大会下次会议备案\nC✗ 调查委员会由主任委员、副主任委员和委员组成,由主席团在代表中提名,提请全体会议通过\nD✗ 与题干设问或现行制度要件不符，故不选\n市人大代表不能单独提议组织调查委员会。 调查委员会应当向本级人民代表大会提出调查报告。 人民代表大会根据调查委员会的报告,可以作出相应的决议。","k":"","kb":37,"kh":[[379,441],[441,492]]},{"id":"2026-16","y":2026,"t":"单","s":"根据2024 年11 月修正的《各级人民代表大会常务委员会监督法》,关于人大常委会年度监督工作计划的相关规定,下列说法正确的是（ ）。","o":["年度监督工作计划已经制定的,不再调整","年度监督工作计划可以不向社会公布","年度监督工作计划由本级人民代表大会通过","人大常委会可采用执法检查、专项调研等方式开展监督"],"a":"D","e":"\u0001执法检查、专题调研是人大常委会常规监督方式。\u0002\nA✗ 工作计划可调整\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 由常委会自行制定,不由人大全体会议通过\nD✓ 执法检查、专题调研是人大常委会常规监督方式\n\u0001“年度监督工作计划可以不向社会公布”\u0002：应当公开;","k":"","kb":37,"kh":[[0,30],[441,492]]},{"id":"2026-18","y":2026,"t":"单","s":"根据我国宪法和法律,下列关于人大代表在人大闭会期间的活动,表述正确的是（ ）。","o":["县乡人大代表5 人以上联名,可以提出对本级人民政府的质询案","人大代表在闭会期间的活动,以个人活动为主,以代表小组活动为补充形式","人大代表参加视察活动时,可以提出建议、批评和意见,也可以直接处理问题","县级以上各级人大代表,可以根据本级人大常委会的决定,参加特殊问题的调查委员会"],"a":"D","e":"\u0001县级以上代表可参与常委会组织的特定问题调查。\u0002\nA✗ 闭会期间县乡代表不能提质询\nB✗ 闭会以代表小组为主\nC✗ 代表仅提建议,无权直接处理纠纷\nD✓ 县级以上代表可参与常委会组织的特定问题调查","k":"","kb":37,"kh":[[379,441],[441,492]]},{"id":"2026-24","y":2026,"t":"单","s":"根据我国宪法和法律,关于乡镇人大主席团表述正确的是（ ）。","o":["乡镇人大主席团是乡镇人民代表大会的常设机构","乡镇人大主席团的任期与本级人民代表大会每届任期相同","乡镇人大主席团主持本级人大会议,并负责召集下一次会议","乡镇人大主席团有权撤销乡镇人民政府不合适的命令及决定"],"a":"C","e":"\u0001乡镇人大主席团主持本次会议、召集下次会议。\u0002\nA✗ 乡镇人大无常设机关\nB✗ 主席团无独立任期\nC✓ 乡镇人大主席团主持本次会议、召集下次会议\nD✗ 无权撤销乡镇政府决定","k":"","kb":37,"kh":[[0,30],[379,441]]}]},{"sub":"中国宪法学","name":"国家机构（监察委与法检司法机关）","w":3.1,"w5":2.2,"wh":1.8,"bt":"新法","pt":"新《监察法》修订高频直考·近5年升至2.2分","L":31,"qs":[{"id":"2005-23","y":2005,"t":"单","s":"根据我国现行宪法,有权改变或撤消地方各级国家行政机关不适当的决定和命令的国家机关是（ ）。","o":["全国人民代表大会","全国人民代表大会常务委员会","国务院","国家主席"],"a":"C","e":"\u0001根据宪法第89 条第14 项,国务院有权改变或者撤销地方各级国家行政机关的不适当的决定和命令。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✓ 根据宪法第89 条第14 项,国务院有权改变或者撤销地方各级国家行政机关的不适当的决定和命令\nD✗ 与题干设问或现行制度要件不符，故不选","k":"","kb":37,"kh":[[0,30],[95,147]]},{"id":"2005-55","y":2005,"t":"多","s":"公、检、法三机关在办理刑事案件中的关系是（ ）。","o":["分工负责","互相监督","互相配合","互相制约"],"a":"ACD","e":"\u0001宪法第135 条规定:\"人民法院、人民检察院和公安机关办理刑事案件,应当分工负责,互相配合, 互相制约,以保证准确有效地执行法律。\u0002\nA✓ 符合题意及现行制度规定（\u0001分工负责\u0002）\nB✗ \"互相监督\"\nC✓ 符合题意及现行制度规定（\u0001互相配合\u0002）\nD✓ 符合题意及现行制度规定（\u0001互相制约\u0002）\n一般地,人民检察院、人民法院依法有权监督公安机关的侦查活动,人民法院依法有权监督人民检察院的侦查、起诉活动; 人民检察院依法有权监督人民法院的审判活动。 但是公安机关没有权力监督人民法院、人民检察院的活动。 因此\u0001“互相监督”\u0002 的说法是绝对错误的。","k":"","kb":39,"kh":[[282,311],[355,402]]},{"id":"2008-22","y":2008,"t":"单","s":"国家机构与普通社会团体最本质的区别是（ ）。","o":["历史性","严密的组织性","阶级性","特殊的强制力"],"a":"D","e":"\u0001国家机构的历史性附属于其国家性,故不是国家机构与普通社会团体的本质区别。\u0002\nA✗ 国家机构的历史性附属于其国家性,故不是国家机构与普通社会团体的本质区别\nB✗ 普通社会团体也可能具备严密的组织性、阶级性\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ 国家机构是为行使公共权力而建立的,只有它们才能行使国家权力\n普通计会团体是部分公民为一定目的而建立的,不具备国家职能,除非国家授予或者委托,也不得行使国家权力。","k":"","kb":39,"kh":[[22,87]]},{"id":"2008-52","y":2008,"t":"多","s":"根据我国现行宪法和法律的规定,我国设立的专门人民法院主要有（ ）。","o":["军事法院","海事法院","铁路运输法院","行政法院"],"a":"ABC","e":"\u0001设立军事法院的依据是《宪法》第124 条第1 款,该款规定:中华人民共和国设立最高人民法院、地方各级人民法院和军事法院等专门人民法院。\u0002\nA✓ 设立军事法院的依据是\u0001《宪法》\u0002第124 条第1 款,该款规定:中华人民共和国设立最高人民法院、地方各级人民法院和军事法院等专门人民法院\nB✓ 海事法院的设立依据是\u0001《全国人民代表大会常务委员会关于在沿海港口城市设立海事法院的决定》\u0002\nC✓ 我国现实中存在铁路运输法院\nD✗ 我国不存在独立的行政法院,行政诉讼案件依法由人民法院的行政审判庭审理\n根据1979 年7 月1 日第五届全国人大第二次会议通过\u0001《人民法院组织法》\u0002第2 第第3 款,专门人民法院包括:军事法院、铁路运输法院、水上运输法院、森林法院、其他专门法院。 但是,1983 年9 月2 日第六届全国人大常委会第二次会议通过的\u0001《关于修改<中华人民共和国人民法院组织法>的决定》\u0002删去了该条第3 款,故铁路运输法院是否属于\u0001《宪法》\u0002第124 条第1 款规定的\"等专门人民法院\",尚不明确。 在现实中,铁路运输法院的管辖权范围是能过最高人民法院的司法解释确定的。 专门人民法院不得管辖行政诉讼案件。","k":"","kb":37,"kh":[[0,30],[199,378]]},{"id":"2010-55","y":2010,"t":"多","s":"下列选项中,属于我国人民法院应遵循的审判工作原则的有（ ）。","o":["合议制原则","被告人有权获得辩护原则","公开审理原则","专门工作与群众路线相结合原则"],"a":"ABC","e":"\u0001依据题干与现行制度规定综合判断作答。\u0002\nA✓ 符合题意及现行制度规定（\u0001合议制原则\u0002）\nB✓ 符合题意及现行制度规定（\u0001被告人有权获得辩护原则\u0002）\nC✓ 符合题意及现行制度规定（\u0001公开审理原则\u0002）\nD✗ 法院的审判原则包括依法独立审判原则、公民在法律面前一律平等原则、被告人有权获得辩护原则、使用本民族语言文字进行辩护原则、合议制度、回避制度、公开审判制度、两审终审制、审判监督制度和审判委员会…","k":"","kb":39,"kh":[[166,246],[246,266]]},{"id":"2011-31","y":2011,"t":"单","s":"根据我国现行《宪法》的规定,上下级人民法院在审判工作中的关系是（ ）。","o":["监督关系","领导关系","指导关系","隶属关系"],"a":"A","e":"\u0001《宪法》第127 条第2 款规定:\" 最高人民法院监督地方各级人民法院和专门人民法院的审判工作,上级人民法院监督下级人民法院的审判工 \"所以,上下级法院之间的关系是监督关系。\u0002\nA✓ \u0001《宪法》\u0002第127 条第2 款规定:\" 最高人民法院监督地方各级人民法院和专门人民法院的审判工作,上级人民法院监督下级人民法院的审判工 \"所以,上下级法院之间的关系是监督关系\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选\n(这里考生需要比较人民检察院的领导体制。 最高人民检察院领导地方各级人民检察院和专门检察院的工作,上级人民检察院领导下级人民检察院的工作。","k":"","kb":39,"kh":[[166,246],[266,281]]},{"id":"2012-22","y":2012,"t":"单","s":"下列机关中,享有对直辖市中级人民法院院长任免权的是（ ）。","o":["市人民代表大会","市高级人民法院","市政法委员会","市人民代表大会常务委员会"],"a":"D","e":"\u0001《人民法院组织法》第43条规定:\"地方各级人民法院院长由本级人民代表大会选举,副院长、审判委员会委员、庭长、副庭长和审判员由院长提请本级人民代表大会常务委员会任免。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ 在省、自治区内按地区设立的和在直辖市内设立的中级人民法院院长,由省、自治区、直辖市人民代表大会常务委员会根据主任会议的提名决定任免,副院长、审判委员会委员庭长、副庭长和审判员由高级人民法院院…\n在省、自治区内按地区设立的和在直辖市内设立的中级人民法院院长,由省、自治区、直辖市人民代表大会常务委员会根据主任会议的提名决定任免,副院长、审判委员会委员庭长、副庭长和审判员由高级人民法院院长提请省、自治区、直辖市人民代表大会常务委员会任免。 最高人民法院院长由全国人民代表大会选举,副院长、审判委员会委员、庭长、副庭长和审判员由院长提请全国人民代表大会常务委员会任免。 最高人民法院巡回法庭庭长、副庭长,由最高人民法院院长提请全国人民代表大会常务委员会任免。","k":"","kb":39,"kh":[[166,246],[246,266]]},{"id":"2014-23","y":2014,"t":"单","s":"下列关于我国检察机关的表述,正确的是（ ）。","o":["最高人民检察院是最高司法行政机关","人民检察院是国家的法律监督机关","上级人民检察院指导下级人民检察院的工作","人民检察院有批准逮捕、审查起诉并领导公安机关侦查活动的职权"],"a":"B","e":"\u0001司法部是我国最高司法行政机关。\u0002\nA✗ 司法部是我国最高司法行政机关\nB✓ 人民检察院是国家的法律监督机关,最高人民检察院是最高检察机关\nC✗ 最高人民检察院领导各级人民检察院和专门人民检察院的工作,上级人民检察院领导下级人民检察院的工作\nD✗ 人民检察院并无领导公安机关侦查活动的职权\n人民检察院、人民法院和公安机关办理刑事案件,应分工负责,互相配合,互相制约,以保证准确有效地执行法律。 因此选\u0001“人民检察院是国家的法律监督机
