002。","k":"","kb":32,"kh":[[54,93],[128,169]]},{"id":"2024-27","y":2024,"t":"单","s":"全国人大常委会在《关于中华人民共和国香港特别行政区基本法》第一百零四条的解释中明确,该条关于公职人员就职宣誓规定的,“拥护中华人民共和国香港特别行政区基本法,效忠中华人民共和国香港特别行政区”既是该条规定的宣誓必须包括的法定内容也是参选或者出任该条所列公职的法定要求和条件。下列关于这一解释的表述不正确的是（ ）。","o":["宣誓体现了“爱国者治港”的原则","宣誓人必须真诚、庄重地进行宣誓","宣誓人拒绝宣誓,即丧失就任该条所列相应公职的资格","宣誓如被确定为无效,应重新安排宣誓"],"a":"D","e":"\u0001根据全国人大常委会对《香港基本法》第104条的解释，宣誓被依法认定无效的不得重新安排宣誓。\u0002\nA✗ 就职宣誓拥护基本法和效忠特区是“一国两制”与\u0001“爱国者治港”\u0002原则的重要制度保障，正确\nB✗ 全国人大常委会释法明确要求宣誓人必须\u0001真诚、庄重\u0002地准确完整宣读法定誓言，不得增删篡改内容，正确\nC✗ 宣誓人故意拒绝宣誓的，\u0001即丧失就任该条所列相应公职的资格\u0002，正确\nD✓ 释法明文规定：宣誓人作虚假宣誓或违反誓言方式导致宣誓被监誓人确定为无效的，\u0001不得重新安排宣誓\u0002\n全国人大常委会2016年对《香港基本法》第104条释法核心底线：\u0001拒绝宣誓或宣誓无效即丧失资格，不得重宣\u0002。","k":"","kb":33,"kh":[[15,143],[158,195]]},{"id":"2025-14","y":2025,"t":"单","s":"1954 年宪法是中华人民共和国第一部宪法。下列关于1954 年宪法的表述,正确的是 （ ）。","o":["制宪机关是宪法起草委员会","规定了国旗、国歌、国徽、首都","确立了人民民主原则和社会主义原则","结构上将“公民的基本权利和义务”一章置于“国家机构”一章之前"],"a":"C","e":"\u00011954 年宪法没有规定国歌。\u0002\nA✗ 1954 年宪法是全国人民代表大会第一次会议通过,制宪机关不是宪法起草委员会\nB✗ 1954 年宪法没有规定国歌\nC✓ 1954 年宪法确立了人民民主原则和社会主义原则\nD✗ 1954 年宪法第二章是国家机构,第三章是公民的基本权利和义务","k":"","kb":33,"kh":[[228,304],[304,365]]},{"id":"2025-22","y":2025,"t":"单","s":"根据我国宪法和法律,下列关于地方政府规章的表述,正确的是（ ）。","o":["部门规章的效力高于地方政府规章","县级人民政府有权就历史文化保护事项制定地方政府规章","自治州的人民政府有权就基层治理事项制定地方政府规章","自治区的地方政府规章由自治区主席决定并签署命令予以公布"],"a":"C","e":"\u0001设区的市、自治州的人民政府根据《立法法》的规定制定地方政府规章, 限于城乡建设与管理、生态文明建设、历史文化保护、基层治理等方面的事项。\u0002\nA✗ 部门规章之间、部门规章与地方政府规章之间具有同等效力,在各自的权限范围内施行\nB✗ 县级人民政府无权制定,自治州人民政府有权制定\nC✓ 设区的市、自治州的人民政府根据\u0001《立法法》\u0002的规定制定地方政府规章, 限于城乡建设与管理、生态文明建设、历史文化保护、基层治理等方面的事项\nD✗ 地方政府规章由省长、自治区主席、市长或者自治州州长签署命令予以公布\n地方政府规章应当经政府常务会议或者全体会议决定。","k":"","kb":32,"kh":[[21,54]]},{"id":"2026-15","y":2026,"t":"单","s":"根据我国宪法和法律,关于澳门特别行政区行政长官的相关规定,下列说法正确的是（ ）。","o":["行政长官在当地进行选举,不得连任","效忠中华人民共和国是行政长官应当遵循的基本政治伦理","当地行政长官可选举廉政专员,廉政专员对行政长官负责","行政长官与立法会意见不一致时可解散立法会,不限次数"],"a":"B","e":"\u0001效忠国家是特区长官法定义务、基本政治伦理。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 效忠国家是特区长官法定义务、基本政治伦理\nC✗ 廉政专员中央任命\nD✗ 一届任期仅能解散立法会一次\n\u0001“行政长官在当地进行选举,不得连任”\u0002：可连任一次;","k":"","kb":33,"kh":[[0,14],[15,143]]},{"id":"2026-26","y":2026,"t":"单","s":"下列关于我国行政区划的表述,正确的是（ ）。","o":["村民委员会属于一般行政区划单位","行政区划不属于国家结构形式的范畴","民族自治地方包括自治区、自治州、自治县和民族乡","尊重历史沿革和文化传统是我国行政区划划分的原则之一"],"a":"D","e":"\u0001行政区划划分包含历史、文化、经济、民族原则。\u0002\nA✗ 村委会自治组织,非行政区划\nB✗ 行政区划是国家结构形式体现\nC✗ 民族乡不属于自治地方\nD✓ 行政区划划分包含历史、文化、经济、民族原则\n\u0001“村民委员会属于一般行政区划单位”\u0002：村委会自治组织,非行政区划; “行政区划不属于国家结构形式的范畴”：行政区划是国家结构形式体现;","k":"","kb":32,"kh":[[54,93],[170,203]]}]},{"sub":"法理学","name":"立法体制与立法程序","w":2.1,"w5":1.6,"wh":2.0,"bt":"回补","pt":"《立法法》修订+2026客观归零隔年强回补","L":35,"qs":[{"id":"2005-3","y":2005,"t":"单","s":"甲、乙、丙、丁四人在一起讨论法律制定问题,他们各自的观点中,正确的是（ ）。","o":["甲说:“法律的制定又称法的创立和立法,从根本上讲,就是掌握国家政权的阶级把自己的意志上升为国家意志的活动”","乙说:“甲的观点是错误的,我国法律的制定是指中共中央和国家最高权力机关依照法定的权限和制定规范性法律文件的活动”","丙说:“我基本上同意甲的观点,法律制定的目标主要在于将统治阶级的意志上升为国家意志,但是在现代社会,某些不产生国家意志的活动也属于法律制定活动”","丁说:“我认为你们三人的观点都不正确,从本质上讲,法律制定实际上就是特定国家机关运用专门技术的活动,立法技术运用的高低直接关系到立法效果的好坏”"],"a":"A","e":"\u0001将中共中央作为立法主体错误,将立法主体仅限定在国家最高权力机关也是错误的,还包括享有立法权的国家行政机关、军事机关和地方权力机关。\u0002\nA✓ 符合题意及现行制度规定（\u0001甲说:“法律的制定又称法的创立和立法\u0002）\nB✗ 将中共中央作为立法主体错误,将立法主体仅限定在国家最高权力机关也是错误的,还包括享有立法权的国家行政机关、军事机关和地方权力机关\nC✗ 其次,立法是国家职能活动,不产生国家意志的活动不可能属于立法活动\nD✗ 再次,尽管立法技术运用的高低会影响到立法效果,但立法效果的最终决定因素是该立法是否符合社会要求,丁的观点夸大了立法技术的作用\n首先,立法只能由一定的国家机关或者经过授权的单位进行。","k":"","kb":14,"kh":[[0,27],[51,65]]},{"id":"2005-7","y":2005,"t":"单","s":"法律草案表决通过后,该法律（ ）。","o":["自通过之日就具有了法律效力","在公布之前不产生法律效力","必须自公布之日起产生法律效力","只对赞成其通过的人具有法律效力"],"a":"B","e":"\u0001法律体现国家意志,对其调整的人同具法律约束力,而不管其是否赞同该法律。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 符合题意及现行制度规定（\u0001在公布之前不产生法律效力\u0002）\nC✗ 法律可能自公布之日起生效,也可能依法在公布后的某个日期起生效\nD✗ 与题干设问或现行制度要件不符，故不选\n法律的公布是立法程序中不可缺少的最后一个步骤,它是法律生效的前提。 法律通过后,凡是未经公布的,都不能产生法律效力。 虽然法律公布是法律生效的前提,但法律公布日期和法律生效日期并不等同。","k":"","kb":14,"kh":[[0,27],[115,136]]},{"id":"2005-11","y":2005,"t":"单","s":"马克思指出:“立法者应该把自己看做一个自然科学家,他不是在制造法律,不是在发明法律,而仅仅是在表述法律。他把精神关系内在规律表现在有意识的现行法律之中。”这段话表明（ ）。","o":["立法者要像自然科学家一样思维和行动","法律是客观的,立法者在立法时不应发挥自己的主观能动性","立法要尊重和反映客观规律","立法者应该把现行法律看作是绝对精神的体现"],"a":"C","e":"\u0001的仍然是立法的科学性原则。\u0002\nA✗ 马克思这段话中的\"精神关系\"应当理解为被社会生产方式所决定的社会关系\nB✗ 立法者应当发挥自己的主观能动性,尽可能地反映客观规律\nC✓ 立法者应当发挥自己的主观能动性,尽可能地反映客观规律\nD✗ 因为法律最终是由一定的物质生活条件所决定的,具有客观性\n马克思的话不能断章取义的理解,应当放在整个马克思主义思想体系中理解。 在马克思主义,法律作为上层建筑之一,最终是由社会的生产方式决定的。 因此,法律只是将社会生产方式所要求的规则\"表述\"出来而已。 \"立法者应该把自己看做一个自然科学家\"强调的是立法者与自然科学家在\"表述\"问题上的相似性,并非要求立法者要像自然科学家一样思维和行动。 法律并非完全客观。 法律首先是国家意志和阶级意志,具有一定的主观性。 法律具有客观性,并非与物质社会无关的\"绝对精神\"的体现。","k":"","kb":14,"kh":[[51,65],[65,115]]},{"id":"2005-12","y":2005,"t":"单","s":"关于技术法规的表述,正确的是（ ）。","o":["技术规范上升为法律后,称为技术法规","并不是所有的技术法规都是社会规范","有些技术法规不具有国家意志性","技术法规调整的对象是人与自然的关系,并不涉及人与人之间的相互关系"],"a":"A","e":"\u0001技术法规属于法律,当然属于社会规范,也具有国家意志性,并必然涉及到人与人之间的相互关系。\u0002\nA✓ 由技术规范构成的法律,在法学上被称为\"技术法规\"\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 原本意义上的技术法规,其调整对象是人与自然的关系,并不必然涉及人们的交互行为\n特别注意技术规范与技术法规并非一回事。 但是上升为技术法规的技术规范,具有了法的性质。","k":"","kb":2,"kh":[[0,147],[148,187]]},{"id":"2006-4","y":2006,"t":"单","s":"依照刑法规定,犯贪污罪的,个人贪污数额在 10 万元以上的,处 10 年以上有期徒刑或无期徒刑,可以并处没收财产。甲贪法公款 15 万元,法院依法认定甲构成贪污罪,判处甲有期徒刑 11 年,并处没收个人财产。法院运用的推理方式属于（ ）。","o":["演绎推理","归纳推理","实质推理","辩证推理"],"a":"A","e":"\u0001实质推理即是辩证推理。\u0002\nA✓ 符合题意及现行制度规定（\u0001演绎推理\u0002）\nB✗ 此是类推推理,而类推推理是特殊的归纳推理\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选","k":"","kb":17,"kh":[[12,57],[57,86]]},{"id":"2006-5","y":2006,"t":"单","s":"维护和保障立法活动合法性的法的制定原则是（ ）。","o":["合宪性与法制统一原则","民主性原则","科学性原则","从实际出发,尊重客观规律原则"],"a":"A","e":"\u0001合法性是指说首先要合乎宪法,其次要在整个法律体系中保持法制的统一。\u0002\nA✓ 符合题意及现行制度规定（\u0001合宪性与法制统一原则\u0002）\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选","k":"","kb":14,"kh":[[0,27],[28,51]]},{"id":"2006-51","y":2006,"t":"多","s":"下列诸项表述中,能够成立的有（ ）。","o":["立法体制是国家权力分立与制衡的体制","司法具有被动性、中立性与终极性","执法的内容具有广泛性,而执法活动具有单向性","守法是与违法相对的一种状态"],"a":"BCD","e":"\u0001三权分立指的是:立法、执法、司法。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 符合题意及现行制度规定（\u0001司法具有被动性、中立性与终极性\u0002）\nC✓ 符合题意及现行制度规定（\u0001执法的内容具有广泛性,而执法活动具有\u0002）\nD✓ 符合题意及现行制度规定（\u0001守法是与违法相对的一种状态\u0002）\n守法不仅指承担义务并履行,而且包括依法享有权利并行使权利。","k":"","kb":15,"kh":[[0,15],[105,170]]},{"id":"2007-9","y":2007,"t":"单","s":"下列关于我国“行政法规”的表述,能够成立的是 （ ）。","o":["行政法规是规范和调整行政法律关系的总称","行政法规是由行政机关制定的规范性法律文件的总称","由全部的行政法规构成的法律部门称作行政法部门","行政法规是一种效力仅次于宪法和法律的法律渊源"],"a":"D","e":"\u0001行政法规行政法规是指国务院根据宪法和法律制定和颁布的各种规范性法律文件,是我国法律渊源的一种,其效力仅低于宪法和法律。\u0002\nA✗ 行政法而非行政法规是规范和调整行政法律关系的总称\nB✗ 并非所有的行政机关都有权制定行政法规,只有国务院才有权制定行政法规\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ 行政法规行政法规是指国务院根据宪法和法律制定和颁布的各种规范性法律文件,是我国法律渊源的一种,其效力仅低于宪法和法律\n行政法部门不仅由行政法规构成,还包括调整行政法律关系的各种法律规范,散见于宪法、法律和地方性法规中,","k":"","kb":3,"kh":[[0,10],[11,103]]},{"id":"2008-3","y":2008,"t":"单","s":"我国婚姻法规定,“子女可以随父姓,也可以随母姓”。这一规范属于（ ）。","o":["强行性规范","任意性规范","非确定性规范","准用性规范"],"a":"B","e":"\u0001题干中的条文明显属于任意性规范。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 题干中的条文明显属于任意性规范\nC✗ 确定性规范与非确定性规范相对,二者的区别在于前者明确规定权利义务,而后者没有\nD✗ 与题干设问或现行制度要件不符，故不选\n强行性规范与任意性规范相对,二者的区别在于后者允许人们自行选择或者协商确定行为内容与方式。 非确定性规范包括准用性规范和委任性规范。 题干中的条文具体规定了权利,故应属于确定性规范。","k":"","kb":14,"kh":[[28,51]]},{"id":"2008-48","y":2008,"t":"多","s":"立法程序制度化、法律化的意义主要有（ ）。","o":["有利于更广泛地收集民意","有利于提高立法质量","有利于减少或避免立法的任意性","有利于树立法的权威性"],"a":"ABCD","e":"\u0001法律制度是专门机关依照法定程序所进行的活动。\u0002\nA✓ 符合题意及现行制度规定（\u0001有利于更广泛地收集民意\u0002）\nB✓ 符合题意及现行制度规定（\u0001有利于提高立法质量\u0002）\nC✓ 符合题意及现行制度规定（\u0001有利于减少或避免立法的任意性\u0002）\nD✓ 符合题意及现行制度规定（\u0001有利于树立法的权威性\u0002）\n在国家产生之初,由于立法尚未上升为国家的一项专门性和经常性活动,所以没有固定严格的程序,随意性很大。 随着立法活动的逐步规范,逐渐要求法律制定必须遵循一套固定、严格的程序,避免随意立法情况的发生,以此来保证社会关系和社会秩序的稳定。 现代国家都注重立法程序的规范化、格式化。 另外,现代民主国家都要求在立法程序中坚持民主。 故本题该项、该项、该项、该项 的正确。","k":"","kb":14,"kh":[[0,27],[65,115]]},{"id":"2008-51","y":2008,"t":"多","s":"下列选项中,属于立法活动的有（ ）。","o":["1987 年全国人民代表大会常务委员会废除 111 件法律","2004 年国务院颁布《道路交通安全法实施细则》","2005 年某高校民法典研究所公布《绿色民法典》","2006 年某出版单位出版《物权法立法意见》"],"a":"AB","e":"\u0001立法方式包括制定、修改、补充和废止等。\u0002\nA✓ 符合题意及现行制度规定（\u00011987 年全国人民代表大会常务委员\u0002）\nB✓ 注意:2004 年国务院颁布的是\u0001《道路交通安全法实施条例》\u0002而非\"实施细则\",出题者可能出于笔误\nC✗ \"高校民法典研究所\"、\"出版单位\"不具有立法权,故其活动不是立法活动\nD✗ 与题干设问或现行制度要件不符，故不选\n立法活动的主体必须是享有立法权的主体;","k":"","kb":14,"kh":[[0,27],[65,115]]},{"id":"2009-7","y":2009,"t":"单","s":"刑法规定,叫哮他人犯罪的,应当按照其在共同犯罪中所起到的作用处罚。这一规定属于法律构成要素中的（ ）。","o":["法律概念","法律原则","法律规则","技术性规定"],"a":"C","e":"\u0001法律概念是指在长期的法学研究和法律实践基础是上经常使用的一些专门术语进行抽象、概括所形成的具有特定法律意义的概念。\u0002\nA✗ 法律概念是指在长期的法学研究和法律实践基础是上经常使用的一些专门术语进行抽象、概括所形成的具有特定法律意义的概念\nB✗ 题干这的规定不属于法律原\nC✓ 题干中的规定,符合法律规则的假定、行为模式和法律后果的结构形式\nD✗ 选项不符合题意\n法律原则是指在一定法律体系中作为法律规则的指导思想、基础或本原的综合的、稳定的原理和准则。 法律规则是采用一定的结构形式具体规定人们的法律权利、法鲁义务以及相应的法律后果的行为规范。","k":"","kb":9,"kh":[[0,14],[66,85]]},{"id":"2010-9","y":2010,"t":"单","s":"下列关于立法的表述,不能成立的是（ ）。","o":["立法体制的核心问题是立法权的分配","修改和废止法律是立法活动的重要组成部分","立法反映社会发展规律,与人的主观能动性无关","有关国家机关发布的规范性法律文件属于广义的立法"],"a":"C","e":"\u0001立法指有关国家机关按照法定的职权和程序制定具有法律效力的各种规范性文件的活动, 既反映了社会发展规律,也充分地反映了立法者和人民群众的主观能动性。\u0002\nA✗ 立法体制的核心问题是立法权的分配问题,立法活动包括了法什的创制、认可、修改和废ll·.故\\、相关表述均表述止确c\nB✗ 与题干设问或现行制度要件不符，故不选\nC✓ 立法指有关国家机关按照法定的职权和程序制定具有法律效力的各种规范性文件的活动, 既反映了社会发展规律,也充分地反映了立法者和人民群众的主观能动性\nD✗ 与题干设问或现行制度要件不符，故不选","k":"","kb":14,"kh":[[0,27],[28,51]]},{"id":"2012-9","y":2012,"t":"单","s":"下列关于我国立法的表述,正确的是（ ）。","o":["立法在内涵上不包括法律的废止","立法权是国家权力体系中最重要的权力","我国的立法体制是中央和地方的二元立法体制","立法是国家机关和社会组织按照相应的程序进行的活动"],"a":"B","e":"\u0001立法也包括法律的废止。\u0002\nA✗ 立法也包括法律的废止\nB✓ 立法权是国家权力体系中最重要、最核心的权力\nC✗ 我国确 \"的立法体制\nD✗ 法律制定是国家的一项专门活动,主体是特定的国家机关,不包括社会组织\n法律制定,是指有立法权的国家机关或经授权的国家机关,依照法定的职权和程序,创制、认可、修改或废止法律和其他规范性法律文件的专门性活动,是掌握国家政权的阶级把自己的意志上升为国家意志的活动。 因 \"既统一而又分层次立的是此选B。 【点评】法律的制定和立法体制是高频考点,在历年真题中已经多次考查,考生一定要给予高度关注。 法律的制定既可以考查客观题,也可以考查主观题。","k":"","kb":14,"kh":[[0,27],[28,51]]},{"id":"2013-8","y":2013,"t":"单","s":"马克思指出,立法者应该把自己看作一个自然科学家。对此,下列理解正确的是（ ）。","o":["立法者都应当从自然科学家中产生","立法者应该在制定法律时多听听自然科学家的意见","立法者在立法时应当像自然科学家那样尊重科学性和规律性","立法者不必从社会科学的角度而应从自然科学的角度考虑立法问题"],"a":"C","e":"\u0001此题是考查马克思立法观的内容。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✓ 马克思的法律观强调,法律本质上最终受到客观物质生活条件的制约,即强调经济基础对上层建筑的决定性作用(,他在守法领域的理解也与该思想观念相似 4 个选项中,只有C最符合,即立法者在立法时应当像…\nD✗ 与题干设问或现行制度要件不符，故不选\n马克思的法律观强调,法律本质上最终受到客观物质生活条件的制约,即强调经济基础对上层建筑的决定性作用(,他在守法领域的理解也与该思想观念相似 4 个选项中,只有C最符合,即立法者在立法时应当像自然科学家那样尊重科学性和规律性。 因此选相关表述。","k":"","kb":14,"kh":[[0,27],[28,51]]},{"id":"2014-10","y":2014,"t":"单","s":"下列关于法律实施的表述,正确的是（ ）。","o":["法律实施就意味着法律的实现","法律实施是法律实现的过程性与实效性的结合","法律实施是使法从应然状态向实然状态转变的过程","法律实施包括立法、执法、司法、守法和法律监督诸环节 )。"],"a":"C","e":"\u0001法律实施和法律实现不同。\u0002\nA✗ 法律实施是法从应然状态到实然状态的过程和活动,而法律实现是法律实施活动的直接目的\nB✗ 法律实现是法律实施过程性和实效性的结合,B说法相反\nC✓ 法律实施是法从应然状态到实然状态的过程和活动,而法律实现是法律实施活动的直接目的\nD✗ 法律实施不包括立法\n因此选相关表述。","k":"","kb":15,"kh":[[0,15],[265,329]]},{"id":"2015-5","y":2015,"t":"单","s":"下列关于立法的表述,正确的是（ ）。","o":["立法包括法律的创制、认可、修改和解释,不包括法律的废止","邓析制“竹刑”,说明立法主体不仅限于特定的国家机关","现代国家权力体系中,立法权是最重要、最核心的权力","国家结构形式对一国立法体制形成的影响不大"],"a":"C","e":"\u00012015年全国法律硕士(非法学)联考真题答案详解专业综合课立法包括法律的创制、认可、修改和解释,也包括法律的废止。\u0002\nA✗ 2015年全国法律硕士(非法学)联考真题答案详解专业综合课立法包括法律的创制、认可、修改和解释,也包括法律的废止\nB✗ 立法的主体是特定的 \" 本身并不是立法行为,邓析 \" 竹刑国家机关,邓析制 \" 被国家特定机关认可采纳才是立法行 \" 竹刑所制的为\nC✓ 现代国家权力体系中,立法权是最重要、最核心的权力\nD✗ 一个国家立法体制的形成,主要是由这个国家的国家性质、国家结构形式和文化传统等因素决定的","k":"","kb":14,"kh":[[0,27],[28,51]]},{"id":"2015-10","y":2015,"t":"单","s":"某市出租车司机甲为了将病重的高中生及时送往医院,连闯两个红灯。按照交通法规,对其闯红灯行为应予以扣分并罚款,但市公安交管部门认为, 甲的做法系救人之举,决定免除对甲的处罚。对此, 下列说法正确的是（ ）。","o":["甲为救人而闯红灯的行为并不违法","甲不受法律制裁并不意味着他没有法律责任","公安交管部门作出免除处罚的决定运用的是演绎推理","公安交管部门作出免除处罚的决定违反了法律面前人人平等原则"],"a":"B","e":"\u0001公安交管部门作出免除处罚的决定运用的是实质推理而非形式推理,此举并不违反法律面前人人平等的原则,C。\u0002\nA✗ 甲闯红灯的行为违法\nB✓ 甲不受法律制裁并不意味着他没有法律责任\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 公安交管部门作出免除处罚的决定运用的是实质推理而非形式推理,此举并不违反法律面前人人平等的原则,C\n法律责任是法律制裁的前提,但是,有法律责任未必有法律制裁。 因为,如果当事人履行了法律责任,就没有法律制裁了。 但是,不受法律制裁,也可能存在法律责任,可能有免责事由。","k":"","kb":13,"kh":[[0,12],[84,138]]},{"id":"2015-51","y":2015,"t":"多","s":"下列关于法律实施的表述,正确的有（ ）。","o":["法律实施是使法律从书本上的法律变成行动中的法律","公安机关对涉嫌的黄某采取强制措施属于法的执行","某省人大常委会对该省地方性法规进行解释属于法律监督","某出租车司机向公安机关举报宁某吸毒的行为属于法的适用"],"a":"AB","e":"\u0001法律实施,也叫法的实施,是指法在社会生活中被人们实际施行,即在社会生活中通过人们的执法、司法、守法、法律监督等方式对法律的实际施行。\u0002\nA✓ 法律实施,也叫法的实施,是指法在社会生活中被人们实际施行,即在社会生活中通过人们的执法、司法、守法、法律监督等方式对法律的实际施行\nB✓ 公安机关对涉嫌嫖娼的黄某采取强制措施属于行政主体履行职责、实施法律的活动,是执法\nC✗ 人大常委会对地方性法规进行解释的行为属于法律解释.不属于法律实施\nD✗ 法的适用主体是国家司法机关,出租车司机不是司法机关,其向公安机关举报宁某吸毒的行为不是法的适用\n狭义上的执法则专指国家行政机关和法律法规授权、行政主体委托的组织及其公职人员依照法定职权和程序行使管理职权、履行职责、实施法律的活动。","k":"","kb":15,"kh":[[0,15],[16,104]]},{"id":"2016-2","y":2016,"t":"单","s":"马克思在《哲学的贫困》中指出:“君主们在任何时候都不得不服从经济条件,并且从来不能向经济条件发号施令。无论是政治的立法或市民的立法,都只是表明和记载经济关系的要求而已。”对于这句话的理解,正确的是（ ）。","o":["君主制定的法律不能调整经济关系","除经济因素外,立法不受其他因素的影响","政治的立法和市民的立法具有完全相同的目的","国家的立法在本质上决定于社会客观经济条件"],"a":"D","e":"\u0001马克思主义法学认为法的第一层次本质是国家意志的体现,第二层次本质是物质生活条件、经济条件,对阶级意志的内容具有决定作用。\u0002\nA✗ 法是调整人们行为的规范,是社会关系的调整器,可以调整经济关系,相关表述不\nB✗ 除了受经济因素影响外,阶级意志的内容也受其他因素的影响,主要包括政治、思想、道德、文化、历史传统等\nC✗ 政治的立法的目的是为了维护阶级统治,市民的立法是为了维护市民的权利,二者的立法目的不同,相关表述不\nD✓ 从根本上说,法决定千一定的经济关系(经济基础)\n\u0001“除经济因素外,立法不受其他因素的影响”\u0002不正确。 法是调整人们行为的规范,是社会关系的调整器,可以调整经济关系,“君主制定的法律不能调整经济关系”不正确。","k":"","kb":14,"kh":[[0,27],[28,51]]},{"id":"2016-48","y":2016,"t":"多","s":"2013年,全国人大常委会在旅游法草案提请审议表决前,邀请了部分全国人大代表、旅游者、旅游经营者、法律专家召开座谈会,对法律草案内容的合宪性、可行性、法律出台时机以及实施后的社会效果等进行综合评估。该立法过程体现的立法原则有 （ ）。","o":["合法性原则","科学性原则","民主性原则","效率性原则"],"a":"ABC","e":"\u0001合法性原则是指法律制定的依据、权限、程序必须遵守宪法和法律的规定。\u0002\nA✓ 本题中全国人大常委会邀请代表对法律草案内容的合宪性进行评估,体现了法律制定的合法性原则\nB✓ 科学性原则是指法律制定必须从实际出发,尊重客观规律,全国人大常委会邀请代表对法律草案内容的可行性进行评估,体现了法律制定的科学性原则\nC✓ 本题中全国人大常委会邀请代表对法律草案内容进行评估,使人民群众参与到立法过程中来,体现了法律制定的民主性原则\nD✗ 本题没有体现出效率性原则,邀请代表对草案内容进行评估,没有提高立法效率\n民主性原则是指法律制定必须从最大多数人的最根本利益出发,立法过程和立法程序具有民主性。","k":"","kb":14,"kh":[[0,27],[65,115]]},{"id":"2016-50","y":2016,"t":"多","s":"下列关于法律实现与法律实施的理解,正确的有（ ）。","o":["法律实现是法律实施的目的","法律实现受社会客观物质条件的限制","法律实施是法从应然状态到实然状态的过程","只要法律规范得到实施,就一定能够实现立法的理想与目的"],"a":"ABC","e":"\u0001法律实施,是指法在社会生活中被人们实际施行,即在社会生活中通过人们的执法、司法、守法、法律监督等方式对法律的实际施行。\u0002\nA✓ 法律实现是法律实施活动的直接目的\nB✓ 影响法律实现的因素很多,比如国家的阶级本质,法律、法规等规范性法律文件反映统治阶级意志的程度等,法律实现也受到社会客观物质条件的限制\nC✓ 法律的实施使法律从书本上的法律变成行动中的法律,使它从抽象的行为模式变成人们的具体行为,从应然状态进到实然状态\nD✗ 法律实施是实现法的作用和目的的条件,但是法律实施并不必然意味着法的要求的实现,在法律实施过程中可能有各种因素阻碍着法的功能的发挥\n法律实现是指法律要求在社会生活中被转化为现实,达到法律设定的权利和义务的目的。","k":"","kb":15,"kh":[[0,15],[265,329]]},{"id":"2017-46","y":2017,"t":"多","s":"在环境保护法修改过程中,全国人大常委会依照有关法律,向社会公众、环保组织、专家学者征集对该法的修改意见。此举体现的立法原则有（ ）。","o":["民主性原则","科学性原则","便民性原则 )。","平等性原则"],"a":"AB","e":"\u0001我国的立法原则有合宪和法制统一原则、民主原则、科学原则,没有便民性原则和平等性原则,该项。\u0002\nA✓ 本题中全国人大常委会向社会公众征集修改意见,保障了公众参与立法,体现立法的民主性原则\nB✓ 向环保组织、专家学者征集意见,有利于科学合理地规定权利和义务,体现立法的科学性原则,该项\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选\n立法的民主原则是指在立法过程中, 要体现和贯彻人民主权思想,集中和反映人民的智慧、利益、要求和愿望,使立法机关与人民群众相结合,使立法活动与人民群众参与相结合。 科学原则是指立法活动应从实际出发,科学合理的规定权利与义务、权利与责任,法律规范明确、具体,具有针对性和可执行性。","k":"","kb":14,"kh":[[0,27],[137,226]]},{"id":"2018-7","y":2018,"t":"单","s":"关于法的特征,下列说法正确的是（ ）。","o":["以义务为本位,是法律的本质特征","法律由立法机关制定或认可,体现了国家意志","法律具有强制性,只能通过司法予以实施和实现","法律的普遍性意味着在一国之内,所有人都应当享有相同的法律权利"],"a":"B","e":"\u0001法律以权利为本位,而不是义务。\u0002\nA✗ 法律以权利为本位,而不是义务\nB✓ 符合题意及现行制度规定（\u0001法律由立法机关制定或认可,体现了国家\u0002）\nC✗ 法律不仅能够通过司法实施或实现,还可通过执法、司法和守法实现\nD✗ 不是所有人的法律权利都完全相同","k":"","kb":14,"kh":[[0,27],[28,51]]},{"id":"2018-43","y":2018,"t":"多","s":"下列关于现代立法的表述,正确的有（ ）。","o":["立法是国家的一项专门职能活动","立法主体是特定的国家机关","立法是政府部门管理社会的手段","立法是国家治理法治化的一种方式"],"a":"ABD","e":"\u0001立法不是政府部门管理社会的手段,执法才是,显然。\u0002\nA✓ 符合题意及现行制度规定（\u0001立法是国家的一项专门职能活动\u0002）\nB✓ 符合题意及现行制度规定（\u0001立法主体是特定的国家机关\u0002）\nC✗ 立法不是政府部门管理社会的手段,执法才是,显然\nD✓ 符合题意及现行制度规定（\u0001立法是国家治理法治化的一种方式\u0002）","k":"","kb":14,"kh":[[0,27],[28,51]]},{"id":"2019-4","y":2019,"t":"单","s":"某设区的市的政府出台《规范操办酒席行为实施办法》,该办法规定:“除婚嫁酒、丧葬酒外的其他酒席一律视为违规酒席;复婚不准操办酒席。”同时规定:“群众操办婚嫁酒须填写申报表,并报区政府备案。”对此,下列说法正确的是（ ）。","o":["该办法不属于规范性法律文件","该办法规定群众办婚嫁酒须申报,不适当地增加了公民义务","该办法有关“复婚不准操办酒席”的规定,符合公序良俗原则","该办法对于“违规酒席”的界定,体现了社会主义法律文化的要求"],"a":"B","e":"\u0001根据《立法法》的规定,设区的市政府有权制定政府规章,因此,本题的《规范操办酒席行为实施办法》是政府规章,属于规范性法律文件。\u0002\nA✗ 根据\u0001《立法法》\u0002的规定,设区的市政府有权制定政府规章,因此,本题的\u0001《规范操办酒席行为实施办法》\u0002是政府规章,属于规范性法律文件\nB✓ 根据中国传统办酒席,是公民的权利,法无禁止即自由,政府不能够过多干涉\nC✗ 该办法规定复婚不准操办酒席,违反了公序良俗原则,该项 \"的规定也没有体现社会主义法 \"违规酒席项\nD✗ 对律文化的要求\n该办法要求办婚嫁酒进行申报,不适当地增加了公民义务。","k":"","kb":14,"kh":[[0,27],[227,297]]},{"id":"2019-11","y":2019,"t":"单","s":"我国刑法规定,“贪污数额巨大或者有其他严重情节的,处三年以上十年以下有期徒刑··\"。根据《最高人民法院、最高人民检察院关于办理贪污贿赂刑事案件适用法律若干问题的解释》,贪污或者受贿数额在二十万元以上不满三百万元的,应当认定为“数额巨大”。冯某贪污公款21万元,法院依法判处其三年有期徒刑。法院在该裁判中运用的主要推理方式是（ ）。","o":["演绎推理","类比推理","归纳推理","辩证推理"],"a":"A","e":"\u0001本案中,大前提是刑法和司法解释的规定,小前提是冯某贪污公款21万元,结论是法院判处三年有期徒刑。\u0002\nA✓ 本题是演绎推理,采用了典型的三段论推理方式,它是从一般到特殊的推理形式,即从一般的知识推出特殊知识的推理活动,它是一种必然推理\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选\n在法律推理过程中,演绎推理的特点是,法院有可以适用的法律规则和原则(大前提),也有通过审理确定的、可以归入该规则或案件的案件事实(小前提),由此法院可以作出一个确定的判决(结论)。","k":"","kb":17,"kh":[[12,57],[57,86]]},{"id":"2020-10","y":2020,"t":"单","s":"下列关于我国立法程序的表述,正确的是（ ）。","o":["立法程序包含了立法的步骤与方法","立法程序只能由《立法法》予以规定","立法程序在实际立法环节中可以调整甚至省略","法律的公布实行“谁制定,谁公布”原则"],"a":"A","e":"\u0001立法活动的工作程序大多不需要由法律加以规定,可以在具体立法活动中进行调整甚至省略。\u0002\nA✓ 根据\u0001《全国人民代表大会议事规则》\u0002和\u0001《全国人民代表大会常务委员会议事规则》\u0002的有关规定及我国的立法实践,我国最高权力机关及其常设机关立法的基本程序包括:法律草案的提出、法律草案的审议、法律草案的…\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 但立法程序则由法律明确规定,是一切有立法权的国家机关在所有立法环节中必须遵循的程序\nD✗ 我国法律的公布权是由国家主席根据最高权力机关的决定行使的,相关表述错 \" 谁制定,谁公布 \"\n根据\u0001《全国人民代表大会议事规则》\u0002和\u0001《全国人民代表大会常务委员会议事规则》\u0002的有关规定及我国的立法实践,我国最高权力机关及其常设机关立法的基本程序包括:法律草案的提出、法律草案的审议、法律草案的表决与通过、法律的公布等 法律的公布必须由特定的机关或人员采取特定的方式进行。 我国法律的公布权是由国家主席根据最高权力机关的决定行使的,“法律的公布实行谁制定,谁公布原则”错 \" 谁制定,谁公布 \"。","k":"","kb":14,"kh":[[0,27],[227,297]]},{"id":"2021-5","y":2021,"t":"单","s":"坚持立法公开,保障公众参与。这主要体现的立法原则是（ ）。","o":["人权原则","民主原则","科学原则","合宪原则"],"a":"B","e":"\u0001立法的民主原则,是指在立法过程中, 要体现和贯彻人民主权思想,集中和反映人民的智慧、利益、要求和愿望,使立法机关与人民群众相结合,使立法活动与人民群众参与相结合。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 坚持立法公开,保障公众参与体现了立法的民主原则\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选\n立法的民主原则应该包括两个方面:一是立法内容的民主,二是立法过程和立法程序的民主。","k":"","kb":14,"kh":[[0,27],[65,115]]},{"id":"2022-6","y":2022,"t":"单","s":"下列关于法律实施的表述,正确的是（ ）。","o":["政府向企业订购疫苗,属于执法行为","公安机关对寻滋事行为予以处罚属于法的适用","小王向有关部门提出环境保护立法建议属于守法","党组织对某党员作出纪律处分的决定属于司法"],"a":"C","e":"\u0001法律实施,也叫法的实施,是指法在社会生活中被人们实际施行,即在社会生活中通过执法、司法、守法等方式对法律的贯彻落实。\u0002\nA✗ 政府向企业订购疫苗不是在行使行政管理职权,而是以平等的身份参与市场活动,属于平等主体之间的民事活动,不属于执法行为\nB✗ 由于公安机关并不属于司法机关,公安机关对寻畔滋事行为予以处罚不属于法的适用(司法), 而属于执法\nC✓ 小王向有关部门提出环境保护立法建议属于积极守法\nD✗ 党组织也不属于司法机关,党组织对某党员作出纪律处分的决定不属于司法,属于党纪处分\n以实施主体和法的内容为标准,将法律实施的方式分为三种: 法律的遵守(守法)、法律的执行(执法)和法律的适用(司法)。 狭义上的执法专指国家行政机关和法律法规授权、行政主体委托的组织及其公职人员依照法定职权和程序行使行政管理职权、履行职责、实施法律的活动。 司法又被称为\"法的适用\",通常指国家司法机关依照法定职权和程序,具体应用法律处理各种案件的专门活动。 狭义上的法的遵守,又称守法,专指公民、社会组织和国家机关以法律为自己的行为准则,依照法律行使权利、履行义务的活动。 包括积极守法和消极守法(不违法)。","k":"","kb":15,"kh":[[0,15],[16,104]]},{"id":"2022-41","y":2022,"t":"多","s":"我国《长江保护法》第1条规定:“为了加强长江流域生态环境保护和修复,促进资源合理高效利用,保障生态安全,实现人与自然和谐共生、中华民族永续发展,制定本法。”该条立法所体现的社会发展理念有（ ）。","o":["共享","绿色","创新","协调"],"a":"ABCD","e":"\u0001法律助推五大社会发展理念,体现和保障创新、协调、绿色、开放、共享的社会发展。\u0002\nA✓ 符合题意及现行制度规定（\u0001共享\u0002）\nB✓ 依法推进入与自然和谐共生的绿色发展观,解决好人与自然和谐共生问题\nC✓ 符合题意及现行制度规定（\u0001创新\u0002）\nD✓ 依法增强社会发展的整体协调性\n依法实施创新驱动发展战略,将创新摆在第一位。 依法践行以人民为中心的共享发展思想,体现了我们党全心全意为人民服务的根本宗旨。 \"加强长江流域生态环境保护和修复,促进资源合理高效利用,保障生态安全,实现人与自然和谐共生、中华民族永续发展\" 体现了创新、协调、绿色、共享的社会发展理念。","k":"","kb":14,"kh":[[0,27],[28,51]]},{"id":"2022-42","y":2022,"t":"多","s":"下列关于立法的说法,正确的有（ ）。","o":["法律的废止属于立法活动","立法体制的核心是立法权的划分","联邦制国家一般采用一元立法体制","国家结构形式是影响一国立法体制形成的重要因素"],"a":"ABD","e":"\u0001立法,又称法的创制、法的创立,是指有立法权的国家机关或经授权的国家机关,依照法定的职权和程序,创制、认可、修改或废止法律和其他规范性法律文件的专门性活动。\u0002\nA✓ 立法,又称法的创制、法的创立,是指有立法权的国家机关或经授权的国家机关,依照法定的职权和程序,创制、认可、修改或废止法律和其他规范性法律文件的专门性活动\nB✓ 立法体制是关于立法权配置方面的组织制度,其核心是立法权限的划分问题\nC✗ 实行联邦制国家结构形式的国家,一般采用二元或多元立法体制\nD✓ 一般来说,国家结构形式对于立法体制形成的影响是非常明显的\n一个国家立法体制的形成,主要是由这个国家的国家性质、国家结构形式和文化传统等因素决定的。 实行单一制国家结构形式的国家,一般采用一元立法体制;","k":"","kb":14,"kh":[[0,27],[28,51]]},{"id":"2024-6","y":2024,"t":"单","s":"下列关于立法的表述,正确的是（ ）。","o":["我国的立法权全部由国家权力机关行使","法律案例经立法机关通过即产生法律效力","终止某些法律的效力不属于立法活动","立法应当尊重和体现客观规律"],"a":"D","e":"\u0001立法活动不仅须合宪合法，还应当科学合理，尊重和体现客观规律。\u0002\nA✗ 除人大及其常委会外，国务院制定行政法规、地方政府制定规章等均属广义立法，\u0001立法权并非全部由权力机关行使\u0002\nB✗ 法律案经立法机关表决通过后，还必须由国家主席等\u0001正式公布并达到施行日期\u0002方产生法律效力\nC✗ 立、改、废均属立法活动，依法\u0001废止或终止某些法律效力同样属于立法活动\u0002\nD✓ 依据《立法法》立法原则，科学立法要求\u0001立法应当尊重和体现社会发展客观规律\u0002\n我国广义立法体制包括\u0001制定、修改、废止\u0002三大活动；法案表决通过≠生效，必须经过\u0001公布\u0002程序。","k":"","kb":14,"kh":[[0,27],[28,51]]},{"id":"2025-2","y":2025,"t":"单","s":"奥斯丁认为:“法理学的科学是关注实在法的,或严格意义的法律,而不考虑这些法律的好或者坏。”埃尔利希认为:“法的发展的重心既不在于立法,也不在于法学或司法判决,而在于社会本身。”对此,下列说法正确的是（ ）。","o":["前者体现分析法学派的立场,后者体现社会法学派的立场","前者体现自然法学派的立场,后者体现社会法学派的立场","前者体现分析法学派的立场,后者体现历史法学派的立场","前者体现自然法学派的立场,后者体现历史法学派的立场"],"a":"A","e":"\u0001奥斯丁的说法体现分析法学派的观点。\u0002\nA✓ 埃尔利希的说法体现社会法学派的观点\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选\n分析法学派以实证主义哲学为基础,反对超越现行法律制度的任何企图,主张恶法亦法,它试图将价值考虑排除在法理学科学研究的范围之外,并把法理学的任务限定在分析和剖析实在法律制度的范围内。 社会法学派强调研究\"现实的法\",研究法律现实的各个方面,反对分析法学派仅仅对法律进行形式逻辑上的研究。 他们对于法律的来源、性质和作用的论述,着重于宣扬法的社会性。","k":"","kb":1,"kh":[[19,66],[126,168]]},{"id":"2025-3","y":2025,"t":"单","s":"关于我国的立法原则,下列说法正确的是（ ）。","o":["法制统一性要求立法合理规定权利与义务、权力与责任","立法过程和程序的民主性要求全体公民必须参与立法活动","立法内容的民主性要求立法体现人民的共同意志和根本利益","立法的科学性要求立法者像自然科学家一样创造和发明法律"],"a":"C","e":"\u0001\"立法合理规定权利与义务、权力与责任\"体现的是立法的科学性原则,而不是法制统一性要求。\u0002\nA✗ \"立法合理规定权利与义务、权力与责任\"体现的是立法的科学性原则,而不是法制统一性要求\nB✗ 立法过程和程序的民主性保障人民通过各种途径参与立法活动, 但这并不意味着全体公民必须直接参与立法活动\nC✓ 立法内容的民主性要求立法必须体现人民的共同意志和根本利益,这是立法民主性的核心要求,确保法律能够真正代表人民的利益\nD✗ 立法的科学性要求立法必须从实际出发,尊重客观规律,立法者应该把自己看作一个自然科学家,他不是在创造法律,不是在发明法律,而仅仅是在表述法律","k":"","kb":14,"kh":[[0,27],[28,51]]}]},{"sub":"法理学","name":"法律解释、推理与论证","w":2.0,"w5":1.8,"wh":1.6,"bt":"","pt":"近5年稳中有升·法条/案例结合客观题多","L":27,"qs":[{"id":"2005-9","y":2005,"t":"单","s":"通过分析某一法律规范在整个法律规范在整个法律体系的法律部门中的地位和作用,来揭示其内容和含义,这种法律解释的方法称为（ ）。","o":["文理解释","系统解释","目的解释","语法解释"],"a":"B","e":"\u0001文理解释、语法解释、文义解释,即文法解释,是指对法律条文的语法结构、文字排列和标点符号等进行分析,以便阐明法律的内容和含义。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 系统解释,即体系解释,是指分析某一法律规范在整个法律体系和所属法律部门中的地位和作用来揭示其内容和含义\nC✗ 目的解释,是指从制定某一法律的目的来解释法律\nD✗ 与题干设问或现行制度要件不符，故不选\n目的解释中的 \"目的\"包括原先制定该法律时的目的、该法律在当前条件下的需要、整部法律的目的、个别法条、个别制度的目的。","k":"","kb":16,"kh":[[0,19],[182,257]]},{"id":"2005-53","y":2005,"t":"多","s":"关于法律推理的表述,能够成立的是（ ）。","o":["法律推理是法律适用中的一种思维活动,其目的是为法律适用提供正当理由","英美法系中判例法的方法是对实质推理方法的运用","我国司法实施中运用的法律推理通常是演绎推理","辨证推理的主要作用是为了解决因法律规定的复杂性而引起的疑难问题"],"a":"ACD","e":"\u0001法律推理是指以法律与事实两个已知的判断为前提,运用科学的方法和规则,为法律适用提供正当理由的一种逻辑思维活动。\u0002\nA✓ 法律推理是指以法律与事实两个已知的判断为前提,运用科学的方法和规则,为法律适用提供正当理由的一种逻辑思维活动\nB✗ 因为英美法系中判例法的方法是类推,而类推属于形式推理方法\nC✓ 我国是成文法国家,司法实践中大量运用的推理是演绎推理,但也存在一定的类推\nD✓ 辩证推理,又称实质推理,是指当作为推理的前提是两个或两个以上的相互矛盾的法律命题时,借助于辩证思维从中选择出最佳的命题以解决法律问题","k":"","kb":17,"kh":[[0,11],[12,57]]},{"id":"2008-10","y":2008,"t":"单","s":"“不可抗力是指不能预见和不能避免的因素”。这一法律解释运用的主要方法是（ ）。","o":["语义解释","历史解释","目的解释","系统解释"],"a":"A","e":"\u0001所谓语义解释,是指按照法律条文的语言表述的字义、语法和通用的表达方式进行解释。\u0002\nA✓ 所谓语义解释,是指按照法律条文的语言表述的字义、语法和通用的表达方式进行解释\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选\n题干关于不可抗力的解释方法,明显属于语义解释。","k":"","kb":16,"kh":[[0,19],[182,257]]},{"id":"2009-50","y":2009,"t":"多","s":"下列关于法律解释的表述,能够成立的有（ ）。","o":["法律解释一般有待处理的案件引起","法律解释是一个客观的过程,不具有价值取向性","并不是所有的法律解释都具有法律效力","法律解释有时可以引起弥补立法不足的作用"],"a":"ACD","e":"\u0001法律解释是指一定的人或组织对法律规定含义的说明。\u0002\nA✓ 法律解释与具体案件关系密切,往往有待处理的案件引起\nB✗ 法律解释具有一定的价值取向性,是一个价值判断、价值选择的过程\nC✓ 法律解释分为正式解释和非正式解释,非正式解释是不具有法律约束力的解释\nD✓ 法律解释是弥补法律漏洞的重要手段,可以起到弥补立法不足的作用","k":"","kb":16,"kh":[[0,19],[20,71]]},{"id":"2010-13","y":2010,"t":"单","s":"最高人民法院和最高人民检察院对具体适用法律问题的解释有原则性分歧时,有权作出解释或决定的机关是（ ）。","o":["全国人民代表大会","全国人民代表大会常务委员会","国务院","中央政法委员会"],"a":"B","e":"\u0001依据题干考查要点，正确表述为“全国人民代表大会常务委员会”。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 符合题意及现行制度规定（\u0001全国人民代表大会常务委员会\u0002）\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选\n我国的司法解释分为最高人民法院的审判解释和最高人民检察院的检察解释,二者若发生了原则性分歧,则应报请全国人大常委会解释或决定,故选择\u0001“全国人民代表大会常务委员会”\u0002。","k":"","kb":16,"kh":[[117,162]]},{"id":"2011-13","y":2011,"t":"单","s":"出租车司机滕某因运送产妇就医闯红灯受到交警处罚。有评论认为,滕某虽然涉嫌违法,但情有可原,不应处罚。该评论意见的推理方式属于（ ）。","o":["演绎推理","归纳推理","类比推理","辩证推理"],"a":"D","e":"\u0001实质推理又称辩证推理,它是指当作为推理的前提包含两个或者两个以上的相互矛盾的命题时,借助于辩证思维从中选择出最佳的命题以解决法律问题。\u0002\nA✗ 演绎推理,即三段论推理,是从一般到特殊的推理,即根据一般性的知识推出关于特殊性的知识\nB✗ 归纳推理是从特殊到一般的推理,即从个别知识推出一般知识的推理\nC✗ 类比推理是一种从个别到个别的推理,即根据两类对象的某些属性的相似性推出它们在另一些属性方面也具有相似性的推理活动\nD✓ 法律推理可以分为形式推理和实质推理,其中实质推理又叫辩证推理\n形式推理可分为演绎推理、归纳推理、类比推理。 辩证推理主要适用于以下情况: (I)法律规定模糊不清; (2)出现法律空白或者漏洞; (3)法律竞合; (4)出现合法与合理的冲突。 辩证推理的作用主要是为了解决因法律规定的复杂性而引起的疑难问题。 题中的案例出现了合法与合理的冲突,因此属于辩证推理。","k":"","kb":17,"kh":[[12,57],[57,86]]},{"id":"2011-51","y":2011,"t":"多","s":"根据我国法律规定,下列国家机关中,享有正式法律解释权的有（ ）。","o":["全国人民代表大会","全国人民代表大会常务委员会","最高人民法院","最高人民检察院"],"a":"BCD","e":"\u0001其中立法解释是指全国人大常务委员会对法律的解释。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 立法解释是指全国人大常务委员会对法律的解释\nC✓ 审判解释是由最高人民法院对人民法院在审判过程中具体应用法律问题所作的解释\nD✓ 检察解释是由最高人民检察院对检察工作中具体应用法律问题所作的解释\n在我国,法律解释分为立法解释、司法解释和行政解释三种形式。 立法解释包括对宪法的解释和对法律的解释,这里所说的法律是指狭义的法律。 司法解释包括审判解释和检察解释。 行政解释是指由国务院及其主管部门对有关法律和法规进行的解释。 (在这里考生要注意,全国人民代表大会的职权和全国人大常委会的职权的区别,这是宪法学的重点内容。","k":"","kb":16,"kh":[[0,19],[71,117]]},{"id":"2012-13","y":2012,"t":"单","s":"我国《刑法》第264条规定:“盗窃公私财物, 数额较大或者多次盗窃的,处三年以下有期徒刑、拘役或者管制·....”检察官张某据此认为,马某多次盗窃,依法应当对其判处3年有期徒刑。张检察官所运用的法律推理是（ ）。","o":["类比推理","归纳推理","演绎推理","辩证推理"],"a":"C","e":"\u0001演绎推理的特点是:法院有可以适用的法律规则和原则(大前提),也有通过审理确定的、可以归入该规则或原则的案件事实(小前提),由此法院可以作出一个确定的判决(结论)。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✓ 演绎推理又称三段论推理,它是从一般到特殊的推理形式,即从一般的知识推出特殊知识的推理活动\nD✗ 与题干设问或现行制度要件不符，故不选\n它是一种必然性推理。 本题运用的是演绎推理,","k":"","kb":17,"kh":[[12,57],[86,117]]},{"id":"2012-14","y":2012,"t":"单","s":"我国《婚姻法》第21条第1款规定:“…… 子女对父母有赡养扶助的义务。”王律师认为,该规定中的“子女”既包括婚生子女,又包括非婚生子女、养子女和继子女。王律师采用的法律解释方法是（ ）。","o":["比较解释","扩充解释","字面解释","限制解释"],"a":"B","e":"\u0001法律解释是指一定的人或组织对法律规定含义的说明。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 扩充解释是指在法律条文的字面含义显然比立法原意窄时, 作出比字面含义广的解释\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选\n根据解释尺度的不同,法律解释可以分为限制解释、扩充解释与字面解释三种。 扩充解释不能任意扩大法律的内容,必须以立法意图、目的和法律原则为基 \" 是指婚生子女,王 \" 子女础。 本题中,通常意义上的 \" 的含义,属于扩充解释。 \" 子女律师扩充了","k":"","kb":16,"kh":[[0,19],[163,181]]},{"id":"2013-7","y":2013,"t":"单","s":"我国《刑法》第119条规定:“破坏·.....电力设备造成严重后果的,处十年以上有期徒刑、无期徒刑或者死刑。”甲破坏供电设备,导致某地发生大面积停电,直接经济损失达数亿元。法院审理时认为, 甲的行为导致经济损失数额特别巨大,应当属于“造成严重后果”的情形。法院对“造成严重后果”的理解属于（ ）。","o":["历史解释","文义解释","体系解释","限制解释"],"a":"B","e":"\u0001题于中,法院审理时认为,甲的行为导致 \" 的 \" 造成严重后果经济损失数额特别巨大,应当属于情形,经济损失巨大对应严重后果,完全是遵循法律规范的字面含义作出的解释,属于文义解释。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 题于中,法院审理时认为,甲的行为导致 \" 的 \" 造成严重后果经济损失数额特别巨大,应当属于情形,经济损失巨大对应严重后果,完全是遵循法律规范的字面含义作出的解释,属于文义解释\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选\n法律解释是对法律含义的说明,根据解释的方式不同,分为文义解释、体系解释、目的解释和历史解释。","k":"","kb":16,"kh":[[0,19],[182,257]]},{"id":"2013-11","y":2013,"t":"单","s":"下列关于法律推理的说法,正确的是（ ）。","o":["辩证推理和类比推理都属于实质推理","演绎推理与归纳推理都采用三段论的推理模式","类比推理在我国的司法活动中是被严格禁止的","归纳推理和类比推理主要适用于判例法系国家"],"a":"D","e":"\u0001形式推理包括演绎推理、归纳推理和类比推理。\u0002\nA✗ 类比推理属于形式推理\nB✗ 只有演绎推理采取三段论的推理形式\nC✗ 类比推理是判例法国家的基本法律推理方式,在我国一般是禁止的,但是法律并不禁止有利于被害人的推理,相关表述错在用词太绝\nD✓ 归纳推理是从特殊到一般的推理,主要适用于判例法国家\n法律推理分为形式推理和实质推理两大类。 演绎推理又称三段论推理,是从一般到特殊的推理形式,是成文法国家的一种主要推理方式; 类比推理是一种从个别到个别的推理,是判例法国家的一种主要推理方式。","k":"","kb":17,"kh":[[0,11],[12,57]]},{"id":"2014-50","y":2014,"t":"多","s":"下列选项中,满足辩证法律推理适用条件的有（ ）。","o":["某些法律规定明显落后于社会发展","同一位阶的法律规定之间存在抵触","因法律规定的复杂性引发了疑难问题","作为法律推理前提的两个法律命题相互矛盾"],"a":"ABCD","e":"\u0001实质推理又称辩证推理,它是指当作为推理的前提包含两个或者两个以上的相互矛盾的命题时,借助于辩证思维从中选择出最佳的命题以解决法律问题。\u0002\nA✓ 法律虽然有规定,但社会发展后,出现新的情况,适用这 \" 一规定明显不合理,即会出现冲突,因此可以适用辩证推理\nB✓ 同一位阶的法律规定之间存在抵触,也是两个相互矛盾的命题,适用辩证推理\nC✓ 辩证推理的作用主要是为了解决因法律规定的复杂性而引起的疑难问题,该项\nD✓ 实质推理又称辩证推理,它是指当作为推理的前提包含两个或者两个以上的相互矛盾的命题时,借助于辩证思维从中选择出最佳的命题以解决法律问题\n\u0001“某些法律规定明显落后于社会发展”\u0002法律虽然有规定,但社会发展后,出现新的情况,适用这 \" 一规定明显不合理,即会出现冲突,因此可以适用辩证推理。 “同一位阶的法律规定之间存在抵触”同一位阶的法律规定之间存在抵触,也是两个相互矛盾的命题,适用辩证推理。","k":"","kb":17,"kh":[[0,11],[118,175]]},{"id":"2015-12","y":2015,"t":"单","s":"下列关于法律解释的表述,正确的是（ ）。","o":["法官对法律规范的解释是有权解释","体系解释是不同于系统解释的一种解释方法","目的解释是根据司法者的主观意图所作的解释","文义解释是按照法律规范的字面含义所作的解释"],"a":"D","e":"\u0001在我国,有权解释包括立法解释、司法解释和行政解释,其中司法解释的主体是最高司法机关,而不能笼统地说法官对法律规范的解释是有权解释。\u0002\nA✗ 在我国,有权解释包括立法解释、司法解释和行政解释,其中司法解释的主体是最高司法机关,而不能笼统地说法官对法律规范的解释是有权解释\nB✗ 体系解释又称系统解释\nC✗ 目的解释是指从制定某一法律的目的来解释法律,是立法者的目的\nD✓ 文义解释,是指严格遵循法律规范的字面含义的一种以尊重立法者意志为特征的解释","k":"","kb":16,"kh":[[0,19],[182,257]]},{"id":"2016-13","y":2016,"t":"单","s":"下列关于法律解释的表述,正确的是（ ）。","o":["国家机关对法律所做的解释均为有权解释","我国法律解释体系包括立法解释和司法解释两种形式两种形式","历史解释方法既可用于正式解释,也可用于非正式解释","按解释尺度的不同可以将法律解释分为文义解释与体系解释"],"a":"C","e":"\u0001法律解释是指一定的人或组织对法律规定含义的说明。\u0002\nA✗ 不是所有的国家机关对法律所做的解释都是有权解释,只有立法解释、司法解释、行政解释才是有权解释\nB✗ 法律解释分为立法解释、司法解释和行政解释三种形式\nC✓ 历史解释是一种解释方法,既可以用于正式解释,也可以用于非正式解释\nD✗ 按照解释尺度的不同,法律解释可以分为限制解释、扩充解释与字面解释三种,法律解释的方法大体上可以概括为文义解释、历史解释、体系解释、目的解释等方法\n根据宪法和相关法律的规定,我国建立了以全国人大常委会的解释权为核心和主体的各机关分工配合的法律解释体制。 法律解释根据解释主体和解释的效力不同可以分为正式解释和非正式解释。 正式解释,有时也称有权解释,是指由特定的国家机关、官员或其他有解释权的人对法律作出的具有法律上约束力的解释。","k":"","kb":16,"kh":[[0,19],[182,257]]},{"id":"2016-47","y":2016,"t":"多","s":"下列关于法律推理的表述,正确的有（ ）。","o":["只有在执法和司法活动中,才存在法律推理","辩证推理是解决司法疑难案件重要的推理方式","英美法系国家司法活动中既会运用到归纳推理,也会运用到演绎推理","在一起案件中,主审法官在法无明文规定时依据当地习惯审理了该案,则他运用的是类比推理"],"a":"BC","e":"\u0001司法活动中,既会运用演绎推理,也会应用归纳推理,只不过在成文法国家,演绎推理是主要的推理方式,在判例法国家,归纳推理是主要的推理方式,但是不意味着司法活动只使用一种推理方式。\u0002\nA✗ 法律推理的应用范围特别广泛,立法、执法、司法、法律监督乃至公民的法律意识中都有法律推理的活动\nB✓ 辩证推理的作用主要是为了解决法律规定的复杂性而引起的疑难问题\nC✓ 司法活动中,既会运用演绎推理,也会应用归纳推理,只不过在成文法国家,演绎推理是主要的推理方式,在判例法国家,归纳推理是主要的推理方式,但是不意味着司法活动只使用一种推理方式\nD✗ 法官在无明文规定时适用习惯,使用的是演绎推理,只是推理的大前提不是法律规则,而是习惯,但是推理方式是演绎推理,不是类比推理\n演绎推理是从一般到特殊的推理形式,归纳推理是从特殊到一般的推理。 类比推理是从个别到个别的推理,它是根据两类对象的某些属性的相似性推出它们在另一些属性方面也具有相似性的推理活动,是或然推理。 辩证推理指当作为推理前提是两个或两个以上的相互矛盾的法律命题时,借助千辩证思维,从中选择最佳命题,以解决法律问题。","k":"","kb":17,"kh":[[12,57],[86,117]]},{"id":"2017-8","y":2017,"t":"单","s":"关于法律推理,下列说法正确的是（ ）。","o":["辩证推理是通过法官的主观想象获得合理裁判结论的推理过程","英美法系国家一般采用归纳推理,不用演绎推理","“类似案件,类似处理”是类比推理的基本要求","演绎推理的大前提通常是法律事实"],"a":"C","e":"\u0001归纳推理主要适用于判例法国家,但是英美法系国家也采用演绎推理,英美法系国家也有制定法,在适用制定法时需采用演绎推理。\u0002\nA✗ 辩证推理是法官对法律或案件客观事实的辩证推理过程,它必须建立在事物的辩证法的客观基础之上,而不是从法官的主观想象中得出结论\nB✗ 归纳推理主要适用于判例法国家,但是英美法系国家也采用演绎推理,英美法系国家也有制定法,在适用制定法时需采用演绎推理\nC✓ 类比推理是根据两类对象的某些属性的相似性推出它们在另一些属性方面也具有相似性,\"类似案件,类似 \" 是类比推理的基本要求\nD✗ 演绎推理处理的大前提是法律规则和原则,小前提是可以归入该规则或原则的案件事实","k":"","kb":17,"kh":[[0,11],[57,86]]},{"id":"2017-9","y":2017,"t":"单","s":"下列关于法律论证的理解,正确的是（ ）。","o":["法律论证与法律解释、法律推理之间不存在任何联系","法律论证的过程主要是协商的过程,不包含逻辑推理","法律论证的融贯性要求裁判过程中价值与事实相统一","法律论证结论的可接受性与司法独立之间存在矛盾关系"],"a":"C","e":"\u0001法律论证主要是指在司法过程中对判决理由的正当四合法性或合理性进行论证,即在诉讼过程中,诉讼主体运用证据确定案件事实、得出结论的思维过程。\u0002\nA✗ 法律论证实际上与论理解释中的目的解释和社会学解释以及实质推理异曲同工\nB✗ 法律论证必须依据基本的法律和社会规范以及合理的逻辑规则达成,在法律论证中需要遵循基本的形式逻辑规则\nC✓ 法律论证内容的融贯性要求法律体系本身的价值与事实、整体与部分、规则与原则原理与精神的系统性、连贯性和一致性,以及法律体系和外部社会之间的内外融贯\nD✗ 法律论证结论可能不被社会全体认同或接受,但至少应能够被公众理解,不存在重大的错误,这与司法独立没有矛盾,法院在栽判时应当独立裁判,但是在论证时应当考虑结论的可接受性","k":"","kb":17,"kh":[[0,11],[176,213]]},{"id":"2019-44","y":2019,"t":"多","s":"某区人民法院在审理一起民事案件时,依据全国人大常委会副委员长关于民法总则草案的说明, 对民法通则的有关条款作了解释。对此,下列说法不正确的有（ ）。","o":["该法院采用了比较法解释方法","该法院运用了文义解释方法","该法院的解释属于正式解释","该法院的解释同法律具有同等效力"],"a":"ABCD","e":"\u0001比较法解释是指通过比较外国的立法和判例及其原则、经验和效果,对本国法律进行解释, 本题是借鉴我国人大常委会副委员长的说明,而不是外国的立法,不是比较法解释。\u0002\nA✓ 比较法解释是指通过比较外国的立法和判例及其原则、经验和效果,对本国法律进行解释, 本题是借鉴我国人大常委会副委员长的说明,而不是外国的立法,不是比较法解释\nB✓ 文义解释(定义解释)是指按照法律条文的语言表述的字义、语法和通用的表达方式以及逻辑规律进行解释, 本题并没有对法条的文义进行解释,而是了解立法者的立法意图,所以,不是文义解释\nC✓ 在我国,只有最高人民法院的司法解释才是正式解释, 具有普遍约束力,区级人民法院的解释不是正式解释,也不具有普遍的约束力,该项\nD✓ 符合题意及现行制度规定（\u0001该法院的解释同法律具有同等效力\u0002）\n因此, 本题ABC","k":"","kb":16,"kh":[[71,117],[182,257]]},{"id":"2020-3","y":2020,"t":"单","s":"甲乙两家公司签订买卖合同,因卖方甲拒不履行交货义务,乙将其告上法院。法官依据我国《合同法》中“当事人一方不履行合同义务或者履行合同义务不符合约定的,应当承担继续履行、采取补救措施或者赔偿损失等违约责任”的规定,判决甲继续履行合同。法官运用的法律推理是（ ）。","o":["演绎推理","归纳推理","类比推理","辩证推理"],"a":"A","e":"\u0001演绎推理又可以称为三段论推理,它是从一般到特殊的推理形式,即从一般的知识推出特殊知识的推理活动。\u0002\nA✓ 演绎推理又可以称为三段论推理,它是从一般到特殊的推理形式,即从一般的知识推出特殊知识的推理活动\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选\n在法律推理过程中,演绎推理的特点是,法院有可以适用的法律规则或原则(大前提), 也有通过审理确定的、可以归入该规则或原则的案件事实(小前提),由此法院可以作出一个确定的判决 (结论)。 此案例中,\u0001《合同法》\u0002是法院适用的法律规则(大前提),甲乙公司的合同纠纷则是案件事实(小前提),由此法院作出甲继续履行合同的判决(结论)。","k":"","kb":17,"kh":[[12,57],[57,86]]},{"id":"2021-6","y":2021,"t":"单","s":"法学教授刘某结合我国现行相关法律,对《未成年人保护法》的条款进行解释。该法律解释的方法属于（ ）。","o":["文义解释","历史解释","目的解释","体系解释"],"a":"D","e":"\u0001体系解释,是指通过分析某一法律规范在整个法律体系和所属法律部门中的地位和作用,来揭示其内容和含义。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ 本题中,法学教授刘某结合我国相关法律解释\u0001《未成年人保护法》\u0002的条款,即分析\u0001《未成年人保护法》\u0002在整个法律体系和所属法律部门中的地位和作用,来解释其内容和含义,使用的解释方法是体系解释\n2021年全国法律硕士(非法学)联考真题答案详解专业综合课","k":"","kb":16,"kh":[[0,19],[182,257]]},{"id":"2022-44","y":2022,"t":"多","s":"判决理由的正当性论证需要达到一定的标准,这些标准包括","o":["效果最优性","程序合理性","逻辑有效性","内容融贯性"],"a":"ABCD","e":"\u0001对司法过程中判决理由的正当性论证需要达到一定的标准,这些标准有:(1)内容的融贯性。\u0002\nA✓ (4)效果最优性\nB✓ (2)程序的合理性\nC✓ (3)依据的客观性和逻辑有效性\nD✓ 对司法过程中判决理由的正当性论证需要达到一定的标准,这些标准有:(1)内容的融贯性","k":"","kb":17,"kh":[[176,213]]},{"id":"2023-5","y":2023,"t":"单","s":"根据我国刑法,在道路上醉酒驾驶机动车的,处拘役,并处罚金。法律专家陈某认为,该规定中的“机动车”不应包含由人力或畜力驱动的车辆。该解释属于（ ）。","o":["文义解释","目的解释","比较解释","历史解释"],"a":"A","e":"\u0001按照字面可能语义范围对“机动车”一词作出常规限定，属于文义解释。\u0002\nA✓ 从“机动车”一词的\u0001日常与法律规范字面含义\u0002出发排除人力畜力车，属于文义解释（语义解释）\nB✗ 目的解释是根据立法所欲实现的\u0001社会目的或宗旨\u0002进行的解释，本题直接依据词义边界判断\nC✗ 比较解释是援引外国法或判例加以参照说明的方法，题干未涉及\nD✗ 历史解释是通过考察立法史料与制定背景来阐释法意，题干未涉及\n\u0001文义解释\u0002是法律解释的首要且优先方法，任何实质论证都不得轻易突破词义的可能范围。","k":"","kb":16,"kh":[[0,19],[182,257]]},{"id":"2023-11","y":2023,"t":"单","s":"离婚诉讼中,夫妻双方围绕共同饲养宠物的归属问题产生争议。法官参照我国民法中关于子女抚养和探望等规定对该案作出相应裁判。本案法官所运用的法律推理是（ ）。","o":["演绎推理","归纳推理","类比推理","辩证推理"],"a":"C","e":"\u0001无直接对应规则时参照法律中关于最相似案件（子女抚养探望）的规定裁判，属于类比推理。\u0002\nA✗ 演绎推理是由一般明确规则推导出个别结论，本案并无现成宠物抚养规则作为大前提\nB✗ 归纳推理是从多个具体个案中抽象概括出一般法律原则或规则，并非直接援引类似条文\nC✓ 当法律存在空白时比照\u0001最相类似案件规则\u0002（宠物归属参照子女抚养探望）作出裁决，是典型\u0001类比推理\u0002\nD✗ 辩证推理侧重在冲突或模糊前提间作价值判断和权衡选择，而非单纯以最相似规则比附\n\u0001类比推理\u0002又称类推适用，常用于民事领域填补未作明文规定的漏洞，体现“类似案件类似处理”。","k":"","kb":17,"kh":[[12,57],[57,86]]},{"id":"2025-8","y":2025,"t":"单","s":"关于我国法律解释体制,下列说法正确的是（ ）。","o":["规章需要解释的,应报请国务院进行解释","全国人大常委会的法律解释同法律具有同等效力","地方性法规的具体应用问题,由制定法规的人大常委会进行解释","最高人民法院和最高人民检察院的司法解释如有原则性分歧,应报请全国人民代表大会解释或决定"],"a":"B","e":"\u0001规章解释权属于规章制定机关。\u0002\nA✗ 规章需要解释的,应由规章制定机关进行解释, 而非报请国务院进行解释\nB✓ 根据\u0001《立法法》\u0002的规定,全国人民代表大会常务委员会的法律解释同法律具有同等效力\nC✗ 凡属于地方性法规如何具体应用的问题,由省、自治区、直辖市人民政府主管部门进行解释\nD✗ 最高人民法院和最高人民检察院的解释如果有原则性的分歧,报请全国人民代表大会常务委员会解释或决定\n凡属于地方性法规条文本身需要进一步明确界限或作补充规定的,由制定法规的省、自治区、直辖市人民代表大会常务委员会进行解释或作出规定。","k":"","kb":16,"kh":[[71,117],[117,162]]},{"id":"2025-12","y":2025,"t":"单","s":"最高人民法院2023 年发布食品安全惩罚性赔偿典型案例,明确支持消费者维权行为和在生活消费范围内支持惩罚性赔偿请求,统一了相关案件的裁判规则。对此,下列表述正确的是（ ）。","o":["发布典型案例是一种准立法活动","参考典型案例裁判运用了归纳推理","参考典型案例裁判体现了“同案同判”的要求","发布典型案例体现了最高人民法院对地方各级人民法院的领导"],"a":"C","e":"\u0001发布典型案例是最高人民法院为了统一裁判规则、指导审判实践而进行的活动, 它并不直接创设新的法律规范,不属于准立法活动。\u0002\nA✗ 发布典型案例是最高人民法院为了统一裁判规则、指导审判实践而进行的活动, 它并不直接创设新的法律规范,不属于准立法活动\nB✗ 参考典型案例裁判运用了类比推理,不是归纳推理\nC✓ 类比推理就是\"类似案件,类似处理\",体现\"同案同判\" 的要求\nD✗ 人民法院的上下级是指导关系,不是领导关系,发布典型案例没有体现最高法对地方法院的领导","k":"","kb":17,"kh":[[57,86],[86,117]]},{"id":"2025-43","y":2025,"t":"多","s":"H 省某市初一学生王某被杀害。涉案的甲、乙、丙三名未成年犯罪嫌疑人被公安机关全部抓获,三人作案时均已满12 周岁不满14 周岁。H 省检察机关依法报最高人民检察院对甲、乙、丙核准追诉。最高人民检察院经审查,依据相关法律规定决定对甲、乙、丙核准追诉。关于检察机关在本案中的法律推理,下列说法正确的有（ ）。","o":["相关法律规定构成检察机关法律推理的大前提","检察机关的法律推理结果不影响当事人的权利和利益","检察机关进行推理的目的在于为法律适用提供正当理由","检察机关依法决定对甲、乙、丙核准追诉运用了演绎推理"],"a":"ACD","e":"\u0001本案中,检察机关依据相关法律规定对甲、乙、丙核准追诉,这些法律规定是检察机关进行法律推理的大前提。\u0002\nA✓ 本案中,检察机关依据相关法律规定对甲、乙、丙核准追诉,这些法律规定是检察机关进行法律推理的大前提\nB✗ 检察机关决定对甲、乙、丙核准追诉,这一结果直接影响了三名未成年犯罪嫌疑人的刑事责任和可能的刑罚\nC✓ 法律推理的结果与法律适用的理由相关,法律推理为适用结论提供正当理由,故推理过程实际上带有说明理由的成分\nD✓ 在本案中,检察机关依据相关法律规定(大前提)和甲、乙、丙的具体犯罪情况(小前提),推导出应对他们核准追诉的结论,运用的是演绎推理\n检察机关的法律推理结果会直接影响当事人的权利和利益。 法律推理的主要目的在于为法律适用提供正当理由。 演绎推理是从一般到特殊的推理过程,即从大前提(一般原则) 和小前提(案件事实)推导出结论。","k":"","kb":17,"kh":[[0,11],[12,57]]},{"id":"2026-5","y":2026,"t":"单","s":"李某驾驶已达到报废标准的机动车上路行驶,公安机关交通管理部门依法吊销他的机动车驾驶证,李某不服处罚,诉至人民法院。法院认为,《道路交通安全法》旨在维护道路交通秩序,保护人身安全,驾驶报废标准的机动车上路,会给社会公众带来极大安全隐患,取消驾驶资格可以避免以后出现同类违法行为。法院运用的法律解释方法是（ ）。","o":["文义解释","历史解释","目的解释","体系解释"],"a":"C","e":"\u0001目的解释是探求立法目的,本案法院引用《道路交通安全法》立法宗旨(保护公共安全)裁判,属于目的解释。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✓ 目的解释是探求立法目的,本案法院引用\u0001《道路交通安全法》\u0002立法宗旨(保护公共安全)裁判,属于目的解释\nD✗ 与题干设问或现行制度要件不符，故不选","k":"","kb":16,"kh":[[0,19],[182,257]]}]},{"sub":"法理学","name":"法的渊源、效力与分类","w":1.8,"w5":1.8,"wh":2.4,"bt":"新法","pt":"《对外关系法》域外效力等涉外法治考点","L":43,"qs":[{"id":"2005-4","y":2005,"t":"单","s":"关于法律效力的表述,正确的是（ ）。","o":["狭义的法律效力是指规范性法律文件的效力,广义的法律效力还包括共产党的政策的效力","我国法律的空间效力遵循以属地主义为主、以属人主义和保护主义为补充的原则","在我国的法律中,有些法律不仅在国内生效,而且根据国家主权原则还适用于国外发生的特定事件和行为","法律的时间效力就是指法律何时生效、何时终止效力的问题"],"a":"C","e":"\u0001相关表述 中\"狭义的法律效力是指规范性法律文件的效力\"正确,但\"广义的法律效力还包括共产党的政策的效力\"是错误的。\u0002\nA✗ \"狭义的法律效力是指规范性法律文件的效力\"正确,但\"广义的法律效力还包括共产党的政策的效力\"是错误的\nB✗ 我国法律的对人效力遵循以属地主义为主、以属人主义和保护主义为补充的原则\nC✓ 比如刑法对于在外国犯罪的中国公民也适用\nD✗ 法律的时间效力不仅仅包括法律何时生效、何时终止效力的问题,还包括法律是否具有溯及力的问题\n共产党的政策不是法律,当然谈不上具有法律约束力。 广义的法律效力除包括规范性法律文件的效力外,还包括非规范性法律文件的效力,比如人民法院生效判决的效力。 至于我国法律的空间效力,一般来说,我国法律适用于主权管辖范围内的全部领域,同时某些法律适用于国外发生的事件和行为。","k":"","kb":4,"kh":[[9,103],[103,144]]},{"id":"2005-8","y":2005,"t":"单","s":"关于当代中国法律渊源的表述,能够成立的是（ ）。","o":["就实行社会主义制度的大陆地区的法律渊源而言,可以概括为以宪法为核心、以行政法规为主的法律渊源","在我国,作为法律渊源之一的“法律”一词是在广义上使用的,除了指由国家最高权力机关及其常设机关制定的规范性文件外,还包括其他有立法权的机关制定的规范性文件","民族自治区人民代表大会制定的自治条例和单行条例,必须报全国人民代表大会常务委员会备案后才能生效","国际法不是构成我国现行法律体系的法律部门,但是我国签订或加入的国际条约是我国的法律渊源之一"],"a":"D","e":"\u0001内地的法律渊源以宪法为核心是正确的,但并非以行政法规为主,而是以法律为主,行政法规从属于法律。\u0002\nA✗ 内地的法律渊源以宪法为核心是正确的,但并非以行政法规为主,而是以法律为主,行政法规从属于法律\nB✗ 作为法律渊源之—的\"法律\"一词是在狭义上使用,仅指全国人大及其常委会制定的规范性法律文件\nC✗ 自治区的自治条例和单行条例,必须经全国人大常委会批准后才能生效, 并非\"备案\"后生效\nD✓ 国际法不构成我国的部门法\n国际法与国内法相对,是根据创制主体和适用主体的不同进行区分的; 而法律部门是根据调整对象和调整方法进行区分的。","k":"","kb":3,"kh":[[0,10],[11,103]]},{"id":"2005-14","y":2005,"t":"单","s":"关于法的分类的表述,能够成立的是（ ）。","o":["解决一般法与特别法冲突的原则是一般法优于特别法","实体法与程序法是按照法律适用范围的不同对法律所作的划分","英美法系法律的基本分类是公法和私法","从一定意义上讲,法的历史类型、法的渊源和法系等都可以看作是法的分类"],"a":"D","e":"\u0001解决一般法与特别法冲突的原则是特别法优于一般法,而不是相反。\u0002\nA✗ 解决一般法与特别法冲突的原则是特别法优于一般法,而不是相反\nB✗ 按照法律适用范围的不同对法律所作的划分是一般法与特别法\nC✗ 公法和私法是大陆法系法律的基本分类,英美法系法律的基本分类是普通法与衡平法\nD✓ 法的历史类型是按照法所据以产生和赖以存在的经济基础的性质和体现的阶级意志的不同,对人类社会的法所作的分类\n实体法与程序法是按照法律规定内容的不同为标准对法律的分类。 法的渊源是根据法的法律效力和地位的不同,对法所作的分类。 法系是根据若干国家和地区基于历史传统原因在法律实践和法律意识等方面所具有的共性而进行的对法律的一种分类,它是这些具有共性或共同传统的法律的总称。","k":"","kb":6,"kh":[[30,46],[110,195]]},{"id":"2007-1","y":2007,"t":"单","s":"划分一般法与特别法的标准是 （ ）。","o":["法律适用范围的不同","法律创制主体的不同","法律制定程序的不同","法律规定内容的不同"],"a":"A","e":"\u0001一般法是指针对一般人、一般事、一般时间、在全国普遍适用的法。\u0002\nA✓ 法律的一般分类划分一般法和普通法的标准是适用的范围不同\nB✗ 法律创制主体的不同,是划分国内法和国际法的标准\nC✗ 法律制定程序的不同,是划分根本法和普通法的标准\nD✗ 法德规定内容的不同是划分实体法和程序法的标准,题目要求\n特别法是指针对特定人、特定事、特定地区、特定时间有效的法律。","k":"","kb":6,"kh":[[30,46],[47,72]]},{"id":"2007-6","y":2007,"t":"单","s":"我国法律在对人的效力方面采用的原则是 （ ）。","o":["以属人主义为主,与属地主义、保护主义相结合的原则","以属地主义为主,与属人主义、保护主义相结合的原则","以保护主义为主,与属人主义、属地主义相结合的原则","以折中主义为主,与属地主义、保护主义相结合的原则"],"a":"B","e":"\u0001法律对人的效力在各国法律实践中先后采用过四种对人的效力的原则。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 任何侵犯本国利益的人,不论其国籍和所在地域,都受本国法律的追究\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选\n属人主义原则是法律只适用于本国人,不论其身在国内还是国外,非本国人即使在本国境内也不适用。 属地主义原则指法律适用于该国管辖的所有人,不论本国人还是外国人、外国籍人,本国人不在本国,则不受本国法律的约束。 保护主义原则是以维护本国利益作为是否适用本国法律的依据; 我国采用的是以属地主义为主,与属人主义、保护主义相结合的原则,既维护本国利益,坚持本国主权,又尊重他国主权,照顾法律适用中的实际可能性。","k":"","kb":4,"kh":[[9,103],[103,144]]},{"id":"2008-6","y":2008,"t":"单","s":"下列关于法的类别的表述,不正确的是（ ）。","o":["程序法有助于实体法的实现","合同法相对于民法而言是特别法","消费者权益保护法是程序法","行政法与刑法都是公法"],"a":"C","e":"\u0001消纲者权益保护法是关于保护消费者权益的规定,涉及的是消费者与产品生产者、销售者的权利义条关系,故应属于实体法。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✓ 消纲者权益保护法是关于保护消费者权益的规定,涉及的是消费者与产品生产者、销售者的权利义条关系,故应属于实体法\nD✗ 与题干设问或现行制度要件不符，故不选","k":"","kb":6,"kh":[[30,46],[73,89]]},{"id":"2008-7","y":2008,"t":"单","s":"以默示方式终止法律效力时,通常遵循的原则是（ ）。","o":["特别法优于一般法","后法优于前法","国际法优于国内法","法律优于行政法规"],"a":"B","e":"\u0001默示废止,是指在适用法规范出现新法和旧法冲突时,适用新法规范而使旧法规范在事实上废止。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 符合题意及现行制度规定（\u0001后法优于前法\u0002）\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 行政法规与法律抵触的,则归于无效,不会产生法律效力,自然也谈不上终止效力\n特别法优于一般法,国际法优于国内法,不会导致后者的效力终止,只是后者的适用效力受到限制而已, 若前者被取消,则后者的适用效力不再受前者限制。","k":"","kb":6,"kh":[[73,89],[90,109]]},{"id":"2008-14","y":2008,"t":"单","s":"下列选项中,属于我国非正式意义上的法律渊源的是（ ）。","o":["国际条约","湖北省的《野生动物保护条例》","国务院的《粮食购销条例》","最高人民法院的判例"],"a":"D","e":"\u0001我国正式意义上的法律渊源是各种成文法,包括法律、法规、规章和我国签署、批准、加入或者承认的国际条约。\u0002\nA✗ 我国正式意义上的法律渊源是各种成文法,包括法律、法规、规章和我国签署、批准、加入或者承认的国际条约\nB✗ 属于地方性法规、相关表述 属于行政法规,当然属于正式的法律渊源\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ 的判例,不具法律约束力,不属于正式的法律渊源\n\u0001“湖北省的野生动物保护条例”\u0002 属于地方性法规、“国务院的粮食购销条例” 属于行政法规,当然属于正式的法律渊源。","k":"","kb":3,"kh":[[11,103],[103,142]]},{"id":"2009-10","y":2009,"t":"单","s":"下列关于法律的强制性的表述,能够成立的是（ ）。","o":["公法具有强制性,而私法不具有强制性","人们遵守法律主是基于对法律强制性的恐惧","法律对于统治阶级内部的成员没有强制性","法律的强制性是法律发挥作用的最后保障"],"a":"D","e":"\u0001法的强制作用法的强制作用是在法可以用来制裁、强制、约束违法犯罪行为。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 人们遵守法律是法的各项作用共同作用的结果\nC✗ 法律面前人人平等,统治阶级内部的成员同样受到法的约束\nD✓ 法的强制作用是任何法都不可或缺的一种重要作用,是法的其他作用的保证\n强制、约束违法犯罪行为。","k":"","kb":6,"kh":[[110,195],[195,213]]},{"id":"2009-14","y":2009,"t":"单","s":"下列关于我国法的溯及力的表述，正确的是（ ）。","o":["刑法在溯及力问题上采用从新兼从轻的原则","行政法在溯及力问题上采用从旧兼从轻的原则","民法在溯及力问题上采用从新的原则","法治的一般要求是新法不具有溯及力"],"a":"D","e":"\u0001法治的基本要求是新法一般不具有溯及力（法不溯及既往）。\u0002\nA✗ 刑法在溯及力问题上采用\u0001从旧兼从轻\u0002原则，而非从新兼从轻\nB✗ 2009年考题时行政法尚未明文规定从旧兼从轻（注意2021年《行政处罚法》第37条已确立\u0001从旧兼从轻\u0002）\nC✗ 民法以\u0001法不溯及既往\u0002（从旧）为原则，而非一概采用从新原则\nD✓ 现代法治基于可预期性与信赖保护，一般要求\u0001新法不具有溯及力\u0002\n法的溯及力核心平衡法治可预期性与实质正义，我国《立法法》第104条原则上规定法律不溯及既往，但为更好保护公民法人权利和利益而作的特别规定除外。\n【修法提示】2021年修订《行政处罚法》第37条正式确立行政处罚“从旧兼从轻”原则（2009年出题时尚无该条，当时以“新法一般不具溯及力”作答；现行法下行政处罚亦采用从旧兼从轻原则）。","k":"","kb":4,"kh":[[145,241]]},{"id":"2010-6","y":2010,"t":"单","s":"下列选项中,不属于我国正式法律渊源的是（ ）。","o":["制定法","习惯法","国际惯例","国际条约"],"a":"B","e":"\u0001法律渊源是指法律的创制方式和表现形式,即法的效力渊源。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 符合题意及现行制度规定（\u0001习惯法\u0002）\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选\n我国法律的正式渊源包括: 宪法法律、行政法规地方性法规、自治条例和单行条例持别行政区的法律、行政规章、国际惯例、国际条约,不包括习惯法。","k":"","kb":3,"kh":[[11,103],[143,200]]},{"id":"2010-7","y":2010,"t":"单","s":"下列关于法的效力的表述,能够成立的是（ ）。","o":["法律应使人知晓,不知者不为罪","法律不经公布,就不具有效力","在现代社会,法律完全不具有溯及力","法的效力高低取决于其强制性程度"],"a":"B","e":"\u0001法律必须公布才会产生效力。\u0002\nA✗ 法律应为人知晓,但对于不知晓法律的人法律依然有效\nB✓ 符合题意及现行制度规定（\u0001法律不经公布,就不具有效力\u0002）\nC✗ 法律一般无溯及力, \" 原 \" 从旧兼从轻但特别情况下也有溯及力,我国采取则\nD✗ 法的效力高低不取决于其强制性程度,而是取决千法的制定机关","k":"","kb":3,"kh":[[11,103]]},{"id":"2011-3","y":2011,"t":"单","s":"以创制方式和表现形式为标准,法可以划分为（ ）。","o":["成文法和不成文法","根本法和普通法","一般法和特别法","实体法和程序法"],"a":"A","e":"\u0001法的分类主要有下列几种类型:(l)成文法和不成文法,这是按照法的创制方式和表达形式对法进行的分类。\u0002\nA✓ 法的分类主要有下列几种类型:(l)成文法和不成文法,这是按照法的创制方式和表达形式对法进行的分类\nB✗ (3) 根本法和普通法,这是根据法律的地位、效力、内容和指定的主一般法与特别体、程序的不同对法进行的分类\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ (2)实体法和程序法,这是按照法律规定的内容的不同对法进行的分类\n(4) 法,这是按照法的适用范围的不同对法所作的分类; (5)国内法和国际法,这是按照法律的创制主体和实用主体的不同而作的分类。","k":"","kb":6,"kh":[[9,29],[30,46]]},{"id":"2011-5","y":2011,"t":"单","s":"在对人的效力方面,我国法律所采用的原则是（ ）。","o":["以属地主义为主,以属人主义为补充","以属人主义为主,以属地主义为补充","以保护主义为主,以属人主义和属地主义为补充","以属地主义为主,以属人主义和保护主义为补充"],"a":"D","e":"\u0001我国法律对人的效力也遵循以属地主义为主、以属人主义和保护主义为补充的原则。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ 我国法律对人的效力也遵循以属地主义为主、以属人主义和保护主义为补充的原则\n2011年全国法律硕士(非法学)联考真题答案详解专业综合课","k":"","kb":4,"kh":[[9,103],[103,144]]},{"id":"2011-7","y":2011,"t":"单","s":"《中华人民共和国行政处罚法》于1996年3月 17日第八届全国人民代表大会第四次会议通过,1996 年3月17日中华人民共和国主席令第63号公布,自 1996年10月1日起施行。下列关于该法律的表述, 能够成立的是（ ）。","o":["从法的分类角度看,该法律属于根本法","从法的渊源角度看,该法律属于行政法规","从法的部门角度看,该法律属于行政法部门","从法的效力角度看,该法律属于附条件生效的法律"],"a":"C","e":"\u0001本题中, 行政处罚法是由全国人大通过的,在法律渊源上属于法律。\u0002\nA✗ 在根本法与普通法的分类中,根本法是指宪法,它在一个国家中享有最高的法律地位和最高的法律效力\nB✗ 本题中, 行政处罚法是由全国人大通过的,在法律渊源上属于法律\nC✓ 题中所指的行政处罚法因其调整的社会关系可被划分入行政法部门\nD✗ 行政处罚法属于第二种,而不是附条件生效的法律\n法的渊源又叫法源,分为实质意义上的法的渊源和形式意义上的法的渊源,法硕考试中所研究的法的渊源是形式意义上的法的渊源,是指法定的国家机关制定的不同效力的法的一种分类,即法的效力渊源。 当代中国法的渊源可以分为:宪法、法律、行 \" 邻政法规、行政规章、地方性法规、自治条例和单行条例、特别行政区法律、国际条约和国际惯例。 法律部门是指一个国家根据一定原则和标准划分本国同类法律规范的总称。 如果说法律渊源更多的是从法律的制定机关及其相应效力对法的一种分类,那么法律部门则主要是根据法本身所调整的社会关系的类型而对法作出的分类。 我国的法律部门的划分,一般包括:宪法和宪法相关法, 民商法,行政法,经济法,社会法,刑法,诉讼与非诉讼程序法。 普通法是指宪法以外的法律,其内容一般涉及或调整某一社会关系。 故\u0001“从法的分类角度看,该法律属于根本法”\u0002明显错误。 一般而言,法的时间效力是指法何时生效、何时失效、法的溯及力问题。 而法的生效时间主要有三种形式:自法律颁布之日起生效,由法律规定具体的时间,规定法律公布后符合一定条件时生效。","k":"","kb":6,"kh":[[30,46],[47,72]]},{"id":"2012-4","y":2012,"t":"单","s":"我国《刑法》第6条第2款规定:“凡在中华人民共和国船舶或者航空器内犯罪的,也适用本法。”该条文所体现的法律对人效力的原则是（ ）。","o":["属地主义","属人主义","保护主义","折中主义"],"a":"A","e":"\u0001对人的效力是指法律对谁有效力,适用于哪些人。\u0002\nA✓ 船舶和航空 \" 拟制的领土 \" ,是属地主义\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选\n法律的效力有空间效力、对人的效力和时间效力。 我国法律对人的效力遵循以属地主义为主、以属人主义和保护主义为补充的原则。","k":"","kb":4,"kh":[[9,103],[103,144]]},{"id":"2012-11","y":2012,"t":"单","s":"以法律的地位、效力、内容和制定主体为标准,法律可以分为（ ）。","o":["一般法与特别法","实体法与程序法","根本法与普通法","成文法与不成文法"],"a":"C","e":"\u0001实体法与程序法是以法律规定内容的不同为标准对法律进行的分类。\u0002\nA✗ 一般法与特别法是按照法律适用范围的不同对法律所作的分类\nB✗ 实体法与程序法是以法律规定内容的不同为标准对法律进行的分类\nC✓ 根本法与普通法是根据法律的地位、效力、内容和制定主体、程序的不同而对法律进行的分类\nD✗ 成文法与不成文法是以法律创制方式和表达形式的不同为标准对法律进行的分类\n国内法与国际法是按照法律的创制主体和适用主体的不同而作的分类。 考生在备考时,对于教材中出现的法律概念的分类情况,一定要掌握分类标准,这类内容一般只会以选择题的形式进行考查,所以不要求完全背诵下来,但是要能够根据分类标准对选项进行准确区分,例如本题中对于 \" 法律规则 \"的分类等。 \"的分类,再例如,对于 \"法律","k":"","kb":6,"kh":[[9,29],[30,46]]},{"id":"2012-49","y":2012,"t":"多","s":"下列选项中,属于我国法的正式渊源的有（ ）。","o":["《法律援助条例》","《中华人民共和国专利法》","《中华人民共和国澳门特别行政区基本法》","我国加入的《联合国国际货物销售合同公约》"],"a":"ABCD","e":"\u0001“法律援助条例” 属于行政法规。\u0002\nA✓ 属于行政法规\nB✓ 符合题意及现行制度规定（\u0001中华人民共和国专利法\u0002）\nC✓ 属于特别行政区基本法,属于基本法律\nD✓ 属于国际条约\n我国的法律渊源可以概括为以宪法为核心、以制定法为主的法律渊源,正式意义上的渊源有:宪法、法律、行政法规、地方性法规、自治条例和单行条例、特别行政区的法律、行政规章和国际条约、国际惯例。 \u0001“中华人民共和国专利法”\u0002属于法律; “中华人民共和国澳门特别行政区基本法”属于特别行政区基本法,属于基本法律; “我国加入的联合国国际货物销售合同公约” 属于国际条约。","k":"","kb":3,"kh":[[11,103],[143,200]]},{"id":"2013-5","y":2013,"t":"单","s":"在法的溯及力问题上,目前世界各国通行的原则是（ ）。","o":["从旧原则","从旧兼从轻原则","从新兼从轻原则","从新原则"],"a":"B","e":"\u0001所谓法的溯及力,就是指新法可否适用于其生效以前发生或正在发生的事件和行为,如果适用,则法具有溯及力。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 如果不能适用,则法没有溯及 \"的原则,这也是目前 \"从旧兼从轻力\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选\n我国立法坚持世界各国所普遍采取的一项原则。","k":"","kb":3,"kh":[[11,103]]},{"id":"2013-6","y":2013,"t":"单","s":"我国xx省人大常委会制定了《xx省食品卫生管理条例》。对此,下列说法不正确的是（ ）。","o":["该法规性质上属于行政法部门","该法规制定后,不必报全国人大常委会和国务院备案","该法规虽在该省范围内适用,但仍具有效力上的普遍性","该法规属于我国法律的正式渊源,该省法院审理相关案件时可直接适用"],"a":"B","e":"\u0001“该法规性质上属于行政法部门”\"是法律体系的分类。\u0002\nA✗ \"是法律体系的分类\nB✓ \u0001《立法法》\u0002规定,省级人大及其常委会制定的规范性法律文件是地方性法规,它在制定后应该报全国人大常委会和国务院备案\nC✗ 该法规作为地方性法规,在该省范围内普遍适用,仍具有效力上的普遍约束力,c\nD✗ 该法规属于我国法律的正式渊源,作为地方性法规当然可以被省法院所适用\n行政法作为一个 \"行政法部门法律部门,是规范和调整行政法律关系的法律的总称,是由众多的单行的法律、法规和规章以及其他规范性法律文件构成的,食品安全与卫生管理的规定属于行政法部门","k":"","kb":3,"kh":[[11,103],[143,200]]},{"id":"2013-13","y":2013,"t":"单","s":"甲、乙双方在油画买卖合同中约定:“本合同一式三份,经双方签字后生效。甲、乙各执一份,见证律师一份,均具有同等法律效力。”对此,下列说法正确的是（ ）。","o":["该约定中包含了合同生效的条件","该约定是甲乙双方所确立的授权性规则","该约定是甲乙双方所确立的义务性规则","该约定不关涉甲乙双方行为的法律后果"],"a":"A","e":"\u0001本题中的条文不是法律规则,BC项错 \" 本合同一式三份,经双方签字后生误。\u0002\nA✓ 符合题意及现行制度规定（\u0001该约定中包含了合同生效的条件\u0002）\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 题干中 \"表明了双方签字行为之效......均具有同等法律效力后的法律后果就是合同生效,各份合同都具有相同的法律效果","k":"","kb":9,"kh":[[0,14],[86,121]]},{"id":"2013-46","y":2013,"t":"多","s":"下列关于我国法律渊源的说法,正确的有（ ）。","o":["少数民族的习惯属于非正式的法律渊源","澳门特别行政区基本法在澳门属于根本法","我国已经加入的国际条约具有正式法律渊源的地位","按照我国有关法律的规定,国际惯例属于正式的法律渊源"],"a":"ACD","e":"\u0001正式渊源是指国家机关制定的具有法律效力的各种规范性法律文件,通常包括制定法、习惯法判例法和国际公约等。\u0002\nA✓ 非正式渊源包括习惯、判例、宗教规则、道德原则等\nB✗ 只有宪法才能被称为根本法,澳门特别行政区基本法在法律渊源中属于法律\nC✓ 符合题意及现行制度规定（\u0001我国已经加入的国际条约具有正式法律渊\u0002）\nD✓ 符合题意及现行制度规定（\u0001按照我国有关法律的规定,国际惯例属于\u0002）\n我国法律渊源可以分为正式渊源和非正式渊源。 CD 的说法也正确;","k":"","kb":3,"kh":[[11,103],[143,200]]},{"id":"2014-47","y":2014,"t":"多","s":"下列关于成文法与不成文法的表述,正确的有（ ）。","o":["习惯法是不成文法的一种形式","判例是成文法的一种形式","不成文法一般不具有法律效力 )。","成文法是国家立法机关创制的法"],"a":"AD","e":"\u0001成文法是指由国家特定机关制定和公布,并以成文形式出现的法律,又称制定法。\u0002\nA✓ 不成文法是指由国家认可其法律效力,但又不具有成文形式的法,习惯法和判例法都是不成文法的形式\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 不成文法也具有法律效力\nD✓ 成文法是指由国家特定机关制定和公布,并以成文形式出现的法律,又称制定法","k":"","kb":6,"kh":[[9,29]]},{"id":"2015-7","y":2015,"t":"单","s":"2011年,以缅甸人糯康为首的武装犯罪集团在湄公河流域劫持我国商船并杀害了13名中国船员。中国政府与泰国、缅甸和老挝三国联合采取抓捕行动,在境外将糯康等人抓捕归案。2013年,糯康等人被我国最高人民法院依法核准执行死刑。该案体现的法对人的效力原则是（ ）。","o":["属人主义","属地主义","折中主义","保护主义"],"a":"D","e":"\u0001法律对人的效力是指法律对谁有效力,适用于哪些人。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ 本题考查的是法律对人的效力的理解\n我国采用以属地主义为主,与属人主义、保护主义相结合的原则。 具体如下:中国公民在中国一律适用中国法,属于属地原则; 中国公民在外国犯罪,原则上仍适用中国法律,要根据国际条约规定,这个属于属人原则。 外国人在中国,除法律另有规定外,一般适用中国法律。 外国人在国外对中国或中国公民犯罪,按中国刑法规定最低刑为3年以上有期徒刑的,可以适用中国刑法,但是按照犯罪地的刑法不构成犯罪的除外。 本题中, 糯康(外国人)在我国域外杀害我国13名中国船员, 严重侵犯了中国的利益。 因此,属于保护原则。","k":"","kb":4,"kh":[[9,103],[103,144]]},{"id":"2015-48","y":2015,"t":"多","s":"下列关于“公法”和“私法”的论述,正确的有（ ）。","o":["公法调整国家利益,私法调整个人利益","保险法属于私法,食品安全法属于公法","公法和私法是普通法系国家的基本法律分类","公法和私法的分类源于古罗马法学家乌尔比安"],"a":"ABD","e":"\u0001现代西方法学著作认为, 公法是主要调整国家与普通个人之间关系的法律,私法主要是调整公民个人之间的关系。\u0002\nA✓ 现代西方法学著作认为, 公法是主要调整国家与普通个人之间关系的法律,私法主要是调整公民个人之间的关系\nB✓ 食品安全法属于行政法部门, 属于公法\nC✗ 普通法与衡平法是普通法法系的一种法律分类方法\nD✓ 公法与私法的分类源于古罗马法,它是在民法法系中适用的一种法律分类\n古罗马法学家乌尔比安提出,公法是关于罗马国家稳定的法律,私法是关于个人利益的法律。 一般认为,宪法、刑法、行政法属于公法; 民商法属于私法。 保险法属于民商法,属于私法;","k":"","kb":6,"kh":[[110,195],[195,213]]},{"id":"2015-49","y":2015,"t":"多","s":"下列关于法律渊源的表述,正确的有（ ）。","o":["法律的正式渊源通常包括制定法、习惯法、判例法等","在大陆法系国家中,判例一般不是法律的正式渊源","公共政策与习惯属于非正式法律渊源","我国的法律渊源中不包含国际惯例"],"a":"ABC","e":"\u0001正式渊源具有法律效力,一般包括制定法,习惯法和判例法。\u0002\nA✓ 正式渊源具有法律效力,一般包括制定法,习惯法和判例法\nB✓ 在大陆法系,判例一般不是正式渊源,正式渊源一般是制定法\nC✓ 法律渊源分为正式渊源和非正式渊源\nD✗ 当代中国法的非正式渊源包括政策、道德、习惯等\n非正式渊源没有法律效力,只有法律说服力。 习惯,政策,道德往往是非正式渊源, 当代中国的法律渊源比较复杂,对实行社会主义制度的中国内地的法律渊源而言,可以概括为以宪法为核心、以制定法为主的法律渊源。 正式意义上的渊源有:宪法、法律、行政法规、地方性法规、自治条例和单行条例、特别行政区的法律、行政规章、国际条约和国际惯例等。","k":"","kb":3,"kh":[[11,103],[143,200]]},{"id":"2016-3","y":2016,"t":"单","s":"下列关于法律作用的表述,正确的是（ ）。","o":["强制作用不属于法律的规范作用","只有公法才具有维护阶级统治的社会作用","法律的规范作用通过法律的社会作用来实现","法律的规范性与确定性特点使法律具有预测作用"],"a":"D","e":"\u0001从法的本质和目的的角度来看,法具有社会作用这两种作用是手段与目的的关系。\u0002\nA✗ 法的规范作用可以从大体上被概括为指引作用、评价作用、预测作用、教育作用、强制作用,强制作用属于法的规范作用,相关表述不\nB✗ 从法的本质和目的的角度来看,法具有社会作用这两种作用是手段与目的的关系\nC✗ 法是通过调整人们行为这种规范作用来实现维护社会经济基础和发展生产力的社会作用的,相关表述不\nD✓ 法之所以具有预测作用,是因为法具有规范性确定性的特点\n一切社会的法的作用都有规范作用和社会作用,不只是公法,私法也有这两种作用,\u0001“只有公法才具有维护阶级统治的社会作用”\u0002不正确。 从法是一种社会规范的角度来看,法具有规范作用; 法的规范作用可以从大体上被概括为指引作用、评价作用、预测作用、教育作用、强制作用,强制作用属于法的规范作用,“强制作用不属于法律的规范作用”不正确。 法的规范作用包括预测作用,是指人们根据法可以预先估计人们相互间将怎样 2016年全国法律硕士(非法学)联考真题答案详解专业综合课行为以及行为的后果等,从而对自己的行为作出合理的安排。","k":"","kb":7,"kh":[[11,121],[122,146]]},{"id":"2016-5","y":2016,"t":"单","s":"下列选项中,属于我国正式法律渊源的是（ ）。","o":["《中国共产党章程》","最高人民法院发布的指导性案例","国务院颁布的《职工带薪年休假条例》","某市滨湖区政府发布的《外来务工人员管理暂行办法》"],"a":"C","e":"\u0001“最高人民法院发布的指导性案例”是指导性案例,不具有强制力,不是正式的法律渊源。\u0002\nA✗ 选项是政党的规则,不是我国正式的法律渊源\nB✗ 是指导性案例,不具有强制力,不是正式的法律渊源\nC✓ 是行政法规,是正式的法律渊源\nD✗ 与题干设问或现行制度要件不符，故不选\n当代中国的正式法律渊源有宪法、法律、行政法规、地方性法规、自治条例和单行条例、特别行政区的法律、行政规章、国际条约和国际惯例。 \u0001“中国共产党章程”\u0002是政党的规则,不是我国正式的法律渊源。 “国务院颁布的职工带薪年休假条例”是行政法规,是正式的法律渊源。 相关表述不是行政规章,区级政府尤权制定行政规章,相关表述不是正式的法律渊源。","k":"","kb":3,"kh":[[11,103],[103,142]]},{"id":"2016-6","y":2016,"t":"单","s":"2013年5月,某外国人在我国境内运输毒品 2千克,人民法院依据《中华人民共和国刑法》判处其无期徒刑。该案所体现的我国法律效力的原则是 （ ）。","o":["属人主义","保护主义","属地主义","折中主义"],"a":"C","e":"\u0001法律效力是指法律对哪些人,在什么空间、时间范围内有效。\u0002\nA✗ 属人主义是刑法对中国公民在中国领域外犯罪的效力,本题中的犯罪人是外国人,对其适用我国刑法,不可能是属人主义,相关表述不\nB✗ 保护主义是刑法对外国人在中国领域外犯罪的效力,但是本题中的犯罪发生在中国领域内,所以不是保护主义\nC✓ 本题中,某外国人在我国境内运输毒品,犯罪行为发生在我国境内,适用我国刑法,属于属地主义\nD✗ 折中主义,即以属地主义为主,与属人主义、保护主义相结合的原则, 就本题的个案而言,更体现属地主义原则\n法律的空间效力,是指法律在哪些地域范围内发生效力。 属人主义是刑法对中国公民在中国领域外犯罪的效力,本题中的犯罪人是外国人,对其适用我国刑法,不可能是属人主义,\u0001“属人主义”\u0002不正确。","k":"","kb":4,"kh":[[9,103],[103,144]]},{"id":"2016-10","y":2016,"t":"单","s":"下列关于法律分类的表述,正确的是（ ）。","o":["公法和私法的界限在当代呈现出日益模糊的趋势","普通法是在对衡平法修改和补充的基础上形成的","公法和私法的划分最早由古罗马法学家盖尤斯提出","一般而言,普通法相当于私法,衡平法相当于公法 )。"],"a":"A","e":"\u0001现代西方法学著作认为,公法主要是调整国家与普通个人之间关系的法律,私法主要是调整公民个人之间的关系3 在当代,公法与私法的界限日益模糊,出现了兼备公法和私法特征的法律,如经济法。\u0002\nA✓ 现代西方法学著作认为,公法主要是调整国家与普通个人之间关系的法律,私法主要是调整公民个人之间的关系3 在当代,公法与私法的界限日益模糊,出现了兼备公法和私法特征的法律,如经济法\nB✗ 普通法专指英国在11世纪后由法官通过判决形式逐渐形成的适用于全英格兰的一种判例法,衡平法是指英国在l4世纪后对普通法的修正和补充而出现的一种判例法\nC✗ 公法与私法的分类最早由古罗马学家乌尔比安提出,公法是关于罗马国家的法律,私法是关于个人利益的法律\nD✗ 普通法与私法、衡平法与公法没有对应关系,衡平法也有调整公民之间关系的判例","k":"","kb":6,"kh":[[47,72],[110,195]]},{"id":"2016-46","y":2016,"t":"多","s":"下列选项中,属于我国法的效力终止方式的有()。·","o":["由新法明确规定废止旧法","法在完成特定的历史任务后不再适用","新法中与旧法相抵触的条款自动终止效力","有权的国家机关发布专门的决议、决定,废除某些法律"],"a":"ABD","e":"\u0001法律效力的终止是指通过明令废止或默示废止的形式而终止某一法律的效力。\u0002\nA✓ 明示废止是指在新法或其他法律文件中明文规定废止旧法,相关表述\nB✓ 法在完成特定的历史任务后不再适用,也是法的效力的终止方式,是自然失效\nC✗ 旧法中与新法相抵触的条款自动终止效力,是默示废止,不是新法与旧法冲突的条款自动终止效力\nD✓ 符合题意及现行制度规定（\u0001有权的国家机关发布专门的决议、决定,\u0002）\n明示废止是指在新法或其他法律文件中明文规定废止旧法,\u0001“由新法明确规定废止旧法”\u0002 默示废止,是指在适用法律上出现新法与旧法冲突时,适用新法而使旧法在事实上废止。","k":"","kb":3,"kh":[[11,103]]},{"id":"2017-51","y":2017,"t":"多","s":"关于不同法律之间的关系,下列表述正确的有（ ）。","o":["宪法与物权法是根本法与普通法的关系","刑法与刑事诉讼法是实体法与程序法的关系","公务员法与律师法是一般法与特别法的关系","我国领海及毗连区法与联合国海洋法公约是国内法与国际法的关系"],"a":"ABD","e":"\u0001根本法即宪法,普通法是指宪法以外的法律,在我国宪法是根本法,物权法是普通法。\u0002\nA✓ 根本法即宪法,普通法是指宪法以外的法律,在我国宪法是根本法,物权法是普通法\nB✓ 实体法是指以规定和确认权利与义务或职权与职责为主的法律,程序法是指以保证权利和义务得以实施或职权和职责得以履行的有关程序为主的法律,刑法是实体法,刑事诉讼法是程序法\nC✗ 律师不属于公务员,\u0001《公务员法》\u0002与\u0001《律师法》\u0002不是一般法与特别法的关系\nD✓ 我国领海及毗连区法是由全国人民代表大会常务委员会制定的, 是国内法,联合国海洋法公约是国际条约,是国际法\n根据法律的地位、效力、内容和制定主体、程序的不同,法律可以分为根本法与普通法。 以法律规定内容的不同为标准,法律可分为实体法与程序法。 按照法律的创制主体和适用主体的不同,法律可分为国内法与国际法。 国内法是指在一主权国家内,由特定国家法律创制机关创制的并在本国主权所及范围内适用的法律,国际法是由参与国际关系的国家或组织通过协议制定或认可的,并适用于国家之间的法律,其形式一般是国际条约和国际协议等。 按照法律适用范围的不同,法律可分为一般法和特别法。","k":"","kb":6,"kh":[[30,46],[73,89]]},{"id":"2018-4","y":2018,"t":"单","s":"我国《网络安全法》自2017年6月1日起施行。关于该法的效力,下列表述正确的是（ ）。","o":["该法生效后,并不影响以往规范网络活动的行政法规的效力","该法对2017年6月1日之前的网络活动,一般无溯及既往的效力","外国人和无国籍人在中国境内,可以不受该法的约束","该法对中国境内所有的网络活动都有约束力,这是属人原则的体现"],"a":"B","e":"\u0001我国一般情况下,坚持 \"的原则。\u0002\nA✗ 考查法的效力\nB✓ 我国一般情况下,坚持 \"的原则\nC✗ 适用属地主义,外国律不溯及既往人和无国籍人在我国境内受\u0001《网络安全法》\u0002约束\nD✗ 是属地主义的表现\n一般而言,新法是优于旧法的;","k":"","kb":4,"kh":[[9,103],[103,144]]},{"id":"2019-3","y":2019,"t":"单","s":"我国《民法总则》已于2017年10月1日施行, 但《民法通则》并未废止。在两法并存共用阶段,对于同一事项二者有不同规定的,适用原则应该是 （ ）。","o":["法不溯及既往","新法优于旧法","特别法优于一般法","上位法优于下位法"],"a":"B","e":"\u0001新法优于旧法,即在同一位阶的法律之间,两者对同一事项规定不一样的,新颁布的法律优先适用。\u0002\nA✗ 我国法律一般坚持 \" 从旧 \"的原则,但也有例外,如我国刑法采取及既往 \"的原则,本题间的是民法,不涉及该原则,所兼从轻以\nB✓ 根据新法优于旧法的原则,两者对同一事项规定不一致的,适用\u0001《民法总则》\u0002\nC✗ \u0001《民法总则》\u0002和\u0001《民法通则》\u0002都是一般法\nD✗ \u0001《民法总则》\u0002和\u0001《民法通则》\u0002位阶相同,不存在上下位之分\n\u0001《民法总则》\u0002和\u0001《民法通则》\u0002都是法律,位阶相同,只是\u0001《民法总则》\u0002相对于\u0001《民法通则》\u0002来说是新法。 另外,我国法的效力层次可以概括为:(1)上位法效力高于下位法,即规范性法律文件的效力层次决定于其制定主体的法律地位; (2)特别法优于一般法,指在同一位阶 2019年全国法律硕士(非法学)联考真题答案详解专业综合课的法律之间,特别法优于一般法。 同一事项,两种法律都有规定的,特别法比一般法优先,优先适用特别 \" 法不溯法; (3)新法优于旧法。","k":"","kb":5,"kh":[[23,109]]},{"id":"2019-10","y":2019,"t":"单","s":"《最高人民法院关于案例指导工作的规定》第七条:“最高人民法院发布的指导性案例,各级人民法院审判类似案件时应当参照。”下列对于该规定的理解,正确的是（ ）。","o":["人民法院参照指导性案例审理类似案件体现了“同案同判”的要求","最高人民法院发布的指导性案例具有普遍的法律约束力","最高人民法院发布指导性案例属于立法活动","指导性案例是当代中国的判例法"],"a":"A","e":"\u0001立法活动是指有立法权的国家机关或者经授权的国家机关,依照法定的职权和程序,创制、认可、修改或者废止法律和其他规范性法律文件的专门性活动。\u0002\nA✓ 指导性案 \" 同案例方便人民法院审理类似案件时参照,体现了 \"的要求\nB✗ 我国不是判例法国家,最高人民法院发布的指导性案例不是判例,不具有普遍的法律约束力, 因此也不是立法活动,BCD项\nC✗ 立法活动是指有立法权的国家机关或者经授权的国家机关,依照法定的职权和程序,创制、认可、修改或者废止法律和其他规范性法律文件的专门性活动\nD✗ 与题干设问或现行制度要件不符，故不选","k":"","kb":3,"kh":[[11,103],[103,142]]},{"id":"2020-2","y":2020,"t":"单","s":"下列关于法律对人的效力的表述,正确的是（ ）。","o":["法律适用于本国境内的所有人,是属人主义的表现","法律适用于本国境外的本国人,体现了属地主义","以属人主义为主兼采属地主义,是折中主义的核心内涵","本国法律对外国人在国外侵害本国利益的行为同样适用,是保护主义的体现"],"a":"D","e":"\u0001折中主义,即以属地主义为主,与属人主义、保护主义相结合的原则。\u0002\nA✗ 属人主义,即法律只适用于本国人,不论其身在国内还是国外\nB✗ 属地主义,即不论本国人或外国人,凡居住在本国管辖领域内的人一律适用本国法律\nC✗ 折中主义,即以属地主义为主,与属人主义、保护主义相结合的原则\nD✓ 保护主义,即以维护本国利益为基础,不管是什么国籍的人,在什么地方的行为,只要侵害了本国的利益,就适用本国的法律\n相关表述体现了属地主义,相关表述体现的是属人主义,折中主义是以属地主义为主","k":"","kb":4,"kh":[[9,103],[103,144]]},{"id":"2023-3","y":2023,"t":"单","s":"有观点认为,在司法过程中,法官像化学家一样合成司法裁决这一化合物,可供法官利用的原料有制定法、习惯、共同的正义和道德标准等。这里的“原料”指的是（ ）。","o":["法律事实","法律渊源","法律意识","法律规范"],"a":"B","e":"\u0001法官裁判时据以参照和援引的制定法、习惯、正义道德标准统称为法律渊源。\u0002\nA✗ 法律事实是指能够引起法律关系产生、变更和消灭的\u0001客观情况\u0002（事件或行为），并非裁判规范原料\nB✓ 制定法属于\u0001正式法律渊源\u0002，习惯、正义与道德标准属于\u0001非正式法律渊源\u0002，均是司法裁判的依据原料\nC✗ 法律意识是人们对法律现象的思想、观点与心理的总称，不是直接的规范素材\nD✗ 道德标准与一般正义理念尚未上升为具体规则，不能等同于\u0001法律规范\u0002\n法的渊源在当代法理学中主要指\u0001裁判大前提的合法性来源\u0002，分为正式渊源与非正式渊源。","k":"","kb":3,"kh":[[11,103],[143,200]]},{"id":"2023-9","y":2023,"t":"单","s":"甲国公民X乘坐船籍登记地为乙国的游轮,行至公海时被丙国公民Y打伤,后甲国法院依据甲国法对Y进行审判。该案体现的法对人的效力原则是（ ）。","o":["属地主义","保护主义","属人主义","折中主义"],"a":"B","e":"\u0001保护本国及本国公民境外受侵害权益而管辖外国人的，体现保护主义原则。\u0002\nA✗ 游轮船籍为乙国且案发于公海，\u0001不属于甲国领域或拟制领土\u0002，非属地主义\nB✓ 丙国公民在境外损害甲国公民利益而由甲国法追究责任，适用\u0001保护主义原则\u0002\nC✗ 属人主义管辖的是本国公民，本案被审判的被告Y是\u0001丙国公民\u0002（外国人）\nD✗ 折中主义是各国整体立法体制的综合原则，本题具体管辖依据直指\u0001保护本国人法益\u0002\n注意辨析属地主义含本国船舶航空器（\u0001拟制领土\u0002）；外国人侵害本国公民启动追责才体现\u0001保护主义\u0002。","k":"","kb":4,"kh":[[9,103],[103,144]]},{"id":"2023-10","y":2023,"t":"单","s":"甲省人大常委会根据《妇女权益保障法》制定了《甲省〈妇女权益保障法〉实施办法》。对此，下列说法正确的是（ ）。","o":["该办法属于地方政府规章","该办法是《妇女权益保障法》的下位法","该办法是《妇女权益保障法》的特别法","该办法可以根据当地特点对《妇女权益保障法》的规定作出变通规定"],"a":"B","e":"\u0001省级人大常委会制定的《实施办法》属于地方性法规，是全国人大常委会制定法律的下位法。\u0002\nA✗ 该办法由\u0001省人大常委会\u0002制定，属于地方性法规而非省政府制定的地方政府规章\nB✓ 我国《立法法》确立法律高于地方性法规，省人大常委会实施办法属于\u0001《妇女权益保障法》的下位法\u0002\nC✗ 特别法与一般法之分适用于\u0001同一机关制定\u0002的同位阶规范之间，上下位法不构成一般法与特别法关系\nD✗ 只有民族自治地方的\u0001自治条例和单行条例\u0002方可依法作变通规定，一般省级地方性法规无权变通法律\n牢记法源位阶：宪法 > 法律 > 行政法规 > 省级地方性法规 > 设区的市地方性法规及本级/下级政府规章。","k":"","kb":6,"kh":[[73,89]]},{"id":"2024-42","y":2024,"t":"多","s":"全国人大常委会通过的《对外关系法》第二条规定,中华人民共和国发展同各国的外交关系和经济、文化等各领域的交流与合作,发展同联合国等国际组织的关系,适用本法。对此下列说法正确的有（ ）。","o":["《对外关系法》属于国际法","《对外关系法》属于宪法相关法","《对外关系法》属于非基本法律","第二条规定了该法的域外效力"],"a":"BC","e":"\u0001全国人大常委会通过的《对外关系法》属于我国宪法相关法部门，且属于非基本法律。\u0002\nA✗ 《对外关系法》由我国全国人大常委会制定，属于\u0001国内法\u0002而非国家间协议形成的国际法\nB✓ 调整国家主权对外交往原则与体制机制的《对外关系法》，在法律体系部门划分上属于\u0001宪法及宪法相关法\u0002部门\nC✓ 依据《宪法》第62条和第67条，只有全国人大制定和修改基本法律，由\u0001全国人大常委会\u0002通过的法律属于\u0001非基本法律\u0002\nD✗ 第2条仅确立中国发展对外外交与经济文化交流关系适用本法的一般适用范围，尚未规定具体\u0001域外适用效力条款\u0002（域外效力条款见后续反制与管辖专条）\n新法考点连记：全国人大常委会制定的全是\u0001非基本法律\u0002；《对外关系法》属于国内法中的\u0001宪法相关法\u0002。","k":"","kb":5,"kh":[[23,37],[175,237]]},{"id":"2025-4","y":2025,"t":"单","s":"为规范学位授予工作,保护学位申请人的合法权益,保障学位质量,全国人大常委会
