,"kh":[[105,193],[248,266]]},{"id":"2019-16","y":2019,"t":"单","s":"根据我国宪法和法律,设区的市的人大及其常委会可以制定地方性法规。下列事项中,属于该立法权限的是（ ）。","o":["环境保护","税收征收管理","外贸基本制度","本级人民政府的职权"],"a":"A","e":"\u0001依据题干考查要点，正确表述为“环境保护”。\u0002\nA✓ 根据\u0001《立法法》\u0002相关规定,设区的市的人民代表大会及其常务委员会根据本市的具体情况和实际需要,在不同宪法、法律、行政法规和本省、自治区的地方性法规相抵触的前提下,可以对城乡建设与管理环境保护、历…\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选\n根据\u0001《立法法》\u0002相关规定,设区的市的人民代表大会及其常务委员会根据本市的具体情况和实际需要,在不同宪法、法律、行政法规和本省、自治区的地方性法规相抵触的前提下,可以对城乡建设与管理环境保护、历史文化保护等方面的事项制定地方性法规,法律对设区的市制定地方性法规的事项另有规定的,从其规定。\n【修法提示】2023年《立法法》修改将设区的市地方性法规立法权限中的“环境保护”扩展为“生态文明建设”，并新增“基层治理”一项（共四方面事项）。","k":"","kb":36,"kh":[[372,460]]},{"id":"2019-26","y":2019,"t":"单","s":"下列关于社会保障权的表述,正确的是（ ）。","o":["社会保障权包括退休人员生活保障权、物质帮助权等内容","1999年宪法修正案强化了对公民社会保障权的保护","国家不负有保障社会保障权实现的义务","社会保障权是一种消极权利"],"a":"A","e":"\u0001社会保障权是一项基本人权,包括退休人员的生活保障权、物质帮助权等方面的内容,相关表述\" 国家建立健全同正确。\u0002\nA✓ 社会保障权是一项基本人权,包括退休人员的生活保障权、物质帮助权等方面的内容,相关表述\" 国家建立健全同\nB✗ 2004年宪法修正案增加了 \"的条款,强化经济发展水平相适应的社会保障制度了对公民社会保障权的保护,不是1999年宪法修正案\nC✗ 国家负有保障社会保障权实现的义务,社会保障权是一种积极权利,该项\nD✗ 与题干设问或现行制度要件不符，故不选","k":"","kb":36,"kh":[[0,23],[254,301]]},{"id":"2019-45","y":2019,"t":"多","s":"某村5名初中生缀学,家长听之任之。镇政府对家长进行了批评教育,要求他们送子女返校读书。根据我国宪法和法律,下列表述正确的有 （ ）。","o":["学生家长应保障子女接受义务教育","受教育既是公民的权利,也是公民的义务","镇政府有保障适龄儿童、少年接受义务教育的职责","子女教育应由家长负责,镇政府的行为侵犯了家长的监护权"],"a":"ABC","e":"\u0001《义务教育法》第5条规定:各级人民政府及其有关部门应当履行本法规定的各项职责,保障适龄儿童、少年接受义务教育的权利。\u0002\nA✓ 社会组织和个人应当为适龄儿童、少年接受义务教育创造良好的环境\nB✓ \u0001《宪法》\u0002第46 条规定:中华人民共和国公民有受教育的权利和义务\nC✓ 同时镇政府的行为并没有侵犯家长的监护权\nD✗ 与题干设问或现行制度要件不符，故不选\n适龄儿童、少年的父母或者其他法定监护人应当依法保证其按时入学接受并完成义务教育。 依法实施义务教育的学校应当按照规定标准完成教育教学任务,保证教育教学质量。 \u0001《宪法》第58条\u0002规定:适龄儿童、少年的父母或者其他法定监护人无正当理由未依照本法规定送适龄儿童、少年入学接受义务教育的, 由当地乡镇人民政府或者县级人民政府教育行政部门给予批评教育,责令限期改正。","k":"","kb":36,"kh":[[0,23],[24,63]]},{"id":"2021-14","y":2021,"t":"单","s":"下列关于社会权利的表述,正确的是（ ）。","o":["社会权利只有在社会主义国家才成为基本权利","我国公民的社会权利主要包括劳动权、休息权和社会保障权","社会权利的目标是为了更好地实现社会效率","国家在社会权利的行使过程中应当保持中立"],"a":"B","e":"\u0001它是保障公民过有尊严的生活的手段, 体现社会正义原则,该项。\u0002\nA✗ 资本主义国家和社会主义国家都规定了公民的社会权利\nB✓ 我国公民的社会权利主要包括劳动权、休息权和社会保障权\nC✗ 它是保障公民过有尊严的生活的手段, 体现社会正义原则,该项\nD✗ 与题干设问或现行制度要件不符，故不选\n社会权利是公民从社会获得基本生活条件的权利,是公民的积极权利,国家负有保障权利实现的义务。","k":"","kb":36,"kh":[[189,244],[254,301]]},{"id":"2021-24","y":2021,"t":"单","s":"下列关于文化教育权的表述,不正确的是（ ）。","o":["公民有进行科研、文艺创作和其他文化活动的自由","公民受教育权是公民接受文化、科学、品德等方面教育的权利","文化教育权的实现有利于促进科学文化事业的发展","文化教育权属于消极权利"],"a":"D","e":"\u0001受教育权是指公民接受文化、科学、品 \"中德等方面教育训练的权利。\u0002\nA✗ \"第47条规定: 研究、文学艺术创作和其他文化活动的自由\nB✗ 受教育权是指公民接受文化、科学、品 \"中德等方面教育训练的权利\nC✗ 国家对于从事教育、科学、技术、文学、艺术和其他文化事业的公民的有益于人民的创造性工作,给以鼓励和帮助\nD✓ 文化教育权属于公民的积极权利,而不是消极权利\n\u0001《宪法》第46条\u0002规定: 华人民共和国公民有受教育的权利和义务。 国家培养青年、少年、儿童在品德、智力、体质等方面全面发 \"中华人民共和国公民有进行科学展。","k":"","kb":36,"kh":[[189,244],[301,310]]},{"id":"2024-21","y":2024,"t":"单","s":"下列关于社会文化权利的表述正确的是（ ）。","o":["社会文化权利是消极权利","宗教信仰自由属于社会文化权利","对社会文化权利的规定始于《魏玛宪法》","我国1999年宪法修正案增加了社会文化权利的内容"],"a":"C","e":"\u0001现代宪法专章规定社会经济文化权利，一般公认始于1919年德国《魏玛宪法》。\u0002\nA✗ 社会文化权利需要国家主动提供经费、设施与财政公共服务来保障，属于典型的\u0001积极权利\u0002（而非国家不干预即实现的消极自由）\nB✗ 宗教信仰自由属于公民的\u0001精神自由与传统消极自由权\u0002，而非社会经济文化权利\nC✓ 1919年德国\u0001《魏玛宪法》\u0002突破了早期资产阶级宪法仅重消极自由权的框架，首创“经济生活”与“教育学校”等社会文化权利专章\nD✗ 我国早在\u00011954年第一部宪法\u0002即已全面规定受教育权、劳动权、休息权、物质帮助权与科研文艺自由（2004年增“建立健全社会保障制度”）\n宪法权利世代区分：\u0001第一代权利\u0002重公民政治与人身自由（消极）；\u0001第二代权利（《魏玛宪法》起）\u0002重社会经济文化权（积极）。","k":"","kb":36,"kh":[[189,244],[254,301]]},{"id":"2024-24","y":2024,"t":"单","s":"根据我国宪法,下列关于公民私有财产权的表述正确的是（ ）。","o":["公民的继承权受法律保护","公民的私有财产不包括生产资料","公民行使私有财产权时,不负有社会义务","国家为了公共利益的需要,可以对私有财产实施征用并给予赔偿"],"a":"A","e":"\u0001《宪法》第13条第2款明文规定，国家依照法律规定保护公民的私有财产权和继承权。\u0002\nA✓ 2004年修宪后《宪法》第13条明确写明：\u0001国家依照法律规定保护公民的私有财产权和继承权\u0002\nB✗ 公民合法私有财产既包括生活资料，也包括法律允许私人拥有的\u0001合法生产资料\u0002与投资收益等\nC✗ 公民行使私有财产权同样受《宪法》第51条约束，\u0001负有不得损害国家、社会、集体利益的公共与社会义务\u0002\nD✗ 依据宪法第13条第3款，国家为了公共利益的需要依法实行征收或者征用的，应当给予\u0001“补偿”\u0002（违法侵害才给“赔偿”）\n超级必背细节：合法征收征用给\u0001补偿\u0002，违法侵权才给\u0001赔偿\u0002；现行宪法第13条保护合法财产包括\u0001生活与生产资料及继承权\u0002。","k":"","kb":36,"kh":[[116,161],[161,188]]},{"id":"2024-45","y":2024,"t":"多","s":"下列关于劳动权的表述正确的有（ ）。","o":["劳动既是公民的权利,也是公民的义务","国家创造劳动就业条件,有利于劳动权的实现","平台经济条件下,劳动权受到新技术的挑战","国家规范平台用工是履行劳动权国家保障义务的体现"],"a":"ABCD","e":"\u0001《宪法》第42条明确规定公民有劳动的权利和义务，国家负有创造就业条件和规范新型用工的保障义务。\u0002\nA✓ 《宪法》第42条第1款明文规定：\u0001中华人民共和国公民有劳动的权利和义务\u0002（与受教育权同为既属权利又属义务）\nB✓ 《宪法》第42条第2款规定：\u0001国家通过各种途径，创造劳动就业条件\u0002，加强劳动保护，改善劳动条件\nC✓ 随着平台经济与零工算法派遣普及，传统劳动关系认定、工时休息与社保权益受到\u0001新业态新技术的现实挑战\u0002\nD✓ 国家出台政策法规规范新就业形态与平台用工责任，正是履行宪法上对\u0001劳动权的国家保护与保障义务\u0002\n宪法中“既是权利又是义务”的唯一两项：\u0001劳动（第42条）和受教育（第46条）\u0002。","k":"","kb":36,"kh":[[24,63],[189,244]]},{"id":"2025-17","y":2025,"t":"单","s":"清水村位于某市市郊。因城市发展需要,该村部分宅基地和自留地被依法征收。下列关于该村土地的表述,正确的是（ ）。","o":["该村的土地属于国家所有","该村的宅基地属于村民所有","该村的自留地属于集体所有","对该村宅基地和自留地的征收,由乡镇人民政府批准"],"a":"C","e":"\u0001《宪法》规定:\"农村和城市郊区的土地,除由法律规定属于国家所有的以外,属于集体所有。\u0002\nA✗ \u0001《宪法》\u0002规定:\"农村和城市郊区的土地,除由法律规定属于国家所有的以外,属于集体所有\nB✗ 与题干设问或现行制度要件不符，故不选\nC✓ 符合题意及现行制度规定（\u0001该村的自留地属于集体所有\u0002）\nD✗ 根据\u0001《土地管理法》\u0002的规定,征收宅基地和自留地的,由省、自治区、直辖市人民政府批准\n宅基地和自留地、自留山,也属于集体所有。","k":"","kb":28,"kh":[[105,193],[248,266]]},{"id":"2025-45","y":2025,"t":"多","s":"下列关于法律保留的表述,正确的有（ ）。","o":["法律保留是我国立法的一项重要原则","法律保留体现了依法治国的理念","法律保留意味着对授权立法的禁止","制定施行《关税法》,同时废止《进出口关税条例》,是落实法律保留的体现"],"a":"ABD","e":"\u0001法律保留原则要求特定事项必须由法律规定,行政机关不得自行作出规定,是我国立法的一项重要原则。\u0002\nA✓ 法律保留原则要求特定事项必须由法律规定,行政机关不得自行作出规定,是我国立法的一项重要原则\nB✓ 依法治国要求国家的一切权力必须在法律的框架内行使, 法律保留原则正是这一理念的体现\nC✗ 法律保留原则与授权立法不矛盾,不排除法律可以授权行政机关或其他主体在特定范围内制定具体规定\nD✓ 制定\u0001《关税法》\u0002并废止\u0001《进出口关税条例》\u0002,符合法律保留原则的要求\n关税等税收事项属于法律保留的范围,必须由法律规定。","k":"","kb":36,"kh":[[372,460]]},{"id":"2025-46","y":2025,"t":"多","s":"下列关于社会保障权的表述,正确的有（ ）。","o":["1999 年宪法修正案明确规定了社会保障权","社会保障权是公民一切权利和自由的基础","社会保障权旨在维护人的有尊严的生活","社会保障权的实现程度随着经济社会发展而提升"],"a":"CD","e":"\u0001社会保障权是指社会成员为了维护人的有尊严的生活而向国家要求给付的权利,不是\"公民一切权利和自由的基础\"。\u0002\nA✗ 2004 年宪法修正案增加了\"国家建立健全同经济发展水平相适应的社会保障制度\"的条款\nB✗ 社会保障权是指社会成员为了维护人的有尊严的生活而向国家要求给付的权利,不是\"公民一切权利和自由的基础\"\nC✓ 符合题意及现行制度规定（\u0001社会保障权旨在维护人的有尊严的生活\u0002）\nD✓ 社会保障权包括退休人员的生活保障权、物质帮助权等方面的内容,体现了以人为本,经济与社会协调发展的基本思想","k":"","kb":36,"kh":[[116,161],[254,301]]}]},{"sub 规、规章公布,说法正确的是（ ）。","o":["部门规章由总理签署国务院令发布","全国人大常委会通过的法律由委员长签署并向社会公布","民族自治地方人大常委会制定的地方性法规由民族自治地方人大常委会主任签署命令公布","关于国防建设的行政法规,可以由国务院总理、中央军事委员会主席签署国务院、中央军事委员会令公布"],"a":"D","e":"\u0001依据《立法法》第78条，涉及国防建设的行政法规可以由国务院总理和中央军委主席联合签署命令公布。\u0002\nA✗ 部门规章由\u0001部门首长\u0002签署命令予以公布，行政法规才由国务院总理签署国务院令公布\nB✗ 无论是全国人大还是全国人大常委会通过的法律，均一律由\u0001中华人民共和国主席\u0002签署主席令予以公布\nC✗ 民族自治地方的人大常委会既无权制定地方性法规（自治州无一般地方性法规权，设区的市才有），且自治条例单行条例由\u0001民族自治地方人大主席团\u0002（或人大常委会依省市规定）发布公告公布\nD✓ 依据《立法法》，\u0001国防建设行政法规\u0002可由国务院总理、中央军委主席联合签署国务院、中央军委令公布\n法律公布签署链：\u0001法律→国家主席令\u0002；\u0001行政法规→总理令（国防类可加军委主席联合令）\u0002；\u0001部门规章→部长/主任令\u0002。","k":"","kb":38,"kh":[[0,18],[407,467]]},{"id":"2024-23","y":2024,"t":"单","s":"根据我国宪法,有权依照法律规定决定省、自治区、直辖市的范围内部分地区进入紧急状态的国家机构是（ ）。","o":["全国人民代表大会","全国人大常委会","国务院","省级人大常委会"],"a":"C","e":"\u0001依《宪法》第89条第16项，决定省、自治区、直辖市范围内部分地区进入紧急状态的职权属于国务院。\u0002\nA✗ 全国人大有权决定\u0001战争和和平问题\u0002，不负责宣布紧急状态\nB✗ 全国人大常委会决定\u0001全国或者个别省、自治区、直辖市\u0002进入紧急状态，以及决定全国总动员或局部动员\nC✓ 《宪法》第89条规定\u0001国务院有权依照法律规定决定省、自治区、直辖市的范围内部分地区进入紧急状态\u0002\nD✗ 紧急状态决定权属于最高国家权力常设机关或最高国家行政机关，省级人大常委会无权决定\n紧急状态分级权限对比：\u0001全国或整省→全国人大常委会决定+国家主席宣布\u0002；\u0001省内部分地区→国务院决定并宣布\u0002。","k":"","kb":38,"kh":[[80,158],[282,307]]},{"id":"2025-25","y":2025,"t":"单","s":"下列选项中,属于国务院组成人员的是（ ）。","o":["国家外汇管理局局长","国家金融监督管理总局局长","中国人民银行行长","中国证券监督管理委员会主席"],"a":"C","e":"\u0001国家外汇管理局、国家金融监管总局等均是国务院主要组成机构,但其负责人不是国务院组成人员,AB。\u0002\nA✗ 国家外汇管理局、国家金融监管总局等均是国务院主要组成机构,但其负责人不是国务院组成人员,AB\nB✗ 与题干设问或现行制度要件不符，故不选\nC✓ 国务院由总理、副总理、国务委员、各部部长、各委员会主任、中国人民银行行长、审计长、秘书长组成\nD✗ 与题干设问或现行制度要件不符，故不选","k":"","kb":38,"kh":[[170,238],[340,406]]},{"id":"2025-47","y":2025,"t":"多","s":"某设区的市人民政府出台《管道燃气安全经营管理办法》。该办法规定“燃气用户必须安装智能计量表”,与国务院制定的《城镇燃气管理条例》的规定不一致。关于该办法的处理, 下列表述正确的有（ ）。","o":["市人大常委会可以撤销该办法","省人民政府可以改变该办法","省人大常委会可以改变该办法","市中级人民法院可以判决撤销该办法"],"a":"AB","e":"\u0001本题中,某设区的市人民政府出台的《管道燃气安全经营管理办法》与国务院制定的《城镇燃气管理条例》规定不一致,属于与上位法相抵触的情形,市人大常委会可以撤销该办法。\u0002\nA✓ 本题中,某设区的市人民政府出台的\u0001《管道燃气安全经营管理办法》\u0002与国务院制定的\u0001《城镇燃气管理条例》\u0002规定不一致,属于与上位法相抵触的情形,市人大常委会可以撤销该办法\nB✓ 省人民政府作为设区的市人民政府的上级政府,有权改变该办法\nC✗ 省人大常委会无权改变该办法\nD✗ 人民法院在案件审理中只能审查具体行政行为的合法性,无权审查抽象行政行为的合法性,无权在判决中撤销该办法\n设区的市人民政府制定的规章若与上位法相抵触,本级人大常委会有权撤销。 上级人民政府有权改变或者撤销下级人民政府制定的不适当的规章。","k":"","kb":38,"kh":[[0,18],[80,158]]},{"id":"2026-23","y":2026,"t":"单","s":"下列关于国务院组成机构的表述,正确的是（ ）。","o":["国务院组成部门实行集体负责制","国务院办事机构具有独立的行政管理职能","中国气象局属于国务院部委管理的国家局","国务院国有资产监督管理委员会,属于国务院直属特设机构"],"a":"D","e":"\u0001国资委是国务院直属特设机构。\u0002\nA✗ 部委首长负责制\nB✗ 办事机构无独立行政职权\nC✗ 气象局国务院直属事业单位\nD✓ 国资委是国务院直属特设机构\n\u0001“国务院组成部门实行集体负责制”\u0002：部委首长负责制;","k":"","kb":38,"kh":[[0,18],[80,158]]},{"id":"2026-25","y":2026,"t":"单","s":"某省地方性法规规定,独生子女父母60 周岁以上,患病住院治疗期间,子女单位应给予其陪护假,陪护期间工资福利待遇不变。对此,下列说法正确的是（ ）。","o":["独生子女父母的医疗保障应完全由政府承担","该规定使独生子女父母这一群体被差异对待,违反平等原则","该规定若与部门规章的规定不一致时,应提请国务院进行最终裁决","单位对独生子女给予陪护假,是承担保障老年人合法权益责任的表现"],"a":"D","e":"\u0001地方立法设置陪护假,落实单位养老保障责任。\u0002\nA✗ 医疗政府不全部承担\nB✗ 针对老年人优待不违反平等\nC✗ 地方性法规与部门规章冲突,先报国务院,国务院不能裁决再报全国人大常委会\nD✓ 地方立法设置陪护假,落实单位养老保障责任","k":"","kb":38,"kh":[[0,18],[80,158]]}]},{"sub":"中国宪法学","name":"宪法基本理论与演进","w":2.2,"w5":2.2,"wh":3.1,"bt":"","pt":"近5年2.2分/年·制宪权/宪法规范分类稳定","L":59,"qs":[{"id":"2005-17","y":2005,"t":"单","s":"英国宪政制度体现的核心思想是（ ）。","o":["人民主权","三权分立","天赋人权","法治主义"],"a":"A","e":"\u0001\"议会主权\"的表现主要有两个方面,一方面是议会立法权在国家权力体系中处于最高地位。\u0002\nA✓ 议会主权是人民主权在英国的具体体现\nB✗ 英国并没有实行严格意义上的三权分立:其议会的上议院,同时也享有司法权\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选\n英国实行\"议会至上\",实行\"议会主权\"。 只要政府存在,立法权就应当是最高的权力。 行政权与司法权从属于立法权,并对立法权负责。 另一方面,议会有权监督执行权的行使,有权调动和更换执行机关,从而使执行权对立法权的政治责任得以贯彻。 而且上议院议长,同时是大法官, 也是内阁成员之一。 在英国,天赋人权理念和法治主义是建立在议会主权原则基础上的。","k":"","kb":22,"kh":[[0,93]]},{"id":"2005-19","y":2005,"t":"单","s":"我国以宪法修正案的方式对现行宪法进行修改的活动始于（ ）。","o":["1979 年","1982 年","1988 年","1993 年"],"a":"C","e":"\u0001现行宪法是1982 年宪法。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 现行宪法是1982 年宪法\nC✓ 1988 年4 月12 日第七届全国人民代表大会第一次会议通过现行宪法的第一个修正案\nD✗ 1993 年3 月29 日第八届全国人民代表大会第一次会议通过现行宪法的第二个修正案","k":"","kb":23,"kh":[[22,168]]},{"id":"2005-22","y":2005,"t":"单","s":"宪法规范区别于普通法律规范的首要特点是（ ）。","o":["内容的根本性","效力的最高性","立法的原则性","实现的多层次性"],"a":"A","e":"\u0001四个选项都是宪法规 是典型的不成文宪法。 我国宪法是成文宪法。 当今世界上绝大多数国家的宪法属于这种类别,其优点在于制定和修改宪法的程序比较复杂,宪法的稳定性强。 所谓柔性宪法,是指制定和修改程序、法律效力与普通法律完全相同的宪法。 英国是典型的柔性宪法国家。 我国属于刚性宪法。 (3)依据宪法的制定主体不同,其可以分为钦定宪法、民定宪法和协定宪法。 民定宪法是指由民选议会、制宪会议或公民投票表决制定的宪法。 当今绝大多数国家的宪法属于这种类别。 现行最古老的钦定宪法是1814年5月17日的挪威王国宪法。 我国属于民定宪法。 我国宪法是成文宪法、刚性宪法、民定宪法。","k":"","kb":21,"kh":[[102,140],[140,189]]},{"id":"2014-31","y":2014,"t":"单","s":"根据我国《宪法》,有权提议进行宪法修改的主体是（ ）。","o":["最高人民法院","中央军事委员会","省级人民代表大会","1/5以上全国人民代表大会代表"],"a":"D","e":"\u0001有权提议进行宪法修改的主体只有两个:一是1/5以上全国人民代表大会代表,二是全国人大常委会。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ 有权提议进行宪法修改的主体只有两个:一是1/5以上全国人民代表大会代表,二是全国人大常委会\n而通过则需要全国人大以全体代表的 \" 全体代表 2/3以上多数才能通过。 切记这里是 \"。","k":"","kb":37,"kh":[[0,30],[199,378]]},{"id":"2014-52","y":2014,"t":"多","s":"下列关于英国宪法的表述,正确的有（ ）。","o":["英国是最早确立违宪审查制度的国家","英国宪法由宪法性法律、宪法惯例和宪法判例构成","英国是典型的不成文宪法国家,没有统一、完整的宪法典","英国宪政制度是通过限制王权、扩大资产阶级权力逐步实现的"],"a":"BCD","e":"\u0001英国是世界上最早实行宪政的国家,而不是最早确立违宪审查制度的国家,美国才是。\u0002\nA✗ 英国是世界上最早实行宪政的国家,而不是最早确立违宪审查制度的国家,美国才是\nB✓ 英国宪法由宪法性法律宪法惯例和宪法判例构成,形成了没有统一的完整的宪法典形式的、颇具特色的不成文宪法, 该项\nC✓ 符合题意及现行制度规定（\u0001英国是典型的不成文宪法国家,没有统一\u0002）\nD✓ 英国宪政制度的确立,是通过逐步限制王权和扩大资产阶级权力逐步实现的\n因此选BCD项。","k":"","kb":21,"kh":[[49,102],[102,140]]},{"id":"2015-16","y":2015,"t":"单","s":"关于宪法规范,下列说法正确的是（ ）。","o":["宪法规范比普通法律规范更具原则性、概括性","宪法规范内容上的政治性决定了违宪主体不承担法律后果","宪法规范主要调整国家与公民之间、公民与公民之间的关系","宪法规范在我国的表现形式主要有宪法典、宪法相关法、宪法惯例和宪法判例"],"a":"A","e":"\u0001宪法规范比普通法律规范更具原则性、概括性。\u0002\nA✓ 宪法规范比普通法律规范更具原则性、概括性\nB✗ 任何违宪主体都将承担一定的法律后果\nC✗ 宪法规范所调整的社会关系主要包括:国家与公民之间的关系、国家与其他社会主体之间的关系、国家机关之间的关系和国家机关内部的关系\nD✗ 宪法规范在我国的表现形式主要有宪法典、宪法相关法和宪法惯例等,不包括宪法判例","k":"","kb":24,"kh":[[120,139]]},{"id":"2015-27","y":2015,"t":"单","s":"下列选项中,不符合宪法发展的世界性趋势的是（ ）。","o":["甲国修改宪法以扩大公民基本权利的范围","乙国国会拒绝将国际人权法作为本国的宪法渊源","丙国为维护宪法的最高权威设立专门违宪审查机构","丁国最高法院判决,为应对经济危机而扩大政府权力的某部法律合宪"],"a":"B","e":"\u0001各国宪法越来越强调对人权的保障,不断扩大公民权利范围。\u0002\nA✗ 各国宪法越来越强调对人权的保障,不断扩大公民权利范围\nB✓ 符合题意及现行制度规定（\u0001乙国国会拒绝将国际人权法作为本国的宪\u0002）\nC✗ 各国越来越重视建立违宪审查制度来维护宪法的最高权威,各国普遍认为,必须建立完善违宪审查的机构与制度,行使违宪审查的职能,保障宪法的实施\nD✗ 各国宪法一方面确认和授予政府更多的权力,另一方面也更加注重通过设定多种监督机制对政府权力加以限制,以防止政府权力的滥用\n宪法领域从国内法扩展到国际法,故该项 为正确选项。","k":"","kb":21,"kh":[[11,48]]},{"id":"2016-15","y":2016,"t":"单","s":"下列规范性文件中,属于宪法相关法的是（ ）。","o":["合同法","行政强制法","民事诉讼法","各级人大常委会监督法"],"a":"D","e":"\u0001国家机关组织法、选举法和代表法、特别行政区基本法、民族区域自治法、公民基本权利法、立法法、各级人大常委会监督法等属于宪法相关法。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ 国家机关组织法、选举法和代表法、特别行政区基本法、民族区域自治法、公民基本权利法、立法法、各级人大常委会监督法等属于宪法相关法\n\u0001“合同法”\u0002是民商法,“行政强制法”是行政法,“民事诉讼法”是程序法。","k":"","kb":21,"kh":[[11,48]]},{"id":"2016-16","y":2016,"t":"单","s":"下列关于我国1999年《宪法修正案》内容的表述,正确的是（ ）。","o":["明确了土地使用权可依法转让","首次规定了公民合法的财产权受法律保护","确立了按劳分配为主体、多种分配方式并存的分配制度","增加了推动物质文明、政治文明和精神文明协调发展的内容"],"a":"C","e":"\u00011988年《宪法修正案》增加规定 \" ,“明确了土地使用权可依法转让”为1988 的使用权可以依照法律的规定转让年《宪法修正案》的内容。\u0002\nA✗ 1988年\u0001《宪法修正案》\u0002增加规定 \" ,相关表述为1988 的使用权可以依照法律的规定转让年\u0001《宪法修正案》\u0002的内容\nB✗ 2004年\u0001《宪法修正案》\u0002进一步明确国家对全体公民的合法的私有财产都给予保护,相关表述是2004年\u0001《宪法修正案》\u0002的内容\nC✓ 1999年宪法确立了我国社会主义初级阶段的基本经济制度和分配制度\nD✗ 2004年\u0001《宪法修正案》\u0002增加推动物质文明、政治文明和精神文明协调发展的内容,相关表述是2004年宪法修正案的内容\n2004年\u0001《宪法修正案》\u0002进一步明确国家对全体公民的合法的私有财产都给予保护,“首次规定了公民合法的财产权受法律保护”是2004年\u0001《宪法修正案》\u0002的内容。","k":"","kb":23,"kh":[[169,390]]},{"id":"2016-17","y":2016,"t":"单","s":"下列关于宪法规范的表述,正确的是（ ）。","o":["宪法规范的效力高于法律、法规的效力","宪法规范不调整国家和无国籍人之间的关系","宪法规范因具有权威性而无需进行宪法解释","宪法规范具有政治性.只能通过立法具体化"],"a":"A","e":"\u0001宪法规范主要调整国家与公民之间的关系、国家与其他社会主体之间的关系、国家机关之间的关系、国家机关内部的关系。\u0002\nA✓ 宪法规范具有最高的法律效力,其效力高于法律、法规\nB✗ 宪法调整国家与无国籍人之间的关系\nC✗ 依据对宪法解释主体的不同,宪法解释可以分为正式解释和非正式解释\nD✗ 政治性的内容,不是只能通过立法具体化,也可以通过其他方式具体化,比如党章\n宪法规范是调整宪法关系的各种规范的总和。 宪法规范虽然具有权威性,但是宪法在实施过程中,也需要进行解释。 宪法规范的内容具有政治性,这是由宪法所调整的社会关系所决定的。","k":"","kb":24,"kh":[[120,139]]},{"id":"2016-18","y":2016,"t":"单","s":"下列关于各国宪法发展的表述,不正确的是（ ）。","o":["1958年法国宪法设专章规定宪法委员会制度","我国现行宪法是对“七五宪法”精神的继承和发展","英国宪法在发展中形成了议会至上的体制特点","通过普通法院解释宪法是美国宪法实践的创造"],"a":"B","e":"\u0001英国宪法以人民主权思想为指导,突出议会至上的体制特点。\u0002\nA✗ 法国的 1958年宪法设专章规定宪法委员会制度\nB✓ 1954年宪法是一部好的社会主义类型的宪法,我国现行宪法是对五四宪法精神的继承和发展\nC✗ 英国宪法以人民主权思想为指导,突出议会至上的体制特点\nD✗ 美国宪法是世界上第一部成文宪法,司法机关行使宪法解释权源自美国,司法机关对宪法的解释采用不告不理的原则\n英国是最早实行宪政的国家,英国宪法是资产阶级在各个不同时期同封建贵族斗争、妥协的产物。 宪法解释的专门机关解释体制源自奥地利,法国建立了宪法委员会对宪法进行解释。","k":"","kb":23,"kh":[[0,21],[65,103]]},{"id":"2016-20","y":2016,"t":"单","s":"下列关于宪法修改的表述,正确的是（ ）。","o":["宪法的修改机关和宪法的制定机关相同","由公民提议修宪是现代法治国家的通例","宪法修正案一般需要由议会过半数通过","我国宪法修改权由全国人民代表大会行使"],"a":"D","e":"\u0001宪法修改是指有权修改宪法的机关依据法定的程序对宪法规范予以补充、调整、删除的行为,以保证宪法的内容与社会的发展相适应。\u0002\nA✗ 宪法的修改不同于宪法的制定,国家通常根据需要成立制宪机关,如制宪会议、国民大会立宪会议等,但是修改宪法一般是议会或者国会,制宪机关和修宪机关不相同\nB✗ 修宪提案是修改宪法的第一步,一般是由议员提出,我国是由人大代表提出,而不是由公民提出\nC✗ 各国宪法修改的表决程序的具体标准虽然有所不同,但是要求绝对多数通过是基本做法\nD✓ 根据我国宪法的规定,宪法修改权由全国人大行使","k":"","kb":24,"kh":[[0,91],[91,119]]},{"id":"2016-56","y":2016,"t":"多","s":"我国《宪法》规定,国家尊重和保障人权。下列关于该条款的表述,正确的有（ ）。","o":["该条款在“八二宪法”制定时予以明确规定","该条款对于理解基本权利具有指导作用","该条款为未列举基本权利提供了规范基础","该条款为国家设定了尊重、保障和实现人权的义务"],"a":"BCD","e":"\u0001\" 是2004年宪 \"国家尊重和保障人权 \" 八二宪法 \"制定时予法修正案增加的内容,并不是在以明确规定的。\u0002\nA✗ \" 是2004年宪 \"国家尊重和保障人权 \" 八二宪法 \"制定时予法修正案增加的内容,并不是在以明确规定的\nB✓ 符合题意及现行制度规定（\u0001该条款对于理解基本权利具有指导作用\u0002）\nC✓ 符合题意及现行制度规定（\u0001该条款为未列举基本权利提供了规范基础\u0002）\nD✓ 符合题意及现行制度规定（\u0001该条款为国家设定了尊重、保障和实现人\u0002）\n该条款的增加对于理解公民的基本权利具有指导作用,对未列举的基本权利提供了规范基础,为国家设定了尊重和保障人权的义务,体现了社会主义制度的本质要求,有利于推进我国社会主义人权事业的发展,有利于我国在国际人权事业中进行合作和交流,BC","k":"","kb":23,"kh":[[103,168],[169,390]]},{"id":"2017-16","y":2017,"t":"单","s":"关于制宪权和制宪机关,下列表述正确的是（ ）。","o":["制宪权和修宪权是同一层次的权力形态","立宪实践中,宪法起草机构就是制宪机关","在我国,制宪权主体是全国人民代表大会","1954年宪法是新中国成立后人民行使制宪权的产物"],"a":"D","e":"\u0001宪法制定是指制宪主体行使制宪权的活动。\u0002\nA✗ 制宪权、修宪权与立法权是属于不同层次的权力形态,制宪权是原生性权力,修宪权是依据制宪权而产生的一种派生性权力,立法权是制定一般法律的活动\nB✗ 为了有效地行使制宪权, 国家通常根据需要成立制宪机关,如制宪会议、国民大会、立宪会议等,但是制宪机关不同千宪法的起草机关,制宪机关是行使宪法制定权的常设的国家机关,宪法的起草机构是临时的专门…\nC✗ 按照西耶斯的观点,制宪权的主体是国民,在我国,宪法制定的主体是以中国共产党为代表的中国人民,而不是全国人民代表大会\nD✓ 1954年宪法是新中国成立后人民行使制宪权的产物,其后历次修改宪法都是行使修宪权,只有1954年宪法的制定是行使制宪权\n制宪权,是指人民创制宪法的权力。 为了有效地行使制宪权, 国家通常根据需要成立制宪机关,如制宪会议、国民大会、立宪会议等,但是制宪机关不同千宪法的起草机关,制宪机关是行使宪法制定权的常设的国家机关,宪法的起草机构是临时的专门的工作机构,不能独立行使制宪权","k":"","kb":24,"kh":[[0,91],[120,139]]},{"id":"2018-13","y":2018,"t":"单","s":"下列文件中,被马克思称为“世界上第一个人权宣言”的是（ ）。","o":["1215年的英国《自由大宪章》","1689年的英国《权利法案》","1776年北美《独立宣言》","1789年法国《人权和公民权利宣言》"],"a":"C","e":"\u0001美国《独立宣言》被马克思称为世界上第一个人权宣言。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✓ 美国\u0001《独立宣言》\u0002被马克思称为世界上第一个人权宣言\nD✗ 与题干设问或现行制度要件不符，故不选","k":"","kb":22,"kh":[[94,112],[112,125]]},{"id":"2018-22","y":2018,"t":"单","s":"通过宪法修正案对宪法部分内容予以修改和完善,是宪法修改的一种方式,我国采用这一方式开始于（ ）。","o":["1979","1982","1988","2004"],"a":"C","e":"\u00011988年宪法修正案是我国第一个宪法修正案。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✓ 1988年宪法修正案是我国第一个宪法修正案\nD✗ 与题干设问或现行制度要件不符，故不选","k":"","kb":23,"kh":[[22,168]]},{"id":"2019-13","y":2019,"t":"单","s":"下列关于宪法分类的表述,正确的是（ ）。","o":["刚性宪法和柔性宪法的区分由宪法学家罗文斯坦最早提出","成文宪法和不成文宪法的划分标准是宪法是否具有成文的形式","以制定宪法的机关为标准,可将宪法分为民定宪法和共和宪法","根据宪法的经济基础和阶级本质,可将宪法分为资本主义宪法和社会主义宪法"],"a":"D","e":"\u0001依据题干考查要点，正确表述为“根据宪法的经济基础和阶级本质,可将宪法分为资本主义宪法和社会主义”。\u0002\nA✗ 刚性宪法和柔性宪法的区分由宪法学家蒲莱士最早提出\nB✗ 成文宪法和不成文宪法的划分标准是宪法是否具有统一的法典形式, 而非是否具有成文的形式,不成文宪法也是以具体条文表述的\nC✗ 以制定宪法的机关为标准,可将宪法分为钦定宪法、民定宪法与协定宪法\nD✓ 根据宪法的经济基础和阶级本质,可将宪法分为资本主义宪法和社会主义宪法","k":"","kb":21,"kh":[[102,140],[140,189]]},{"id":"2019-15","y":2019,"t":"单","s":"下列关于宪法修改的表述,正确的是 （ ）。","o":["宪法修改权的主体是修宪机关","我国宪法修改的程序和普通法律相同","我国宪法修改的机关是全国人大常委会","宪法修改有全面修改和部分修改两种形式"],"a":"D","e":"\u0001依据题干考查要点，正确表述为“宪法修改有全面修改和部分修改两种形式”。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 由宪法内容的重要性和宪法所具有的最高法律效力所决定,宪法的制定和修改的程序比其他一般法律更为复杂和严格,我国宪法修改的程序要严于普通法律的修改程序\nC✗ 我国宪法修改的机关是全国人民代表大会而非全国人大常委会\nD✓ 宪法修改有全面修改和部分修改两种形式\n我国有权提出宪法修改的主体是全国人民代表大会常务委员会或五分之一以上的全国人民代表大会代表,宪法修改的机关是全国人民代表大会,错误。","k":"","kb":37,"kh":[[0,30],[199,378]]},{"id":"2020-13","y":2020,"t":"单","s":"《共同纲领》在新中国成立之初起到了临时宪法的作用,其制定主体是（ ）。","o":["全国人民代表大会","中央人民政府委员会","全国人民代表大会常务委员会","中国人民政治协商会议第一届全体会议"],"a":"D","e":"\u0001依据题干考查要点，正确表述为“中国人民政治协商会议第一届全体会议”。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ 1949年9月29日,中国人民政治协商一届全体会议选举了中央人民政府委员会,宣会议第告了中华人民共和国的成立,并通过了\u0001《中国人民政治协商会议共同纲领》\u0002,即\u0001《共同纲领》\u0002,起到了临时宪法的作用","k":"","kb":23,"kh":[[22,65],[169,390]]},{"id":"2021-13","y":2021,"t":"单","s":"下列关于英国宪法的表述,正确的是（ ）。","o":["英国宪法是欧洲第一部成文宪法,以保障人权为特点","英国宪法是资产阶级在不同历史时期同封建贵族斗争、妥协的产物","英国宪法是议会共和制的体现","宪法修正案是英国宪法的组成部分"],"a":"B","e":"\u0001英国宪制的确立,是通过逐步限制王权和扩大资产阶级政治权力的途径实现的。\u0002\nA✗ 法国宪法是欧洲第一部成文宪法\nB✓ 英国宪法就是资产阶级在各个不同时期同封建贵族斗争、妥协的产物\nC✗ 英国是议会君主制,而不是议会共和制\nD✗ 英国宪法由宪法性法律、宪法惯例、宪法判例等构成,形成了没有统一的、完整的宪法典形式的颇具特色的不成文宪法,英国宪法没有宪法修正案","k":"","kb":21,"kh":[[49,102],[102,140]]},{"id":"2021-16","y":2021,"t":"单","s":"下列关于我国宪法中人民主权原则的理解, 正确的是（ ）。","o":["人民行使国家权力的机关是人民代表大会和政治协商会议","人民主权原则意味着人民通过各种途径对国家进行直接管理","“一切权力属于人民”体现了人民主权原则","人民主权原则要求国家机构实行集体领导体制"],"a":"C","e":"\u0001《宪法》第2条第2款规定:\"人民行使国家权力的机关是全国人民代表大会和地方各级人民代表大会。\u0002\nA✗ \"其中不包括政治协商会议\nB✗ 第2条第3款规定:\"人民依照法律规定,通过各种途径和形式,管理国家事务,管理经济和文化事业,管理 \" 直接管理社会事务\nC✓ \"该规定体现了人民主权原则\nD✗ 我国的国家机构不是全部实行集体领导体制, 有的机关如行政机关、军事机关实行个人负责制\n\"但人民的管理,不是进行项错误。 第2条第1款规定:\"中华人民共和国的一切权力属于人民。","k":"","kb":22,"kh":[[0,93],[125,171]]},{"id":"2021-45","y":2021,"t":"多","s":"下列关于宪法发展趋势的表述,正确的有（ ）。","o":["宪法领域从国内法扩展到国际法,国际条约已经成为各国宪法的正式渊源","各国宪法一方面授予政府更多权力,另一方面设定多种监督机制防止权力滥用","成文宪法成为世界上绝大部分国家采取的宪法形式","宪法保障的公民基本权利的范围随时代发展而逐渐扩展"],"a":"BCD","e":"\u0001宪法的发展趋势:第一,各国宪法越来越强调对人权的保障,不断扩大公民基本权利的范围。\u0002\nA✗ 国际条约不是在各国均为宪法的正式渊源\nB✓ 各国宪法一方面确认和授予政府更多的权力,另一方面也更加注重通过设定多种监督机制对政府权力加以限制,以防止政府权力的滥用\nC✓ 符合题意及现行制度规定（\u0001成文宪法成为世界上绝大部分国家采取的\u0002）\nD✓ 宪法的发展趋势:第一,各国宪法越来越强调对人权的保障,不断扩大公民基本权利的范围\n第二,政府权力的扩大,是社会发展的必然。 第三,各国越来越重视建立违宪审查制度来维护宪法的最高权威。 各国普遍认为,必须建立违宪审查的机构,完善违宪审查的制度,行使违宪审查的职能,保障宪法的实施。 第四,宪法领域从国内法扩展到国际法。 许多国家的宪法出现了同国际法相结合的内容,在人权的国际法保障方面尤为明显。","k":"","kb":21,"kh":[[49,102],[102,140]]},{"id":"2022-14","y":2022,"t":"单","s":"关于马克思主义的宪法分类,下列表述正确的是（ ）。","o":["马克思主义的宪法分类以制宪主体为标准","马克思主义的宪法分类揭示了宪法的阶级本质","马克思主义的宪法分类是基于宪法形式特征进行的分类","根据马克思主义的宪法分类,民定宪法属于资本主义宪法"],"a":"B","e":"\u0001马克思主义的宪法分类是马克思主义宪法学者依据宪法的阶级本质和赖以建立的经济基础的不同,对宪法进行的分类。\u0002\nA✗ 马克思主义的宪法分类是马克思主义宪法学者依据宪法的阶级本质和赖以建立的经济基础的不同,对宪法进行的分类\nB✓ 这种分类方法最鲜明的特点在于揭示了宪法的本质,反映了宪法的阶级属性,是基于宪法本质属性进行的分类\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 资本主义类型宪法和社会主义类型宪法都存在民定宪法\n民定宪法是指由民意机关或者公民公决制定的宪法,是以制定宪法的机关为标准,区别于钦定宪法、协定宪法的宪法类型。","k":"","kb":21,"kh":[[140,189],[189,219]]},{"id":"2022-47","y":2022,"t":"多","s":"下列关于我国宪法中“国家尊重和保障人权”条款的理解,正确的有（ ）。","o":["2004年宪法修正案正式载人人权保障条款","人权入宪有利于推进我国社会主义人权事业的发展","该条款为我国人权保障的法律制度提供了宪法基础","《国家人权行动计划(2021—2025年)》的发布体现了该条款的基本精神"],"a":"ABCD","e":"\u0001在宪法中作出尊重和保障人权的宣示,体现了社会主义制度的本质要求,有利于推进我国社会主义人权事业的发展,有利于我国在国际人权事业中进行交流和合作。\u0002\nA✓ 2004年,\"国家尊重和保障人权\"正式载入宪法\nB✓ 在宪法中作出尊重和保障人权的宣示,体现了社会主义制度的本质要求,有利于推进我国社会主义人权事业的发展,有利于我国在国际人权事业中进行交流和合作\nC✓ 尊重和保障人权是我们党和国家的一贯方针,将其写人宪法,可以进一步为这个方针的贯彻执行提供宪法保障\nD✓ 2021年发布的\u0001《国家人权行动计划(2021一2025年)》\u0002更是体现了该条款的基本精神","k":"","kb":23,"kh":[[0,21],[169,390]]},{"id":"2023-14","y":2023,"t":"单","s":"下列关于成文宪法和不成文宪法的表述,正确的是（ ）。","o":["二者的区分标准是修改程序的差异","现代大多数国家的宪法是成文宪法","宪法修正案是不成文宪法的重要组成部分","成文宪法是刚性宪法,不成文宪法则是柔性宪法"],"a":"B","e":"\u0001按法典形式标准划分成文宪法与不成文宪法，现代世界绝大多数国家的宪法都是成文宪法。\u0002\nA✗ 修改程序严格与否是划分\u0001刚性宪法与柔性宪法\u0002的标准，成文与不成文的区分标准是法典形式\nB✓ 除英国、新西兰、以色列等极少数国家外，\u0001现代绝大多数国家采用成文宪法\u0002\nC✗ 我国的宪法修正案是\u0001成文宪法典的有机组成部分\u0002，而不成文宪法的渊源包括宪法性法律、习惯与判例\nD✗ 成文宪法并非必然刚性（如早期部分成文宪法可依普通程序修改），柔性宪法与刚性宪法按修改难度划分\n\u0001英国\u0002是典型不成文宪法且兼具柔性宪法特征；\u0001美国与我国\u0002则既是成文宪法又是刚性宪法。","k":"","kb":21,"kh":[[49,102],[102,140]]},{"id":"2024-13","y":2024,"t":"单","s":"下列关于宪法的表述,正确的是（ ）。","o":["成文宪法都是刚性宪法","成文宪法是指以法典形式呈现的宪法","《钦定宪法大纲》是中国历史上第一部成文宪法","以成文形式进行规定的宪法即为成文宪法"],"a":"B","e":"\u0001成文宪法又称文书宪法或法典宪法，是指以单一或几部统一法典形式呈现的宪法。\u0002\nA✗ 尽管多数成文宪法是刚性宪法，但仍存在修改程序与普通法律相同或相近的\u0001柔性成文宪法\u0002\nB✓ 划分成文宪法与不成文宪法的标准是\u0001宪法典的外在表现形式\u0002，成文宪法即具有统一宪法典形式的宪法\nC✗ 1908年《钦定宪法大纲》属宪法性文件；中国历史上第一部正式宪法典是\u00011923年“贿选宪法”\u0002（第一部资产阶级共和国性质宪法性文件是《临时约法》）\nD✗ 英国不成文宪法同样包含《权利法案》等成文宪法性法律文件，并非“以成文形式规定即成文宪法”\n成文与不成文宪法的界碑在于\u0001是否具备统一命名为宪法的专门法典形式\u0002，而非内容是否书面记载。","k":"","kb":21,"kh":[[102,140],[140,189]]},{"id":"2024-15","y":2024,"t":"单","s":"下列关于宪法修改的表述,正确的是（ ）。","o":["宪法修改不包括对宪法的全面修改","宪法修改的主要目的在于维护宪法的稳定","宪法修改的程序和法律修改的程序相同","一些国家规定特定内容不得成为宪法修改对象"],"a":"D","e":"\u0001部分国家在宪法中明文设置禁止修改条款，限定国体、基本原则等特定内容不得成为修宪对象。\u0002\nA✗ 宪法修改按范围可分为\u0001全面修改\u0002（如我国1975、1978、1982年宪法）与\u0001部分修改\u0002（如修正案）\nB✗ 宪法修改的主要目的在于使宪法\u0001适应社会政治经济发展变迁与现实需要\u0002（而非仅静态维护稳定）\nC✗ 宪法作为根本法具有最高效力，世界绝大多数国家及我国规定\u0001修宪程序远严于普通法律修改程序\u0002\nD✓ 世界上许多国家（如德国基本法第79条、法国宪法第89条）规定\u0001共和政体、人的尊严等核心内容不得修改\u0002（修宪界限理论）\n修宪两大考点：方式分\u0001全面修改与部分修改\u0002；各国通常基于制宪权高于修宪权设定\u0001宪法修改的实质界限\u0002。","k":"","kb":24,"kh":[[0,91],[120,139]]},{"id":"2025-13","y":2025,"t":"单","s":"下列关于宪法分类的表述,正确的是（ ）。","o":["西耶斯最早提出刚性宪法和柔性宪法的区分","钦定宪法、协定宪法和民定宪法的区分标准是宪法修改的难易程度","成文宪法和不成文宪法的区分标准是宪法规范是否以书面形式表达","马克思主义法学将宪法分为资本主义类型的宪法和社会主义类型的宪法"],"a":"D","e":"\u0001马克思主义的宪法分类是马克思主义宪法学者依据宪法的阶级本质和赖以建立的经济基础的不同,对宪法进行的分类。\u0002\nA✗ 刚性宪法和柔性宪法是英国学者蒲莱士最早提出来的\nB✗ 钦定宪法、协定宪法和民定宪法是以制定宪法的机关为标准对宪法所作的分类\nC✗ 成文宪法和不成文宪法这种宪法分类所依据的标准为宪法是否具有统一法典形式\nD✓ 按照这个标准,宪法被划分为资本主义类型宪法和社会主义类型宪法","k":"","kb":21,"kh":[[102,140],[140,189]]},{"id":"2025-15","y":2025,"t":"单","s":"现行宪法规定,“国家保护和改善生活环境和生态环境,防治污染和其他公害”。该宪法规范的类型属于（ ）。","o":["宪法指示规范","组织权限规范","宪法委托规范","权利义务规范"],"a":"A","e":"\u0001宪法指示规范是指宪法指示国家为一定行为,原则上所有公权力机关直接或间接的都是其规范对象,公权力机关可以根据国家发展的实际情况决定履行宪法指示的具体方式和先后顺序。\u0002\nA✓ 保护生态环境是基本国策,属于宪法指示规范\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选\n我国宪法中基本国策的条款多属于此类规范。 本题条款没有规定组织权限以及权利义务,BC","k":"","kb":24,"kh":[[120,139]]},{"id":"2026-13","y":2026,"t":"单","s":"关于成文宪法和不成文宪法,下列表述正确的是（ ）。","o":["普通法系国家的宪法都是不成文宪法","成文宪法国家不承认宪法判例具有约束力","不成文宪法国家调整宪法关系的规范只有宪法惯例","成文宪法具有规范明确、条文系统、便于实施和监督的特点"],"a":"D","e":"\u0001成文法典体系清晰、便于适用监督。\u0002\nA✗ 美国普通法系有成文宪法\nB✗ 德国成文宪法认可宪法判例\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ 不成文宪法包含宪法法律、判例、惯例\n\u0001“普通法系国家的宪法都是不成文宪法”\u0002：美国普通法系有成文宪法;","k":"","kb":21,"kh":[[49,102],[102,140]]},{"id":"2026-14","y":2026,"t":"单","s":"关于宪法规范,下列说法正确的是（ ）。","o":["宪法指示规范不是实体规范","国家机关是宪法指示规范的规范对象","国家保障公民的基本权利是宪法委托规范","针对特定部门的法定义务要求是权利义务规范"],"a":"B","e":"\u0001宪法指示规范专门约束各类国家机关履职。\u0002\nA✗ 指示规范是实体履职要求\nB✓ 宪法指示规范专门约束各类国家机关履职\nC✗ 保障基本权利是权利保障规范\nD✗ 是单纯义务规范\n\u0001“宪法指示规范不是实体规范”\u0002：指示规范是实体履职要求;","k":"","kb":24,"kh":[[139,179]]},{"id":"2026-22","y":2026,"t":"单","s":"下列关于制宪权的表述,正确的是（ ）。","o":["制宪权主体是全体选民","制宪权是立法机关享有的权力","制宪权是权力制约与监督原则的具体表现","制宪权因设定了修宪权主体、修宪内容和修宪程序而高于修宪权"],"a 耳直则喘 \"观其听聆,不直则惑 \",即观察当事人的听觉,理听, 亏则听语不清。","k":"","kb":41,"kh":[[0,8],[110,161]]},{"id":"2022-28","y":2022,"t":"单","s":"西周时期司法官的渎职犯罪通称为“五过之疵”。其中,接受请托而徇私枉法的行为属于（ ）。","o":["惟来","惟反","惟货","惟官"],"a":"A","e":"\u0001西周时期司法官的渎职犯罪通称为 \"五过之疵\",惟官,指秉承上意,依仗权势。\u0002\nA✓ 惟来,指接受请托,私枉法\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选\n惟反,指利用职权,报私恩怨; 惟内,指内亲用事,暗中牵制; 惟货,指贪赃受贿,敲诈勒索;","k":"","kb":41,"kh":[[0,8],[161,197]]},{"id":"2023-48","y":2023,"t":"多","s":"《吕刑》是西周中期具有代表性的刑书,其确立的原则有（ ）。","o":["五刑之疑有赦","重刑轻罪","同居相为隐","刑罚世轻世重"],"a":"AD","e":"\u0001《吕刑》是西周穆王时期吕侯制定的代表性刑书，确立“五刑之疑有赦”与“刑罚世轻世重”。\u0002\nA✓ 《尚书·吕刑》提出“墨辟疑赦…五刑之疑有赦”，即疑罪从轻从赦原则\nB✗ “重刑轻罪”是战国时期\u0001法家（商鞅、韩非）\u0002极力主张的严刑峻法原则，与西周“明德慎罚”相悖\nC✗ “同居相为隐”源于孔子“父为子隐”并经汉代“亲亲得相首匿”正式入律（《唐律》确立同居相隐），非《吕刑》内容\nD✓ 《吕刑》首次明确提出“刑罚世轻世重”（刑新国用轻典，刑平国用中典，刑乱国用重典）\n牢记西周《吕刑》核心两大命题：\u0001五刑之疑有赦\u0002、\u0001刑罚世轻世重（三典之法）\u0002。","k":"","kb":41,"kh":[[9,29],[86,109]]},{"id":"2024-29","y":2024,"t":"单","s":"据《汉书陈平传》载，西汉开国功臣陈平年少时与其兄陈伯同住，“伯常耕田，纵平使游学”。其嫂“疾平之不亲家生产”，曰：“有叔如此，不如无有！”陈伯听闻后，“逐其妇弃之”。陈伯“逐其妇”在中国古代离婚制度中属于（ ）。","o":["七出","三不去","义绝","和离"],"a":"A","e":"\u0001陈伯因妻子不敬宗族兄弟、惹是生非（恶口挑拨/违礼失妇道）而“逐其妇弃之”，在传统离婚制度中属于“七出”。\u0002\nA✓ 古代夫方依\u0001“七出”\u0002（无子、淫佚、不事舅姑、口舌、盗窃、妒忌、恶疾）单方面休妻，其嫂抱怨多嘴招致陈伯驱逐弃妻正是“七出”休妻\nB✗ “三不去”是限制休妻的条件（有所娶无所归、与更三年丧、前贫贱后富贵），与逐妻行为相反\nC✗ “义绝”是由\u0001官府强制解除\u0002严重破坏伦常婚姻关系的制度，陈伯系夫方自行逐妻，非官府判离\nD✗ “和离”是夫妻双方心平气和\u0001协议自愿离婚\u0002，与“逐其妇弃之”完全不符\n古代休妻“七出”口诀：无子、淫佚、不事舅姑、\u0001口舌（多言离间宗亲）\u0002、盗窃、妒忌、恶疾。","k":"","kb":41,"kh":[[335,448]]},{"id":"2024-33","y":2024,"t":"单","s":"《周礼秋官大司寇》载：“凡万民之有罪过而未丽于法，而害于州里者，桎梏而坐诸嘉石，役诸司空。”这里“嘉石”之制的性质是（ ）。","o":["生命刑","财产刑","肉刑","劳役刑"],"a":"D","e":"\u0001西周“嘉石之制”令轻微过失危害乡里者戴刑具静坐悔过并服司空劳役，性质上属于劳役刑。\u0002\nA✗ 生命刑指死刑（大辟），“坐诸嘉石，役诸司空”旨在惩戒改造，不剥夺生命\nB✗ 财产刑通过缴纳罚金、赎金或没收财产实现，嘉石之制要求当众坐石并服官府劳役，非财产刑\nC✗ 肉刑是墨、劓、剕、宫等毁伤肢体之刑，嘉石之制不残害身体\nD✓ 据《周礼》“桎梏而坐诸嘉石，役诸司空”，戴械静坐悔罪后\u0001拨付司空服期满三个月至一年不等劳役\u0002，性质上属于\u0001劳役刑\u0002（徒刑雏形）\n西周刑罚制度小细节：\u0001圜土之制\u0002与\u0001嘉石之制\u0002均属轻微违法劳役改造性质（类似后世徒刑或拘役雏形）。","k":"","kb":41,"kh":[[110,161],[197,235]]},{"id":"2025-28","y":2025,"t":"单","s":"《尚书吕刑》:“五过之疵,惟官、惟反、惟内、惟货、惟来。其罪惟均,其审克之。”这里的“五过之疵”主要适用对象是（ ）。","o":["诸侯","三公","司法官","周天子"],"a":"C","e":"\u0001《吕刑》规定,\"犯有五过之疵者,其罪惟均\",即司法官和罪犯受同样的惩罚。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✓ \u0001《吕刑》\u0002规定,\"犯有五过之疵者,其罪惟均\",即司法官和罪犯受同样的惩罚\nD✗ 与题干设问或现行制度要件不符，故不选\n西周规定了渎职方面的犯罪,如司法官的\"五过\"之疵(弊端):\"惟官\"(秉承上意,依仗权势)、\"惟反\"(利用职权,报私恩怨)、\"惟内\"(内亲用事,暗中牵制)、\"惟货\"(贪赃受贿,敲诈勒索)、\"惟来\"(接受请托,徇私枉法)。","k":"","kb":41,"kh":[[86,109],[161,197]]},{"id":"2026-28","y":2026,"t":"单","s":"《周礼秋官大司寇》载:“以两造禁民讼,入束矢于朝,然后听之。以两剂禁民狱,入钧金,三日乃致于朝,然后听之。”这里的“束矢”和“钧金”的性质是（ ）。","o":["诉讼费","赔偿金","保证金","勘验费"],"a":"A","e":"\u0001西周束矢、钧金是诉讼缴纳诉讼费,败诉不予返还。\u0002\nA✓ 西周束矢、钧金是诉讼缴纳诉讼费,败诉不予返还\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选","k":"","kb":41,"kh":[[110,161],[235,268]]},{"id":"2026-33","y":2026,"t":"单","s":"现存的商朝甲骨卜辞中有“贞其刖”“贞刖百”“贞其刖百人死”等语。该记载反映的商朝司法的重要特征是（ ）。","o":["神明裁判","五听折狱","滥刑拷囚","原心定罪"],"a":"A","e":"\u0001商代甲骨占卜行刑,依据神明吉凶决断,属于神明裁判。\u0002\nA✓ 商代甲骨占卜行刑,依据神明吉凶决断,属于神明裁判\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选\n\u0001“五听折狱”\u0002：西周五听; “滥刑拷囚”：唐宋拷讯; “原心定罪”：汉原心定罪。","k":"","kb":41,"kh":[[0,8],[110,161]]},{"id":"2026-48","y":2026,"t":"多","s":"《尚书吕刑》载:五刑之疑,有赦,五罚之疑,有赦,共审克之。《礼记王制》载:疑狱,汜与众共之。众疑,赦之。以上记载反映的中国古代刑法原则有（ ）。","o":["重罪轻刑","罚当其罪","众疑赦免","罪疑从轻"],"a":"CD","e":"\u0001疑罪从轻、众人皆疑则赦免,是原文核心原则,无重罪轻刑、罚当其罪表述。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✓ 符合题意及现行制度规定（\u0001众疑赦免\u0002）\nD✓ 符合题意及现行制度规定（\u0001罪疑从轻\u0002）","k":"","kb":41,"kh":[[86,109]]}]},{"sub":"中国宪法学","name":"国家性质与政党/基层群众自治","w":2.1,"w5":2.0,"wh":3.6,"bt":"","pt":"较早年有所回落·村居委会/街道办稳态2.0分","L":67,"qs":[{"id":"2005-18","y":2005,"t":"单","s":"新中国成立初期全国各族人民团结奋斗的共同政治基础是（ ）。","o":["1954 年《中华人民共和国宪法》","1949 年《中国人民政治协商会议共同纲领》","1946 年《陕甘宁边区宪法原则》","1931 年《中华苏维埃共和国宪法大纲》"],"a":"B","e":"\u00011949 年《中国人民政治协商会议共同纲领》起了新中国的临时宪法的作用,是新中国成立初期(1949~ 1953)全国各族人民团结奋斗的共同政治基础。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 1949 年\u0001《中国人民政治协商会议共同纲领》\u0002起了新中国的临时宪法的作用,是新中国成立初期(1949~ 1953)全国各族人民团结奋斗的共同政治基础\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选\n相关表述CD 时间概念明显不对,理应排除。","k":"","kb":23,"kh":[[0,21],[22,65]]},{"id":"2005-20","y":2005,"t":"单","s":"根据我国宪法修正案,在爱国统一战线中新增加的社会阶层是（ ）。","o":["社会主义劳动者","社会主义事业的建设者","拥护社会主义的爱国者","拥护祖国统一的爱国者"],"a":"B","e":"\u0001依据题干考查要点，正确表述为“社会主义事业的建设者”。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 符合题意及现行制度规定（\u0001社会主义事业的建设者\u0002）\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 2004 年宪法修正案第19 条规定:宪法序言第十自然段第二句\"在长期的革命和建设过程中,已经结成由中国共产党领导的,有各民主党派和各人民团体参加的,包括全体社会主义劳动者、拥护社会主义的爱…\n2004 年宪法修正案第19 条规定:宪法序言第十自然段第二句\"在长期的革命和建设过程中,已经结成由中国共产党领导的,有各民主党派和各人民团体参加的,包括全体社会主义劳动者、拥护社会主义的爱国者和拥护祖国统一的爱国者的广泛的爱国统一战线,这个统一战线将继续巩固和发展。 \"修改为:\"在长期的革命和建设过程中,已经结成由中国共产党领导的,有各民主党派和各人民团体参加的,包括全体社会主义劳动者、社会主义事业的建设者、拥护社会主义的爱国者和拥护祖国统一的爱国者的广泛的爱国统一战线,这个统一战线将继续巩固和发展。\n【修宪动态】2018年《宪法修正案》在爱国统一战线表述中进一步增加了“致力于中华民族伟大复兴的爱国者”。","k":"","kb":27,"kh":[[15,132],[212,239]]},{"id":"2005-21","y":2005,"t":"单","s":"在我国,基层人民政府可以依法设立的派出机关是（ ）。","o":["行政公署","街道办事处","居民委员会","信访办公室"],"a":"B","e":"\u0001行政公署,也属于人民政府的派出机关,但根据该条第1 款,其是省、自治区的人民政府的派出机关。\u0002\nA✗ 行政公署,也属于人民政府的派出机关,但根据该条第1 款,其是省、自治区的人民政府的派出机关\nB✓ 根据\u0001《地方各级人民代表大会和地方各级人民政府组织法》\u0002第68 条第3 款,市辖区、不设区的市的人民政府,经上一级人民政府批准,可以设立若干街道办事处,作为它的派出机关\nC✗ 不属于国家机关,而是基层群众自治组织\nD✗ 信访办公室,也不是派出机关,而是有关机关团体的办事机构\n在我国,基层人民政府,在农村为乡、民族乡、镇人民政府,在城市为不设区人民政府、市辖区人民政府。 因此,应当排除。","k":"","kb":29,"kh":[[0,160],[161,227]]},{"id":"2005-30","y":2005,"t":"单","s":"依照村民委员会组织法的规定,村民委员会对（ ）。","o":["村民负责","村民会议负责","村党支部负责","乡政府负责"],"a":"B","e":"\u0001《村民委员会组织法》第18 条第1 款规定:\"村民委员会向村民会议负责并报告工作。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ \u0001《村民委员会组织法》\u0002第18 条第1 款规定:\"村民委员会向村民会议负责并报告工作\nC✗ \"如果村民委员会对村党支部负责,则妨碍了村民开展自治活动、直接行使民主权利\nD✗ 与题干设问或现行制度要件不符，故不选\n村民会议每年审议村民委员会的工作报告,并评议村民委员会成员的工作。 村民是单个的人,村民委员会办理本村的公共事务和公益事业,当然不对个别村民负责,而应当向村民的整体——村民会议负责。 该法第3 条规定:\"中国共产党在农村的基层组织,按照中国共产党章程进行工作,发挥领导核心作用; 依照宪法和法律,支持和保障村民开展自治活动、直接行使民主权利。 根据该法第4 条第1 款,乡、民族乡、镇的人民政府对村民委员会的工作给予指导、支持和帮助。","k":"","kb":29,"kh":[[0,160],[161,227]]},{"id":"2005-58","y":2005,"t":"多","s":"依据我国现行宪法,人民依照法律规定,通过各种途径和形式管理（ ）。","o":["国家事务","经济和文化事务","社会公益事务","社会事务"],"a":"AD","e":"\u0001宪法第2 条第3 款规定:\"人民依照法律规定,通过各种途径和形式,管理国家事务,管理经济和文化事业,管理社会事务。\u0002\nA✓ 符合题意及现行制度规定（\u0001国家事务\u0002）\nB✗ 的 \"事务\"与宪法明确规定的\"事业\"不符\nC✗ 社会公益事务,也属于社会事务,但不是宪法的明确规定\nD✓ 符合题意及现行制度规定（\u0001社会事务\u0002）\n\"据此,\u0001“国家事务”\u0002 由于本题的题干明确要求\"依据我国现行宪法\",“经济和文化事务” 中的 \"事务\"与宪法明确规定的\"事业\"不符; 因此不选该项、 C。","k":"","kb":27,"kh":[[15,132]]},{"id":"2005-60","y":2005,"t":"多","s":"当代中国政党制度的特点是（ ）。","o":["中国共产党是执政党","各民主党派是在野党","各民主党派是反对党","各民主党派是参政党"],"a":"AD","e":"\u0001特别注意:当代中国政党制度是中国共产党领导的多党合作和政治协商制度。\u0002\nA✓ 特别注意:当代中国政党制度是中国共产党领导的多党合作和政治协商制度\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ 在该制度下,各民主党派是参政党,而非在野党,也非反对党","k":"","kb":27,"kh":[[133,177],[177,212]]},{"id":"2006-21","y":2006,"t":"单","s":"甲村与乙村毗邻,乙村的用水源自流经甲村的小河,多年来,两村经常因用水问题发生冲突。为根本解决问题, 县政府决定将这条小河的水流交给乡水管站统一调配。甲村认为这条小河在历史上就属于该村所有,县政府无权将这条河的水流交水管站统一调配,将县政府告上法院。根据现行宪法和法律,下列说法中正确的是（ ）。","o":["甲村告得有理,因为水流属于集体所有,政府统一调配用水应事先征得甲村同意","甲村告得有理,因为这条不河的河床属于甲村所有,这条小河的水流当然了属于集体所有","县政府的决定合法,因为水流属于国家所有,政府当然有权调配河水的供应","县政府的决定合法,因为水流虽然属于甲村所有,但乙村人也有喝水用水的权利,为了解决乙村的用水问题, 县政府可以将水流供应统一调配"],"a":"C","e":"\u0001因为水流资源与矿产资源是专属于国家所有的。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✓ 因为水流资源与矿产资源是专属于国家所有的\nD✗ 与题干设问或现行制度要件不符，故不选","k":"","kb":28,"kh":[[105,193],[214,248]]},{"id":"2006-23","y":2006,"t":"单","s":"中国人民政治协商会议在性质上属于（ ）。","o":["国家机关","人民团体","自治组织","爱国统一战线组织"],"a":"D","e":"\u0001在性质上来说不属于国家机构体系,不是一个国家机关,但也不同于一般的人民团体,他是我国爱国统一战线和多党合作的重要组成组织形式。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ 国人民政治协商会议在性质既是爱国统一战线的重要组织形式也是中国共产党领导的多党合作和政治协商制度的重要组成组织形式\n【修宪动态】2018年《宪法修正案》增设国家监察委员会作为国家机构组成部分；政协仍保持爱国统一战线组织性质。","k":"","kb":27,"kh":[[15,132],[212,239]]},{"id":"2006-25","y":2006,"t":"单","s":"下列关于村民委员会的表述,错误的是（ ）。","o":["村民委员会对村民会议负责,向村民会议报告工作","村民委员会组成人员由村民直接选举产生","村民委员会的设立、撤销、范围调整,由乡、民族乡、镇的人民政府提出,必须经村民会议讨论同意后,报县有民政府批准","村民会议由村民委员会召集,如有 1/20 以上村民提议,应召集村民会议"],"a":"D","e":"\u0001村民委员会向村民会议负责并报告工作。\u0002\nA✗ 村民委员会向村民会议负责并报告工作\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 村民会议每年审议村民委员会的工作报告,并评议村民委员会成员的工作\nD✓ 村民会议由村民委员会召集,如有1/10 以上村民提议,应召集村民会议\n本题考察的是村民会议村民会议制度。","k":"","kb":29,"kh":[[0,160],[161,227]]},{"id":"2006-30","y":2006,"t":"单","s":"在中国人民政治协商会议第一届全体会议会后,我国当时设置的国家元首是（ ）。","o":["中央人民政府委员会主席","中央人民政府委员会","政务院","人民革命军事委员会"],"a":"B","e":"\u0001《指南》(第六版)第665 页,国家机构的历史发展。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 符合题意及现行制度规定（\u0001中央人民政府委员会\u0002）\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选\n在中央,由中国人政治协商会议全体会议代行全国人民代表大会的职权,选举中央人民政府委员会,并付之以行使国家权力职权。","k":"","kb":37,"kh":[[0,30],[379,441]]},{"id":"2006-54","y":2006,"t":"多","s":"根据我国现行宪法的规定,国家对非公有制经济发展的指导方针是（ ）。","o":["鼓励","支持","引导","指导"],"a":"ABC","e":"\u0001《宪法》第11 条规定, 在法律规定范围内的个体经济、私营经济等非公有制经济,是社会主义市场经济的重要组成部分。\u0002\nA✓ 国家保护个体经济、私营经济等非公有制经济的合法的权利和利益\nB✓ 符合题意及现行制度规定（\u0001支持\u0002）\nC✓ 符合题意及现行制度规定（\u0001引导\u0002）\nD✗ 与题干设问或现行制度要件不符，故不选\n国家鼓励、支持和引导非公有制经济的发展, 并对非公有制经济依法实行监督和管理。","k":"","kb":28,"kh":[[0,27]]},{"id":"2006-59","y":2006,"t":"多","s":"新民主主义革命时期,统一战线包括（ ）。","o":["工人阶级","农民阶级","小资产阶级","民族资产阶级"],"a":"ABCD","e":"\u0001新民主主义革命时期,统一战线包括1工人阶级,2农民阶级,3学生,4小资产阶级,5民族资产阶级,6其他爱国者参加的特种形式的阶级联盟。\u0002\nA✓ 符合题意及现行制度规定（\u0001工人阶级\u0002）\nB✓ 符合题意及现行制度规定（\u0001农民阶级\u0002）\nC✓ 符合题意及现行制度规定（\u0001小资产阶级\u0002）\nD✓ 新民主主义革命时期,统一战线包括1工人阶级,2农民阶级,3学生,4小资产阶级,5民族资产阶级,6其他爱国者参加的特种形式的阶级联盟","k":"","kb":27,"kh":[[15,132]]},{"id":"2007-16","y":2007,"t":"单","s":"我国人民民主专政的根本标志是 （ ）。","o":["工人阶级对国家的领导","工农联盟","生产资料公有制","国有经济的主导地位"],"a":"A","e":"\u0001人民民主专政我国的国家性质是工人阶级领导的、以工农联盟为基础的人民民主专政的社会主义国家。\u0002\nA✓ 人民民主专政我国的国家性质是工人阶级领导的、以工农联盟为基础的人民民主专政的社会主义国家\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选\n其中,工人阶级掌握国家政权,成为领导力量,是人民民主专政的根本标志。","k":"","kb":27,"kh":[[15,132]]},{"id":"2007-21","y":2007,"t":"单","s":"根据我国现行宪法的规定,农村集体经济组织实行的经营体制是 （ ）。","o":["家庭承包经营为基础、统分结合的双层经营体制","家庭联产承包为主的责任制和合作经济","家庭联产承包责任制","家庭承包责任制"],"a":"A","e":"\u0001集体所有制经济宪法修正案第 15 条规定:农村集体经济组织实行家庭承包经营为基础、统分结合的双层经营体制。\u0002\nA✓ 集体所有制经济宪法修正案第 15 条规定:农村集体经济组织实行家庭承包经营为基础、统分结合的双层经营体制\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选","k":"","kb":28,"kh":[[105,193],[288,320]]},{"id":"2007-22","y":2007,"t":"单","s":"中国共产党同各民主党派合作的政治基础是 （ ）。","o":["坚持中国共产党的领导","各民主党派享有政治自由","各民主党派保持相对独立","长期共存、互相监督、肝胆相照、荣辱与共"],"a":"A","e":"\u0001共产党领导的多党合作在我国,中国共产党是执政党,是社会主义事业的领导核心。\u0002\nA✓ 坚持共产党的领导,坚持四项基本原则,是中国共产党同各民主党派合作的政治基础\nB✗ 项不符合题目要求\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选\n各民主党派是参政党, 有在宪法规定范围内的政治自由、组织独立和法律地位平等。 长期共存、互相监督、肝胆相照、荣辱与共是中国共产党同各民主党派合作的基本方针。","k":"","kb":27,"kh":[[133,177],[177,212]]},{"id":"2008-16","y":2008,"t":"单","s":"在我国社会主义建设时期,爱国统一战线的性质是（ ）。","o":["政治联盟","工农联盟","民主联盟","社会联盟"],"a":"A","e":"\u0001一般地,爱国统一战线属于政治联盟,其政治基础是社会主义和爱国主义。\u0002\nA✓ 一般地,爱国统一战线属于政治联盟,其政治基础是社会主义和爱国主义\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选\n根据宪法序言第十自然段,在长期革命和建设过程中,已经结成由中国共产党领导的,有各民主党派和各人民团体参加的,包括全体社会主义劳动者、社会主义事业的建设者、拥护社会主义的爱国者和拥护祖国统一的爱国者的广泛的爱国统一战线,这个统一战线将继续巩固和发展。\n【修宪动态】2018年《宪法修正案》在爱国统一战线中增加了“致力于中华民族伟大复兴的爱国者”。","k":"","kb":27,"kh":[[15,132],[212,239]]},{"id":"2008-17","y":2008,"t":"单","s":"根据我国现行宪法的规定,农村群众的宅基地、自留地、自留山的所有权归属于（ ）。","o":["国家所有","集体所有","个人所有","集体与个人共有"],"a":"B","e":"\u0001根据《宪法》第10 条第2 款,宅基地和自留地、自留山,也属于集体所有。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 根据\u0001《宪法》\u0002第10 条第2 款,宅基地和自留地、自留山,也属于集体所有\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选","k":"","kb":28,"kh":[[105,193],[248,266]]},{"id":"2008-18","y":2008,"t":"单","s":"下列选项中,不属于我国法定的人民团体的是（ ）。","o":["共青团","工会","学生会","妇女联合会"],"a":"C","e":"\u0001学生会仅为学校内部的学生自治组织、无权参加政协,不属于人民团体。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✓ 学生会仅为学校内部的学生自治组织、无权参加政协,不属于人民团体\nD✗ 与题干设问或现行制度要件不符，故不选\n法定的人民团体有权参加我国各级政治协商会议。","k":"","kb":27,"kh":[[239,267]]},{"id":"2008-27","y":2008,"t":"单","s":"决定我国现阶段分配方式的根本因素是（ ）。","o":["经济发展水平","收入的多样性","改革开放的基本国策","所有制的结构形式"],"a":"A","e":"\u0001我国现阶段分配方法是\"按劳分配为主体、多种分配方式并存\"。\u0002\nA✓ 这是由我们社会主义初级阶段生产力发展水平和多种生产方式并存的实际状况决定的\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选","k":"","kb":27,"kh":[[15,132]]},{"id":"2008-59","y":2008,"t":"多","s":"我国基层群众性自治组织的活动原则包括（ ）。","o":["自我组织","自我管理","自我教育","自我服务"],"a":"BCD","e":"\u0001《村民委员会组织法》第2 条第1 款规定:村民委员会是村民自我管理、自我教育、自我服务的基层群众性自治组织,实行民主选举、民主决策、民主管理、民主监督。\u0002\nA✗ 村民委员会、居民委员会不能\"自我组织\",必须依照宪法和法律进行组织\nB✓ 符合题意及现行制度规定（\u0001自我管理\u0002）\nC✓ 符合题意及现行制度规定（\u0001自我教育\u0002）\nD✓ 符合题意及现行制度规定（\u0001自我服务\u0002）\n\u0001《城市居民委员会组织法》\u0002第2 条第1 款规定; 居民委员会是居民自我管理、自我教育、自我服务的基层群众性自治组织。 根据法律,村民委员会、居民委员会的设立、撤销、规模调整,最终由县级人民政府批准或者决定。","k":"","kb":29,"kh":[[0,160],[161,227]]},{"id":"2009-22","y":2009,"t":"单","s":"在政党关系中,中国共产党的领导体现为民主党派的（ ）。","o":["政治指导","政治领导","组织领导","思想领导"],"a":"B","e":"\u0001中国共产党在国家政权中居于领导地位,其领导地位表现为中国共产党是执政党,具体内容表现为政治领导,即政治原则、政治方向和重大方针政策的领导。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 国共产党在国家政权中居于领导地位,其领导地位表现为中国共产党是执政党,具体内容表现为政治领导,即政治原则、政治方向和重大方针政策的领导\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选\n中国共产党领导的多党合作和政治协商制度是我国的政党制度。","k":"","kb":27,"kh":[[133,177],[177,212]]},{"id":"2009-27","y":2009,"t":"单","s":"我国人民民主专政的最高原则是（ ）。","o":["工人阶级的领导","工农联盟","民主主体的广泛性","统一战线"],"a":"B","e":"\u0001根据我国宪法规定,中华人民共和国是工人阶级领导的、以工人阶领导的、以工农联盟为基础的人民民主专政的社会主义国家。\u0002\nA✗ 工人阶级是人民民主专政的领导力量,工农联盟是无产阶级专政的最高原则\nB✓ 符合题意及现行制度规定（\u0001工农联盟\u0002）\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选\n27、该项 本题考查人民民主专政。","k":"","kb":27,"kh":[[0,14],[15,132]]},{"id":"2009-28","y":2009,"t":"单","s":"在我国,社会主义政治文明建设的根本保障是（ ）。","o":["坚持以宪治国","实行人民民主专政","坚持中国共产党的领导","实行社会主义市场经济"],"a":"C","e":"\u0001社会共同体在长时期的。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✓ 在我国,建设社会主义政治文明的根本保障是要坚持中国共产党的领导\nD✗ 与题干设问或现行制度要件不符，故不选\n历史发展中逐步从野蛮、暴力、专制的政治生活形态走向民主化、制度化、规范化和程序化的政治生活形态,即政治文明形态。","k":"","kb":27,"kh":[[15,132],[177,212]]},{"id":"2009-53","y":2009,"t":"多","s":"下列关于我国居民委员会的表述,正确的是（ ）。","o":["居民委员会对居民会议负责","居民委员会受上级政权机关的领导","居民委员会是最基层的一级政权机关","居民委员会由主任、副主任和委员5 至9 人组成"],"a":"AD","e":"\u0001根据《城市居民委员会组织法》第10 条规定,居民委员会想居民会议负责并报告工作。\u0002\nA✓ 根据\u0001《城市居民委员会组织法》\u0002第10 条规定,居民委员会想居民会议负责并报告工作\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 第2 条规定,居民委员会是居民自我管理、自我教育、自我服务的基层群众性自治组织\nD✓ 第7 条规定居民委员会由主任、副主任和委员共5 至9 人组成\n不设区的市、市辖区的人民政府或者它的派出机关对居民委员会协助不设的市、市辖区的人民政府或者它的派出机关是开展工作。 \u0001“居民委员会受上级政权机关的领导”\u0002和","k":"","kb":29,"kh":[[0,160],[161,227]]},{"id":"2010-24","y":2010,"t":"单","s":"下列关于我国村民委员会的表述,正确的是（ ）。","o":["村民委员会是村民自我组织的基层群众性组织","村民委员会组成人员由村民直接选举产生","村民委员会每届任期5年,其成员可连任","按照便于村民自治的原则,每个自然村设置村民委员会"],"a":"B","e":"\u0001根据《宪法》和《村民委员会组织法》的规定,村民委员会是村民自我管理、自我教育、自我服务的基层群众性自治组织,但不是村民自我组织。\u0002\nA✗ 根据\u0001《宪法》\u0002和\u0001《村民委员会组织法》\u0002的规定,村民委员会是村民自我管理、自我教育、自我服务的基层群众性自治组织,但不是村民自我组织\nB✓ 村民委员会由村民直接选举产生,任何组织或者个人不得指定、委派或者撤换村民委员会成员\nC✗ 村民委员会每届任期5年,可以连任\nD✗ 村民委员会根据居住状况、人口多少,按照便于群众自治,有利于经济发展和社会管理的原则设立, 未必每个自然村都设置村民委员会,人口较少的几个自然村可以设一个村民委员会,人口较多、规模较大的自然村…\n村民委员会根据居住状况、人口多少,按照便于群众自治,有利于经济发展和社会管理的原则设立, 未必每个自然村都设置村民委员会,人口较少的几个自然村可以设一个村民委员会,人口较多、规模较大的自然村可以设置多个村民委员会 本题,因为当时的\u0001《村民委员会组织法》\u0002规定村民委员会每届任期3年, 但2018年\u0001《村民委员会组织法》\u0002进行修订,将村民委员会任期修改为5年,\n【修法提示】2018年12月修改的《村民委员会组织法》第11条已将村委会每届任期由3年改为5年；若题干中该选项已相应改为“每届任期5年”，则“直接选举产生”与“每届任期5年、可连任”均符合现行法（2010年原卷该项为3年，原答案仅选直接选举一项）。","k":"","kb":29,"kh":[[0,160],[161,227]]},{"id":"2010-28","y":2010,"t":"单","s":"1947年成立的第一个民族自治政府即内蒙古自治政府的法律依据是（ ）。","o":["《陕甘宁边区宪法原则》","《陕甘宁边区施政纲领》","《中华苏维埃共和国宪法大纲》","《中国人民政治协商会议共同纲领》"],"a":"A","e":"\u00011946年的《陕甘宁边区宪法原则》规定少数民族聚居区享有民族区域自治的权利,这是1954 年《宪法》中民族自治原则的来源。\u0002\nA✓ 1946年的\u0001《陕甘宁边区宪法原则》\u0002规定少数民族聚居区享有民族区域自治的权利,这是1954 年\u0001《宪法》\u0002中民族自治原则的来源\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选\n内蒙古自治政府即依此成立。 总结一下各个自治区的设立时间:(1)内蒙古自治区:1947年5 月1日。 (2)新疆维吾尔自治区:1955年10月1日。 (3)广西壮族自治区:1958年3月5日成立广西僮族自治区,1965年改为广西壮族自治区。 (4)宁夏回族自治区:1958 年10月25日。 (5)西藏自治区:196 5年9 月1日。","k":"","kb":23,"kh":[[0,21],[22,65]]},{"id":"2010-29","y":2010,"t":"单","s":"最早确立政党制度的国家是（ ）。","o":["美国","英国","德国","法国"],"a":"B","e":"\u0001英国是世界上最早出现资产阶级政党, 并最先确立和实行政党制的国家。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 符合题意及现行制度规定（\u0001英国\u0002）\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选","k":"","kb":27,"kh":[[15,132]]},{"id":"2011-29","y":2011,"t":"单","s":"根据我国现行《宪法》和法律的规定,设立居民委员会依据的原则是（ ）。","o":["便于治安管理原则","便于经济发展原则","便于居民自治原则","便于行政指导原则"],"a":"C","e":"\u0001城市居民委员属于基层群众自治组织, 是实行自我管理、自我教育、自我服务的社会组织。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✓ 其设立的原则要遵循便于居民自治的原则\nD✗ 与题干设问或现行制度要件不符，故不选","k":"","kb":29,"kh":[[0,160],[161,227]]},{"id":"2011-56","y":2011,"t":"多","s":"根据我国现行《宪法》的规定,下列关于我国经济制度的表述,正确的是（ ）。","o":["社会主义经济制度的基础是生产资料的社会主义公有制","社会主义公有制包括全民所有制和劳动群众集体所有制","国有经济是国民经济的主导力量","个体经济和私营经济是社会主义市场经济的重要补充"],"a":"ABC","e":"\u0001我国的经济制度在宪法中的主要内容是:我国的基本经济制度是坚持以公有制为主体、多种所有制经济共同发展。\u0002\nA✓ 我国经济制度的基础是生产资料的社会主义公有制,即全民所有制和劳动群众集体所有制\nB✓ 符合题意及现行制度规定（\u0001社会主义公有制包括全民所有制和劳动群\u0002）\nC✓ 国有经济控制国民经济命脉,在经济发展中起主导作用\nD✗ 国家鼓励、支持和引导非公有制经济的发展, 并对非公有制经济依法实行监督和管理\n坚持按劳分配为主体、多种分配方式并存的分配制度; 社会主义市场经济是我国的经济体制; 个体经济和私营经济属于社会主义非公有制经济,我国\u0001《宪法》\u0002规定,非公有制经济是我国市场经济的重要组成部分。 国家保护个体经济、私营经济等非公有制经济的合法权利和利益。","k":"","kb":28,"kh":[[0,27],[72,104]]},{"id":"2011-57","y":2011,"t":"多","s":"下列选项中,属于地方人民政府设立的派出机关的有（ ）。","o":["行政公署","村民委员会","街道办事处","居民委员会"],"a":"AC","e":"\u0001在我国,地方人民政府的派出机关主要有三种类型:省、自治区人民政府经国务院批准设立的行政公署。\u0002\nA✓ 在我国,地方人民政府的派出机关主要有三种类型:省、自治区人民政府经国务院批准设立的行政公署\nB✗ 与题干设问或现行制度要件不符，故不选\nC✓ 市辖区、不设区的市人民政府经上一级人民政府批准设立的街道办事处\nD✗ 与题干设问或现行制度要件不符，故不选\n县、自治县人民政府经省、自治区、直辖市人民政府批准设立的区公所; 村民委员会和居民委员会是基层群众自治性组织,不是地方人民政府的派出机关,它不是一级政权机关。","k":"","kb":29,"kh":[[0,160],[161,227]]},{"id":"2012-16","y":2012,"t":"单","s":"根据我国《宪法》的规定,下列关于土地制度的表述,正确的是（ ）。","o":["城市和城市郊区的土地属于国家所有","宅基地和自留地、自留山属于村民所有","任何组织或者个人不得侵占、买卖、出租或者以其他形式转让土地","国家为了公共利益的需要,可以依照法律对土地实行征收或征用并给予补偿"],"a":"D","e":"\u0001《宪法》第10条规定,城市的土地属于国家所有。\u0002\nA✗ 农村和城市郊区的土地,除由法律规定属于国家所有的以外,属于集体所有\nB✗ 宅基地和自留地、自留山,也属于集体所有\nC✗ 任何组织或者个人不得侵占、买卖或者以其他形式非法转让土地\nD✓ 国家为了公共利益的需要,可以依照法律规定对土地实行征收或者征用并给予补偿\n土地的使用权可以依照法律的规定转让。 一切使用土地的组织和个人必须合理地利用土地。","k":"","kb":28,"kh":[[105,193],[248,266]]},{"id":"2012-30","y":2012,"t":"单","s":"根据我国《宪法》的规定,下列自然资源中, 只能属于国家所有的是（ ）。","o":["山岭","矿藏","森林","草原"],"a":"B","e":"\u0001《宪法》第9 条规定,矿藏、水流、森林、山岭草原、荒地、滩涂等自然资源,都属于国家所有, 即全民所有。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 国家保障自然资源的合理利用,保护珍贵的动物和植物\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选\n由法律规定属于集体所有的森林和山岭草原、荒地、滩涂除外。 禁止任何组织或者个人用任何手段侵占或者破坏自然资源。","k":"","kb":28,"kh":[[0,27],[105,193]]},{"id":"2012-31","y":2012,"t":"单","s":"根据我国《宪法》的规定,城市中的居民委员 会是（ ）。","o":["社区居民的群众性组织","街道办事处的派出机关","基层群众性自治组织","社会工作者之家"],"a":"C","e":"\u0001城市居民委员会是城市居民自我管理、自我教育、自我服务的基层群众性自治组织。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✓ 城市居民委员会是城市居民自我管理、自我教育、自我服务的基层群众性自治组织\nD✗ 与题干设问或现行制度要件不符，故不选","k":"","kb":29,"kh":[[0,160],[161,227]]},{"id":"2013-16","y":2013,"t":"单","s":"我国《宪法》规定:“人民依照法律规定,通过各种途径和形式,管理国家事务,管理经济和文化事业,管理社会事务。”这一规定体现的宪法基本原则是 （ ）。","o":["法治","权力制约","人民主权","人权保障"],"a":"C","e":"\u0001此题考核宪法的基本原则。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✓ 人民主权原则在我国宪法中的体现为:中华人民共和国的一切权力属于人民, 人民行使国家权力的机关是全国人民代表大会和地方各级人民代表大会\nD✗ 与题干设问或现行制度要件不符，故不选\n宪法的原则包括:人民主权原则,基本人权原则,法治原则,权力制约与监督原则。 人民依照法律规定,通过各种途径和形式,管理国家事务,管理经济和文化事业,管理社会事务。","k":"","kb":22,"kh":[[0,93],[125,171]]},{"id":"2013-18","y":2013,"t":"单","s":"下列关于我国爱国统一战线的表述,不正确的是（ ）。","o":["以民主集中制为主要工作方式","以爱国主义为政治基础和界限范围","中国人民政治协商会议是其组织形式","坚持中国共产党的领导是其最高原则"],"a":"A","e":"\u0001特点有:(1)以中国共产党的领导为最高原则。\u0002\nA✓ (2)以政治协商为主要工作方式\nB✗ (3) 以爱国主义为政治基础和界限范围\nC✗ (5)以中国人民政 \"三大任务 (4)以治协商会议为组织形式\nD✗ 特点有:(1)以中国共产党的领导为最高原则\n爱国统一战线是指由中国共产党领导的,由各民主党派和人民团体参加的,包括社会主义劳动者拥护社会主义的爱国者、拥护祖国统一和致力于中华民族伟大复兴的爱国者和社会主义事业的建设者组成的政治联盟。 硕提示,2018年宪法修正案已经对爱国统一战线补充了重要内容:已经结成由中国共产党领导的,有各民主党派和各人民团体参加的,包括全体社会主义劳动者、社会主义事业的建设者、拥护社会主义的爱国者、拥护祖国统一和致力于中华民族伟大复兴的爱国者的广泛的爱国统一战线。\n【修宪动态】2018年《宪法修正案》在爱国统一战线中增加了“致力于中华民族伟大复兴的爱国者”。","k":"","kb":27,"kh":[[15,132],[212,239]]},{"id":"2013-58","y":2013,"t":"多","s":"根据宪法和法律规定,下列关于村民委员会的表述,正确的有（ ）。","o":["村民委员会实行村务公开制度","村民委员会的选举由乡选举委员会主持","村民委员会可以按照居住状况分设若干村民小组","村民委员会根据需要设立人民调解、治安保卫等委员会"],"a":"ACD","e":"\u0001村民委员会是农村村民自我管理、自我教育、自我服务的基层群众性自治组织。\u0002\nA✓ 村民委员会实行村务公开制度\nB✗ 村委会组成人员由村民直接选举产生,选举工作由村民选举委员会主持\nC✓ 村委会可以根据村民居住状况、集体土地所有权关系等分设若干村民小组\nD✓ 村委会根据需要,可设立若干下属委员会,如人民调解、治安保卫、公共卫生与计划生育等委员会","k":"","kb":29,"kh":[[0,160],[161,227]]},{"id":"2014-20","y":2014,"t":"单","s":"下列关于村民委员会的表述,不正确的是（ ）。","o":["村民委员会向乡人民政府负责并报告工作","村民委员会由主任、副主任和委员组成,由村民直接选举产生","村民委员会是村民自我管理、自我教育、自我服务的基层群众性自治组织 )。","村民委员会应当实行少数服从多数的民主决策机制和公开透明的工作原则"],"a":"A","e":"\u0001村委会对村民会议负责并报告工作,实行村务公开和民主集中制的工作原则。\u0002\nA✓ 村委会对村民会议负责并报告工作,实行村务公开和民主集中制的工作原则\nB✗ 村民委员会由主任,副主任和委员组成,由村民直接选举产生\nC✗ 村民委员会是农村村民自我管理、自我教育、自我服务的基层群众性自治组织,不用向政府部门负责或报告工作\nD✗ 与题干设问或现行制度要件不符，故不选\n村委会的设立、撤销、范围调整,由乡、民族乡、镇的入民政府提出,经村民会议讨论同意后,报县人民政府批准。 它不是一级行政机关,而是村民自我管理、自我教育、自我服务的社会组织。","k":"","kb":29,"kh":[[0,160],[161,227]]},{"id":"2014-22","y":2014,"t":"单","s":"根据现行《宪法》,下列关于我国在社会主义初级阶段实行的分配制度的表述,正确的是（ ）。","o":["不劳动者不得食","各尽所能,按需分配","按劳分配和按需分配相结合","按劳分配为主体、多种分配方式并存"],"a":"D","e":"\u0001我国《宪法》第6条第 3款规定,国家在社会主义初级阶段,坚持公有制为主体、多种所有制经济共同发展的基本经济制度,坚持按劳分配为主体,多种分配方式并存的分配制度。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ 我国\u0001《宪法》第6条\u0002第 3款规定,国家在社会主义初级阶段,坚持公有制为主体、多种所有制经济共同发展的基本经济制度,坚持按劳分配为主体,多种分配方式并存的分配制度\n(对于宪法及宪法修正案的法条一定要完全记住。 有些考题直接出自法条。","k":"","kb":28,"kh":[[0,27],[54,71]]},{"id":"2014-27","y":2014,"t":"单","s":"根据《宪法》规定,城镇中手工业、工业、建筑业、运输业、商业、服务业等行业的各种形式的合作经济是（ ）。","o":["个体经济","私营经济","国有经济","劳动群众集体所有制经济"],"a":"D","e":"\u0001《宪法》第8条规定, 城镇中手工业、工业、建筑业、运输业、商业、服务业等行业的各种形式的合作经济是社会主义劳动群众集体所有制经济。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ \u0001《宪法》第8条\u0002规定, 城镇中手工业、工业、建筑业、运输业、商业、服务业等行业的各种形式的合作经济是社会主义劳动群众集体所有制经济\n因此选\u0001“劳动群众集体所有制经济”\u0002。 宪法的有关考点,多为熟记型的法条题目,建议考生熟记宪法重要法条。","k":"","kb":28,"kh":[[72,104],[105,193]]},{"id":"2014-29","y":2014,"t":"单","s":"根据我国《宪法》规定,下列资源中,只能属于国家所有的是（ ）。","o":["森林","城市的土地","滩涂","草原"],"a":"B","e":"\u0001《宪法》第10条规定,城市的土地属于国家所有。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ \u0001《宪法》第10条\u0002规定,城市的土地属于国家所有\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选\n农村和城市郊区的土地,除法律规定属于国家所有的以外,属于集体所有; 宅基地和自留地、自留山,也属于集体所有。 对于自然资源,记住矿藏和水流只能属于国家所有,其他自然资源不一定。","k":"","kb":28,"kh":[[105,193],[248,266]]},{"id":"2015-17","y":2015,"t":"单","s":"根据我国《宪法》,下列关于非公有制经济的表述,不正确的是（ ）。","o":["国家保护非公有制经济的合法的权利和利益","非公有制经济是我国国民经济中的主导力量","非公有制经济是社会主义市场经济的重要组成部分","国家鼓励、支持和引导非公有制经济的发展, 并对非公有制经济依法实行监督和管理"],"a":"B","e":"\u0001在公有制经济中,全民所有制经济即国有经济具有特殊的地位,控制着我国的经济命脉,对经济的发展起着主导作用,是国民经济中的主导力量。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 在公有制经济中,全民所有制经济即国有经济具有特殊的地位,控制着我国的经济命脉,对经济的发展起着主导作用,是国民经济中的主导力量\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 国家对于非公有制经济的态度是鼓励、支持和引导,并且实行监督和管理\n非公有制经济是我国的重要组成部分。","k":"","kb":28,"kh":[[0,27],[72,104]]},{"id":"2015-18","y":2015,"t":"单","s":"根据2004年《宪法修正案》,爱国统一战线中增加的社会群体是（ ）。","o":["全体社会主义劳动者","社会主义事业的建设者","拥护社会主义的爱国者","拥护祖国统一的爱国者"],"a":"B","e":"\u0001根据2004年《宪法修正案》,爱国统一战线中增加的社会群体是社会主义事业的建设者。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 根据2004年\u0001《宪法修正案》\u0002,爱国统一战线中增加的社会群体是社会主义事业的建设者\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 需要注意的是,2018 年宪法修正案在爱国统一战线中新增了致力于中华民族伟大复兴的爱国者,注意掌握\n【修宪动态】2018年《宪法修正案》在爱国统一战线中进一步增加了“致力于中华民族伟大复兴的爱国者”。","k":"","kb":27,"kh":[[15,132],[212,239]]},{"id":"2015-24","y":2015,"t":"单","s":"下列关于城市居民委员会的说法,不正确的是（ ）。","o":["居民委员会一般在100户至700户的范围内设立","居民委员会每届任期3年,其成员不得连选连任","居民委员会可根据需要,设立人民调解、治安保卫、公共卫生等委员会","居民委员会是城市居民自我管理、自我教育、自我服务的基层群众性自治组织"],"a":"B","e":"\u0001居民委员会一般在100户至700户的范围内设立。\u0002\nA✗ 居民委员会一般在100户至700户的范围内设立\nB✓ 居民委员会的任期五年,可以连选连任,没有两届的限制\nC✗ 居民委员会可根据需要,设立人民调解、治安保卫、公共卫生等委员会\nD✗ 居民委员会是城市居民自我管理、自我教育、自我服务的基层群众性自治组织\n【修法提示】2018年12月修改的《城市居民委员会组织法》第8条已将居委会每届任期由3年改为5年，可连选连任。","k":"","kb":29,"kh":[[0,160],[161,227]]},{"id":"2015-54","y":2015,"t":"多","s":"根据我国《宪法》,下列自然资源既可属于国家所有,也可属于集体所有的有（ ）。","o":["矿藏","水流","森林","草原"],"a":"CD","e":"\u0001《宪法》第9条规定:\"矿藏、水流、森林、山岭、草原荒地、滩涂等自然资源,都属于国家所有,即全民所有。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✓ 符合题意及现行制度规定（\u0001森林\u0002）\nD✓ 符合题意及现行制度规定（\u0001草原\u0002）\n由法律规定属于集体所有的森林和山岭、草原、荒地、滩涂除外。","k":"","kb":28,"kh":[[0,27],[105,193]]},{"id":"2016-22","y":2016,"t":"单","s":"东风地质队在白兔村勘探时,发现高某承包的竹园地下有丰富的钨矿。此钨矿的所有权属于 （ ）。","o":["国家","白兔村","高某","东风地质队"],"a":"A","e":"\u0001《宪法》第9条第一款规定:矿藏、水流、森林、山岭、草原、荒地、滩涂等自然资源,都属于国家所有,即全民所有。\u0002\nA✓ 本题中,鸽矿是矿藏,虽然位于白兔村高某承包的竹园底下,但是根据宪法的规定,矿藏属于国家所有,不属于白兔村、高某,更不属于东风地质队\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选\n由法律规定属于集体所有的森林和山岭、草原、荒地、滩涂除外。","k":"","kb":28,"kh":[[0,27],[105,193]]},{"id":"2016-54","y":2016,"t":"多","s":"根据我国《宪法》,下列关于非公有制经济的表述,正确的有（ ）。","o":["非公有制经济包括个体经济、私营经济和集体所有制经济","非公有制经济是社会主义市场经济的重要组成部分","国家对非公有制经济依法实行监督和管理","国家保障非公有制经济的巩固和发展"],"a":"BC","e":"\u0001集体所有制经济是公有制经济,非公有 \" ,A选 \"三资经济制经济包括个体经济、私营经济和项错误。\u0002\nA✗ 集体所有制经济是公有制经济,非公有 \" ,A选 \"三资经济制经济包括个体经济、私营经济和项\nB✓ 非公有制经济是社会主义市场经济的重要组成部分,国家鼓励、支持和引导非公有制经济的发展,并对非公有制经济依法实行监督和管理\nC✓ 非公有制经济是社会主义市场经济的重要组成部分,国家鼓励、支持和引导非公有制经济的发展,并对非公有制经济依法实行监督和管理\nD✗ 国家保障国有经济的巩固和发展,而不是非公有制经济","k":"","kb":28,"kh":[[0,27],[72,104]]},{"id":"2016-57","y":2016,"t":"多","s":"下列关于中国人民政治协商会议的表述,正确的有（ ）。","o":["政协是中国人民的爱国统一战线组织","政协是国家机关,属于国家机构体系的组成部分","政协是人民团体开展民主自治、民主决策的重要形式","政协具有政治协商、民主监督、参政议政的职能"],"a":"AD","e":"\u0001在性质上,政协不属于国家机构体系,不是国家机关,也不同于一般的人民团体,而是爱国统一战线和多党合作的重要形式该项。\u0002\nA✓ 在性质上,政协不属于国家机构体系,不是国家机关,也不同于一般的人民团体,而是爱国统一战线和多党合作的重要形式\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ 人民政协的职能是政治协商、民主监督、参政议政\n\"政协 \", 中国人民政治协商会议,简称是我国爱国统一战线的组织形式。","k":"","kb":27,"kh":[[15,132],[212,239]]},{"id":"2017-28","y":2017,"t":"单","s":"根据现行宪法和法律,下列关于村民委员会的表述,正确的是（ ）。","o":["乡镇政府可直接设立村民委员会,报县政府批准","户籍在本村但不在本村居住的外嫁女,可以参加本村的村委会选举","村民委员会可以制定和修改村民自治章程,并报乡镇政府备案","乡镇政府领导、支持和帮助村民委员会的工作"],"a":"B","e":"\u0001《村民委员会组织法》第3条第2款规定:\"村民委员会的设立、撤销、范围调整,由乡、民族乡镇的人民政府提出,经村民会议讨论同意,报县级人民政府批准。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 村民委员会选举前,应当对下列入员进行登记,列入参加选举的村民名单:(一)户籍在本村并且在本村居住的村民\nC✗ 第 27条第1款规定:\"村民会议可以制定和修改村民自治章程、村规民约,并报乡、民族乡、镇的人民政府备案\nD✗ 第5条第1款规定:\"乡、民族乡、镇的人民政府对村民委员会的工作给予指导支持和帮助,但是不得干预依法属于村民自治范 \" 据此,乡镇政府是 \" 村民委员会 \"指导围内的事项\n第13条规定: \" 领导 \"年满的工作,而非十八周岁的村民,不分民族、种族、性别、职业、家庭出身、宗教信仰、教育程度、财产状况、居住期限,都有选举权和被选举权; 但是,依照法律被剥夺政治权利的人除外。 (二)户籍在本村,不在本村居住,本人表示参加选举的村民; (三)户籍不在本村, 在本村居住一年以上,本人申请参加选举,并且经村民会议或者村民代表会议同意参加选举的公民。 已在户籍所在村或者居住村登记参加选举的村民,不得再参加其他地方村民委员会的选举。","k":"","kb":29,"kh":[[0,160],[161,227]]},{"id":"2018-14","y":2018,"t":"单","s":"关于中国人民政治协商会议的说法,下列表述正确的是（ ）。","o":["中国人民政治协商会议由选民选举产生,对选民负责","中国人民政治协商会议与全国人民代表大会共同行使国家立法权","现行宪法在“国家机构”一章中规定了中国人民政治协商会议参政议政职能","1949年中国人民政治协商会议通过了《共同纲领》,行使了一定范围的制宪权"],"a":"D","e":"\u0001依据题干考查要点，正确表述为“1949年中国人民政治协商会议通过了《共同纲领》,行使了一定范围”。\u0002\nA✗ 政协委员的产生程序是各单位政协提名推荐,中共党委有关部门对推荐的名单进行综合评定,并同各推荐单位协商,形成建议名单,再将建议名单报到政协常务委员会进行协商,经全部常务委员过半数同意通过,所以…\nB✗ 政协没有立法权\nC✗ 政协不是国家机构\nD✓ 符合题意及现行制度规定（\u00011949年中国人民政治协商会议通过了\u0002）\n政协委员的产生程序是各单位政协提名推荐,中共党委有关部门对推荐的名单进行综合评定,并同各推荐单位协商,形成建议名单,再将建议名单报到政协常务委员会进行协商,经全部常务委员过半数同意通过,所以,政协委员不是选民选举产生。","k":"","kb":23,"kh":[[22,65],[103,168]]},{"id":"2019-14","y":2019,"t":"单","s":"下列关于我国社会主义公有制的表述,正确的是（ ）。","o":["国有经济是国民经济的重要组成部分","集体所有制经济是公有制经济的主导力量","农村实行集体所有制,城镇实行全民所有制","社会主义公有制包括全民所有制和劳动群众集体所有制"],"a":"D","e":"\u0001公有制经济,是指国有经济、集体经济以及混合所有制经济中的国有成分和集体成分。\u0002\nA✗ 国有经济是国民经济的主导力量,非公有制经济当然应该是国民经济的重要组成部分\nB✗ 集体经济是公有制经济的重要组成部分而非主导力量\nC✗ 农村的土地实行集体所有制,城镇也有集体所有制经济\nD✓ 社会主义公有制包括全民所有制和劳动群众集体所有制","k":"","kb":28,"kh":[[28,54],[72,104]]},{"id":"2019-25","y":2019,"t":"单","s":"根据我国宪法,下列自然资源专属国家所有 .的是（ ）。","o":["农村的土地","荒地、滩涂","矿藏、水流","森林、山岭"],"a":"C","e":"\u0001《宪法》第9条规定:矿藏、水流、森林、山岭、草原、荒地、滩涂等自然资源,都属于国家所有, 即全民所有。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 由法律规定属于集体所有的森林和山岭、草原、荒地、滩涂除外\nC✓ 专属于国家所有的自然资源是矿藏和水流,其他都可以依据法律规定为集体所有\nD✗ 与题干设问或现行制度要件不符，故不选\n本题在往年考过一样的原题, 硕建议同学们一定要重视历年真题。","k":"","kb":28,"kh":[[0,27],[105,193]]},{"id":"2019-27","y":2019,"t":"单","s":"根据村民委员会组织法,下列关于村务监督机构的表述,正确的是（ ）。","o":["村务监督机构有权撤销村委会的决定","村务监督机构成员在村民代表中推选产生","村务监督机构负责村民民主理财和村务公开工作","村务监督机构成员向村民会议和村民代表会议负责"],"a":"D","e":"\u0001《村民委员会组织法》第23条规定:村民会议审议村民委员会的年度工作报告,评议村民委员会成员的工作。\u0002\nA✗ 村民会议有权撤销村民委员会的决定,不是村务监督机构撤销\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 村务监督机构是监督村 \"村民代表的是务公开而不是负责村务公开工作\nD✓ 村务监督机构成员向村民会议和村民代表会议负责,可以列席村民委员会会议\n有权撤销或者变更村民委员会不适当的决定; 有权撤销或者变更村民代表会议不适当的决定。 村民会议可以授权村民代表会议审议村民委员会的年度工作报告,评议村民委员会成员的工作, 撤销或者变更村民委员会不适当的决定。 第32条规定:村应当建立村务监督委员会或者其他形式的村务监督机构,负责村民民主理财,监督村务公开等制度的落实,其成员由村民会议或者村民代表会议在村民中推选产生,\u0001“村务监督机构成员在村民代表中推选产生”\u0002写 \" ,所以错误。","k":"","kb":29,"kh":[[0,160],[161,227]]},{"id":"2020-14","y":2020,"t":"单","s":"下列有关我国土地制度的表述,正确的是（ ）。","o":["荒地属于国家所有","宅基地和自留地、自留山属于集体所有","为提高土地利用效率,土地所有权可以转让","城市郊区的土地除由法律规定属于集体所有的以外,属于国家所有"],"a":"B","e":"\u0001《宪法》第9条第1款规定:\"矿藏、水流、森林、山岭、草原、荒地、滩涂等自然资源,都属于国家所有,即全民所有。\u0002\nA✗ \u0001《宪法》第9条第1款\u0002规定:\"矿藏、水流、森林、山岭、草原、荒地、滩涂等自然资源,都属于国家所有,即全民所有\nB✓ 宅基地和自留地、自留山,也属于集体所有\nC✗ \"土地所有权不可以转让,转让的是土地使用权\nD✗ 农村和城第1款规定: 市郊区的土地, 委员会组织法》第6条规定:\"居民委员会根据居民居住状况,按照便于居民自治的原则,一般在一百户至七百户的范围内设立。\u0002\nA✗ 第8条第1款规定:\"居民委员会主任、副主任和委员,由本居住地区全体有选举权的居民或者由每户派代表选举产生\nB✗ 第14条规定: 民委员会可以分设若干居民小组,小组长由居民小组推选\nC✗ \u0001《城市居民委员会组织法》第6条\u0002规定:\"居民委员会根据居民居住状况,按照便于居民自治的原则,一般在一百户至七百户的范围内设立\nD✓ 居民委员会的设立、撤销、规模调整,由不设区的市、市辖区的人民政府决定\n根据居民意见,也可以由每个居民小组选举代表二至三人选举产生。 居民委员会每届任期五年, 其成员可以连选连任。","k":"","kb":29,"kh":[[0,160],[161,227]]},{"id":"2022-21","y":2022,"t":"单","s":"下列关于我国土地制度的表述,正确的是（ ）。","o":["农村的土地属于农民所有","土地所有权可以依法进行转让","1978年宪法首次规定城市的土地属于国家所有","城市郊区的土地除由法律规定属于国家所有的以外,属于集体所有"],"a":"D","e":"\u0001根据《宪法》第10条规定,城市的土地属于国家所有。\u0002\nA✗ 农村和城市郊区的土地,除由法律规定属于国家所有的以外,属于集体所有\nB✗ 土地所有权属于国家或集体所有, 不可以转让,而土地使用权可以依法进行转让\nC✗ 1982年宪法首次规定城市的土地属于国家所有\nD✓ 农村和城市郊区的土地,除由法律规定属于国家所有的以外,属于集体所有","k":"","kb":28,"kh":[[105,193],[214,248]]},{"id":"2022-24","y":2022,"t":"单","s":"根据我国宪法和法律,下列关于村民委员会的表述,正确的是（ ）。","o":["村民委员会是村民开展自我管理、自我教育、自我服务的基层群众性自治组织","村民委员会由村民小组选举产生","乡镇人民政府领导、支持和帮助村民委员会开展工作","乡镇人民政府对不履行法定义务的村民委员会成员给予处分"],"a":"A","e":"\u0001根据我国《村民委员会组织法》的规定,村民委员会是村民自我管理、自我教育、自我服务的基层群众性自治组织。\u0002\nA✓ 根据我国\u0001《村民委员会组织法》\u0002的规定,村民委员会是村民自我管理、自我教育、自我服务的基层群众性自治组织\nB✗ 村民委员会主任、副主任和委员,由村民直接选举产生\nC✗ 乡、民族乡、镇的人民政府对村民委员会的工作给予指导、支持和帮助,但是不得干预依法属于村民自治范围内的事项\nD✗ 村民委员会不依照法律、法规的规定履行法定义务的,由乡、民族乡、镇的人民政府责令改正,但乡、民族乡、镇的人民政府无权处分\n相关表述表述为\"领导\",而非 \"指导\"。","k":"","kb":29,"kh":[[0,160],[161,227]]},{"id":"2023-17","y":2023,"t":"单","s":"某市河东区科创社区居民委员会换届。根据《城市居民委员会组织法》,该居民委员会主任、副主任和委员的产生方式是（ ）。","o":["科创社区所在街道办事处任命","科创社区居民推荐,河东区人民政府任命","科创社区有选举权的居民通过选民登记后选举","科创社区全体有选举权的居民或者每户派代表选举"],"a":"D","e":"\u0001城市居委会主任、副主任和委员由全体有选举权的居民或每户派代表选举产生。\u0002\nA✗ 居委会是基层群众性自治组织，与街道办事处并非上下级隶属关系，\u0001街道办无权任命\u0002居委会成员\nB✗ 区政府对居委会提供指导支持与帮助，不得指定、委派或任命居委会成员\nC✗ 选民登记是选举\u0001县乡人大代表\u0002的法定程序，《城市居民委员会组织法》不采人大选民登记模式\nD✓ 依据《城市居民委员会组织法》，居委会组成人员由\u0001全体有选举权的居民或者每户派代表选举产生\u0002\n辨析两委选举差异：\u0001村委会\u0002由本村有选举权的村民直接选举；\u0001居委会\u0002可由全体有选举权居民、每户派代表或居民小组代表选举；两者每届任期现均为\u00015年\u0002。","k":"","kb":29,"kh":[[0,160],[161,227]]},{"id":"2023-23","y":2023,"t":"单","s":"2018年宪法修改,生态文明正式写入我国宪法。2022年,党的二十大报告指出,“尊重自然顺应自然、保护自然,是全面建设社会主义现代化国家的内在要求。”下列关于生态文明的表述,正确的是（ ）。","o":["生态文明建设对物质文明建设产生阻碍作用","站在人与自然和谐共生的高度谋划发展,是我国深入推进生态文明建设的战略要求","生态文明建设要求不得对自然资源进行商业开发","生态文明程度越高表明人类依赖自然的程度越小,强调主宰和征服自然"],"a":"B","e":"\u0001站在人与自然和谐共生的高度谋划发展，是深入推进我国生态文明建设的根本战略要求。\u0002\nA✗ 生态文明建设与物质文明建设相辅相成，良好生态环境本身即经济社会可持续发展支撑，并不构成阻碍\nB✓ 二十大报告与宪法生态文明理念明确要求\u0001尊重自然、顺应自然、保护自然，推进人与自然和谐共生\u0002\nC✗ 生态文明强调合理、可持续开发利用与保护并重，并非禁止对自然资源进行合法商业开发\nD✗ 主宰、征服自然的工业思维正是生态危机的根源，生态文明强调\u0001人与自然和谐共生\u0002\n2018年《宪法修正案》将“生态文明”写入宪法序言与第89条国务院职权，确立五位一体总体布局。","k":"","kb":28,"kh":[[0,27],[105,193]]},{"id":"2023-26","y":2023,"t":"单","s":"根据现行宪法,下列关于我国分配制度的表述,正确的是（ ）。","o":["国家实行各取所需的分配制度","我国的分配制度是由市场经济体制决定的","国家实行按劳分配为主体、多种分配方式并存的分配制度","国家在公有制经济中实行按需分配,在其他经济形式中实行按劳分配"],"a":"C","e":"\u0001《宪法》第6条规定，国家实行按劳分配为主体、多种分配方式并存的分配制度。\u0002\nA✗ 各取所需（按需分配）是共产主义高级阶段的分配原则，而非我国现阶段分配制度\nB✗ 我国的基本经济与分配制度归根结底是由现阶段\u0001社会主义初级阶段基本国情与所有制结构\u0002决定的\nC✓ 《宪法》第6条第2款明文规定：\u0001坚持按劳分配为主体、多种分配方式并存的分配制度\u0002\nD✗ 公有制经济内部同样实行按劳分配（非按需分配），多种所有制允许按生产要素贡献参与分配\n1999年《宪法修正案》确立“公有制为主体、多种所有制经济共同发展，按劳分配为主体、多种分配方式并存”。","k":"","kb":28,"kh":[[0,27],[54,71]]},{"id":"2023-46","y":2023,"t":"多","s":"某村坐落于山区,清水河穿村而过,村民在宅基地上建房时发现一处煤矿。根据我国宪法, 下列选项中,属于该村集体所有的有（ ）。","o":["煤矿","自留山","清水河","宅基地"],"a":"BD","e":"\u0001依《宪法》第9条和第10条，矿藏与水流专属于国家所有，宅基地和自留山属于集体所有。\u0002\nA✗ 煤矿属于\u0001矿藏\u0002，依据《宪法》第9条第1款专属于国家所有，不因位于集体宅基地地下而归村集体所有\nB✓ 《宪法》第10条第2款明文规定：\u0001宅基地和自留地、自留山，属于集体所有\u0002\nC✗ 清水河属于\u0001水流\u0002，依据《宪法》第9条第1款专属于国家所有\nD✓ 《宪法》第10条第2款明文规定：\u0001宅基地和自留地、自留山，属于集体所有\u0002\n自然资源归属铁律：\u0001矿藏、水流、城市土地专属国家\u0002；\u0001宅基地、自留地、自留山专属集体\u0002；森林山岭草原荒地滩涂原则国家、法定例外集体。","k":"","kb":28,"kh":[[105,193],[248,266]]},{"id":"2024-17","y":2024,"t":"单","s":"甲乙两村毗邻,乙村生活灌溉用水源自流经甲村的清河,甲乙两村常因用水问题出现矛盾,乡政府将该河的取水用水交给县水利管理服务站调配,甲村认为该河属于本村,县政府无权进行调配。根据我国宪法和法律规定,以下说法正确的是（ ）。","o":["水源属于集体所有,政府调配取水用水应经甲村同意","水源属于国家所有,政府负有对水资源有效利用的职责","该河流属于甲村所有,甲村有权取水用水","该河流属于甲村所有,为统筹邻村生活灌溉用水,政府有权统一调配"],"a":"B","e":"\u0001依《宪法》第9条，河流等水流资源专属于国家所有，地方政府负有依法统筹调配与有效利用职责。\u0002\nA✗ 河流属于水流，依宪法\u0001专属于国家所有而非村集体所有\u0002，取水调配无须征得甲村同意\nB✓ 《宪法》第9条第1款明确规定\u0001水流等自然资源属于国家所有（即全民所有）\u0002，县级政府及水利部门依法有权并有责统筹合理调配水资源\nC✗ 河流虽流经甲村地域，但依宪法所有权归属于国家而非甲村集体\nD✗ 同理，河流所有权归属于\u0001国家\u0002而非甲村，且调配正是基于国家水资源统筹管理职权\n宪法第9条自然资源记忆口诀：\u0001“矿水城市属国家，宅自留地归集体；其余林山草荒滩，国家为主例外集体”\u0002。","k":"","kb":28,"kh":[[105,193],[248,266]]},{"id":"2025-27","y":2025,"t":"单","s":"根据《村民委员会组织法》,下列关于村民委员会的表述,正确的是（ ）。","o":["村民委员会的设立,由乡镇人民政府决定","村民委员会成员实行任期和离任经济责任审计","村民委员会在乡镇人民政府的领导下开展工作","土地承包经营方案经村民委员会讨论决定方可办理"],"a":"B","e":"\u0001乡、民族乡、镇的人民政府对村民委员会的工作给予指导、支持和帮助,但是不得干预依法属于村民自治范围内的事项。\u0002\nA✗ 村民委员会的设立、撤销、范围调整,由乡、民族乡、镇的人民政府提出,经村民会议讨论同意,报县级人民政府批准\nB✓ 村民委员会成员实行任期和离任经济责任审计\nC✗ 乡、民族乡、镇的人民政府对村民委员会的工作给予指导、支持和帮助,但是不得干预依法属于村民自治范围内的事项\nD✗ 土地承包经营方案经村民会议讨论决定方可办理","k":"","kb":29,"kh":[[0,160],[161,227]]},{"id":"2026-27","y":2026,"t":"单","s":"根据我国宪法和法律,下列关于街道办事处的表述正确的是（ ）。","o":["街道办事处领导居民委员会的工作","公安派出所是街道办事处的工作部门","街道办事处是市辖区、不设区的市的人民政府的派出机关","街道办事处的设立由市人大常委会批准"],"a":"C","e":"\u0001“街道办事处领导居民委员会的工作”：街道办指导居委会,不领导。\u0002\nA✗ 街道办指导居委会,不领导\nB✗ 派出所公安系统,不属于街道办部门\nC✓ 街道办是市辖区、不设区市政府派出机关\nD✗ 设立由上级政府批准\n\u0001“公安派出所是街道办事处的工作部门”\u0002：派出所公安系统,不属于街道办部门;","k":"","kb":29,"kh":[[0,160],[161,227]]}]},{"sub":"中国宪法学","name":"国家结构形式与民族/特区制度","w":2.1,"w5":2.0,"wh":3.2,"bt":"","pt":"港澳基本法/地方立法权限稳态2.0分/年","L":58,"qs":[{"id":"2005-27","y":2005,"t":"单","s":"有权决定全国或者个别省、自治区、直辖市进入紧急状态的国家机关是（ ）。","o":["国务院","全国人民代表大会常务委员会","中央军事委员会","国家主席"],"a":"B","e":"\u0001根据宪法第89 条第16 项,依照法律规定决定省、自治区、直辖市的范围内部分地区进入紧急状态, 是国务院的职权。\u0002\nA✗ 根据宪法第89 条第16 项,依照法律规定决定省、自治区、直辖市的范围内部分地区进入紧急状态, 是国务院的职权\nB✓ 本题的区域范围是\"全国或者个别省、自治区、直辖市\",应当排除\nC✗ 央军事委员会对紧急状态没有决定权和宣布权,但可能依法派遣军队执行关于紧急状态的法律\nD✗ 全国或者个别省、自治区、直辖市进入紧急状态的决定权属于全国人大常委会,国家主席根据全国人大常委会的决定宣布进入紧急状态\n注意区分全国人大常委会与国务院紧急状态决定权在区域范围上的差别。 据此,\u0001“全国人民代表大会常务委员会”\u0002 排除。","k":"","kb":37,"kh":[[95,147],[199,378]]},{"id":"2005-29","y":2005,"t":"单","s":"我国民族区域自治制度的核心是（ ）。","o":["民族自治","自治权","区域自治","自治机关"],"a":"B","e":"\u0001民族区域自治是民族自治和区域自治的结合体,民族自治和区域自治都非民族区域自治制度的核心。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 自治权为核心\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 自治机关仅仅是行使自治权的国家机关而已","k 系、管理关系的法,特别行政区基本法规定了特别行政区的政府组成等内容,属于公法。\u0002\nA✓ 法律分类、法律效力、法系和法律渊源公法一般是指涉及公共权力、公共利益和服从关系、管理关系的法,特别行政区基本法规定了特别行政区的政府组成等内容,属于公法\nB✗ 特别行政区基本法是全国人大制定的,且规定了全国人大及其常委会、国务院的职权以及中央和特别行政区的关系, 因此它在全国范围内都有效\nC✗ 特别行政区基本法是制定法,并非英美法系中的普通法\nD✓ 符合题意及现行制度规定（\u0001从法律渊源的角度而言,该法属于我国的\u0002）\n在我国,基本法律是指全国人大制定和修改的、规定和调整具有根本性和全面性的社会关系的法律,特别行政区基本法属于这一类型,","k":"","kb":33,"kh":[[0,14],[15,143]]},{"id":"2008-24","y":2008,"t":"单","s":"下列关于我国人民代表大会制的表述,正确的是（ ）。","o":["人民代表大会制是我国的基本政治制度","人民代表大会制是马克思主义国家结构形式的基本理论同中国实践相结合的产物","人民代表大会制表明人民代表大会在国家机关体系中居于最高地位","人民代表大会制以权力分立体制为前提"],"a":"D","e":"\u0001依据题干考查要点，正确表述为“人民代表大会制以权力分立体制为前提”。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ 人民代表大会制度以民主集中制为活动原则,而非以权力分立为前提","k":"","kb":32,"kh":[[0,20],[203,240]]},{"id":"2008-26","y":2008,"t":"单","s":"根据我国现行宪法和民族区域自治法的规定,民族自治机关的人员组成必须突出的特点是（ ）。","o":["区域性","自治性","民族性","专业性"],"a":"C","e":"\u0001根据《宪法》第113 条第2 款,自治区、自治州、自治县的人民代表大会常务委员会中应当有实行区域自治的民族的公民担任主任或者副主任。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✓ 符合题意及现行制度规定（\u0001民族性\u0002）\nD✗ 与题干设问或现行制度要件不符，故不选\n根据\u0001《宪法》\u0002第114 条自治区主席、自治州州长、自治县县长由实行区域自治的民族的公民担任。","k":"","kb":32,"kh":[[0,20]]},{"id":"2008-29","y":2008,"t":"单","s":"下列选项中,体现我国地方制度特色的是（ ）。","o":["地方司法权相对独立制度","民族区域自治制度","中央与地方分权制度","经济特区制度"],"a":"B","e":"\u0001经济特区仅能够根据经济特区的具体情况和实际需要,实行比较特殊的经济政策,制定并实施经济特区法规,除此之外,与一般行政地方无甚区别,故不能体现我国地方制度的特色。\u0002\nA✗ 我国的地方司法机关,受同级人大及其常委会和上级司法机关的监督\nB✓ 体现我国地方制度特色的制度有二:一是民族区域自治制度,二是特别行政区制度,故\nC✗ 根据\u0001《宪法》\u0002第3 条第4 款,中央和地方的国家机构职权的划分,遵循在中央的统一领导下,充分发挥地方的主动性、积极性的原则,并非\"中央与地方分权\",故选\nD✗ 经济特区仅能够根据经济特区的具体情况和实际需要,实行比较特殊的经济政策,制定并实施经济特区法规,除此之外,与一般行政地方无甚区别,故不能体现我国地方制度的特色\n根据\u0001《宪法》\u0002第3 条第4 款,中央和地方的国家机构职权的划分,遵循在中央的统一领导下,充分发挥地方的主动性、积极性的原则,并非\"中央与地方分权\",错误。","k":"","kb":33,"kh":[[0,14],[15,143]]},{"id":"2008-30","y":2008,"t":"单","s":"下列关于特别行政区基本法特点的表述,不正确的是（ ）。","o":["特别行政区基本法是特别行政区内实施的地方性法律","特别行政区基本法是特别行政区内其他立法的基础和法律依据","特别行政区基本法是普通法律的一种,不能与宪法相抵触","特别行政区基本法是基本法律的一种,效力范围及于全国"],"a":"A","e":"\u0001特别行政区基本法,属于在全国范围内实施的全国性法律,理由有二:一是从制定机关看,基本法由全国人大制定,而全国人大的管辖权及于全国。\u0002\nA✓ 符合题意及现行制度规定（\u0001特别行政区基本法是特别行政区内实施的\u0002）\nB✗ 根据香港或者澳门特别行政区基本法第11 条,特别行政区的制度和政策,包括社会、经济制度,有关保障居民的基本权利和自由的制度行政管理、立法和司法方面的制度,以及有关政策,均以基本法的规定为依据\nC✗ 特别行政区基本法的制定基础是\u0001《宪法》\u0002第31 条, 故特别行政区基本法的制定不能与\u0001《宪法》\u0002第31 条的精神相抵触\nD✗ 这意味着基本法也调整中央国家机关和各省、自治区、直辖市涉及特别行政区的活动,故基本法的效力及于全国\n二是从内容看,基本法不仅规定了特别行政区的制度和政策,还规定了中央与特别行政区的关系,各省、自治区、直辖市与特别行政区的关系。 特别行政区立法机关制定的任何法律,均不得同基本法相抵触。","k":"","kb":33,"kh":[[0,14],[15,143]]},{"id":"2009-23","y":2009,"t":"单","s":"下列关于我国单一制国家结构形式的表述,能够成立的是（ ）。","o":["我国是由若干普通行政单位和自制单位组成的统一国家","我国的单一制国家结构形式体现了权利的横向配置关系","我国采用单一制国家结构形式是由经济发展水平决定的","我国各个地方行政单位享有的权利属于“剩余权利”"],"a":"A","e":"\u0001我国实行单一制国家机构形式,其中包括普通行政单位、民主自治地方和特别行政区。\u0002\nA✓ 我国实行单一制国家机构形式,其中包括普通行政单位、民主自治地方和特别行政区\nB✗ 我国的单一制国家结构形式体现了中央和地方权利的纵向配置关系\nC✗ 我国实行单一制国家结构形式是由历史传统、民族分布和民族成分状况、融洽的民族关系共同决定的\nD✗ 我国的地方行政单位所拥有的权利都是由中央以法律的形式授予的","k":"","kb":32,"kh":[[0,20],[21,54]]},{"id":"2009-24","y":2009,"t":"单","s":"根据我国现行宪法的规定,有权决定县、自治区、直辖市设立的国家机关是（ ）。","o":["全国人民代表大会","全国人民代表大会常务委员会","国务院","民政部"],"a":"A","e":"\u0001根据《宪法》第62 条规定,全国人民代表大会有权批准省、自治区、直辖市的建置,既有权决定省、自治区、直辖市的设立。\u0002\nA✓ 根据\u0001《宪法》\u0002第62 条规定,全国人民代表大会有权批准省、自治区、直辖市的建置,既有权决定省、自治区、直辖市的设立\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 第89 条规定,国务院有权批准省自治区、直辖市的区域划分,批准自治州、县、自治县、市的建置和区域划分\nD✗ 与题干设问或现行制度要件不符，故不选\n全国人民代表大会和民政部均无权决定省、自治区、直辖市的建置和区域划分。","k":"","kb":37,"kh":[[0,30],[95,147]]},{"id":"2009-25","y":2009,"t":"单","s":"我国民族自治地方划分为自治区、自治州、自治县三级,这一规定始于（ ）。","o":["1954 年宪法","1975 年宪法","1978 年宪法","1982 年宪法"],"a":"B","e":"\u0001我国1954 年宪法规定,自治区、自治州、自治县都是民族自治地方。\u0002\nA✗ 我国1954 年宪法规定,自治区、自治州、自治县都是民族自治地方\nB✓ 符合题意及现行制度规定（\u00011975 年宪法\u0002）\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选","k":"","kb":32,"kh":[[54,93],[170,203]]},{"id":"2009-26","y":2009,"t":"单","s":"根据香港特别行政区基本法的规定,香港特别行政区境内的土地和自然资源属于（ ）。","o":["香港特别行政区政府所有","国家所有","个人所有","法人所有"],"a":"B","e":"\u0001依据题干考查要点，正确表述为“国家所有”。\u0002\nA✗ 根据\u0001《香港特别行政区基本法》\u0002地7 条规定,香港特别行政区境内的土地和自然资源属于国家所有,由香港特别行政区政府负责管理、使用、开发、出租或批给个人、法人或团体使用或开发,其收入全归香港特别行…\nB✓ 符合题意及现行制度规定（\u0001国家所有\u0002）\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选","k":"","kb":33,"kh":[[0,14],[15,143]]},{"id":"2010-53","y":2010,"t":"多","s":"下列关于我国行政区划的表述,正确的有（ ）。","o":["自治州分为县、自治县、市","直辖市和较大的市分为区、县","基本行政区划分为省、县、乡三级","民族自治地方包括自治区、自治州、自治县、民族乡"],"a":"ABC","e":"\u0001《宪法》第30条规定,中华人民共和国的行政区域划分如下:(1)全国分为省、自治区、直辖市。\u0002\nA✓ 自治州分为县、自治县、市\nB✓ 直辖市和较大的市分为区、县\nC✓ \u0001《宪法》第30条\u0002规定,中华人民共和国的行政区域划分如下:(1)全国分为省、自治区、直辖市\nD✗ 根据以上表述, AB而民族乡不是民族自治地方,故而\n(2)省、自治区分为自治州、县、自治县、市; (3)县、自治县分为乡、民族乡、镇。 自治区、自治州、自治县都是民族自治地方。","k":"","kb":32,"kh":[[54,93],[170,203]]},{"id":"2010-58","y":2010,"t":"多","s":"下列关于我国特别行政区自治与民族区域自 治的表述,正确的有（ ）。","o":["两者都是区域性自治,但自治的基础不同","两者都是单一制国家结构形式下的特殊设计","两者都是为了实现区域内人民的高度自治权","两者都是地方性自治,但.自治权的侧重点有所不同"],"a":"ABD","e":"\u0001特别行政区享有的是高度的自治权,包括了立法权、行政权和独立的司法权,而民族自治地方的自治权只是一定的自治权,可见特别行政区才享有高度的自治权,两者的侧重点不一样。\u0002\nA✓ 符合题意及现行制度规定（\u0001两者都是区域性自治,但自治的基础不同\u0002）\nB✓ 特别行政区自治和民族区域自治都是在单一制国家结构形式下的特殊制度设计,相关表述正 \" ,和平解 \"一国两制确\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ 特别行政区享有的是高度的自治权,包括了立法权、行政权和独立的司法权,而民族自治地方的自治权只是一定的自治权,可见特别行政区才享有高度的自治权,两者的侧重点不一样\n特别行政区自治是为了实现决历史遗留下来的香港间题、澳门问题和台湾问题而实行的高度自治,而民族区域自治则是为了保证少数民族的自主性,促进少数民族能尽快发展,两者的基础不同,;","k":"","kb":32,"kh":[[0,20],[21,54]]},{"id":"2011-30","y":2011,"t":"单","s":"下列关于我国民族区域自治制度的表述,能够成立的是（ ）。","o":["民族区域自治是民族自治与区域自治的结合","民族自治机关的自治权是民族自治地方固有的权力","民族区域自治制度是为解决历史遗留问题而确立的基本政治制度","与一般地方国家机关比较,民族自治地方的自治机关实行不同的组织原则"],"a":"A","e":"\u0001民族自治区的自治制度,是指在国家统一领导下,依照宪法、民族区域自治法和其他法律的有关规定,以各少数民族聚居区为基础建立民族自治地方,设立自治机关,行使自治权。\u0002\nA✓ 表现出明显的民族性和区域性,所以是民族自治和区域自治的结合\nB✗ 我国是单一制国家,民族自治制度是遵循国家统一领导的自治制度,其权力由中央通过法律授予,不是其固有的权力\nC✗ 民族区域自治制度主要是为了解决民族问题,保障少数民族自治权\nD✗ 民族自治地方在单一制国家结构形式下,同样要遵循民主集中制原则\n在这一制度下,国家充分尊重和保障各少数民族管理本民族内部事务的权力。 在国家事务中,中央统一决定全国性的重大事务,地方在中央领导下自主安排和决定地方事务。","k":"","kb":32,"kh":[[0,20],[170,203]]},{"id":"2011-54","y":2011,"t":"多","s":"根据《中华人民共和国澳门特别行政区基本法》的规定,澳门特别行政区政府主要官员的当选条件包括（ ）。","o":["年满40周岁","在外国无居留权","在澳门通常居住连续满15年","澳门永久性居民中的中国公民"],"a":"CD","e":"\u0001《澳门特别行政区基本法》第63条规定:\"澳门特别行政区政府的主要官员由澳门通常居住连续满15年的澳门特别行政区永久性居民中的中国公民担任。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ \"在外国无居留权是香港特区主要官员的任职条件`而澳门特区的主要官员的任职条件中没有这一条\nC✓ \u0001《澳门特别行政区基本法》第63条\u0002规定:\"澳门特别行政区政府的主要官员由澳门通常居住连续满15年的澳门特别行政区永久性居民中的中国公民担任\nD✓ 比较香港特别行政区政府主要官员的任职条件.\u0001《香港特别行政区某本法》\u0002规定,香港特别行政区政府的主要官员由香港通常居住连续满15年并在外国无居留权的香港特别行政区 \" 永久性居民中的中国公民担任","k":"","kb":33,"kh":[[0,14],[15,143]]},{"id":"2011-55","y":2011,"t":"多","s":"根据我国现行《宪法》和法律的规定,有权制定地方性法规的主体包括（ ）。","o":["省、直辖市的人民代表大会","省、自治区的人民政府所在地的市的人民代表大会","经国务院批准的较大的市的人民代表大会","不设区的市的人民代表大会"],"a":"ABC","e":"\u0001旧《立法法》规定,省、自治区、直辖市的人民代表大会及其常务委员会根据本行政区域的具体情况和实际情况需要,在不同宪法、法律、行政法规相抵触的前提下,可以制定地方性法规。\u0002\nA✓ 旧\u0001《立法法》\u0002规定,省、自治区、直辖市的人民代表大会及其常务委员会根据本行政区域的具体情况和实际情况需要,在不同宪法、法律、行政法规相抵触的前提下,可以制定地方性法规\nB✓ 符合题意及现行制度规定（\u0001省、自治区的人民政府所在地的市的人民\u0002）\nC✓ 较大的市的人民代表大会及常务委员会根据本市的具体情况和实际情况需要,在不同宪法、法律、行政法规和本省、自治区的地方性法规相抵触的前提下,可以制定地方性法规,报省、自治区的人民代表大会常务委员…\nD✗ 与题干设问或现行制度要件不符，故不选\n根据新\u0001《立法法》\u0002规定,已经把地方性法规的制定权从较大的市下放到了设区的市和自治州的级别了。 因此,本题中较大的市改成设区的市和自治州即可。 答案没有发生变化。","k":"","kb":32,"kh":[[203,240]]},{"id":"2012-17","y":2012,"t":"单","s":"根据我国宪法和法律规定,下列选项中不属于民族自治地方的是（ ）。","o":["自治区","自治州","自治县","民族乡"],"a":"D","e":"\u0001《宪法》第1 2条规定,民族自治地方的自治机关是自治区、自治州、自治县的人民代表大会和人民政府。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ 我国的民族自治地方不包括民族乡","k":"","kb":32,"kh":[[54,93],[170,203]]},{"id":"2012-20","y":2012,"t":"单","s":"根据《香港特别行政区基本法》的规定,香港的司法机关是（ ）。","o":["廉政公署","检察院","各级法院","律政司"],"a":"C","e":"\u0001《香港特别行政区基本法》第80条规定,香港特别行政区各级法院是香港特别行政区的司法机关,行使香港特别行政区的审判权。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✓ \u0001《香港特别行政区基本法》第80条\u0002规定,香港特别行政区各级法院是香港特别行政区的司法机关,行使香港特别行政区的审判权\nD✗ 与题干设问或现行制度要件不符，故不选\n香港的检察机关是律政司,属于行政机关,而澳门有专门的检察院,属于司法机关。","k":"","kb":33,"kh":[[0,14],[15,143]]},{"id":"2012-28","y":2012,"t":"单","s":"某自治州是某省所辖的藏族自治州。下列职务中,只能由藏族公民担任的是（ ）。","o":["自治州人民代表大会常务委员会主任","自治州州长","自治州人民法院院长","自治州人民检察院检察长"],"a":"B","e":"\u0001《宪法》第113条规定,自治区、自治州、自治县的人民代表大会中,除实行区域自治的民族的代表外,其他居住在本行政区域内的民族也应当有适当名额的代表。\u0002\nA✗ 自治区、自治州、自治县的人民代表大会常务委员会中应当有实行区域自治的民族的公民担任主任或者副主任\nB✓ 第114 条规定,自治区主席、自治州州长、自 的高度自治权包括:立法权,独立的司法权和终审权,行政管理权\nD✗ 特区财政独立,使用自己的货币,享有货币发行权,但并不享有防务权,外交与税务属于中央政府\n因此选\u0001“防务权”\u0002。","k":"","kb":33,"kh":[[0,14],[15,143]]},{"id":"2014-26","y":2014,"t":"单","s":"根据我国《宪法》,批准省、自治区、直辖市区域划分的国家机关是（ ）。","o":["全国人民代表大会常务委员会","国务院","国家发展和改革委员会","民政部"],"a":"B","e":"\u0001行政区划变更的法律程序内容较多,容易混淆。\u0002\nA✗ 考生可以简便记忆:省、自治区、直辖市的设立、撤销、更名,报全国人大审议决定\nB✓ 县、市、市辖区的部分行政区域界线的变更,由国务院授权省、自治区、直辖市人民政府审批\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选\n有关乡、民族乡镇的设立、撤销、更名和行政区域界线的变更, 由省、自治区、直辖市人民政府审批; 除了以上这些,其他全都归国务院审批。 即乡找省,省级找全国人大,中间全归国务院审批。 行政区域的变更问题是基础知识点,建议考生掌握扎实。","k":"","kb":37,"kh":[[0,30],[169,190]]},{"id":"2014-56","y":2014,"t":"多","s":"下列关于我国国家结构形式的表述,正确的有（ ）。","o":["我国是统一的多民族的单一制国家","我国国家结构形式是人民代表大会制度","行政区划制度决定了我国的国家结构形式","我国的国家结构形式是由历史、民族等多种因素形成的"],"a":"AD","e":"\u0001我国是统一的多民族的单一制国家,我国的国家结构形式是单一制。\u0002\nA✓ 我国是统一的多民族的单一制国家,我国的国家结构形式是单一制\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 三是由我国政治发展的基本需要决定的,有利于国家统一和政治稳定\nD✓ 符合题意及现行制度规定（\u0001我国的国家结构形式是由历史、民族等多\u0002）\n我国实行单一制的原因:一是由我国民族关系的历史和各民族的居住现状决定的,是保障各少数民族与汉族平等发展的需要; 二是由我国经济发展的实际需要决定的,也是缩小各少数民族和汉族之间的经济文化发展差距的有效途径;","k":"","kb":32,"kh":[[0,20],[21,54]]},{"id":"2015-20","y":2015,"t":"单","s":"下列选项中,属于民族自治地方自治机关的是（ ）。","o":["内蒙古自治区人民检察院","青海省门源回族自治县人民代表大会","湖南省湘西土家族苗族自治州中级人民法院","广西壮族自治区桂林市雁山区草坪回族乡人民政府"],"a":"B","e":"\u0001《宪法》第112 条规定:\"民族自治地方的自治机关是自治区、自治州、自治县的人民代表大会和人民政府。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ \u0001《宪法》\u0002第112 条规定:\"民族自治地方的自治机关是自治区、自治州、自治县的人民代表大会和人民政府\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选\n\"不包括法院和检察院, AC","k":"","kb":32,"kh":[[170,203],[203,240]]},{"id":"2015-23","y":2015,"t":"单","s":"根据我国特别行政区基本法,下列表述正确的是（ ）。","o":["特别行政区的立法须报全国人大常委会和国务院备案","特别行政区享有高度自治权,行政长官只对特别行政区负责","对特别行政区终审法院的判决不服,可以上诉至最高人民法院","中央人民政府授权特别行政区依照基本法自行处理有关的对外事务"],"a":"D","e":"\u0001特别行政区行政机关办理基本法规定的中央人民政府授权的对外事务。\u0002\nA✗ 特别行政区的立法机关制定的法律须报全国人大常委会备案,需报备机关并没有国务院\nB✗ 行政长官对中央人民政府和特别行政区负责\nC✗ 特别行政区法院独立进行审判,不受任何于涉,在特别行政区发生的案件由特别行政区法院进行审理,特别行政区终审法院享有终审权\nD✓ 特别行政区行政机关办理基本法规定的中央人民政府授权的对外事务\n特别行政区享有高度的自治权。","k":"","kb":33,"kh":[[0,14],[15,143]]},{"id":"2016-25","y":2016,"t":"单","s":"根据《香港特别行政区基本法》,下列选项中,属于中央对特别行政区行使的权力是（ ）。","o":["在特别行政区征税","任命特别行政区法院的法官","批准特别行政区立法会通过的法律","任命特别行政区行政机关的主要官员"],"a":"D","e":"\u0001根据《香港特别行政区基本法》第15 条的规定,中央政府任命香港特别行政区行政长官和行政机关的主要官员。\u0002\nA✗ 央人民政府不在香港特别行政区征税\nB✗ 根据第88条的规定,香港特别行政区法院的法官,根据当地法官和法律界及其他方面知名人士组成的独立委员会推荐,由行政长官任命\nC✗ 香港特别行政区的立法机关制定的法律须报全国人大常委会备案,备案不影响该法律的生效\nD✓ 根据\u0001《香港特别行政区基本法》\u0002第15 条的规定,中央政府任命香港特别行政区行政长官和行政机关的主要官员\n根据第17条的规定,香港特别行政区享有立法权。 根据第106条的规定,香港特别行政区的财政收入全部用于自身需要,不上缴中央人民政府。","k":"","kb":33,"kh":[[15,143],[158,195]]},{"id":"2016-58","y":2016,"t":"多","s":"根据现行宪法,下列关于我国行政区域划分的表述,正确的有（ ）。","o":["全国分为省、自治区、直辖市、经济特区","省、自治区、直辖市分为自治州、县、自治县、市","民族自治地方包括自治区、自治州和自治县","县、自治县分为乡、民族乡、镇"],"a":"CD","e":"\u0001《宪法》第30 条的规定:中华人民共和国的行政区域划分如下: (一)全国分为省、自治区、直辖市。\u0002\nA✗ 自治区、自治州、自治县都是民族自治地方\nB✗ 没有直辖市,直辖市分为区、县\nC✓ 自治区、自治州、自治县都是民族自治地方\nD✓ (三)县、自治县分为乡、民族乡、镇\n(二)省、自治区分为自治州、县、自治县、市; 直辖市和较大的市分为区、县。 自治州分为县、自治县、市。","k":"","kb":32,"kh":[[54,93],[170,203]]},{"id":"2017-23","y":2017,"t":"单","s":"根据现行《宪法》,有权批准省、自治区、直辖市的区域划分的机关是（ ）。","o":["全国人民代表大会","全国人大常委会","国务院","民政部"],"a":"C","e":"\u0001根据《宪法》第89条第(十五)项的规定,国务院的职权包括批准省、自治区、直辖市的区域划分,批准自治州、县、自治县、市的建置和区域划分。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 全国人大有权批准省、自治区和直辖市的建置\nC✓ 根据\u0001《宪法》第89条\u0002第(十五)项的规定,国务院的职权包括批准省、自治区、直辖市的区域划分,批准自治州、县、自治县、市的建置和区域划分\nD✗ 与题干设问或现行制度要件不符，故不选","k":"","kb":37,"kh":[[0,30],[199,378]]},{"id":"2017-27","y":2017,"t":"单","s":"根据现行宪法和法律,下列关于民族区域自治制度的表述,正确的是（ ）。","o":["民族自治地方包括自治区、自治州、自治县和民族乡","民族自治地方的人大常委会主任应当由实行区域自治的民族的公民担任","自治州和自治县的自治条例和单行条例,均须报省级人大常委会批准后生效","自治条例和单行条例不得对法律和行政法规的规定作出变通规定"],"a":"C","e":"\u0001《民族区域自治法》第2条第2款规定: 民族自治地方分为自治区、自治州、自治县。\u0002\nA✗ 民族自治地方不包括民族乡\nB✗ 主任或副主任其中之一必须由实行区域自治的民族的公民担任,不一定是主任\nC✓ 自治州、自治县的自治条例和单行条例,报省或者自治区的人民代表大会常务委员会批准后生效,并报全国人民代表大会常务委员会备案\nD✗ 民族自治地区的自治条例和单行条例可以对法律和行政法规的规定作出变通规定\n\u0001《宪法》\u0002第113 条第2款规定:自治区、自治州、自治县的人民代表大会常务委员会中应当由实行区域自治的民族的公民担任主任或者副主任。 第115条规定:自治区、自治州、自治县的自治机关行使宪法第三章第五节规定的地方国家机关的职权,同时依照宪法、民族区域自治法和其他法律规定的权限行使自治权,根据本地方实际情况贯彻执行国家的法律、政策。 第116条规定:民族自治地方的人民代表大会有权依照当地民族的政治、经济和文化的特点,制定自治条例和单行条例。 自治区的自治条例和单行条例,报全国人民代表大会常务委员会批准后生效。","k":"","kb":32,"kh":[[170,203],[263,298]]},{"id":"2017-57","y":2017,"t":"多","s":"根据《澳门特别行政区基本法》,下列表述正确的有（ ）。","o":["特别行政区行政长官在任职期内不得具有外国居留权","特别行政区检察长由行政长官提名,报中央人民政府任命","特别行政区境内的土地和自然资源,全部属于国家所有","特别行政区永久性居民和非永久性居民都享有选举权和被选举权"],"a":"AB","e":"\u0001根据《澳门特别行政区基本法》第15 条的规定,中央人民政府任免澳门行政长官、政府主要官员和检察长。\u0002\nA✓ 行政长官就任时应向澳门终审法院院长申报财产,记录在案\nB✓ 根据\u0001《澳门特别行政区基本法》\u0002第15 条的规定,中央人民政府任免澳门行政长官、政府主要官员和检察长\nC✗ 第7条规定:澳门特别行政区境内的土地和自然资源,除在澳门成立前已依法确认的私有土地外,属于国家所有,由澳门政府负责管理、使用、开发、出租或批给个人、法人使用或开发,其收入全部归澳门政府支配\nD✗ 非永久性居民不享有选举权和被选举权\n第26 条规定:澳门永久性居民依法享有选举权和被选举权。 第49条规定:澳门行政长官在任职期内不得具有外国居留权,不得从事私人赢利活动。 要注意澳门特区基本法第46条,关于澳门特首任职条件中并未规定外国居留权问题,但在第49条规定澳门特首在任职期内不得具有外国居留权。 而香港特区基本法关于香港特首的任职条件则明确规定了在外国无居留权。","k":"","kb":33,"kh":[[0,14],[15,143]]},{"id":"2018-15","y":2018,"t":"单","s":"关于香港特别行政区司法机关,下列说法正确的是（ ）。","o":["香港特区法院由普通法院和行政法院组成","香港特区法院对国防等国家行为无管辖权","香港特区终审法院受最高人民法院的监督","香港特区法院的法官必须是特区永久性居民中的中国公民"],"a":"B","e":"\u0001《香港特别行政区基本法》第19条第3款规定:香港特别行政区法院对国防、外交等国家行为尤管辖权。\u0002\nA✗ 澳门特别行政区有行政法院, 香港则没有行政法院\nB✓ \u0001《香港特别行政区基本法》第19条第3款\u0002规定:香港特别行政区法院对国防、外交等国家行为尤管辖权\nC✗ 特区终审法院不受最高人民法院监督,特别行政区享有独立的司法权和终审权\nD✗ 与题干设问或现行制度要件不符，故不选","k":"","kb":33,"kh":[[0,14],[15,143]]},{"id":"2018-27","y":2018,"t":"单","s":"下列选项中,属于民族自治地方行使自治权的是（ ）。","o":["自治区人民代表大会制定的地方性法规","自治区人民政府变通执行国家的政策","自治州人民法院审理破坏民族团结的案件","自治县人民检察院对政府工作人员涉嫌贪·污的行为立案侦查"],"a":"B","e":"\u0001该项、该项 不属于自治权范围,只有题意。\u0002\nA✗ 人大制定地方性法规不是自治权,即使不是自治地方的人大,也有这样的权力\nB✓ 不属于自治权范围,只有\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选\n民族自治地方的自治权包括,第一,民族自治机关的人民代表大会可以根据当地民族的政治、经济和文化特点制定自治条例和单行条例等地方性自治法规,按法定程序经上级机关批准后生效; 第二,在国家计划指导下,根据本地的特点和需要,自主地安排和管理本地的经济建设事业; 第三,依照国家财政体制的规定,属于民族自治地方的财政收入,都由民族自治地方的自治机关自主安排使用; 第四,自治机关可以自主地管理和发展本地区的教育、科学、文化、卫生、体育等事业,保护民族的名胜古迹和重要历史文化遗产; 第五,自治机关在执行职务时,依照本民族自治地方自治条例的规定, 使用当地通用的一种或几种语言文字。","k":"","kb":32,"kh":[[170,203]]},{"id":"2019-22","y":2019,"t":"单","s":"下列关于香港特别行政区行政长官的表述, 正确的是（ ）。","o":["行政长官必须年满四十五周岁","行政长官由当地选举产生,由立法会任命","行政长官在其一任任期内可以解散立法会两次","行政长官是香港特别行政区的首长,代表香港特别行政区"],"a":"D","e":"\u0001香港特别行政区行政长官必须年满40 周岁,而不是45周岁。\u0002\nA✗ 香港特别行政区行政长官必须年满40 周岁,而不是45周岁\nB✗ 行政长官通过选举或协商产生,由中央人民政府任命\nC✗ 行政长官在任期内只能解散立法会一次\nD✓ 行政长官是香港特别行政区的首长,代表香港特别行政区","k":"","kb":33,"kh":[[0,14],[15,143]]},{"id":"2019-23","y":2019,"t":"单","s":"下列关于国家结构形式的理解,正确的是（ ）。","o":["我国实行单一制的国家结构形式","政权组织形式决定国家结构形式","现代国家结构形式主要有单一制和邦联制","国家结构形式是指国家各组成部分之间的横向权力配置关系"],"a":"A","e":"\u0001国家结构形式是指国家整体与组成部分、中央与地方的相互关系。\u0002\nA✓ 我国实行的是单一制的国家结构形式\nB✗ 历史传统、民族因素和政治因素决定国家结构形式\nC✗ 现代国家的国家结构形式主要分为单一制和复合制\nD✗ 国家结构形式体现的是纵向的权力配置关系\n国家结构形式与政权组织形式都属于国家的形式,两者的区分主要在于国家对权力的配置上。 现代国家的国家结构形式主要有单一制和复合制。","k":"","kb":32,"kh":[[0,20],[21,54]]},{"id":"2019-24","y":2019,"t":"单","s":"根据我国宪法,法律可分为基本法律和基本法律以外的其他法律。下列关于基本法律的表述,正确的是（ ）。","o":["基本法律具有最高的法律效力","全国人大常委会有权制定和修改基本法律","限制人身自由的强制措施,只能由基本法律予以规定","物权法、刑事诉讼法和民族区域自治法都属于基本法律"],"a":"D","e":"\u0001在全国人民代表大会闭会期间,对全国人民代表大会制定的法律进行部分补充和修改,但是不得同该法律的基本原则相抵触。\u0002\nA✗ 宪法具有最高的法律效力,基本法律不具有最高法律效力\nB✗ 全国人大常委会只能制定非基本法律,对于基本法律的修改也有限制\nC✗ 限制人身自由的强制措施,只能由法律予以规定,既包括基本法律也包括非基本法律\nD✓ 物权法刑事诉讼法和民族区域自治法都是由全国人大制定的法律,是基本法律\n全国人民代表大会制定和修改刑事、民事、国家机构的和其他的基本法律。 全国人民代表大会常务委员会制定和修改除应当由全国人民代表大会制定的法律以外的其他法律;","k":"","kb":37,"kh":[[31,95],[199,378]]},{"id":"2020-16","y":2020,"t":"单","s":"下列关于香港特别行政区立法会议员的表述,正确的是（ ）。","o":["立法会议员在就职时必须依法宣誓","行政长官有权任命部分立法会议员","立法会主席由立法会议员互选产生,由全国人大常委会任命","立法会议员只能由香港特区永久性居民中的中国公民担任"],"a":"A","e":"\u0001根据《香港特别行政区基本法》第 68条的规定,香港特别行政区立法会由选举产生。\u0002\nA✓ \u0001《香港特别行政区基本法》第104条\u0002规定:\"香港特别行政区行政长官、主要官员、行政会议成员、立法会议员各级法院法官和其他司法人员在就职时必须依法宣誓拥护中华人民共和国香港特别行政区基本法,效忠…\nB✗ 立法会议员由选举产生,而非行政长官任命\nC✗ 上述人员不涉及相关表述立法会主席\nD✗ 但非中国国籍的香港特别行政区永久性居民和在外国有居留权的香港特别行政区永久性居民也可以当选为香港特别行政区立法会议员,其所占比重不超过20%\n\u0001《香港特别行政区基本法》第104条\u0002规定:\"香港特别行政区行政长官、主要官员、行政会议成员、立法会议员各级法院法官和其他司法人员在就职时必须依法宣誓拥护中华人民共和国香港特别行政区基本法,效忠中华人民共和国香港特别行政区。 立法会的产生办法根据香港特别行政区的实际情况和循序渐进的原则而规定,最终达至全部议员由普选产生的目标。 根据第71条的规定,香港特别行政区立法会主席由立法会议员互选产生。 根据\u0001《宪法》\u0002规定,在全国人大闭会期间,全国人大常委会有权根据国务院总理的提名,决定部长、委员会主任、审计长秘书长的人选; 根据中央军委主席的提名,决定中央军委其他组成人员的人选; 根据国家监察委员会主任的提请,任免国家监察委员会的副主任、委员; 根据最高人民法院院长的提请,任免副院长、审判员、审判委员会委员和军事
