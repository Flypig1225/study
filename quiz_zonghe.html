    app.innerHTML=`<div><div class="top"><button class="back" id="bk">${backLabel}</button><div class="where">${esc(SUBNAME[u.sub]||u.sub)} · ${esc(u.name)}</div></div><div class="card empty"><div style="font-size:18px;color:var(--ink);margin-bottom:6px">「${esc(u.name)}」的新题都做完了！</div>本次做了 ${sess.n} 题，对 ${sess.right} 题。</div><button class="btn pri" id="rdu">↻ 重新刷「${esc(u.name)}」（重置本节并重做）</button>${sess.from==='wb'?'<button class="btn sec" id="bkwb">回错题集</button>':''}<button class="btn sec" id="bk2">回首页</button></div>`;
    document.getElementById('bk').onclick=goBackFromQuiz;
    document.getElementById('rdu').onclick=()=>redoCurrentChapter(u,sess.from);
    const bw=document.getElementById('bkwb');if(bw)bw.onclick=wrongBook;
    document.getElementById('bk2').onclick=home;
    window.scrollTo(0,0);return;
  }
  if(sess.mode==='wrong'&&sess.unit!=null){
    const u=D[sess.unit];
    const uLeft=unitWrongIds(sess.unit),uDue=dueList(uLeft);
    const msg=!uLeft.length?`「${u.name}」的错题已清空！`:uDue.length?`「${u.name}」这一轮错题刷完了，今天还有 ${uDue.length} 题未练。`:`「${u.name}」的错题今日已刷完（本节错题集还有 ${uLeft.length} 题，明天再来或点击再练一遍）。`;
    app.innerHTML=`<div><div class="top"><button class="back" id="bk">${backLabel}</button><div class="where">${esc(SUBNAME[u.sub]||u.sub)} · ${esc(u.name)}</div></div><div class="card empty"><div style="font-size:18px;color:var(--ink);margin-bottom:6px">${msg}</div>本次做了 ${sess.n} 题，对 ${sess.right} 题。</div>${uLeft.length?`<button class="btn pri" id="again">↻ ${uDue.length?`继续刷本节错题（今日 ${uDue.length} 题）`:`再练一遍本节错题（${uLeft.length} 题）`}</button>`:''}<button class="btn sec" id="rdu">↻ 重刷「${esc(u.name)}」全章节</button><button class="btn sec" id="bkwb">回错题集</button><button class="btn sec" id="bk2">回首页</button></div>`;
    document.getElementById('bk').onclick=goBackFromQuiz;
    const ag=document.getElementById('again');if(ag)ag.onclick=()=>startUnitWrong(sess.unit,uDue.length===0,sess.from);
    document.getElementById('rdu').onclick=()=>redoCurrentChapter(u,sess.from);
    document.getElementById('bkwb').onclick=wrongBook;
    document.getElementById('bk2').onclick=home;
    window.scrollTo(0,0);return;
  }
  const left=wrongList().length,due=dueList().length;
  const msg=sess.mode==='wrong'?(!left?'错题集清空了！':due?`这一轮错题刷完了，今天还有 ${due} 题没做。`:`今天的错题都刷完了，明天再来。错题集里还有 ${left} 题。`):'这个范围里的新题都做完了。';
  const scopeUnits=getUnits(true).filter(u=>sess.mode!=='wrong'||unitWrongIds(u.ui).length>0);
  let h=`<div><div class="top"><button class="back" id="bk">${backLabel}</button></div><div class="card empty"><div style="font-size:18px;color:var(--ink);margin-bottom:6px">${msg}</div>本次做了 ${sess.n} 题，对 ${sess.right} 题。</div>`;
  if(sess.mode==='wrong'&&left){
    h+=`<button class="btn pri" id="again">${due?`继续刷全部错题（今日 ${due} 题）`:`再练一遍全部错题（${left} 题）`}</button>`;
  }
  if(sess.from==='wb')h+=`<button class="btn sec" id="bkwb">回错题集</button>`;
  h+=`<button class="btn sec" id="bk2">回首页</button>`;
  if(scopeUnits.length){
    h+=`<div class="card" style="margin-top:12px"><div style="font-weight:600;margin-bottom:6px">按章节重新刷</div><div class="fin-list">`;
    scopeUnits.forEach(u=>{
      const uw=unitWrongIds(u.ui),ud=dueList(uw);
      h+=`<div class="fin-row"><div class="fin-nm"><span class="tag">${SUBNAME[u.sub]||u.sub}</span><span>${esc(u.name)}</span></div><div class="fin-acts">${sess.mode==='wrong'&&uw.length?`<button class="smbtn pri" data-wru="${u.ui}">重刷错题(${ud.length||uw.length})</button>`:''}<button class="smbtn" data-rdu="${u.ui}">重刷全章</button></div></div>`;
    });
    h+=`</div></div>`;
  }
  h+=`</div>`;
  app.innerHTML=h;
  document.getElementById('bk').onclick=goBackFromQuiz;
  document.getElementById('bk2').onclick=home;
  const bw=document.getElementById('bkwb');if(bw)bw.onclick=wrongBook;
  const ag=document.getElementById('again');if(ag)ag.onclick=()=>startWrong(due===0,sess.from);
  app.querySelectorAll('[data-wru]').forEach(b=>b.onclick=()=>{const ui=+b.dataset.wru;const uw=unitWrongIds(ui),ud=dueList(uw);startUnitWrong(ui,ud.length===0,sess.from);});
  app.querySelectorAll('[data-rdu]').forEach(b=>b.onclick=()=>{const ui=+b.dataset.rdu;redoCurrentChapter(D[ui],sess.from);});
  window.scrollTo(0,0);
}
// 选项乱序：每次出题随机排列，显示字母按位置重新编号；内部仍用原字母判分
const REFL=/(^|[^A-Za-z0-9])[A-E]([、，,和与及 ]|项|的|对|错|$)/;
function noShuf(q){return (q.e||'').split('\n').some(x=>!/^\s*[A-E][✓✗]/.test(x)&&REFL.test(x.replace(/[\x01\x02]/g,'')));}
function getOrd(q){if(!sess.ord)sess.ord={};let o=sess.ord[q.id];
  if(!o||o.length!==q.o.length){o=q.o.map((_,i)=>i);if(!noShuf(q))for(let i=o.length-1;i>0;i--){const j=rint(i+1);[o[i],o[j]]=[o[j],o[i]];}sess.ord[q.id]=o;}
  return o;}
function dispAns(q,x){const o=getOrd(q);return (x==null?q.a.split(''):[...x]).map(v=>String.fromCharCode(65+o.indexOf(v.charCodeAt(0)-65))).sort().join('');}
function render(id){
  const q=Q[id||sess.cur],u=D[q.u];const app=document.getElementById('app');
  const backLabel=sess.from==='wb'?'‹ 错题集':'‹ 返回';
  const actsHtml=sess.mode==='wrong'
    ?`<button class="smbtn pri" id="rsuw">↻ 重刷本节错题</button><button class="smbtn" id="rsu">重刷全章</button>`
    :`<button class="smbtn" id="rsu">↻ 重刷本章节</button>`;
  let h=`<div class="quizpg"><div class="top"><button class="back" id="bk">${backLabel}</button><div class="where">${sess.mode==='wrong'?'错题 · ':''}${esc(SUBNAME[u.sub]||u.sub)} · ${esc(u.name)}</div><div class="top-acts">${actsHtml}</div></div><div class="card">`;
  h+=`<span class="tag">${q.y}年 ${TN[q.t]}</span>`;
  if(sess.mode==='wrong')h+=`<span class="tag rev">错题本</span>`;
  h+=`<div class="stem">${esc(q.s)}</div>`;
  if(q.t==='判'){
    h+=`<div class="judge">${['对','错'].map(v=>`<button class="opt" data-v="${v}">${v==='对'?'✓ 对':'✗ 错'}</button>`).join('')}</div>`;
  }else{
    h+=getOrd(q).map((oi,pos)=>{const V=String.fromCharCode(65+oi),L=String.fromCharCode(65+pos);return `<button class="opt" data-v="${V}"><span class="L">${L}</span><span>${esc(q.o[oi])}</span></button>`}).join('');
    if(q.t==='多')h+=`<button class="btn pri" id="sub" disabled>提交</button>`;
  }
  h+=`<div id="after"></div></div></div>`;
  app.innerHTML=h;
  document.getElementById('bk').onclick=goBackFromQuiz;
  const rsu=document.getElementById('rsu');if(rsu)rsu.onclick=()=>redoCurrentChapter(u,sess.from);
  const rsuw=document.getElementById('rsuw');if(rsuw)rsuw.onclick=()=>{
    const uw=unitWrongIds(u.ui),ud=dueList(uw);
    if(!uw.length){alert(`「${u.name}」目前没有错题了。`);return;}
    startUnitWrong(u.ui,ud.length===0,sess.from);
  };
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(b.dataset.v));
  const sb=document.getElementById('sub');if(sb)sb.onclick=submit;
  window.scrollTo(0,0);
}
function pick(v){
  if(sess.answered||sess.view!=null)return;const q=Q[sess.cur];
  if(q.t==='多'){const i=sess.sel.indexOf(v);i<0?sess.sel.push(v):sess.sel.splice(i,1);
    document.querySelectorAll('.opt').forEach(b=>b.classList.toggle('sel',sess.sel.includes(b.dataset.v)));
    document.getElementById('sub').disabled=!sess.sel.length;return;}
  sess.sel=[v];submit();
}
function submit(){
  if(sess.answered||sess.view!=null||!sess.sel.length)return;const q=Q[sess.cur];
  const mine=sess.sel.slice().sort().join('');const ok=mine===q.a;
  sess.answered=true;sess.n++;if(ok)sess.right++;
  const now=Date.now();let s=S.q[q.id];
  const d=today();
  let revNote='';
  if(!s||!s[0]){S.q[q.id]=ok?[1,0,0,0,now]:[2,0,d,1,now];}
  else if(s[0]===2){
    const sameDay=s[2]===d;
    if(ok){
      if(!sameDay){s[1]++;if(s[1]>=2)s[0]=3;}
      if(s[0]===3)revNote='连续两天答对，已移出错题集';
      else if(sameDay)revNote='今日已记录过复习，本次为巩固练习（明天再对可累计移除进度）';
      else revNote='已连续答对 1 次，明天再答对 1 次即可移出错题集';
    }else{s[1]=0;s[3]++;}
    s[2]=d;s[4]=now;
  }
  else{if(!ok){S.q[q.id]=[2,0,d,(s[3]||0)+1,now];}}

  save(true);
  sess.hist.push({id:q.id,sel:sess.sel.slice(),revNote});
  showAfter(q,sess.sel,ok,revNote);
}
// 选项说明开头若只是重复选项（如“爬到树上：…”），显示时去掉；带括号补充或数字单位不同的保留
function stripPre(o,t){const i=t.indexOf('：');if(i<1||!o)return t;const raw=t.slice(0,i),pre=raw.replace(/[\x01\x02]/g,'');let rest=t.slice(i+1);
  if(!rest.replace(/[\x01\x02\s。]/g,''))return t;if(/[（(]/.test(pre))return t;
  const core=[...pre.replace(/[《》“”"\s]/g,'')];if(!core.length)return t;const miss=core.filter(c=>!o.includes(c));
  if((core.length-miss.length)/core.length<0.6)return t;if(/\d/.test(o)&&miss.length)return t;
  const op=(raw.match(/\x01/g)||[]).length-(raw.match(/\x02/g)||[]).length;if(op>0)rest='\x01'+rest;return rest;}
function showAfter(q,sel,ok,revNote){
  const OE={};if(q.t!=='判'&&q.e)for(const x of q.e.split('\n')){const m=x.trim().match(/^([A-E])([✓✗])\s*([\s\S]*)$/);if(m)OE[m[1]]=m[3];}
  const hasOE=Object.keys(OE).length>0;
  document.querySelectorAll('.opt').forEach(b=>{const v=b.dataset.v;const inA=q.t==='判'?v===q.a:q.a.includes(v);const inM=sel.includes(v);
    b.querySelectorAll('.oe').forEach(e=>e.remove());
    if(OE[v]&&b.children[1]){let t=OE[v];const o=q.o[v.charCodeAt(0)-65]||'';if(o&&t.startsWith(o+'：'))t=t.slice(o.length+1);else t=stripPre(o,t);if(/^\s*(不对|不是|原文|按题目记|不在里面|错误|正确|对|错|不符|无关)[。．.]?\s*$/.test(t.replace(/[\x01\x02]/g,'')))t=inA?'':'干扰项';if(t)
      b.children[1].insertAdjacentHTML('beforeend',`<span class="oe">${esc(t).replace(/\x01/g,'<b>').replace(/\x02/g,'</b>')}</span>`);}
    b.classList.remove('sel');if(inA&&inM)b.classList.add('ok');else if(inM)b.classList.add('bad');else if(inA)b.classList.add(q.t==='多'?'miss':'ok');b.disabled=true;});
  const sb=document.getElementById('sub');if(sb)sb.remove();
  let h=`<div class="res ${ok?'ok':'bad'}">${ok?'正确':(q.t==='判'?'错误，正确答案'+(q.a==='对'?'✓':'✗'):'错误，你的答案'+dispAns(q,sel)+'，正确答案'+dispAns(q))}${revNote?`<small>${esc(revNote)}</small>`:''}</div><button class="btn pri" id="nx">下一题</button>`;
  if(ok){const s0=S.q[q.id];const inWb=s0&&s0[0]===2&&!s0[1];h+=`<button class="addwb" id="awb"${inWb?' disabled':''}>${inWb?'已加入错题集':(s0&&(s0[0]===3||(s0[0]===2&&s0[1]>0))?'留在错题集':'加入错题集')}</button>`;}
  const mk={};if(q.t!=='判'&&!ok)for(const v of 'ABCDE'){const a=q.a.includes(v),m=sel.includes(v);if(m&&!a)mk[v]='选错';}
  const ex=q.e?fmtExp(q.e,mk,hasOE):'';
  if(ex)h+=`<div class="box"><h4>解析</h4>${ex}</div>`;
  if(q.k||q.kb!=null)h+=`<div class="box book"><h4>原文</h4>${fmtBook(q)}</div>`;
  document.getElementById('after').innerHTML=h;
  document.getElementById('nx').onclick=goNext;
  const aw=document.getElementById('awb');if(aw)aw.onclick=()=>{const s1=S.q[q.id];const now=Date.now();S.q[q.id]=[2,0,today(),((s1&&s1[3])||0)+1,now];save(true);aw.textContent='已加入错题集';aw.disabled=true;};
}
// 上一题/下一题：上一题只能回看本次已做的题（显示当时的作答和解析，不能改答案）
function goPrev(){
  if(!sess||view.name!=='quiz'||!document.querySelector('.stem'))return;
  const H=sess.hist;let i;
  if(sess.view==null)i=sess.answered?H.length-2:H.length-1;else i=sess.view-1;
  if(i<0)return;showHist(i);
}
function goNext(){
  if(!sess||view.name!=='quiz'||!document.querySelector('.stem'))return;
  const H=sess.hist;
  if(sess.view!=null){
    const last=sess.answered?H.length-2:H.length-1;
    if(sess.view<last){showHist(sess.view+1);return;}
    sess.view=null;render();
    if(sess.answered){const h=H[H.length-1];showAfter(Q[h.id],h.sel,h.sel.slice().sort().join('')===Q[h.id].a,h.revNote);}
    else if(sess.sel.length){document.querySelectorAll('.opt').forEach(b=>b.classList.toggle('sel',sess.sel.includes(b.dataset.v)));const sb=document.getElementById('sub');if(sb)sb.disabled=false;}
    return;
  }
  if(sess.answered)nextQ();
}
function showHist(i){
  sess.view=i;const h=sess.hist[i];const q=Q[h.id];render(h.id);
  const sb=document.getElementById('sub');if(sb)sb.remove();
  showAfter(q,h.sel,h.sel.slice().sort().join('')===q.a,h.revNote);
}
(()=>{let x0=null,y0=0,t0=0;
  document.addEventListener('touchstart',e=>{if(e.touches.length!==1){x0=null;return;}x0=e.touches[0].clientX;y0=e.touches[0].clientY;t0=Date.now();},{passive:true});
  document.addEventListener('touchend',e=>{if(x0==null)return;const t=e.changedTouches[0];const dx=t.clientX-x0,dy=t.clientY-y0;x0=null;
    if(Date.now()-t0>800||Math.abs(dx)<60||Math.abs(dx)<1.5*Math.abs(dy))return;
    if(dx<0)goNext();else goPrev();},{passive:true});
})();
function wrongBook(keepScroll){
  view={name:'wb'};const app=document.getElementById('app');const ids=wrongList();
  let h=`<div><div class="top"><button class="back" id="bk">‹ 返回</button><div class="where">错题集 ${ids.length} 题${S.sub==='全部'?'':' · '+SUBNAME[S.sub]}</div></div>`;
  const dn=dueList(ids).length;
  h+=`<button class="btn pri" id="redo" ${ids.length?'':'disabled'} style="margin:0 0 12px">${dn?`重刷全部错题（今日待刷 ${dn} 题）`:ids.length?`再练全部错题（共 ${ids.length} 题，今日已刷过）`:'重刷全部错题'}</button>`;
  if(!ids.length){
    h+=`<div class="card empty">错题集是空的</div>`;
  }else{
    const groups=[];const byU={};
    ids.forEach(id=>{const u=Q[id].u;if(!byU[u]){byU[u]=[];groups.push(u);}byU[u].push(id);});
    h+=`<div class="hint" style="margin:0 0 8px">已按${S.sort==='pred'?'「2027 预测比重」':'「22 年历史均分」'}排列各章错题，可按章节单独重刷或重置：</div>`;
    groups.forEach(ui=>{
      const u=D[ui],uIds=byU[ui],uDue=dueList(uIds);
      const redoLabel=uDue.length?`重刷本节错题 (${uDue.length})`:`再练本节错题 (${uIds.length})`;
      h+=`<div class="card"><div class="wb-head"><div class="wb-info"><div class="wb-title"><span class="tag">${SUBNAME[u.sub]||u.sub}</span><span>${esc(u.name)}</span></div><div class="wb-sub">共 ${uIds.length} 道错题 · 今日待刷 ${uDue.length} 题</div></div><div class="wb-acts"><button class="smbtn pri" data-wru="${ui}">${redoLabel}</button><button class="smbtn" data-rdu="${ui}">重刷全章</button><button class="smbtn warn" data-clrw="${ui}">清空错题</button></div></div><div class="wb-list">`;
      h+=uIds.map(id=>{const q=Q[id],s=S.q[id];
        return `<div class="wb"><span class="tag">${q.y} ${TN[q.t]}</span><span class="tag rev">错${s[3]||1}次${s[1]?' · 已连对1次':''}</span><div>${esc(q.s)}</div></div>`;
      }).join('');
      h+=`</div></div>`;
    });
  }
  h+='</div>';app.innerHTML=h;
  document.getElementById('bk').onclick=home;
  document.getElementById('redo').onclick=()=>startWrong(dn===0,'wb');
  app.querySelectorAll('[data-wru]').forEach(b=>b.onclick=()=>{const ui=+b.dataset.wru;const uw=unitWrongIds(ui),ud=dueList(uw);startUnitWrong(ui,ud.length===0,'wb');});
  app.querySelectorAll('[data-rdu]').forEach(b=>b.onclick=()=>{const ui=+b.dataset.rdu;redoCurrentChapter(D[ui],'wb');});
  app.querySelectorAll('[data-clrw]').forEach(b=>b.onclick=()=>{const ui=+b.dataset.clrw;clearUnitWrong(D[ui]);});
  if(keepScroll!==true)window.scrollTo(0,0);
}
// 键盘不参与做题：没有快捷键，回车/空格也不会触发按钮（防误触），只能点
document.addEventListener('keydown',e=>{
  const tg=e.target.tagName;if(tg==='TEXTAREA'||(tg==='INPUT'&&(e.target.type==='text'||e.target.type==='password')))return;
  if(e.key==='Enter'||e.key===' '||e.key==='Spacebar'){e.preventDefault();e.stopPropagation();}
},true);
document.addEventListener('keyup',e=>{const tg=e.target.tagName;if(tg==='TEXTAREA'||(tg==='INPUT'&&(e.target.type==='text'||e.target.type==='password')))return;if(e.key===' '||e.key==='Spacebar'){e.preventDefault();}},true);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&canSave&&SYNC.token&&SYNC.gistId&&SYNC.auto!==false&&Date.now()-lastAutoTry>15000)syncNow(true);});

home();
if(canSave&&SYNC.token&&SYNC.gistId&&SYNC.auto!==false)syncNow(true);
