关”\u0002。","k":"","kb":39,"kh":[[166,246],[282,311]]},{"id":"2014-54","y":2014,"t":"多","s":"下列选项中,属于我国国家机构组织和活动原则的有（ ）。","o":["法治原则","责任制原则","权力分立与制约原则","民主集中制原则"],"a":"ABD","e":"\u0001我国国家机构组织和活动的原则包括:民主集中制原则、责任制原则、法治原则、民族平等和民族团结的原则、效率原则、联系群众原则党的领导原则。\u0002\nA✓ 符合题意及现行制度规定（\u0001法治原则\u0002）\nB✓ 符合题意及现行制度规定（\u0001责任制原则\u0002）\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ 我国国家机构组织和活动的原则包括:民主集中制原则、责任制原则、法治原则、民族平等和民族团结的原则、效率原则、联系群众原则党的领导原则\n因此选ABD项。 我国不承 \" 三权分立 \"原则。","k":"","kb":39,"kh":[[22,87]]},{"id":"2015-56","y":2015,"t":"多","s":"下列选项中,属于我国人民法院审判工作原则的有（ ）。","o":["两审终审原则","群众路线原则","平等适用法律原则","被告人有权获得辩护原则"],"a":"CD","e":"\u0001我国人民法院审判工作原则有:依法独立审判原则,公民在法律面前一律平等原则,被告人有权获得辩护原则,使用本民族语言文字进行诉讼原则。\u0002\nA✗ 审判制度有:两审终审制,合议制度,回避制度, 公开审判制度,审判监督制度,审判委员会制度\nB✗ 与题干设问或现行制度要件不符，故不选\nC✓ 符合题意及现行制度规定（\u0001平等适用法律原则\u0002）\nD✓ 我国人民法院审判工作原则有:依法独立审判原则,公民在法律面前一律平等原则,被告人有权获得辩护原则,使用本民族语言文字进行诉讼原则","k":"","kb":39,"kh":[[166,246],[246,266]]},{"id":"2016-27","y":2016,"t":"单","s":"根据我国宪法和法律,下列关于地方各级人民代表大会的表述,不正确的是（ ）。","o":["地方各级人民代表大会都是地方国家权力机关","地方各级人民代表大会会议每年至少举行一次","地方各级人民代表大会会议由本级人大常委会召集","地方各级人大进行选举和通过决议,以全体代表过半数通过"],"a":"C","e":"\u0001地方各级人民代表大会的工作方式主要是举行会议,会议至少每年举行一次。\u0002\nA✗ 地方各级人民代表大会是本行政区域内的国家权力机关,本行政区域内的同级人民政府、人民法院和人民检察院都由其产生,对它负责,受它监督\nB✗ 地方各级人民代表大会的工作方式主要是举行会议,会议至少每年举行一次\nC✓ 县级以上地方各级人大会议由本级人大常委会召集,乡级人大会议由上一次的人大会议主席团负责召集\nD✗ 地方各级人大通过选举和通过决议都必须以全体代表的过半数通过","k":"","kb":39,"kh":[[166,246],[246,266]]},{"id":"2016-29","y":2016,"t":"单","s":"根据我国宪法和法律,下列关于人民法院审 判工作制度的表述,正确的是（ ）。","o":["人民法院实行陪审制","人民法院审判案件,实行两审终审制","上级人民法院领导下级人民法院的审判工作","人民法院设立审判监督庭,专门讨论重大疑难案件"],"a":"B","e":"\u0001人民法院审判案件实行合议制,人民法院审判第一审案件,由审判员组成合议庭或者由审判员和人民陪审员组成合议庭进行,陪审员不是在每一次审判中都存在。\u0002\nA✗ 人民法院审判案件实行合议制,人民法院审判第一审案件,由审判员组成合议庭或者由审判员和人民陪审员组成合议庭进行,陪审员不是在每一次审判中都存在\nB✓ 人民法院审判案件实行两审终审制,即一个案件经过两级人民法院的审判,遂告终结的制度\nC✗ 上级人民法院监督下级人民法院的审判工作,不是领导\nD✗ 人民法院设立审判委员会制度,讨论重大的或者疑难的案件","k":"","kb":39,"kh":[[166,246],[246,266]]},{"id":"2017-29","y":2017,"t":"单","s":"根据现行宪法和法律,下列关于人民法院的表述,正确的是（ ）。","o":["人民法院审判案件一律公开进行","最高人民法院院长的连选连任,不受任期限制","地方各级人民法院对上一级人民法院负责并报告工作","人民法院依法独立行使审判权,不受行政机关、社会团体和个人的干涉"],"a":"D","e":"\u0001《人民法院组织法》第4条规定:\"人民法院依照法律规定独立行使审判权,不受行政机关、社会团体和个人的干涉。\u0002\nA✗ 第7条规定: \"人民法院实行司法公开,法律另有规定的除外\nB✗ \u0001《宪法》\u0002 \"最高人民法院院长每届任期第129条第2款规定: 同全国人民代表大会每届任期相同,连续任职不得超过两届\nC✗ 地方各级人民法院对本级人民代表大会及其常务委员会负责并报告工作\nD✓ \u0001《人民法院组织法》第4条\u0002规定:\"人民法院依照法律规定独立行使审判权,不受行政机关、社会团体和个人的干涉\n\"该项 \"最高人民法院对全国人民代项错误。 第9条规定: 表大会及其常务委员会负责并报告工作。 各级人民代表大会及其常务委员会对本级人民法院的工作实施监督。","k":"","kb":39,"kh":[[166,246],[246,266]]},{"id":"2017-55","y":2017,"t":"多","s":"根据我国地方组织法,下列关于地方各级人民代表大会的表述,正确的有（ ）。","o":["省人民代表大会会议每年至少举行一次","市人民代表大会举行会议的时候,由主席团主持","县人民法院院长列席本级人民代表大会会议","乡人大主席负责召集下一次本级人民代表大会会议"],"a":"ABC","e":"\u0001《地方各级人民代表大会和地方各级人民政府组织法》第10 条规定:地方各级人民代表大会会议每年至少举行一次。\u0002\nA✓ 经过五分之一以上代表提议,可以临时召集本级人民代表大会会议\nB✓ 第13 条第3款规定:县级以上的地方各级人民代表大会举行会议的时候,由主席团主持会议\nC✓ 县级以上的其他有关机关、团体负责人,经本级人民代表大会常务委员会决定,可以列席本级人民代表大会会议\nD✗ 乡、民族乡、镇的人民代表大会主席、副主席为主席团的成员\n第17条规定:县级以上的地方各级人民政府组成人员和人民法院院长、人民检察院检察长,乡级的人民政府领导人员,列席本级人民代表大会会议; 第15条规定:乡、民族乡、镇的人民代表大会举行会议的时候,选举主席团。 由主席团主持会议,并负责召集下一次的本级人民代表大会会议。","k":"","kb":39,"kh":[[166,246],[282,311]]},{"id":"2018-19","y":2018,"t":"单","s":"关于县级以上地方各级人民政府的组成部门,下列说法正确的是（ ）。","o":["各级人民政府由同级人民代表大会决定设立","地方审计机关独立行使审计监督权,只对上一级审计机关负责","各组成部门受本级人民政府的领导,并且受上级主管部门的业务指导或领导","民族自治地方人民政府组成部门的负责人, 由实施区域自治的民族公民担任"],"a":"C","e":"\u0001地方审计机关向本级人民政府及上一级审计机关负责。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 地方审计机关向本级人民政府及上一级审计机关负责\nC✓ 符合题意及现行制度规定（\u0001各组成部门受本级人民政府的领导,并且\u0002）\nD✗ 民族自治地方的行政负责人由自治民族的公民担任,即自治区主席、自治州州长、自治县县长由实行区域自治的民族的公民担任\n相关表述明显错误; 各部门的负责人不一定是要民族自治的民族的公民担任。","k":"","kb":39,"kh":[[87,165],[166,246]]},{"id":"2018-20","y":2018,"t":"单","s":"关于我国专门人民法院,下列说法正确的是（ ）。","o":["知识产权法院的设立由全国人大常委会决定","中国人民解放军法院院长由中央军事委员会任命","海事法院负责审理海事和海商领域的刑事和民事案件","我国设立专门的行政法院以保障行政案件的独立公正审理"],"a":"A","e":"\u0001海事法院管辖第一审的海事案件和海商案件, 不包括刑事案件。\u0002\nA✓ 2014年8月31 该项,全国人大常委会表决通过了全国人大常委会\u0001《关于在北京、上海、广州设立知识产权法院的决定》\u0002\nB✗ 军事法院院长由全国人大常委会根据最高人民法院院长的提名任免\nC✗ 海事法院管辖第一审的海事案件和海商案件, 不包括刑事案件\nD✗ 我国专门法院不包括行政法院,我国的行政诉讼案件由法院内设的行政审判庭进行审理","k":"","kb":39,"kh":[[166,246],[246,266]]},{"id":"2019-20","y":2019,"t":"单","s":"根据我国宪法和法律,下列关于监察委员会的表述,不正确的是（ ）。","o":["国家监察委员会是最高监察机关","上级监察委员会监督下级监察委员会的工作","各级监察委员会是行使国家监察职能的专责机关","监察委员会依法独立行使监察权,不受行政机关、社会团体和个人的干涉"],"a":"B","e":"\u0001国家监察委员会是最高监察机关,领导地方各级监察委员会工作。\u0002\nA✗ 国家监察委员会是最高监察机关,领导地方各级监察委员会工作\nB✓ \u0001《宪法》\u0002规定:国家监察委员会领导地方各级监察委员会的工作,上级监察委员会领导下级监察委员会的工作,是领导而不是监督\nC✗ 各级监察委员会是国家的监察机关,是行使国家监察职能的专责机关\nD✗ 监察委员会依法独立行使检察权,不受行政机关、社会团体和个人的于涉","k":"","kb":39,"kh":[[22,87],[87,165]]},{"id":"2019-21","y":2019,"t":"单","s":"某市中级人民法院在审理一起姓名权案件时,认为《婚姻法》第二十二条“子女可以随父姓,可以随母姓”的规定需要进一步明确具体含义,于是中止审理,逐级报送至最高人民法院。根据我国宪法和法律,下列做法正确的是（ ）。","o":["该市中级人民法院可以援引宪法作为裁判依据","最高人民法院应就进一步明确该条的具体含义作出司法解释","该市中级人民法院应直接报送全国人大常委会,根据请示结果作出判决","最高人民法院可向全国人大常委会提出对该条进行法律解释的要求"],"a":"D","e":"\u0001《立法法》第45条规定:法律解释权属于全国人民代表大会常务委员会。\u0002\nA✗ 我国法院不能直接援引宪法作为裁判依据\nB✗ 法律有以下情况之一的,由全国人民代表大会常务委员会解释: (一)法律的规定需要进一步明确具体含义的\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ 本题中,\u0001《婚姻法》第22条\u0002的规定需要进一步明确具体含义,应当由全国人大常委会进行解释,但该市中级人民法院无权直接报送全国人大常委会,而是最高院可向全国人大常委会提出进行法律解释的要求\n(二)法律制定后出现新的情况,需要明确适用法律依据的。 第46条规定:国务院、中央军事委员会、最高人民法院、最高人民检察院和全国人民代表大会各专门委员会以及省、自治区、直辖市的人民代表大会常务委员会可以向全国人民代表大会常务委员会提出法律解释要求。","k":"","kb":37,"kh":[[199,378],[379,441]]},{"id":"2020-18","y":2020,"t":"单","s":"某镇镇长甲涉嫌贪污公款被调查,后被起诉至县人民法院。法院经过审理,判处甲有期徒刑五年。关于此案,下列做法正确的是（ ）。","o":["县公安机关对甲立案侦查","县人民法院认为贪污是甲的隐私,不公开审理此案","人民检察院认为县人民法院判决错误,提出抗诉","上级人民法院认为县人民法院的量刑过重, 要求其改判为三年"],"a":"C","e":"\u0001根据《监察法》的规定,监察委员会对涉嫌贪污贿赂、滥用职权、玩忽职守、权力寻租、利益输送、徇私舞弊以及浪费国家资财等职务违法和职务犯罪进行调查,而不是由公安机关立案侦查。\u0002\nA✗ 根据\u0001《监察法》\u0002的规定,监察委员会对涉嫌贪污贿赂、滥用职权、玩忽职守、权力寻租、利益输送、徇私舞弊以及浪费国家资财等职务违法和职务犯罪进行调查,而不是由公安机关立案侦查\nB✗ 公开审判是指人民法院对受理的案件公开审理和公开宣判,贪污不属于隐私,应该公开审理\nC✓ 人民检察院认为判决有错误的,应当提出抗诉\nD✗ 上级人民法院认为县人民法院的量刑过重的,可以自己改判,而不是要求下级人民法院改判","k":"","kb":39,"kh":[[166,246],[246,266]]},{"id":"2020-27","y":2020,"t":"单","s":"下列关于监察委员会组织和职权的表述,正确的是（ ）。","o":["国家监察委员会监督地方各级监察委员会的工作","地方各级监察委员会只对上一级监察委员会负责","各级监察委员会无权对人大及其常委会机关的公务员进行监察","被调查人既涉嫌严重职务违法或者职务犯罪,又涉嫌其他违法犯罪,一般应当由监察机关为主调查,其他机关予以协助"],"a":"D","e":"\u0001国家监察委员会领导地方各级监察委员会的工作,上级监察委员会领导下级监察委员会的工作。\u0002\nA✗ 国家监察委员会领导地方各级监察委员会的工作,上级监察委员会领导下级监察委员会的工作\nB✗ 地方各级监察委员会由本级人大产生,对本级人大及其常委会和上一级监察委员会负责,并接受其监督\nC✗ 各级监察委员会是国家的监察机关,是行使国家监察职能的专责机关, 依法对所有行使公权力的公职人员进行监察,调查职务违法和职务犯罪,开展廉政建设和反腐败工作,维护宪法和法律的尊严\nD✓ 监察机关办理职务违法和职务犯罪案件,应当由监察机关为主调查,其他机关予以协助\n是领导而不是监督。 国家监察委员会由全国人大产生,对全国人大及其常委会负责, 并接受其监督。 监察委员会依法独立行使监察权,不受行政机关、社会团体和个人的干涉。","k":"","kb":39,"kh":[[0,21],[22,87]]},{"id":"2021-47","y":2021,"t":"多","s":"根据我国宪法和法律,下列关于人民检察院职权的表述,正确的有（ ）。","o":["对人民法院的审判活动是否合法,实行监督","对职务犯罪案件作出不起诉决定,须经上一级人民检察院批准","依照法律规定提起公益诉讼","对公安机关的侦查活动是否合法,实行监督"],"a":"ABCD","e":"\u0001《人民检察院组织法》第20条规定: \" 人民检察院行使下列职权:(一)依照法律规定对有关刑事案件行使侦查权。\u0002\nA✓ 符合题意及现行制度规定（\u0001对人民法院的审判活动是否合法,实行监\u0002）\nB✓ \u0001《人民检察院刑事诉 \"人民检察院直接受理侦查的讼规则》第371条\u0002规定: 案件,以及监察机关移送起诉的案件,拟作不起诉决定的,应当报请上一级人民检察院批准\nC✓ (四)依照法律规定提起公益诉讼\nD✓ 符合题意及现行制度规定（\u0001对公安机关的侦查活动是否合法,实行监\u0002）\n(二)对刑事案件进行审查, 批准或者决定是否逮捕犯罪嫌疑人; (三)对刑事案件进行审查,决定是否提起公诉,对决定提起公诉的案件支持公诉; (五)对诉讼活动实行法律监督; (六)对判决、裁定等生效法律文书的执行工作实行法律监督; (七)对监狱、看守所的执法活动实行法律监督; (八)法律规定的其他职权。","k":"","kb":39,"kh":[[166,246],[282,311]]},{"id":"2022-18","y":2022,"t":"单","s":"根据我国宪法和法律,下列关于监察委员会的表述,正确的是（ ）。","o":["监察委员会是国家的法律监督机关","派驻的监察机构、监察专员对同级人大常委会负责","监察委员会副主任和委员的任免由监察委员会主任决定","人大常委会会议期间,常委会组成人员可以依法对监察工作提出质询"],"a":"D","e":"\u0001监察委员会是国家的监察机关,人民检察院是国家的法律监督机关。\u0002\nA✗ 监察委员会是国家的监察机关,人民检察院是国家的法律监督机关\nB✗ 监察机构、监察专员对派驻或者派出它的监察委员会负责\nC✗ 地方各级监察委员会主任由本级人民代表大会选举,副主任、委员由监察委员会主任提请本级人民代表大会常务委员会任免\nD✓ 在全国人大常委会会议期间,常委会组成人员10人以上联名,可以向国务院及其各部委、国家监察委员会、最高人民法院、最高人民检察院提出书面质询案\n根据\u0001《监察法》\u0002的规定,各级监察委员会可以向本级中国共产党机关、国家机关、法律法规授权或者委托管理公共事务的组织和单位以及所管辖的行政区域、国有企业等派驻或者派出监察机构、监察专员。 国家监察委员会主任由全国人民代表大会选举,副主任、委员由国家监察委员会主任提请全国人民代表大会常务委员会任免。","k":"","kb":39,"kh":[[0,21],[282,311]]},{"id":"2022-26","y":2022,"t":"单","s":"根据我国宪法和法律,下列关于最高人民法院的表述,正确的是（ ）。","o":["最高人民法院领导各级人民法院的审判工作","互联网法院的上诉案件,由最高人民法院管辖","最高人民法院可以设巡回法庭,审理最高人民法院依法确定的案件","高级人民法院院长的任免,由最高人民法院院长提请全国人大常委会批准"],"a":"C","e":"\u0001根据我国《人民法院组织法》的规定, 最高人民法院监督地方各级人民法院和专门人民法院的审判工作,上级人民法院监督下级人民法院的审判工作。\u0002\nA✗ 根据我国\u0001《人民法院组织法》\u0002的规定, 最高人民法院监督地方各级人民法院和专门人民法院的审判工作,上级人民法院监督下级人民法院的审判工作\nB✗ 根据\u0001《最高人民法院关于互联网法院审理案件若干问题的规定》\u0002(以下简称\u0001《规定》\u0002),互联网法院的上诉案件由\u0001《规定》\u0002中的具体法院管辖,而非由最高人民法院管辖\nC✓ 最高人民法院可以设巡回法庭,审理最高人民法院依法确定的案件\nD✗ 高级人民法院院长由省级人民代表大会选举\n地方各级人民法院院长由本级人民代表大会选举,副院长、审判委员会委员、庭长、副庭长和审判员由院长提请本级人民代表大会常务委员会任免。","k":"","kb":39,"kh":[[166,246],[246,266]]},{"id":"2023-21","y":2023,"t":"单","s":"下列关于国家监察委员会的表述,正确的是（ ）。","o":["国家监察委员会是最高法律监督机关","国家监察委员会指导地方各级监察委员会的工作","国家监察委员会主任由全国人大常委会选举产生","国家监察委员会对全国人大及其常委会负责,并接受其监督"],"a":"D","e":"\u0001国家监察委员会由全国人大产生，对全国人大及其常委会负责，并接受其监督。\u0002\nA✗ 国家最高法律监督机关是\u0001最高人民检察院\u0002，国家监察委员会是最高监察机关\nB✗ 上级监察委员会与下级监察委员会之间是\u0001领导关系\u0002（而非仅“指导”关系）\nC✗ 国家监察委员会主任由\u0001全国人民代表大会\u0002选举和罢免，而非全国人大常委会\nD✓ 依据《宪法》第126条，\u0001国家监察委员会对全国人大和全国人大常委会负责\u0002，并接受其监督\n国家机构上下级关系对比：人大之间为\u0001监督\u0002，法院之间为\u0001审判监督\u0002，政府、监察委、检察院上下级之间均为\u0001领导\u0002。","k":"","kb":39,"kh":[[22,87],[282,311]]},{"id":"2023-25","y":2023,"t":"单","s":"根据我国宪法和法律,有权任免最高人民法院审判员的是（ ）。","o":["司法部","最高人民法院院长","最高人民法院审判委员会","全国人大常委会"],"a":"D","e":"\u0001根据现行《宪法》，最高人民法院审判员由全国人大常委会任免。\u0002\nA✗ 司法部属于国务院行政组成部门，无权干涉法院法官人事任免\nB✗ 最高人民法院院长有权\u0001提请\u0002全国人大常委会任免副院长、庭长、副庭长、审委会委员和审判员，无权直接任免\nC✗ 审判委员会负责总结审判经验、讨论重大疑难案件，不负责任免审判员\nD✓ 《宪法》第67条规定，\u0001全国人大常委会\u0002根据最高人民法院院长的提请，任免最高人民法院审判员\n区分人事任免权：\u0001院长本人\u0002由全国人大选举罢免；\u0001副院长、庭长、审判员等\u0002均由最高法院长提请\u0001全国人大常委会\u0002任免。","k":"","kb":37,"kh":[[199,378],[379,441]]},{"id":"2024-25","y":2024,"t":"单","s":"根据我国宪法和法律,下列关于人民检察院的表述,正确的是（ ）。","o":["人民检察院依法对犯罪嫌疑人决定和执行逮捕","各级人民检察院可以对检察工作中具体应用法律的问题作出司法解释","上级人民检察院认为下级人民检察院的决定错误的,可以依法撤销","人民检察院依法对公职人员涉嫌失职渎职等职务违法行为进行调查处置"],"a":"C","e":"\u0001上下级检察院之间是领导关系，上级检察院认为下级检察院的决定错误的，有权依法撤销或者变更。\u0002\nA✗ 检察院依法\u0001批准或决定逮捕\u0002，但逮捕的执行权属于\u0001公安机关\u0002，检察院不直接执行逮捕\nB✗ 司法解释权专属于\u0001最高人民法院和最高人民检察院\u0002，地方各级检察院无权作出司法解释\nC✓ 依据《宪法》与《人民检察院组织法》，最高人民检察院领导地方各级检察院和专门检察院，\u0001上级检察院有权撤销或变更下级检察院的错误决定\u0002\nD✗ 2018年修宪和《监察法》实施后，对公职人员职务违法和职务犯罪的调查处置已整体划归\u0001监察委员会\u0002行使\n区分逮捕权分工：\u0001检察院批捕、法院决定逮捕、公安机关执行逮捕\u0002；司法解释权仅限\u0001“两高”\u0002。","k":"","kb":39,"kh":[[282,311],[311,355]]},{"id":"2025-16","y":2025,"t":"单","s":"为推进《社会保险法》全面贯彻实施,促进社会保险工作健康发展,相关执法检查于 2024 年6 月启动。根据我国宪法和法律,有权对《社会保险法》实施情况组织执法检查的国家机构是（ ）。","o":["司法部","最高人民检察院","人力资源和社会保障部","全国人大常委会"],"a":"D","e":"\u0001\"因此有权对《社会保险法》实施情况组织执法检查的国家机构是全国人大常委会AB。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ \"因此有权对\u0001《社会保险法》\u0002实施情况组织执法检查的国家机构是全国人大常委会\n\u0001《各级人民代表大会常务委员会监督法》\u0002第31 条规定:\"各级人民代表大会常务委员会参照本法第十二条规定的途径,每年选择若干关系改革发展稳定大局和群众切身利益、社会普遍关注的重大问题,有计划地对有关法律、法规或者相关法律制度实施情况组织执法检查。","k":"","kb":37,"kh":[[199,378],[379,441]]},{"id":"2025-19","y":2025,"t":"单","s":"根据我国宪法和法律,下列关于人民法院人员任免的表述,正确的是（ ）。","o":["基层人民法院庭长的任免由上一级人民法院批准","直辖市内的中级人民法院院长由直辖市人大常委会根据主任会议的提名决定任免","高级人民法院审判委员会委员由院长提请本级人民代表大会任免","最高人民法院副院长由全国人民代表大会选举"],"a":"B","e":"\u0001地方各级人民法院院长由本级人民代表大会选举和罢免,副院长、审判委员会委员、庭长、副庭长和审判员,由院长提请本级人民代表大会常务委员会任免。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 在省、自治区内按地区设立的和在直辖市内设立的中级人民法院的院长,由省、自治区、直辖市人民代表大会常务委员会根据主任会议的提名决定任免,副院长、审判委员会委员、庭长、副庭长和审判员,由高级人民…\nC✗ 地方各级人民法院院长由本级人民代表大会选举和罢免,副院长、审判委员会委员、庭长、副庭长和审判员,由院长提请本级人民代表大会常务委员会任免\nD✗ 最高人民法院院长由全国人民代表大会选举和罢免,副院长、审判委员会委员、庭长、副庭长和审判员,由院长提请全国人民代表大会常务委员会任免\n在省、自治区内按地区设立的和在直辖市内设立的中级人民法院的院长,由省、自治区、直辖市人民代表大会常务委员会根据主任会议的提名决定任免,副院长、审判委员会委员、庭长、副庭长和审判员,由高级人民法院院长提请省、自治区、直辖市人民代表大会常务委员会任免。","k":"","kb":39,"kh":[[166,246],[246,266]]},{"id":"2025-23","y":2025,"t":"单","s":"根据《监察法》,下列关于留置的表述,正确的是（ ）。","o":["监察机关发现采取留置措施不当的,应当及时解除","监察机关采取留置措施,应当由监察机关负责人个人决定","设区的市级以下监察机关采取留置措施,应当报上一级监察机关备案","留置时间不得超过六个月,特殊情况可以延长一次,延长时间不得超过六个月"],"a":"A","e":"\u0001监察机关采取留置措施,应当由监察机关领导人员集体研究决定。\u0002\nA✓ 监察机关发现采取留置措施不当或者不需要继续采取留置措施的,应当及时解除或者变更为责令候查措施\nB✗ 监察机关采取留置措施,应当由监察机关领导人员集体研究决定\nC✗ 设区的市级以下监察机关采取留置措施,应当报上一级监察机关批准\nD✗ 在特殊情况下,可以延长一次, 延长时间不得超过三个月\n省级监察机关采取留置措施,应当报国家监察委员会备案。 留置时间不得超过三个月。","k":"","kb":39,"kh":[[0,21],[22,87]]},{"id":"2026-19","y":2026,"t":"单","s":"根据《监察法》,下列入员中,监察机关经依法审批,可以提出管护的是（ ）。","o":["甲,符合留置条件但患有严重疾病","乙,符合留置条件但生活不能自理","丙,涉嫌贪污贿赂罪,监察机关有重大问题需要进一步调查","丁,未被留置,在接受讯问的过程中交代涉嫌重大职务犯罪问题,存在逃跑风险"],"a":"D","e":"\u0001管护适用情形:未被留置,但存在逃跑、串供风险。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ 管护适用情形:未被留置,但存在逃跑、串供风险\nAB留置替代措施,不适用管护。","k":"","kb":39,"kh":[[22,87]]},{"id":"2026-45","y":2026,"t":"多","s":"根据我国宪法和法律,属于县级以上地方各级人民政府职权的有（ ）。","o":["就属于本行政区域的具体行政管理事项制定规章","领导所属各工作部门和下级人民政府的工作","编制和执行本行政区域内的国民经济和社会发展规划纲要","任命本级人民政府秘书长、厅长、局长、委员会主任、科长"],"a":"BC","e":"\u0001仅设区的市可制定政府规章,普通县级政府无权。\u0002\nA✗ 仅设区的市可制定政府规章,普通县级政府无权\nB✓ 符合题意及现行制度规定（\u0001领导所属各工作部门和下级人民政府的工\u0002）\nC✓ 符合题意及现行制度规定（\u0001编制和执行本行政区域内的国民经济和社\u0002）\nD✗ 政府组成人员由人大/常委会任免\n地方政府领导下属、编制规划是法定职权。","k":"","kb":39,"kh":[[166,246]]}]},{"sub":"法理学","name":"法律要素与法律体系","w":2.9,"w5":2.4,"wh":3.1,"bt":"新法","pt":"2026暴涨至6分·《民营经济促进法》/社会法热点","L":55,"qs":[{"id":"2005-6","y":2005,"t":"单","s":"法律规则可以分为授权性规则和义务性规则,这一分类所依据的标准是（ ）。","o":["法律规则规定的内容","法律规则对人们行为规定和限定的范围或程度","法律规则内容的确定性程度","法律规则所包含的社会关系"],"a":"A","e":"\u0001根据法律规则对人们行为规定和限定的范围或程度的不同,分为强行性规则和任意性规则。\u0002\nA✓ 符合题意及现行制度规定（\u0001法律规则规定的内容\u0002）\nB✗ 根据法律规则对人们行为规定和限定的范围或程度的不同,分为强行性规则和任意性规则\nC✗ 根据法律规则内容的确定性程度不同,分为确定性规则、委任性规则和准用性规则\nD✗ 的分类方法不存在\n\u0001“法律规则所包含的社会关系”\u0002 的分类方法不存在。","k":"","kb":9,"kh":[[86,121],[121,168]]},{"id":"2005-13","y":2005,"t":"单","s":"在我国,依据法律部门划分的标准和原则,《中华人民共和国香港特别行政区基本法》属于（ ）。","o":["行政法","宪法","社会保障法","民法"],"a":"B","e":"\u0001宪法部门是调整公民与国家之间基本政治关系的法律规范的总和,其基本内容涉及到国家的根本制度、原则、方针、政策、,公民的基本权利和义务,国家机关的地位、职权和职责。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 法律部门划分的标准是调整对象和调整方法\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选\n就\u0001《香港特别行政区基本法》\u0002的内容而言,属于宪法部门。","k":"","kb":11,"kh":[[83,124],[159,241]]},{"id":"2006-8","y":2006,"t":"单","s":"分法律部门时,首先应考虑和坚持的原则是（ ）。","o":["客观原则","目的原则","平衡原则","发展原则"],"a":"B","e":"\u0001法律部门划分的标准是依客观存在的法律调整对象和调整方法,所以说划分原则首先要考虑客观原则。\u0002\nA✗ 法律部门划分的标准是依客观存在的法律调整对象和调整方法,所以说划分原则首先要考虑客观原则\nB✓ 符合题意及现行制度规定（\u0001目的原则\u0002）\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选","k":"","kb":11,"kh":[[0,82],[83,124]]},{"id":"2006-12","y":2006,"t":"单","s":"下列诸项表述中,正确的是（ ）。","o":["为人们的行为提供模式、标准或方向,这一特性指的是法的统一性","法是调整人们行为的规范和法是调整社会关系的规范,这两种说法没有本质上的区别","非规范性法律文件虽然没有规范性,但有法律效力,因而也属于法律的范畴","国家强制力是保证法的实施的唯一力量"],"a":"B","e":"\u0001反映的是法的规范性特征。\u0002\nA✗ 反映的是法的规范性特征\nB✓ 法是调整社会关系的规范,社会关系是由人们之间的行为构成的,故两者没有本质上的区别\nC✗ 法律,可以反复适用,是规范性法律文件\nD✗ 与题干设问或现行制度要件不符，故不选\n统一性,是指法律前后一致,不相冲突。","k":"","kb":2,"kh":[[0,147]]},{"id":"2007-2","y":2007,"t":"单","s":"规则的内容尚未确定,而只规定某种概括性指示,由有关的国家机关通过相应的途径或程序加以确定的法律规则是（ ）。","o":["确定性规则","任意性规则","准用性规则","委任性规则"],"a":"D","e":"\u0001法律规则的种类按法律规则的内容是否直接地被明确规定下来,可以把法律规则区分为确定性规则、委任性规则和准用性规则。\u0002\nA✗ 确定性规则是指明确地规定了行为规则的内容,无须再援用其他规则来确定本规则内容的法律规则\nB✗ 任意性规则与强行性规则相对,是指法律规则的适用与否由主体自行协商的规则\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ 委任性规则是指没有明确规定行为规则的内容,而授权某一机构加以具体规定的法律规则\n是指没有明确规定行为准则的内容,但明确指出可以援引其他规则来使本规则的内容得以明确的法律规则。 根据题目要求,选\u0001“委任性规则”\u0002。","k":"","kb":9,"kh":[[121,168],[168,186]]},{"id":"2007-8","y":2007,"t":"单","s":"下列关于法律部门划分的表述,正确的是 （ ）。","o":["法律部门的划分虽然有客观依据,但最终还是人们主观活动的产物","划分法律部门的目的主要是便于统计本国法律数量的多少","划分法律部门时应当注意使各法律部门之间法律规范的数量保持相等","法律部门划定后应保持其恒定性,不能随着社会法制状况的改变而调整"],"a":"A","e":"\u0001法律部门的划分法律部门的划分的标准是法律调整的对象和方法,都是客观的,但是从最终上讲,法律部门的划分还是人为的,是人们主观活动的产物。\u0002\nA✓ 法律部门的划分法律部门的划分的标准是法律调整的对象和方法,都是客观的,但是从最终上讲,法律部门的划分还是人为的,是人们主观活动的产物\nB✗ 法律部门的划分并非为统计本国法律数量的多少,而是保持法律规范之间的协调统一\nC✗ 划分法律部门应当考虑各法律部门之间法律规范的规模或数量之间保持大体上的均衡,但是不可能保持相等\nD✗ 随着社会的发展,会形成新的法律部门或者改变某一法律部门的属性, 因此法律部门的划分不可能一成不变","k":"","kb":11,"kh":[[0,82],[83,124]]},{"id":"2007-14","y":2007,"t":"单","s":"下列关于法律特征的表述,能够成立的是 （ ）。","o":["法律对人们行为的调整主要通过权利义务的设定和运行来实现,这要求法律上的权利义务规定应具有确定性和可预测性","法律规范与道德规范的区别之一,在于法律规范可以反复适用,而道德规范不能反复适用","法律具有统一性和普遍性,因此一国法律体系内部的各种法律规范之间不存在矛盾","法律之所以由国家强制力来保证实施,主要是因为法律只有依靠惩罚才能发挥作用"],"a":"A","e":"\u0001法律的特征法律规范和道德规范都可以反复适用,它们的区别在于产生背景、表现形式、内容和实施方式等几个方面。\u0002\nA✓ 符合题意及现行制度规定（\u0001法律对人们行为的调整主要通过权利义务\u0002）\nB✗ 法律的特征法律规范和道德规范都可以反复适用,它们的区别在于产生背景、表现形式、内容和实施方式等几个方面\nC✗ 法律的普遍性是指法作为一般的行为规范在国家权力管辖范围内具有普遍适用的效力和特性,并不是指法律规范之间不存在矛盾\nD✗ 人们可以自觉遵守法律,国家强制力只是法律实施的最后保障手段,法律并非只有依靠惩罚才能发挥作用","k":"","kb":11,"kh":[[0,82],[159,241]]},{"id":"2007-48","y":2007,"t":"多","s":"下列关于“刑法”这一概念的表述,能够成立的有（ ）。","o":["“刑法”可以用作我国法律体系中一个法律部门的名称","“刑法”可以用作我国的一种法律渊源的名称","“刑法”可以用作《中华人民共和国刑法》这一法律文件的简称","“刑法”可以用作我国法学体系中一个法学分支学科的名称"],"a":"AC","e":"\u0001\"刑法\"可以作为《中华人民共和国刑法》的简称,但是不能把它看作是法律渊源的名称,因为法律渊源的名称指的是宪法、法律、行政法规等,不包括刑法。\u0002\nA✓ 法律部门刑法是我国社会主义法律体系中一个很重要韵法律部门\nB✗ 与题干设问或现行制度要件不符，故不选\nC✓ \"刑法\"可以作为\u0001《中华人民共和国刑法》\u0002的简称,但是不能把它看作是法律渊源的名称,因为法律渊源的名称指的是宪法、法律、行政法规等,不包括刑法\nD✗ 在表示一个法学分支学科的名称时,应当用\"刑法学\"而不是\"刑法\"","k":"","kb":11,"kh":[[0,82],[159,241]]},{"id":"2008-2","y":2008,"t":"单","s":"下列选项中属于规范性法律文件的是（ ）。","o":["某工商行政管理局作出的行政处罚决定书","某高校制定的《大学生行为守则》","《中华人民共和国种子法实施条例》","甲乙两公司依法签订的购销合同"],"a":"C","e":"\u0001规范性,是指针对对象不特定,而且能够反复适用。\u0002\nA✗ 针对的对象是特定的,相关表述 针对的对象是该处罚决定书载明的被处罚人,相关表述 针对的对象是甲乙两公司,故不具有规范性\nB✗ 并不属于\"法律文件\",仅为高校内部制度\nC✓ 符合题意及现行制度规定（\u0001中华人民共和国种子法实施条例\u0002）\nD✗ 与题干设问或现行制度要件不符，故不选\n相关表述 针对的对象是特定的,\u0001“某工商行政管理局作出的行政处罚决定书”\u0002 针对的对象是该处罚决定书载明的被处罚人,“甲乙两公司依法签订的购销合同” 针对的对象是甲乙两公司,故不具有规范性。 “某高校制定的大学生行为守则” 并不属于\"法律文件\",仅为高校内部制度。","k":"","kb":9,"kh":[[15,66]]},{"id":"2008-5","y":2008,"t":"单","s":"人们能根据法律预见自己和他人行为的法律后果,这体现了法律规范作用中的（ ）。","o":["评价作用","指引作用","预测作用","强制作用"],"a":"C","e":"\u0001依据题干考查要点，正确表述为“预测作用”。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✓ 题干中指明\"预见\"二字,而该\"预见\"的对象是\"自己和他人行为\"故\nD✗ 与题干设问或现行制度要件不符，故不选","k":"","kb":7,"kh":[[11,121]]},{"id":"2009-3","y":2009,"t":"单","s":"法律规定了人们的一定行为模式,从而为人们的交互行为提供了一个模型、标准或方向。法律这一特征是指（ ）。","o":["法律的规范性","法律的普遍性","法律的确定性","法律的统一性"],"a":"A","e":"\u0001法的规范性,是指发所具有的规定人们行为规范、为人们的交互行为提供了一个模型、标准和方向,可反复适用。\u0002\nA✓ 法的规范性,是指发所具有的规定人们行为规范、为人们的交互行为提供了一个模型、标准和方向,可反复适用\nB✗ 法的普遍性,就是指法作为一般的行为规范在国家权力管辖范围内具有普遍适用的效力的特征\nC✗ 财产不符合题意\nD✗ 本题中的表述也不符合统一特征\n法律是调整人们行为或社会关系的规范,具有规范性、国家意志性和普遍性、权利和义务一致性、国家强制性和程序性。 法通过规定人们的全玻璃和义务来分配利益,影响人们大的动机和行为,进而影响社会关系。 这就是要求法律上的权利和义务确定并不可预测。","k":"","kb":9,"kh":[[15,66],[86,121]]},{"id":"2009-6","y":2009,"t":"单","s":"按照规则规定的模式不同,法律规则可分为（ ）。","o":["授权性规则和义务性规则","强制性规则和任意性规则","确定性规则和为委任性规则","调整性规则和构成性规则"],"a":"A","e":"\u0001根据对人们规定和限定的范围或程度不同,法律规则可分为强行性规则和任意性规则。\u0002\nA✓ 根据行为模式的不同,法律规则可分为授权性规则和义务性规则\nB✗ 根据对人们规定和限定的范围或程度不同,法律规则可分为强行性规则和任意性规则\nC✗ 根据内容的确定性程度不同,法律规则可分为确定性规则、委任性规则和准用性规则\nD✗ 根据法律产生的先后顺序不同,法律规则可分为调整性规则和构成性规则","k":"","kb":9,"kh":[[86,121],[121,168]]},{"id":"2010-2","y":2010,"t":"单","s":"下列选项中,属于规范性法律文件的是（ ）。","o":["市公安机关签发的拘留证","县民政部门核发的结婚证","省高级人民法院作出的判决书","省人大常委会制定的《农村公路管理条例》"],"a":"D","e":"\u0001规范性法律文件是指有相应立法权限的国家机关制定的具有普遍约束力的法律文件,非规范性法律文件通常是指国家机关在适用法律的过程中发布的具有法律效力的个别性文件。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ 规范性法律文件是指有相应立法权限的国家机关制定的具有普遍约束力的法律文件,非规范性法律文件通常是指国家机关在适用法律的过程中发布的具有法律效力的个别性文件\n规范性法律文件和非规范性法律文件的区别在于能否反复使用、是否具有普遍约束力。 \u0001“市公安机关签发的拘留证”\u0002BC都没有普遍的约束力,只对个案有效,且都是国家机关适用法律的结果, 属于非规范性法律文件。","k":"","kb":9,"kh":[[15,66]]},{"id":"2010-47","y":2010,"t":"多","s":"划分部门法应考虑的主要原则有（ ）。","o":["合目的性原则","讲求效率原则","适当平衡原则","相对稳定原则"],"a":"ACD","e":"\u0001划分法律部门主要应考虑的原则主要有:(l) 合目的性原则。\u0002\nA✓ 划分法律部门主要应考虑的原则主要有:(l) 合目的性原则\nB✗ 与题干设问或现行制度要件不符，故不选\nC✓ (3) 适当平衡原则\nD✓ (4) 相对稳定原则\n(2) 从实际出发的原则; (5) 辩证发展原则; (6)主次原则。 (此题较为简单,为纯记忆性内容,属于送分题。 考生千万不能在此类题目上丢分。","k":"","kb":11,"kh":[[0,82],[83,124]]},{"id":"2011-6","y":2011,"t":"单","s":"《中华人民共和国教育法》第83条规定:“境外的组织和个人在中国境内办学和合作办学的办法, 由国务院规定。”从法律规则的分类角度看,该规定属于（ ）。","o":["确定性规则","委任性规则","准用性规则","任意性规则"],"a":"B","e":"\u0001委任性规则是没有明确规定行为规则的内容,而授权某一机构加以管理规定的法律规则。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 委任性规则是没有明确规定行为规则的内容,而授权某一机构加以管理规定的法律规则\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选\n法律规则种类的判断是一个重要的考点,在历年的选择题中都有所涉及。 考生在备考时, 最好每个类别都能记一至两个典型的法条,以增加感性的认识。 按照法律规则的内容的确定性程度不同, 可以分为确定性规则、委任性规则和准用性规则。 其中,委任性规则和准用性规则的区别在于前者法律没有明确的规定, 需要被授权的其他国家机关通过制定相关的规则或程序来加以明确,而后者法律已有明确的规定,只需援引或参照其他的法律规定即可。 本条规定最后授权国务院制定相关法规加以明确,属于典型的委任性规则。","k":"","kb":9,"kh":[[121,168],[168,186]]},{"id":"2011-48","y":2011,"t":"多","s":"下列关于法律规则与法律条文关系的表述, 能够成立的有（ ）。","o":["法律规则是法律条文的表现形式","一个法律条文可以表达多个法律规则 )。","有些法律条文不表达法律规则","一个法律规则可以体现于一个法律条文中"],"a":"BCD","e":"\u0001法律规则和法律条文不是一一对应的,并不是所有的法律条文都是直接规定法律规则的,也不是每一个条文都完整地表述一个规则或只表述一个规则。\u0002\nA✗ 法律条文是法律规则的表现形式,法律规则是法律条文的内容\nB✓ 符合题意及现行制度规定（\u0001一个法律条文可以表达多个法律规则 )\u0002）\nC✓ 符合题意及现行制度规定（\u0001有些法律条文不表达法律规则\u0002）\nD✓ 符合题意及现行制度规定（\u0001一个法律规则可以体现于一个法律条文中\u0002）\n法律规则不同于法律条文。 一个法律规则可能包含在几个法律条文之中,一个法律条文可能包含了几个法律规则。 (这是一个高频考点。 法律规则和法律条文比较容易混淆,因此需要考生掌握其区别,教材上也有很详细的说明。 注意法律条文和法律规则之间的区别与联系, 具体的关系可能会在法硕联考中考查简答题。","k":"","kb":9,"kh":[[0,14],[66,85]]},{"id":"2012-10","y":2012,"t":"单","s":"关于法律规则与法律条文的关系,下列表述中正确的是（ ）。","o":["内容与形式的关系","整体与部分的关系","对立与统一的关系","本质与现象的关系"],"a":"A","e":"\u0001法律规则要通过一定的形式表现出来, 而法律条文就是表现法律规则的形式,法律规则与条文之间是内容与形式的关系。\u0002\nA✓ 法律规则要通过一定的形式表现出来, 而法律条文就是表现法律规则的形式,法律规则与条文之间是内容与形式的关系\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选\n(法律规则和法律条文的比较是一个高频考点,也是比较容易混淆的考点望考生重视。","k":"","kb":9,"kh":[[0,14],[66,85]]},{"id":"2012-48","y":2012,"t":"多","s":"下列各项法律规定,属于法律原则的有（ ）。","o":["承诺生效时合同成立","当事人在民事活动中的地位平等","为了犯罪,准备工具、制造条件的,是犯罪预备","法律没有明文规定为犯罪行为的,不得定罪处刑"],"a":"BD","e":"\u0001了法律原则和法律规则的区别。\u0002\nA✗ 项不属于法律原则\nB✓ 本题考查了法律原则和法律规则的区别\nC✗ 为了犯罪准备工具制造条件为犯罪预备,这样的法条表述既不是原则,也不是规则,而是法律概念,对犯罪预备的定义性条款\nD✓ 法律原则是指可以作为法律规则的基础或本源的综合性稳定性的原理和原则\n法律规则是采取一定的结构形式,具体规定人们的法律权利、法律义务以及相应的法律后果的行为规范,它由三个要素组成:假定(条件)、行为模式、法律后果,这三者在逻辑上缺一不可。 \u0001“承诺生效时合同成立”\u0002不属于法律原则, 不选; 其内容通常比较笼统、模糊,且具有宏观的指导性,适用范围比法律规则宽广。 常见的法律原则包括:刑法中的罪刑法定原则、刑法适用平等原则罪责刑相适应原则,民法中的自愿原则、公平原则、诚实信用原则、合法原则、公序良俗原则、绿色原则,诉讼法中无罪推定原则、控审分离原则、禁止双重危险原则、国家追诉原则、辩护原则,我国宪法中的法律面前人人平等原则,婚姻法中的实行计划生育原则等。","k":"","kb":9,"kh":[[0,14],[15,66]]},{"id":"2013-4","y":2013,"t":"单","s":"我国《刑法》规定:“勾结外国,危害中华人民共和国的主权、领土完整和安全的,处无期徒刑或者十年以上有期徒刑。”该规则所包含的逻辑结构要素是（ ）。","o":["假定和行为模式","行为模式和法律后果","假定和法律后果","假定、行为模式和法律后果"],"a":"B","e":"\u0001法律规则的逻辑结构一般包括假定、行为模式和法律后果三个要素。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 符合题意及现行制度规定（\u0001行为模式和法律后果\u0002）\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 法律规则的逻辑结构一般包括假定、行为模式和法律后果三个要素\n但在具体的规范中,有时只包含行为模式和法律后果.而对假定常常省略^ 假定又称条件,是规则中关于适用该规则的条件的规定,即法律在什么时间、什么空间对什么人适用以及在什么情况下对人的行为有约束力的问题。 行为模式是指法律关于允许做什么、禁止做什么和必须做什么的规定。 法律后果是指法律规则中对遵守规则或违反规则的行为予以肯定或否定评价的规定。 \" 勾结外国,危害中华人民共和国的主权、题干中 \" 是行为模式,具体说来是禁止性法领土完整和安全律规则、不得为模式。 \"处无期徒刑或者十年以上有 '是法律后果,判处有期徒刑显然属于否定性期徒刑 2013年全国法律硕士(非法学)联考真题答案详解专业综合课法律后果。 题干中的假定要素被省略,但并不影响逻辑结构。","k":"","kb":9,"kh":[[15,66],[86,121]]},{"id":"2013-14","y":2013,"t":"单","s":"在我国,下列规范性法律文件系统化的活动中,不具有立法性质的是（ ）。","o":["法律编纂","法律清理","法律汇编","法典编纂"],"a":"C","e":"\u0001当代规范性法律文件系统化的方法主要有三种,即法律汇编、法律编纂(又称法典编纂)和法律清理。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✓ 法律汇编,顾名思义,就是将现有的法律条文进行汇合整编,不涉及法律的改动,也没有法律效力\nD✗ 当代规范性法律文件系统化的方法主要有三种,即法律汇编、法律编纂(又称法典编纂)和法律清理\n法律编纂和法律清理是有权的国家机关依照法律权限从事立法性质的工作。","k":"","kb":11,"kh":[[242,261],[261,274]]},{"id":"2013-47","y":2013,"t":"多","s":"下列选项中属于我国社会法部门的有（ ）。","o":["彩票法","知识产权法","劳动合同法","法院组织法"],"a":"AC","e":"\u0001社会法是一个新兴的法律部门,一般认为,社会法是指调整国家在解决社会问题和促进社会公共事业发展的过程中所产生的各种社会关系的法律规范的总称。\u0002\nA✓ 该法律部门的法律规范通常既不属于公法,也不属于私法,而是介千两者之间\nB✗ 与题干设问或现行制度要件不符，故不选\nC✓ 符合题意及现行制度规定（\u0001劳动合同法\u0002）\nD✗ 与题干设问或现行制度要件不符，故不选\nAC就具有这样介于公法和私法之间的社会性,其中知识产权法属于民法部门,而法院组织法属于宪法部门。 (对于每个类型的法律部门,建议考生各自准备几个典型例子,方便快速解题。","k":"","kb":11,"kh":[[0,82],[83,124]]},{"id":"2013-48","y":2013,"t":"多","s":"关于法律原则与法律规则之间的区别,下列表述正确的有（ ）。","o":["法律原则的适用范围比法律规则更广","法律规则一般比较具体,法律原则比较抽象","法律规则相互间冲突时,法律原则可以成为解释法律规则的依据","法律规则是司法裁判的依据,法律原则不能直接在司法过程中适用"],"a":"ABC","e":"\u0001法律规则,是采取一定的结构形式具体规定人们的法律权利、法律义务以及相应的法律后果的行为规范。\u0002\nA✓ 在适用范围上,法律规则的适用范围要小于法律原则\nB✓ 在内容上,法律规则更加具体和明确,法律原则更加抽象\nC✓ 符合题意及现行制度规定（\u0001法律规则相互间冲突时,法律原则可以成\u0002）\nD✗ 法律原则在某些情况下也可以直接适用于司法过程中,故\n法律原则,是指可以作为法律规则的基础或本源的综合性、稳定性原理和原则。 \u0001“法律原则的适用范围比法律规则更广”\u0002,在适用范围上,法律规则的适用范围要小于法律原则。 在两者关系上,法律原则为法律规则提供了基础性、本源性内容。","k":"","kb":9,"kh":[[0,14],[15,66]]},{"id":"2014-2","y":2014,"t":"单","s":"下列选项中,属于我国非规范性法律文件的是（ ）。","o":["全国人民代表大会制定的法律","国务院制定的行政法规","自治州的自治条例和单行条例","省高级人民法院做出的终审判决"],"a":"D","e":"\u0001规范性法律文件与非规范性法律文件的主要区别:前者的对象是一般的人或事,后者的对象是特定的人或事。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ ABC项都是规范性法律文件,所以\n前者可以反复适用,后者仅适用一次。 \u0001“省高级人民法院做出的终审判决”\u0002判决书是一次性的,针对特定的人或事,为非规范性法律文件。 (对于此类题,建议考生记住每种类型的几个典型例子,有助于快速正确解题。","k":"","kb":9,"kh":[[15,66]]},{"id":"2014-5","y":2014,"t":"单","s":"《中华人民共和国合同法》第44条第1款规定:“依法成立的合同,自成立时生效。”下列关于本条文的表述,正确的是（ ）。","o":["该规定属于法律原则","该规定具有指引作用","该规定属于禁止性规则","该规定意味着我国合同法没有溯及力"],"a":"B","e":"\u0001在法的要素中,法律原则与法律规则有明确的区分,前者是法的基准性的一般规定,后者则有明确清晰的权利义务模式和法律后果。\u0002\nA✗ 合同法的这一条款显然不属于法律原则\nB✓ 本条款是法律规范, 具有法的指引作用\nC✗ 这一条款也显然不是禁止性规则\nD✗ 这一条款只强调每个合同自身的效力始于成立之时,并没有对合同法 2014年全国法律硕士(非法学)联考真题答案详解专业综合课的溯及力进行判断","k":"","kb":9,"kh":[[0,14],[15,66]]},{"id":"2014-7","y":2014,"t":"单","s":"划分法律部门的主要标准是（ ）。","o":["立法体系的结构","立法者的主观意志","立法机关的设置","法律的调整对象与调整方法"],"a":"D","e":"\u0001划分法律部门的标准是法律的调整对象和调整方法。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ 划分法律部门的标准是法律的调整对象和调整方法\n(注意:法律调整的对象是划分法律部门的首要标准。","k":"","kb":11,"kh":[[0,82],[83,124]]},{"id":"2014-8","y":2014,"t":"单","s":"法官邓某在审理一起民事案件过程中,根据自己的专业知识和经验对相关法律条文进行了解释,并据此做出判决。邓某对法律的解释属于（ ）。","o":["立法解释","非正式解释","司法解释","行政解释"],"a":"B","e":"\u0001正式解释是指由特定的国家机关、官员或其他有解释权的人对法律做出的具有法律约束力的解释。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 法律解释分为正式解释和非正式解释\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选\n非正式解释,通常也叫学理解释,一般指由学者或其他个人及组织对法律规定所作的不具有法律约束力的解释。 两者的主要区别为是否具有法律上的约束力。 在我国正式解释包括:立法解释、司法解释和行政解释。 法官自己做出的解释并无法律上的约束力,属于非正式解释。","k":"","kb":16,"kh":[[20,71],[71,117]]},{"id":"2014-13","y":2014,"t":"单","s":"下列关于法律规则和法律条文关系的表述, 正确的是（ ）。","o":["一个法律条文就是一个法律规则","一个法律规则只能由一个法律条文表达","一个法律规则可以通过不同规范性文件的不同条文表达","法律规则的某些要素必须在法律条文的表达中予以省略"],"a":"C","e":"\u0001并不是所有的法律条文都是直接规定法律规则的,也不是每一个条文都完整地表述一个规则或只表述一个规则的。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✓ 有时候一个法律规则可以包括在几个法律条文中,有时候一个法律条文也可能包含几个法律规则\nD✗ 法律规则是法律条文的内容,法律条文是法律规则的表现形式\n(法律规则和法律条文的比较在历年真题中已出现多次,十分重要,请考生熟知熟记。","k":"","kb":9,"kh":[[0,14],[66,85]]},{"id":"2014-15","y":2014,"t":"单","s":"1997年3月14日公布,同年10月1日施行的《中华人民共和国刑法》第232条规定:“故意杀人的,处死刑、无期徒刑或者十年以上有期徒刑·..”据此,下列说法中错误的是（ ）。","o":["该法律条文中的行为模式为“勿为”","该法律条文所载内容属于确定性规则","1997年3月14日以后发生的故意杀人案,应当依此条文裁判","该法律条文中刑罚的排序意在对故意杀人行为依法优先适用较重刑罚"],"a":"C","e":"\u0001“该法律条文所载内容属于确定性规则”,本条文内容明确, 因此,行为模式是因此是确定性规则,无须引用其他条文和机构。\u0002\nA✗ 意杀人的,不是假定条件,而是行为模式,(不得)故意杀人,(否则将)处死刑...... \"勿为\"\nB✗ 本条文内容明确, 因此,行为模式是因此是确定性规则,无须引用其他条文和机构\nC✓ 现行\u0001《刑法》\u0002自1997年10月1日开始施行,因此1997年 10月1日以后发生的故意杀人案应当依此条文裁判\nD✗ 意杀人的先是死刑,然后才是无期徒刑等,说明对故意杀人的行为的否定\n\u0001“该法律条文中的行为模式为勿为”\u0002,故意杀人的,不是假定条件,而是行为模式,(不得)故意杀人,(否则将)处死刑...... \"勿为\"。","k":"","kb":9,"kh":[[15,66],[121,168]]},{"id":"2014-49","y":2014,"t":"多","s":"关于法律部门与法律体系的关系,下列表述正确的有（ ）。","o":["法律体系是法律部门的基础","法律体系包括多个法律部门","法律部门是法律体系的构成要素","不同法律部门的有机结合构成一国的法律体系"],"a":"BCD","e":"\u0001法律体系,是指一国的部门法体系,包括多个法律部门。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 法律体系,是指一国的部门法体系,包括多个法律部门\nC✓ 符合题意及现行制度规定（\u0001法律部门是法律体系的构成要素\u0002）\nD✓ 法律部门是法律体系的构成要素,是法律体系的基础,不同法律部门的有机结合构成一国的法律体系\n法律体系是将一国现行的全部法律规范根据一定的标准和原则分成不同的法律部门, 并由这些法律部门所构成的具有内在联系的统一整体。","k":"","kb":11,"kh":[[0,82],[83,124]]},{"id":"2015-8","y":2015,"t":"单","s":"下列关于法律部门的表述,正确的是（ ）。","o":["行政法部门是由国务院制定的行政法规构成的","划分法律部门的主要标准是法律所调整的社会关系","部门法的名称总是与某一规范性法律文件的名称相对应","法律部门的划分以客观因素为基础,不受主观因素的影响"],"a":"B","e":"\u0001行政法部门是有关国家行政管理活动的法律规范的总称,国务院制定的行政法规有一部分属于行政法部门,但也有一部分属于其他法律部门, 行政法与行政法规是两个不同的概念。\u0002\nA✗ 行政法部门是有关国家行政管理活动的法律规范的总称,国务院制定的行政法规有一部分属于行政法部门,但也有一部分属于其他法律部门, 行政法与行政法规是两个不同的概念\nB✓ 划分法律部门的主要标准是法律所调整的社会关系\nC✗ 法律部门与规范性法律文件是不同的概念,在许多情况下,部门法的名称与规范性法律文件的名称并不对应\nD✗ 法律部门的划分,虽然有着客观的基础,但是最终还是人们主观活动的产物","k":"","kb":11,"kh":[[0,82],[83,124]]},{"id":"2015-13","y":2015,"t":"单","s":"《刑法》第93条第2款规定:“国有公司、企业、事业单位、人民团体中从事公务的人员和国家机关、国有公司、企业、事业单位委派到非国有公司、企业、事业单位、社会团体从事公务的人员,以及其他依照法律从事公务的人员,以国家工作人员论。”下列关于该法律条文的认识,正确的是（ ）。","o":["该条文规定的是技术性内容,没有强制力","该条文表述的既非法律原则,也非法律规则","该条文不能够与其他条文共同表达某个法律规则","该条文包括了假定条件、行为模式和法律后果三个要素"],"a":"B","e":"\u0001法的强制力是法的重要特征,该刑法条文具有强制力。\u0002\nA✗ 法的强制力是法的重要特征,该刑法条文具有强制力\nB✓ 该条文表述的是法律概念\nC✗ 一个法律规则可能包括在几个法律条文中,即该条文能够与其他条文共同表达某个法律规则\nD✗ 该条文不是法律规则","k":"","kb":9,"kh":[[15,66],[66,85]]},{"id":"2015-50","y":2015,"t":"多","s":"《水污染防治法》第29条第1款规定:“禁止向水体排放油类、酸液、碱液或者剧毒废液。”该条文表达的法律规则属于（ ）。","o":["义务性规则","构成性规则","确定性规则","强行性规则"],"a":"ACD","e":"\u0001义务性规则是指在内容上规定人们的法律义务,即有关人们应当做或不做某种行为的规则。\u0002\nA✓ 义务性规则是指在内容上规定人们的法律义务,即有关人们应当做或不做某种行为的规则\nB✗ 构成性规则是组织人们按照规则规定的行为去活动的规则,规则所指定的行为在逻辑上依赖于规则本身\nC✓ 确定性规则是指内容已明确肯定,无须再援引或参照其他规则来确定其内容的法律规则\nD✓ 强行性规则是指内容规定具有强制性,不论人们的意愿如何,都必须加以适用的规则\n法律条文中规定的绝大多数法律规则都属于此种规则。 一般来说,公法类法律, 特别是行政法、刑法等,主要涉及公共利益,强行性规则较多。 比如设定某一机构的规则就属于构成性规则。","k":"","kb":9,"kh":[[86,121],[121,168]]},{"id":"2016-4","y":2016,"t":"单","s":"2014年5月实施的《社会救助暂行办法》第17 条规定:“乡镇人民政府、街道办事处应当及时了解掌握居民的生活情况,发现符合特困供养条件的人员, 应当主动为其依法办理供养。”该法条所包含的法律规则的逻辑结构是（ ）。","o":["假定条件和法律后果","假定条件和行为模式","行为模式和法律后果","假定条件、行为模式和法律后果"],"a":"B","e":"\u0001传统观念认为,法律规则主要由假定 (条件)、行为模式、法律后果三个要素组成。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 本题中,没有关于法律后果的规定,而只规定了 \" 这一主体的行为条件, \" 乡镇人民政府街道办事处 \" 应当为 \"的模式\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 传统观念认为,法律规则主要由假定 (条件)、行为模式、法律后果三个要素组成\n假定又称条件,是规则中关于适用该规则的条件的规定,即法律规则在什么时间、空间对什么人适用以及在什么情节下对人的行为有约束力的问题。 行为模式是指法律规则中关于行为的规定,即法律关于允许做什么禁止做什么和必须做什么的规定e 法律后果是指法律规则中对遵守规则或违反规则的行为予以肯定或否定评价的规定。 ACD选项以及它错误。","k":"","kb":9,"kh":[[15,66],[86,121]]},{"id":"2016-7","y":2016,"t":"单","s":"下列关于法律部门的表述,正确的是（ ）。","o":["法律部门划定后应保持相对稳定","法律部门是构成法系的基本单位","法律部门的划分与人的主观意志无关","法律部门划分的首要标准是法律调整的方法"],"a":"A","e":"\u0001法律部门,是指一个国家根据一定原则和标准划分的本国同类法律规范的总称。\u0002\nA✓ 相对稳定原则是指法律部门划分后应保持一定的稳定性,避免法律体系结构的频繁变动\nB✗ 法系是按照世界上各个国家和地区法律的源流关系和历史传统以及形式上某些特点对法律所做的分类,对资本主义法律影响最大的法系是大陆法系和普通法法系\nC✗ 法律部门的划分与人的主观意志有关\nD✗ 划分法律部门的两个主要标准是法律调整的对象(即社会关系)和法律调整的方法,其中,法律调整的对象,是划分法律部门的首要标准和第一位标准,法律调整的方法是划分法律部门的辅助标准\n法律部门的划分原则有客观原则、合目的性原则、适当平衡原则、辩证发展原则、相对稳定原则和主次原则等。 法律部门是主客观相结合的产物,法律部门的划分,虽然有着客观的基础,但最终还是人们主观活动的产物。 法律体系, 是一国的部门法体系,法律部门是构成法律体系的基本单位,但不是构成法系的基本单位。 法系与法律体系是两个不同的概念。","k":"","kb":11,"kh":[[0,82],[83,124]]},{"id":"2017-15","y":2017,"t":"单","s":"我国《刑法》第21条第1款规定:“为了使国家、公共利益、本人或者他人的人身、财产和其他权利免受正在发生的危险,不得已采取的紧急避险行为, 造成损害的,不负刑事责任。”关于该法条中包含的法律规则的逻辑结构,下列表述正确的是（ ）。","o":["假定条件和法律后果","假定条件、行为模式和法律后果","法律后果和行为模式","假定条件和行为模式"],"a":"B","e":"\u0001传统观念认为,法律规则主要由假定(条件)、行为模式法律后果三个要素组成。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 传统观念认为,法律规则主要由假定(条件)、行为模式法律后果三个要素组成\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选\n法律规则具有内在的严密的逻辑结构。 假定又称条件,是规则中关于适用该规则的条件的规定,即法律规则在什么时间、空间对什么人适用以及在什么情境下对人的行为有约束力的问题。 行为模式是指法律规则中关于行为的规定,即法律允许做什么、禁止做什么和必须做什么的规定,它是从人们大量的实际行为中概括出来的法律行为要求。 法律后果是指法律规则中对遵守规则或者违反规则的行为予以肯定或否定评价的 \"为了使国家、公共利益、本人或者他人规定。 本题中 \" 是假的人身、财产和其他权利免受正在发生的危险定条件,解决的是在什么情境下该条法律对人的行为 \" 不得已采取造成损害的紧急避险有约束力的问题, \" 是 \" 不负法律责任 \"是行为模式,是可为模式, 行为法律后果,","k":"","kb":9,"kh":[[15,66],[86,121]]},{"id":"2018-11","y":2018,"t":"单","s":"关于《中华人民共和国警察法》的法律性质和地位,下列说法正确的是（ ）。","o":["属于程序法","属于我国法律体系中的行政法","是《监狱法》的上位法","相较《公务员法》属于一般法"],"a":"B","e":"\u0001《中华人民共和国人民警察法》是行政法,是实体法,而非程序法。\u0002\nA✗ \u0001《中华人民共和国人民警察法》\u0002是行政法,是实体法,而非程序法\nB✓ 符合题意及现行制度规定（\u0001属于我国法律体系中的行政法\u0002）\nC✗ \u0001《人民警察法》\u0002与\u0001《监狱法》\u0002同属法律,没有位阶高低之分\nD✗ \u0001《中华人民共和国人民警察法》\u0002相较于\u0001《公务员法》\u0002应属特殊法","k":"","kb":11,"kh":[[0,82],[159,241]]},{"id":"2018-41","y":2018,"t":"多","s":"下列关于法律规则和法律条文关系的表述, 正确的有（ ）。","o":["法律规则是法律条文的内容","法律条文是法律规则的形式","一个法律条文可能包括若干法律规则","一个法律规则可以体现在若干法律条文中"],"a":"ABCD","e":"\u0001法律规则是法律条文的内容,法律条文是法律规则的形式,一个法律条文可能包括若干法律规则,一个法律规则可以体现在若干法律条文中,ABCD四个选项都正确。\u0002\nA✓ 考查了法律规则与法律条文的关系\nB✓ 符合题意及现行制度规定（\u0001法律条文是法律规则的形式\u0002）\nC✓ 符合题意及现行制度规定（\u0001一个法律条文可能包括若干法律规则\u0002）\nD✓ 法律规则是法律条文的内容,法律条文是法律规则的形式,一个法律条文可能包括若干法律规则,一个法律规则可以体现在若干法律条文中,ABCD四个选项","k":"","kb":9,"kh":[[0,14],[66,85]]},{"id":"2019-2","y":2019,"t":"单","s":"法律部门的划分需要在遵循客观标准的同时坚持正确的原则。下列对于法律部门划分原则的理解,不正确的是（ ）。","o":["客观性原则要求划分法律部门应以法律规范的内在结构和效力位阶为基础","适当平衡原则主要是指各法律部门包含的法律、法规在数量上大致平衡","当同一部法律可以被划归于几个不同的法律部门时,应采用主次原则对其进行划分和归类","相对稳定原则要求法律部门划分应当有一定的前瞻性,不能频繁变动法律部门的内容和结构"],"a":"A","e":"\u0001客观原则又称从实际出发原则。\u0002\nA✓ 在划分法律部门时,要坚持客观原则,坚持从社会关系和法律规范的实际情况出发的原则\nB✗ 适当平衡原则划分出来的法律部门不宜过宽也不宜过细,应保持它们之间适当的平衡\nC✗ 主次原则要求当同一部法律可以被划分为几个不同的法律部门时,应该按照法律的主导因素确定其划分的法律部门\nD✗ 相对稳定原则要求法律部门划分应当有一定的前瞻性,不能频繁变动法律部门的内容、结构\n划分法律部门不是主观任意进行的,它有相对稳定的客观依据,这就是社会关系。 一般来讲,社会关系范围较广并且相应法律法规也较多的,可以成为一个甚至几个独立的法律部门。 对于法律规范很少的社会关系领域,可以予以合并。 相关表述表述不正确,","k":"","kb":11,"kh":[[0,82],[83,124]]},{"id":"2019-5","y":2019,"t":"单","s":"我国《消费者权益保护法》第四十九条:“经营者提供商品或者服务,造成消费者或者其他受害人人身伤害的,应当赔偿医疗费、护理费、交通费等为治疗和康复支出的合理费用,以及因误工减少的收入............”该规则不属于（ ）。","o":["义务性规则","确定性规则","构成性规则","强行性规则"],"a":"C","e":"\u0001构成性规则是组织人们按照规则规定的行为去活动的规则,规则所指定的行为在逻辑上依赖于规则本身。\u0002\nA✗ 义务性规则是直接要求人们作为或不作为的规则\nB✗ 确定性规则是指内容已经明确规定人们具体的行为模式, 无须再援引或者参照其他规则来确定其内容的法律规则\nC✓ 构成性规则是组织人们按照规则规定的行为去活动的规则,规则所指定的行为在逻辑上依赖于规则本身\nD✗ 按照法律规则是否允许主体按照自己的意愿自行设定权利和义务,或者按照权利义务的刚性程序,可以把法律规则分为强行性规则和任意性规则\n比如,设定某一机构的规则就属于构成性规则。 本题中的规则不是组织人们按照规则规定的行为活动的规则,而是行为发生之后,应当如何赔偿的问题。 构成性规则是规则先于行为,本题是行为先于规则,所以本题不是构成性规则,选C。 强行性规则是指为社会关系参加者规定了明确的行为模式而不得自行变更其内容的规则。 本题的题干 \" \"不属于信息属于ABD选项的规则,但本题是选择的选项,为此AB","k":"","kb":9,"kh":[[86,121],[121,168]]},{"id":"2019-7","y":2019,"t":"单","s":"法律全球化是指法律的各种要素如法律原则、法律理念、法律价值、法律制度等在全球范围内的趋同以及在全球范围内形成一个法治的标准。对此,下列说法正确的是（ ）。","o":["法律全球化要求实现所有国家法律的一体化","法律全球化的目标是形成超主权的法律体系","人类文明的多样性最终会导致法律全球化的衰亡","各国法律的交流借鉴是实现法律全球化的有效途径"],"a":"D","e":"\u0001法律全球化的主要途径是国际法的国内化、地方化和地方法或国内法的全球化。\u0002\nA✗ 法律全球化并不是所有国家法律的全球一体化\nB✗ 法律全球化也并不意味着国家主权概念的过时或者消失,法律全球化的目标不是形成超主权的法律体系\nC✗ 各国之间的法律仍然呈现多样性和多元化\nD✓ 各国法律的交流借鉴是法律全球化的有效途径\n法律全球化是法律跨越国家的疆界,在世界范围内传播、流动。","k":"","kb":10,"kh":[[0,42],[42,145]]},{"id":"2019-41","y":2019,"t":"多","s":"下列关于中国特色社会主义法律体系特征的表述,正确的有（ ）。","o":["体现中国特色社会主义的本质要求","体现改革开放和现代化建设的时代要求","体现结构内在统一而又多层次的国情要求","体现继承中国法律文化优秀传统和借鉴人类法制文明成果的文化要求"],"a":"ABCD","e":"\u0001当代中国法律体系的特色体现中国特色社会主义的本质要求。\u0002\nA✓ 当代中国法律体系的特色体现中国特色社会主义的本质要求\nB✓ 体现改革开放和现代化建设的时代要求\nC✓ 体现结构内在统一而又多层次的国情要求\nD✓ 体现继承中国法律文化优秀传统和借鉴人类法制文明成果的文化要求\n体现动态、开放、与时俱进的社会发展要求。 因此,本题ABC","k":"","kb":11,"kh":[[0,82],[159,241]]},{"id":"2020-9","y":2020,"t":"单","s":"在划分法律部门时不能频繁地变动法律部门的内容和结构,也不能只考虑法律规范的现状,需要具有一定的前瞻性。该观点体现的法律部门划分原则是（ ）。","o":["主次标准原则","相对稳定原则","合目的性原则","适当平衡原则"],"a":"B","e":"\u0001依据题干考查要点，正确表述为“相对稳定原则”。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 相对稳定原则,要求我们在划分法律部门时不能只考虑目前的法律、法规的多少,而应当具有一定的前瞻性,在划分部门法时应当考虑到法律、法规今后的发展,即考虑到即将制定和可能制定的法律、法规\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选","k":"","kb":11,"kh":[[0,82],[83,124]]},{"id":"2020-11","y":2020,"t":"单","s":"某法官在一份赡养纠纷案的判决书中,不仅援引了相关法律条文,还引用了中国古代《孝经》中的孝道原则进行说理。对此,下列说法不正确的是 （ ）。","o":["法官援引的相关法律条文是裁判的大前提","法官在适用相关法律条文时需对其进行解释","《孝经》中的孝道原则对该案具有法律约束力","法官运用孝道原则说理,是在进行法律论证"],"a":"C","e":"\u0001中国古代《孝经》中的孝道原则,只是一种道德上的倡议,不是法律原则,不具有法律效力, 不具有约束力。\u0002\nA✗ 根据演绎推理,法律条文是大前提\nB✗ 法官在适用相关法律条文时,要把一般的法律规定适用于具体的事件、行为当中,就必须对法律条文作出必要的解释\nC✓ 国古代\u0001《孝经》\u0002中的孝道原则,只是一种道德上的倡议,不是法律原则,不具有法律效力, 不具有约束力\nD✗ 法官运用孝道原则说理,就是强调在法律正当性论证(证成)中的意义\n法律论证理论是对传统法律教义学和解释理论的超 \" 因素在 \" 法外越,即意识到法律三段论的局限,强调法律正当性论证(证成)中的意义,实际上与论理解释中的目的解释和社会学解释以及实质推理异曲同工, 属于演绎论证和归纳论证之外的似真论证,即合情理 \"因素 \"法外论证。","k":"","kb":10,"kh":[[0,42],[42,145]]},{"id":"2020-41","y":2020,"t":"多","s":"我国《婚姻法》第二十四条第一款:“夫妻有相互继承遗产的权利。\"该条内容属于（ ）。","o":["授权性规则","委任性规则","确定性规则","强行性规则"],"a":"AC","e":"\u0001授权性规则是指规定人们有权做一定行为或不做一定行为的规则，即规定“可为模式”的规则。\u0002\nA✓ 夫妻有相互继承遗产的权利,就是一种权利\nB✗ 委任性规则是指内容尚未确定,而只规定某种概括性指示,由相应国家机关通过相应途径或程序加以确定的法律规则\nC✓ 夫妻有相互继承遗产的权利,内容已明确肯定,无须再援引或参照其他规则来确定其内容\nD✗ 该条内容不具有强制性,不是强行性规则\n授权性规则的作用在于赋予人们以一定的权利去设立、变更、终止他们的法律地位或法律关系,其特点是为权利主体提供一定的选择自由,对于权利主体来说不具有强制性。 确定性规则是指内容已明确肯定,无须再援引或参照其他规则来确定其内容的法律规则。 法律条文中绝大多数法律规则都属于此种规则。 强行性规则是指内容规定具有强制性,不论人们的意愿如何,都必须加以适用的规则。\n【法典编纂】2021年《民法典》施行后原《婚姻法》同时废止，对应条款现为《民法典》第1061条（夫妻有相互继承遗产的权利）。","k":"","kb":9,"kh":[[86,121],[121,168]]},{"id":"2021-3","y":2021,"t":"单","s":"某省会城市的人大常委会根据相关法律制定了《城市桥梁隧道安全管理条例》。从我国法律渊源角度看,该规范性法律文件属于（ ）。","o":["地方性法规","地方政府规章","行政法规","部门规章"],"a":"A","e":"\u0001地方性法规指省、自治区、直辖市和设区的市的人民代表大会及其常委会根据本地区具体情况和实际需要,在法定权限内制定发布的适用于本地区的规范性文件。\u0002\nA✓ 本题中,制定主体是省会城市的人大常委会,其制定的规范性文件是地方性法规\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选","k":"","kb":3,"kh":[[11,103]]},{"id":"2023-12","y":2023,"t":"单","s":"《反食品浪费法》规定,餐饮外卖平台应当以显著方式提示消费者适量点餐。该规定表述的规则属于（ ）。","o":["构成性规则","任意性规则","义务性规则","准用性规则"],"a":"C","e":"\u0001规定平台“应当以显著方式提示”设定义务性行为模式，属于义务性规则。\u0002\nA✗ 构成性规则是指规则先于该种行为而存在（如结婚登记程序），显著提示义务并非据此才可能存在\nB✗ “应当”表明必须履行不得随意排除，属于\u0001强行性规则\u0002而非任意性规则\nC✓ 法律规则按行为模式可分为授权性（可为）与\u0001义务性规则\u0002（应为或勿为），本题“应当提示”即命令式义务规则\nD✗ 该条完整规定了自身的行为模式内容，\u0001未援引其他条款\u0002，因此属于确定性规则而非准用性规则\n见到法条中出现“应当”“必须”“禁止”“不得”时，按行为模式归为\u0001义务性规则\u0002，按强制程度归为\u0001强行性规则\u0002。","k":"","kb":9,"kh":[[86,121],[121,168]]},{"id":"2023-41","y":2023,"t":"多","s":"党的十八大以来,以宪法为核心的、与推进国家治理体系和治理能力现代化相适应的中国特色社会主义法律体系与时俱进、更加完备。在新时代,为完善中国特色社会主义法律体系,统筹谋划和整体推进立改废释纂各项工作,需要","o":["积极推进国家安全、科技创新、公共卫生等重要领域立法","加快推进入工智能、基因编辑、自动驾驶等新兴领域立法","加快涉外法治工作战略布局,加强涉外领域立法","总结编纂民法典的经验,适时推动条件成熟的立法领域法典编纂工作"],"a":"ABCD","e":"\u0001完善中国特色社会主义法律体系，须统筹推进重点领域、新兴领域、涉外领域立法及法典编纂。\u0002\nA✓ 党的二十大及习近平法治思想明确强调加强\u0001国家安全、科技创新、公共卫生\u0002等重点领域立法\nB✓ 面对新技术挑战，亟需加快推进\u0001人工智能、基因编辑、自动驾驶\u0002等新兴领域前瞻性立法\nC✓ 坚持统筹国内法治和涉外法治，必须加快涉外法治工作战略布局，\u0001加强涉外领域立法\u0002\nD✓ 充分发挥《民法典》示范经验，适时推动条件成熟的立法领域开展\u0001法典编纂工作\u0002\n四项全为中央关于加强重点领域、新兴领域、涉外领域立法及统筹“立改废释纂”的权威表述。","k":"","kb":11,"kh":[[0,82],[159,241]]},{"id":"2024-3","y":2024,"t":"单","s":"在一起婚姻家庭案件的审理中，法官主要依据《民法典》中的公序良俗原则作出裁判，下列关于这一原则的表述中，正确的是（ ）。","o":["该原则的运用可以弥补法律规则的漏洞","该原则主要包括假定和行为模式两个要素","该原则的适用采取“要么有效,要么无效”的方式","婚姻家庭案件的审理应当优先适用该原则"],"a":"A","e":"\u0001法律原则适用于规则空白或模糊之处，能够弥补法律规则的漏洞。\u0002\nA✓ 法律规则常有滞后性与不周延性，公序良俗等\u0001法律原则可作为裁判补充依据填补规则漏洞\u0002\nB✗ 包括假定条件、行为模式与法律后果三要素的是\u0001法律规则\u0002，而非法律原则\nC✗ “要么有效，要么无效（全有或全无）”是\u0001法律规则\u0002的适用特征；法律原则具有分量权衡维度\nD✗ 司法裁判必须遵循\u0001“穷尽法律规则方得适用法律原则”\u0002，不得越过具体规则优先直接适用原则\n规则与原则两大铁律：\u0001规则全有全无、优先适用\u0002；\u0001原则具分量维度、可补漏洞但不能径行取代规则\u0002。","k":"","kb":9,"kh":[[0,14],[15,66]]},{"id":"2024-9","y":2024,"t":"单","s":"我国《立法法》第十六条第一款规定:“全国人民代表大会及其常务委员会可以根据改革发展的需要,决定就特定事项授权在规定期限和范围内暂时调整或者暂时停止适用法律的部分规定。”该规定属于（ ）。","o":["授权性规则和准用性规则","委任性规则和构成性规则","确定性规则和强行性规则","任意性规则和准用性规则"],"a":"B","e":"\u0001规定可“授权在规定期限和范围内”由特定机关具体实施暂停或调整，属于委任性规则与构成性规则。\u0002\nA✗ 该条并未直接援引指向其他具体现成法律条文，不属于准用性规则（且需授权决定具体配置内容）\nB✓ \u0001委任性规则\u0002不直接规定行为模式具体内容而委任特定机关另行规定（通过授权决定明确范围）；且该特定授权调整制度\u0001先有本条授权规则而后才有授权暂停行为\u0002，属于构成性规则\nC✗ 确定性规则无须借助其他机关另行规定即可直接适用，本条明确待授权决定具体细化内容，非确定性规则\nD✗ 该条规范全国人大常委会决定授权的法定职权程序，并非当事人在民事领域可自由变通的任意性规则\n规则分类关键判别：\u0001委任性\u0002重“另行制定/授权决定”，\u0001构成性\u0002重“规则创造该制度行为本身”。","k":"","kb":9,"kh":[[86,121],[121,168]]},{"id":"2025-6","y":2025,"t":"单","s":"下列关于法律规则的表述,正确的是（ ）。","o":["“偷越国(边)境的,处五日以下拘留或者五百元以下罚款”属于任意性规则","“故意杀人的,处死刑、无期徒刑或者十年以上有期徒刑......”属于调整性规则","“继承开始后......有遗嘱的,按照遗嘱继承或者遗赠办理......”属于授权性规则","“医师资格考试的类别和具体办法,由国务院卫生健康主管部门制定”属于确定性规则"],"a":"B","e":"\u0001\"偷越国(边)境的,处五日以下拘留或者五百元以下罚款\"是必须适用的规则, 属于强行性规则。\u0002\nA✗ \"偷越国(边)境的,处五日以下拘留或者五百元以下罚款\"是必须适用的规则, 属于强行性规则\nB✓ 调整性规则调整的行为先于规则本身产生,\"故意杀人的,处死刑、无期徒刑或者十年以上有期徒刑...... \"属于调整性规则\nC✗ \"继承开始后......有遗嘱的,按照遗嘱继承或者遗赠办理...... \"属于义务性规则\nD✗ \"医师资格考试的类别和具体办法,由国务院卫生健康主管部门制定\"属于委任性规则\n调整性规则是对已有行为方式进行调整的规则,它的功能在于控制行为。","k":"","kb":9,"kh":[[86,121],[121,168]]},{"id":"2026-3","y":2026,"t":"单","s":"2025 年4 月30 日,全国人大常委会通过《民营经济促进法》,该法规定民营经济组织及其经营者应当拥护中国共产党的领导,坚持中国特色社会主义制度,积极投身社会主义现代化强国建设。关于该规定中“民营经济组织”这一法律概念, 正确的是（ ）。","o":["既是事实概念,又是涉事概念","既是涉人概念,又是主体概念","既是实体概念,又是一般法律概念","既是关系概念,又是部门法律概念"],"a":"B","e":"\u0001\"民营经济组织\"指向法律主体、自然人/组织,属于涉人概念、主体概念。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ \"民营经济组织\"指向法律主体、自然人/组织,属于涉人概念、主体概念\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选\n事实概念描述客观事实,实体概念指权利客体,均不匹配。","k":"","kb":10,"kh":[[0,42],[191,212]]},{"id":"2026-4","y":2026,"t":"单","s":"下列关于法律原则的表述,正确的是（ ）。","o":["最有利于未成年人原则属于基本原则","政策性原则不能成为疑难案件的裁判依据","只有具体原则对理解法律规则具有指导意义","法律面前人人平等原则既是实体性原则,也是程序性原则"],"a":"D","e":"\u0001“最有利于未成年人原则属于基本原则”：最有利于未成年人是部门法具体原则。\u0002\nA✗ 最有利于未成年人是部门法具体原则\nB✗ 政策性原则可作为裁判依据\nC✗ 所有法律原则均能指导规则\nD✓ 法律面前人人平等,既约束实体权利分配,也约束诉讼程序,兼具实体+ 程序属性","k":"","kb":10,"kh":[[0,42],[146,176]]},{"id":"2026-6","y":2026,"t":"单","s":"我国《民法典》第十条规定,处理民事纠纷,应当依照法律;法律没有规定的, 可以适用习惯,但是不得违背公序良俗。对此,下列理解正确的是（ ）。","o":["法律和习惯都是我国民事审判活动中的正式渊源","公序良俗原则是法律适用的最终衡量标准","民事审判中,法官有权适用习惯弥补法律规则的漏洞","该规定中的“法律”指全国人大及常委会制定的规范性法律文件"],"a":"C","e":"\u0001《民法典》10 条明确无法律时可适用习惯填补漏洞。\u0002\nA✗ 习惯是非正式渊源\nB✗ 公序良俗是习惯适用限制,非最终标准\nC✓ \u0001《民法典》\u000210 条明确无法律时可适用习惯填补漏洞\nD✗ 与题干设问或现行制度要件不符，故不选\nD\"法律\"含法律、行政法规、地方性法规等广义法律。","k":"","kb":9,"kh":[[0,14],[66,85]]},{"id":"2026-10","y":2026,"t":"单","s":"我国《人民法院组织法》第三十四条规定:“人民陪审员依照法律规定参加合议庭审理案件。”对此,下列表述正确的是（ ）。","o":["《人民法院组织法》属于基本法律","《人民法院组织法》属于程序法部门","该规定属于授权性规则和准用性规则","人民陪审员依法参加庭审,体现了社会舆论的监督"],"a":"A","e":"\u0001《人民法院组织法》由全国人大制定,属于基本法律。\u0002\nA✓ \u0001《人民法院组织法》\u0002由全国人大制定,属于基本法律\nB✗ 属于宪法相关法\nC✗ 无准用性规则\nD✗ 陪审员是人民司法监督,不是舆论监督\n\u0001“人民法院组织法属于程序法部门”\u0002：属于宪法相关法; “该规定属于授权性规则和准用性规则”：无准用性规则;","k":"","kb":9,"kh":[[86,121],[121,168]]},{"id":"2026-41","y":2026,"t":"多","s":"社会法是现代法律体系的重要组成部分。下列关于社会法的表述,正确的有（ ）。","o":["社会法的出现促成了社会法学派的兴起","社会法的出现颠覆了公法和私法的传统划分","《社会保障法》《无障碍环境建设法》属于社会法","社会法是在国家调整社会生活过程中发展起来的新兴法律部门"],"a":"CD","e":"\u0001社会保障、无障碍法属于典型社会法。\u0002\nA✗ 社会法学派推动社会法诞生\nB✗ 公私划分只是补充,并未颠覆\nC✓ 社会保障、无障碍法属于典型社会法\nD✓ 符合题意及现行制度规定（\u0001社会法是在国家调整社会生活过程中发展\u0002）","k":"","kb":11,"kh":[[0,82],[159,241]]}]},{"sub":"法理学","name":"法律关系","w":2.8,"w5":2.6,"wh":2.0,"bt":"","pt":"近5年2.6分/年·新就业形态劳动关系新案例","L":37,"qs":[{"id":"2005-10","y":2005,"t":"单","s":"关于法律权利的表述,正确的是（ ）。","o":["法律意义上的权利一词最早来源于教会法","法律意义上的权利与非法律意义上的权利相比,主要区别在于前者代表着某种利益","法律意义上的权利与义务相互关联,权利的实现离不开义务的履行","法律权利永远不能超出社会的经济结构,但是必须超越社会的文化发展"],"a":"C","e":"\u0001法律一旦形成,法律意义上的权利就伴随产生。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 利益不是法律权利和非法律权利的区别,二者的根本区别在于是否得到法律的承认或者确认\nC✓ 因为在价值功能上,法律权利与法律义务具有互补关系\nD✗ 法律权利具有社会性,其最终是由一定社会的物质生活条件决定的, 受制于一定社会的经济结构和文化发展","k":"","kb":12,"kh":[[17,107]]},{"id":"2005-48","y":2005,"t":"多","s":"某甲用分期付款的方式购买一套价值 34 万元人民币的商品房,银行每月从某甲的工资存折上扣划 1300 元, 用于偿还银行的贷款,某甲和银行之间的这种法律关系属于（ ）。","o":["基本法律关系","隶属型法律关系","相对法律关系","普通法律关系"],"a":"CD","e":"\u0001该法律关系是依据合同法而产生的,属于普通法律关系,而非基本法律关系。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 由于双方当事人地位平等,因此属于平权型法律关系,而非隶属型法律关系\nC✓ 由于该法律关系中的权利主体和义务主体都是特定的,因此属于相对法律关系,而非绝对法律关系\nD✓ 符合题意及现行制度规定（\u0001普通法律关系\u0002）\n某甲和银行之间的法律关系是借款合同关系。","k":"","kb":12,"kh":[[144,167],[167,195]]},{"id":"2006-6","y":2006,"t":"单","s":"下列关于法律关系的表述,正确的是（ ）。","o":["法律关系是产生法律规范的前提","法律关系是一切以权利和义务为内容的社会关系","法律关系只能是人与人之间合法的社会关系","法律关系就是法律规范调整或保护的社会关系本身"],"a":"C","e":"\u0001法律关系的定义、内容和特征。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 法律关系的性质主要有:意志性、客观性、合法性和权利义务性\nC✓ 符合题意及现行制度规定（\u0001法律关系只能是人与人之间合法的社会关\u0002）\nD✗ 法律规范调整社会关系中形成的人们之间的权利和义务关系\n社会关系属于社会关系,但是并非所有的社会关系都是法律关系; 法律关系不同于法律规范所保护或调整的社会关系。 所以选相关表述。","k":"","kb":12,"kh":[[0,16],[196,279]]},{"id":"2006-7","y":2006,"t":"单","s":"甲的父亲在一次车祸中丧生,甲依法继承了其父的遗产。引起遗产继承这一法律关系发生的法律事实是（ ）。","o":["车祸","甲的父亲死亡","甲与其父之间存在合法的父子关系","甲未声明放弃继承权"],"a":"B","e":"\u0001继承法律关系的产生是由于被继承人死亡或法律推定死亡,即被继承死亡者依条件成立,所以家的父亲死亡是引起继承关系发生的法律事实。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 继承法律关系的产生是由于被继承人死亡或法律推定死亡,即被继承死亡者依条件成立,所以家的父亲死亡是引起继承关系发生的法律事实\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选","k":"","kb":12,"kh":[[0,16],[196,279]]},{"id":"2006-10","y":2006,"t":"单","s":"事件与法律行为的划分标准是（ ）。","o":["是否以人的主观意志为转移","是否能引起法律关系的产生、变更或消灭","是否由法律规范予以调整","是否与当事人的意志有关"],"a":"D","e":"\u0001按照法律事实是否与当事人的意志有关,可以把法律事实划分为法律事件与法律行为。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ 按照法律事实是否与当事人的意志有关,可以把法律事实划分为法律事件与法律行为","k":"","kb":12,"kh":[[0,16],[196,279]]},{"id":"2007-3","y":2007,"t":"单","s":"甲购买了北京到广州的火车票,并乘坐票面指定的车次顺利到达广州,由此形成的客运合同法律关系的客体是 （ ）。","o":["甲的人身","甲为购买火车票而支付的价款","甲购买的火车票","铁路部门运送甲的行为"],"a":"D","e":"\u0001法律关系的客体法律关系的客体是指法律关系主体之间的权利、义务所指向的对象,一般包括物、行为、智力成果和人身利益。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 本题中甲和铁路部门之间形成的是客运合同法律关系,这种法律关系的客体应当是铁路部门把甲运送到指定地点的行为,甲购买火车票的价款和火车票本身并不能成为该法律关系的客体\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ 符合题意及现行制度规定（\u0001铁路部门运送甲的行为\u0002）\n人身只能作为绝对法律关系的客体,不能成为合同法律关系的客体,","k":"","kb":12,"kh":[[0,16],[167,195]]},{"id":"2007-49","y":2007,"t":"多","s":"“公民在法律面前人人平等”的原则要求（ ）。","o":["所有的公民都应无差别地享有相同的法律权利","任何合法权利受到侵犯的公民都应一律平等地受到法律的保护","所有的公民都应毫无例外地履行相同的法律义务","对任何公民的违法犯罪行为都必须依法追究其法律责任"],"a":"BD","e":"\u0001这只是认定公民在权利能力上一律平等, 并不能认为公民享有的权利和义务都相同。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 公民在法律面前一律平等原则公民在法律面前一律平等,指公民应当平等地享有宪法和法律规定的权利,平等地履行宪法和法律规定的义务,任何合法权利受到侵害的公民都一律平等地受到法律的保护,对任何公民的…\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ 符合题意及现行制度规定（\u0001对任何公民的违法犯罪行为都必须依法追\u0002）\n公民在法律面前一律平等原则公民在法律面前一律平等,指公民应当平等地享有宪法和法律规定的权利,平等地履行宪法和法律规定的义务,任何合法权利受到侵害的公民都一律平等地受到法律的保护,对任何公民的违法犯罪行为都依法追究其法律责任。","k":"","kb":12,"kh":[[43,90],[108,144]]},{"id":"2008-4","y":2008,"t":"单","s":"下列关于权利与义务的表述,正确的是（ ）。","o":["行政法律关系的主体只有权利没有义务","任何权利都不能成为法律关系的客体","民事法律关系中的权利义务可以互相替换","在特定情况下,有些权利同时也是义务"],"a":"D","e":"\u0001某些权利在特定情况下可以成为法律关系的客体,比如土地使用权可以作为抵押权法律关系的客体。\u0002\nA✗ 在行政法律关系中,行政主体和行政管理相对人可以即享有权利,也承担义务\nB✗ 某些权利在特定情况下可以成为法律关系的客体,比如土地使用权可以作为抵押权法律关系的客体\nC✗ 在民事法律关系中,一方当事人的权利对应对方当事人的义务, 一方当事人的义务对应对方当事人的权利,但这并非表明权利义务可以替换\nD✓ 在宪法中,劳动、受教育既是权利,也是义务,的\n知识产权中的财产权可以作为质权法律关系的客体,错误。","k":"","kb":12,"kh":[[0,16],[167,195]]},{"id":"2008-12","y":2008,"t":"单","s":"下列关于权利能力和行为能力的表述,正确的是（ ）。","o":["法律关系主体的权利能力和行为能力构成法律关系的内容","权利能力是指法律关系主体能通过自己的行为行使权利和履行义务的能力","行为能力是指能够参与一定的法律关系并依法享有权利和承担义务的法律资格","公民具有行为能力必须首先具有权利能力,但具有权利能力并不必然具有行为能力"],"a":"D","e":"\u0001相关表述 的说法正好相反,应该是:权利能力是指能够参与一定的法律关系并依法享有权利和承担义务的法律资格。\u0002\nA✗ 法律关系的内容是法律权利和法律义务\nB✗ 的说法正好相反,应该是:权利能力是指能够参与一定的法律关系并依法享有权利和承担义务的法律资格\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ 无行为能力人,具有权利能力,的\n行为能力是指法律关系主体能通过自己的行为行使权利和履行义务的能力,错误。","k":"","kb":12,"kh":[[0,16],[43,90]]},{"id":"2009-1","y":2009,"t":"单","s":"下列概念中,属于客体概念的是（ ）。","o":["原告","人民法院","动产","不可抗力"],"a":"C","e":"\u0001法律关系客体,是指法律关系主体之间权利和义务所指向的对象。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 原告和人民法院都是法律关系的参加者,属于主体范围\nC✓ 符合题意及现行制度规定（\u0001动产\u0002）\nD✗ 不可抗力属于免责事由,不属于客体范围\n法律关系客体是一定利益的法律形式,其范围和种类包括物、行为、精神产品和人身利益等。 动产是物的一种,属于法律关系客体。","k":"","kb":12,"kh":[[0,16],[196,279]]},{"id":"2010-5","y":2010,"t":"单","s":"按照法律关系主体是否特定化,可以将法律关 系划分为（ ）。","o":["基本法律关系与普通法律关系","绝对法律关系与相对法律关系","调整性法律关系与保护性法律关系","平权型法律关系与隶属型法律关系"],"a":"B","e":"\u0001按照法律关系所体现的社会内容的性质,可划分为基本法律关系、普通法律关系和诉讼法律关系。\u0002\nA✗ 按照法律关系所体现的社会内容的性质,可划分为基本法律关系、普通法律关系和诉讼法律关系\nB✓ 项中的绝对法律关系和相对法律关系的划分正是根据法律关系的主体是否特定化加以划分的结果\nC✗ 按照法律关系产生的依据、执行的职能和实现规范的内容不同,可划分为调整荆法律关系和保护型法律关系\nD✗ 按照法律主体在法律关系中的地位是否 2010年全国法律硕士(非法学)联考真题答案详解专业综合课平等,可以划分为平权型法律关系和隶属型法律关系\n故ACD项均不对。 \u0001“绝对法律关系与相对法律关系”\u0002的绝对法律关系和相对法律关系的划分正是根据法律关系的主体是否特定化加以划分的结果。","k":"","kb":12,"kh":[[0,16],[196,279]]},{"id":"2010-48","y":2010,"t":"多","s":"下列选项中,属于法律关系客体的有（ ）。","o":["宅基地","外科手术","文学作品","人格尊严"],"a":"ABCD","e":"\u0001法律关系的客体是法律关系主体之间权利义务所指向的对象,其种类有物、行为、智力、人身利益、数据信息。\u0002\nA✓ 符合题意及现行制度规定（\u0001宅基地\u0002）\nB✓ 符合题意及现行制度规定（\u0001外科手术\u0002）\nC✓ 符合题意及现行制度规定（\u0001文学作品\u0002）\nD✓ 符合题意及现行制度规定（\u0001人格尊严\u0002）\n\u0001“宅基地”\u0002宅基地属于物,“外科手术”外科手术属于行为,“文学作品”文学作品属于成果,“人格尊严”人格尊严已经属于人身利益,四项都应该选择。 考生要注意到随着法典的不断颁布完善,考题的答案也会有所不同,切勿生搬硬套。","k":"","kb":12,"kh":[[0,16],[196,279]]},{"id":"2011-11","y":2011,"t":"单","s":"赵某与钱某约定,赵某以1000元的价格购买钱某的耕牛。当夜,耕牛被孙某盗走,致使合同因无法履行而终止,钱某返还赵某价款。该事例中,导致合同解除的法律事实是（ ）。","o":["孙某盗窃耕牛的行为","耕牛被盗事件","合同无法履行的事实","钱某返还价款的行为"],"a":"B","e":"\u0001法律事实,即法律规范规定的、能够引起法律后果即法律关系产生、变更、消灭的各种事实的总称。\u0002\nA✗ 本题中钱某不能履行合同义务, 是由于孙某盗走了耕牛,此事实是不以钱某意志为转移的,因此是事件\nB✓ 符合题意及现行制度规定（\u0001耕牛被盗事件\u0002）\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选\n法律事实依据它是否以当事人的意志为转移分为行为和事件。 其中行为是指以当事人的意志为转移能够引起法律后果的法律事实。 事件是指不以当事人意志为转移的能够引起法律关系产生、变更和消灭的法律事实。","k":"","kb":12,"kh":[[0,16],[196,279]]},{"id":"2011-14","y":2011,"t":"单","s":"下列关于法律规范与法律关系的表述,能够成立的是（ ）。","o":["法律规范是法律关系的前提","法律规范是法律关系的结果","法律关系是法律规范的基础","法律关系是法律规范的根据"],"a":"A","e":"\u0001法律关系是根据法律规范产生的、以主体之间形成的权利和义务的关系为表现形式的特殊社会关系。\u0002\nA✓ 法律关系首先是依法建立的社会关系,法律规范是法律关系产生的前提\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 法律关系是根据法律规范产生的、以主体之间形成的权利和义务的关系为表现形式的特殊社会关系\n如果没有相应的法律规范的存在,就不可能产生法律关系。 BCD项颠倒了法律规范与法律关系之间的关系, 故错误。","k":"","kb":12,"kh":[[0,16],[196,279]]},{"id":"2012-7","y":2012,"t":"单","s":"下列有关权利能力的表述,正确的是（ ）。","o":["法律关系的主体不一定拥有权利能力","享有具体权利的人一定具有权利能力","有权利能力的人一定实际享有具体权利","权利能力只体现享有权利的资格而不包括承担义务的资格"],"a":"B","e":"\u0001权利能力也可以叫作权利义务能力,既体现享有权利的资格,也包括承担义务的资格。\u0002\nA✗ 权利能力是每个人从出生到死亡一直都具有的,法律关系主体享有权利,有权利能力\nB✓ 但享有具体权利的人一定享有权利能力\nC✗ 权利能力只是一种资格,享有权利能力的人不一定实际享有具体权利\nD✗ 权利能力也可以叫作权利义务能力,既体现享有权利的资格,也包括承担义务的资格","k":"","kb":12,"kh":[[0,16],[43,90]]},{"id":"2012-50","y":2012,"t":"多","s":"新婚夫妇张某与李某到某影楼拍摄婚纱照。由于影楼工作人员的疏忽,导致所拍婚纱照片的底片报废,这对新婚夫妇遂将影楼诉至法院。下列有关法律关系的说法中,正确的有()。‘","o":["新婚夫妇与影楼之间形成的是平权型法律关系","新婚夫妇与影楼之间形成的法律关系只体现了双方的意志","新婚夫妇与法院之间形成的诉讼法律关系为相对法律关系","如果底片没有报废,新婚夫妇与影楼之间形成的法律关系的客体是照片"],"a":"AC","e":"\u0001在这一法律关系中,主体是法律地位平等的当事人,双方不存在隶属关系,故影楼与新婚夫妇之间的法律关系属于平权型法律关系。\u0002\nA✓ 在这一法律关系中,主体是法律地位平等的当事人,双方不存在隶属关系,故影楼与新婚夫妇之间的法律关系属于平权型法律关系\nB✗ 法律关系是一种体现意志性的特殊社会关系\nC✓ 新婚夫妇与影楼之间的法律关系只对双方具有约束力,权利主体特定,义务主体也特定,这体现了合同的相对性,故两者的法律关系属于相对法律关系\nD✗ 在本题中,影楼与新婚夫妇之间的债的法律关系的客体为行为,即影楼为新婚夫妇拍摄婚纱照的行为,新婚夫妇交付价款的行为\n法律关系是根据法律规范产生的、以主体之间的权利与义务关系的形式表现出来的特殊关系,即在法律规范调整社会关系过程中所形成的人们之间的权利义务关系。 本题中新婚夫妇与影楼形成了一个债的权利义务关系,即影楼为新婚夫妇拍摄婚纱照,新婚夫妇支付价款。 法律关系根据法律规范建立,而法律规范是国家意志的体现,所以法律关系体现国家意志。 法律关系的客体是指法律关系主体之间权利与义务所指向的对象。","k":"","kb":12,"kh":[[144,167],[167,195]]},{"id":"2013-12","y":2013,"t":"单","s":"李某因车祸致双腿残疾,交警的责任认定书认定肇事司机王某负全责。李某遂向法院起诉,除要求王某赔偿30万元医疗费外,还主张对她因车祸而受侵害的“正常行走权”予以赔偿。关于本案,下列选项正确的是（ ）。","o":["李某主张的“正常行走权”属于法定权利","王某赔偿30万元是绝对义务的承担方式","李某与王某之间的侵权法律关系因王某的肇事行为而产生","交警出具的责任认定书是规范性法律文件, 具有法律效力"],"a":"C","e":"\u0001法定权利是指法律有明确规定或宣告 \" 不是法律明确规定的权利,该项 \"正常行走权的权利。\u0002\nA✗ 法定权利是指法律有明确规定或宣告 \" 不是法律明确规定的权利,该项 \"正常行走权的权利\nB✗ 以此判断,王某的义务是相对义务,而非绝对义务\nC✓ 符合题意及现行制度规定（\u0001李某与王某之间的侵权法律关系因王某的\u0002）\nD✗ 交警出具的责任书虽然具有法律效力,但这是针对个人的,并不是普遍适用的,因此它是非规范性法律文件\n以权利义务的主体是否特定为标准,可以分为绝对权利义务和相对权利义务。","k":"","kb":12,"kh":[[0,16],[167,195]]},{"id":"2013-51","y":2013,"t":"多","s":"下列关于权利能力和行为能力的表述,能够成立的有（ ）。","o":["法人的权利能力和行为能力同时取得","自然人的权利能力和行为能力因出生而取得","外国人在中国只具备行为能力,不具备权利能力","我国境内的无国籍人也可能具有权利能力和行为能力"],"a":"AD","e":"\u0001法人的权利能力始于法人的依法成立, 终于法人被解散或撤销,法人的行为能力和权利能力同时产生,同时消灭,答案。\u0002\nA✓ 法人的权利能力始于法人的依法成立, 终于法人被解散或撤销,法人的行为能力和权利能力同时产生,同时消灭,答案\nB✗ 自然人的行为能力以权利能力为前提,有权利能力不一定有行为能力, 根据年龄和智力是否达到法定标准来决定是否享有\nC✗ 外国人和无国籍人虽然在参加法律关系的范围上有所限制,外国人在中国也享有许多民事领域的权利能力\nD✓ 符合题意及现行制度规定（\u0001我国境内的无国籍人也可能具有权利能力\u0002）","k":"","kb":12,"kh":[[0,16],[43,90]]},{"id":"2014-4","y":2014,"t":"单","s":"下列关于权利和义务的表述,正确的是（ ）。","o":["权利和义务都可以放弃","权利和义务都不可以放弃","权利可以放弃,义务必须履行","义务可以放弃,权利必须享有"],"a":"C","e":"\u0001法律义务是指法律义务主体依法应这样或不这样行为的限制和约束。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✓ 符合题意及现行制度规定（\u0001权利可以放弃,义务必须履行\u0002）\nD✗ 与题干设问或现行制度要件不符，故不选\n法律权利是法律权利人依法具有自己这样行为或不这样行为,或要求他人这样或不这样行为的能力或资格。 权利带有一定的自由性,可以放弃; 义务不可以放弃,必须遵守。","k":"","kb":12,"kh":[[17,43],[167,195]]},{"id":"2014-14","y":2014,"t":"单","s":"下列关于法律关系的表述,正确的是（ ）。","o":["法律关系是人与物的关系","法律关系是人与人的关系","法律关系是人与自然的关系","法律关系是人与社会的关系"],"a":"B","e":"\u0001法律关系是法律规范调整社会关系的过程中所形成的人们之间的权利和义务的关系,即人与人的关系。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 法律关系是法律规范调整社会关系的过程中所形成的人们之间的权利和义务的关系,即人与人的关系\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选\n(这里考生还需掌握法律关系的构成要素,即法律关系的主体、法律关系的内容和法律关系的客体)","k":"","kb":12,"kh":[[0,16],[196,279]]},{"id":"2015-11","y":2015,"t":"单","s":"下列关于权利的相关表述,正确的是（ ）。","o":["法律关系主体的权利就是权利能力","一般而言,法律权利的主体不能主动放弃权利","通常情况下,有权利即有义务,有义务即有权利","权利的强制性是直接的,权力的强制性是间接的"],"a":"C","e":"\u0001权利能力是权利主体享有权利和承担义务的能力,权利能力是享有具体权利的前提,与权利是不同的概念。\u0002\nA✗ 权利能力是权利主体享有权利和承担义务的能力,权利能力是享有具体权利的前提,与权利是不同的概念\nB✗ 权利主体对其享有的某些权利是可以转让或放弃的\nC✓ 义务是权利的关联词,有权利即有义务,有义务即有权利,没有无权利的义务,也没有无义务的权利\nD✗ 权力的强制性是直接的,权利的强制性则是以权力为中介的, 是间接的","k":"","kb":12,"kh":[[0,16],[43,90]]},{"id":"2016-12","y":2016,"t":"单","s":"甲工作时不慎将手指切断,同事将其送往医院。医院拟为其行断指再植术,手术前发现断指已丢失。对此,下列分析正确的是（ ）。","o":["甲与医院之间的医疗合同法律关系的客体是人身","按照法律关系客体的相关理论,该断指属于物的范畴","甲的女友因其手指缺失而与其分手,这属于法律事实中的法律行为","由于切断手指是甲个人疏忽所致,其工作单位不必承担任何法律责任"],"a":"B","e":"\u0001法律关系的客体是指法律关系主体之间权利和义务所指向的对象。\u0002\nA✗ 甲与离的外界之物,是法律上的医院之间的医疗合同法律关系的客体是行为,即医院为甲行断指再植术的行为,而不是人身\nB✓ 本题 \" 物体相脱离的外界之物时,可视为法律上的中甲的手指从甲的身体中分离,成为与甲的身体相脱 \" 物 \"\nC✗ 甲的女友与甲分手,不产生民事法律关系,不是民事法律行为\nD✗ 甲在工作中受伤,根据司法解释的相关规定,工作单位应当承担损害赔偿责任\n法律关系的客体包括物、行为、智力成果、人身利益、数据信息。 物是指法律关系主体支配的、在生产和生活上所需要的客观实体。 当人身之部分自然地从身体中分离,已成为与身 \" 。","k":"","kb":12,"kh":[[0,16],[196,279]]},{"id":"2017-4","y":2017,"t":"单","s":"甲影楼为乙拍摄婚纱照,后擅自将乙的婚纱照卖给丙杂志社做封面。乙得知后,与甲和丙交涉未果,提起诉讼。法院经审理认为,甲和丙侵犯了乙的肖像权,应承担相应的法律责任。关于此案涉及的法律关系,下列表述正确的是（ ）。","o":["法院与乙的关系是诉讼法律关系","法院与甲、丙的关系是绝对法律关系","甲和乙在诉讼中的关系是纵向法律关系","甲和丙因照片使用产生的法律关系是调整性法律关系"],"a":"A","e":"\u0001诉讼法律关系是依据诉讼法律规范而形成的、存在于诉讼程序之中的法律关系。\u0002\nA✓ 本题中, 乙是原告,法院与乙的关系是诉讼法律关系\nB✗ 法院与甲丙的关系也是诉讼法律关系,是存在于特定的权利主体和特定的义务主体之间的法律关系,是相对法律关系\nC✗ 甲和乙在诉讼中没有隶属关系,不是纵向法律关系\nD✗ 调整性法律关系是基于人们的合法行为产生的、发挥法的调 2017年全国法律硕士(非法学)联考真题答案详解专业综合课整作用的法律关系,保护性法律关系是由于违法行为而产生的、旨在恢复破坏的权利和秩…\n调整性法律关系是基于人们的合法行为产生的、发挥法的调 2017年全国法律硕士(非法学)联考真题答案详解专业综合课整作用的法律关系,保护性法律关系是由于违法行为而产生的、旨在恢复破坏的权利和秩序的法律关系, 本题中甲和丙因违法使用他人照片,不是合法行为, 产生的不是调整性法律关系","k":"","kb":12,"kh":[[108,144],[167,195]]},{"id":"2018-8","y":2018,"t":"单","s":"关于法律关系,下列说法中不正确的是（ ）。","o":["民事法律关系均为相对法律关系","法律规范是法律关系产生的前提","在法律关系中,主体的权利和义务是现实的","法律关系是以法律上的权利和义务为内容的社会关系"],"a":"A","e":"\u0001民事法律关系既有绝对法律关系又有相对法律关系,如所有权和知识产权等都是绝对法律关系。\u0002\nA✓ 民事法律关系既有绝对法律关系又有相对法律关系,如所有权和知识产权等都是绝对法律关系\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选","k":"","kb":12,"kh":[[167,195],[196,279]]},{"id":"2020-8","y":2020,"t":"单","s":"下列引起法律关系产生、变更或消灭的情形中,属于法律行为的是（ ）。","o":["地震造成人员伤亡引发保险理赔","某国爆发战争导致投资合同无法如期履行","小李与小张依法进行婚姻登记结成夫妻关系","大刘死亡致其与所在单位的劳动关系消灭"],"a":"C","e":"\u0001法律行为指的是与当事人意志有关的, 能够引起法律关系产生、变更或消灭的作为和不作为。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✓ 地震造成人员伤亡、战争导致合同无法履行、当事人死亡导致劳动关系消灭,都和当事人的意志无关,而是由于不可抗力或不可预见的原因而引起的事件\nD✗ 与题干设问或现行制度要件不符，故不选\n行为一旦作出,也是一种事实,它与事件的不同之处在于当事人的主观因素成为引发此种事实的原因。 因此,当事人既无故意又无过失,而是由于不可抗力或不可预见的原因而引起的某种法律后果的活动,在法律上不被视为行为,而被归入事件。 法律上所说的行为仅指与当事人意志有关且能引起法律关系后果的那些行为。","k":"","kb":12,"kh":[[0,16],[196,279]]},{"id":"2021-2","y":2021,"t":"单","s":"在法理学讨论课上,学生甲、乙、丙、丁分别表达了对法律权利和义务的看法,其中不正确的是（ ）。","o":["丙认为,权利和义务均可表现为作为与不作为","丁认为,权利和义务的设定受社会经济关系的制约","甲认为,权利的实现离不开义务的履行","乙认为,有些权利和义务可以放弃或转让"],"a":"D","e":"\u0001法律权利和法律义务是一对表征法律主体关系和状态的范畴。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 法律权利和法律义务是一对表征法律主体关系和状态的范畴\nC✗ 义务是权利的关联词或对应词,两者相辅相成,有权利即有义务,有义务即有权利,没有无权利的义务,也没有无义务的权利,二者互为目的,互为手段\nD✓ 权利可以放弃,但义务不能放弃","k":"","kb":12,"kh":[[17,43],[167,195]]},{"id":"2021-10","y":2021,"t":"单","s":"下列关于法律关系的表述,正确的是（ ）。","o":["出租人与承租人之间的租赁合同关系是绝对法律关系","侵权人与被侵权人之间的赔偿关系是隶属型法律关系","夫妻之间相互扶养的关系是平权型法律关系","父母与子女之间相互继承的关系是保护性法律关系"],"a":"C","e":"\u0001租赁合同是相对法律关系,承租人与出租人是特定的。\u0002\nA✗ 租赁合同是相对法律关系,承租人与出租人是特定的\nB✗ 侵权人与被侵权人之间的赔偿关系是平权型法律关系,侵权人与被侵权人法律地位平等\nC✓ 夫妻之间相互扶养的关系是平权型法律关系,当事人法律地位平等\nD✗ 父母与子女之间相互继承的关系是调整性法律关系,是基于人们的合法行为产生的","k":"","kb":12,"kh":[[0,16],[196,279]]},{"id":"2022-2","y":2022,"t":"单","s":"甲骑摩托车未戴头盔,执勤的交警乙对其进行教育处理,甲承认错误并接受了处罚。回家途中,甲协助警察丙抓住了抢夺别人财物的丁。关于上述事件中各主体间的法律关系,下列表述正确的是（ ）。","o":["甲和乙之间形成平权型法律关系","丙和丁之间形成隶属型法律关系","乙和丙之间形成平权型法律关系","甲和丁之间形成隶属型法律关系"],"a":"B","e":"\u0001所谓法律地位平等,指的是当事人之间没有隶属关系,也就是既不存在职务上的上、下级关系,也不存在一方当事人可以依据职权而支配对方的情形。\u0002\nA✗ 交警乙依据职权直接要求甲遵守交通法规并对其进行处罚,二者之间形成了隶属型法律关系\nB✓ 警察丙依据职权抓捕犯罪嫌疑人丁,二者之间形成了隶属型法律关系\nC✗ 在本题中交警乙与警察丙之间没有形成法律关系\nD✗ 申协助警察丙抓住了抢夺别人财物的丁,甲和丁之间既不存在职务上的上下关系,甲也不具备职权,因此甲与丁属于法律地位平等的双方当事人,二者之间形成了平权型法律关系\n平权型法律关系与隶属型法律关系是按照法律关系主体的法律地位是否平等所作的分类。 平权型法律关系是存在于法律地位平等的当事人之间的法律关系。 隶属型法律关系是一方当事人可依据职权而直接要求他方当事人为或不为一定行为的法律关系。 隶属型法律关系既存在于具有职务关系的上、下其管辖范围内的各种主体之间。","k":"","kb":12,"kh":[[0,16],[196,279]]},{"id":"2023-8","y":2023,"t":"单","s":"某公司销售过期食品,市场监督管理部门对其处以罚款5万元。该公司不服,向法院起诉。一审法院认为该行政行为合法,判决驳回该公司的诉讼请求。二审法院判决将罚款变更为 1万元。对此,下列说法正确的是（ ）。","o":["该公司销售过期食品的行为属于法律事件","法院和该公司之间的法律关系属于绝对法律关系","市场监督管理部门对该公司处以罚款的行为属于行政处分","二审法院的改判体现了上级人民法院对下级人民法院审判工作的监督"],"a":"D","e":"\u0001二审法院依法改判改变一审判决结果，体现上级法院对下级法院审判工作的监督。\u0002\nA✗ 销售过期食品是以人意志为支配的\u0001违法法律行为\u0002，而非不以意志为转移的法律事件\nB✗ 法院与诉讼当事人之间主权明确、主体特定，属于\u0001相对法律关系\u0002，并非对世的绝对法律关系\nC✗ 市场监管部门对行政相对人罚款属于\u0001行政处罚\u0002，行政处分适用于公职人员内部惩戒\nD✓ 我国实行两审终审制，二审改判正是\u0001上级法院对下级法院审判工作进行监督\u0002的体现\n易混辨析：对外罚款是\u0001行政处罚\u0002，对内记过撤职才是\u0001行政处分/政务处分\u0002；上下级法院之间是\u0001审判监督关系\u0002而非领导关系。","k":"","kb":12,"kh":[[167,195],[196,279]]},{"id":"2024-4","y":2024,"t":"单","s":"甲在江边游玩时不慎落水，路过的外卖小哥乙听到呼声跳入江中，成功将甲救上岸。甲欲重金酬谢，被乙婉拒。该事件经媒体报道后，当地政府按照相关规定认定乙的行为属于见义勇为并给予奖励。对此，下列表述正确的是（ ）。","o":["甲不慎落水属于法律行为","当地政府奖励乙属于法律行为","乙主动救助甲是履行法律义务","甲重金酬谢乙是承担法律责任"],"a":"B","e":"\u0001当地政府依法认定见义勇为并授予奖励属于设权性行政法律行为。\u0002\nA✗ 甲不慎落水并非出于其主观意图表达，且依是否以意志为转移应归为意外或\u0001非表意事实/事件\u0002，不属于法律行为\nB✓ 政府依规定主动实施见义勇为确认并给予行政奖励，以\u0001公权力意志表达直接引起法律关系产生\u0002，属于法律行为\nC✗ 见义勇为救助落水陌生人在道德上值得褒扬（法理中属\u0001道德义务或积极道德倡导\u0002），一般非普通路人的法定强制义务\nD✗ 甲酬谢救命恩人是基于感恩的民事赠与或\u0001道义答谢\u0002，甲并未违法违约，不属于承担法律责任\n判断法律事件与法律行为的核心标准：\u0001是否以当事人的主观意思表示或意志为转移并产生法律效果\u0002。","k":"","kb":12,"kh":[[0,16],[196,279]]},{"id":"2024-5","y":2024,"t":"单","s":"甲机关与乙公司签订办公桌椅采购合同。按照合同约定,甲机关向乙公司支付了10 万元价款,乙公司向甲机关交付了办公桌椅。二者之间形成的法律关系的类型是（ ）。","o":["普通法律关系和调整性法律关系","普通法律关系和绝对法律关系","相对法律关系和隶属型法律关系","相对法律关系和基本法律关系"],"a":"A","e":"\u0001普通采购合同在双方依约和平履行期间形成的是普通法律关系和调整性法律关系。\u0002\nA✓ 机关与企业订立买卖合同系一般日常合同（\u0001普通法律关系\u0002），且双方合法签订并正常履约（\u0001调整性法律关系\u0002）\nB✗ 合同债权债务关系主体明确特定，属于\u0001相对法律关系\u0002，而非对世效力的绝对法律关系\nC✗ 机关采购办公桌椅是作为民事主体与公司平等交易，属于\u0001平权型法律关系\u0002，并非行政管理上的隶属型法律关系\nD✗ 机关采购合同关系仅涉及具体双边交易，并非宪法所确立公民与国家之间的\u0001基本法律关系\u0002\n法律关系分类技巧：国家机关从事民事采购也是\u0001平权型法律关系\u0002；未违约未侵权即是\u0001调整性法律关系\u0002。","k":"","kb":12,"kh":[[167,195],[196,279]]},{"id":"2024-8","y":2024,"t":"单","s":"为进一步保护知识产权,提升全社会知识产权保护意识,某市依法集中销毁一批非法出版物,同时邀请公证处参与销毁工作。对此,下列表述正确的是（ ）。","o":["智力成果不属于法律关系的客体","依法销毁非法出版物属于法律实施","依法销毁出版物体现了法的预测作用","邀请公证处参与销毁体现了国家机关的专门监督"],"a":"B","e":"\u0001某市行政执法部门依法集中销毁非法出版物，直接属于法律实施（法的执行）活动。\u0002\nA✗ \u0001智力成果\u0002（作品、专利、商标等无形知识产品）是典型的法律关系客体之一\nB✓ 执法机关依据知识产权与出版管理法规收缴并销毁盗版侵权出版物，是\u0001法律实施（行政执法）\u0002的直接体现\nC✗ 销毁违法物品惩罚违法者主要体现法的\u0001强制作用与教育警示作用\u0002，而非预测作用\nD✗ 公证处属于提供证明服务的社会中介/公证机构，并非行使公权力的\u0001国家专门监督机关\u0002\n公证处、律师协会、社会团体及新闻舆论参与监督均属于\u0001社会监督\u0002，而非国家专门机关监督。","k":"","kb":12,"kh":[[0,16],[196,279]]},{"id":"2024-44","y":2024,"t":"多","s":"甲因琐事与乙发生口角,遂将乙辱骂他的视频发布在某平台,引发网友搜集、传播乙的个人信息,并对乙辱骂骚扰。对此,下列说法正确的有（ ）。","o":["乙辱骂甲的行为可能产生保护性法律关系","甲将乙的视频发布在某平台,属于实施法律制裁","网民搜集、传播乙的个人信息,属于积极守法行为","网民对乙辱骂骚扰可能产生刑事法律责任"],"a":"AD","e":"\u0001违法侵权（辱骂）产生保护性法律关系；网民网暴辱骂骚扰情节严重者可能产生刑事法律责任。\u0002\nA✓ 辱骂行为构成对他人人格权的侵害，由此引起的侵权赔偿或治安追究关系属于基于违法行为产生的\u0001保护性法律关系\u0002\nB✗ 法律制裁只能由\u0001特定的国家机关\u0002依法定职权与程序作出，甲个人将视频上传网络平台曝光不属于实施法律制裁\nC✗ 网民擅自“人肉搜索”搜集并传播他人个人信息侵害隐私权和个人信息权益，属于违法行为而非\u0001积极守法\u0002\nD✓ 网民在网络上肆意捏造事实诽谤、公开侮辱或寻衅滋事骚扰，情节严重的构成犯罪，可能产生\u0001刑事法律责任\u0002\n“网络暴力”法治热点分析：私力挂人曝光≠法律制裁；\u0001人肉搜索侵权违法\u0002，严重网暴依法须承担\u0001民事、行政乃至刑事责任\u0002。","k":"","kb":12,"kh":[[0,16],[196,279]]},{"id":"2025-5","y":2025,"t":"单","s":"甲强占乙的宅基地,乙诉至法院。法院依法判处甲将宅基地归还乙,并赔偿相关损失。对此,下列说法正确的是（ ）。","o":["乙起诉甲形成的法律关系是主法律关系","乙起诉甲形成的法律关系是纵向法律关系","法院的判决使得甲与乙之间形成相对法律关系","法院的判决使得甲与乙之间形成调整性法律关系"],"a":"C","e":"\u0001乙起诉甲形成的诉讼法律关系中,甲和乙作为诉讼当事人,在法律地位上是平等的, 属于横向法律关系。\u0002\nA✗ 乙起诉甲形成的诉讼法律关系是因诉讼行为而产生的法律关系,是从法律关系\nB✗ 乙起诉甲形成的诉讼法律关系中,甲和乙作为诉讼当事人,在法律地位上是平等的, 属于横向法律关系\nC✓ 法院的判决确定了甲应归还宅基地给乙并赔偿损失,这就在甲和乙之间形成了特定的权利义务关系,即相对法律关系\nD✗ 甲强占乙的宅基地属于违法行为,法院的判决是对这种违法行为的纠正和制裁,形成的是保护性法律关系","k":"","kb":12,"kh":[[0,16],[196,279]]},{"id":"2025-11","y":2025,"t":"单","s":"下列选项中,不属于法律关系客体的是（ ）。","o":["甲自主决定无偿捐献的眼角膜","乙在天文观测中发现的一颗小行星","丙创作并在网络平台发布的一部小说","丁因见义勇为获得政府颁发的五万元奖金"],"a":"B","e":"\u0001甲自主决定无偿捐献的眼角膜,属于人体的一部分在特定情况下的物化,可以成为法律关系的客体。\u0002\nA✗ 甲自主决定无偿捐献的眼角膜,属于人体的一部分在特定情况下的物化,可以成为法律关系的客体\nB✓ 项在天文观测中发现的小行星,人类不能认识和控制, 不能成为法律关系的客体\nC✗ 丙创作并在网络平台发布的一部小说,属于精神产品,是法律关系中的客体\nD✗ 丁因见义勇为获得政府颁发的五万元奖金,属于物质利益(物), 是法律关系的客体\n物成为法律关系的客体,应为人类所认识和控制。 不可认识和控制之物(如地球以外的天体)不能成为法律关系客体。 \u0001“乙在天文观测中发现的一颗小行星”\u0002在天文观测中发现的小行星,人类不能认识和控制, 不能成为法律关系的客体,","k":"","kb":12,"kh":[[0,16],[196,279]]},{"id":"2025-42","y":2025,"t":"多","s":"在一起生命权纠纷案的判决书中,法官写道:“在救助民事法律关系中,被救助者负有对救助者必要的注意、救助、安全保障义务,既契合我国民法诚实信用、公序良俗基本原则的应有之义,也符合社会主义核心价值观的指引方向,更是中华民族助人为乐、知恩图报优秀美德的内在要求。”对此,下列说法正确的有（ ）。","o":["诚实信用原则属于政策性原则","公序良俗原则属于实体性原则","道德要求可以成为法官释法说理的重要依据","社会主义核心价值观对司法裁判具有强制约束力"],"a":"BC","e":"\u0001诚实信用原则属于公理性原则,而不是政策性原则。\u0002\nA✗ 诚实信用原则属于公理性原则,而不是政策性原则\nB✓ 公序良俗原则属于实体性原则而不是程序性原则\nC✓ 道德可以为法官提供裁判的参考和依据,使裁判结果更加符合社会公众的期待和认知\nD✗ 社会主义核心价值观可以作为司法裁判的参考和指导,但对司法裁判没有强制约束力\n在司法裁判中,法官不仅需要依据法律条文进行裁判,还需要考虑社会道德、公序良俗等因素。","k":"","kb":12,"kh":[[0,16],[196,279]]},{"id":"2026-44","y":2026,"t":"多","s":"2024 年12 月,最高人民法院发布首批新就业形态劳动争议专题指导性案例, 明确新就业形态劳动关系认定标准,对于存在用工事实,构成支配性劳动管理的依法认定劳动关系,保障劳动者依法享受劳动权益。下列表述正确的有（ ）。","o":["新就业形态劳动关系客体是劳动者","新就业形态劳动关系属于平权型法律关系","我国正在形成以成文法为主,判例法为辅的法律体系","最高人民法院发布的指导性案例,各级人民法院审判类似案件时应当参照"],"a":"CD","e":"\u0001我国成文法为主, 指导性案例应当参照。\u0002\nA✗ 劳动关系客体是劳动行为\nB✗ 劳动关系隶属型非平权\nC✓ 符合题意及现行制度规定（\u0001我国正在形成以成文法为主,判例法为辅\u0002）\nD✓ 我国成文法为主, 指导性案例应当参照\n\u0001“新就业形态劳动关系客体是劳动者”\u0002：劳动关系客体是劳动行为;","k":"","kb":12,"kh":[[0,16],[144,167]]}]},{"sub":"法理学","name":"法的作用与价值","w":2.8,"w5":2.2,"wh":2.0,"bt":"","pt":"近5年2.2分/年·安全价值/比例原则稳步上升","L":34,"qs":[{"id":"2005-1","y":2005,"t":"单","s":"关于法律的起源与演进的表述,能够成立的是（ ）。","o":["古希腊斯多葛学派认为法律是民族精神的体现,随着民族的成长而成长","法律的形成过程是法律日益脱离宗教、道德规范而成为独立的、专门的社会规范的过程","社会公共事务的简化和人的独立意识的成长也是促进法律的产生和发展的重要因素","马克思主义法学认为,法的产生和发展是多种社会因素相互作用的产物,但这些因素又是在政治因素最终起决定作用的条件下相互作用的"],"a":"B","e":"\u0001德国历史法学派(萨维尼)认为法律是民族精神的体现,随着民族的成长而成长。\u0002\nA✗ 德国历史法学派(萨维尼)认为法律是民族精神的体现,随着民族的成长而成长\nB✓ 法律的起源是由与道德规范、宗教规范混为一体到相对独立的过程\nC✗ 促进法律的产生和发展的重要因素并非\"社会公共事务的简化\",而是\"社会公共事务的复杂化\"\nD✗ \"政治因素最终起决定作用\"的说法是错误的\n古希腊斯多葛学派认为,理性作为一种遍及宇宙的普世力量,乃是法律和正义的基础。 马克思主义认为,在政治与经济的关系中,经济决定政治,政治从属于经济。","k":"","kb":8,"kh":[[0,63]]},{"id":"2007-4","y":2007,"t":"单","s":"“徒法不足以自行” ,这一观点表明 （ ）。","o":["法律是由社会物质生活条件决定的","在正式公布之前,法律不会自己生效","法律的作用是有局限性的","法律永远不能满足人类的需要"],"a":"C","e":"\u0001依据题干考查要点，正确表述为“法律的作用是有局限性的”。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✓ 符合题意及现行制度规定（\u0001法律的作用是有局限性的\u0002）\nD✗ 与题干设问或现行制度要件不符，故不选\n法律的局限性这句话是先哲孟子说的,他认为\"徒善不足以为政,徒法不足以自行\",意思是只有善德不足以处理国家的政务,只有法律不能够使其自己发生效力,这一观点表明法律本身并不是万能的,具有一定的局限性。","k":"","kb":7,"kh":[[0,10],[194,215]]},{"id":"2007-46","y":2007,"t":"多","s":"下列表述中,主要体现法执行社会公共事务作用的有 （ ）。","o":["规定各阶级在国家生活中的地位","维护最低限度的社会治安","保障生态平衡和自然资源的合理利用","确认和维护生产资料所有制"],"a":"BC","e":"\u0001依据题干与现行制度规定综合判断作答。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 符合题意及现行制度规定（\u0001维护最低限度的社会治安\u0002）\nC✓ 符合题意及现行制度规定（\u0001保障生态平衡和自然资源的合理利用\u0002）\nD✗ 与题干设问或现行制度要件不符，故不选\n法的作用法与国家一样,执行阶级统治和社会公共事务两个方面的职能,社会公共事务是一切社会都必须办的事务,其中 该项、该项 两项属于这类事务,而规定各阶级在国家生活中的地位以及确认和维护生产资料所有制,都只是为了统治阶级的利益,属于执行阶级统治的职能。","k":"","kb":7,"kh":[[122,146]]},{"id":"2009-9","y":2009,"t":"单","s":"下列选项中，属于法的维护阶级统治作用的是（ ）。","o":["维护人类社会的基本生活条件","调整统治阶级与同盟者之间的关系","保护全体经营者和消费者的权利","保障社会成员的基本人身安全"],"a":"B","e":"\u0001维护人类社会的基本生活条件、保障全体经营者和消费者的权益、保障社会成员的基本人身安全均属于法的执行社会公共事务的作用。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 法在维护阶级统治中的作用表现在:调整统治阶级与被统治阶级的关系,调整统治阶级内部的关系以及调整统治阶级与其同盟者之间的关系\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选\n法的社会作用大体上表现为维护阶级统治的作用和执行社会公共事务的作用。","k":"","kb":7,"kh":[[122,146]]},{"id":"2010-4","y":2010,"t":"单","s":"我国《宪法》规定:“中华人民共和国公民有宗教信仰自由。”该规定属于法律规范中的（ ）。","o":["授权性规范","禁止性规范","义务性规范","命令性规范"],"a":"A","e":"\u0001授权性规范是规定人们有权做一定的行为或者不做一定行为的规则。\u0002\nA✓ 授权性规范是规定人们有权做一定的行为或者不做一定行为的规则\nB✗ 禁止性规范是 \" 中华人禁仆人们仵出·定行为的认伴规范\nC✗ 义务性规范是在内容上规定人们的法律义务,规定人们应当做或不做某种行为的规范\nD✗ 与题干设问或现行制度要件不符，故不选\n按照规则的内容不同,法律规范分为义务性规范和授权性规范。 义务性规范又可以分为命令性规范和禁止性规范,命令性规范是规定人们的积极义务的规则,即人们应该做某事; 题千中 \" 说明中国公民有权选民共和国公民有宗教信仰自由择信仰或者不信仰宗教,有权选择信仰这种宗教也有权信仰那种宗教,故该表述是授权性规则乙因此\u0001“授权性规范”\u0002 是正确的。","k":"","kb":8,"kh":[[0,63],[76,141]]},{"id":"2011-2","y":2011,"t":"单","s":"下列选项中,体现出法的评价作用的是（ ）。","o":["金某说:“我的邻居张法官是个大孝子。”","魏某说:“我国法制建设取得巨大成就。”","陶某说:“贪官田某枉法获刑,罪有应得。”","姜某说:“侵权责任法仍有不尽如人意之处。”"],"a":"C","e":"\u0001其中法的规范作用包括法的指引作用、法的评价作用、法的预测作用、法的教育作用、法的强制作用。\u0002\nA✗ 选项中关于 \" 是一个道德上的评价,与法律居张法官是个大孝子评价无关\nB✗ 法的评价作用的对象是他人的行为,而相关表述对我国法制建设和侵权责任法的评价与法的评价作用无关\nC✓ 法的规范作用包括法的指引作用、法的评价作用、法的预测作用、法的教育作用、法的强制作用\nD✗ 与题干设问或现行制度要件不符，故不选\n法的作用可分为法的规范作用与法的社会作用。 法的评价作用的标准与核心是行为合法或不合法,违法还是不违法。 \u0001“金某说:我的邻居张法官是个大孝子”\u0002关于 \" 是一个道德上的评价,与法律居张法官是个大孝子评价无关。","k":"","kb":7,"kh":[[11,121],[122,146]]},{"id":"2012-3","y":2012,"t":"单","s":"下列关于法的作用的表述,正确的是（ ）。","o":["法的作用只能通过守法的方式来体现","法的规范作用是法的社会作用的目的","法的规范作用是法对人们的意志与行为发生的间接影响","法的作用根本上取决于生产关系或生产方式自身的生命力"],"a":"D","e":"\u0001法的作用不只是通过守法的方式来体现。\u0002\nA✗ 法的作用不只是通过守法的方式来体现\nB✗ 规范作用是手段,社会作用是目的\nC✗ 法的规范作用对人们的意志、行为发生直接影响\nD✓ 法的作用取决于经济基础,从根本上说,取决于生产关系或生产方式自身的生命力,而不是取决于立法者的主观愿望\n一切社会法的作用都可以有规范作用和社会作用之分。 这两种作用是手段与目的的关系。 【点评) 法的规范作用与社会作用的关系是比较重要的考点。 此考点在2013年综合课简答题中也出现过。","k":"","kb":7,"kh":[[11,121],[122,146]]},{"id":"2013-49","y":2013,"t":"多","s":"2012年6月,我国完成了铁路运输法院移交地方的改革工作。对此,下列说法正确的有（ ）。","o":["这有利于实现司法公正","这有利于司法机关摆脱部门利益的干扰","这符合宪法关于人民法院是国家审判机关的定性","这符合宪法关于人民法院依法独立行使审判权的原则"],"a":"ABCD","e":"\u0001铁路运输法院原来是独立的专门法院, 现在移交地方,首先是有利于司法公正,有利于将铁路运输法院置于人民法院的组织系统监督之下,避免了利益部门的干预,因此该项。\u0002\nA✓ 符合题意及现行制度规定（\u0001这有利于实现司法公正\u0002）\nB✓ 铁路运输法院原来是独立的专门法院, 现在移交地方,首先是有利于司法公正,有利于将铁路运输法院置于人民法院的组织系统监督之下,避免了利益部门的干预,因此该项\nC✓ 符合题意及现行制度规定（\u0001这符合宪法关于人民法院是国家审判机关\u0002）\nD✓ 但铁路运输法院的改革并没有超出法院原有的组织系统,仍然是适用法律的专门机关,独立行使审判权,维护法律尊严,实现打击敌人、惩罚犯罪、保护人民、调解纠纷的国家职能","k":"","kb":7,"kh":[[11,121]]},{"id":"2013-50","y":2013,"t":"多","s":"下列关于法的价值的表述,能够成立的有 （ ）。","o":["法的价值影响人们的法律实践活动","法律的各种主要价值之间存在一定的冲突","与法律原则相比,法律规则更能体现法的价值","除了正义、自由与秩序外,不存在其他法的价值"],"a":"AB","e":"\u0001法的价值是法存在的理论正当性依据, 它构成一个社会的法律主体尤其是法律职业人的精神存在的核心部分,直接决定了社会的法律主体的法律思维方式与法律实践。\u0002\nA✓ 法的价值是法存在的理论正当性依据, 它构成一个社会的法律主体尤其是法律职业人的精神存在的核心部分,直接决定了社会的法律主体的法律思维方式与法律实践\nB✓ 法律价值体系之间是协调统一的,有些价值之间可能本身存在冲突,但价值体系可以实现价值之间的协调\nC✗ 法律原则和法律规则一样能体现法的价值,且更能体现法的价值\nD✗ 法的价值主要包括秩序、自由、平等、人权、正义、效率等,故答案","k":"","kb":8,"kh":[[0,63],[76,141]]},{"id":"2015-3","y":2015,"t":"单","s":"甲故意杀人后畏罪潜逃,归案后法院依法判处甲无期徒刑,剥夺政治权利终身。根据法的作用理论,下列表述正确的是（ ）。","o":["甲畏罪潜逃体现了法的指引作用","法院的判决体现了法的强制作用,而非法的教育作用","法院的判决既体现了法的规范作用,也体现了法的社会作用","有人认为甲畏罪潜逃应罪加一等,该观点体现了法的预测而非评价作用"],"a":"C","e":"\u0001法的规范作用是指法作为行为规范,对人们的意志、行为发生的直接影响,对人的行为所起到的保障和约束作用。\u0002\nA✗ 甲畏罪潜逃显然不体现法的指引作用\nB✗ 法院的判决属于法的评价作用,对甲判处无期徒刑,属于法的强制作用\nC✓ 法的规范作用是手段,法的社会作用是目的\nD✗ 有人认为甲应该罪加一等,这个属于评价作用而不是预测作用\n法的社会作用是指法的社会、政治功能,即法作为社会关系的调整器,服务千一定的社会政治目的、目标,承担着一定的社会政治使命,形成、维护、实现一定的社会秩序。 法通过调整人们行为这种规范作用,实现维护社会经济基础和发展生产力的社会作用。 该法院的判决不仅体现了强制作用和教育作用,也体现出维护社会治安,保障社会成员的基本人身安全的执行社会公共事务的作用。 \u0001“甲畏罪潜逃体现了法的指引作用”\u0002,甲畏罪潜逃显然不体现法的指引作用。 如果体现,甲应该主动自首。","k":"","kb":7,"kh":[[11,121],[122,146]]},{"id":"2015-4","y":2015,"t":"单","s":"某市打算引进大型化工项目,引发社会争议。赞同者认为该项目将促进本市经济发展;反对者认为该项目会造成严重环境污染,损害民众健康。该市综合考量后,决定终止引进该项目。根据法的价值冲突理论,该市的最终决定体现出（ ）。","o":["效率优于自由","效率优于平等","人权高于效率","秩序高于正义"],"a":"C","e":"\u0001本题中所体现的矛盾是某市的经济与市民的健康之间的矛盾,该市最终决定终止引进化工项目,是体现市民的健康高于经济的发展,也即体现出入权高于效率。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✓ 本题中所体现的矛盾是某市的经济与市民的健康之间的矛盾,该市最终决定终止引进化工项目,是体现市民的健康高于经济的发展,也即体现出入权高于效率\nD✗ 与题干设问或现行制度要件不符，故不选","k":"","kb":8,"kh":[[0,63],[76,141]]},{"id":"2017-5","y":2017,"t":"单","s":"“哪里没有法律,哪里就没有自由。”关于这句话,下列理解正确的是（ ）。","o":["人生而自由,因此自由与法律无关","自由意味着人可以从事任何自己想做的事情","法律以保障个人自由为唯一的价值和目标","若没有法律的保障和约束,自由便荡然无存"],"a":"D","e":"\u0001自由是指从受到束缚的状态中摆脱出来,或不受约束的状态。\u0002\nA✗ 法律确认和保障自由,自由与法律有关\nB✗ 自由不是指人们可以从事任何自己想做的事, 而是指人们可以在法律规定的范围内自主选择想做的事\nC✗ 法律的价值和目标很多,自由、秩序、平等、正义、人权等都是法律的价值,自由不是唯一的价值\nD✓ 法律确认和保障自由,没有法律的保障,自由无法实现\n法学上的自由是指主体的行为与法律的既有规定相一致或相统一。 自由不是绝对的,主体自由选择的行为必须与既有的法律规定相一致。","k":"","kb":8,"kh":[[0,63],[76,141]]},{"id":"2017-47","y":2017,"t":"多","s":"下列有关人权的说法,不正确的有（ ）。","o":["只存在个体人权,不存在集体人权","人权是指宪法中规定的公民基本权利","马克思主义法学认为,人权是历史发展的产物","人权具有超时代性,所以人权价值属于本源性价值"],"a":"ABD","e":"\u0001人权不仅包括个体人权,还包括集体人权,集体人权可以分为一般社会群体的权利和特殊社会群体的权利。\u0002\nA✓ 人权不仅包括个体人权,还包括集体人权,集体人权可以分为一般社会群体的权利和特殊社会群体的权利\nB✓ 人权是人作为人所享有或应当享有的权利,我国宪法规定的公民基本权利只是人权的一部分,还有一部分人权未规定到宪法中,比如自由迁徙权\nC✗ 马克思主义认为,人权是历史发展的产物,人权不是天赋的,而是历史地产生的\nD✓ 人权是本源性的权利,是其他权利存在的正当性根据和理由,但人权不具有超时代性\n人权是人作为人所享有或应当享有的那些权利。 从主体角度,人权可以分为个体人权和集体人权。","k":"","kb":8,"kh":[[0,63],[76,141]]},{"id":"2017-49","y":2017,"t":"多","s":"某法院在当地一所大学对被指控犯组织考试作弊罪的被告人依法进行审判,并做出有罪判决, 很多学生参与旁听。在此,法律发挥的规范作用有 （ ）。","o":["预测作用","教育作用","评价作用","强制作用"],"a":"BCD","e":"\u0001法的规范作用包括指引作用、评价作用、预测作用、教育作用、强制作用。\u0002\nA✗ 法具有规范性、确定性,所以人们根据法律本身就可以安排自己的行为,本题中学生旁听对被告人的审判,并不是发挥法的预测作用\nB✓ 通过对违法行为实施制裁,对包括违法者本人在内的一般人起到警示和警诫作用,是发挥法的教育作用,法院通过对被告人的有罪判决,警示学生不要犯组织考试作弊罪\nC✓ 法院作出的判决是专门评价,本题中法院对被告人作出有罪判决,是代表国家对被告人的组织考试作弊行为进行评价,是发挥法的评价作用\nD✓ 法院对被告进行有罪判决,也就是对违法犯罪行为进行制裁,是发挥法的强制作用\n评价作用是指法作为人们对他人行为的评价标准所起的作用。 评价作用的作用对象是他人的行为,包括专门评价和社会评价。 预测作用是指人们根据法可以预先估计人们相互间将怎样行为以及行为的后果等,从而对自己的行为作出合理的安排。","k":"","kb":7,"kh":[[11,121]]},{"id":"2018-3","y":2018,"t":"单","s":"2016年12月16日,教育部颁布了新修订的《普通高等学校学生管理规定》,其中第55条第1款规定:“在对学生作出处分或其他不利决定之前,学校应当告知学生作出决定的事实,理由和依据,并告知学生具有陈述和申辩的权利,听取学生的陈述和申辩。”该规定集中体现的法律价值是（ ）。","o":["正义","安全","秩序","效率"],"a":"A","e":"\u0001正义是人类追求的共同理想,也是法律的核心价值。\u0002\nA✓ 实体正义是指通过法律上的实体权利和义务来公正地分配社会利益与负担的法律规则所体现出来的正义\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选\n正义可分为实体正义和程序正义。 程序正义是指为了实现法律上的实体权利和义务而公正地设定一系列必要程序所体现出来的正义。 本题中题干的规定,既体现了实体正义,有利于学生权利的保护,也体现了程序正义,具体规定了学校进行处分的程序,总体而言,体现了法律价值中的正义价值。","k":"","kb":8,"kh":[[0,63],[76,141]]},{"id":"2018-6","y":2018,"t":"单","s":"不同学派关于法的性质有不同的理解。对此, 下列说法正确的是（ ）。","o":["经济分析法学派认为,法律不外乎主权者的命令","批判法学派认为,衡量法律优劣的最主要标准是实施效果","自然法学派认为,法律应当与社会主流道德和人性的正义准则保持一致","历史法学派认为,一国的自然环境和政治制度决定着法的内容和性质"],"a":"C","e":"\u0001社会法学派强调法律实施的效果,认为法律优劣的主要标准是实施效果。\u0002\nA✗ 法律不外乎主权者的命令是分析法学派的观点,而不是经济分析法学派\nB✗ 社会法学派强调法律实施的效果,认为法律优劣的主要标准是实施效果\nC✓ 自然法学派认为自然法高于人定法,人定法应与自然法保持一致\nD✗ 历史法学派认为法是民族精神、民族特性和民族 2018年全国法律硕士(非法学)联考真题答案详解专业综合课共同意识的体现\n考查不同法学流派的观点。","k":"","kb":1,"kh":[[19,66],[169,198]]},{"id":"2018-9","y":2018,"t":"单","s":"“和为贵”是中国传统法律的重要内容之一, 关于该理念的当代意义和价值,下列说法正确的是（ ）。","o":["“和为贵”与自由、平等的法律观念无法兼容","“和为贵”对调解制度的实施可以起到积极的作用","“和为贵”观念不利于维护社会公平的秩序","信访制度是“和为贵”在当代法律制度中的重要体现"],"a":"B","e":"\u0001信访制度是解决社会矛盾的一种方法,是公民主张自己权利的渠道,但 \" 的体现。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ \"与自由平等的法律观念可 \"和为贵以兼容,有利于维护社会秩序,可以积极推进调解制度的实施\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 信访制度是解决社会矛盾的一种方法,是公民主张自己权利的渠道,但 \" 的体现","k":"","kb":8,"kh":[[0,63],[76,141]]},{"id":"2018-42","y":2018,"t":"多","s":"2016年9月,国务院新闻办公室发布《国家人权行动计划(2016一2020年)》,对我国人权事业的发展做出全面部署,对此,下列说法正确的有（ ）。","o":["国家对保障人权负有重要责任","人权就是公民依据宪法和法律享有的权利","现代人权的保护需要通过立法予以确认","司法机关在审判时应尊重和保障当事人的人权"],"a":"ACD","e":"\u0001“人权就是公民依据宪法和法律享有的权利”人权的范围不等于公民权,所以人权不能等同于公民依据宪法和法律享有的权利。\u0002\nA✓ 符合题意及现行制度规定（\u0001国家对保障人权负有重要责任\u0002）\nB✗ 人权的范围不等于公民权,所以人权不能等同于公民依据宪法和法律享有的权利\nC✓ 符合题意及现行制度规定（\u0001现代人权的保护需要通过立法予以确认\u0002）\nD✓ 符合题意及现行制度规定（\u0001司法机关在审判时应尊重和保障当事人的\u0002）","k":"","kb":7,"kh":[[11,121]]},{"id":"2019-1","y":2019,"t":"单","s":"马克思认为,法律是一定的物质生产方式所产生的社会共同利益需要的表现,而不是单个人的恣意横行。对于这一观点,下列理解正确的是（ ）。","o":["法律伴随人类社会的产生而产生","法律调整社会中的一切利益关系","社会物质生产方式决定法律的内容","法律体现每个社会主体的利益需要"],"a":"C","e":"\u0001题干中的意思是说法律是社会共同利益的体现,而社会共同利益是以物质生产方式为基础的,体现的观点是社会物质生产方式决定法律的内容。\u0002\nA✗ 人类社会的产生之初,并没有私有制,物质极度匮乏,不需要法律对财产关系等进行调整,因此,法律应该是伴随阶级社会的产生而产生\nB✗ 法律的作用具有局限性,对于家庭关系个人内心思想等法律不是最好的调整方式,因此,法律不能调整社会中的一切利益关系\nC✓ 题干中的意思是说法律是社会共同利益的体现,而社会共同利益是以物质生产方式为基础的,体现的观点是社会物质生产方式决定法律的内容\nD✗ 任何国家任何历史阶段的法律都不可能体现全体人民的意志,只能是统治阶级的意志\n马克思认为,法律并不是以意志为基础的,而是由物质生活条件决定的。 不以人的意志为转移的物质生活,即相互制约的生活方式和交往形式, 是国家意志和统治阶级意志的现实基础。","k":"","kb":7,"kh":[[0,10],[147,166]]},{"id":"2019-9","y":2019,"t":"单","s":"比例原则是行政执法应遵循的重要原则。下列行政行为中,符合比例原则的是（ ）。","o":["为保护本地企业的利益,禁止本地超市出售外地企业的肉类制品","在一年一度的马拉松比赛当日,实行比赛沿线地区临时交通管制","在对企业违法行为作出处罚前,举行听证会听取其申辩","为迎接创建卫生城市评比检查,决定检查期间早点摊、夜宵店均不得营业"],"a":"B","e":"\u0001比例原则要求:(1)适当性原则,是指行政行为对于实现行政目的、目标是适当的,相关表述是地方保护主义,不利于商品的流通,不符合适当性原则。\u0002\nA✗ 比例原则要求:(1)适当性原则,是指行政行为对于实现行政目的、目标是适当的,相关表述是地方保护主义,不利于商品的流通,不符合适当性原则\nB✓ 在马拉松当日,实行临时交通管制,而不是长期交通管制,符合比例原则\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 必要性原则,过大地限制了早点摊夜宵店的营业时间\n比例原则是指行政机关实施行政行为应兼顾行政目标的实现和保护相对人的权益,如果为了实现行政目标可能对相对人权益造成某种不利影响,应使这种不利影响限制在尽可能小的范围和限度,使二者处于适度的比例。 (2)必要性原则,是指行政行为以达到行政目的、目标为限,不能给相对人权益造成过度的不利影响,即行政行为的行使职能限于必要的度,以尽可能使相对人权益遭受最小的损害。 合理性原则和正当程序原则,而不是符合比例原则。","k":"","kb":8,"kh":[[0,63],[182,240]]},{"id":"2019-12","y":2019,"t":"单","s":"2017年8月,杭州互联网法院成立。互联网法院将涉及网络的案件从现有审判体系中剥离,依托互联网技术,实现了“网上案件网上审”。对此,下列表述正确的是（ ）。","o":["法院对网络新科技的运用并不影响司法效率","法院对网络新科技的运用必然提升司法公正","互联网法院是网络新科技在司法领域运用的产物","法院运用网络新科技审理案件体现了司法的能动性"],"a":"C","e":"\u0001依据题干考查要点，正确表述为“互联网法院是网络新科技在司法领域运用的产物”。\u0002\nA✗ 法院对网络新科技的运用将会影响司法效率,网络简化了诉讼流程并免去了原被告的路途奔波,能有效提升司法效率\nB✗ 法院对网络新科技的运用可能提升也可能降低司法公正,司法能否公正,核心在于审判人员的法律素养和专业水准及依法审判的力度\nC✓ 互联网法院是网络新科技在司法领域运用的产物说法正确\nD✗ 司法的特点是被动性,终极性,中立性,形式性与专属性,并无能动性","k":"","kb":15,"kh":[[0,15],[105,170]]},{"id":"2019-42","y":2019,"t":"多","s":"法律不是万能的,导致法律局限性的主要原因有（ ）。","o":["法律的实现须具备一定的经济、政治和文化等条件","法律的稳定性与社会生活的变动性之间存在矛盾","法律的制定和实施受人的因素制约和影响","有些社会关系不适宜由法律调整"],"a":"ABCD","e":"\u0001法律的作用是保障和促进社会发展,但是法律也具有一定的局限性:法的调整范围是有限的,法律并不可以调整所有的社会关系。\u0002\nA✓ 以上种种,都导致了法的作用的局限性\nB✓ 法的特性与社会生活的现实之间存在着矛盾,法律具有抽象性与稳定性,而现实生活却是多变、具体的\nC✓ 法的制定和实施受人的因素的制约,法律的实现需要人去执行和适用,必须得到大檬社会成员的支持和配合\nD✓ 法律的作用是保障和促进社会发展,但是法律也具有一定的局限性:法的调整范围是有限的,法律并不可以调整所有的社会关系\n法的实施受政治、经济、文化等社会因素的制约。 因此,本题ABC","k":"","kb":7,"kh":[[0,10],[147,166]]},{"id":"2020-4","y":2020,"t":"单","s":"关于法的价值冲突及其解决,下列说法正确的是（ ）。","o":["司法中效率与公平处于同等位阶,无主次优劣之分","在解决生命权与财产权的冲突时,应采用“个案平衡”原则","秩序是法的基础性价值,当与自由、正义冲突时,秩序一律优先","为保护某个较为优越的价值而损害另一法益时,不得超过达此目的所必要的限度"],"a":"D","e":"\u0001生命权属于人权,是法律的基本价值,而财产权是非基本价值,所以当两者发生冲突时,应适用价值位阶原则。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 生命权属于人权,是法律的基本价值,而财产权是非基本价值,所以当两者发生冲突时,应适用价值位阶原则\nC✗ 就法律价值而言,法律的主要价值或基本价值包括秩序、自由、平等、人权、正义等,所以当秩序与自 2020年全国法律硕士(非法学)联考真题答案详解专业综合课由、正义冲突时,秩序一律优先的说法是错误…\nD✓ 比例原则,即指为保护某种较为优越的法律价值须侵害某一法益时,不得逾越达此目的所必要的程度比例原则\n当基本价值与非基本价值之间发生冲突时,应以基本价值为优位,而司法公正是维护正义的表现, 个案平衡原则,即指在处千同一位阶上的法律价值之间发生冲突时,必须综合考虑主体之间的特定情形、需求和利益,使个案的解决能够适当兼顾双方的利益。","k":"","kb":8,"kh":[[0,63],[76,141]]},{"id":"2021-11","y":2021,"t":"单","s":"我国《突发事件应对法》第十一条第一款规定:“有关人民政府及其部门采取的应对突发事件的措施,应当与突发事件可能造成的社会危害的性质、程度和范围相适应;有多种措施可供选择的,应当选择有利于最大程度地保护公民、法人和其他组织权益的措施。”这一规定体现的法律价值冲突处理原则是 （ ）。","o":["比例原则","效率原则","价值位阶原则","个案平衡原则"],"a":"A","e":"\u0001比例原则指为保护某种较为优越的法律价值须侵害某一法益时,不得逾越达此目的所必要的程度。\u0002\nA✓ 本题中,人民政府及其部门在保护更为优越的法律价值而需要损害公民、法人等的权益时,不得逾越达此目的所必要的程度,采取的措施要与突发事件可能造成的社会危害的性质、程度和范围相适应, 体现了法律价…\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选\n本题中,人民政府及其部门在保护更为优越的法律价值而需要损害公民、法人等的权益时,不得逾越达此目的所必要的程度,采取的措施要与突发事件可能造成的社会危害的性质、程度和范围相适应, 体现了法律价值冲突处理原则中的比例原则","k":"","kb":8,"kh":[[76,141],[142,181]]},{"id":"2021-44","y":2021,"t":"多","s":"关于当代中国社会主义法在构建和谐社会中的作用,下列表述正确的有（ ）。","o":["为维护社会的安定和秩序提供有力保障","为经济发展与自然环境的和谐提供制度支持","确定公平正义的标准,协调主体之间的利益关系","为诚信友善的实现提供良好的制度环境"],"a":"ABCD","e":"\u0001\" 当代中国社会主义法在构建社会主义和谐社会中的作用表现在以下方面:法对社会主义民主的实现具有重要作用。\u0002\nA✓ 法为维护社会的安定和秩序提供有力保障\nB✓ 法协调人与自然的关系,为经济发展与自然环境的和谐提供制度支持\nC✓ 法通过确认并保障正义标准的实现,协调主体之间的利益关系\nD✓ 法可以为诚信友爱的实现提供良好的制度环境\n法为激发主体的活力创造制度条件;","k":"","kb":8,"kh":[[0,63],[76,141]]},{"id":"2022-9","y":2022,"t":"单","s":"自由和秩序是当代法律的重要价值。对此,下列表述正确的是（ ）。","o":["自由和秩序之间不存在冲突","自由是人的本性,法律不应对自由进行限制","任意性规则不体现秩序价值","权义复合性规则既包含自由价值又包含秩序价值"],"a":"D","e":"\u0001秩序是指在一定的时间和空间范围内, 事物之间以及事物内部各要素之间相对稳定的结构状态。\u0002\nA✗ 自由和秩序之间存在着天然的冲突性\nB✗ 自由是人的本性,正如马克思所说\"自由确实是人的本质\"\"不自由对人来说就是一种真正的致命的危险\",但是自由不是绝对的,自由也要受到法律的限制\nC✗ \"在一定范围内\"便体现了秩序价值\nD✓ 权义复合性规则是指兼具授予权利、设定义务两种性质的法律规则,该规则既包含自由价值又包含秩序价值\n法律秩序就是通过法律调整建立起来的人与人、人与社会之间相对稳定、和谐有序的状态。 自由是指从受到束缚的状态之中摆脱出来,或不受约束的状态。 任意性规则是指在一定范围内,允许人们自行选择或协商确定法律关系中的权利义务内容的法律规则。","k":"","kb":8,"kh":[[0,63],[76,141]]},{"id":"2023-13","y":2023,"t":"单","s":"许某和常某就网络“暗刷流量”达成合意并签订合同。常某提供服务后,许某未按约定支付报酬,常某诉至法院。法院经审理认为,“暗刷流量”行为侵害了不特定市场竞争者和不特定网络用户的利益,损害了社会公共利益,故双方订立的合同无效,判决驳回常某的诉讼请求。对此,下列说法不正确的是（ ）。","o":["契约行为应受到法律的规范","该判决有助于净化网络环境","“流量”可以成为法律关系的客体","判决驳回诉讼请求是对常某的法律制裁"],"a":"D","e":"\u0001认定合同无效并驳回诉讼请求属于消极否定性民事法律评价，并非对当事人的法律制裁。\u0002\nA✗ 合同违反公序良俗与社会公共利益即被认定无效，说明\u0001契约自由须受法律规范约束\u0002，正确\nB✗ 否定“暗刷流量”黑色产业链效力，有助于清理网络虚假流量、\u0001净化网络环境\u0002，正确\nC✗ 网络数据、虚拟空间利益与服务成果能够满足特定需求，\u0001可以成为法律关系的客体\u0002，正确\nD✓ 法律制裁须以追究违法责任并施以惩罚强制措施为特征，\u0001单纯宣告合同无效并驳回请求不属于法律制裁\u0002\n注意区分：\u0001合同无效\u0002是法律效力评价（恢复原状或不受保护），而非罚款、赔偿或刑罚意义上的\u0001法律制裁\u0002。","k":"","kb":8,"kh":[[0,63],[76,141]]},{"id":"2023-44","y":2023,"t":"多","s":"村民小丽在家庭纷争中不能确定自己是否遭遇了家庭暴力,去咨询本村“法律明白人”老张。老张将《反家庭暴力法》第2条的规定告诉小丽:家庭暴力,是指家庭成员之间以殴打、捆绑、残害、限制人身自由以及经常性漫骂、恐吓等方式实施的身体、精神等侵害行为。对此,下列表述正确的有（ ）。","o":["老张的解答属于法的适用","法律概念可以与日常生活概念不同","“法律明白人”普法释法活动有助于法治社会建设","明确家庭暴力的概念有助于人们准确理解《反家庭暴力法》的内容"],"a":"BCD","e":"\u0001“法律明白人”普法有助于法治社会建设，也体现法律概念的专业界定功能，但民间解答不属于司法适用。\u0002\nA✗ 法的适用（司法）专指\u0001人民法院和人民检察院\u0002依法定职权和程序处理具体案件的活动，村民“法律明白人”解答属于普法守法范畴\nB✓ \u0001法律概念\u0002为精确界定构成要件，其内涵外延常较日常生活用语更明确严谨（如将经常性恐吓漫骂亦界定为家暴）\nC✓ 培养乡村“法律明白人”开展日常释法普法宣传，是推进\u0001法治社会建设\u0002和基层治理的重要抓手\nD✓ 通过明确“家庭暴力”的法定概念边界，有助于公众和执法者\u0001准确理解与实施《反家庭暴力法》\u0002\n辨析核心概念：民间咨询与普法是\u0001守法宣传\u0002，既非“法的适用”（仅法检专有），亦非具有约束力的\u0001正式法律解释\u0002。","k":"","kb":15,"kh":[[0,15],[105,170]]},{"id":"2024-1","y":2024,"t":"单","s":"下列对古代思想家法律论断的理解,正确的是（ ）。","o":["尺寸也,绳墨也,规矩也·.........·谓之法(《管子》)揭示了法的阶级本质","礼乐不兴则刑罚不中(《论语》)体现了法确认和保障自由","治之经,礼与刑,君子以修百姓宁(《荀子》)体现了德法合治思想","不杀无辜,不失有罪(《墨子》)揭示了法的作用的局限性"],"a":"C","e":"\u0001《荀子》“治之经，礼与刑，君子以修百姓宁”把礼教与刑罚并列为治国大纲，鲜明体现了德法合治思想。\u0002\nA✗ 《管子》以“尺寸、绳墨、规矩”喻法，揭示的是法的\u0001普遍性与度量衡般客观规范性尺度\u0002，并未揭示法的阶级本质\nB✗ 《论语》“礼乐不兴则刑罚不中”强调礼教失序会导致刑罚失当，反映的是\u0001礼治与道德教化优先\u0002，而非自由保障\nC✓ 《荀子》主张\u0001隆礼重法、礼法并施\u0002，“礼与刑”共同安民治国正是我国古代德法合治的经典表述\nD✗ 《墨子》“不杀无辜，不失有罪”主张严格准确惩罚犯罪、避免枉纵，体现的是\u0001司法公正与罪刑相应\u0002思想\n先秦诸子经典法思想辨析：管子重\u0001规范尺度\u0002，孔子重\u0001德礼教化\u0002，荀子主\u0001隆礼重法\u0002，墨子倡\u0001赏善罚暴\u0002。","k":"","kb":7,"kh":[[0,10],[147,166]]},{"id":"2024-43","y":2024,"t":"多","s":"甲酒后驾车撞伤人逃至其亲戚乙家,乙是一位律师,他对甲说你的行为已经构成了交通肇事逃逸,应该马上自首,争取从轻处理。甲遂在乙陪同下前往公安机关自首。该事件中体现的法的作用有（ ）。","o":["评价作用","教育作用","指引作用","强制作用"],"a":"ABCD","e":"\u0001乙对甲的行为定性与劝导自首体现了评价、指引、教育及司法机关随后的强制作用。\u0002\nA✓ 律师乙对照刑法条款判断甲的行为“已构成交通肇事逃逸”，正是以法衡量评价他人行为合法与否的\u0001评价作用\u0002\nB✓ 经乙讲解法律后果（自首可争取从轻处理），使甲形成守法意识并纠正错误行为，体现了法的\u0001教育作用\u0002\nC✓ 甲对照刑法自首与量刑规则作出“前往公安机关自首”的自我行为选择，体现了法的\u0001指引作用\u0002\nD✓ 交通肇事逃逸面临的刑事追诉制裁威慑，以及甲投案后公安司法机关对其依法追究法律责任，共同体现法的\u0001强制作用\u0002\n注意法的规范作用实务情景考察往往融于一体：\u0001评价他人（评定性质）\u0002、\u0001教育示范\u0002、\u0001指引自身选择\u0002、\u0001强制制裁威慑\u0002。","k":"","kb":7,"kh":[[11,121]]},{"id":"2025-1","y":2025,"t":"单","s":"马克思说:“法典就是人民自由的圣经。”对此,下列说法正确的是（ ）。","o":["离开法典就无法保障个人的自由","自由与法的其他价值发生冲突时具有优先性","法律只能通过权利规定来设定个人享有自由的范围","为保障个人自由,法律应当划定国家权力本身的合理权限范围"],"a":"D","e":"\u0001自由与法的其他价值发生冲突时, 并非总是具有优先性,人权和正义是法治保障的核心和标尺。\u0002\nA✗ 除了法典,还有道德、习俗等因素也在一定程度上保障个人自由\nB✗ 自由与法的其他价值发生冲突时, 并非总是具有优先性,人权和正义是法治保障的核心和标尺\nC✗ 法律设定个人享有自由的范围,不仅仅通过权利规定,还可以通过义务规定等多种方式\nD✓ 为了保障个人自由,需要法律划定国家权力的合理权限范围,防止国家滥用权力侵犯个人自由\n虽然法典对于保障个人自由有重要作用,但\u0001“离开法典就无法保障个人的自由”\u0002说法过于绝对。","k":"","kb":8,"kh":[[0,63],[76,141]]},{"id":"2026-2","y":2026,"t":"单","s":"下列说法中,体现法的作用的局限性的是（ ）。","o":["法不阿贵,绳不挠曲","凡法事者,操持不可以不正","奉法者强则国强,奉法者弱则国弱","得其法而不得其人,则法必不能济"],"a":"D","e":"\u0001题意为法律再好,没有合格执法者也无法落地,体现法依赖人实施,是法的局限性。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ 符合题意及现行制度规定（\u0001得其法而不得其人,则法必不能济\u0002）\nABC 均强调法律的强大作用,无关局限。","k":"","kb":7,"kh":[[0,10],[147,166]]},{"id":"2026-8","y":2026,"t":"单","s":"“非正义的法律并非法律”,关于这一说法,下列表述不正确的是（ ）。","o":["意味着正义是法律的核心价值","前一个“法律”指实在法","说明正义是评价法律的唯一标准","契合自然法学派的基本立场"],"a":"C","e":"\u0001正义是重要评价标准,但绝非唯一标准,法律还要兼顾秩序、效率等。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✓ 正义是重要评价标准,但绝非唯一标准,法律还要兼顾秩序、效率等\nD✗ AB自然法\"恶法非法\"内涵","k":"","kb":8,"kh":[[0,63],[76,141]]},{"id":"2026-11","y":2026,"t":"单","s":"根据全国人大常委会通过的《关于授权国务院在中国（新疆）自由贸易试验区暂时调整适用〈中华人民共和国种子法〉有关规定的决议》：“在中国（新疆）自由贸易试验区从事农作物种子进出口业务的，其种子经营许可证核发权限由国务院农业农村主管部门下放至新疆维吾尔自治区人民政府农业农村主管部门。”对此，下列表述正确的是（ ）。","o":["该规定是全国人大常委会行使国家立法权的具体体现","该规定反映国务院有权决定变通法律在地方的适用","该规定赋予中国(新疆)自由贸易试验区民族自治地方的自治权","该规定意味着《种子法》在中国(新疆)自由贸易试验区暂停适用"],"a":"A","e":"\u0001全国人大常委会授权调整法律适用属于立法活动,行使国家立法权。\u0002\nA✓ 全国人大常委会授权调整法律适用属于立法活动,行使国家立法权\nB✗ 国务院无权自行变通\nC✗ 自贸区变通≠民族自治权\nD✗ 仅调整部分条款,不是整部法律暂停","k":"","kb":8,"kh":[[0,63],[76,141]]}]},{"sub":"中国宪法学","name":"公民基本权利（监督、财产权、社文与义务）","w":2.4,"w5":1.8,"wh":1.1,"bt":"回补","pt":"近5年翻倍至1.8分·2026客观0分回补+文化制度","L":17,"qs":[{"id":"2006-53","y":2006,"t":"多","s":"根据我国现行宪法的规定,退休人员的生活受到（ ）。","o":["国家的保障","社会的保障","企事业组织的保障","国家机关的保障"],"a":"AB","e":"\u0001《宪法》第44 条规定, 国家依照法律规定实行企业事业组织的职工和国家机关工作人员的退休制度。\u0002\nA✓ 符合题意及现行制度规定（\u0001国家的保障\u0002）\nB✓ 退休人员的生活受到国家和社会的保障\nC✗ \u0001《宪法》\u0002第44 条规定, 国家依照法律规定实行企业事业组织的职工和国家机关工作人员的退休制度\nD✗ 与题干设问或现行制度要件不符，故不选","k":"","kb":36,"kh":[[189,244],[254,301]]},{"id":"2007-58","y":2007,"t":"多","s":"下列表述中,符合我国现行宪法规定的有（ ）。","o":["父母有抚养教育子女的义务","父母有抚养教育未成年子女的义务","子女有赡养扶助父母的义务","成年子女有赡养扶助父母的义务"],"a":"BD","e":"\u0001公民的基本义务宪法第 49 条第 3 款规定:\"父母有抚养教育未成年子女的义务,成年子女有赡养扶助父母的义务。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 公民的基本义务宪法第 49 条第 3 款规定:\"父母有抚养教育未成年子女的义务,成年子女有赡养扶助父母的义务\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ 符合题意及现行制度规定（\u0001成年子女有赡养扶助父母的义务\u0002）","k":"","kb":36,"kh":[[0,23],[310,371]]},{"id":"2009-30","y":2009,"t":"单","s":"根据我国现行宪法和法律的规定,我国的兵役制度是（ ）。","o":["自愿兵役制度","义务兵役制度","义务兵役制与志愿兵役制相结合,以义务兵役制为主","义务兵役制与志愿兵役制相结合,以志愿兵役制为主"],"a":"C","e":"\u0001根据《宪法》第55 条规定,保卫祖国、抵抗侵略是中华人民共和国每一个公民的神圣职责。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✓ 符合题意及现行制度规定（\u0001义务兵役制与志愿兵役制相结合,以义务\u0002）\nD✗ 与题干设问或现行制度要件不符，故不选\n依照法律服兵役和参加民兵组织是中华人民共和过公民的光荣义务。 \u0001《兵役法》\u0002第2 条规定,中华人民共和国实行义务兵与志愿兵相结合、民兵与预备役相结合的兵役制度。 \u0001《兵役法》\u0002第19 条规定,义务兵兵服役期满,根据军队需要和本人志愿,经团级以上单位批准,可以改为志愿兵。","k":"","kb":36,"kh":[[24,115]]},{"id":"2011-24","y":2011,"t":"单","s":"下列选项中,属于我国宪法规定的文化教育权利的是（ ）。","o":["言论自由","科学研究的自由","出版自由","宗教信仰自由"],"a":"B","e":"\u0001《宪法》第46条第1款规定:\"中华人民共和国公民有受教育的权利和义务。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ \" 第47条规定:\"中华人民共和国公民有进行科学研究、文学艺术创作和其他文化活动的自由\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 言论自由和出版自由属于政治权利,宗教信仰自由属于公民的一项独立的基本权利\n国家对于从事教育、科学技术文学艺术和其他文化事业的公民的有益于人民的创造性工作,给以鼓励和帮助。 \"所以,公民文化教育权主要包括公民受教育的权利和义务以及公民有进行科研、文艺创作和其他文化活动的自由。","k":"","kb":34,"kh":[[0,22],[247,290]]},{"id":"2014-24","y":2014,"t":"单","s":"根据我国《宪法》,国家兴办各种学校,发展教育事业,应当予以普及的教育类型是（ ）。","o":["学前教育","初等义务教育","中等教育","高等教育"],"a":"B","e":"\u0001《宪法》第19条规定,国家举办各种学校,普及初等义务教育,发展中等教育,职业教育和高等教育,并且发展学前教育。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ \u0001《宪法》第19条\u0002规定,国家举办各种学校,普及初等义务教育,发展中等教育,职业教育和高等教育,并且发展学前教育\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选\n(法条原文,应背诵。","k":"","kb":36,"kh":[[24,115]]},{"id":"2017-53","y":2017,"t":"多","s":"根据现行《宪法》,下列关于土地所有权、使用权的表述,正确的有（ ）。","o":["城市的土地属于国家所有","宅基地和自留地、自留山属于集体所有","土地的所有权可以依照法律规定转让","国家可以依照法律或者法规对土地实行征收或者征用并给予赔偿"],"a":"AB","e":"\u0001《宪法》第10 条规定:城市的土地属于国家所有。\u0002\nA✓ \u0001《宪法》\u0002第10 条规定:城市的土地属于国家所有\nB✓ 宅基地和自留地、自留山,也属于集体所有\nC✗ 根据\u0001《宪法》\u0002的规定,土地使用权可以依照法律规定转让,但土地所有权不可以转让\nD✗ 国家可以对土地实行征收或征用并给予补偿,不是给予赔偿\n农村和城市郊区的土地,除由法律规定属于国家所有的以外,属于集体所有; 国家为了公共利益的需要,可以依照法律规定对土地实行征收或者征用并给予补偿。 任何组织或者个人不得侵占、买卖或者以其他形式非法转让土地。 土地的使用权可以依照法律的规定转让。 一切使用土地的组织和个人必须合理地利用上地。","k":"","kb":28
