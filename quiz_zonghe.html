","e":"\u0001清代州县（知州、知县）是包括死刑案件在内一切诉讼案件的初审司法机构。\u0002\nA✓ 清代司法审级分州县、府、省按察司、总督巡抚、中央刑部等，其中\u0001州县官为一审/初审机构\u0002（杖以下可自断，徒以上须上报）\nB✗ 府级机构承担州县上报徒流死刑案件的复核复审职责，并非死刑初审机关\nC✗ 省按察司负责全全省司法审转复核，徒罪由此即可定拟申详，死刑继续上报\nD✗ 总督巡抚负责复核死刑案件并上奏中央三法司及秋审朝审，并非初审机构\n清代地方审转复核链条：\u0001州县初审\u0002→府直隶州→按察司（徒罪止）→督抚→\u0001中央刑部/三法司\u0002复核→秋审/朝审。","k":"","kb":49,"kh":[[353,399]]},{"id":"2025-31","y":2025,"t":"单","s":"根据《大清律例》及相关法律、民间习惯, “以价易出,约限回赎”的法律行为称为（ ）。","o":["典","卖","质","佃"],"a":"A","e":"\u0001典与卖的核心区别是是否可以回赎。\u0002\nA✓ 根据大清律例,\"以价易出,约限回赎者,曰典\"\nB✗ 典与卖的核心区别是是否可以回赎\nC✗ 质是西周时期买卖契约\nD✗ 佃中不涉及回赎权","k":"","kb":49,"kh":[[260,298]]},{"id":"2025-38","y":2025,"t":"单","s":"明代建立了较为完备的会审制度,其中“圆审”又称为（ ）。","o":["热审","九卿会审","朝审","三司推事"],"a":"B","e":"\u0001明朝对于特别重大的案件或已判决但囚犯仍翻供不服之案,则由皇帝令六部尚书及通政使司的通政使、都察院左都御使、大理寺卿会审,称为\"圆审\",但判决仍须奏请皇帝批准。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 圆审又称九卿会审\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 唐朝中央或地方发生重大疑难案件时,皇帝特诏大理寺、刑部、御史台的长官会同审理,称\"三司推事\"\n朝审是对已决在押囚犯的会官审理,是古代录囚制度的延续和发展。 热审是每年暑天小满后十余天,由宦官、锦衣卫会同三法司会审囚犯,一般轻罪决罚后立即释放,徒流罪减等发落,重囚可疑及枷号者则请旨定夺。","k":"","kb":49,"kh":[[199,248],[328,353]]},{"id":"2026-31","y":2026,"t":"单","s":"清乾隆年间,江南某县乡民甲因借贷纠纷与乙发生斗殴,致乙手臂骨折。知县以斗伤罪拟判处甲杖一百、徒三年,并对借贷纠纷进行调解。依照清朝法律, 本案审理结案的方式应是（ ）。","o":["伤害案和借贷案均可由县衙自行审结","借贷案可由县衙自行审结,伤害案应逐级上报至督抚","伤害案可由县衙自行审结,借贷案应逐级上报至督抚","伤害案和借贷案均应逐级上报至督抚"],"a":"B","e":"\u0001清代户婚田土借贷州县自理。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 符合题意及现行制度规定（\u0001借贷案可由县衙自行审结,伤害案应逐级\u0002）\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选\n斗伤徒罪重刑案,必须逐级上报督抚复核。","k":"","kb":49,"kh":[[9,109]]}]},{"sub":"中国宪法学","name":"政权组织形式与选举制度","w":1.7,"w5":1.8,"wh":2.7,"bt":"","pt":"基层立法联系点/代表履职稳态1.8分/年","L":47,"qs":[{"id":"2005-24","y":2005,"t":"单","s":"甲县人民代表大会代表张某,在他当选为代表一年后,迁入乙县居住,他应（ ）。","o":["享有甲县人民代表大会代表资格到届满","自然转任乙县人民代表大会代表","按正常工作调动手续转任乙县人民代表大会代表","被终止甲县人民代表大会代表资格"],"a":"D","e":"\u0001选举法第51 条第2 款规定:\"地方各级人民代表大会代表在任期内调离或者迁出本行政区域的, 其代表资格自行终止,缺额另行补选。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 乙县人大代表也是选民直接选举产生的,张某就任乙县人大代表,必须经过选民选举,而不能\"自然转任\"或者\"按正常工作调动手续转任\"\nD✓ 选举法第51 条第2 款规定:\"地方各级人民代表大会代表在任期内调离或者迁出本行政区域的, 其代表资格自行终止,缺额另行补选\n一般地,选民只能在户口所在地参加选举,并被选举为户口所在地的地方人大代表; 如果户口迁出原行政区域,自动丧失作为原行政区域人大代表的资格,而不再保留, 排除。","k":"","kb":31,"kh":[[149,193],[318,391]]},{"id":"2005-25","y":2005,"t":"单","s":"我国的根本政治制度是（ ）。","o":["社会主义制度","人民民主专政制度","人民代表大会制度","中国共产党领导的多党合作与政治协商制度"],"a":"C","e":"\u0001社会主义制度是根本制度。\u0002\nA✗ 社会主义制度是根本制度\nB✗ 人民民主专政是国体\nC✓ 人民代表大会制度是根本政治制度\nD✗ 国共产党领导的多党合作与政治协商制度是我国的政党制度,也是我国基本政治制度之一","k":"","kb":30,"kh":[[0,44],[44,81]]},{"id":"2005-26","y":2005,"t":"单","s":"下列主体中,依照我国选举法不列入选民名单的是（ ）。","o":["精神病患者某甲","吸毒者某乙","老年人某丙","被刑事拘留的某丁"],"a":"A","e":"\u0001选举法第26 条第2 款规定:\"精神病患者不能行使选举权利的,经选举委员会确认,不列入选民名单。\u0002\nA✓ 选举法第26 条第2 款规定:\"精神病患者不能行使选举权利的,经选举委员会确认,不列入选民名单\nB✗ 的人,如果依法享有选举权利,应当列入选民名单\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 被刑事拘留的某丁,可能被决定停止行使选举权利,但必须满足以下条件:因危害国家安全案或者其他严重刑事犯罪案被羁押,经人民检察院批准也应排除\n\"因为精神病患者不能行使选举权利,因此不列入选民名单。 而享有选举权利的条件包括:中国公民、年满十八周岁和没有被剥夺政治权利。 至于其是否吸毒以及是否年龄特大,不在考虑之列。","k":"","kb":31,"kh":[[149,193],[273,318]]},{"id":"2005-28","y":2005,"t":"单","s":"与国家结构形式相比,政权组织形式虽然也属于国家形式的范畴,但特点主要在于（ ）。","o":["国家对权力的配置","国家对权利的配置","国家对领土的划分","国家对民族关系的调整"],"a":"A","e":"\u0001政权组织形式与国家结构形式都属于国家形式,但二者的关注侧重点不同。\u0002\nA✓ 符合题意及现行制度规定（\u0001国家对权力的配置\u0002）\nB✗ 国家对权利的配置,集中体现在宪法基本权利的规定\nC✗ 国家对领土的划分属于行政区划制度\nD✗ 国家对民族关系的调整集中体现在国家的基本民族政策\n前者是横向的,后者是纵向的。 前者关注的是同一级别的不同国家机关之间的关系,而后者关注的是国家的整体与部分、中央与地方的关系。 但不管是前者,还是后者都是关于权力划分的关系。 前者关注国家权力在立法机关、行政机关和司法机关之间的分配; 后者关注国家权力在中央与地方之间的分配。","k":"","kb":30,"kh":[[0,44]]},{"id":"2006-22","y":2006,"t":"单","s":"某选区在举行人民代表大会代表直接选举时,应参加选举的选民为 25000 人,实际参加选举的选民为 12350 人。该选区三位候选人甲、乙、丙最后实际获得选票依次为 6250 票、3500 票、2600 票。依照法律规定,选举结果是（ ）。","o":["甲当选","乙当选","丙当选","三人均不得当选"],"a":"D","e":"\u0001直接选举,参加选举的选民数需占所有选民数的半数以上该选举方可有效。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ 符合题意及现行制度规定（\u0001三人均不得当选\u0002）","k":"","kb":31,"kh":[[149,193],[318,391]]},{"id":"2006-57","y":2006,"t":"多","s":"下列关于政权组织形式与国体关系的表述,正确的有（ ）。","o":["政权组织形式与国体之间是形式与内容的关系","任何国体均有与之相适应的政权组织形式","国体从属于政权组织形式","只有借助于政权组织形式,国体才能外化出来"],"a":"ABD","e":"\u0001依据题干与现行制度规定综合判断作答。\u0002\nA✓ 符合题意及现行制度规定（\u0001政权组织形式与国体之间是形式与内容的\u0002）\nB✓ 符合题意及现行制度规定（\u0001任何国体均有与之相适应的政权组织形式\u0002）\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ 政权组织形式及称政体,政体从属于国体,一般来说有什么样的国体就有什么样的与之相适应的政体,但政体对国体具有反作用也就是说,只有借助于政体国体才能外化出来,统治阶级才能将自己的意志形成和上升为…","k":"","kb":30,"kh":[[0,44]]},{"id":"2007-23","y":2007,"t":"单","s":"某选区直接选举人民代表大会代表,应选代表名额为 2 名。第一次投票结果,候选人得票从多到少排序为甲、乙、丙,其中仅有甲获得半数以上选票。对此情况,下列处理意见符合我国宪法和法律规定的是 （ ）。","o":["宣布甲、乙当选","宣布甲当选,同时以乙为候选人另行选举","宣布甲当选,同时以乙、丙为候选人另行选举","宣布无人当选,同时以甲、乙、丙为候选人另行选举"],"a":"C","e":"\u0001选举的组织和程序选举法第 43 条规定,在选民直接选举人民代表大会代表时,选区全体选民的过半数参加投票,选举有效。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✓ 符合题意及现行制度规定（\u0001宣布甲当选,同时以乙、丙为候选人另行\u0002）\nD✗ 与题干设问或现行制度要件不符，故不选\n代表候选人获得参加投票的选民过半数的选票时,始得当选。 获得过半数选票的当选代表的人数少于应选代表的名额时,不足的名额另行选举。 另行选举时,根据在第一次投票时得票多少的顺序,按照选举法规定的差额比例,确定候选人名单。 如果只选一人,候选人应为=人。","k":"","kb":31,"kh":[[87,148],[318,391]]},{"id":"2007-26","y":2007,"t":"单","s":"社会主义政治文明建设的根本途径是 （ ）。","o":["坚持民主集中制原则","完善人民代表大会制度","依据宪法和法律治理国家","加强物质和精神文明建设"],"a":"C","e":"\u0001政治文明建设坚持民主集中制和完善人民代表大会制度都是社会主义政治文明建设的内容,但不是全部,因此不可能成为社会主义政治文明的根本途径。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 政治文明建设坚持民主集中制和完善人民代表大会制度都是社会主义政治文明建设的内容,但不是全部,因此不可能成为社会主义政治文明的根本途径\nC✓ 社会主义政治文明建设的根本途径是依法治国,即依据宪法和法律治理国家\nD✗ 物质文明建设和精神文明建设是政治文明建设的物质保障和精神动力,而不是根本途径,相关表述不\n故 该项、该项 硕不正确。 物质文明建设和精神文明建设是政治文明建设的物质保障和精神动力,而不是根本途径,\u0001“加强物质和精神文明建设”\u0002不正确。","k":"","kb":30,"kh":[[0,44],[81,129]]},{"id":"2007-29","y":2007,"t":"单","s":"在我国,人民代表大会上下级之间的关系是 （ ）。","o":["领导关系","指导关系","制约关系","从属关系"],"a":"B","e":"\u0001上下级人民代表大会之间的关系‘ 全国人民代表大会是最高国家权力机关,地方各级人民代表大会是地方国家权力机关。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 符合题意及现行制度规定（\u0001指导关系\u0002）\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选\n全国人大和地方各级人大之间以及地方各级人大之间不存在隶属和领导关系,上级人大有权依照宪法和法律监督下级人大的工作,这种监督并非制约关系。","k":"","kb":37,"kh":[[0,30],[492,581]]},{"id":"2008-25","y":2008,"t":"单","s":"下列选项中,不属于我国选民资格限制条件的是（ ）。","o":["年龄的限制","政治条件的限制","国籍的限制","居住期限的限制"],"a":"D","e":"\u0001《宪法》第34 条规定,中华人民共和国年满18 周岁的公民,不分民族、种族、性别、职业、家庭出身、宗教信仰、教育程度、财产状况、居住期限,都有选举权和被选举权。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 三是政治条件的限制,即依照法律未被剥夺政治权利\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ 同时,根据该条,民族、种族、性别、职业、家庭出身、宗教信仰、教育程度、财产状况、居住期限并非充当选民的限制条件\n但是依照法律被剥夺政治权利的人除外。 据此,选民资格限制条件有三:一是年龄限制,即年满18 周岁; 二是国籍限制,即中华人民共和国公异;","k":"","kb":31,"kh":[[149,193],[273,318]]},{"id":"2008-53","y":2008,"t":"多","s":"下列选项中,可以列入选民名单的有（ ）。","o":["精神病患者甲","被判处有期徒刑三年的乙","被监视居住的丙","被剥夺政治权利的丁"],"a":"BC","e":"\u0001根据《选举法》第26 条,对死亡和依照法律被剥夺政治权利的人,从选民名单上除名。\u0002\nA✗ 精神病患者不能行使选举权利的,经选举委员会确认,不列入选民名单\nB✓ 的乙、丙,享有选举权利,应当列入选民名单\nC✓ 的乙、丙,享有选举权利,应当列入选民名单\nD✗ 根据\u0001《选举法》\u0002第26 条,对死亡和依照法律被剥夺政治权利的人,从选民名单上除名\n据此,相关表述 不能选。","k":"","kb":31,"kh":[[87,148],[273,318]]},{"id":"2008-57","y":2008,"t":"多","s":"下列关于政权组织形式的表述,能够成立的有（ ）。","o":["政权组织形式决定国家性质","政权组织形式是实现国家权力的形式","政权组织形式是形成全民意志的方式","没有适当的政权组织形式,国家管理就无法有效进行"],"a":"BD","e":"\u0001政权组织形式是实现国家权力的形式(),在国家制度中具有极为重要的地位。\u0002\nA✗ 政权组织形式只是一种形式,受国家性质所决定,一般来说,有什么样的国家性质就有与之相适应的政权组织形式\nB✓ 政权组织形式是实现国家权力的形式(\nC✗ \"全民意志\"错误,应为\"统治阶级意志\"故\nD✓ 没有适当的政权组织形式,统治阶级是无法对国家进行有效统治的(\n同时, 政权组织形式对国家性质也具有反作用,任何国家性质都要借助于特定的政权组织形式来的映,具体来说就是将统治阶级的意志通过一个正当程序转化为国家意志。 \u0001“政权组织形式决定国家性质”\u0002 的话说反了,“政权组织形式是形成全民意志的方式” 中\"全民意志\"错误,应为\"统治阶级意志\"故错误。","k":"","kb":30,"kh":[[0,44]]},{"id":"2009-21","y":2009,"t":"单","s":"与西方会议制度比较,下列选项中属于我国人民代表大会制度特点的是（ ）。","o":["两院制","代表的专职制","人民代表大会的全权制","代表任期的现任制"],"a":"C","e":"\u0001人民代表大会作为国家权力机关而成为国家机构的核心,其在地位上高于其他国家机关,一切国家机关都在人民代表大会之下。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✓ 选项正确我国为规定人民代表大会代表任期的限制问题\nD✗ 与题干设问或现行制度要件不符，故不选\n我国人民代表大会实行一院制,其代表实行兼职制。","k":"","kb":30,"kh":[[0,44],[44,81]]},{"id":"2009-29","y":2009,"t":"单","s":"选民对公布的选民名单有不同意见的,可以向选委会提出申诉,选委会对申诉的意见作出处理意见的期限是（ ）。","o":["2 日内","3 日内","5 日内","10 日内"],"a":"B","e":"\u0001《选举法》第28 条规定,对于公布的的选民名单有不同意见的,可以向选委会提出申诉。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 选举委员会对申诉意见,应在3 日内作出处理决定\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选","k":"","kb":31,"kh":[[0,19],[273,318]]},{"id":"2009-54","y":2009,"t":"多","s":"我国选举权的平等性原则强调实质平等,具体体现为（ ）。","o":["农村人大代表所代表的人口数四倍于城市人大代表的人口数","全国人大代表中每一个少数民族至少有有一名代表","凡年满18 周岁的公民都享有选举权","精神病患者也享有选举权"],"a":"AB","e":"\u0001选举权的原则,选举权的平等性原则是\"公民在法律面前一律平等\"原在选举制度中的具体体现。\u0002\nA✓ 选项正确第17 条规定, 全国少数民族应选全国人民代表大会代表,由全国人民代表大会常务委员会按照少数民主的人口数和分布等情况, 分配给各县、自治区、自辖市的人民代表大会选出\nB✓ 选项正确第3 条规定, 中华人民共和国年满18 周岁的公民,不分民族、种族、性别、职业、家庭出身、宗教信仰、教育程度、财产情况和居住期限,都有选举权和被选举权\nC✗ 本题考查选举权的原则,选举权的平等性原则是\"公民在法律面前一律平等\"原在选举制度中的具体体现\nD✗ 第26 条规定,精神病患者不能行使选举权利的,经选举委员灰确认,不列入选民名单\n律面前一律平等\"原在选举制度中的具体体现。 根据选\u0001《选举权》\u0002第12 条规定,自治州、县、自治县的人民代表大会的名额,有本级人民代表大会常务委员会按照农村每一代表所代表的人口数四倍于镇每一代表所代表的人口数的原则分配。 人口特少的民族,至少应有代表一人。","k":"","kb":31,"kh":[[87,148],[149,193]]},{"id":"2009-57","y":2009,"t":"多","s":"根据我国现行宪法和法律的规定,全国人民代表大会提出罢免案必须符合的法定条件有（ ）。","o":["只能针对由全国人民代表大会任免的人选范围","必须有10 名代表联名","必须说明罢免的理由","采用书面形式"],"a":"ACD","e":"\u0001全国人大代表的罢免权。\u0002\nA✓ \u0001《全国人民代表大会组织法》\u0002第15 条规定,全国人民代表大会三个以上的代表团或者十分之一以上的代表,可以提出对于全国人民代表大会常务委员会的组织人员,中华人民共和国主席、副主席,国务院和中央军…\nB✗ 与题干设问或现行制度要件不符，故不选\nC✓ 符合题意及现行制度规定（\u0001必须说明罢免的理由\u0002）\nD✓ 符合题意及现行制度规定（\u0001采用书面形式\u0002）\n\u0001《全国人民代表大会组织法》\u0002第15 条规定,全国人民代表大会三个以上的代表团或者十分之一以上的代表,可以提出对于全国人民代表大会常务委员会的组织人员,中华人民共和国主席、副主席,国务院和中央军事委员会的组成人员,最高人民法院院长和最高人民检察院检察长的罢免案, 由主席团提请大会审议。","k":"","kb":37,"kh":[[0,30],[492,581]]},{"id":"2010-16","y":2010,"t":"单","s":"现代国家的政体形式大多数是（ ）。","o":["议会君主制","二元君主制","共和制","人民代表制"],"a":"C","e":"\u0001君主制包括议会君主制和二元君主制。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✓ 符合题意及现行制度规定（\u0001共和制\u0002）\nD✗ 共和制是现代国家所普遍采用的政体,包括总统制、议会制、半总统制和人民代表制\n国家政体在形式上表现为两大类,即君主制和共和制。 AB项属于君主制,\u0001“人民代表制”\u0002过于片面。","k":"","kb":30,"kh":[[0,44]]},{"id":"2010-54","y":2010,"t":"多","s":"我国选举制度中选举权的平等性具体表现在 。","o":["正在服刑的人员享有选举权","每个选民投出的选票具有同等的法律效力","每个选民在每次投票中只享有一个投票权","汉族代表和少数民族代表所代表的人口数存在适当差别"],"a":"BCD","e":"\u0001选举权的平等性原则是指在选举中,一切选民具有同等的法律地位,法律在程序上对所有的选民同等对待,选民所投的选票具有同等的法律效力的原则。\u0002\nA✗ 本身没有问题,服刑人员只要没有被剥夺政治权利,就可以享有选举权,但是体现的是选举权的普遍性原则,而非平等性原则\nB✓ 选举权的平等性原则是指在选举中,一切选民具有同等的法律地位,法律在程序上对所有的选民同等对待,选民所投的选票具有同等的法律效力的原则\nC✓ 在一次选举中,选民平等地享有投票权\nD✓ 保护选举中处于弱势地位的选民,我国\u0001《选举法》\u0002规定了汉族代表和少数民族代表所代表的人口数存在适当差别,做到了实质公平和形式公平的统一,根据以上表述,BC\n其基本要求是:除法有特别规定以外,公民平等地享有选举权和被选举权; 每一代表所代表的选民人数相同; 代表在代表机关中地位平等; \u0001“正在服刑的人员享有选举权”\u0002本身没有问题,服刑人员只要没有被剥夺政治权利,就可以享有选举权,但是体现的是选举权的普遍性原则,而非平等性原则,","k":"","kb":31,"kh":[[0,19],[149,193]]},{"id":"2010-56","y":2010,"t":"多","s":"根据我国有关法律规定,全国人民代表大会预备会议的主要内容有（ ）。","o":["选举主席团和秘书长","决定是否举行秘密会议","通过会议议程","决定委员长人选"],"a":"AC","e":"\u0001全国人民代表大会每次会议举行预备会议,选举本次会议的主席团和秘书长,通过本次会议的议程和其他准备事项的决定。\u0002\nA✓ 全国人民代表大会每次会议举行预备会议,选举本次会议的主席团和秘书长,通过本次会议的议程和其他准备事项的决定\nB✗ 全国人大会议公开进行,必要时,经主席团和各代表团团长会议决定, 可以进行秘密会议\nC✓ 符合题意及现行制度规定（\u0001通过会议议程\u0002）\nD✗ 委员长的人选由全国人民代表大会从代表中选举产生\n预备会议由全国人大常委会主持。 因此\u0001“决定是否举行秘密会议”\u0002","k":"","kb":37,"kh":[[0,30],[199,378]]},{"id":"2011-21","y":2011,"t":"单","s":"某选区在基层人大代表的换届选举中,应选代表3人。根据我国《选举法》的规定,该选区正式候选人人数可以为（ ）。","o":["3人","5人","7人","9人"],"a":"B","e":"\u0001\"所以我国选举人大代表遵循的是差额选举的原则,故排除A。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ \u0001《全国人民代表大会和地方各级人民代表大会选举法》\u0002规定:\"全国和地方各级人民代表大会代表实行差额选举,代表候选人的人数应多于应选代表的名额\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选\n由选民直接选举人民代表大会代表的, 代表候选人的人数应多于应选代表名额三分之一至一倍:由县级以上的地方各级人民代表大会选举上一级人民代表大会代表的,代表候选人的人数应多于应选代表名额五分之一至二分之一。 根据上述法律规定,在直接选举人大代表时,代表候选人的人数不能超过应选代表的一倍,所以在本题中,该选区的候选人人数至少4人,不能超过6人,故排除 CD。","k":"","kb":31,"kh":[[0,19],[318,391]]},{"id":"2011-52","y":2011,"t":"多","s":"根据我国法律规定,下列入员中准予行使选举权利的有（ ）。","o":["正在取保候审者","正在被监视居住者","正在被劳动教养者","正在受拘留处罚者"],"a":"ABCD","e":"\u0001在我国享有选举权的基本条件有三个: (1)具有中国的国籍。\u0002\nA✓ ABCD四种情形都属于被准予行使选举权利的人\nB✓ 符合题意及现行制度规定（\u0001正在被监视居住者\u0002）\nC✓ 符合题意及现行制度规定（\u0001正在被劳动教养者\u0002）\nD✓ 法律还规定,对于被判处有期徒刑拘役管制而且没有附加剥夺政治权利的人,对于被羁押,正在受侦查、起诉、审判,人民检察院或人民法院没有决定停止行使选举权利的人,均准予其行使选举权\n(2) 年满18周岁。 (3)依法享有政治权利。\n【制度废止】2013年12月全国人大常委会决定废止有关劳动教养的法律规定；“正在被劳动教养者”系2011年历史真题选项。","k":"","kb":31,"kh":[[0,19],[20,87]]},{"id":"2012-29","y":2012,"t":"单","s":"根据我国《选举法》的规定,由选民直接选举的人大代表候选人可通过选民联名推荐的方式产生。某甲欲通过此种方式参选人大代表,其须获得选民联名推荐的最低人数应是（ ）。","o":["5人","10人","30人","50人"],"a":"B","e":"\u0001《选举法》第29条规定,全国和地方各级人民代表大会的代表候选人,按选区或选举单位提名产生。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 选民或者代表,10人以上联名,也可以推荐代表候选人\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选\n各政党、各人民团体,可以联合或者单独推荐代表候选人。","k":"","kb":31,"kh":[[149,193],[318,391]]},{"id":"2012-58","y":2012,"t":"多","s":"根据我国《选举法》的规定,下列选项中,属于选举委员会职责的有（ ）。","o":["划分选区,分配各选区应选代表的名额","进行选民登记,审查选民资格,公布选民名单","了解核实并组织介绍代表候选人的情况;根据较多数选民意见,确定和公布正式候选人的名单","确定选举结果是否有效,公布当选代表名单"],"a":"ABCD","e":"\u0001(7)法律规定的其他职责。\u0002\nA✓ 修改之后的\u0001《选举法》\u0002明确了县乡人大选举时选举委员会的职责,包括: (1) 划分选举本级人民代表大会代表的选区,分配各选区应选代表的名额\nB✓ (2) 进行选民登记,审查选民资格,公布选民名单\nC✓ (4)了解核实并组织介绍代表候选人的清况\nD✓ (6)确定选举结果是否有效,公布当选代表名单\n2010年第十一届全国人大第三次会议对\u0001《选举法》\u0002进行了较大的修订。 受理对于选民名单不同意见的申诉,并作出决定。 (3)确定选举日期。 根据较多数选民的意见确定和公布正式代表候选人名单。 (5) 主持投票选举。 考生也可通过教材所列举的选举的程序,即划分选区、选民登记、代表候选人提出、投票选举、公布选举结果, 来推知选举委员会的职责。","k":"","kb":31,"kh":[[0,19],[273,318]]},{"id":"2013-19","y":2013,"t":"单","s":"甲与同村另外四名选民在外打工,不能回原籍参加镇人大代表选举。甲的下列做法,符合我国选举法的是（ ）。","o":["口头委托在原籍的同村选民乙代为投票","与另外四人共同委托同村选民乙代为投票","书面委托同村选民乙按照甲的意愿代为投票","经户籍所在地镇政府同意,由同村选民乙代为投票"],"a":"C","e":"\u0001根据《宪法》及《选举法》,选民如果在选举期间外出,经选举委员会同意,可书面委托其他选民投票。\u0002\nA✗ 口头委托无效\nB✗ 四个人委托一个村民投票也是无效的\nC✓ 每一选民接受的委托不得超过三人,并应当按照委托人的意愿代为投票\nD✗ 委托投票须经过选举委员会而非户籍所在地政府同意","k":"","kb":31,"kh":[[0,19],[273,318]]},{"id":"2013-55","y":2013,"t":"多","s":"2010年《选举法》修正案中,涉及选举权平等性原则的内容有（ ）。","o":["选民所投的选票具有同等的法律效力","人人平等,即城乡按相同人口比例选举代表","民族平等,即各民族都有适当数量的人大代表","地区平等,即各行政区域都应有相同的基本名额数"],"a":"ABCD","e":"\u0001包括每一选票的等效性、每一代表所代表的城乡人口数相同,还包括民族平等、地区平等。\u0002\nA✓ 符合题意及现行制度规定（\u0001选民所投的选票具有同等的法律效力\u0002）\nB✓ 2010年选举法迎来修改,落实了平等选权制\nC✓ 符合题意及现行制度规定（\u0001民族平等,即各民族都有适当数量的人大\u0002）\nD✓ 符合题意及现行制度规定（\u0001地区平等,即各行政区域都应有相同的基\u0002）\n【修法动态】2020年《选举法》修改调整了县乡两级人大代表基本名额数等规定，选举权平等性四大内容表述仍适用。","k":"","kb":31,"kh":[[0,19],[149,193]]},{"id":"2014-30","y":2014,"t":"单","s":"在2011年的县人民代表大会代表选举中,某选区应选代表两名。该选区公布了12500人的选民名单,实际参加投票的选民为6200人。该选区三位代表候选人孙某、侯某、赵某获得的选票分别为3101 票、2050票、1040票。根据我国选举法,下列选项中, 正确的是（ ）。","o":["只有孙某当选","孙某和侯某当选","三位代表候选人均不能当选","该次选举有效,由县选举委员会最终确定当选者"],"a":"C","e":"\u0001根据《选举法》规定,在实行直接选举的地方,选区全体选民过半数参加投票,选举有效。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✓ 本题选民共12 500 人,实际参加投票的选民 6 200人,没过半数,因此选举无效,三位代表候选人均不能\nD✗ 根据\u0001《选举法》\u0002规定,在实行直接选举的地方,选区全体选民过半数参加投票,选举有效\n代表候选人获得参加投票选民过半数的选票,始得当选。 因此选\u0001“三位代表候选人均不能当选”\u0002。","k":"","kb":31,"kh":[[273,318],[318,391]]},{"id":"2014-55","y":2014,"t":"多","s":"根据我国代表法的规定,人民代表大会代表享有的权利有（ ）。","o":["参加本级人民代表大会的各项选举","提出对各方面工作的建议、批评和意见","依法联名提出议案、质询案、罢免案等","出席本级人民代表大会会议,参加审议各项议案、报告和其他议题,发表意见"],"a":"ABCD","e":"\u0001根据相关规定,我国代表具有:(1)出席本级人大会议,发表意见,参与表决等权利。\u0002\nA✓ 符合题意及现行制度规定（\u0001参加本级人民代表大会的各项选举\u0002）\nB✓ 符合题意及现行制度规定（\u0001提出对各方面工作的建议、批评和意见\u0002）\nC✓ (2) 根据法律规定的程序提出议案、建议和意见的权利\nD✓ (4) 出席本级人民代表大会会议,认真参与讨论和决定,积极参加代表的视察活动等\n(3) 依照法律规定的程序提出质询案的权利。 (4) 依法提出罢免案的权利。 (5)人身特别保护权。 (6)言论免责权。 (7)物质保障权。 (这里还需注意代表们的义务:(1)模范地遵守宪法和法律,在代表参加的生产、工作和社会活动中, 宣传法治并协助宪法和法律的贯彻实施; (2)与原选举单位和人民保持密切联系,接受其监督; (3) 保守国家秘密;","k":"","kb":31,"kh":[[0,19],[318,391]]},{"id":"2014-59","y":2014,"t":"多","s":"根据我国选举法的规定,在选民直接选举人大代表时,组织投票的方式有（ ）。","o":["设流动票箱","在各选区设选举投票站","召开选举大会进行投票","为外出打工人员设流动投票站"],"a":"ABC","e":"\u0001选举法规定,选举委员会应当根据各选区选民分布状况,按照方便选民投票的原则设立投票站,进行选举。\u0002\nA✓ 因患有疾病等原因行动不便或者居住分散并且交通不便的选民,可以在流动票箱投票\nB✓ 选举法规定,选举委员会应当根据各选区选民分布状况,按照方便选民投票的原则设立投票站,进行选举\nC✓ 选民居住比较集中的,可以召开选举大会,进行选举\nD✗ 与题干设问或现行制度要件不符，故不选\n(此题是对选举法的法条的考查,考生应加以记忆。","k":"","kb":31,"kh":[[273,318],[318,391]]},{"id":"2015-21","y":2015,"t":"单","s":"某县举行人大代表换届选举,甲欲通过选民联名推荐的方式参选人大代表,其须获得联名推荐的最低选民人数要求是（ ）。","o":["3人以上","10人以上","20人以上","30人以上"],"a":"B","e":"\u0001选民或者代表10 人以上联名可以推荐代表候选人,据此,B为正确选项。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 选民或者代表10 人以上联名可以推荐代表候选人,据此,B为正确选项\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选","k":"","kb":31,"kh":[[219,252],[318,391]]},{"id":"2015-22","y":2015,"t":"单","s":"根据我国选举法,设区的市的人大代表提出辞职,正确的做法是（ ）。","o":["向本级人大常委会口头提出","向本级人大会议主席团书面提出","向选举他的人民代表大会口头提出","向选举他的人民代表大会的常委会书面提出"],"a":"D","e":"\u0001选举法规定,全国人大代表,省、自治区、直辖市、设区的市、自治州的人大代表可以向选举他的人大常委会书面提出辞职,据此,D为正确选项。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ 选举法规定,全国人大代表,省、自治区、直辖市、设区的市、自治州的人大代表可以向选举他的人大常委会书面提出辞职,据此,D为正确选项","k":"","kb":31,"kh":[[0,19],[318,391]]},{"id":"2016-21","y":2016,"t":"单","s":"2014年9月,王村举行村委会选举。下列入员中,应当列入参选村民名单的是（ ）。","o":["王二,户籍在李村,半年前人赘王村","王五,户籍在王村,在纽约唐人街打工,久无音讯","王七,户籍在王村,嫁人李村,已登记和参加李村选举","王九,户籍在王村,在北京经商,多次表示要参选村委会主任"],"a":"D","e":"\u0001《村民委员会组织法》第13条规定:年满十八周岁的村民,不分民族、种族、性别、职业、家庭出身、宗教信仰、教育程度、财产状况、居住期限,都有选举权和被选举权。\u0002\nA✗ 王二的户籍不在王村,在王村居住不满l 年,不能列入王村的选民名单\nB✗ 王五,户籍在王村,不在王村居住,本人杳无音信,没有表示参加选举,不列入选民名单\nC✗ 王七,户籍在王村,但是在居住村李村登记和参加选举,不得再参加王村村委会的选举,不列入选民名单\nD✓ 户籍在王村, 不在王村居住,本人表示参加选举,应当列入选民名单\n但是,依照法律被剥夺政治权利的人除外。 村民委员会选举前,应当对下列入员进行登记,列入参加选举的村民名单:(一)户籍在本村并且在本村居住的村民; (二)户籍在本村,不在本村居住,本人表示参加选举的村民; (三)户籍不在本村, 在本村居住一年以上,本人申请参加选举,并且经村民会议或者村民代表会议同意参加选举的公民。 已在户籍所在村或者居住村登记参加选举的村民,不得再参加其他地方村民委员会的选举。 \u0001“王二,户籍在李村,半年前人赘王村”\u0002,王二的户籍不在王村,在王村居住不满l 年,不能列入王村的选民名单。","k":"","kb":31,"kh":[[149,193],[273,318]]},{"id":"2017-22","y":2017,"t":"单","s":"根据现行《宪法》,下列入员中由全国人民代表大会选举产生的是（ ）。","o":["国家副主席","最高人民法院副院长","国务院副总理","最高人民检察院副检察长"],"a":"A","e":"\u0001《宪法》第79条第1款规定:中华人民共和国主席、副主席由全国人民代表大会选举。\u0002\nA✓ \u0001《宪法》第79条第1款\u0002规定:中华人民共和国主席、副主席由全国人民代表大会选举\nB✗ 根据\u0001《宪法》第67条\u0002第(十一)(十二)项的规定,全国人大常委会根据最高人民法院院长的提请,任免最高人民法院副院长、审判员、审判委员会委员和军事法院院长\nC✗ 国务院副总理是根据总理的提名,由全国人民代表大会决定,不是选举\nD✗ 根据最高人民检察院检察长的提请,任免最高人民检察院副检察长、检察员、检察委员会委员和军事检察院检察长,并且批准省、自治区、直辖市的人民检察院检察长的任免\n根据\u0001《宪法》第62条\u0002第(五)项的规定,全国人大根据中华人民共和国主席的提名,决定国务院总理的人选; 根据国务院总理的提名,决定国务院副总理、国务委员、各部部长、各委员会主任、审计长、秘书长的人选。 因此最高人民法院副院长、最高人民检察院副检察长是由全国人大常委会任免的,不是由全国人大选举的,该项","k":"","kb":37,"kh":[[0,30],[199,378]]},{"id":"2017-25","y":2017,"t":"单","s":"张某长期在外打工,返乡时恰逢乡人大换届选举。根据选举法,张某可以向法院起诉的情形是（ ）。","o":["选举委员会宣布张某当选无效","选举委员会未将张某列入选民名单","张某和其他选民联名提出代表候选人被拒绝","选举委员会不同意张某委托其他选民代为投票"],"a":"B","e":"\u0001(七)法律规定的其他职责。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 本题中,如果选举委员会未将张某列入选民名单,张某可以向选举委员会提出申诉,选举委员会应在三日内作出处理决定,张某对该决定不服的,可以向人民法院提起诉讼\nC✗ 根据较多数选民的意见,确定和公布正式代表候选人名单\nD✗ 根据\u0001《选举法》第41条\u0002的规定,委托其他选民代为投票,必须经选举委员会同意\n\u0001《选举法》第10条\u0002规定:选举委员会履行下列职责:(一)划分选举本级人民代表大会代表的选区,分配各选区应选代表的名额; (二)进行选民登记,审查选民资格,公布选民名单; 受理对于选民名单不同意见的申诉,并作出决定; (三)确定选举日期; (四)了解核实并组织介绍代表候选人的情况; (五)主持投票选举; (六)确定选举结果是否有效,公布当选代表名单; 选举委员会应当及时公布选举信息。 第28条规定: 对于公布的选民名单有不同意见的,可以在选民名单公布之日起五日内向选举委员会提出申诉。 选举委员会对申诉意见,应在三日内作出处理决定。 申诉人如果对处理决定不服,可以在选举H的五日以前向人民法院起诉,人民法院应在选举日以前作出判决。 人民法院的判决为最后决定。 根据\u0001《选举法》第31条\u0002的规定,选举委员会有权确定正式代表候选人的名单,相关表述不能提起诉讼。 选举委员会不同意的,不得代为投票。 相关表述不能提起诉讼。 根据\u0001《选举法》第45条\u0002的规定,选举结果由选举委员会或者人民代表大会主席团根据本法确定是否有效,并予以宣布。 “选举委员会宣布张某当选无效”不能提起诉讼。","k":"","kb":31,"kh":[[273,318],[318,391]]},{"id":"2019-17","y":2019,"t":"单","s":"根据我国宪法,中国特色社会主义最本质的特征是（ ）。","o":["社会主义公有制","中国共产党领导","全面依法治国","人民代表大会制度"],"a":"B","e":"\u00012018年对宪法进行了第五次修改,修改之后《宪法》第1条第2款规定:社会主义制度是中华人民共和国的根本制度。\u0002\nA✗ 2018年对宪法进行了第五次修改,修改之后\u0001《宪法》第1条第2款\u0002规定:社会主义制度是中华人民共和国的根本制度\nB✓ 国共产党领导是中国特色社会主义最本质的特征\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 人民代表大会制度是我国的根本政治制度\n禁止任何组织或者个人破坏社会主义制度。 社会主义公有制与全面依法治国都不是中国特色社会主义最本质的特征,因此\u0001“社会主义公有制”\u0002","k":"","kb":30,"kh":[[0,44],[44,81]]},{"id":"2019-18","y":2019,"t":"单","s":"根据选举法,下列关于直接选举的表述,正确的是（ ）。","o":["县级人大代表的选举由县级人大常委会主持","当选人数少于应选代表名额的,应重新投票","选举所投的票数多于投票人数的,该次选举无效","代表候选人获得全体选民过半数的选票,始得当选"],"a":"C","e":"\u0001《选举法》第8条规定:不设区的市、市辖区、县、自治县、乡、民族乡、镇设立选举委员会,主持本级人民代表大会代表的选举。\u0002\nA✗ 在实行直接选举的地方,由选举委员会主待投票选举工作\nB✗ 获得过半数选票的当选代表的人数少于应选代表的名额时,不足的名额另行选举\nC✓ 第43条规定:每次选举所投的票数,多于投票人数的无效,等千或者少于投票人数的有效\nD✗ 代表候选人获得参加投票的选民过半数的选票时,始得当选,这里不要求获得全体选民过半数\n第44条第1款规定:在选民直接选举人民代表大会代表时,选区全体选民的过半数参加投票,选举有效。 第3款规定:获得过半数选票的代表候选人的人数超过应选代表名额时,以得票多的当选。 如遇票数相等不能确定当选人时,应当就票数相等的候选人再次投票,以得票多的当选。 另行选举时,根据在第一次投票时得票多少的顺序,按照本法第三十条规定的差额比例,确定候选人名单。 如果只选一入,候选人应为二人,","k":"","kb":31,"kh":[[273,318],[318,391]]},{"id":"2019-46","y":2019,"t":"多","s":"根据我国宪法和法律,人大代表出现下列情形,其代表资格应终止的有（ ）。","o":["赵某辞职被接受","钱某加入外国国籍但定居北京","孙某因刑事案件被羁押正在接受侦查","李某未经批准两次不出席本级人大会议"],"a":"ABD","e":"\u0001《全国人民代表大会和地方各级人民代表大会代表法》规定:代表有下列情形之一的,其代表资格终止:(一)地方各级人民代表大会代表迁出或者调离本行政区域的。\u0002\nA✓ (二)辞职被接受的\nB✓ \u0001《全国人民代表大会和地方各级人民代表大会代表法》\u0002规定:代表有下列情形之一的,其代表资格终止:(一)地方各级人民代表大会代表迁出或者调离本行政区域的\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ (三)未经批准两次不出席本级人民代表大会会议的\n\u0001“孙某因刑事案件被羁押正在接受侦查”\u0002会导致暂时停止执行代表职务,但不会终止代表资格 (四)被罢免的; (五)丧失中华人民共和国国籍的; (六)依照法律被剥夺政治权利的; (七)丧失行为能力的。","k":"","kb":31,"kh":[[273,318],[318,391]]},{"id":"2020-15","y":2020,"t":"单","s":"下列有关我国人民代表大会制度的表述,正确的是（ ）。","o":["人民代表大会制度是我国的国体","全国人民代表大会行使一切国家权力","各级人民代表大会是人民行使国家权力的机关","人民代表大会制度确立了立法机关、行政机关和司法机关的相互监督关系"],"a":"C","e":"\u0001全国人民代表大会并非行使一切国家权力,如法规制定权、紧急状态决定权等国家权力就不属于全国人民代表大会的职权。\u0002\nA✗ 人民代表大会制度是我国的政权组织形式,是中国的根本政治制度,即政体\nB✗ 与题干设问或现行制度要件不符，故不选\nC✓ 行使国家权力的机关,不仅是全国人民代表大会,还包括地方各级入民代表大会以及其他各级国家机关\nD✗ 国不是三权分立制度,全国人大不受其他国家机关的监督, 受人民监督\n国家性质也称国体,人民民主专政的社会主义国家是我国的国体。 人民代表大会制度是人民通过选举的方式,选举代表组成各级国家权力机关,由各级国家权力机关产生其他的国家机关,其他国家机关对权力机关负责,权力机关对人民负责的一种制度。","k":"","kb":30,"kh":[[0,44],[44,81]]},{"id":"2020-23","y":2020,"t":"单","s":"关于我国人大代表候选人的产生程序,下列表述正确的是（ ）。","o":["代表候选人只能由各政党和人民团体提名","初步候选人人数超过规定的最高差额比例的, 必须进行预选","直接选举中,正式代表候选人名单应当在选举日的七日以前公布","县级以上地方人大选举上一级人大代表,候选人应从本级人大代表中产生"],"a":"C","e":"\u0001\" 全国和我国《选举法》第29条规定: 地方各级人民代表大会的代表候选人,按选区或选举单位提名产生。\u0002\nA✗ 各政党、各人民团体,可以联合或者单独推荐代表候选人\nB✗ 如果所提代表候选人的人数超过\u0001《选举法》第30条\u0002规定的最高差额比例,由选举委员会交各该选区的选民小组讨论、协商,根据较多数选民的意见,确定正式代表候选人名单\nC✓ 县级以上的地方各级人民代表大会在选举上一级人民代表大会代表时,代表候选人不限于各该级人民代表大会的代表\nD✗ 与题干设问或现行制度要件不符，故不选\n选民或者代表,10 人以上联名,也可以推荐代表候选人。 对正式代表候选人不能形成较为一致意见的,进行预选,根据预选时得票多少的顺序,确定正式代表候选人名单。 相关表述必须进行预选的说法错误。 正式代表候选人名单及代表候选人的基本情况应当于选举日的7日以前公布。","k":"","kb":31,"kh":[[149,193],[318,391]]},{"id":"2022-16","y":2022,"t":"单","s":"根据我国宪法和法律,下列入大代表中,由选民直接选举的是（ ）。","o":["自治区的人民代表大会的代表","直辖市的人民代表大会的代表","设区的市的人民代表大会的代表","县、自治县、乡、民族乡、镇的人民代表大会的代表"],"a":"D","e":"\u0001按照《宪法》和《选举法》的规定,我国在县级以及县级以下实行直接选举,县级以上实行间接选举。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 自治区、直辖市、设区的市属于县级以上,实行间接选举\nD✓ 县、自治县、不设区的市、市辖区、乡、民族乡、镇的人民代表大会的代表由选民直接选举","k":"","kb":31,"kh":[[87,148],[149,193]]},{"id":"2022-22","y":2022,"t":"单","s":"根据《选举法》,下列关于代表候选人的表述,正确的是（ ）。","o":["代表候选人均由选区提名产生","正式代表候选人的名单在选举日当天公布","代表候选人的人数可以等于应选代表的名额","代表候选人为选举委员会组成人员的,应辞去选举委员会的职务"],"a":"D","e":"\u0001根据我国《选举法》规定,全国和地方各级人民代表大会的代表候选人,按选区或者选举单位提名产生。\u0002\nA✗ 选民或者代表,10人以上联名, 也可以推荐代表候选人\nB✗ 正式代表候选人名单及代表候选人的基本情况应当在选举日的7 日以前公布\nC✗ 全国和地方各级人民代表大会代表实行差额选举,代表候选人的人数应多于应选代表的名额\nD✓ 选举委员会的组成人员为代表候选人的,应当辞去选举委员会的职务\n各政党、各人民团体,可以联合或者单独推荐代表候选人。","k":"","kb":31,"kh":[[0,19],[273,318]]},{"id":"2023-20","y":2023,"t":"单","s":"村民赵某在乡人大代表选举期间临时外出务工,无法返乡参加选举。下列关于赵某参加选举的说法,正确的是（ ）。","o":["赵某可以进行网络投票","乡选举委员会可以暂停赵某的选举权","经乡选举委员会同意,赵某可以书面委托其他选民代为投票","赵某可以同时参加本乡和务工所在地的基层人大代表选举"],"a":"C","e":"\u0001选举期间临时在外地务工无法回乡的选民，经选举委员会同意可以书面委托其他选民代为投票。\u0002\nA✗ 我国现行《选举法》要求无记名现场投票或流动票箱，\u0001尚未设立网络电子投票制度\u0002\nB✗ 停止行使选举权仅适用于因危害国家安全等严重刑事犯罪被羁押且经法院或检察院决定者，外出务工不得停止\nC✓ 依据《选举法》第41条，选民在外地的经选举委员会同意，可\u0001书面委托其他选民代为投票\u0002（每人受托不超3人）\nD✗ 每一选民在同一次选举中\u0001只能在一地登记参加选举，只有一个投票权\u0002，不得双重参选\n委托投票三条件：\u0001选民外出\u0002、\u0001经选举委员会同意\u0002、\u0001书面委托且每一受托人不得超过3人\u0002。","k":"","kb":31,"kh":[[0,19],[273,318]]},{"id":"2024-19","y":2024,"t":"单","s":"某县盲目上马大批外采矿项目,发生多起安全事故,副县长甲涉嫌瞒报,县监察委员会主任乙涉嫌失职。此后,县人大会议召开,应到代表302人,实到代表300人,35名代表联名提出对甲和乙的罢免案。下列关于这一罢免案表述正确的是（ ）。","o":["乙不在可被罢免的人员之列","代表联名未达到法定人数,不符合罢免程序要求","代表提出罢免案须先经县人大常委会审议后方能向县人大会议提出","被提出罢免议案的人员有权在县人大会提出申辩意见"],"a":"D","e":"\u0001人大审议罢免案时，被提出罢免案的人员有权在主席团会议或者大会全体会议上提出申辩意见。\u0002\nA✗ 依据《地方组织法》，县级以上地方各级人大有权罢免\u0001本级政府正副职及本级监察委主任\u0002、法检两长，甲和乙均属可罢免对象\nB✗ 县级以上地方人大会议，主席团、常委会或\u0001十分之一以上代表联名\u0002均可提罢免案；应到302人的1/10为30.2（至少31人），35名代表联名符合法定人数\nC✗ 人大会议期间代表联名提出的罢免案由\u0001主席团交各代表团审议后提请大会全体会议表决\u0002，无须先经县人大常委会审议\nD✓ 依据《地方组织法》，罢免案提请表决前，\u0001被提出罢免的人员有权在主席团会议或大会全体会议上提出申辩意见\u0002，或书面提出申辩意见\n掌握地方人大罢免程序三大数字：县级以上人大会议\u00011/10代表联名\u0002（或主席团、常委会）可提，\u0001全体代表过半数\u0002通过，\u0001保障被罢免人申辩权\u0002。","k":"","kb":31,"kh":[[318,391]]},{"id":"2024-22","y":2024,"t":"单","s":"根据我国宪法和法律,下列选项属于我国选举制度基本原则的是（ ）。","o":["记名投票","选举权的普遍性","财产资格限制","等额选举"],"a":"B","e":"\u0001我国《选举法》确立了选举权的普遍性、平等性、直接与间接并用、差额选举与无记名投票等基本原则。\u0002\nA✗ 我国现行《选举法》采取\u0001无记名投票（秘密投票）\u0002原则，并设立秘密写票处，不采取记名投票\nB✓ 选举权的\u0001普遍性原则\u0002指凡年满18周岁未被依法剥夺政治权利的中国公民，不分民族、种族、性别、财产均享有选举权\nC✗ 我国选举法废除了一切财产、文化、居住年限等歧视性限制，禁止\u0001财产资格限制\u0002\nD✗ 我国人大代表选举一律实行\u0001差额选举\u0002原则（即候选人名额应多于应选代表名额），不采等额选举\n我国选举制度五大基本原则：\u0001普遍性、平等性、直接与间接选举并用、差额选举、无记名投票（秘密投票）\u0002。","k":"","kb":31,"kh":[[0,19],[87,148]]},{"id":"2024-26","y":2024,"t":"单","s":"下列关于人大代表直接选举的表述,正确的是（ ）。","o":["设区的市,县人大代表由选民直接选举产生","选区均按照居住状况进行划分","代表候选人可由各选区选民和各政党、各人民团体推荐","当选代表名单由人民代表大会主席团予以公布"],"a":"C","e":"\u0001直接选举中，代表候选人可以由各选区选民十人以上联名推荐，也可由各政党、各人民团体推荐。\u0002\nA✗ 设区的市人大代表由下一级人民代表大会\u0001间接选举\u0002产生；直接选举限于不设区的市、市辖区、县、自治县、乡、民族乡、镇的人大代表\nB✗ 依据《选举法》第25条，选区\u0001可以按居住状况划分，也可以按生产单位、事业单位、工作单位划分\u0002\nC✓ 依据《选举法》第30条，各政党、各人民团体可以联合或者单独推荐代表候选人，\u0001选民十人以上联名也可以推荐代表候选人\u0002\nD✗ 直接选举由选举委员会主持，选举结果及当选代表名单由\u0001选举委员会\u0002确定是否有效并予以公布\n直选vs间选名单公布：\u0001直选由选举委员会主持并公布结果\u0002；\u0001间选由本级人大主席团主持并公布结果\u0002。","k":"","kb":31,"kh":[[149,193],[318,391]]},{"id":"2025-20","y":2025,"t":"单","s":"根据《选举法》,下列关于选举委员会的表述,正确的是（ ）。","o":["在各级人大代表选举中,设立选举委员会主持本级人大代表的选举","选举委员会均受上一级人大常委会的领导","选举委员会应当按照居住状况进行选区划分","选举委员会确定选举结果是否有效,公布当选代表名单"],"a":"D","e":"\u0001根据《选举法》的规定,选举结果由选举委员会或者人民代表大会主席团确定是否有效,并予以宣布。\u0002\nA✗ 只有不设区的市、市辖区、县、自治县、乡、民族乡、镇设立选举委员会,主持本级人大代表的选举,并非各级人大都设立选举委员会\nB✗ 县级选举委员会受本级人大常委会领导\nC✗ 选区划分不是必须按照居住状况进行,还可以按生产单位、事业单位、工作单位划分\nD✓ 根据\u0001《选举法》\u0002的规定,选举结果由选举委员会或者人民代表大会主席团确定是否有效,并予以宣布","k":"","kb":31,"kh":[[0,19],[273,318]]},{"id":"2025-26","y":2025,"t":"单","s":"根据我国宪法和法律,人大代表出现下列情形,其代表职务应暂时停止执行的是（ ）。","o":["请求辞职被接受","调离本行政区域","因病丧失行为能力","因刑事案件被羁押正在受审判"],"a":"D","e":"\u0001(二)被依法判处管制、拘役或者有期徒刑而没有附加剥夺政治权利,正在服刑的。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ (二)被依法判处管制、拘役或者有期徒刑而没有附加剥夺政治权利,正在服刑的\n根据法律规定,代表有下列情形之一的,暂时停止执行代表职务,由代表资格审查委员会向本级人民代表大会常务委员会或者乡、民族乡、镇的人民代表大会报告:(一)因刑事案件被羁押正在受侦查、起诉、审判的; ABC 项会导致代表资格终止,而不是暂时停止执行代表职务。","k":"","kb":30,"kh":[[0,44]]},{"id":"2026-17","y":2026,"t":"单","s":"根据我国宪法和法律,以下关于人大代表候选人的表述,正确的是（ ）。","o":["各级人大代表实行差额选举,代表候选人的人数应多于应选代表的名额","在直接选举中,正式代表候选人名单应在选举日的两日前公布","代表候选人可以接受组织或者个人提供的有关选举的资助","在间接选举中,人大主席团需将代表候选人名单印发本级人大常委会"],"a":"A","e":"\u0001我国各级人大代表选举一律差额。\u0002\nA✓ 我国各级人大代表选举一律差额\nB✗ 直接选举候选人7 日前公示\nC✗ 候选人禁止接受选举资助\nD✗ 间接选举候选人印发全体代表而非常委会","k":"","kb":31,"kh":[[87,148],[252,273]]}]},{"sub":"中国法制史","name":"汉朝法律制度","w":1.7,"w5":1.6,"wh":1.8,"bt":"","pt":"近5年1.6分/年·律学/上请/春秋决狱稳态","L":34,"qs":[{"id":"2005-61","y":2005,"t":"多","s":"汉朝法律中体现儒家指导思想的制度和原则主要有（ ）。","o":[" 权","业主可在回赎期内以原价赎回标的物"],"a":"A","e":"\u0001宋代明确严禁“一物两典”，违者以“准盗论”严厉追究刑事与民事责任。\u0002\nA✓ 宋代严厉禁止重复典卖同一财产（一物两典），违者\u0001“准盗论”\u0002，因此认为一物可以两典的表述不正确\nB✗ 宋代典权属于独立财产权利，\u0001典权人可将典权再转典或转让\u0002，正确\nC✗ 宋代实行“先问亲邻”与优先权原则，\u0001钱主（典权人）对典物享有优先购买权\u0002，正确\nD✗ 活卖（典卖）的根本特征就是\u0001业主可以在法定或约定回赎期内以原典价赎回田宅\u0002，正确\n宋代典卖三大规则：\u0001立契印税（红契）\u0002、\u0001严禁一物两典（准盗论）\u0002、\u0001保留回赎权与优先权（先问亲邻）\u0002。","k":"","kb":48,"kh":[[339,411]]},{"id":"2024-31","y":2024,"t":"单","s":"典权是具有中国特色的传统物权制度。宋代为保护典权人的权利,严禁“一物两典”,对于重复典卖者应追究的法律责任是（ ）。","o":["准盗论","以坐赃论","以诈欺取财论","不坐"],"a":"A","e":"\u0001宋代严禁田宅“一物两典”，对重复典卖者依律按“准盗论”定罪处罚。\u0002\nA✓ 宋代不动产交易立法严格保护先典权人，规定重复典卖田宅者\u0001“准盗论”\u0002（比照盗窃财物罪计赃科刑并责令追物返钱）\nB✗ 坐赃是唐宋六赃之一，指非因职务受财的特定财产犯罪，不适用于宋代“一物两典”罚则\nC✗ 诈欺取财属一般欺诈罪名，宋律明确把重复典卖直接上升为“准盗论”严惩\nD✗ 重复典卖危害交易安全，绝非无罪“不坐”\n宋代契约法必考条款：绝卖需红契（税契），\u0001严禁一物两典（重复典卖准盗论）\u0002，同居亲邻享\u0001先买权\u0002。","k":"","kb":48,"kh":[[339,411]]},{"id":"2024-39","y":2024,"t":"单","s":"元朝仁宗时期“以格例、条画有关于风纪者，类集成书”，称为《风宪宏纲》。《风宪宏纲》的性质是（ ）。","o":["民事立法","科举立法","考课立法","监察立法"],"a":"D","e":"\u0001元朝仁宗时期汇编的《风宪宏纲》专门汇集整饬纲纪与监察法规条画，属于监察立法。\u0002\nA✗ 元朝民事法律散见于《大元通制》《元典章》户婚篇等，并非《风宪宏纲》定位\nB✗ 科举制度立法有元代条格规定，但“风宪”古代专指执掌纠弹监察的御史台机关\nC✗ 考课是官吏政绩考核法规，亦非“风宪”本义\nD✓ 古代称御史台等监察机构为“风宪衙门”；《风宪宏纲》“以格例、条画有关于风纪者类集成书”，是我国历史上极为系统的\u0001专门监察法规汇编（监察立法）\u0002\n记住元代重要法典分类：《大札撒》（习惯法）、《至元新格》《大元通制》（综合性法典）、\u0001《风宪宏纲》（监察）\u0002、《元典章》（地方类书）。","k":"","kb":48,"kh":[[412,435],[435,479]]},{"id":"2025-37","y":2025,"t":"单","s":"宋太宗淳化二年,为加强对司法的控制,增置审刑院于宫中。审刑院的主要职责是 （ ）。","o":["复核死刑案件","审理京师百官案件","审理宗室皇亲案件","审议经大理寺裁断和刑部复核的案件"],"a":"D","e":"\u0001宋初为强化对中央司法机关的控制,另立审刑院。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ 凡须奏报皇帝的各种案件,经大理寺断谳后,报审刑院复核,由知院事和详议官拟出定案文稿,经中书省奏报皇帝论决","k":"","kb":48,"kh":[[9,165]]},{"id":"2026-36","y":2026,"t":"单","s":"南宋庆元年间,绍兴府民虞甲夫妇去世,二人无子女。虞甲之父虞乙经宗族同意,立同族人虞丙为虞甲的继承人,得到官府支持。这种继承方式称为（ ）。","o":["立继","命继","过继","爱继"],"a":"B","e":"\u0001命继:夫妻双亡,由宗族、官府指定继承人。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 符合题意及现行制度规定（\u0001命继\u0002）\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选\n立继父母在世立嗣。","k":"","kb":48,"kh":[[339,411]]},{"id":"2026-49","y":2026,"t":"多","s":"中国古代不动产流转注重睦合各方,避免矛盾纠纷。依照宋朝法律,享有田宅优先购买权的民事主体有（ ）。","o":["士绅","房亲","四邻","官员"],"a":"BC","e":"\u0001宋代田宅先问房亲,再问四邻,士绅、官员无优先购买权。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 符合题意及现行制度规定（\u0001房亲\u0002）\nC✓ 符合题意及现行制度规定（\u0001四邻\u0002）\nD✗ 与题干设问或现行制度要件不符，故不选","k":"","kb":48,"kh":[[9,165]]}]},{"sub":"法理学","name":"法律责任与法律制裁","w":1.5,"w5":1.2,"wh":1.7,"bt":"","pt":"2026升至3分·平台侵权/时效免责结合","L":29,"qs":[{"id":"2005-50","y":2005,"t":"多","s":"因果联系原则是法律责任归责的一个重要原则,它的含义是（ ）。","o":["在认定行为人违法责任之前,应当确认主体的行为与损害结果之间的因果联系","在认定行为人违法责任之前,应当确认行为主体的意志、思想等主观方面因素与外部行为之间的因果联系","在认定行为人违法责任之前,应当确认行为人的权利能力、行为能力与行为结果之间的因果联系","在认定行为人违法责任之前,应当区分这种因果联系是必然的还是偶然的,直接的还是间接的"],"a":"ABD","e":"\u0001行为人的权利能力、行为能力属于责任承担的主体要件, 该主体要件是法律的直接认定,而行为人的行为结果是实际发生的,二者之间不存在法律意义上的因果关系,当然无庸确认。\u0002\nA✓ 如果危害行为与损害结果之间不存在因果关系,当然谈不上构成犯罪以刑事责任的问题\nB✓ 符合题意及现行制度规定（\u0001在认定行为人违法责任之前,应当确认行\u0002）\nC✗ 行为人的权利能力、行为能力属于责任承担的主体要件, 该主体要件是法律的直接认定,而行为人的行为结果是实际发生的,二者之间不存在法律意义上的因果关系,当然无庸确认\nD✓ 一般来说,刑法上的因果关系是必然因果关系, 偶然因果关系仅对量刑具有意义\n以刑事责任为例分析。 如果行为人不能预见,则也谈不上刑事责任的问题; 据此,相关表述该项","k":"","kb":13,"kh":[[0,12],[47,83]]},{"id":"2006-2","y":2006,"t":"单","s":"下列措施中,属于法律制裁的是（ ）。","o":["国家公务员甲因违法失职受到降级处分","驾驶员乙开车时不小心将一行人撞成轻微伤, 乙主动赔偿了该行人 300 元钱","公民丙犯盗窃罪,但因有立功表现,法院判决免除其法律责任","党员丁因违反党纪受到党内严重警告处分"],"a":"A","e":"\u0001法律制裁是由特定的国家机关对违法者依其所应承担的法律责任而实施的强制性惩罚措施。\u0002\nA✓ 符合题意及现行制度规定（\u0001国家公务员甲因违法失职受到降级处分\u0002）\nB✗ 没有国家机关参与属民间调解\nC✗ 由法院行使但免除了制裁谷堆并没有制裁,故排除\nD✗ 属党内纪律处分,不属法律制裁","k":"","kb":13,"kh":[[0,12],[226,293]]},{"id":"2007-12","y":2007,"t":"单","s":"“反对责任擅断和反对有害追溯” ,体现的法律归责原则是 （ ）。","o":["因果联系原则","责任与处罚相称原则","责任法定原则","责任自负原则"],"a":"C","e":"\u0001依据题干考查要点，正确表述为“责任法定原则”。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✓ 法律归责原则责任法定原则是法治原则在归责问题上的具体运用,它否定责任擅断、非法责罚等没有法律根据的行为,强调\"法无明文规定不为罪\",还否定和摒弃对行为人不利的溯及既往, 强调\"法不溯及既往\"…\nD✗ 与题干设问或现行制度要件不符，故不选\n法律归责原则责任法定原则是法治原则在归责问题上的具体运用,它否定责任擅断、非法责罚等没有法律根据的行为,强调\"法无明文规定不为罪\",还否定和摒弃对行为人不利的溯及既往, 强调\"法不溯及既往\",国家不能用今天的法律要求人们昨天的行为。","k":"","kb":13,"kh":[[0,12],[47,83]]},{"id":"2007-15","y":2007,"t":"单","s":"下列关于法律责任的表述,能够成立的是 （ ）。","o":["刑事责任是犯罪人向被害人所负的一种法律责任","民事责任的功能是救济当事人的权利,不具有惩罚的功能","行政责任是指行政机关违反行政法规所应承担的法律责任","在我国,承担违宪责任的主体主要是国家机关"],"a":"D","e":"\u0001民事责任的主要功能是救济当事人的权利,但是在有些情况下也具有惩罚的功能。\u0002\nA✗ 法律责任的种类刑事责任是犯罪人向国家而非被害人所负的法律责任\nB✗ 民事责任的主要功能是救济当事人的权利,但是在有些情况下也具有惩罚的功能\nC✗ 行政责任既包括行政机关因违法、滥用职权或性质不当所承担的法律责任外,还包括行政相对人违反行政法律而承担的责任,因此相关表述不\nD✓ 违宪通常是有关国家机关制定的法律、法规和规章及特定主体(主要是国家机关)的活动与宪,法相抵触,因此承担违宪责任的主体主要是国家机关","k":"","kb":13,"kh":[[0,12],[13,47]]},{"id":"2008-15","y":2008,"t":"单","s":"下列选项中,不属于我国法律责任归责原则的是（ ）。","o":["责任法定原则","责任与处罚相称原则","连带责任原则","因果联系原则"],"a":"C","e":"\u0001归责原则包括责任法定、责任相称、因果联系和责任自负四大原则。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✓ 连带责任并非归责原则,只是一种责任承担方法\nD✗ 与题干设问或现行制度要件不符，故不选","k":"","kb":13,"kh":[[0,12],[47,83]]},{"id":"2009-47","y":2009,"t":"多","s":"下列属于我国法律跪地呢不过的免责条件或情况的有（ ）。","o":["实效免责","不诉免责","正当防卫免责","自首立功免责"],"a":"ABD","e":"\u0001免责是指行为人实施了违法行为,应当承担法律责任,但由于法律的特别规定,可以部分或全部免除其法律责任,即不实际承担法律责任。\u0002\nA✓ 符合题意及现行制度规定（\u0001实效免责\u0002）\nB✓ 符合题意及现行制度规定（\u0001不诉免责\u0002）\nC✗ 选项不属于我国法律规定的免责条件\nD✓ 在我国的法律规定和法律实践中,免责的条件和方式可以分为实效免责、不诉免责、自首立功免责、自助免责、人道主义免责\n\u0001“正当防卫免责”\u0002不属于我国法律规定的免责条件。","k":"","kb":13,"kh":[[84,138],[138,225]]},{"id":"2010-10","y":2010,"t":"单","s":"下列关于法律制裁的表述,能够成立的是（ ）。","o":["罚金与罚款没有性质上的区别","行政处分不属于法律制裁","民事制裁都是财产制裁","法人可以成为刑事制裁的对象"],"a":"D","e":"\u0001“行政处分不属于法律制裁”行政处分属于行政制栽,是法律制裁的一部分。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 行政处分属于行政制栽,是法律制裁的一部分\nC✗ 选坝该项 民事制裁既可以是财产制裁也可以是非财产制裁,如赔礼道歉\nD✓ 公民和法人都可以成为刑事制裁的对象,刑法专门规定了单位犯罪\n\u0001“罚金与罚款没有性质上的区别”\u0002中罚金是刑事制裁,罚款是行政制裁,两者有巨大区别,; “法人可以成为刑事制裁的对象”公民和法人都可以成为刑事制裁的对象,刑法专门规定了单位犯罪。","k":"","kb":13,"kh":[[226,293]]},{"id":"2010-11","y":2010,"t":"单","s":"下列关于法律责任的表述,能够成立的是（ ）。","o":["党员违反党纪的行为应承担法律责任","追究法律责任的最终依据只能是狭义上的法律","有些情况下,行为人没有主观过错也要承担法律责任","设定法律责任的主要目的在于对违法者进行法律制裁"],"a":"C","e":"\u0001追究法律责任的最终依据应该是广义上的法律,即包括法律、行政法规、地方性法规等规范性法律 \"。\u0002\nA✗ 党员违反党纪承担党的纪律责任\nB✗ 追究法律责任的最终依据应该是广义上的法律,即包括法律、行政法规、地方性法规等规范性法律 \"\nC✓ 民事责任中的违约责任、无过错责任和公平责任都是不以主观过错为前提的\nD✗ 设定法律责任的目的 \" 法律文件在内的在于保障法律上权利、义务、权力得以生效,法律制裁仅仅是实现法律责任的手段之一","k":"","kb":13,"kh":[[0,12],[13,47]]},{"id":"2010-49","y":2010,"t":"多","s":"下列关于行政责任的表述,能够成立的有（ ）。","o":["行政责任主要是无过错责任","财产责任也是承担行政责任的一种方式","行政责任的主体是行政主体和行政相对人","行政责任产生的原因是行政违法行为或法律法规的规定"],"a":"BCD","e":"\u0001行政责任一般适用推定过错责任,属于过错责任的特殊形式,不是无过错责任。\u0002\nA✗ 行政责任一般适用推定过错责任,属于过错责任的特殊形式,不是无过错责任\nB✓ 行政责任的承担方式多种多样,包括财产责任、行为责任、精神责任和人身责任\nC✓ 行政责任的主体包括行政主体和行政相对人\nD✓ 行政责任产生的原因可以是对行政法律法规的违反,也可以是基于行政法律法规的规定","k":"","kb":13,"kh":[[0,12],[13,47]]},{"id":"2011-8","y":2011,"t":"单","s":"沈某因交通违章被公安机关交通管理部门罚款 1800元,拘留15日。他受到的法律制裁属于（ ）。","o":["民事制裁","行政处罚","刑事制裁","行政处分"],"a":"B","e":"\u0001法律制裁包括民事制裁、刑事制裁、行政制裁和违宪制裁。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 符合题意及现行制度规定（\u0001行政处罚\u0002）\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选\n行政制裁是国家行政机关对行政违法者实施的强制性惩罚措施。 它包括:行政处罚、行政处分。 在本题中,交通部门的罚款和拘留的处罚方式属于行政制裁的领域,故排除AC。 行政处分和行政处罚的区别:行政处分的对象是违法失职的国家公务员或所属人员,行政处罚的对象是违反特定行政法规的公民或社会组织。 本题中,沈某的情形并不属于国家公务人员的违法失职行为,而属于特定公民违反交通行政法规的情形。","k":"","kb":13,"kh":[[226,293]]},{"id":"2011-12","y":2011,"t":"单","s":"下列情形中,属于法律责任免除的法定事由的是（ ）。","o":["精神失常","正当防卫","有重大立功表现","未达到法定责任年龄"],"a":"C","e":"\u0001法律责任免除是指责任主体的侵害行为符合法律责任的构成要件,应当承担法律责任,但是由于符合法律的特别规定而可以免除或者减轻其 \" \" , \" 无责任 \" 不负责任责任。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✓ 符合题意及现行制度规定（\u0001有重大立功表现\u0002）\nD✗ 像未达到法定责任年龄、精神失常、正当防卫紧急避险,属于法律规定的不负责任的条件,而不 \" 良是免责的条件,故排除ABD\n这里必须区分免责和免责是以法律责任的存在为前提的,而后两者并不存在责任。","k":"","kb":13,"kh":[[0,12],[84,138]]},{"id":"2011-50","y":2011,"t":"多","s":"下列情形中,体现责任自负原则的有（ ）。","o":["冯某因盗窃被判有期徒刑三年","陈某饲养的狗咬伤邻家小孩,陈某为此赔偿五百元","褚某因下级官的渎职行为承担领导责任被撤职","卫某因冒名顶罪被司法机关以包庇罪判处有期徒刑一年"],"a":"ABCD","e":"\u0001责任自负原则,包括三点:(1)违法行为人应当对自己的违法行为负责。\u0002\nA✓ 本题考查的是具体原则的内容\nB✓ 符合题意及现行制度规定（\u0001陈某饲养的狗咬伤邻家小孩,陈某为此赔\u0002）\nC✓ 这些情况同样体现责任自负的原则\nD✓ 符合题意及现行制度规定（\u0001卫某因冒名顶罪被司法机关以包庇罪判处\u0002）\n(2)不能让没有违法行为的人承担法律责任,即反对株连或变相株连; (3)要保证责任人受到法律追究,也要保证无责任人不受法律追究,做到不枉不纵。 故ABD 都体现了上述三个要求。 值得注意的是,在某些特殊的情况下, 为了法律秩序特别是财产保护上的需要.也产生责任转承的问题,比如监护人对被监护人承担替代责任, 上级对下级承担替代责任等。 注意法律责任的归责原则的种类,主要包括:责任法定、责任与处罚相称、责任自负和因果关系四种。","k":"","kb":13,"kh":[[0,12],[84,138]]},{"id":"2012-5","y":2012,"t":"单","s":"甲因停车收费与保安乙发生冲突,抽刀将乙刺死。甲在检察机关准备提起公诉期间因病死亡,检察机关遂作出撤销案件的决定。此案撤销的根据是 （ ）。","o":["违法行为","事件","免责事由","事实构成"],"a":"B","e":"\u0001法律事件, 是法律规范规定的、与当事人意志无关的,且能够引 2012年全国法律硕士(非法学)联考真题答案详解专业综合课起法律关系发生、变更或消灭的客观事实。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 本案中,检察机关撤销案件是由于与检察机关的意志无关的甲的死亡引起的,因此属于事件\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选\n法律事实能够引起法律关系产生、变更或消灭。 按照法律事实是否与当事人的意志有关,可以把法律事实分为法律事件和法律行为。 法律行为指的是与当事人意志有关的,能够引起法律关系产生、变更或消灭的作为和不作为。 【点评】法律事件与法律行为的区别是高频考点,考生一定要学会区分。 它们最主要的区别就是是 \"当事人 \"不是 \"。 \"人否与当事人的意志有关,记住是","k":"","kb":12,"kh":[[0,16],[196,279]]},{"id":"2013-9","y":2013,"t":"单","s":"某街道办事处主任陈某利用其掌握的城市居民低保资格复核权,收受申请人好处费,被上级机关撤销主任一职。陈某受到的法律制裁属于（ ）。","o":["行政处罚","刑事制裁","民事制裁","行政处分"],"a":"D","e":"\u0001行政处分,是国家行政机关或其他组织依照行政隶属关系,对于违法失职的国家公务员或者所属人员实施的惩罚措施,主要有警告、记过、记大过、降级、降职、开除等。\u0002\nA✗ 行政处罚是指由特定机关对违反行政法规的公民或者社会组织实施的惩罚措施\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ 行政处分,是国家行政机关或其他组织依照行政隶属关系,对于违法失职的国家公务员或者所属人员实施的惩罚措施,主要有警告、记过、记大过、降级、降职、开除等\n根据违法行为和法律责任的性质不同, 法律制裁可以分为民事制裁、刑事制裁、行政制裁和违宪制裁。 行政制裁又可分为行政处分、行政处罚。 违宪制裁是对违宪行为所实施的法律制裁。 此题属于对国家工作人员违法活动的惩罚,即行政处分。","k":"","kb":13,"kh":[[0,12],[226,293]]},{"id":"2014-3","y":2014,"t":"单","s":"下列有关法律责任的表述,正确的是（ ）。","o":["民事责任主要是一种财产责任","从刑事法律角度上看,法律义务就是法律责任","违法就应承担法律责任,不违法就不承担法律责任","过错责任既要承担行为上的责任,也要承担思想上的责任"],"a":"A","e":"\u0001民事责任主要是财产责任,比如赔偿损失、支付违约金等。\u0002\nA✓ 民事责任主要是财产责任,比如赔偿损失、支付违约金等\nB✗ 在刑法中也是如此\nC✗ 法律责任是指行为人由于违法行为违约行为或法律规定而应当承受某种不利的法律后果,所以不违法也可能产生法律责任\nD✗ 过错责任只要承担行为上的责任,不用承担思想上的责任\n法律中的法律义务并不等同法律责任,法律义务是构成法律责任的法定前提条件,但违反法律义务并不一定要承担法律责任。","k":"","kb":13,"kh":[[0,12],[13,47]]},{"id":"2016-49","y":2016,"t":"多","s":"下列情形中,符合我国法定免责条件的有（ ）。","o":["14周岁的刘某盗窃他人财物","赵某犯罪后,有重大立功表现","王某恶意诽谤孙某,孙某念及两人往日情谊没有起诉王某","李某在火锅店用餐时被烫伤,两年后李某起诉火锅店要求民事赔偿"],"a":"BC","e":"\u0001免责,是指法律责任由于出现法定条件 \"不负责任被部分或者全部免除。\u0002\nA✗ 根据刑法的规定,14周岁的刘某不成立盗窃罪,不对盗窃行为负法律责任,而不是免除责任\nB✓ 符合题意及现行制度规定（\u0001赵某犯罪后,有重大立功表现\u0002）\nC✓ 符合题意及现行制度规定（\u0001王某恶意诽谤孙某,孙某念及两人往日情\u0002）\nD✗ 本题原答案选了该项,因为根据\u0001《民法通则》\u0002的规定,人身损害赔偿的诉讼时效是一年,两年后李某才提起诉讼,已经过了诉讼时效,火锅店因为时效已过免责\n免责不同于 \" 无责任 \",因为免责是以法律责任的存在为前提的。 不应把未达到法定责任年龄、精神失常、正当防卫、紧急避险等不负法律责任的条件当作免除责任的条件。 “赵某犯罪后,有重大立功表现”是自首立功免责,相关表述是不诉免责,都是正确答案。 但现在根据\u0001《民法典总则编(草案)》\u0002的规定, 人身损害赔偿的诉讼时效是三年,李某两年后提起诉讼,在诉讼时效期间内,火锅店不能因为时效免责,相关表述不再正确。\n【修法提示】2017年《民法总则》（现《民法典》第188条）已将普通民事诉讼时效期间由2年延长为3年（2016年原题依旧法把“两年后起诉”也算作时效免责，现行《民法典》下两年尚未届满时效，仅立功与不诉属免责）。","k":"","kb":13,"kh":[[84,138],[138,225]]},{"id":"2017-7","y":2017,"t":"单","s":"甲因琐事与乙发生冲突,将乙打伤。甲赶紧打 120电话,并随救护车将乙送往医院,乙被诊断为轻伤,经及时救治痊愈出院。甲支付了乙的医疗费等费用。事后,甲未被追究法律责任。根据上述材料,甲被免责的原因是（ ）。","o":["有效补救免责","立功免责","协议免责","自助免责"],"a":"A","e":"\u0001有效补救免责,指对于那些实施违法行为,造成一定损害,但在国家机关归责之前采取及时补救措施的人,免除其部分或全部责任。\u0002\nA✓ 本题中,甲在司法机关追责之前,主动将乙送至医院且支付了乙的医疗费,乙被治愈出院,甲采取了及时补救措施,因此免责\nB✗ 立功免责是指对那些违法之后有立功表现的人,免除其部分或者全部法律责任\nC✗ 刑事责任是不可以通过协议的方式免责的\nD✗ 自助免责是指对自助行为所引起的法律责任的减轻或免除\n自助行为是指权利人为保护自己的权利,在情势紧迫而又不能及时请求国家机关予以救助的情况下,对他人的财产或自由施加扣押、拘束或其他相应措施,而为法律或公共道德所认可的行为。","k":"","kb":13,"kh":[[0,12],[138,225]]},{"id":"2018-2","y":2018,"t":"单","s":"关于法律责任和法律制裁的关系,下列表述正确的是（ ）。","o":["有法律责任就有法律制裁","有法律制裁必有法律责任","法律责任是法律制裁的体现","法律制裁和法律责任互为条件"],"a":"B","e":"\u0001法律制裁是法律责任的体现,而非相反。\u0002\nA✗ 法律责任与法律制裁的关系:\nB✓ 符合题意及现行制度规定（\u0001有法律制裁必有法律责任\u0002）\nC✗ 法律制裁是法律责任的体现,而非相反\nD✗ 法律责任是法律制裁的前提,法律制裁是法律责任的结果和体现,而不是互为条件\n法律责任与法律制裁的关系: 有法律责任也不一定有法律制裁,因为还存在免责事由。","k":"","kb":13,"kh":[[0,12],[84,138]]},{"id":"2018-44","y":2018,"t":"多","s":"乘客张某因迟到而被拒绝登机,在机场吵闹不休,殴打航空公司工作人员,被公安机关依法行政拘留,航空公司将张某列入“拒绝乘载人员名单”,下列关于该事件的说法,正确的有（ ）。","o":["航空安全优先于张某乘坐航班的自由","对张某的治安处罚,可因其有立功表现而减轻或免除","航空公司因张某迟到而拒绝其登机,侵犯了他的民事权利 )。","将张某列入“拒绝承载人员名单”,是航空公司追究其民事责任的具体体现"],"a":"AB","e":"\u0001秩序在此处要优千小部分人的自由。\u0002\nA✓ 秩序在此处要优千小部分人的自由\nB✓ 治安处罚可因立功而减轻或免除处罚\nC✗ 将乘客列入黑名单与追究民事责任无关\nD✗ 与题干设问或现行制度要件不符，故不选\n张某本身迟到,拒绝登机并未侵犯其公民权利。","k":"","kb":13,"kh":[[138,225]]},{"id":"2020-5","y":2020,"t":"单","s":"下列关于法律责任中“免责”的表述，正确的是（ ）。","o":["免责以法律责任的存在为前提","免责意味着被免责的行为合法","自助行为应当免除全部法律责任","免责制度的目的在于保证无责任者不受法律追究"],"a":"A","e":"\u0001免责,也称法律责任的减轻和免除,是指法律责任由于出现法定条件被部分或全部地免除。\u0002\nA✓ \" 或 \" ,因为免责以法 \" 无责任 \" 不负责任免责不同于律责任的存在为前提,而后两者并不存在责任\nB✗ 免责并不意味着被免责的违法行为是合理的、法律允许的或法律不管的,更不意味着被免责的行为是法律所赞成或支持的\nC✗ 自助免责,指对自助行为所引起的法律责任的减轻或免除,自助行为可以免除部分或全部法律责任,而非应当免除全部法律责任\nD✗ 责任自负原则是指违法行为人应当对自己的违法行为负责,要保证责任人受到法律追究,也要保证无责任者不受法律追究,这是责任自负原则的目的,而非免责制度的目的\n不应把未达到法定责任年龄、精神失常、正当防卫、紧急避险等不负法律责任的条件当作免除责任的条件。","k":"","kb":13,"kh":[[0,12],[84,138]]},{"id":"2020-43","y":2020,"t":"多","s":"甲与乙签订租房合同,约定:“甲方应按时交房,否则向乙方支付月房租百分之二十的违约金。”后双方因违约金发生争议而诉诸法院。对此,下列说法正确的有（ ）。","o":["该租房合同是规范性法律文件","依据该租房合同,按时交房是甲方的相对义务","该租房合同的签订使甲乙双方产生了权利义务关系","合同中关于违约金的约定,是法院确定法律责任的重要依据"],"a":"BCD","e":"\u0001规范性法律文件和非规范性法律文件的主要区别就是,前者针对的对象是一般的人或事, 具有普遍性,而后者针对的是特定的人或事,不具有普遍性。\u0002\nA✗ 甲乙之间的租房合同只对甲乙双方有约束力,不具有普遍约束力,不是规范性法律文件\nB✓ 符合题意及现行制度规定（\u0001依据该租房合同,按时交房是甲方的相对\u0002）\nC✓ 甲乙签订合同,双方产生相应的权利义务关系,按时交房是甲方的义务,按时支付租金是乙方的义务,该项\nD✓ 民法尊重当事人意思自治,合同中关于违约金的约定,是法院确定法律责任的重要依据","k":"","kb":13,"kh":[[0,12],[84,138]]},{"id":"2021-1","y":2021,"t":"单","s":"我国《民法典》第一百八十五条规定:“侵害英雄烈士等的姓名、肖像、名誉、荣誉,损害社会公共利益的,应当承担民事责任。”从法律规则的逻辑结构看,该规则中的行为模式是（ ）。","o":["勿为","当为","可为","应为"],"a":"A","e":"\u0001本题中《民法典》的规定,要求 '',因此是 \"不得侵害烈士等的姓名、肖像、名誉、荣誉勿为模式。\u0002\nA✓ 本题中\u0001《民法典》\u0002的规定,要求 '',因此是 \"不得侵害烈士等的姓名、肖像、名誉、荣誉勿为模式\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选\n根据行为要求的内容和性质不同,法律规则中的行为模式分为三种:可为的模式、应该为的模式和不得为的模式。","k":"","kb":13,"kh":[[84,138],[138,225]]},{"id":"2021-9","y":2021,"t":"单","s":"某县县长因贪污受贿,被开除党籍、开除公职, 并被判处有期徒刑15年、没收个人财产。关于该案的处理,下列表述正确的是（ ）。","o":["判处有期徒刑15年是刑事制裁","没收个人财产是民事制裁","开除党籍是政务处分","开除公职是行政处罚"],"a":"A","e":"\u0001没收个人财产是刑事制裁,开除党籍是党纪处分,开除公职是行政处分,BC。\u0002\nA✓ 判处有期徒刑是刑事制裁\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 没收个人财产是刑事制裁,开除党籍是党纪处分,开除公职是行政处分,BC","k":"","kb":13,"kh":[[226,293]]},{"id":"2021-42","y":2021,"t":"多","s":"张某与李某因琐事发生争执,用砖块将李某打成轻伤。张某事后主动送李某去医院治疗,积极赔偿,并向公安机关自首。法院判决张某犯故意伤害罪,免予刑事处罚。该判决考量的免责事由有（ ）。","o":["自首","有效补救","自助","时效"],"a":"AB","e":"\u0001自首立功免责,指对那些违法之后有自首或立功表现的人,免除其部分或全部法律责任。\u0002\nA✓ 符合题意及现行制度规定（\u0001自首\u0002）\nB✓ 有效补救免责,指对于那些实施违法行为,造成一定损害,但在国家机关归责之前采取及时补救措施的人, 免除其部分或全部责任\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选\n张某在打伤人后主动向公安机关自首,并积极赔偿,免责事由是自首和有效补救,该项 本题不存在自助和时效免责的情形, 该项","k":"","kb":13,"kh":[[0,12],[138,225]]},{"id":"2022-4","y":2022,"t":"单","s":"我国《公职人员政务处分法》第5条规定:“给予公职人员政务处分,应当事实清楚、证据确凿、定性准确、处理恰当、程序合法、手续完备。”关于该条中法律规则逻辑结构的表述,正确的是（ ）。","o":["该条包含行为模式","该条包含行为模式和法律后果","该条包含假定条件和法律后果","该条包含假定条件、行为模式和法律后果"],"a":"A","e":"\u0001一般观念认为,法律规则主要由假定 (条件)、行为模式、法律后果三个要素组成。\u0002\nA✓ 我国\u0001《公职人员政务处分法》第5条\u0002的内容,是要求相关人员在对公职人员给予政务处分时,应当做到事实清楚、证据确凿、定性准确、处理恰当、程序合法、手续完备,这是对行为模式的描述\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 虽然在逻辑结构上,任何一个完整的法律规则都是由假定(条件)、行为模式和法律后果三部分构成的,但是三个要素往往不表现于同一个条文当中,有些法律规则在表现形式上只有行为模式和法律后果两项要素,而…\n假定又称条件,是规则中关于适用该规则的条件的规定。 行为模式是指法律规则中关于行为的规定,即法律关于允许做什么、禁止做什么和必须做什么的规定,它是从人们大量的实际行为中概括出来的法律行为要求。 法律后果是指法律规则中对遵守规则或违反规则的行为予以肯定或否定评价的规定。 虽然在逻辑结构上,任何一个完整的法律规则都是由假定(条件)、行为模式和法律后果三部分构成的,但是三个要素往往不表现于同一个条文当中,有些法律规则在表现形式上只有行为模式和法律后果两项要素,而假定(条件)这一要素被省略了。 \u0001《公职人员政务处分法》第5条\u0002即属于只体现了行为模式而没有体现假定(条件)与法律后果的条文。","k":"","kb":9,"kh":[[15,66],[86,121]]},{"id":"2023-4","y":2023,"t":"单","s":"下列规定中,不属于免责情形的是（ ）。","o":["因正当防卫造成损害的,不承担民事责任","对于自首的犯罪分子,可以从轻或者减轻处罚","违反治安管理行为在六个月内没有被公安机关发现的,不再处罚","主动消除或者减轻违法后果,并取得被侵害人谅解的,减轻处罚或者不予处罚"],"a":"A","e":"\u0001正当防卫造成损害不承担民事责任属于不负法律责任（无责任），而非免责。\u0002\nA✓ 正当防卫系合法防卫行为，行为人\u0001根本不成立违法与法律责任\u0002，属于“无责任”而非免责\nB✗ 自首从轻或减轻处罚属于典型的\u0001自首立功免责\u0002（全部或部分免除刑事责任）\nC✗ 治安管理处罚超过六个月追究期不再处罚属于\u0001时效免责\u0002\nD✗ 主动消除减轻后果并取得谅解而不予处罚属于\u0001有效补救与协议/人道免责\u0002\n区分“免责”与“无责任”的关键在于\u0001法律责任是否业已存在\u0002：免责以责任成立为前提，未成年人、精神病人或正当防卫则根本不成立责任。","k":"","kb":13,"kh":[[84,138],[138,225]]},{"id":"2025-9","y":2025,"t":"单","s":"A 旅游公司与旅客签订《旅游服务合同》,其中约定:“本公司承诺在任何情形下保障旅客的人身安全,否则承担旅客的一切损失。”后A 公司客车载客前往旅游地时遭遇道路塌方, 司机虽竭力避免但客车仍坠入山谷,造成部分旅客伤亡。A 公司积极支付伤亡者的医疗费和丧葬费,并与伤亡者及其家属达成赔偿和解协议。对此,下列说法正确的是（ ）。","o":["该约定前半句设定的是A 公司的义务,后半句设定的是A 公司的责任","A 公司对于事故的发生没有过错,因而不应承担法律责任","A 公司积极支付医疗费和丧葬费,属于自助免责事由","A 公司与伤亡者及其家属达成的赔偿和解协议属于民事制裁的表现形式"],"a":"A","e":"\u0001对于事故的发生虽然该项 公司没有过错,但合同约定\"在任何情形下\"保障旅客安全,体现的是无过错责任原则,因此该项 公司仍应承担法律责任。\u0002\nA✓ 后半句\"承担旅客的一切损失\"设定的是该项 公司的责任,即违反义务后应承担的后果\nB✗ 对于事故的发生虽然该项 公司没有过错,但合同约定\"在任何情形下\"保障旅客安全,体现的是无过错责任原则,因此该项 公司仍应承担法律责任\nC✗ 公司积极支付医疗费和丧葬费是有效补救免责,不是自助免责\nD✗ 赔偿和解协议是双方自愿达成的民事赔偿协议,不属于民事制裁\n\u0001《旅游服务合同》\u0002中约定前半句\"保障旅客的人身安全\"设定的是该项 公司的义务, 即必须保障旅客的人身安全;","k":"","kb":13,"kh":[[0,12],[13,47]]},{"id":"2026-9","y":2026,"t":"单","s":"甲在某线上平台注册为用户后,经常收到推销短信。经了解,该平台售卖了甲的个人信息。甲诉至人民法院,要求该平台立即停止侵害并赔偿损失。经法院调解,平台向甲赔礼道歉并赔偿损失。对此,下列表述正确的是（ ）。","o":["甲注册为平台用户,属于法律事件","不得泄露或售卖甲的个人信息,属于平台的积极义务","甲要求平台停止侵害并赔偿损失,属于行使请求权","法院调解后平台向甲赔礼道歉并赔偿损失,属于实施民事制裁"],"a":"C","e":"\u0001请求权是权利人要求他人为/不为一定行为,甲要求停止侵害、赔偿损失属于人格权请求权。\u0002\nA✗ 注册是有意识法律行为\nB✗ 禁止泄露是消极不作为义务\nC✓ 请求权是权利人要求他人为/不为一定行为,甲要求停止侵害、赔偿损失属于人格权请求权\nD✗ 调解自愿履行不属于法院民事制裁\n\u0001“甲注册为平台用户,属于法律事件”\u0002：注册是有意识法律行为;","k":"","kb":12,"kh":[[43,90],[196,279]]},{"id":"2026-43","y":2026,"t":"多","s":"我国《刑法》第八十七条规定：“犯罪经过下列期限不再追诉：（一）法定最高刑为不满五年有期徒刑的，经过五年……”关于该规定说法不正确的有（ ）。","o":["属于时效免责情形","属于任意性规则","意味着《刑法》关于犯罪的规定在一定期限后效力终止","表明《刑法》对经过一定期限的犯罪不再给予否定性评价"],"a":"BCD","e":"\u0001选错项) “属于时效免责情形”：追诉期满属于时效免责正确。\u0002\nA✗ 选错项) 追诉期满属于时效免责\nB✓ 追诉时效是强制性规则\nC✓ 刑法对犯罪的评价不消灭,仅丧失追诉权\nD✓ 法律仍否定该行为,只是不追责","k":"","kb":13,"kh":[[0,12],[138,225]]}]},{"sub":"中国宪法学","name":"宪法效力、解释与合宪性审查","w":1.5,"w5":1.0,"wh":1.4,"bt":"回补","pt":"备案审查/特区法规审查连续热点·客观待回补","L":25,"qs":[{"id":"2007-30","y":2007,"t":"单","s":"由专门机关负责保障宪法实施的体制起源于 （ ）。","o":["1215 年英国的自由大宪章","1799 年法国宪法设立的护法元老院","1803 年美国联邦最高法院审理马伯里诉麦迪逊案","1936 年苏联宪法设立的最高苏维埃主席团"],"a":"B","e":"\u0001宪法实施保障的体制 1215 年英国自由大宪章中并没有规定宪法保障体制问题,而且英国和苏联一样,实行的是立法机关负责保障宪法实施的体制。\u0002\nA✗ 宪法实施保障的体制 1215 年英国自由大宪章中并没有规定宪法保障体制问题,而且英国和苏联一样,实行的是立法机关负责保障宪法实施的体制\nB✓ 由专门机关负责保障宪法实施的体制起源于 1799 年法国宪法设立的护法元老院\nC✗ 美国 1803 年的马伯里诉麦迪逊案开创了联邦最高法院审查联邦国会制定的法律是否符合宪法的先例,这是司法机关负责保障宪法实施的体制\nD✗ 与题干设问或现行制度要件不符，故不选","k":"","kb":25,"kh":[[122,229]]},{"id":"2010-21","y":2010,"t":"单","s":"下列对特定国家宪法解释体制的表述,正确 的是（ ）。","o":["法国采用国家元首解释体制","俄罗斯采用立法机关解释体制","美国采用司法机关解释体制","德国采用公民团体解释体制"],"a":"C","e":"\u0001宪法解释体制分为司法机关解释模式 (美国加拿大、日本、澳大利亚等)、立法机关解释模式(英国、中国等)和专门机关解释模式(法国的宪法委员会,德、奥、意、俄、韩的宪法法院)。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✓ 宪法解释体制分为司法机关解释模式 (美国加拿大、日本、澳大利亚等)、立法机关解释模式(英国、中国等)和专门机关解释模式(法国的宪法委员会,德、奥、意、俄、韩的宪法法院)\nD✗ 与题干设问或现行制度要件不符，故不选","k":"","kb":25,"kh":[[122,229]]},{"id":"2010-22","y":2010,"t":"单","s":"根据我国现行《宪法》和法律的规定,罢免人民代表大会代表的决议的备案机关是（ ）。","o":["本级人民代表大会","本级人民代表大会常务委员会","上一级人民代表大会","上一级人民代表大会常务委员会"],"a":"D","e":"\u0001《全国人民代表大会和地方各级人民 \"罢免由县级以上的地方各级代表大会选举法》规定: 人民代表大会选出的代表,须经各该级人民代表大会过半数的代表通过。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ 罢免的决议,须报送上一级人民代表大会常务委员会备案、公告\n在代表大会闭会期间,须经常务委员会组成人员的过半数通过。 \"本题纯粹考查法条的记忆。","k":"","kb":37,"kh":[[0,30],[379,441]]},{"id":"2010-27","y":2010,"t":"单","s":"近期,几位法学教授撰文指出,对于城市房屋拆迁,依据我国宪法和法律关于宪法监督的规定,拆迁管理条例的部分内容与我国现行宪法相抵触。他们可以（ ）。","o":["向国务院书面提出进行审查的建议","向最高人民法院书面提出进行审查的建议","向全国人民代表大会书面提出进行审查的建议","向全国人民代表大会常务委员会书面提出进行审查的建议"],"a":"D","e":"\u0001(注意《立法法》第99条规定的不同主体提出审查的不同方式,军委、两高和省级人大及其常委会是向全国人大常委会书面提出审查的要求,而其他机关、团体和公民只能提出审查的建议。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ 前款规定以外的其他国家机关和社会团体、企业事业组织以及公民认为行政法规、地方性法规、自治条例和单行条例同宪法或者法律相抵触的,可以向全国人民代表大会常务委员会书面提出进行审查的建议,由常务委…\n2015年新修改的\u0001《立法法》\u0002第99 条规定,国务院、中央军事委员会、最高人民法院、最高人民检察院和各省、自治区、直辖市的人民代表大会常务委员会认为行政法规、地方性法规、自治条例和单行条例同宪法或者法律相抵触的,可以向全国人民代表大会常务委员会书面提出进行审查的要求,由常务委员会工作机构分送有关的专门委员会进行审查、提出意见。 前款规定以外的其他国家机关和社会团体、企业事业组织以及公民认为行政法规、地方性法规、自治条例和单行条例同宪法或者法律相抵触的,可以向全国人民代表大会常务委员会书面提出进行审查的建议,由常务委员会工作机构进行研究,必要时,送有关的专门委员会进行审查、提出意见。 有关的专门委员会和常务委员会工作机构可以对报送备案的规范性文件进行主动审查。","k":"","kb":37,"kh":[[199,378],[379,441]]},{"id":"2011-19","y":2011,"t":"单","s":"在宪法理论上,宪法监督是宪法保障的核心内容,其具体监督方式是（ ）。","o":["违宪审查","宪法遵守","宪法制定","宪法修改"],"a":"A","e":"\u0001宪法保障以宪法监督为核心内容,是国家为了促进宪法的贯彻落实而建立的制度总称。\u0002\nA✓ 宪法监督作为宪法保障的核心内容, 在方式上主要表现为违宪审查\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选\n宪法保障这种制度在我国具有独特之处,反映了我国的社会主义本质。 违宪审查是由特定的机关根据特定的程序或者方式,针对违反宪法的行为或者规范性、非规范性文件进行审查并进行处理的制度。 相对其他宪法监督的制度而言,由于行使违宪审查权的机关往往具有很高的政治地位和权力,违宪审查可以使违宪行为受到宪法制裁,具有实际的法律效力和制裁后果,故能够最大限度地保证宪法的权威和实施。","k":"","kb":25,"kh":[[16,121]]},{"id":"2012-54","y":2012,"t":"多","s":"宪法是我国的根本法,具有最高的法律效力。其表现有（ ）。","o":["国家维护社会主义法制的统一和尊严","任何法律、行政法规和地方性法规都不得同宪法相抵触","一切国家机关和武装力量、各政党、社会团体和企事业组织都必须以宪法为根本的活动准则","任何违反宪法的行为都必须予以追究"],"a":"ABCD","e":"\u0001宪法的形式特征包括宪法内容的根本性宪法效力的最高性以及宪法制定、修改程序的特殊性。\u0002\nA✓ 符合题意及现行制度规定（\u0001国家维护社会主义法制的统一和尊严\u0002）\nB✓ 一切法律、行政法规和地方性法规等规范都不得与宪法相抵触,如果与宪法有所抵触,则无效\nC✓ (2)对人的最高效力,即宪法是一切国家机关、政治力量、政治组织以及一切社会组织和个人的根本活动准则,任何组织和个人都不得享有超越于宪法之上的特权\nD✓ 国家维护社会主义法制的统一和尊严,任何违反宪法的行为都必须予以追究\n其中,宪法效力的最高性体现为:(1) 对法的最高效力,即宪法是其他一般法律的立法基础,是其他一般法律制定的依据和基础,为其提供立法原则;","k":"","kb":25,"kh":[[0,15],[16,83]]},{"id":"2013-17","y":2013,"t":"单","s":"关于我国的宪法监督,下列说法正确的是（ ）。","o":["全国人大有权撤销省级人大及其常委会制定的地方性法规","全国人大常委会有权改变国务院制定的不适当的行政法规","国务院有权改变或者撤销地方人民政府工作部门的不适当的决定和命令","县级以上地方各级人大常委会有权撤销本级人民政府不适当的决定和命令"],"a":"D","e":"\u0001此题考核宪法监督制度。\u0002\nA✗ 全国人民代表大会有权改变或者撤销全国人大常委会不适当的决定,无权撤销省一级人大及其常委会制定的地方性法规\nB✗ 全国人大常委会有权撤销国务院制定的同宪法相抵触的行政法规、决定和命令,无权改变\nC✗ 国务院有权改变或者撤销地方各级国家行政机关的不适当的决定和命令\nD✓ 县级以上的地方各级人民代表大会常务委员会有权撤销本级人民政府的不适当的决定和命令\n\"而非 \"撤销 \"改变须注意,常委会的权力一般都是","k":"","kb":37,"kh":[[0,30],[199,378]]},{"id":"2013-53","y":2013,"t":"多","s":"下列关于宪法优位的说法,正确的有（ ）。","o":["法律必须受宪法约束","行政法规不得同宪法相抵触","国家机关的行为必须有明确的宪法依据","宪法优位要求在行政机关和立法机关的关系上遵循法律优位原则"],"a":"ABD","e":"\u0001宪法优位,指宪法作为国家的最高法律,法律必须受宪法约束。\u0002\nA✓ 宪法优位,指宪法作为国家的最高法律,法律必须受宪法约束\nB✓ 符合题意及现行制度规定（\u0001行政法规不得同宪法相抵触\u0002）\nC✗ 国家机关的行为应当有法律依据,但不一定有明确的宪法依据\nD✓ 为了确保一个国家法制的统一,宪法优位还进一步要求在行政和立法机关之间的关系上要遵循法律优位的原则,也就是说行政机关的一切行政行为或其他活动都不得与法律相抵触\n也就是说,人民代表大会及其常委会制定的法律,必须受到宪法的约束,而不能与宪法相抵触,否则无效。 \u0001“国家机关的行为必须有明确的宪法依据”\u0002,国家机关的行为应当有法律依据,但不一定有明确的宪法依据。","k":"","kb":25,"kh":[[83,121]]},{"id":"2014-21","y":2014,"t":"单","s":"下列关于宪法解释体制的表述,正确的是（ ）。","o":["社会主义国家一般由最高国家权力机关解释宪法","德国创设了由立法机关解释宪法的体制","日本是最早采用宪法法院进行宪法解释的国家","美国经由马伯里诉麦迪逊案确立了专门机关解释宪法的体制"],"a":"A","e":"\u0001社会主义国家一般都确立了最高国家权力机关解释宪法的模式。\u0002\nA✓ 例如,我国宪法的解释权就是由国家权力机关行使,即由全国人大常委会行使宪法解释权\nB✗ 德国的宪法解释体制是专门机关解释体制,建立了宪法法院\nC✗ 最早采用宪法法院进行宪法解释的国家是奥地利\nD✗ 美国经由马伯里诉麦迪逊案确立了司法机关解释宪法的体制\n因此选相关表述。","k":"","kb":25,"kh":[[122,229]]},{"id":"2015-15","y":2015,"t":"单","s":"美国1803年马伯里诉麦迪逊案(Marburyv. Madison)所确立的制度是（ ）。","o":["联邦制","司法独立","议会至上","司法审查"],"a":"D","e":"\u0001联邦最高法院在1803年马伯里诉麦迪逊案中创立了违宪审查制度,确立由普通法院行使违宪审查权,也即司法审查制度。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ 联邦最高法院在1803年马伯里诉麦迪逊案中创立了违宪审查制度,确立由普通法院行使违宪审查权,也即司法审查制度","k":"","kb":25,"kh":[[122,229]]},{"id":"2015-52","y":2015,"t":"多","s":"在我国,宪法的根本法地位表现在（ ）。","o":["法律效力上,宪法具有最高法律效力","修改程序上,宪法比普通法律更为严格","内容上,宪法规定国家最根本、最重要的制度","解释上,宪法只能由全国人大进行解释"],"a":"ABC","e":"\u0001现行宪法明文规定宪法解释的机关是全国人大常委会。\u0002\nA✓ 符合题意及现行制度规定（\u0001法律效力上,宪法具有最高法律效力\u0002）\nB✓ 宪法的根本法地位表现在:宪法内容的根本性,宪法效力的最高性,宪法制定、修改程序的特殊性\nC✓ 符合题意及现行制度规定（\u0001内容上,宪法规定国家最根本、最重要的\u0002）\nD✗ 现行宪法明文规定宪法解释的机关是全国人大常委会\n关于宪法的几个基本知识点,考生要注意加以区分,制宪权的主体是人民,制宪机关是全国人民代表大会,修改宪法的机关是全国人大, 解释宪法的机关是全国人大常委会。","k":"","kb":25,"kh":[[0,15],[16,83]]},{"id":"2016-26","y":2016,"t":"单","s":"下列国家中,采用专门机关模式进行违宪审查的是（ ）。","o":["美国","德国","英国","日本"],"a":"B","e":"\u0001美国、日本采用普通法院模式进行违宪审查,该项。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 德国采用专门机关模式一宪法法院进行违宪审查\nC✗ 英国采用立法机关模式一议会进行违宪审查\nD✗ 与题干设问或现行制度要件不符，故不选","k":"","kb":25,"kh":[[122,229]]},{"id":"2016-28","y":2016,"t":"单","s":"关于较大的市的人大及其常委会制定的地方性法规的备案,下列表述正确的是（ ）。","o":["直接报国务院备案","报省、自治区政府备案","报省、自治区人大常委会备案","经省、自治区人大常委会批准后,报全国人大常委会和国务院备案"],"a":"D","e":"\u0001《立法法》第98条第二项规定:省、自治区、直辖市的人民代表大会及其常务委员会制定的地方性法规,报全国人民代表大会常务委员会和国务院备案。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ 根据上述规定,较大的市人大及其常委会制定的地方性法规,由省级人大常委会批准后施行,由省级人大常委会报全国人大常委会和国务院备案\n设区的市、自治州的人民代表大会及其常务委员会制定的地方性法规,由省、自治区的人民代表大会常务委员会报全国人民代表大会常务委员会和国务院备案。","k":"","kb":26,"kh":[[79,115],[116,164]]},{"id":"2017-17","y":2017,"t":"单","s":"关于宪法解释,下列表述正确的是（ ）。","o":["非正式的宪法解释可以具有宪法效力","语义解释是从宪法制定的特定背景人手进行的解释","法国宪法委员会对宪法的解释属于专门机关的解释","我国人民法院对宪法规范的解释属于正式解释"],"a":"C","e":"\u0001宪法解释是指在宪法实施过程中,享有宪法解释权的国家机关依照法定的程序对宪法的含义、内容和界限所作的说明和补充。\u0002\nA✗ 正式解释是享有宪法解释权的机关对宪法作出的具有宪法效力的解释,非正式解释是指有解释权之外的机关或个人对宪法的理解,没有法律效力\nB✗ 宪法解释的方法中,语义解释是指根据宪法规范所使用的文字的字面意思进行解释\nC✓ 宪法解释的体制分为立法机关解释体制、司法机关解释体制、专门机关解释体制,法国宪法委员会 自治范围内的事项,由村民会议制定,不属于合宪性审查的对象\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 行政法规、地方性法规、自治条例、单行条例、司法解释等属于合宪性审查对象","k":"","kb":25,"kh":[[0,15],[299,351]]},{"id":"2021-22","y":2021,"t":"单","s":"下列关于我国宪法宣誓制度的表述,正确的是（ ）。","o":["宣誓人包括国家工作人员和人大代表","国务院各部委负责人的宣誓仪式由国务院组织","宪法宣誓制度为我国所首创","宣誓可以分为单独宣誓和集体宣誓"],"a":"D","e":"\u0001宪法宣誓人员不包括人大代表。\u0002\nA✗ 宪法宣誓人员不包括人大代表\nB✗ 国务院各部门任命的国家工作人员的宪法宣誓,由各部门分别组织\nC✗ 宪法宣誓制度不是我国首创\nD✓ 其他宣誓人整齐排列,右手举拳, 跟诵誓词\n宜誓仪式根据情况,可以采取单独宣誓或者集体宜誓的形式。 单独宣誓时,宣誓人应当左手抚按\u0001《中华人民共和国宪法》\u0002,右手举拳,诵读誓词。 集体宣誓时,由一人领誓,领誓人左手抚按\u0001《中华人民共和国宪法》\u0002,右手举拳,领诵誓词; 国务院任命的国家工作人员的宪法宣誓,由国务院人事行政主管部门会同国务院办公厅具体组织。","k":"","kb":25,"kh":[[230,299]]},{"id":"2022-13","y":2022,"t":"单","s":"下列关于近代宪法的表述,正确的是（ ）。","o":["近代宪法普遍强调自由竞争和公民社会权利保障的协调","1787年美国宪法创立了由宪法委员会进行合宪性审查的体制","1919年德国魏玛宪法标志着近代宪法向现代宪法的转型","近代宪法大多主张对公民的文化权利进行保护"],"a":"C","e":"\u00011946年法兰西第四共和国宪法规定了宪法委员会制度,主要目的是保障议会的权力。\u0002\nA✗ 宪法是近代资本主义经济发展的必然产物,近代资本主义经济经历了自由资本主义、私人垄断资本主义以及国家垄断资本主义三个阶段,自由竞争和公民社会权利保障的协调并非近代宪法所普遍强调的内容\nB✗ 美国是由普通法院行使合宪性审查权,而且普通法院的这项权力也不是在美国宪法中规定的\nC✓ 1919年颁布的德国\u0001《魏玛宪法》\u0002首次突破了个人权利中心论,第一次将公民的集体权利和社会经济权利写入宪法,\u0001《魏玛宪法》\u0002的颁布也标志着近代宪法向现代宪法的转型\nD✗ 近代宪法大多主张对公民的政治权利进行保护,越来越强调对人权的保障, 不断扩大公民基本权利的范围\n1958年法兰西第五共和国宪法设立专章规定宪法委员会,其目的是约束议会权力的行使。","k":"","kb":25,"kh":[[0,15],[299,351]]},{"id":"2024-16","y":2024,"t":"单","s":"根据我国宪法和法律规定,以下关于单行条例,说法正确的是（ ）。","o":["单行条例可以对行政法规的基本原则做出变通","自治州的单行条例自发布以后的30日之内,报国务院和全国人大常委会备案","单行条例是自治州人大按照当地民族特色具体某方面做出的规范性文件","只有全国人大专门委员会和全国人大常委会工作机构可以主动审查"],"a":"B","e":"\u0001自治州单行条例经省人大常委会批准后，须报全国人大常委会和国务院备案。\u0002\nA✗ 依据《立法法》第85条，自治条例和单行条例可以作出变通规定，但\u0001不得违背法律或者行政法规的基本原则\u0002\nB✓ 依据《宪法》第116条及《立法法》规定，自治州、自治县的单行条例须报省人大常委会批准，批准后报\u0001全国人大常委会和国务院备案\u0002（备案法定时限一般为公布后30日内）\nC✗ 自治条例与单行条例只能由民族自治地方的\u0001人民代表大会\u0002制定（人大常委会无权制定），且题干未注意“人民代表大会”且“具体某方面”描述粗糙；严格依法以批准备案流程为准\nD✗ 国务院、中央军委、最高法、最高检及各省人大常委会等均可行使审查要求权，且备案审查机关本身亦会主动审查；不仅限于该两类机构\n牢记自治立法两铁律：\u0001自治地方人大（非人大常委会）制定\u0002；\u0001可作变通但不得违背宪法与上位法基本原则\u0002。","k":"","kb":37,"kh":[[199,378],[379,441]]},{"id":"2024-47","y":2024,"t":"多","s":"某市政府发布《关于加强车辆停放 ,"a":"D","e":"\u00011946年4月陕甘宁边区第三届参议会通过了《陕甘宁边区宪法原则》,规定采取人民代表会议制的政权组织形式,以保证人民管理政权机关。\u0002\nA✗ 1946年4月陕甘宁边区第三届参议会通过了\u0001《陕甘宁边区宪法原则》\u0002,规定采取人民代表会议制的政权组织形式,以保证人民管理政权机关\nB✗ 民主联合政府是毛泽东在中共七大的主报告\u0001《论联合政府》\u0002中提出的\nC✗ 1931年11月召开的第一次全国工农兵代表大会通过了\u0001《中华苏维埃共和国宪法大纲》\u0002,规定苏维埃国家政治制度是工农兵代表大会\nD✓ \u0001《陕甘宁边区施政纲领》\u0002是抗日民主政权制定的最具代表性的宪法性文件,强调加强政权民主建设,规定根据地政权的人员构成实行\"三三制\"原则,即共产党员占1/3,非党左派进步人士占1/3,中间派占1/…","k":"","kb":52,"kh":[[162,233],[317,338]]},{"id":"2023-32","y":2023,"t":"单","s":"评剧《刘巧儿》的故事，源于封芝琴（乳名捧儿）与张柏的婚姻纠纷案件。该案的审理是陕甘宁边区司法民主崭新形式的典型体现。主持这一案件审理的法官是（ ）。","o":["董必武","林伯渠","马锡五","雷经天"],"a":"C","e":"\u0001“刘巧儿”婚姻案的主审法官是陇东专署专员兼高等法院分庭庭长马锡五。\u0002\nA✗ 董必武曾主持华北人民政府司法及政法工作，并非陕甘宁边区刘巧儿案主审人\nB✗ 林伯渠曾任陕甘宁边区政府主席，并非直接审理该案的法官\nC✓ 1943年\u0001马锡五\u0002深入乡间调查群众意见，依法判决封芝琴（刘巧儿）婚姻自主有效，由此总结推广出著名的“马锡五审判方式”\nD✗ 雷经天曾任陕甘宁边区高等法院院长，但刘巧儿案（封芝琴案）由马锡五直接审理\n\u0001马锡五审判方式\u0002核心特点：深入农村调查研究、群众路线、巡回审判、调解与审判相结合、简便便民不拘形式。","k":"","kb":52,"kh":[[162,233],[338,427]]},{"id":"2024-50","y":2024,"t":"多","s":"抗日民主政权是民族统一战线性质的民主专政,它创造性地发展了工农民主政权的法律,抗日民主政权的刑法原则包括（ ）。","o":["镇压与宽大相结合","平等保障人权","实行感化教育","按阶级成分定罪量刑"],"a":"ABC","e":"\u0001抗日民主政权推行“镇压与宽大相结合”“平等保障人权”“感化教育”，坚决反对按阶级成分定罪量刑。\u0002\nA✓ 抗战时期面对抗日民族统一战线形势，确立\u0001镇压与宽大相结合\u0002（首恶必办、胁从不问、悔过从宽）的刑事政策原则\nB✓ 各边区施政纲领（如《陕甘宁边区施政纲领》）明文保障一切抗日人民及不违法之各阶级享有\u0001平等的人权、财产权与诉讼权\u0002\nC✓ 抗日民主政权把惩罚犯罪与思想教育改造相结合，对罪犯普遍\u0001实行感化教育与劳动改造\u0002\nD✗ 土地革命工农民主政权初期曾有突出阶级成分倾向，但抗日民主政权专门强调\u0001反对“唯成分论”和反对按阶级成分定罪量刑\u0002\n区分两个根据地时期刑法特征：工农民主政权强调阶级路线；\u0001抗日民主政权反对按阶级成分定罪量刑，平等保障人权\u0002。","k":"","kb":52,"kh":[[162,233],[233,274]]},{"id":"2025-40","y":2025,"t":"单","s":"新民主主义革命时期,规定“废除封建性及半封建性剥削的土地制度”“实行耕者有其田”的民主政权土地立法是（ ）。","o":["《井冈山土地法》","《中华苏维埃共和国土地法》","《陕甘宁边区土地条例》","《中国土地法大纲》"],"a":"D","e":"\u0001《井冈山土地法》规定\"没收一切土地归苏维埃所有\",《中华苏维埃共和国土地法》规定没收一切地主、富农、反革命分子及农村公共土地,在土地分配上实行\"地主不分田,富农分坏田\"的政策。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ \u0001《井冈山土地法》\u0002规定\"没收一切土地归苏维埃所有\",\u0001《中华苏维埃共和国土地法》\u0002规定没收一切地主、富农、反革命分子及农村公共土地,在土地分配上实行\"地主不分田,富农分坏田\"的政策\nC✗ \u0001《陕甘宁边区土地条例》\u0002规定保护土地所有权\nD✓ \u00 ,"kb":43,"kh":[[0,8],[42,149]]},{"id":"2025-34","y":2025,"t":"单","s":"中国古代有律学家提出:“律法断罪,皆当以法律令正文,若无正文,依附名例断之, 其正文名例所不及,皆勿论。”这位律学家是（ ）。","o":["刘颂","张斐","杜预","长孙无忌"],"a":"A","e":"\u0001这种援法断罪的思想,近于现代罪刑法定原则,为中国古代律学理论和法律思想的一大进步。\u0002\nA✓ 这种援法断罪的思想,近于现代罪刑法定原则,为中国古代律学理论和法律思想的一大进步\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选\n晋代刘颂提出,\"律法断罪,皆当以法律令正文,若无正文,依附名例断之,其正文名例所不及,皆勿论\"。","k":"","kb":53,"kh":[[21,120]]},{"id":"2025-48","y":2025,"t":"多","s":"下列选项中,属于中华法系优秀传统的有（ ）。","o":["以民为本,明德慎罚","法尚公平,执法原情","以法治官,明职课责","体系完备,律例(令)并行"],"a":"ABCD","e":"\u0001中华法系的优秀传统包括:德配王命,民贵君轻。\u0002\nA✓ 华法系的优秀传统包括:德配王命,民贵君轻\nB✓ 法尚公平,执法原情\nC✓ 以法治官,明职课责\nD✓ 体系完备,律例并行\n礼法结合,综合为治;","k":"","kb":53,"kh":[[21,120],[203,269]]},{"id":"2026-39","y":2026,"t":"单","s":"中国古代法律对“告诉”有严格的程序规定。提起诉讼时告诉人应向官府提交诉状,要求“明注年月,指陈事实,不得称疑”。古代诉状称为（ ）。","o":["爰书","辞牒","题本","看语"],"a":"B","e":"\u0001爰书审讯笔录,题本官员上奏文书,看语判词。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 符合题意及现行制度规定（\u0001辞牒\u0002）\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选\n辞牒为古代起诉诉状;","k":"","kb":53,"kh":[[21,120]]}]},{"sub":"法理学","name":"法的实施（执法与司法）","w":1.2,"w5":1.2,"wh":1.8,"bt":"","pt":"2026已考论述·执法司法原则稳态","L":35,"qs":[{"id":"2005-15","y":2005,"t":"单","s":"关于守法的表述,能够成立的是（ ）。","o":["在中国境内的外国人和无国籍人也是守法的主体,但是依法享有外交豁免权的人除外","在我国,守法的范围是指依法制定并生效的所有规范性法律文件,而不包括非规范性法律文件","在我国,守法专指依法履行法律义务","为了不受法律制裁而不违法的状态是守法的最低状态"],"a":"D","e":"\u0001守法的范围也包括法定机关依法作出的具有法律约束力的非规范性法律文件,比如人民法院的生效判决书。\u0002\nA✗ 在我国境内的依法享有外交豁免权的人也应当遵守我国法律,只不过其责任的追究应当按照外交途径进行解决\nB✗ 守法的范围也包括法定机关依法作出的具有法律约束力的非规范性法律文件,比如人民法院的生效判决书\nC✗ 守法既包括履行法律义务,也包括行使法律权利\nD✓ 符合题意及现行制度规定（\u0001为了不受法律制裁而不违法的状态是守法\u0002）","k":"","kb":15,"kh":[[0,15],[228,264]]},{"id":"2005-52","y":2005,"t":"多","s":"下列选项中,属于法的实施的是（ ）。","o":["交通警察对违反道路交通安全法的机动车驾驶员给予罚款处罚","公民依法纳税","男女双方依法进行结婚登记","人民法院在民事案件审理中依法进行调解"],"a":"ABCD","e":"\u0001相关表述 属于执法活动。\u0002\nA✓ 属于执法活动\nB✓ 是履行义务,相关表述 是行使权利(婚姻自由权),都属于守法活动\nC✓ 符合题意及现行制度规定（\u0001男女双方依法进行结婚登记\u0002）\nD✓ 属于司法活动\n\u0001“公民依法纳税”\u0002 是履行义务,“男女双方依法进行结婚登记” 是行使权利(婚姻自由权),都属于守法活动; “人民法院在民事案件审理中依法进行调解” 属于司法活动。","k":"","kb":15,"kh":[[0,15],[16,104]]},{"id":"2006-11","y":2006,"t":"单","s":"在我国贯彻“以事实为根据,以法律为准绳”这一司法原则时（ ）。","o":["可以不再以党的政策为指导","仍然要以党的政策为指导","有时也要以党的政策为指导","由司法机关决定是否受党的政策指导"],"a":"B","e":"\u0001政策及政治策略通常是指一定政党或其他政治组织为达到一定时期的政治目标,处理国家事务、社会公共事务而提出并贯彻的路线、方针、规范和措施的总称。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 党的政策和法律是互补关系二者共同调整社会各种现象,\"以事实为根据,以法律为准绳\"这一司法原则仍然要以党的政策为指导并不矛盾\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选\n执政党的政策最具影响力,与国家政权联系最密切。","k":"","kb":15,"kh":[[0,15],[170,227]]},{"id":"2006-14","y":2006,"t":"单","s":"下列行为中,属于狭义上的“法的适用”的是（ ）。","o":["检察机关以涉嫌贪污为由批准对某犯罪嫌疑人实施逮捕","税务机关以涉嫌偷税为由对某企业的纳税情况进行检查","婚姻登记机关以男女双方未过到法定结婚年龄为由拒绝颁发结婚书","法官张某周末在家休息时主动为邻居调解纠纷"],"a":"A","e":"\u0001狭义上法的适用又被称为\"司法\"是指国家司法机关依照法定职权和程序具体适用法律处理各种案件的专门活动。\u0002\nA✓ 符合题意及现行制度规定（\u0001检察机关以涉嫌贪污为由批准对某犯罪嫌\u0002）\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 虽是法官但他是以自然人身份调解的不属司法活动所以","k":"","kb":15,"kh":[[0,15],[105,170]]},{"id":"2006-48","y":2006,"t":"多","s":"下列关于我国法律监督的表述,正确的有（ ）。","o":["全国人民代表大会入其常务委员会是我国的最高法律监督机关","人民检察院和人民法院是我国专门的法律监督的主体","各级国家机关、社会组织和公民全人均可成为我国法律监督的主体","法律监督可以分为有权监督与无权监督"],"a":"AC","e":"\u0001法律监督分为社会监督和国家监督。\u0002\nA✓ 符合题意及现行制度规定（\u0001全国人民代表大会入其常务委员会是我国\u0002）\nB✗ 人民检察院是我国专门的法律监督的主体,也是唯一专门的法律监督的主体\nC✓ 符合题意及现行制度规定（\u0001各级国家机关、社会组织和公民全人均可\u0002）\nD✗ 法律监督分为社会监督和国家监督\n监督的本身就意味着行使权力,无权监督没有意义。","k":"","kb":15,"kh":[[0,15],[265,329]]},{"id":"2008-11","y":2008,"t":"单","s":"下列关于法律监督的表述,正确的是（ ）。","o":["政党监督属于社会监督","民众与社会团体的监督没有实质作用","法律监督只能在监督对象做出行为后进行","法律监督可以根绝执法中的违法行为"],"a":"A","e":"\u0001依据题干考查要点，正确表述为“政党监督属于社会监督”。\u0002\nA✓ 社会监督与国家监督相对,是指非国家机关所进行的监督\nB✗ 社会监督也有实质作用\nC✗ 法律监督不仅可以在监督对象做出行为后进行,也可以在监督对象做出行为之前进行,比如自治区的自治条例和单行条例在生效前,必须经全国人大常委会的审查,获得全国人大常委会的批准亚热带才能生效,全国人…\nD✗ 法律监督不能根绝违法行为, 只能纠正违法行为\n法律监督不仅可以在监督对象做出行为后进行,也可以在监督对象做出行为之前进行,比如自治区的自治条例和单行条例在生效前,必须经全国人大常委会的审查,获得全国人大常委会的批准亚热带才能生效,全国人大常委会对自治区的自治条例和单行条例的审查就属于事先监督,错误。","k":"","kb":15,"kh":[[0,15],[265,329]]},{"id":"2008-13","y":2008,"t":"单","s":"下列选项中,属于狭义的执法活动范畴的是（ ）。","o":["派出法庭法官甲对一起离婚案件的当事人进行批评教育","居民委员会主任乙对邻里纠纷进行调解","市检察院对一起贪污案件进行查处","市工商行政管理局对某公司违规使用商标的行为进行处罚"],"a":"D","e":"\u0001狭义的执法活动是指行政机关或法律法规授权的组织行使行政职权的活动。\u0002\nA✗ 的派出法庭是人民法院的机构,其进行批评教育的行为不是行使审判权,故不属于司法活动,也不是行使行政职权的活动,故也不属于执法活动\nB✗ 的居委会是基层群众自治组织,相关表述 属于司法活动\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ 的市工商行政管理局是行政机关, 处罚是行使行政职权的行为,故本题\n\u0001“居民委员会主任乙对邻里纠纷进行调解”\u0002 的居委会是基层群众自治组织,“市检察院对一起贪污案件进行查处” 属于司法活动。","k":"","kb":15,"kh":[[0,15],[16,104]]},{"id":"2009-13","y":2009,"t":"单","s":"下列关于我国法律监督体系中审计监督的表述,正确的是（ ）。","o":["审计监督俗语国家权力机关的监督","审计监督是检查监督的一种方式","审计监督是一种专门的行政监督","审计监督在本质上属于社会监督"],"a":"C","e":"\u0001当代中国法律监督体系由国家监督和社会监督两部分内容构成,其中国家监督包括国家权力机关的监督、国家司法机关的监督、国家行政机关的监督。\u0002\nA✗ 当代中国法律监督体系由国家监督和社会监督两部分内容构成,其中国家监督包括国家权力机关的监督、国家司法机关的监督、国家行政机关的监督\nB✗ 与题干设问或现行制度要件不符，故不选\nC✓ 审计监督主要是国家行政监督中专门行政监督的一种\nD✗ 审计监督不属于社会监督\n社会监督包括政党的监督、社会组织的监督、社会舆论的监督、人民群众的监督。 国家权力机关的监督主要是指各级人民代表大会及其常务委员会为主体的监督。 检查监督专指检察机关的监督。","k":"","kb":15,"kh":[[0,15],[265,329]]},{"id":"2009-46","y":2009,"t":"多","s":"与司法活动相比,执法活动的特征有（ ）。","o":["主动性","单方面性","终极性","中立性"],"a":"AB","e":"\u0001执法是指国家行政机关及其工作人员、授权组织依照法定的职权和程序,贯彻执行法律的活动。\u0002\nA✓ 执法活动具有主动性\nB✓ 执法活动具有主动性\nC✗ 积极性和中立性是司法活动的特征\nD✗ 与题干设问或现行制度要件不符，故不选\n执法的特征包括:主体具有特殊性; 执法内容具有广泛性;","k":"","kb":15,"kh":[[16,104],[105,170]]},{"id":"2010-12","y":2010,"t":"单","s":"下列选项中,属于司法活动范畴的是（ ）。","o":["司法局审查发放律师执业证","交通警察对交通违章者进行罚款处罚","最高人民法院向全国人民代表大会做工作报告","检察机关对涉嫌贪污的犯罪嫌疑人予以批准逮捕"],"a":"D","e":"\u0001司法活动是国家司法机关依法定权限和程序处理案件的专门性活动。\u0002\nA✗ 都是国家行政机关及其工作人员行使行政权力的活动,不是司法活动\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ 符合题意及现行制度规定（\u0001检察机关对涉嫌贪污的犯罪嫌疑人予以批\u0002）\n相关表述是司法机关接受国家权力机关监督的活动,实际上是法律监督的范畴; 相关表述 是司法活动。","k":"","kb":15,"kh":[[0,15],[265,329]]},{"id":"2010-14","y":2010,"t":"单","s":"下列关于法律监督的表述,能够成立的是（ ）。","o":["法律监督包括国家监督和社会监督","法律监督是平行主体之间的监督","法律监督是自上而下的监督","行政监督属于外部法律监督"],"a":"A","e":"\u0001法律监督包括国家监督和社会监督。\u0002\nA✓ 法律监督包括国家监督和社会监督\nB✗ 法律监督既可以是自上而下的监督,也可以是自下而上的监督,如检察系统内部上下级之间的监督,还可以是平行主体之间的监督,如人民检察院对同级人民法院的监督,B\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 行政监督包括国家行政系统内部上下级之间以及行政系统内部设立的专门机关的法律监督,也包括行政机关在行使行政权时对行政相对人的监督","k":"","kb":15,"kh":[[0,15],[265,329]]},{"id":"2010-15","y":2010,"t":"单","s":"下列选项中,不属于法的实施方式的是（ ）。","o":["法的制定","法的适用","法的执行","法的遵守"],"a":"A","e":"\u0001法律的实施包括了执法、司法和守法, 不包括法的制定。\u0002\nA✓ 法律的实施包括了执法、司法和守法, 不包括法的制定\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选","k":"","kb":15,"kh":[[0,15],[16,104]]},{"id":"2011-47","y":2011,"t":"多","s":"检察官李某系中共党员,他以匿名信方式向监察机关检举某领导的贪污行为。他的法律监督行 为属于（ ）。","o":["检察监督","政党监督","社会监督","人民群众监督"],"a":"CD","e":"\u0001所谓法律监督是指由所有的国家机关、社会团体和组织、公民对各种法律活动的合法性所进行的监督。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✓ 按照监督的主体的不同,可以分为国家监督和社会监督\nD✓ 题中的李某进行法律监督时是以匿名信的方式进行的,没有运用公权力,因此属于社会监督和人民群众监督\n国家监督即国家机关进行的监督,包括国家权力机关的监督、国家监察机关的监督、国家司法机关的监督、国家行政机关的监督; 社会监督是指由各政党、社会组织和人民群众对各种法律活动的合法性所进行的监督,包括政党的监督、社会组织的监督社会舆论的监督、人民群众的监督。","k":"","kb":15,"kh":[[0,15],[265,329]]},{"id":"2012-15","y":2012,"t":"单","s":"最高人民法院在定期公布的各卷裁判文书汇编的前言中指出:“最高人民法院的裁判文书,由于具有最高的司法效力,因而对各级人民法院的审判工作具有重要的指导作用。”下列相关理解,正确的是 （ ）。","o":["最高人民法院裁判文书本身是规范性法律文件","最高人民法院裁判文书具有正式法律渊源的地位","最高人民法院裁判文书的重要功能在于实现对抽象的制定法规范的具体化","最高人民法院裁判文书具有最高司法效力, 因此可以适当超出现行法的约束"],"a":"C","e":"\u0001在我国,判例不是正式的法律渊源,不具有拘束力,最高人民法院的裁判文书只具有指导作用,其强制力只适用于该案件的当事人。\u0002\nA✗ 裁判文书不是规范性法律文件,不能普遍、反复适用\nB✗ 与题干设问或现行制度要件不符，故不选\nC✓ 裁判文书的重要功能在于实现对抽象的制定法规范的具体化\nD✗ 裁判文书是适用法律的结果,不能超出现行法的约束","k":"","kb":3,"kh":[[103,142]]},{"id":"2013-10","y":2013,"t":"单","s":"下列选项中,属于我国司法活动范畴的是（ ）。","o":["交通警察处罚交通违章者","司法局审查发放律师执业证","检察机关批准逮捕涉嫌盗窃的犯罪嫌疑人","最高人民法院向全国人民代表大会做工作报告"],"a":"C","e":"\u0001\" 法的适用 \" ,通常是指国司法,又称为家司法机关依照法定职权和程序,具体应用法律处理各种案件的专门活动。\u0002\nA✗ 和B是主体不符\nB✗ 与题干设问或现行制度要件不符，故不选\nC✓ 符合题意及现行制度规定（\u0001检察机关批准逮捕涉嫌盗窃的犯罪嫌疑人\u0002）\nD✗ 与题干设问或现行制度要件不符，故不选\n判断是否属于司法活动的标准至少有两点:一是主体为司法机关工作人员,二是行为内容是司法行为。 \u0001“交通警察处罚交通违章者”\u0002：和B是主体不符; D虽然主体符合,但其行为井不是司法行为。","k":"","kb":15,"kh":[[0,15],[105,170]]},{"id":"2014-12","y":2014,"t":"单","s":"下列关于守法的表述,正确的是（ ）。","o":["依法办事,形成统一法律秩序是守法的最高状态","非规范性法律文件不在我国公民的守法范围之内","公民甲被迫缴纳行政罚款的行为不属于守法范畴","公民乙向全国人大常委会提出某项立法建议的行为属于守法范畴"],"a":"D","e":"\u0001相关表述属于守法的范畴。\u0002\nA✗ 依法办事、形成统一法律秩序是守法的中层状态\nB✗ 非规范性法律文件是仅针对特定的人或事所作的具有约束力的法律文件,此约束力不具有普遍性,但也需要人们遵守\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ 符合题意及现行制度规定（\u0001公民乙向全国人大常委会提出某项立法建\u0002）\n相关表述是公民依法行使自己权利的积极守法行为,因此选相关表述。 (此处需注意守法的最低状态、中层状态和高级状态的区别。","k":"","kb":15,"kh":[[0,15],[228,264]]},{"id":"2015-6","y":2015,"t":"单","s":"下列选项中,不属于我国行政执法基本原则的是（ ）。","o":["合理性原则","正当程序原则","合法性原则","协商性原则"],"a":"D","e":"\u0001我国行政执法基本原则包括依法行政原则、合理性原则、讲求效率原则、正当程序原则、比例原则诚实守信原则、权责统一原则。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 我国行政执法基本原则包括依法行政原则、合理性原则、讲求效率原则、正当程序原则、比例原则诚实守信原则、权责统一原则\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ 没有协商性原则","k":"","kb":15,"kh":[[0,15],[16,104]]},{"id":"2015-9","y":2015,"t":"单","s":"下列关于法律监督的表述,正确的是（ ）。","o":["某检察院对同级法院的判决提起抗诉,属于国家监督","政协委员张某在“两会”期间对地方政府提出批评,属于行政监督","某省纪律检查委员会对有贪污嫌疑的赵某进行调查,属于司法监督","某省人大常委会工作人员孙某举报其领导以权谋私,属于权力机关监督"],"a":"A","e":"\u0001国家监督包括国家权力机关的监督、国家监察机关的监督、国家司法机关的监督和国家行政机关的监督。\u0002\nA✓ 检察院对同级法院的判决提起抗诉属于国家司法机关的监督,也即属于国家监督\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 国家监督包括国家权力机关的监督、国家监察机关的监督、国家司法机关的监督和国家行政机关的监督","k":"","kb":15,"kh":[[0,15],[265,329]]},{"id":"2016-9","y":2016,"t":"单","s":"下列关于我国司法权的表述,正确的是（ ）。","o":["我国司法权包括审判权和检察权两种","司法权独立意味着司法权不受一切机关和个人的监督","司法权的终局性意味着一切纠纷最终都应由司法机关作出裁决","司法权的专属性要求司法权只能由国家各级审判机关统一行使"],"a":"A","e":"\u0001司法权是指行使国家司法权力的职责和权力。\u0002\nA✓ 根据宪法规定,我国的司法权包括审判权和检察权\nB✗ 司法权要接受党的领导和监督,要接受国家权力机关的监督,司法机关的上、下级之间以及同级之间也存在监督和约束\nC✗ 司法权的终极性(终局性)不意味着所有的纠纷最终都由司法机关解决,根据法律规定,有些纠纷是由行政机关最终解决的\nD✗ 司法权的专属性是指司法权只能由国家各级审判机关和检察机关统一行使,其他任何机关、团体和个人都无权行使此项权利\n司法活动具有被动性、中立性、终极性(终局性)、形式性和专属性等特点。 司法权的终极性(终局性),是指司法权对于纠纷具有最终的、最权威的裁判权。 司法权的独立性,是指人民法院、人民检察院依照法律独立行使自己的职权,不受行政机关、社会团体和个人的非法于涉,但并不意味着司法机关行使司法权可以不受任何监督和约束。","k":"","kb":15,"kh":[[105,170],[170,227]]},{"id":"2016-11","y":2016,"t":"单","s":"下列关于守法的理解,不正确的是（ ）。","o":["行使法定权利是守法行为","守法通常是法律和道德的共同要求","由于合同不是法律,因而遵守合同并非守法","某企业及时、足额向国家纳税,属于积极的守法"],"a":"C","e":"\u0001守法,是指公民社会组织和国家机关以法律为自己的行为准则,依照法律行使权利、履行义务的活动,包括积极守法和消极守法(不违法)。\u0002\nA✗ 依法行使权利是守法行为,是积极守法\nB✗ 法律是道德的底线,守法, 尤其是积极守法,通常是法律和道德的共同要求\nC✓ 合同本身虽然不是法律,但是根据法律的有关规定,当事人应当适当、全面的履行合同,遵守、履行合同,就是遵守法律规定,是守法行为,相关表述不\nD✗ 企业及时、足额纳税,是履行法律义务,是守法行为, 是积极守法","k":"","kb":15,"kh":[[0,15],[228,264]]},{"id":"2017-6","y":2017,"t":"单","s":"关于如何提高我国司法公信力,保证公正司法,下列说法正确的是（ ）。","o":["加强人权的司法保障,有助于提升司法公信力","提升司法公信力要求法院在裁判前必须广泛征求社会意见","提升司法公信力必须推进以侦查为中心的诉讼制度改革","提升司法公信力需要检察权、审判权与执行权高度统一"],"a":"A","e":"\u0001公正是法治的生命线,司法公正对社会公正具有重要引领作用,司法不公对社会公正具有致命的破坏作用。\u0002\nA✓ 保证司法公正、提高司法公信力需要多方面的改革,其中加强人权司法保障,是提高司法公信力的重要措施之一\nB✗ 我国的审判权是由法院依法独立行使的,任何行政机关、组织、个人不得非法干涉,法院在裁判前无须征求社会意见,需要征求社会意见的是立法而不是司法\nC✗ 提升司法公信力须推进审判为中心的诉讼制度改革,而不是以侦查为中心\nD✗ 提升司法公信力需要推动审判权和执行权相分离、审判权和检察权相分离, 而不是检察权、审判权与执行权高度统一","k":"","kb":15,"kh":[[0,15],[105,170]]},{"id":"2017-10","y":2017,"t":"单","s":"某市的城市规划方案频繁变更,导致一些企业的房地产项目无法按计划正常进行。该地方政府违反的执法原则是（ ）。","o":["讲求效率原则","诚实守信原则","正当程序原则","比例原则"],"a":"B","e":"\u0001讲求效率原则是指行政机关应当在依法执法的前提下,讲求效率,主动有效地行使其权能, 以尽可能低的成本取得最大的行政执法效益。\u0002\nA✗ 讲求效率原则是指行政机关应当在依法执法的前提下,讲求效率,主动有效地行使其权能, 以尽可能低的成本取得最大的行政执法效益\nB✓ 诚实守信原则包括行政信息真实原则和保护公民信赖利益原则\nC✗ 正当程序原则是指执法机关在实施行政执法行为的过程中,必须遵循法定的步骤、方式、形式、顺序和时限\nD✗ 比例原则是指行政机关实施行政行为应兼顾行政目标的实现和保护相对人的权益,如果为了实现行政目标可能对相对人权益造成某种不利影响时,应使这种不利影响限制在尽可能小的范围和限度,使二者处于适度的比…\n行政机关在执法时应保护公民的信赖利益,非经法定事由并经法定程序,行政机关不得撤销、变更已经生效的行政决定。 城市规划方案频繁变更,侵害了公民的信赖利益,违反了保护公民信赖利益原则。 保护公民信赖利益原则是诚实守信原则的内涵,因此","k":"","kb":15,"kh":[[0,15],[16,104]]},{"id":"2017-13","y":2017,"t":"单","s":"下列关于守法的表述,正确的是（ ）。","o":["守法的最低状态就是不违法犯罪","守法的内容就是全面行使法定权利","守法主体不包括无民事行为能力的人","守法的范围包含宪法、法律及风俗习惯"],"a":"A","e":"\u0001守法的状态是指人们对于法律的遵守程度,包括守法的最低状态、中层状态和高级状态三种类型。\u0002\nA✓ 守法的最低状态是不违法犯罪\nB✗ 守法的内容包括履行法律义务和行使法律权利\nC✗ 华人民共和国的所有公民都是守法的主体, 无民事行为能力人也是守法主体\nD✗ 在我国守法的范围不限于各种制定法,还包括各种有法律效力的非规范性法律文件,但不包括风俗习惯","k":"","kb":15,"kh":[[0,15],[228,264]]},{"id":"2017-14","y":2017,"t":"单","s":"王某发现当地个别政府工作人员有违法行为,遂将收集的证据材料交给电视台。电视台报道后,引起广泛关注。当地政府为此组成调查组进行调查,认定报道反映的问题属实,依法对相关责任人进行了处理。该事件涉及的法律监督形式包括（ ）。","o":["社会舆论监督、政党监督和行政机关监督","权力机关监督、人民群众监督和社会舆论监督","人民群众监督、社会舆论监督和行政机关监督","社会组织监督、社会舆论监督和人民群众监督"],"a":"C","e":"\u0001当代中国的法律监督分为国家监督和社会监督,国家监督包括国家权力机关的监督、国家监察机关的监督、国家司法机关的监督、国家行政机关的监督。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 当代中国的法律监督分为国家监督和社会监督,国家监督包括国家权力机关的监督、国家监察机关的监督、国家司法机关的监督、国家行政机关的监督\nC✓ 符合题意及现行制度规定（\u0001人民群众监督、社会舆论监督和行政机关\u0002）\nD✗ 根据社会监督主体的不同, 可以分为政党的监督、社会组织的监督、社会舆论的监督、人民群众的监督\n国家权力机关的监督,是指各级人民代表大会及其常委会对由它产生的国家机关实施法律的监督。 国家行政机关的监督是指以行政机关为监督主体进行的监督。 社会监督,是指由各政党、各社会组织和人民群众依照宪法和有关法律,对各种法律活动的合法性进行的监督。 本题中王某将个别政府工作人员违法行为反映到电视台,是人民群众监督。 电视台对此事进行报道,是社会舆论监督。 当地政府依法对相关人员进行处理,是国家行政机关监督,","k":"","kb":15,"kh":[[0,15],[265,329]]},{"id":"2018-5","y":2018,"t":"单","s":"某法院在审理一起网络侵权案件时,采纳了司法鉴定机构提供的鉴定意见。这里体现的司法原则主要是（ ）。","o":["司法平等","依法独立行使司法权","公平优先,兼顾效率","以事实为根据,以法律为准绳"],"a":"D","e":"\u0001本题中核心的意思是法院审判案件采纳了第三方鉴定机构的意见,和司法平等无关,采纳鉴定机构的意见也并非涉及鉴定机构干扰了司法机关独立行使司法权。\u0002\nA✗ 本题中核心的意思是法院审判案件采纳了第三方鉴定机构的意见,和司法平等无关,采纳鉴定机构的意见也并非涉及鉴定机构干扰了司法机关独立行使司法权\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ 提到的以事实为根据,正是佐证题干中司法机关采纳鉴定机构的意见,体现的是司法机关以事实为依据的司法原则\n\u0001“以事实为根据,以法律为准绳”\u0002提到的以事实为根据,正是佐证题干中司法机关采纳鉴定机构的意见,体现的是司法机关以事实为依据的司法原则。","k":"","kb":15,"kh":[[0,15],[170,227]]},{"id":"2019-8","y":2019,"t":"单","s":"某法院公布失信被执行人名单,以督促其履行义务。不少失信人在得知姓名被公布后迫于“面子”和舆论压力,找到法院配合执行。对此,下列表述正确的是（ ）。","o":["法院公布失信被执行人名单属于司法裁判活动","公布失信人名单有助于形成尊重法律权威的社会氛围","法院未经被执行人同意就公布其姓名信息侵犯了当事人的隐私权","失信人迫于“面子”和舆论压力配合执行不属于守法行为"],"a":"B","e":"\u0001法院公布失信被执行人名单属于司法执行活动,并不是司法裁判活动。\u0002\nA✗ 法院公布失信被执行人名单属于司法执行活动,并不是司法裁判活动\nB✓ 公布失信人名单有助于督促失信人及时履行自己的法律义务,形成尊重法律权威的社会氛围,失信人配合执行属于守法行为\nC✗ 公民依法享有隐私权及名誉权,但为了保障当事人的合法权益,我国对于这些权利的保护又进行了相关限制,最高人民法院关于修改\u0001《最高人民法院关于公布失信被执行人名单信息的若千规定》\u0002的决定赋予了人民法院…\nD✗ 与题干设问或现行制度要件不符，故不选\n公民依法享有隐私权及名誉权,但为了保障当事人的合法权益,我国对于这些权利的保护又进行了相关限制,最高人民法院关于修改\u0001《最高人民法院关于公布失信被执行人名单信息的若千规定》\u0002的决定赋予了人民法院公开失信被执行人名单的权力,不侵犯失信被执行人隐私权","k":"","kb":15,"kh":[[0,15],[228,264]]},{"id":"2020-7","y":2020,"t":"单","s":"我国《行政处罚法》第五条规定:“实施行政处罚,纠正违法行为,应当坚持处罚与教育相结合,教育公民、法人或者其他组织自觉守法。”对此,下列说法正确的是（ ）。","o":["该规定对行政执法有约束力","该规定主要发挥社会作用而非规范作用","该规定直接体现了法律的可操作性和可预测性","该条文规定了假定条件、行为模式和法律后果"],"a":"A","e":"\u0001法的规范作用是指法作为行为规范,对人们的意志、行为发生的直接影响,对人的行为所起到的保障和约束作用。\u0002\nA✓ 该条主要体现的是规范作用,有约束力\nB✗ 法具有规范作用和社会作用\nC✗ 此条规定属于法律原则,直接体现法律的可操作性和可预测性的说法是错误的\nD✗ 此条规定没有体现法律后果\n法的社会作用是指法的社会、政治功能,即法作为社会关系的调整器,服务千一定的社会政治目的、目标,承担着一定的社会政治使命,形成、维护、实现一定的社会秩序。 法律规则是构成法律的基本单位,与其他要素相比,具有微观指导性、可操作性较强、确定性程度较高、可预测性等特征。 法律原则既没有规定确定的事实状态,也没有规定具体的法律后果,法律原则不预先设定明确的、具体的假定条件,更没有设定明确的法律后果,其要求比较笼统、模糊。","k":"","kb":9,"kh":[[0,14],[15,66]]},{"id":"2021-7","y":2021,"t":"单","s":"下列关于我国司法机关依法独立行使职权的表述，不正确的是（ ）。","o":["司法活动不受任何机关、社会团体和个人的监督","司法机关必须正确适用法律,不得滥用职权","司法机关独立行使职权时不得违反法律程序","司法权由人民法院和人民检察院行使"],"a":"A","e":"\u0001坚持司法机关独立行使职权原则,并不意味着司法机关行使司法权可以不受任何监督和约束。\u0002\nA✓ 司法权要接受党的领导和监督,要接受国家权力机关的监督,司法机关的上、下级之间以及同级之间也存在监督和约束,司法权也要接受行政机关、监察机关、企事业单位、社会团体、民主党派和人民群众的监督,还…\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 坚持司法机关独立行使职权原则,并不意味着司法机关行使司法权可以不受任何监督和约束\nD✗ 与题干设问或现行制度要件不符，故不选","k":"","kb":15,"kh":[[0,15],[170,227]]},{"id":"2021-8","y":2021,"t":"单","s":"某市试点开展“外卖送餐员平安交通”活动, 向送餐人员发放《外卖小哥交通安全手册》。该手册规定:送餐人员因交通违章需要接受处理的,如存在“赶时间送餐”的实际情况,可于一周内自行选择时间“弹性受罚”。该规定主要体现的执法原则是（ ）。","o":["诚实信用原则","信赖利益保护原则","合理原则","权责统一原则"],"a":"C","e":"\u0001本题中,行政机关允许外卖小哥 ',在行使自由裁量权进行行政管理时,做到了性受罚合理、公正,体现了执法的合理性原则。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✓ 本题中,行政机关允许外卖小哥 ',在行使自由裁量权进行行政管理时,做到了性受罚合理、公正,体现了执法的合理性原则\nD✗ 与题干设问或现行制度要件不符，故不选\n合理性原则是指执法主体在执法活动中,特别是在行使自由裁量权进行行政管理时,必须做到适当、合理、公正,即符合法律的基本精神和目的,具有客观、充分的事实根据和法律依据,与社会生 \"弹活常理相一致。","k":"","kb":15,"kh":[[0,15],[16,104]]},{"id":"2022-7","y":2022,"t":"单","s":"2020年,我国裁判文书上网公开累计1.2亿份,庭审直播累计1159万场,阳光司法机制产生深远影响,受到国内外广泛关注。这主要体现的司法原则是（ ）。","o":["司法平等","司法公开","司法法治","司法责任"],"a":"B","e":"\u0001司法平等原则体现在法律对于全体公民统一适用,所有公民依法享有同等的权利并承担同等的义务,在民事诉讼和行政诉讼中,保证诉讼当事人享有平等的诉讼权利。\u0002\nA✗ 题干中并没有体现与司法平等相关的内容\nB✓ 司法公开原则体现在立案、庭审、执行、听证、文书和审务等环节的公开\nC✗ 题干中并没有体现与司法法治原则、司法责任原则相关的内容\nD✗ 与题干设问或现行制度要件不符，故不选\n在刑事诉讼中,切实保障诉讼参与人依法享有的诉讼权利。 对任何公民的违法犯罪行为,都必须追究法律责任,依法给予相应的法律制裁。 司法法治原则要求司法活动要以事实为依据、以法律为准绳。 司法责任原则是指司法机关和司法人员在行使司法权过程中侵犯了公民、法人和其他社会组织的合法权益,造成严重后果而应承担的一种责任制度。","k":"","kb":15,"kh":[[0,15],[170,227]]},{"id":"2022-8","y":2022,"t":"单","s":"近年,我国平台经济领域经营者要求商家“二选一”与“大数据杀熟”等问题频发。2021 年4月,国家市场监管部门依法对某平台”二选一”的行为作出行政处罚。对此,下列表述正确的是（ ）。","o":["平台经济是新生事物,法律应避免对其进行约束","处罚平台垄断行为遏制了市场竞争","对平台垄断行为的处罚有损互联网经济的创新发展","法律规制平台垄断行为有利于保障市场主体的合法权益"],"a":"D","e":"\u0001法律是社会关系的调整器,市场主体的行为需要法律来规范,法律作为竞争规则维护市场经济的自由、平等竞争,法律通过对市场经济运行进行引导、促进、保障和必要的制约来进行宏观调控。\u0002\nA✗ 平台经济虽然是新生事物,但是如果影响到经济的正常、健康运行时,就应当通过法律对其进行约束\nB✗ 处罚平台垄断行为有利于遏制垄断,有利于市场主体自由、公平竞争,有利于互联网经济的创新发展\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ 法律通过规制平台的垄断行为,维护公平的竞争环境,有利于保障市场主体的合法权益","k":"","kb":15,"kh":[[16,104]]},{"id":"2022-10","y":2022,"t":"单","s":"下列关于行政执法的表述,正确的是（ ）。","o":["依法行政是行政执法活动最基本的原则","被动性与终局性是行政执法的突出特点","正当程序原则与讲求效率原则是相互矛盾的","善良风俗不是行政执法合理性原则要考虑的因素"],"a":"A","e":"\u0001依法行政原则是指行政机关必须依照法定权限、法定程序和法治精神进行管理,越权无效。\u0002\nA✓ 这是现代法治国家行政活动的一条最基本的原则\nB✗ 被动性与终局性应是司法活动的特点,而不是行政执法的突出特点\nC✗ 正当程序原则与讲求效率原则不是相互矛盾的\nD✗ 对于法律只有原则规定或没有法律规定的,应以客观、充分的事实根据为基础,依据法律的基本精神和目的,遵循与社会公理相一致原则,公平合理地处理,执法要符合当地的善良风俗\n司法活动具有被动性、中立性、终极性、形式性和专属性等特点,与司法等法律实施活动相比较,执法的特点主要包括:执法的主动性、执法的单方面性、执法内容的广泛性。 正当程序原则是指执法机关在实施行政执法行为的过程中,必须遵循法定的步骤、方式、形式、顺序和时限,目的是使执法行为公平、公开、民主,保障公民、法人和其他组织的合法权益,以促进行政权行使的合法性和合理性,提高行政效率。 合理性原则是指执法主体在执法活动中,特别是在行使自由裁量权进行行政管理时,必须做到适当、合理、公正,即符合法律的基本精神和目的,具有客观、充分的事实根据和法律依据,与社会生活常理相一致。","k":"","kb":15,"kh":[[0,15],[105,170]]},{"id":"2023-7","y":2023,"t":"单","s":"为统一法律适用,提升司法公信力,最高人民法院发布《关于统一法律适用加强类案检索的指导意见(试行)》。该指导意见主要体现的司法原则是（ ）。","o":["司法平等","司法责任","司法公开","司法机关依法独立行使职权"],"a":"A","e":"\u0001类案检索机制促进“同案同判”，集中体现司法平等原则。\u0002\nA✓ 加强类案检索旨在防止裁判尺度不一，落实\u0001法律面前人人平等与同案同判\u0002的司法平等原则\nB✗ 司法责任原则强调“谁审理谁负责、错案终身追责”，并非类案检索核心主旨\nC✗ 司法公开原则强调庭审公开与裁判文书上网接受监督，题干重在统一适用标准\nD✗ 依法独立行使职权强调不受行政机关、社会团体和个人干涉，非本题重点\n\u0001司法平等原则\u0002既要求诉讼地位和适用标准平等，也要求相同或相似案件在法秩序内获得统一裁判。","k":"","kb":15,"kh":[[105,170],[170,227]]},{"id":"2024-10","y":2024,"t":"单","s":"个体工商户王某购人7斤芹菜,其中2斤由市场管理局进行检验,剩余5斤按照每斤 4元价格出售。区市场管理局以抽检的一项指标超标,王某无法提供货源信息为由,决定对王某处以6.6万罚款,区市场管理局违反的行政执法原则是（ ）。","o":["公开原则","诚信原则","比例原则","效率原则"],"a":"C","e":"\u0001针对仅售出20元芹菜的商户处以6.6万元巨额罚款，严重畸重失衡，违背行政执法比例原则。\u0002\nA✗ 公开原则重在执法依据、程序与结果信息透明公开，本题症结在于处罚额度极端悬殊\nB✗ 诚信原则重在政府守信与信赖利益保护，与案值与罚金悬殊问题无关\nC✓ \u0001比例原则\u0002要求行政手段与目的之间合乎适当性、必要性与均衡性（“过罚相当”），小案重罚违背比例原则\nD✗ 效率原则强调及时简便高效履职，并非本题处罚显失公平的审查要点\n小过重罚、小案重罚（如芹菜案）是法考与法硕真题高频考点，核心违背\u0001比例原则（合理行政原则）\u0002。","k":"","kb":15,"kh":[
