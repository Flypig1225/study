21-48","y":2021,"t":"多","s":"西晋《泰始律》确立了“准五服以制罪”原则。根据该原则,下列行为中应予从轻处罚的有（ ）。","o":["子骂詈父母","叔殴杀侄","子盗父母","兄殴伤弟"],"a":"BCD","e":"\u0001\" 准五服以制罪 \"制度,是《晋律》首立指亲属间的犯罪,据五等丧服所规定的亲等来定罪量刑。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 本题中,BD项属于在刑法适用上,以尊犯卑,服制愈近,处罚愈轻,应从轻处罚\nC✓ 属于家庭内的财产侵犯,服制愈近,处罚愈轻,应从轻处罚\nD✓ 符合题意及现行制度规定（\u0001兄殴伤弟\u0002）\n在刑法适用上,凡以尊犯卑,服制愈近,处罚愈轻,服制愈远,处罚愈重; 凡以卑犯尊,服制愈近,处罚愈重,服制愈远,处罚愈轻。 对于家庭(族)内的财产侵犯,则服制愈近,处罚愈轻,服制愈远,处罚愈重。 \u0001“子骂詈父母”\u0002属于刑法适用上以卑犯尊,服制愈近,处罚愈重,应从重处罚。","k":"","kb":45,"kh":[[87,131],[153,186]]},{"id":"2023-34","y":2023,"t":"单","s":"程树德在《九朝律考》中指出:“自晋氏失驭,海内分裂,江左以清谈相尚,不崇名法。故其时中原律学,衰于南而盛于北。”这一时期中原律学的发展推动了北朝立法的创新。下列选项中,代表了北朝立法最高成就的法典是（ ）。","o":["北魏律","麟趾格","北齐律","大统式"],"a":"C","e":"\u0001南北朝时期代表北朝最高立法成就的法典是十二篇结构的《北齐律》。\u0002\nA✗ 《北魏律》是北魏法典儒家化重要过渡，但其定型成熟程度不及《北齐律》\nB✗ 《麟趾格》是东魏编纂的单行法规汇编，首创“格”的立法体例，非完整法典体系\nC✓ \u0001《北齐律》\u0002将《刑名》《法例》合并为《名例律》，定型为十二篇，首立“重罪十条”，为隋唐法典直接奠基，被公认为北朝立法最高成就\nD✗ 《大统式》是西魏首创“式”这一行政公文与细则格式的立法，非最高成就法典\n魏晋南北朝三大里程碑法典：\u0001《魏律》\u0002（18篇、八议入律）、\u0001《泰始律》\u0002（20篇、准五服制罪）、\u0001《北齐律》\u0002（12篇、名例律与重罪十条）。","k":"","kb":45,"kh":[[87,131],[327,381]]},{"id":"2024-35","y":2024,"t":"单","s":"在西晋《泰始律》的各篇中,承担“经略罪法之轻重,正加减之等差,明发众篇之多义,补其章条之不足,较举上下纲领”功能是（ ）。","o":["《杂律》","《法例》","《刑名》","《户律》"],"a":"C","e":"\u0001西晋《泰始律》由《刑名》承担纲领全律、正定罪刑轻重加减与统摄众篇的总则功能。\u0002\nA✗ 《杂律》是规定其他难以归入特定类别零散罪名的分则篇章\nB✗ 《法例》系《泰始律》在《刑名》之后增设的第二篇总则，侧重补充具体适用通例；而“经略罪法之轻重…较举上下纲领”乃晋人张斐所注\u0001《刑名》第一篇的核心定位\u0002\nC✓ 《晋书·刑法志》载“\u0001《刑名》\u0002所以经略罪法之轻重，正加减之等差，明发众篇之多义，补其章条之不足，较举上下纲领”\nD✗ 《户律》为规范户籍、婚姻、赋役等民事行政内容的具体分则\n法典总则演进线：战国《法经》\u0001《具法》\u0002（篇末）→曹魏\u0001《刑名》\u0002（置于篇首）→西晋分\u0001《刑名》《法例》\u0002→《北齐律》合为\u0001《名例律》\u0002。","k":"","kb":45,"kh":[[87,131],[327,381]]},{"id":"2025-49","y":2025,"t":"多","s":"晋朝是中国法律史发展的重要阶段。这一时期,立法成就显著,法律形式多样,互相补充,形成了较为完备的法律体系。晋朝的法律形式包括（ ）。","o":["格","律","令","故事"],"a":"BCD","e":"\u0001事主要指本朝、先王或前朝已经发生的经典事例,这些事例被现有的法律制度所借鉴、吸收,成为断案的依据。\u0002\nA✗ 格不是晋朝的法律形式\nB✓ 晋朝将律和令的概念及其关系做了明确区分和界定,\"律以正罪名,令以存事制\",因此律、令均是晋朝的法律形式,该项\nC✓ 符合题意及现行制度规定（\u0001令\u0002）\nD✓ 律令规定了基本的法律原则和制度,而\"故事\"则通过具体案例为司法实践提供了详细的指导和参考\n\"格\"源于汉代的\"科\",北魏始以\"格\"代\"科\",至东魏制定\u0001《麟趾格》\u0002,始为独立法典。 故事主要指本朝、先王或前朝已经发生的经典事例,这些事例被现有的法律制度所借鉴、吸收,成为断案的依据。 在晋朝,\"故事\"与律令相互补充,共同构成了当时的法律体系。","k":"","kb":45,"kh":[[213,237]]}]},{"sub":"法理学","name":"法系与法的演进","w":0.9,"w5":1.0,"wh":1.2,"bt":"","pt":"法律移植/中华法系传统稳态","L":24,"qs":[{"id":"2005-2","y":2005,"t":"单","s":"关于资本主义法的表述,能够成立的是（ ）。","o":["在封建社会中后期出现的带有资本主义因素的法律,在本质上已经属于真正意义上资本主义法律了","各国资产阶级国家政权的建立虽然在时间上有先后,但其法律的产生却呈现出大致相同的特征","维护资本主义私有制是资本主义法律始终不变的核心","资本主义法和社会主义法相比,主要区别在于前者是公共意志的体现"],"a":"C","e":"\u0001带有资本主义因素的法律,在本质不具有真正意义上的资本主义性质。\u0002\nA✗ 带有资本主义因素的法律,在本质不具有真正意义上的资本主义性质\nB✗ 各资产阶级国家的法律产生并不相同,资本主义法的产生在不同国家有不同形式和特点\nC✓ 资本主义私有制经济是资本主义整个上层建筑的基础,其法律自然始终不变地维护\nD✗ 资本主义法与社会主义法的关键区别是经济基础以及阶级意志的不同, 而非抽象的公共意志的不同\n比如英国资产阶级革命后仍然承认封建法制的效力,大量保留封建制法,只是赋予它新的内容并不断加以改造和补充; 而法国不承认旧法的效力,在继承罗马法的基础上重新制定法律。","k":"","kb":18,"kh":[[47,97],[191,280]]},{"id":"2005-51","y":2005,"t":"多","s":"源于罗马法,以法国拿破仑法典为代表,风行世界各大洲的大陆法系又成为（ ）。","o":["罗马法系","法典法系","普通法系","民法法系"],"a":"ABD","e":"\u0001以法典化的成文法为主要形式,因此也称为法典法系。\u0002\nA✓ 大陆法系以罗马法为历史渊源,因此也称为罗马法系\nB✓ 以法典化的成文法为主要形式,因此也称为法典法系\nC✗ 普通法系,是英美法系的别称,因为英美法系最重要的法律渊源是普通法\nD✓ 以民法为典型,因此也称为民法法系","k":"","kb":18,"kh":[[47,97],[97,158]]},{"id":"2006-1","y":2006,"t":"单","s":"罗马法复兴时期出现的以研究和恢复罗马法为核心的法学流派是（ ）。","o":["罗马法学派","社会法学派","注释法学派","分析实证主义法学派"],"a":"C","e":"\u000112 世纪至16 世纪出现了以研究和恢复罗马法为核心的新的法学,主要是意大利的注释法学派。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✓ 12 世纪至16 世纪出现了以研究和恢复罗马法为核心的新的法学,主要是意大利的注释法学派\nD✗ 与题干设问或现行制度要件不符，故不选\n见\u0001《指南》\u0002(第六版)第452 页。","k":"","kb":18,"kh":[[47,97]]},{"id":"2007-5","y":2007,"t":"单","s":"下列关于资本主义两大法系的表述,正确的是 （ ）。","o":["两大法系在经济基础、社会历史背景以及总的指导思想方面都是一致的","在大陆法系国家,制定法占有重要地位,而判例一般不是正式意义上的法律渊源","英美法系的立法都不采用法典形式,其制定法是单行的法律、法规","就哲学倾向而言,大陆法系倾向于经验主义,英美法系则倾向于理性主义"],"a":"B","e":"\u0001大陆法系和英美法系大陆法系和英美法系都是资本主义经济关系的产物,其阶级本质相同,其法律的主要原则和内容也相同,但是受不同历史条件的影响而形成了一些差别。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 在大陆法系国家,制定法占重要地位,判例并不是正式意义上的法律渊源\nC✗ 英美法系国家判例法占重要地位,但是也有以法典形式出现的立法\nD✗ 在哲学倾向上, 大陆法系倾向于理性主义,英美法系则倾向于经验主义,相关表述观点正好相反","k":"","kb":18,"kh":[[47,97],[97,158]]},{"id":"2007-47","y":2007,"t":"多","s":"下列关于法与商品经济关系的表述,能够成立的有 （ ）。","o":["商品经济越发展,就越离不开法律的规范和调整","法的部门越多,对商品经济的决定作用就越大","简单商品经济的繁荣是罗马法发展的一个重要原因","法的发展程度受商品经济对法的需求程度制约"],"a":"ACD","e":"\u0001法律与经济的关系法律是随着经济发展的需要而产生的,并且随着经济发展的变化而变化,那么 该项、 该项、该项 三项都体现了这种关系,是正确的。\u0002\nA✓ 符合题意及现行制度规定（\u0001商品经济越发展,就越离不开法律的规范\u0002）\nB✗ 法律能起到确认经济关系、规范经济行为、维护经济秩序和服务经济活动的作用,但是它不能对商品经济起决定作用,相关表述是错误的\nC✓ 法律与经济的关系法律是随着经济发展的需要而产生的,并且随着经济发展的变化而变化,那么 该项、 该项、该项 三项都体现了这种关系,是正确的\nD✓ 符合题意及现行制度规定（\u0001法的发展程度受商品经济对法的需求程度\u0002）","k":"","kb":18,"kh":[[47,97]]},{"id":"2008-9","y":2008,"t":"单","s":"被恩格斯称为“商品生产者社会第一个世界性法律”的是（ ）。","o":["拿破仑法典","罗马法","唐律疏议","汉穆拉比法典"],"a":"B","e":"\u0001依据题干考查要点，正确表述为“罗马法”。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 罗马法,尽管属于妈隶制法,但它反映了简单商品经济关系,对后世产生了重大影响,故\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选","k":"","kb":18,"kh":[[47,97]]},{"id":"2009-2","y":2009,"t":"单","s":"下列关于英美法系的表述,能够成立的是（ ）。","o":["英美法系又可以称为法典法系","我国澳门特别行政区的法律属于英美法系","英美法系国家中,有些国家实行不成文宪法制","英美法系国家的法律源于罗马法"],"a":"C","e":"\u0001大陆法系以法典化的成文法为主要形式,因此也称为法典法系。\u0002\nA✗ 英美法系最重要的法律渊源是普通法,因此也成为普通法系\nB✗ 我国澳门特别行政区曾使葡萄牙的殖民地,属于大陆法系\nC✓ 在英美法系国家中,制定法和判例法都是正式上网法律渊源,有些国家事实成文宪法制,有些国家实行不成文宪法制\nD✗ 大陆法系以罗马法为历史渊源,因此也称为罗马法系\n该项、选项不成立。","k":"","kb":18,"kh":[[47,97],[97,158]]},{"id":"2009-8","y":2009,"t":"单","s":"下列关于资本主义法律的表述，正确的是（ ）。","o":["资本主义发法律是全体社会成员共同意志的体现","资本主义法律都是在直接继承封建制法律的基础上产生的","资本主义法律具有超阶级性和超历史性","资本主义法律的核心作用是维护资本主义的私有制"],"a":"D","e":"\u0001资本主义是建立在资本主义经济基础上的上层建筑,体现和反映了资产阶级的利益和意志。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 资本主义法律对封建制法律既有继续的一面,也有决裂的一面,也有的是重新制定的法律\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ 资本主义法律维护以剥削雇佣劳动为基础的资本主义私有制","k":"","kb":18,"kh":[[15,47]]},{"id":"2010-8","y":2010,"t":"单","s":"下列关于英美法系特征的表述,能够成立的是（ ）。","o":["法的基本分类是公法和私法","承袭罗马法传统,不制定法典","制定法和判例法都是法的正式渊源","诉讼不采用对抗制,法官是双方争议的裁决者 )。"],"a":"C","e":"\u0001英美法系国家中,制定法和判例法都是法律的正式渊源,故而。\u0002\nA✗ 英美法系的基本分类是普通法和衡平法,公法和私法是大陆法系国家的法律划分\nB✗ 承袭罗马法传统的是大陆法系\nC✓ 英美法系国家中,制定法和判例法都是法律的正式渊源,故而\nD✗ 英美法系的诉讼体制采用对抗制,法官充当消极的栽定者角色,而大陆法系国家的诉讼程序以法官为中心,奉行职权主义,具有纠问程序","k":"","kb":18,"kh":[[47,97],[97,158]]},{"id":"2012-6","y":2012,"t":"单","s":"下列关于大陆法系与英美法系区别的表述,正确的是（ ）。","o":["大陆法系主要运用归纳型思维,英美法系主要运用演绎型思维","大陆法系的诉讼程序采用当事人主义,英美法系采用职权主义","大陆法系以普通法与衡平法为基本分类,英美法系则分为公法与私法","大陆法系的正式法源主要是制定法,英美法系的正式法源是制定法和判例法"],"a":"D","e":"\u0001大陆法系主要运用演绎型思维,英美法系主要运用归纳型思维。\u0002\nA✗ 大陆法系主要运用演绎型思维,英美法系主要运用归纳型思维\nB✗ 大陆法系的诉讼程序采用职权主义,英美法系采用当事人主义,法官只充当消极的栽判者\nC✗ 大陆法系的基本分类是公法与私法,英美法系的基本分类是普通法和衡平法\nD✓ 英美法系的正式法律渊源是制定法和判例法\n大陆法系的正式法律渊源主要是制定法,判例法一般不是正式的法律渊源; 【点评】两大法系的区别是重要考点。 既可以考查客观题也可以考查主观题。","k":"","kb":18,"kh":[[47,97],[97,158]]},{"id":"2013-3","y":2013,"t":"单","s":"下列不属于大陆法系别称的是（ ）。","o":["民法法系","日耳曼法系","罗马法系","盎格鲁法系"],"a":"D","e":"\u0001英美法系又称普通法法系、判例法系、不成文法系、海洋法系、盎格鲁·撒克逊法系等,是以英国中世纪的法律特别是普通法为基础而发展起来的法律的总称。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 大陆法系又称民法法系、罗马法系、罗马德意志法系、日耳曼法系、法典法系、成文法法系,是以罗马法为基础而发展起来的法律的总称\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ 英美法系又称普通法法系、判例法系、不成文法系、海洋法系、盎格鲁·撒克逊法系等,是以英国中世纪的法律特别是普通法为基础而发展起来的法律的总称","k":"","kb":18,"kh":[[47,97],[97,158]]},{"id":"2014-6","y":2014,"t":"单","s":"罗马法谚:“法律不理琐碎之事。”对此表述, 正确的理解是（ ）。","o":["“琐碎之事”不属于法律调整的范围","“凡事皆诉讼”是现代法治国家的标志","法律无法对所有的社会问题提供解决方案","法律对于自身能够提供解决方案的问题一律加以规制"],"a":"C","e":"\u0001“凡事皆诉讼是现代法治国家的标志”,现代法治国家希望从法院的角度对权利进行保护,但是,也并不是所有的事情都要通过诉讼来解决,这会导致诉讼膨胀,因此,法律也规定了起诉条件。\u0002\nA✗ 说法也过律于绝对,许多琐碎之事可以属于法的调整范围\nB✗ 现代法治国家希望从法院的角度对权利进行保护,但是,也并不是所有的事情都要通过诉讼来解决,这会导致诉讼膨胀,因此,法律也规定了起诉条件\nC✓ 此题是对法律谚语的理解\nD✗ 法律不是规定所有事项,而是针对行为进行了规定,对于思想问题交给了道德和宗教\n法言法语 \" 绝对不能从字面上来简单理解, \"法律不理琐碎之事认为小事情法律就不管。 这个说法是错误的。 故相关表述说法也不对。 本题\" 、相关表述\" 凡事 \" 一 C。 解此类题型可采用排除法。 \u0001“凡事皆诉讼是现代法治国家的标志”\u0002\",这些字眼过于绝对,可以排除。 而“琐碎之事不属于法律调整的范围”说法也过律于绝对,许多琐碎之事可以属于法的调整范围","k":"","kb":18,"kh":[[47,97]]},{"id":"2014-46","y":2014,"t":"多","s":"法律继承体现时间上的先后关系,法律移植反映一国对同时代其他国家法律的吸收与借鉴。下列关于这两个概念的理解,正确的有（ ）。","o":["法律移植不反映时间关系,只体现空间联系","市场经济的客观规律决定了法律移植的必要性","1896年《德国民法典》体现了对罗马法的继承","法律继承要求新法对旧法作适当改造,而法律移植因其同时代性可直接将被移植的法律用于本国法当中"],"a":"BC","e":"\u0001法律移植是指在鉴别、认同、调适、整合的基础上,引进、吸收、摄取、采纳、同化外国法,使之成为本国法律体系中的有机组成部分,而不是直接将被移植的法律用于本国法中。\u0002\nA✗ 法律移植不仅仅体现空间联系,还反映时间关系,要求同时代\nB✓ 市场经济的客观规律和根本特征决定了法律移植的必要性\nC✓ 德国为大陆法系国家,其民法典源于对罗马法的继承\nD✗ 法律移植是指在鉴别、认同、调适、整合的基础上,引进、吸收、摄取、采纳、同化外国法,使之成为本国法律体系中的有机组成部分,而不是直接将被移植的法律用于本国法中\n(法律移植和法律继承,是近年新增考点,可考性很强,望考生加以重视。","k":"","kb":18,"kh":[[47,97],[191,280]]},{"id":"2015-2","y":2015,"t":"单","s":"下列关于法系的表述,正确的是（ ）。","o":["法律移植是法系形成和发展的重要途径","法系是以法律赖以存在的经济基础为划分标准的","英国威尔士和加拿大魁北克省的法律属于大陆法系","当前两大法系之间的差异逐渐缩小,对各国法律进行法系划分已失去意义"],"a":"A","e":"\u0001法系是按照世界上各个国家和地区法律的源流关系和历史传统以及形式上某些特点对法律所作的分类。\u0002\nA✓ 法律移植是法系形成和发展的重要途径\nB✗ 法系是按照世界上各个国家和地区法律的源流关系和历史传统以及形式上某些特点对法律所作的分类\nC✗ 普通法法系的分布范围包括英国本土(苏格兰除外)及美国(路易斯安那州除外)、爱尔兰、加拿大(魁北克省除外)、澳大利亚、新西兰等这些历史上曾是英国的殖民地、附属国的许多国家和地区(如印度和中国香…\nD✗ 两大法系之间的差异已逐渐缩小,融合也正在发生,但传统不同,差异还将长期存在","k":"","kb":18,"kh":[[0,14],[47,97]]},{"id":"2016-8","y":2016,"t":"单","s":"下列关于法的历史演进的表述,正确的是（ ）。","o":["法的历史演进只受客观物质条件的影响","封建制法是人类历史上第一种私有制的法律类型","私有财产神圣不可侵犯是资本主义法的核心特征之一","从规范性调整逐渐发展为个别调整是法起源的一般规律"],"a":"C","e":"\u0001私有制的法律类型包括奴隶制法、封建制法、资本主义法,奴隶制法是最早的私有制类型的法。\u0002\nA✗ 法的历史演进不只受客观物质条件的影响,也受其他因素的影响,比如同为资本主义社会,却产生了大陆法系和普通法法系两大不同的法系,影响两大法系形成的因素很多,也十分复杂\nB✗ 私有制的法律类型包括奴隶制法、封建制法、资本主义法,奴隶制法是最早的私有制类型的法\nC✓ 私有财产神圣不可侵犯是资本主义法律制度的核心\nD✗ 法起源的一般规律是由个别调整逐步发展为规范性调整,先出现对特定人、特定事的调整, 然后才发展为对一般人、一般事的调整\n资本主义法维护以剥削雇佣劳动为基础的资本主义私有制,这是资本主义法律的核心。","k":"","kb":18,"kh":[[0,14],[47,97]]},{"id":"2017-2","y":2017,"t":"单","s":"下列关于法系的表述,正确的是（ ）。","o":["中华法系体现礼法结合的精神","大陆法系是在德国民法典的基础上产生的","英美法系是以美国法为基础,以英国法为主导发展而来","法系划分的主要依据是各国法律的外在形式和本质特征"],"a":"A","e":"\u0001中华法系是礼法结合的法律,礼教是法律的重要原则。\u0002\nA✓ 华法系是礼法结合的法律,礼教是法律的重要原则\nB✗ 大陆法系是以罗马法为基础,在\u0001《法国民法典》\u0002的基础上发展起来的,不是\u0001《德国民法典》\u0002\nC✗ 英美法系以英国中世纪的法律,特别是普通法为基础发展起来,不是以美国法为基础\nD✗ 法系划分的主要依据是法律的历史传统,而不是法律的外在形式和本质特征\n法系是按照世界上各个国家和地区法律的源流关系和历史传统以及形式上某些特点对法律所作的分类,法系是具有共性或共同历史传统的法律的总称。","k":"","kb":18,"kh":[[47,97],[97,158]]},{"id":"2017-3","y":2017,"t":"单","s":"下列关于法律继承的理解,正确的是（ ）。","o":["法律继承与法系的形成之间没有关系","法作为人类文明的成果决定了法律继承的必要性","法律继承是指不同国家法律之间相互继受和影响","法律继承仅体现本国法律传统和法律文化的延续"],"a":"B","e":"\u0001法律继承的根据和理由主要表现在: 社会生活条件的历史延续性、法律的相对独立性决定了法律的继承性。\u0002\nA✗ 法系是具有共性或共同历史传统的法律的总称,法律继承是不同历史类型的法律制度之间的延续和继受,法律继承是法系形成的重要原因之一\nB✓ 法作为人类文明成果决定了法律继承的必要性,法律演进的历史事实也验证了法律的继承性\nC✗ 法律移植是同时代不同国家法律之间相互继受和影响,不同时代的继受和影响不是法律移植\nD✗ 法律继承继承的是人类文明的共同成果,不仅体现本国法律传统和法律文化的延续, 也体现其他国家法律传统和法律文化的继承","k":"","kb":18,"kh":[[0,14],[191,280]]},{"id":"2018-12","y":2018,"t":"单","s":"关于大陆法系和英美法系区别的表述,不正确的是（ ）。","o":["大陆法系的正式渊源主要是制定法,而英美法系是判例法和制定法","大陆法系的基本分类是公法和私法,而英美法系是普通法和衡平法","大陆法系的诉讼模式采取当事人主义,而英美法系是采取法官中心主义","大陆法系注重法典的编纂,而英美法系更多采取的是单行法"],"a":"C","e":"\u0001英美法系为当事人主义,大陆法系为法官中心主义,相关表述将二者说法搞混。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✓ 英美法系为当事人主义,大陆法系为法官中心主义,相关表述将二者说法搞混\nD✗ 与题干设问或现行制度要件不符，故不选","k":"","kb":18,"kh":[[47,97],[97,158]]},{"id":"2020-6","y":2020,"t":"单","s":"下列关于法系的说法,正确的是（ ）。","o":["法律赖以产生的经济基础是划分法系的核心标准","大陆法系是在继承罗马法的基础上逐渐形成的","通过法律移植实现区域法律高度统一,是形成法系的必要条件","在法律全球化时代,大陆法系与英美法系的区分已没有现实意义"],"a":"B","e":"\u0001法系的划分主要是依法律的历史传统进行的,但是影响法系形成的因素有很多,也十分复杂。\u0002\nA✗ 法系的划分主要是依法律的历史传统进行的,但是影响法系形成的因素有很多,也十分复杂\nB✓ 大陆法系是以罗马法为基础而发展起来的法律的总称\nC✗ 法律移植是指在鉴别、认同、调适、整合的基础上,引进、吸收、采纳、摄取、同化外国法, 使之成为本国法律体系中的有机组成部分,为本国所用,而法系的划分主要是依法律的历史传统进行的, 法律移植不是…\nD✗ 进入20世纪后,两大法系之间的差异已逐渐缩小,融合也正在发生,但传统不同,差异还将长期存在","k":"","kb":18,"kh":[[47,97],[97,158]]},{"id":"2022-3","y":2022,"t":"单","s":"下列关于法律继承的表述,不正确的是（ ）。","o":["法律继承是新法对旧法的承接和继受","法律继承是法律全球化的主要途径","法律能被继承与法律的相对独立性密切相关","社会生活条件的历史延续决定了法律继承的必然性"],"a":"B","e":"\u0001法律继承的根据和理由主要表现在:(1)社会生活条件的历史延续性决定了法律的继承性。\u0002\nA✗ 法律继承是不同历史类型的法律制度之间的延续和继受,一般表现为旧法对新法的影响和新法对旧法的承接和继受\nB✓ 法律继承不属于法律全球化的主要途径\nC✗ (4)法律演进的历史事实验证了法律的继承性\nD✗ 法律继承的根据和理由主要表现在:(1)社会生活条件的历史延续性决定了法律的继承性\n(2)法律的相对独立性决定了法的发展过程的延续性和继承性; (3)法作为人类文明成果决定了法律继承的必要性; 法律全球化的主要途径有以下几种: 专业综合课 (1)国际法的国内化、地方化; (2)地方法或国内法的全球化。 本题为选非题,故选择B。","k":"","kb":18,"kh":[[191,280]]},{"id":"2022-5","y":2022,"t":"单","s":"下列关于两大法系的表述,正确的是（ ）。","o":["判例法系又称罗马一日耳曼法系","现代印度的法律制度属于大陆法系","加拿大魁北克地区的法律制度属于英美法系","大陆法系是承袭古罗马法的传统,以《法国民法典》和《德国民法典》为代表的各国法律制度的总称"],"a":"D","e":"\u0001普通法法系的分布范围包括英国本土(苏格兰除外)及美国、爱尔兰、加拿大、澳大利亚、新西兰、印度等这些历史上曾是英国的殖民地、附属国的许多国家和地区。\u0002\nA✗ 判例法系又称英美法系,罗马-日耳曼法系又称大陆法系,二者是截然不同的两大法系\nB✗ 普通法法系的分布范围包括英国本土(苏格兰除外)及美国、爱尔兰、加拿大、澳大利亚、新西兰、印度等这些历史上曾是英国的殖民地、附属国的许多国家和地区\nC✗ 由于历史的原因,日本、土耳其、美国的路易斯安那州、加拿大的魁北克省、中国的澳门等地区的法律基本上属于大陆法系\nD✓ 它是在罗马法基础上,以1804年\u0001《法国民法典》\u0002和1896 年\u0001《德国民法典》\u0002为代表性法典,以及在其影响下仿照它们而形成和发展起来的各国法律的总称\n英美法系又称普通法法系、判例法系、不成文法系、海洋法系等,是以英国中世纪的法律,特别是普通法为基础而发展起来的法律的总称。 大陆法系又称民法法系、罗马法系、罗马德意志法系、日耳曼法系、法典法系、成文法法系等,是以罗马法为基础而发展起来的法律的总称。","k":"","kb":18,"kh":[[47,97],[97,158]]},{"id":"2023-2","y":2023,"t":"单","s":"下列关于法系的说法,正确的是（ ）。","o":["以和为贵是中华法系的重要价值追求","不同法系之间不存在法律移植关系","判例法在大陆法系和英美法系都是法的正式渊源","划分法系的主要依据是法产生的时代背景及体现的阶级意志"],"a":"A","e":"\u0001以和为贵、追求礼法结合与和谐秩序是中华法系的重要价值追求。\u0002\nA✓ 中华法系蕴含“无讼”“和谐”传统理念，\u0001以和为贵\u0002是其重要价值追求\nB✗ 不同法系之间完全可以相互借鉴吸收，存在广泛的\u0001法律移植\u0002（如清末民初我国对大陆法系的移植）\nC✗ 在大陆法系中制定法是正式渊源，\u0001判例法并非大陆法系正式的法的渊源\u0002\nD✗ 划分法系的主要依据是法的\u0001历史传统与外在结构特征\u0002，而非时代背景和阶级意志\n注意区分法系与法的历史类型：法的历史类型按\u0001经济基础与阶级本质\u0002划分，法系按\u0001历史传统\u0002划分。","k":"","kb":18,"kh":[[47,97],[97,158]]},{"id":"2024-2","y":2024,"t":"单","s":"下列关于法系的说法,不正确的是（ ）。","o":["大陆法系又称法典法系,以制定法作为正式的法的渊源","英美法系中的判例法,是指衡平法相对的普通法","刑法发达,民法薄弱,是中华法系的特点之一","法系是用来概括不同区域或国家之间法律文明差异化和类似性的概念"],"a":"B","e":"\u0001英美法系中的判例法包含普通法（Common Law）和衡平法（Equity）两部分判例，而非仅指普通法。\u0002\nA✗ 大陆法系亦称民法法系或法典法系，以罗马法为基础，\u0001以制定法作为正式法律渊源\u0002，正确\nB✓ 英美法系历史形成普通法法院与衡平法院两大分支，\u0001衡平法同样由大法官判例发展而来\u0002，均属判例法体系\nC✗ 中华法系诸法合体、重刑轻民，\u0001刑法发达而民法相对薄弱\u0002正是其典型特征，正确\nD✗ “法系”是依据历史传统与外在结构特征，\u0001概括不同区域或国家法律文明差异与相似性\u0002的学理概念，正确\n易混提醒：英美法系的“普通法”有广义（整套英美法系）与狭义（与\u0001衡平法\u0002相对的普通法院判例）之分，\u0001二者皆属于判例法\u0002。","k":"","kb":18,"kh":[[47,97],[97,158]]},{"id":"2025-7","y":2025,"t":"单","s":"关于大陆法系和英美法系,下列说法正确的是（ ）。","o":["大陆法系的司法不同于英美法系,倾向于经验主义","英美法系的立法不同于大陆法系,多采用法典形式","大陆法系和英美法系都将制定法作为法的正式渊源","大陆法系和英美法系传统上都采用公法与私法的分类"],"a":"C","e":"\u0001大陆法系的诉讼程序以法官为重心,奉行职权主义,具有纠问程序的特点,英美法系倾向于经验主义。\u0002\nA✗ 大陆法系的诉讼程序以法官为重心,奉行职权主义,具有纠问程序的特点,英美法系倾向于经验主义\nB✗ 大陆法系多采用法典形式\nC✓ 大陆法系和英美法系法的正式渊源中都包含制定法\nD✗ 大陆法系传统上采用公法与私法的分类,英美法系采用普通法与衡平法的分类","k":"","kb":6,"kh":[[47,72],[110,195]]}]},{"sub":"中国法制史","name":"春秋战国法律制度","w":0.8,"w5":0.8,"wh":1.2,"bt":"回补","pt":"2025-2026客观均0分·《法经》/成文法回补", 选贤任官,建立官僚制度之法\nD✗ \u0001《仆区法》\u0002是禁止隐匿逃亡人之法\n\u0001《菲门法》\u0002是关于宫门守卫、保障国君安全之法。 竹刑是郑国大夫私造的刑法。","k":"","kb":42,"kh":[[0,16],[60,71]]},{"id":"2022-33","y":2022,"t":"单","s":"《法经》载:“王者之政,莫急于盗贼”。下列犯罪中,属于“贼”的是（ ）。","o":["杀人","犯奸","窃盗","僭越"],"a":"A","e":"\u0001《盗法》是侵犯官私财产所有权犯罪的法律规定,《贼法》是关于人身伤害、破坏社会秩序的法律规定。\u0002\nA✓ 杀人属于人身伤害,属于\"贼\"\nB✗ 犯奸即作奸犯法,也指犯通奸罪\nC✗ 窃盗属于\"盗\"\nD✗ 僧越同逾制,属于\"杂\"\n\u0001《法经》\u0002共有六篇:\u0001《盗法》\u0002\u0001《贼法》\u0002\u0001《网法》\u0002\u0001《捕法》\u0002\u0001《杂法》\u0002\u0001《具法》\u0002。 \u0001《荀子·修身》\u0002解释:\"窃货曰盗\"\"害良曰贼\"。 李认为\"王者之政,莫急于盗贼\",所以将\u0001《盗法》\u0002和\u0001《贼法》\u0002列在法典之首。 据\u0001《普书·刑法志》\u0002载:\"其轻狡、越城、博戏、借假不廉、淫侈、逾制,以为\u0001《杂律》\u0002一篇\"。","k":"","kb":42,"kh":[[0,16],[111,230]]},{"id":"2024-28","y":2024,"t":"单","s":"春秋是法律变革的重要时期。据《左传昭公七年》记载,楚文王效仿西周初年“有亡荒阅”之法,作“仆区之法”。“仆区之法”惩治的主要犯罪行为是（ ）。","o":["群盗","隐匿逃亡人","教唆杀人","奸党"],"a":"B","e":"\u0001春秋时期楚文王作《仆区之法》专门惩治隐藏、窝藏逃亡奴隶或犯罪逃亡者的行为。\u0002\nA✗ 群盗属于普通重盗窃罪，春秋时另有“常法”“盗法”规制，并非《仆区之法》核心对象\nB✓ 《左传·昭公七年》载“楚文王作仆区之法”，效仿周初“有亡荒阅”追踪逃奴古制，\u0001专门惩治隐匿逃亡人（奴隶）之罪\u0002\nC✗ 教唆他人杀人并非楚文王《仆区之法》的主要创设针对内容\nD✗ 奸党罪是明朝朱元璋在《大明律》中为加强专制集权首次设立的新罪名\n先秦春秋法制小百科：郑子产\u0001《铸刑书》\u0002、邓析\u0001《竹刑》\u0002、晋赵鞅\u0001《铸刑鼎》\u0002、楚文王\u0001《仆区之法》\u0002（治隐匿逃亡）。","k":"","kb":42,"kh":[[17,60],[85,110]]},{"id":"2024-48","y":2024,"t":"多","s":"下列关于《法经》表述,正确的有（ ）。","o":["《法经》的制定者是韩非","《法经》体现了“王者之政,莫急于盗贼”的思想","《法经》分为《盗法》《贼法》《囚法》《捕法》《杂法》《具法》六篇","《法经》中的《具法》是关于定罪量刑原则的规定"],"a":"BCD","e":"\u0001《法经》由战国魏国李悝编制，共六篇，贯彻“王者之政，莫急于盗贼”思想，总则《具法》置于篇末。\u0002\nA✗ 《法经》是由战国时期魏国政治家、法家先驱\u0001李悝\u0002总结各国成文法经验编纂而成，韩非为战国末期法家集大成者\nB✓ 李悝认为“王者之政，莫急于盗贼”，故把惩治侵犯财产与治安之\u0001《盗法》《贼法》置于《法经》篇首\u0002\nC✓ 《法经》体系依次为《盗法》《贼法》《囚法》（又称网法）、《捕法》《杂法》《具法》，\u0001共六篇\u0002\nD✓ 第六篇\u0001《具法》\u0002是关于定罪量刑加重减轻等通例的总则性规定，相当于现代刑法总则\n《法经》三大基石：\u0001李悝所撰\u0002、\u0001六篇结构（盗贼居首、具法居末）\u0002、\u0001我国历史上第一部较系统的封建成文法典\u0002。","k":"","kb":42,"kh":[[0,16],[111,230]]}]},{"sub":"法理学","name":"绪论与法的本质特征","w":0.6,"w5":0.8,"wh":2.1,"bt":"","pt":"近5年客观降至0.8分/年·2026已考简答","L":35,"qs":[{"id":"2005-5","y":2005,"t":"单","s":"在法的本质问题上,神意论的主要代表人物是（ ）。","o":["西塞罗","萨维尼","托马斯·阿奎那","托马斯·霍布斯"],"a":"C","e":"\u0001神意论的代表人物是中世纪经院哲学家托马斯·阿奎那，主张法源于上帝的永恒理性与神意。\u0002\nA✗ 西塞罗是古罗马斯多葛学派思想家，主张法的本质是符合自然界万物的\u0001自然理性论\u0002\nB✗ 萨维尼是19世纪德国历史法学派创始人，主张法是\u0001民族精神论\u0002的体现\nC✓ 托马斯·阿奎那在《神学大全》中系统提出永恒法、自然法与神法等，是\u0001神意论\u0002代表人物\nD✗ 托马斯·霍布斯从社会契约与主权者命令出发阐释法律，代表近代\u0001规范论/命令说\u0002\n西方法学中法的本质代表人物对照：西塞罗（\u0001理性论\u0002）、阿奎那（\u0001神意论\u0002）、萨维尼（\u0001民族精神论\u0002）、奥斯丁/霍布斯（\u0001主权者命令说\u0002）。","k":"","kb":1,"kh":[[169,198]]},{"id":"2006-13","y":2006,"t":"单","s":"民间故事《铡美案》中,驸马陈世美被依法处决。这一法律现象表明（ ）。","o":["法律是公共意志的反映,具有超阶级性","法律有时候也是被统治阶级将意志上升为国家意志的结果","法律是统治阶级整体意志、共同意志的体现","我国封建社会的法律也贯彻公民在法律面前人人平等的原则"],"a":"C","e":"\u0001应该说,法律是统治阶级集体意志的体现,被统治阶级将其上升为国家意志的结果,为了维护阶级统治就是统治阶级的成员也的遵守,否则也要受到惩罚。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 应该说,法律是统治阶级集体意志的体现,被统治阶级将其上升为国家意志的结果,为了维护阶级统治就是统治阶级的成员也的遵守,否则也要受到惩罚\nC✓ 符合题意及现行制度规定（\u0001法律是统治阶级整体意志、共同意志的体\u0002）\nD✗ 与题干设问或现行制度要件不符，故不选","k":"","kb":2,"kh":[[0,147]]},{"id":"2006-46","y":2006,"t":"多","s":"下列关于法学的表述中,正确的有（ ）。","o":["从认识论角度,法学可以分为理论法学和应用法学","法学是随着法的产生而产生的,有了法就有了法学","法学的研学对象存在不同层次,最深的层次是创造和适用法的方法","法存在和发展的社会文化状况也是法学的研究对象之一"],"a":"AD","e":"\u0001凡属与法有关的问题和现象都在法学研究的范围之内。\u0002\nA✓ 符合题意及现行制度规定（\u0001从认识论角度,法学可以分为理论法学和\u0002）\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ 符合题意及现行制度规定（\u0001法存在和发展的社会文化状况也是法学的\u0002）","k":"","kb":0,"kh":[[0,95]]},{"id":"2007-7","y":2007,"t":"单","s":"下列关于“法学”的表述,正确的是 （ ）。","o":["人类社会自从有了法或法律现象,就有了研究这一社会现象的法学","法学在西方发源于古希腊,到古罗马共和国时期已经发展成为一门独立的学科","我国早在春秋战国时期就出现了法家、儒家等许多专门研究法律问题的法学派别","马克思主义法学与以往法学的一个重要区别,在于前者承认法是永恒的和超历史的"],"a":"B","e":"\u0001法学的产生和发展法学的产生较晚,在法律现象的材料有了一定积累并出现《人大法学考研资料》阶层后才产生了法学。\u0002\nA✗ 法学的产生和发展法学的产生较晚,在法律现象的材料有了一定积累并出现\u0001《人大法学考研资料》\u0002阶层后才产生了法学\nB✓ 在西方,法学最早源于古希腊,后来随着社会的发展,到古罗马共和国时期,法学发展成为一门独立的学科\nC✗ 我国春秋战国时期的法家和儒家并非专门研究法律问题的学派\nD✗ 马克思主义法学认为法是社会发展到一定阶段的产物, 法和国家都是阶级矛盾不可调和的产物,随着社会生产力的发展、社会的进步、阶级的消灭, 国家和法都将消亡,而剥削阶级\u0001《人大法学考研资料》\u0002才把法律…","k":"","kb":1,"kh":[[0,18],[199,251]]},{"id":"2007-10","y":2007,"t":"单","s":"关于法的本质,下列学者中主张“理性论”的是 （ ）。","o":["奥古斯丁","格劳秀斯","萨维尼","庞德"],"a":"B","e":"\u0001依据题干考查要点，正确表述为“格劳秀斯”。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 符合题意及现行制度规定（\u0001格劳秀斯\u0002）\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选\n法的本质 \"理性论\"是自然法学派关于法的本质的观点,格劳秀斯是自然法学派的代表人物, 而奥古斯丁是实证主义法学派的代表人物,萨维尼是历史法学派的代表,庞德是社会法学派的代表。","k":"","kb":1,"kh":[[19,66],[169,198]]},{"id":"2007-13","y":2007,"t":"单","s":"有些国家的经济制度或经济发展水平相同,它们的法律却千差万别。这种现象表明 （ ）。","o":["经济条件不是法的内容的惟一决定因素","法的物质制约性原理不具有普遍性","经济以外的因素有时也对法的本质起最终决定作用","一国法律的具体表现形式与该国的经济制度无关"],"a":"A","e":"\u0001法律与经济的关系法律是随着经济发展的需要而产生的,一定生产关系的性质及生产力的发展水平, 决定着以该生产关系为基础的法律的本质和特征,并且是法律本质的唯一决定因素。\u0002\nA✓ 符合题意及现行制度规定（\u0001经济条件不是法的内容的惟一决定因素\u0002）\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 法律的本质由经济基础决定,但是法律的内容和具体表现形式等要受诸多因素的影响,包括社会、经济和历史条件等","k":"","kb":2,"kh":[[0,147]]},{"id":"2008-1","y":2008,"t":"单","s":"在法的本质问题上,下列表述中能够成立的是（ ）。","o":["霍布斯主张神意论","格劳秀斯坚持理性论","卢梭强调社会控制论","庞德提出民族精神论"],"a":"B","e":"\u000117~18 世纪,古典自然法学派的一些学者主张将法的本质归结为人的理性和本性其中主要的代表人物有荷兰的格劳秀斯、英国的霍布斯、法国的卢梭等。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 17~18 世纪,古典自然法学派的一些学者主张将法的本质归结为人的理性和本性其中主要的代表人物有荷兰的格劳秀斯、英国的霍布斯、法国的卢梭等\nC✗ 美国的庞德主张社会控制论\nD✗ 德国的萨维尼主张民族精神论","k":"","kb":1,"kh":[[19,66]]},{"id":"2008-46","y":2008,"t":"多","s":"下列选项中,产生于十九世纪的法学流派有（ ）。","o":["分析法学派","历史法学派","自然法学派","经济分析法学派"],"a":"AB","e":"\u0001其中历史法学派以胡果特别是以萨维尼为代表,他们变法是民族精神的体现,是随着一个民族的文明发展而然地、逐步地发展的,法的主要形式应当是习惯法。\u0002\nA✓ 符合题意及现行制度规定（\u0001分析法学派\u0002）\nB✓ 历史法学派以胡果特别是以萨维尼为代表,他们变法是民族精神的体现,是随着一个民族的文明发展而然地、逐步地发展的,法的主要形式应当是习惯法\nC✗ 实证主义法学派、新自然法学派和社会法学派属于20 世纪以后的法学流派\nD✗ 与题干设问或现行制度要件不符，故不选\n哲理法学派、历史法学派、分析法学派取代了日派衰落的自然法学派,成为19 世纪三大法学学术流派。 分析法学派的主要代表人物是英国的边沁和奥斯汀。 他们强调对法着重进行法理学上的分析研究,轻视甚至是否定对法进行价值研究。 提倡运用纯形式逻辑和推理的方法揭示或认识法的共同概念、原则和特征。 所以,按照奥斯汀的理论,恶法亦法。","k":"","kb":1,"kh":[[19,66],[169,198]]},{"id":"2008-47","y":2008,"t":"多","s":"下列选项中,属于应用法学的有（ ）。","o":["国际经济法学","法社会学","刑事诉讼法学","刑法学"],"a":"ACD","e":"\u0001相关表述 属于应用法学。\u0002\nA✓ 属于应用法学\nB✗ 法社会学是与立法学、法律解释学相对的,是从法律的制定到法律的实施的角度,对法学所作的分类,法社会学具有很强的理论法学色彩\nC✓ 属于应用法学\nD✓ 属于应用法学\n从认识论的角度看,法学可以分为理论法学和应用法学。 前者研究法的基本概念、原理和规律,如法哲学等,后者研究现实的国际和国内法律制度。","k":"","kb":0,"kh":[[0,95]]},{"id":"2009-4","y":2009,"t":"单","s":"法学上,将法律实际实行的状态和成都称为（ ）。","o":["法律实施","法律实效","法律适用","法律实现"],"a":"B","e":"\u0001法律实施,是指法在社会生活中被人们实际施行。\u0002\nA✗ 法律实施,是指法在社会生活中被人们实际施行\nB✓ 本题考查法律实效\nC✗ 狭义的法律适用即司法,是指国家司法机关依照法定职权和程序,具体适用法律处理各种案件的专门活动\nD✗ 法律实现是指法的要求在生活指中被转化为现实\n法律实效是法律被人们实际施行的状态和程度,侧重于结果。","k":"","kb":1,"kh":[[126,168]]},{"id":"2009-48","y":2009,"t":"多","s":"马克思主义法学与以往法学的主要区别有（ ）。","o":["坚持辩证唯物主义为指导","承认经济以外因素对法律的影响","认为发是由社会物质生活条件决定的","否认新法与旧法之间的继承性"],"a":"AC","e":"\u0001马克思主义法学坚持辩证唯物主义法人的观点,认为法的物质制约性和法的阶级意志性是法的不同层次的本质属性,而两者有辩证统一的关系。\u0002\nA✓ 马克思主义法学坚持辩证唯物主义法人的观点,认为法的物质制约性和法的阶级意志性是法的不同层次的本质属性,而两者有辩证统一的关系\nB✗ 非煤矿山主义法学同样承认经济以外因素对法律的影响\nC✓ 马克思主义法学认为法是由统治阶级所处的社会物质生活条件的所决定的,同时也受到历史传统等因素的影响\nD✗ 马克思主义法学坚持历史唯物主义传统,认为法学是一个历史发展的过程,新法和旧法之间具有继续性","k":"","kb":1,"kh":[[0,18],[199,251]]},{"id":"2009-51","y":2009,"t":"多","s":"下列关于法理学的表述,能够成立的是（ ）。","o":["法理学与部门法学的关系是一般与特殊的关系","法理学为部门法学的研究提供了立场、观点和方法","法理学属于应用法学和国内法学","法理学只研究现行有效的法律规范"],"a":"AB","e":"\u0001法理学及提供了研究部门的法学立场、观点和方法,同时它所阐述的基本概念、基本原则和基本知识,对部门法学的研究又有指导意义。\u0002\nA✓ 法理学与部门法学的关系是一般与特殊的关系\nB✓ 法理学及提供了研究部门的法学立场、观点和方法,同时它所阐述的基本概念、基本原则和基本知识,对部门法学的研究又有指导意义\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选\n法理学是关于法律现象的最一般的理论,是法学研究的基础理论和方法论。 作为理论法学的重要学科,法理学的研究对象是所有法律现象中的一般特点、法律现象的本质和客观规律性。 \u0001“法理学属于应用法学和国内法学”\u0002和","k":"","kb":0,"kh":[[0,95],[96,136]]},{"id":"2010-1","y":2010,"t":"单","s":"在法的概念问题上,古典自然法学派的主要观 点是（ ）。","o":["法是阶级社会的产物","法是民族精神的产物","法是人类理性和本性的体现","法是自由意志的外在表现形式"],"a":"C","e":"\u0001古典自然法学派认为,人类在组成国家以前生活在自然状态中,受体现人的理性的自然法的支配,以后根据理性要求,订立契约,成立国家。\u0002\nA✗ 是马克思主义法学派的观点相关表述是历史法学派萨维尼的观点,相关表述是自由主义法学家黑格尔的观点\nB✗ 与题干设问或现行制度要件不符，故不选\nC✓ 法是人类理性和本性的体现\nD✗ 与题干设问或现行制度要件不符，故不选\n\u0001“法是阶级社会的产物”\u0002 是马克思主义法学派的观点“法是民族精神的产物”是历史法学派萨维尼的观点,“法是自由意志的外在表现形式”是自由主义法学家黑格尔的观点。","k":"","kb":1,"kh":[[19,66],[169,198]]},{"id":"2010-3","y":2010,"t":"单","s":"下列选项中,属于法区别于其他社会规范的特征是（ ）。","o":["概括性","规范性","抽象性","国家强制性"],"a":"D","e":"\u0001大多数社会规范都有概括性、规范性和抽象性等特征,故不选ABC 项。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ 但其他社会规范只有一般的强制性,都没有法律的国家强制性,法律以国家强制力为后盾,由国家强制力保证实施,故选择相关表述\n但其他社会规范只有一般的强制性,都没有法律的国家强制性,法律以国家强制力为后盾,由国家强制力保证实施,故选择\u0001“国家强制性”\u0002。","k":"","kb":2,"kh":[[0,147]]},{"id":"2010-46","y":2010,"t":"多","s":"下列选项中,属于法学交叉学科的有（ ）。","o":["国际法学","法经济学","法社会学 )。","法医学"],"a":"BCD","e":"\u0001国际法不是法学交叉学科,属于法学本科。\u0002\nA✗ 国际法不是法学交叉学科,属于法学本科\nB✓ 法经济学是法学和经济学交叉学科,法社会学是法学和社会学交叉学科,法医学是法学和医学交叉学科,故BC\nC✓ 符合题意及现行制度规定（\u0001法社会学 )。\u0002）\nD✓ 符合题意及现行制度规定（\u0001法医学\u0002）\n以法学和其他学科的关系为标准,法学可以分为法学本科和法学交叉学科。","k":"","kb":0,"kh":[[96,136]]},{"id":"2011-46","y":2011,"t":"多","s":"下列法学分支学科中,属于理论法学的有（ ）。","o":["法理学","刑法学","民法学","法律史学"],"a":"AD","e":"\u0001我们可以从不同的角度出发来划分法学的分支学科,比如从认识论角度,法学可以分为理论法学和应用法学,理论法学包括法理学法律史学、法社会学等。\u0002\nA✓ 符合题意及现行制度规定（\u0001法理学\u0002）\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ 我们可以从不同的角度出发来划分法学的分支学科,比如从认识论角度,法学可以分为理论法学和应用法学,理论法学包括法理学法律史学、法社会学等\n法学体系是一个由互不相同,但又有联系的分支学科构成的知识系统。 应用法学包括民法、刑法经济法商法等。","k":"","kb":0,"kh":[[0,95],[96,136]]},{"id":"2012-1","y":2012,"t":"单","s":"下列关于法的本质的表述,正确的是（ ）。","o":["荷兰思想家格劳秀斯认为法是神意的体现","罗马思想家奥古斯丁认为法是主权者的命令","德国法学家萨维尼认为法是民族精神的体现","中世纪思想家阿奎那认为法是理性的体现"],"a":"C","e":"\u0001萨维尼是民族精神论的代表,认为法是民族精神的体现。\u0002\nA✗ 西塞罗、格劳秀斯是理性论的代表\nB✗ 奥古斯丁也是神意论的代表\nC✓ 萨维尼是民族精神论的代表,认为法是民族精神的体现\nD✗ 与题干设问或现行制度要件不符，故不选\n阿奎那是神意论的代表,神意论认为神的智慧是一切法律的渊源,神的智慧本身具有法律性质。 【点评】关于法的本质的各派观点以及各观点的代表人物是非常重要的考点,几乎每年都会在选择题部分出现。 考生一定要给予高度重视。","k":"","kb":1,"kh":[[67,125],[169,198]]},{"id":"2012-2","y":2012,"t":"单","s":"下列选项中,属于法的基本特征的是（ ）。","o":["法是由国家制定或者认可的,具有人民性","法是由社会强制力保证实施的,具有强制性","法是由原始社会习惯演变而来的,具有习惯性","法是以权利和义务为内容的,具有权利与义务的一致性"],"a":"D","e":"\u0001法的基本特征是:(1)法是调整人们行为的规范,具有规范性和普遍性。\u0002\nA✗ (2)法是由国家制定或认可的社会规范,具有国家意志性和权威性\nB✗ 任何社会规范均具有强制性,法与其他社会规范不同之处在于法具有国家强制性\nC✗ 习惯性也不是法的基本特征\nD✓ (3)法是以权利和义务为内容的社会规范,具有权利和义务的一致性\n(4)法是由国家强制力保证实施的社会规范,具有国家强制性。","k":"","kb":2,"kh":[[0,147]]},{"id":"2012-47","y":2012,"t":"多","s":"根据马克思主义法学观,原始社会的氏族习惯不属于法律的范畴,其主要原因有（ ）。","o":["它不是用语言或文字表述的","它不是由国家制定或认可的","它有过分浓厚的宗教、道德色彩","它不是依靠法院、警察与监狱等机关保证实施的"],"a":"BD","e":"\u0001根据马克思主义法学观,法律是国家制定或认可的,由国家强制力保障实施的,以规定当事人权利和义务为内容的具有普遍约束力的社会规范。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 说明了原始社会的习惯不是国家制定或认可的,不具有国家意志性,相关表述说明原始社会的习惯不是由国家强制力保障实施的,不具有国家强制性,所以BD项说明了原始社会的习惯不具有法律的本质特征,因而不…\nC✗ 法律是不是由文字语言来表述,以及法律是否具有浓厚的宗教、道德色彩,这些都不会影响某个社会规范能否成为法律\nD✓ 符合题意及现行制度规定（\u0001它不是依靠法院、警察与监狱等机关保证\u0002）\n法的本质有两个层次,即法是统治阶级的国家意志的体现; 法所体现的意志由一定的物质生活条件所决定。 法具有规范性、普遍性、国家意志性、权威性、权利和义务一致性、国家强制性以及程序性。 \u0001“它不是由国家制定或认可的”\u0002说明了原始社会的习惯不是国家制定或认可的,不具有国家意志性,相关表述说明原始社会的习惯不是由国家强制力保障实施的,不具有国家强制性,所以BD项说明了原始社会的习惯不具有法律的本质特征,因而不是法律。","k":"","kb":2,"kh":[[0,147]]},{"id":"2013-1","y":2013,"t":"单","s":"下列选项中,属于法的基本特征的是（ ）。","o":["社会公益性","技术规范性","国家强制性","国家引导性"],"a":"C","e":"\u0001法的基本特征包括:(l)法是调整人们行为的规范,具有规范性和普遍性。\u0002\nA✗ \" 表述则过于狭 \" 技术规范性属于法的基本特征\nB✗ \" 国家引导性 \"并不是法所独有,如国家政策也窄\nC✓ 此题较为简单, \" 社会公益性根据以上描述,可知\nD✗ 具有国家引导性\n(2)法是由国家制定或认可的社会规范,具有国家意志性和权威性; (3)法是以权利义务为内容的社会规范,具有权利和义务的一致性; (4)法是由国家强制力保证实施的社会规范,具有国家强制性和程序性。","k":"","kb":2,"kh":[[0,147],[148,187]]},{"id":"2013-2","y":2013,"t":"单","s":"首次将“法”界定为高度专门化的社会控制工具的学者是（ ）。","o":["亨利·梅因","马克斯·韦伯","卡尔·马克思","罗斯科·庞德"],"a":"D","e":"\u0001马克思则是马克思主义法学的创始 \"形式理性人,他对法的本质和概念的理解具有鲜明的阶级特性。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 马克思则是马克思主义法学的创始 \"形式理性人,他对法的本质和概念的理解具有鲜明的阶级特性\nD✓ \" 法 \" 界定为 \" 高度专门化的社首次将 \"的学者是美国社会法学的代表人物罗斯会控制工具科·庞德\n梅因,历史法学派的代表人物,英国历史法学的创始人,提出所有进步社会的运 \" 从身份到契约 \"的运动。 韦动,到此处为止,是一个伯是德国法社会学家,强调法在社会发展过程中具有 \" 价值;","k":"","kb":1,"kh":[[0,18],[199,251]]},{"id":"2014-1","y":2014,"t":"单","s":"依据马克思主义法学观,下列关于法起源的, 正确的表述是（ ）。","o":["私有制是法起源的经济根源","从存在形态看,国家先于法律产生","法起源时就有别于道德、宗教等规范","从一般调整到个别调整是法起源的基本规律"],"a":"A","e":"\u0001马克思主义法学认为,私有制是法产生的经济根源。\u0002\nA✓ 阶级的出现及阶级之间的矛盾是法产生的政治根源\nB✗ 根据马克思的基本原理,法是社会发展到一定阶段的产物,是和国家一起产生的\nC✗ 法起源时与道德宗教混为一体,然后发展到相对独立\nD✗ 法是由个别调整逐步发展到规范性调整\n\u0001“从存在形态看,国家先于法律产生”\u0002,根据马克思的基本原理,法是社会发展到一定阶段的产物,是和国家一起产生的,故“从存在形态看,国家先于法律产生”国家先于法产生的说法错误。","k":"","kb":1,"kh":[[0,18],[199,251]]},{"id":"2015-1","y":2015,"t":"单","s":"下列关于法学的表述，正确的是（ ）。","o":["法学是社会科学,不具有人文科学的性质","马克思主义法学认为,超阶级的法学是不存在的","法学在资产阶级革命胜利后成为一门独立的学科","作为法学的一般理论和基础理论,法理学不是方法论"],"a":"B","e":"\u0001法学既是社会科学,也具有人文科学的性质。\u0002\nA✗ 法学既是社会科学,也具有人文科学的性质\nB✓ 马克思主义法学认为,超阶级的法学是不存在的\nC✗ 古罗马共和国时期,法学已发展成为一门独立的学科\nD✗ 法理学在法学体系中占有特殊的地位,它是法学的一般理论、基础理论和方法论","k":"","kb":0,"kh":[[0,95],[96,136]]},{"id":"2015-46","y":2015,"t":"多","s":"下列选项中,属于法的基本特征的有（ ）。","o":["规范性","普遍性","国家意志性","国家强制性"],"a":"ABCD","e":"\u0001法的基本特征是指法区别千其他社会规范的特点。\u0002\nA✓ 符合题意及现行制度规定（\u0001规范性\u0002）\nB✓ 符合题意及现行制度规定（\u0001普遍性\u0002）\nC✓ 符合题意及现行制度规定（\u0001国家意志性\u0002）\nD✓ 符合题意及现行制度规定（\u0001国家强制性\u0002）\n法具有规范性、普遍性、国家意志性、权威性、国家强制性和程序性。","k":"","kb":2,"kh":[[0,147]]},{"id":"2015-47","y":2015,"t":"多","s":"下列思想家中,将法的本质归结为人的理性的有（ ）。","o":["英国的洛克","美国的庞德","荷兰的格劳秀斯","德国的萨维尼"],"a":"AC","e":"\u0001理性论认为法是人类理性的体现,自然 \"侧重于法高于实在法。\u0002\nA✓ 符合题意及现行制度规定（\u0001英国的洛克\u0002）\nB✗ 庞德属于社会法学派\nC✓ 17—18 世纪,古典自然法学派的理性 \" 报应主论主要代表人物有荷兰的格劳秀斯、斯宾诺莎,英国的霍布斯、洛克,德国的普芬道夫,法国的孟德斯鸠、卢梭等\nD✗ 萨维尼属于历史法学派,都不是理性主义","k":"","kb":1,"kh":[[19,66],[126,168]]},{"id":"2016-1","y":2016,"t":"单","s":"下列关于法学与法理学的表述,正确的是（ ）。","o":["凡有法律的地方,就一定会有法学","法理学对法律创制和法律适用没有直接价值","法理学的研究应当为法治建设提供理论支持与指导","法学的研究对象是有效的法律规范与现行的法律制度"],"a":"C","e":"\u0001法理学要概括出各个部门法及其运行的共同规律、共同特征、共同范畴,从而为部门法学提供指南,为法治建设提供理论服务。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 研究法理学,有助于提高社会主义法律意识、法律文化水平,增强社会主义法治观念,对于法律创制和法律适用具有重要价值,相关表述不\nC✓ 法理学要概括出各个部门法及其运行的共同规律、共同特征、共同范畴,从而为部门法学提供指南,为法治建设提供理论服务\nD✗ 法学以法律现象为研究对象,不仅研究现行有效的法律规范与法律制度,也研究古代的、已经废止的法律规范和法律制度,研究法律规范和法律制度的发展历程\n法学是以法或法律现象为研究对象的科学,但不是一有法就有了法学,法学是在法发展到一定阶段时才产生的。 法学的产生至少具备两个方面的条件:有关于法律现象的材料的一定积累; 有专门从事研究法律现象的学者阶层的出现。 \u0001“凡有法律的地方,就一定会有法学”\u0002不正确。 相关表述不正确。 法理学从总体上说是研究法和法律现象的一般规律,法理学的研究对象是一般法,是法和全部法律现象及其规律性。","k":"","kb":0,"kh":[[0,95],[96,136]]},{"id":"2017-1","y":2017,"t":"单","s":"下列关于不同法学流派的表述,正确的是（ ）。","o":["自然法学派强调人定法高于自然法","历史法学派主张法是自由意志的体现","社会法学派倡导法学应当关注法律现实的多种面向","分析法学派认为法学应当研究法与道德的内在关系 )。"],"a":"C","e":"\u0001主张法是自由意志的体现的是黑格尔,不是历史法学派,“历史法学派主张法是自由意志的体现”\" ,研究法律 \" 现实的法学错误。\u0002\nA✗ 自然法学派主张法是人的理性,强调自然法普遍永恒,且高于人定法\nB✗ 主张法是自由意志的体现的是黑格尔,不是历史法学派,相关表述\" ,研究法律 \" 现实的法学\nC✓ 社会法学派强调研究现实的各个方面\nD✗ 分析法学派主张恶法亦法,试图将价值考虑排除在法理学科学研究的范围之外","k":"","kb":1,"kh":[[19,66],[126,168]]},{"id":"2018-10","y":2018,"t":"单","s":"四位法学院学生旁听了法院审理的一刑事案件后,用不同的方法对该案涉及的刑法条文进行了解释,对此,下列说法正确的是（ ）。","o":["甲根据最高人民法院1985年发布的案例进行解释,属于历史解释","乙结合立法时的社会背景进行解释,属于体系解释","丙结合法律的上下文作出解释,属于目的解释","丁按照法律条文的字面含义进行解释,属于文义解释"],"a":"D","e":"\u0001相关表述,历史解释是对法律文件制作的历史背景材料研究或者比较历史上同类法律规范, 不符合选项中情况。\u0002\nA✗ 历史解释是对法律文件制作的历史背景材料研究或者比较历史上同类法律规范, 不符合选项中情况\nB✗ 体系解释是分析某一法律规范在法律体系和法律部门中的地位和作用,不符合选项中情况\nC✗ 目的解释是从制定某一法律的目的来解释法律,不符合选项中情况\nD✓ 符合题意及现行制度规定（\u0001丁按照法律条文的字面含义进行解释,属\u0002）\n相关表述\"法正确,","k":"","kb":16,"kh":[[182,257]]},{"id":"2020-1","y":2020,"t":"单","s":"关于各法学流派及其观点,下列说法正确的是 （ ）。","o":["自然法学派主张在法学研究中不必考虑价值因素","社会法学派反对任何超越现行法律文本的解释","分析法学派强调法体现人的理性,自然法高于人定法","历史法学派认为法律就像一个民族的风俗、语言一样,是民族精神的体现"],"a":"D","e":"\u0001历史法学派主张法律是民族精神的体现。\u0002\nA✗ 自然法学派考虑价值因素,分析法学派主张在法学研究中不必考虑价值因素,AC选项混淆了自然法学派和分析法学派的观点,该项\nB✗ 反对任何超越现行法律文本的解释应为分析法学派的观点\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ 历史法学派主张法律是民族精神的体现\n自然法学派主张法是人的理性,强调自然法普遍永恒,且高于人定法,人定法符合自然法时才是真正的法律。","k":"","kb":1,"kh":[[19,66],[169,198]]},{"id":"2021-12","y":2021,"t":"单","s":"下列关于各法学流派代表人物的表述,正确的是（ ）。","o":["霍姆斯是现代自然法学派的代表人物","凯尔森是批判法学的代表人物","艾尔利希是社会法学派的代表人物","庞德是分析法学派的代表人物"],"a":"C","e":"\u0001霍姆斯、庞德、艾尔利希均是社会法学派的代表人物,凯尔森是分析法学派的代表人物。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✓ 霍姆斯、庞德、艾尔利希均是社会法学派的代表人物,凯尔森是分析法学派的代表人物\nD✗ 与题干设问或现行制度要件不符，故不选","k":"","kb":1,"kh":[[19,66],[126,168]]},{"id":"2021-41","y":2021,"t":"多","s":"与其他法学相比,马克思主义法学具有的鲜明特征包括（ ）。","o":["主张法律是民族精神的体现","认为法律不受经济之外其他因素影响","坚持历史唯物主义的立场","认为法律具有阶级性"],"a":"CD","e":"\u0001与以往的法学相比,马克思主义法学具有鲜明的特征。\u0002\nA✗ 萨维尼主张法律是民族精神的体现,不是马克思主义法学\nB✗ 马克思主义法学认为法律受经济以外其他因素的影响\nC✓ 第一,马克思主义法学坚持历史唯物主义的立场\nD✓ 第二,马克思主义法学认为法律具有阶级性和意识形态性\n马克思认为,不是国家和法决定市民社会,而是市民社会决定国家和法。 马克思主义法学主张,法律实现、反映或者体现了占统治地位的经济关系,法律归根结底是由社会的物质生活条件决定的。 马克思主义法学主张,在阶级社会中,法律的内容和程序直接或者间接地体现了统治阶级的利益, 法律不仅体现了统治阶级的内在价值观,还为其提供了合法性。 第三,马克思主义法学致力于实现人的解放。","k":"","kb":1,"kh":[[0,18],[199,251]]},{"id":"2022-11","y":2022,"t":"单","s":"全国人大常委会对刑法有关规范作出解释:“刑法有关文物的规定,适用于具有科学价值的古脊椎动物化石、古人类化石。“全国人大代表、法学教授甲认为这一解释不够全面,系统地提出了自己的解释。对此,下列选项正确的是（ ）。","o":["全国人大常委会和甲的解释均属于限制解释","全国人大常委会和甲的解释均属于立法解释","全国人大常委会的解释是有权解释,甲的解释是学理解释","全国人大常委会对于刑法的解释,其效力低于刑法的效力"],"a":"C","e":"\u0001限制解释是指在法律条文的字面含义显然比立法原意广时,为贯彻立法意图,反映社会发展的实际需要,作出比字面含义窄的解释。\u0002\nA✗ 全国人大常委会和甲的解释将具有科学价值的古脊椎动物化石、古人类化石纳入文物的范围内,均属于扩充解释\nB✗ 全国人大常委会的解释是有权解释,甲的解释是学理解释\nC✓ 全国人大常委会的解释是有权解释,甲的解释是学理解释\nD✗ 全国人大常委会的法律解释同法律具有同等效力\n根据解释尺度的不同,法律解释可以分为限制解释、扩充解释与字面解释三种。 扩充解释是指在法律条文的字面含义显然比立法原意窄时,作出比字面含义广的解释。 字面解释是指严格按照法律条文字面的通常含义解释法律,既不缩小,也不扩大。 立法解释是指全国人民代表大会常务委员会对法律的解释,属于正式解释、法定解释、有权解释。 非正式解释,通常也叫学理解释,一般是指由学者或其他个人及组织对法律规定所作的不具有法律约束力的解释。","k":"","kb":16,"kh":[[71,117],[117,162]]},{"id":"2023-6","y":2023,"t":"单","s":"下列选项中,属于分析法学派观点的是（ ）。","o":["恶法非法","法要体现民族精神","应研究现实生活中的法","法与道德无必然联系"],"a":"D","e":"\u0001分析实证主义法学派坚持实证主义立场，主张法与道德之间不存在必然的概念联系。\u0002\nA✗ “恶法非法”是\u0001自然法学派\u0002的核心命题，分析法学派则主张“恶法亦法”\nB✗ “法要体现民族精神”是德国\u0001历史法学派\u0002（萨维尼）的代表观点\nC✗ “应研究现实生活中的法（行动中的法）”是\u0001社会法学派\u0002（庞德、艾尔利希）的主张\nD✓ 分析法学派严格区分“实然之法”与“应然之法”，认为\u0001法与道德无必然联系\u0002\n记住西方法学四大流派命题对应：\u0001自然法重道德正义\u0002、\u0001分析法重国家规则与分离命题\u0002、\u0001历史法重民族精神\u0002、\u0001社会法重现实实效\u0002。","k":"","kb":1,"kh":[[19,66],[67,125]]},{"id":"2024-7","y":2024,"t":"单","s":"下列关于法的基本特征的表述,正确的是（ ）。","o":["法的权利和义务一致性,意味着权利和义务可以相互转化","法的强制性是法的规范性的前提和基础","法的普遍性表明法可以调整所有社会关系","法由国家制定或认可体现了法的国家意志性"],"a":"D","e":"\u0001法是由国家制定或认可的社会规范，这集中体现了法的国家意志性特征。\u0002\nA✗ 权利义务一致性指二者相互依存、互为前提，但权利和义务\u0001性质有别且存在主客体对应差异，并非均可随意相互转化\u0002\nB✗ 法的\u0001规范性\u0002是法的普遍性、强制性等特征的前提和基础，而非强制性是规范性的前提\nC✗ 法只调整与统治秩序和公共利益有关的重要社会关系，\u0001并非调整所有社会关系\u0002（如纯粹恋爱友情一般不入法）\nD✓ 国家制定和认可是法创制的两种方式，赋予规范以国家名义与普遍约束力，体现\u0001法的国家意志性\u0002\n谨防常见混淆：法\u0001不调整所有社会关系\u0002；\u0001规范性\u0002是逻辑前提，\u0001国家意志性\u0002源自国家制定认可。","k":"","kb":2,"kh":[[0,147]]},{"id":"2026-1","y":2026,"t":"单","s":"关于中西方法学的发展历程,下列表述中正确的是（ ）。","o":["我国先秦时期已出现关于法律问题的学派之争","我国西汉时期法学已发展为一门独立的学科","西方的注释法学派最早出现于古希腊时代","罗马法复兴运动标志着民法法系的形成"],"a":"A","e":"\u0001先秦诸子百家(儒、法、道、墨)均有大量法律思想争辩,形成学派之争。\u0002\nA✓ 先秦诸子百家(儒、法、道、墨)均有大量法律思想争辩,形成学派之争\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 注释法学派中世纪意大利\nD✗ 罗马复兴只是民法法系萌芽,体系成型在近代\n西汉经学兴盛,法学未独立;","k":"","kb":0,"kh":[[0,95]]}]},{"sub":"法理学","name":"法与社会关系","w":0.3,"w5":0.2,"wh":1.5,"bt":"","pt":"近5年客观降至0.2分/年·多融于法治中国","L":24,"qs":[{"id":"2005-49","y":2005,"t":"多","s":"关于法律与其他社会现象关系的表述,能够成立的是（ ）。","o":["在法律与经济基础的关系中,法律并不是消极的,而是积极地服务于经济基础,并始终推动社会的发展","在法律与政治的相互关系中,一般而言,政治对法律的影响和制约作用居于主导地位","国家是法律存在和发展的政治基础,法律促进国家职能的实现,保障和规范国家权力的正常行使","生产力是联系法律与生产关系的中介,法律通过调整生产力而影响生产关系的发展"],"a":"BC","e":"\u0001推动社会发展的力量是生产力,并不是法律。\u0002\nA✗ \"(法律)始终推动社会的发展\"的说法不成立\nB✓ 符合题意及现行制度规定（\u0001在法律与政治的相互关系中,一般而言,\u0002）\nC✓ 符合题意及现行制度规定（\u0001国家是法律存在和发展的政治基础,法律\u0002）\nD✗ 的说法不成立\n法律可以加速经济基础的发展,但也可能延缓其发展。 在生产力、生产关系和法律的联系中,法律通过生产关系而与生产力发生联系,生产力通过生产关系而制约法律。 因此,生产关系是联系法律与生产力的中介, 相关表述 的说法不成立。","k":"","kb":20,"kh":[[21,74]]},{"id":"2006-3","y":2006,"t":"单","s":"现代社会不仅需要法律这种社会规范,而且还需要道德、习俗等其他社会规范。这表明（ ）。","o":["法律的起源与道德有关","有些法律规范是同社会习俗演化而来的","法律规范和其他社会规范的表现形式不同","法律不是唯一的调整人们行为的社会规范。"],"a":"D","e":"\u0001要用矛盾分析法分析:法律作用在社会中发挥着巨大的作用,但我们也不能忽视法律作用的有限性,法律只是众多社会调整手段中的一种,在此之外还有政策、纪律、规章、习俗和道德等调整。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ 说法律不是唯一的调整手段是正确的","k":"","kb":20,"kh":[[0,20],[113,153]]},{"id":"2006-9","y":2006,"t":"单","s":"就国家与法的关系而言,能影响以至于决定法的形式的最主要因素是（ ）。","o":["国家所赖以存在的经注基础","掌握国家政权的统治阶级的政策","国家的中心任务","国家的政权组织形式和结构形式"],"a":"D","e":"\u0001国家是法律存在的基础。\u0002\nA✗ 国家是法律存在的基础\nB✗ 其次,法的实现以国家政权的运行为必要方式\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ 最后,国家政权组织形式和结构形式,影响着法的形式\n首先,法律由国家制定或认可,没有国家就没有法律;","k":"","kb":20,"kh":[[21,74]]},{"id":"2006-15","y":2006,"t":"单","s":"当代中国社会受到多种法律文化的影响,其中影响最大的是（ ）。","o":["中国传统的法律文化","西方资本主义的法律文化","前苏联的法律文化","中国社会主义建设过程中形成的法律文化"],"a":"D","e":"\u0001党的十一届三中全会以后,为适应社会主义现代化建设的需要,在邓小平理论的指导下,总结我国改革开放的丰富实践经验,借鉴外国立法,建立了有中国特色的社会主义法律体系。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ 可以说中国法律受中国社会主义建设过程中形成的法律文化影响最大","k":"","kb":20,"kh":[[154,200]]},{"id":"2006-50","y":2006,"t":"多","s":"下列关于法律与道德关系的表述,正确的有（ ）。","o":["法律与道德并无必然的内在联系","道德是法律运作的社会基础","法律必须合乎所有社会成员的道德要求","法律是保障道德实施的有效手段"],"a":"BD","e":"\u0001法律和道德中有联系也有区别,道德靠人的内心和舆论约束,法律靠国家强制力保证实施。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✓ 符合题意及现行制度规定（\u0001道德是法律运作的社会基础\u0002）\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ 符合题意及现行制度规定（\u0001法律是保障道德实施的有效手段\u0002）","k":"","kb":20,"kh":[[21,74]]},{"id":"2007-11","y":2007,"t":"单","s":"下列关于法律意识的表述,能够成立的是 （ ）。","o":["占统治地位的法律意识必须通过法律制度和法律调整才能发挥作用","法律意识是法律文化的重要组成部分,是一种特殊的社会意识","根据专门化和职业化的不同,可以将法律意识分为职业法律意识和法律思想","法律意识是社会主体对法律现象作出的客观价值判断"],"a":"B","e":"\u0001一个国家占统治地位的法律意识渗透到法律制度、法律调整的过程中,而且在一定的条件下,特别是在一个国家法律制度不完备、缺乏法律的明确规定时,统治阶级的法律意识往往直接起到法的作用。\u0002\nA✗ 一个国家占统治地位的法律意识渗透到法律制度、法律调整的过程中,而且在一定的条件下,特别是在一个国家法律制度不完备、缺乏法律的明确规定时,统治阶级的法律意识往往直接起到法的作用\nB✓ 法律意识法律意识是社会意识的一种特殊形式,是法律文化的组成部分\nC✗ 依据专门化和职业化, 可以把法律意识分为职业法律意识和群众法律意识,而非法律思想\nD✗ 法律意识是人们关于法律现象的思想、观点、知识和心理的总称,是一种主观活动,不可能是客观价值判断,故 Df 项","k":"","kb":20,"kh":[[154,200]]},{"id":"2008-49","y":2008,"t":"多","s":"关于我国社会主义法与执政党政策的关系,下列表述中正确的有（ ）。","o":["法决定政策的效力","政策指导法律的制定","法促进政策的实施","政策指导法律的实施"],"a":"BD","e":"\u0001党的政策与社会主义法在本质上是一致的,而且党的政策是社会主义法的核心内容,故政策对法律具有指导作用,包括指导法律的制定和实施。\u0002\nA✗ 政策的效力来源于政策的制定机关及其内部保障机制,而非法律\nB✓ 党的政策与社会主义法在本质上是一致的,而且党的政策是社会主义法的核心内容,故政策对法律具有指导作用,包括指导法律的制定和实施\nC✗ 与题干设问或现行制度要件不符，故不选\nD✓ 符合题意及现行制度规定（\u0001政策指导法律的实施\u0002）\n党的政策被制定为法律,上升为国家意志,获得更有力的实施保障。 政策的法律化,使政策借助法律调整所特有的方式和机制,而得到更好的贯彻。","k":"","kb":20,"kh":[[21,74]]},{"id":"2009-5","y":2009,"t":"单","s":"我国社会主义法律与执政党政策的共同点在于（ ）。","o":["表现形式相同","指导思想相同","稳定性程度相同","实施途径相同"],"a":"B","e":"\u0001政策和法律同属于上层建筑,在阶级本质、经济基础、指导思想、基本原则和社会目标等根本方面具有共同性。\u0002\nA✗ 二者在意识属性、表现形式、实施的途径和保障方式、稳定性和程序化程度上存在不同\nB✓ 政策和法律同属于上层建筑,在阶级本质、经济基础、指导思想、基本原则和社会目标等根本方面具有共同性\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 与题干设问或现行制度要件不符，故不选","k":"","kb":20,"kh":[[21,74]]},{"id":"2009-11","y":2009,"t":"单","s":"依照人的认识阶段不同,可以将法律意识分为（ ）。","o":["占统治地位的法律意识与不占统治地位的法律意识","群体法律意识与社会法律意识","法律心理与法律思想体系","职业法律意识与非职业法律意识"],"a":"C","e":"\u0001法律意识是社会意识的一种特殊形式,是人们关于法律现象的思想、观点、知识和心理的总称。\u0002\nA✗ 依据法律意识的社会政治属性,可以将法律意识分为占有统治地位的法律意识和不占有统治地位的法律意识\nB✗ 从意识的主体角度,法律意识可分为个人法律意识、群体法律意识和社会意识\nC✓ 依据人的认识阶段的不同,可以将法律意识分为法律心理与法律思想体系\nD✗ 从法律意识分为职业法律意识和群众法律意识","k":"","kb":20,"kh":[[154,200]]},{"id":"2009-12","y":2009,"t":"单","s":"法律与道德相比较而言,下列表述能够成立的是（ ）。","o":["法律的要求跟高","法律范围产生的更早","法律调整的社会关系范围更广","法律规范的内容更加具体和明确"],"a":"D","e":"\u0001道德是关于人们思想和行动的善恶、美丑、正义与非正义、公平与偏私、诚实与虚伪、荣誉与耻辱等观念、规范、原则和标准的总和。\u0002\nA✗ 道德的要求比法律的要求要高,法律是最低限度的道德\nB✗ 与题干设问或现行制度要件不符，故不选\nC✗ 道德和法律调整人们行为规范的范围不同,道德调整的人们行为规范的范围比法律更广泛,所以违反道德的行为不一定是违法行为\nD✓ 法律规范具体有明确性、具体性、统一性,而道德规范的要求往往是模糊的、不确定的\n从起源上看,法的出现晚于道德。","k":"","kb":20,"kh":[[21,74]]},{"id":"2009-15","y":2009,"t":"单","s":"下列关于法律文化的表述,正确的是（ ）。","o":["社会成员对法及法律现象的共同看法不属于法律文化的范畴","法律文化在一定程度上反映了一个民族法律调整所达到的水平","法律文化包括现行法律实践中一切因偶然因素而变化的部分","法律文化的多样性,阻碍了不同法律文化之间的交流与传播"],"a":"B","e":"\u0001法律文化是指在一定社会物质生活条件的作用下,掌握国家政权的统治阶级所创制的法律规范,法治制度,人们关于法律现象的态度、价值、信念、心理、感情、习惯以及学说理论的符合有机体。\u0002\nA✗ 法律文化是指在一定社会物质生活条件的作用下,掌握国家政权的统治阶级所创制的法律规范,法治制度,人们关于法律现象的态度、价值、信念、心理、感情、习惯以及学说理论的符合有机体\nB✓ 法律文化是一个民族长期积累起来的法律调整或通过法律对社会进行控制、管理的知识、智慧和经验的结晶,反映了一个民族法律所达到的水平\nC✗ 法律文化不包括现行法、法律实践、法律意识中偶然因素、个别事件而变化的成分以及一切不稳定的、没有持久影响的成分\nD✗ 法律文化的多样性使法律文化交流成为可能和必要","k":"","kb":20,"kh":[[154,200]]},{"id":"2009-49","y":2009,"t":"多","s":"下列关于法律与国家的关系的表述,能够成立的有（ ）。","o":["法律是国家存在和发展的政治基础","法律决定国家的性质","法律保障国家职能的实现","法律确认国家的政权组织形式"],"a":"CD","e":"\u0001法律与国家的关系,一方面,法律离不开国家,国家是法律存在和发展的政治基础。\u0002\nA✗ 法律与国家的关系,一方面,法律离不开国家,国家是法律存在和发展的政治基础\nB✗ 与题干设问或现行制度要件不符，故不选\nC✓ 另一方面,国家离不开法律,法律是实现国家职能、保障国家机器正常运转的重要工具\nD✓ 法律确认和宣告国家权力的合法性,组织和完善国家权力机构体系","k":"","kb":20,"kh":[[21,74]]},{"id":"2010-50","y":2010,"t":"多","s":"下列选项中,属于法律意识的有（ ）。","o":["消费者的维权意识","人们对法律尊重或反感的情绪","人们关于法律公正的观念","当事人对法院不信任的态度"],"a":"ABCD","e":"\u0001法律意识包括对法律本质、作用的看法,对现行法律的态度和评价,以及对人们行为的法律评价等。\u0002\nA✓ 消费者的维权意识是对法的作用的看法\nB✓ 项人们对于法律尊重或者反感的情绪是人们对于现行法律的态度和评价\nC✓ 人们关于法律公正的观念是人们对于法律的观念和思想\nD✓ 当事人对法院不信任的态度是人们对于本国法律在现实运行中的观念和态度\n法律意识是人们对于法律,特别是对本国现行法律以及法律现象的思想、观点、知识和心理的总称。 \u0001“人们对法律尊重或反感的情绪”\u0002人们对于法律尊重或者反感的情绪是人们对于现行法律的态度和评价; “人们关于法律公正的观念”人们关于法律公正的观念是人们对于法律的观念和思想; “当事人对法院不信任的态度”当事人对法院不信任的态度是人们对于本国法律在现实运行中的观念和态度。 四个选项都是对法律现象的观点、思想和心理,故本题应该全选。","k":"","kb":20,"kh":[[154,200]]},{"id":"2010-51","y":2010,"t":"多","s":"下列关于道德与法律的关系的表述,能够成立的有（ ）。","o":["道德与法律的内容互相渗透","道德因素影响执法与司法","道德水平高低影响法的遵守","法律是道德的价值基础"],"a":"ABC","e":"\u0001道德因素影响着执法和司法,执法人员具有高度的职业道德,有助于正确合 \" 范围内直接按 \"自由裁量权法地执行法律,特别是在照合理性原则处理问题时,这一点尤为凸显,故而。\u0002\nA✓ 法律与道德的内容相互渗透,相互影响,联系密切,故而\nB✓ 道德因素影响着执法和司法,执法人员具有高度的职业道德,有助于正确合 \" 范围内直接按 \"自由裁量权法地执行法律,特别是在照合理性原则处理问题时,这一点尤为凸显,故而\nC✓ 道德水平的高低影响着法的遵守,人们的道德水平越高,守法的程度就越高,选择法律所认可的合法行为的程度也越高\nD✗ 道德是法律的价值基础,是判断、评价法律的价值尺度,是衡量良法和恶法的标准,没有道德观念体系作为基础,法律就缺乏内在支柱,它的合法性就会失去,相关表述刚好表述反了,所以不应选\n道德是法律的价值基础,是判断、评价法律的价值尺度,是衡量良法和恶法的标准,没有道德观念体系作为基础,法律就缺乏内在支柱,它的合法性就会失去,\u0001“法律是道德的价值基础”\u0002刚好表述反了,所以不应选。","k":"","kb":15,"kh":[[0,15],[16,104]]},{"id":"2011-10","y":2011,"t":"单","s":"下列关于法与经济的一般关系的表述,能够成立的是（ ）。","o":["有完善的法律制度,就有发达的市场经济","商品经济越发展,社会对法的要求就越高","法律的数量越多,经济发展水平就会越高","经济发展水平是衡量法治状况的重要标志"],"a":"B","e":"\u0001在教材法与经济一节中,主要有三个问题:法与经济基础、法与市场经济、法与科技。\u0002\nA✗ 在教材法与经济一节中,主要有三个问题:法与经济基础、法与市场经济、法与科技\nB✓ 商品经济越发展,社会对法的要求就越多,法就越兴旺,法的权威性就越高,法的部门就越多,法的体系就越发达,法的商品经济和市场经济的作用就越大\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 经济发展水平并不是衡量法治状况的重要标志,世界有些国家虽然经济很发达,但是法治状况却并不理想\n其中在 \"中,提到法的产生和发展与商品 \"法与市场经济讲到经济的发展是密不可分的。 法和法制的发展,的确能给予商品经济以更有效的影响,但是并不能决定经济的发展,法律作为上层建筑只能反作用于经济基础,经济的发展还有其他许多别的因素的影响。 衡量一个国家法治状况的标志包括:完备而良善的法律体系,健全高效的法律运行体制,高素质的法律执业队伍,较高的全民法律意识,良好的法律秩序。","k":"","kb":20,"kh":[[0,20],[21,74]]},{"id":"2011-15","y":2011,"t":"单","s":"下列关于法与国家的一般关系的表述,能够成立的是（ ）。","o":["国家政体受法的渊源的影响","法律是国家存在的政治基础","国家意志只能通过法律形式来表现","法的实现以国家政权的运行为必要条件"],"a":"D","e":"\u0001国家政体影响着法的形式,法的形式受到国家政体的影响,A颠倒了关系,故错误。\u0002\nA✗ 国家政体影响着法的形式,法的形式受到国家政体的影响,A颠倒了关系,故\nB✗ 法和国家的一般关系可以归纳为: (1)国家是法律存在的政治基础,国家权力是法的支撑和保障,国家是法产生和发展直接的推动力之一, 国家权力是创制法的直接力量,国家权力以其强制力参与和保障法的实…\nC✗ 国家的意志除了通过法律表现出来,还可以通过政策表现出来\nD✓ 法的实现以国家政权的运行为必要条件\n(2)法律对国家权力起到支持和制约的作用,即法确认国家权力的合法性,组织和完善国家权力机构体系,通过法律制约和监督国家权力的运行,法有助于提高国家权力运行的效率,法还可通过传播一定的价值观来发挥思想教育作用为提高国家权力的运行效率、完成其功能提供良好的杜会氛围。 国家是法律存在的政治基础,","k":"","kb":20,"kh":[[21,74]]},{"id":"2011-49","y":2011,"t":"多","s":"下列关于法律意识的表述,能够成立的有（ ）。","o":["法律意识无法通过教育形成","法律意识是法律文化的组成部分","法律意识制约着法律实践活动","法律意识的高级形态是法律心理"],"a":"BC","e":"\u0001法律意识是社会意识的一种特殊形式, 泛指人们对法律,特别是对本国现行法律的思想、观念、心理或态度的总称。\u0002\nA✗ 法律意识是可以通过教育形成的\nB✓ 法律意识是法律文化的重要组成部分,而且在法律文化观念中,法律意识居千主导地位\nC✓ 法律意识是社会主体在法律实践活动中形成的主观体验和认识在意识中的反映, 是对法律现象本身价值的主观价值判断,同时法律意识反过来会制约法律实践活动的进行\nD✗ 从认识阶段来看,法律意识可以分为低级阶段的法律心理和高级阶段的法律思想体系\n关于法律意识考生还应掌握,之所以法律意识是一种特殊的社会意识,首先在于法律意识涉及的对象是法律现象。 其次,法律意识与其他社会意识相比,具有较强的强制性,对人们的行为具有明确的指令性。 最后,法律意识具有相对独立性。","k":"","kb":20,"kh":[[154,200]]},{"id":"2012-51","y":2012,"t":"多","s":"下列选项中,属于法律意识范畴的有（ ）。","o":["大学生贾某认为偷几本书不构成犯罪","农民工史某年底仍未拿到劳动报酬,自认倒霉","公务员王某认为法律是治理官员贪污腐败最行之有效的途径","消费者薛某以产品质量为由,向法院起诉要求销售方进行损害赔偿"],"a":"ABC","e":"\u0001法律意识是社会意识的一种特殊形式, 泛指人们对法律,特别是对本国现行的法律思想、观点或态度的总称,包括对法律本质、作用的看法,对现行法律的态度和评价,以及对人们行为的法律评价等。\u0002\nA✓ 它的特征包括:(1) 法律意识的对象是法律现象\nB✓ (2)法律意识具有较强的强制性,对人们的行为具有明确的指示性\nC✓ (3)在法律文化观念中,法律意识居于核心地位\nD✗ 与题干设问或现行制度要件不符，故不选\n(4) 法律意识具有主观性,是社会主体在法律实践活动中形成的主观体验和认识在意识中的反映,是对法律现象本身价值作出的主观价值判断。 \u0001“大学生贾某认为偷几本书不构成犯罪”\u0002BC都属于法律意识的范畴,该项 属于对人们行为的法律评价,B是人们对法的作用的看法、对现行法律的态度,C是对法律的本质、作用的理解。 相关表述属于法律实践活动,是法律行为,不属于法律意识的范畴。","k":"","kb":20,"kh":[[154,200]]},{"id":"2016-51","y":2016,"t":"多","s":"下列关于法与政治关系的表述,正确的有（ ）。","o":["政治的变迁可以影响法的发展变化","法能够为政治行为提供合法律性依据","政治可为法的实现提供必要的环境和条件","法治社会需要法律与政治、权力保持适当的距离"],"a":"ABCD","e":"\u0001法律与政治都属于上层建筑,都受制约和反作用于经济基础,两者又相互作用。\u0002\nA✓ 政治活动和政治关系的发展变化必然会在一定程度或意义上影响法律的内容或者对价值追求的发展变化\nB✓ 法律作为上层建筑中相对独立的部分,对政治具有确认、调整和影响作用\nC✓ 政治在上层建筑中居主导地位,政治可为法的实现提供必要的环境和条件\nD✓ 法律具有相对独立性,法治社会中法律应与政治、权利保持适当的距离","k":"","kb":20,"kh":[[21,74],[75,95]]},{"id":"2017-50","y":2017,"t":"多","s":"对于法与经济的关系,下列认识正确的有（ ）。","o":["在封建社会,法律对经济没有什么影响","古罗马商品经济的繁荣促进了古罗马法的发展和完善","法律可以为经济发展提供保障,但有时也会阻碍经济发展","当代中国法律对经济的影响主要体现在对市场经济的引导、促进和保障等方面"],"a":"BCD","e":"\u0001法律在社会主义市场经济宏观调控方面发挥着重要作用,主要表现在对市场经济运行的引导、促进、保障和必要的制约方面。\u0002\nA✗ 封建社会已经出现商品交换,因此在封建社会,法律也对经济产生影响\nB✓ 西方古罗马时期,由于简单商品经济非常繁荣发达,推动了罗马法的发展和完善\nC✓ 经济基础决定法,法反作用于经济基础,法律对经济基础具有保障和促进作用,但对生产关系的某些方面有否定、阻碍或限制作用\nD✓ 法律在社会主义市场经济宏观调控方面发挥着重要作用,主要表现在对市场经济运行的引导、促进、保障和必要的制约方面\n法是商品交换的必然产物,也是商品交换乃至整个商品经济不可或缺的调整机制。","k":"","kb":20,"kh":[[0,20],[21,74]]},{"id":"2018-1","y":2018,"t":"单","s":"随着科技的发展,手机移动支付逐渐普及,但由于相关法律尚不健全,导致实践中行业管理乱象和支付纠纷频现。对此,下列说法正确的是（ ）。","o":["法律完全可以提前对未来的新科技做出周密的规定","在法无明文规定的情况下,应当禁止新技术的运用和推广","新事物的出现,扩展了法律的调整范围,也对立法提出了挑战","在相关法律尚不健全的情况下,执法机关也可以依据政策对相关行为作出处罚"],"a":"C","e":"\u0001科技与法的关系知识点,相关表述从字面意思看就存在问题,因为法律不是万能的:该项 显然错误,即使法律没有规定也不应禁止新技术推广。\u0002\nA✗ 与题干设问或现行制度要件不符，故不选\nB✗ 本题考查科技与法的关系知识点,相关表述从字面意思看就存在问题,因为法律不是万能的:该项 显然错误,即使法律没有规定也不应禁止新技术推广\nC✓ 符合题意及现行制度规定（\u0001新事物的出现,扩展了法律的调整范围,\u0002）\nD✗ 与题干设问或现行制度要件不符，故不选\n存在问题,因为法律不是万能的:该项 显然错误,即使法律没有规定也不应禁止新技术推广; 法无明文规定不可罚。 为此,本题答案选择C。","k":"","kb":20,"kh":[[113,153]]},{"id":"2020-12","y":2020,"t":"单","s":"关于法律与科学技术的关系,下列说法正确的是（ ）。","o":["法律决定科学技术的发展","科学技术不仅影响法律的内容,也影响法律调整的领域","科学技术的发展不会引起传统法律概念和原则的变化","防范科学技术可能带来的危害,要靠科技手段而非法律机制"],"a":"B","e":"\u0001科学技术进步所形成的新的科学知识,不断被运用到法律领域,成为法律规定的重要的科学依据。\u0002\nA✗ 法律对科学技术的发展并不起决定作用,相关表述说法过于绝对\nB✓ 其次, 科学技术的发展扩展了法律调整的领域\nC✗ 再次,科学技术的发展引起了有关的传统法律概念和原则的变化\nD✗ 科学技术本身具有两面性,法律也要防范其负面作用,如通过确立一些重要的科技伦理原则来规范科技行为等\n法对科技具有重要作用:首先,法保证科学技术的顺利发展有良好的社会环境。 其次,法为组织科学技术活动提供必要的准则。 最后,法是鼓励科学技术发展的有效手段。 但是法律对科学技术的发展并不起决定作用,\u0001“法律决定科学技术的发展”\u0002说法过于绝对,错误。 科技对法的影响有:首先,科学技术影响法的内容。 在科学技术的研究发明和推广应用的实践活动中出现的大量新的社会关系需要法律规范的调整。 最后,科学技术的发展完善了法律调整机制,为立法和执法提供了新的技术和手段,对法的制定和实施产生重大影响,如互联网法院的设立,人工智能在法的制定与实施中的运用等。","k":"","kb":20,"kh":[[21,74]]},{"id":"2021-4","y":2021,"t":"单","s":"下列关于法律与道德的表述,正确的是 （ ）。","o":["法律只强调程序正当性,道德则注重实体正当性","法律是最高限度的道德,因而守法是高尚的行为","法律与道德的调整对象存在一定程度的重合","法律至上的法治原则排斥道德在审判中的运用"],"a":"C","e":"\u0001法治原则并不排斥道德在审判中的运用。\u0002\nA✗ 法律既强调程序正当性,也注重实体正当性\nB✗ 法律是最低限度的道德\nC✓ 法律与道德的调整对象存在一定程度的重合\nD✗ 法治原则并不排斥道德在审判中的运用","k":"","kb":20,"kh":[[113,153]]},{"id":"2022-12","y":2022,"t":"单","s":"下列关于社会主义法与社会主义道德的表述,正确的是（ ）。","o":["社会主义法体现了社会主义道德的基本精神和要求","社会主义法是社会主义道德的评价标准和推动力量","社会主义道德是传播社会主义法的主要形式","社会主义道德是人民法院审理案件的直接依据"],"a":"A","e":"\u0001社会主义道德是社会主义法制定的价值指导,对法的实施具有促进作用。\u0002\nA✓ 社会主义法的规范深刻体现了社会主义道德的基本精神和要求,所以通过法律教育和法律实施活动, 可以促进社会主义道德,提高人们的道德素质\nB✗ 社会主义道德是社会主义法的评价标准和推动力量,社会主义法是传播社会主义道德、保障道德要求实现的有效手段\nC✗ 与题干设问或现行制度要件不符，故不选\nD✗ 社会主义道德是人民法院审理案件的重要导向和参考,但并非直接依据\n作为上层建筑重要组成部分的社会主义法与社会主义道德之间具有极为密切的联系,二者相互渗透,相互作用,相互促进。","k":"","kb":20,"kh":[[21,74]]}]}]

["【法学体系与法理学】法学分科包括理论法学（法理学、法哲学、法律史学、比较法总论等）与实用/应用法学（宪法学、民法学、刑法学、诉讼法学等），法学与政治学、社会学、经济学交叉形成边缘/交叉学科。\n法理学是法学的一般理论、基础理论与方法论，既具有社会科学属性又具有人文科学属性。","【西方法学主要流派与马克思主义法学】\n1. 古典自然法学派（格劳秀斯、洛克等）：主张自然法高于人定法，强调理性、正义与“恶法非法”。\n2. 分析实证主义法学派（奥斯丁、凯尔森、哈特）：主张“恶法亦法”，法是主权者的命令或规则体系，法与道德无必然联系。\n3. 社会法学派（庞德、艾尔利希）：关注“行动中的法”，强调社会利益平衡与法律实效。\n4. 历史法学派（萨维尼）：认为法是民族精神、习惯的体现。\n5. 马克思主义法学：坚持历史唯物主义，揭示法的阶级意志性与社会物质制约性（经济基础最终决定上层建筑）。","【法的本质与基本特征】法是由国家制定或认可（国家意志性），并由国家强制力保证实施的（强制性并非唯一实施手段，守法主要靠自觉），以权利和义务为主要内容（权利义务一致性，但并非完全对等或任意转化），具有普遍性（在本国主权范围内普遍适用，但不调整所有社会关系）、规范性、程序性与可诉性的行为规范体系。\n技术规范调整人与自然的关系，经国家确认上升为法律即成为技术法规，具有法律效力。","【当代中国法的渊源】\n1. 正式渊源（具有明文规定和直接法律效力）：宪法、法律、行政法规、地方性法规、自治条例和单行条例、特别行政区法律、行政规章（部门规章与地方政府规章）、国际条约和国际协定、军事法规等。我国不承认判例为正式法源，最高人民法院指导性案例及裁判文书仅具指导与说理功能。\n2. 非正式渊源：习惯（不违背公序良俗）、判例（判决参考）、政策、法理、学说、道德规范及未上升为条约的国际惯例等。","【法的效力范围】\n1. 对人效力原则：属地主义（本国境内所有人）、属人主义（本国公民不论境内外）、保护主义（外国人在国外侵害本国或公民利益）、折中主义（我国采用以属地主义为主，与属人主义、保护主义相结合）。本国驻外使领馆、航行或停泊于公海/境外的本国船舶和航空器适用属地主义（拟制领土）。\n2. 时间效力：生效时间（公布之日/特定日期/附条件）、终止（明示废止与默示废止）、溯及力（现代法治以“法不溯及既往”为原则，我国《刑法》及2021年修订《行政处罚法》均确立“从旧兼从轻”）。","【法律效力等级与冲突适用原则（《立法法》）】\n1. 宪法具有最高法律效力；法律高于行政法规、地方性法规、规章；行政法规高于地方性法规、规章；地方性法规高于本级和下级地方政府规章；部门规章与地方政府规章之间具有同等效力。\n2. 同一机关制定的法律规范冲突：特别规定优于一般规定，新的规定优于旧的规定；新的一般规定与旧的特别规定不一致时，由制定机关裁决。地方性法规与部门规章冲突时，由国务院提出意见（认为应适用地方性法规的直接决定，认为应适用部门规章的提请全国人大常委会裁决）。","【法的一般分类】\n1. 创制与表达形式：成文法与不成文法。\n2. 规定内容：实体法与程序法。\n3. 地位效力与制定程序：根本法（宪法）与普通法。\n4. 适用范围：一般法与特别法。\n5. 创制与适用主体：国内法与国际法。\n6. 西方传统分类：大陆法系重公法（国家公益/管理关系）与私法（私人利益关系，古罗马乌尔比安首倡）划分，英美法系则重普通法（法官判例形成）与衡平法（大法官衡平救济）之分；现代公私法出现融合趋势（如经济法）。","【法的作用与局限性】\n1. 规范作用（对象为人的行为）：指引作用（对本人的行为，分确定指引与有选择指引）、评价作用（衡量他人行为合法与否）、教育作用（通过案例示范影响一般人）、预测作用（预先估计相互行为及后果）、强制作用（制裁违法犯罪行为）。\n2. 社会作用：维护阶级统治与执行社会公共事务。\n3. 局限性：法只是社会调整手段之一；法具有保守性与滞后性；抽象稳定性与具体个案之间存在张力；“徒法不足以自行”，受人力和物质条件制约。","【法的价值与价值冲突解决原则】法的核心价值包括秩序（基础性价值）、自由（最本质价值）、正义（存在根据与评价标准）、效率与安全。\n价值冲突解决三大原则：\n1. 价值位阶原则：不同位阶价值冲突时，高位阶价值优先（通常自由/生命健康权 > 财产权/秩序，但在紧急公共安全下整体秩序优先）。\n2. 个案平衡原则：同一位阶价值或具体权益冲突时，兼顾双方利益，寻求折中平衡。\n3. 比例原则（妥当性、必要性、均衡性）：为保护优越价值而损害另一法益时，损害不得超过必要限度，手段与目的须合比例。","【法律规则的逻辑结构与分类】\n1. 三要素：假定条件（适用条件）、行为模式（可为、应为、勿为）、法律后果（肯定性后果与否定性后果）。法律规则与法律条文是内容与形式的关系。\n2. 分类：按行为模式分授权性规则（可为）与义务性规则（应为、勿为）；按确定程度分确定性规则、委任性规则（授权特定机关另行规定）与准用性规则（援引其他条文或法规）；按强制程度分强行性规则与任意性规则；按功能分调整性规则与构成性规则（先有规则后有相应行为，如婚姻登记、选举程序）。","【法律原则与法律概念】法律原则是为法律规则提供基础或本源的综合性、稳定性原理与准则。与法律规则不同，法律原则不预先设定具体假定条件和确定后果，适用上具有弹性与“分量/权衡”维度（而非“全有或全无”），可用于弥补法律规则漏洞及指导自由裁量，但司法裁判应遵循“穷尽法律规则方得适用原则”之规则。\n按产生基础分公理性原则（如诚实信用、公序良俗）与政策性原则；按涵盖面分基本原则与具体原则。法律概念可分为主体、关系、客体、事实概念。","【法律体系与法律部门划分】法律体系是指一国全部现行法律规范按照一定标准和原则划分为不同法律部门而构成的有机整体（不包括国际法、已失效法及完整意义上的非规范性文件）。\n划分法律部门的主要标准是法律所调整的社会关系（调整对象），辅助标准是法律调整方法；并遵循客观与主观结合、合目的性、适当平衡、相对稳定及重点突出等原则。\n中国特色社会主义法律体系以宪法为核心，包含宪法及宪法相关法、民商法、行政法、经济法、社会法（如劳动法、社会保障法、残疾人保障法）、刑法、诉讼与非诉讼程序法七大部门。\n法律汇编不改变规范内容（非立法活动）；法典编纂属于国家立法活动。","【法律关系要素、分类与法律事实】\n1. 三要素：主体（自然人、法人、非法人组织、国家；须具备权利能力）、内容（权利与义务）、客体（物、行为、智力成果、人格利益/人身利益、数据信息；人体分离部分脱离身体后可视为物）。\n2. 分类：按合法性分调整性（合法行为产生）与保护性（违法/侵权产生）；按地位分平权型（民事）与隶属型（行政/管理）；按主体具体化程度分绝对（对世）与相对（特定人与特定人）。\n3. 法律事实（引起法律关系产生变更消灭）：依是否以人的意志为转移，分法律事件（地震、出生、死亡、战争等自然/社会事件）与法律行为（如婚姻登记、合同缔结、行政奖励）。","【法律责任、归责与免责】\n1. 法律责任源于违法行为、违约行为或法律特别规定（如无过错责任）。归责基本原则：责任法定、因果联系、责任与处罚相当、责任自负（反对株连）。\n2. 免责以法律责任的存在为前提（区别于“无责任/不负法律责任”，如未达刑事责任年龄、正当防卫、紧急避险）。法定免责方式：时效免责（注意2017年《民法总则》/《民法典》已将普通民事诉讼时效由2年改为3年）、不诉免责、自首立功免责、有效补救免责、自助免责、人道主义免责、协议免责等。\n3. 法律制裁分刑事制裁（含罚金）、行政制裁（行政处罚含罚款、行政处分/政务处分）、民事制裁（赔偿、赔礼道歉、恢复名誉等）、违宪制裁。","【我国立法体制、立法程序与《立法法》（2023修正）】\n1. 我国实行“一元、两级、多层次”立法体制。修改与废止法律亦属立法活动。立法程序（法律案）：提出→审议→表决→公布（全国人大及其常委会通过的法律由国家主席签署主席令公布）。草案表决通过后，在公布之前不产生法律效力。\n2. 设区的市人大及其常委会可就城乡建设与管理、生态文明建设、历史文化保护、基层治理四个方面事项制定地方性法规（报省/自治区人大常委会批准并由后者报全国人大常委会和国务院备案）。\n3. 授权立法（《立法法》第12-16条）：犯罪和刑罚、对公民政治权利的剥夺和限制人身自由的强制措施和处罚、司法制度等绝对保留事项不得授权；授权期限一般不超过5年，被授权机关不得转授。","【执法、司法、守法与法律监督】\n1. 执法（法的执行）：主体特定（行政机关及法定授权组织），具有主动性、单方意志性、效率性，须遵循合法性、合理性（含比例原则）、诚实守信与信赖利益保护、正当程序、权责统一原则。\n2. 司法（法的适用）：专属于法院和检察院，具有被动性、中立性、形式性、专属性与终极性（裁判最终效力，但不排斥合法行政终局裁决）。坚持以事实为根据、以法律为准绳、司法平等、依法独立行使职权（受党的领导、人大监督与上级司法监督，非不受任何监督）。\n3. 守法：包括积极守法（依法行使权利、履行义务）与消极守法（不违法）。\n4. 法律监督：国家监督（权力机关、行政含审计监督、监察监督、司法监督）与社会监督（政党、人民团体与社会组织、公民、舆论监督）。","【法律解释的分类、方法与我国解释体制】\n1. 按主体与效力分正式/有权解释（立法、司法、行政解释）与非正式/学理解释（学理解释无法律约束力）。依据2023年《立法法》第48-52条，全国人大常委会行使立法解释权（同法律具有同等效力）；“两高”对审判、检察工作中具体应用法律的解释发生原则性分歧时，报全国人大常委会解释或决定。\n2. 按尺度分字面、限制、扩充解释。\n3. 解释方法与位阶：文义解释（语义解释，居首且优先）→体系/系统解释（联系整部法典与相关规范）→立法者目的解释/历史解释→客观目的解释→合宪性解释。","【法律推理与法律论证】\n1. 形式推理：演绎推理（三段论：大前提为明确法律规则，小前提为案件事实，推出裁判结论）；归纳推理（从多个个别案例归纳出一般规则，常见于判例法系）；类比推理（最相似案件参照比较，常见于判例及我国民法类推适用）。\n2. 实质/辩证推理：在法律存在漏洞、规则冲突或疑难案件须作出价值判断与利益权衡时，对前提本身进行论证选择的推理。\n3. 法律论证正当性标准：内容融贯性、逻辑有效性、程序合理性、效果最优性。","【法系比较与法的继承、移植】\n1. 法系依历史传统与外在结构特征（非阶级本质或经济基础）划分。大陆法系（民法法系、罗马法系、法典法系）以罗马法为基础，重法典编纂、演绎思维、公私法划分、职权主义；英美法系（普通法系、判例法系）判例法与制定法均为正式法源，重归纳推理、程序优先、普通法与衡平法划分、对抗制（当事人主义）。中华法系以“礼法结合、诸法合体、民刑不分、以和为贵”为重要传统。\n2. 法律继承（不同历史类型法之间的延续继受，根源于社会生活历史延续性与法的相对独立性）与法律移植（同时代不同国家/国际法之间经鉴别整合吸收外国法，应尊重本国文化而非机械照搬）。","【习近平法治思想、法治思维与法律职业伦理】\n1. 全面依法治国重点任务与主体工程是建设法治政府；共同推进法治国家、法治政府、法治社会一体建设。法治（强调良法善治、法律至上、制约权力、保障人权，超越“法制”的工具层面）是治国理政基本方式。\n2. 法治思维以合法性判断为核心，是规则思维、平等思维、权力制约思维、程序思维、人权保障思维。\n3. 法律职业具有技能、伦理、准入（统一法律职业资格考试）、自治特征（源于独特知识传统，非不受监督）。法官、检察官不得兼任企业顾问或对未决案发表公开评论、接受当事人宴请；我国法官职业伦理核心为忠诚、为民、公正、廉洁。","【法与经济、政治、道德、科技及生态文明】\n1. 法与经济：生产方式/经济基础最终决定法的本质与变革，但法具有相对独立性与反作用（促进、保障、确认）。\n2. 法与政治/国家：国家与法相互依存；政治占主导，法服务并规范国家权力。\n3. 法与道德：法律是最低限度的道德，调整范围窄于道德，重外部行为与国家强制力。\n4. 法律意识（法律心理与法律思想体系）与法律文化（稳定积淀的精神制度成果，不含偶发事件）；法治社会建设注重发挥“法律明白人”作用。\n5. 法与科技（AI/大数据等扩展法律调整领域并更新传统概念，但生成式AI目前非独立法律主体）及法与生态文明（人与自然和谐共生）。","【宪法的特征与分类】\n1. 宪法作为国家根本法，表现在内容最根本、效力最高、制定修改程序更严格。\n2. 传统分类：（1）法典形式标准：成文宪法（世界绝大多数国家采用，含宪法修正案）与不成文宪法（英国等）；（2）修改机关与程序标准：刚性宪法与柔性宪法（并非所有成文宪法都必然刚性）；（3）制宪主体标准：钦定宪法（如清末《钦定宪法大纲》、1889《明治宪法》）、民定宪法、协定宪法。马克思主义宪法分类按历史类型分为资本主义宪法与社会主义宪法。","【宪法基本原则与外国宪法里程碑】宪法四大基本原则：人民主权原则（一切权力属于人民）、基本人权原则、权力制约/分权制衡原则（洛克提立法/行政/对外权分立，孟德斯鸠完善三权分立）、法治原则。\n重要文献：1689英国《权利法案》；1776美国《独立宣言》；1787美国《美利坚合众国宪法》（世界第一部成文宪法，1791前十条修正案称“权利法案”）；1789法国《人权宣言》（“凡权利无保障和分权未确立的社会，就没有宪法”）；1919德国《魏玛宪法》（首创社会文化权利专章并突破传统自由权）。","【新中国宪法发展与“八二宪法”五次修正案】\n1. 1949《中国人民政治协商会议共同纲领》由政协一届全体会议制定，起临时宪法作用；1954年第一部社会主义类型宪法首次确立人民代表大会制度并设公民基本权利章；现行1982年宪法（八二宪法）将“公民的基本权利和义务”置于“国家机构”之前，首次明确规定国务院总理负责制及宪法具有最高法律效力。\n2. “八二宪法”经历1988（私营经济、土地使用权可依法转让）、1993（社会主义市场经济、国营改国有、多党合作政协长期存在）、1999（依法治国、统分结合双层经营体制、非公经济重要组成部分）、2004（三个代表、国家尊重和保障人权、合法私有财产、紧急状态）、2018（习近平新时代中国特色社会主义思想、五位一体包括生态文明、宪法宣誓、国家监察委员会、取消国家主席/副主席两届任期限制、爱国统一战线新增“致力于中华民族伟大复兴的爱国者”）。","【《宪法》第64条（修宪程序）与宪法结构】宪法的修改，由全国人民代表大会常务委员会或者五分之一以上的全国人民代表大会代表提议，并由全国人民代表大会以全体代表的三分之二以上的多数通过。法律和其他议案由全国人民代表大会以全体代表的过半数通过。\n制宪权主体是人民，高于修宪权与立法权。现行《宪法》由序言、总纲、公民的基本权利和义务、国家机构、国旗国歌国徽首都组成；宪法序言具有最高法律效力，但非所有条款均直接规定具体规则。一些国家宪法明文限定特定内容（如国体、基本原则）不得修改。","【宪法效力、解释与合宪性审查】\n1. 我国《宪法》序言和第5条规定宪法具有最高法律效力，一切国家机关、武装力量、政党、社会团体与企事业组织都必须以宪法为根本活动准则；法院虽一般不直接援引宪法条文作裁判依据，但宪法对所有审判活动均具最高拘束力。\n2. 宪法解释体制分三类：立法机关解释制（我国由全国人大常委会解释宪法并监督宪法实施）、司法机关解释制（美国1803年马伯里诉麦迪逊案确立司法审查制，日本等效仿）、专门机关解释制（如德国宪法法院、法国宪法委员会）。\n3. 宪法宣誓制度（2018写入宪法第27条）：人大代表不宣誓，各级人大及其常委会选举或决定任命的国家工作人员宣誓，分单独宣誓与集体宣誓。合宪性审查对象包括法律、行政法规、司法解释、地方性法规、自治条例、单行条例等规范性文件（不含村规民约）。","【法规规章备案与规范性文件监督】\n1. 行政法规、地方性法规、自治条例和单行条例、规章应在公布后30日内报有关机关备案：\n• 行政法规报全国人大常委会备案；\n• 省、自治区、直辖市及设区的市地方性法规报全国人大常委会和国务院备案；\n• 自治州、自治县自治条例和单行条例报全国人大常委会和国务院备案（需经省人大常委会批准后报备）；\n• 部门规章与地方政府规章报国务院备案（地方政府规章同时报本级人大常委会备案）。\n2. 县级以上地方人大常委会有权撤销本级人民政府不适当的决定和命令（政府不得规定本级人大常委会、法院、检察院职责）。","【国体、政党制度与统一战线】\n1. 我国国体是工人阶级领导的、以工农联盟为基础的人民民主专政的社会主义国家（爱国统一战线是人民民主专政的巩固和发展，包括全体社会主义劳动者、社会主义事业的建设者、拥护社会主义的爱国者、拥护祖国统一和致力于中华民族伟大复兴的爱国者）。\n2. 中国共产党同各民主党派合作的基本方针是“长期共存、互相监督、肝胆相照、荣辱与共”；政治基础是坚持中国共产党的领导，中国共产党对民主党派的领导是政治领导；中国人民政治协商会议是爱国统一战线组织，并非国家机关。共青团、工会、妇联属于我国法定人民团体（学生会不属于）。","【《宪法》第6–10条：经济制度、自然资源与土地制度】\n1. 第6条：公有制为主体、多种所有制经济共同发展；按劳分配为主体、多种分配方式并存。\n2. 第7条：国有经济即全民所有制经济，是国民经济中的主导力量。\n3. 第9条：矿藏、水流、森林、山岭、草原、荒地、滩涂等自然资源属于国家所有（全民所有），由法律规定属于集体所有的森林和山岭、草原、荒地、滩涂除外（矿藏与水流专属于国家所有）。\n4. 第10条：城市的土地属于国家所有；农村和城市郊区的土地，除由法律规定属于国家所有的以外，属于集体所有；宅基地和自留地、自留山属于集体所有。土地所有权不得买卖或转让，使用权可依法转让；农村实行以家庭承包经营为基础、统分结合的双层经营体制（第8条）。","【《宪法》第111条：基层群众性自治组织（2018《村委会组织法》修订）】城市和农村按居民居住地区设立的居民委员会或者村民委员会是基层群众性自治组织（非基层政权机关，不受政府“领导”，而是受基层人民政府“指导、支持和帮助”），其主任、副主任和委员由居民或村民直接选举产生（居委会也可由全体有选举权居民或每户派代表选举）。\n注意法律修订：2018年12月修改的《村民委员会组织法》及2018年《城市居民委员会组织法》已将每届任期由3年改为5年，可连选连任。","【政权组织形式（人大制度）】我国政体是人民代表大会制度（根本政治制度），由国家性质决定。人民行使国家权力的机关是全国人民代表大会和地方各级人民代表大会（第2条）。国家机构实行民主集中制原则，行政、监察、审判、检察机关由人大产生，对它负责、受它监督（第3条）。上级人大与下级人大之间是监督与工作联系关系（非领导或从属关系）。","【《选举法》核心规则（2020修正）】\n1. 基本原则：普遍性（年满18周岁未被依法剥夺政治权利，停止行使选举权仅适用于因危害国家安全或其他严重刑事犯罪被羁押且经决定停止者；正在服刑未被剥夺政治权利者仍享有选举权）、平等性（城乡同比例）、直接选举与间接选举并用、差额选举、无记名投票（秘密写票）。\n2. 直选范围：不设区的市、市辖区、县、自治县、乡、民族乡、镇的人大代表由选民直接选举；选区按居住状况或生产单位、事业单位、工作单位划分。\n3. 程序：各政党、人民团体及选民/代表10人以上联名推荐候选人；直选正式候选人名单应在选举日7日以前公布；经选举委员会同意，外地务工选民可书面委托其他选民代为投票（每一选民接受委托不得超过3人）。县级以上人大代表罢免由原选举单位1/10以上代表联名（主席团亦可提出），县乡直接选举中，县级原选区50人以上、乡级30人以上选民联名提出罢免要求。","【国家结构形式、行政区划与民族区域自治】\n1. 我国采用单一制国家结构形式（纵向上中央与地方权力配置关系）。第30条行政区划：省、自治区、直辖市→自治州、县、自治县、市→乡、民族乡、镇。\n2. 审批权：全国人大批准省、自治区、直辖市的建置与特别行政区设立；国务院批准省、自治区、直辖市的区域划分以及自治州、县、自治县、市的建置和区域划分。\n3. 民族自治地方仅包括自治区、自治州、自治县三级（不含民族乡）；自治机关仅指自治地方的人民代表大会和人民政府（不含法院、检察院、监察委）；自治机关正职须由实行区域自治的民族的公民担任；自治条例和单行条例可依法作出变通规定（自治区人大报全国人大常委会批准；自治州/自治县报省人大常委会批准并报全国人大常委会和国务院备案）。","【特别行政区制度与国家标志】\n1. 香港、澳门特别行政区高度自治权源于全国人大授权（制定基本法），享有行政管理权、立法权（须报全国人大常委会备案）、独立司法权和终审权（特区法院法官中除终审法院首席法官、高等法院首席法官须为在外国无居留权的永久性居民中国公民外，可任用其他普通法地区法官；国家行为如国防外交无权管辖）。立法会议员与主要官员须宣誓拥护基本法、效忠特区（体现了“爱国者治港”原则；拒绝宣誓或被依法认定宣誓无效即丧失就任资格，不得重新安排宣誓）。\n2. 2020年《国旗法》《国徽法》修订：全日制学校（寒暑假和休息日除外）、出境入境的机场/港口/火车站/其他边境口岸、中央国家机关等应当每日升挂国旗；国徽图案不得用于商标、授予专利权的外观设计及广告，县级以上地方政府网站显著位置及国家法律法规正式版本封面应当使用国徽图案。","【公民权总论、国籍、平等权与政治/宗教自由】\n1. 第33条：凡具有中华人民共和国国籍的人都是中国公民（《国籍法》实行不承认双重国籍与血统主义为主结合出生地主义）；法律面前人人平等（反对不合理差别对待与显性/隐性歧视，允许基于实质平等的合理区别保护）；国家尊重和保障人权（2004写入）。国家保护华侨正当权利（外交交涉、国际法途径，注意第32条政治庇护仅给予“因为政治原因要求避难的外国人”）。\n2. 第35条政治自由：言论、出版、集会、结社、游行、示威自由（《集会游行示威法》采取许可制）。\n3. 第36条宗教信仰自由：国家保护正常宗教活动，宗教团体和宗教事务不受外国势力支配。","【《宪法》第37–40条：人身自由与人格尊严】\n1. 第37条人身自由：任何公民非经人民检察院批准或者决定或者人民法院决定，并由公安机关执行，不受逮捕；禁止非法拘禁和非法搜查公民身体。\n2. 第38条人格尊严：公民的人格尊严不受侵犯，禁止用任何方法对公民进行侮辱、诽谤和诬告陷害（含姓名权、肖像权、名誉权、荣誉权、隐私权）。\n3. 第39条住宅不受侵犯：禁止非法搜查或者非法侵入公民的住宅。\n4. 第40条通信自由和通信秘密：除因国家安全或者追查刑事犯罪的需要，由公安机关或者检察机关依照法律规定的程序对通信进行检查外，任何组织或个人（包括人民法院在民事审判中、学校及企业）不得以任何理由侵犯公民的通信自由和通信秘密。","【监督权、财产权、社会经济文化权利与基本义务】\n1. 第41条监督权：公民对任何国家机关和国家工作人员有提出批评和建议的权利；对违法失职行为有申诉、控告或检举的权利；因国家机关和国家工作人员侵犯公民权利受损失有依法取得赔偿的权利。\n2. 第13条私有财产权：公民的合法私有财产（含生活资料、合法生产资料与继承权）不受侵犯；为了公共利益的需要可以依法实行征收或者征用并给予补偿。\n3. 社会经济文化权利（积极权利，需国家积极作为提供物质条件保障）：劳动权和受教育权既是公民权利又是公民义务；休息权仅劳动者享有；年老、疾病或者丧失劳动能力时有从国家和社会获得物质帮助的权利（退休人员生活受国家和社会保障）；科研文艺创作自由。基本义务还包括维护国家统一民族团结、守法保密、依法纳税、服兵役、父母抚养教育未成年子女与成年子女赡养扶助父母（第49条）。\n4. 公民权利限制须受比例原则、明确性原则与法律保留原则约束（《立法法》第11条：犯罪和刑罚、剥夺政治权利和限制人身自由强制措施与处罚、司法制度、仲裁基本制度等只能制定法律）。","【《宪法》第57–78条：全国人大及其常委会职权与代表保障】\n1. 全国人大（任期5年）专有职权：修改宪法、监督宪法实施、制定和修改基本法律（刑法、民法、诉讼法、国家机构组织法、选举法等）；选举国家主席/副主席、中央军委主席、国家监察委主任、最高法院院长、最高检察院检察长，决定国务院总理人选；审查和批准国民经济和社会发展计划、国家预算；批准省、自治区、直辖市建置和决定特区设立；决定战争与和平。\n2. 全国人大常委会（不得担任行政、监察、审判、检察机关职务，委员长副委员长连任不超两届）专有职权：解释宪法、监督宪法实施、解释法律、制定和修改非基本法律（如《治安管理处罚法》《对外关系法》）、在全国人大闭会期间审查批准预算部分调整方案、决定特赦、批准同外国缔结条约和重要协定、决定全国或个别省份进入紧急状态、依法撤销同宪法法律相抵触的行政法规/地方性法规。\n3. 专门委员会（如宪法和法律委员会负责统一审议法律草案与立法后评估）是常设专门性工作机构，在全国人大及其常委会领导下工作；会议期间一个代表团或30名以上代表可联名提出质询案或议案，3个以上代表团或1/10以上代表可提罢免案；代表在全国人大各种会议上的发言和表决不受法律追究（非任何公开场合），无固定工资收入的代表执行职务由本级财政给予适当补贴，对代表采取限制人身自由措施须经同级人大主席团或常委会许可。","【国家主席、国务院与中央军事委员会】\n1. 国家主席（第79–84条）：年满45周岁有选举权和被选举权的中国公民；2018年修宪取消了连续任职不得超过两届限制；根据全国人大及其常委会的决定，公布法律、任免国务院组成人员（非自行决定）、发布特赦令、宣布进入紧急状态、宣布战争状态、发布动员令，并授予国家勋章和荣誉称号；代表国家进行国事活动。\n2. 国务院（第85–92条）：最高国家行政机关，实行总理负责制，由总理、副总理、国务委员、各部部长、各委员会主任、审计长、秘书长组成；有权制定行政法规（涉及国防建设的行政法规可由国务院总理和中央军委主席联合签署命令公布）；决定省、自治区、直辖市范围内部分地区进入紧急状态；改变或撤销不适当的部门规章和地方政府规章及地方行政机关决定命令。\n3. 审计机关：国务院及县级以上地方政府设审计机关，依照法律规定独立行使审计监督权，地方审计机关对本级人民政府和上一级审计机关负责。\n4. 中央军事委员会（第93–94条）：实行主席负责制，无任期限制，对全国人大和全国人大常委会负责（不向人大报告工作）。","【监察委员会、法检司法机关与地方国家机构】\n1. 监察委员会（第123–127条）：国家最高监察机关是国家监察委员会，由全国人大产生并对其及常委会负责，主任连任不得超过两届。上级监察委**领导**下级监察委的工作（并非仅“指导”），依法独立行使监察权，对公职人员涉嫌职务违法和职务犯罪进行调查和政务处分（批捕公诉仍由检察院负责）。\n2. 人民法院（第128–133条）：我国设最高人民法院、地方各级人民法院和军事法院等专门人民法院（海事法院、知识产权法院、金融法院由全国人大常委会决定设立）。最高人民法院审判员由全国人大常委会任免。上下级法院之间是审判监督关系。\n3. 人民检察院（第134–140条）：国家法律监督机关。上级检察院**领导**下级检察院的工作，认为下级检察院决定错误的，有权依法撤销或者变更；公、检、法三机关办理刑事案件应当分工负责、互相配合、互相制约（公安机关无权监督法院、检察院）。\n4. 地方人大常委会主任会议由主任、副主任、秘书长组成；县级以上人大代表受监督，可由原选举单位或选民依法罢免（被提罢免人有权在会议上提出申辩意见）。","【中国法律起源与夏商法制】\n中国法律起源由氏族习惯演化而来，具有礼刑合一、家国一体、以血缘宗族为纽带的特点。\n1. 夏朝刑罚总称“禹刑”，《甘誓》载“用命赏于祖，弗用命戮于社”（军法“奴戮”）。夏帝芬三十六年作“圜土”（最早监狱）。\n2. 商朝刑罚总称“汤刑”；官刑规定“三风十愆”（巫风、淫风、乱风十种恶劣风气，犯者墨刑）；《尚书·康诰》提出区分“眚”（过失）与“非眚”（故意/一贯犯罪），重罚故意、宽恕过失（偶犯）。奴隶制五刑：墨、劓、剕（刖）、宫、大辟。","【西周法律制度】\n1. 指导思想：“以德配天，明德慎罚”；礼刑关系：“出礼入刑”（礼有积极规范，刑为消极惩罚），“刑不上大夫”（仅限贵族特权，非绝对不刑）、“礼不下庶人”。《吕刑》确立“五刑之疑有赦”“刑罚世轻世重”。\n2. 司法与刑制：大司寇掌建邦之三典佐王刑邦国（小司寇以“五听”察狱：辞听、色听、气听、耳听、目听）。“五过之疵”（官吏司法渎职：惟官、惟反、惟内、惟货、惟来——请托徇私）。嘉石之制：对罪过未丽于法而害于州里者“桎梏而坐诸嘉石，役诸司空”（劳役刑）。诉讼分“狱”（刑事）与“讼”（民事），缴纳“束矢”“钧金”诉讼费；“读鞫”（宣读判决）与“乞鞫”（三个月内请求重审）。\n3. 民事婚姻继承：契约分买卖契约“质剂”（长券质、短券剂）与借贷契约“傅别”；婚姻严守“父母之命，媒妁之言”、同姓不婚，“六礼”（纳采问名纳吉纳征请期亲迎）成婚，“七出”（无子、淫佚、不事舅姑、口舌、盗窃、妒忌、恶疾）休妻，“三不去”（有所娶无所归、与更三年丧——为公婆守丧三年、前贫贱后富贵）限制休妻；宗法制核心为嫡长子继承制。","【春秋战国成文法运动与《法经》】\n1. 春秋公布成文法：公元前536年郑国子产“铸刑书”（中国历史上第一次公布成文法）；邓析私人撰写“竹刑”；晋国赵鞅铸刑鼎（孔子反对）。楚文王仿“有亡荒阅”作《仆区之法》惩治隐匿逃亡人。\n2. 战国《法经》（魏国李悝编制）：贯彻“王者之政，莫急于盗贼”思想，中国历史上第一部较系统的成文法典，共六篇：《盗法》《贼法》（置于篇首）、《囚法》《捕法》《杂法》（规定轻狡越城等“六禁”）、《具法》（总则，定罪量刑加减原则，居篇末）。\n3. 商鞅变法：在秦“改法为律”，强调法律的普遍性与统一性；颁布《分户令》鼓励小家庭；推行什伍连坐法与军功授爵，明法重刑、严惩私斗。","【秦朝法律制度】\n1. 指导思想与法律形式：法家“以法为教、以吏为师”、事皆决于法。1975年出土湖北云梦睡虎地秦简保存了大量秦律内容，主要法律形式：律（主体，如金布律、关市律、均工律）、令（诏令，最具最高权威）、法律答问（官方统一法律解释）、封诊式（司法审讯勘验案例与程式）、廷行事（司法成例）。\n2. 刑罚体系：死刑（戮、弃市、磔等）、肉刑（黥、劓、斩左趾、宫、笞）、作刑/徒刑（城旦舂——男筑城女舂米；鬼薪白粲——男伐薪女择米；隶臣妾；司寇、候——均为官府劳役）、赀刑（罚金、罚甲盾等财产刑）、耻辱刑（髡、耐、完，均剃去或保留部分须发）。\n3. 刑法原则与诉讼：以身高（男子六尺五寸、女子六尺二寸）而非年龄确定刑事责任；区分故意（端）与过失（不端）；共犯加重、诬告反坐（“以所辟罪罪之”）；“公室告”（杀伤人、盗等贼盗案，官府必理）与“非公室告”（子盗父母、父母擅杀刑髡子及奴妾，官府不受理）。《封诊式》主张“治狱，能以书从迹其言，毋笞掠而得人情为上，笞掠为下”，即不提倡刑讯。","【汉朝法律制度】\n1. 立法成就：刘邦《约法三章》；萧何在秦律六篇基础上增《户律》《兴律》《厩律》成《九章律》；叔孙通《傍章律》十八篇（礼仪制度）；张汤《越宫律》、赵禹《朝律》（合计“汉律六十篇”）；专门考课法规《上计律》。法律形式：律、令、科、比（决事比，比附判例）。\n2. 刑制改革：汉文帝受缇萦上书感召废肉刑，改黥为髨钳城旦舂，改劓为笞三百，改斩左趾为笞五百（斩右趾仍为弃市）；汉景帝两次减笞数并颁《箠令》规范刑具。\n3. 儒家化刑法原则与特有罪名：董仲舒开创“春秋决狱”（原心定罪，论心定罪）；“秋冬行刑”（立春后至秋分前不决死刑）；汉宣帝确立“亲亲得相首匿”（卑幼首匿尊长不负刑事责任，谋反大逆除外）；“上请”（先请）制度；罪名包括“阿党附益”“左官”“出界”“酎金”（打击诸侯王）、“见知故纵”“沈命法”（督责吏治）、三人无故群饮罚金四两。\n4. 行政与司法监察：任官回避“三互法”；中央司法官为廷尉；监察机关除御史中丞、刺史（六条问事督察地方）外，汉武帝特设司隶校尉“掌察举百官以下及京师近郡犯法者”。","【三国两晋南北朝法典儒家化演变】\n1. 曹魏《魏律》（18篇）：改《具律》为《刑名》置于律首，突出总则地位；正式将《周礼》“八议”（议亲、故、贤、能、功、贵、勤、宾）入律。\n2. 西晋《泰始律》（20篇，张斐、杜预作注称《张杜律》）：分总则篇为《刑名》《法例》；张斐精确解释“戏”（两和相害）等二十个概念；首创“准五服以制罪”（亲等服制决定量刑：尊犯卑轻，卑犯尊加等重处；但盗窃亲属财物尊卑均依亲疏减免）；设“登闻鼓”直诉。\n3. 南北朝立法：东魏《麟趾格》（首创“格”）；西魏《大统式》（首创“式”）；南陈在《陈律》中正式确立官当制度（注：部分教材称北魏/南陈，“正式/系统”均见于《陈律》或《北魏律》）；南梁设刑讯“测罚”（测立与饥饿，不加鞭笞）。\n4. 《北齐律》（12篇，北朝立法最高成就）：将《刑名》《法例》合为《名例律》置于篇首，最终定型十二篇结构；首立“重罪十条”（十恶前身）；创立大理寺并完善死刑复奏。","【隋唐法典体系与《唐律疏议》核心原则】\n1. 《开皇律》（隋文帝）：定型笞、杖、徒、流、死封建制五刑，正式确立“十恶”重罪并完善官当制度，12篇500条影响深远；隋炀帝《大业律》。\n2. 《唐律疏议》（唐高宗永徽年间长孙无忌等撰，原名《永徽律疏》）是中国传统法典楷模，后世赞为“一准乎礼，以为出入，得古今之平”。共十二篇502条：名例、卫禁、职制、户婚、厩库、擅兴、贼盗、斗讼、诈伪、杂律、捕亡、断狱；法律形式为律、令、格、式（律以正刑定罪，令以设范立制，格以禁违止邪，式以轨物程事）。\n3. 核心原则：“十恶”（谋反、谋大逆、谋叛、恶逆、不道、大不敬、不孝、不睦、不义、内乱，其中隐匿父母丧情不报属不孝，杀一家非死罪三人及支解人属不道）；“六赃”（受财枉法、受财不枉法、受所监临、强盗、窃盗、坐赃）；“六杀”（谋杀、故杀、斗杀、误杀、过失杀——耳目所不及思虑所不至、戏杀）；“保辜”制度；二罪以上俱发“以重者论”（重罪吸收轻罪，但已决再犯盗贼则累加加重）；区分公罪（从轻）与私罪（从重）；同居相隐；“化外人”相犯原则（同类自相犯依本俗法，异类相犯依唐律）；类推（“举重以明轻，举轻以明重”）；自首免罪但事发后再自首只减/免未发之重罪（按所发之重罪或仍定原发罪，严禁于事发后自首隐匿免全部罪责）。","【唐朝司法制度与民事婚姻契约】\n1. 中央“三法司”：大理寺（中央最高审判机关）、刑部（中央司法行政与复核机关）、御史台（中央最高监察机关，弹劾与监督）；重大疑难案件三机关联合审理称“三司推事”。死刑核准实行“三复奏”与“五覆奏”（唐太宗因错杀张蕴古而设立京城死刑五覆奏）。司法官责任制度“官司出入人罪”严格区分故意（反坐/全罪）与过失（减等）。\n2. 民事与婚姻：《杂律》规定“负债违契不偿”依法科刑赔备，公私以财物出举（借贷）“任依私契，官不为理”。婚姻制度除“七出”“三不去”“义绝”（强制离婚）外，承认夫妻感情破裂协议离婚的“和离”（敦煌《放妻书》“一别两宽，各生欢喜”）。唐初创立市舶制度征收1/10实物外贸税。","【宋元法律制度】\n1. 宋朝立法：公元963年窦仪编纂《宋刑统》（中国历史上第一部刊版印行的封建法典，篇目与《唐律疏议》同，增加“门”并附刑律统类及敕令格起请）；“以敕代律”频繁“编敕”；南宋孝宗始以《淳熙条法事类》分门编纂律令格式，代表作《庆元条法事类》；判例与成例称“断例”“指挥”；专治贼盗的特别法《重法地法》（盗贼重法）。司法名著《名公书判清明集》《洗冤集录》《折狱龟鉴》。\n2. 宋朝刑罚与司法：太祖建隆年间创立“折杖法”（死刑及重反逆不适用，流、徒、杖、笞依次折为脊杖、臀杖免配役或减等）；“刺配”（杖刑、刺面、配役三刑并施，形成“贼配军”）；凌迟定为法定死刑。司法推行审刑院、鞫谳分司制（审讯事实与检法拟判分离）、翻异别勘（犯人推翻口供重审）、务限法（农忙停讼）；民事严禁“一物两典”（重复典卖“准盗论”），典卖实行“先问亲邻”，户绝财产继承分“立继”（夫亡妻在立嗣）与“命继”（夫妻俱亡由宗族或官府指定）。\n3. 元朝法制：成吉思汗习惯法汇编《大札撒》；《至元新格》《风宪宏纲》（监察法规，仁宗）《大元通制》《至正条格》及地方类书《元典章》；确立四等人不平等法律地位；赔偿死者家属埋葬费“烧埋银”；专门审理蒙古贵族案件机构“大宗正府”，掌管全国佛教及吐蕃政教事务“宣政院”；首创强奸幼女罪。","【明清法律制度】\n1. 明朝：朱元璋废丞相，设六部直接向皇帝负责；《大明律》改传统十二篇为“名例、吏、户、礼、兵、刑、工”七篇（清沿之）；明太祖编撰《大诰》（“重典治世”特法）；弘治、万历年《问刑条例》开律例合编先例。《大明律》首创“奸党”罪，遵循“重其所重（贼盗、官吏受赃贪墨、侵害皇帝与国政），轻其所轻（典礼民俗与子孙违犯教令等）”原则；增设充军、廷杖；明中叶赋役改革“一条鞭法”折算征收银两；特务机关厂卫（锦衣卫、东厂、西厂）法外干预司法，重大疑案实行“九卿会审”（九卿圆审）及朝审、热审；推行里甲老人调处息讼。\n2. 清朝：《大清律例》（1740乾隆颁行）为中国封建社会最后一部完备法典；康熙起编制五朝《大清会典》（清入关后第一部为《康熙会典》）；特有刑罚“发遣”（发往边疆为奴或当差）与“枷号”。司法上州县为死刑初审，死刑监候经省复核后报中央“秋审”（情实、缓决、可矜、留养承祀），朝审；宗人府管宗室，理藩院管蒙回藏等少数民族事务（《蒙古律例》《回疆则例》），涉外化外人案件确立完全属地主义原则。民事上禁止乞养异姓义子，改善雇工人地位，户律规定“独子兼祧”（须两房为同父兄弟、两厢情愿、取具阖族甘结、可继之人系独子）。","【清末变法修律与司法改革】\n1. 预备立宪：1908《钦定宪法大纲》（中国第一部宪法性文件，“君上大权”14条）；1911《宪法重大信条十九条》（限制皇权，采取责任内阁制雏形）；地方设立民意咨询机关谘议局（选举资政院议员、议决本省兴革与预算决算，无推举督抚权）。\n2. 法典修订（设立修订法律馆主持）：《大清现行刑律》（过渡性，取消凌迟等酷刑，分出民事条款但仍非独立民/刑法典）；《大清新刑律》（中国历史上第一部近代意义专门刑法典，沈家本主持，引进罪刑法定、保安思想等近代原则，总则分则两编，新刑名废除传统五刑改用主刑从刑；附《暂行章程》维护礼教引起“礼法之争”，以沈家本/伍廷芳为首法理派与张之洞/劳乃宣为首礼教派激辩）；《大清民律草案》（总则、债、物权由日本松冈义正起草，亲属、继承两编由修订法律馆会同礼学馆起草）；并颁行《钦定大清商律》等商事单行法。\n3. 司法半殖民地化与近代化：1843《中英五口通商章程及税则》与《虎门条约》确立领事裁判权（会审公廨为租界混合司法组织，如1903苏报案）；1906设法部（司法行政）与大理院（最高审判），1910颁《法院编制法》正式确立审判独立、四级三审、民刑分理与审检分立。","【民国时期宪法、民刑法与司法制度】\n1. 南京临时政府：《中华民国临时政府组织大纲》（1911，仿美国实行总统制与三权分立，临时中央审判所）；1912《中华民国临时约法》（资产阶级共和国性质宪法性文件，确立主权在民、平等自由与责任内阁制，防袁专权，特设“法院”行使最高审判与行政诉讼）；颁《大总统令内务部禁止买卖人口文》《保护人民财产令》《剪辫令》《禁烟令》《劝禁缠足令》等革命法令。\n2. 北洋政府：1913《中华民国宪法草案》（天坛宪草，秉承《临时约法》责任内阁精神，总统任期5年）；1914《中华民国约法》（袁记约法，总统独裁）；1923《中华民国宪法》（“贿选宪法”，专章规定“国权”与“地方制度”）；设《暂行新刑律》与司法“易笞条例”“徒刑改遣条例”；二元司法体制（普通法院四级三审制，最高审判机关为大理院并广泛应用大理院判例与解释例；平政院专门审理行政诉讼）。民事渊源依制定法、民事习惯（不背公序良俗）、条理。\n3. 南京国民政府（《训政时期约法》确立国民党一党专政、行政权五院制；孙中山“权能分治”治权五权含行政立法司法考试监察）：编纂“六法全书”（宪法、民法、刑法、民事诉讼法、刑事诉讼法、行政法，采取民商合一民法典与1935年《中华民国刑法》——兼采罪刑法定与保安处分、侵犯直系尊亲属加重）；普通法院实行三级三审制，行政法院审理行政诉讼；1947《中华民国宪法》由司法院大法官会议负责解释宪法及统一解释法令。","【革命根据地与新民主主义法制】\n1. 工农民主政权（土地革命）：1928《井冈山土地法》（第一部土地法，“没收一切土地”）；1929《兴国土地法》（改为“没收一切公共土地及地主阶级土地”）；1931《中华苏维埃共和国宪法大纲》与《中华苏维埃共和国土地法》（贯彻“地主不分田，富农分坏田”政策）；设立工农兵苏维埃代表大会制。\n2. 抗日民主政权（抗战）：1941《陕甘宁边区施政纲领》确立“三三制”民主政权原则（共产党员、非党左派进步分子、不左不右中间派各占1/3）；刑法原则采取镇压与宽大相结合、平等保障人权、实行感化教育、反对按阶级成分定罪量刑；推行人民调解制度（自愿、合法照顾善良风俗，非诉讼必经程序、一般民事与轻微刑事可调解）；《陕甘宁边区宪法原则》确立人民代表会议制；抗战初期根据地实行三审制（县、高等法院、边区政府或参议会/边区高等法院等）后改为两审终审，“马锡五审判方式”（源于封芝琴即“刘巧儿”婚姻案，深入调查、联系群众、调解与审判结合）。\n3. 解放区人民民主政权（解放战争）：1947《中国土地法大纲》（废除封建性及半封建性剥削土地制度，实行“耕者有其田”）；刑事政策贯彻《中国人民解放军宣言》“首恶必办，胁从不问，立功受奖”，并创设“管训”（管制）和“劳动感化”等新刑种。","【中国法制史宏观专题与中华传统法律文化】\n1. 古代法典编纂长期保持“诸法合体、民刑不分”体例与“统系相承”（从《法经》→《九章律》→《曹魏律》→《泰始律》→《北齐律》→《开皇律》→《唐律疏议》→《宋刑统》至《大明律》《大清律例》）的特点。\n2. 法律儒家化主线（始于汉代春秋决狱，经魏晋“准五服以制罪”与“八议”入律，于《唐律疏议》“一准乎礼”完成）：礼法结合、以礼入法、家族本位、重刑轻民、无讼是求。\n3. 中华优秀传统法律文化精华（民惟邦本、礼法合治、明德慎罚、法不阿贵、绳不挠曲、援法断罪、以法治官）应进行创造性转化与创新性发展。"]
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const KB=JSON.parse(document.getElementById('kb').textContent);
function fmtBook(q){if(q.kb==null)return esc(q.k||'');const t=KB[q.kb];let o='',p=0;(q.kh||[]).forEach(([a,b])=>{if(a<p)return;o+=esc(t.slice(p,a))+'<b>'+esc(t.slice(a,b))+'</b>';p=b;});return o+esc(t.slice(p));}
const SUBS=['全部','法理学','中国宪法学','中国法制史'];
const SUBNAME={'全部':'全部','法理学':'法理学','中国宪法学':'宪法学','中国法制史':'法制史'};
const TN={'判':'判断','单':'单选','多':'多选'};
// index
const Q={};D.forEach((u,ui)=>{u.ui=ui;u.qs.forEach((q,qi)=>{q.u=ui;q.qi=qi;Q[q.id]=q;})});
// storage
const KEY='fszh_v1';const SYNC_KEY='fszh_sync_v1';const GIST_FILE='fszh_progress_v1.json';
let canSave=true;let S;
try{S=JSON.parse(localStorage.getItem(KEY)||'null');localStorage.setItem(KEY+'_t','1');}catch(e){canSave=false;}
if(!S||!S.q)S={q:{},sub:'全部',sort:'pred',drop:false,clearedAt:0};
if(!S.sub||!SUBNAME[S.sub])S.sub='全部';
if(!S.sort)S.sort='pred';
if(!S.clearedAt)S.clearedAt=0;
if(!S.v2){const now=Date.now();for(const id in S.q){if(S.q[id].length<5)S.q[id][4]=now;}S.v2=1;}
let SYNC={token:'',gistId:'',lastSync:0,auto:true};
if(canSave){try{const sc=JSON.parse(localStorage.getItem(SYNC_KEY)||'null');if(sc&&typeof sc==='object')SYNC=Object.assign(SYNC,sc);}catch(e){}}
function saveSyncCfg(){if(!canSave)return;try{localStorage.setItem(SYNC_KEY,JSON.stringify(SYNC));}catch(e){}}
let syncOpen=false,syncBusy=false,syncTimer=null,lastAutoTry=0,syncMsg={cls:'',text:''};
function save(pushCloud){
  if(!canSave)return;
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  if(pushCloud&&SYNC.token&&SYNC.gistId&&SYNC.auto!==false){
    clearTimeout(syncTimer);
    syncTimer=setTimeout(()=>syncNow(true),1500);
  }
}
function b64e(str){const bytes=new TextEncoder().encode(str);let bin='';for(let i=0;i<bytes.length;i++)bin+=String.fromCharCode(bytes[i]);return btoa(bin);}
function b64d(b64){const bin=atob(b64.trim());const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return new TextDecoder().decode(bytes);}
function normRec(r){if(!Array.isArray(r)||r.length<4)return null;return [+r[0]||0,+r[1]||0,+r[2]||0,+r[3]||0,+r[4]||0];}
function mergeProgress(localState,rawRemote){
  if(!rawRemote||typeof rawRemote!=='object')throw new Error('数据格式无效');
  const rq=(rawRemote.q&&typeof rawRemote.q==='object')?rawRemote.q:(Object.keys(rawRemote).some(k=>Q[k])?rawRemote:null);
  if(!rq)throw new Error('未找到题目进度字段');
  const lCleared=+localState.clearedAt||0;
  const rCleared=+(rawRemote.clearedAt||rawRemote.c)||0;
  const clearedAt=Math.max(lCleared,rCleared);
  const lq=localState.q||{};
  const nq={};
  const ids=new Set([...Object.keys(lq),...Object.keys(rq)]);
  let fromRemote=0,keptLocal=0,needPush=clearedAt>rCleared;
  for(const id of ids){
    if(!Q[id])continue;
    const l=normRec(lq[id]),r=normRec(rq[id]);
    let pick=null,pickedRemote=false,localNewer=false;
    if(l&&r){
      if(r[4]>l[4]||(r[4]===l[4]&&(r[0]!==l[0]||r[1]!==l[1]||r[2]!==l[2]||r[3]!==l[3])&&(r[0]>l[0]||r[3]>l[3]))){pick=r;pickedRemote=true;}
      else{pick=l;if(l[4]>r[4])localNewer=true;}
    }else if(r){pick=r;pickedRemote=true;}
    else{pick=l;localNewer=true;}
    if(!pick||(clearedAt>0&&pick[4]<=clearedAt))continue;
    nq[id]=pick;
    if(pickedRemote)fromRemote++;else{keptLocal++;if(localNewer)needPush=true;}
  }
  return {state:{q:nq,sub:localState.sub||'全部',sort:localState.sort||'pred',drop:!!localState.drop,v2:1,clearedAt},fromRemote,keptLocal,totalAfter:Object.keys(nq).length,needPush,remoteCleared:rCleared};
}
function fmtTime(ms){if(!ms)return '';const d=new Date(ms);return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;}
function setSyncMsg(cls,text){syncMsg={cls,text};const el=document.getElementById('syncmsg');if(el){el.className='syncmsg'+(cls?' '+cls:'');el.textContent=text;el.style.display=text?'block':'none';}}
function exportProgressObj(){return {v:2,c:S.clearedAt||0,updatedAt:Date.now(),q:S.q};}
function exportProgressCode(){return 'FSZH1:'+b64e(JSON.stringify(exportProgressObj()));}
function parseImportPayload(raw){
  const t=(raw||'').trim();if(!t)throw new Error('请先粘贴进度码或选择文件');
  if(t.startsWith('FSZH1:'))return JSON.parse(b64d(t.slice(6)));
  return JSON.parse(t);
}
function applyImportText(raw){
  const obj=parseImportPayload(raw);
  const res=mergeProgress(S,obj);
  S=res.state;save(true);
  setSyncMsg('ok',`合并完成：吸收对方较新 ${res.fromRemote} 题，保留本地 ${res.keptLocal} 题，当前共 ${res.totalAfter} 条记录。`);
  home(true);
}
async function syncNow(silent){
  if(!canSave||syncBusy)return;
  if(!SYNC.token){if(!silent)setSyncMsg('bad','请先填写 GitHub Token');return;}
  if(typeof fetch!=='function'){if(!silent)setSyncMsg('bad','当前环境不支持联网请求');return;}
  syncBusy=true;lastAutoTry=Date.now();
  if(!silent)setSyncMsg('','正在同步云端进度…');
  const hdr={'Authorization':'Bearer '+SYNC.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
  try{
